      - matched_blocks deals whole studies into cells balanced per frame byte-length and truncates to the shared count, so every cell reads an identical frame count and byte total from disjoint studies. The 2026-09-18 Kaggle run measured 2.40x at 16 threads.
      - Covers the threaded frame payload reads shipped 2026-09-18; descriptors are read before timing, matching production order where indexing precedes decoding.
      - Only files that qualify for the native descriptor path are timed; pydicom fallbacks are excluded rather than counted as reads.
      - Threaded reads fetch payloads in the pool and decode serially, keeping failure handling per path.
