  - id: relabel-kaggle-submission-datasets
    path: scripts/adhoc/relabel_kaggle_submissions.py
    summary: Number every Kaggle submission, retitle its notebook and rewrite its private bundle dataset title, subtitle and description into the unified submission format.
    tags: [kaggle, submission, dataset, notebook, kernel, metadata, title, description, rename, ledger, relabel, naming, sequence]
    commands:
      - rtk proxy uv run --locked python -m scripts.adhoc.relabel_kaggle_submissions
      - rtk proxy uv run --locked python -m scripts.adhoc.relabel_kaggle_submissions --apply
    inputs: [Kaggle credentials and competition access, outputs/submission/records/*.json, Bundle manifests and config under outputs/submission/exports, Curated label table inside the script]
    outputs: [outputs/submission/kaggle-ledger.json with one entry per submission, Updated private dataset metadata on Kaggle, Renamed notebooks with one extra unexecuted version each]
    notes:
      - Without --apply it only writes the ledger and prints the planned dataset and notebook titles.
      - Kaggle submission descriptions cannot be edited after submission, so past submission rows keep their original description text; the notebook title beside each row is what the rename changes.
      - Renaming pulls the current notebook source and metadata and saves it back with KernelExecutionType.QUICK_SAVE, which creates a version without executing it, so no GPU quota is spent and the submitted versions are untouched.
      - Numbering comes from the live submission list sorted by date, so S numbers are stable while submissions only append.
      - Refuses to touch a dataset that is not private, keeps the private bundle manifest line so the submit workflow can still detect an unchanged bundle, and skips datasets and notebooks that already match.
      - Skips a notebook whose latest run has not finished, so it never disturbs an active submission.
      - Retries HTTP 429 with exponential backoff and pauses between updates; a full pass without throttling is rate limited.
      - Historical bundles predate recorded runtime fields, and the three ranked-filtered bundles carry the attention temperature folded into the scorer weights, so those temperatures come from the table in the script.
    docs: [docs/inference/submissions/ledger.md#naming]

