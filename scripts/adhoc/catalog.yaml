  - id: probe-kaggle-loading
    path: scripts/adhoc/probe_kaggle_loading.py
    summary: Launch one self-contained Kaggle CPU script kernel per proposed loading speedup and collect its throughput and equality audit.
    tags: [probe, loading, kaggle, script, kernel, cpu, dicom, header, parser, threads, nfs, throughput, dataloader, speedup]
    commands:
      - rtk proxy uv run --locked python -m scripts.adhoc.probe_kaggle_loading launch --output-dir outputs/profiling/kaggle-loading-probes-20260917
      - rtk proxy uv run --locked python -m scripts.adhoc.probe_kaggle_loading launch --output-dir outputs/profiling/kaggle-loading-probes-new --probes '["header","frames"]'
      - rtk proxy uv run --locked python -m scripts.adhoc.probe_kaggle_loading collect --output-dir outputs/profiling/kaggle-loading-probes-20260917
    inputs: [Probe sources in scripts/adhoc/kaggle_loading_probes/, Competition DICOMs attached on Kaggle, Kaggle credentials]
    outputs: [Private Kaggle script kernels, status.json with push and run states, Per-probe result JSON and kernel logs, summary.json]
    notes:
      - Each probe isolates one candidate from the loading speedup plan; it reproduces only the operation under test, not the dataloading pipeline, and needs no exported bundle.
      - A probe is pushed as one file built by concatenating kaggle_loading_probes/common.py with the probe body, so the kernel has no repository dependency.
      - Probes carry a copy of the production function as their baseline; the copy can drift from src/ and is not verified against it automatically.
      - Every probe audits its candidate against that baseline and reports timings alongside the audit, so a candidate that changes outputs is visible.
      - Kaggle allows five concurrent batch CPU sessions; concurrency is capped at five and a rejected push is recorded rather than queued.
      - Cells use disjoint study blocks so each block is read cold once per session; a second session on a fresh machine reads them cold again.
      - Pure-CPU probes (resample, quantiles) do not depend on NFS and can be answered locally; set KNEE_PROBE_DATA, KNEE_PROBE_OUT and KNEE_PROBE_AUDIT_ONLY to run a probe against local data.
      - The quantiles probe measures real resampled pixels by default; its synthetic generator gave the opposite verdict and is kept only behind REAL_PIXELS.
    docs: [docs/backlog/loading-speedup/measuring.md, docs/inference/2026-09-15-kaggle-inference-profiling.md]

  - id: kaggle-loading-probe-common
    path: scripts/adhoc/kaggle_loading_probes/common.py
    summary: Shared prelude prepended to every Kaggle loading probe, providing the data root, seeded cold study blocks, the timer and the result writer.
    tags: [probe, loading, kaggle, prelude, shared, blocks, timer, cold]
    commands:
      - cat scripts/adhoc/kaggle_loading_probes/common.py scripts/adhoc/kaggle_loading_probes/header.py > /tmp/probe.py
    inputs: [Competition DICOM root]
    outputs: [None; imported names only]
    notes:
      - Not runnable alone; probe-kaggle-loading concatenates it ahead of a probe body to build the single file a Kaggle script kernel runs.
      - KNEE_PROBE_DATA, KNEE_PROBE_OUT and KNEE_PROBE_AUDIT_ONLY redirect a probe to local data and skip timing, so correctness can be checked off Kaggle.
      - Study order is a fixed seeded shuffle, so every probe and every session draw the same blocks in the same order.
    docs: [docs/backlog/loading-speedup/measuring.md]

  - id: compare-header-implementations
    path: scripts/adhoc/compare_header_implementations.py
    summary: Compare the production header parser, its threaded variant and the retained pydicom reader end to end through the local training dataloader, and audit that all three produce identical prepared batches.
    tags: [compare, dicom, header, parser, pydicom, threads, dataloader, throughput, studies-per-second, local, indexing, epoch-zero, audit]
    commands:
      - rtk proxy uv run --locked python -m scripts.adhoc.compare_header_implementations configs/training.yaml --mode audit --samples 8 --prewarm false --output-dir outputs/profiling/header-audit-new
      - rtk proxy env OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 uv run --locked python -m scripts.adhoc.compare_header_implementations configs/training.yaml --mode loader --implementation pydicom --samples 256 --workers 16 --passes 2 --prewarm false --output-dir outputs/profiling/header-cold-pydicom-new
      - rtk proxy env OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 uv run --locked python -m scripts.adhoc.compare_header_implementations configs/training.yaml --mode loader --samples 256 --workers 16 --passes 2 --output-dir outputs/profiling/header-loader-new
    inputs: [Experiment config, Training DICOMs, Frozen fold and label sources]
    outputs: [Per-arm per-pass studies/s and per-batch timings, first-pass speedup, pydicom fallback and prefix-extension counts, prepared-batch audit hashes]
    notes:
      - Local only and CPU only; no CUDA, no pinning and no model. The Kaggle NFS question is separate and belongs to probe-kaggle-loading.
      - Since the parser landed in production on 2026-09-18 the arms are production itself. parser is header_threads=1, threaded is header_threads=--threads, and the pydicom arm subclasses the dataset to swap series.parse_prefix for the retained pydicom_read_header inside _indexed, so the patch applies in each worker under both fork and spawn.
      - Use it as the regression check that the parser and its threaded path still prepare batches identical to pydicom.
      - For any question about where the bottleneck is, run one arm per invocation with --implementation and --prewarm false, dropping the page cache between them (sync; echo 3 > /proc/sys/vm/drop_caches, which needs root); the manifest records Cached from /proc/meminfo so a warm run is recognisable afterwards.
      - Prewarm removes the disk term so the arms differ only in parsing, which flatters the parser, since the same 256 studies gave 1.57x pre-warmed and 1.22x cold. Use it only to isolate parser cost, never to size the gain.
      - Prewarm reads every selected file once; studies average about 121 MB, so keep samples within free memory or the later arm reads a colder cache than the earlier one.
      - Audit mode checks all three arms against the pydicom reference and raises when any prepared field differs.
      - Only pass 0 parses headers. _slice_index caches per worker and persistent_workers keeps them alive, so later passes measure the cached steady state and show no parser effect by design.
      - Use more batches than workers or the measurement reports startup rather than throughput.
      - Audit mode collates one study at a time and raises when any prepared field differs.
    docs: [docs/backlog/loading-speedup/attribution.md#only-inference-benefits]

  - id: kaggle-loading-probe-header
    path: scripts/adhoc/kaggle_loading_probes/header.py
    summary: Compare a minimal explicit-VR DICOM header parser with the production pydicom reader across thread counts on cold files.
    tags: [probe, dicom, header, parser, pydicom, explicit-vr, threads, gil, nfs, throughput, tags]
    commands:
      - cat scripts/adhoc/kaggle_loading_probes/common.py scripts/adhoc/kaggle_loading_probes/header.py > /tmp/header_probe.py && KNEE_PROBE_DATA=data/raw KNEE_PROBE_AUDIT_ONLY=1 rtk proxy uv run --locked python /tmp/header_probe.py
    inputs: [Competition DICOMs]
    outputs: [header.json with per-cell throughput, field-level audit, fallback and extension counts]
    notes:
      - Covers the raw header parser and the threaded prefix reads, both shipped 2026-09-18; the parser reproduces every DicomHeader field including the twelve series tags and the native pixel descriptor gate.
      - Reads a fixed prefix and extends it up to three times before falling back to pydicom, so a long header costs an extra read rather than a reparse.
      - Audited exactly against the production copy on 20,000 local files with no mismatches, no fallbacks and no extensions at the default prefix.
      - Cells split read from parse only in the split variants; the others time the whole reader per file.
    docs: [docs/backlog/loading-speedup/attribution.md]

  - id: kaggle-loading-probe-frames
    path: scripts/adhoc/kaggle_loading_probes/frames.py
    summary: Measure threaded against serial DICOM pixel-payload reads on byte-matched cells using the production native descriptor fast path.
    tags: [probe, dicom, frames, pixels, payload, threads, nfs, latency, decode, throughput]
    commands:
      - cat scripts/adhoc/kaggle_loading_probes/common.py scripts/adhoc/kaggle_loading_probes/frames.py > /tmp/frames_probe.py && KNEE_PROBE_DATA=data/raw KNEE_PROBE_AUDIT_ONLY=1 rtk proxy uv run --locked python /tmp/frames_probe.py
    inputs: [Competition DICOMs]
    outputs: [frames.json with per-thread frame and megabyte rates and a serial-versus-threaded pixel audit]
    notes:
      - matched_blocks deals whole studies into cells balanced per frame byte-length and truncates to the shared count, so every cell reads an identical frame count and byte total from disjoint studies. The 2026-09-18 Kaggle run measured 2.40x at 16 threads.
      - Covers the threaded frame payload reads shipped 2026-09-18; descriptors are read before timing, matching production order where indexing precedes decoding.
      - Only files that qualify for the native descriptor path are timed; pydicom fallbacks are excluded rather than counted as reads.
      - Threaded reads fetch payloads in the pool and decode serially, keeping failure handling per path.
    docs: [docs/backlog/loading-speedup/attribution.md]

  - id: kaggle-loading-probe-resample
    path: scripts/adhoc/kaggle_loading_probes/resample.py
    summary: Compare per-slice crop-resampling with stacked-sparse and batched-dense whole-series formulations.
    tags: [probe, resample, crop, spatial, sparse, batched, cpu, numerics, preprocessing]
    commands:
      - cat scripts/adhoc/kaggle_loading_probes/common.py scripts/adhoc/kaggle_loading_probes/resample.py > /tmp/resample_probe.py && KNEE_PROBE_DATA=data/raw rtk proxy uv run --locked python /tmp/resample_probe.py
    inputs: [Competition DICOMs]
    outputs: [resample.json with per-implementation milliseconds per slice and a bit-exactness audit against the per-slice baseline]
    notes:
      - Covers the whole-series resample formulations, now closed as regressions; pure CPU, so it needs no NFS and can be answered locally.
      - Measured locally as a regression, stacked-sparse 4.8x and batched-dense 2.6x slower than per-slice; batched-dense is also not bit-exact.
      - Groups slices by shape, spacing, slope and intercept so a group shares one pair of cached axis filters.
    docs: [docs/backlog/loading-speedup/closed.md#closed-as-measured-regressions]

  - id: kaggle-loading-probe-quantiles
    path: scripts/adhoc/kaggle_loading_probes/quantiles.py
    summary: Compare exact quantile selection and pixel normalization variants on real resampled acquisition pixels.
    tags: [probe, quantiles, percentile, partition, histogram, normalize, clip, intensity, cpu, preprocessing]
    commands:
      - cat scripts/adhoc/kaggle_loading_probes/common.py scripts/adhoc/kaggle_loading_probes/quantiles.py > /tmp/quantiles_probe.py && KNEE_PROBE_DATA=data/raw rtk proxy uv run --locked python /tmp/quantiles_probe.py
    inputs: [Competition DICOMs]
    outputs: [quantiles.json with per-implementation milliseconds per acquisition and bound and pixel exactness audits]
    notes:
      - Covers the cheaper exact intensity bounds and normalization, now closed as regressions; pure CPU, so it needs no NFS and can be answered locally.
      - Pixel source decides the verdict. On real resampled slices histogram selection is 1.67x slower than partition; the synthetic generator behind REAL_PIXELS made it look 1.87x faster.
      - The fused normalization is neither faster nor bit-exact against production and is retained only as the measured negative.
    docs: [docs/backlog/loading-speedup/closed.md#closed-as-measured-regressions]

  - id: kaggle-loading-probe-indexing
    path: scripts/adhoc/kaggle_loading_probes/indexing.py
    summary: Compare the production double directory glob with a single reused scandir across thread counts on cold study directories.
    tags: [probe, indexing, listing, glob, scandir, directory, threads, nfs, series]
    commands:
      - cat scripts/adhoc/kaggle_loading_probes/common.py scripts/adhoc/kaggle_loading_probes/indexing.py > /tmp/indexing_probe.py && KNEE_PROBE_DATA=data/raw KNEE_PROBE_AUDIT_ONLY=1 rtk proxy uv run --locked python /tmp/indexing_probe.py
    inputs: [Competition DICOMs]
    outputs: [indexing.json with per-cell milliseconds per study and series rates and a listing equality audit]
    notes:
      - Covers the worker-filtered series index and the single series listing; the per-study cost it reports is what the worker filter avoids by indexing only a worker's own studies.
      - The double-glob baseline reproduces Kaggle behaviour, where the image-count parquet is absent so each series directory is globbed for counting and again for ordering.
      - Reports listing work only; it does not read headers, so it is independent of the header probe.
    docs: [docs/backlog/loading-speedup/candidates.md#ship-without-a-retrain]

  - id: compare-local-and-public-scores
    path: scripts/adhoc/compare_local_and_public_scores.py
    summary: Correlate saved fold-0 metrics (macro AUC, gold-only AUC, BCE) with Kaggle public scores over comparable submissions only.
    tags: [validation, public, leaderboard, correlation, selection, metric, gold, bce, auc, noise, reliability, submissions]
    commands:
      - rtk proxy env CUDA_VISIBLE_DEVICES= uv run --locked python -m scripts.adhoc.compare_local_and_public_scores --output-dir outputs/analysis/local-public-metrics-new
    inputs: [scripts/adhoc/submission_public_scores.json, Saved epoch metrics and validation predictions under outputs/training, Frozen split protocol and evaluation targets, data/raw/train.csv and the official series CSVs pinned by the split]
    outputs: [submissions.csv with every submission and its recomputed metrics, summary.json with per-cohort correlations, replicate noise and the macro-AUC fit]
    notes:
      - Reads saved artifacts only; no training, inference, GPU access or tests. Refuses an existing output directory.
      - The manifest marks each submission comparable or excluded; the cohort additionally requires the recorded split, label source and validation multiplier to match, so leaderboard rows differing in test density, attention temperature or label table never enter a correlation.
      - Selects each run's checkpoint epoch by the highest saved macro AUC, matching training's own selection, and fails if the recomputed macro AUC differs from the saved metrics.
      - Gold-only BCE is computed against the frozen hard gold targets; the saved soft-target BCE is comparable only within one label table.
      - Replicate noise comes from the three recorded same-recipe groups (df=5), so the SD itself carries a wide interval.
      - Public scores are rounded to three decimals and every run is one fold and one seed.
    docs: [docs/validation/results/2026-09-18-local-public-metric-comparison.md, docs/validation/local-to-public-score-relationship.md]

  - id: relabel-kaggle-submission-datasets
    path: scripts/adhoc/relabel_kaggle_submissions.py
    summary: Number every Kaggle submission, retitle its notebook and rewrite its private bundle dataset title, subtitle and description into the unified submission format.
    tags: [kaggle, submission, dataset, notebook, kernel, metadata, title, description, rename, ledger, relabel, naming, sequence]
    commands:
      - rtk proxy uv run --locked python -m scripts.adhoc.relabel_kaggle_submissions
      - rtk proxy uv run --locked python -m scripts.adhoc.relabel_kaggle_submissions --apply
    inputs: [Kaggle credentials and competition access, outputs/submission/records/*.json, Bundle manifests and config under outputs/submission/exports, Curated label table inside the script]
    outputs: [outputs/submission/kaggle-ledger.json with one entry per submission, Updated private dataset metadata on Kaggle, Renamed notebooks with one extra unexecuted version each]
    notes:
      - Without --apply it only writes the ledger and prints the planned dataset and notebook titles.
      - Kaggle submission descriptions cannot be edited after submission, so past submission rows keep their original description text; the notebook title beside each row is what the rename changes.
      - Renaming pulls the current notebook source and metadata and saves it back with KernelExecutionType.QUICK_SAVE, which creates a version without executing it, so no GPU quota is spent and the submitted versions are untouched.
      - Numbering comes from the live submission list sorted by date, so S numbers are stable while submissions only append.
      - Refuses to touch a dataset that is not private, keeps the private bundle manifest line so the submit workflow can still detect an unchanged bundle, and skips datasets and notebooks that already match.
      - Skips a notebook whose latest run has not finished, so it never disturbs an active submission.
      - Retries HTTP 429 with exponential backoff and pauses between updates; a full pass without throttling is rate limited.
      - Historical bundles predate recorded runtime fields, and the three ranked-filtered bundles carry the attention temperature folded into the scorer weights, so those temperatures come from the table in the script.
    docs: [docs/inference/submissions/INDEX.md#naming]
