  - id: probe-kaggle-loading
    path: scripts/adhoc/probe_kaggle_loading.py
    summary: Launch one self-contained Kaggle CPU script kernel per proposed loading speedup and collect its throughput and equality audit.
    tags: [probe, loading, kaggle, script, kernel, cpu, dicom, header, parser, threads, nfs, throughput, dataloader, speedup]
    commands:
      - rtk proxy uv run --locked python -m scripts.adhoc.probe_kaggle_loading launch --output-dir outputs/profiling/kaggle-loading-probes-20260917
      - rtk proxy uv run --locked python -m scripts.adhoc.probe_kaggle_loading launch --output-dir outputs/profiling/kaggle-loading-probes-new --probes '["header","frames"]'
      - rtk proxy uv run --locked python -m scripts.adhoc.probe_kaggle_loading collect --output-dir outputs/profiling/kaggle-loading-probes-20260917
    inputs: [Probe sources in scripts/adhoc/kaggle_loading_probes/, Competition DICOMs attached on Kaggle, Kaggle credentials]
    outputs: [Private Kaggle script kernels, status.json with push and run states, Per-probe result JSON and kernel logs, summary.json]
    notes:
      - Each probe isolates one candidate from the loading speedup plan; it reproduces only the operation under test, not the dataloading pipeline, and needs no exported bundle.
      - A probe is pushed as one file built by concatenating kaggle_loading_probes/common.py with the probe body, so the kernel has no repository dependency.
      - Probes carry a copy of the production function as their baseline; the copy can drift from src/ and is not verified against it automatically.
      - Every probe audits its candidate against that baseline and reports timings alongside the audit, so a candidate that changes outputs is visible.
      - Kaggle allows five concurrent batch CPU sessions; concurrency is capped at five and a rejected push is recorded rather than queued.
      - Cells use disjoint study blocks so each block is read cold once per session; a second session on a fresh machine reads them cold again.
      - Pure-CPU probes (resample, quantiles) do not depend on NFS and can be answered locally; set KNEE_PROBE_DATA, KNEE_PROBE_OUT and KNEE_PROBE_AUDIT_ONLY to run a probe against local data.
      - The quantiles probe measures real resampled pixels by default; its synthetic generator gave the opposite verdict and is kept only behind REAL_PIXELS.
    docs: [docs/backlog/loading-speedup/measuring.md, docs/inference/2026-09-15-kaggle-inference-profiling.md]

