  - id: profile-kaggle-inference
    path: scripts/adhoc/profile_kaggle_inference.py
    summary: Run a frozen inference bundle over fold-0 training studies in one Kaggle notebook per runtime condition, then score FP16/FP32 parity and break down startup, loader, transfer, forward and per-stage DICOM loading time; also probes startup, audits prepared-image parity against a reference bundle and censuses preparation failures.
    tags: [profile, inference, kaggle, notebook, t4, fp16, precision, runtime, efficiency, loader, workers, nfs, dicom, headers, throughput, parity, auc, startup, import, cuda, spin, py-spy, census, bit-exact, audit]
    commands:
      - rtk proxy uv run --locked python -m scripts.adhoc.profile_kaggle_inference launch --bundle outputs/submission/exports/run-fold0 --dataset OWNER/knee-profile-run-fold0 --output-dir outputs/profiling/kaggle-inference-new --conditions '["fp16-b4-w8","fp16-b4-w16"]'
      - rtk proxy uv run --locked python -m scripts.adhoc.profile_kaggle_inference launch --bundle outputs/submission/exports/run-fold0 --dataset OWNER/knee-profile-run-fold0 --output-dir outputs/profiling/kaggle-loading-new --conditions '["loading"]'
      - rtk proxy uv run --locked python -m scripts.adhoc.profile_kaggle_inference launch --bundle outputs/submission/exports/new-code --dataset OWNER/knee-profile-new-code --reference-dataset OWNER/knee-profile-old-code --output-dir outputs/profiling/kaggle-parity-new --conditions '["parity"]' --target-studies 1300 --split-dir data/folds/all_5fold_scanner_v1
      - rtk proxy uv run --locked python -m scripts.adhoc.profile_kaggle_inference launch --bundle outputs/submission/exports/run-fold0 --dataset OWNER/knee-profile-run-fold0 --output-dir outputs/profiling/kaggle-census-new --conditions '["census-0","census-1","census-2","census-3","census-4"]' --concurrency 5 --target-studies 1300 --split-dir data/folds/all_5fold_scanner_v1
      - rtk proxy env CUDA_VISIBLE_DEVICES= uv run --locked python -m scripts.adhoc.profile_kaggle_inference analyze --output-dir outputs/profiling/kaggle-inference-20260915
    inputs: [Exported inference bundle with instrumented runtime, Frozen fold membership and targets, Local BF16 validation predictions of the bundled checkpoint, Kaggle credentials]
    outputs: [Private Kaggle dataset and notebooks, status.json with push and run states, Per-condition notebook outputs and logs, cpu.csv and processes.csv samples, summary.json with AUC parity, timing, per-role CPU and loading-stage breakdown]
    notes:
      - Each condition runs on a fresh Kaggle machine, so every run reads DICOMs cold like the hidden test; conditions are paired on the same fold-0 studies.
      - The notebook presents training studies through a symlinked test layout under /tmp and runs the bundle's unchanged predict entry point, so image counts are enumerated from disk as on the hidden test.
      - Launches at most two notebooks at once (the account's batch GPU session limit) and retries pushes rejected for that limit; a reused dataset must hold the same bundle manifest.
      - Prediction conditions vary precision, per-GPU batch size and total loader workers on both GPUs; add a condition only when a measured bottleneck justifies it.
      - The loading condition runs on a CPU notebook, times wrapped bundle preprocessing stages over 100 seeded studies cold then warm, and measures threaded header and full-file read throughput on separate cold studies.
      - Samples /proc/stat, /proc/<pid> and nvidia-smi once per second; AUC uses the training evaluation threshold and gold/report-derived split.
      - Prediction runs attribute CPU per role — coordinator, GPU main processes and loader workers — from processes.csv. Loader workers are forked and inherit the parent's cmdline, so the split is by parentage, never by command text.
      - The loading cell reports wall and process CPU per stage, and keeps the pool-thread functions in a thread-seconds bucket that must never be added to a wall column. Analysis reads only this format; artifacts written before 2026-09-18 do not have it.
      - The loading and precision cells import the bundle's knee_abnormality.data, data.preprocessing and inference.engine/checkpoint modules, so they need a bundle exported from the current package layout; bundles exported before 2026-09-16 (such as knee-reflection-sigma40-fast-20260915) only support prediction conditions.
      - The startup condition times cold and warm imports with -X importtime, each model-load step in a fresh process, and CPU against wall of a backbone loop with default and blocking CUDA synchronization, with and without four CPU burners.
      - The parity condition attaches a second bundle through --reference-dataset and prepares the same studies with each bundle's code in its own process, comparing per-series digests of the uint8 images and geometry tensors; use it to prove a change to hashed preprocessing sources bit-exact.
      - The census-0..4 conditions split every study of --split-dir across five CPU notebooks and record every preparation failure at the bundle's multiplier.
      - The cudnn condition times the first FP16 chunk and steady chunks of a random-weight backbone under default, legacy (TORCH_CUDNN_V8_API_DISABLED) and benchmark cuDNN selection, and compares their outputs.
      - The mainloop condition prepares 64 studies with the bundle's code and times page-locking, transfer, prepare_images (and its sort), forward and release per batch with synchronization, uncontended.
      - The fp16-b4-w16-pyspy condition enables internet, installs py-spy and samples every process of a prediction run; check its sample count, since it lost the loader workers once they forked before model load.
      - Every notebook selects its bundle by the dataset slug through KNEE_BUNDLE_DIR, so extra attached datasets do not confuse bundle discovery; environment.json records the /dev/shm size.
      - Bundles that change hashed preprocessing sources need a timing checkpoint of the new identity (make-timing-checkpoint); their predictions are unscored.
    docs: [docs/inference/2026-09-15-kaggle-inference-profiling.md, docs/inference/2026-09-18-kaggle-x4-profile-after-index-changes.md, docs/inference/2026-09-22-kaggle-x4-startup-and-gpu-preparation.md]

