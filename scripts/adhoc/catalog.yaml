version: 1
scripts:
  - id: audit-study-overlap
    path: scripts/adhoc/audit_study_overlap.py
    summary: Retrieve possible repeated studies using representative geometry and near-duplicate reports, then compare decoded slices in shortlisted acquisitions.
    tags: [duplicates, patient, leakage, split, reports, geometry, pixels, overlap]
    commands:
      - rtk proxy env CUDA_VISIBLE_DEVICES= OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 uv run --locked python -m scripts.adhoc.audit_study_overlap --output-dir outputs/analysis/study-overlap-new
    inputs: [Saved representative DICOM paths, Saved normalized reports, Frozen fold membership, Original DICOMs]
    outputs: [Input and source manifest, Representative geometry parquet, Ranked candidate pairs, Decoded pixel fingerprint inventory, Exact and approximate pixel comparisons, Summary JSON, Source snapshot]
    notes:
      - CPU only; no training, GPU, tests, fold changes or submissions. Requires a fresh output directory.
      - Reads one representative header per study; report retrieval checks six nearest neighbors with cosine at least 0.94 and at least 200 normalized characters, excluding existing exact report groups.
      - By default checks one complete representative series for each study in the top forty pairs; cross-fold pairs have priority within each evidence tier.
      - Exact hashes use nonconstant decoded two-dimensional integer pixel arrays and dimensions, ignoring identifiers and compression containers.
      - Unregistered 32x32 thumbnail cosine is uncalibrated candidate evidence. No match does not exclude follow-ups, altered exports or overlap in unexamined series.
      - Report templates and shared scanner protocols are not evidence of patient equivalence.
    docs: [docs/metadata/study-overlap-investigation.md]

  - id: audit-repeated-series
    path: scripts/adhoc/audit_repeated_series.py
    summary: Find series whose slices repeat pixel-for-pixel within or across studies by hashing a central pixel chunk of every DICOM, then verify matches on full decoded frames.
    tags: [duplicates, repeated, identical, series, pixels, hash, fingerprint, retakes, copies, headers]
    commands:
      - rtk proxy env CUDA_VISIBLE_DEVICES= uv run --locked python -m scripts.adhoc.audit_repeated_series --output-dir outputs/analysis/repeated-series-new
      - rtk proxy env CUDA_VISIBLE_DEVICES= uv run --locked python -m scripts.adhoc.audit_repeated_series --output-dir outputs/analysis/repeated-series-trial --studies 30
    inputs: [Official train and test series CSVs, Original DICOMs]
    outputs: [Per-file header and chunk-hash parquet, Per-series summary parquet, Series pairs sharing chunks with full-pixel verification, Within-series repeated slices parquet, Summary JSON with a header-only rule check, Manifest and source snapshot]
    notes:
      - CPU only. Reads a 12 KB header prefix and one 8 KB chunk from the middle of the pixel payload per file (the file tail for non-native encodings); full frames are decoded only for files whose chunks match.
      - Constant chunks are excluded from matching. Pair relation is identical, subset or partial over distinct informative chunks.
      - The header rule pairs same-study series with equal sorted slice positions, file count, matrix, TR and TE; it is scored against pixel identity.
      - Requires a fresh output directory; --studies limits the scan to the first sorted studies of each split.
    docs: [docs/metadata/repeated-series.md]

  - id: simulate-online-series-dedup
    path: scripts/adhoc/simulate_online_series_dedup.py
    summary: Simulate the per-study online duplicate-series filter on production series indexing and score it against the exhaustive repeated-series audit, including extra frame reads and near-copy correlations.
    tags: [duplicates, repeated, identical, series, online, inference, filter, pixels, geometry, reconstruction, cost]
    commands:
      - rtk proxy env CUDA_VISIBLE_DEVICES= uv run --locked python -m scripts.adhoc.simulate_online_series_dedup --output-dir outputs/analysis/online-series-dedup-new
    inputs: [Official series CSV for the split, Original DICOMs, Repeated-series audit pairs parquet]
    outputs: [Per-study indexing, keying and frame-read cost parquet, Same-count-and-matrix series pairs with key membership, exact equality and middle-frame correlation, Summary JSON, Manifest and source snapshot]
    notes:
      - CPU only. Runs index_series per series with one thread, so its indexing time is not the threaded inference loader's.
      - Header key is slot, slice count, matrix and sorted positions rounded to 0.01 mm; only bucketed series read their middle-position frame. Pairs sharing only count and matrix are also decoded, to check for copies outside the key.
      - Accuracy is scored against same-study identical pairs from audit-repeated-series; frame-read timings are local, not Kaggle.
    docs: [docs/metadata/repeated-series.md#online-detection-per-study]

  - id: score-series-cleaning-rules
    path: scripts/adhoc/score_series_cleaning_rules.py
    summary: Re-predict the fold-0 studies touched by candidate series-cleaning rules (contrast-slot relabel, same-signature same-geometry reconstructions or retakes, near-empty frames) with a saved checkpoint on CPU, and score per-study prediction shifts and the full-fold AUC change against intact predictions.
    tags: [series, cleaning, filter, relabel, contrast, retakes, reconstruction, blank, frames, inference, validation, bootstrap, cpu]
    commands:
      - rtk proxy env CUDA_VISIBLE_DEVICES= uv run --locked python -m scripts.adhoc.score_series_cleaning_rules --output-dir outputs/analysis/series-cleaning-rules-new
    inputs: [Run directory with effective_config.json, selected checkpoint and saved validation predictions, Series-filtering census parquet, Repeated-series per-file parquet, Original DICOMs]
    outputs: [Per-variant results in summary.json, Per-study prediction shifts parquet, Relabelled series and signature-group parquets, Near-empty frame usage parquet, Manifest and source snapshot]
    notes:
      - CPU only, about 3.5 s per study at x4 with 16 threads; the checkpoint must match the executing preprocessing identity. Attention temperature is the loader default.
      - Variants edit only the affected studies' series index; intact predictions are remade in the same process, and the full-fold delta substitutes both into the saved fold predictions.
      - Relabel uses the census confirmed fluid/fat-suppression flags. Signature groups share slot, slice count, sequence signature and positions rounded to 0.01 mm and exclude exact copies; keep_newest and keep_oldest keep the highest or lowest SeriesNumber.
      - Near-empty frames have under 1% non-zero pixels among frames whose central chunk is constant; usage counts selected triplets touching one, over all training studies holding such frames.
    docs: [docs/metadata/repeated-series.md]

  - id: compare-soft-auc
    path: scripts/adhoc/compare_soft_auc.py
    summary: Compare two fold runs' saved validation predictions on macro hard AUC (frozen targets at 0.5) and macro soft AUC (study pairs weighted p_i(1 - p_j) by the frozen soft targets), with one paired report-group bootstrap for both deltas.
    tags: [validation, comparison, soft-auc, expected-auc, bootstrap, report-group, fold, labels]
    commands:
      - rtk proxy uv run --locked python -m scripts.adhoc.compare_soft_auc --reference outputs/training/k05-clean --candidate outputs/training/image-blend --output-dir outputs/analysis/soft-auc-new
    inputs: [Reference and candidate run directories with effective_config.json and fold validation_predictions.csv, The runs' split targets.csv, studies.csv and protocol.json]
    outputs: [summary.json with both macro scores, deltas and 80%/95% intervals, per_target.csv, Source snapshot]
    notes:
      - CPU only, about 30 s. Refuses an existing output directory.
      - The bootstrap mirrors compare_fold_runs (multinomial report-group counts, seed 20260914, 2,000 draws, draws dropped when a label loses a hard class), so the hard delta reproduces its macro interval.
      - Soft AUC excludes same-study pairs; it still scores against report-derived targets, so it inherits their labeller bias.
    docs: [docs/validation/results/2026-09-23-image-blend-labels-result.md#fold-0-result]

  - id: prepare-grade-aware-labels
    path: scripts/adhoc/prepare_grade_aware_labels.py
    status: historical
    summary: Build the rejected combined_v2 label table (combined_v1, except every cell Ramit calls a LOW-severity positive takes the nine-extractor consensus mean) with its manifest, silver change counts and the gold agreement of both tables.
    tags: [labels, combined, consensus, severity, low-grade, ramit, gold, preparation, rejected]
    commands:
      - rtk proxy uv run --locked python -m scripts.adhoc.prepare_grade_aware_labels
    inputs: [configs/labels/combined-label-sources.json and the combined_v1 table it pins, configs/labels/public-label-comparison-sources.json and the nine consensus sources via scripts.tools.prepare_combined_labels, Ramit GPT-luna report_labels.csv snapshot, Official train.csv]
    outputs: [data/labels/prepared/combined-v2/labels.csv, data/labels/prepared/combined-v2/preparation.json, configs/labels/combined-v2-label-sources.json]
    notes:
      - CPU only, seconds; deterministic, labels.csv SHA-256 e8dec30f36908b82462b6272708dc9baaedcf7076af57914830ac5f58fa04bb9. Requires fresh output paths.
      - Fails if any consensus target changes, since combined_v1 already holds the consensus mean there.
      - Gold macro AUC of the table fell from 0.9075 to 0.9044 (Effusion -0.020), so it was not trained on; see the linked findings.
    docs: [docs/public-labels/report-attributes.md#consensus-mean-rule-tested-on-gold]

  - id: check-report-attributes
    path: scripts/adhoc/check_report_attributes.py
    summary: Check the report attributes already in public label tables (Ramit GPT-luna severity, hedging and report state, Zaid severity and mention, Pilkwang verdict) for coverage, cross-source agreement, redundancy with the training targets, agreement with saved fold-0 predictions and the gold rate of each report call.
    tags: [labels, public, severity, grade, hedged, mentioned, report-state, auxiliary, supervision, gold, grounding, calibration, cpu]
    commands:
      - rtk proxy uv run --locked python -m scripts.adhoc.check_report_attributes --output-dir outputs/analysis/report-attributes-new
    inputs: [Ramit, Zaid and Pilkwang snapshots under data/labels/public, all_5fold_scanner_v1 targets.csv, studies.csv and protocol.json, Prepared combined-v1 labels.csv (silver values before gold override), Saved fold-0 validation predictions (default k_05 at x4)]
    outputs: [coverage_training.csv, severity_agreement_training.csv, state_agreement_training.csv, target_relation_training.csv, grounding_validation.csv, negatives_by_report_state_validation.csv, silver_by_ramit_call_non_gold.csv, gold_by_ramit_call.csv by consensus or Steven v4 target group, summary.json, manifest.json with input hashes, Source snapshot]
    notes:
      - CPU only, under a minute; no training or LLM calls. Refuses an existing output directory.
      - Training tables use folds other than the validation fold; grounding uses the validation fold's evaluation targets thresholded at 0.5 and the saved predictions; gold rows use targets.csv on the 58 gold studies.
      - Zaid severity is a mean over its models; values of 0 or below count as unrated, and levels are rounded to 1-3 for kappa. Zaid rows with n_models 0 are dropped.
    docs: [docs/public-labels/report-attributes.md]

  - id: screen-public-label-additions
    path: scripts/adhoc/screen_public_label_additions.py
    summary: Screen the label tables first downloaded on 2026-09-22 (Hosseini JEV v2, lvthanhxun teacher, Nekkon NLI, Pearse, Nartaa, Davidadekanmi, Achelijndiamantidis) for gold macro AUC against Steven v4 on the same rows, gold copying, and silver agreement with combined_v1 and Pilkwang v2.
    tags: [labels, public, kaggle, gold, screen, steven, pilkwang, combined, copying, nli, teacher]
    commands:
      - rtk proxy uv run --locked python -m scripts.adhoc.screen_public_label_additions --output-dir outputs/analysis/public-label-additions-new
    inputs: [Snapshots under data/labels/public/<owner>/<slug>/downloaded-20260922, Steven v4 and Pilkwang v2 tables, Prepared combined-v1 labels.csv, Official train.csv]
    outputs: [screen.csv with one row per table, manifest.json with input hashes, Source snapshot]
    notes:
      - CPU only, seconds; no training or downloads. Refuses an existing output directory.
      - A gold-equal share of 1.0 means the table carries the official labels on gold studies, so its gold AUC is not a benchmark; Nartaa's tables omit the gold studies.
      - Hosseini is scored on its positive-class probability and lvthanhxun on its fused teacher target (__y).
    docs: [docs/public-labels/2026-09-22-public-label-additions.md]

  - id: validate-calibrated-judge
    path: scripts/adhoc/validate_calibrated_judge.py
    summary: Define and test a submission-free judge (fold-0 macro soft AUC against gold-calibrated expected truth from label sources outside label construction) on 32 past submissions against fold-0 macro AUC, with replicate noise, a shared-study cross-split check and an optional paired report-group comparison of two runs.
    tags: [validation, judge, leaderboard, public, calibration, gold, expected-auc, soft-auc, labels, correlation, noise, bootstrap, submissions]
    commands:
      - rtk proxy uv run --locked python -m scripts.adhoc.validate_calibrated_judge --output-dir outputs/analysis/calibrated-judge-new
      - rtk proxy uv run --locked python -m scripts.adhoc.validate_calibrated_judge --output-dir outputs/analysis/calibrated-judge-compare --reference outputs/training/k_05 --candidate outputs/training/<run>
    inputs: [Judge-side label snapshots (Hosseini JEV v2, Pearse weak v2, lvthanhxun teacher states, Nekkon NLI) and reference sources (Ramit, Pilkwang), Nine consensus sources via scripts.tools.prepare_combined_labels plus Steven v4, scripts/adhoc/submission_public_scores.json, Saved fold-0 predictions of the listed submitted runs, Split targets and studies, Official train.csv]
    outputs: [eligibility.csv, calibration.csv, history.csv, agreement.csv, cross_split_shared_studies.csv, replicate_noise.csv, frozen_expected_truth.csv, summary.json with the frozen judge definition and optional comparison, manifest.json, Source snapshot]
    notes:
      - CPU only, a few minutes; no training. Refuses an existing output directory.
      - "Eligibility rules are constants fixed before the history was scored: not a construction source, all 58 gold studies covered, calibrated gold AUC >= 0.80, Cohen kappa < 0.90 with every construction source, and no state holding over 80% or under 2% of silver cells. The frozen judge averages the calibrated probabilities of every eligible source."
      - Calibration pools labels and uses all 58 gold studies; fold-0 gold studies keep their gold labels.
      - Prefers a run's validation_predictions.csv.x1 when present, so the history is scored at the multiplier its cohort shares.
      - Ramit and Pilkwang variants are diagnostics only; they were explored before this script and are construction sources.
    docs: [docs/validation/results/2026-09-22-calibrated-judge.md]

  - id: analyze-study-center-extents
    path: scripts/adhoc/analyze_study_center_extents.py
    summary: Fit the study reference point for every training study and measure each plane's coverage on both sides of it.
    tags: [geometry, center, reference, extents, coverage, planes, coronal, sagittal, axial, headers, metadata]
    commands:
      - rtk proxy uv run --locked python -m scripts.adhoc.analyze_study_center_extents --output-dir outputs/analysis/study-center-extents-new
      - rtk proxy uv run --locked python -m scripts.adhoc.analyze_study_center_extents --output-dir outputs/analysis/study-center-extents-trial --studies 16 --workers 4
    inputs: [configs/training.yaml, Official series CSV for the split, Series image-count inventory, Original DICOM headers]
    outputs: [Per-study reference points and acceptance parquet, Per-series signed side distances parquet, Per-study union extents by plane and fluid sensitivity parquet, Summary JSON, Script and package snapshot under source/]
    notes:
      - Reads header prefixes with the production indexer and instance guard; no pixels, models, training, tests or GPU access.
      - Uses the production study reference fit, so rejected studies carry a reason and no point; their series keep no distances.
      - Distances are signed along each plane's through-plane axis in LPS, oriented so negative is inferior, anterior or patient right and positive is superior, posterior or patient left.
      - Distances span slice centres only; add half the recorded slice spacing for the outer faces.
      - Sagittal right and left are patient laterality, mixing medial and lateral across knee sides.
      - Truncation fractions compare each side against that group's own mean nearest-side reach times configs/training.yaml `data.sampling_sigma_fraction`.
      - Reports each plane pooled and split by fluid sensitivity, plus the paired fluid-minus-T1/PD delta over studies carrying both types.
      - Existing output directories are refused; the whole training split takes about 20 seconds at twelve workers and four IO threads.
    docs: [docs/data-preparation/accurate-sampling-centers.md#cohort-wide-center-fit-and-plane-extents]

  - id: audit-knee-side-geometry
    path: scripts/adhoc/audit_knee_side_geometry.py
    summary: Measure coordinate-based knee-side agreement and unresolved coverage using physical DICOM geometry only.
    tags: [laterality, knee, side, geometry, coordinates, orientation, metadata, audit]
    commands:
      - rtk proxy env CUDA_VISIBLE_DEVICES= POLARS_MAX_THREADS=1 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 uv run --locked python -m scripts.adhoc.audit_knee_side_geometry --output-dir outputs/analysis/knee-side-geometry-new
    inputs: [Reviewed knee-laterality header and study snapshots, Official series CSVs, Original DICOM metadata for dimensions and coil fields, Optional enriched geometry snapshot, Training reports for corroboration only]
    outputs: [Physical centers and orientation parquet, Agreement and coverage CSVs, Categorical metadata summaries, Report-side corroboration, Summary and fingerprint manifest, Script snapshot under source/]
    notes:
      - Reads metadata with two CPU threads; no pixels, models, tests, training or GPU access.
      - Measures agreement with explicit or text-derived side separately; neither is independent anatomical truth.
      - Coordinate margins and cross-series agreement gates are exploratory; unresolved rows remain candidate assignments only.
      - --enriched-headers reuses an existing geometry snapshot without new DICOM reads; requires a fresh output directory.
      - Training reports are a separate weak reference, never an inference input; no image-based methods are used.
      - Copies its source to source/<repo-relative path> and records the copied hashes in manifest.json.
    docs: [docs/metadata/knee-side-coordinate-investigation.md]

  - id: audit-knee-laterality
    path: scripts/adhoc/audit_knee_laterality.py
    summary: Audit explicit and textual knee-side evidence across local train and example-test DICOM series.
    tags: [laterality, knee, side, left, right, metadata, dicom, headers, audit]
    commands:
      - rtk proxy env CUDA_VISIBLE_DEVICES= POLARS_MAX_THREADS=1 uv run --locked python -m scripts.adhoc.audit_knee_laterality --output-dir outputs/analysis/knee-laterality-new
    inputs: [Official local train and test series CSVs, Original DICOM headers, Optional prior header snapshot]
    outputs: [Headers and study assignments parquet, Field-level evidence parquet, Unique descriptions CSV, Summary and provenance manifest, Script snapshot under source/]
    notes:
      - Reads three lexicographically selected headers per series with stop_before_pixels; no pixel decoding, model execution or GPU access.
      - Defaults to two CPU threads; hidden Kaggle test data is unavailable locally.
      - Separates explicit tags, conservative text inference, conflicts and unknowns; inferred text is not independently verified anatomy.
      - Can reanalyze an existing headers parquet with --headers; requires a fresh output directory.
      - Copies its source to source/<repo-relative path> and records the copied hashes in manifest.json.
    docs: [docs/metadata/2026-09-14-knee-side-metadata-audit.md, docs/research/knee-side-and-location.md#metadata-and-reflection-requirements]

  - id: analyze-physical-sampling
    path: scripts/adhoc/analyze_physical_sampling.py
    summary: Measure production physical sampling and local fallback on the pinned saved geometry cohort.
    tags: [sampling, geometry, gaussian, triplets, overlap, density, acquisitions, center, metadata]
    commands:
      - rtk proxy uv run --locked python -m scripts.adhoc.analyze_physical_sampling --output-dir outputs/analysis/physical-sampling-new/geometry
    inputs: [Saved 128-study geometry headers parquet, Series image-count inventory, configs/training.yaml, Frozen fold membership, Archived prototype summary]
    outputs: [Source and input manifest, Per-draw and selected-triplet parquet tables, Source exposures and center diagnostics, Summary JSON]
    notes:
      - Reads saved metadata only; no pixels, models, training or tests.
      - The source manifest records the configured backbone's spatial mapping identity; the script and every package module are copied to source/<repo-relative path>.
      - Calls the production sampler for both dataset modes, including rejected-center local fallback; retains the original comparison as an archived summary.
      - Saved headers carry no series tags and bypass the loader's instance guard, so the source ranking sees only crop coverage and UID.
      - The known-bad-instance filter was removed on 2026-09-20 with the repaired DICOMs, so the pinned cohort now contributes those two slices; runs before that date skipped them.
      - Default seed 20260913 and 32 randomized epochs; validation uses the configured multiplier.
      - Records target and realized coverage, intended and realized source shares, gap splits, plane disagreements, singletons and shortfalls.
      - Existing output directories are refused. Historical prototype source remains in outputs/analysis/physical-sampling-20260913/geometry-v3/source/.
    docs: [docs/data-preparation/physical-sampling/INDEX.md]

  - id: inspect-physical-preparation
    status: historical
    path: scripts/adhoc/inspect_physical_preparation.py
    summary: Inspect overlapping CPU preparation on real accepted and rejected-center studies without models or tests.
    tags: [sampling, preparation, overlap, intensity, geometry, threading, cpu]
    commands:
      - rtk proxy uv run --locked python -m scripts.adhoc.inspect_physical_preparation --output-dir outputs/analysis/physical-sampling-new/preparation
    inputs: [Pinned geometry headers and inventory, configs/training.yaml, Original training DICOMs]
    outputs: [Source and input manifest, Selected paths and batch digests, Unique intensity populations, Metadata alignment and serial-threaded report]
    notes:
      - Includes all rejected-center studies and four accepted studies by default, in both dataset modes.
      - Compares serial and four-thread decoding and reversed row order; independently recomputes unique-slice clipping populations.
      - No synthetic fixtures, models, training, optimizer steps or test harness. Failure coverage depends on the real sample.
      - Refuses existing output directories and preserves source, configuration and input identities; sources are copied to source/<repo-relative path>.
      - The source manifest records the configured backbone's spatial mapping identity.
      - Historical since the 2026-09-22 GPU image preparation, because it reads per-series prepared images and intensity bounds that loader workers no longer produce, so it needs the source of ab49830 or earlier.
    docs: [docs/data-preparation/current-preparation.md#overlapping-triplet-preparation, docs/data-preparation/physical-sampling/implementation-verification.md]

  - id: audit-sampling-protocols
    path: scripts/adhoc/audit_sampling_protocols.py
    summary: Inspect sequence metadata in one DICOM header per sampled acquisition to characterize repeated plane-contrast groups.
    tags: [sampling, dicom, metadata, acquisition, protocol, repeats, echo, sequence]
    commands:
      - rtk proxy uv run --locked python -m scripts.adhoc.audit_sampling_protocols --output-dir outputs/analysis/physical-sampling-new/protocols
    inputs: [Saved geometry headers parquet with DICOM paths, Original sampled DICOM headers, Series image-count inventory]
    outputs: [Protocol-field parquet snapshot, Field availability and repeat summary, Script snapshot under source/, Manifest]
    notes:
      - Reads the first sorted header of each sampled series with stop_before_pixels and specific tags; does not read or decode pixel data.
      - Uses exact supported plane and paired fluid-sensitive/fat-suppression metadata from the official inventory.
      - Exact sequence signatures are metadata descriptions, not clinical duplicate labels.
      - Refuses existing output directories; hashes metadata snapshots and sources, not complete original DICOM files.
    docs: [docs/data-preparation/physical-sampling/INDEX.md]

  - id: diagnose-encoding-usage
    path: scripts/adhoc/diagnose_encoding_usage.py
    summary: Measure a spatial-token checkpoint's reliance on its embeddings and planes using paired held-out interventions without training.
    tags: [encoding, spatial, tokens, ablation, diagnosis, validation, bootstrap, plane, compartment, margin, cross-talk]
    status: active
    commands:
      - rtk proxy uv run --locked python -m scripts.adhoc.diagnose_encoding_usage outputs/run --output-dir outputs/analysis/encoding-usage-run --workers 8
    inputs: [Trained run effective config, Selected or explicit checkpoint, Saved validation predictions and input identities, Full held-out fold DICOMs and labels]
    outputs: [Per-variant study predictions, Per-target and compartment metrics, Paired bootstrap intervals, Selected input identities, Source snapshot and hashed results]
    notes:
      - Manual evaluation only; no weights are modified and training does not launch this diagnostic. Requires a checkpoint whose preprocessing identity matches the current sources; earlier checkpoints, including token-graph, 00-baseline and crop-selection runs, need their archived sources.
      - Reuses one backbone pass per batch for seven full-fold variants (intact; without 1D, 2D, plane, contrast, anatomical bias or all position) plus axial-, coronal- and sagittal-only pooling of the intact tokens. All-position removal drops both positional embeddings and the anatomical bias.
      - "Embedding interventions affect both attention and position-rich pooled values. Anatomical-bias interventions zero the medial axis; independent heads and learned family strengths are retained."
      - Token-graph edge variants and graph statistics were removed with the token graph; the archived token-graph source keeps them.
      - Plane-only variants cover only studies with visually valid tokens of that plane; their prediction files, per-target AUCs, metrics and bootstrap intervals compare against intact on the same studies, with study counts.
      - Every variant reports medial/lateral meniscus and OA exclusive-positive logit-margin AUCs and lateral cross-talk at the prevalence threshold, with counts and the medial-positive base rate.
      - The champion plane-only baseline was skipped by user decision on 2026-09-14, so plane-only margins exist only for later checkpoints.
      - Records the configured backbone's spatial mapping alongside the source and checkpoint identities; copies the package and this script to source/<repo-relative path>.
      - Reads the checkpoint once, validates it against the run config, target order and fold, requires its recorded input identity to match the current frozen inputs, and loads fold labels once.
      - --batch-size defaults to the run config's trainer batch size; --workers defaults to eight.
      - Output directory must be fresh; investigate intact saved-prediction disagreement before interpreting small effects.
      - Defaults to 2000 paired study bootstrap replicates with seed 20260913; intervals do not measure training-seed variability.
    docs: [docs/validation/manual-encoding-usage-diagnosis.md]
  - id: normalize-reports
    path: scripts/adhoc/normalize_reports.py
    summary: Count distinct training reports after progressively aggressive multilingual lexical normalization.
    tags: [reports, text, normalization, duplicates, unique, metadata]
    commands:
      - rtk proxy uv run --locked python -m scripts.adhoc.normalize_reports
    inputs: [data/raw/train.csv]
    outputs: [data/metadata/report_normalization/summary.json, data/metadata/report_normalization/normalized_reports.parquet, data/metadata/report_normalization/duplicate_groups.csv]
    notes:
      - Uses deterministic rules without translation or fuzzy matching; numeric values and laterality are discarded at heavy stages.
      - Saves raw and normalized report text only under the Git-ignored data directory by default.
      - Token-set equality loses word order and negation scope and does not establish clinical equivalence.
      - Existing output artifacts are overwritten; --input and --output-dir select paths.
    docs: [docs/metadata/report-normalization.md]
  - id: train-overnight
    path: scripts/adhoc/train_overnight.py
    summary: Run fourteen hyperparameter experiments with fresh distinct seeds on fold 0 within an eight-hour queue budget.
    tags: [train, overnight, queue, hyperparameters, adam-epsilon, beta1, augmentation, intensity, noise, experiments]
    commands:
      - nohup rtk proxy uv run --locked python -m scripts.adhoc.train_overnight > outputs/training/overnight.out 2>&1 &
      - rtk proxy uv run --locked python -m scripts.adhoc.train_overnight --prepare-only
    inputs: [configs/training.yaml, Prepared all_5fold_v3 split, Training DICOMs, Pinned labels and pretrained backbone]
    outputs: [Unique outputs/training/overnight-* directory with fourteen YAML configs, Per-run artifacts and logs, status.tsv start/finish/wall time and exit codes, summary.tsv per-run metrics rewritten after every run, runtime.json open-file limits and source fingerprint, Validation comparison PNG for successful runs]
    notes:
      - Snapshots all fourteen configs before training and fixes split v3, fold 0, validation x1 and ten epochs; each invocation draws fourteen distinct random seeds, records them in YAML and prints them, and other settings come from --config (default configs/training.yaml).
      - Starts fresh runs in order from 00-control, each with exactly its listed overrides; see docs/backlog/overnight.md for the run list.
      - Refuses to start if nvidia-smi reports an active GPU compute process (skipped only if nvidia-smi is missing), and refuses to continue if a content-hash fingerprint of tracked and untracked src/, scripts/ or configs/ files changes mid-queue.
      - Continues after individual training failures and returns nonzero if training, plotting or the source-fingerprint check fails. SIGINT or SIGTERM stops the queue and terminates its active process group.
      - Prints scripts.tools.compare_fold_runs commands using --reference and --candidate for completed candidates against both completed controls, plus the control-to-control comparison, with --allowed-config-differences set from that run's own overrides.
      - Uses pydantic-settings for --config and --prepare-only; preparation never starts training or checks the GPU.
      - Raises the process soft open-file limit to its inherited hard limit before training and records both limits and the starting source fingerprint in runtime.json.
      - Runs training and comparison plotting without invoking Codex or submitting to Kaggle.
      - Every invocation creates a new queue and fresh seeds; prepare-only never reserves seeds for the next invocation.
      - Eight-hour elapsed-time budget includes preparation, training and plotting; no new training starts with less than thirty minutes left. Deadline termination records exit code 124; budget or source-change stops return 3.
    docs: [docs/validation/overnight-hyperparameter-queue.md, docs/backlog/overnight.md]
  - id: benchmark-dataloader-optimizations
