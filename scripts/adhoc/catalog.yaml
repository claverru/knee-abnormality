      - rtk proxy env OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 uv run --locked python -m scripts.adhoc.benchmark_dataloader_optimizations configs/baseline.yaml --output-dir outputs/profiling/production-run.json --mode run --candidate production --samples 128
      - rtk proxy env OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 uv run --locked python -m scripts.adhoc.benchmark_dataloader_optimizations outputs/profiling/dicom-reader-20260912/workload.yaml --cohort outputs/profiling/dicom-reader-20260912/comparison-v1/timing_cohort.json --output-dir outputs/profiling/dicom-integration-new --mode dicom-suite --samples 128 --repeats 3 --audit-samples 8
    inputs: [Archived baseline config, Training DICOMs, Frozen validation fold and label sources]
    outputs: [Per-candidate JSON timings, DataLoader output audits, Progressive suite results]
    notes:
      - Fails on import with the current package, which no longer provides the flat knee_abnormality.dataset, inference and runtime modules it imports; it runs only from an archived source tree and configuration that still provide them. Recorded results keep their sources under outputs/profiling/*/source or final-source.
      - Retired from the active runtime after physical sampling; the commands assume that archived checkout, including its configs/baseline.yaml.
      - Retains C, NumPy and descriptor prototypes as historical candidates; production uses the actual dataset and collation, and production-reference uses independent frozen preprocessing and dataset sources in scripts/adhoc/dataloader_reference/.
      - Single runs and dicom-suite use the resolved batch size and exactly eight workers; the historical preprocessing suite requires batch size eight and eight configured workers.
      - dicom-suite compares production-reference with production, using the saved workload and 128-study cohort, the exact saved eight-study audit subset, corrected edge fixtures, training selections and persistent-worker ownership checks before three alternating timing pairs. A failed performance gate stops promotion.
      - The native reader is limited to validated Explicit VR Little Endian single-frame 16-bit MONOCHROME2 files ending at PixelData; unsupported layouts use pydicom.
      - dicom-audit checks exact eight-worker outputs and corrected format/failure fixtures plus freshness and invalid-metadata cases. reference-audit checks package/reference equivalence without native-specific edge cases. No separate test suite is created.
      - Uses deterministic validation studies and the configured validation image multiplier.
      - Runs every timing candidate in a separate process and interleaves candidate runs with baselines.
      - Audits returned tensors with assert_allclose and checks labels, selected paths, positions, grouping, failures and valid regions separately from timing.
      - OS page cache is uncontrolled; results represent first use by the application process, not guaranteed cold storage.
      - The suite measures input discovery, worker startup, preprocessing, collation, optional pinning and optional host-to-device delivery without model execution.
    docs: [docs/data-preparation/production-dicom-integration.md, docs/inference/INDEX.md]
  - id: profile-threaded-loading
    status: historical
    path: scripts/adhoc/profile_threaded_loading.py
    summary: Compare worker-local slice threads against process-only loading on fixed real studies.
    tags: [profile, threading, parallel, dataloader, throughput, gpu, preprocessing]
    commands:
      - rtk proxy uv run --locked python -m scripts.adhoc.profile_threaded_loading configs/training.yaml --mode audit --samples 8 --output-dir outputs/profiling/threading-audit-new
      - rtk proxy uv run --locked python -m scripts.adhoc.profile_threaded_loading configs/training.yaml --mode gpu --workers 8 --decode-threads 1 --samples 256 --output-dir outputs/profiling/threading-gpu-new
      - rtk proxy env OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 uv run --locked python -m scripts.adhoc.profile_threaded_loading configs/training.yaml --mode loader --workers 4 --decode-threads 2 --samples 512 --warmup-batches 16 --output-dir outputs/profiling/threading-loader-new
      - rtk proxy env OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 uv run --locked python -m scripts.adhoc.profile_threaded_loading configs/training.yaml --mode loader --workers 16 --decode-threads 1 --read-threads 4 --samples 256 --warmup-batches 1 --passes 2 --output-dir outputs/profiling/frames-cold-readthreads-new
    inputs: [Experiment config, Training DICOMs, Frozen fold and label sources]
    outputs: [Per-batch timings and losses, fixed class-balance statistics when enabled, Prepared-input audit hashes, Configuration and recursive project-relative source snapshots]
    notes:
      - Experimental subclass overrides the dataset's _decode_series injection point and leaves production loading unchanged; one thread calls the production preparation function.
      - Reuses bounded pools created lazily after worker startup; preserves serial indexing and sampling and ordered joint clipping.
      - Selects four maximum-load training studies plus a seeded random sample; two passes repeat epoch-zero slice choices with persistent workers.
      - GPU mode uses bounded optimization steps with seeded random weights, current augmentation and constant learning rates; saves no checkpoint or validation metric.
      - GPU mode records fixed class-balanced BCE statistics from its selected profiling dataset when the training option is enabled.
      - Warmup batches are excluded from studies_per_second; for a cold run drop the page cache first, pass --warmup-batches 1, and read all_studies_per_second and pass_wall_seconds, which cover the whole pass. The manifest records Cached from /proc/meminfo so a warm run is recognisable afterwards.
      - --decode-threads threads whole decode_slice calls, which is more than loading speedup change 5, since decode and resample ride along with the payload read. --read-threads is change 5 as specified. it prefetches the selected slices' payloads on a thread pool with the same validation read_frame applies, then decodes serially.
      - Default loader mode consumes CPU batches immediately without pinning or GPU work and records wall-clock studies/s and selected slices/s.
      - Uses triplet sampling and complete-group failure handling; records triplets, channel appearances and unique source slices separately. Historical single-slice measurements use their source/config snapshots.
      - Uses shared production physical/local selection and retry preparation; decode threading only changes unique-path pixel loading.
      - Audit mode compares all collated fields with production on real studies without using CUDA.
      - Historical since the 2026-09-22 row-trimmed reads, because its threaded arm patches read_frame, which the native decode path no longer calls; run it against the source of ab49830 or earlier.
    docs: [docs/data-preparation/threading-inside-dataset-loading.md]
