version: 1
scripts:
  - id: train-baseline
    path: scripts/pipeline/train.py
    summary: Train the full-slice spatial-token model with visual-validity masking and save fixed-fold validation predictions.
    tags: [train, baseline, spatial, lightning, fold, checkpoint, auc, mri, coatnet, rexnet]
    commands:
      - rtk proxy uv run --locked just train fold0-control
      - rtk proxy uv run --locked just resume run-resumed outputs/training/run/fold_0/last.ckpt outputs/training/run/effective_config.json
      - rtk proxy uv run --locked python -m scripts.pipeline.train configs/training.yaml
      - rtk proxy uv run --locked python -m scripts.pipeline.train configs/training.yaml --folds 0,1,2,3,4
    inputs: [Experiment YAML, Raw training DICOMs and metadata, Pinned public labels, Saved fold protocol]
    outputs: [Run directory with effective config, provenance, checkpoints, logs, epoch metrics, validation predictions, and enabled class-balance statistics]
    notes:
      - Autoresearch supplies KNEE_AUTORESEARCH_LIMITS to enable trusted valid-triplet accounting and fixed-budget enforcement; ordinary training does not enable this callback.
      - just train uses configs/training.yaml, the 00-baseline recipe - ReXNet-200 on every 224 px triplet at 0.625 mm, reflection, sigma 40, four additive embeddings (1D position, 2D anchor, plane, contrast) and one attention softmax per label over all visually valid spatial tokens - on fold 0. Resume requires a new run ID and the saved configuration.
      - Creates a fresh timestamped run unless --run-id is supplied; existing run directories are never overwritten.
      - Records the preprocessing source identity and selected backbone spatial mapping in checkpoints and run/input provenance; prediction, validation, resume and export reject missing or mismatched identities. Historical checkpoints, including token-graph and crop-selection runs, require archived code or bundles.
      - Supports ReXNet-200 and CoAtNet RMLP-2 RW 224 spatial adapters; see the CoAtNet modeling notes for pooling anchors, checkpoint normalization and image-size constraints.
      - --limit-train is for small development executions and does not change complete validation.
      - The current all-study split validates the entire held-out fold and monitors macro AUC against frozen targets thresholded at 0.5, with separate gold diagnostics; training BCE keeps soft targets.
      - Writes fold_<N>/class_balance.json with observed, positive and negative counts and fixed whole-cell BCE weights derived from the actual selected training subset, damped by trainer.class_balance_exponent (0 gives plain BCE) and recorded as the table's exponent.
      - Defaults CUDA allocation to expandable segments unless PYTORCH_ALLOC_CONF or PYTORCH_CUDA_ALLOC_CONF is supplied; records the setting in provenance.
      - Saves the best checkpoint separately from last.ckpt, which is refreshed every epoch independently of validation improvement.
      - Honors model.pretrained for fresh runs; resume requires matching training settings and recorded input identities. Historical checkpoints require their archived implementation.
      - model.checkpoint_backbone requires model.backbone_eval (config validation), so activation checkpointing never runs with training-mode BatchNorm; resume never changes the saved setting.
      - Every input packs three consecutive slices (fixed, not configurable) and uses ImageNet mean/std; precision (BF16 mixed), one device and automatic accelerator selection are fixed in the trainer.
      - max_images counts raw slices and must be divisible by three; incomplete triplets are omitted and batch padding is masked before the CNN and study attention.
      - Writes provenance, a source snapshot (src, scripts, configs, docs, AGENTS.md, README.md, pyproject.toml, uv.lock) and, when every fold of the split is trained, OOF metrics from knee_abnormality.evaluation.scoring.
      - The baseline uses a ten-epoch budget with one warmup epoch and patience ten; training adds series-consistent gamma/contrast augmentation, disabled during validation and prediction.
    docs: [docs/modeling/current-model.md, docs/modeling/coatnet-224-spatial-backbone.md, docs/architecture/configs-and-experiment-artifacts.md#experiment-artifacts-and-reproducibility, docs/modeling/training-runtime-and-memory.md#batch-4-memory-fix, docs/history/baseline1-review.md#implemented-corrections]

  - id: predict-baseline
    path: scripts/pipeline/predict.py
    summary: Distribute complete studies across independent GPU processes for deterministic validation or offline test prediction, including multi-checkpoint ensemble bundles.
    tags: [predict, inference, submission, validation, checkpoint, offline, multi-gpu, processes, ensemble]
    commands:
      - rtk proxy uv run --locked just infer outputs/submission/exports/run-fold0
      - rtk proxy uv run --locked just validate outputs/training/run/effective_config.json outputs/training/run/fold_0/best.ckpt outputs/training/run/reproduced.csv
      - rtk proxy uv run --locked python -m scripts.pipeline.predict configs/training.yaml --checkpoint outputs/training/run/fold_0/best.ckpt --output outputs/training/run/submission.csv
      - rtk proxy uv run --locked env PYTHONPATH=outputs/submission/exports/run-fold0/code python -m scripts.pipeline.predict outputs/submission/exports/run-fold0/config.json --bundle outputs/submission/exports/run-fold0 --data-root data --output outputs/submission/submission.csv --device auto --precision auto --batch-size 4 --num-workers 16
      - rtk proxy uv run --locked env PYTHONPATH=outputs/submission/exports/run-fold0/code python -m scripts.pipeline.predict outputs/submission/exports/run-fold0/config.json --bundle outputs/submission/exports/run-fold0 --data-root data --label-manifest configs/labels/public-label-sources.json --output outputs/analysis/run-fold0-reproduced.csv --split validation --fold 0 --device cpu --precision fp32
      - rtk proxy uv run --locked python -m scripts.pipeline.predict configs/training.yaml --checkpoint outputs/training/run/fold_0/best.ckpt --output outputs/training/run/fold_0/reproduced.csv --split validation --fold 0
      - rtk proxy uv run --locked env PYTHONPATH=outputs/submission/exports/ensemble-5xb0/code python -m scripts.pipeline.predict outputs/submission/exports/ensemble-5xb0/config.json --bundle outputs/submission/exports/ensemble-5xb0 --data-root data --output outputs/submission/submission.csv --device auto --precision auto --batch-size 4 --num-workers 16
    inputs: [Experiment YAML or saved effective_config.json, Lightning checkpoint(s) with saved configuration and target order, Raw validation or test DICOMs and metadata]
    outputs: [Study-level validation predictions or submission CSV, Adjacent runtime JSON with per-device counts and timings]
    notes:
      - Constructs the backbone without downloading pretrained weights, then loads all model parameters from the checkpoint. A bundle exported from more than one checkpoint (see export-inference-bundle) loads every member once per worker and averages their per-label sigmoid probabilities on the same decoded batch; a one-checkpoint bundle or a direct --checkpoint path predicts exactly as before.
      - Test output is aligned to sample_submission.csv and preserves one row per requested study.
      - Validates input and model semantics, target order, and producing fold for validation; storage locations and inference runtime settings can differ. Ensemble members may use different model configs (including backbone) but must share the exact data config; export rejects a mismatch. Validating a mixed-fold ensemble against a single held-out fold correctly fails for any member not held out on that fold.
      - Checkpoints must match the executing preprocessing identity and config schema; historical checkpoints, including the pre-restructure 00-baseline weights, require their saved config and archived source or frozen bundle.
      - Accepts direct competition mounts or the repository data_root/raw layout and discovers test membership from the mounted submission template and series metadata.
      - Runtime overrides support batch size, workers, device and autocast precision. Auto uses native CUDA BF16, other CUDA FP16 and CPU FP32; explicit FP16 requires CUDA. Bundle batch size and worker budget default to their exported values.
      - Uses one independent process per visible GPU, or one CPU process; CUDA_VISIBLE_DEVICES limits GPU selection. Empty partitions are not launched.
      - Batch size counts studies per device; num-workers is the total CPU loader worker budget, divided across active processes. Repository inference defaults to four studies and sixteen workers (knee_abnormality.config constants); bundles use their recorded runtime values.
      - Partitions unique study IDs before collation, verifies complete output coverage and probabilities, restores requested study order, and atomically publishes the final CSV only after all workers succeed.
      - A worker failure or parent interruption terminates remaining worker process groups. Model execution belongs to predict-worker; scheduling and merging do not require distributed model wrappers.
      - Bundle mode verifies the manifest and all packaged file hashes before loading the frozen config and checkpoint; bundle configs must carry an inference section matching the manifest runtime. A single-checkpoint bundle keeps model.ckpt at the bundle root exactly as before; an ensemble bundle instead carries a models/ directory of member-NNN.ckpt files and manifest.json's plural checkpoints list.
      - A bundle's reflection_tta setting (export-inference-bundle's --reflection-tta, off by default) is read from the bundle's config.json inference section and manifest.runtime, with no separate predict-baseline flag; a bundle exported without it predicts exactly as before, byte for byte.
      - Test inference defaults to 2x image limits; validation uses its saved validation multiplier when run directly, but bundle mode always applies the multiplier frozen at export (test-time 2x by default) to both splits, so export a bundle with --image-multiplier 1 to reproduce true x1 validation scores. --image-multiplier changes repository inference, while bundles freeze this choice at export.
      - Test membership comes from the torch-free knee_abnormality.data.sources module.
      - Packaged validation reproduction also requires the original data root and an explicit label manifest because training labels and folds are not bundled.
    docs: [docs/modeling/INDEX.md, docs/inference/independent-gpu-inference-processes.md, docs/history/baseline1-review.md#implemented-corrections, docs/inference/model-bundle-and-offline-environment.md]

  - id: predict-worker
    path: scripts/pipeline/predict_worker.py
    summary: Execute one assigned study partition on an isolated GPU or CPU for the maintained prediction coordinator, running every ensemble member on the shared decoded batch.
    tags: [predict, inference, worker, process, gpu, pytorch, ensemble]
    commands:
      - rtk proxy uv run --locked python -m scripts.pipeline.predict_worker --help
    inputs: [Coordinator-generated validated request JSON, Checkpoint (file) or ensemble directory and matching config, Assigned study IDs, Raw images and metadata]
    outputs: [Worker prediction CSV, Worker runtime JSON, Worker process log]
    notes:
      - Invoked by predict-baseline with a fresh process and a single visible GPU; do not launch it as an additional inference job manually.
      - Owns PyTorch model loading and execution; preserves the shared preprocessing and predict_loader implementation. Loads one model per checkpoint file (a bundle's model.ckpt) or one per member (a bundle's models/ directory) and keeps every member resident for the life of the worker.
      - Loads fold labels or the test template once, then builds its dataset and loader in a background thread while the main thread loads the model(s). When precision resolves to FP16 (CUDA without native BF16, such as Kaggle T4s), it switches every member's backbone to channels-last, runs it in fixed zero-padded 64-image chunks and warms that chunk shape once per member on the main thread before the first batch.
      - Runs every loaded member's forward pass against the same decoded, device-resident batch and averages their per-label sigmoid probabilities; a single member is a no-op mean over one value, bit-identical to a plain forward pass. Recorded forward_seconds sums all members' compute for that batch.
      - When the request's reflection_tta is on, also runs every member a second time on the mirrored view of that same decoded batch (reflect_batch in knee_abnormality.inference.reflection mirrors the prepared batch for every reflection-eligible study and leaves ineligible studies unreflected) and averages each study's probabilities over whichever passes actually ran for it, in probability space after the sigmoid; off by default and a no-op change when off.
      - Records per-batch loader wait, transfer and forward time, setup times, member_count and peak GPU memory in its runtime JSON.
      - Each request records its per-device batch size, allocated loader workers, precision, checkpoint (or ensemble directory) and exact study membership.
      - Decodes request JSON before Python-mode validation so experiment path validators can return resolved Path values.
      - Export includes this entry point and hashes it alongside the prediction coordinator.
    docs: [docs/inference/independent-gpu-inference-processes.md]

  - id: export-inference-bundle
    path: scripts/pipeline/export.py
    summary: Export one or more scored training checkpoints as an atomic, portable inference bundle and notebook, averaging members' probabilities when more than one is given.
    tags: [export, inference, bundle, checkpoint, notebook, offline, wheels, manifest, ensemble]
    commands:
      - rtk proxy uv run --locked just export outputs/training/run/fold_0/best.ckpt outputs/submission/exports/run-fold0-3x 3
      - rtk proxy uv run --locked python -m scripts.pipeline.export --checkpoint outputs/training/run/fold_0/best.ckpt --output outputs/submission/exports/run-fold0-2x --wheel-dir outputs/submission/dependencies/kaggle-v170 --target-python 3.12 --target-platform manylinux_x86_64 --image-multiplier 2 --inference-batch-size 4 --inference-num-workers 16
      - rtk proxy uv run --locked python -m scripts.pipeline.export --checkpoint outputs/training/run/b0-fold0/fold_0/best.ckpt,outputs/training/run/b0-fold1/fold_1/best.ckpt,outputs/training/run/b0-fold2/fold_2/best.ckpt,outputs/training/run/b0-fold3/fold_3/best.ckpt,outputs/training/run/b0-fold4/fold_4/best.ckpt --output outputs/submission/exports/ensemble-5xb0 --wheel-dir outputs/submission/dependencies/kaggle-v170 --target-python 3.12 --target-platform manylinux_x86_64 --image-multiplier 2 --inference-batch-size 4 --inference-num-workers 16
      - rtk proxy uv run --locked python -m scripts.pipeline.export --checkpoint outputs/training/run/b0-fold0/fold_0/best.ckpt,outputs/training/run/b0-fold1/fold_1/best.ckpt,outputs/training/run/b0-fold2/fold_2/best.ckpt,outputs/training/run/b0-fold3/fold_3/best.ckpt,outputs/training/run/b0-fold4/fold_4/best.ckpt,outputs/training/run/rexnet-fold0/fold_0/best.ckpt,outputs/training/run/rexnet-fold1/fold_1/best.ckpt,outputs/training/run/rexnet-fold2/fold_2/best.ckpt,outputs/training/run/rexnet-fold3/fold_3/best.ckpt,outputs/training/run/rexnet-fold4/fold_4/best.ckpt --output outputs/submission/exports/ensemble-10x-mixed --wheel-dir outputs/submission/dependencies/kaggle-v170 --target-python 3.12 --target-platform manylinux_x86_64 --image-multiplier 2 --inference-batch-size 4 --inference-num-workers 16
    inputs: [One or more explicit scored Lightning checkpoints, Current frozen prediction source, Notebook template scripts/pipeline/inference.ipynb, Optional prepared wheel directory, Target Python and platform identity]
    outputs: [Versioned inference bundle with checkpoint(s), portable config, manifest, source, requirements, wheels, licenses, and notebook]
    notes:
      - --checkpoint takes a comma-separated list (the repository's list-CLI convention, matching --folds elsewhere); one checkpoint keeps today's single-model bundle unchanged bit for bit (model.ckpt at the bundle root, manifest.json's singular checkpoint record). More than one checkpoint builds an ensemble bundle instead, with model-NNN files under models/ and manifest.json's plural checkpoints list; predict-baseline loads every member once per worker and averages their per-label probabilities on the same decoded batch, so extra members are close to free until their combined forward time exceeds loader wait (see docs/inference/2026-09-18-kaggle-x4-profile-after-index-changes.md).
      - Every member must share the exact data config (spacing_mm, image_size, series_types, study_triplet_total, sampling_sigma_fraction and the rest of the data section); export refuses a mismatch and names the differing field. The model section, including backbone, may differ per member since spatial token mapping is backbone-specific. Members may come from different folds (a cross-fold test-time ensemble); validating an ensemble against one held-out fold correctly fails for any member not held out on that fold.
      - Records the physical sampling identity, selected backbone spatial mapping and existing SciPy runtime dependency per member; validates bundled sources against each member's saved backbone. Historical checkpoints require archived source.
      - just export accepts checkpoint, output, optional image multiplier and per-device batch size, then wheel directory, target runtime and total loader workers; defaults use 2x images, four studies per GPU, Kaggle v170 codec wheels, Python 3.12 and sixteen total loader workers. just export takes one checkpoint path; pass a comma-separated list directly to the module for an ensemble.
      - Requires at least one explicit, distinct checkpoint path, rejects existing destinations, builds in a temporary sibling directory, and publishes only after reconstructing every member's model strictly from its exported checkpoint state and hashing every artifact. Each checkpoint is read once.
      - Retains model state and required semantic metadata while removing optimizer, scheduler, callback and loop state.
      - --attention-temperature accepts one value (applied to every member) or exactly one value per checkpoint (matched by position). A one-member bundle applies it at load time exactly as before. An ensemble bundle bakes each member's temperature into its exported weights at export time (dividing the attention scorer's weight and bias once, the same operation applied at load time today) and always records runtime.attention_temperature=1.0, an honest no-op, since the scaling already happened; per-member baked values are recorded in each manifest.checkpoints[i].attention_temperature entry.
      - --reflection-tta (off by default) turns on mirror test-time augmentation for prediction. Each member also runs once on the reflected view of the same decoded batch, forcing reflection for every reflection-eligible study (reflect_batch in knee_abnormality.inference.reflection mirrors the prepared batch; eligibility is the per-study flag already computed per series at load time, not sampled) and leaving reflection-ineligible studies unreflected. Recorded in manifest.runtime.reflection_tta and the bundle's config.json inference.reflection_tta for both one-member and ensemble bundles, so predict-baseline and predict-worker apply it with no extra flag; predict-baseline's bundle verification (knee_abnormality.inference.bundle.verify_bundle) rejects a config/manifest mismatch. Off, export and prediction stay byte-identical to before, for both N=1 and N>1 members.
      - Export runs no local inference; readiness requires target-runtime information, DICOM codec wheels and strict checkpoint reconstruction per member. Source correspondence with the training snapshot is recorded separately per member for ensembles. For a manual parity check of a finished bundle, use verify-inference.
      - Copies the notebook unchanged from scripts/pipeline/inference.ipynb; one bundled-file list (the package plus both prediction entry points), shared by every member, drives both the copy and the training-snapshot comparison.
      - --image-multiplier freezes inference density without rewriting checkpoint training settings; --image-multiplier, --inference-batch-size and --inference-num-workers default to the knee_abnormality.config inference constants (2, 4 studies per GPU, 16 total loader workers). Bundle-mode prediction applies this frozen multiplier to both the test and validation splits, so export with --image-multiplier 1 to reproduce true x1 validation scores locally.
      - Bundles both prediction entry points and records the process policy, worker budget and automatic precision policy (native CUDA BF16, other CUDA FP16 with warmed fixed backbone chunks, CPU FP32); inference source changes are recorded separately from strict model/preprocessing identity checks.
      - Performs no training, upload, notebook execution or submission.
    docs: [docs/inference/fast-submission-preparation.md, docs/inference/model-bundle-and-offline-environment.md#model-bundle-and-offline-environment]

  - id: submit-inference-bundle
    path: scripts/pipeline/submit.py
    summary: Version a private bundle dataset, run an offline Kaggle notebook, verify its output and submit the exact successful notebook version.
    tags: [submit, kaggle, dataset, notebook, offline, competition, score, provenance]
    commands:
      - rtk proxy uv run --locked just submit outputs/submission/exports/run-fold0 OWNER/knee-fold0-bundle OWNER/knee-inference outputs/submission/records/run-fold0.json "ens-5xb0 + mirror TTA"
      - rtk proxy uv run --locked python -m scripts.pipeline.submit --bundle outputs/submission/exports/run-fold0 --dataset OWNER/knee-fold0-bundle --notebook OWNER/knee-inference --record outputs/submission/records/run-fold0.json --label "ens-5xb0 + mirror TTA"
    inputs: [Ready bundle with valid file hashes, Explicit Kaggle dataset ID, Explicit Kaggle notebook ID, Kaggle credentials and competition access]
    outputs: [Private dataset version, Offline notebook version, Verified notebook output, Competition submission, Incremental JSON workflow record]
    notes:
      - just submit launches the maintained workflow in a detached user service; just submit-foreground is the explicit blocking variant. Monitor with just submit-status, submit-logs or submissions.
      - Refuses unready bundles, existing record paths and overlapping notebook runs.
      - Takes one --label of 2 to 45 characters, counts the existing competition submissions and builds the sequence number, the shared dataset and notebook title "S<nn> <label>" and the unified submission description from the bundle manifest. A 52-character notebook title failed SaveKernel with HTTP 400 on 2026-09-15, so the label bound keeps every title inside 50 characters.
      - The description is the only text Kaggle keeps for a submission and cannot be edited afterwards, so the label has to be right before launching.
      - The count only sees submissions already on Kaggle, so a submission launched while another is still running would reuse its number; pass --sequence to set it explicitly.
      - Records each remote response before advancing; notebook failure or invalid submission.csv prevents competition submission.
      - Records timestamped stage transitions in history and prints them for detached runner logs; queue and scoring intervals include polling delay.
      - Downloads and validates the saved notebook output before submitting that exact notebook version, then records available status and scores.
    docs: [docs/inference/kaggle-submission-workflow.md#control-the-workflow-from-the-local-cli, docs/inference/submissions/ledger.md#naming]
