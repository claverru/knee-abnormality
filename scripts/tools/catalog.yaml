version: 1
scripts:
  - id: autoresearch
    path: scripts/tools/autoresearch.py
    summary: Validate, run, inspect macro and per-label results, backfill label diagnostics, and account for local autoresearch campaigns through Codex or Claude subscriptions.
    tags: [autoresearch, campaigns, losses, sampling, triplets, background, train, validation, bootstrap, per-label, codex, claude, progress, results, auc, usage, tokens, cost]
    commands:
      - rtk proxy uv run --locked just autoresearch-start codex
      - rtk proxy uv run --locked just autoresearch-start claude
      - rtk proxy uv run --locked python -m scripts.tools.autoresearch validate losses
      - rtk proxy uv run --locked just autoresearch-start claude losses
      - rtk proxy uv run --locked just autoresearch-status losses
      - rtk proxy uv run --locked just autoresearch-status
      - rtk proxy uv run --locked just autoresearch-results triplet-sampling
      - rtk proxy uv run --locked python -m scripts.tools.autoresearch results losses
      - rtk proxy uv run --locked python -m scripts.tools.autoresearch backfill-labels losses
      - rtk proxy uv run --locked python -m scripts.tools.autoresearch usage
      - rtk proxy uv run --locked just autoresearch-stop
      - rtk proxy uv run --locked just autoresearch-resume
      - rtk proxy uv run --locked python -m scripts.tools.autoresearch import-ideas --ideas-file autoresearch/campaigns/triplet-sampling/seed-ideas.yaml
    inputs: [autoresearch campaign contract and role profiles, Existing fold-0 control, Local data and cached pretrained weights, Subscription-authenticated CLI, Linux bubblewrap and NVIDIA GPU]
    outputs: [Durable campaign state and detached job receipts, Frozen candidate sources and local training artifacts, Ranked backlog and attributed findings, Read-only metric progress and complete experiment results, Focused evidence packets and usage by role event and experiment]
    notes:
      - Start authorizes ongoing local training and validation only; submissions and publication are prohibited.
      - Reuses only scripts.pipeline.train and scripts.tools.compare_fold_runs; includes a one-time CPU replay to seal realized triplet counts without another trained model.
      - Runtime is capped at 115 percent of the initial historical control total, with fixed epochs, optimizer steps, and zero triplet-count tolerance.
      - Stop drains active training; --abort terminates it. Resume adopts owned live jobs and never automatically repeats a lost training attempt.
      - Quota and unexpected role failures pause the campaign without model polling; resolve the cause and resume.
      - Report prose lengths and concern/reference counts are advisory targets; full content is retained without formatting-only retries, while structured actions and campaign gates remain strict.
      - Proposal admission requires every dependency to be provisionally accepted and still active in the incumbent; replaced methods remain historical evidence and do not satisfy behavioral prerequisites.
      - Prepared candidates declare retained, added and removed components; acceptance tracks active idea IDs, and every incumbent change requires developer integration assessment plus renewed review, including clean merges.
      - Approval binds parent, candidate, integration and evidence fingerprints; launch rechecks it and waits for outstanding comparison or decision work. Watched external results trigger renewed review, never automatic cross-campaign adoption.
      - Status prints a human-readable progress summary without model calls; the campaign has no overall run-count, elapsed-time, or plateau stop condition.
      - Status includes starting and incumbent AUC, retained experimental gain and latest scores; results lists every decided experiment with its actual reference, exact score delta and paired interval, preserving withdrawals and separating manual reference changes.
      - Results and agent context include per-label AUC and paired report-group bootstrap intervals as unadjusted exploratory diagnostics; only macro AUC determines acceptance.
      - Backfill-labels verifies saved data and predictions and appends missing comparison/per_label.json artifacts without retraining or changing historical decisions. New comparison jobs include diagnostic CPU time in the original budget and record the macro 80% interval used with the >=0.001 adoption threshold, alongside the 95% diagnostics.
      - Usage is read-only and includes failed calls with explicit partial or unavailable coverage; cost equivalents do not measure subscription quota.
      - Startup reviews seed-ideas.yaml before fresh research; import-ideas requires a stopped campaign and submits existing proposals for orchestrator ranking without replacing the queue.
      - New topics declare source/configuration permissions and role instructions in campaign.yaml; the policy is validated and sealed, without runner edits or legacy hardcoded fallbacks.
      - Validate checks campaign policy, initial proposals and saved-control recipe compatibility without model calls, GPU work, or training. Omitting a campaign ID defaults to triplet-sampling.
      - Routine rejected/inconclusive completions can use Haiku 4.5 or Luna low with code-owned eligibility and no decision authority; concerns escalate to the orchestrator, with both calls included in usage.
    docs: [autoresearch/README.md, autoresearch/runtime.md, autoresearch/campaign-setup.md, autoresearch/campaigns/triplet-sampling/contract.md, autoresearch/campaigns/losses/contract.md]

  - id: autoresearch-watch
    path: scripts/tools/autoresearch_watch.py
    summary: Monitor an existing campaign without model polling and dispatch bounded Codex repairs only for operational failures.
    tags: [autoresearch, watchdog, monitor, recovery, repair, background, tokens, codex]
    commands:
      - rtk proxy uv run --locked python -m scripts.tools.autoresearch_watch start medial-lateral-transfer
      - rtk proxy uv run --locked python -m scripts.tools.autoresearch_watch status medial-lateral-transfer
      - rtk proxy uv run --locked python -m scripts.tools.autoresearch_watch stop medial-lateral-transfer
    inputs: [Existing campaign state and process identities, Codex subscription login, Existing Codex orchestrator profile]
    outputs: [Detached watcher status, Incident-specific repair logs and usage, Verified supervisor resume or recorded blocker]
    notes:
      - Enabling the watcher authorizes bounded operational repairs and resume for that campaign; healthy minute checks use no model calls.
      - Uses the existing Codex orchestrator profile with a workspace-write sandbox and no API fallback. Research still uses the campaign's configured provider.
      - Pauses or supervisor loss trigger recovery after active jobs drain. Each incident gets one model call capped at fifteen minutes; repeated failures or three total repair attempts stop automatic recovery.
      - Deliberate campaign stops are respected. Quota failures, scientific decisions and sealed-input changes require a blocker rather than automatic modification.
      - Logs and token usage live under the campaign's watchdog directory, separately from normal campaign usage.
      - Status checks operational liveness; it does not prove scientific validity or detect every hang inside a live worker.
    docs: [autoresearch/watchdog.md]

  - id: prepare-tonylin-labels
    path: scripts/tools/prepare_tonylin_labels.py
    summary: Reproduce preparation of the audited Tonylin soft columns for the completed label-source experiment.
    status: historical
    tags: [labels, tonylin, soft, preparation, training, provenance, folds]
    commands:
      - rtk proxy uv run --locked python -m scripts.tools.prepare_tonylin_labels --help
      - rtk proxy uv run --locked python -m scripts.tools.prepare_tonylin_labels
    inputs: [configs/labels/public-label-comparison-sources.json, Pinned Tonylin release-3 CSV and metadata, Official training metadata, Experiment config and existing split]
    outputs: [data/labels/prepared/tonylin-soft-v3/labels.csv, data/labels/prepared/tonylin-soft-v3/preparation.json, configs/labels/tonylin-label-sources.json]
    notes:
      - Selects and renames only the twelve *_soft columns; preserves values and ignores the publisher's folds and hard labels.
      - Loads real fold-label tables through the training loader without pixels, model execution, training or tests.
      - Preserves existing split files and the input YAML; requires fresh output directory and manifest paths, so rerunning it needs new --output-dir and --output-manifest values.
      - Tonylin scored 0.921 publicly versus Steven v4's 0.929; the baseline returned to Steven and this utility is retained for reproduction.
    docs: [docs/modeling/supervision.md#training-with-tonylin-soft-labels]

  - id: prepare-combined-labels
    path: scripts/tools/prepare_combined_labels.py
    summary: Build the combined_v1 label table (Steven v4 plus a nine-source consensus mean for ACL, MCL, PF OA and Fracture) and its pinned manifest.
    tags: [labels, combined, consensus, ensemble, steven, public, preparation, training, provenance, mcl, fracture, acl, pf-oa]
    commands:
      - rtk proxy uv run --locked python -m scripts.tools.prepare_combined_labels
      - rtk proxy uv run --locked python -m scripts.tools.prepare_combined_labels --output-dir /tmp/combined-check --output-manifest /tmp/combined-check.json
    inputs: [configs/labels/public-label-sources.json for Steven v4, configs/labels/public-label-comparison-sources.json for Pilkwang, Laymond and Zhen, 2026-09-21 label snapshots under data/labels/public/<owner>/<slug>/downloaded-20260921, Official training IDs]
    outputs: [data/labels/prepared/combined-v1/labels.csv, data/labels/prepared/combined-v1/preparation.json, configs/labels/combined-label-sources.json]
    notes:
      - Deterministic; the prepared table's SHA-256 is 1e586b574511fa1c67434e174681eee9a3aafe0d6db8f84cb829fdae5be215fb.
      - The manifest lists steven_v4 and combined_v1, so labels.source can select either with one manifest.
      - Requires fresh output paths; gold labels override the table in training and evaluation.
      - consensus_sources is shared with the adhoc selection analysis.
    docs: [docs/public-labels/combined-labels.md]

  - id: compare-fold-runs
    path: scripts/tools/compare_fold_runs.py
    summary: Compare a candidate fold run with a reference run from saved predictions and checkpoint tensors, with paired report-group bootstrap intervals.
    tags: [compare, comparison, validation, fold, auc, bce, gold, bootstrap, margin, cross-talk, compartment, vendor, strata, epochs, timing, memory]
    commands:
      - rtk proxy env CUDA_VISIBLE_DEVICES= POLARS_MAX_THREADS=1 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 uv run --locked python -m scripts.tools.compare_fold_runs --reference outputs/training/overnight-20260914T220805Z-ozsz4qbu/runs/00-baseline --candidate outputs/training/overnight-20260914T220805Z-ozsz4qbu/runs/03-min-lr-0.1 --output-dir outputs/analysis/min-lr-0.1-vs-00-baseline --allowed-config-differences name,optimizer.minimum_lr_ratio
    inputs: [Reference and candidate run directories, Frozen fold targets and membership, Saved study headers parquet with vendor]
    outputs: [Comparison JSON with input, run and source fingerprints, Analysis source copies under source/ with repository-relative paths]
    notes:
      - CPU only; reads checkpoints raw (unvalidated) and loads saved predictions and checkpoint tensors without model construction, so it compares runs from retired model code.
      - --headers defaults to outputs/analysis/sharing-disagreement-20260914/study_headers.parquet, the per-study vendor table from the sharing disagreement audit.
      - Rejects configuration differences outside --allowed-config-differences (dotted keys or prefixes; default name) and input identity differences outside --allowed-input-identity-differences.
      - Reports selected epochs, full-fold and per-target AUC, BCE, gold and report-derived metrics, family means, exclusive-positive margins, lateral cross-talk, vendor strata with supports, prediction changes, epoch curves, timing and peak memory, parameters present in only one run and changed src/configs archive members.
      - Uses paired report-group bootstrap intervals for all targets, the meniscus and OA pairs, the other eight targets and both margins; intervals exclude training-seed and checkpoint-selection variability.
      - Output directory must be fresh; selected predictions must reproduce the recorded prediction_macro_auc in selected_checkpoint.json, or the selected epoch's macro AUC for runs that predicted at the validation multiplier and record none.
      - Runs whose validation.prediction_image_multiplier differs are rejected unless that key is allowed; compare x4-predicted runs with x4-predicted references (see repredict-run).
    docs: [docs/validation/fold-run-comparison.md]

  - id: repredict-run
    path: scripts/tools/repredict_run.py
    summary: Derive a new run directory from a completed training run whose selected checkpoint's validation predictions are remade at another image multiplier at attention temperature 1, so older runs can be compared or sealed as references under x4 predictions.
    tags: [predict, prediction, validation, multiplier, x4, rerun, reference, autoresearch, comparison, derived, run]
    commands:
      - rtk proxy uv run --locked python -m scripts.tools.repredict_run --run outputs/training/k_05 --output outputs/training/k_05-x4 --image-multiplier 4
    inputs: [Completed run directory with effective_config.json, selected_checkpoint.json, timing.json and the selected checkpoint, Original DICOMs and the frozen split]
    outputs: [New run directory with the source's files, the selected checkpoint hard-linked, validation.prediction_image_multiplier set in effective_config.json, new validation_predictions.csv, selected_checkpoint.json with prediction_image_multiplier and prediction_macro_auc, timing.json with the new prediction time, and repredicted.json recording the source]
    notes:
      - Uses the GPU for one validation pass (about 70 s at x4 on fold 0); check GPU usage first.
      - Runs with the current sources, so the run's preprocessing identity must match them; older runs need their archived sources.
      - Refuses an existing output; the source run is never modified. Epoch metrics, logs and the ×1 epoch score stay as trained.
      - Predictions match what scripts.pipeline.train now writes at the same multiplier (same loader batch size and temperature 1).
    docs: [docs/validation/fold-run-comparison.md]

  - id: plot-validation-metrics
    path: scripts/tools/plot_validation_metrics.py
    summary: Plot epoch validation metrics from one or more completed experiment run folders.
    tags: [plot, validation, metrics, auc, bce, experiments, comparison, runs]
    commands:
      - rtk proxy uv run --locked python -m scripts.tools.plot_validation_metrics baseline0 baseline1 baseline4
      - rtk proxy uv run --locked python -m scripts.tools.plot_validation_metrics outputs/training/baseline0 outputs/training/baseline4 --output outputs/analysis/baselines.png
    inputs: [Run folders under outputs/training/ containing fold epoch metric JSON files]
    outputs: [PNG comparison plot of validation macro AUC, gold macro AUC, per-target AUC at the best epoch and soft-target BCE]
    notes:
      - Each run name resolves relative to outputs/training/ unless it is an existing folder path.
      - Runs with several folds produce one line per fold.
      - The per-target panel draws the 12 target AUCs at each series best macro-AUC epoch as grouped bars, with a dashed horizontal line at that epoch macro AUC.
      - Per-target bars start at the 0.05 step below the lowest plotted AUC, stated in the axis label; one or two series also get value labels.
      - Undefined gold macro AUCs appear as gaps; full-validation AUC, BCE and per-target AUCs must be numeric.
      - The default output is outputs/analysis/validation_metrics.png and is overwritten on every run.
    docs: [docs/validation/plot-validation-metrics.md]

  - id: submission-job
    path: scripts/tools/submission_job.py
    summary: Launch a detached submission service or inspect its saved status, stage durations and runner logs.
    tags: [submit, background, systemd, progress, logs, timing, kaggle]
    commands:
      - rtk proxy uv run --locked just submit outputs/submission/exports/run-fold0 OWNER/knee-fold0-bundle OWNER/knee-inference outputs/submission/records/run-fold0.json "ens-5xb0 + mirror TTA"
      - rtk proxy uv run --locked just submit-status outputs/submission/records/run-fold0.json
      - rtk proxy uv run --locked just submit-logs outputs/submission/records/run-fold0.json
      - rtk proxy uv run --locked python -m scripts.tools.submission_job --help
    inputs: [Ready bundle for start, Kaggle dataset and notebook IDs for start, Unique workflow record path, Existing workflow record or runner log for inspection]
    outputs: [Detached user systemd service for start, JSON status and stage durations, Runner log excerpt or explicit live follow]
    notes:
      - Start verifies bundle hashes and readiness without local inference, then returns after systemd accepts the service; execution and submission remain in scripts.pipeline.submit.
      - Start requires --label and passes it through; the sequence number, titles and submission description are built in scripts.pipeline.submit and reported by status.
      - Requires Linux user systemd for start and the current project environment; quotes arguments through subprocess arrays and rejects existing records or logs.
      - Status and logs also read older manually launched runners using the matching record-stem-runner.log convention.
      - Logs return the last 60 lines by default; only explicit --follow waits for more output. Stage durations include polling delay and are not official hidden-test execution time.
    docs: [docs/inference/justfile-recipes.md]

  - id: verify-inference
    path: scripts/tools/verify_inference.py
    summary: Manually check a bounded real-study parity sample, FP32 inference memory and example output of an exported bundle using the bundle's own source.
    tags: [inference, verify, parity, sample, vram, export, submission, bundle]
    commands:
      - rtk proxy uv run --locked python -m scripts.tools.verify_inference --help
      - rtk proxy uv run --locked env PYTHONPATH=outputs/submission/exports/run-fold0/code python -m scripts.tools.verify_inference --bundle outputs/submission/exports/run-fold0 --request-file outputs/submission/verification/run-fold0-request.json
    inputs: [Exported bundle with the current package layout, Request JSON, Saved epoch predictions, Local validation and example DICOMs, Native BF16 CUDA device]
    outputs: [verification_sample.csv, verification_example.csv and verification.json written inside the bundle]
    notes:
      - Run from the repository root with PYTHONPATH set to the bundle's code directory; it refuses to run unless knee_abnormality is imported from that directory. Export no longer invokes it, and writing the three files changes the bundle inventory, so run it on a copy when the bundle must still verify.
      - The request JSON holds config (the checkpoint's saved experiment config with local paths), reference_csv (the fold's saved validation_epoch_NNN.csv), samples, image_multiplier, batch_size, checkpoint_sha256, bundled_source_sha256 and codec_evidence (recorded as given).
      - Complexity ranking estimates overlapping triplet capacity; actual geometry-constrained counts come from preparation.
      - Preserves complete original validation batches selected across low and high input counts; samples=16 selects about 16 studies.
      - Compares saved predictions at their original density, then checks the requested inference density separately without reporting sample AUC.
      - Uses the existing checkpoint without training; source, checkpoint, multiplier and verified codec identities are recorded.
      - Works against an ensemble bundle (a models/ directory of members) the same way as a single-checkpoint bundle (model.ckpt); it loads every member and compares the averaged prediction to the reference CSV.
    docs: [docs/inference/fast-submission-preparation.md]

  - id: script-catalog
    path: scripts/tools/catalog.py
    summary: Find existing scripts by purpose and check catalog coverage and references.
    tags: [scripts, discovery, search, index, maintenance]
    commands:
      - rtk proxy uv run --locked python -m scripts.tools.catalog search --query labels
      - rtk proxy uv run --locked python -m scripts.tools.catalog show --id validation
      - rtk proxy uv run --locked python -m scripts.tools.catalog check
    inputs: [scripts/**/catalog.yaml, Script and documentation paths]
    outputs: [JSON results on stdout]
    notes:
      - Reads metadata and checks filesystem paths without importing or executing indexed scripts.
    docs: [docs/architecture/script-catalog.md]

  - id: download-data
    path: scripts/tools/download_data.py
    summary: Download and extract the Kaggle MRI archive with bounded disk use and resumable chunks.
    tags: [data, kaggle, mri, download, acquisition, resume, zip]
    commands:
      - rtk proxy uv run --locked python -m scripts.tools.download_data --help
      - rtk proxy uv run --locked python -m scripts.tools.download_data
    inputs: [Kaggle credentials and accepted competition rules, Remote competition ZIP archive]
    outputs: [data/raw/, data/raw/.download/]
    notes:
      - Uses network access and substantial disk space; defaults to a 50 GiB free-space reserve.
      - Override storage with --data-dir; resume state belongs to that destination.
    docs: [docs/data-preparation/downloading-and-extracting-images.md]

  - id: validation
    path: scripts/tools/validation.py
    summary: Create scanner-stratified report-group folds with full and gold target coverage and score complete OOF predictions with separate gold diagnostics.
    tags: [validation, folds, split, gold, silver, reference, oof, auc, score, leakage, scanner, vendor, field-strength, stratification]
    commands:
      - rtk proxy uv run --locked python -m scripts.tools.validation --help
      - rtk proxy uv run --locked python -m scripts.tools.validation prepare --label-source combined_v1
      - rtk proxy uv run --locked python -m scripts.tools.validation score --predictions outputs/training/run/oof_predictions.csv
    inputs: [Experiment config, Official training and submission CSVs, Pinned label source from the config manifest, Per-study scanner header table for preparation, Saved split and OOF CSV for scoring]
    outputs: [data/folds/all_5fold_scanner_v1/ with studies.csv and frozen targets.csv plus full and gold label_counts.csv for prepare, JSON metrics on stdout for score]
    notes:
      - Preparation refuses conflicting existing artifacts; use a new --split-dir for a revised protocol.
      - Preparation stratifies report groups using positive and negative effective-label and gold-only target indicators, one indicator per scanner group, plus is_gold. Duplicate reports remain in one fold.
      - Scanner groups split Siemens, Philips and GE into 3T, 1.5T and unknown field strength and pool the other vendors as minor; --scanner-table defaults to the sharing-disagreement study_headers.parquet, whose hash the protocol records.
      - --label-source picks the evaluation and stratification labels (default the config's training source); the current split uses combined_v1.
      - The folder name is chosen by the config's validation.split or --split-dir; all_5fold_v3 was produced before scanner stratification and remains for historical runs.
      - Preparation rejects insufficient report-group support and any assignment missing a positive or negative class for a full-fold or gold target before saving artifacts.
      - Training retains soft labels; AUC binarizes frozen evaluation targets at 0.5 and reports gold and report-derived diagnostics separately. A gold macro AUC is null if any target lacks both classes.
      - Scoring requires every assigned study exactly once with saved fold IDs and twelve prediction columns and accepts only split protocol version 2; the scorer and its protocol checks live in knee_abnormality.evaluation.scoring and knee_abnormality.data.labels, shared with training's OOF scoring.
    docs: [docs/validation/project-validation-protocol.md#reproduce-and-score]

  - id: preview-augmentations
    path: scripts/tools/preview_augmentations.py
    summary: Browse study-coherent reflection and other augmentations with source geometry and optional bounded CUDA profiling.
    tags: [preview, augmentation, reflection, geometry, profiling, cuda, kornia, affine, noise, gamma, contrast, image, visualization, plane, mri, triplet, channel]
    commands:
      - rtk proxy uv run --locked python -m scripts.tools.preview_augmentations configs/training.yaml --output-dir outputs/previews/triplet-augmentations-new
      - rtk proxy uv run --locked python -m scripts.tools.preview_augmentations configs/training.yaml --seed 100 --variants 6 --output-dir outputs/previews/augmentations-seed100
      - rtk proxy uv run --locked python -m scripts.tools.preview_augmentations configs/training.yaml --sampling training --epoch 2 --output-dir outputs/previews/training-augmentations-epoch2
      - rtk proxy uv run --locked python -m scripts.tools.preview_augmentations configs/training.yaml --variants 1 --profile-cuda true --output-dir outputs/previews/reflection-profile-new
    inputs: [Experiment config, Example-test or fold-0 validation DICOMs and metadata, Optional existing geometry header audit]
    outputs: [Offline preview.html, overview.png, effective_config.json, manifest.json, Recursive project-relative source snapshot]
    notes:
      - Displays physical/local sampling, Gaussian width, selected source paths, actual triplets, channel appearances and unique slices.
      - CPU previews require no checkpoint or GPU; --split validation requires the prepared fold labels. --profile-cuda true adds bounded GPU augmentation-only timing and memory measurements without a backbone or optimizer.
      - Defaults to example-test studies; --split validation, --offset and --max-studies bound validation examples. --study-uid restricts either split. Unavailable coverage categories are recorded.
      - Defaults to deterministic validation sampling; --sampling training and --epoch preview the actual seeded training sampler on example-test studies. Series dropout is not previewed.
      - Keeps all selected acquisitions separately selectable within each plane/contrast, with centered physical positions and the shared type budget when configured.
      - HTML and overview default to forced eligible pure study reflection; combined forced/sampled augmentation remains selectable. Reflection decisions synchronize across all acquisitions in a study.
      - Each sampled variant uses one advancing seeded CPU generator for study reflection and acquisition augmentation draws; gates consume separate random values.
      - Displays fixed-scale triplet RGB or grayscale channels before normalization, source-channel correspondence, signed positions, LPS anchors centered on the preview's own study reference, visual and geometry validity, eligibility and source laterality from the optional --geometry-headers audit.
      - Records per-acquisition transform parameters, pixel-noise seeds and Kornia versions; geometry and noise strength are shared across triplets while pixel noise is independent.
      - The manifest records the preprocessing identity with the configured backbone's spatial mapping without constructing the backbone.
      - LPS anchors come from each prepared series' middle-slice patient maps, which the model does not use.
      - Records raw-slice and CNN-input counts separately; triplet positions identify middle slices. CPU random draws need not match CUDA draws with the same seed.
      - Refuses existing output directories; choose a new --output-dir for each regenerated preview.
    docs: [docs/data-preparation/preview-augmentations.md]
