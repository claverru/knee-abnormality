[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knee-abnormality"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kornia==0.8.3",
    "kornia-rs==0.1.14",
    "lightning-utilities==0.15.3",
    "numpy==2.0.2",
    "pillow==11.3.0",
    "polars==1.35.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pydicom==3.0.2",
    "pytorch-lightning==2.6.5",
    "pyyaml==6.0.3",
    "scikit-learn==1.6.1",
    "scipy==1.16.3",
    "timm==1.0.26",
    "torch==2.10.0+cu128",
    "torchmetrics==1.9.0",
    "torchvision==0.25.0+cu128",
    "tqdm==4.67.3",
]

[dependency-groups]
dev = [
    "plotly==7.1.0",
    "ruff==0.16.6",
    "rust-just==1.58.0",
]
notebooks = [
    "ipykernel==6.17.1",
    "matplotlib==3.10.0",
]
tools = [
    "iterative-stratification==0.1.9",
    "kaggle==2.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["knee_abnormality*"]
namespaces = false

[tool.uv]
default-groups = ["dev", "notebooks", "tools"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
