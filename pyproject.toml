[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knee-abnormality"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection experiments"
requires-python = ">=3.13,<3.14"
dependencies = [
    "einops==0.8.1",
    "kornia==0.8.3",
    "kornia-rs==0.2.0",
    "lightning-utilities==0.15.3",
    "mamba-ssm==2.3.2.post1",
    "mambavision==1.2.0",
    "numpy==2.1.3",
    "pillow==12.3.0",
    "polars==1.35.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pydicom==3.0.2",
    "pytorch-lightning==2.6.6",
    "pyyaml==6.0.3",
    "scikit-learn==1.6.1",
    "scipy==1.16.3",
    "timm==1.0.29",
    "torch==2.11.0+cu128",
    "torchmetrics==1.9.0",
    "torchvision==0.26.0+cu128",
    "tqdm==4.67.3",
]

[dependency-groups]
dev = [
    "plotly==7.1.0",
    "ruff==0.16.6",
    "rust-just==1.58.0",
]
notebooks = [
    "ipykernel==6.17.1",
    "matplotlib==3.10.0",
]
tools = [
    "iterative-stratification==0.1.9",
    "kaggle==2.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["knee_abnormality*"]
namespaces = false

[tool.uv]
default-groups = ["dev", "notebooks", "tools"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
mamba-ssm = { url = "https://wheels.astral.sh/artifacts/7c7287b40ba7d6d8b1cbff5f890090d272576bde98df3f8be51eda90b2002b3a/mamba_ssm-2.3.2.post1+cu.12.8.torch.2.11-cp313-cp313-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl" }

[[tool.uv.dependency-metadata]]
name = "mamba-ssm"
version = "2.3.2.post1+cu.12.8.torch.2.11"
requires-dist = ["einops", "torch", "triton"]

[[tool.uv.dependency-metadata]]
name = "mambavision"
version = "1.2.0"
requires-dist = ["einops", "mamba-ssm", "timm"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
