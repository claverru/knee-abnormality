- id: plane-attention-entropy-auxiliary
  mechanism_id: plane-attention-regularization
  parent_idea_id: null
  title: Regularize attention concentration within each plane while retaining dense
    supervision and learned fusion
  opportunity: Dense supervision improved the plane-backbone baseline, but the incumbent
    remains 0.005698 below ReXNet. Its active plane readouts do not establish whether
    attention extracts evidence broadly enough within each plane. Excessive attention
    concentration is an unmeasured hypothesis with a relevant MIL research precedent.
    A training-only regularizer can investigate this without changing pooling definitions,
    plane assignments, heads or inference.
  mechanism: For each observed study-label and present plane, use the attention probabilities
    already computed after anatomical bias, meniscus masking and fallback. Let N be
    the number of allowed tokens and H=-sum(alpha*log(alpha)). Define R=1-H/log(N)
    for N>1 and R=0 for N=1. Add 0.05 times the observed-cell mean of the original-target
    class weight multiplied by the present-plane mean of R. Compute entropy in float32
    with zero-probability contributions defined as zero. Backpropagate through the
    existing attention computation. Retain dense BCE and detached-logit fusion BCE
    unchanged. The added objective encourages broader evidence extraction within each
    allowed plane; its normalized contribution is bounded between zero and 0.05 times
    the cell weight.
  precedents:
