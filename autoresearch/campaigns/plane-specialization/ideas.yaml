    The auxiliary heads are dropped at inference.
  precedents:
  - Per-view disease classifiers as auxiliaries (RSNA 2024 lumbar winner; bundled
    with other objectives in its ablation).
  novelty: The only seed that keeps the incumbent's output and adds per-plane pressure.
  coverage: All studies and labels.
  exploitation: Log the auxiliary loss, the joint loss and each plane's auxiliary
    validation macro AUC per epoch; the auxiliary term must stay active (not orders
    of magnitude below the main loss).
  budget: Three masked attention pools during training; none at inference.
  implementation: trainer.plane_pooling.auxiliary_weight in config.py; heads and loss
    in the Lightning module.
  open_choices: None; weight 0.5 fixed.
  dependencies: []
  priority_rationale: Adds specialization pressure with the smallest change to inference.
  status: completed
  created_revision: 1
  seeded: /home/claudio/src/knee-abnormality-plane-backbones/autoresearch/campaigns/plane-specialization/seed-ideas-2.yaml
