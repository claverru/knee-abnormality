  decision: reject
- id: plane-auxiliary-readouts
  mechanism_id: plane-auxiliary-objective
  parent_idea_id: null
  title: Keep the joint pooled output and add a training-only loss where every plane
    predicts every label on its own
  opportunity: The joint model may combine planes well at inference but let backbones
    co-adapt. A training-only per-plane objective makes every backbone stand alone
    without changing the output path.
  mechanism: The incumbent's joint pooling, head and loss stay the output. Add plane-exclusive
    pooling with training-only per-plane heads (12 x 3, forked-RNG initialization)
    and the class-balanced BCE on every z_cq, averaged over the study's present planes
