    plane-exclusive attention. Token-count normalization and the fixed coefficient
    are proposed choices; the published results do not establish knee-MRI benefit.'
  - "[Incumbent metrics](/home/claudio/src/knee-abnormality/outputs/autoresearch/plane-specialization/experiments/dense-readouts-learned-fusion-20260927T231847Z-33417f97/training/fold_4/logs/version_0/metrics.csv):\
