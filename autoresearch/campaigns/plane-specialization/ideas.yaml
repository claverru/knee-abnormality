- id: dense-plane-probability-diversity
  mechanism_id: plane-prediction-diversity
  parent_idea_id: null
  title: Encourage complementary plane predictions with a bounded training-only objective
  opportunity: 'Retain this unregistered proposal''s stable ID from the rejected refill;
    direct inspection confirms it is absent from the linked registry. Existing plane
    predictions could make unnecessarily similar errors despite differing image evidence.
    Error correlation remains unmeasured: saved prediction CSVs contain fused outputs
    only. This objective investigates interaction between the existing readouts while
    preserving dense supervision and inference.'
  mechanism: For each observed study-label cell, compute p_q=sigmoid(z_q) over present
    planes, m=mean_q(p_q), and V=mean_q((p_q-m)^2). Add L_div=-0.5*mean_observed(w(y)*V),
    using the incumbent's original-target class weight and observed-cell reduction.
    Differentiate through probabilities and their mean in float32. Singleton cells
    contribute zero. Since V<=0.25, the added contribution is bounded below by -0.125*w(y)
    per cell. Retain dense BCE and the live inference-training objective without changing
    targets or supervision assignments.
