    \ dense assignment, zero fallbacks and movement in all twelve fusion rows. Selected\
    \ fusion weights span 0.1869\u20130.5809."
  - The supplied family ledger records dense supervision's qualifying +0.004699 macro
    gain, central 80% interval [+0.002409,+0.006904]. Its mixed label changes included
    MCL +0.0220, Contusion +0.0121 and PF OA -0.0079; these do not identify labels
    for different treatment.
  - '[Current pooling implementation](/home/claudio/src/knee-abnormality/outputs/autoresearch/plane-specialization/experiments/dense-readouts-learned-fusion-20260927T231847Z-33417f97/source/src/knee_abnormality/modeling/model.py:344)
