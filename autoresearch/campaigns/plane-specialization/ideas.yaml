- id: fusion-guided-dense-plane-routing
  mechanism_id: label-plane-assignment
  parent_idea_id: winner-take-all-plane-routing
  title: Learn plane supervision shares from fusion while guaranteeing supervision
    for every present plane
  opportunity: 'Winner-take-all activated every label-plane pair but produced poor
    individual classifiers: selected-epoch plane macro AUCs were 0.65757, 0.64566
    and 0.69196. Its selected-plane loss was 0.30291 while fusion loss remained 0.62051.
    This supports an objective mismatch; specialization by target polarity is a hypothesis,
    since polarity-conditioned assignments were not logged. Dense supervision supplies
    the missing coverage.'
  mechanism: Use the incumbent's present-plane fusion weights alpha, detached from
    the disease objective, to allocate supervision. For each observed study-label
    pair with n present planes, set r_q = 0.5/n + 0.5*stop_gradient(alpha_q). Compute
    the existing class-balanced per-plane BCE weighted by r. Retain the separate fusion
    BCE on detached plane logits exactly as defined by the contract. Every present
    plane receives at least half its uniform supervision share. Assignment no longer
    depends on which plane happens to fit that study's target best. Fix the mixing
    fraction at 0.5 before training; do not sweep it.
  precedents:
  - The label-plane-assignment verdict below reconciles random, dense and winner-take-all
    results.
  - 'Selected-epoch losses, assignment shares and plane AUCs: [winner-take-all diagnostics](/home/claudio/src/knee-abnormality/outputs/autoresearch/plane-specialization/experiments/winner-take-all-plane-routing-20260928T011442Z-3f1c336c/training/fold_4/logs/version_0/metrics.csv).'
  - Multiple-choice learning has documented overconfidence problems; this motivates
    protecting nonwinning predictors, without establishing the cause here. [Confident
    Multiple Choice Learning](https://proceedings.mlr.press/v70/lee17b.html).
  novelty: Replaces target-dependent hard winners with training-learned, study-target-independent
    supervision shares and a guaranteed dense component. It changes the routing mechanism,
    rather than reseeding or adjusting winner-take-all strength.
  coverage: Applies the same formula to all twelve labels. Missing planes receive
    zero weight and remaining weights normalize per study. Labels, class weights,
    anatomical pooling, meniscus fallback and OA corrections remain fixed. No validation-derived
    mapping is introduced.
  exploitation: Uses fusion parameters already trained from the complete study-label
    objective. The incumbent's twelve fusion rows all moved; selected-epoch weights
    ranged from 0.1869 to 0.5809. Their usefulness for allocating backbone supervision
    remains a hypothesis.
  budget: "Small-changes classification. Adds only arithmetic on existing plane logits\
    \ and weights, with no additional encoder execution or parameters. The incumbent\
    \ took 1,627.1 seconds, leaving 178.9 seconds below the fixed cap; similar runtime\
    \ is expected, not measured. Use supervisor seed 703791404, ten epochs and 2,220\
    \ steps. Keep the fixed \xD74 macro adoption rule and report the gap to ReXNet\
    \ 0.909733."
  implementation: Replace uniform-only disease aggregation with the stated mixture
    while retaining dense coverage, learned fusion, shared heads and all fixed auxiliary
    objectives. Log both loss components, realized supervision shares, effective present-plane
    fusion weights, fallbacks and each plane's validation macro AUC. Add assignment
    shares conditioned on the existing target >=0.5 split as diagnostics only. Disabling
    the new option must reproduce the active incumbent, not the inherited joint-pooling
    fallback. Rebase onto a newly accepted incumbent while preserving unrelated improvements;
    if dense supervision or learned fusion has been removed, require supervisor reconciliation
    of these real prerequisites.
  open_choices: No coefficient search. Fusion weights optimize complementary fused
    predictions, so they may not identify the best allocation of individual-plane
    supervision. Polarity-conditioned diagnostics can assess the proposed failure
    mechanism but cannot change the macro verdict.
  dependencies:
  - dense-plane-readouts
  - dense-readouts-learned-fusion
  priority_rationale: 'Priority 1: directly addresses an observed routing failure,
    preserves coverage from the strongest result, and adds negligible compute.'
  status: completed
  created_revision: 167
  ranking_rationale: "Queue the routing proposal first because it preserves both active\
    \ ideas; if joint fusion later replaces learned fusion, routing would lose a prerequisite.\
    \ Joint fusion follows as the open fusion line\u2019s distinct study-dependent\
    \ readout, then radiology auxiliary supervision as a separate retry. All three\
    \ have satisfied dependencies and differ materially from measured runs. Leave\
    \ shared-classifier-plane-auxiliaries proposed: its parent improved macro AUC\
    \ by only 0.000161 with an 80% interval crossing zero, and classifier tying has\
    \ no measured support sufficient to justify another queue slot now. The incumbent\u2019\
    s recorded learned-fusion acceptance conflicts with its numerical adoption result;\
    \ preserve the assigned incumbent and do not describe that result as a qualifying\
    \ win."
  experiments:
  - fusion-guided-dense-plane-routing-20260928T022756Z-bc64160e
  decision: reject
- id: dense-plane-detached-joint-fusion
  mechanism_id: plane-fusion
  parent_idea_id: dense-readouts-learned-fusion
  title: Train joint attention fusion on detached tokens while keeping dense supervision
    of the backbones
  opportunity: The incumbent learns static label-plane weights, while the existing
    joint attention pool can vary plane contributions by study. Earlier joint-pooling
    candidates also changed backbone supervision. A joint readout with its backbone
    gradients blocked can investigate study-dependent fusion while keeping every backbone
    responsible for predicting every label.
  mechanism: Encode each batch once. Retain the incumbent's dense plane-exclusive
    BCE at coefficient 1. Add the existing all-plane joint-pooling BCE at coefficient
    1, but detach the normalized token and value tensors entering that branch. Joint
    BCE updates the shared attention scorer, classifier, anatomical strengths and
    OA readout parameters, with no gradient reaching backbones, projection, embeddings
    or token normalization through that branch. Use ordinary joint pooling as the
    sole inference output. Remove static fusion parameters and detached plane-logit
    fusion BCE. Masks and OA corrections follow the existing joint-pooling implementation.
  precedents:
  - The plane-fusion verdict below preserves the supplied incumbent while documenting
    its numerical adoption discrepancy.
  - 'The incumbent already separates fusion training from backbone gradients: [training
    loss](/home/claudio/src/knee-abnormality/outputs/autoresearch/plane-specialization/experiments/dense-readouts-learned-fusion-20260927T231847Z-33417f97/source/src/knee_abnormality/training/lightning.py:594).'
  - 'The authorized joint pool is already implemented: [attention pooling](/home/claudio/src/knee-abnormality/outputs/autoresearch/plane-specialization/experiments/dense-readouts-learned-fusion-20260927T231847Z-33417f97/source/src/knee_abnormality/modeling/model.py:347).'
  - Attention MIL supplies a primary precedent for learned instance aggregation, not
    evidence that this particular gradient separation will improve AUC. [Attention-based
    Deep Multiple Instance Learning](https://proceedings.mlr.press/v80/ilse18a.html).
  novelty: Replaces static logit fusion with the authorized joint attention readout
    while retaining dense backbone supervision and blocking the joint objective's
    feature gradients. Unlike the auxiliary-readout seed, joint BCE cannot directly
    make backbones rely on other planes.
  coverage: Every present plane still predicts all labels independently during training.
    Joint inference uses all present tokens with the incumbent's anatomical rules.
    No new label mapping, head architecture, acquisition normalization or additional
    backbone pass is introduced.
  exploitation: "Builds on dense readouts and the existing separation between fusion\
    \ learning and backbone learning. Selected-epoch incumbent plane AUCs were 0.87470,\
    \ 0.87785 and 0.87334; the fused \xD74 result remains 0.005698 below ReXNet. These\
    \ different image-multiplier metrics are not directly comparable."
  budget: "Small-changes classification. Adds one pooling branch over existing tokens\
    \ and removes the tiny static fusion module. The historical joint-plus-plane auxiliary\
    \ run took 1,659.9 seconds, suggesting feasibility under 1,806 seconds without\
    \ guaranteeing it. Retain ten epochs, 2,220 steps and supervisor seed 703791404;\
    \ use the unchanged \xD74 macro rule and ReXNet comparison."
  implementation: Replace the enabled learned-fusion output and loss, retaining dense
    plane readouts, shared modules and fixed auxiliary objectives. Reuse normalized
    tensors; detach only the joint branch so the dense branch retains its original
    gradients. Log dense and joint losses separately, per-plane AUCs, assignment shares,
    fallbacks and joint attention mass by plane, explicitly identifying that mass
    rather than calling it learned fusion parameters. The new option's disabled path
    must reproduce the current incumbent. On a new incumbent, retain unrelated improvements
    and explicitly reconcile any routing dependent on the removed static fusion; do
    not silently preserve obsolete fusion behavior.
  open_choices: The shared readout still couples the objectives through its parameters;
    only feature gradients are separated. Joint pooling also changes OA aggregation
    from weighted plane corrections to the authorized joint correction, so this evaluates
    a complete fusion scheme rather than isolating attention weights.
  dependencies:
  - dense-plane-readouts
  priority_rationale: 'Priority 2: a distinct, authorized fusion mechanism with modest
    cost. The recorded fusion gain is uncertain, so this receives one follow-up without
    treating that gain as statistically established.'
  status: completed
  created_revision: 167
  ranking_rationale: 'Admit peer distillation: its dependency is satisfied, it adds
    a fixed training-only objective to existing plane readouts, and the targeted precedent
    search found no measured run of this mechanism. Keep the prepared reserved head
    first and the open radiology follow-up ahead of the new direction. Leave shared-classifier-plane-auxiliaries
    proposed: its measured parent gained only 0.000161 with an 80% interval crossing
    zero, and this retry would replace the active dense supervision and learned fusion
    without new supporting evidence.'
  experiments:
  - dense-plane-detached-joint-fusion-20260928T023503Z-1de0dad8
  decision: reject
- id: radiology-auxiliary-dense-readouts
  mechanism_id: label-plane-mask
  parent_idea_id: radiology-plane-mapping
  title: Add radiology-mapped plane supervision while retaining dense readouts and
    the incumbent's inference
  opportunity: The radiology seed simultaneously restricted pooling and removed dense
    per-plane supervision. Its Contusion decline occurred even though that label permits
    all three planes, implicating the changed pooling/supervision scheme as a possible
    contributor. The low aggregate plane AUCs include intentionally unsupervised label-plane
    pairs and cannot diagnose failure of the mapped pairs.
  mechanism: 'Retain the complete incumbent objective and inference. Add a training-only
    auxiliary term at coefficient 0.5 using the existing plane-exclusive logits: for
    each observed study-label pair, average the unchanged class-balanced BCE over
    its present planes in the contract''s fixed radiology mapping. If none are present,
    average over all present planes. Normalize within each study-label before averaging
    observations, so labels with more mapped planes do not receive greater total auxiliary
    weight. No inference mask is added.'
  precedents:
