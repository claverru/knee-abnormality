- id: radiology-plane-mapping
  mechanism_id: label-plane-mask
  parent_idea_id: null
  title: Each label pools only over the planes a radiologist reads it in, in training
    and inference
  opportunity: 'Radiologists read each finding on specific planes: ACL on sagittal,
    MCL on coronal, Baker''s cysts on axial. Restricting each label''s attention to
    those planes removes cross-plane shortcuts and has no train/inference mismatch,
    because the same mask applies in both.'
  mechanism: 'The incumbent''s joint attention pooling with a fixed label-to-plane
    mask: label c attends only to the study''s tokens of the planes the contract''s
    radiology mapping lists for it, in one softmax over their union. A study with
    none of a label''s mapped planes pools that label over all its present planes.
    Loss, head and output as in the incumbent.'
  precedents:
  - Knee MRI reading practice; the user fixed the mapping on 2026-09-27 and allowed
    label-to-plane routing for it.
  - 'Single-plane inference: ACL sagittal +0.003, MCL coronal -0.008, Baker''s axial
    -0.001 against the full ReXNet model (prior-work.md).'
  novelty: The only campaign scheme with a prior mapping instead of a random or learned
    one.
  coverage: All studies; every label keeps at least one plane.
  exploitation: Log fallback counts per label and each plane's attention mass per
    label.
  budget: One mask on the incumbent's pooling; negligible.
  implementation: model.plane_pooling.mask radiology with the table in modeling/planes/.
  open_choices: None; the mapping is the contract's.
  dependencies: []
  priority_rationale: Tests the radiology prior directly and keeps inference identical
    to training.
  status: completed
  created_revision: 1
  seeded: /home/claudio/src/knee-abnormality-plane-backbones/autoresearch/campaigns/plane-specialization/seed-ideas-2.yaml
  experiments:
