- id: leave-one-plane-out-distillation
  mechanism_id: plane-peer-distillation
  parent_idea_id: null
  title: Add peer distillation between existing plane readouts while retaining dense
    label supervision
  opportunity: The incumbent supervises each plane independently and learns fusion
    from detached logits; there is no direct transfer of predictive information between
    plane readouts. At selected epoch 8, all label-plane assignment shares were approximately
    one third, fallbacks were zero, and plane macro AUCs were 0.87470/0.87785/0.87334.
    These are competent potential peers, but their error complementarity and the benefit
    of matching predictions are unmeasured.
  mechanism: Retain the complete incumbent objective. For each observed study-label
    cell and present student plane q, form t_q as the detached arithmetic mean of
    sigmoid(z_r) over the other present planes. Add 0.5 times the mean Bernoulli KL(t_q
    || sigmoid(z_q)), averaging student planes within each cell and using the incumbent's
    original-target class weights and observed-cell reduction. Use temperature 1 from
    the first step. Skip cells with fewer than two present planes; an empty auxiliary
    batch contributes zero. Each plane receives gradients only through its student
    prediction for that direction. Ground-truth BCE, fusion training and inference
    remain unchanged.
