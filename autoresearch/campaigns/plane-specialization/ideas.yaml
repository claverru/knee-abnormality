- id: winner-take-all-plane-routing
  mechanism_id: label-plane-assignment
  parent_idea_id: null
  title: For each study and label, train only the plane whose own logit fits best,
    and fuse with learned weights
  opportunity: 'A learned routing can settle near the radiologist''s mapping without
    writing it down: the plane that predicts a label best keeps receiving that label''s
    gradient and specializes in it.'
  mechanism: Plane-exclusive pooling gives z_cq. For each study and label, compute
    the class-balanced BCE of every present plane's logit and apply the loss only
    to the plane with the lowest value (selection without gradient; ties to the lower
    plane index). Learned fusion as defined in the contract (detached z_cq, weight
    1) is the validation and inference output. Shared head.
  precedents:
  - Hard mixture-of-experts routing; no project precedent.
  novelty: The only learned hard routing among the seeds.
  coverage: All studies and labels; a study with one present plane always routes to
    it.
  exploitation: Log win shares per label and plane per epoch; a plane that never wins
    any label is a lock-in failure to report.
  budget: Three masked attention pools; negligible.
  implementation: trainer.plane_pooling.assignment winner_take_all in the Lightning
    module; fusion as in random-partition-learned-fusion.
  open_choices: None.
  dependencies: []
  priority_rationale: Label-agnostic routing that can learn specialization; known
    risk is early lock-in.
  status: completed
  created_revision: 1
