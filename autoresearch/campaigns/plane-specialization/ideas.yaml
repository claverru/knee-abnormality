    idle mechanism.
  budget: Token scores for 12 labels over all tokens and a top-5 per study, label
    and plane; well under a second per step at batch 16. About 12 x 609 parameters.
  implementation: model.plane_pooling.fusion_evidence in config.py; the statistics
