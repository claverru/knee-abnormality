  parent_idea_id: null
  title: Cut the posed coronal crops a ninth wider, 93.3 mm for T1/PD and 103.7 mm for the fluid series,
    at the same 224 px
  opportunity: 'User-ordered on 2026-10-08, which lifts the contract''s bar on crop widths for this seed.
