- id: turned-crops-cut-with-bicubic-interpolation
  mechanism_id: crop-resampling
  parent_idea_id: null
  title: Cut the turned crops with bicubic interpolation instead of bilinear, so that
    turning no longer blurs them
  opportunity: 'Evidence-backed. The incumbent cuts a turned crop from the canvas
    with bilinear interpolation: on 900 slices its fine detail (mean absolute Laplacian)
    is 0.81 of the loader''s crop, the same under 1 degree as at 6 to 12 degrees,
    and the training jitter turns every crop. The same cut with bicubic interpolation
    keeps 0.98; a crop that is only shifted keeps 1.00 (posed_crop_sharpness.py).
    Since the crops were posed, the targets that read fine detail fell at x1: Lateral
    Meniscus -0.0148 (interval excludes zero), Contusion -0.0058, Fracture -0.0057,
    each level or up in the run before, and nine of twelve targets moved attention
    from the posed sagittal views to the untouched axial ones (target-analysis.txt).
    The blur is a defect of the cut, not a property of turning.'
  mechanism: In ViewWindows.forward (modeling/model.py) call F.grid_sample with mode='bicubic'
    instead of 'bilinear' (padding_mode and align_corners unchanged) and clamp the
    result to the canvas range 0 to 255 before it is used, since bicubic can overshoot.
    The exact copy for a zero angle, the pose, the shift, the limits and the jitter
    stay as they are.
  precedents:
  - An offset pattern at prediction changed scores through the resampling of the picture,
    not through positions (routing-and-shifts run notes).
  - 'Crops turned by half the old frame''s angle, bilinear: x4 +0.0015, x1 -0.0006
    (frame-and-targets, crops-turned-to-the-frame).'
  novelty: First turned crops at the loader's sharpness.
  coverage: 'Every sagittal and coronal slice with a non-zero turn: all of them in
    training, nearly all at prediction.'
  exploitation: 'Read Lateral Meniscus, Contusion, Fracture and ACL at both multipliers
    against the incumbent, and each target''s share of attention per view. Shown wrong
    by: Lateral Meniscus not above the incumbent by one sibling SD (0.0024) at x1.'
  budget: Same cost as the incumbent within a few percent; bicubic reads sixteen canvas
    pixels per output pixel instead of four.
  implementation: Follow the environment paragraph of the developer instructions.
    modeling/model.py only. Replaces the bilinear cut. Report on one batch the ratio
    of the mean absolute Laplacian of the turned crops to that of the central crops
    (expect about 0.98, against 0.81 for the incumbent) and that the values stay within
    0 to 255. Update SPATIAL_TOKEN_IDENTITY['preparation'].
  open_choices: None.
  dependencies: []
  priority_rationale: A measured defect that removes a fifth of the fine detail from
    every posed crop, with a one-line repair.
  status: completed
  created_revision: 0
  seeded: /home/claudio/src/knee-abnormality-side-routed-heads/autoresearch/campaigns/anatomy-masks/seed-ideas.yaml
  experiments:
  - turned-crops-cut-with-bicubic-interpolation-20261007T220525Z-8ad05dfb
  decision: provisional_accept
- id: joint-centre-from-the-map-instead-of-the-spots
  mechanism_id: joint-centre-source
  parent_idea_id: null
  title: Take the knee's centre across and front to back from the anatomy map instead
    of the meniscus attention spots
  opportunity: 'Evidence-backed. The frame''s centre across the knee and front to
    back is still the midpoint of two meniscus attention spots, a leftover of the
    design before the map; its height already comes from the joint plane. Against
    the real plateau centre on 150 validation knees (centre-sources.txt), the spots
    leave 3.0 mm across and 3.1 mm front to back between knees; the centroid of the
    predicted femur and tibia tokens near the joint plane leaves 2.2 and 1.7 mm (the
    joint class alone 2.3 and 1.7; the loader''s own centre 4.5 and 4.7). The crops''
    shift across follows this centre: it matched the real one at only 0.76 to 0.81
    and removed a third of its spread, while the shift up and down, read from the
    plane, matched at 0.97 (pose-accuracy.txt). Lateral Meniscus is the incumbent''s
    largest loss and the knee nearly fills the crop from side to side.'
  mechanism: In KneeAbnormalityModel.anatomical_frames (modeling/model.py), after
    the plane is fitted, compute per knee the centroid of the token positions weighted
    by (femur share + tibia share) * exp(-0.5 * (h / 10 mm)^2), h the token's height
    above the fitted plane, over the valid tokens, on detached shares. Replace the
    two in-plane components of the frame's shift by this centroid's components in
    the plane (keep the height from the plane as now). Knees with no bone token keep
    the spots' midpoint. The side axis and the turn about the vertical stay from the
    spots. In ViewWindows set both joint targets to the mean position this centre
    takes in the crops, measured by the developer on the validation knees of one batch
    run of the incumbent and reported, so the average framing does not move.
  precedents:
  - The plane read from the map replaced a height read elsewhere and went from 6 mm
    to 1.7 mm (prior-work.md).
  - 'Centring the crops on the old frame: -0.0004, with PF OA and Fracture paying
    (frame-and-targets).'
  novelty: First frame whose centre, height and tilt all come from the map.
  coverage: Every knee with femur or tibia tokens in view.
  exploitation: 'Read Lateral Meniscus, Medial Meniscus, the two compartment OA targets,
    MCL and ACL at both multipliers against the incumbent, and per epoch on the validation
    knees the spread of the centre''s error across and front to back against the plateau
    centre (log it with the plane error). Shown wrong by: a centre error not below
    2.6 mm across or 2.4 mm front to back at the last epoch, or Lateral Meniscus not
    above the incumbent by one sibling SD (0.0024) at x1.'
  budget: Same cost as the incumbent; one weighted mean per knee.
  implementation: Follow the environment paragraph of the developer instructions.
    modeling/model.py, plus the log in training/lightning.py. Replaces the spots'
    midpoint as the centre. The regions (core, ring, sectors) and the crop pose both
    read the new centre, since both read the frame's shift. Log val_anatomy_centre_error_across_mm
    and val_anatomy_centre_error_front_mm as standard deviations across knees, from
    the plateau centres in knees.json converted as token_heights converts them. Update
    SPATIAL_TOKEN_IDENTITY['algorithm'].
  open_choices: None.
  dependencies: []
  priority_rationale: The one part of the pose still decided by an attention spot;
    the map locates it a quarter to a half better in a check without training.
  status: completed
  created_revision: 0
  seeded: /home/claudio/src/knee-abnormality-side-routed-heads/autoresearch/campaigns/anatomy-masks/seed-ideas.yaml
  experiments:
