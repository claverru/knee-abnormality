    \ replace incoming anatomy gradient gA by gA-min(<gA,gT>,0)*gT/||gT||\xB2; use\
    \ gA when gT is zero. Leave task gradients and all forward predictions unchanged.\
    \ Nonconflicting anatomy updates pass in full; conflicting components are removed.\
    \ This is an asymmetric, feature-space adaptation of gradient projection, not\
    \ another constant dose."
