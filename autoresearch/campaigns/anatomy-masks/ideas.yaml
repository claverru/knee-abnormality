- id: joint-plane-balances-soft-femur-and-tibia-mass
  mechanism_id: soft-bone-plane-fitting
  parent_idea_id: soft-bone-shares-fit-the-joint-plane
  title: Balance femur and tibia mass within each continuous joint-plane solve
  opportunity: "Measured: continuous fitting improved final plane error from 1.7561\
    \ to 1.5959 mm, but \xD71 macro peaked at epoch 7 and fell; its positive \xD7\
    4 delta missed adoption. A read-only calculation on 400 prepared training knees\
    \ found femur contributes 60.40%\xB12.76% of full femur+tibia volume, and 53.64%\xB1\
    3.05% under the existing 12 mm Gaussian around the recorded target plane. Hypothesis:\
    \ unequal class exposure moves the regression interface. These mask-volume measurements\
    \ do not establish the imbalance in sampled predicted tokens; the candidate must\
    \ log that quantity."
  mechanism: "Replace the incumbent fitter with a class-balanced continuous conditional\
    \ affine fit. At each of the existing four solves, use detached shares f,t and\
    \ current locality G. Compute M_f=\u03A3valid*G*f, M_t=\u03A3valid*G*t, S=M_f+M_t,\
    \ then f'=f*S/(2*M_f), t'=t*S/(2*M_t). Accumulate moments with valid*G*(f'+t')\
    \ and response with valid*G*(f'\u2212t'). This gives both bones equal integrated\
    \ mass while retaining total mass S and therefore the existing ridge scale. Recompute\
    \ normalization at every refit. Keep the existing Gaussian width, prior, ridge,\
    \ plane projection and centre calculation. The factor two is the number of paired\
    \ bone classes, not a tuned strength. Truly absent class mass uses the existing\
    \ plane prior, with no old-fitter fallback."
  precedents:
  - "[Continuous-fit comparison](/home/claudio/src/knee-abnormality/outputs/autoresearch/anatomy-masks/experiments/soft-bone-shares-fit-the-joint-plane-20261008T033130Z-816591b0/comparison/comparison.json):\
    \ \u0394macro +0.000136, 80% [\u22120.000683,+0.000945], reject."
