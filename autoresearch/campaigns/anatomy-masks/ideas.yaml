- id: regions-integrate-the-token-footprint
  mechanism_id: region-footprint-membership
  parent_idea_id: null
  title: Assign geometric region membership over the token footprint instead of only
    its centre
  opportunity: 'Source-backed: modeling/model.py:1249 gives geometric predicates hard
    forward membership at each token centre, although token extents enter only the
    surrogate gradient. AnatomyTargets.token_shares instead samples sixteen positions
    across the same physical token footprint. Thus anatomical section shares describe
    area fractions while sector, core and height membership describe a point. The
    fixed 84/93.33 mm views and stride-32 grid imply approximately 12/13.33 mm in-plane
    token spacing, comparable to the joint band and core. Hypothesis: centre-based
    membership discards substantial boundary evidence and makes routing sensitive
    to small geometric errors. The incumbent and both new runs retain late macro plateaus
    despite similar map accuracy.'
  mechanism: 'Reuse the existing Cartesian SUBSAMPLES grid (-0.375,-0.125,0.125,0.375)^2.
    For each token, construct the sixteen physical in-plane positions from its existing
    token steps, transform them through the existing side/frame coordinates, and average
    the complete region membership computed at those positions: R_token=mean_q R(q).
    Evaluate the existing anatomy-first section formula at each position using the
    token''s unchanged class shares; only its undecided remainder follows sampled
    height. Preserve all sector boundaries, radii, cuts, section preferences and target
    mappings. Replace centre-only geometric membership with footprint fractions, without
    changing token resolution or sampling additional images.'
  precedents:
