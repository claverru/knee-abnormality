- id: fluid-sagittal-crops-moved-forward-for-the-kneecap
  mechanism_id: crop-target-position
  parent_idea_id: null
  title: Place the joint further back in the 93 mm fluid sagittal crops so that the
    whole kneecap is inside
  opportunity: 'Evidence-backed. On the masks of 550 knees the kneecap''s front lies
    55.9 mm in front of the plateau centre (sd 5.2, 95th percentile 64.1) and its
    back at 40.0 mm (measurements.json). The sagittal crops place the joint centre
    7.4 mm behind the crop''s centre, so the 84 mm crop reaches 49 mm forward and
    the 93 mm crop 54 mm: the kneecap is whole in 11% and 38% of them (prior-work.md,
    Measured on the masks). PF OA, Effusion and Synovitis read the kneecap and the
    pouch above it, and the fluid series is where they show. Moving the joint 8.6
    mm further back in the 93 mm crop reaches 62.7 mm forward, the kneecap''s front
    for about 90% of knees, and still leaves 30.7 mm behind the joint centre; the
    plateau is about 50 mm deep, so the back of the joint stays inside. The 84 mm
    crop cannot hold both ends.'
  mechanism: 'In ViewWindows (modeling/model.py) make the sagittal target depend on
    the view: keep SAGITTAL_JOINT_TARGET_MM = (7.4, 2.3) for the 84 mm views and use
    (16.0, 2.3) for the 93 mm fluid sagittal view, chosen by view index from the view''s
    field_mm; `geometry` returns the pivot accordingly. Everything else as the incumbent.'
  precedents:
  - The kneecap route led by kneecap and kneecap-joint tokens recovered most of PF
    OA's loss (rn18-anatomy-front-sample550).
  - Crops centred on the old frame cost PF OA and Fracture, which read far from the
    joint centre (frame-and-targets).
  novelty: First crop placed for a structure other than the joint.
  coverage: Every fluid sagittal series, 4,150 of 4,407 studies have one.
  exploitation: 'Read PF OA, Effusion, Synovitis, ACL and the two menisci at both
    multipliers against the incumbent, and per epoch the mean share of kneecap and
    kneecap-joint tokens per fluid sagittal image against the incumbent''s. Shown
    wrong by: PF OA and Effusion both below the incumbent, or the menisci each more
    than one sibling SD below it.'
  budget: Same cost as the incumbent.
  implementation: Follow the environment paragraph of the developer instructions.
    modeling/model.py only. Replaces the single sagittal target by one per view width.
    The shift limit is unchanged; report the share of fluid sagittal series at the
    limit. Update SPATIAL_TOKEN_IDENTITY['view_policy'].
  open_choices: None.
  dependencies: []
  priority_rationale: The measured reason the front labels see half a kneecap, on
    the series where their findings show.
  status: completed
  created_revision: 1
  seeded: /home/claudio/src/knee-abnormality-side-routed-heads/autoresearch/campaigns/anatomy-masks/seed-ideas-2.yaml
