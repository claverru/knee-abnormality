- id: patellar-regions-sum-disjoint-anatomy-shares
  mechanism_id: patellar-share-routing
  parent_idea_id: patellar-routing-uses-unsaturated-shares
  title: Build patellar regions by summing mutually exclusive anatomy shares
  opportunity: "Measured: raw patellar routing produced \u0394macro +0.000332, but\
    \ its 80% interval crossed zero. Its late \xD71 curve remained below the incumbent.\
    \ Source-backed: the current patellar union multiplies a geometric section mixture\
    \ containing patellar mass by another patellar complement. Hypothesis: treating\
    \ these mutually exclusive classes as a categorical mixture can retain useful\
    \ nonpatellar context without promoting or counting patellar mass twice. The completed\
    \ attention-composition diagnostics are available, contrary to the stale pre-run\
    \ concern; they do not establish that femoral attention is harmful."
  mechanism: "Replace the patellar union with one categorical construction. Let p=p_kneecap+p_kneecap_joint,\
    \ f=p_femur, t=p_tibia, j=p_joint, and u=p_other+p_fibula. For each affected route\
    \ r, define H_r=a_rF*f+a_rJ*j+a_rT*t+u*(a_rF*upper+a_rJ*joint_height+a_rT*tibia_height),\
    \ using its existing section preferences. Set kneecap membership to p+FRONT_FLOOR*front_plane*H_kneecap,\
    \ and front-core membership to p+(front_plane+core)*H_front_core. Keep the mirrored\
    \ facets as kneecap membership times their existing side memberships. Since H_r\u2264\
    1\u2212p, these are bounded categorical sums. Remove saturation and the noisy-union\
    \ multiplication; do not change other routes, add the joint row to front preferences,\
    \ or introduce a new coefficient."
