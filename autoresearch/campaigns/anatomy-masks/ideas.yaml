- id: soft-bone-shares-fit-the-joint-plane
  mechanism_id: soft-bone-plane-fitting
  parent_idea_id: null
  title: Fit the joint plane with continuous bone shares instead of discarding tokens
    below half bone
  opportunity: 'Measured: incumbent validation plane error is 1.7051 mm at epoch 0
    and 1.7561 mm at epoch 9, despite joint overlap improving from 0.7290 to 0.7576.
    The source discards tokens whenever femur+tibia share is at most 0.5. Partial
    bone tokens therefore influence the centre and sections but cannot influence the
    plane. Evidence-backed implementation inconsistency; improved geometry and macro
    AUC are hypotheses.'
  mechanism: In anatomical_frames, replace hard bone selection and the raw femur-minus-tibia
    response by weighted conditional bone regression. Let b=femur+tibia, y=(femur-tibia)/b
    where b>0, and w=valid*b*G(distance). Fit the existing affine plane to y with
    w. Accumulate the response directly as valid*(femur-tibia)*G, avoiding division.
    Retain the existing scale, ridge, prior, three Gaussian refits and 12 mm refit
    width. Everything remains detached. This removes the 0.5 selection discontinuity
    without adding a class threshold or fitted distance.
  precedents:
  - "Incumbent modeling/model.py:1120\u20131156 contains the hard selection and existing\
    \ plane fit; training/lightning.py logs its validation error."
  - The CE-only run improved final plane error to 1.5925 mm while weakening several
    map classes. This shows that overlap and plane accuracy need separate assessment;
    it does not establish that this replacement will help.
  - '[Prior work: anatomy plane and mask measurements](/home/claudio/src/knee-abnormality-side-routed-heads/autoresearch/campaigns/anatomy-masks/prior-work.md:87).'
  novelty: Changes how predicted shares become geometry. It neither predicts token
    heights nor estimates a bone axis from token positions, both closed directions.
  coverage: Every routable knee with predicted bone mass, in the existing first look
    and final pass. No extra images, segmenter, target lookup or backbone teaching
    is introduced at prediction.
  exploitation: Log the bone mass actually admitted below the former cutoff, plane
    error, first-look plane error, centre error and crop transforms. Shown wrong diagnostically
    by admitted mass failing to affect the fit, or increased plane/crop instability.
    Expect no additional supervision cost to Synovitis, Effusion or PF OA, but geometry
    can affect all twelve labels. Only the fixed macro bootstrap rule decides adoption.
  budget: "One ten-epoch run at seed 1110484336, preserving 4420 optimizer steps and\
    \ all sampling. Reuses the existing small plane solves; expected training cost\
    \ is near the incumbent's 1687 s, with no additional CNN pass. Actual training\
    \ must remain within 931.58\u20132235.80 s; report prediction time against 53.09\
    \ s."
  implementation: Follow the environment paragraph of the developer instructions.
    Replace the fitter's hard-selection/response calculation in modeling/model.py;
    update modeling/spatial_tokens.py and add epoch diagnostics in training/lightning.py.
    Retain the accepted map-derived centre, bicubic/clamped sampling, exact central
