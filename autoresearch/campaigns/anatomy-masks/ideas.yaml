  mechanism_id: first-look-cost
  parent_idea_id: null
  title: Read the pose from every third slice of the first look instead of all of
    them
  opportunity: Evidence-backed. The posed crops make training about 25% slower and
    add about a quarter of the model's work at x4 prediction (prior-work.md, Measured
    on the masks), and the contract refuses a run above 1.3 times the incumbent's
    prediction time. The pose is one plane and one centre per knee, fitted over all
    of its tokens; the fit used a few hundred tokens when it was checked offline and
    held at 1.7 mm.
  mechanism: 'In ViewWindows (modeling/model.py) first_look_batch selects `budget`
    slices evenly among each series row''s valid slices, with budget = min(count,
    first_look_slices[view]). Use budget = min(count, ceil(first_look_slices[view]
    / 3)) and keep the even spacing; at least one slice per row. Nothing else changes:
    the same fit, the same crops.'
  precedents:
  - 'crops-turned-to-the-frame (frame-and-targets): a first look on the configured
    slice counts.'
  novelty: First reduction of the first look.
  coverage: Every knee.
  exploitation: 'Report training seconds and prediction seconds against the incumbent,
    and per epoch the plane error and the spread of turns and shifts. Shown wrong
    by: a plane error more than 0.3 mm above the incumbent''s at the last epoch, or
    the macro below the incumbent at both multipliers.'
  budget: Cheaper than the incumbent; expect training near 0.9 of its time.
  implementation: Follow the environment paragraph of the developer instructions.
    modeling/model.py only. Replaces the full-count first look. Log first_look_slices_per_knee
    (mean) once per epoch.
  open_choices: None.
