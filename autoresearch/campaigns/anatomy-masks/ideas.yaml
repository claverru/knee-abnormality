- id: joint-map-covariance-sets-the-across-axis
  mechanism_id: joint-map-across-axis
  parent_idea_id: null
  title: Read the frame's across axis from the joint map's transverse covariance
  opportunity: "Source-backed: the incumbent replaces centre and plane with map geometry\
    \ but still projects the direction between meniscus-attention spots onto that\
    \ plane to obtain its across axis. Its mean validation frame turn rises from 4.996\xB0\
    \ to 5.329\xB0 in epochs 7\u20139 while macro flattens. Read-only measurement\
    \ of joint masks on 400 training knees found a clear transverse axis: median in-plane\
    \ eigenvalue ratio 2.116, fifth percentile 1.777; its angle to projected patient\
    \ left\u2013right is 0.640\xB0\xB19.024\xB0, with every measured axis within 45\xB0\
    . Hypothesis: this anatomical shape can supply a steadier compartment axis. Full\
    \ masks do not establish accuracy from sampled predicted shares."
  mechanism: "Keep the current map plane and centre. Compute a detached joint-share-weighted\
    \ centroid and covariance of valid token positions. Project covariance into the\
    \ plane's tangent space and take its largest-eigenvalue direction as the across\
    \ axis. Orient its sign toward the projected positive across coordinate in the\
    \ existing fitted-position system; construct front as normal\xD7across. For exactly\
    \ zero mass or a numerically degenerate eigenspace, use the projected coordinate\
    \ axis, without an anatomy-confidence threshold or spot-direction fallback. Replace\
    \ only the operational across-axis source. This uses joint shape, not a line through\
    \ femur or tibia tokens, and introduces no distance, angular limit or learned\
    \ geometry parameter."
  precedents:
  - '[Meniscus-spot direction](/home/claudio/src/knee-abnormality/outputs/autoresearch/anatomy-masks/experiments/joint-centre-from-the-map-instead-of-the-spots-20261007T224024Z-0fea1d4e/source/src/knee_abnormality/modeling/model.py:1050)
    and its projection in anatomical_frames provide the remaining appearance-attention
    axis source.'
  - '[Incumbent curves](/home/claudio/src/knee-abnormality/outputs/autoresearch/anatomy-masks/jobs/researcher-20261008T053127Z-9ab0f0f0/curves.json):
    late macro plateau and frame-turn drift.'
  - '[Prepared planes](/home/claudio/src/knee-abnormality/data/labels/prepared/anatomy-mrannotator-sample550-joints/knees.json)
    and [class definitions](/home/claudio/src/knee-abnormality/data/labels/prepared/anatomy-mrannotator-sample550-joints/classes.json):
    training-only covariance measurement used joint voxels projected onto each recorded
    plateau plane.'
  - Closed long-bone direction fitting estimated femur or tibia axes from lines through
    their tokens. This proposal reads the transverse footprint of the joint class
    and retains the existing joint-plane normal.
  novelty: Removes the remaining meniscus-attention direction from anatomical routing
    using a measured joint-shape property. It neither changes plane regression nor
    repeats centre aggregation, footprint membership or map-head context proposals.
  coverage: Frame orientation for existing geometric regions and mirrored compartment
    routes. Crop posing directly reads the retained normal and centre, so this mechanism
    targets routing orientation rather than a new crop policy. Prediction requires
    only its own map shares.
  exploitation: Log executed across-axis angular displacement, joint mass, eigenvalue
    ratio, coordinate-fallback frequency, per-view covariance weight fractions, and
    angular error against joint-mask covariance on covered diagnostic knees. Retain
    overlaps, plane error and applied crop distributions. Shown wrong by unstable
    predicted axes, coverage-driven rotations, failure of mirror routing, or no macro
    benefit. No stronger anatomy teaching is introduced; Synovitis, Effusion and PF
    OA may nevertheless change through routing and shared feature learning.
  budget: "One ten-epoch run at the supervisor's incumbent seed, with unchanged sampling.\
    \ Adds weighted 3\xD73 moments and a tangent-space eigensolve per knee to each\
    \ existing encoding pass. No extra first look, backbone or finer tokens. Runtime\
    \ and numerical overhead are unmeasured; enforce the supplied training range and\
    \ overall limits."
  implementation: Follow the environment paragraph of the developer instructions.
    Replace the projected meniscus-pair across direction inside anatomical_frames
    in src/knee_abnormality/modeling/model.py. Update modeling/spatial_tokens.py identity
    and training/lightning.py diagnostic logging; a focused training/anatomy.py helper
    may compute target covariance for diagnostics only. Retain spot computation wherever
    required by the accepted zero-mass centre fallback, but remove its operational
    role in the across axis. Retain the current plane fitter, centre, accepted bicubic
    crops, section preferences, classifiers and losses. On a newly accepted incumbent,
    retain its plane and centre winners and replace only across-axis construction.
    The developer reports the unchanged side-routing guardrail.
  open_choices: Use the joint class alone, its continuous shares, centred covariance
    and the stated sign convention. No eigenvalue-ratio cutoff or damping strength
    is proposed. Unequal view exposure and early diffuse joint predictions can distort
    covariance; log them without adding a second aggregation mechanism.
  dependencies: []
  priority_rationale: 'Priority 3: a distinct, inexpensive routing mechanism supported
    by training-mask geometry. Predicted-token coverage and the meaning of the anatomical
    principal axis remain substantial uncertainties.'
