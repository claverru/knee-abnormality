- id: joint-gap-per-side-as-a-target
  mechanism_id: mask-measurements-as-targets
  parent_idea_id: null
  title: Teach the model the gap between femur and tibia on the medial and on the
    lateral side
  opportunity: 'A guess, with a new source of information. Everything the masks have
    given so far is position; the gap between the bones on each side is a number about
    disease: it narrows with compartment osteoarthritis. measurements.json holds it
    per knee and per side of the patient (prior-work.md, The targets). Medial OA is
    the one target that gained beyond its interval from the anatomy work (+0.0062
    at x1).'
  mechanism: 'Load measurements.json beside knees.json in AnatomyTargets (training/anatomy.py):
    gap_patient_left_mm and gap_patient_right_mm per knee. In the training module
    add one linear head with two outputs on the route-pooled tokens of the OA channel:
    for each knee pool the shared tokens with the oa_medial and the oa_lateral routing
    weights (the same weights the labels use, detached) into two vectors and predict
    one gap from each. The target for the medial vector is the gap on the knee''s
    medial side: patient right for a left knee, patient left for a right knee, from
    batch["knee_side_left"]; knees whose side is not certain or that lack a gap skip
    the loss. Loss: smooth L1 on (prediction - target) / 2 mm, added inside the anatomy
    loss, so with its weight of 0.1.'
  precedents:
  - Routed report targets are read the same way, through the routing weights (report_attributes.py).
  novelty: First target from the masks that measures the joint instead of locating
    it.
  coverage: The 400 training knees with masks whose side is certain.
  exploitation: 'Read Medial OA and Lateral OA at both multipliers against the incumbent,
    and per epoch on the validation knees the mean absolute error of each gap against
    the error of always predicting the training mean. Shown wrong by: a gap error
    not below that baseline, or both OA targets below the incumbent by more than one
    sibling SD.'
  budget: Same cost as the incumbent; one small head.
  implementation: 'Follow the environment paragraph of the developer instructions.
    training/anatomy.py and training/lightning.py. Adds; nothing can go, since no
    gap target exists. The head is created under torch.random.fork_rng and added to
    the optimiser with the other training heads. Log val_anatomy_gap_error_mm and
    val_anatomy_gap_baseline_mm. Add anatomy_gap_loss to nothing the guardrail counts:
    fold it into anatomy_loss before logging.'
  open_choices: None.
  dependencies: []
  priority_rationale: The only seed that adds information about disease from the masks.
  status: completed
