- id: the-map-loss-without-its-dice-term
  mechanism_id: map-loss-terms
  parent_idea_id: null
  title: Train the map with cross-entropy alone, removing the Dice term the incumbent
    added
  opportunity: Evidence on both sides, the balance is a guess. Dice lifted the thin
    classes from the first epoch (kneecap 0.46 to 0.65, kneecap joint 0.51 to 0.62,
    joint 0.68 to 0.73) and the pose and the kneecap route read exactly those classes.
    It also pushes the backbone harder towards anatomy, which is what Synovitis pays
    for (principle 7). The incumbent added Dice and the posed crops in one run, so
    the two were never separated.
  mechanism: In anatomy_loss (training/anatomy.py) remove the soft Dice term (the
    `present`, `overlap` lines and the added `(1 - overlap[present]).mean()`), leaving
    the cross-entropy against the target shares. Everything else as the incumbent.
  precedents:
  - 'Cross-entropy alone, no posed crops: rn18-anatomy-front-sample550, x4 -0.00008,
    x1 +0.00002 against run 24.'
  novelty: Separates the two changes the incumbent made together.
  coverage: Every knee with targets.
  exploitation: 'Read both multipliers against the incumbent, Synovitis, PF OA and
    Effusion, and the per-epoch overlap of kneecap, joint and kneecap joint with the
    plane error and the spread of the crop turns. Shown wrong by: the macro below
    the incumbent at both multipliers with Synovitis not one sibling SD above it.'
  budget: Same cost as the incumbent.
  implementation: Follow the environment paragraph of the developer instructions.
    training/anatomy.py only. Replaces the Dice term; the logged overlap metrics stay.
  open_choices: None.
  dependencies: []
