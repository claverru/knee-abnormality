    frozen advantage over joint pooling on split studies across three checkpoints.
    It adds no parameters, leaves non-split studies exact and costs almost nothing.
    Uncertainties: the frozen models were not trained with split budgets; part of
    the frozen gain is ensembling; and subset gains shrink about tenfold on the full
    fold, so an adoption-sized macro gain needs a trained effect larger than the frozen
    one.


