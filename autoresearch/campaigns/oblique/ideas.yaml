- id: coverage-matched-slot-split
  mechanism_id: zero-sum-coverage-split-within-split-slots
  parent_idea_id: null
  title: Split each split slot's combined budget by the share of windows each group
    covers, at the reference's per-slot total
  opportunity: The reference gives both groups the full type budget. At x1 a thin
    coronal fluid oblique sees 5 of about 16 windows per pass while the full-knee
    standard series beside it sees 5 of 28, so the series that shows the whole joint,
    including MCL and the meniscal body, is covered at a lower rate than the 45 mm
    slab. Equalizing coverage moves triplets to the standard series without touching
    other slots.
  mechanism: In slots holding both groups, divide the combined count (standard budget
    plus oblique budget, as in the reference) between the groups in proportion to
    each group's distinct geometry-group capacity, by largest remainder, with at least
    one triplet each and never above capacity, in training and validation alike. Per-slot,
    per-study and run totals equal the reference exactly.
  precedents:
  - outputs/analysis/a/acquisition-geometry-20260922/oblique_reach.txt (windows and
    run coverage per group)
  - docs/validation/results/2026-09-17-test-time-allocation.md#repeated-series-in-one-slot
    (second-series triplets help on frozen models)
  - docs/validation/results/2026-09-18-overnight-results.md (repeated_series_share
    took triplets from other types and lost publicly; this split stays inside the
    slot)
  novelty: The first zero-sum split between the two groups of one slot; the reference
    and repeated_series_share both changed slot totals.
  coverage: Standard series gain coverage and oblique groups lose some; run coverage
    of the oblique groups stays high because they hold few windows.
  exploitation: Tests whether the reference's equal split over-weights the thin slab
    relative to the full-knee series.
  budget: No extra triplets or decoding; accounting identical to the reference by
    construction.
  implementation: Adds behavior in dataset.py _prepare_slot (group budgets) behind
    one setting under data.oblique; oblique_split stays. Record the changed deterministic
    validation selection identity.
  open_choices: Capacity as distinct geometry groups or as physical support length;
    how to round when the combined count exceeds total capacity.
  dependencies: []
  priority_rationale: Cheap and exact, and it answers the budget question in the one
    direction the reference did not test; lower priority than the representation ideas,
    because budget alone already failed to move fold 0.
  status: queued
  created_revision: 5
