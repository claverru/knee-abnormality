ideas:
- id: oblique-group-embedding
  mechanism_id: oblique-group-token-embedding
  parent_idea_id: null
  title: Mark tokens from oblique groups with their own learned embedding
  opportunity: 'The reference gives oblique groups their own budget but not an identity:
    their tokens carry the slot''s plane and contrast embeddings, so a dedicated ACL-oblique
    slab and the standard coronal beside it look alike to attention except by appearance.
    Fold 0 did not move (0.897527 against 0.899042 for k_05 at x1). Their studies
    are rich in the labels these views target: in coronal fluid at 30-45 degrees,
    ACL 40% against 15%, MCL 15% against 5%, lateral meniscus 33% against 16%.'
  mechanism: Add a learned vector to every token of an acquisition in an oblique group,
    next to the plane and contrast embeddings and before mil_norm. The vector is zero-initialized,
    so the first forward pass equals the reference. The group is known in _prepare_slot
    from oblique_split; carry it as one PreparedSeries field through collate_studies
    to the model.
  precedents:
  - docs/validation/results/2026-09-22-oblique-groups-result.md (reference run; per-label
    localization)
  - outputs/analysis/a/acquisition-geometry-20260922/protocol_prior.txt (an oblique
    flag added after training gave -0.0003 to -0.0014, so the gain must come from
    routing inside the model, not new information)
  - docs/validation/results/2026-09-14-knee-side-embedding-result.md (a knee-side
    embedding tied; it marked patient geometry, not acquisition protocol)
  - docs/backlog/small-changes.md#oblique-embedding (transferred general-backlog entry)
  novelty: The oblique groups exist since 2026-09-22 and no representation change
    has been tried for them. Unlike the retired knee-side and 3D embeddings, it marks
    how a view was acquired, not where a token sits in the patient.
  coverage: Sampling, budgets and counts are identical to the reference; only tokens
    of oblique-group acquisitions change, in 103 fold-0 studies.
  exploitation: Attention and the pooled features can treat the dedicated views differently
    from the slot's standard series. The effect should show on ACL, MCL and lateral
    meniscus in the split studies.
  budget: One to three 256-d vectors and one boolean per acquisition; no extra decoding
    or backbone work. Accounting identical to the reference.
  implementation: 'Adds behavior. preparation.py: one PreparedSeries field (for example
    oblique: bool = False) and nothing else. dataset.py sets it on the oblique group''s
    prepared values and collate_studies emits a per-acquisition tensor. model.py and
    spatial_tokens.py add the embedding where the plane and contrast embeddings are
    added, behind one setting under model.oblique. All other embeddings stay. New
    parameters load only in fresh checkpoints. If accepted, later ideas reuse the
    flag plumbing.'
  open_choices: One shared vector or one per splittable type (axial fluid, coronal
    T1/PD, coronal fluid); whether the axial-labelled coronal ACL obliques share the
    coronal vector, their true protocol, or get the axial one.
  dependencies: []
  priority_rationale: The most direct fix for the named gap, cheap and neutral at
    initialization, and its plumbing serves the other representation ideas.
  status: completed
  created_revision: 5
  ranking_rationale: 'I admitted all five seeded ideas. Each has no dependencies,
    according to proposal_admission, and each sits inside the contract''s scope: representation,
    attention/readout weighting, or zero-sum redistribution within a slot. None repeats
    a rejected mechanism. The retired knee-side and 3D embeddings marked patient position,
    not acquisition protocol. The rejected residual_readout reused the shared pooled
    vector. repeated_series_share changed slot totals.


    Order:

    1. oblique-group-embedding. It is the cheapest and most direct fix for the missing
    identity, it is neutral at initialization, and its flag plumbing is reused by
    ideas 2 and 3.

    2. label-view-attention-bias. It has the same additive form as the adopted anatomical
    term, which is already in the incumbent''s _attention_pool. It targets the dilution
    of about 245 oblique tokens among more than a thousand standard ones, and the
    learned table can be read afterwards.

    3. oblique-residual-readout. This is the strongest routing option, but it adds
    more machinery and has a masking edge case (see concerns).

    4. coverage-matched-slot-split. It is exactly zero-sum and cheap. It sits below
    the representation ideas because changing the budget alone did not move fold 0
    in the reference run.

    5. view-orientation-embedding. It is a generalisation of idea 1, so it is most
    informative once we know whether binary identity matters. It also changes every
    acquisition, not only the split studies, and it carries a reflection-consistency
    risk.


    The formal dependencies stay empty. The later ideas are ranked after idea 1 only
    for sequencing, and each is still tested alone against the incumbent.'
  experiments:
  - oblique-group-embedding-20260922T115015Z-8ee94e16
  - oblique-group-embedding-20260922T115506Z-f5d616dd
  decision: reject
- id: label-view-attention-bias
  mechanism_id: per-label-view-group-attention-bias
  parent_idea_id: null
  title: Learn a per-label attention bias for each view group, including the three
    oblique groups
  opportunity: 'Attention chooses evidence per label over all study tokens, and view
    identity reaches the scorer only through the shared nonlinear MLP. Labels depend
    on views very unevenly: removing a fluid type costs 0.006-0.007 macro and removing
    axial fluid costs Baker''s cyst 0.026 on frozen models. In split studies the oblique
    tokens (about 245 at x1) compete in one softmax with over a thousand standard
    tokens. A direct additive bias lets each label raise or lower a view''s attention
    mass; the adopted anatomical bias is the structural precedent.'
  mechanism: 'A zero-initialized table of shape labels x view groups (six slot types
    plus the three oblique groups) added to every token''s attention score by its
    acquisition''s view group, before the softmax and alongside the anatomical term.
    It uses the same oblique flag as oblique-group-embedding. The learned table is
    readable after training: whether ACL moves attention mass to the oblique groups.'
  precedents:
  - autoresearch/anatomical-attention.md (learned family strengths adopted, +0.002331)
  - docs/validation/results/2026-09-17-plane-contrast-importance.md (label-specific
    type dependence)
  - docs/validation/results/2026-09-17-test-time-allocation.md (removal costs and
    value curves by type)
  - docs/validation/results/2026-09-15-attention-prior-result.md (a fixed spatial
    prior regressed -0.002177; this one is learned from zero)
  novelty: No view-level attention bias has been tried. The general backlog's plane/contrast
    readouts and adapters act on features, not on attention mass.
  coverage: Sampling and counts unchanged; every token gets a view-group bias, and
    the oblique groups become separable for the first time.
  exploitation: Labels can route attention to the views that carry them; the oblique
    groups can gain or lose mass per label instead of being diluted in the slot's
    softmax share.
  budget: 108 scalars; negligible compute.
  implementation: Adds behavior in model.py where the anatomical term is added in
    _attention_pool, behind one setting under model.oblique; the flag plumbing is
    as in oblique-group-embedding and can be shared with it if both are implemented.
    Scorer, anatomical bias and heads stay.
  open_choices: Nine view groups or six slot types plus one shared oblique column;
    whether the bias also applies at the inference temperature scaling (it adds to
    scores before tau divides them).
  dependencies: []
  priority_rationale: Directly addresses dilution and routing, with the adopted anatomical
    bias as a working precedent of the same form, and interpretable either way.
  status: completed
  created_revision: 5
  ranking_rationale: 'I admitted all five seeded ideas. Each has no dependencies,
