- id: axial-t1pd-to-oblique-transfer
  mechanism_id: zero-sum-type-transfer-into-oblique-groups
  parent_idea_id: null
  title: Fund part of the oblique groups' budget from the same study's axial T1/PD
    slot
  opportunity: 'Axial T1/PD is the lowest-value type on frozen models: dropping it
    moved macro AUC from 0.8924 to 0.8926 and its marginal value was -0.00025 per
    triplet, and it is absent in 81% of studies. The oblique groups carry the dedicated
    views of trauma studies. Moving triplets inside a study keeps every total.'
  mechanism: In studies that hold both a split slot and an axial T1/PD series, move
    a fixed number of triplets per multiplier from the axial T1/PD slot to the study's
    oblique groups, split between them by capacity, in training and validation, never
    leaving axial T1/PD with fewer than one triplet or any group above its capacity.
    Study and run totals equal the reference exactly.
  precedents:
  - docs/validation/results/2026-09-17-test-time-allocation.md (axial T1/PD removal
    cost nothing on macro, but dropping it entirely cost MCL and fracture about 0.008
    on the confirm half)
  - docs/validation/results/2026-09-18-overnight-results.md (repeated_series_share
    moved triplets from other types into repeated slots, topped fold 0 and lost publicly)
  novelty: A zero-sum transfer from one measured low-value type into the oblique groups
    only, unlike repeated_series_share's reallocation from all types into any repeated
    series.
  coverage: Oblique groups gain triplets and axial T1/PD loses some in the 253 training
    studies (5.7% of all, 47% of the 544 split studies) that hold both.
  exploitation: Tests whether more oblique evidence per study helps when it is paid
    for by the type with the least measured value.
  budget: No extra triplets or decoding; accounting identical to the reference.
  implementation: Adds behavior in dataset.py (per-study budgets before the per-slot
    preparation) behind one setting under data.oblique; study_budgets and the study
    floor stay. Record the changed validation selection identity.
  open_choices: Transfer size, fixed before training from the axial T1/PD budget (for
    example half of it); whether the oblique groups first fill to capacity.
  dependencies: []
  priority_rationale: 'Lower priority: it rests on frozen-model value estimates and
    resembles a rejected reallocation, though it takes from one low-value type only.'
  status: proposed
  created_revision: 7
- id: split-slot-view-mixture-pooling
  mechanism_id: split-slot-alternative-view-mixture-pooling
  parent_idea_id: null
  title: Pool a split study twice, with the standard series and with the oblique group
    in each split slot, and train on the mixture of the two predictions
  opportunity: "In the reference, a split slot adds the oblique group's full type\
    \ budget beside the standard series, so both compete in one softmax per label\
    \ and the slot's token share rises (\xD71 five-type study: coronal 5/26 \u2192\
    \ 10/31; +5.0 triplets per split study). On three frozen checkpoints (k_025, k_05,\
    \ k_075), with identical triplets, pooling the two groups as alternatives (mean\
    \ of a standard-only and a tilted-only pass) beat joint pooling on the split studies\
    \ in all 9 measured settings, by +0.0015 to +0.0039 subset AUC (k_05 \xD71 \u03C4\
    1 \u226520\xB0: joint \u22120.0013, mixture +0.0024; full fold \u22120.00019 vs\
    \ +0.00022). Joint pooling's per-label cost falls on MCL and PF OA (k_05 full\
    \ fold \u22120.0006 to \u22120.0026 vs intact); dropping the tilted series instead\
    \ costs ACL \u22120.0031 to \u22120.0046. This structure has never been trained."
  mechanism: "Compute token scores (scorer plus anatomical term) once. In each study,\
    \ a slot is split when its kept, visually valid tokens include both oblique-group\
    \ and standard tokens. Pass A masks every split slot's oblique tokens; pass B\
    \ masks every split slot's standard tokens. Other slots are in both passes. Each\
    \ pass runs the existing masked softmax, pooling and heads. For split studies\
    \ the output logit is logit(\xBD\u03C3(z_A)+\xBD\u03C3(z_B)), computed stably\
    \ as logaddexp(log\u03C3(z_A),log\u03C3(z_B)) \u2212 logaddexp(log\u03C3(\u2212\
    z_A),log\u03C3(\u2212z_B)). For every other study, torch.where returns z_A, which\
    \ equals the reference pass. Training and validation are identical and no parameters\
    \ are added. Each pass shows the scorer and heads a split study with one series\
    \ per slot, the composition they see in 88% of studies. The oblique view becomes\
    \ an alternative reading of its slot instead of diluting the other slots."
  precedents:
  - "outputs/analysis/t/tilted-slot-policies-20260922/partial_log.txt, tilted-slot-policies-check-20260922\
    \ and -v2check-20260922/results.csv (scripts/adhoc/score_tilted_slot_policies.py):\
    \ frozen mean_standard_tilted vs additive on the same triplets; the mixture wins\
    \ on the split subset in 9/9 checkpoint\xD7setting cells."
  - 'Same artifacts: mean_intact_standard (two passes without the tilted series) gains
    +0.0000 to +0.0037 on the subset, so part of the frozen gain is sub-bag ensembling
    rather than use of the oblique views.'
  - "docs/validation/results/2026-09-17-count-normalized-attention-result.md: per-acquisition\
    \ count normalisation was rejected (\u22120.0035); subset and per-slot variants\
    \ were never tested. Here learned score levels stay intact within each pass."
  - 'docs/validation/results/2026-09-17-test-time-allocation.md#repeated-series-in-one-slot:
    a slot''s second series adds value, and losing it hurts.'
  - 'autoresearch/campaigns/oblique/prior-work.md: the two-pass average was left to
    the endgame as a test-time policy that re-encodes the study.'
  - "docs/validation/results/2026-09-22-oblique-groups-result.md (reference; split-study\
    \ MCL \u22120.058 and PF OA \u22120.026 vs k_05)."
  novelty: "The first trained use of the only positive frozen oblique measurement.\
    \ Unlike the endgame two-pass test-time average, nothing is re-encoded: both passes\
    \ pool the same encoded bag, the scorer and heads learn under this pooling, and\
    \ validation stays one \xD71 pass. label-view-attention-bias adds per-label constant\
    \ offsets inside one softmax, and its standard columns are shared with all studies.\
    \ oblique-residual-readout adds an oblique-only pool with new parameters to the\
    \ joint logit. This mechanism instead removes the within-slot competition and\
    \ the slot-share inflation, with no parameters."
  coverage: 'Only studies that still hold a split slot after series dropout change:
    103 on fold 0 and about 545 in training. At any fixed weights, the other 802 fold-0
    studies get the reference forward pass exactly; they change only through shared
    training. Sampling, triplets, visits and validation selection are identical to
    the reference.'
  exploitation: 'Expected signature in split studies: MCL, PF OA and the menisci stop
    losing relative to the non-split drift, and ACL holds. A within-model toggle on
    the trained candidate (joint vs mixture pooling, pass A only, pass B only) separates
    the pooling''s inference-time effect from training divergence. Compare the split-study
    label deltas with the non-split drift.'
  budget: 'No change to triplets, decoding or the backbone. Scores are shared, so
    the cost is one extra masked softmax and pooling einsum per batch: well under
    1% of the reference''s 1,624 s. Memory rises by one extra [batch, labels, tokens]
