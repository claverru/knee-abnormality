- id: oblique-residual-readout
  mechanism_id: oblique-dedicated-residual-readout
  parent_idea_id: null
  title: Add a residual readout that pools only oblique-group tokens for the labels
    those views serve
  opportunity: 'In a split study the oblique tokens are a minority of one softmax
    per label, so the dedicated view''s evidence is averaged with the standard series.
    At x1 the oblique group contributes 5 of about 32 triplets. The views were acquired
    for specific questions: ACL above all, and the MCL and lateral meniscus rates
    are doubled in these studies.'
  mechanism: A second attention pooling restricted to oblique-group tokens, with its
    own small scorer, produces a residual logit per targeted label through a zero-initialized
    output, added to the main logit. Studies without an oblique group get a zero residual,
    so their predictions are unchanged at initialization and are affected only through
    shared training.
  precedents:
  - docs/backlog/small-changes.md#planecontrast-specific-readouts (general per-type
    readouts, untested)
  - docs/validation/results/2026-09-18-overnight-results.md (residual_readout, a per-target
    MLP on the same pooled vector, -0.0005; different mechanism)
  - autoresearch/campaigns/oblique/prior-work.md#label-profile-of-their-studies
  novelty: A dedicated evidence path for one acquisition kind; the rejected residual
    readout reused the shared pooled vector.
  coverage: Sampling and counts unchanged.
  exploitation: The dedicated ACL view can raise or lower ACL (and the chosen labels)
    on its own evidence, without competing for softmax mass.
  budget: One small scorer and output vector; a second masked softmax over a subset
    of tokens.
  implementation: Adds behavior in model.py (_attention_pool or pool_encoded) behind
    one setting under model.oblique, reusing the oblique flag plumbing. The main pooling,
    heads and anatomical bias stay.
  open_choices: 'Targeted labels: all twelve or a fixed set chosen from the prior-work
    label profile (ACL, MCL, lateral meniscus), fixed before training; shared or separate
    scorer.'
  dependencies: []
  priority_rationale: 'The strongest version of routing: if the dedicated views hold
    extra ACL information, this path can use it even when the main softmax cannot.'
  status: launched
  created_revision: 5
  ranking_rationale: "I admitted split-slot-view-mixture-pooling and ranked it second,\
    \ directly behind the reserved head. It has no dependencies. It has the campaign's\
    \ only consistent positive frozen measurement: the probability mixture of standard-only\
    \ and oblique-only passes beat joint pooling on split studies in 9 of 9 checkpoint\
    \ \xD7 setting cells. It adds no triplets and no backbone cost, and it attacks\
    \ the costs seen in the reference's split studies (MCL \u22120.058, PF OA \u2212\
    0.026 vs k_05) without changing any other study's forward pass at fixed weights.\
    \ It differs from both the running label-view-attention-bias and the reserved\
    \ oblique-residual-readout: it removes within-slot competition and slot-share\
    \ inflation, not reweighting inside one softmax or adding a pool.\n\nI left oblique-feature-adapter\
    \ as proposed rather than queuing it. Its premise, that oblique content is misread,\
    \ rests on tilted-only frozen losses confounded by thin-slab coverage and mixed\
    \ on k_025. The rejected constant marker also shows that oblique-specific representation\
    \ changes can hurt ACL. It stays eligible if the routing ideas show that oblique\
    \ tokens are used but misread. axial-t1pd-to-oblique-transfer also remains proposed:\
    \ frozen bag-size evidence implies roughly +0.0002 macro for redistributions of\
    \ this size."
  experiments:
  - oblique-residual-readout-20260922T122704Z-b759f96d
  - oblique-residual-readout-20260922T123437Z-66d0dc1f
- id: view-orientation-embedding
  mechanism_id: continuous-acquisition-orientation-embedding
  parent_idea_id: null
  title: Embed each acquisition's slice-normal orientation instead of relying on the
    slot's plane label
  opportunity: 'Tilt is continuous: 23% of all series are tilted 10-20 degrees and
    the oblique groups span 20-55. Coronal obliques rotate about the left-right axis
    and sagittal obliques about the superior-inferior axis, so the same image row
    or column maps to different anatomy. A binary oblique flag at fixed thresholds
    discards the angle, and the 2D anchor embedding assumes the slot''s canonical
    in-plane axes.'
  mechanism: For each acquisition take the unit slice normal in patient coordinates
    with the x component mirrored by knee side, map its three components through a
    small MLP like the 2D embedding (3 -> 64 -> 256, GELU), zero-initialize the output
    layer and add the result to that acquisition's tokens. Acquisitions without valid
    geometry get zero.
  precedents:
  - outputs/analysis/a/acquisition-geometry-20260922/oblique_axes.txt (rotation axes
    of each oblique family)
  - docs/backlog/big-bets.md#3d-embedding-training-time-effect (a patient-position
    3D embedding was ignored at inference)
  - docs/data-preparation/reflection-geometry-and-previews.md (normal and side conventions)
  novelty: Encodes how a view cuts the anatomy, not where a token is; it also reaches
    the 10-20 degree tilts inside standard slots.
  coverage: Sampling and counts unchanged; every acquisition gets an orientation vector.
  exploitation: The model can adapt the meaning of in-plane positions and appearance
    to the view angle, which matters most for the oblique groups.
  budget: A small MLP per acquisition; negligible.
  implementation: Adds behavior. The series normal is available from IndexedSeries.geometry;
    carry it per acquisition through a PreparedSeries field and collate_studies, and
    add the embedding in spatial_tokens.py or model.py behind one setting under model.oblique.
    Reflection must keep the mirrored normal consistent with the reflected tokens.
    If oblique-group-embedding is already accepted, state whether this replaces it
    or adds to it.
  open_choices: Raw normal components or angles to the three axes; whether to use
    the middle slice's orientation or the series normal.
  dependencies: []
  priority_rationale: A more general version of the identity idea; rank it after the
    binary flag, whose result says whether view identity matters at all.
  status: queued
  created_revision: 5
  ranking_rationale: "I admitted split-slot-view-mixture-pooling and ranked it second,\
    \ directly behind the reserved head. It has no dependencies. It has the campaign's\
    \ only consistent positive frozen measurement: the probability mixture of standard-only\
