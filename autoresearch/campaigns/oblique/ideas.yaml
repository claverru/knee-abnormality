  parent_idea_id: null
  title: Give oblique-group tokens a zero-initialised low-rank projection branch from
    the backbone features
  opportunity: "The shared 2560\u2192256 projection, scorer and heads learn mostly\
    \ from standard views. On frozen k_05 and k_075, a tilted-only slot pass loses\
    \ 0.0044\u20130.0103 subset AUC; on k_025 the result is mixed. Per label on k_05,\
    \ it moves MCL \u22120.0027 to \u22120.0040 and PF OA \u22120.0020 to \u22120.0038\
    \ on the full fold, while ACL gains only +0.0004 to +0.0011. So the dedicated\
    \ views carry ACL evidence but may be read as the wrong anatomy for other labels.\
    \ One hypothesis: a coronal tipped 30\u201345\xB0 toward axial crosses the trochlea\
    \ anteriorly. A constant marker did not help: the rejected oblique embedding moved\
    \ split-study ACL by \u22120.0092. The routing ideas (bias, readout, mixture)\
    \ reweight tokens whose content stays fixed; none of them changes what an oblique\
    \ token encodes."
  mechanism: "For tokens of oblique-group acquisitions only, add U(D x) to the projected\
    \ features. Here x is the 2560-d backbone feature at each location, D maps 2560\u2192\
    16 and U maps 16\u2192256 and is zero-initialised. The branch sits before the\
    \ embeddings and mil_norm, so the adapted tokens feed the scorer, the anatomical\
    \ term and the heads. D is initialised from a local torch.Generator with a fixed\
    \ seed, so global RNG use and every other initial weight match the reference.\
    \ With U = 0 the forward pass equals the reference exactly. Standard tokens never\
    \ pass through the branch."
