- id: canvas-locator-resnet10t
  mechanism_id: auxiliary-locator
  parent_idea_id: null
  title: A Refined-RadImageNet ResNet-10t reads each primary series' whole 368 px
    canvas resized to 224 px, learns the anatomy map from the mask targets, and its
    map replaces the ResNet-50 first look for the crop pose from epoch 3
  opportunity: 'Today the pose comes from a no-gradient pass of the ResNet-50 over
    the central 224 px of each canvas, the view''s own field, so a knee off centre
    is seen in part, and the shift is capped at 18 mm. A locator that sees the whole
    canvas (138 to 197 mm) estimates the pose from the whole knee and frees the ResNet-50
    from the first look (about 32 of the 143 ResNet-50 forward passes per study).
    Evidence (prior-work.md, Pose estimation): other pose estimates gave +4.2 to +5.3
    x1e-4 in a blend against a retraining''s +2.0 (fold 1). Guess: complement gain
    +0.0004 to +0.0010, solo level to -0.001.'
  mechanism: 'Under model.auxiliary: a resnet10t.c3_in1k backbone with Refined-RadImageNet
    weights (restore its entry in modeling/radimagenet.py: file refined_radimagenet_resnet10t.pth,
    sha256 f5219dff128ca752d47e8acd07817564c10bacbbc4241b3a31845e1a67a079ab, source
    REFINED_RADIMAGENET_URL resnet10t.pth; the file is in the torch hub cache), its
    own linear projection to 256 and its own seven-class anatomy head, trained with
    the recipe''s anatomy loss and weight on targets looked up at its token positions.
    Input: the slices first_look_batch selects, each whole canvas resized from 368
    to 224 px, with patient maps and valid rectangles transformed by that resize.
    Its tokens go through the model''s first-look frame computation (positions, anatomy
    shares, joint plane and centre, study frame, side) in place of the ResNet-50''s,
    and frame_pose and the per-knee scale read that result. Epochs 1 and 2 pose from
    the ResNet-50 first look as today; from epoch 3 from the locator alone, and validation
    and prediction use the locator. Rate and anchors as the ResNet-50''s (backbone_lr
    5e-5, anchors 0.01 early and 0.001 late toward its pretrained weights). Shift
    and turn limits as the recipe''s. View table and every other setting as the recipe''s.'
  precedents:
  - 'soft-bone-shares-fit-the-joint-plane (anatomy-masks, fold 1): blend +4.2, solo
    -0.4.'
  - 'spot-shift-locator-keeps-spatial-maps (routing-and-shifts, fold 1): a learned
    crop point, blend +5.3, solo +1.4.'
  - 'joint-centre-taught-from-the-masks (view-poses, fold 1): a centre regressed from
    the masks, blend +2.8, solo -30.7.'
  - 'Refined-RadImageNet ResNet-10t: 1.10 GMAC at 224 px against the ResNet-50''s
    4.09 (measured).'
  novelty: First pose read by a second network from the whole canvas.
  coverage: Every study with a trusted pose; every label through the crops.
  exploitation: 'Read the complement gain, per label, solo and sixth-member blend.
    Activation: validation metrics of the locator''s anatomy-map accuracy on its targets,
    the mean absolute difference between its pose and the ResNet-50 first look''s
    on the same batch (shift in mm, turn in degrees, scale), and the share of studies
    whose pose came from the locator (1.0 from epoch 3).'
  budget: 'The locator costs about 32 x 3 x 0.27 = 26 ResNet-50 forward passes per
    study against the first look''s 32 it replaces from epoch 3: -5% to +10% of the
    reference''s time; about +1 GB.'
