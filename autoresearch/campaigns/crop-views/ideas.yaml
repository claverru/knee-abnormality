- id: canvas-locator-with-context-tokens
  mechanism_id: auxiliary-locator
  parent_idea_id: canvas-locator-resnet10t
  title: canvas-locator-resnet10t with the locator's full-canvas tokens also entering
    the pools, so one ResNet-10t pass places the crops and adds wide context
  opportunity: 'Guess: the locator already encodes every primary canvas; its tokens
    add 138 to 197 mm context at 0.62 to 0.88 mm per pixel at little cost. Comparing
    with canvas-locator-resnet10t separates the context from the pose, and with canvas-context-tokens-resnet10t
    the pose from the context. Guess: complement gain +0.0008 to +0.0015.'
  mechanism: 'canvas-locator-resnet10t unchanged, plus: the locator''s tokens, with
    a learned stream embedding, enter the same pools and readouts as the ResNet-50''s
    from the first step, with no gate, and the target losses train the locator through
