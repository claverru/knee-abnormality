- id: oblique-residual-readout
  mechanism_id: oblique-dedicated-residual-readout
  parent_idea_id: null
  title: Add a residual readout that pools only oblique-group tokens for the labels
    those views serve
  opportunity: 'In a split study the oblique tokens are a minority of one softmax
    per label, so the dedicated view''s evidence is averaged with the standard series.
    At x1 the oblique group contributes 5 of about 32 triplets. The views were acquired
    for specific questions: ACL above all, and the MCL and lateral meniscus rates
    are doubled in these studies.'
  mechanism: A second attention pooling restricted to oblique-group tokens, with its
    own small scorer, produces a residual logit per targeted label through a zero-initialized
    output, added to the main logit. Studies without an oblique group get a zero residual,
    so their predictions are unchanged at initialization and are affected only through
    shared training.
  precedents:
  - docs/backlog/untried-ideas.md#pooling-and-the-attention-head (general per-type
    readouts, untested)
  - docs/validation/results/campaigns-and-queues/2026-09-18-overnight-results.md (residual_readout, a per-target
    MLP on the same pooled vector, -0.0005; different mechanism)
  - autoresearch/campaigns/oblique/prior-work.md#label-profile-of-their-studies
  - outputs/autoresearch/oblique/experiments/oblique-residual-readout-20260922T123437Z-66d0dc1f
    (retired x1 campaign; trained, best epoch 8 at 0.899668, not compared before the
    campaign stopped)
  novelty: A dedicated evidence path for one acquisition kind; the rejected residual
    readout reused the shared pooled vector.
  coverage: Sampling and counts unchanged.
  exploitation: The dedicated ACL view can raise or lower ACL (and the chosen labels)
    on its own evidence, without competing for softmax mass.
  budget: One small scorer and output vector; a second masked softmax over a subset
    of tokens.
  implementation: Adds behavior in model.py (_attention_pool or pool_encoded) behind
    one setting under model.oblique, reusing the oblique flag plumbing. The main pooling,
    heads and anatomical bias stay.
  open_choices: 'Targeted labels: all twelve or a fixed set chosen from the prior-work
    label profile (ACL, MCL, lateral meniscus), fixed before training; shared or separate
    scorer.'
  dependencies: []
  priority_rationale: 'The strongest version of routing: if the dedicated views hold
    extra ACL information, this path can use it even when the main softmax cannot.'
  status: proposed
  created_revision: 6
- id: label-view-attention-bias
  mechanism_id: per-label-view-group-attention-bias
  parent_idea_id: null
  title: Learn a per-label attention bias for each view group, including the three
    oblique groups
  opportunity: 'Attention chooses evidence per label over all study tokens, and view
    identity reaches the scorer only through the shared nonlinear MLP. Labels depend
    on views very unevenly: removing a fluid type costs 0.006-0.007 macro and removing
    axial fluid costs Baker''s cyst 0.026 on frozen models. In split studies the oblique
    tokens (about 245 at x1) compete in one softmax with over a thousand standard
    tokens. A direct additive bias lets each label raise or lower a view''s attention
    mass; the adopted anatomical bias is the structural precedent.'
  mechanism: 'A zero-initialized table of shape labels x view groups (six slot types
    plus the three oblique groups) added to every token''s attention score by its
    acquisition''s view group, before the softmax and alongside the anatomical term.
    It uses the same oblique flag as oblique-group-embedding. The learned table is
    readable after training: whether ACL moves attention mass to the oblique groups.'
  precedents:
  - autoresearch/anatomical-attention.md (learned family strengths adopted, +0.002331)
  - docs/validation/results/pooling-and-attention/2026-09-17-plane-contrast-importance.md (label-specific
    type dependence)
  - docs/validation/results/sampling/2026-09-17-test-time-allocation.md (removal costs and
    value curves by type)
  - docs/validation/results/pooling-and-attention/2026-09-15-attention-prior-result.md (a fixed spatial
    prior regressed -0.002177; this one is learned from zero)
  - outputs/autoresearch/oblique/experiments/label-view-attention-bias-20260922T120824Z-29aa5863
    (retired x1 campaign; 0.899295, +0.00177, adoption 80% interval [-0.0002, +0.0037],
    rejected; +0.0068 on the split studies; its learned table routed MCL to coronal
    fluid and Baker's cyst to axial fluid and discounted the thin fluid obliques for
    the menisci, contusion and fracture)
  novelty: No view-level attention bias has been tried. The general backlog's plane/contrast
    readouts and adapters act on features, not on attention mass.
  coverage: Sampling and counts unchanged; every token gets a view-group bias, and
    the oblique groups become separable for the first time.
  exploitation: Labels can route attention to the views that carry them; the oblique
    groups can gain or lose mass per label instead of being diluted in the slot's
    softmax share.
  budget: 108 scalars; negligible compute.
  implementation: Adds behavior in model.py where the anatomical term is added in
    _attention_pool, behind one setting under model.oblique; the flag plumbing is
    as in oblique-group-embedding and can be shared with it if both are implemented.
    Scorer, anatomical bias and heads stay.
  open_choices: Nine view groups or six slot types plus one shared oblique column;
    whether the bias also applies at the inference temperature scaling (it adds to
    scores before tau divides them).
  dependencies: []
  priority_rationale: Directly addresses dilution and routing, with the adopted anatomical
    bias as a working precedent of the same form, and interpretable either way.
  status: completed
  created_revision: 6
  ranking_rationale: "Admitted `split-slot-view-mixture-pooling` and ranked it second.\
    \ Of the in-scope ideas, it has the most consistent frozen evidence. Against joint\
    \ pooling, the mixture won on the split subset in all 9 checkpoint\xD7setting\
    \ cells, by +0.0015 to +0.0039. It adds no parameters, gives non-split studies\
    \ the reference forward pass exactly, and costs almost nothing. It stays behind\
    \ `label-view-attention-bias` because on the full fold its frozen gain is only\
    \ +0.0002 to +0.0006, well short of the 0.001 adoption line. By contrast, the\
    \ view bias gained +0.0018 macro at \xD71 and repaired +0.0068 on the split studies.\
    \ I placed it ahead of the combination, the ACL gate and the plain embedding because\
    \ it tests a different lever: removing within-slot competition rather than marking\
    \ identity.\n\nFollowing the user's recorded decision in prior-work.md, I did\
    \ not admit `oblique-residual-readout`, `view-orientation-embedding` or `oblique-feature-adapter`.\
    \ They stay in the proposed state.\n\n`oblique-training-only-views` and `coverage-matched-slot-split`\
    \ are eligible and the user kept them, but I left them proposed to hold the queue\
    \ at five:\n- Training-only views: its frozen \xD74 subset gain (+0.0011 to +0.0026)\
    \ partly overlaps the mixture's pass A and the ACL gate. It also trains on split\
    \ slots but evaluates without the oblique tokens, which adds a train/eval shift.\n\
    - Coverage-matched split: the proposal itself says budget changes alone have not\
    \ moved fold 0.\n\nBoth can be queued once a queued idea resolves. I did not re-rank\
    \ the other four existing entries against each other."
