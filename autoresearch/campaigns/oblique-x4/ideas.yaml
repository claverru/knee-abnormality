- id: oblique-standard-statistics-alignment
  mechanism_id: per-study-oblique-feature-statistics-alignment-to-slot-standard-series
  parent_idea_id: null
  title: Align each oblique group's token feature statistics to the standard series
    in its slot, per study, behind a zero-initialized gate
  opportunity: "The scorer and heads that read oblique-group tokens were trained mostly\
    \ on standard series, and the oblique groups use different protocols from the\
    \ series they share a slot with:\n- On fold 0, all 47 Coronal0 oblique groups\
    \ are T2 TSE and sit in the T1/PD slot. 45 of them are Bondorf-type coronals (Siemens\
    \ t2_tse_bond*, Philips T2W_BONDORF). The Coronal1 groups are mostly fat-suppressed\
    \ ACL slabs.\n\nMeasured effects of the mismatch:\n- In the 47 Coronal0 split\
    \ studies, the reference sets OA and medial-meniscus logits 0.27 lower than k_05\
    \ at \xD74 \u03C40.75, and positives and negatives shift alike. The protocol,\
    \ not the pathology, moves the level (shift_by_kind.txt, kind_pairs_x4.txt).\n\
    - On frozen k_05 and k_075, reading a split slot from its oblique group alone\
    \ lost 0.0044\u20130.0103 subset AUC, mostly MCL and PF OA. This is confounded\
    \ by slab coverage.\n- At \xD71, the per-type constant embedding was the only\
    \ candidate that repaired split-vs-unchanged pairs: net +0.0005 of k_05's +0.0011\
    \ (x1_candidates.txt). A constant cannot follow the contrast differences between\
    \ the two groups in each study."
  mechanism: "For each study and each split slot (a slot with visually valid tokens\
    \ from both groups), take the per-channel mean and std of the projected 256-d\
    \ features over the visually valid tokens of each group: \u03BC_s, \u03C3_s for\
    \ the standard group and \u03BC_o, \u03C3_o for the oblique group, in fp32.\n\n\
    Each oblique-group token x becomes x + \u03B1_g \u2299 (\u03C3_s \u2299 (x \u2212\
    \ \u03BC_o)/(\u03C3_o + \u03B5) + \u03BC_s \u2212 x). Here \u03B1_g is a zero-initialized\
    \ per-channel gate for each splittable type. This is AdaIN with the same study's\
    \ standard series as the style reference.\n\nNeutrality and scope:\n- The positional,\
    \ plane and contrast codes are added afterwards as today, so only appearance statistics\
    \ change.\n- Standard tokens, non-split slots and non-split studies are untouched,\
    \ and \u03B1 = 0 reproduces the reference exactly.\n\nBoth groups image the same\
    \ knee in the same session and share its labels. The alignment can therefore remove\
    \ offsets caused by protocol and contrast (a T2 Bondorf series read in the T1/PD\
    \ slot, a fat-suppressed slab beside a standard coronal) without the label-shift\
    \ failure of population-level alignment. Variation between tokens within a group,\
    \ which carries the lesion signal, is kept up to a per-channel rescale."
