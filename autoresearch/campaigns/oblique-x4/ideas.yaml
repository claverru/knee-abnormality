  - label-view-attention-bias-20260922T134812Z-7b4fa495
  decision: reject
- id: oblique-group-embedding
  mechanism_id: oblique-group-token-embedding
  parent_idea_id: null
  title: Mark tokens from oblique groups with their own learned embedding
  opportunity: 'The reference gives oblique groups their own budget but not an identity:
    their tokens carry the slot''s plane and contrast embeddings, so a dedicated ACL-oblique
    slab and the standard coronal beside it look alike to attention except by appearance.
    Fold 0 did not move (0.897527 against 0.899042 for k_05 at x1). Their studies
    are rich in the labels these views target: in coronal fluid at 30-45 degrees,
    ACL 40% against 15%, MCL 15% against 5%, lateral meniscus 33% against 16%.'
  mechanism: Add a learned vector to every token of an acquisition in an oblique group,
    next to the plane and contrast embeddings and before mil_norm. The vector is zero-initialized,
    so the first forward pass equals the reference. The group is known in _prepare_slot
    from oblique_split; carry it as one PreparedSeries field through collate_studies
    to the model.
  precedents:
  - docs/validation/results/sampling/2026-09-22-oblique-groups-result.md (reference run; per-label
    localization)
  - outputs/analysis/a/acquisition-geometry-20260922/protocol_prior.txt (an oblique
    flag added after training gave -0.0003 to -0.0014, so the gain must come from
    routing inside the model, not new information)
  - docs/validation/results/pooling-and-attention/2026-09-14-knee-side-embedding-result.md (a knee-side
    embedding tied; it marked patient geometry, not acquisition protocol)
  - docs/backlog/untried-ideas.md#position-and-knee-side (transferred general-backlog entry)
  - outputs/autoresearch/oblique/experiments/oblique-group-embedding-20260922T115506Z-f5d616dd
    (retired x1 campaign; 0.899287, +0.00176 against the x1 reference, adoption 80%
    interval [-0.0005, +0.0040], rejected; +0.0052 on the 103 split studies)
  novelty: The oblique groups exist since 2026-09-22 and no representation change
    has been tried for them. Unlike the retired knee-side and 3D embeddings, it marks
    how a view was acquired, not where a token sits in the patient.
  coverage: Sampling, budgets and counts are identical to the reference; only tokens
    of oblique-group acquisitions change, in 103 fold-0 studies.
  exploitation: Attention and the pooled features can treat the dedicated views differently
    from the slot's standard series. The effect should show on ACL, MCL and lateral
    meniscus in the split studies.
  budget: One to three 256-d vectors and one boolean per acquisition; no extra decoding
    or backbone work. Accounting identical to the reference.
  implementation: 'Adds behavior. preparation.py: one PreparedSeries field (for example
    oblique: bool = False) and nothing else. dataset.py sets it on the oblique group''s
    prepared values and collate_studies emits a per-acquisition tensor. model.py and
    spatial_tokens.py add the embedding where the plane and contrast embeddings are
    added, behind one setting under model.oblique. All other embeddings stay. New
    parameters load only in fresh checkpoints. If accepted, later ideas reuse the
    flag plumbing.'
  open_choices: One shared vector or one per splittable type (axial fluid, coronal
    T1/PD, coronal fluid); whether the axial-labelled coronal ACL obliques share the
    coronal vector, their true protocol, or get the axial one.
  dependencies: []
  priority_rationale: The most direct fix for the named gap, cheap and neutral at
    initialization, and its plumbing serves the other representation ideas.
  status: queued
