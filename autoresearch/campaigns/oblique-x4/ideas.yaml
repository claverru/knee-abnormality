    \ One hypothesis: a coronal tipped 30\u201345\xB0 toward axial crosses the trochlea\
    \ anteriorly. A constant marker did not help: the rejected oblique embedding moved\
    \ split-study ACL by \u22120.0092. The routing ideas (bias, readout, mixture)\
    \ reweight tokens whose content stays fixed; none of them changes what an oblique\
    \ token encodes."
  mechanism: "For tokens of oblique-group acquisitions only, add U(D x) to the projected\
    \ features. Here x is the 2560-d backbone feature at each location, D maps 2560\u2192\
