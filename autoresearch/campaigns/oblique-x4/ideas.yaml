  ranking_rationale: "Completion of split-slot-view-mixture-pooling. I interpret the\
    \ fixed decision, reject, as a valid null result. The run is valid. Accounting\
    \ is complete and matches the sealed counts exactly: 960,240 training triplets,\
    \ 35,020 visits, 24,770 validation triplets per epoch, with the cohort hashes\
    \ matching. The only config difference is model.oblique.mixture_pooling. Measured\
    \ compute was 1,655 s against a 1,902 s ceiling, with 4,380 steps. The review\
    \ concerns that triggered escalation are resolved or immaterial. Accounting is\
    \ now confirmed. Being non-neutral at init is inherent to changing how split slots\
    \ are pooled, and it has no parameters. Validation stays deterministic and independent\
    \ of the seed: the selection hash is identical in every epoch.\n\nMacro: 0.902428\
    \ vs 0.902373, delta +0.00005, 80% interval [\u22120.0019, +0.0019]. By stratum\
    \ (my CPU recomputation, details in finding): the split studies moved +0.0015\
    \ and the unchanged studies 0.0000. So the mechanism had a small, uncertain effect\
    \ limited to the split studies, with a clear per-label pattern.\n\nRanking change:\
    \ acl-gated-oblique-tokens moves ahead of oblique-standard-frame-depth. In this\
    \ run, separating the standard view from the oblique view helped MCL, lateral\
    \ meniscus and contusion on the split studies but cost ACL. That is the per-label\
    \ split the ACL gate targets: obliques feed ACL, and the standard series alone\
    \ serves the other labels. The prior k_05 \xD74 analysis (+0.0020 on 102 studies)\
    \ points the same way. The reserved head stays first."
