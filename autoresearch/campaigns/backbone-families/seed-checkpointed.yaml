ideas:
- id: pvt-v2-b2-checkpointed
  mechanism_id: family-pvtv2
  parent_idea_id: null
  title: PVTv2-b2 (pvt_v2_b2.in1k), global spatial-reduction attention from stride 4 with overlapping patch embeddings, on
    the MambaVision recipe unchanged, ten epochs, with activation checkpointing of stage 0 in training
  opportunity: 'Evidence (prior-work.md, The families): global attention at every stage (with spatially reduced keys and values),
    not windowed like Swin-T, plus overlapping patch embeddings and a depthwise convolution in each MLP, the encoder of many
    medical segmentation models (Polyp-PVT). Apache-2.0. Its weights are flat over depth (RMS 0.045 to 0.056), between RadioDINO''s
    0.05 to 0.06, where the MambaVision rate and anchors held, and MambaVision''s 0.08. Guess on size: level to +0.003, blend
    value from global attention.'
  mechanism: 'A pvt_v2 backbone from timm''s pvt_v2_b2.in1k: 64, 128, 320 and 512 channels at strides 4, 8, 16 and 32. to_stride_8
    runs the patch embedding and the first two stages; the middle map is the third stage''s output, the final map the fourth''s.
    Image counts padded to a multiple of 16 (depthwise convolutions, no BatchNorm). Settings: model.backbone the new name;
    rate and anchors the recipe''s (2e-4, 0.001, 0.00001). trainer.max_epochs 10. In training mode the adapter runs stage
    0 (stride 4) under torch.utils.checkpoint.checkpoint(use_reentrant=False), so their activations are recomputed in the
    backward pass instead of stored; outputs and gradients are unchanged (no dropout or stochastic depth), and in eval mode
    the stages run directly. The feature-statistics augmentation stays outside the checkpointed stages.'
  precedents:
  - 'RadioDINO-S/16 (weights 0.05 to 0.06): rates 1.4e-4 to 4e-4 and the MambaVision anchors all within ±0.0006 at ×4; doubled
    anchors −0.0024 (autoresearch/campaigns/radiodino-settings).'
  - 'Keeper measurement 2026-10-15, backbone alone, 256 images (the mean training batch is 253), bf16, channels_last, forward
    and backward on the 3090: peak 22.3 GB to 12.7 GB with checkpointing, 0.401 to 0.417 s per step; FocalNet-T, which trained
    at a 23.0 GB peak, is 17.2 GB and 0.389 s there. Without checkpointing the full training exceeds the 24 GB card and every
    launch failed on its first batch with ''CUDA driver error: device not ready'' (WSL spill).'
  novelty: First global-attention pyramid here.
  coverage: Every study and every label.
  exploitation: 'Read ×4 and ×1 against the reference, the per-label changes and the blends. Activation: the effective config
    and the padded image count logged or checked once.'
  budget: 'Backbone step time within about 20% of FocalNet-T''s: ten epochs in about 50 to 62 min, inside the 68 min bound;
    peak memory well under FocalNet-T''s 23 GB.'
  implementation: 'Files: modeling/backbone_stages.py (the stage adapter with the multiple-of-16 padding ConvNeXt uses), modeling/staged_backbones.py
    if a wrapper is needed, modeling/spatial_tokens.py (mappings derived from the overlapping patch embeddings: kernel 7 stride
    4 padding 3, then kernel 3 stride 2 padding 1), configs/campaign.yaml. Check on CPU the stage shapes and that padded and
    unpadded image counts give the same outputs for the real images.'
  open_choices: None.
  dependencies: []
  priority_rationale: The easiest drop-in of the attention families, with global attention from the start.
- id: rdnet-tiny-checkpointed
  mechanism_id: family-rdnet
  parent_idea_id: null
  title: RDNet-T (rdnet_tiny.nv_in1k), DenseNet-style feature concatenation, on the MambaVision recipe unchanged, ten epochs,
    with activation checkpointing of dense stages 0 and 1 in training
  opportunity: 'Evidence (prior-work.md, The families): dense connections that concatenate earlier features instead of summing
    them, so fine early features reach the deep reads directly; Apache-2.0. LayerNorm, no BatchNorm; weights flat over depth
    (RMS 0.039 to 0.043). Guess on size: level to +0.003.'
  mechanism: 'An rdnet backbone from timm''s rdnet_tiny.nv_in1k: 256, 440, 744 and 1040 channels at strides 4, 8, 16 and 32
    (outputs of dense stages 0, 1, 5 and 6). to_stride_8 runs the stem and dense stages 0 and 1; the middle map is dense stage
    5''s output, the final map dense stage 6''s through the final norm. Image counts padded to a multiple of 16 (depthwise
    convolutions, no BatchNorm). Settings: model.backbone the new name; rate and anchors the recipe''s. trainer.max_epochs
    10. In training mode the adapter runs dense stages 0 and 1 (strides 4 and 8) under torch.utils.checkpoint.checkpoint(use_reentrant=False),
    so their activations are recomputed in the backward pass instead of stored; outputs and gradients are unchanged (no dropout
    or stochastic depth), and in eval mode the stages run directly. The feature-statistics augmentation stays outside the
    checkpointed stages.'
  precedents:
  - 'RadioDINO-S/16 (weights 0.05 to 0.06): the MambaVision rate and anchors held within ±0.0006.'
  - 'Keeper measurement 2026-10-15, backbone alone, 256 images (the mean training batch is 253), bf16, channels_last, forward
    and backward on the 3090: peak 20.4 GB to 10.0 GB with checkpointing, 0.471 to 0.459 s per step; FocalNet-T, which trained
    at a 23.0 GB peak, is 17.2 GB and 0.389 s there. Without checkpointing the full training exceeds the 24 GB card and every
    launch failed on its first batch with ''CUDA driver error: device not ready'' (WSL spill).'
  novelty: First densely connected backbone here.
  coverage: Every study and every label.
  exploitation: 'Read ×4 and ×1 against the reference, the per-label changes and the blends. Activation: the effective config.'
  budget: 'Backbone step time within about 20% of FocalNet-T''s: ten epochs in about 50 to 62 min, inside the 68 min bound;
    peak memory well under FocalNet-T''s 23 GB.'
  implementation: 'Files: modeling/backbone_stages.py (the stage adapter with the multiple-of-16 padding, stage groups stem,
    dense stage 0, 1, 2 to 5, 6), modeling/spatial_tokens.py (mappings derived from the stem and transition downsampling),
    configs/campaign.yaml. Check on CPU the stage shapes and padding equivalence.'
  open_choices: None.
  dependencies: []
  priority_rationale: Feature reuse instead of residual sums; the user's choice.
