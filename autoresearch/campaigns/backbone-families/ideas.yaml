- id: sam2-hiera-tiny
  mechanism_id: family-hiera
  parent_idea_id: null
  title: SAM2.1 Hiera-T (sam2_hiera_tiny.fb_r896_2pt1) on the MambaVision recipe,
    rate 1e-4 and anchors 0.01 early, 0.0001 late for its ResNet-like weight scale
  opportunity: 'Evidence (prior-work.md, The families): the most different family
    available at our size, attention only with no convolutions, local mask-unit attention
    early and global attention in the last stages, pretrained by MAE then promptable
    segmentation on SA-1B and SA-V, so its features are trained to delineate objects;
    Apache-2.0. Its weights shrink with depth like the ResNet-50''s (RMS 0.049 in
    block 0 to 0.021 in block 11, stem 0.018), not flat like MambaVision-T''s (0.08
    to 0.09), so the MambaVision rate and anchors do not transfer. Guess on size:
    level to +0.004 against the reference, and blend value from a different family.'
  mechanism: 'A hiera backbone built from timm''s sam2_hiera_tiny.fb_r896_2pt1 with
    pretrained weights; at 224 px its stage outputs are 96, 192, 384 and 768 channels
    at strides 4, 8, 16 and 32 (stage ends at blocks 0, 2, 9 and 11). to_stride_8
    runs the patch embedding with its position embeddings and the first two stages;
    the middle map is the third stage''s output, the final map the fourth''s. No image-count
    padding (no depthwise convolution, no BatchNorm). Settings: model.backbone the
    new name, optimizer.backbone_lr 0.0001, optimizer.anchor_alpha_early 0.01, optimizer.anchor_alpha_late
    0.0001; everything else the recipe''s.'
  precedents:
  - "Swin-T on the MambaVision recipe, fold 2, 2026-10-14: \xD74 0.937176, blend with\
    \ the ResNet-50 +0.0016 (docs/validation/results/backbones/2026-10-14-swin-t.md)."
  - 'ResNet-50 recipe (weights 0.062 stem to 0.0073 last stage): rate 5e-5, anchors
    0.01 and 0.001.'
  novelty: First attention-only backbone with dense segmentation pretraining here.
  coverage: Every study and every label.
  exploitation: "Read \xD74 and \xD71 against the reference, the per-label changes,\
    \ and the blends with the ResNet-50 and the reference. Activation: the recorded\
    \ effective config names the backbone, and the logged drift of the first and last\
    \ stage groups after epoch 1 is above zero."
  budget: '4.9 GMAC per image against MambaVision-T''s 4.4 (measured): training expected
    near a local MambaVision-T run (about 3,100 s locally, 0.65 of the reference''s
    4,812 s); memory near 12 GB.'
  implementation: 'Files: src/knee_abnormality/modeling/staged_backbones.py or backbone_stages.py
    (the family''s stage adapter, following the existing StagedBackbone or stage classes;
    parameter names with a stem and stages.N so the early anchor covers the patch
    embedding, position embeddings and the first stage), modeling/spatial_tokens.py
    (the mapping entries for the final and layer3 reads, derived from the patch embedding
    and the pooling between stages and checked against the built model), configs/campaign.yaml.
    Check on CPU that the four stage outputs have the shapes above at 224 px and that
    the mapping verifies.'
  open_choices: None.
  dependencies: []
  priority_rationale: The most different family in operator and pretraining, and the
    one the user chose first.
  status: completed
  created_revision: 0
