- id: hrnet-w18
  mechanism_id: family-hrnet
  parent_idea_id: null
  title: HRNet-W18 (hrnet_w18.ms_aug_in1k), parallel high-resolution streams, on the
    recipe with the ResNet-50's rate 5e-5 and anchors 0.005 early, 0.0003 late for
    its BatchNorm convolution weights
  opportunity: 'Evidence (prior-work.md, The families): the only design that keeps
    a high-resolution stream through the whole network, aimed at the located labels
    (menisci, OA compartments) where the other families lose most. A BatchNorm convolution
    network with weights like the ResNet-50''s (RMS 0.04 early to 0.013 in stage 4,
    stem conv 0.15), so the ResNet-50 recipe''s relative step and anchor cost apply,
    not MambaVision''s. MIT. Guess on size: level to +0.004 on the located labels.'
  mechanism: 'An hrnet backbone from timm''s hrnet_w18.ms_aug_in1k with pretrained
    weights, read through its incre features: 128, 256, 512 and 1024 channels at strides
    4, 8, 16 and 32 at 224 px. to_stride_8 runs the stem, layer1 and the second stage,
    and the feature-statistics augmentation acts on the stride-8 branch; the middle
    map is the stride-16 incre output, the final map the stride-32 one. No image-count
    padding (BatchNorm). Settings: model.backbone the new name, optimizer.backbone_lr
    0.00005, optimizer.anchor_alpha_early 0.005, optimizer.anchor_alpha_late 0.0003.'
  precedents:
  - "ResNet-50 recipe: rate 5e-5, anchors 0.01 early on a 0.062 stem and 0.001 late\
    \ on a 0.0073 last stage; here 0.001 \xD7 (0.0073/0.0135)\xB2 \u2248 0.0003 late."
  novelty: First multi-resolution backbone here.
  coverage: Every study; aimed at Medial and Lateral Meniscus and the three OA labels.
  exploitation: "Read \xD74 and \xD71 against the reference, the five located labels\
    \ first, and the blends. Activation: the effective config and the logged drift\
    \ of the stem and stage-4 groups after epoch 1 above zero."
  budget: '4.3 GMAC per image (measured by the search); many small parallel convolutions
    run slower than their GMAC: expected 1.0 to 1.3 of a local MambaVision-T run (0.65
    to 0.85 of the reference''s time); memory 12 to 16 GB.'
  implementation: 'Files: modeling/backbone_stages.py (a stage class that runs HRNet''s
    stem, layer1 and stage 2 in to_stride_8, applies the augmentation to the stride-8
    branch tensor while carrying the other branches, then the rest in deep), modeling/spatial_tokens.py
    (mappings derived from the stem and incre downsampling convolutions), training/lightning.py
    only if the early-anchor prefixes need conv2 and bn2 of the stem, configs/campaign.yaml.
    Check on CPU the incre output shapes at 224 px and the mapping.'
  open_choices: None.
  dependencies: []
  priority_rationale: The family whose design targets the labels where every family
    so far loses.
  status: completed
  created_revision: 0
  seeded: /home/claudio/src/knee-abnormality-backbone-families/autoresearch/campaigns/backbone-families/seed-ideas.yaml
