- id: dinov3-convnext-tiny
  mechanism_id: family-dinov3-convnext
  parent_idea_id: null
  title: DINOv3 ConvNeXt-T (convnext_tiny.dinov3_lvd1689m) on the MambaVision recipe,
    rate 5e-5 and anchors 0.01 early, 0.0002 late for its small flat weight scale
  opportunity: 'Evidence (prior-work.md, DINOv3 ConvNeXt-T): ConvNeXt-T distilled
    from the DINOv3 7B teacher on 1.7B images, self-supervised dense features instead
    of ImageNet labels; second of 34 in the 2026 backbone search (docs/modeling/backbones/backbone-search.md,
    0.904386). Added at the user''s request on 2026-10-15. Its weights are flat over
    depth but small (RMS 0.0096 stem, 0.014 to 0.018 in the stages, against 0.021
    to 0.028 for the in12k ConvNeXt-T), so the MambaVision rate and anchors do not
    transfer. Guess on size: level to +0.004 against the reference, and blend value
    from a self-supervised pretraining.'
  mechanism: 'The existing ConvNeXt adapter with timm''s convnext_tiny.dinov3_lvd1689m
    (pretrained_weights timm): 96, 192, 384 and 768 channels at strides 4, 8, 16 and
    32, ImageNet mean and std, LayerNorm only, image counts padded to a multiple of
    16 as for convnext_tiny.in12k_ft_in1k. Register the name beside convnext_tiny.in12k_ft_in1k
    in modeling/spatial_tokens.py (CONVNEXT_BACKBONES); the mapping function and the
    stage adapter are the ConvNeXt ones. Settings: model.backbone the new name, optimizer.backbone_lr
    0.00005, optimizer.anchor_alpha_early 0.01, optimizer.anchor_alpha_late 0.0002;
    everything else the recipe''s (stochastic depth 0, stage decay 1.0, linear decay,
    late anchor following the rate).'
  precedents:
  - 'Rate: 5e-5 over RMS 0.014 to 0.018 is a relative step of 2.8e-3 to 3.6e-3, inside
    the ResNet-50 recipe''s 8e-4 to 6.8e-3 and near MambaVision''s 2.2e-3 to 2.5e-3.'
  - "Late anchor: 0.0002 \xD7 0.0159\xB2 = 5.1e-8 per relative movement on the last\
    \ stage, matching the ResNet-50's (5.3e-8) and MambaVision's (8.5e-8). Early anchor\
    \ 0.01 as the ResNet-50, the in12k ConvNeXt-T config and Hiera-T."
  - "ConvNeXt-T and -S with DINOv3 weights on the ReXNet-style recipe, fold 0, 2026-10-03:\
    \ \xD74 0.927235 at best against 0.932477 for the ResNet-18 control, on an older\
    \ recipe (docs/modeling/backbones/backbone-swaps.md)."
  novelty: First DINOv3 weights on the current recipe.
  coverage: Every study and every label.
  exploitation: "Read \xD74 and \xD71 against the reference, the per-label changes\
    \ and the blends with the ResNet-50 and the reference. Activation: the recorded\
