ideas:
- id: davit-tiny
  mechanism_id: family-davit
  parent_idea_id: null
  title: DaViT-T (davit_tiny.msft_in1k), window attention alternating with image-wide channel attention, on the
    MambaVision recipe unchanged
  opportunity: 'Evidence (prior-work.md, Four families added on 2026-10-15): Swin-like spatial window attention
    alternating with channel attention that spans the whole image, and a 3×3 depthwise position convolution in every
    block, the local convolution Hiera-T lacked. Closest precedent: Swin-T on this recipe, ×4 0.937176 and +0.0016 in the
    ResNet-50 blend; DaViT-T beats Swin-T on dense prediction (ADE20K 46.3 against 44.5 mIoU, COCO Mask R-CNN 1× 45.0/41.1
    against 43.7/39.8 AP). Apache-2.0. Weights flat at RMS 0.086 to 0.089, MambaVision-T''s scale. Added at the user''s
    request. Guess on size: +0.000 to +0.004 against the reference, blend value from a different operator.'
  mechanism: 'timm''s davit_tiny.msft_in1k with pretrained weights: 96, 192, 384 and 768 channels at strides 4, 8, 16 and
    32 (7×7 stride-4 stem, 2×2 downsamples at the start of stages 1 to 3). to_stride_8 runs the stem and stages 0 and 1;
    the middle map is stage 2''s output, the final map stage 3''s through head.norm. Image counts padded to a multiple of
    16 (depthwise convolutions, LayerNorm only), as for ConvNeXt. Windows of 7 divide every map at 224 px. Mapping
    derived from the stem and downsample convolutions (origins 2, 6 and 14 px at strides 8, 16 and 32) and checked
    against the built model. Settings: model.backbone the new name; rate 2e-4 and anchors 0.001 and 0.00001, the
    recipe''s (relative step 2.2e-3 to 2.6e-3, as MambaVision-T''s).'
  precedents:
  - 'Swin-T on the MambaVision recipe, fold 2, 2026-10-14: ×4 0.937176, 4,023 s, 23.4 GB (docs/validation/results/2026-10-14-swin-t.md).'
  - 'FocalNet-T SRF in this campaign: 23 GB at 332 W in P2 without spilling; 5.5 min per epoch after its speed repair.'
  novelty: First channel-attention backbone here.
  coverage: Every study and every label.
  exploitation: 'Read ×4 and ×1 against the incumbent and the reference, the per-label changes from largest gain to
    largest loss, the token-map metrics, and the blends with the ResNet-50 and the reference. Activation: the recorded
    effective config names the backbone, and backbone_drift_stage4 is above zero after epoch 1.'
  budget: '4.45 GMAC per image; cost proxies like Swin-T''s (V100 throughput 1,059 against Swin-T''s 1,024 img/s), so
    about 5.2 to 5.6 min per epoch (near Swin-T''s 4,023 s, inside 4,090 s only without extra copies); memory 21 to 23 GB.
    Keep every per-step tensor in the layout timm uses and add no permutes or copies beyond the padding.'
  implementation: 'Files: modeling/backbone_stages.py (the stage adapter with the multiple-of-16 padding, following
    StemStages and FocalNet''s adapter), modeling/spatial_tokens.py (mapping entries for the final and layer3 reads and a
    mapping function from the stem and downsample convolutions), training/lightning.py only if the early-anchor
    prefixes miss the stem or stage 0, configs/campaign.yaml. Check on CPU the four stage shapes at 224 px, the mapping,
    and that padding leaves the real rows unchanged.'
  open_choices: None.
  dependencies: []
  priority_rationale: The user's pick with the closest precedent above the reference (Swin-T) and the lowest adapter
    effort.
- id: edgenext-base
  mechanism_id: family-edgenext
  parent_idea_id: null
  title: EdgeNeXt-B (edgenext_base.in21k_ft_in1k), growing-kernel depthwise stages with split-depthwise channel
    attention, ImageNet-21k pretraining, on the MambaVision recipe unchanged
  opportunity: 'Evidence (prior-work.md, Four families added on 2026-10-15): ConvNeXt-like depthwise stages whose kernels
    grow with depth (3 to 9), plus split depthwise transposed attention (channel attention over multi-scale depthwise
    splits) at the end of stages 1 to 3; pretrained on ImageNet-21k then 1k. MIT. Weights flat at RMS 0.085 to 0.090
    (stem 0.073), MambaVision-T''s scale. The cheapest family here (2.9 GMAC, about 17 GB). Added at the user''s
    request. Guess on size: −0.002 to +0.003 against the reference.'
  mechanism: 'timm''s edgenext_base.in21k_ft_in1k with pretrained weights: 80, 160, 288 and 584 channels at strides 4, 8,
    16 and 32 (4×4 stride-4 stem and 2×2 downsamples identical to ConvNeXt''s). to_stride_8 runs the stem and stages 0
    and 1; the middle map is stage 2''s output, the final map stage 3''s through head.norm. Image counts padded to a
    multiple of 16. Mapping: the ConvNeXt mapping (origins 1.5, 3.5, 7.5 and 15.5 px) extended to accept the
    split-depthwise blocks, checked against the built model. Settings: model.backbone the new name; rate 2e-4 and
    anchors 0.001 and 0.00001, the recipe''s (relative step 2.2e-3 to 2.7e-3). Layer-scale gammas reach 6.07 in the
    last block, as large as ConvNeXt''s; no change for them.'
  precedents:
  - 'ConvNeXt-T in12k: same stem and downsample geometry, the existing _convnext_mapping and padding.'
  - 'RadioDINO-S/16 (weights 0.05 to 0.06): the MambaVision rate and anchors held within ±0.0006.'
  novelty: First channel-attention ConvNeXt variant and first ImageNet-21k family in this campaign.
  coverage: Every study and every label.
  exploitation: 'Read ×4 and ×1 against the incumbent and the reference, the per-label changes, the token-map metrics
    and the blends. Activation: the effective config names the backbone; backbone_drift_stage4 above zero after epoch 1.'
  budget: '2.9 GMAC per image: about 4.0 to 4.6 min per epoch, memory about 17 GB.'
  implementation: 'Files: modeling/backbone_stages.py (the stage adapter with the multiple-of-16 padding),
    modeling/spatial_tokens.py (the ConvNeXt-style mapping extended to the split blocks), configs/campaign.yaml. Check
    on CPU the stage shapes at 224 px and the mapping.'
  open_choices: None.
  dependencies: []
  priority_rationale: The user's pick; the safest on time and memory, and ImageNet-21k pretraining.
- id: efficientvit-b2
  mechanism_id: family-efficientvit
  parent_idea_id: null
  title: EfficientViT-B2 (efficientvit_b2.r224_in1k), multi-scale ReLU linear attention at strides 16 and 32, image
    counts padded to 16 with BatchNorm statistics from the real images only, rate 2e-4, anchors 0.001 and 0.00003
  opportunity: 'Evidence (prior-work.md, Four families added on 2026-10-15): MobileNet inverted-residual blocks at strides
    4 and 8, then global ReLU linear attention with multi-scale token aggregation at strides 16 and 32: global context at
    linear cost, strong segmentation per compute (Cityscapes 82.1, ADE20K 45.9 mIoU). Apache-2.0. BatchNorm throughout
    (47 layers) and 30 depthwise plus 10 grouped convolutions: unpadded, every new image count would trigger cuDNN
    planning (ConvNeXt paid 4.3 s per count). Weights fall mildly with depth (stem 0.076, stages 0.057, 0.053, 0.049,
    0.044). Added at the user''s request. Guess on size: −0.004 to +0.002 against the reference; blend value from a
    linear-attention family.'
  mechanism: 'timm''s efficientvit_b2.r224_in1k with pretrained weights: stem at stride 2, stages 0 to 3 at strides 4, 8,
    16 and 32 (48, 96, 192 and 384 channels). to_stride_8 runs the stem and stages 0 and 1; the middle map is stage 2''s
    output, the final map stage 3''s (no final norm in the model; the final read takes stage 3 as it is). Image counts
    padded to a multiple of 16, and every BatchNorm in the backbone takes its batch statistics, and its running-statistics
    update, from the real rows only: a wrapper replaces each BatchNorm2d, computes mean and variance over the first count
    rows in training mode, normalises all rows with them and updates the running statistics as BatchNorm2d would; in
    eval mode it is BatchNorm2d. The real row count reaches the wrappers through the stage adapter without a host
    synchronisation. With that, padding leaves the real rows'' outputs and the statistics exactly as unpadded. Mapping:
    origin 0 at every stride as derived from the stem and the stride-2 convolutions, checked against the built model.
    Settings: model.backbone the new name; rate 2e-4 (relative step 2.6e-3 to 4.5e-3); early anchor 0.001; late anchor
    0.00003, whose cost per relative movement on the last stage (0.00003 × 0.044² = 5.8e-8) matches the ResNet-50''s
    (5.3e-8) and MambaVision-T''s (8.5e-8), where the recipe''s 0.00001 would give a third of it.'
  precedents:
  - 'MaViT-S: BatchNorm with depthwise convolutions cost 8 s per new image count unpadded (docs/modeling/mambavision-backbone.md).'
  - 'PVTv2-b2 (weights 0.045 to 0.056) and RadioDINO-S/16: the recipe''s rate held.'
  novelty: First linear-attention backbone and first padded BatchNorm family here.
  coverage: Every study and every label.
  exploitation: 'Read ×4 and ×1 against the incumbent and the reference, the per-label changes, the token-map metrics
    and the blends. Activation: the effective config names the backbone; backbone_drift_stage4 above zero after epoch
    1.'
  budget: '1.5 GMAC per image but 101 MB of saved activations per image and fp32 attention (timm turns autocast off in
    it): about 4.0 to 4.8 min per epoch once padded; memory near FocalNet-T''s minus a tenth.'
  implementation: 'Files: modeling/backbone_stages.py (the stage adapter with the multiple-of-16 padding and the
    real-row BatchNorm wrapper), modeling/spatial_tokens.py (mapping), configs/campaign.yaml. Check on CPU at two image
    counts that the real rows'' outputs, the batch statistics and the running statistics after one training-mode forward
    are equal with and without padding, and the mapping.'
  open_choices: None.
  dependencies: []
  priority_rationale: The user's pick; the one global-attention family that is cheap at stride 16 and 32.
- id: wtconvnext-tiny
  mechanism_id: family-wtconvnext
  parent_idea_id: null
  title: WTConvNeXt-T (official checkpoint), ConvNeXt-T with wavelet convolutions in place of the 7×7 depthwise
    convolutions, through the official fused Triton kernels, on the MambaVision recipe unchanged
  opportunity: 'Evidence (prior-work.md, Four families added on 2026-10-15): each block''s depthwise convolution becomes a
    wavelet convolution, a 5×5 depthwise base plus 5, 4, 3 and 2 Haar levels in stages 0 to 3, each level a 5×5 depthwise
    convolution on the four Haar subbands: a large low-frequency receptive field while the edge subbands keep thin
    detail. Against ConvNeXt-T in its paper: ADE20K 46.6 against 46.0 mIoU, COCO 51.0/44.4 against 50.4/43.7 AP, shape
    bias 29.2% against 21.7%, ImageNet-C mCE 52.0 against 53.2. MIT. Weights flat at RMS about 0.10. Added at the
    user''s request. Guess on size: level to +0.004 against the reference.'
  mechanism: 'A backbone in a new file modeling/wtconv.py: the wavelet convolution layer vendored from the official MIT
    repository (local clone /home/claudio/.cache/wtconv-src/WTConv): the pure Triton implementation in
    fast_wtconv/wtconv_triton.py and fast_wtconv/triton_haar/ (fused Haar, conv and scale forward, fused inverse Haar,
    scaled depthwise base convolution), with the Haar filters written out (no PyWavelets) and the MIT copyright notice
    kept as the licence requires. The network is timm''s ConvNeXt-T layout (convnext_tiny, conv stem 4×4 stride 4,
    2×2 downsamples, 96, 192, 384 and 768 channels) built without pretrained weights, each block''s conv_dw replaced by
    the wavelet layer with kernel 5 and the stage''s levels, then loaded strictly from the official checkpoint
    /home/claudio/.cache/torch/hub/checkpoints/wtconvnext_tiny_official.pth (sha256
    1df1052d1bd288d481adbf227833f33e1bf5c0644da453c427a90d3a406d091f), mapping its key names
    (wtconvnext/wtconvnext.py and wtconv/wtconv2d.py in the clone) onto the vendored layer''s; every checkpoint
    tensor used and no new parameter left random. The Triton layer takes contiguous NCHW: convert from channels_last
    inside the layer only, and back. Image counts padded to a multiple of 16; stem, downsamples and mapping as ConvNeXt''s
    (origins 1.5, 3.5, 7.5 and 15.5 px; the wavelet convolutions keep the cell centres, check it against the layers).
    model.backbone a new name (wtconvnext_tiny), pretrained_weights as the existing families use it. Settings: rate 2e-4
    and anchors 0.001 and 0.00001, the recipe''s (relative step 2.0e-3).'
  precedents:
  - 'Fast WTConv (arXiv 2608.10805): the Triton backend runs the layer about 3.0× faster than the original on an RTX
    A6000; the original WTConvNeXt-T trains at 0.67× ConvNeXt-T''s throughput on a 3090.'
  - 'ConvNeXt-T in12k: the stem and downsample geometry and the padding.'
  novelty: First frequency-domain operator here.
  coverage: Every study and every label.
  exploitation: 'Read ×4 and ×1 against the incumbent and the reference, the per-label changes (menisci, cartilage-borne
    OA labels and ACL first), the token-map metrics and the blends. Activation: the effective config names the backbone;
    backbone_drift_stage4 above zero after epoch 1.'
  budget: '4.5 GMAC per image; with the Triton layer expected about 4.6 to 5.3 min per epoch, memory near FocalNet-T''s.
    The original PyTorch layer would take 6.5 to 7.5 min per epoch, over the bound, so the Triton path is the
    implementation.'
  implementation: 'Files: src/knee_abnormality/modeling/wtconv.py (new: the vendored layer, the kernels and the
    backbone builder), modeling/backbone_stages.py (the stage adapter with the multiple-of-16 padding),
    modeling/spatial_tokens.py (mapping), configs/campaign.yaml. Check on CPU: the strict checkpoint load; the vendored
    Triton forward and backward against the original PyTorch layer (wtconv/wtconv2d.py logic, Haar filters written out)
    on tiny tensors with TRITON_INTERPRET=1, in float32, to 1e-5 relative; the stage shapes at 224 px; the mapping.'
  open_choices: None.
  dependencies: []
  priority_rationale: The user's pick with the most adapter work, so last.
