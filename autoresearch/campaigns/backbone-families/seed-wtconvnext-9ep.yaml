  title: WTConvNeXt-T, the repaired candidate unchanged, at nine epochs to fit the time bound
  opportunity: 'Evidence (run-notes.md, runs 18 and 20): the repaired WTConvNeXt-T candidate (experiment wtconvnext-tiny-relaunch-20261016T023531Z-328fea54)
    runs 0.726 s per step; its preflight projected 4,183 s for ten epochs, 2.3% over the 4,090 s bound, and stopped it before
    training. Epochs are a family setting in this campaign; nine epochs project about 3,770 s. Evidence (prior-work.md, Four
    families added on 2026-10-15): each block''s depthwise convolution becomes a wavelet convolution, a 5×5 depthwise base
    plus 5, 4, 3 and 2 Haar levels in stages 0 to 3, each level a 5×5 depthwise convolution on the four Haar subbands: a large
    low-frequency receptive field while the edge subbands keep thin detail. Against ConvNeXt-T in its paper: ADE20K 46.6 against
    46.0 mIoU, COCO 51.0/44.4 against 50.4/43.7 AP, shape bias 29.2% against 21.7%, ImageNet-C mCE 52.0 against 53.2. MIT.
    Weights flat at RMS about 0.10. Added at the user''s request. Guess on size: level to +0.004 against the reference.'
  mechanism: Copy unchanged the changed files of the repaired candidate from /home/claudio/src/knee-abnormality/outputs/autoresearch/backbone-families/experiments/wtconvnext-tiny-relaunch-20261016T023531Z-328fea54/workspace
    (configs/campaign.yaml, src/knee_abnormality/modeling/wtconv.py, backbone_stages.py, model.py, spatial_tokens.py and training/lightning.py),
    rebased on the current incumbent, and set trainer.max_epochs 9. No other change.
