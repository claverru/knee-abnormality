ideas:
- id: radimagenet-inception-resnet-v2-grids
  mechanism_id: family-radimagenet-inception-resnet
  parent_idea_id: null
  title: Original RadImageNet InceptionResNetV2 (keeper-converted Keras weights), input in [0, 1], rate and anchors
    from its weight scale, with the integration the first two RadImageNet builds needed
  opportunity: 'Evidence (prior-work-radimagenet.md): the RadImageNet pretraining of the strongest backbone here
    with residual Inception blocks, the largest of the three. The conversion equals the Keras model to 5e-6. Guess
    on size: below FocalNet-T to level at x4; value in the blend with the ResNet-50.'
  mechanism: 'A backbone named radimagenet_inception_resnet_v2: timm inception_resnet_v2 (num_classes 0, drop rate
    0) loaded from ~/.cache/torch/hub/checkpoints/radimagenet_inception_resnet_v2_keras.pt with load_state_dict(strict=False),
    failing on any missing key except num_batches_tracked or any unexpected key, sha256 3322cd7f261c7680bf44b887cbde5e2e65277b4a4d55ff55ed31bb25736ea178.
    Stages: conv2d_1a to conv2d_4a with both max pools are the stem; mixed_5b is the first stage; to_stride_8 ends
    after the repeat (block35) group (25x25); the middle map is repeat_1''s output (block17, 12x12); the final map
    is mixed_7a, repeat_2, block8 and conv2d_7b (5x5). Non-zero origins from the unpadded stride-2 layers; the mapping
    derives them. No image-count padding. Settings: model.backbone radimagenet_inception_resnet_v2, data.mean [0,
    0, 0], data.std [1, 1, 1], optimizer.backbone_lr 0.00056, optimizer.anchor_alpha_early 0.000127, optimizer.anchor_alpha_late
    0.00000127, trainer.max_epochs 10, trainer.patience 10. Integration, from the DenseNet-121 and InceptionV3 builds
    (prior-work-radimagenet.md, integration defects): the backbone module exposes pretrained_cfg (timm''s, with
    this file''s sha256, mean 0 and std 1), which the preflight records; and the 12x12 middle and 5x5 final grids
    are not in a 2:1 ratio, so both places in modeling/model.py that repeat the stride-32 tokens 2x2 onto the stride-16
    grid (the meniscus head and the cartilage-zone weighting) use a nearest-centre gather from the two mappings
    instead, clamped to the grid, ties rounded down, which equals the 2x2 repeat exactly for every existing backbone
    (check it on the CPU). Reuse the InceptionV3 candidate''s implementation of that gather if it was approved.'
  precedents:
  - 'Refined-RadImageNet ResNet-50, the same images: resnet50-silver-fold2 x4 0.937820.'
  novelty: First residual Inception backbone here.
  coverage: Every study and every label.
  exploitation: 'Read x4 and x1 against the incumbent and per label, then the blend with the ResNet-50. Activation:
    the effective config names the backbone; drift of the stem and stage-4 groups after epoch 1 above zero.'
  budget: 'Measured 0.108 s per 64 images, 3.5 GiB per 64: about 3,500 s for ten epochs, about 15 GiB at 256 images.'
  implementation: 'Files: the builder and stage adapter, modeling/spatial_tokens.py (mappings from the unpadded
    stride-2 layers), configs/campaign.yaml. Check on CPU: the load, the hash, the stage shapes, the mapping. modeling/model.py:
    the two nearest-centre gathers, unless already present in the parent source.'
  open_choices: None.
  dependencies: []
  priority_rationale: Re-described by the keeper on 2026-10-17 at the user's request (replaces radimagenet-inception-resnet-v2)
    so the build needs no repair for the two defects the first two RadImageNet builds hit.
exhausted_directions: None.
