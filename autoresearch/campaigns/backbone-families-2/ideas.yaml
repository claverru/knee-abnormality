- id: overlock-xt
  mechanism_id: family-overlock
  parent_idea_id: null
  title: OverLoCK-XT (overlock_xt_in1k_224, training form), context-mixing dynamic
    convolution with an overview pass, its natten window op replaced by an exact dense
    PyTorch form, on the recipe's settings
  opportunity: "Evidence (prior-work.md, OverLoCK-XT): a convolutional network that\
    \ first computes a stride-32 overview of the whole image and then reruns the stride-16\
    \ and stride-32 stages with per-pixel kernels conditioned on that context (ContMix),\
    \ a top-down design none of the families tried has. 15.5M parameters and 2.84\
    \ GMAC, the cheapest in compute of the six. Weights flat at RMS 0.065 to 0.083,\
    \ in the band where the recipe's rate and anchors held for FocalNet-T, DaViT-T\
    \ and MambaVision-T. Apache-2.0 code. Guess on size: level with FocalNet-T to\
    \ +0.001 at \xD74, and value in the blend with the ResNet-50."
  mechanism: "Vendor models/overlock.py and models/contmix.py of LMMMEng/OverLoCK\
    \ fb6f22b (~/.cache/overlock-src) into src/knee_abnormality/modeling/families/overlock.py,\
    \ without the natten and mmengine imports and with na2d_av replaced by the dense\
    \ scatter: the window weights scattered into an HW\xD7HW matrix per head, then\
    \ a matmul (HW 196 at stride 16, 49 at 32; measured \u22643e-7 from a direct gather\
    \ with natten's window rule). Build overlock_xt with drop path 0 and load ~/.cache/torch/hub/checkpoints/overlock_xt_in1k_224.pth\
    \ strictly (the training form, 1,564 keys). Stages: the stem (patch_embed1) and\
    \ blocks1 are the stem and first stage; to_stride_8 ends after blocks2 (112 ch);\
    \ the middle map is the Focus net's sub_blocks3 output (256 + 84 ch at stride\
    \ 16, after the Base blocks3 and the Overview blocks4 and high_level_proj have\
    \ run); the final map is sub_blocks4's output (420 ch at stride 32). The aux head\
    \ and the classification head are dropped. Origin 0 px at every stride. Image\
    \ counts padded to 16 with every BatchNorm taking its batch statistics from the\
    \ real images only, as EfficientViT-B2 does. Settings: model.backbone the new\
    \ name, trainer.max_epochs 10, trainer.patience 10, the recipe's rate 2e-4 and\
    \ anchors 0.001 and 0.00001."
  precedents:
  - "FocalNet-T SRF on these settings, fold 2: \xD74 0.938816, blend with the ResNet-50\
    \ +0.003179 (the reference)."
  - "EfficientViT-B2, the first round's BatchNorm family with depthwise convolutions:\
    \ real-row BatchNorm padding, \xD74 0.938773 with stochastic depth 0.2, blend\
    \ with the ResNet-50 +0.003098."
  novelty: First top-down context network and first dynamic-kernel convolution here.
  coverage: Every study and every label.
  exploitation: "Read \xD74 and \xD71 against FocalNet-T and per label, then the blend\
    \ with the ResNet-50 against FocalNet-T's +0.003179. Activation: the effective\
    \ config names the backbone; the logged drift of the stem and the Focus stage-4\
    \ groups after epoch 1 is above zero; on the CPU the dense ContMix output equals\
    \ the gather reference within 1e-5 on the loaded weights."
  budget: '2.84 GMAC per image, but 187 BatchNorm, SE, GRN and many small kernels;
    activations 266 MiB per image against FocalNet-T''s 178 (measured). Guess: 1.0
    to 1.5 times ConvNeXt-T''s step, about 300 to 400 s per epoch; memory about 1.5
    times FocalNet-T''s activations, so blocks1 and blocks2 are checkpointed when
    the preflight needs it (the recompute must not update BatchNorm running statistics
    twice).'
  implementation: 'Files: modeling/families/overlock.py (vendored model, Apache-2.0
    header kept, dense ContMix), modeling/staged_backbones.py or backbone_stages.py
    (the stage adapter and the real-row BatchNorm padding as for EfficientViT-B2),
    modeling/spatial_tokens.py (mappings for the stride-16 and stride-32 reads, derived
    from the downsamplers and raising if they differ), training/lightning.py only
    if the early-anchor prefixes need the stem''s names, configs/campaign.yaml. Check
    on CPU: strict load, the stage shapes above, ContMix against the gather reference,
    the mapping.'
  open_choices: None.
  dependencies: []
  priority_rationale: Pure PyTorch, small and the only top-down design; first in the
    user's order.
