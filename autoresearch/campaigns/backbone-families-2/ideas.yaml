- id: flash-internimage-tiny
  mechanism_id: family-internimage
  parent_idea_id: null
  title: FlashInternImage-T (flash_intern_image_t_1k_224), learned deformable sampling
    through the DCNv4 CUDA op in float32, on the recipe's settings
  opportunity: "Evidence (prior-work.md, FlashInternImage-T): every block samples\
    \ nine learned positions per group instead of a fixed grid, so it can follow curved\
    \ and thin structures (menisci, cartilage, ligaments), the labels where the first\
    \ round's families lost most. 28.7M parameters, 4.85 GMAC, LayerNorm only, MIT\
    \ code. Weights flat at RMS 0.085 to 0.107, MambaVision-T's and DaViT-T's range\
    \ on these settings. Guess on size: level with FocalNet-T to +0.0015 at \xD74."
  mechanism: "Vendor the FlashInternImage model of OpenGVLab/DCNv4 4b848f7 (~/.cache/flashinternimage-src/DCNv4,\
    \ classification/models/flash_intern_image.py and the DCNv4 module wrapper) into\
    \ src/knee_abnormality/modeling/families/internimage.py, calling the DCNv4 extension\
    \ installed in the environment (dcnv4 1.0.0.post2+knee1, built in Kaggle's image\
    \ for compute 7.5 and 8.6, with the block multiplier taken from the factors of\
    \ H\xB7W: prior-work.md, upstream batch bug) through its DCNv4Function; import\
    \ it lazily inside the module, never at file import. Build the T configuration\
    \ (channels 64, groups 4, 8, 16, 32, depths 4, 4, 18, 4, offset scale 1, MLP ratio\
    \ 4, no layer scale, no post-norm) with drop path 0 and load ~/.cache/torch/hub/checkpoints/flash_intern_image_t_1k_224_model.pth\
    \ strictly; conv_head and the classifier are dropped. The DCNv4 call runs in float32\
    \ with autocast disabled around it (its bfloat16 backward fails and the recipe\
    \ trains under bf16-mixed), and im2col_step equals the call's image count, so\
