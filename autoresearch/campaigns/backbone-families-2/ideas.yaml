    \ its 3\xD73 neighbourhood and to 7\xD77 pooled tokens of the whole image in one\
    \ softmax from stride 4 on, so fine local detail and global context meet in every\
    \ block; 12.4M parameters, 2.65 GMAC, Apache-2.0 code and weights. Matrices at\
    \ RMS 0.046 to 0.058, the band of the recipe's settings. Guess on size: level\
    \ with FocalNet-T to +0.001 at \xD74, and value in the blend with the ResNet-50."
