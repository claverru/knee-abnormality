- id: medsam2-stem-separated-clipping
  mechanism_id: family-hiera-medical
  parent_idea_id: medsam2-hiera-tiny
  title: Separate MedSAM2 stem clipping from the remaining model
  opportunity: "Measured: every logged pre-clipping gradient norm in MedSAM2 epochs\
    \ 2\u20139 exceeds the configured limit of 1.0; epoch medians range from 1.888\
    \ to 2.770. FocalNet's corresponding medians are 0.634\u20130.833. MedSAM2's stem\
    \ gradient RMS remains 0.0101 at epoch 9 versus FocalNet's 0.0052. Hypothesis:\
    \ the small-scale medical stem contributes disproportionately to global clipping\
    \ and suppresses adaptation elsewhere. Groupwise RMS does not establish its share\
    \ of total gradient energy."
  mechanism: 'Change only the clipping partition for MedSAM2: clip the loaded stem,
    including positional embeddings, to norm 1.0 and clip all remaining trainable
    parameters together to norm 1.0. Retain the ten-epoch schedule, rates and anchors.
    This changes which gradients share a clipping multiplier rather than raising the
    common threshold. Log pre-clipping stem and remainder norms and the fraction of
    optimizer steps whose applied gradients differ from global clipping. Activation
    requires medsam2_split_clip_changed_step_fraction > 0 in epoch 0. Six nominated
    metrics: that fraction, stem norm, remainder norm, backbone_drift_stage4, train_loss_epoch
    and val_macro_auc.'
  precedents:
  - 'MedSAM2 metrics: /home/claudio/src/knee-abnormality/outputs/autoresearch/backbone-families-2/experiments/medsam2-hiera-tiny-20261017T125048Z-af5bfb90/training/fold_2/logs/version_0/metrics.csv.
    The grad_norm hook measures gradients before clipping; these are sparse logged
    diagnostics, not every optimizer step.'
  - prior-work.md#starting-settings records MedSAM2 stem weight RMS 0.013 and falling
    stage weight scales, unlike the flatter FocalNet family.
  - "External precedent rn18-separate-module-clipping-20260929T054103Z-194ab554 was\
    \ rejected: \xD74 delta \u22120.002412, central 80% interval [\u22120.003914,\
    \ \u22120.000906], with activation passing. Its record is in the supplied radimagenet-rn18\
    \ state. This weakens generic module clipping; the proposed difference is a MedSAM2-specific\
    \ stem partition motivated by its observed persistent clipping."
  novelty: A family-specific clipping partition addressing a measured optimization
    pattern. It neither repeats the RN18 module partition nor assumes that relaxing
    clipping generally helps.
  coverage: Targets adaptation across the entire model and all twelve labels. No label-specific
    clipping, objective or acceptance criterion.
  exploitation: Tests a concrete cause of MedSAM2's slow convergence while preserving
    its medical checkpoint and native maps. Improvement remains a hypothesis; Adam's
    normalization may reduce the benefit, and the total possible update norm increases
    when both groups clip independently.
  budget: "Estimate: approximately 2,900\u20133,100 s and 18\u201319 GiB peak allocated\
    \ memory, based on the seed's measured 2,892 s and 17.796 GiB. Two gradient reductions\
    \ should add little activation memory. These estimates are unmeasured; the unchanged\
    \ supervisor preflight and resource bounds apply."
  implementation: Port the completed MedSAM2 adapter onto the development parent and
    replace its global clipping operation with a MedSAM2-specific Lightning configure_gradient_clipping
    implementation. Apply each partition exactly once after precision-plugin unscaling;
    avoid subsequent global clipping. Add diagnostics in training/lightning.py. Retain
    strict checkpoint loading, geometry, stride-8 augmentation, routing, heads, losses
    and all other backbone behavior. Add no clipping-mode option. If another incumbent
    is accepted, retain unrelated accepted changes and compare with that live incumbent;
    do not silently combine other MedSAM2 follow-ups.
  open_choices: 'Stem dominance is unproven: record gradient energy by partition during
    the candidate. The earlier RN18 rejection lowers confidence. This is one candidate,
    with no confirmation run or additional adoption threshold.'
  dependencies: []
  priority_rationale: 'First: fulfills the open MedSAM2 retry with a structural change
    tied to newly measured clipping evidence. Low implementation cost and a falsifiable
    signature; uncertainty remains substantial.'
  source_change: true
  targeted_curve: "MedSAM2 epochs 2\u20139: logged gradient norms remain above 1.0\
    \ while loss falls from 0.6692 to 0.5375 and \xD71 AUC rises from 0.8474 to 0.9114.\
    \ Aim to accelerate loss reduction and macro AUC improvement by removing clipping\
    \ competition with the stem."
  status: completed
  created_revision: 139
  ranking_rationale: "Admit four proposals; proposal_admission reports all dependencies\
