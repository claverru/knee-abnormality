  parent_idea_id: radimagenet-densenet121
  title: RadImageNet DenseNet-121 with the stride-16 map read through transition3's
    own BatchNorm and a ReLU, as DenseNet itself consumes it
  opportunity: 'Evidence (run radimagenet-densenet121, epochs 0 to 3, against focalnet-silver-fold-2):
    the total training loss tracks FocalNet-T (0.560 against 0.553 at epoch 3) but
    the heads that read the stride-16 map lag: meniscus loss 0.710 against 0.644 (validation
    0.677 against 0.606), anatomy 0.717 against 0.677 (validation 0.671 against 0.656).
    The middle map is denseblock3''s raw output, a concatenation of un-normalised
    convolution outputs: on eight real slices its RMS is 4.74, channel RMS 2.3 to
    19.9 (median 4.2), against 0.43 for the final map (norm5 and ReLU); after transition3.norm,
    the BatchNorm DenseNet applies to exactly this tensor, it is 0.52 (measured by
    the keeper). Guess on size: +0.002 to +0.005 at x4 over radimagenet-densenet121,
    mostly on the meniscus and located labels.'
  mechanism: In the DenseNet stage adapter the middle map becomes relu(features.transition3.norm(denseblock3
    output)); the final path is unchanged (transition3 still takes the raw denseblock3
    output, so the network's own computation is untouched). The middle width stays
    1024. Everything else as radimagenet-densenet121 (its source and config).
  precedents:
  - 'radimagenet-densenet121: the parent, running at the time of writing.'
