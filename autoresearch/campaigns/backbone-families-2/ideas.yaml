  parent_idea_id: lingbot-stage-decay-08
  title: Give stage-decayed LingBot twelve epochs within its preflight envelope
  opportunity: "Measured: lingbot-stage-decay-08 reaches its best \xD71 AUC at the\
    \ final epoch. Across epochs 7\u20139, AUC rises 0.9252\u21920.9263\u21920.9271\
    \ while loss falls 0.5212\u21920.5138\u21920.5080. Validation soft AUC and meniscus\
    \ loss also improve through the finish. Hypothesis: its ten-epoch decay ends adaptation\
    \ too early. The original preflight supports twelve epochs; thirteen would project\
    \ beyond the ceiling."
  mechanism: 'Change only the family''s horizon from ten to twelve epochs, with coupled
    patience twelve. Retain stage decay 0.8, the one-epoch warmup, base rates, anchors
    and existing horizon-dependent linear decay. This gives two additional epochs
    and stretches the decay without introducing another schedule. Retain epoch-0 activation
    lingbot_stage_decay_applied_steps > 0; values above 4,420 after epoch 9 demonstrate
    execution beyond the old horizon. Twelve complete epochs provide 5,304 optimizer
    steps. Nominated scalars: applied steps, train_loss_epoch, val_macro_auc and backbone
    drift at stages 0 and 4.'
  precedents:
  - run_curves.full_detail contains the completed ten-epoch loss, macro, per-label
    and mechanism curves for lingbot-stage-decay-08.
  - 'Original preflight: /home/claudio/src/knee-abnormality/outputs/autoresearch/backbone-families-2/experiments/lingbot-stage-decay-08-20261017T150028Z-e9eb5ead/preflight/preflight.json:
    ten epochs project to 3,252.509942 s, including 7.366365 s first-epoch extra cost.'
  - 'Measured timing: the same experiment''s training/fold_2/timing.json records 2,874.970287
    s and 14,723,448,832 allocated bytes.'
  - FocalNet's macro AUC peaks at epoch 9 and declines afterward despite falling loss.
    This demonstrates why extra epochs are a LingBot hypothesis rather than a generally
    beneficial recipe change.
  novelty: Tests the convergence horizon of the improved LingBot rate setting. It
    does not repeat a rate-strength change or alter the adapter.
  coverage: "All twelve labels and both existing reads remain unchanged. Evaluate\
    \ the selected checkpoint using the fixed \xD71/\xD74 macro rule."
  exploitation: Uses the continuing validation improvement of the family's best completed
    run. Two extra epochs may still be insufficient, or the longer high-rate exposure
    may cause overfitting.
  budget: "Preflight-derived projection: 7.366365 + 12 \xD7 (3,252.509942 \u2212 7.366365)/10\
    \ = 3,901.539 s. Scaling measured completed time gives approximately 3,450 s;\
    \ this is an estimate. Expected memory remains near the measured 13.712 GiB and\
    \ projected 14.414 GiB. Thirteen epochs project to 4,226.053 s and are not proposed."
  implementation: Use the completed lingbot-stage-decay-08 source and set trainer.max_epochs
    and trainer.patience to twelve in configs/campaign.yaml. Replace the ten-epoch
    active schedule; retain the existing scheduler implementation and all adapter,
    optimizer and augmentation behavior. Do not combine the proposed middle normalization.
    If a new incumbent is accepted, preserve unrelated accepted changes while retaining
    this explicitly named LingBot starting setting and comparing with the live incumbent.
  open_choices: The continuing curve supports a horizon experiment, not a predicted
    win. Twelve is chosen from the existing resource projection, without selecting
    an epoch count by label results. No confirmation branch or fallback horizon is
    proposed.
  dependencies: []
  priority_rationale: 'Second: fulfills the rate family''s open follow-up using observed
    unfinished convergence. Implementation cost is minimal; the preflight projection
    leaves about 190 s below the ceiling.'
  source_change: false
  targeted_curve: "lingbot-stage-decay-08 epochs 7\u20139: \xD71 macro AUC continues\
    \ rising and both training and validation meniscus losses fall. Seek continued\
    \ macro improvement through epochs 10\u201311 instead of terminating at the current\
    \ final-epoch maximum."
  status: retired
  created_revision: 211
  ranking_rationale: 'Admit both dependency-satisfied LingBot proposals behind the
    reserved head and user-ordered seeds. Middle-read normalization ranks first: inspected
    adapter code exports raw intermediate tokens, while the pinned official API applies
    the checkpoint norm by default. Twelve epochs ranks next: the improved family''s
    curve continues rising at termination and its original preflight supports a roughly
    3,902 s projection. Both offer more concrete evidence of potential than the unmeasured
    five-epoch VSSD retry. Neither repeats a measured configuration in the family
    ledger, prior-work precedent table, or searched results/history documentation.
    Leave medsam2-frozen-pretrained-stem proposed: partition-average gradient norms
    do not establish harmful clipping interference, freezing removes potentially necessary
    adaptation, and the distinct but relevant rn18-freeze-stem-layer1 precedent was
    rejected. The large MedSAM2 deficit and existing horizon investigation make this
    a weaker addition.'
  retired_reason: 'User 2026-10-17: do not queue three LingBot follow-ups before more
