- id: medsam2-frozen-pretrained-stem
  mechanism_id: family-hiera-medical
  parent_idea_id: medsam2-hiera-tiny
  title: Freeze MedSAM2's pretrained patch stem to remove its clipping competition
  opportunity: "Measured in the cancelled split-clipping attempt: epoch-average stem\
    \ pre-clipping norms are 3.0061, 3.0202, 2.5995, 2.3337 and 2.3104; remainder\
    \ norms are 1.5525, 1.7056, 1.6163, 1.6311 and 1.6019. Split clipping changed\
    \ 84.84\u201399.77% of steps. Thus the stem contributes a substantial clipping\
    \ load. Hypothesis: retaining its medically pretrained patch embedding and positional\
    \ tensors while adapting every block can free the remaining model to learn more\
    \ effectively."
  mechanism: 'Against the completed MedSAM2 seed settings, freeze only backbone.stem
    parameters for the whole ten-epoch run, including patch embedding and positional
    embeddings. Keep every Hiera block trainable and retain global norm-1 clipping
    over trainable parameters. This removes the stem''s gradients from the clipping
    pool without independently increasing partition limits. Preserve differentiation
    through the stem to image sampling. Activation: medsam2_frozen_stem_active_fraction
    >= 1 in epoch 0, requiring frozen parameters, absent optimizer membership and
    gradients, and unchanged loaded values at every recorded step. Six scalars: activation
    fraction, stem maximum displacement, pre-clipping global norm, backbone_drift_stage4,
    train_loss_epoch and val_macro_auc.'
  precedents:
  - "medsam2-stem-separated-clipping curves and metrics establish substantial stem\
    \ clipping load. Cancellation after epochs 0\u20134 leaves its final \xD71/\xD7\
    4 benefit unknown; this proposal does not assume that split clipping succeeded."
  - 'Completed family source: /home/claudio/src/knee-abnormality/outputs/autoresearch/backbone-families-2/experiments/medsam2-hiera-tiny-20261017T125048Z-af5bfb90/source/src/knee_abnormality/modeling/families/medsam2.py.
    HieraStem contains patch_embed, pos_embed and pos_embed_window, separately from
    all four block stages.'
  - prior-work.md#medsam2-hiera-t records medical pretraining and stem weight RMS
    0.013. The completed seed's stem relative drift reaches 0.1323 before falling
    to 0.0977.
  - "The supplied radimagenet-rn18 state records rn18-freeze-stem-layer1 rejected\
    \ at \xD74 \u0394 \u22120.002890, central 80% interval [\u22120.004411, \u2212\
    0.001384]. That broader convolutional/BatchNorm freeze is negative evidence; this\
    \ candidate freezes only MedSAM2's patch stem and retains every block's adaptation."
  - medsam2-thirteen-epochs is developing and medsam2-normalized-exported-maps is
    already proposed. They remain separate experiments and are not prerequisites.
  novelty: 'A MedSAM2-specific alternative to the incomplete split-clipping experiment:
    remove the measured stem clipping load by freezing its parameters while preserving
    gradients to the sampled image. It does not repeat the broader RN18 stem-plus-first-stage
    freeze.'
  coverage: Changes backbone optimization for all labels. Preserves native spatial
    maps, all trainable Hiera stages, sampling gradients and downstream readers.
  exploitation: Tests the concrete stem-interference diagnosis while retaining the
    medical initialization. The stem may require adaptation to 224 px knee triplets;
    freezing its positional embeddings could worsen the resolution mismatch. The earlier
    RN18 result lowers confidence.
  budget: "Estimate: 2,600\u20132,950 s and 17\u201318.5 GiB for ten epochs, based\
    \ on the completed seed's 2,892.012 s and 17.796 GiB. Input gradients still require\
    \ stem backward computation, so large savings are not assumed. Its seed preflight\
    \ projected 3,125.446 s and 18.076 GiB. Candidate costs remain subject to the\
    \ unchanged gates."
  implementation: 'Use the completed MedSAM2 seed adapter and freeze stem parameters
    before optimizer construction. The existing optimizer already excludes requires_grad=False
    tensors. Retain ten epochs, rate 1e-4, anchors 0.01/0.0003 and global clipping;
    do not import the cancelled split-clipping hook. Retain provenance and drift snapshots
    for the frozen tensors. Keep stem forward operations in the autograd graph: no
    no_grad, detach or cached features. Add activation and displacement logging in
    training/lightning.py, with no freeze-mode option. Preserve unrelated newly accepted
    incumbent behavior and compare against the live incumbent without silently combining
    medical follow-ups.'
  open_choices: Partition means do not establish per-step dominance, and cancellation
    supplies no final benefit estimate. Freezing may prevent necessary input adaptation.
    This independent candidate needs no result from the developing thirteen-epoch
    run.
  dependencies: []
  priority_rationale: 'Third: a distinct source change tied to newly observed partition
    norms. Confidence is lower than for the LingBot proposals because MedSAM2''s deficit
    is large and historical freezing evidence is negative.'
  source_change: true
  targeted_curve: "MedSAM2 epochs 0\u20134: stem norms exceed remainder norms while\
    \ the seed learns slowly, loss 0.8008\u21920.6136 and \xD71 macro 0.7434\u2192\
    0.8820. Seek faster whole-model adaptation by removing stem clipping load, with\
    \ every Hiera block still trainable."
  status: proposed
  created_revision: 211
- id: lingbot-decay-early-anchor-1e-4
  mechanism_id: family-lingbot-anchor
  parent_idea_id: lingbot-stage-decay-08
  title: LingBot ViT-S/16 with stage decay 0.8 and the early anchor lowered from 0.001
    to 0.0001, so block 0 stops being pulled back to its start
  opportunity: 'Evidence (runs lingbot-vit-small-stride16 and lingbot-stage-decay-08):
    in both runs the drift of stage 1 (block 0, under the early anchor) falls through
    training, 0.022 to 0.010 and 0.017 to 0.009, while every other group rises; FocalNet-T''s
    first stage under the same anchor rises to 0.045. Block 0''s layer-scale gammas
    are small (0.15 mean absolute, prior-work.md), so its task gradient is small and
    the anchor term dominates its Adam update. The decay run fixed the stem (drift
    0.039 at epoch 9, FocalNet-T''s 0.036 to 0.040) and gained +0.0043 at x4 over
    the parent (-0.006109 against the incumbent). Guess on size: +0.001 to +0.003
    at x4 over lingbot-stage-decay-08.'
  mechanism: optimizer.anchor_alpha_early 0.0001 on the config of lingbot-stage-decay-08
    (stage decay 0.8, rate 2e-4, late anchor 0.00001 following the rate, ten epochs).
    The stem's rate stays 8.2e-5, so its relative step is unchanged; only the pull
    of the early anchor on the stem and block 0 drops tenfold.
  precedents:
