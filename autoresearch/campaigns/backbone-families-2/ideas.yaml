    \ c8a9974 (~/.cache/transnext-src) into src/knee_abnormality/modeling/families/transnext.py,\
    \ imported directly (not through transnext.py, which needs pkg_resources). Build\
    \ the Micro configuration (embed 48, 96, 192, 384; depths 2, 2, 15, 2; heads 2,\
    \ 4, 8, 16; pool 7) with img_size 224, pretrain_size 224 and drop path 0, and\
    \ load ~/.cache/torch/hub/checkpoints/transnext_micro_224_1k.pth strictly (617\
