ideas:
- id: bit-resnetv2-50-in21k
  mechanism_id: family-bit
  parent_idea_id: null
  title: BiT ResNetV2-50x1 (resnetv2_50x1_bit.goog_in21k_ft_in1k), ImageNet-21k Big Transfer with GroupNorm and
    weight standardisation, rate and anchors from its weight scale
  opportunity: 'Evidence (prior-work-candidates.md): Big Transfer ImageNet-21k pretraining, pre-activation ResNet
    with GroupNorm and weight-standardised convolutions (no BatchNorm, so no batch statistics at all); RMS falling
    0.034 to 0.014 (median 0.017); 0.111 s and 6.17 GiB per 64, about 3,540 s plus checkpointing. Guess: below NextViT-S
    at x4, a different blend pattern.'
  mechanism: 'model.backbone resnetv2_50x1_bit.goog_in21k_ft_in1k with its normalisation (data.mean [0.5,0.5,0.5],
    data.std [0.5,0.5,0.5]): stage ends stages.1 (512 ch, stride 8), stages.2 (1024, 16), stages.3 (2048, 32) through
    the final norm. GroupNorm, no depthwise convolution: no image-count padding. Memory about 29 GiB at 256 images:
    checkpoint the stem and stages.0 (and stages.1 if the preflight needs it). Settings by the weight-scale rule
    (median RMS 0.017): backbone_lr 0.000072, anchor_alpha_early 0.0076, anchor_alpha_late 0.000076. Integration
    (prior-work-radimagenet.md, integration defects): the backbone exposes timm''s pretrained_cfg; a stride-8 point
    (to_stride_8, where the feature-statistics augmentation acts), a stride-16 middle map and a stride-32 final
    map through modeling/backbone_stages.py at the stages named below; a group_matcher with the stem and four stage
    groups; the stem and first stage under the early anchor; spatial-token mappings derived from the layers and
    raising if they differ (prior-work-candidates.md has the strides). If the stride-16 and stride-32 grids are
    not 2:1, both 2x2 repeats in modeling/model.py become the nearest-centre gather (prior-work-radimagenet.md).
    Weights from timm (pretrained=True), already in the torch hub cache. Ten epochs, patience ten.'
  precedents:
  - 'NextViT-S (SSLD 6M), the incumbent: x4 0.938851, blend with the ResNet-50 +0.003267.'
  - Families pretrained apart from RadImageNet add to the ResNet-50 blend; RadImageNet-pretrained ones subtract
    (prior-work-candidates.md).
  novelty: New architecture for the blend with the ResNet-50.
  coverage: Every study and every label.
  exploitation: 'Read x4 and x1 against the incumbent and per label, then the equal logit blend with resnet50-silver-fold2
    against NextViT-S''s +0.003267. Activation: the effective config names the backbone; drift of the stem and stage-4
    groups after epoch 1 above zero.'
  budget: 'Measured 0.111 s and 6.17 GiB per 64: about 3,540 s plus checkpointing, inside the 4,881 s bound.'
  implementation: The stage adapter with stage checkpointing, the spatial-token mapping, configs/campaign.yaml.
  open_choices: None.
  dependencies: []
  priority_rationale: Forced by the keeper at the user's request of 2026-10-18 (explore new architectures); measured
    to fit (prior-work-candidates.md, second batch).
exhausted_directions: None.
