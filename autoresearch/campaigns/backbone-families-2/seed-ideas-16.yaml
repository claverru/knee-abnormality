ideas:
- id: tresnet-m-in21k
  mechanism_id: family-tresnet
  parent_idea_id: null
  title: TResNet-M (tresnet_m.miil_in21k_ft_in1k), ImageNet-21k pretraining, on the recipe's settings
  opportunity: 'Evidence (prior-work-candidates.md): MIIL ImageNet-21k pretraining; space-to-depth stem, anti-aliased
    downsampling, SE; RMS 0.061 to 0.073 flat (the recipe''s band); 0.071 s and 2.37 GiB per 64, about 2,760 s and
    11 GiB. Guess: below NextViT-S to level at x4, a different blend pattern.'
  mechanism: 'model.backbone tresnet_m.miil_in21k_ft_in1k with its pretrained_cfg normalisation (mean 0, std 1:
    data.mean [0,0,0], data.std [1,1,1]): stage ends body.layer2 (128 ch, stride 8), body.layer3 (1024, 16), body.layer4
    (2048, 32). BatchNorm, no depthwise convolution: no image-count padding. Settings: the recipe''s rate 2e-4 and
    anchors 0.001 and 0.00001. Integration (prior-work-radimagenet.md, integration defects): the backbone exposes
    timm''s pretrained_cfg; a stride-8 point (to_stride_8, where the feature-statistics augmentation acts), a stride-16
    middle map and a stride-32 final map through modeling/backbone_stages.py at the stages named below; a group_matcher
    with the stem and four stage groups; the stem and first stage under the early anchor; spatial-token mappings
    derived from the layers and raising if they differ (prior-work-candidates.md has the strides). If the stride-16
    and stride-32 grids are not 2:1, both 2x2 repeats in modeling/model.py become the nearest-centre gather (prior-work-radimagenet.md).
    Weights from timm (pretrained=True), already in the torch hub cache. Ten epochs, patience ten.'
  precedents: &id001
  - 'NextViT-S (SSLD 6M), the incumbent: x4 0.938851, blend with the ResNet-50 +0.003267.'
  - Families pretrained apart from RadImageNet add to the ResNet-50 blend; RadImageNet-pretrained ones subtract
    (prior-work-candidates.md).
  novelty: New architecture for the blend with the ResNet-50.
  coverage: Every study and every label.
  exploitation: 'Read x4 and x1 against the incumbent and per label, then the equal logit blend with resnet50-silver-fold2
    against NextViT-S''s +0.003267. Activation: the effective config names the backbone; drift of the stem and stage-4
    groups after epoch 1 above zero.'
  budget: 'Measured 0.071 s and 2.37 GiB per 64: about 2,760 s.'
  implementation: The stage adapter, the spatial-token mapping (space-to-depth stem and anti-aliased downsampling),
    configs/campaign.yaml.
  open_choices: None.
  dependencies: []
  priority_rationale: Forced by the keeper at the user's request of 2026-10-18 (explore new architectures); measured
    to fit (prior-work-candidates.md, second batch).
