ideas:
- id: lingbot-stage-decay-08
  mechanism_id: family-lingbot-rate
  parent_idea_id: lingbot-vit-small-stride16
  title: LingBot ViT-S/16 with the backbone rate decayed by 0.8 per stage, so the patch embedding's relative
    step matches the blocks'
  opportunity: 'Evidence (run lingbot-vit-small-stride16, epochs 0 to 2): the patch embedding (RMS 0.023 against
    the blocks'' 0.052 to 0.057, prior-work.md) drifted 0.041, 0.067, 0.077, twice FocalNet-T''s stem at epoch 2
    (0.036), while block 0 under the early anchor drifted 0.023, 0.022, 0.021, falling, and the later groups moved
    like FocalNet-T''s (0.10, 0.095, 0.080 against 0.107, 0.102, 0.079). Training loss 0.597 at epoch 2 against
    FocalNet-T''s 0.570. The single rate 2e-4 is a relative step 2.4 times larger on the stem than on the blocks.
    Guess on size: +0.002 to +0.006 at x4 over the parent.'
  mechanism: 'optimizer.backbone_lr_stage_decay 0.8 (training/lightning.py build_optimizer: rate x 0.8^depth, depth
    4 for the stem, 3 for block 0, 2 for blocks 1 and 2, 1 for blocks 3 to 7, 0 for blocks 8 to 11). The stem''s
    rate becomes 8.2e-5: 0.8^4 = 0.41 equals the stem-to-block weight-scale ratio 0.023/0.055 = 0.42, so its
    relative step matches the last blocks''. Block 0 1.0e-4, blocks 1-2 1.28e-4, blocks 3-7 1.6e-4, blocks 8-11
    2e-4. Everything else as lingbot-vit-small-stride16 (its source and config, ten epochs, anchors 0.001 and
    0.00001).'
  precedents:
  - 'Layer-wise rate decay is the standard fine-tuning setting for ViTs (BEiT, DINOv2 and DINOv3 fine-tuning use
    0.65 to 0.9 per block); here one factor per stage.'
  novelty: First stage-decayed rate on a ViT in this campaign.
  coverage: Every study and every label.
  exploitation: 'Read x4 and x1 against the incumbent and the parent, per label, and the blend with the ResNet-50.
    Activation: the effective config has backbone_lr_stage_decay 0.8; the epoch-2 drift of the stem group is below
    the parent''s 0.077.'
  budget: 'Configuration only: the parent''s 0.553 s per step, about 3,120 s, 14.4 GiB.'
  implementation: 'configs/campaign.yaml: optimizer.backbone_lr_stage_decay 0.8 on the parent''s config. No source
    change.'
  open_choices: None.
  dependencies: []
  priority_rationale: Forced by the keeper from the parent's drift per group; the user flagged LingBot's rate.
exhausted_directions: None.
