- id: full-to-half-bag-distillation
  mechanism_id: same-step-sub-bag-self-distillation
  parent_idea_id: null
  title: 'Distil the detached full-bag prediction into two complementary half-bag
    readouts of the same encoded tokens: a label-free, memory-free second readout
    in the training loss'
  opportunity: "The user's retirement note shows why self-targets failed here. A detached\
    \ own prediction on the same logit gives gradient \u03B2(p\u2212y), which AdamW\
    \ normalizes away. Running-memory targets are retired, and lagged or EMA teachers\
    \ reduce to self-targets because this regime does not memorize (researcher-20260923T143657Z\
    \ teacher_gap). A self-target applied to a different readout of the same features\
    \ is neither degenerate nor memory-based. model.forward is pool_encoded(encode_batch(batch))\
    \ (model.py:371-372), so half-bags of already-encoded acquisitions can be pooled\
    \ for about 1\u20132% extra cost. Consider a cell whose label is wrong while the\
    \ full-bag prediction already leans the right way: the full bag pulls the shared\
    \ features toward the label, and the half-bag term pulls them toward the prediction.\
    \ This is bootstrapping at the feature level. ELR, the only mechanism off the\
    \ class-balance frontier (hard +0.0013, negative-side soft +0.0026 at \xD71),\
    \ is also a label-free term."
  mechanism: "encoded = model.encode_batch(batch) and s = model.pool_encoded(encoded),\
    \ so the primary logits are bit-identical. For each study, randomly permute its\
    \ encoded acquisitions within each series type and assign them alternately to\
    \ halves A and B, so both halves keep every present series. Studies with a single\
    \ acquisition skip the term. s_A and s_B come from pool_encoded with visual_valid\
    \ ANDed with the half's acquisition mask. The loss is the unchanged class-balanced\
    \ BCE(s, y) plus \u03BB\xB7\xBD\xB7\u03A3_h mean over observed cells of BCE(s_h,\
    \ stopgrad \u03C3(s)). The added term is unweighted and active from epoch index\
    \ 1, after the warm-up epoch; \u03BB = 0.5. Its gradient reaches the backbone\
    \ features, attention and head only through the half-bag readouts, never through\
    \ the teacher. Validation, prediction and export use the full bag only. There\
    \ is no per-study state, one \u03BB and one split rule for all labels and cells,\
    \ and gold cells follow the same rule."
  precedents:
  - 'Yu & Huang 2019, universally slimmable networks (arXiv 1903.05134): in-place
    distillation, where sub-networks train on the full network''s detached same-step
    prediction.'
  - 'Englesson & Azizpour 2021 (arXiv 2110.01242): consistency between views improves
    robustness to label noise.'
  - 'Wei et al. 2020, JoCoR (CVPR): agreement between two predictors resists noisy
    labels. Here the two readouts share one network, so there is no second network.'
  - 'Zhang et al. 2022, DTFD-MIL (CVPR): pseudo-bags that inherit the parent label
    carry label noise. Distilling the parent''s prediction avoids that.'
  - "Losses campaign ideas.yaml: shared-split-view-consistency (symmetric (s_A\u2212\
    s_B)\xB2) and shared-subview-supervision (halves trained on y), both queued and\
    \ never run. That orchestrator ruled re-pooling one encode_batch in scope: one\
    \ encode per step, bit-identical primary logits, views built only by masking visual_valid,\
    \ and a dedicated split RNG."
  - "Losses findings, completion-20260920T184207Z: the cross-epoch draw-consistency\
    \ anchor was inconclusive at \u22120.0030. Two consistency terms raised Effusion\
    \ and Medial OA and lowered Lateral Meniscus, MCL, Synovitis and ACL. The anchor's\
    \ +9.6% runtime came from per-step logging."
  - noisy-labels findings, user-retire-self-memory-ideas-20260923T140728Z (degenerate
    detached bootstrap; memory retired) and the ELR run early-learning-regularization-20260923T124737Z-7aba30fc.
  novelty: This would be the campaign's first self-target that uses no memory and
    is not degenerate. It differs from the losses campaign's split-view ideas in direction
    and purpose. The teacher is the full bag, detached and anchored by the labels,
    so it has no collapse mode, and the halves never carry the label, so pseudo-bags
    pick up no new label noise. The aim is a label-free share of the backbone gradient,
    not draw invariance for its own sake. It is not a lagged or EMA teacher, so the
    user's retirement of running-memory correction does not apply.
  coverage: "Every observed cell of every label, in every study with at least two\
    \ encoded acquisitions, from epoch index 1. One shared \u03BB, split rule and\
    \ loss form."
  exploitation: 'Expected signature: soft macro AUC and negative-side soft AUC rise,
    as they did for ELR''s label-free term, while hard AUC moves little either way.
    The per-label risk is the losses campaign pattern, where consistency terms lost
    focal ligament and meniscus AUC and gained Effusion and OA, the opposite of ELR''s
    pattern. Stratifying the halves within series keeps focal evidence in both halves.
    If the result passes, the term acts on different readouts from ELR and can stack
    with it. If it fails with focal labels down, the within-step second-readout family
    is closed for this campaign.'
  budget: "Two extra poolings (LayerNorm, attention MLP and einsum over about 10k\
    \ tokens per batch) plus their backward into the same features tensor. The losses\
    \ campaign estimated under 1 GFLOP against about 300 GFLOP for the rexnet_200\
    \ pass, or 1\u20132% of step time. Diagnostics must be kept in buffers and logged\
    \ once per epoch, because the draw-consistency anchor's +9.6% came from 48 per-step\
    \ log calls. The expected run is about 1,640 s against the 1,846 s ceiling. There\
    \ is no extra backbone pass or data pass, and visits, triplets, steps and epochs\
    \ are unchanged."
  implementation: "Adds behavior and removes nothing. In lightning.py training_step,\
    \ replace self(batch) with encode_batch followed by pool_encoded, which is the\
    \ same computation. Build the halves from encoded['study'] and the acquisition\
    \ masks with a dedicated torch.Generator seeded from (config.seed, global_step).\
    \ That leaves the augmentation and series-dropout RNG streams unchanged and makes\
    \ resume stateless. Config: trainer.label_noise.sub_bag_distillation {weight:\
    \ 0.5, start_epoch: 1}. Log per epoch: the term, the unweighted BCE, mean |\u03C3\
    (s_h)\u2212\u03C3(s)|, the fraction of observed cells with |\u0394p| > 0.05 (the\
    \ contract's changed fraction), the term-to-BCE gradient proxy \u03BB\xB7mean|\u0394\
    p| / mean w|p\u2212y|, and acquisitions per half. If schedule-plus-early-learning\
    \ is adopted during development, rebase onto it and keep its schedule and ELR\
    \ unchanged, with this term added alongside. If a later incumbent removes ELR,\
    \ keep only this term."
  open_choices: "\u03BB of 0.5 or 1.0, fixed before launch; aim for a gradient proxy\
    \ of about 20\u201330% at epoch 1. Split unit: acquisitions stratified within\
    \ series (default) or whole series; whole series risks losing plane-specific focal\
    \ evidence. Loss form: BCE toward \u03C3(s) (default) or ELR's form log(1\u2212\
    <\u03C3(s),\u03C3(s_h)>). Start at epoch 0 or 1. Whether the term takes class-balance\
    \ weights by the y\u22650.5 group (default: unweighted, like ELR)."
  dependencies: []
  priority_rationale: 'This is the only remaining direction that is neither retired
    nor degenerate, and it is cheap. Its potential is moderate to low. The losses
    campaign''s lagged draw-consistency anchor lost 0.003, with focal labels down,
    and the mechanism adds no new label information. It only changes how much of the
