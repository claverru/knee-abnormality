  decision: reject
- id: relaxing-class-balance-schedule
  mechanism_id: scheduled-class-balance-strength
  parent_idea_id: null
  title: Relax the class-balance exponent from 1 to 0 linearly over the optimizer
    steps
  opportunity: Fixed strengths gave public 0.940 at k=1, 0.945 at 0.5 and 0.943 at
    0. Full balancing may help rare labels get learned early, while late in training
    the large weights mostly sharpen the report extractor's boundary. A schedule keeps
    the early benefit and drops the late cost.
  mechanism: Compute the class-balance weights with exponent k(step) = 1 - step /
    total_steps instead of the fixed 0.5, from the same saved training-fold prevalences
    and with the same mean-weight-one normalization. The average exponent over the
    run is 0.5, matching the current recipe.
  precedents:
  - 'docs/validation/results/2026-09-21-class-balance-exponent.md: public 0.943, 0.944,
    0.945, 0.942, 0.940 for k = 0, 0.25, 0.5, 0.75, 1.'
  - 'Kang et al. 2020 (arXiv 1910.09217) and Cao et al. 2019 (arXiv 1906.07413): balance-strength
    schedules beat fixed balancing in long-tail vision, though in the opposite direction
    (0 to 1).'
  novelty: The exponent has only been tested as a constant. The reverse ramp is the
    external precedent; this direction follows the project's own evidence.
  coverage: One schedule shared by all labels; per-label weights still come from the
    existing formula.
  exploitation: A gain here motivates testing the reverse ramp as its own idea.
  budget: No runtime change.
  implementation: Replaces the fixed exponent inside training/lightning.py with a
    step-dependent one, recomputed from the stored class_balance counts; config.py
    gains trainer.label_noise settings for the schedule while trainer.class_balance_exponent
    stays in the recipe. Log the exponent and the largest weight ratio per epoch.
  open_choices: The linear shape and the 1-to-0 endpoints are fixed before launch.
  dependencies: []
  priority_rationale: Directly supported by the one public curve that varies label
    trust; expected to lose hard AUC and gain soft AUC if the mechanism is right,
    which the completion must report.
  status: completed
  created_revision: 4
