ideas:
- id: bootstrapped-soft-targets
  mechanism_id: prediction-bootstrapped-targets
  parent_idea_id: null
  title: Train on a blend of each cell's label and the model's own detached prediction
    after a warm-up
  opportunity: An offline blend of an image teacher into the labels raised their gold
    agreement by +0.020 and tied publicly (S50 0.945 against 0.942), with its only
    loss on PF OA traced to a teacher trained on looser labels. Soft bootstrapping
    gets a similar correction online, from the model being trained, so the teacher
    always matches the current labels, loss and split.
  mechanism: For every observed training cell, replace the BCE target y with t = beta
    * y + (1 - beta) * stopgrad(sigmoid(logit)), with beta = 0.8, from the start of
    epoch index 2 (zero-based) onward. Epochs 0-1 train on y unchanged so that predictions
    carry image evidence before they feed back. The class-balance weight of a cell
    keeps using its original y >= 0.5 group. Reduction, masking and gold overrides
    are unchanged; gold cells follow the same rule as every other cell.
  precedents:
  - 'Reed et al. 2014, soft bootstrapping (arXiv 1412.6596): beta * y + (1 - beta)
    * p improved robustness to label noise on MNIST and detection benchmarks.'
  - 'docs/validation/results/2026-09-23-image-blend-labels-result.md: offline 0.5/0.5
    blend, gold agreement +0.020 [95% +0.006, +0.036], fold 0 +0.0035 hard and +0.0065
    soft (leaky), public tie.'
  - 'docs/research/public-research.md: a top participant reports mixing image predictions
    into extracted labels beat replacing and masking.'
  novelty: No campaign has used the model's own predictions in the target. The losses
    campaign changed loss shape and label-derived weights only.
  coverage: Every observed cell of every label, one beta, one warm-up.
  exploitation: If it helps, the temporal-ensemble and ELR ideas test whether a steadier
    prediction signal does better than the instantaneous one.
  budget: One sigmoid and a blend per cell; no measurable runtime change.
  implementation: 'Adds to the current loss in training/lightning.py: build t inside
    training_step before masked_binary_cross_entropy_with_logits, keeping the weight
    lookup on the original targets. New settings under trainer.label_noise (mode,
    beta, start epoch). Log the mean absolute target change per epoch. Validation
    is untouched.'
  open_choices: beta 0.8 and start epoch 2 are fixed before launch; the offline precedent
    used 0.5 and 0.7.
  dependencies: []
  priority_rationale: The simplest online form of the one label intervention with
    a gold gain and a public tie on a mismatched teacher.
  status: completed
  created_revision: 4
  ranking_rationale: 'All five seed ideas are in scope: each is a training-objective
    change driven by the model''s own training-time predictions, or a class-balance
    schedule shared across labels. None has dependencies, none duplicates another,
    and none repeats a mechanism the losses campaign measured. The active incumbent
    ideas list is empty, so admission passes.


    Order:

    1. Bootstrapped soft targets go first. They are the simplest online form of the
    only label intervention with a gold gain (+0.020) and a public tie. They need
    no per-study memory, and they give a baseline for the idea after them.

    2. Temporal-ensemble targets come next. They answer whether an averaged prediction
    beats an instantaneous one, and they introduce the per-study memory that ideas
    3 and 4 reuse.

    3. Early-learning regularization third. It is the strongest published single-network
    method, but its lambda calibration is less concrete than the others'' coefficients.

    4. Confident-contradiction down-weighting fourth. It interacts with the rare-label
    class-balance weights and runs a cut-off rule on the same memory, so it is best
    read after ideas 2 and 3.

    5. The relaxing class-balance schedule goes last. By the proposal''s own prediction
    it loses on hard AUC, which is the adoption judge. Its main value is a hard-versus-soft
    AUC diagnostic under the judge caveat, not a likely adoption.'
  experiments:
  - bootstrapped-soft-targets-20260923T120951Z-db740f7e
  decision: reject
- id: temporal-ensemble-targets
  mechanism_id: temporal-ensemble-target-correction
  parent_idea_id: null
  title: Blend each cell's label with a per-study running average of the model's past
    training predictions
  opportunity: 'A single training-time prediction is noisy: each visit sees a different
    triplet draw, series dropout and augmentation. Averaging a study''s predictions
    across epochs gives an ensemble teacher for free, closer to the out-of-fold teacher
    of the offline blend, and less self-confirming than bootstrapping on the current
    step.'
  mechanism: Keep a memory m[study, label] updated on every training visit as m <-
    0.7 * m + 0.3 * sigmoid(logit).detach(). From the third visit of a study on, train
    on t = 0.7 * y + 0.3 * m for every observed cell; earlier visits use y. Class-balance
    weights keep the original y >= 0.5 groups. The memory is a tensor indexed by the
    training study list, saved and restored with the checkpoint.
  precedents:
  - 'Laine and Aila 2017, temporal ensembling (arXiv 1610.02242): an exponential average
    of past predictions as a target.'
  - 'Plant Pathology 2020 first place: 0.7 truth + 0.3 out-of-fold prediction.'
  - 'docs/validation/results/2026-09-23-image-blend-labels-result.md: the teacher
    alone did not beat the labels on gold (-0.0015) while the blend did (+0.020),
    so a blend rather than a replacement.'
  novelty: Uses predictions averaged over draws and epochs, unlike the instantaneous
    bootstrap; no extra forward passes, unlike an EMA-weight teacher.
  coverage: Every observed cell of every label, one momentum and one blend weight.
  exploitation: A gain here and not in bootstrapping says the prediction must be averaged
    to help.
  budget: One 4,407 x 12 float tensor; no measurable runtime change.
  implementation: Adds to the current loss in training/lightning.py. Map study_uid
    to a row once from the training dataset; register the memory and visit counts
    as buffers so the checkpoint carries them. Settings under trainer.label_noise.
    Log the mean absolute target change and the share of cells in use per epoch.
  open_choices: Momentum 0.7, blend 0.7/0.3 and the three-visit start are fixed before
    launch.
  dependencies: []
  priority_rationale: The closest online analogue of the offline teacher blend, at
    no compute cost.
  status: completed
  created_revision: 4
  ranking_rationale: 'All five seed ideas are in scope: each is a training-objective
