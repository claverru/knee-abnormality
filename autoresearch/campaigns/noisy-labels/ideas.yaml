    \ and Medial OA negatives are the negatives most often reached, and they carry\
    \ the Lateral OA/Synovitis separation signal. Report per epoch the absorbed fraction\
    \ by side and label, mean |\u03C3(z+\u03B4)\u2212\u03C3(z)| and \u03C1 by side,\
    \ plus the partner-leakage ratios (scratch/coupling_checks.py). If this and CCD\
    \ both fail, the trust lever is closed."
  budget: "One 3,502\xD712 float32 variable (about 170 KB) and 24 running means, with\
    \ elementwise work on [8,12] per step: well under 1% of the 1,605 s reference\
    \ and inside the 1,846 s ceiling. Visits, triplets and steps are unchanged, and\
    \ there is no extra forward pass."
  implementation: "This adds to src/knee_abnormality/training/lightning.py and puts\
    \ settings under trainer.label_noise (step_size, initial_offset, max_offset, residual_momentum).\
    \ The raw y stays the target, so class-balance groups are unchanged and no weight_targets\
    \ argument is needed.\n\nPlan:\n- Keep a per-study tensor keyed by study_uid (TE/ELR\
    \ pattern) plus the \u03C1 table.\n- Update after the loss, so each step uses\
    \ the offset from before the update.\n- Persist a and \u03C1 in on_save_checkpoint,\
    \ restore them in on_load_checkpoint, and move them to the logits' device and\
