- id: class-centered-self-correction
  mechanism_id: class-centered-instance-specific-self-targets
  parent_idea_id: temporal-ensemble-targets
  title: "Correct each target by the model's within-class deviation only: y + 0.3\xB7\
    (memory \u2212 the memory's mean over cells with the same label and target bin)"
  opportunity: "The bootstrap run was rejected and read as mild label smoothing: a\
    \ uniform blend pulls each class's mean target toward the model's compressed mean.\
    \ On fold 0, k05-clean predicts 0.11\u20130.32 for y<0.5 cells (mean labels 0.07\u2013\
    0.25) and 0.50\u20130.79 for y\u22650.5 cells (0.76\u20130.95). Both report-derived\
    \ judges reward the report's between-class spacing, so this compression works\
    \ against them. With an out-of-fold image teacher on the 58 gold studies, a class-centered\
    \ blend keeps most of the uniform blend's ranking gain: 0.9241 against 0.9259\
    \ at weight 0.3, with labels at 0.9075. It changes targets 27% less (mean |t\u2212\
    y| 0.037 against 0.051). Uniform blends (bootstrap, TE) and ELR all move class\
    \ means; this separates the two components."
  mechanism: "Keep a memory m[study, label]: an EMA (momentum 0.7) of the detached\
    \ train-mode sigmoid predictions from this run's training batches. Update it after\
    \ the loss, so the current step never feeds its own target. Assign every cell\
    \ to one of 10 equal-width bins of its raw target, with bin edges shared by all\
    \ labels. Each step, recompute c[label, bin] as the mean of m over visited training\
    \ studies in that label and bin. From a study's third visit on, train on t = clip(y\
    \ + 0.3\xB7(m \u2212 c[label, bin(y)]), 0, 1). Cells in bins with fewer than 20\
    \ visited studies keep y. Class-balance groups use the raw y. Masking, reduction\
    \ and gold cells follow the unchanged rule."
  precedents:
  - 'Zhang and Sabuncu, NeurIPS 2020 (arXiv 2006.05065): self-distillation acts as
    instance-specific label smoothing. Its gains track the diversity of the teacher''s
    predictions, and uniform smoothing does not reproduce them.'
  - "bootstrapped-soft-targets (reject): hard \u22120.00046, soft \u22120.00032; the\
    \ OA family fell on both judges, and the completion reads the blend as mild label\
    \ smoothing."
  - "temporal-ensemble-targets (running): same memory, uniform 0.7\xB7y + 0.3\xB7\
    EMA, current step included."
  - 'Gold check, /home/claudio/src/knee-abnormality/outputs/autoresearch/noisy-labels/jobs/researcher-20260923T124106Z-48cb4f6b/scratch/gold_teacher_checks.{py,txt}:
    centered 0.9230/0.9241/0.9222 at w 0.1/0.3/0.5; uniform 0.9230/0.9259/0.9275;
    call-value bins give the same result as equal bins (0.9244).'
  novelty: This is the first self-target that removes the class-level shift, so the
    model's per-study image evidence enters without flattening the report's call-class
    levels. The per-(label, bin) means are running statistics, like the class-balance
    fractions, not coefficients.
  coverage: Every observed cell of every label, under one weight, one momentum, one
    bin grid and one minimum count.
  exploitation: "Suppose TE loses hard AUC on LOW-heavy labels (OA, Effusion, Baker's)\
    \ and this does not. Then class-level compression is the harm, and centering should\
    \ also apply to ELR's anchor. If both are neutral, the self-target line is closed.\
    \ Expected signature: the within-class reordering is invisible to tied report\
    \ targets, so any gain must come from variance reduction. Hard AUC is expected\
    \ within \xB10.001 and soft AUC near 0. Small per-label losses are possible where\
    \ call classes overlap, but there should be no systematic OA loss. Report per\
    \ epoch: mean |t\u2212y|, the share of cells with |t\u2212y|>0.05, and the mean\
    \ (t\u2212y) per bin, which should be about 0."
  budget: "One 3,502\xD712 memory with visit counts, plus a 12\xD710 scatter mean\
    \ per step. The cost is negligible, well inside the 1,846 s ceiling. Triplets,\
    \ visits and steps are unchanged."
  implementation: 'Adds to training/lightning.py and puts its settings under trainer.label_noise:
    weight, momentum, minimum_visits, bins and minimum_bin_count. Map study_uid to
    a row from the training dataset. Persist memory and visits in the checkpoint and
    restore them to the module''s device (TE''s repaired pattern). Pass weight_targets
    = raw y. If TE is accepted during development, replace its uniform blend with
    this centered blend on TE''s memory: remove the target_weight blend, keep persistence,
    and exclude the current step. Do not stack the two. If ELR is accepted, keep its
    term unchanged. If TE is rejected, implement this idea''s own memory from the
    parent source.'
  open_choices: Weight 0.3 matches TE for a clean contrast. The bin choice is 10 equal-width
    bins; call-value bins scored the same on gold. The minimum bin count of 20 is
    fixed before launch. Whether to launch only after TE completes is the orchestrator's
    call; this proposal recommends it.
  dependencies: []
  priority_rationale: 'Adoption potential is low: the within-class correction is invisible
    to report-derived judges. Its value is attribution. It is cheap and distinct,
    and the gold check supports it. Queue it after TE''s completion, when it can separate
    class-level compression from the instance-specific evidence in any TE or ELR outcome.'
  status: blocked
  created_revision: 52
  blocked_reason: 'Retired by explicit user instruction on 2026-09-23: the mechanism
    corrects or re-weights labels from the model''s own running memory of its training
    predictions. The first three completed experiments showed this premise barely
    acts in this regime (ten epochs of pretrained fine-tuning, validation BCE still
    falling at the last epoch, so little label memorization to resist), and the running
    down-weighting run trailed the reference by about 0.005 at x1 from its third epoch.
    Preserve the idea as history; requeueing needs new evidence and explicit user
    review.'
  blocked_event: user-retire-self-memory-ideas-20260923T140728Z-a7821a6a
- id: persistent-excess-residual-absorber
  mechanism_id: group-relative-persistent-residual-absorber
  parent_idea_id: null
  title: Absorb each cell's persistent excess residual, relative to cells with the
    same label and side, into a label-directed logit offset used only in the training
    loss (SOP-style; never silences a cell)
  opportunity: "Uniform self-targets moved every cell and failed twice: bootstrap\
    \ \u22120.00046 and TE +0.00025, with the OA family down on both judges. TE also\
    \ raised cross-label coupling (scratch/coupling_checks.txt). The remaining lever\
    \ is to reduce the pull of specific cells. The queued CCD uses a fixed |m\u2212\
    y|>0.5 rule. On TE's final memory, positives with m<0.5 are 43% of MCL and 38%\
    \ of Fracture positives, the cells amplified about 4\xD7; Fracture's hard AUC\
    \ is sensitive to positive weight (k 0.5\u21920.25 cost \u22120.0121). Low-grade\
    \ positives are about half real, so rules must not silence them. Measured against\
    \ each cell's (label, side) typical residual, excess above 0.4 reaches 1.4% of\
    \ cells, spread across labels, including 0.5% of MCL and 1.3% of Fracture positives\
    \ (scratch/absorber_sizing.txt). The contract's reasoning suggests the model contradicts\
    \ random extraction errors and agrees with systematic ones, so a narrow, persistent\
    \ selection could help both judges."
  mechanism: "For each training study and label keep a scalar a (initialized at ln\
    \ 1e-3) and a side s = +1 if y \u2265 0.5 else \u22121. The offset is \u03B4 =\
    \ s\xB7exp(2a), capped at 6 logits. The unchanged class-balanced masked BCE is\
    \ computed on z + stopgrad(\u03B4) against the raw y. After the loss, update under\
    \ no_grad:\n- r = s\xB7(y \u2212 \u03C3(z+\u03B4)), the label-directed residual;\n\
    - \u03C1[label, side] = running mean (momentum 0.99 per step) of s\xB7(y \u2212\
    \ \u03C3(z)) over observed batch cells;\n- a \u2190 clamp(a + \u03B7\xB7(r \u2212\
    \ \u03C1), ln 1e-3, \xBD ln 6), with \u03B7 = 3.5.\n\nThis is a CUSUM of excess\
    \ residual that drives an exponentially growing offset. The offset stays below\
    \ about 0.001 logit for typical cells. It reaches about 1 logit after 4\u2013\
    5 visits with an excess near 0.4. It then settles where the cell's residual equals\
    \ \u03C1, so an absorbed cell keeps its class-typical pull toward its label and\
    \ loses only the excess. If the network later moves toward the label, r falls\
    \ below \u03C1 and the offset decays. One \u03B7, initialization, cap and momentum\
    \ apply to all labels and cells, gold cells included. Validation, prediction and\
    \ export never see \u03B4."
  precedents:
  - "Liu, Zhu, Qu, You 2022, SOP (arXiv 2202.14026): per-sample noise s_i = u\u2299\
