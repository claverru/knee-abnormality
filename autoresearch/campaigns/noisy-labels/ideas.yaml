  novelty: "This is the first mechanism in the campaign that changes a cell's effective\
    \ prediction inside the loss, rather than its target or its weight, through a\
    \ learned per-cell latent variable. It is relative to the cell's (label, side)\
    \ group, so it cannot fall on a rare label's positives wholesale. It never pushes\
    \ a cell below the typical pull of its class, and it releases a cell automatically\
    \ once the network fits it. The \u03C1 values are running statistics, like the\
    \ class-balance fractions, not tuned coefficients."
  coverage: Every observed cell of every label and side, gold included. One step size,
    initialization, cap and momentum.
  exploitation: "Expected signature: absorbed fraction (|\u03B4|>0.1) near 0 through\
    \ epoch 2, then about 1\u20133% by epoch 5, positive-heavy, possibly 5\u20138%\
    \ by epoch 9. Hard \u0394 is expected within \xB10.001, with a small gain if absorbed\
