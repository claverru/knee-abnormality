- id: early-learning-regularization
  mechanism_id: early-learning-regularization
  parent_idea_id: null
  title: Add an early-learning regularizer that keeps predictions close to their own
    running average
  opportunity: Networks fit clean labels first and memorize noisy ones later. Our
    best epochs sit at 7-9 of 10, the phase where memorization would set in, and the
    low-rate tail is where the class-balance weights sharpen the report extractor's
    boundary.
  mechanism: Keep the same per-study running average m as the temporal-ensemble idea
    (momentum 0.7). Add lambda * mean over observed cells of log(1 - (m * p + (1 -
    m) * (1 - p))), with p = sigmoid(logit) not detached and m detached, to the unchanged
    class-balanced BCE. The term rewards agreement with the running average and so
    resists moving a cell's prediction toward a label it has contradicted for several
    epochs. Fix lambda before launch so the term is about 20% of the BCE at epoch
    2 on the reference.
  precedents:
  - 'Liu et al. NeurIPS 2020, early-learning regularization (arXiv 2007.00151): state
    of the art on CIFAR with synthetic noise and on Clothing1M and WebVision with
    real noise.'
  - 'docs/validation/results/2026-09-21-class-balance-exponent.md: fold-0 hard AUC
    rises with weighting strength while the public score falls past k=0.5.'
  novelty: 'A regularizer rather than a target change: the labels stay intact and
    the pull toward the running average does the correction.'
  coverage: Every observed cell of every label, one lambda and one momentum.
  exploitation: Compared with the temporal-ensemble target on the same memory, it
    separates target replacement from regularization.
  budget: Same memory as the temporal-ensemble idea; no measurable runtime change.
  implementation: Adds a loss term in training/lightning.py. Log the BCE and the regularizer
    separately each epoch to show the term is active; the losses campaign once shipped
    an auxiliary term six orders of magnitude below the main loss.
  open_choices: The binary form of the inner product and the 20% calibration are fixed
    before launch; record the resulting lambda.
  dependencies: []
  priority_rationale: The strongest published method on real label noise among single-network,
    no-extra-pass methods.
  status: completed
  created_revision: 4
  ranking_rationale: 'All five seed ideas are in scope: each is a training-objective
