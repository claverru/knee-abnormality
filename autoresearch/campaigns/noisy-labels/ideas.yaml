- id: confident-contradiction-downweighting
  mechanism_id: persistent-disagreement-cell-weights
  parent_idea_id: null
  title: Down-weight training cells whose label the model has contradicted with confidence
    over several visits
  opportunity: The class-balance curve points at rare-label report positives that
    disagree with gold (MCL, Fracture), and unaddressed negatives that are 14% gold-positive.
    Cells the model persistently contradicts are the likeliest wrong labels; reducing
    their weight stops the model from being pulled toward them.
  mechanism: Keep the per-study running average m (momentum 0.7). After a study's
    third visit, a cell is contradicted when m and y fall on opposite sides of 0.5
    and |m - y| > 0.5. Contradicted cells get weight 0.25 on top of their class-balance
    weight; all other cells keep 1. Rescale the batch's cell weights so their observed
    mean equals the mean without the mechanism, keeping the effective learning rate
    unchanged.
  precedents:
  - 'Han et al. 2018, co-teaching (arXiv 1804.06872), and the small-loss selection
    literature: high-loss samples are the likeliest mislabelled.'
  - 'Zhang et al. 2021, SPLC and Hill (arXiv 2112.07368): down-weighting suspected
    false negatives in multi-label learning with missing labels.'
  - 'docs/public-labels/report-attributes.md: low-grade positives are ranked worst
    and only about half are gold-positive.'
  novelty: The losses campaign weighted cells by label values; this weights them by
    the model's persistent disagreement, a training-time signal.
  coverage: Every observed cell of every label under one threshold and one weight.
    Per-label contradicted fractions are diagnostics only.
  exploitation: If it helps, a softer weight curve or a positive-only variant are
    follow-ups; if it hurts on low-grade positives, the completion should show it.
  budget: Same memory as the temporal-ensemble idea; no measurable runtime change.
  implementation: Adds a weight factor in training/lightning.py, applied before the
    observed-cell mean. Log the contradicted fraction per epoch and per label, split
    by positive and negative original targets.
  open_choices: Threshold 0.5, weight 0.25 and the three-visit start are fixed before
    launch.
  dependencies: []
  priority_rationale: The noise-aware candidate from the adaptive-allocation big bet,
    aimed at the label-gold disagreement its evidence identifies.
  status: completed
  created_revision: 4
  ranking_rationale: "I admitted persistent-excess-residual-absorber. It has no dependencies,\
    \ and proposal_admission says it is eligible. It stays in scope: it changes only\
    \ the training objective, it is driven by the model's own training-time predictions,\
    \ and it uses one step size, initialization, cap and momentum for every label\
    \ and cell. The per-(label, side) \u03C1 is a running statistic, like the class-balance\
    \ fractions, not a per-label coefficient. The researcher's CPU sizing supports\
    \ the claim that it reaches a different set of cells from CCD. Measured on TE's\
    \ memory, group-centred excess above 0.4 covers 1.4% of cells and is spread across\
    \ labels: 0.5% of MCL positives and 1.3% of Fracture positives (scratch/absorber_sizing.txt).\
    \ The fixed |m\u2212y|>0.5 rule instead reaches about 43% of MCL positives and\
    \ 38% of Fracture positives below m 0.5. That makes it a real alternative trust\
    \ lever, and it avoids the known Fracture/MCL hard-AUC sensitivity.\n\nI ranked\
    \ it after the class-balance schedule rather than beside CCD. CCD's result, and\
    \ ELR's, will show whether down-weighting cells the model persistently contradicts\
    \ helps on either judge. The absorber is a refinement of that same lever, so its\
    \ prior depends heavily on those outcomes. The schedule is an independent lever\
    \ that measured evidence supports: in the public class-balance curve, the score\
    \ moved with the exponent. The absorber's declared plan is to replace CCD's weight\
    \ factor if CCD is accepted, not to stack on it. That matches the one-trust-rule\
    \ principle, and it must set removed_idea_ids accordingly at integration.\n\n\
    class-centered-self-correction stays proposed. Its parent is temporal-ensemble\
    \ targets, which was rejected, and uniform self-targets have now failed twice\
    \ (bootstrap \u22120.00046, TE +0.00025). The researcher also measured higher\
    \ cross-label coupling under TE: mean |corr| rose from 0.359 to 0.384. Class-centring\
    \ does not obviously undo that coupling, so it is not worth a queue slot yet."
