ideas:
- id: forward-tilt-from-the-meniscus-front-and-back-spots
  mechanism_id: frame-angles-from-spots
  parent_idea_id: null
  title: Measure the frame's forward tilt per knee from the front and back spots of each meniscus instead of learning it from the labels
  opportunity: >-
    Evidence-backed problem, a guess for the fix. The forward tilt (nod) is the one angle of the
    frame still learned from the labels. It ends anywhere between 6 and 15 degrees across runs
    of the same design (incumbent 6.0, run 24 13.6, the femur-lean run 15.3), it reaches 21
    degrees on a knee whose bones stand upright (validation row 370 of the femur-lean run,
    drawn in outputs/analysis/routing-and-shifts-frames-20261007/femur-lean/), and it trades
    against any other free angle (prior-work.md, Measured on 2026-10-07). Turning the crops by
    half the frame's angle scored better than the full angle at both multipliers, which points
    at the tilt's noise. The centre, the side axis and the two height cuts are already read
    from spots without gradient and hold still. The two menisci lie on the tibial plateau: the
    line between them gives roll and turn today, and the front and back of each meniscus give
    the plateau's slope from front to back, which is the missing angle.
  mechanism: >-
    In KneeAbnormalityModel.study_frames (modeling/model.py), with the existing `spot` function
    and the shared meniscus channel's looks, compute four more spots without gradient: medial
    and front (points[:, 0] > 0 and points[:, 1] > 0), medial and back (points[:, 0] > 0 and
    points[:, 1] <= 0), lateral and front, lateral and back. Express each in the basis already
    built from the side axis (rows of `basis`: side, front, up): f = offset from the meniscus
    midpoint along the basis front axis, h = along the basis up axis. For each side whose two
    spots are found and whose front and back spots are at least one token pitch (study_pitch)
    apart in f, slope = (h_front - h_back) / (f_front - f_back). tilt = atan of the mean slope
    over the sides that qualify, zero when none does. The frame's rotation becomes
    self.frame_rotation() @ R(tilt) @ basis, with R the rotation about the side axis that the
    existing code builds from `tilt`; the shared learned rotation stays as it is.
  precedents:
  - "routing-and-shifts, height-cuts-from-the-spots-requeue: the two height cuts read from spots without gradient, adopted, +0.0003 at both multipliers; the cuts hold at +10.8 and -12.9 mm."
  - "Run 25 (more anchors on the frame, the nod following a notch and a kneecap landmark): stable nod, -0.0006; closed as a learned-landmark design, not as a spot measurement."
  novelty: First frame with no angle learned per knee from the labels; first use of a front-against-back split of the meniscus attention.
  coverage: Every knee with both spots of at least one meniscus; the others keep a tilt of zero.
  exploitation: >-
    Read both multipliers against the incumbent, PF OA, Synovitis, Effusion and ACL (they read
    above the lower cut, which the tilt moves most), and per epoch on the validation knees the
    mean and the spread of the tilt, the share of knees with a measured tilt and the two height
    cuts. Shown wrong by: a tilt whose spread across knees exceeds 10 degrees (spot noise, not
    anatomy), or the four targets above each more than one sibling SD below the incumbent.
  budget: Same cost as the incumbent; four more spot centroids per knee.
  implementation: >-
    Follow the environment paragraph of the developer instructions. modeling/model.py only,
    plus the log in training/lightning.py. Replaces: the landmark tilt (the `tilt` computed
    from the learned landmarks' forward and upward vectors) and the per-knee regressed nod
    (output[:, count : 2 * count] * nod_only). Remove what only they used: the
    landmark_attention layer, the LANDMARKS it sizes if nothing else reads them, and the nod
    columns of frame_output (keep its other columns at the same indices or shrink it, as long as
    the shift and size columns behave as before and every new or resized layer is created under
    torch.random.fork_rng). study_frames keeps returning the two meniscus spots as
    study_landmarks. Check the sign on made-up points before the guardrail run and report it:
    place a medial pair and a lateral pair of spots on a plane through the midpoint tilted by a
    known angle about the side axis; in the resulting frame all four must have the same height
    to within 0.1 mm. Log val_ and training study_frame_tilt_deg (mean), its standard deviation
    across knees and study_frame_tilt_measured_share, with the existing frame logs unchanged.
    Update SPATIAL_TOKEN_IDENTITY["algorithm"].
  open_choices: None.
  dependencies: []
  priority_rationale: The tilt is the root of three of today's findings (half angle, the trade with the femur lean, 21 degrees on a straight knee) and every other frame or crop seed inherits it.
- id: kneecap-region-on-the-kneecap-spot
  mechanism_id: upper-band-on-its-own-axis
  parent_idea_id: null
  title: Lay the band above the upper cut out around an axis that passes at the usual distance behind each knee's own kneecap spot, with nothing learned
  opportunity: >-
    A guess, on a measured mechanism. Above the upper cut the crops hold the femoral condyles
    and the kneecap, and the targets that read there (PF OA, Effusion, Synovitis) are about the
    kneecap and the pouch. The femur-lean run laid that band out around an axis hinged at the
    cut and let the labels set its lean: the lean went to -25 degrees for every knee within two
    epochs and traded against the nod, yet Effusion gained 0.0021 (sibling SD 0.0015) with the
    band displaced. The kneecap spot is found in every validation knee, 21.8 mm in front of the
    axis on average (1.57 token pitches, SD 0.40) and 12.5 mm above the upper cut (0.90 pitches,
    SD 0.21): the kneecap's place differs between knees by about 5.6 mm, a third of a sector's
    width at that radius. Principle 9: the spot marks the kneecap, so use it to place the
    kneecap's region, not to infer the femur.
  mechanism: >-
    In frame() (modeling/model.py), after the position (medial, front, height) is computed as
    today: lift = max(height - upper cut, 0) and front becomes front - lift * t, with t per knee.
    In study_frames, without gradient: t = (k_front - m * study_pitch) / max(k_height - upper
    cut, 0.5 * study_pitch), where (k_front, k_height) is the kneecap spot's place in the
    knee's frame (`kneecap_place`, already computed for the height cuts) and m is the running
    mean over training knees of k_front / study_pitch, a persistent buffer updated in training
    with momentum 0.99 from the knees whose kneecap spot is found, initialised from the first
    training batch, and read as it is at validation and prediction. t = 0 for a knee without
    the three spots. So at the kneecap's height the band's axis sits the usual distance behind
    that knee's kneecap, and the band stays attached at the cut (lift is zero there). The
    regions, the table and the two lower bands are unchanged.
  precedents:
  - "outputs/training/20261007-101112-side-routed-femur-lean: the same displaced band with a lean learned from the labels: x4 -0.0002, x1 -0.0009, Effusion +0.0021, the lean at -25 degrees for every knee."
  - "Run 31 (PF OA and Effusion on the front half): -0.0005 at both multipliers, Effusion +0.0026, PF OA +0.0004."
  novelty: First region placed on the kneecap spot; first band of the frame with its own axis that is measured per knee.
  coverage: Every knee with the two meniscus spots and the kneecap spot (all 874 validation knees on the incumbent).
  exploitation: >-
    Read both multipliers against the incumbent, PF OA, Effusion and Synovitis, and per epoch on
    the validation knees the mean and spread of atan(t) in degrees, the running mean m and the
    nod. Shown wrong by: Effusion and PF OA both inside one sibling SD of the incumbent, or the
    nod moving by more than 5 degrees against the incumbent's (the two trading again).
  budget: Same cost as the incumbent.
  implementation: >-
    Follow the environment paragraph of the developer instructions. Port from the femur-lean
    run's source_snapshot.zip (prior-work.md, Reusable code): the changed frame(), the lean and
    kneecap_place returned by study_frames, their unpacking in encode_batch ("frame_lean" in
    the geometry dictionary, "study_femur_lean" and "study_kneecap_place" in the output) and the
    logs in training/lightning.py. Do not port its learned parts: no femur_output layer, no
    femur_offset parameter, no FEMUR_START_GAIN, no tanh bound. frame() must keep working when
    called by scripts.tools.check_side_routing with the dictionary encode_batch returns. Create
    the buffer under torch.random.fork_rng. Replaces nothing: the band above the cut has no
    placement of its own today. Update SPATIAL_TOKEN_IDENTITY["algorithm"] and
    ["initialization_rng"].
  open_choices: None.
  dependencies: []
  priority_rationale: The measured version of the run trained by hand on 2026-10-07; the only change so far that moved Effusion above its noise.
- id: acl-on-its-unrouted-head
  mechanism_id: routing-table
  parent_idea_id: null
  title: Give ACL its own channel over the whole knee again, as Contusion and Fracture have, while every other target stays routed
  opportunity: >-
    Evidence-backed gap, a guess for the cause. ACL sits at 0.9389 in the incumbent and at
    0.9406 across the routed runs with a spread equal to its noise (sibling SD 0.0014), against
    0.9458 for the old recipe without routing on the same fold and seed: the largest per-target
    gap of the line. Its region (the core and the inner ring of five sectors, joint and upper
    bands) was widened in height (run 26, +0.0010, inside noise) and its ring cut was removed
    (-0.0007 macro), and a shared ligament reader gave it +0.0021. Nothing has tested whether
    the routing itself costs it: an ACL tear is read from secondary signs far from the notch
    (the bone bruises of the lateral compartment, the anterior shift of the tibia, the
    effusion), which a region around the axis leaves out.
  mechanism: >-
    Remove "ACL" from OWN_ROUTES (modeling/model.py) so that ACL's own channel is pooled
    without a routing weight and without a position prior tied to a route, exactly as Contusion
    and Fracture are. The route "core" stays in ROUTES for the report questions that use it
    (QUESTION_ROUTES in training/report_attributes.py). Nothing else changes.
  precedents:
  - "Old recipe, same fold and seed: ACL 0.9458."
  - "routing-and-shifts, shared-ligament-reader-2: ACL +0.0021, macro -0.0007 and +0.0003."
  - "Run 26 (ACL at all heights): ACL +0.0010; the lower cut then slid and Synovitis lost 0.0072."
  novelty: First run of the routed design with ACL unrouted.
  coverage: Every knee.
  exploitation: >-
    Read ACL against the incumbent at both multipliers, the macro, and the core and ring radius
    per epoch (ACL was the only target reading inside the ring cut alone). Shown wrong by: ACL
    inside one sibling SD of the incumbent.
  budget: Same cost as the incumbent.
  implementation: >-
    Follow the environment paragraph of the developer instructions. modeling/model.py:
    OWN_ROUTES without "ACL", and whatever indexes the routes of own channels must treat ACL as
    it treats Contusion and Fracture. Check and report on one batch that ACL's routing weight is
    1 for every routable token and that the other targets' weights equal the incumbent's.
    Replaces: ACL's region. Update SPATIAL_TOKEN_IDENTITY["compartment_routing"].
  open_choices: None.
  dependencies: []
  priority_rationale: The largest known per-target gap, one line to test, and never run.
- id: crops-turned-to-the-frame
  mechanism_id: frame-aligned-crops
  parent_idea_id: null
  title: Cut each 84 and 93 mm view turned by half the knee's own frame angle, in training and at prediction
  opportunity: >-
    Evidence-backed at prediction, a guess for training. On the incumbent's weights, with no
    training, re-cutting the crops turned to the frame scored +0.0011 at x4 and -0.0002 at x1;
    turned the wrong way -0.0007 and -0.0009; turned by half the angle +0.0010 and +0.0007, the
    only variant above the anchor at both multipliers (prior-work.md, Measured on 2026-10-07).
    The sign of the turn matters with identical resampling, so it is the alignment. It repeats
    on run 24's weights (+0.0007 at x4 with half the angle). Those weights were trained on
    knees at the scanner's orientation with 10 degrees of rotation augmentation; a model
    trained on upright knees does not have to spend capacity on the tilt.
  mechanism: >-
    (1) The canvas port of the routing-and-shifts campaign with data.view_shift_limit_mm: 6.0
    (a margin of 16 and 14 px, enough for 7.5 degrees). (2) In the model, the frame's in-plane
    angle per slice: on coronal views the angle between the frame's side axis, projected into
    the slice, and the image columns; on sagittal views the angle between the frame's up axis
    and the image rows; clamped to 15 degrees; zero on views without a margin and where the
    geometry is not valid. (3) The crop is cut turned by 0.5 times that angle about its own
    centre, in the same single resampling of the canvas as the cut, and patient_maps receive
    the same transform. (4) At validation and prediction the frame comes from one first look:
    a no-gradient pass in evaluation mode on the unturned crops, reading for each series row at
    most as many slices as its view's configured count, evenly spaced among the row's valid
    slices. (5) In training the frame comes from the model's own last training pass over that
    knee, kept in a dictionary on the module keyed by study_uid (the frame's rotation, the
    study axis and the left probability, detached); a knee not yet seen is cut unturned. The
    affine augmentation is unchanged and applies after the cut.
  precedents:
  - "outputs/analysis/routing-and-shifts-frames-20261007/frame-crops/: the prediction-only check and its controls on the incumbent, run 24 and the ResNet-50."
  - "routing-and-shifts, shift-per-study-from-the-spots: crops moved toward the meniscus midpoint by a trained locator: -0.0004 and -0.0022; a shift, not a turn."
  novelty: First training on crops aligned to the knee's own frame; first use of a first look.
  coverage: Coronal and sagittal 84 and 93 mm views of every knee; the 120 mm axial views are untouched.
  exploitation: >-
    Read both multipliers against the incumbent, Fracture, Lateral OA, Lateral Meniscus, MCL
    and ACL (the targets that moved in the prediction-only check), and per epoch on the
    validation knees the mean and spread of the applied angle per plane, the share of knees
    turned in training, and the frame's own angles (after training on turned crops the roll and
    nod should shrink only if the frame followed the picture, which it must not: positions are
    physical). Report the prediction time against the incumbent's. Shown wrong by: both
    multipliers below the incumbent by more than a rerun (0.0010), or a prediction time above
    1.3 times.
  budget: Training as the incumbent plus the larger canvases (the 15 mm canvases of the previous campaign trained in 1,455 s against a limit of 1,595 s; these are smaller). Prediction adds one first look at the multiplier-1 slice count.
  implementation: >-
    Follow the environment paragraph of the developer instructions. Port, on the incumbent:
    the canvas loader and the cutter from the crop-offsets run's source_snapshot.zip (drop its
    offsets, radius and generator), and frame_angles, the rotated cut and the two-pass forward
    from outputs/analysis/routing-and-shifts-frames-20261007/builds/rotation-on-run-24/
    modeling/model.py. That build takes the first look on the whole batch and has no training
    path: add the slice subset for the first look (subset every per-slice tensor of the batch
    consistently) and the training dictionary. The half is a module constant with no config
    field. The mirrored pass (a batch carrying "mirrored_study") takes its angle from a first
    look without that key and reflects after the cut, as the build does. Report the three
    topic 2 checks of the contract. Replaces: the cut at the scanner's orientation. Update
    SPATIAL_TOKEN_IDENTITY["view_policy"] and ["preparation"].
  open_choices: None.
  dependencies: []
  priority_rationale: The largest effect measured on 2026-10-07, confirmed by a wrong-way control and on a second set of weights, and never trained.
- id: crops-turned-and-centred-on-the-frame
  mechanism_id: frame-aligned-crops
  parent_idea_id: null
  title: Cut each 84 and 93 mm view turned by half the frame's angle and moved by half the frame centre's deviation, in training and at prediction
  opportunity: >-
    A guess, with the measurements that shape it. Centring the crops on the frame's centre at
    prediction only, on the incumbent's weights, scored -0.0004 at x4: it gained Medial
    Meniscus, ACL, Effusion and Contusion by about 0.002 each and cost Fracture 0.0088 and PF OA
    0.0037. It moved crops by 5 to 7 mm at the median, most of it the spots' own noise (4 to 6
    mm), on weights that had never seen a centred knee. Half the angle beat the full angle for
    the same reason. Training on the moved crops lets the targets that read far from the joint
    centre adapt. The spread of the frame's centre around the hand-set position is 2.3 mm side
    to side, 4.8 mm front to back and 7.4 mm up and down.
  mechanism: >-
    Everything of the seed crops-turned-to-the-frame, built here in full, with
    data.view_shift_limit_mm: 14.0 (a 300 px canvas at 84 mm). In addition the crop's centre
    moves by 0.5 times the deviation of the knee's frame centre (study_frame_shift) from its
    running mean over training knees (a persistent buffer, momentum 0.99, initialised from the
    first training batch, read as it is at validation and prediction), projected into each
    slice's plane and converted to pixels with that slice's patient map. The move is clamped so
    that the turned crop stays inside the canvas, and composed with the turn and the cut into
    one resampling; patient_maps and valid_rects receive the same transform. The frame for the
    move comes from the same first look or training dictionary as the angle.
  precedents:
  - "outputs/analysis/routing-and-shifts-frames-20261007/frame-crops/frame-crops-x4.npz: centred -0.0004, centred and turned -0.0007, prediction only, full deviation and full angle."
  - "routing-and-shifts, crops-and-frame-share-one-centre-unit-output: a learned centre shared by crops and frame, -0.0037 and -0.0062; learned from the labels, not read from the spots."
  novelty: First training on crops both turned and centred by the knee's own frame.
  coverage: Coronal and sagittal 84 and 93 mm views of every knee.
  exploitation: >-
    Read both multipliers against the incumbent and against crops-turned-to-the-frame, Fracture
    and PF OA (the two that paid for centring at prediction), Medial Meniscus, ACL, Effusion and
    Contusion (the four that gained), and per epoch on the validation knees the mean and spread
    of the applied move per plane and direction in millimetres, the share of slices clamped and
    the applied angle. Report the prediction time. Shown wrong by: Fracture and PF OA each more
    than one sibling SD below the incumbent while the four others stay inside theirs.
  budget: As crops-turned-to-the-frame with 300 px canvases, the size the previous campaign's shift runs trained with inside the limit.
  implementation: >-
    Follow the environment paragraph of the developer instructions. Build on the candidate of
    crops-turned-to-the-frame if it exists under this campaign's experiments (its source/ and
    changes.diff), otherwise from the same sources. The centring arithmetic is in
    outputs/analysis/routing-and-shifts-frames-20261007/builds/scripts/frame_crops.py (function
    `moves`: the deviation in the knee's anatomical axes turned into the patient's axes with
    the study axis and the side sign, then projected on the slice's two in-plane directions);
    it used the fold's mean, which a candidate replaces by the training running mean. The two
    halves are module constants with no config field. Create the buffer under
    torch.random.fork_rng. Report the three topic 2 checks of the contract. Update
    SPATIAL_TOKEN_IDENTITY["view_policy"], ["preparation"] and ["initialization_rng"].
  open_choices: None.
  dependencies: []
  priority_rationale: The user's design for the default crop (turn and move, aligned to the frame); runs after the turn alone so the two are measured apart.
