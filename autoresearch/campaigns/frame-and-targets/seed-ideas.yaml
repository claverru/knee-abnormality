ideas:
- id: forward-tilt-from-the-meniscus-front-and-back-spots
  mechanism_id: frame-angles-from-spots
  parent_idea_id: null
  title: Measure the frame's forward tilt per knee from the front and back spots of each meniscus
    instead of learning it from the labels
  opportunity: 'Evidence-backed problem, a guess for the fix. The forward tilt (nod) is the one angle
    of the frame still learned from the labels. It ends anywhere between 6 and 15 degrees across runs
    of the same design (run 24 13.6, the height-cuts model 6.0, the femur-lean run 15.3), it reaches
    21 degrees on a knee whose bones stand upright (validation row 370 of the femur-lean run, drawn
    in outputs/analysis/r/routing-and-shifts-frames-20261007/femur-lean/), and it trades against any
    other free angle (prior-work.md, Measured on 2026-10-07). Turning the crops by half the frame''s
    angle scored better than the full angle at both multipliers, which points at the tilt''s noise.
    In the incumbent the centre and the side axis are already read from spots without gradient and
    hold still, and the previous campaign did the same for the two height cuts, which then held at
    +10.8 and -12.9 mm; the incumbent still regresses its cuts, and this seed leaves them as they
    are. The two menisci lie on the tibial plateau: the line between them gives roll and turn today,
    and the front and back of each meniscus give the plateau''s slope from front to back, which is
    the missing angle.'
  mechanism: 'In KneeAbnormalityModel.study_frames (modeling/model.py), with the existing `spot` function
    and the shared meniscus channel''s looks, compute four more spots without gradient: medial and
    front (points[:, 0] > 0 and points[:, 1] > 0), medial and back (points[:, 0] > 0 and points[:,
    1] <= 0), lateral and front, lateral and back. Express each in the basis already built from the
    side axis (rows of `basis`: side, front, up): f = offset from the meniscus midpoint along the
    basis front axis, h = along the basis up axis. For each side whose two spots are found and whose
    front and back spots are at least one token pitch (study_pitch) apart in f, slope = (h_front -
    h_back) / (f_front - f_back). tilt = atan of the mean slope over the sides that qualify, zero
    when none does. The frame''s rotation becomes self.frame_rotation() @ R(tilt) @ basis, with R
    the rotation about the side axis that the existing code builds from `tilt`; the shared learned
    rotation stays as it is.'
  precedents:
  - 'routing-and-shifts, height-cuts-from-the-spots-requeue: the two height cuts read from spots without
    gradient, +0.0003 at both multipliers; the cuts hold at +10.8 and -12.9 mm.'
  - 'Run 25 (more anchors on the frame, the nod following a notch and a kneecap landmark): stable
    nod, -0.0006; closed as a learned-landmark design, not as a spot measurement.'
  novelty: First frame with no angle learned per knee from the labels; first use of a front-against-back
    split of the meniscus attention.
  coverage: Every knee with both spots of at least one meniscus; the others keep a tilt of zero.
  exploitation: 'Read both multipliers against the incumbent, PF OA, Synovitis, Effusion and ACL (they
    read above the lower cut, which the tilt moves most), and per epoch on the validation knees the
    mean and the spread of the tilt, the share of knees with a measured tilt and the two height cuts.
    Shown wrong by: a tilt whose spread across knees exceeds 10 degrees (spot noise, not anatomy),
    or the four targets above each more than one sibling SD below the incumbent.'
  budget: Same cost as the incumbent; four more spot centroids per knee.
  implementation: 'Follow the environment paragraph of the developer instructions. modeling/model.py
    only, plus the log in training/lightning.py. Replaces: the landmark tilt (the `tilt` computed
    from the learned landmarks'' forward and upward vectors) and the per-knee regressed nod (output[:,
    count : 2 * count] * nod_only). Remove what only they used: the landmark_attention layer, the
    LANDMARKS it sizes if nothing else reads them, and the nod columns of frame_output (keep its other
    columns at the same indices or shrink it, as long as the shift and size columns behave as before
    and every new or resized layer is created under torch.random.fork_rng). study_frames keeps returning
    the two meniscus spots as study_landmarks. Check the sign on made-up points before the guardrail
    run and report it: place a medial pair and a lateral pair of spots on a plane through the midpoint
    tilted by a known angle about the side axis; in the resulting frame all four must have the same
    height to within 0.1 mm. Log val_ and training study_frame_tilt_deg (mean), its standard deviation
    across knees and study_frame_tilt_measured_share, with the existing frame logs unchanged. Update
    SPATIAL_TOKEN_IDENTITY["algorithm"].'
  open_choices: None.
  dependencies: []
  priority_rationale: The tilt is the root of three of today's findings (half angle, the trade with
    the femur lean, 21 degrees on a straight knee) and every other frame or crop seed inherits it.
- id: frame-read-from-the-spots
  mechanism_id: frame-angles-from-spots
  parent_idea_id: null
  title: 'A frame with nothing placed by the labels but the two radii: the forward tilt from the meniscus
    front and back spots and the two height cuts from the meniscus and kneecap spots'
  opportunity: 'Evidence-backed parts, a guess for the whole. The frame''s centre and side axis are
    read from the meniscus spots and hold still. Its forward tilt and its two height cuts are regressed
    from the labels: the tilt ends between 6 and 15 degrees across runs and reaches 21 degrees on
    a knee whose bones stand upright; the lower cut ends at -1.8 mm, through the joint line, and a
    learned cut slides when one side pulls on it (run 26). The previous campaign placed the two cuts
    from the spots and they held at +10.8 and -12.9 mm, level with run 24 (+0.0003 at both multipliers,
    0.952 against 0.953 public). The cuts are measured along the frame''s up axis, so they are only
    as good as the tilt: on the samples drawn from that model the cuts slope across the joint where
    the tilt is off. This seed measures both, so the tibia and joint bands sit on the plateau the
    menisci mark.'
  mechanism: 'Two changes in KneeAbnormalityModel.study_frames, both without gradient. (1) The forward
    tilt exactly as the seed forward-tilt-from-the-meniscus-front-and-back-spots defines it, built
    here in full: four spots of the shared meniscus channel (medial and lateral, each split at fitted
    front 0), the slope of height against front between the front and back spot of each side in the
    basis built from the side axis, tilt = atan of the mean slope over the sides whose two spots are
    found and at least one token pitch apart, zero otherwise; rotation = self.frame_rotation() @ R(tilt)
    @ basis; the landmark tilt and the per-knee regressed nod are removed. (2) The two height cuts
    exactly as the previous campaign''s adopted experiment places them (outputs/autoresearch/routing-and-shifts/experiments/height-cuts-from-the-spots-requeue-20261006T232351Z-d2445402/changes.diff):
    a kneecap spot, the squared-attention centroid of the shared OA channel over the tokens with fitted
    front > 0 and height > 0; in the knee''s frame h_m, s_m the mean height and spread of the two
    meniscus spots and h_k, s_k the kneecap spot''s; upper cut = max(h_m + (h_k - h_m) * s_m / (s_m
    + s_k), h_m); lower cut = 2 * h_m - upper cut; the regressed start values when a spot is missing.
    The core and ring radius stay regressed.'
  precedents:
  - 'routing-and-shifts, height-cuts-from-the-spots-requeue: +0.0003 at both multipliers against run
    24; S120 0.952 against S118 0.953.'
  - 'outputs/analysis/r/routing-and-shifts-frames-20261007/height-cuts-from-the-spots/regions-005.png
    and regions-045.png: cuts at the right height that slope with the frame''s tilt and roll.'
  novelty: First frame whose centre, three angles and two cuts are all read from spots.
  coverage: Every knee with the meniscus and kneecap spots; a missing spot falls back per quantity
    as each part states.
  exploitation: 'Read both multipliers against the incumbent and against forward-tilt-from-the-meniscus-front-and-back-spots,
    the four targets above the lower cut (PF OA, Effusion, Synovitis, ACL) and the four compartment
    targets, and per epoch on the validation knees the mean and spread of the tilt, of each cut and
    of the two radii. Shown wrong by: cuts that do not hold near +11 and -13 mm, or a tilt whose spread
    across knees exceeds 10 degrees.'
  budget: Same cost as the incumbent.
  implementation: 'Follow the environment paragraph of the developer instructions. Build on the candidate
    of forward-tilt-from-the-meniscus-front-and-back-spots if it exists under this campaign''s experiments
    (its source/ and changes.diff), then apply the changes.diff named in the mechanism for the cuts;
    both were written on run 24''s code. Run that seed''s sign check on made-up points and report
    it, and keep the logs of both parts. Replaces: the landmark tilt, the regressed nod and the two
    regressed height cuts. Update SPATIAL_TOKEN_IDENTITY["algorithm"].'
  open_choices: None.
  dependencies: []
  priority_rationale: The frame the user asked to have right first; the tilt alone is measured by
    the seed before it.
- id: edema-bone-targets-with-the-head-in-the-model
  mechanism_id: report-region-targets
  parent_idea_id: null
  title: Four located targets for marrow edema, femur and tibia on each side, read by one shared head
    that lives in the model, so a femur spot and a tibia spot exist for every knee
  opportunity: 'Evidence-backed counts, a guess for the effect. No report target today is read on
    both sides of the tibia-against-joint cut or tells the femoral side of a compartment from the
    tibial side. The v5 answer marrow_edema_bone does: with the compartment answer the incumbent already
    uses, the reports give about 393 medial-femur, 349 medial-tibia, 354 lateral-femur and 310 lateral-tibia
    knees, each above the 200 a located target needs, and 2,512 reports without edema as full-weight
    negatives. On 212 audited reports the femur is right in 48 of 60 answers and the tibia in 58 of
    72, femur and tibia are swapped once in 37 single-bone reports, and the typical error is answering
    both bones (prior-work.md, The v5 report answers). It also gives Contusion''s finding a place
    per study. Nothing in the frame marks the femur today: the crops show about 3 cm of it, and the
    kneecap spot marks the kneecap. A head trained to find edema in the femur and in the tibia has
    to look at each bone''s marrow, in knees with and without edema, so its attention above and below
    the joint is a candidate landmark for each bone. The report heads live in the training module
    and vanish at prediction; this one is put in the model so that its spots can be read for any knee.'
  mechanism: 'training/report_attributes.py reads, beside the v4.0 targets, the two v5 questions from
    `<paths.data_root>/labels/prepared/jevk5-report-attributes-v5.0-new/targets.parquet` (columns
    `StudyInstanceUID` and `attribute_<question>__<option>`, one row per study of the 4,407). A new
    located family "marrow_edema_bone" with four Region entries, read by one shared head exactly as
    the existing located families are: femur_medial, femur_lateral, tibia_medial, tibia_lateral. The
    target of a region is the product of two masses: the bone (femur: options femur and femur_tibia;
    tibia: options tibia and femur_tibia) times the compartment (the options of marrow_edema_location
    that include that compartment, as the existing edema-by-compartment regions define them). Its
    weight is the reliability weight times one minus the mass of the bone options not_stated and patella_and_other.
    Four new routes appended to ROUTES and _regions (modeling/model.py): bone_femur_medial = the medial
    compartment''s sectors and its half of the core in the joint and upper bands; bone_tibia_medial
    = the same sectors and half core in the tibia and joint bands; the two lateral ones their mirror
    images. No existing target or region changes, and marrow_edema_bone gets no option-level head.
    The family''s attention column and classifier row are parameters of KneeAbnormalityModel instead
    of the training module: the training module calls them for the report loss exactly where a located
    family''s own column and row would be, with the same detachment and the same gradient path as
    the other located families. With that column''s scores the model computes, without gradient and
    with the existing `spot` function, four spots per knee: femur medial, femur lateral, tibia medial,
    tibia lateral, each the squared-attention centroid over the tokens of that fitted side (fitted
    medial > 0 or <= 0) above or below the meniscus midpoint''s height. encode_batch returns them.
    Nothing reads them in this seed: the frame is unchanged.'
  precedents:
  - 'docs/modeling/side-routed-heads.md: located targets hold on unseen knees (tear place 33% explained,
    edema by compartment 25%).'
  - 'routing-and-shifts, contusion-reads-the-edema-head-2: Contusion pooled with the edema head''s
    attention, -0.0007 and -0.0011, its scale stayed at 0.'
  novelty: First report head kept in the model; first landmark candidates for the femur and the tibia.
  coverage: Training only; the 4,407 studies with reports.
  exploitation: 'Read both multipliers against the incumbent, Contusion, Fracture and the four compartment
    targets, val_report_attribute_bce_<region> for the four new targets with the share each explains,
    and per epoch on the validation knees, for each of the four spots, the share of knees where it
    is found and the mean and spread of its place in the knee''s frame (medial, front, height, in
    millimetres), separately for knees whose report has edema and knees whose report has none. Shown
    wrong by: the four targets explaining under 10% on the validation knees; or, for the spots, a
    place in knees without edema that differs from the place in knees with edema by more than its
    own spread.'
  budget: Same cost as the incumbent; one more attention column and classifier row.
  implementation: 'Follow the environment paragraph of the developer instructions. The Region tuple
    takes one question today; extend it, or the code that turns a Region into a target, so that a
    region may multiply the located mass of a second question, without changing the values of the
    existing regions (report the largest absolute difference of their targets on one batch against
    the incumbent: it must be zero). Load the extra file once, aligned by StudyInstanceUID, failing
    loudly if a training study with a report is missing from it. Report in the candidate''s notes
    the options chosen for each region and the number of training studies with a target above 0.5
    in each of the four. Update SPATIAL_TOKEN_IDENTITY["compartment_routing"]. Create the head''s
    layers under torch.random.fork_rng. The mirrored pass must give mirror-image spots; report it
    on one batch. Update SPATIAL_TOKEN_IDENTITY["algorithm"] as well.'
  open_choices: None.
  dependencies: []
  priority_rationale: The report supervision the femur section needs; measured alone first so the
    spots are read before anything depends on them.
- id: femur-section-leaning-to-the-femur-spots
  mechanism_id: upper-band-on-its-own-axis
  parent_idea_id: null
  title: A femur section hinged at the upper cut whose axis passes through the knee's own femur spots,
    read from the report-supervised bone head
  opportunity: 'A guess, on a measured failure. A knee in the coil is bent: on eighteen sagittal slices
    the tibia stands close to vertical and the femur leans by 0 to 30 degrees, so a single axis is
    a compromise between two bones. The femur-lean run gave the band above the upper cut its own axis
    and let the labels set the lean: every knee went to -25 degrees within two epochs and the lean
    traded against the nod, because only the targets of that band pull on it. The lean needs a landmark
    on the femur. The bone head''s femur spots are one, supervised by the reports (706 reports place
    edema in the femur, 863 in the tibia, 2,595 report none), independent of the twelve labels'' gradient.'
  mechanism: 'Everything of the seed edema-bone-targets-with-the-head-in-the-model, built here in
    full. In addition, in frame() (modeling/model.py), after the position (medial, front, height)
    is computed as today: lift = max(height - upper cut, 0) and front becomes front - lift * t. In
    study_frames, without gradient: F = the midpoint of the knee''s two femur spots expressed in the
    knee''s frame; t = F_front / max(F_height - upper cut, 0.5 * study_pitch); t = 0 when a femur
    spot is missing or F lies below the upper cut. So above the cut the sectors, the core and the
    rings are laid out around the line from the centre of the cut to the femur spots, and the section
    stays attached at the cut (lift is zero there). The tibia and joint bands, the regions and the
    table are unchanged, and the bone targets'' own regions use the leaned band like every other target.'
  precedents:
  - 'outputs/training/20261007-101112-side-routed-femur-lean: the same hinged band with a lean learned
    from the labels: x4 -0.0002, x1 -0.0009, Effusion +0.0021, the lean at -25 degrees for every knee
    and the nod up by 9 degrees.'
  - 'outputs/analysis/r/routing-and-shifts-frames-20261007/knee-bend/sagittal-gallery.png: the bend
    by eye; two rule-based measurements of it failed.'
  novelty: First angle of the frame set by a report-supervised landmark; first femur section that
    can differ between knees.
  coverage: Every knee with the two femur spots above its upper cut; the others keep a straight upper
    band.
  exploitation: 'Read both multipliers against the incumbent and against edema-bone-targets-with-the-head-in-the-model,
    PF OA, Effusion, Synovitis and ACL, and per epoch on the validation knees the mean and the spread
    of atan(t) in degrees, the share of knees with a lean, the frame''s forward tilt, and the femur
    spots'' place. Shown wrong by: a lean with a spread across knees under 3 degrees (it would be
    one shared setting again), a forward tilt that moves by more than 5 degrees against the incumbent''s
    (the two trading), or PF OA and Effusion both more than one sibling SD below the incumbent.'
  budget: Same cost as the incumbent plus one attention column and classifier row.
  implementation: 'Follow the environment paragraph of the developer instructions. Build on the candidate
    of edema-bone-targets-with-the-head-in-the-model if it exists under this campaign''s experiments
    (its source/ and changes.diff). Port the leaned frame() and its plumbing from the femur-lean run''s
    source_snapshot.zip (prior-work.md, Reusable code): "frame_lean" in the geometry dictionary and
    the lean in the encode_batch output and the logs. Do not port its learned parts or its kneecap
    start: no femur_output layer, no femur_offset parameter, no gain, no tanh bound. frame() must
    keep working when called by scripts.tools.check_side_routing with the dictionary encode_batch
    returns. Replaces nothing in the frame: the band above the cut has no axis of its own today. Update
    SPATIAL_TOKEN_IDENTITY["algorithm"].'
  open_choices: None.
  dependencies: []
  priority_rationale: The tiltable femur section the user asked for, with its angle supervised by
    the reports instead of the labels.
- id: kneecap-region-on-the-kneecap-spot
  mechanism_id: upper-band-on-its-own-axis
  parent_idea_id: null
  title: Lay the band above the upper cut out around an axis that passes at the usual distance behind
    each knee's own kneecap spot, with nothing learned
  opportunity: 'A guess, on a measured mechanism. Above the upper cut the crops hold the femoral condyles
    and the kneecap, and the targets that read there (PF OA, Effusion, Synovitis) are about the kneecap
    and the pouch. The femur-lean run laid that band out around an axis hinged at the cut and let
    the labels set its lean: the lean went to -25 degrees for every knee within two epochs and traded
    against the nod, yet Effusion gained 0.0021 (sibling SD 0.0015) with the band displaced. Measured
    on the height-cuts model of the previous campaign, whose upper cut sits at +10.8 mm (the incumbent
    regresses its own, +13.7 mm on average): the kneecap spot is found in every validation knee, 21.8
    mm in front of the axis on average (1.57 token pitches, SD 0.40) and 12.5 mm above that upper
    cut (0.90 pitches, SD 0.21): the kneecap''s place differs between knees by about 5.6 mm, a third
    of a sector''s width at that radius. Principle 9: the spot marks the kneecap, so use it to place
    the kneecap''s region, not to infer the femur.'
  mechanism: 'In frame() (modeling/model.py), after the position (medial, front, height) is computed
    as today: lift = max(height - upper cut, 0) and front becomes front - lift * t, with t per knee.
    In study_frames, without gradient: t = (k_front - m * study_pitch) / max(k_height - upper cut,
    0.5 * study_pitch), where (k_front, k_height) is the kneecap spot''s place in the knee''s frame
    (the squared-attention centroid of the shared OA channel over the tokens with fitted front > 0
    and height > 0, as the previous campaign''s experiment computes it, outputs/autoresearch/routing-and-shifts/experiments/height-cuts-from-the-spots-requeue-20261006T232351Z-d2445402/changes.diff;
    the incumbent does not have it), the upper cut is the knee''s own upper cut however the incumbent
    obtains it, and m is the running mean over training knees of k_front / study_pitch, a persistent
    buffer updated in training with momentum 0.99 from the knees whose kneecap spot is found, initialised
    from the first training batch, and read as it is at validation and prediction. t = 0 for a knee
    without the three spots. So at the kneecap''s height the band''s axis sits the usual distance
    behind that knee''s kneecap, and the band stays attached at the cut (lift is zero there). The
    regions, the table and the two lower bands are unchanged.'
  precedents:
  - 'outputs/training/20261007-101112-side-routed-femur-lean: the same displaced band with a lean
    learned from the labels: x4 -0.0002, x1 -0.0009, Effusion +0.0021, the lean at -25 degrees for
    every knee.'
  - 'Run 31 (PF OA and Effusion on the front half): -0.0005 at both multipliers, Effusion +0.0026,
    PF OA +0.0004.'
  novelty: First region placed on the kneecap spot; first band of the frame with its own axis that
    is measured per knee.
  coverage: Every knee with the two meniscus spots and the kneecap spot (all 874 validation knees
    on the height-cuts model).
  exploitation: 'Read both multipliers against the incumbent, PF OA, Effusion and Synovitis, and per
    epoch on the validation knees the mean and spread of atan(t) in degrees, the running mean m and
    the nod. Shown wrong by: Effusion and PF OA both inside one sibling SD of the incumbent, or the
    nod moving by more than 5 degrees against the incumbent''s (the two trading again).'
  budget: Same cost as the incumbent.
  implementation: 'Follow the environment paragraph of the developer instructions. Port from the femur-lean
    run''s source_snapshot.zip (prior-work.md, Reusable code): the changed frame(), the lean and kneecap_place
    returned by study_frames, their unpacking in encode_batch ("frame_lean" in the geometry dictionary,
    "study_femur_lean" and "study_kneecap_place" in the output) and the logs in training/lightning.py.
    Do not port its learned parts: no femur_output layer, no femur_offset parameter, no FEMUR_START_GAIN,
    no tanh bound. frame() must keep working when called by scripts.tools.check_side_routing with
    the dictionary encode_batch returns. Create the buffer under torch.random.fork_rng. Replaces nothing:
    the band above the cut has no placement of its own today. Update SPATIAL_TOKEN_IDENTITY["algorithm"]
    and ["initialization_rng"]. That run was built on the height-cuts model and the incumbent regresses
    its height cuts: port the kneecap spot only and leave the cuts as the incumbent has them.'
  open_choices: None.
  dependencies: []
  priority_rationale: The measured version of the run trained by hand on 2026-10-07; the only change
    so far that moved Effusion above its noise.
