ideas:
- id: height-cuts-from-the-spots
  mechanism_id: frame-angles-from-spots
  parent_idea_id: null
  title: Place the two height cuts per knee from the meniscus and kneecap spots instead of learning
    them from the labels
  opportunity: 'Evidence-backed, run once. In run 24 the two height cuts are regressed per knee from
    the labels: the upper cut ends at +13.7 mm and the lower at -1.8 mm, so the lower cut runs through
    the joint line instead of the top of the tibia, and earlier runs showed a learned cut sliding
    when only one side pulls on it (run 26: the lower cut moved 10 mm and Synovitis lost 0.0072).
    The previous campaign placed both cuts from the heads'' spots without gradient and adopted it:
    x4 0.925389 against 0.925067 and x1 0.917411 against 0.917070, cuts at +10.8 and -12.9 mm; on
    the public board 0.952 against 0.953, one step. It is level, not better, so it is run again here
    as a seed and judged by this campaign''s rule. Two of the next seeds use what it computes (the
    kneecap spot and an upper cut that follows the knee).'
  mechanism: 'Exactly the change of the previous campaign''s adopted experiment (outputs/autoresearch/routing-and-shifts/experiments/height-cuts-from-the-spots-requeue-20261006T232351Z-d2445402/changes.diff).
    In KneeAbnormalityModel.study_frames, without gradient: a kneecap spot, the squared-attention
    centroid of the shared OA channel over the tokens with fitted front > 0 and height > 0; in the
    knee''s frame, h_m and s_m the mean height and spread of the two meniscus spots, h_k and s_k the
    kneecap spot''s; upper cut = max(h_m + (h_k - h_m) * s_m / (s_m + s_k), h_m); lower cut = 2 *
    h_m - upper cut; the regressed start values when a spot is missing. The core and ring radius stay
    regressed.'
  precedents:
  - 'routing-and-shifts, height-cuts-from-the-spots-requeue: x4 +0.0003, x1 +0.0003 against run 24;
    S120 0.952 against S118 0.953.'
  - 'Run 28 (cuts midway between landmarks): 0.924384 and 0.916204; an anatomical frame, ACL lost
    through the ring cut.'
  novelty: 'None: a repeat of an adopted experiment under this campaign''s base and rule.'
  coverage: Every knee with the two meniscus spots and the kneecap spot; the others keep the start
    values.
  exploitation: 'Read both multipliers against the incumbent and the two cuts per epoch on the validation
    knees (mean and spread), with the share of knees whose cuts come from the spots. Shown wrong by:
    cuts that do not hold near +11 and -13 mm, or both multipliers below run 24 by more than a rerun
    (0.0010).'
  budget: Same cost as the incumbent.
  implementation: 'Follow the environment paragraph of the developer instructions. Apply the changes.diff
    named in the mechanism to this campaign''s base; it was written on the same code, so it should
    apply as it is (modeling/model.py, modeling/spatial_tokens.py, training/lightning.py). Report
    on one batch that the two cuts equal that experiment''s source on the same weights-free model,
    and keep its logs (height_cuts_from_spots_applied_share and the cuts in millimetres). Replaces:
    the two regressed height cuts.'
  open_choices: None.
  dependencies: []
  priority_rationale: The previous campaign's adoption, level with the base; first because two later
    seeds build on what it computes.
- id: forward-tilt-from-the-meniscus-front-and-back-spots
  mechanism_id: frame-angles-from-spots
  parent_idea_id: null
  title: Measure the frame's forward tilt per knee from the front and back spots of each meniscus
    instead of learning it from the labels
  opportunity: 'Evidence-backed problem, a guess for the fix. The forward tilt (nod) is the one angle
    of the frame still learned from the labels. It ends anywhere between 6 and 15 degrees across runs
    of the same design (run 24 13.6, the height-cuts model 6.0, the femur-lean run 15.3), it reaches
    21 degrees on a knee whose bones stand upright (validation row 370 of the femur-lean run, drawn
    in outputs/analysis/routing-and-shifts-frames-20261007/femur-lean/), and it trades against any
    other free angle (prior-work.md, Measured on 2026-10-07). Turning the crops by half the frame''s
    angle scored better than the full angle at both multipliers, which points at the tilt''s noise.
    The centre, the side axis and the two height cuts are already read from spots without gradient
    and hold still. The two menisci lie on the tibial plateau: the line between them gives roll and
    turn today, and the front and back of each meniscus give the plateau''s slope from front to back,
    which is the missing angle.'
  mechanism: 'In KneeAbnormalityModel.study_frames (modeling/model.py), with the existing `spot` function
    and the shared meniscus channel''s looks, compute four more spots without gradient: medial and
    front (points[:, 0] > 0 and points[:, 1] > 0), medial and back (points[:, 0] > 0 and points[:,
    1] <= 0), lateral and front, lateral and back. Express each in the basis already built from the
    side axis (rows of `basis`: side, front, up): f = offset from the meniscus midpoint along the
    basis front axis, h = along the basis up axis. For each side whose two spots are found and whose
    front and back spots are at least one token pitch (study_pitch) apart in f, slope = (h_front -
    h_back) / (f_front - f_back). tilt = atan of the mean slope over the sides that qualify, zero
    when none does. The frame''s rotation becomes self.frame_rotation() @ R(tilt) @ basis, with R
    the rotation about the side axis that the existing code builds from `tilt`; the shared learned
    rotation stays as it is.'
  precedents:
  - 'routing-and-shifts, height-cuts-from-the-spots-requeue: the two height cuts read from spots without
    gradient, +0.0003 at both multipliers; the cuts hold at +10.8 and -12.9 mm.'
  - 'Run 25 (more anchors on the frame, the nod following a notch and a kneecap landmark): stable
    nod, -0.0006; closed as a learned-landmark design, not as a spot measurement.'
  novelty: First frame with no angle learned per knee from the labels; first use of a front-against-back
    split of the meniscus attention.
  coverage: Every knee with both spots of at least one meniscus; the others keep a tilt of zero.
  exploitation: 'Read both multipliers against the incumbent, PF OA, Synovitis, Effusion and ACL (they
    read above the lower cut, which the tilt moves most), and per epoch on the validation knees the
    mean and the spread of the tilt, the share of knees with a measured tilt and the two height cuts.
    Shown wrong by: a tilt whose spread across knees exceeds 10 degrees (spot noise, not anatomy),
    or the four targets above each more than one sibling SD below the incumbent.'
  budget: Same cost as the incumbent; four more spot centroids per knee.
  implementation: 'Follow the environment paragraph of the developer instructions. modeling/model.py
    only, plus the log in training/lightning.py. Replaces: the landmark tilt (the `tilt` computed
    from the learned landmarks'' forward and upward vectors) and the per-knee regressed nod (output[:,
    count : 2 * count] * nod_only). Remove what only they used: the landmark_attention layer, the
    LANDMARKS it sizes if nothing else reads them, and the nod columns of frame_output (keep its other
    columns at the same indices or shrink it, as long as the shift and size columns behave as before
    and every new or resized layer is created under torch.random.fork_rng). study_frames keeps returning
    the two meniscus spots as study_landmarks. Check the sign on made-up points before the guardrail
    run and report it: place a medial pair and a lateral pair of spots on a plane through the midpoint
    tilted by a known angle about the side axis; in the resulting frame all four must have the same
    height to within 0.1 mm. Log val_ and training study_frame_tilt_deg (mean), its standard deviation
    across knees and study_frame_tilt_measured_share, with the existing frame logs unchanged. Update
    SPATIAL_TOKEN_IDENTITY["algorithm"].'
  open_choices: None.
  dependencies: []
  priority_rationale: The tilt is the root of three of today's findings (half angle, the trade with
    the femur lean, 21 degrees on a straight knee) and every other frame or crop seed inherits it.
- id: kneecap-region-on-the-kneecap-spot
  mechanism_id: upper-band-on-its-own-axis
  parent_idea_id: null
  title: Lay the band above the upper cut out around an axis that passes at the usual distance behind
    each knee's own kneecap spot, with nothing learned
  opportunity: 'A guess, on a measured mechanism. Above the upper cut the crops hold the femoral condyles
    and the kneecap, and the targets that read there (PF OA, Effusion, Synovitis) are about the kneecap
    and the pouch. The femur-lean run laid that band out around an axis hinged at the cut and let
    the labels set its lean: the lean went to -25 degrees for every knee within two epochs and traded
    against the nod, yet Effusion gained 0.0021 (sibling SD 0.0015) with the band displaced. The kneecap
    spot is found in every validation knee, 21.8 mm in front of the axis on average (1.57 token pitches,
    SD 0.40) and 12.5 mm above the upper cut (0.90 pitches, SD 0.21): the kneecap''s place differs
    between knees by about 5.6 mm, a third of a sector''s width at that radius. Principle 9: the spot
    marks the kneecap, so use it to place the kneecap''s region, not to infer the femur.'
  mechanism: 'In frame() (modeling/model.py), after the position (medial, front, height) is computed
    as today: lift = max(height - upper cut, 0) and front becomes front - lift * t, with t per knee.
    In study_frames, without gradient: t = (k_front - m * study_pitch) / max(k_height - upper cut,
    0.5 * study_pitch), where (k_front, k_height) is the kneecap spot''s place in the knee''s frame
    (the squared-attention centroid of the shared OA channel over the tokens with fitted front > 0
    and height > 0, as the height-cuts seed computes it; compute it here if the incumbent does not),
    the upper cut is the knee''s own upper cut however the incumbent obtains it, and m is the running
    mean over training knees of k_front / study_pitch, a persistent buffer updated in training with
    momentum 0.99 from the knees whose kneecap spot is found, initialised from the first training
    batch, and read as it is at validation and prediction. t = 0 for a knee without the three spots.
    So at the kneecap''s height the band''s axis sits the usual distance behind that knee''s kneecap,
    and the band stays attached at the cut (lift is zero there). The regions, the table and the two
    lower bands are unchanged.'
  precedents:
  - 'outputs/training/20261007-101112-side-routed-femur-lean: the same displaced band with a lean
    learned from the labels: x4 -0.0002, x1 -0.0009, Effusion +0.0021, the lean at -25 degrees for
    every knee.'
  - 'Run 31 (PF OA and Effusion on the front half): -0.0005 at both multipliers, Effusion +0.0026,
    PF OA +0.0004.'
  novelty: First region placed on the kneecap spot; first band of the frame with its own axis that
    is measured per knee.
  coverage: Every knee with the two meniscus spots and the kneecap spot (all 874 validation knees
    on the incumbent).
  exploitation: 'Read both multipliers against the incumbent, PF OA, Effusion and Synovitis, and per
    epoch on the validation knees the mean and spread of atan(t) in degrees, the running mean m and
    the nod. Shown wrong by: Effusion and PF OA both inside one sibling SD of the incumbent, or the
    nod moving by more than 5 degrees against the incumbent''s (the two trading again).'
  budget: Same cost as the incumbent.
  implementation: 'Follow the environment paragraph of the developer instructions. Port from the femur-lean
    run''s source_snapshot.zip (prior-work.md, Reusable code): the changed frame(), the lean and kneecap_place
    returned by study_frames, their unpacking in encode_batch ("frame_lean" in the geometry dictionary,
    "study_femur_lean" and "study_kneecap_place" in the output) and the logs in training/lightning.py.
    Do not port its learned parts: no femur_output layer, no femur_offset parameter, no FEMUR_START_GAIN,
    no tanh bound. frame() must keep working when called by scripts.tools.check_side_routing with
    the dictionary encode_batch returns. Create the buffer under torch.random.fork_rng. Replaces nothing:
    the band above the cut has no placement of its own today. Update SPATIAL_TOKEN_IDENTITY["algorithm"]
    and ["initialization_rng"]. That run was built on the height-cuts model: if the incumbent still
    regresses its height cuts, port the kneecap spot with it and leave the cuts as the incumbent has
    them.'
  open_choices: None.
  dependencies: []
  priority_rationale: The measured version of the run trained by hand on 2026-10-07; the only change
    so far that moved Effusion above its noise.
- id: acl-on-its-unrouted-head
  mechanism_id: routing-table
  parent_idea_id: null
  title: Give ACL its own channel over the whole knee again, as Contusion and Fracture have, while
    every other target stays routed
  opportunity: 'Evidence-backed gap, a guess for the cause. ACL sits at 0.9387 in run 24 and at 0.9406
    across the routed runs with a spread equal to its noise (sibling SD 0.0014), against 0.9458 for
    the old recipe without routing on the same fold and seed: the largest per-target gap of the line.
    Its region (the core and the inner ring of five sectors, joint and upper bands) was widened in
    height (run 26, +0.0010, inside noise) and its ring cut was removed (-0.0007 macro), and a shared
    ligament reader gave it +0.0021. Nothing has tested whether the routing itself costs it: an ACL
    tear is read from secondary signs far from the notch (the bone bruises of the lateral compartment,
    the anterior shift of the tibia, the effusion), which a region around the axis leaves out.'
  mechanism: Remove "ACL" from OWN_ROUTES (modeling/model.py) so that ACL's own channel is pooled
    without a routing weight and without a position prior tied to a route, exactly as Contusion and
    Fracture are. The route "core" stays in ROUTES for the report questions that use it (QUESTION_ROUTES
    in training/report_attributes.py). Nothing else changes.
  precedents:
  - 'Old recipe, same fold and seed: ACL 0.9458.'
  - 'routing-and-shifts, shared-ligament-reader-2: ACL +0.0021, macro -0.0007 and +0.0003.'
  - 'Run 26 (ACL at all heights): ACL +0.0010; the lower cut then slid and Synovitis lost 0.0072.'
  novelty: First run of the routed design with ACL unrouted.
  coverage: Every knee.
  exploitation: 'Read ACL against the incumbent at both multipliers, the macro, and the core and ring
    radius per epoch (ACL was the only target reading inside the ring cut alone). Shown wrong by:
    ACL inside one sibling SD of the incumbent.'
  budget: Same cost as the incumbent.
  implementation: 'Follow the environment paragraph of the developer instructions. modeling/model.py:
    OWN_ROUTES without "ACL", and whatever indexes the routes of own channels must treat ACL as it
    treats Contusion and Fracture. Check and report on one batch that ACL''s routing weight is 1 for
    every routable token and that the other targets'' weights equal the incumbent''s. Replaces: ACL''s
    region. Update SPATIAL_TOKEN_IDENTITY["compartment_routing"].'
  open_choices: None.
  dependencies: []
  priority_rationale: The largest known per-target gap, one line to test, and never run.
