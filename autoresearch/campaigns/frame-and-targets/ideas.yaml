- id: forward-tilt-from-the-meniscus-front-and-back-spots
  mechanism_id: frame-angles-from-spots
  parent_idea_id: null
  title: Measure the frame's forward tilt per knee from the front and back spots of
    each meniscus instead of learning it from the labels
  opportunity: 'Evidence-backed problem, a guess for the fix. The forward tilt (nod)
    is the one angle of the frame still learned from the labels. It ends anywhere
    between 6 and 15 degrees across runs of the same design (run 24 13.6, the height-cuts
    model 6.0, the femur-lean run 15.3), it reaches 21 degrees on a knee whose bones
    stand upright (validation row 370 of the femur-lean run, drawn in outputs/analysis/r/routing-and-shifts-frames-20261007/femur-lean/),
    and it trades against any other free angle (prior-work.md, Measured on 2026-10-07).
    Turning the crops by half the frame''s angle scored better than the full angle
    at both multipliers, which points at the tilt''s noise. In the incumbent the centre
    and the side axis are already read from spots without gradient and hold still,
    and the previous campaign did the same for the two height cuts, which then held
    at +10.8 and -12.9 mm; the incumbent still regresses its cuts, and this seed leaves
    them as they are. The two menisci lie on the tibial plateau: the line between
    them gives roll and turn today, and the front and back of each meniscus give the
    plateau''s slope from front to back, which is the missing angle.'
  mechanism: 'In KneeAbnormalityModel.study_frames (modeling/model.py), with the existing
    `spot` function and the shared meniscus channel''s looks, compute four more spots
    without gradient: medial and front (points[:, 0] > 0 and points[:, 1] > 0), medial
    and back (points[:, 0] > 0 and points[:, 1] <= 0), lateral and front, lateral
    and back. Express each in the basis already built from the side axis (rows of
    `basis`: side, front, up): f = offset from the meniscus midpoint along the basis
    front axis, h = along the basis up axis. For each side whose two spots are found
    and whose front and back spots are at least one token pitch (study_pitch) apart
    in f, slope = (h_front - h_back) / (f_front - f_back). tilt = atan of the mean
    slope over the sides that qualify, zero when none does. The frame''s rotation
    becomes self.frame_rotation() @ R(tilt) @ basis, with R the rotation about the
    side axis that the existing code builds from `tilt`; the shared learned rotation
    stays as it is.'
  precedents:
  - 'routing-and-shifts, height-cuts-from-the-spots-requeue: the two height cuts read
    from spots without gradient, +0.0003 at both multipliers; the cuts hold at +10.8
    and -12.9 mm.'
  - 'Run 25 (more anchors on the frame, the nod following a notch and a kneecap landmark):
    stable nod, -0.0006; closed as a learned-landmark design, not as a spot measurement.'
  novelty: First frame with no angle learned per knee from the labels; first use of
    a front-against-back split of the meniscus attention.
  coverage: Every knee with both spots of at least one meniscus; the others keep a
    tilt of zero.
  exploitation: 'Read both multipliers against the incumbent, PF OA, Synovitis, Effusion
    and ACL (they read above the lower cut, which the tilt moves most), and per epoch
    on the validation knees the mean and the spread of the tilt, the share of knees
    with a measured tilt and the two height cuts. Shown wrong by: a tilt whose spread
    across knees exceeds 10 degrees (spot noise, not anatomy), or the four targets
    above each more than one sibling SD below the incumbent.'
  budget: Same cost as the incumbent; four more spot centroids per knee.
  implementation: 'Follow the environment paragraph of the developer instructions.
    modeling/model.py only, plus the log in training/lightning.py. Replaces: the landmark
    tilt (the `tilt` computed from the learned landmarks'' forward and upward vectors)
    and the per-knee regressed nod (output[:, count : 2 * count] * nod_only). Remove
    what only they used: the landmark_attention layer, the LANDMARKS it sizes if nothing
    else reads them, and the nod columns of frame_output (keep its other columns at
    the same indices or shrink it, as long as the shift and size columns behave as
    before and every new or resized layer is created under torch.random.fork_rng).
    study_frames keeps returning the two meniscus spots as study_landmarks. Check
    the sign on made-up points before the guardrail run and report it: place a medial
    pair and a lateral pair of spots on a plane through the midpoint tilted by a known
    angle about the side axis; in the resulting frame all four must have the same
    height to within 0.1 mm. Log val_ and training study_frame_tilt_deg (mean), its
    standard deviation across knees and study_frame_tilt_measured_share, with the
    existing frame logs unchanged. Update SPATIAL_TOKEN_IDENTITY["algorithm"].'
  open_choices: None.
  dependencies: []
  priority_rationale: The tilt is the root of three of today's findings (half angle,
    the trade with the femur lean, 21 degrees on a straight knee) and every other
    frame or crop seed inherits it.
