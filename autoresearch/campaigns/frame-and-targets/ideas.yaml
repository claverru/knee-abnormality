- id: extensor-tendon-targets-above-and-below-the-kneecap
  mechanism_id: report-region-targets
  parent_idea_id: null
  title: Two located targets for the extensor tendons, quadriceps above the upper
    cut and patellar below it, read by one shared head at the front
  opportunity: 'Evidence-backed counts, a guess for the effect. The upper cut at the
    front has PF OA, Effusion and Synovitis reading across it and nothing reading
    it from both sides with different answers. The v5 answer extensor_tendon does:
    quadriceps only in about 237 reports, patellar only in 183, both in 164, and the
    two tendons named as normal in about 1,756 and 1,398. On 212 audited reports it
    is right in 205 with a located precision of 0.943. PF OA and Synovitis decide
    the ranking of the routed runs and both read this part of the knee. Open: the
    upper pole of the kneecap may lie near the edge of the 84 and 93 mm views.'
