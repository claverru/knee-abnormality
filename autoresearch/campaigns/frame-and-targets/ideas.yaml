- id: frame-read-from-the-spots
  mechanism_id: frame-angles-from-spots
  parent_idea_id: null
  title: 'A frame with nothing placed by the labels but the two radii: the forward
    tilt from the meniscus front and back spots and the two height cuts from the meniscus
    and kneecap spots'
  opportunity: 'Evidence-backed parts, a guess for the whole. The frame''s centre
    and side axis are read from the meniscus spots and hold still. Its forward tilt
    and its two height cuts are regressed from the labels: the tilt ends between 6
    and 15 degrees across runs and reaches 21 degrees on a knee whose bones stand
    upright; the lower cut ends at -1.8 mm, through the joint line, and a learned
    cut slides when one side pulls on it (run 26). The previous campaign placed the
    two cuts from the spots and they held at +10.8 and -12.9 mm, level with run 24
    (+0.0003 at both multipliers, 0.952 against 0.953 public). The cuts are measured
    along the frame''s up axis, so they are only as good as the tilt: on the samples
    drawn from that model the cuts slope across the joint where the tilt is off. This
    seed measures both, so the tibia and joint bands sit on the plateau the menisci
    mark.'
  mechanism: 'Two changes in KneeAbnormalityModel.study_frames, both without gradient.
    (1) The forward tilt exactly as the seed forward-tilt-from-the-meniscus-front-and-back-spots
    defines it, built here in full: four spots of the shared meniscus channel (medial
    and lateral, each split at fitted front 0), the slope of height against front
    between the front and back spot of each side in the basis built from the side
    axis, tilt = atan of the mean slope over the sides whose two spots are found and
    at least one token pitch apart, zero otherwise; rotation = self.frame_rotation()
    @ R(tilt) @ basis; the landmark tilt and the per-knee regressed nod are removed.
    (2) The two height cuts exactly as the previous campaign''s adopted experiment
    places them (outputs/autoresearch/routing-and-shifts/experiments/height-cuts-from-the-spots-requeue-20261006T232351Z-d2445402/changes.diff):
    a kneecap spot, the squared-attention centroid of the shared OA channel over the
    tokens with fitted front > 0 and height > 0; in the knee''s frame h_m, s_m the
    mean height and spread of the two meniscus spots and h_k, s_k the kneecap spot''s;
    upper cut = max(h_m + (h_k - h_m) * s_m / (s_m + s_k), h_m); lower cut = 2 * h_m
    - upper cut; the regressed start values when a spot is missing. The core and ring
    radius stay regressed.'
  precedents:
  - 'routing-and-shifts, height-cuts-from-the-spots-requeue: +0.0003 at both multipliers
    against run 24; S120 0.952 against S118 0.953.'
  - 'outputs/analysis/r/routing-and-shifts-frames-20261007/height-cuts-from-the-spots/regions-005.png
    and regions-045.png: cuts at the right height that slope with the frame''s tilt
    and roll.'
  novelty: First frame whose centre, three angles and two cuts are all read from spots.
  coverage: Every knee with the meniscus and kneecap spots; a missing spot falls back
    per quantity as each part states.
  exploitation: 'Read both multipliers against the incumbent and against forward-tilt-from-the-meniscus-front-and-back-spots,
    the four targets above the lower cut (PF OA, Effusion, Synovitis, ACL) and the
    four compartment targets, and per epoch on the validation knees the mean and spread
    of the tilt, of each cut and of the two radii. Shown wrong by: cuts that do not
    hold near +11 and -13 mm, or a tilt whose spread across knees exceeds 10 degrees.'
  budget: Same cost as the incumbent.
  implementation: 'Follow the environment paragraph of the developer instructions.
    Build on the candidate of forward-tilt-from-the-meniscus-front-and-back-spots
    if it exists under this campaign''s experiments (its source/ and changes.diff),
    then apply the changes.diff named in the mechanism for the cuts; both were written
    on run 24''s code. Run that seed''s sign check on made-up points and report it,
    and keep the logs of both parts. Replaces: the landmark tilt, the regressed nod
    and the two regressed height cuts. Update SPATIAL_TOKEN_IDENTITY["algorithm"].'
