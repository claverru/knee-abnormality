- id: kneecap-region-on-the-kneecap-spot
  mechanism_id: upper-band-on-its-own-axis
  parent_idea_id: null
  title: Lay the band above the upper cut out around an axis that passes at the usual
    distance behind each knee's own kneecap spot, with nothing learned
  opportunity: 'A guess, on a measured mechanism. Above the upper cut the crops hold
    the femoral condyles and the kneecap, and the targets that read there (PF OA,
    Effusion, Synovitis) are about the kneecap and the pouch. The femur-lean run laid
    that band out around an axis hinged at the cut and let the labels set its lean:
    the lean went to -25 degrees for every knee within two epochs and traded against
    the nod, yet Effusion gained 0.0021 (sibling SD 0.0015) with the band displaced.
    Measured on the height-cuts model of the previous campaign, whose upper cut sits
    at +10.8 mm (the incumbent regresses its own, +13.7 mm on average): the kneecap
    spot is found in every validation knee, 21.8 mm in front of the axis on average
    (1.57 token pitches, SD 0.40) and 12.5 mm above that upper cut (0.90 pitches,
    SD 0.21): the kneecap''s place differs between knees by about 5.6 mm, a third
    of a sector''s width at that radius. Principle 9: the spot marks the kneecap,
    so use it to place the kneecap''s region, not to infer the femur.'
  mechanism: 'In frame() (modeling/model.py), after the position (medial, front, height)
    is computed as today: lift = max(height - upper cut, 0) and front becomes front
    - lift * t, with t per knee. In study_frames, without gradient: t = (k_front -
    m * study_pitch) / max(k_height - upper cut, 0.5 * study_pitch), where (k_front,
    k_height) is the kneecap spot''s place in the knee''s frame (the squared-attention
    centroid of the shared OA channel over the tokens with fitted front > 0 and height
    > 0, as the previous campaign''s experiment computes it, outputs/autoresearch/routing-and-shifts/experiments/height-cuts-from-the-spots-requeue-20261006T232351Z-d2445402/changes.diff;
    the incumbent does not have it), the upper cut is the knee''s own upper cut however
    the incumbent obtains it, and m is the running mean over training knees of k_front
    / study_pitch, a persistent buffer updated in training with momentum 0.99 from
    the knees whose kneecap spot is found, initialised from the first training batch,
    and read as it is at validation and prediction. t = 0 for a knee without the three
    spots. So at the kneecap''s height the band''s axis sits the usual distance behind
    that knee''s kneecap, and the band stays attached at the cut (lift is zero there).
    The regions, the table and the two lower bands are unchanged.'
  precedents:
  - 'outputs/training/20261007-101112-side-routed-femur-lean: the same displaced band
    with a lean learned from the labels: x4 -0.0002, x1 -0.0009, Effusion +0.0021,
    the lean at -25 degrees for every knee.'
  - 'Run 31 (PF OA and Effusion on the front half): -0.0005 at both multipliers, Effusion
    +0.0026, PF OA +0.0004.'
  novelty: First region placed on the kneecap spot; first band of the frame with its
    own axis that is measured per knee.
  coverage: Every knee with the two meniscus spots and the kneecap spot (all 874 validation
    knees on the height-cuts model).
  exploitation: 'Read both multipliers against the incumbent, PF OA, Effusion and
    Synovitis, and per epoch on the validation knees the mean and spread of atan(t)
    in degrees, the running mean m and the nod. Shown wrong by: Effusion and PF OA
    both inside one sibling SD of the incumbent, or the nod moving by more than 5
    degrees against the incumbent''s (the two trading again).'
  budget: Same cost as the incumbent.
  implementation: 'Follow the environment paragraph of the developer instructions.
    Port from the femur-lean run''s source_snapshot.zip (prior-work.md, Reusable code):
    the changed frame(), the lean and kneecap_place returned by study_frames, their
    unpacking in encode_batch ("frame_lean" in the geometry dictionary, "study_femur_lean"
    and "study_kneecap_place" in the output) and the logs in training/lightning.py.
    Do not port its learned parts: no femur_output layer, no femur_offset parameter,
    no FEMUR_START_GAIN, no tanh bound. frame() must keep working when called by scripts.tools.check_side_routing
    with the dictionary encode_batch returns. Create the buffer under torch.random.fork_rng.
    Replaces nothing: the band above the cut has no placement of its own today. Update
    SPATIAL_TOKEN_IDENTITY["algorithm"] and ["initialization_rng"]. That run was built
    on the height-cuts model and the incumbent regresses its height cuts: port the
    kneecap spot only and leave the cuts as the incumbent has them.'
  open_choices: None.
  dependencies: []
  priority_rationale: The measured version of the run trained by hand on 2026-10-07;
    the only change so far that moved Effusion above its noise.
