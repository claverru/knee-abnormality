    frame''s in-plane angle per slice: on coronal views the angle between the frame''s
    side axis, projected into the slice, and the image columns; on sagittal views
    the angle between the frame''s up axis and the image rows; clamped to 15 degrees;
    zero on views without a margin and where the geometry is not valid. (3) The crop
    is cut turned by 0.5 times that angle about its own centre, in the same single
    resampling of the canvas as the cut, and patient_maps receive the same transform.
