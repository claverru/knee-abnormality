- id: double-cylinder-with-a-learned-femur-lean
  mechanism_id: upper-band-on-its-own-axis
  parent_idea_id: null
  title: A double cylinder whose femur section leans by an angle learned per knee
    from the labels and the reports, with one free angle and readers on both sides
    of the femur's axis
  opportunity: 'The user''s direction, given a fair setup. One run let the labels
    set the femur section''s lean (outputs/training/20261007-101112-side-routed-femur-lean):
    every knee went to -25 degrees within two epochs and the frame''s tilt rose by
    9 degrees. That run had four identifiable flaws, and this seed removes each. (a)
    Two free angles, the frame''s learned forward tilt and the lean, traded against
    each other; the same trade appeared when the lean came from a spot (femur-section-on-spot-placed-cuts-2:
    lean +60, tilt -38). (b) Only the front targets read the femur band (PF OA, Effusion,
    Synovitis), so every gradient on the lean pushed one way and nothing rewarded
    putting the axis on the bone. (c) The lean was regressed from one pooled summary
    of the whole knee and came out the same for every knee. (d) No report target touched
    the femur. Since then the bone head exists: four edema targets by bone and side,
    explaining 27 to 31% on unseen knees, whose attention sits in the femoral condyle
    in every knee, with or without edema (edema-bone-targets-with-the-head-in-the-model-2).
    Measuring the femur''s direction from that head''s spots failed three ways (levers
    of 15 to 56 mm, bends with a spread of 24 to 28 degrees), so the direction has
    to be learned; what the head supplies is a reader inside the bone to pull against
    the readers in front of it.'
  mechanism: 'Built on the candidate of femur-section-on-spot-placed-cuts-2, which
    already has the bone head in the model, the two height cuts placed from the spots
    without gradient, and frame() with the band above the upper cut laid out around
    a leaned axis (front becomes front - max( height - upper cut, 0) * tan(lean),
    hinged at the cut). Three changes to it. (1) One free angle: the frame''s forward
    tilt is zero for every knee. The landmark tilt and the per-knee regressed nod
    are removed and the nod component of the shared learned rotation is held at zero;
    roll and turn stay as they are (from the meniscus spots, plus the shared rotation''s
    roll and turn). With the cuts placed from the spots, the only geometry the labels
    and reports can move is the lean, the two radii and the shared shift. (2) The
    lean is learned per knee: lean = L * tanh(z / L) with L = 35 degrees, z from a
    new head that reads only the knee''s valid tokens above the meniscus midpoint''s
    height: the existing frame hidden (frame_head of the detached tokens plus the
    position code of their fitted positions), pooled by a new attention layer over
    those tokens and mapped by a new linear layer whose weight starts at zero, so
    the lean starts at zero for every knee. No spot enters the lean. (3) Readers on
    both sides of the femur''s axis: above the upper cut the two femur edema targets
    read only the bone column of their side, the core half and the inner-ring sectors
    of that side; in the joint band they read as today. The tibia edema targets and
    every label''s region are unchanged, so above the cut the front labels read both
    rings in front while the femur targets read the core and inner ring: moving the
    axis off the marrow costs the report loss, moving it off the kneecap costs the
    labels.'
