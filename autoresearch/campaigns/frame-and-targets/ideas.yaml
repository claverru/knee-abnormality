- id: femur-section-leaning-to-the-femur-spots
  mechanism_id: upper-band-on-its-own-axis
  parent_idea_id: null
  title: A femur section hinged at the upper cut whose axis passes through the knee's
    own femur spots, read from the report-supervised bone head
  opportunity: 'A guess, on a measured failure. A knee in the coil is bent: on eighteen
    sagittal slices the tibia stands close to vertical and the femur leans by 0 to
    30 degrees, so a single axis is a compromise between two bones. The femur-lean
    run gave the band above the upper cut its own axis and let the labels set the
    lean: every knee went to -25 degrees within two epochs and the lean traded against
    the nod, because only the targets of that band pull on it. The lean needs a landmark
    on the femur. The bone head''s femur spots are one, supervised by the reports
    (706 reports place edema in the femur, 863 in the tibia, 2,595 report none), independent
    of the twelve labels'' gradient.'
  mechanism: 'Everything of the seed edema-bone-targets-with-the-head-in-the-model,
    built here in full. In addition, in frame() (modeling/model.py), after the position
    (medial, front, height) is computed as today: lift = max(height - upper cut, 0)
    and front becomes front - lift * t. In study_frames, without gradient: F = the
    midpoint of the knee''s two femur spots expressed in the knee''s frame; t = F_front
    / max(F_height - upper cut, 0.5 * study_pitch); t = 0 when a femur spot is missing
    or F lies below the upper cut. So above the cut the sectors, the core and the
    rings are laid out around the line from the centre of the cut to the femur spots,
    and the section stays attached at the cut (lift is zero there). The tibia and
    joint bands, the regions and the table are unchanged, and the bone targets'' own
    regions use the leaned band like every other target.'
  precedents:
  - 'outputs/training/20261007-101112-side-routed-femur-lean: the same hinged band
    with a lean learned from the labels: x4 -0.0002, x1 -0.0009, Effusion +0.0021,
    the lean at -25 degrees for every knee and the nod up by 9 degrees.'
  - 'outputs/analysis/r/routing-and-shifts-frames-20261007/knee-bend/sagittal-gallery.png:
    the bend by eye; two rule-based measurements of it failed.'
  novelty: First angle of the frame set by a report-supervised landmark; first femur
    section that can differ between knees.
  coverage: Every knee with the two femur spots above its upper cut; the others keep
    a straight upper band.
  exploitation: 'Read both multipliers against the incumbent and against edema-bone-targets-with-the-head-in-the-model,
    PF OA, Effusion, Synovitis and ACL, and per epoch on the validation knees the
    mean and the spread of atan(t) in degrees, the share of knees with a lean, the
    frame''s forward tilt, and the femur spots'' place. Shown wrong by: a lean with
    a spread across knees under 3 degrees (it would be one shared setting again),
    a forward tilt that moves by more than 5 degrees against the incumbent''s (the
    two trading), or PF OA and Effusion both more than one sibling SD below the incumbent.'
  budget: Same cost as the incumbent plus one attention column and classifier row.
  implementation: 'Follow the environment paragraph of the developer instructions.
    Build on the candidate of edema-bone-targets-with-the-head-in-the-model if it
    exists under this campaign''s experiments (its source/ and changes.diff). Port
    the leaned frame() and its plumbing from the femur-lean run''s source_snapshot.zip
    (prior-work.md, Reusable code): "frame_lean" in the geometry dictionary and the
    lean in the encode_batch output and the logs. Do not port its learned parts or
    its kneecap start: no femur_output layer, no femur_offset parameter, no gain,
    no tanh bound. frame() must keep working when called by scripts.tools.check_side_routing
    with the dictionary encode_batch returns. Replaces nothing in the frame: the band
    above the cut has no axis of its own today. Update SPATIAL_TOKEN_IDENTITY["algorithm"].'
  open_choices: None.
