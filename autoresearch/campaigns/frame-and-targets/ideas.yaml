- id: tibia-and-femur-sections-on-their-own-axes
  mechanism_id: upper-band-on-its-own-axis
  parent_idea_id: null
  title: Two tilts per knee, one for the tibia and one for the femur, each read from
    that bone's report-supervised spots
  opportunity: 'The direction of the campaign, stated by the user on 2026-10-07. A
    knee in the coil is bent: on eighteen sagittal slices the tibia stands close to
    vertical and the femur leans by 0 to 30 degrees. The frame has one forward tilt,
    learned from the labels, which has to stand for both bones: it ends between 6
    and 15 degrees across runs of one design, and when the band above the upper cut
    was given its own lean learned from the labels the two angles traded against each
    other (the lean at -25 degrees for every knee, the tilt up by 9 degrees). So the
    tilt may be wrong because there are two. The v5 extraction was run to get a landmark
    on each bone: marrow edema placed in the femur (706 reports), in the tibia (863),
    or absent (2,595). A head trained on those targets has to look at each bone''s
    marrow, and its attention above and below the joint gives a femur spot and a tibia
    spot per side. A guess: that those spots mark the bones in knees without edema
    too; the seed edema-bone-targets-with-the-head-in-the-model reports that before
    this one runs.'
  mechanism: 'Everything of the seed edema-bone-targets-with-the-head-in-the-model,
    built here in full: the four located edema targets, their shared head inside the
    model, and the four spots per knee (femur and tibia, medial and lateral), without
    gradient. Then, in KneeAbnormalityModel.study_frames, without gradient, with M
    the midpoint of the two meniscus spots, T the midpoint of the two tibia spots
    and F the midpoint of the two femur spots, all expressed in the basis built from
    the side axis (side, front, up). (1) Tibia tilt: the frame''s forward tilt becomes
    the angle about the side axis that puts T straight below M, tilt = atan2 of the
    front and up components of M - T, so that in the knee''s frame T has no front
    offset; zero when a tibia spot is missing or T is less than one token pitch below
    M. The frame''s rotation is self.frame_rotation() @ R(tilt) @ basis; the landmark
    tilt and the per-knee regressed nod are removed. The tibia band and the joint
    band are laid out in this frame as today. (2) Femur tilt: in frame(), above the
    upper cut, lift = max(height - upper cut, 0) and front becomes front - lift *
    t, with t = F_front / max(F_height - upper cut, 0.5 * study_pitch) for F expressed
    in the knee''s frame; t = 0 when a femur spot is missing or F lies below the upper
    cut. So below the upper cut the sectors, core and rings sit around the tibia''s
    line, above it around the line from the centre of the cut to the femur spots,
    and the two sections stay attached at the cut. The regions, the table, the height
    cuts and the two radii are unchanged, and every target reads the sections as laid
    out.'
  precedents:
  - 'outputs/training/20261007-101112-side-routed-femur-lean: one hinged band with
    a lean learned from the labels: x4 -0.0002, x1 -0.0009, Effusion +0.0021; the
    lean at -25 degrees for every knee and the tilt up by 9 degrees.'
  - 'outputs/analysis/r/routing-and-shifts-frames-20261007/knee-bend/sagittal-gallery.png:
    the tibia near vertical and the femur leaning by 0 to 30 degrees, by eye; two
    rule-based measurements of the bend failed.'
  - 'Crops turned by the frame''s angle at prediction: +0.0007 at x4 on run 24''s
    weights with half the angle; half as good as or better than the full angle, as
    an angle standing for two bones would give.'
  novelty: First frame with a separate, measured axis for each bone; first frame angle
    set by report-supervised landmarks.
  coverage: Every knee with the two meniscus spots; the tibia tilt needs the two tibia
    spots and the femur tilt the two femur spots, and each falls back to zero on its
    own.
  exploitation: 'Read both multipliers against the incumbent and against edema-bone-targets-with-the-head-in-the-model
    and femur-section-leaning-to-the-femur-spots, PF OA, Effusion, Synovitis and ACL
    (they read above the lower cut) and the four compartment targets, and per epoch
    on the validation knees: the mean and the spread across knees of the tibia tilt,
    of the femur tilt atan(t) and of their difference (the knee''s bend) in degrees,
    the share of knees with each, and the place of the four spots in the knee''s frame.
    Shown wrong by: a tibia tilt whose spread across knees exceeds 10 degrees while
    the tibia stands near vertical by eye; a bend whose spread is under 3 degrees
    (the two tilts would be one setting again); or the four targets above the lower
    cut each more than one sibling SD below the incumbent.'
  budget: Same cost as the incumbent plus one attention column and classifier row.
  implementation: 'Follow the environment paragraph of the developer instructions.
    Build on the candidate of femur-section-leaning-to-the-femur-spots if it exists
    under this campaign''s experiments (its source/ and changes.diff): it already
    has the bone head in the model, the four spots and the leaned frame(). Otherwise
    build on the candidate of edema-bone-targets-with-the-head-in-the-model and port
    the leaned frame() from the femur-lean run''s source_snapshot.zip (prior-work.md,
    Reusable code) without its learned parts (no femur_output layer, no femur_offset
    parameter, no gain, no tanh bound). Remove what only the landmark tilt and the
    regressed nod used (the landmark_attention layer, the nod columns of frame_output),
    keeping every other column''s behaviour and creating any new or resized layer
    under torch.random.fork_rng. study_frames keeps returning the two meniscus spots
    as study_landmarks. Check the signs on made-up points before the guardrail run
    and report both: with a tibia midpoint placed below and in front of M by a known
