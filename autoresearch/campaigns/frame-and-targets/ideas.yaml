  opportunity: 'The user''s direction in full: one tilt for the tibia and one for
    the femur. The same template matching that gives the femur band''s direction was
    checked on the tibia band, hinged at the tibia spots, on the same weights (outputs/analysis/f/frame-and-targets/template-bend/template-bend-tibia.csv):
    the estimates from the T1/PD series and from the fluid series of one knee correlate
    at 0.59 (797 knees), with a spread of 10 degrees; weaker than the femur''s 0.76,
    at the edge of the 0.6 the check asked for. The tibia and femur angles of a knee
    correlate at 0.25, so they are mostly separate quantities, as two tilts should
    be. A guess: that turning the tibia and joint bands by a noisier angle helps more
    than it costs; the frame''s tilt is zero otherwise, which is wrong for knees whose
    whole limb is tilted in the coil.'
  mechanism: 'Everything of the seed femur-section-turned-to-a-running-template, built
    here in full. In addition the frame''s forward tilt per knee, zero in that seed,
    becomes the angle b at which the knee''s sagittal tokens of the tibia band best
    match a second running template: the same construction with the hinge at the midpoint
    of the knee''s two tibia spots, the grid over front in [-48, 48] and height in
    [-44, 4] mm relative to that hinge, its own two template buffers and its own running
    mean. The frame''s rotation is self.frame_rotation() @ R(b) @ basis with R the
    rotation about the side axis, so the tibia band and the joint band are laid out
    in a frame turned by b, and the femur section is turned by a about the femur spots
    on top of it, with a estimated from tokens expressed in the frame already turned
    by b. Neither angle receives a gradient.'
