- id: tendon-targets-with-the-head-in-the-model
  mechanism_id: report-region-targets
  parent_idea_id: null
  title: Two located targets for the extensor tendons, read by one shared head that
    lives in the model, so a spot above and a spot below the kneecap exist for every
    knee
  opportunity: 'A guess, aimed at the landmark the double cylinder lacks. The femur''s
    direction could not be measured from the bone head: its spots sit in the condyle
    15 mm from the joint, and the condyle is round, so the femur turns about it (bends
    of 51 +- 28, 18 +- 25 and 7 +- 24 degrees from three constructions, none agreeing
    with the knees judged bent or straight). The extensor tendons are linear structures
    that run along the bones: the quadriceps tendon along the front of the femur above
    the kneecap, the patellar tendon from the kneecap down to the tibial tuberosity.
    The v5 answer extensor_tendon places abnormalities in one, the other or both (commonest
    option in 304, 231 and 178 reports; none in 3,648), right in 205 of 212 audited
    reports. A head trained on it has to look at each tendon, and the bone head showed
    that such a head attends to its structure in knees without the finding too. This
    run does not change the frame: it reports where the two spots fall.'
  mechanism: 'training/report_attributes.py reads the v5 file `<paths.data_root>/labels/prepared/jevk5-report-attributes-v5.0-new/targets.parquet`.
    A new located family "extensor_tendon" with two Region entries read by one shared
    head: quadriceps (options quadriceps and both) on a new route tendon_upper = the
    three front sectors outside the core in the upper band; patellar (options patellar
    and both) on a new route tendon_lower = the same sectors in the joint and tibia
    bands; unplaced not_stated; the existing option-level head of extra_extensor_tendons
    stays. The family''s attention column and classifier row are parameters of KneeAbnormalityModel,
    called by the training module for the report loss with the same detachment and
    gradient path as the other located families. With that column''s scores the model
    computes, without gradient and with the existing spot function, two spots per
    knee: the squared-attention centroid over the valid tokens with fitted front >
    0 above the meniscus midpoint''s height, and the same below it. encode_batch returns
    them. Nothing reads them: the frame is unchanged.'
