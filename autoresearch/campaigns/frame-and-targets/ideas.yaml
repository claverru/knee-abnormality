- id: edema-bone-targets-with-the-head-in-the-model-2
  mechanism_id: report-region-targets
  parent_idea_id: null
  title: Four located targets for marrow edema, femur and tibia on each side, read
    by one shared head that lives in the model, so a femur spot and a tibia spot exist
    for every knee
  opportunity: 'Evidence-backed counts, a guess for the effect. No report target today
    is read on both sides of the tibia-against-joint cut or tells the femoral side
    of a compartment from the tibial side. The v5 answer marrow_edema_bone does: with
    the compartment answer the incumbent already uses, the reports give about 393
    medial-femur, 349 medial-tibia, 354 lateral-femur and 310 lateral-tibia knees,
    each above the 200 a located target needs, and 2,512 reports without edema as
    full-weight negatives. On 212 audited reports the femur is right in 48 of 60 answers
    and the tibia in 58 of 72, femur and tibia are swapped once in 37 single-bone
    reports, and the typical error is answering both bones (prior-work.md, The v5
    report answers). It also gives Contusion''s finding a place per study. Nothing
    in the frame marks the femur today: the crops show about 3 cm of it, and the kneecap
    spot marks the kneecap. A head trained to find edema in the femur and in the tibia
    has to look at each bone''s marrow, in knees with and without edema, so its attention
    above and below the joint is a candidate landmark for each bone. The report heads
    live in the training module and vanish at prediction; this one is put in the model
    so that its spots can be read for any knee.'
  mechanism: 'training/report_attributes.py reads, beside the v4.0 targets, the two
    v5 questions from `<paths.data_root>/labels/prepared/jevk5-report-attributes-v5.0-new/targets.parquet`
    (columns `StudyInstanceUID` and `attribute_<question>__<option>`, one row per
    study of the 4,407). A new located family "marrow_edema_bone" with four Region
    entries, read by one shared head exactly as the existing located families are:
    femur_medial, femur_lateral, tibia_medial, tibia_lateral. The target of a region
    is the product of two masses: the bone (femur: options femur and femur_tibia;
    tibia: options tibia and femur_tibia) times the compartment (the options of marrow_edema_location
    that include that compartment, as the existing edema-by-compartment regions define
    them). Its weight is the reliability weight times one minus the mass of the bone
    options not_stated and patella_and_other. Four new routes appended to ROUTES and
    _regions (modeling/model.py): bone_femur_medial = the medial compartment''s sectors
    and its half of the core in the joint and upper bands; bone_tibia_medial = the
    same sectors and half core in the tibia and joint bands; the two lateral ones
    their mirror images. No existing target or region changes, and marrow_edema_bone
    gets no option-level head. The family''s attention column and classifier row are
    parameters of KneeAbnormalityModel instead of the training module: the training
    module calls them for the report loss exactly where a located family''s own column
    and row would be, with the same detachment and the same gradient path as the other
    located families. With that column''s scores the model computes, without gradient
    and with the existing `spot` function, four spots per knee: femur medial, femur
    lateral, tibia medial, tibia lateral, each the squared-attention centroid over
    the tokens of that fitted side (fitted medial > 0 or <= 0) above or below the
    meniscus midpoint''s height. encode_batch returns them. Nothing reads them in
    this seed: the frame is unchanged.'
