- id: crops-turned-to-the-current-frame
  mechanism_id: frame-aligned-crops
  parent_idea_id: null
  title: Cut each 84 and 93 mm view turned by half the knee's frame angle, with the
    frame of the same training step instead of the one remembered from the last epoch
  opportunity: A defect the first crop run exposed. crops-turned-to-the-frame turns
    each training crop by the frame the model computed the last time it saw that knee,
    to save a second look per step, while validation and prediction turn by the current
    frame from a first look. The frame's learned forward tilt swings in the first
    epochs (validation mean -2 degrees after epoch 2, +12 after epoch 3), so at epoch
    3 the model trained on crops turned -1.9 degrees on average and was validated
    on crops turned -5.0 degrees, and its validation macro fell 0.0046 behind the
    incumbent, below its own epoch 2, before recovering to -0.0012 at epoch 4. A remembered
    frame is one epoch old; whenever the frame moves, training and prediction see
    different crops. Taking the frame in the same step removes the mismatch at every
    epoch.
  mechanism: 'Everything of the seed crops-turned-to-the-frame except its training
    path. In training, the frame for the cut comes from a first look inside the same
    step: one pass of the same model without gradient, with the model''s modules in
    evaluation mode for that pass and restored afterwards, on the batch''s unturned
    crops, reading every second valid slice of each series row (the first, third,
    fifth valid slice, at least one); the frame''s rotation, study axis and left probability
    read from that pass give the angle exactly as at validation. The dictionary of
    remembered frames is removed. Validation and prediction are unchanged: a first
    look reading at most each view''s configured slice count.'
  precedents:
  - 'outputs/autoresearch/frame-and-targets/experiments/crops-turned-to-the-frame-20261007T131425Z-d88162fd:
    the remembered-frame version; its per-epoch angles in training and validation
    (crop_turn_*_deg, val_crop_turn_*_deg).'
  - 'outputs/analysis/r/routing-and-shifts-frames-20261007/frame-crops/: the prediction-only
    check and its controls.'
  novelty: First training in which the crop follows the frame of the same step.
  coverage: Coronal and sagittal 84 and 93 mm views of every knee; the 120 mm axial
    views are untouched.
  exploitation: 'Read both multipliers against the incumbent and against crops-turned-to-the-frame,
    and per epoch the mean applied angle per plane in training and in validation:
    the two must agree within a degree at every epoch, where the remembered-frame
    run differed by 3 degrees at epoch 3. Report training time and prediction time.
