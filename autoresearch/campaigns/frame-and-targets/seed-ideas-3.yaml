ideas:
- id: crops-turned-to-the-frame
  mechanism_id: frame-aligned-crops
  parent_idea_id: null
  title: Cut each 84 and 93 mm view turned by half the knee's own frame angle, in training and at
    prediction
  opportunity: Evidence-backed at prediction, a guess for training. On the height-cuts model's weights,
    with no training, re-cutting the crops turned to the frame scored +0.0011 at x4 and -0.0002 at
    x1; turned the wrong way -0.0007 and -0.0009; turned by half the angle +0.0010 and +0.0007, the
    only variant above the anchor at both multipliers (prior-work.md, Measured on 2026-10-07). The
    sign of the turn matters with identical resampling, so it is the alignment. It repeats on run
    24's weights (+0.0007 at x4 with half the angle). Those weights were trained on knees at the scanner's
    orientation with 10 degrees of rotation augmentation; a model trained on upright knees does not
    have to spend capacity on the tilt.
  mechanism: '(1) The canvas port of the routing-and-shifts campaign with data.view_shift_limit_mm:
    6.0 (a margin of 16 and 14 px, enough for 7.5 degrees). (2) In the model, the frame''s in-plane
    angle per slice: on coronal views the angle between the frame''s side axis, projected into the
    slice, and the image columns; on sagittal views the angle between the frame''s up axis and the
    image rows; clamped to 15 degrees; zero on views without a margin and where the geometry is not
    valid. (3) The crop is cut turned by 0.5 times that angle about its own centre, in the same single
    resampling of the canvas as the cut, and patient_maps receive the same transform. (4) At validation
    and prediction the frame comes from one first look: a no-gradient pass in evaluation mode on the
    unturned crops, reading for each series row at most as many slices as its view''s configured count,
    evenly spaced among the row''s valid slices. (5) In training the frame comes from the model''s
    own last training pass over that knee, kept in a dictionary on the module keyed by study_uid (the
    frame''s rotation, the study axis and the left probability, detached); a knee not yet seen is
    cut unturned. The affine augmentation is unchanged and applies after the cut.'
  precedents:
  - 'outputs/analysis/r/routing-and-shifts-frames-20261007/frame-crops/: the prediction-only check and
    its controls on the height-cuts model, on run 24 (this campaign''s base, +0.0007 at x4 with half
    the angle) and on the ResNet-50.'
  - 'routing-and-shifts, shift-per-study-from-the-spots: crops moved toward the meniscus midpoint
    by a trained locator: -0.0004 and -0.0022; a shift, not a turn.'
  novelty: First training on crops aligned to the knee's own frame; first use of a first look.
  coverage: Coronal and sagittal 84 and 93 mm views of every knee; the 120 mm axial views are untouched.
  exploitation: 'Read both multipliers against the incumbent, Fracture, Lateral OA, Lateral Meniscus,
    MCL and ACL (the targets that moved in the prediction-only check), and per epoch on the validation
    knees the mean and spread of the applied angle per plane, the share of knees turned in training,
    and the frame''s own angles (after training on turned crops the roll and nod should shrink only
    if the frame followed the picture, which it must not: positions are physical). Report the prediction
    time against the incumbent''s. Shown wrong by: both multipliers below the incumbent by more than
    a rerun (0.0010), or a prediction time above 1.3 times.'
  budget: Training as the incumbent plus the larger canvases (the 15 mm canvases of the previous campaign
    trained in 1,455 s against a limit of 1,595 s; these are smaller). Prediction adds one first look
    at the multiplier-1 slice count.
  implementation: 'Follow the environment paragraph of the developer instructions. The base of this
    campaign is run 24, and outputs/analysis/r/routing-and-shifts-frames-20261007/builds/rotation-on-run-24/
    is this change at prediction, written on run 24''s code: the canvas loader (config.py, data/dataset.py,
    data/preprocessing/, inference/engine.py, inference/reflection.py) and, in modeling/model.py,
    sample_windows, crop_rectangles, ViewWindows with frame_angles and the rotated cut, and the two-pass
    forward. Port it; drop the locator_series_index and locator_series_first keys it carries from
    an older candidate, and replace its config field view_frame_rotation_fraction by a module constant.
    That build takes the first look on the whole batch and has no training path: add the slice subset
    for the first look (subset every per-slice tensor of the batch consistently) and the training
    dictionary. The mirrored pass (a batch carrying "mirrored_study") takes its angle from a first
    look without that key and reflects after the cut, as the build does. If the incumbent has changed
    since run 24, apply the port on the incumbent. Report the three topic 2 checks of the contract.
    Replaces: the cut at the scanner''s orientation. Update SPATIAL_TOKEN_IDENTITY["view_policy"]
    and ["preparation"].'
  open_choices: None.
  dependencies: []
  priority_rationale: The largest effect measured on 2026-10-07, confirmed by a wrong-way control
    and on a second set of weights, and never trained.
- id: crops-turned-and-centred-on-the-frame
  mechanism_id: frame-aligned-crops
  parent_idea_id: null
  title: Cut each 84 and 93 mm view turned by half the frame's angle and moved by half the frame centre's
    deviation, in training and at prediction
  opportunity: 'A guess, with the measurements that shape it. Centring the crops on the frame''s centre
    at prediction only, on the height-cuts model''s weights, scored -0.0004 at x4: it gained Medial
    Meniscus, ACL, Effusion and Contusion by about 0.002 each and cost Fracture 0.0088 and PF OA 0.0037.
    It moved crops by 5 to 7 mm at the median, most of it the spots'' own noise (4 to 6 mm), on weights
    that had never seen a centred knee. Half the angle beat the full angle for the same reason. Training
    on the moved crops lets the targets that read far from the joint centre adapt. The spread of the
    frame''s centre around the hand-set position is 2.3 mm side to side, 4.8 mm front to back and
    7.4 mm up and down.'
  mechanism: 'Everything of the seed crops-turned-to-the-frame, built here in full, with data.view_shift_limit_mm:
    14.0 (a 300 px canvas at 84 mm). In addition the crop''s centre moves by 0.5 times the deviation
    of the knee''s frame centre (study_frame_shift) from its running mean over training knees (a persistent
    buffer, momentum 0.99, initialised from the first training batch, read as it is at validation
    and prediction), projected into each slice''s plane and converted to pixels with that slice''s
    patient map. The move is clamped so that the turned crop stays inside the canvas, and composed
    with the turn and the cut into one resampling; patient_maps and valid_rects receive the same transform.
    The frame for the move comes from the same first look or training dictionary as the angle.'
  precedents:
  - 'outputs/analysis/r/routing-and-shifts-frames-20261007/frame-crops/frame-crops-x4.npz: centred -0.0004,
    centred and turned -0.0007, prediction only, full deviation and full angle.'
  - 'routing-and-shifts, crops-and-frame-share-one-centre-unit-output: a learned centre shared by
    crops and frame, -0.0037 and -0.0062; learned from the labels, not read from the spots.'
  novelty: First training on crops both turned and centred by the knee's own frame.
  coverage: Coronal and sagittal 84 and 93 mm views of every knee.
  exploitation: 'Read both multipliers against the incumbent and against crops-turned-to-the-frame,
    Fracture and PF OA (the two that paid for centring at prediction), Medial Meniscus, ACL, Effusion
    and Contusion (the four that gained), and per epoch on the validation knees the mean and spread
    of the applied move per plane and direction in millimetres, the share of slices clamped and the
    applied angle. Report the prediction time. Shown wrong by: Fracture and PF OA each more than one
    sibling SD below the incumbent while the four others stay inside theirs.'
  budget: As crops-turned-to-the-frame with 300 px canvases, the size the previous campaign's shift
    runs trained with inside the limit.
  implementation: 'Follow the environment paragraph of the developer instructions. Build on the candidate
    of crops-turned-to-the-frame if it exists under this campaign''s experiments (its source/ and
    changes.diff), otherwise from the same sources. The centring arithmetic is in outputs/analysis/r/routing-and-shifts-frames-20261007/builds/scripts/frame_crops.py
    (function `moves`: the deviation in the knee''s anatomical axes turned into the patient''s axes
    with the study axis and the side sign, then projected on the slice''s two in-plane directions);
    it used the fold''s mean, which a candidate replaces by the training running mean. The two halves
    are module constants with no config field. Create the buffer under torch.random.fork_rng. Report
    the three topic 2 checks of the contract. Update SPATIAL_TOKEN_IDENTITY["view_policy"], ["preparation"]
    and ["initialization_rng"].'
  open_choices: None.
  dependencies: []
  priority_rationale: The user's design for the default crop (turn and move, aligned to the frame);
    runs after the turn alone so the two are measured apart.
- id: smaller-rotation-augmentation-on-turned-crops
  mechanism_id: frame-aligned-crops
  parent_idea_id: null
  title: Crops turned by half the frame's angle, with the random rotation of the affine augmentation
    halved
  opportunity: A guess. The affine augmentation turns 70% of series by up to 10 degrees, a range chosen
    when knees arrived at the scanner's orientation. The frame's in-plane angle has a median of 3.6
    degrees on coronal views and 5.9 on sagittal (90th percentiles 8.7 and 11.5); once the crops are
    turned by half of it, about half of that spread is gone, and the augmentation spends its range
    on orientations the model no longer meets. The validation crops are never augmented, so a narrower
    range brings training closer to what is predicted on.
  mechanism: 'Everything of the seed crops-turned-to-the-frame, built here in full, and data.affine_augmentation.rotation_degrees:
    5.0 in configs/training.yaml in place of 10.0. The probability, the translation and the scale
    range stay.'
  precedents:
  - 'learnable-views run 17 (jitter 4 mm and 5% in place of 8 mm and 10%, on unaligned views of the
    old recipe): -0.0008 [-0.0022, +0.0006].'
  novelty: First change of the affine range on crops aligned to the knee.
  coverage: Training only; every series the augmentation touches.
  exploitation: 'Read both multipliers against the incumbent and against crops-turned-to-the-frame,
    and the gap between the training loss and the validation loss at the last epoch against that run''s.
    Shown wrong by: both multipliers below crops-turned-to-the-frame by more than a rerun (0.0010).'
  budget: As crops-turned-to-the-frame.
  implementation: Follow the environment paragraph of the developer instructions. Build on the candidate
    of crops-turned-to-the-frame if it exists under this campaign's experiments (its source/ and changes.diff),
    otherwise from the sources that seed names. The only further change is the one config value. Report
    the three topic 2 checks of the contract.
  open_choices: None.
  dependencies: []
  priority_rationale: The user's third element of the aligned default (small augmentation around the
    aligned crop), measured apart from the turn.
