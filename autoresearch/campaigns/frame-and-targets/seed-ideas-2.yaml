ideas:
- id: extensor-tendon-targets-above-and-below-the-kneecap
  mechanism_id: report-region-targets
  parent_idea_id: null
  title: Two located targets for the extensor tendons, quadriceps above the upper cut and patellar
    below it, read by one shared head at the front
  opportunity: 'Evidence-backed counts, a guess for the effect. The upper cut at the front has PF
    OA, Effusion and Synovitis reading across it and nothing reading it from both sides with different
    answers. The v5 answer extensor_tendon does: quadriceps only in about 237 reports, patellar only
    in 183, both in 164, and the two tendons named as normal in about 1,756 and 1,398. On 212 audited
    reports it is right in 205 with a located precision of 0.943. PF OA and Synovitis decide the ranking
    of the routed runs and both read this part of the knee. Open: the upper pole of the kneecap may
    lie near the edge of the 84 and 93 mm views.'
  mechanism: 'training/report_attributes.py reads the v5 file named in edema-bone-targets-with-the-head-in-the-model.
    A new located family "extensor_tendon" with two Region entries read by one shared head: quadriceps
    (options quadriceps and both) on a new route tendon_upper = the three front sectors outside the
    core in the upper band; patellar (options patellar and both) on a new route tendon_lower = the
    same sectors in the joint and tibia bands. Unplaced: not_stated. The existing option-level head
    of extra_extensor_tendons stays. No existing target or region changes.'
  precedents:
  - 'attributes_v5.md (worktree knee-abnormality-jevk5-attributes-v4): the counts and the check on
    the audited reports.'
  - 'Run 31 (PF OA and Effusion on the front half): the front regions are where Effusion gains.'
  novelty: First report target that sets the front above the kneecap against the front below it.
  coverage: Training only; the 4,407 studies with reports.
  exploitation: 'Read both multipliers against the incumbent, PF OA, Effusion and Synovitis, val_report_attribute_bce_<region>
    for the two new targets with the share each explains, and the upper cut per epoch. Shown wrong
    by: the two targets explaining under 10% on the validation knees.'
  budget: Same cost as the incumbent; one more attention column and classifier row.
  implementation: Follow the environment paragraph of the developer instructions. Two routes appended
    to ROUTES and _regions (modeling/model.py) and two Region entries; load the extra file as the
    edema-bone seed describes, building on that candidate's loader if it exists under this campaign's
    experiments. Report the number of training studies with a target above 0.5 in each of the two.
    Update SPATIAL_TOKEN_IDENTITY["compartment_routing"].
  open_choices: None.
  dependencies: []
  priority_rationale: The second v5 answer; a reader on both sides of the cut that PF OA and Synovitis
    depend on.
- id: acl-on-its-unrouted-head
  mechanism_id: routing-table
  parent_idea_id: null
  title: Give ACL its own channel over the whole knee again, as Contusion and Fracture have, while
    every other target stays routed
  opportunity: 'Evidence-backed gap, a guess for the cause. ACL sits at 0.9387 in run 24 and at 0.9406
    across the routed runs with a spread equal to its noise (sibling SD 0.0014), against 0.9458 for
    the old recipe without routing on the same fold and seed: the largest per-target gap of the line.
    Its region (the core and the inner ring of five sectors, joint and upper bands) was widened in
    height (run 26, +0.0010, inside noise) and its ring cut was removed (-0.0007 macro), and a shared
    ligament reader gave it +0.0021. Nothing has tested whether the routing itself costs it: an ACL
    tear is read from secondary signs far from the notch (the bone bruises of the lateral compartment,
    the anterior shift of the tibia, the effusion), which a region around the axis leaves out.'
  mechanism: Remove "ACL" from OWN_ROUTES (modeling/model.py) so that ACL's own channel is pooled
    without a routing weight and without a position prior tied to a route, exactly as Contusion and
    Fracture are. The route "core" stays in ROUTES for the report questions that use it (QUESTION_ROUTES
    in training/report_attributes.py). Nothing else changes.
  precedents:
  - 'Old recipe, same fold and seed: ACL 0.9458.'
  - 'routing-and-shifts, shared-ligament-reader-2: ACL +0.0021, macro -0.0007 and +0.0003.'
  - 'Run 26 (ACL at all heights): ACL +0.0010; the lower cut then slid and Synovitis lost 0.0072.'
  novelty: First run of the routed design with ACL unrouted.
  coverage: Every knee.
  exploitation: 'Read ACL against the incumbent at both multipliers, the macro, and the core and ring
    radius per epoch (ACL was the only target reading inside the ring cut alone). Shown wrong by:
    ACL inside one sibling SD of the incumbent.'
  budget: Same cost as the incumbent.
  implementation: 'Follow the environment paragraph of the developer instructions. modeling/model.py:
    OWN_ROUTES without "ACL", and whatever indexes the routes of own channels must treat ACL as it
    treats Contusion and Fracture. Check and report on one batch that ACL''s routing weight is 1 for
    every routable token and that the other targets'' weights equal the incumbent''s. Replaces: ACL''s
    region. Update SPATIAL_TOKEN_IDENTITY["compartment_routing"].'
  open_choices: None.
  dependencies: []
  priority_rationale: The largest known per-target gap, one line to test, and never run.
- id: five-unplaced-report-questions-without-heads
  mechanism_id: report-question-set
  parent_idea_id: null
  title: Train without the heads of the five report questions that locate nothing the routed model
    can use
  opportunity: 'A guess, kept open on purpose. Five v4 questions have varied answers but no place
    in the knee: extra_osteochondral, extra_other_cysts, extra_bursitis, pf_cartilage_surface and
    baker_ruptured. Every earlier removal of report information cost (low-agreement questions dropped:
    0.943 public against 0.947; hedged options -0.0015; grade merges -0.0014; completeness options
    -0.0005), each on a single run with whole-knee heads, before routing. The v5 specification leaves
    these five to one run with and without them.'
  mechanism: 'training/report_attributes.py: the five questions get no head and no loss term; their
    columns are ignored. Nothing else changes.'
  precedents:
  - 'attributes_v5.md, Dropped or decided by a test: the four recorded removals and their costs.'
  novelty: First removal of report questions on the routed model.
  coverage: Training only.
  exploitation: 'Read both multipliers against the incumbent and every target against its sibling
    SD. Shown wrong by: a macro more than a rerun (0.0010) below the incumbent at x4, which keeps
    the five questions in every later question set.'
  budget: Same cost as the incumbent, five heads fewer.
  implementation: Follow the environment paragraph of the developer instructions. Exclude the five
    question ids where ReportAttributeHeads builds its option-level heads, so the remaining heads
    keep their order and their initial weights (report on one batch that the remaining questions'
    initial logits equal the incumbent's; create nothing new, and keep the incumbent's random stream
    by drawing the removed heads' initial weights under torch.random.fork_rng or by constructing and
    discarding them as the incumbent would). Update SPATIAL_TOKEN_IDENTITY["algorithm"].
  open_choices: None.
  dependencies: []
  priority_rationale: Decides which questions later extractions need, now that a question costs ten
    minutes to extract.
