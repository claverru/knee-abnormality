  open_choices: '(i) Shared order versus per-band direction. With a single sigma shared
    across bands, all bands advance by the same step each epoch, so the bag''s stratum
    vector translates rigidly across epochs - a cross-(band, epoch) coupling that
    is not needed for the mechanism. Drawing a per-band direction from {stride, E
    - stride} (3 or 7) removes it at the cost of one extra bit per band; stride 3
    and stride 7 measure identically on every statistic reported here, so this is
    free to choose. I recommend the shared-order form for minimality and one-factor
    cleanliness, but the orchestrator may prefer per-band direction. (ii) A greedy
    circular-dispersion order was tested and rejected by measurement: same prefix
    gain (LR-weighted 3.0724) but it places adjacent strata consecutively, so its
    consecutive-repeat rate is 16.8%, worse than the incumbent. Stride 3 wins on both
    metrics and the order must not be treated as a sweepable parameter. HONEST LIMITS:
    (a) the LR-mass argument assumes gradient contribution scales with learning rate,
    which is a standard but untested proxy; (b) the mechanism cannot be probed by
    the frozen-model token cache at all, because the cache scores single bags and
    this changes nothing about any single bag - so unlike the queued arms this proposal
    has no bag-quality prior in either direction, and its effect could be zero; (c)
    the emulation uses the nearest-depth approximation on the fold-0 VALIDATION cohort,
    never the training cohort.'
