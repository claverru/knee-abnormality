- id: run-level-rotated-lattice
  mechanism_id: bag-level-lattice-rotation
  parent_idea_id: null
  title: Rotate the whole bag as one rigid equal-mass lattice, with the rotation stratified
    across the run
  opportunity: 'Measured this session on the incumbent source and the fold-0 token
    cache (scripts and numbers: /tmp/ar-research/, summary at /tmp/ar-research/summary.json).
    Two facts. (a) THE IN-FLIGHT ARM IS INERT AT THE REALIZED LEVEL. I produced the
    realized-middle-depth artifact the campaign has asked for three times: realized
    adjacent min-gap under the incumbent is p10 3.345 mm / median 7.203 mm, and under
    the rebased common-offset-lattice-jitter expression it is p10 3.348 / median 7.210
    - indistinguishable. Frozen-model bag quality at matched counts: +0.00009 (se
    0.00008, 24 paired draws over 3 seeds x 8 epochs, 3 checkpoints). The rebase moved
    the shared offset into each band''s 1/(count*E) sub-band, where it spans 1.7%
    of the unit interval, so it cannot separate targets. (b) THE COARSE COMPONENT
    CARRIES EVERYTHING. The stratum index, not the within-sub-band offset, is what
    is independent per band today, and it spans a whole band. Sharing it makes adjacent
    gaps exactly 1/count: realized min-gap p10 8.863 / median 13.395 mm, essentially
    the deterministic scored bag''s 9.007 / 13.376. Frozen-model delta +0.00211 (se
    0.00031), which is 73% of the whole incumbent-training-to-scored-bag gap (0.88524
    -> 0.88814). That gap is also a train/scored condition mismatch: the model is
    trained on clumped bags and scored on a perfect lattice.'
  mechanism: 'In the training branch, draw ONE sub-stratum index per (study, kind,
    epoch) shared by all bands instead of one per band, so percentiles = (arange(count)
    + (s + u)/E)/count with s the phase-th element of a run-level permutation of 0..E-1
    and u a single scalar. The bag becomes a rank-1 equal-mass lattice rotated by
    (s+u)/(count*E); the ten epochs'' rotations are a stratified (Latin-hypercube)
    sample of the rotation interval, so the accepted run-level coverage property is
    preserved per band. Verified by execution: band partition preserved for count
    in {2,5,6} over all ten epochs, every band still visits all ten sub-strata over
    the run, adjacent gaps exactly 1/count, band-relative position uniform (KS p 0.822),
    and the construction degenerates bit-for-bit to the incumbent at count == 1 (0.87454493
    both).'
  precedents:
  - common-offset-lattice-jitter (in flight) - its PRE-REBASE form was exactly this
    rigid rotation; the rebase preserved per-band strata instead, which I measure
    as inert
  - run-level-stratified-jitter (accepted incumbent) - supplies the sub-stratum machinery
    this shares across bands; its own composition note said it 'becomes stratification
    of a single scalar u across epochs', which is this construction
  - Cranley & Patterson 1976, randomized lattice rules; L'Ecuyer & Lemieux, randomized
    quasi-Monte Carlo - a shifted rank-1 lattice with a stratified shift is the standard
    variance-reduction form
  - 'token-cache decomposition recorded at revision 63: regularity of the realized
    set worth ~+0.009-0.013 at matched counts, density shape at most ~+0.002'
  - outputs/analysis/t/token-cache-20260917/ (frozen-model scoring path)
  novelty: 'OVERLAP DISCLOSED UP FRONT, because it is the one thing an orchestrator
    must weigh. Written as an offset decomposition this is ''a shared coarse offset
    plus a per-band fine residual'', and the revision-94 review forbade ''a residual-per-band-jitter
    variant of the shared offset'' as arm two of the in-flight head. Three reasons
    it is nevertheless a distinct measurement, not a second arm: the amplitude allocation
    is INVERTED (the in-flight arm shares the fine 1/(count*E) component and randomizes
    the coarse 1/count component per band; this shares the coarse component), the
    two factors are orthogonal in the same expression, and their measured effects
    differ by 25x (+0.00009 against +0.00227). The prohibition was written before
    that measurement existed. If the in-flight arm is accepted, this is a one-factor
    increment on the new incumbent (share the stratum too); if it is inconclusive,
    its null does not bound this, because the factor it varied is measurably inert.
    I recommend the full rigid form (shared s and shared u) precisely because it makes
    the incremental factor over the in-flight arm exactly one.'
  coverage: 'Measured identical, not argued: distinct geometry groups per slot over
    the run 26.29 (rigid) against 26.31 (incumbent) over 3 seeds x 8 epochs, and every
    band still visits all ten sub-strata over the run by construction. Band masses,
    truncation support and per-band marginals are unchanged - the per-band marginal
    is exactly Uniform on its own band, so the per-epoch MARGINAL law is bit-identical
    to the incumbent''s. No depth region loses support and peripheral bands are drawn
    exactly as often as today.'
  exploitation: 'The per-epoch bag becomes maximally separated at the same band masses:
    realized min-gap p10 3.35 -> 8.86 mm, median 7.20 -> 13.40 mm, matching the scored
    deterministic bag. Frozen-model bag quality rises 0.88524 -> 0.88734 at identical
    realized counts. It simultaneously closes 73% of the training-versus-scored regularity
    mismatch, so it is both a bag-quality and a matched-condition change in the same
    direction.'
  budget: 'Strictly cheaper than the incumbent: one permutation of length E and one
    scalar draw replace a (count, E) permuted array and `count` scalar draws - benchmarked
    12.97 us against 16.33 us per percentile construction, about -0.7 s over the ~210k
    calls in a full schedule. The vectorized truncnorm.ppf is untouched, satisfying
    the standing no-per-element-loop rule. No extra decode, no precomputation, no
    new config key expected. Counts: realized triplets were EXACTLY equal to the incumbent''s
    in my emulation (580,512 for incumbent, shared-u, shared-stratum and rigid over
    3 seeds x 8 epochs, zero shortfall), but the per-epoch JOINT law changes (bands
    become perfectly coupled), so the revision-61 invariance is not inherited and
    the training-cohort replay must establish counts.'
  implementation: 'One expression in `select_triplets` (sampling.py:481-488) plus
    the SAMPLING_IDENTITY["targets"] string: replace `rng("strata", cycle).permuted(np.tile(np.arange(E),
    (count, 1)), axis=1)[:, phase]` with a scalar `rng("strata", cycle).permuted(np.arange(E))[phase]`,
    and (for the full rigid form) `rng("targets").random(count)` with `rng("targets").random()`.
    Confined to the `if training` arm; the `else` branch literal `(np.arange(count)
    + 0.5) / count` is untouched, so the deterministic validation selection_sha256
    must reproduce 92f1341ce45b14ee27882fd20892bd416b7945d85ddcd297055441fbc1784059
    exactly - a hard, falsifiable launch check. stratification_depth stays at the
    accepted 10 and must not be swept. Required verification at replay: realized (not
    target) middle depths with the min-gap statistic against the incumbent''s p10
    3.345 / median 7.203 mm, distinct realized middles per pool over ten epochs against
    26.3, ten distinct per-epoch training hashes, and exact 938460 / 35030 / 24188.'
  open_choices: 'Full rigid (shared s and shared u, +0.00211 se 0.00031) against shared-stratum-only
    with per-band jitter retained (+0.00227 se 0.00030). They are 0.00016 apart (se
    0.00008); I recommend the full rigid form for the cleaner statement, the lower
    cost, and the one-factor relationship to the in-flight arm, but the orchestrator
    may prefer shared-stratum-only to leave the in-flight arm''s expression untouched.
    Also open: whether to demonstrate incumbent degeneration through count == 1 (verified
    bit-for-bit here) or to expose an explicit parameter. Honest limits: the +0.00211
    is frozen-model bag quality on the fold-0 VALIDATION cohort under retired sigma-40
