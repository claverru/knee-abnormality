- id: epoch-paced-bag-size
  mechanism_id: across-epoch-budget-pacing
  parent_idea_id: null
  title: Pace the per-visit bag size across the run at an unchanged run total
  opportunity: 'Every study is visited once per epoch with the same budget in all
    ten epochs, and nothing in the campaign has varied that. The contract and the
    harness constrain run totals, not per-epoch counts: `accounting.py:96-99` and
    `finish()` sum `triplets` and `visits` over the per-epoch rows, and `gates.py:101-105`
    compares those sums to the sealed 938,460 and 35,030, while only validation rows
    are checked individually (24,188 each). Per-epoch bag size is therefore an unused
    degree of freedom that is fully inside the sealed limits. The closed allocation
    investigation states the relevant asymmetry explicitly: training-time triplet
    counts do matter while test-time counts barely move a frozen model. The frozen-model
    count curve is steeply concave and then flat (mean triplets 14.5 to 0.87842, 25.4
    to 0.88727, 39.9 to 0.89057, 50.7 to 0.89073), so a plus or minus one per slot
    moves a bag between about 20 and 31 triplets, which is the steep part of that
    curve.'
  mechanism: 'Apply a per-epoch integer offset to each slot''s budget, with the offsets
    summing to zero over the run, and apply it only where the pool has the slack to
    realize it. Concretely, inside `select_triplets`, where `len(groups)` is known,
    use `budget + delta_e` when `len(groups) >= budget + max(delta)` and `budget`
    otherwise. With five epochs at -1 and five at +1 every eligible slot realizes
    exactly `10 * budget` over the run and every ineligible slot is untouched, so
    the realized run total is exactly the incumbent''s by construction. Direction:
    smaller bags early, larger bags late, so the epochs that produce the selected
    checkpoint see the denser bag and early epochs get wider, coarser bands over the
    same support.'
  precedents:
  - docs/history/triplet-budget-allocation.md
  - outputs/analysis/t/token-cache-20260917/README.md (scaled-allocation smoke table)
  - docs/validation/results/2026-09-17-test-time-allocation.md
  - 'In-Context Multiple Instance Learning (arXiv 2606.06458): three-stage bag-size
    curriculum from [2,8] to [6,20] instances, with difficulty rising in bag size'
  - Bengio et al. 2009, curriculum learning
  novelty: 'Distinct from every closed allocation result: those redistributed a fixed
    study total across the six plane-contrast types with one rule for all epochs,
    and were measured at test time on frozen models. This does not move a single triplet
    between types, studies or series; it moves exposure between epochs of the same
    slot, which is the campaign''s named evolution-across-training axis and is untouched
    by the queued cross-epoch idea (which changes which sub-band is drawn, not how
    many). It is also not a shortfall or capacity recovery: the eligibility rule makes
    it exactly count-neutral rather than count-raising.'
  coverage: Union coverage over the run is at least the incumbent's, because the late
    epochs draw strictly more bands from the same support while the early epochs keep
    full-support stratification at coarser resolution. No pool loses peripheral support,
    and capacity-limited slots are excluded from the offset by the eligibility rule,
    so nothing is starved.
  exploitation: Late epochs, which under the unchanged checkpoint-selection rule decide
    the model (the incumbent selected epoch 9, recent candidates epochs 7 and 10),
    train on denser bags whose stratification resolves finer depth structure; early
    epochs pay for it with coarser bags at a stage where, per the MIL curriculum precedent,
    large bags are the harder learning problem.
  budget: 'Run totals for triplets, visits, decodes, epochs and optimizer steps are
    unchanged, so the end-to-end resource ceiling is preserved in aggregate; cost
    simply shifts between epochs. Two things the developer must check rather than
    assume: peak activation memory in the large-bag epochs rises roughly in proportion
    to the offset (about +19% of tokens per study at plus one on every slot), so a
    smaller offset or a subset of slots may be needed; and total wall clock must be
    confirmed against the 1,785 s ceiling in the replay, since decode cost is not
    exactly linear in triplet count. Validation is untouched: the offset is gated
    on `training_seed is not None`, so all ten validation rows stay at exactly 24,188
    and the deterministic validation `selection_sha256` is expected to reproduce the
    incumbent exactly.'
  implementation: Confined to `select_triplets` in sampling.py, where the budget offset
    is applied after `groups` is computed, plus one schedule field under `data.triplet_sampling.*`
    and the `SAMPLING_IDENTITY` string. The epoch is already available as an argument.
    The CPU replay must confirm the per-epoch rows differ while the run total is exactly
    938,460 at zero tolerance, and must confirm that no slot's realized count deviates
    from `10 * budget` because of a capacity edge at `len(groups) == budget`.
  open_choices: 'Offset magnitude and which slots carry it (memory headroom decides);
    whether the schedule is a two-block step or graded over the ten epochs; whether
    eligibility uses `len(groups) >= budget + 1` or a stricter margin. Honest strike
    against the idea, stated up front: at test time the bag-quality curve is concave
    in count, so by Jensen a size-paced schedule has slightly lower average per-epoch
    bag quality than a constant schedule at the same mean. The claim is therefore
    a training-dynamics claim, not a bag-quality claim, and it is genuinely two-sided.
    The reverse direction (large early, small late) is a real alternative and must
    not be spawned as arm two of this idea.'
