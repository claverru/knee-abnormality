  opportunity: 'The training draw is `percentiles = (arange(count) + rng("targets").random(count))
    / count` (sampling.py:476-478): every band jitters independently, so adjacent
    bands routinely collide and the realized bag clumps. New measurement on the fold-0
    token cache (outputs/analysis/t/token-cache-20260917, 161,466 candidates, three
    frozen checkpoints, training-scale counts 6/6/5/5/5/5, realized mean 25.36 triplets,
    8 repetitions): the minimum gap between selected middles has p10 3.38 mm under
    independent jitter against 9.92 mm for the deterministic bag, and frozen-model
    macro AUC of the bag is 0.88494 (sd 0.00060) for the independent draw against
    0.88730 for the deterministic bag. A wider decomposition at the same counts shows
    this is the axis that matters: stratified Gaussian 0.88746, equal-spaced stratified
