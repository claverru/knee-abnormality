ideas:
- id: coronal-side-relative-draw
  mechanism_id: coronal-side-relative-distribution
  parent_idea_id: null
  title: Asymmetric coronal draw matched to acquired side extents
  opportunity: Coronal acquisition reaches about 59.0 mm anteriorly but 45.6 mm posteriorly.
    Peripheral Baker's-cyst and posterior-horn evidence motivates a distribution that
    handles the two acquired sides explicitly. Evidence is observational; neither
    a training gain nor an optimal side allocation has been established.
  mechanism: Replace the symmetric coronal truncated Gaussian with a draw whose two
    side widths are derived from each side's physical reach. Preserve the fitted physical
    centre. Make the allocation of probability across the two sides explicit so acquisition
    asymmetry does not accidentally dictate all exposure. Other planes retain the
    incumbent policy.
  precedents:
  - docs/backlog/small-changes.md#asymmetric-coronal-draw
  - docs/ongoing/peripheral-coverage.md#acquisition-geometry
  - docs/data-preparation/accurate-sampling-centers.md#cohort-wide-center-fit-and-plane-extents
  - docs/validation/results/2026-09-19-relative-sampler-width-result.md
  novelty: Existing untried proposal adopted into the triplet-sampling campaign at
    the user's request. Ownership of this experiment is now this campaign; the general-backlog
    entry remains a read-only provenance link, not a second scheduling location. Changes
    distribution shape rather than repeating a common-width sweep or the rejected
    per-type centre-offset proposal.
  coverage: Retain exposure on both acquired sides, including peripheral support;
    handle pools with missing or very short sides without inventing slices.
  exploitation: Preserve substantial central coverage while redistributing existing
    coronal draws toward underexposed acquired regions.
  budget: Change selected triplet locations only. Preserve the realized training average
    and validation total, validation x1, all ten epochs and optimizer steps, fold
    0, and the sealed 115% runtime ceiling. No extra decoding pass, model, triplet
    budget, or persistent precomputation.
  implementation: Work in the existing physical-pool depth draw and sampler helpers.
    Keep stochastic training and deterministic validation independent of training
    seed. Inspect anterior/posterior coordinate signs and discrete matching before
    asserting which side gains exposure.
  open_choices: Choose one defensible side-mass normalization and treatment of degenerate
    pools, explaining the expected coverage effect. No parameter sweep. Compare using
    the campaign paired bootstrap; the old backlog's 0.008 heuristic is superseded
    by the sealed campaign acceptance rule.
  dependencies: []
  priority_rationale: 'Recommend first: directly addresses an observed acquisition
    asymmetry with a new distribution shape, low implementation cost and no new data.'
  status: completed
  created_revision: 10
