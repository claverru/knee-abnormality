- id: cross-slot-band-interleaving
  mechanism_id: within-plane-depth-decorrelation
  parent_idea_id: null
  title: Interleave the depth lattice of a plane's two contrast slots
  opportunity: 'The two contrast slots of a plane (T1/PD and fluid-sensitive) are
    sampled by independent `select_triplets` calls that share the same study centre,
    nearly the same union support and the same equal-mass band structure, so they
    land on the same depths. Measured on the fold-0 token cache (`outputs/analysis/t/token-cache-20260917/`,
    deterministic x1 selection at training budgets 6/6/5/5/5/5): the share of one
    slot''s selected middles lying within 5 mm of a middle selected in the partner
    slot is axial 0.913 (179 studies), coronal 0.951 (674), sagittal 0.968 (803),
    with a median nearest cross-slot distance of 0.00 mm. No series is shared between
    the two slots (checked: 0 of 1,656 plane instances), so this is genuine co-prescribed
    geometry being sampled twice, not a bookkeeping artifact. A plane therefore contributes
    ~5-6 distinct anatomical depths to a study''s bag instead of ~10-12. Under training
    jitter the same statistic is 0.581/0.561/0.556, so the effect is strongest in
    exactly the deterministic bag that is scored.'
  mechanism: Treat a plane's two contrast slots as one jointly stratified design instead
    of two independent ones. When both slots of a plane have sources, split a 2n-band
    equal-mass lattice between them (one slot takes the odd bands, the other the even
    bands) rather than giving each slot its own n-band lattice. Each slot keeps its
    own pool, its own support, its own sigma and its own budget n; only which sub-bands
    it draws from changes. The plane's aggregate marginal density over depth is unchanged,
    and single-slot planes keep the incumbent lattice exactly. Slot roles are fixed
    by config order, never by seed.
  precedents:
  - docs/data-preparation/physical-sampling/implemented-sampler.md
  - docs/data-preparation/physical-sampling/sampling-analysis-coverage-and-exposure.md
  - docs/history/triplet-budget-allocation.md
  - docs/validation/results/2026-09-17-type-contribution.md
  novelty: 'Every prior and queued sampling change acts inside one pool: widths (`sampling_sigma_fraction`
    sweeps), per-side widths (`coronal-side-relative-draw`), per-plane widths (`geometry-informed-plane-widths`),
    centres, or budgets. Nothing in the repository couples two pools. It is not an
    allocation change, so the closed budget-allocation investigation''s negatives
    (budgets A/B, missing-type fill, repeated-series share, random per-type allocation)
    do not apply: every slot keeps its exact count. It is not a distribution-shape
    change either, so it does not collide with the two queued shape ideas.'
  coverage: Doubles the distinct depths a plane contributes to a study bag where both
    contrasts exist (about 75% of studies coronal, 89% sagittal, 20% axial on fold
    0), at unchanged counts. Planes with one contrast slot, local (non-physical) pools
    and capacity-limited pools keep the incumbent behaviour, so no pool loses peripheral
    or central support.
  exploitation: The aggregate per-plane density over depth is the incumbent truncated
    Gaussian, so central mass and the measured centre-favouring utility on axial and
    coronal are preserved. Only the assignment of that mass between the two contrast
    slots changes; each slot still spans the full support.
  budget: 'Pure retargeting: identical per-slot budgets, identical realized selections
    per pool, no extra decoding, no auxiliary pass, no persistent precomputation.
    Training triplets 938,460, visits 35,030, validation 24,188 per pass, 10 epochs,
    4,380 steps, fold 0, x1 all unchanged. Runtime cost is a lattice offset computation
    per pool.'
  implementation: Work in `select_triplets` (sampling.py:433-479) where the percentile
    lattice is built, plus a partner-presence flag from `dataset.py` (`_slot_sources`
    is already computed for all slots before the per-slot loop, so partner presence
    is known and deterministic). Either split a 2n-band lattice by parity in quantile
    space, or offset the second slot by half a band; prefer the parity split, since
    the two supports are near-identical in practice and it degrades gracefully when
    they are not. Keep the training jitter inside each slot's own sub-bands so stochastic
    variation survives.
  open_choices: 'Which slot takes which parity (fix by config order, record it); behaviour
    when the partner slot exists but its pool is empty, local, or capacity-limited;
    whether to interleave in quantile space or in depth space. Deterministic validation
    selection changes, so its new `selection_sha256` must be recorded explicitly and
    be stable across all ten validation rows. Honest counter-hypothesis to state up
    front: co-located T1/PD and fluid triplets may be complementary rather than redundant,
    since radiologists read the same slice across sequences; the model has no cross-contrast
    registration to exploit it, but the sign of this change is genuinely uncertain.'
  dependencies: []
  priority_rationale: Recommend first. It is the largest measured weakness I found
    (0.91-0.97 duplication in the scored deterministic bag), it is cheap and exactly
    count-preserving, and it occupies a mechanism family with no queue representation.
    Its sign is less certain than idea `run-level-stratified-jitter`, which is why
    an orchestrator preferring the cleanest contract profile could reasonably swap
    the two.
