- id: geometry-informed-plane-widths
  mechanism_id: plane-specific-sampling-shape
  parent_idea_id: null
  title: Geometry-informed per-plane sampling widths
  opportunity: A common width fraction cannot isolate opposing plane-specific exposure
    needs. Cache-only results favored a narrower coronal draw, but did not establish
    a training effect; previous common-factor sweeps do not settle relative widths
    across planes.
  mechanism: Adopt a single geometry- and evidence-informed policy for relative plane
    widths, rather than tying every plane to the same reach fraction. Select and justify
    one policy from the existing acquisition evidence; do not enumerate axial/coronal
    multipliers as a hyperparameter search.
  precedents:
  - docs/backlog/small-changes.md#per-plane-width-ratios
  - docs/ongoing/peripheral-coverage.md#what-is-settled-and-what-is-not
  - docs/validation/results/2026-09-18-per-plane-sigma-cache.md
  - docs/validation/results/2026-09-19-relative-sampler-width-result.md#training-versus-drawing
  - docs/validation/results/2026-09-19-fold-ensembles-and-sigma-sweep.md
  novelty: Existing untried proposal adopted by this campaign, with its original general-backlog
    entry retained as read-only provenance. Relative plane shape is distinct from
    the trained common-factor sigma sweep. The campaign owns its execution; do not
    launch duplicate general-backlog arms.
  coverage: Keep all existing plane/type pools and their valid triplet counts. Retain
    peripheral support rather than collapsing a plane onto the centre.
  exploitation: Match the concentration of each plane's existing draws to its acquisition
    geometry and evidence, retaining central anatomical exposure.
  budget: No triplet, plane-budget or visit increases. Preserve realized training
    average, validation total and x1, fold 0, epochs, optimizer steps and the fixed
    115% runtime ceiling. Use existing pool geometry.
  implementation: Limit changes to the physical sampling policy and necessary sampler
    configuration. Use the current 0.867 recipe as the incumbent reference, not the
    superseded 0.76 prose. Train stochastically with a fresh recorded seed and retain
    seed-independent deterministic validation.
  open_choices: Decide whether the available geometry justifies a useful policy beyond
    arbitrary multipliers. Park the idea if it reduces to a scalar sweep. Use campaign
    bootstrap acceptance, not the old backlog's 0.008 heuristic. Reconcile with the
    coronal-shape result before combining their effects.
  dependencies: []
  priority_rationale: 'Recommend second: it is already motivated and cheap, but its
