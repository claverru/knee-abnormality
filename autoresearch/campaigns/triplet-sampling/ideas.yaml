  mechanism: 'Replace the per-band uniform random permutation of sub-strata with a
    randomly rotated fixed low-discrepancy visitation order: stratum_i(e) = (r_i +
    sigma(e)) mod E, with r_i an independent uniform integer per band and sigma the
    stride-3 cycle (0, 3, 6, 9, 2, 5, 8, 1, 4, 7) for E = 10. Because r_i is uniform
    and independent per band, the per-epoch law is untouched; because sigma is a permutation,
    each band still visits all ten sub-strata exactly once over the run; because sigma
    advances by 3 sub-strata each epoch, no prefix of the run is clumped and no two
    consecutive epochs sit adjacent. Measured against the incumbent, by emulation
    on real pool geometry: distinct-after-k becomes [1.000, 1.953, 2.894, 3.402, 3.826,
    4.246, 4.666, 4.888, 5.110, 5.332], LR-weighted mean 3.0765 against 2.9219 (+5.3%),
    consecutive-epoch same-group rate 4.75% against 15.66% (3.3x lower), full-run
    distinct per band 5.332 against 5.332 and distinct groups per slot over the run
    26.98 against 26.99 (identical, as designed).'
