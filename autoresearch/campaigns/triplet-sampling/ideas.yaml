- id: entitlement-balanced-supplier-draw
  mechanism_id: training-supplier-allocation
  parent_idea_id: null
  title: Give training the balanced supplier allocation validation already uses
  opportunity: 'Training picks each band''s supplying series uniformly at random among
    eligible sources (`choices[int(supplier_rng.integers(len(choices)))]`, sampling.py:495-497)
    while validation allocates each target''s exact fractional entitlement to the
    largest outstanding deficit, tie-broken by the pool''s quality ranking (sampling.py:497-498).
    The uniform draw matches the entitlement only in expectation: within an epoch
    a pool''s whole budget can land on one series, including a superseded retake,
    a reformat, or a poorly-cropped source that the ranking exists to demote. This
    affects 660 of 4,368 fold-0 pools (15.1%) holding 45,523 of 161,466 candidates
    (28.2%), consistent with the documented 661 repeated-type slots. The relative-width
    decomposition measured that a model prefers the sampler it was trained under by
    about 0.0006, so a train/validation supplier-policy mismatch is not free.'
  mechanism: 'Replace the per-band uniform supplier draw with a randomized balanced
    allocation: systematic sampling of the accumulated fractional entitlements with
    a random start, or an equivalent without-replacement scheme, so every training
    epoch reproduces the deterministic validation supplier shares exactly while remaining
    stochastic in which band each source supplies. Optionally weight the residual
    choice by the existing `source_ranking` order so ties favour originals and newer
    retakes, as validation already does.'
  precedents:
  - docs/backlog/small-changes.md#superseded-same-protocol-retakes
  - docs/history/triplet-budget-allocation.md
  - docs/data-preparation/physical-sampling/evaluation-tie-break-investigation.md
  - docs/data-preparation/physical-sampling/sampling-analysis-coverage-and-exposure.md
  - docs/validation/results/2026-09-19-relative-sampler-width-result.md
  novelty: This supplies the design that the closed budget-allocation investigation
    explicitly left open ("whether splitting a slot's own budget more evenly between
    its own series helps... Untested, no design yet"). It is not the rejected `repeated_series_share`,
    which moved budget between types according to source count; here every slot keeps
    its exact budget and only the within-slot supplier lottery changes. It is a softer
    form of the untried superseded-retake drop, which stays read-only provenance.
  coverage: Depth targets, widths and counts are untouched, so anatomical coverage
    is identical by construction. Single-source pools (84.9%) are unaffected. Degenerate
    cases (a band with one eligible source) reduce to the incumbent behaviour.
  exploitation: Removes the epochs in which a repeated slot spends its whole budget
    on the weaker of its sources, and aligns the training supplier distribution with
    the scored one.
  budget: 'No count, decoding, or runtime change: the same number of triplets is drawn,
    only the supplier lottery differs. All sealed limits preserved. Deterministic
    validation selection should be untouched, so the incumbent `selection_sha256`
    is expected to hold - verify.'
  implementation: Confined to the supplier loop in `select_triplets` (sampling.py:481-500),
    which already computes `entitlement` as exact Fractions for the validation path
    and currently discards it in training. The band order stream (`rng("band_order")`)
    is effectively inert in training today and can carry the randomized start.
  open_choices: 'Systematic sampling versus a randomized largest-remainder scheme;
    whether to add explicit quality weighting on top of balance, or keep balance alone
    so the arm isolates one factor (recommended: balance alone first). Honest sizing:
    the older prototype comparison measured the training supplier-share deviation
    at 4.53 percentage points against 3.30 in validation under a different sampler,
    so the correction is real but small, and only 15% of pools can move at all.'
  dependencies: []
  priority_rationale: Recommend fourth. It is the cheapest to implement, it closes
    a question the closed investigation left explicitly open, and it is the only proposal
    touching source selection rather than geometry - but its reach (15% of pools)
    and the previously measured share deviation both point to a small effect.
