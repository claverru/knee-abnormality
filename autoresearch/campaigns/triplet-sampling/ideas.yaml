- id: physical-span-standardized-triplets
  mechanism_id: through-plane-triplet-composition
  parent_idea_id: null
  title: Standardize each triplet's through-plane span instead of its slice stride
  opportunity: 'A triplet is always three consecutive slices (`build_pool`, sampling.py:273-284),
    so its physical through-plane extent is dictated by each series'' spacing. Measured
    per pool on the fold-0 token cache: median candidate gap 3.32 mm (p1 0.03, p5
    0.61, p95 5.07), giving triplet spans from 0.06 mm to about 18 mm - a spread of
    two orders of magnitude. 6.0% of pools (261 of 4,368) have median spacing below
    1 mm, i.e. their triplets feed the backbone three near-identical channels and
    waste two thirds of each token''s input. In-plane geometry is already standardized
    to 0.625 mm and 224 px; through-plane geometry is not standardized at all, so
    what a triplet means varies per acquisition.'
  mechanism: 'Choose the channel offsets so each triplet spans a fixed physical thickness:
    stride k = round(target_half_span / spacing), clamped to k >= 1 and to what the
    run length allows, with the middle slice unchanged. Anchor the target span to
    the cohort''s current median realized span (measured 7.11 mm), exactly as `sigma_fraction:
    0.867` was anchored to preserve the previous mean width, so the change is a standardization
    rather than a tunable. Most pools keep k = 1; the dense minority gains genuine
    through-plane context at the same channel count.'
  precedents:
  - docs/data-preparation/physical-sampling/implemented-sampler.md
  - docs/backlog/small-changes.md#augmentation-families
  - docs/research/input-resolution.md
  - docs/data-preparation/current-preparation.md
  novelty: Every prior and queued experiment varies where triplets are placed; none
    varies what a triplet is. The closest repository precedent is the untried augmentation
    proposal to degrade through-plane resolution by physical spacing rather than slice
    index, which shares the premise but is an augmentation family, not a selection
    rule. This is the in-plane resampling argument applied to the third axis.
  coverage: 'Candidate windows per run fall from L-2 to L-2k, so per-pool capacity
    must be protected: the rule must reduce k until min(budget, groups_k) equals min(budget,
    groups_1), which is always satisfiable at k = 1. Mean capacity is 36.3 against
    budget 5-6, so this binds only on short runs. Peripheral reach is unaffected since
    only the middle slice sets the depth.'
  exploitation: Depth targets, widths, budgets and supplier rules are untouched, so
    the selected locations are the incumbent's; only the channel content at each location
    becomes comparable across acquisitions.
  budget: Still three decoded slices per triplet and the same triplet count, so the
    forward workload is identical. Selected triplets currently share almost no slices
    (measured 0.12% redundant channel appearances), so unique-decode counts barely
    move; this must be confirmed in the CPU replay because decoding is the runtime-sensitive
    part.
  implementation: Candidate construction in build_pool (sampling.py:273-284) and support
    definition (sampling.py:266-272). The user-authorized scope amendment on 2026-09-20
    permits prepare_series to validate nonconsecutive triplets; preparation.py is
    now in both the campaign definition and saved policy. Limit that change to the
    consecutiveness check and immediately necessary callers within the editable source.
    Preserve three distinct slices, distinct middles, original acquisition indices,
    geometry checks, decoding, augmentation and accounting. Inspect the p1 0.03 mm
    position cases before treating them as recoverable dense acquisitions, confirm
    unique-decode counts and exact realized triplet counts under the measured process
    budget, and record the changed deterministic validation identity. The scope amendment
    does not approve an implementation or training launch; normal development, gates
    and orchestrator review remain required.
  open_choices: Whether the anchor is the cohort median span or each plane's own median;
    how k is clamped on short runs and on pools whose positions are degenerate (the
    p1 0.03 mm cases may be broken position fields rather than fine acquisitions -
    inspect before assuming they are recoverable); whether the stride is fixed or
    jittered in training (jitter would add through-plane scale diversity but would
    break the matched-condition property and is not recommended for a first arm).
    Deterministic validation selection changes; record the new identity.
  dependencies: []
  priority_rationale: Recommend third. The mechanism is the most original of the four
    and the heterogeneity it removes is large, but its reach is the 6-9% of pools
    whose spacing is far from the median, and it is the only proposal that needs an
    edit-scope decision before a developer can start.
