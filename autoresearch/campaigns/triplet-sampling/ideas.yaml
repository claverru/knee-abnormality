    Approval basis (independent verification, not the author''s assertion):

    - Scope: diff -rq against parent_source shows only src/knee_abnormality/data/preprocessing/sampling.py
    differs. No config/CLI keys added; configs/training.yaml untouched (seed 2583306572
    present, supervisor still draws a fresh seed at launch). One inert artifact: an
    empty src/knee_abnormality/data/triplet_sampling/ directory with no files, not
    imported and not in identity.py PREPROCESSING_SOURCES, so it cannot affect behavior
    or sources_sha256. Recommend deleting it before launch as cleanliness only.

    - Math, executed against the candidate module with PYTHONPATH pinned to the candidate
    source: total mass over (-1e7,1e7) = 0.9999999999999997; negative-side mass 0.5644983461962510
    vs analytic sigma_lo/(sigma_lo+sigma_hi) 0.5644983461962514; straddling interval
    log-mass equals logsumexp of its two halves (0.4182570107700266 vs 0.4182570107700265);
    split_normal_ppf is monotone, stays inside [lo,hi], and inverts its own truncated
    CDF exactly (f=0.1/0.5/0.9 -> cdf 0.100000/0.500000/0.900000); with sigma_lo==sigma_hi
    it matches sigma*truncnorm.ppf to 1e-9, i.e. it degenerates to the incumbent.
    One-sided intervals route to the single-piece branches correctly, and the union_support
    floor max(reach,1.0) mirrors limiting_reach, so degenerate pools cannot produce
    a non-finite or non-positive sigma (the guard was extended to check both tuple
    entries).

    - Coverage/exploitation: for the representative coronal pool (support -59.0/+45.6
    mm, fraction 0.867) posterior target mass moves 0.465 -> 0.436 and anterior sigma
    widens 39.5 -> 51.2 mm. Both acquired sides retain substantial mass and central
    coverage is preserved; peripheral posterior support is retained but modestly reduced.
    The side-mass choice (mass proportional to each side''s reach, the continuity-preserving
    two-piece normal) is one explicit stated normalization, matching the idea title,
    with no second arm and no sweep. Caveat to carry into interpretation: the implementation
    shifts mass slightly away from the posterior side that the Baker''s-cyst/posterior-horn
    observation motivated, so a null or negative result does not by itself refute
    asymmetric coronal draws.

    - Count accounting: study_budgets, geometry_groups, largest_remainder and the
    linear_sum_assignment supplier/assignment logic are byte-identical to parent_source.
    The change is confined to target_depths and the sigma computation, which relocate
    targets within already-existing discrete candidate slices; count = min(budget,
    len(groups)) is therefore structurally invariant, consistent with the exact 220-triplet/8-visit
    match on the developer''s subset.

    - Validation independence and identity: sigma derives solely from pool geometry
    (union_support), never from the training seed or any RNG, and the validation percentile
    path is unchanged, so deterministic validation remains seed-independent. Deterministic
    selection does change relative to the incumbent (expected and permitted); the
    developer recorded the new identity on the subset (candidate 67fab5..., baseline
    905de0...). Training selection remains stochastic across epochs.

    - Leakage: no label, fold, cohort, grouping, scoring or checkpoint-selection code
    touched; no validation-derived feedback; no persistent precomputation or extra
    decode pass.

    - Added cost measured, not assumed: split_normal_ppf replaces one vectorized truncnorm.ppf
    with a per-element loop. Benchmark on this machine gives ~0.081 ms per scalar
    call vs ~0.0034 ms per element vectorized. Coronal is ~31% of the 938,460 training
    triplets (max_images 15+15 of 96), i.e. ~290k extra scalar calls, ~22 s CPU in
    total, ~1-2 s wall across 16 dataloader workers. That sits well inside the 233
    s headroom between the 1,551.5 s historical control and the 1,785 s ceiling, so
    this does not warrant the one allowed repair. Vectorizing the two branches with
    boolean masks would remove the margin question and can be folded in opportunistically,
    but is not required for approval.


    Launch conditions the supervisor must honor (limits unchanged; I am not relaxing
    anything):

    1. Run the one-time full-schedule accounting.calibrate() CPU replay against this
    candidate source before the GPU run and confirm training_triplets 938460, training_visits
    35030, validation_triplets 24188 per pass at zero tolerance, plus the coronal
    per-side widths taking effect and the realized depth distribution. The developer''s
    1-core sandbox could not run this and said so rather than claiming it; per runtime.md
    it is the supervisor''s step and gates.py hard-fails at launch on any deviation.

    2. Comparison requires --allowed-input-identity-differences preprocessing_identity,
    because SAMPLING_IDENTITY["targets"] was intentionally updated to record the coronal
    split-normal algorithm (sampling.py is in PREPROCESSING_SOURCES, so the source
    hash also changes).

    3. Draw and record a fresh seed at launch; record the deterministic validation
    selection_sha256 as the candidate''s new validation identity, stable across all
    ten validation rows.

    4. Reference incumbent is historical-control, run overnight-20260919T120130Z-i2oqlnls/runs/00-control,
    predictions sha256 6f8f0ef5..., evaluated with the sealed 2,000-draw paired group
    bootstrap at resampling seed 20260914.


    Queue depth is 2, below the refill threshold of 4, so a researcher refill toward
    5 should run concurrently with the detached training. Refill must deduplicate
    against mechanism_ids coronal-side-relative-distribution and plane-specific-sampling-shape
