- id: run-level-stratified-jitter
  mechanism_id: cross-epoch-stratification
  parent_idea_id: null
  title: Stratify the training draw across epochs, not only within an epoch
  opportunity: '`percentiles = (arange(count) + rng.random(count)) / count` (sampling.py:476-479)
    stratifies within an epoch but draws each epoch independently, so over the ten-epoch
    run a pool''s sub-bands are visited with binomial noise: some candidate middles
    are visited three times and others never. Mean pool capacity is 36.3 distinct
    middles against a budget of 5-6, so a run touches only part of each stack. Simulated
    on 700 fold-0 pools using the sealed `interval_log_mass`/truncnorm target code
    at fraction 0.867 (nearest-depth approximation of the assignment, 40 repetitions):
    distinct middles visited over ten epochs rise from 24.29 to 27.87 (+3.58, +14.7%)
    when each band''s ten epoch draws are a random permutation of ten sub-strata instead
    of ten independent uniforms. This is consistent with the documented 14-31% of
    a series'' slices never being sampled.'
  mechanism: 'Replace the per-epoch independent jitter with a run-level stratified
    design: for each (study, kind, band), draw one permutation of E sub-strata from
    an epoch-independent stream and let epoch e use sub-stratum perm[e], jittered
    inside it. The per-epoch marginal within each band stays exactly uniform, so the
    marginal training distribution is bit-for-bit the incumbent one; only the coupling
    between epochs changes, converting sampling-with-replacement across the run into
    sampling-without-replacement.'
  precedents:
  - docs/data-preparation/physical-sampling/implemented-sampler.md
  - docs/ongoing/peripheral-coverage.md
  - docs/data-preparation/physical-sampling/sampling-analysis-coverage-and-exposure.md
  - docs/validation/results/2026-09-19-relative-sampler-width-result.md
  novelty: 'The campaign names evolution across training as an axis and nothing in
    the repository touches it: the epoch enters the sampler only as a seed ingredient
    in `operation_seed` (sampling.py:65-69). Every prior sampler experiment changed
    the marginal distribution (width, centre, budget); this one leaves the marginal
    exactly unchanged and changes only its temporal correlation. Standard randomized-QMC/Latin-hypercube
    variance reduction, never applied here.'
  coverage: Strictly increases distinct anatomy seen per pool over the run at identical
    counts, including in the tails, because low-mass sub-bands stop being missed by
    chance. No region loses support.
  exploitation: Per-epoch band masses are untouched, so every epoch's bag has the
    same central concentration as the incumbent; the extra coverage is bought purely
    from the wasted duplicate visits.
  budget: 'No extra decoding, no auxiliary computation beyond one permutation per
    (study, kind, band) per run, no persistent artifacts. Counts, visits, epochs,
    optimizer steps and validation are unchanged. Deterministic validation is not
    touched at all: it uses midpoints with no jitter and no epoch dependence, so the
    incumbent `selection_sha256` should be reproduced exactly - the cleanest possible
    contract profile for a candidate.'
  implementation: Localized to the percentile construction in `select_triplets` (sampling.py:469-479)
    plus one epoch-independent RNG stream (`operation_seed` with a distinct operation
    name and a fixed epoch argument, indexed by the real epoch). The stratification
    depth E must be available to the dataset; add it under `data.triplet_sampling.*`
    (the gate's allowed namespace) rather than reaching into `trainer.max_epochs`.
  open_choices: 'Stratification depth E and its relation to the ten-epoch schedule;
    wrap-around behaviour if an epoch index exceeds E (a second permutation, so a
    resumed run stays reproducible); whether the permutation is shared across bands
    or drawn per band. Verify in the CPU replay that `changed_training_studies` stays
    non-empty (it must: the draw is still random) and that the validation selection
    hash is unchanged. Caveat on the motivating number: it comes from a nearest-depth
    approximation on the validation-cohort token cache, not from the real supplier-preferring
    assignment, so the realized gain should be re-measured in the replay.'
  dependencies: []
  priority_rationale: 'Recommend second, and the safest candidate in the refill: unchanged
    marginal distribution, unchanged validation identity, measured coverage gain,
    near-zero implementation risk. Its expected effect is smaller than `cross-slot-band-interleaving`
    because it changes the sequence of bags rather than the content of each bag.'
