- id: run-level-balanced-supplier-cycling
  mechanism_id: cross-epoch-supplier-balance
  parent_idea_id: null
  title: Balance each band's source choice across the run, the last iid choice the
    sampler still makes
  opportunity: 'After the accepted depth stratification, exactly one selection choice
    in the sampler is still drawn independently every epoch with no run-level balance:
    which series supplies a band. Source-verified at sampling.py:493-510, training
    uses `choices[supplier_rng.integers(len(choices))]` per band per epoch. Measured
    on the fold-0 cache (/tmp/ar2/supp.py): 660 of 4,368 slots hold more than one
    source (15.1%), covering 45,523 of 161,466 candidates (28.2%); the distribution
    is 3,708 single-source, 630 two-source, 28 three-source, 2 four-source; and within
    multi-source pools a mean 87.9% of the support (median 99.5%) has at least two
    eligible suppliers, so most bands really do face a lottery. Under an iid uniform
    draw with two eligible sources, 10.9% of (band, run) pairs come out at an 8:2
    split or worse and 0.2% at 10:0 - that band''s depth is then shown to the model
    through one acquisition only, for the entire run, purely by chance. The launched
    entitlement arm does not fix this: it balances suppliers ACROSS BANDS WITHIN an
    epoch, leaving each individual band''s source still effectively iid across epochs.'
  mechanism: 'Give each (study, kind, band) a run-level balanced supplier schedule
    instead of an iid draw: build the balanced multiset `np.arange(E) % m` over the
    m eligible sources, apply a random permutation of the m sources (so no source
    is systematically the one receiving the extra visit when m does not divide E)
    and a random permutation of the E positions, then take position `phase`. Over
    the ten epochs each eligible source supplies the band floor(E/m) or ceil(E/m)
    times exactly; within any single epoch the source is uniform over the eligible
    set, exactly as today. This is the accepted cross-epoch without-replacement principle
    transplanted from the depth sub-strata to the source axis - the same construction,
    on the one dimension it was never applied to.'
  precedents:
  - run-level-stratified-jitter (accepted) - supplies the cycle/phase idiom and the
    epoch-independent `rng(operation, cycle)` stream pattern that this reuses verbatim
  - entitlement-balanced-supplier-draw (launched, revision 121) - the within-epoch
    balance on the same axis; this is the orthogonal cross-epoch factor and composes
    with it rather than replacing it
  - Survey-methodology rotation designs and systematic sampling with balanced replacement,
    where a unit's panel membership is scheduled rather than redrawn
  - revision-121 finding 1 (the supplier cardinality argument) and revision-63 finding
    on source-explained variance (median 0.051 within multi-source pools)
  novelty: 'The campaign''s supplier work is entirely within-epoch: uniform random
    (incumbent) versus entitlement-balanced across bands (launched). No idea has touched
    the cross-epoch structure of the source choice. It is explicitly NOT the forbidden
    quality-weighted variant - no source_ranking weighting is introduced beyond the
    tie-break that already exists - and it is not a dose or ordering variant of the
    launched arm, which leaves each band''s per-epoch source free. Dedup: distinct
    mechanism_id from training-supplier-allocation and from cross-epoch-stratification,
    and it is the only remaining unstratified iid choice once jitter (measured inert)
    and band order (measured order-invariant in realized shares) are set aside.'
  coverage: 'Anatomical coverage is untouched by construction: targets, band masses,
    supports, geometry groups and `count` are bit-identical, since only `preferred`
    changes. Single-source pools (84.9% of slots) are bit-identical to the incumbent
    - that is also the degeneration identity, checkable by execution at m = 1. Within
    multi-source pools the change is strictly toward more coverage of the acquisition
    axis: every band sees every eligible acquisition over the run instead of 10.9%
    of bands seeing one of them at most twice.'
  exploitation: Each depth band still receives the same number of triplets in every
    epoch; what changes is that its repeated visits across the run are spread over
    the available acquisitions rather than concentrated on one by chance. In a cohort
    where a retake or a second contrast-matched acquisition exists precisely because
    the first was ambiguous, that is the exploitation argument for balance rather
    than lottery.
  budget: 'Zero to negative added cost: one permutation of length E and one of length
    m (m <= 4, E = 10) replace one integers() draw, inside the same per-band loop
    that already runs; no extra decode, no precomputation, no memory change, no new
    config key expected. COUNTS: this inherits the strongest count argument in the
    campaign, unchanged. Per revision-121 finding 1, `preferred` enters the cost matrix
    only additively as `(value.uid != preferred[row]) * change_cost`, while membership
    of `alternatives` depends solely on `low <= target <= high` over each group''s
    values - a function of targets and groups alone - and missing_cost strictly exceeds
    the maximum full-cardinality cost, so the assignment''s cardinality is fixed by
    the sparsity pattern. Targets are untouched here, so realized triplets per (study,
    kind, epoch) must equal the incumbent''s exactly; a deviation at replay is a hard
    failure, not noise.'
  implementation: 'Confined to the supplier loop in select_triplets (sampling.py:493-512)
    plus the SAMPLING_IDENTITY["suppliers"] string. Because the existing loop keys
    the draw on nothing but `row`, the schedule must be keyed per band: `rng("supplier_cycle",
    cycle)` with `cycle, phase = divmod(epoch, stratification_depth)` reusing the
    accepted epoch-independent stream pattern, and the band index folded into the
    operation payload or drawn as a (count, E) schedule in one call, matching the
    incumbent''s own vectorized style. The training branch only; the deterministic
    `max(choices, key=entitlement - assigned)` branch stays untouched, so selection_sha256
    92f1341ce45b14ee27882fd20892bd416b7945d85ddcd297055441fbc1784059 must reproduce
    bit-for-bit on all ten validation rows while the ten training hashes stay distinct.
    Required verification at replay, and it is cheap because targets are unchanged:
    realized per-(band, run) source counts on the 660 multi-source pools against the
    exact balanced schedule, plus the share of bands at an 8:2-or-worse split (incumbent
    10.9%, candidate 0% for m = 2), and exact 938460 / 35030 / 24188.'
  open_choices: '(i) THE PARENT MATTERS AND THE ORCHESTRATOR MUST RULE. On the current
    incumbent the training supplier is a free per-band draw and the construction above
    is exact. If entitlement-balanced-supplier-draw is accepted first, the per-band
    source is no longer a free draw but the output of a greedy over fractional deficits,
    and this mechanism must be re-expressed - most naturally as a run-level balanced
    schedule over the BAND VISITATION ORDER (`rng("band_order")`), which is what drives
    the greedy''s tie-breaking, or as run-level balanced starting deficits. I recommend
    building it on the incumbent expression and treating the launched arm''s outcome
    as a rebase trigger, exactly as common-offset-lattice-jitter was rebased at revision
    79. (ii) Whether m > 2 pools (30 of 660) use the same balanced multiset or fall
    back to the incumbent draw; I recommend the same construction, since the source
    permutation already removes the residual bias. HONEST LIMITS: reach is the binding
    constraint - 15.1% of slots, and source series explain a median 0.051 of within-pool
    contribution variance - so the predicted effect is well under the ~0.0037 interval
    half-width and a null would bound cross-epoch source balance on this cohort rather
    than source selection in general. An additional caveat I measured this session
    and could not resolve: the model''s position_1d input is keyed to each SERIES''
    own slab midpoint, not to the study reference the sampler uses, and in multi-source
    pools the two frames disagree by a median 0.00 mm but a p90 of 15.8 mm - so switching
    supplier across epochs at a fixed study-frame depth can move the encoded position
    materially. That is an argument for balance being a real intervention, but it
    also means part of any effect would be encoding consistency rather than image
    content.'
  dependencies: []
  priority_rationale: 'Recommend SECOND, and honestly below the first. Its value is
    invariant strength and completeness rather than expected magnitude: it closes
    the last unstratified iid choice in the sampler, it holds targets, counts, coverage
    and validation identity fixed by construction, it inherits the campaign''s only
    structural (not empirical) count-preservation argument, its degeneration is bit-exact
    on 84.9% of slots, and its mechanism evidence is the cheapest read-back any candidate
    has required. Against that, reach is 15.1% of slots on an axis measured to explain
    0.051 of within-pool variance, so the predicted effect is small; and it carries
    a real rebase dependency on the launched supplier arm''s outcome. I am proposing
    it in full awareness that a smaller, cleanly interpretable arm is worth more to
    this campaign than a speculative one, but the orchestrator may reasonably rank
    it behind the existing queue tail on reach grounds.'
