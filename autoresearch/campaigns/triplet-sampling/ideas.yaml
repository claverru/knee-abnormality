- id: plane-coupled-depth-targets
  mechanism_id: cross-slot-depth-coupling
  parent_idea_id: null
  title: Couple a plane's two contrast slots onto the same depth targets, as the scored
    bag already is
  opportunity: 'The scored deterministic bag pairs the two contrast slots of a plane
    almost perfectly, and the training bag does not - a train/scored structural mismatch
    nobody has named. Re-measured on the incumbent source this session: share of one
    slot''s REALIZED middles within 5 mm of a partner-slot middle is 0.926 axial /
    0.952 coronal / 0.943 sagittal deterministically (median nearest partner distance
    1.04 / 0.62 / 0.76 mm), against 0.602 / 0.566 / 0.576 in training (median 4.55
    / 4.73 / 4.76 mm). The training figure is an accident of two independent RNG streams,
    not a design choice. The campaign has already spent a full budget moving this
    axis DOWN (cross-slot-band-interleaving, delta -0.0017, inconclusive) and its
    completion recorded that the complementarity reading - a registered cross-contrast
    pair at the same depth is information the model uses - is now the reading the
    data favour. Moving UP is the untested direction and it is the one that matches
    the scored condition. Reach is wide: 903 of 904 studies have at least one paired
    plane, and 72.1% of per-epoch triplets sit in a slot whose plane partner is present.'
  mechanism: 'Key the depth-target RNG streams on the plane alone instead of the full
    (plane, fluid_sensitive, fat_suppression) tuple, so a plane''s two slots draw
    the same stratum schedule and the same jitter and therefore aim at the same percentiles;
    each slot still snaps to its OWN candidate geometry through its own geometry_groups
    and linear_sum_assignment, so the realized pair is co-located only where both
    acquisitions actually have a slice there. Verified by emulation with only the
    two depth streams shared and the supplier and band-order streams left independent:
    training co-location rises to 0.913 / 0.957 / 0.950 with median nearest partner
    distance 1.19 / 0.58 / 0.69 mm, i.e. the training bag reproduces the scored bag''s
    pairing structure.'
  precedents:
  - cross-slot-band-interleaving (completed, inconclusive, delta -0.0017) - the same
    axis driven in the opposite direction; its completion finding 2 records complementarity
    as the favoured reading
  - docs/validation/results/2026-09-19-relative-sampler-width-result.md - each model
    prefers the sampler it was trained under by about 0.0006, the matched-condition
    effect this exploits
  - run-level-stratified-jitter (accepted) - supplies the strata stream that must
    be shared alongside the targets stream
  - 'Multi-parametric MRI reading practice and co-registered multi-channel inputs:
    a lesion is confirmed by the same location on a fluid-sensitive and a non-fluid-sensitive
    sequence'
  novelty: 'The closed family is cross-slot DE-correlation (parity interleaving, half-band
    offsets, partner-quality conditioning, three-slot generalizations). This is the
    opposite intervention and it is motivated by different evidence: not the redundancy
    statistic that motivated the closed arm, but a measured training-versus-scored
    mismatch (0.57 against 0.95) that the closed arm''s null did not address. No campaign
    idea has ever proposed increasing co-location, and no current or queued mechanism
    touches the correlation BETWEEN slots - the in-flight and queued work is all within
    a slot, across epochs, on suppliers, or on triplet composition.'
  coverage: 'Each slot''s own per-epoch law is unchanged in distribution - same bands,
    same masses, same support, same stratum-without-replacement schedule - so only
    the correlation between slots changes. Measured: distinct geometry groups per
    slot over ten epochs 28.765 coupled against 28.764 incumbent, and realized triplet
    totals identical at 241,880 with zero shortfall. Because each slot''s own joint
    law is the incumbent''s, the revision-61 count invariance argument applies per
    slot, which is a stronger position than the other live candidates.'
  exploitation: 'Every study''s bag gains registered cross-contrast pairs at ~72%
    of its triplets, which is what the scored bag supplies and what the failed decorrelation
    arm suggests the model uses. Nothing is concentrated or peripheralised: the per-slot
    depth distribution is untouched.'
  budget: Zero added cost - only the operation key changes; no extra draws, no extra
    decode, no precomputation, no new config key expected. Training-only change confined
    to the `if training` arm, so the deterministic validation selection_sha256 must
    reproduce 92f1341ce45b14ee27882fd20892bd416b7945d85ddcd297055441fbc1784059 exactly.
    Counts measured identical to the incumbent (241,880 over ten epochs, zero shortfall),
    but the per-STUDY joint law changes, so the training-cohort replay must still
    establish counts.
  implementation: 'Confined to the `rng` closure in `select_triplets` (sampling.py:475-488):
    use `(kind[0],)` as the seed scope for the "targets" and "strata" operations and
    the full `kind` for "suppliers" and "band_order", plus the SAMPLING_IDENTITY["targets"]
    string. Sharing only the two depth streams is the version I measured, and it keeps
    the supplier lottery independent so the queued entitlement-balanced-supplier-draw
    remains isolable. Degeneration to the incumbent is the scope `kind` itself, which
    must be demonstrated by execution against the incumbent expression. Required verification
    at replay: realized cross-slot co-location against the incumbent''s 0.602 / 0.566
    / 0.576 and the scored bag''s 0.926 / 0.952 / 0.943, distinct realized middles
    per pool, and exact 938460 / 35030 / 24188.'
  open_choices: 'What to do when a plane''s two slots realize different `count` (rare
    - capacity is 10 or more everywhere and budgets are equal within a plane, so this
    is a capacity-limited minority): the shared generator''s first min(count) variates
    coincide for the jitter, but the strata array shape differs, and the developer
    must establish by execution whether the shared schedule survives or degrades to
    an independent draw. Also open: whether to share only "targets" (leaving strata
    per slot, which would couple the fine offset only and is likely near-inert by
    analogy with the in-flight arm''s measurement) - I recommend sharing both. HONEST
    STRIKE, stated against my own proposal: frozen-model bag quality for the coupled
    training draw is -0.00065 (se 0.00026) at matched counts, i.e. as an input bag
    it is slightly worse. That measurement cannot be trusted either way here, because
    the three cached checkpoints were trained under decorrelated per-slot draws, so
    the matched-condition bias is exactly the effect under test and the cache cannot
    separate it from bag quality. Expected effect is therefore small and of genuinely
    uncertain sign.'
  dependencies: []
  priority_rationale: 'Recommend SECOND. Its value is the cleanest null in the refill
    rather than the largest predicted effect: each slot''s own law, coverage, band
    masses and counts are held fixed by construction and verified, the validation
    identity is preserved exactly, cost is zero, and the axis already has one measured
    point in the opposite direction, so the result brackets it whichever way it lands.
    It ranks below the lattice idea because its predicted effect is small and two-sided
    (measured matched-condition gain ~0.0006 against a measured -0.00065 in raw bag
    quality, with the two confounded), while the lattice idea has a 3x larger single-signed
    measured mechanism. It ranks above the remaining tail because its reach (72% of
    triplets, 903 of 904 studies) and its invariants are both stronger than theirs.'
