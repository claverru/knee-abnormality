- id: slab-context-triplet-channels
  mechanism_id: through-plane-slab-context-channels
  parent_idea_id: null
  title: Fill each triplet's two outer channels with the mean of the adjacent and
    next slice, so a visit's triplets reach 70% instead of 49% of each series' slices
    at unchanged selection, count and GPU cost
  opportunity: "Seeing more slices per visit is the strongest measured sampling lever,\
    \ but the triplet count is sealed and denser budgets are memory-bound (peak 19.6\
    \ GiB). Measured evidence:\n- In training, 20% fewer slices cost \u22120.0041.\n\
    - On frozen checkpoints, averaging 12 random draws beats one draw by +0.007 macro\
    \ (0.8917/0.8915/0.8944 vs 0.8841/0.8844/0.8869).\n- A cache probe (300 studies\
    \ \xD7 3 draws, training counts) shows that one visit's triplet channels reach\
    \ only 49% of a series' candidate slices: 58% within \xB130 mm, 36% beyond.\n\
    - Draw sensitivity concentrates in focal-lesion positives. The positive/negative\
    \ ratio of per-study draw SD is Fracture 3.5\u20134.4, Lateral Meniscus 2.5\u2013\
    3.0, MCL 2.5\u20132.8, ACL 2.3\u20132.7, Contusion 2.2\u20132.5 and Baker's 2.0\u2013\
    2.2, against 0.6\u20131.0 for Effusion, PF OA and Medial Meniscus.\n- Training\
    \ is GPU-bound (93% utilization, 2\u20137 of 16 loader workers busy), so extra\
    \ decodes are almost free."
  mechanism: "Selection (middles, groups, suppliers, assignment, counts) stays byte-identical.\
    \ At preparation, for each selected triplet with middle s in run R:\n- channel\
    \ 1 is s, unchanged;\n- channel 0 is the pixel mean of normalized s\u22121 and\
    \ s\u22122;\n- channel 2 is the pixel mean of normalized s+1 and s+2.\n\nWhen\
    \ s\xB12 is missing from the run or fails to decode, that channel stays s\xB1\
    1 alone, the exact baseline. Intensity bounds are computed over the same retained\
    \ triplet slices as today and then applied to the context slices, so normalization\
    \ is unchanged. Averaging happens before uint8 quantization.\n\nThe rule is deterministic\
    \ and label-free, and identical in training, validation and inference. Middle\
    \ position, patient maps and tokens per triplet are unchanged. Per-visit channel\
    \ reach rises from 49% to 70% (central 58% to 80%, peripheral 36% to 56%) at a\
    \ median gap of 3.72 mm. Each triplet's context extends to about \xB17.4 mm instead\
    \ of \xB13.7 mm, and the fine detail of the middle slice is kept.\n\nThe mean\
    \ is chosen over a MIP because a MIP would erase dark menisci, ligaments and cortex."
