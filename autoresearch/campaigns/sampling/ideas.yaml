  ranking_rationale: 'I admitted residual-balanced-study-batches. It has no dependencies,
    and proposal_admission is satisfied. I placed it third: after the reserved head
    and complementary-window-bags, and ahead of model-feedback-depth-targets.


    Why admit it:

    - It is the only in-scope lever that leaves every visit''s inputs unchanged. Only
    batch membership and order change, so attribution is cleaner than for any idea
    already in the registry.

    - It costs almost nothing: CPU greedy packing, under a second per epoch.

    - It is a feedback mechanism, which the campaign lacks apart from the running
    misfit-density candidate.


    I checked the two claims it rests on:

    - Selection RNG is keyed per (seed, study, type, operation, epoch), not by loader
    order (`sampling.py:471-474`). Per-study bags therefore stay byte-identical under
    reordering.

    - The accounting digests sort per-study rows (`accounting.py:28-78`). Training
    selection_sha256 and triplet/visit counts must therefore equal the baseline replay''s.
    That gives a hard pre-launch check.


    Why third and not higher:

    - How much a logit-space batch-variance reduction translates into macro AUC is
    unmeasured.

    - The expected effect is plausibly below the ~0.003 same-seed sampling noise.

    - The complementary-window and slab ideas change what the model sees and carry
    larger prior-backed upside.


    It goes ahead of model-feedback-depth-targets because it cannot create a label
    shortcut and it is cheaper to execute.


    I left the other two proposals unadmitted:

    - label-diverse-batch-composition: the researcher''s probe shows it strictly weaker
    than residual balancing (0.51-0.69 against 0.24-0.53 of random batch error) and
    fading late in training. It stays proposed. It is not queued, so parking does
    not apply.

    - epoch-paced-bag-size: no new evidence this event.'
