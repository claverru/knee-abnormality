ideas:
- id: physical-span-standardized-triplets
  mechanism_id: through-plane-triplet-composition
  parent_idea_id: null
  title: Standardize each triplet's through-plane span instead of its slice stride
  opportunity: A triplet is always three consecutive slices, so its physical through-plane
    extent follows each series' spacing. On the old fold-0 cache the median candidate
    gap was 3.32 mm (p1 0.03, p5 0.61, p95 5.07), so spans ranged from about 0.06
    to 18 mm; 6.0% of pools had median spacing below 1 mm and fed the backbone three
    near-identical channels. In-plane geometry is standardized (0.625 mm, 224 px);
    through-plane geometry is not.
  mechanism: 'Choose the channel offsets so each triplet spans a fixed physical thickness:
    stride k = round(target_half_span / spacing), clamped to k >= 1 and to what the
    run allows, with the middle slice unchanged. Anchor the target span to the cohort''s
    current median realized span (7.11 mm on the old cache; re-measure on the sealed
    cohort) so it is a standardization, not a tunable. Most pools keep k = 1; dense
    acquisitions gain real through-plane context at the same channel count.'
  precedents:
  - autoresearch/campaigns/triplet-sampling/ideas.yaml (physical-span-standardized-triplets,
    queued, never trained)
  - docs/research/input-resolution.md#acquisition-all-24371-train-series
  - docs/data-preparation/physical-sampling/implemented-sampler.md
  novelty: Re-queued by explicit user instruction on 2026-09-21 from the stopped triplet-sampling
    campaign, where it was queued but never implemented or trained. The only earlier
    sampling idea that changes pixel content rather than which depths are drawn.
  coverage: Candidate windows per run fall from L-2 to L-2k, so reduce k until min(budget,
    groups_k) equals min(budget, groups_1); k = 1 always satisfies it. Peripheral
    reach is unaffected because the middle slice sets the depth.
  exploitation: Depth targets, widths, budgets and supplier rules are untouched; only
    channel content at each selected location becomes comparable across acquisitions.
  budget: Still three decoded slices per triplet and the same triplet count. Selected
    triplets share almost no slices, so unique decodes barely move; confirm in the
    CPU replay against the sealed ceiling.
  implementation: Adds behavior. Candidate construction and support definition in
    data/preprocessing/sampling.py build_pool; prepare_series in preparation.py must
    accept the nonconsecutive stride. Preserve three distinct slices, distinct middles
    and original acquisition indices. Record the changed deterministic validation
    identity. Any new setting goes under data.sampling.
  open_choices: Cohort-wide or per-plane median span; clamping on short runs; handling
    of degenerate positions (inspect the p1 0.03 mm cases before treating them as
    dense acquisitions). Fixed, not jittered, stride for this idea.
  dependencies: []
  priority_rationale: Never tested, measured premise, zero added compute, and it changes
    what the backbone sees in every dense series.
  status: completed
  created_revision: 5
  ranking_rationale: 'I admitted all five imported ideas. None has a dependency, and
    all fit the sampling scope and the editable files. The queue was empty, so this
    ranking builds it.


    1. physical-span-standardized-triplets: It rests on measured spacing spread. It
    adds no compute, is a fixed standardization rather than a tunable, and changes
    channel content in every dense series. It is the cleanest test that has never
    been run.

    2. anatomy-anchored-crop-placement: This one has the largest potential effect.
    The joint line sits a median 12.8 to 17.5 mm off centre, and edge labels are sensitive
    to the crop. It ranks second because the joint-line heuristic has never been validated
    against ground truth. It also changes the preprocessing identity and inference,
    and the landmark cost counts against the 1,847 s ceiling. Its label-free coverage
    check should come before any GPU run.

    3. run-level-stratified-jitter: It is cheap. It gets its first test at the incumbent''s
    seed, on the new split and labels, and the result decides the whole draw-coupling
    family.

    4. plane-coupled-depth-targets: The premise is confirmed in source. At baseline
    `sampling.py:471-477`, the "targets" stream is seeded with the full `kind`, so
    a plane''s two slots draw independent jitter. Validation uses the fixed 0.5 offset.
    The expected effect is small and of unknown sign.

    5. model-feedback-depth-targets: This is the most speculative idea. Earlier attention-based
    selection gained only +0.004, and attention entropy was about 0.97. It also touches
    the training loop and the persistent workers.'
  experiments:
  - physical-span-standardized-triplets-20260921T220140Z-dbfa1835
  - physical-span-standardized-triplets-20260921T220931Z-71613a41
  decision: reject
- id: anatomy-anchored-crop-placement
  mechanism_id: anatomical-in-plane-crop-anchor
  parent_idea_id: null
  title: Place the fixed 140 mm window from anatomy instead of the image centre
  opportunity: Every slice is cut to 224 px at 0.625 mm around the image centre, i.e.
    wherever the technologist centred the field of view. On a 300-series sample the
    joint line sits a median 12.8 mm (sagittal) and 17.5 mm (coronal) below the image
    centre, beyond 24-26 mm in 10% of series, so the window covers about 85 mm above
    the joint and 55 mm below; the coronal window reaches a median 53 mm below against
    a 5-7 cm MCL tibial attachment. Tissue midpoints are within a few mm of centre
    in the other direction.
  mechanism: 'Keep the window size and spacing fixed. Up-down in sagittal and coronal:
    centre the window on a detected joint line plus one offset chosen from the measured
    extent of the label anatomy above (suprapatellar recess, patella) and below (tibial
    plateau, MCL attachment, fibular head). Other directions, all planes: centre on
    the tissue extent; when tissue is wider than 140 mm, keep the patella and give
    up posterior subcutaneous fat. Fall back to the image centre whenever the landmark
    is not found. Placement is deterministic per series in validation and inference.'
  precedents:
  - docs/research/input-resolution.md#field-of-view-and-joint-position (joint offsets,
    tissue width, placement reopened 2026-09-21)
  - outputs/analysis/i/input-resolution-research-20260915/images/common.py joint_line
    heuristic (cross-plane agreement within 10 mm in 96-98% of studies; not validated
    against ground truth)
  - outputs/analysis/i/input-resolution-research-20260915/images/series_metrics_overhang.parquet
    (tissue width and offsets per plane)
  - docs/history/crop-selection-investigation.md (learned crop selection dropped 2026-09-16;
    its anatomical-glimpse option was never run)
  - docs/validation/results/2026-09-12-140-mm-crop-result.md
  novelty: 'Added by the user on 2026-09-21. Unlike the dropped crop-selection work
    it learns nothing and changes neither resolution nor coverage of slices: one window
    per slice, the same size, moved to anatomy. Tissue-centring alone was rejected
    earlier because it moves the window only a few mm; the joint-line anchor is the
    new part.'
  coverage: Measure, without labels and before training, the share of windows that
    reach the required anatomy above and below the joint under image-centred and anchored
    placement. Report sagittal posterior clipping too; the anchor must not move clipping
    into the patella.
  exploitation: The joint lands at a consistent row across studies, and edge structures
    (MCL attachment, fibular head, tibial plateau) enter the window where they are
    cut today.
  budget: One landmark estimate per series on image data already decoded, plus the
    tissue mask; the crop itself costs the same. Time it in the CPU replay; it counts
    toward the sealed ceiling and runs at inference too through the shared dataset
    path.
  implementation: Replaces image-centred placement. Port the heuristic into data/preprocessing
    (spatial.py or preparation.py, inside the preprocessing identity) and pass a per-series
    offset into resample_crop so output_to_native keeps patient maps exact. Axial
    slices use the tissue anchor only. No labels, no validation predictions. Spacing,
    window size and augmentation stay fixed.
  open_choices: Whether the anchor comes from a fixed reference slice per series or
    from the decoded selected slices; the up-down offset, set from measured anatomy
    extent, never from AUC; whether training draws placement around the anchor within
    the heuristic's uncertainty or uses the fixed anchor.
  dependencies: []
  priority_rationale: Measured geometric premise with a direct link to edge labels
    that crop tests showed are sensitive to the window; the label-free coverage check
    can stop it cheaply before a run.
  status: completed
