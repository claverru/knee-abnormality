- id: residual-balanced-study-batches
  mechanism_id: training-feedback-batch-composition
  parent_idea_id: null
  title: Build each epoch's batches so the studies' stale per-label loss-gradient
    residuals cancel within every batch, with identical per-study bags, visits and
    steps
  opportunity: 'The training loader shuffles studies uniformly into batches of 8 (lightning.py:184-189).
    A per-study vector r = w(y)*(sigmoid(z)-y)*observed is that study''s logit gradient
    under the loss, and it is persistent. On k_05''s per-epoch validation predictions,
    R^2 from epoch e to e+1 is 0.82 at 0->1 and 0.95-1.00 from epoch 5. Random batches
    therefore carry avoidable between-study noise. k_05 looks noise-floor limited:
    validation AUC is 0.8990/0.8978/0.8987 at epochs 7-9 as the LR decays, and train
    loss is 0.433 against validation soft BCE 0.445. Batch composition is the only
    in-scope lever that leaves every visit''s inputs byte-identical. No registry idea
    steers it with feedback.'
  mechanism: 'Keep a per-study residual table. Initialise it from training labels
    as w*(pi-y)*observed, with pi the training-fold prevalence; this is the residual
    of a prior-only model. Overwrite each row with the detached residual from the
    study''s own training_step. At each epoch''s iterator creation, centre the vectors.
    Open 437 batches of 8 and one of 6 (3,502 studies, 438 steps). Visit studies in
    a seeded random order and put each into the open batch that minimises ||batch
    sum + r||, subject to a per-batch planned-triplet cap. Then shuffle batch order
    and within-batch order. Every study still appears exactly once, and its bag is
    unchanged: selection RNG is keyed on (seed, study, type, epoch), not order. Each
    step now mixes over- and under-predicted studies per label, so the minibatch gradient
    in logit space tracks the epoch mean. Lower Adam second moments are part of the
    effect and cannot be separated.'
  precedents:
  - 'Probe (this job): scratch/probe/SUMMARY.md, order_probe.py, batch_probe.py, robustness_probe.py.
    Batch-mean residual error vs random: stale greedy 0.24-0.53, oracle 0.29-0.35.
    With per-visit noise: 0.51-0.56 at 80% clean share, 0.72-0.78 at 60%. Deterministic
    validation inputs, not a training result.'
  - 'label-diverse-batch-composition (proposed, static): the label-balanced analogue
    in the probe reaches only 0.51-0.69, worsening as residuals decouple from labels.'
  - 'Lu et al. NeurIPS 2022, GraB (arXiv 2205.10733): stale-gradient herding order.
    Probed here: prefix discrepancy halves (22->14), but batch-of-8 error is still
    0.79-0.82 even with an oracle.'
  - 'Zhao & Zhang 2014 (arXiv 1405.3080): stratified minibatches reduce variance.
    Zhang, Kjellstrom & Mandt, UAI 2017 (arXiv 1705.00607): DPP-diversified minibatches
    lower gradient variance.'
  - 'misfit-steered-study-bag-density (launched): its BagDensityBatchSampler and on_train_epoch_start
    plumbing. Lightning fit_loop.py:435-452 and training_epoch_loop.py:239-246 create
    the epoch iterator after on_train_epoch_start for epochs >0.'
  - researcher-20260921T231233Z-92b631e0 exhausted batch composition acting through
    gradient clipping (clip never binds). This mechanism acts through gradient variance
    instead.
  - 'src/knee_abnormality/autoresearch/accounting.py:28-78: the per-study selection
    digest is order-independent, so the training selection hashes must equal the baseline
    replay''s.'
  novelty: This is the first feedback-steered batch composition, and the repo has
    no stratified, diversified or herding minibatch work. label-diverse uses static
    labels and measured clearly weaker late in training. misfit density and model-feedback
    depth change inputs; this changes none. It targets the between-study gradient
    mixture, not exposure, weights or depths.
  coverage: 'Identical by construction: each study is visited once per epoch with
    the incumbent''s exact bag. Every epoch''s training selection_sha256 must equal
    the baseline replay''s (cd57bdc2..., c6319067..., ...), and validation stays f7ad4380....
    Only batch membership, batch order and GPU-side random streams change. Record
    each epoch''s batch sizes (437x8 + 1x6) and one visit per study.'
  exploitation: 'The model''s own stale residuals steer the gradient mix, not the
    inputs. The between-study batch residual variance is expected to fall to roughly
    0.3-0.75x of random, depending on per-visit noise from augmentation and series
    dropout, which is unmeasured. Misfit rare positives spread across batches: batches
    with at least one positive rise for Synovitis 0.63->0.78 and Lateral Meniscus
    0.72->0.81. Well-fit common positives spread less.'
  budget: Main-process CPU only. The greedy build is 3,502 x <=438 x 13 dimensions
    per epoch, well under a second. Per-step bookkeeping is one detached sigmoid on
    8x12 logits. There are no extra decodes, tokens or GPU work. Peak memory is bounded
    by the planned-total cap, set at the maximum per-batch total from epoch 0 inside
    the process. Runtime should match recent candidates (1,575-1,591 s against the
    1,847 s ceiling). Validation is unchanged.
  implementation: 'Replaces only the training loader''s uniform shuffle; everything
    else is retained and nothing removed. dataset.py: add a batch sampler with set_epoch
    that seeds its RNG from (training seed, epoch) and builds batches from a main-process
    residual table and bag-total table. Workers need no shared state. build_data_loader
    uses it only for training; validation and batch_norm_loader stay unchanged. lightning.py:
    initialise the table from training labels. In training_step, write detached residuals
    by study index. Record each study''s bag total from epoch-0 batch[''sampling''].
    Save and restore both tables in checkpoints and write per-epoch diagnostics. Use
    constants, not config keys. Before launch, a CPU replay with synthetic residuals
    must show 438 batches, one visit per study, and baseline-equal training selection
    hashes. If misfit density is accepted meanwhile, replace its randperm and swap
    pass with this build. Use its planned totals as the size input and its cap, and
    keep its allocation. slab, window and depth-feedback ideas are orthogonal.'
  open_choices: 'The residual source: the last visit (recommended, since residuals
    are stable) or an EMA to damp augmentation and series-dropout noise. For bag size,
    a hard cap only, or also a balancing coordinate scaled to the median residual
    norm (recommended: both). Epoch 0: the prior-residual table (recommended) or a
    uniform shuffle. Per-label scaling stays the loss''s own w. Fix all of these before
    launch, with no sweep.'
  dependencies: []
  priority_rationale: 'Expected gain is modest and uncertain, and the translation
    from logit-space variance to AUC is unmeasured. Cost is negligible, though, and
    there is no shortcut risk. Attribution is the cleanest in the campaign: inputs
    are hash-identical and only batch membership changes. Either outcome closes the
    batch lever, including label-diverse. Rank it after slab-context and complementary-window-bags,
    ahead of model-feedback-depth-targets. It supersedes label-diverse-batch-composition.'
  status: queued
  created_revision: 119
  ranking_rationale: "I admitted registered-fluid-context-t1pd-triplets. It has no\
    \ dependencies (proposal_admission: satisfied). It falls within the contract's\
    \ scope, which covers how each triplet's channels are composed. Selection, counts,\
    \ visits and the fluid slots stay byte-identical, so the triplet and visit seals\
    \ are untouched by construction. The model is unchanged.\n\nThe mechanism is new\
    \ to the campaign: no earlier idea puts two contrasts into one token. It also\
    \ addresses a gap recorded in triplet-sampling findings item 2: registered middles\
    \ coincide across contrast slots, but late fusion cannot exploit them.\n\nI checked\
    \ the premise in the baseline source. In `model.py:220-264`, tokens meet only\
    \ through the softmax-weighted pool. The optional residual readout adds a non-linearity\
    \ after pooling, but not a conjunction at a given location. So cross-contrast\
    \ features at a location can only come from the channels, and the premise holds.\n\
    \nIt ranks third: ahead of model-feedback-depth-targets and behind residual-balanced-study-batches.\
    \ The CPU cost is net-zero in decodes, attribution is clean because selection\
    \ hashes don't change, and 25\u201330% of triplets are reached. The sign is uncertain,\
    \ as the proposer says: it loses T1/PD neighbour context, which matters for OA\
    \ labels. It shares a composition-level code path with the running slab-context\
    \ candidate and the developing complementary-window-bags candidate. So whichever\
    \ of those is adopted first changes its implementation base; the proposal already\
    \ describes how to rebase onto both.\n\nI did not admit epoch-paced-bag-size:\
    \ the same mechanism was inconclusive in triplet-sampling. I did not admit label-diverse-batch-composition:\
    \ it largely overlaps the queued residual-balanced batches, which use training\
    \ feedback."
- id: registered-fluid-context-t1pd-triplets
  mechanism_id: cross-contrast-registered-channel-composition
  parent_idea_id: null
  title: Fill each T1/PD triplet's two outer channels with the identically prescribed
    fluid series' slices at the same two neighbouring positions, so about a quarter
    of each bag's tokens see both contrasts registered at pixel level
  opportunity: "The attention pool is linear in token values with no token interaction\
    \ (model.py:220-264). The model therefore cannot form cross-contrast conjunctions\
    \ at a location, such as fluid-bright with T1/PD-dark marrow for edema versus\
    \ fat, or fluid inside a meniscal line. Header probe (128 studies, headers.parquet):\
    \ coronal and sagittal fluid/T1/PD pairs are parallel in 83-92%. 71-73% of pairs\
    \ have \u226590% of slices within 0.5 mm, and 83% share the in-plane centre within\
    \ 1 mm. T1/PD middles whose two neighbour positions both match an aligned fluid\
    \ slice: 0.68 axial, 0.73 coronal, 0.66 sagittal. Fluid types carry about 3/4\
    \ of the separation at 1.07-1.64x per-token efficiency, against 0.39-0.86 for\
    \ T1/PD. Removing a T1/PD type costs \u22640.002 (axial: 0)."
  mechanism: "Selection stays byte-identical, including middles, bands, suppliers,\
    \ counts and the fluid slots. For each selected triplet in a non-fluid slot, with\
    \ middle s and neighbours s-1 and s+1, look in the same plane's fluid slot. Take\
    \ the first source in its pool ranking with the same row and column orientation\
    \ (dot \u22650.9995) and an image centre within 1 mm in-plane. It must have slices\
    \ within 0.5 mm along the normal of both s-1 and s+1. When found, channels become\
    \ [fluid@(s-1), T1/PD s, fluid@(s+1)]; otherwise the triplet keeps baseline composition.\
    \ Both-or-neither keeps channels 0 and 2 exchangeable under sagittal reflection.\
    \ Partner slices are resampled by their own geometry into the same 140 mm window.\
    \ They are normalized with bounds from the partner slices used in the slot, at\
    \ the same quantiles. The rule is deterministic, label-free and identical in training,\
    \ validation and inference. In training, the independent contrast draws add fluid\
    \ slices to each visit: roughly +45% fluid slices per coronal or sagittal plane,\
    \ and fewer T1/PD neighbours. In validation the partner lattices coincide (median\
    \ 0.00 mm), so the change there is conjunction, not coverage."
  precedents:
  - 'Probe this job: scratch/probe/contrast_registration.py, t1pd_partner_reach.py
    on outputs/analysis/g/geometry-metadata-20260912/headers.parquet (128 studies; not
    the sealed cohort). Figures are in the opportunity field.'
  - 'triplet-sampling findings item 2: validation middles coincide across contrast
    slots (0.91-0.97 within 5 mm, median 0.00 mm). Removing co-location was slightly
    negative, suggesting registered pairs are complementary, but ''the model has no
    cross-contrast registration to exploit them''.'
  - 'plane-coupled-depth-targets (this campaign, reject, -0.0004): more depth co-location
    without pixel-level fusion did nothing, consistent with late fusion being unable
    to use registration.'
  - "docs/validation/results/2026-09-17-type-contribution.md (fluid share and efficiency;\
    \ coronal and sagittal T1/PD lead medial and lateral OA) and 2026-09-17-test-time-allocation.md\
    \ (removal costs: T1/PD \u22640.002, fluid 0.006-0.007)."
  - 'researcher-20260921T224526Z-92a4b780 exhausted note called cross-contrast registered
    fusion a model redesign. Contested here: model.py is unchanged, the contract scopes
    channel composition, and slab-context-triplet-channels was admitted for the same
    kind of train/validation/inference composition change.'
  - 'Isensee et al. 2021 Nat Methods (nnU-Net): co-registered sequences as input channels
    is standard. arXiv 1908.01997 reports late fusion can beat pure early fusion;
    this idea keeps the pure late-fused fluid tokens and adds early fusion only in
    T1/PD tokens.'
  novelty: This is the first campaign mechanism to put two contrasts into one token.
    physical-span and slab-context change through-plane content within one series.
    plane-coupling and interleaving change only which depths each contrast slot samples.
    Selection and supplier rules are untouched; a partner series supplies channels,
    not triplets.
  coverage: 'Run-level coverage of middles is unchanged. Per-visit fluid slices touched
    rise in training, while T1/PD neighbour slices fall for the ~2/3 of T1/PD triplets
    that convert, about 25-30% of all triplets. Report per plane: conversion share,
    fallback reasons (orientation, centre, position, decode), and distinct fluid and
    T1/PD slices touched per visit, against the baseline replay.'
  exploitation: None through selection. The backbone gains pixel-level cross-contrast
    features in converted tokens and keeps the T1/PD middle slice. Pure fluid tokens
    are unchanged. Even converting the near-useless axial T1/PD slot (removal costs
    about 0) carries axial fluid context, the top type for Baker's cyst, effusion
    and synovitis.
  budget: GPU, tokens and memory are unchanged. Up to two own-neighbour decodes per
    converted triplet are replaced by two partner decodes, so the net decode count
    is about zero. The partner series are already indexed, because slot_sources covers
    every slot before preparation. Matching is a per-triplet position lookup, plus
    one extra quantile over the partner slices per slot. Expect a runtime close to
    recent candidates (1,575-1,591 s, ceiling 1,847 s); confirm in the replay. Validation
    stays x1 and deterministic. Selection hashes are unchanged, but the preprocessing
    and composition identity change and must be recorded.
  implementation: "Adds behavior and retains all baseline components. Fluid slots\
    \ and unmatched T1/PD triplets keep baseline composition, and nothing is removed.\
    \ dataset.py: pass the same plane's fluid slot sources, in pool ranking order,\
    \ to _prepare_slot for non-fluid slots. sampling.py or preparation.py: a deterministic\
    \ partner matcher that records partner records per triplet, plus a SAMPLING_IDENTITY\
    \ composition entry. preparation.py prepare_series: accept an optional partner\
    \ pair per triplet. Generalize the consecutive-slice check to own middles only.\
    \ Decode partner paths through the slot cache, compute partner bounds, and take\
    \ channel 0/2 pixels, valid rects and patient maps from the partner. If a partner\
    \ decode fails, fall back to own s\xB11 with no retry-loop change. Keep own middle\
    \ positions. Degeneration check: with matching disabled, tensors equal the baseline.\
    \ Newly accepted incumbent: with slab-context, partner channels use its outer\
    \ rule inside the partner series; with complementary-window-bags, resample partners\
    \ in the triplet's window (cache keyed by path and window); batch or depth feedback\
    \ is orthogonal."
  open_choices: 'Tolerances are fixed a priori from the bimodal header distribution
    (exact prescription versus different), never swept: 0.5 mm along the normal, 1
    mm centre, 0.9995 orientation. Partner bounds come from the partner slices in
    this slot (recommended); reusing the fluid slot''s bounds would couple slots.
    Require both neighbours (recommended); single-side mixing breaks reflection symmetry.
    Extending to same-geometry second sources within a slot (dual-echo) is out of
    this idea. Inter-series motion is invisible to headers; image registration is
    not proposed.'
  dependencies: []
  priority_rationale: 'It is the only untested in-scope way to give the model cross-contrast
    conjunctions, and it costs no GPU. Reach is about 25-30% of triplets, it raises
    per-visit fluid exposure in training, and attribution is clean because selection
    hashes are unchanged. The sign is uncertain: early-fusion evidence is mixed, lost
    T1/PD neighbours could cost OA labels, motion is unmeasured, and fluid redundancy
    across slots weakens series dropout''s effect on fluid content. I''d rank it after
    the slab-context result (rebase if adopted), alongside residual-balanced batches,
    and ahead of model-feedback-depth-targets.'
