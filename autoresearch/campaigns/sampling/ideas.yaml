    (common offset, rotated lattice, prefix order, supplier cycling).'
  coverage: Increases distinct anatomy seen per pool over the run at identical counts;
    no region loses support.
  exploitation: Per-epoch band masses are untouched; the extra coverage comes from
    avoided duplicate visits.
  budget: One permutation per (study, type, band) per run; no extra decoding or state.
    Validation selection must reproduce the incumbent's exactly.
  implementation: Adds behavior in the percentile construction of select_triplets
    plus one epoch-independent stream. The stratification depth E goes under data.sampling.
    Reimplement from the archived source rather than restoring the reverted code blindly.
  open_choices: E relative to the ten-epoch schedule; wrap-around past E; permutation
    per band or shared. Re-measure the distinct-middle gain in the replay.
  dependencies: []
  priority_rationale: The only earlier mechanism with two runs, both non-negative
    against the control average; cheap, and it settles a whole family either way.
  status: completed
