- id: epoch-paced-bag-size
  mechanism_id: across-epoch-budget-pacing
  parent_idea_id: null
  title: Pace the per-visit bag size across the run at an unchanged run total
  opportunity: Every study gets the same budget in all ten epochs, but the harness
    fixes only run totals and per-epoch visits, not per-epoch triplet counts. Frozen-model
    count curves are steep between about 20 and 31 triplets per study, so a plus-or-minus-one
    offset per slot moves bags along the steep part.
  mechanism: 'Apply a per-epoch integer offset to each slot''s budget, summing to
    zero over the run, only where the pool has slack to realize it: smaller bags early,
    larger late, so the epochs that usually produce the selected checkpoint see denser
    bags. Ineligible slots keep the incumbent budget, so the realized run total is
    unchanged by construction.'
  precedents:
  - autoresearch/campaigns/triplet-sampling/ideas.yaml (epoch-paced-bag-size)
  - outputs/autoresearch/triplet-sampling/experiments/epoch-paced-bag-size-20260919T200307Z-0bdb46b8
