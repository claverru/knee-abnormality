- id: plane-coupled-depth-targets
  mechanism_id: cross-slot-depth-coupling
  parent_idea_id: null
  title: Draw a plane's two contrast series at the same depths in training, as validation
    already does
  opportunity: The deterministic validation bag pairs a plane's two contrast slots
    almost exactly (share of middles within 5 mm of a partner 0.93/0.95/0.94 axial,
    coronal, sagittal on the old source) while training pairs them by accident (0.60/0.57/0.58),
    because the two slots use independent depth streams. About 72% of training triplets
    sit in a slot whose plane partner is present.
  mechanism: Key the depth-target random stream on the plane alone instead of the
    full (plane, fluid_sensitive, fat_suppression) type, so a plane's two slots aim
    at the same percentiles. Each slot still snaps to its own geometry through its
    own groups and assignment, so pairs are co-located only where both series have
    a slice. Supplier and band-order streams stay per slot.
  precedents:
  - autoresearch/campaigns/triplet-sampling/ideas.yaml (plane-coupled-depth-targets,
    blocked on the withdrawn stratified-jitter parent)
  - outputs/autoresearch/triplet-sampling/experiments/plane-coupled-depth-targets-20260919T211410Z-c36f925a
    (0.89461, fresh seed 3759278001, built on the withdrawn sampler; uninformative)
  - outputs/autoresearch/triplet-sampling/experiments/cross-slot-band-interleaving-20260919T181018Z-c008c6bb
    (opposite direction, -0.0017 with a fresh seed, inconclusive)
  novelty: Re-queued by explicit user instruction on 2026-09-21, rebuilt without the
    stratified-jitter dependency. Its only run sat on a withdrawn sampler with a fresh
    seed, so it was never tested on its own.
  coverage: Each slot's own per-epoch law is unchanged; only the correlation between
    the two slots of a plane changes. Distinct middles per slot over the run should
    stay equal; confirm in the replay.
  exploitation: Training bags gain registered cross-contrast pairs at the same depth,
    matching the scored condition.
  budget: 'Only the random-stream key changes: no extra draws, decodes or state. Validation
    selection must reproduce the incumbent''s exactly.'
  implementation: Adds behavior. In select_triplets, seed the "targets" stream with
    the plane alone and keep the full type for "suppliers" and "band_order"; update
    the SAMPLING_IDENTITY targets string. Demonstrate by execution that keying on
    the full type reproduces the incumbent.
  open_choices: 'Behaviour when a plane''s two slots realize different counts (capacity-limited
    minority): establish by execution whether the shared jitter survives. Measure
    realized co-location against the incumbent''s training and validation figures.'
  dependencies: []
  priority_rationale: Removes a named train/validation mismatch at zero cost; expected
    effect small and of uncertain sign.
  status: completed
