- id: complementary-window-bags
  mechanism_id: bag-level-in-plane-window-coverage
  parent_idea_id: null
  title: Split each slot's triplets between two 140 mm windows at opposite ends of
    the measured tissue extent, so the bag covers the full field while every triplet
    keeps its size and spacing
  opportunity: "Every triplet uses one image-centred 140 mm window, so every triplet\
    \ drops the same measured tissue. The stored FOV has a median of 160 mm (p95 182\u2013\
    190). The leg crosses the top and bottom edges in sagittal and coronal series,\
    \ so about 10 mm is lost at each end at the median FOV. Sagittal AP tissue has\
    \ a median of 146 mm and exceeds 140 mm in 67 of 96 series. Tissue overhang beyond\
    \ 10 mm occurs in 34% of sagittal series (mostly posterior), 16% of axial and\
    \ 9% of coronal. Placement alone cannot fix this: the joint-line anchor was null\
    \ (\u22120.00095), tissue centring moves the window only a few mm, and 'only a\
    \ wider field helps', but the field is sealed. The model scores the bag through\
    \ softmax pooling over all of a study's tokens, so study-level coverage is the\
    \ union over triplets. That union is currently no larger than one window. New\
    \ evidence: the anchor run's 'patellofemoral/superior coverage cost' does not\
    \ hold up. Its per-label deltas correlate at r=0.72 with those of the unrelated\
    \ physical-span run and at r=0.59 with the k1\u2212k05 difference, so nothing\
    \ measured shows that moving a window costs anything."
  mechanism: "For each prepared series, measure the tissue extent along both in-plane\
    \ axes from one coarse tissue mask on a reference slice. When the leg crosses\
    \ both edges, the extent is the image extent. On an axis whose extent exceeds\
    \ 140 mm, define two windows flush with its two ends, each shifted by s=(extent\u2212\
    140)/2 and clipped to the image. On axes that fit, keep today's image-centred\
    \ placement. Window A takes the superior/anterior ends and window B the inferior/posterior\
    \ ends, in patient coordinates from IOP. The pairing therefore follows the importance\
    \ map's measured hemisphere contrasts: patella, suprapatellar recess and effusion\
    \ are anterosuperior; Baker's cyst and tibiofemoral OA are posteroinferior. Selection\
    \ is unchanged. The slot's selected triplets alternate A/B over depth-sorted bands.\
    \ Validation is deterministic (the lowest band takes A). Training draws a random\
    \ phase per (study, slot, epoch) from a new 'windows' stream, so the targets,\
    \ suppliers and band_order streams are untouched. Every triplet stays 224 px at\
    \ 0.625 mm and 140 mm. A central core of width 140\u22122s is seen by every triplet,\
    \ and the outer strips by half of them. output_to_native carries the shift, so\
    \ the patient maps and medial axis stay exact. On failure, fall back to the image\
    \ centre."
