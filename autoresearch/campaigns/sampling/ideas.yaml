  ranking_rationale: "Admitted complementary-window-bags. It has no dependencies.\
    \ It works on \"where the in-plane window sits\", which the contract puts in scope,\
    \ and it leaves the sealed 224 px / 0.625 mm / 140 mm per-triplet geometry alone.\
    \ Placement is set by measured tissue extent from images only, with an image-centre\
    \ fallback. The same logic runs in validation and inference through the shared\
    \ dataset path. The only randomness is the training band phase, drawn from a new\
    \ stream, so the existing targets, suppliers and band_order streams stay as they\
    \ are. Counts do not change.\n\nOf the in-plane lever, this is the version the\
    \ registry has not tested: coverage of the whole bag rather than moving a single\
    \ window. The single-window anchor came out at \u22120.00095. That result limits\
    \ the expected size of a placement effect, but it does not predict this idea's\
    \ sign.\n\nI ranked it third, after misfit-steered density and ahead of model-feedback-depth-targets.\
    \ The researcher measured model-feedback's per-triplet steering signal as near-uniform,\
    \ so it has less reach. Complementary windows need more preprocessing plumbing\
    \ than misfit steering, and their expected gain is modest.\n\nI did not admit\
    \ the older epoch-paced-bag-size and label-diverse-batch-composition entries.\
    \ This event adds no evidence for them, and the researcher's gradient-clip measurement\
    \ weakens the case for batch composition. They stay proposed."
