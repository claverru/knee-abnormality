- id: model-feedback-depth-targets
  mechanism_id: training-feedback-depth-importance
  parent_idea_id: null
  title: Steer next epoch's depth targets with this epoch's training attention
  opportunity: Every depth draw today is a fixed Gaussian around the study centre;
    nothing the model learns about where evidence lies feeds back into which slices
    it is shown. Attention pooling already scores every training triplet, so a per-study,
    per-type map of where attention concentrates is available at no extra forward
    cost.
  mechanism: During epoch e, record training-time attention mass per (study, type,
    depth). Before epoch e+1, turn it into a smoothed depth density and draw targets
    from a fixed mixture of that density and the incumbent Gaussian, so every region
    keeps a coverage floor. Epoch 0 uses the Gaussian. Validation and inference stay
    on the incumbent deterministic selection.
  precedents:
  - docs/history/crop-selection-investigation.md#what-the-runs-established (attention-based
    selection beat random by only 0.004 there; normalized attention entropy 0.97-0.99)
  - docs/research/auc_loss_approaches.md#adaptive-allocation
  - docs/backlog/big-bets.md#adaptive-training-allocation
  novelty: 'Added by the user on 2026-09-21. The triplet-sampling campaign allowed
    training feedback but proposed only static geometric mechanisms. Differs from
    learned crop selection: no new model, no learned placement in validation or inference,
    only a training-time exposure prior.'
  coverage: The Gaussian mixture weight is a floor, fixed a priori, so no depth band
    loses support; report realized depth histograms per epoch from the replay.
  exploitation: Later epochs spend more draws where the model's own attention says
    evidence sits for that study.
  budget: Attention is already computed; cost is bookkeeping in the training loop
    and a small per-epoch map read by persistent workers. No precomputation outside
    the measured process. Validation unchanged.
  implementation: Adds behavior. model.py may only expose per-triplet attention for
    training batches; lightning.py collects it and publishes a per-epoch map to the
    dataset; sampling.py mixes it into target_depths. Training batches only; no labels
    beyond what training already uses, no validation data. Losses, optimizer and checkpointing
    unchanged.
  open_choices: Which attention (family, label, or pooled) forms the map; smoothing
    width and mixture weight, fixed from geometry rather than swept; how persistent
    workers pick up the new map each epoch.
  dependencies: []
  priority_rationale: The most novel family available; speculative, with weak prior
    evidence that attention is a strong placement signal, so it ranks behind the cheaper
    evidence-backed ideas.
  status: queued
  created_revision: 5
  ranking_rationale: "I admitted registered-fluid-context-t1pd-triplets. It has no\
    \ dependencies (proposal_admission: satisfied). It falls within the contract's\
    \ scope, which covers how each triplet's channels are composed. Selection, counts,\
    \ visits and the fluid slots stay byte-identical, so the triplet and visit seals\
    \ are untouched by construction. The model is unchanged.\n\nThe mechanism is new\
    \ to the campaign: no earlier idea puts two contrasts into one token. It also\
    \ addresses a gap recorded in triplet-sampling findings item 2: registered middles\
    \ coincide across contrast slots, but late fusion cannot exploit them.\n\nI checked\
    \ the premise in the baseline source. In `model.py:220-264`, tokens meet only\
    \ through the softmax-weighted pool. The optional residual readout adds a non-linearity\
    \ after pooling, but not a conjunction at a given location. So cross-contrast\
    \ features at a location can only come from the channels, and the premise holds.\n\
    \nIt ranks third: ahead of model-feedback-depth-targets and behind residual-balanced-study-batches.\
    \ The CPU cost is net-zero in decodes, attribution is clean because selection\
    \ hashes don't change, and 25\u201330% of triplets are reached. The sign is uncertain,\
    \ as the proposer says: it loses T1/PD neighbour context, which matters for OA\
    \ labels. It shares a composition-level code path with the running slab-context\
    \ candidate and the developing complementary-window-bags candidate. So whichever\
    \ of those is adopted first changes its implementation base; the proposal already\
    \ describes how to rebase onto both.\n\nI did not admit epoch-paced-bag-size:\
    \ the same mechanism was inconclusive in triplet-sampling. I did not admit label-diverse-batch-composition:\
    \ it largely overlaps the queued residual-balanced batches, which use training\
    \ feedback."
- id: run-level-stratified-jitter
  mechanism_id: cross-epoch-stratification
  parent_idea_id: null
  title: Stratify each band's training draw across epochs, not only within an epoch
  opportunity: Each epoch draws its band jitter independently, so over ten epochs
    some candidate middles are visited repeatedly and others never. Simulated on old
    fold-0 pools, a without-replacement schedule raised distinct middles visited per
    run from 24.29 to 27.87 (+14.7%) at identical counts.
  mechanism: For each (study, type, band), draw one permutation of E sub-strata from
    an epoch-independent stream; epoch e uses sub-stratum perm[e], jittered inside
    it. The per-epoch marginal is unchanged; sampling across the run becomes without
    replacement.
  precedents:
  - autoresearch/campaigns/triplet-sampling/prior-work.md#run-level-stratified-jitter-rejected-for-adoption
