- id: canvases-for-the-pose-in-all-six-views
  mechanism_id: smart-crops
  parent_idea_id: null
  title: 'Canvases of 368 px, scale per knee and the axial pose: smart crops in every
    view'
  opportunity: 'User-ordered on 2026-10-08: every experiment after this one runs with
    shift, turn and scale in all six views, so this seed comes before the seeds that
    move where the crops look: those moves are 8 to 13 mm, on a knee that already
    wanders 7 to 8 mm up and down inside the canvas, and the recipe''s 12.75 mm limit
    would clamp them. Measured premises, effect a guess. (1) Today''s canvases hold
    the window the pose asks for in 69 to 77% of sagittal and coronal images; 11 to
    15% of crops are clamped (3,517 training studies; prior-work.md, Canvas sizes).
    (2) Knee size varies by 8% and the first look estimates it with r 0.94; one scale
    per knee on four views gave x4 +0.0003 and x1 +0.0003 (anatomy-recipe run 7).
    (3) Axial crops are never posed: the knee''s centre sits 2.1 to 2.8 mm (sd) from
    the crop centre, 99% within 8 mm, and the image is turned against the knee''s
    axes by 5 degrees on average, 95% of knees between -13 and +20 degrees; a crop
    that turns with the knee holds the same anatomy in up to 27% less field. (4) A
    canvas of 368 px holds shift, turn, scale 0.87 to 1.13 and jitter for 99% of images
    in every view: 138 mm at 84 mm fields, 151 mm at 93.3 mm, and 194 mm for a 120
    mm axial crop that turns. (5) In the reference the predicted kneecap has 25 to
    27% of its mass on the front edge line of the axial crop, while the femur ends
    37 mm short of the back edge (874 validation studies, outputs/analysis/m/meniscus-map-preview/structures-in-crops.csv):
    the axial crop sits too far back.'
  mechanism: 'The canvas of every view becomes 368 px and the pose gets what the canvas
    allows. (a) Canvases: a margin of 72 px on each side for all six views, replacing
    round(data.view_shift_limit_mm / spacing) for sagittal and coronal and 0 for axial
    (data/dataset.py and ViewWindows.margin); data.view_shift_limit_mm is removed.
    The shift limit becomes 18 mm for sagittal and coronal and 8 mm for axial (the
    99th percentile of the shift asked for). (b) Scale: one size per study from the
    no-gradient first look, exactly as in the frozen candidate of anatomy-recipe run
    7 (scale = clamp(size / 17.087, 0.87, 1.13), 1.0 when a weight sum is zero), on
    all six views. (c) Axial pose: the crop is centred, front to back, on the box
    from 30 mm behind the back of the femur shares to the front of the kneecap shares
    (share-weighted 5th and 95th percentiles in the fitted frame, read in the first
    look), and side to side on the frame''s centre; the crop is rotated so the frame''s
    medial axis, projected on the image plane, lies along the image row direction,
    clamped to 20 degrees. The sagittal and coronal centres and turn are the incumbent''s.
    Training jitter applies to every view. The first look stays the central 224 px
    of the canvas at scale 1.'
  precedents:
  - 'crop-size-per-knee-from-the-first-look (anatomy-recipe run 7): x4 +0.000317,
    x1 +0.000338, 1.061 times the incumbent''s time.'
  - 'coronal-fluid-crops-at-108-mm-2 and sagittal-fluid-crops-at-112-mm-3: canvases
    of about 354 and 366 px trained at 1.06 and 1.12 times the incumbent.'
  - 'hand-views-patellofemoral-axial-zoom (learnable-views run 44, 2026-10-03): a
    second, rule-placed 84 mm axial view, -0.0013, before the anatomy map.'
  novelty: First canvases sized from the measured need, first scale on all six views,
    first pose of the axial views.
  coverage: Every study and every view.
  exploitation: 'Read the macro at both multipliers against the incumbent, then per
    label with MCL, PF OA, Effusion, Synovitis and Baker''s named, and the validation
    AUC of axial fluid alone. Report the share of each step spent waiting for data,
    the peak host memory and the training time: the canvases are the open cost of
    the campaign. Shown wrong by: the share of crops at a limit not falling below
    the incumbent''s, the applied axial turn and shift not matching the measured spread,
    or a mean scale away from 1.00.'
  budget: Canvases of 368 px against 306 to 314 px (sagittal, coronal) and 224 px
    (axial), and every slice resampled once. Up to 1.25 times the incumbent's training
    time from those two causes only.
  implementation: 'Follow the environment paragraph of the developer instructions.
    modeling/model.py, data/dataset.py, config.py, configs/training.yaml and training/lightning.py
    for the metrics below. Reuse the reviewed code for the scale and the cut with
    a scale inside the affine: /home/claudio/src/knee-abnormality/outputs/autoresearch/anatomy-recipe/experiments/crop-size-per-knee-from-the-first-look-20261008T143648Z-ea93063b/source
    (changes.diff beside it), extended to the axial views; do not write a second path
    for axial. Each slice is sampled once. No option selects fixed crops or the old
    margins. The review asks for a logged proof that the change is active: log on
    validation only, through _log_epoch_metric, the mean absolute axial shift in mm,
    the mean absolute axial turn in degrees, the mean and the standard deviation of
    the scale, and the share of crops at a shift, turn or scale limit (five metrics).
    Report on one batch that a study given scale 1, zero axial shift and zero axial
    turn yields crops equal to the incumbent''s within one grey level, and the canvas
    size of each view. Update the view_policy and preparation entries of SPATIAL_TOKEN_IDENTITY.'
