- id: joint-centre-taught-from-the-masks
  mechanism_id: joint-centre
  parent_idea_id: null
  title: Teach the knee's centre from the masks instead of taking the centroid of
    bone mass
  opportunity: 'User decision of 2026-10-08: no hand-measured correction on the centre;
    improve the learning. Measured premise, effect a guess. Every crop centre and
    every routing position is built on the knee''s centre, which is the centroid of
    femur and tibia shares near the joint plane. That is the centre of the bone mass
    in view, not the plateau centre the masks define: against the mask''s plateau
    centre it is off by 1.6 to 1.8 mm front to back and 0.8 to 1.0 mm across on the
    validation mask knees (val_anatomy_centre_error_front_mm_mean and _across_mm_mean
    in rn18-meniscus-map; quote its final values), and the recipe once carried re-measured
    crop targets to absorb it. The centre has no target of its own; its error is only
    logged.'
  mechanism: A new head on the 7 by 7 tokens (one linear layer to three values, zero-initialised)
    predicts for each token the offset in millimetres, in patient coordinates, from
    the token's position to the plateau centre of its knee. It is trained on the knees
    with masks (the plateau centre is in knees.json of the prepared bone targets,
    already read by AnatomyTargets.study_centres) with a smooth L1 loss over valid
    tokens weighted by their detached femur plus tibia share, added to the anatomy
    loss at the same weight. In KneeAbnormalityModel.anatomical_frames the knee's
    centre becomes the share-weighted mean over the same tokens of position plus predicted
    offset, detached, then projected on the joint plane as today; the centroid of
    bone mass is removed. Where the weight sum is zero the previous centre is kept,
    as today.
  precedents:
  - 'joint-centre-from-the-map-instead-of-the-spots (anatomy-masks seed 2, adopted):
    the centre read from the map; S125 0.954.'
  - 'A height predicted per token as the plane''s source (2026-10-07): closed; it
    replaced the plane fit. This seed keeps the plane fit and teaches only the centre.'
  novelty: First supervised target for the knee's centre.
  coverage: The 400 training knees with bone masks for the loss; every study for the
    centre.
  exploitation: 'Read val_anatomy_centre_error_front_mm_mean and _across_mm_mean against
    the incumbent''s, the macro at both multipliers, and the labels routed by side
    and height (both menisci, both OA labels, PF OA). Shown wrong by: the centre error
    not below the incumbent''s on both axes.'
  budget: One linear layer on existing tokens and one masked loss. Within 1.02 of
    the incumbent's training time.
  implementation: 'Follow the environment paragraph of the developer instructions.
    modeling/model.py, training/anatomy.py and training/lightning.py. The proof of
    activation is already logged (the two centre errors and their spread); add one
    validation metric, the mean absolute predicted offset in mm. The label loss must
    not reach the new head through the centre: the centre is read from detached values.
    Report on one batch the centre error before and after for the same weights with
    the head at zero (they must be equal to the incumbent''s only if the head''s zero
    prediction is combined as specified; say which) and that no route or crop reads
    a second centre. Update SPATIAL_TOKEN_IDENTITY where it describes the centre.'
  open_choices: None.
  dependencies: []
  priority_rationale: Everything the poses look at is measured from this centre.
  status: completed
