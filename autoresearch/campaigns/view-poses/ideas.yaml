- id: meniscus-head-on-the-14-by-14-grid
  mechanism_id: meniscus-head-grid
  parent_idea_id: null
  title: Teach the menisci on the 14 by 14 grid of the previous backbone stage
  opportunity: 'User-ordered on 2026-10-08. Measured premise, effect on the labels
    a guess. In the reference the meniscus head reads the 7 by 7 tokens, 12 to 17
    mm a side, and a meniscus horn is about 10 mm wide and 5 to 7 mm thick, so a meniscus
    is never more than a small part of a token. On validation the head overlaps the
    mask far less than the bone map does, and the thinner the class the worse: femur
    and tibia 0.89, joint line 0.75, kneecap joint 0.65, lateral meniscus 0.39, medial
    meniscus 0.36 at epoch 3 of rn18-meniscus-map (soft Dice per token; read the final
    values from its metrics.csv and quote them in the report). Everything planned
    for the menisci, placing a detail crop and routing the meniscus labels, needs
    their position to a few millimetres.'
  mechanism: 'The meniscus head moves from the 7 by 7 tokens to the grid of the backbone
    stage before the last (stride 16, 14 by 14 at 224 px). Its input at each of the
    196 positions is the stride-16 feature map projected to 256 by a new linear layer,
    plus the existing 256-wide token of the stride-32 cell that contains it, repeated
    to the finer grid (nearest, each stride-32 cell to its four stride-16 cells).
    The head stays one linear layer to the three classes (neither, medial, lateral),
    zero-initialised. Its targets are looked up by the existing AnatomyTargets.token_shares
    at the stride-16 anchors with a footprint of 16 px. The label path, the bone map,
    the frame, the routing and the pooling stay on the 7 by 7 tokens and are byte-identical.
    For later use the encoded batch also carries the meniscus shares per 7 by 7 token
    as the mean of the four finer predictions. The stride-16 anchors come from the
    verified geometry of that stage: add its mapping to BACKBONE_MAPPINGS in modeling/spatial_tokens.py
    and check it against the layers as the stride-32 one is. A finer position counts
    under the same validity rule as a token.'
  precedents:
  - 'rn18-meniscus-map (the reference): the same head on 7 by 7 tokens, macro level
    with report-attribute-loss-off-2 through the epochs seen.'
  - 'stride-16 runs of 2026-09-22 on ReXNet-200: features of that stage alone lost
    0.0042 as label tokens; summed with the deep features they tied. The reason this
    head reads both.'
  novelty: First use of the finer grid for a taught map, with the label path untouched.
  coverage: The DESS knees for the head's loss (about 213 in training on fold 1);
    every study for the features it shapes.
  exploitation: 'Read the meniscus overlap per class on validation against the reference''s
    final values, the macro at both multipliers, and the two meniscus labels. Shown
    wrong by: the overlap of both meniscus classes not above the reference''s.'
  budget: One linear projection and one head on a feature map the backbone already
    computes. Within 1.03 of the incumbent's training time.
  implementation: 'Follow the environment paragraph of the developer instructions.
    modeling/model.py, modeling/spatial_tokens.py, training/lightning.py and training/anatomy.py.
    No option selects the 7 by 7 head. Write nothing that loops over positions or
    images. The proof of activation is already logged: val_meniscus_overlap_medial_meniscus,
    val_meniscus_overlap_lateral_meniscus and val_meniscus_tokens (expect about four
    times the reference''s token count); add no other metric. Report on one batch
    the number of positions per image (196), the pixel anchors of the first two against
    the stage''s geometry, and that the label logits are bit-identical to the incumbent''s
    for the same weights. Update SPATIAL_TOKEN_IDENTITY where it describes the maps.'
  open_choices: None.
  dependencies: []
  priority_rationale: Ordered first by the user; the menisci have to be sharp before
    anything is placed or routed by them.
  status: completed
