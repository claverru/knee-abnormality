- id: a-crop-centre-per-contrast
  mechanism_id: crop-centre
  parent_idea_id: null
  title: Give the two contrasts of a plane their own crop centre
  opportunity: 'User-ordered on 2026-10-08: one crop per plane-contrast is settled,
    so this seed is the base of every later pose seed. Measured premise, effect a
    guess. The two series of a plane are read for different things (image study of
    102 training studies and the literature; prior-work.md, What each view is read
    for): the fluid series for effusion, the pouch above the kneecap, the kneecap
    joint and marrow; the T1/PD series for the joint line (meniscal signal, fracture
    lines, bone spurs). Each view alone in report-attribute-loss-off-2: sagittal fluid
    is the best single view for both menisci and PF OA, sagittal T1/PD for ACL. On
    the masks the kneecap''s front lies 56 mm ahead of the joint centre and its top
    55 mm above the joint line, the back of the condyles 23 mm behind, and the bone
    edges 37 mm to each side; the sagittal crop''s half-width is 47 mm, and the whole
    kneecap is inside the fluid sagittal crop in 26% of series today. Today both contrasts
    of a plane share one centre. In the reference 56% of the predicted kneecap''s
    mass lies on the front edge line of the fluid sagittal crop and 78% on that of
    the T1/PD one (874 validation studies; prior-work.md), and on the 1 mm masks the
    whole kneecap is inside the fluid sagittal crop in 26% of series: the move needed
    is about 13 mm forward, more than the recipe''s 12.75 mm limit, which is why this
    seed follows the canvas seed.'
  mechanism: 'SAGITTAL_JOINT_TARGET_MM and CORONAL_JOINT_TARGET_MM are removed (modeling/model.py).
    Each of the four sagittal and coronal views gets its own centre, read per study
    from the first look''s detached bone shares in the fitted frame, as share-weighted
    5th and 95th percentiles along each frame axis; the centre is the box''s midpoint,
    and where a class has no mass the joint centre is used for that axis. Fluid sagittal:
    from the back of the femur shares to the front of the kneecap shares, and from
    the tibia shares within 30 mm below the joint plane to the top of the kneecap
    shares (forward and up, onto the kneecap joint). T1/PD sagittal: the joint centre,
    with no offset. Fluid coronal: the femur and tibia shares from 30 mm below the
    joint plane to 45 mm above it (up, toward the femoral side where the collateral
    injuries and the pouch are seen). T1/PD coronal: the joint centre, with no offset.
    The turn, the fields and the axial views are unchanged. The canvases, the scale
    and the shift limits are the incumbent''s (368 px and 18 mm for these views once
    the canvas seed is in); the share of crops at the shift limit is logged, since
    a target the canvas does not let the crop reach is not a wrong target.'
  precedents:
  - 'kneecap-inside-the-fluid-sagittal-crop-per-knee-2 (anatomy-recipe run 6): PF
    OA +0.0015, Baker''s -0.0013, macro -0.0002.'
  - 'joint-centre-from-the-map-instead-of-the-spots (anatomy-masks seed 2): the centre
    read from the map, with targets re-measured by hand to absorb its bias; S125 0.954.'
  novelty: First pose that differs between the two contrasts of a plane.
  coverage: Every study; the four sagittal and coronal views.
  exploitation: 'Read the macro at both multipliers against the incumbent, then PF
    OA, Effusion, Synovitis and Baker''s (fluid views) and both menisci, ACL and Fracture
    (T1/PD views), with the validation AUC of each of the four views alone against
    the incumbent''s. Shown wrong by: no view''s own AUC moving for the labels its
    centre was chosen for.'
  budget: 'Same cost as the incumbent: weighted percentiles once per study on tensors
    the first look already holds. Within 1.02 of its training time.'
  implementation: 'Follow the environment paragraph of the developer instructions.
    modeling/model.py and training/lightning.py for the metrics below. The boxes are
    computed once per study inside the existing first look; no loop over studies or
    views, no second evaluation of the frame. The review asks for a logged proof that
    the change is active: log on validation only, through _log_epoch_metric, the mean
    forward position of the fluid and of the T1/PD sagittal centre from the joint
    centre in mm, the mean upward position of the fluid and of the T1/PD coronal centre,
    and the share of crops at the shift limit (five metrics). Report on one batch
    that the two contrasts of a plane now differ in centre and that axial crops are
    bit-identical to the incumbent''s. Update the view_policy entry of SPATIAL_TOKEN_IDENTITY.'
  open_choices: None.
