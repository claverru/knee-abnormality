  title: Axial fluid on a fine canvas, sagittal fluid wide
  opportunity: 'Measured premise, effect a guess. Axial fluid alone scores PF OA 0.828 against 0.830 for
    the best view, at the coarsest pixel of the recipe; it is also the best single view for Effusion,
    Synovitis and Baker''s, which is the cost side of this trade. Each view alone in report-attribute-loss-off-2
    (prior-work.md, Each view alone): the T1/PD views have the finest canvases (0.375 mm) and are the
    best single view for ACL only; the fluid views are best for eleven labels; axial fluid is best for
    five at 0.536 mm. The fields of the recipe were set in the order they were tried on 2026-10-02 and
    no assignment was ever compared with another. This run asks whether PF OA, one of the weakest labels
    (0.90), is limited by 0.54 mm pixels on its strong view, and what the wide labels pay.'
