- id: rn18-upper-stage-batch-renorm
  mechanism_id: batch-renormalization
  parent_idea_id: null
  title: Reduce upper-stage dependence on correlated study batches with Batch Renormalization
  opportunity: The incumbent flattens after epoch 5 despite continuing loss reduction.
    Its backbone processes many correlated slices from eight studies, and DSU perturbs
    stride-8 features before layer3. Training uses batch statistics whereas inference
    uses running statistics. This creates a plausible representation mismatch in upper
    stages, but its magnitude has not been measured. Larger image counts do not establish
    independent normalization samples.
  mechanism: "Replace BatchNorm in layer3 and layer4, including downsample branches,\
    \ with bounded Batch Renormalization. Correct batch-normalized activations using\
    \ detached r=batch_std/running_std and d=(batch_mean-running_mean)/running_std\
    \ before the learned affine transform. Begin with r=1,d=0 for the first 10% of\
    \ optimizer steps; relax bounds linearly to r in [1/3,3] and d in [-5,5] by 30%.\
    \ Retain ordinary running-variance updates and inference normalization. Log applied\
    \ |r\u22121|, |d|, bound-hit fractions and batch/running moment discrepancies.\
    \ Nonzero applied correction after the ramp starts establishes activation."
  precedents:
  - "run_curves.full_detail, rn18-more-triplets: epochs 5\u20139 macro AUC 0.9232\u2192\
    0.9244, loss 2.3467\u21922.2860, with DSU still affecting approximately half of\
    \ acquisitions."
  - 'Incumbent modeling/model.py: _encode_images applies DSU between layer2 and layer3;
    encode_batch flattens sampled acquisitions into one backbone batch.'
  - '[Ioffe, Batch Renormalization](https://arxiv.org/html/1702.03275v2): detached,
    bounded corrections address differences between batch-dependent training representations
    and inference representations, including non-independent minibatches.'
  - The head-first retry already owns frozen-backbone BN adaptation and unfreeze warmup.
    This proposal instead changes upper-stage normalization during ordinary joint
    optimization.
  novelty: A new normalization family. It retains shared convolutional weights, joint
    readout and all augmentations; it neither repeats plane-specific backbones nor
    revisits DSU-strength reductions.
  coverage: Targets a shared representation problem across labels. PF OA and MCL fluctuations
    are exploratory diagnostics, not separate objectives. Batch/running moment discrepancies
    must be measured rather than inferred from AUC alone.
  exploitation: Preserve pretrained affine parameters and running moments, with an
    initial ordinary-BN phase. Keep the accepted acquisition coverage and the existing
