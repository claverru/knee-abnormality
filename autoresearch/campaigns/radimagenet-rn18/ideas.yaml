- id: rn18-learned-intensity-calibration
  mechanism_id: intensity-normalization
  parent_idea_id: null
  title: Learn an identity-initialized monotone intensity map for each series type
  opportunity: The six configured series types share one fixed input standardization
    before the backbone; their type embeddings enter only after feature extraction.
    This leaves the backbone responsible for accommodating sequence-dependent intensity
    relationships. The incumbent's early lead still becomes a late plateau. Trainable
    input calibration could reduce that burden, but no supplied histogram or per-type
    feature analysis proves a normalization mismatch.
  mechanism: Add one monotone piecewise-linear intensity map per configured series
    type, shared across its slices and channels. Use fixed input knots [0, 0.25, 0.5,
    0.75, 1]; four softmax-normalized positive output increments define each map.
    Zero-initialize their logits, producing the exact identity mapping, with endpoints
    fixed at zero and one. Apply after augmentation and the active slice-channel transformation,
    immediately before existing mean/std standardization. Train through the unchanged
    objectives using the inherited head-rate parameter grouping. Log per-type slopes,
    parameter-gradient RMS and applied image-change RMS against the identity map on
    the identical input tensor.
  precedents:
  - 'Incumbent modeling/model.py, encode_batch: augmented images pass through the
    slice-channel transformation and fixed channel mean/std before _encode_images;
    token_type is already available at this point.'
  - The native-contrast ablation failed adoption. This proposal retains contrast mixing
    and all other augmentations, adding a deterministic learned calibration instead
    of reducing augmentation strength.
  - Drozdzal et al. study a low-capacity learned preprocessor for medical-image normalization.
    Their segmentation results are conceptual precedent; the proposed small monotone
    maps are a different, unvalidated adaptation. [Learning Normalized Inputs](https://arxiv.org/abs/1702.05174)
  novelty: Introduces trainable intensity normalization while preserving the pretrained
    input function at initialization. It changes neither augmentation probabilities
    nor backbone specialization, and differs from the queued upper-stage Batch Renormalization
    mechanism.
  coverage: All configured series types receive the same map architecture. Conditioning
    uses existing series-type metadata only, with no scanner identity, new labels
    or validation-fitted statistics. Padding stays zero before standardization.
  exploitation: Retains 36-triplet coverage, zero series dropout, DSU and the fixed
    losses. Identity initialization avoids deliberately perturbing the useful pretrained
    starting representation.
  budget: "Keep ten epochs, batch size eight and seed 1533697213. Adds 24 trainable\
    \ logits, pointwise interpolation and input-gradient propagation through the stem.\
    \ No additional images or model passes are needed. A planning estimate is 1,500\u2013\
    1,610 s, but interpolation and stem-backward overhead are unmeasured; the exact\
    \ 1,627.32 s ceiling remains binding."
  implementation: Add the calibration module under modeling/ and insert it in model.py
    before standardization. Retain quantile preparation, geometry, mean/std and augmentation
    behavior. Add telemetry in training/lightning.py; positive applied calibration
    RMS at epoch 0 is the activation signature, measured by comparing mapped and unmapped
    versions of the same tensor so augmentation cannot create a false positive. Retain
