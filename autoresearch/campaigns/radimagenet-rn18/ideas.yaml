    \ fraction rose from 0.316 to 0.886; head scale was 1.0 throughout epochs 1\u2013\
    9; report-head scale was always 1.0; scanner scale ranged approximately 0.269\u2013\
    0.322."
  - The decided clipping source, training/lightning.py:configure_gradient_clipping
    and configure_optimizers, confirms four independently capped partitions. The incumbent
    _scanner_confusion_step detaches features for classifier fitting and classifier
    parameters for the confusion gradient.
  novelty: Changes partition membership rather than cap strength. It retains one scaling
    factor across all parameters jointly learning the disease and auxiliary representation,
    while separating only the classifier whose fitting gradient does not reach that
    representation.
  coverage: Every optimizer update and all labels. No label-specific objective, supervision
    change or scanner-head architecture change.
  exploitation: 'Log both partitions'' pre/post norms, scales and clipped fractions;
    scanner squared-norm share; and task-scale differences from counterfactual global
    and four-partition clipping. Activation: positive task-scale difference from global
    clipping at epoch 0. Verify identical applied scale across task modules. Retain
