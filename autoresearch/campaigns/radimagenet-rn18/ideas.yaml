- id: rn18-early-stage-anchor
  mechanism_id: anchored-decay
  parent_idea_id: rn18-l2-sp
  title: Anchor only the stem and layer1; leave upper stages free to adapt
  opportunity: Whole-backbone anchoring pulled layer4 drift backward from 0.11768
    at epoch 4 to 0.11342 at epoch 9. Training loss excluding the anchor term ended
    at 2.31418, above its parent's 2.28815. This suggests that constraining upper-stage
    adaptation may offset the benefit of preserving early features; it does not establish
    causality.
  mechanism: "Keep the historical 0.01 squared-distance penalty on pretrained conv1\
    \ and layer1 matrix weights. Apply no anchor penalty to layers2\u20134, restoring\
    \ their incumbent AdamW decay. Early weights remain trainable, including normal\
    \ BatchNorm adaptation. This changes the support of the regularizer rather than\
    \ sweeping its strength. Log early-stage penalties, analytical anchor-gradient\
    \ RMS, and task loss separately from the penalty."
  precedents:
  - 'rn18-l2-sp-20260928T224608Z-2aab3aaf: full-backbone anchoring with tenfold early-stage
    strength. Its metrics.csv supplies the late contraction and penalty-adjusted loss
    diagnosis.'
  - rn18-freeze-stem-layer1 and rn18-layerwise-lr-decay restricted adaptation through
    freezing or learning rates. This proposal preserves ordinary gradient updates
    and applies a soft reference-weight penalty only to early matrix weights.
  - Pretrained-reference L2 regularization is supported as a transfer-learning mechanism
    by [Li et al., Explicit Inductive Bias for Transfer Learning](https://arxiv.org/abs/1802.01483).
    That work does not establish the proposed stage selection.
  novelty: Removes the upper-stage constraint implicated by the recorded contraction
    while retaining the original early-stage anchor coefficient. It is neither whole-backbone
    L2-SP with a different coefficient nor frozen early layers.
  coverage: Retain every study visit, the current input count, all present series,
    fixed sampling geometry, labels, losses and evaluation multipliers. No label-specific
    optimization.
  exploitation: Preserve reusable early RadImageNet features while allowing later
    stages to learn knee-specific representations at incumbent learning rates.
  budget: "At the current 36-triplet, ten-epoch recipe, expect approximately 1,480\u2013\
