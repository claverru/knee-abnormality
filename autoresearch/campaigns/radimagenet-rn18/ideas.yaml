- id: asymmetric-focal-loss
  mechanism_id: disease-loss
  parent_idea_id: null
  title: 'Asymmetric focal loss for the disease targets: gamma+ 0, gamma- 2, negative
    probability shift 0.05'
  opportunity: User seed, unrelated to RadImageNet, meant to transfer to the champion
    recipe. Most label-study pairs are easy negatives; the class-balanced BCE spends
    much of its gradient on them. ASL down-weights easy negatives and drops near-zero
    negatives, which the multi-label literature reports helps ranking metrics such
    as AUC.
  mechanism: 'Replace the disease BCE with ASL on the soft targets y: loss = -[y *
    (1-p)^g+ * log p + (1-y) * p_m^g- * log(1-p_m)] with p = sigmoid(logit), g+ =
    0, g- = 2 and p_m = max(p - 0.05, 0), per label and study, keeping the incumbent''s
    class-balance weights and masking exactly as the BCE does. Auxiliary losses (half-knee,
    report attributes, scanner confusion) are unchanged.'
  precedents:
  - 'Ridnik et al. 2021, Asymmetric Loss for multi-label classification (arXiv 2009.14119):
    g+ 0, g- 4, shift 0.05 as defaults.'
  - Class-balanced BCE adoption and exponent 0.5 (current recipe).
  novelty: First focal-type loss in the project.
  coverage: All studies and the twelve disease labels.
  exploitation: Log the mean ASL positive and negative terms per epoch and the share
    of negatives with p below the shift (zero loss); per-label AUC against the incumbent.
  budget: Same as the incumbent.
  implementation: New option trainer.disease_loss (bce | asymmetric_focal with gamma_positive,
    gamma_negative, negative_shift) in config.py and the loss in the Lightning module;
    the incumbent keeps bce.
  open_choices: 'None for the first run: g+ 0, g- 2, shift 0.05 (user).'
  dependencies: []
  priority_rationale: User seed; runs after the RadImageNet seeds.
  status: completed
  created_revision: 3
  seeded: /home/claudio/src/knee-abnormality/autoresearch/campaigns/radimagenet-rn18/seed-ideas-4.yaml
  experiments:
