- id: rn18-plane-conditioned-upper-statistics
  mechanism_id: plane-conditioned-normalization
  parent_idea_id: null
  title: Separate upper-stage normalization statistics by plane while sharing convolution
    and affine parameters
  opportunity: "The incumbent's macro AUC barely changes across epochs 7\u20139 despite\
    \ falling loss and persistent gradients. Its source combines all planes in each\
    \ upper-stage BatchNorm calculation; plane identity is available before encoding.\
    \ Mixed plane distributions may compromise normalization even when convolutional\
    \ features should remain shared. Plane-conditioned feature moments have not been\
    \ measured, so this is a hypothesis. The rejected independent-backbone experiment\
    \ does not isolate it because it also changed convolutional parameters, readouts,\
    \ supervision and duration."
  mechanism: Partition minibatch and running mean/variance by axial, coronal and sagittal
    plane in every layer3/layer4 normalizer, including downsample branches. Keep one
    shared affine weight/bias and one shared convolutional backbone. Initialize all
    three running-statistic copies from the loaded pretrained state. Convolutions
    still process the combined image batch; only normalization gathers and scatters
    by plane. Training updates each present plane's statistics; evaluation uses its
    corresponding stored statistics. Empty planes receive no update. Preserve the
    incumbent normalization equation and its coefficients.
  precedents:
  - "run_curves/full_detail, rn18-more-triplets: epochs 7\u20139 \xD71 macro AUC 0.9241\u2192\
