  budget: "Keep the current ten-epoch, 36-triplet allocation. Only low-resolution\
    \ layer3/layer4 normalization changes; no additional image pass. A provisional\
    \ estimate is 1,500\u20131,600 seconds, with unfused normalization kernels the\
    \ main runtime risk. The supervisor's measured training time must satisfy the\
