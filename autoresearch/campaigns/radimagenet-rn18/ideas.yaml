    acquisition plane as the domain and retaining shared affine parameters are adaptations
    proposed here.'
  novelty: Separates statistical populations without duplicating learned convolutional
    features or adding plane heads. It differs from pooled Batch Renormalization,
    which addresses batch-versus-running discrepancies while still combining planes.
  coverage: All studies and all existing planes, using existing acquisition metadata.
