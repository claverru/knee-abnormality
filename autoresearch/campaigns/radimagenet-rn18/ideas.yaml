- id: rn18-periodic-backbone-sharpness
  mechanism_id: optimizer-sharpness
  parent_idea_id: null
  title: Use occasional backbone sharpness-aware updates within the existing ten-epoch
    budget
  opportunity: The incumbent's loss continues falling after epoch 5 while macro AUC
    gains only about 0.0012. Larger backbone rates and prolonged high-rate training
    increased drift without improving adoption. This motivates changing update direction
    using local loss geometry rather than increasing movement. Sharpness has not been
    measured. The incumbent also has lower logged final loss than ReXNet, although
    their input and dropout settings differ, so persistent underfitting alone is insufficient
    justification.
  mechanism: After the first warmup epoch, perform one backbone-only SAM perturbation
    every 16 optimizer steps. On those steps, compute the normal fixed loss and unscaled
    gradients, perturb trainable backbone parameters by epsilon=0.05*g/(||g||2+1e-12),
    and recompute the same loss on the same stochastic realization. Restore backbone
    parameters exactly, then make one ordinary AdamW update using second-pass task-network
    gradients and first-pass scanner-classifier gradients. Other steps use the incumbent
    update. Apply incumbent gradient transformations consistently and clipping once
    to the final update gradients. Optimizer moments and scheduler advance once per
    batch.
  precedents:
  - "run_curves/full_detail, rn18-more-triplets: epochs 5\u20139 loss 2.3467\u2192\
    2.2860, \xD71 macro AUC 0.9232\u21920.9244; layer4 drift nearly stops at 0.2214\
    \ despite nonzero gradients."
  - The backbone-rate and schedule-shape ledgers record unsuccessful increases in
    movement. Neither candidate measured local loss sensitivity or used a perturbed-gradient
    update.
  - '[Foret et al., Sharpness-Aware Minimization](https://arxiv.org/abs/2010.01412)
    optimizes loss in a parameter neighborhood and reports generalization gains, including
    fine-tuning experiments. Sparse scheduling and backbone-only perturbations are
    proposed adaptations, not established results from that paper.'
  novelty: Introduces a local parameter-space ascent/descent calculation. It neither
    averages weights nor duplicates the registered second-moment-memory and gradient-centralization
    proposals. Its sparse cadence makes a two-pass mechanism plausible within the
    runtime ceiling.
  coverage: All studies retain their ordinary update and all labels retain the same
    objectives. Approximately one in sixteen post-warmup batches receives an additional
    evaluation; no additional studies are sampled.
  exploitation: Log executed SAM-step count, perturbation norm, paired non-scanner-classifier
    loss increase, and RMS difference between first- and second-pass backbone gradients.
    Positive applied descent-gradient difference at epoch 1 establishes activation.
    Log exact-restoration residual and normalization update counts. Report ordinary
    first-pass loss once, alongside existing per-stage/head drift and gradients. Sharpness
    diagnostics cannot alter the macro adoption rule.
  budget: Keep 10 epochs, batch 8 and 36 triplets at the supervisor's incumbent seed.
    Approximately 246 extra forward/backward passes add about 5.6% to batch computation.
    Scaling the 1,476.7 s parent gives roughly 1,560 s before implementation overhead,
    leaving about 67 s below 1,627.32 s. This is an estimate, not a measured runtime;
    ordinary every-step SAM would not fit.
  implementation: Implement the two-pass optimizer-step control in training/lightning.py,
    with small state/perturbation helpers under modeling if needed. Replay CPU/device
    RNG and augmentation/dropout draws; restore pre-first-pass normalization state
    before replay, then retain only the first pass's running-statistic updates. Suppress
    duplicate metrics and restore original weights before clipping, updating or checkpointing.
    Preserve the detached scanner-classifier update from the first pass. Retain accepted
    input, dropout, normalization, projection and optimizer transformations from any
    newly accepted incumbent; this method adds sparse perturbation steps rather than
    replacing those improvements.
  open_choices: Fix radius 0.05, cadence 16 and backbone-only perturbation for this
    attempt. Sparse perturbations may be too infrequent to matter, and sharpness control
    may impair fitting. Replay bookkeeping and compatibility with any newly accepted
    normalization require careful implementation within the existing precision/harness
    behavior.
