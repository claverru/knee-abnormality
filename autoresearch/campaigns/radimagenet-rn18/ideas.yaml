- id: rn18-convolution-gradient-centralization
  mechanism_id: optimizer-gradient-centralization
  parent_idea_id: null
  title: Centralize convolution gradients before AdamW moment updates
  opportunity: Incumbent stem gradient RMS remains about 0.0024 after epoch 2, and
    layer4 gradient RMS rises from 0.000198 to 0.000279, while validation gains become
    very small. Higher global rates and lower early-stage movement both failed elsewhere
    in the ledger. Changing gradient direction is an inexpensive alternative hypothesis;
    these measurements do not establish that gradient means are harmful.
  mechanism: For each backbone Conv2d weight gradient, subtract its mean over input-channel
    and spatial dimensions independently for each output filter. Apply this once after
    gradient accumulation and precision unscaling, before clipping and AdamW moment
    updates. Leave biases, normalization parameters and all head gradients untouched.
    Preserve the incumbent's rates, betas, decay and schedule. Log removed-gradient
    RMS and removed-energy fraction by stage, alongside raw and centralized gradient
    RMS. A positive removed-gradient RMS at epoch 0 demonstrates activation.
  precedents:
  - "run_curves and original incumbent metrics.csv: layer4 gradient RMS rises 0.00019795\u2192\
    0.00027877 between epochs 2 and 9, despite the late macro plateau."
  - The backbone-rate attempt increased final layer4 drift to approximately 0.3825
    and lost 0.001720; selective anchoring also failed. Neither tested a direction-changing
    gradient transformation.
  - Yong et al. introduce zero-mean gradient centralization and report applications
    to pretrained-network fine-tuning. Their results motivate this experiment, without
    establishing benefit for this recipe. [Gradient Centralization](https://arxiv.org/abs/2004.01461)
  novelty: Changes convolution-gradient direction rather than learning-rate magnitude,
    clipping scope, moment-memory duration or attraction toward pretrained weights.
    It does not duplicate the developing clipping candidate or the already proposed
    shorter-second-moment candidate.
  coverage: Applies to every trainable backbone convolution across all studies and
    labels. Existing normalization and auxiliary objectives remain intact.
  exploitation: Preserves the successful input recipe and pretrained initialization.
    Tests whether a cheap optimizer transformation can improve useful learning within
    the existing ten-epoch allocation.
  budget: "Keep ten epochs, 36 triplets and the incumbent seed. Requires tensor reductions\
    \ and subtraction over convolution gradients, with no additional forward/backward\
    \ pass or persistent optimizer state. Planning estimate: approximately 1,480\u2013\
    1,540 s from the 1,476.7 s parent; actual training must satisfy 542.44\u20131,627.32\
    \ s."
  implementation: Implement the transformation in training/lightning.py within on_before_optimizer_step,
    after recording comparable raw-gradient telemetry and before the active clipping
    implementation. Replace the raw-gradient path for eligible convolution weights;
    retain AdamW and all unrelated behavior. Log per-stage activation, existing pretrained
    drift, raw head gradients and head drift from initialization. If separate-module
    clipping or another unrelated optimizer improvement becomes incumbent, retain
    it and centralize before its clipping operation. No undecided result is required
    for execution.
  open_choices: Use all backbone Conv2d kernels and exact mean subtraction, with no
    strength sweep. AdamW's coordinatewise preconditioning means centralized raw gradients
