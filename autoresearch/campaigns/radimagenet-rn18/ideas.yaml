- id: rn18-task-coupled-scanner-clipping
  mechanism_id: optimizer-clipping
  parent_idea_id: rn18-separate-module-clipping
  title: Clip the shared task network jointly while isolating the detached scanner
    classifier
  opportunity: 'The rejected four-partition implementation changed scaling within
    the task network: backbone clipping scale declined from 0.927 to 0.702, while
    the model head and report-attribute heads were effectively unclipped. Scanner
    gradients dominated norms and were clipped on every step. Thus scanner isolation
    was confounded with changing the relative task-gradient components. Keeping those
    components coupled supplies a specific structural retry; the measurements identify
    the confound, not its causal contribution to the AUC loss.'
  mechanism: Use exactly two clipping partitions. The task partition contains every
    trainable model parameter, including the backbone, pooling/readouts and detectors,
    plus report-attribute heads. The second contains only the detached scanner classifier
    parameters. Apply norm cap 1.0 independently to each partition after unscaling
    and any incumbent gradient transformation, before AdamW updates. This preserves
    the concatenated task-gradient direction during clipping while removing scanner-classifier
    norm coupling. Keep the scanner loss, confusion path, rates, moments and schedule
    unchanged.
  precedents:
