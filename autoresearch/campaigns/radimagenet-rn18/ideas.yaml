    memory scale to 100 updates, or 0.23 epochs. Retain beta1, epsilon, rates, decay,
    warmup and cosine schedule. Add sampled per-stage and head diagnostics for bias-corrected
    second-moment RMS and the preconditioned update RMS, with clearly identified post-clipping
    inputs. Log the actual beta2 of optimizer groups receiving gradients as the activation
    signature. Do not reset moments or change the objective.
  precedents:
  - Original rn18-more-triplets metrics.csv supplies the unrounded head and layer4
    gradient RMS endpoints. Its effective recipe uses beta1=0.9, beta2=0.999 and 437
    optimizer updates per epoch.
  - 'Incumbent training/lightning.py: build_optimizer passes one beta pair to AdamW;
    configure_optimizers supplies the shared cosine multiplier.'
  - '[Kingma and Ba, Adam](https://arxiv.org/pdf/1412.6980): adaptive first- and second-moment
    estimates define the preconditioner. The shorter-memory choice here is a campaign
    hypothesis, not a result established by that paper.'
