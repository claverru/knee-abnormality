    AdamW uses beta2=0.999, an approximately 1,000-update memory scale, or 2.29 epochs
    at 437 updates per epoch. A slowly adapting denominator could respond differently
    to these opposing trends. Actual moment lag is unmeasured, and the logged RMS
    values precede clipping.
