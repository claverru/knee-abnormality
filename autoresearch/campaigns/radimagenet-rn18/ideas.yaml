  decision: reject
- id: soft-label-101-bins
  mechanism_id: disease-head
  parent_idea_id: null
  title: Predict 101 bins per label and train each to the bin of its soft label
  opportunity: User seed, unrelated to RadImageNet, meant to transfer to the champion
    recipe. The soft targets encode graded confidence (0.85 is not 1); a sigmoid with
    BCE regresses toward them, while a distribution over bins can represent uncertain
    and multimodal cases and gives the ranking a finer signal.
  mechanism: 'Each disease label gets a 101-way softmax over bins 0..100 (bin k means
    probability k/100) instead of one sigmoid logit. Training: cross-entropy to the
    bin round(100 * y) of the soft target y (0.85 -> bin 85), with the incumbent''s
    class-balance weights and masking per label and study. The output probability
    used for validation, prediction and AUC is the expected value sum_k softmax_k
    * k/100. Auxiliary heads and losses unchanged.'
  precedents:
