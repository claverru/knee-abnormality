ideas:
- id: teacher-share-0125
  mechanism_id: teacher-share
  parent_idea_id: teacher-share-025
  title: Train the student on seven eighths silver labels and one eighth teacher predictions
  opportunity: 'Evidence-backed. On fold 0 the share orders 0.25 > 0.5 > 1.0 on all three measures: 0.25
    against 0.5 gave +0.001638 at x4 (95% +0.000553 to +0.002808), +0.001549 at x1 and -0.000026 on gold
    (teacher-share-025-rerun); 1.0 against 0.5 gave -0.002813 at x4, -0.002453 at x1 and -0.003081 on
    gold (teacher-share-100). The optimum is at or below 0.25 and no point below 0.25 has been run (run-notes.md).'
  mechanism: 'Set distillation.teacher_share: 0.125 in configs/training.yaml, whatever the incumbent''s
    share is. Label = 0.875 * silver + 0.125 * teacher, raw joint teacher values. No source change.'
  precedents:
  - 'teacher-share-025-rerun against teacher-share-050, fold 0: +0.001638 at x4, adopted.'
  - 'teacher-share-100 against teacher-share-050, fold 0: -0.002813 at x4, rejected.'
  novelty: First point below 0.25 on the clean split.
  coverage: Every training study.
  exploitation: 'Read both scores against the incumbent and against the runs at 0.25 and 0.5. Replaces
    the incumbent''s share. Shown wrong by: the overall AUC at x4 below the run at 0.25.'
  budget: Same cost as the incumbent.
  implementation: 'configs/training.yaml only (distillation.teacher_share: 0.125). Changes no source.'
  open_choices: None.
  dependencies: []
  priority_rationale: Continues the share range on the side that won.
