- id: share-from-plane-agreement
  mechanism_id: plane-agreement
  parent_idea_id: null
  title: Lean on the teacher where its planes agree against the silver label, and
    on the silver label where they disagree
  opportunity: A guess. A teacher can be read one series type at a time. When its
    sagittal, coronal and axial readings each say positive and the silver label says
    negative, the silver label is likely wrong; when the planes disagree among themselves
    the teacher is unsure. A fixed share treats both cases alike. Nothing is known
    yet about the single-plane readings (prior-work.md, Single-plane readings), so
    this run also reports them.
  mechanism: 'In data/labels.py, per study and label: take the sigmoid of the single-plane
    logits of the series types the study has, and their standard deviation d. The
    share is s = clip(s0 * (1 - d / d90) + s0 * 0.5, 0, 1) with s0 the incumbent''s
    share and d90 the 90th percentile of d for that label over folds 1 to 4, so full
    agreement gives 1.5 * s0 and the most divided tenth 0.5 * s0. The teacher value
    mixed in stays the joint one, prepared as in the incumbent.'
  precedents:
  - 'None: no run has saved or used single-plane readings.'
  novelty: First share that differs between studies.
  coverage: Every training study with at least two series types; the others keep the
    incumbent's share.
  exploitation: 'Report before training, from the teacher table: the AUC of each series
    type''s reading per label against the silver labels, and the share of cells where
    all planes are on the other side of 0.5 from the silver label. Read both scores
    against the incumbent; the gold score is the one this run is expected to move.
    Shown wrong by: single-plane AUCs near 0.5, or the gold AUC below the incumbent
    by more than 0.002.'
  budget: Same cost as the incumbent.
  implementation: 'data/labels.py and config.py (distillation.share_from_agreement:
    true). Replaces the fixed share per study and label. Report the label-table figures
    and the two measurements above.'
  open_choices: None.
  dependencies: []
  priority_rationale: The first use of the single-plane readings, and a label-table
    change only.
  status: completed
  created_revision: 1
  seeded: /home/claudio/src/knee-abnormality-student-distillation/autoresearch/campaigns/student-distillation/seed-ideas-2.yaml
