- id: teacher-share-050
  mechanism_id: teacher-share
  parent_idea_id: null
  title: Train the student on half silver labels and half raw teacher predictions
  opportunity: 'Evidence-backed. This is the first-round recipe: students beat their
    teachers on every fold (ResNet-50 +0.0034 and ReXNet-200 +0.0090 pooled out of
    fold) and five ResNet-50 students scored 0.957 public against 0.954 for one teacher
    (prior-work.md, The first round). Those gains were measured on folds four of five
    teachers had trained on; this run measures the same recipe on a fold no teacher
    has seen.'
  mechanism: 'Set distillation.teacher_share: 0.5 in configs/training.yaml. For every
    study of folds 1 to 4 and every label the training label is 0.5 * silver + 0.5
    * teacher, where teacher is the sigmoid of the joint logit of the teacher table
    and silver is the rebuild_state_v2 value. The teacher values are raw. No source
    change.'
  precedents:
  - 'rn18-oof-blend, ResNet-18 fold 0, leaky: +0.0015 at x4 (95% +0.0001 to +0.0031).'
  - 'Refined ResNet-50, five folds, leaky: +0.0034 pooled out of fold; 0.957 public
    (S106).'
  novelty: First measurement of the first-round recipe on a held-out fold and on gold
    labels.
  coverage: Every training study.
  exploitation: 'Adopted without a comparison (contract, Reference): it is the incumbent
    every later seed is compared with. Report its overall macro AUC at x1 and x4 and
    its gold macro AUC at x4 on fold 0, and both per label.'
  budget: 'Same cost as the reference: the labels are built once before training.'
  implementation: 'configs/training.yaml only (distillation.teacher_share: 0.5). Changes
    no source. Report the label-table figures of the developer instructions.'
  open_choices: None.
  dependencies: []
  priority_rationale: First, and adopted by the definition's forced_adoptions.
  status: completed
  created_revision: 0
  seeded: /home/claudio/src/knee-abnormality-student-distillation/autoresearch/campaigns/student-distillation/seed-ideas.yaml
