- id: teacher-share-per-label
  mechanism_id: teacher-share
  parent_idea_id: null
  title: Give each label its own teacher share, from how well the teachers predict
    that label
  opportunity: A guess. The teachers are not equally good on every label, so one share
    for all twelve gives a weak teacher label as much weight as a strong one. The
    teachers' own out-of-fold AUC per label against the silver labels of folds 1 to
    4 is known without touching fold 0.
  mechanism: Replace the single share by twelve, distillation.teacher_share_per_label.
    Compute each label's AUC of the teacher table's joint value against the silver
    label (thresholded at 0.5) over folds 1 to 4. Rank the twelve labels by that AUC;
    the four highest take the incumbent's share plus 0.25, the four lowest the incumbent's
    share minus 0.25, the middle four the incumbent's share, each clipped to 0 to
    1. Write the twelve values into configs/training.yaml and report the ranking.
  precedents:
  - 'A temperature per label at inference, 2026-10-04: a free value per label did
    not replicate, the stable part was two labels moving together.'
  novelty: First share that differs between labels.
  coverage: Every training study.
  exploitation: 'Read both scores against the incumbent and the per-label table split
    by the three groups. Shown wrong by: the four labels given more teacher losing
    on average on both scores.'
  budget: Same cost as the incumbent.
  implementation: config.py (the per-label field replaces the single share), data/labels.py
    (the mix reads the label's share) and configs/training.yaml. Replaces the single
    share. Report the twelve AUCs, the three groups and the label-table figures.
  open_choices: None.
  dependencies: []
  priority_rationale: Uses the share runs' incumbent and needs no reading from the
    planes.
  status: completed
  created_revision: 0
  seeded: /home/claudio/src/knee-abnormality-student-distillation/autoresearch/campaigns/student-distillation/seed-ideas.yaml
  experiments:
