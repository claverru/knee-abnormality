- id: target-per-plane
  mechanism_id: plane-targets
  parent_idea_id: null
  title: Train each series type's readout against the teacher's reading from that
    series type, beside the joint target
  opportunity: 'A guess. The student has one classifier vector per series type and
    label, but it is only ever trained through the joint prediction, so a series type
    that the attention ignores for a label learns nothing for it. The teacher''s single-plane
    readings give each of them its own target: up to six targets per label and study
    instead of one. It should matter most for studies with missing or unusual series.'
  mechanism: 'In the training step, besides the joint loss: for each series type present
    in the study pool the student''s tokens of that type alone (pool_encoded with
    the view) and add the soft-target BCE of that logit against the sigmoid of the
    teacher''s reading from the same series type, averaged over the types present,
    weighted by distillation.plane_target_weight: 0.5. The teacher''s single-plane
    values are prepared as the incumbent prepares the joint ones. Validation and prediction
    are unchanged.'
  precedents:
  - Per-view classifiers are listed in the auxiliary-loss campaign of the backlog,
    unrun.
  novelty: First target per series type.
  coverage: Every training study; a study with one series type gets one extra target.
  exploitation: 'Log on validation the AUC of each series type''s own reading per
    label. Read both scores against the incumbent, and the overall AUC on fold-0 studies
    with fewer than six series types. Shown wrong by: the single-plane validation
    AUCs rising while both scores fall.'
  budget: 'Up to 1.08 of the incumbent''s training time: six extra poolings of tokens
    already encoded, no extra forward pass.'
  implementation: 'training/lightning.py (the added loss), data/labels.py (the per-type
    targets) and config.py (distillation.plane_target_weight). Adds no forward pass:
    reuse the encoded batch of the joint loss. At most five new validation metrics.
    Report on one batch the joint loss unchanged with the weight at zero.'
  open_choices: None.
  dependencies: []
  priority_rationale: The only seed that changes what the student is trained on; last,
    on the settled labels.
  status: completed
  created_revision: 1
  seeded: /home/claudio/src/knee-abnormality-student-distillation/autoresearch/campaigns/student-distillation/seed-ideas-2.yaml
  ranking_rationale: 'Block and park reranked-fold-teachers at its own implementation
