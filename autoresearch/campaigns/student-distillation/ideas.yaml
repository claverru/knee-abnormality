    which says the small differences are the helpful part of the teacher and the large
    ones the harmful one; the next seed is then the complement (teacher only where
    |d| <= 0.18). A gain alone does not separate the gate from less teacher: the table''s
    shift equals that of a plain share of 0.152, so a gain is read with the per-label
    table, where the gate predicts the largest gains on the labels with the highest
    jitter ratio.'
  budget: Same cost as the incumbent; the labels are built once before training.
  implementation: 'src/knee_abnormality/config.py (DistillationConfig gains teacher_gate,
