  status: completed
  created_revision: 47
  ranking_rationale: "Both new proposals are admitted; their supporting measurements\
    \ reproduce from existing artifacts with no GPU or validation-fitted quantity.\n\
    \nshared-shift-projected-bce ranked above the two standing class-weight ideas.\
    \ It is the only candidate so far aimed at a component of the incumbent's own\
    \ gradient that provably cannot move the scored metric (per-label shift direction),\
    \ it carries no coefficient, temperature or pair pool, so a null result indicts\
    \ the mechanism rather than an unswept scale \u2014 the exact confound that made\
    \ shared-bce-ranking uninformative about magnitude \u2014 and its cost (one masked\
    \ mean per label per step) is below every prior candidate's overhead, well inside\
    \ the ~182 s of ceiling headroom. Its uncertainty is honest and stated: output-space\
    \ energy is not parameter-space progress.\n\nshared-biproportional-weights ranked\
    \ third, above shared-tempered-balance and shared-soft-mass-balance, because it\
    \ is parameter-free (nothing to sweep, unlike tempering's exponent), it provably\
    \ preserves the per-label positive/negative mass property the measured balanced-BCE\
    \ gain rests on (fitted ratio 1.000 for all twelve labels), and it corrects a\
    \ measured, never-chosen 2.2x influence advantage for abnormal studies that pushes\
    \ in the same direction as control B's already over-expressed common abnormality\
    \ factor. It ranks below the projection because equal study influence is a design\
