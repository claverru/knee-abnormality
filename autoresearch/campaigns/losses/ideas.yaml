ideas:
- id: shared-bce-ranking
  mechanism_id: shared-pointwise-ranking-hybrid
  parent_idea_id: null
  title: Shared balanced BCE plus pairwise logistic ranking
  opportunity: The current objective supervises each observed cell independently while
    the metric evaluates ordering within each target. A shared ranking term may change
    useful gradients without giving up soft pointwise supervision.
  mechanism: Add pairwise logistic ranking to the current class-balanced soft BCE.
    Apply the same pair-eligibility rule, temperature, and mixture coefficient to
    all labels. Average pairs within each label before combining labels; retain BCE
    and define the ranking contribution when no pairs exist.
  precedents:
  - docs/backlog/small-changes.md#ranking-aware-loss
  - docs/research/auc_loss_approaches.md
  - docs/research/per-label-losses.md#ranking-needs-usable-study-pairs
  novelty: Adopts the existing untrained ranking-hybrid proposal into this campaign.
    The campaign owns its execution; the general backlog remains read-only provenance.
    Unlike the per-label proposal, one formula and scalar mixture apply to all twelve
    targets.
  coverage: Keep all observed soft BCE cells. Mask missing targets and self-pairs;
    record usable positive/negative pairs and zero-pair batches per target.
  exploitation: Emphasize incorrectly ordered training-study pairs while retaining
    pointwise gradients for rare targets and batches without usable pairs.
  budget: Use current-batch logits and targets only, with no additional model pass,
    changed batch composition, extra steps, or precomputation. Preserve the fixed
    recipe, ten epochs, 4380 steps and sealed runtime ceiling.
  implementation: Add the objective under training/losses and connect it through training_step.
    Put shared settings under trainer.loss. Compute stable float32 softplus pair differences.
    Record the exact treatment of uncertain soft targets, reduction, zero-pair case,
    and component scales.
  open_choices: Choose one defensible shared scale and pair rule using training data
    and existing research. Do not sweep coefficients or choose them per label. If
    pair coverage is inadequate, record that limitation rather than changing the data
    loader or silently importing validation predictions.
  dependencies: []
  priority_rationale: 'Recommend first: an existing concrete proposal directly tied
    to ordering, cheap with current logits, and conservative about retaining supervision.'
  status: completed
  created_revision: 4
  ranking_rationale: "All four proposals stay inside the shared-loss boundary: one\
    \ formula and scalar parameters for all twelve targets, current-batch logits only,\
    \ no data/optimizer/inference change, and edits confined to the allowlisted loss\
    \ files. None revives per-label selection, classifier banks, learned mixtures,\
    \ study resampling, or a dedicated AUC optimizer. I accept three and open the\
    \ queue with them.\n\nshared-bce-ranking first: the metric is per-target ordering\
    \ while the incumbent supervises cells independently, so this is the mechanism\
    \ with the most direct alignment to the objective gap, and retaining BCE covers\
    \ the batches with no usable pair. It is implementable on existing logits (lightning.py:305-320)\
    \ with no added pass.\n\nshared-balanced-focal second: an independent pointwise\
    \ mechanism changing the easy/hard cell allocation, elementwise on the same logits,\
    \ with external ACL/MCL motivation whose transfer to macro AUC here is untested.\n\
    \nshared-tempered-balance third: grounded in a locally measured baseline and the\
    \ cheapest to implement (reuses stored training counts, lightning.py:60-87), but\
    \ the incumbent full inverse-frequency weighting already succeeded, so the incremental\
    \ headroom is the least certain of the three. Its tempering and normalization\
    \ are bundled; the result attributes to the combined rule, not to either factor.\n\
    \nshared-delayed-ranking is contract-compliant and not rejected, but I retain\
    \ it as a surplus proposal rather than queueing it. It reuses the same ranking\
    \ helper and pair rule as shared-bce-ranking, and its only new degree of freedom\
    \ is the transition point. Choosing that transition without the always-on hybrid's\
    \ measured behavior \u2014 particularly observed pair coverage and the ranking\
    \ component's realized scale \u2014 would be an unmotivated timing guess, and\
    \ its own priority note concedes it is most informative afterwards. It should\
    \ be reconsidered once shared-bce-ranking reports.\n\nOne scale interaction the\
    \ first implementation must resolve explicitly: the incumbent reduces BCE as a\
    \ single pooled mean over all observed cells (lightning.py:117), so labels contribute\
    \ in proportion to observation counts. A ranking term averaged within each label\
    \ and then across labels implies uniform label weighting instead. The mixture\
    \ coefficient therefore cannot be read as a plain component ratio; the effective\
    \ per-label weighting of both components must be recorded."
  experiments:
  - shared-bce-ranking-20260920T112958Z-a2e23db7
  decision: inconclusive
- id: shared-balanced-focal
  mechanism_id: shared-pointwise-focusing
  parent_idea_id: null
  title: Shared balanced focal objective with soft targets
  opportunity: A shared focal objective changes how easy and difficult training cells
    contribute. External MCL results motivate the family but do not establish a macro-AUC
    gain on this recipe or justify a label-specific choice.
  mechanism: Replace BCE's pointwise term with one soft-target focal formula using
    a single shared focusing exponent. Retain the baseline class-balancing rule initially,
    and make the exact positive/negative soft-target extension explicit.
  precedents:
  - docs/research/auc_loss_approaches.md
  - docs/research/per-label-losses.md#trusted-motivation
  - docs/research/per-label-losses.md#candidate-losses-and-extensions
  novelty: A shared objective experiment, not the excluded per-label focal/ranking
    selection plan. The current main recipe uses BCE, with no focusing term.
  coverage: Preserve all observed soft targets and class groups with unchanged study
    exposure. Do not turn uncertain labels into hard targets or drop them.
  exploitation: Reduce the contribution of easy cells under the same rule for every
    label; inspect whether persistent difficult or noisy cells dominate the gradient.
  budget: Elementwise operations on existing logits only. Keep the model, optimizer,
    visits, batch size, steps, epochs and fixed runtime ceiling unchanged.
  implementation: Implement a numerically stable float32 focal term using logits and
    explicit soft positive/negative contributions. Record reduction, class-weight
    placement, one shared exponent and the resulting loss scale.
  open_choices: Select one shared focusing strength from a reasoned mechanism, not
    a sweep. Do not assume focusing is robust to label noise or rescale predictions
    at inference.
  dependencies: []
  priority_rationale: 'Recommend second: distinct pointwise mechanism, low compute
    overhead, and relevant external evidence whose transfer still needs a macro comparison.'
  status: completed
  created_revision: 4
  ranking_rationale: "Admitted two of the three new proposals; both have satisfied\
    \ dependencies and distinct mechanisms.\n\nshared-bernoulli-pair-ranking ranks\
    \ second, ahead of the queued tempering idea. I verified its core claim independently:\
    \ d/dd [a\xB7softplus(-d) + b\xB7softplus(d)] = (a+b)\xB7sigmoid(d) - a, so the\
    \ optimum is sigmoid(d) = a/(a+b) and s_i - s_j = logit(y_i) - logit(y_j), the\
    \ same population optimum as soft BCE, unlike a hard >= 0.5 pair term. It is therefore\
    \ not a pair-rule variant of shared-bce-ranking but a different objective with\
    \ different coverage and a different optimum, so running both is informative rather\
    \ than duplicative. Its coverage claim is supported by the researcher's Monte-Carlo,\
    \ whose hard-rule column reproduces the documented analytical zero-pair rates\
    \ (15.1/25.9/54.7% vs 15.2/26.3/55.0% for ACL/MCL/Fracture), giving confidence\
    \ in the Bernoulli-mass column that removes the zero-pair case. The mechanism\
    \ is shared: one tau, one lambda, twelve diagnostic readouts.\n\nshared-soft-mass-balance\
    \ ranks last of the four: independent and near-free, but the imbalance it corrects\
    \ is small (positive/negative term-mass ratios 0.89-1.46 under the current rule),\
    \ so the expected effect is the weakest. It stays in the queue because it is cheap\
    \ and mechanistically distinct from shared-tempered-balance, which keeps the thresholded\
    \ group lookup and changes weight magnitude.\n\nshared-ranking-memory-bank is\
    \ left as proposed: its dependency shared-bce-ranking is launched and undecided,\
    \ which does not satisfy the admission gate. I did not park it and did not clear\
    \ the dependency, which is also substantively correct: launching the bank before\
    \ the within-batch hybrid reports observed pair coverage and component scale would\
    \ confound the two.\n\nshared-delayed-ranking is retained as a surplus proposal\
    \ rather than queued: it schedules the same within-batch hybrid that is currently\
    \ running undecided, so its value depends on that result.\n\nSection 1 of the\
    \ evidence note resolves the startup concern about label reduction algebraically\
    \ (each label's cell-weight mass is exactly n_obs = 3503), so a per-label-averaged\
    \ pair term does not reweight labels here. I accept that a macro-aligned-reduction\
    \ candidate would be a numerical no-op."
  experiments:
  - shared-balanced-focal-20260920T113454Z-c1fe7f53
  decision: inconclusive
- id: shared-tempered-balance
  mechanism_id: shared-class-weight-tempering
  parent_idea_id: null
  title: Temper class weights with a shared normalization rule
  opportunity: Full inverse-frequency weighting helped the current model, but its
    strength and reduction can alter gradient variance and the contribution of rare
    labels. This does not establish that full weighting is optimal.
  mechanism: Apply one shared tempering exponent to training-fold positive/negative
    weights and normalize expected weight within each label using the same rule. Keep
    targets soft and study exposure uniform. Choose one justified shared rule rather
    than a vector of label-specific coefficients.
  precedents:
  - docs/backlog/small-changes.md#bce-weighting-and-study-sampling
  - docs/research/auc_loss_approaches.md#weighting-and-sampling-design-space
  - docs/validation/results/2026-09-19-balanced-bce-result.md
  novelty: Imports only the unimplemented loss-weighting proposal, not the study or
    batch sampling alternatives. Different weights arise from the same formula and
    training counts, not from per-label objective selection.
  coverage: Preserve masks, all observed targets, positive/negative groups, and every
    study visit. Do not use majority-cell masking as an implicit sampling change.
  exploitation: Investigate a less extreme allocation of gradients between class groups
    while retaining explicit balancing motivated by the measured baseline.
  budget: Reuse existing training class counts and current logits. No additional passes,
    model updates, batch changes, or preprocessing; fixed campaign limits.
  implementation: Keep count provenance intact. Derive candidate weights in the objective
    helper with one shared exponent and normalization rule. Record effective weights,
    mean loss scale and component/gradient diagnostics for interpretation.
  open_choices: Use the existing research to choose one tempering and normalization
    policy. Do not run an exponent grid, infer weights from validation, or claim the
    bundled normalization and tempering comparison isolates either factor.
  dependencies: []
  priority_rationale: 'Recommend third: grounded in a measured strong baseline and
    inexpensive, but the already successful weighting leaves its incremental benefit
    uncertain.'
  status: queued
  created_revision: 4
  ranking_rationale: "Scope ruling (mine to make, both proposals asked): a second\
    \ pooling of tokens already produced by one encode_batch call is allowed supporting\
    \ loss computation. Verified in modeling/model.py:322-323 that forward is exactly\
    \ pool_encoded(encode_batch(batch)), both public, so a candidate can split the\
    \ primary forward inside lightning.py without touching modeling code (not candidate-editable).\
    \ Encoder, attention module, classifiers, data preparation, triplet selection,\
    \ augmentation, study exposure, batch composition, optimizer, schedule and inference\
    \ stay fixed; no extra data pass, no extra optimizer update, validation path untouched.\
    \ Conditions for review: exactly one encode_batch call per step, primary logits\
    \ bit-identical, extra views built only by masking visual_valid, and the split\
    \ RNG drawn from a dedicated generator so the augmentation and series-dropout\
    \ streams are unchanged.\n\nBoth admitted (dependencies empty; admission table\
    \ confirms). Ranking changed only to place them; reserved head unchanged.\n\n\
    shared-split-view-consistency ranked third rather than second: it targets the\
    \ same headroom as the reserved head via a lag-free estimate, and the anchor run's\
    \ logged per-label deviation/variance traces will say whether a draw-invariance\
    \ term moves anything at all and at what effective scale. Sequencing it after\
    \ that evidence avoids committing two full-budget runs to one mechanism family\
    \ with zero measurements, and its coefficient/floor choices are exactly what the\
    \ anchor traces inform. shared-group-variance-compression is independent of that\
    \ evidence and already supplies the reviewed detached-normaliser pattern both\
    \ ideas reuse.\n\nshared-subview-supervision fourth: independent lever, no adaptive\
    \ state and no collapse mode, but it imposes a stronger assumption (each half\
    \ carries the label) that series_dropout=0.2 already stresses.\n\nshared-tempered-balance\
    \ stays last. The researcher's analysis (exhausted_directions item 2) shows per-label-constant\
    \ reweighting leaves the within-label minimiser monotone, so it cannot change\
    \ population AUC and acts only through finite-sample optimisation. Not parked\
    \ \u2014 that finite-sample channel is the stated rationale and is untested \u2014\
    \ but it does not outrank a measured-headroom mechanism.\n\nClosed directions\
    \ recorded from this report: cross-label decorrelation/severity-factor terms,\
    \ per-study logit normalisation, and the GCE/symmetric-CE/Huberised-BCE/forward-noise-correction\
    \ gradient-profile family. No further treatment of the 0.25 unaddressed block\
    \ beyond the queued bounded-target-instruction."
- id: shared-delayed-ranking
  mechanism_id: shared-objective-schedule
  parent_idea_id: null
  title: Introduce a shared ranking hybrid after BCE feature learning
  opportunity: Useful objective gradients may depend on representation maturity. Ranking
    from the first update need not behave like introducing it after BCE learning.
  mechanism: Start a fresh run with balanced BCE, then introduce the same BCE-plus-ranking
    combination for all labels on a shared epoch or step schedule. Fit the whole schedule
    inside the original ten epochs; do not append a continuation.
  precedents:
  - docs/research/per-label-losses.md#candidate-losses-and-extensions
  - docs/research/auc_loss_approaches.md
  - autoresearch/campaigns/losses/seed-ideas.yaml
  novelty: Changes when the shared ranking term contributes, not which labels receive
    it. Distinct from the always-on hybrid and from compositional AUC training with
    a different optimizer. A trained always-on result informs ranking of this idea
    but is not required as an accepted parent.
  coverage: Retain BCE and all observed cells throughout. Use the same pair rule and
    missing/zero-pair handling for every label during the ranking phase.
  exploitation: Establish features with pointwise supervision before allocating some
    gradient to study ordering, without adding model capacity or inference cost.
  budget: Same fresh initialization policy, ten epochs, 4380 optimizer steps, study
    visits, optimizer schedule and runtime ceiling. No external checkpoint fit, second
    training stage, cached-feature extraction or extra updates.
  implementation: Reuse or implement the shared ranking helper and compute the objective
    mix from the recorded global training step. Keep learning-rate scheduling and
    sampling epoch behavior unchanged. Record the full loss-weight trajectory.
  open_choices: Choose one shared transition and schedule from a concrete rationale.
    Reconcile with the always-on hybrid outcome before launch; avoid timing sweeps
    and preserve any newly accepted incumbent changes unless explicitly replaced.
  dependencies: []
  priority_rationale: 'Recommend fourth: a distinct temporal mechanism, most informative
    after observing the simpler shared hybrid, without extending the training budget.'
  status: proposed
  created_revision: 4
- id: shared-bernoulli-pair-ranking
  mechanism_id: shared-probabilistic-pair-semantics
  parent_idea_id: null
  title: Confidence-weighted pairwise ranking with Bernoulli soft-pair targets
  opportunity: 'The incumbent''s pointwise term pins each cell to s = logit(y), which
    supplies a level but no ordering signal among studies whose soft target sits near
    the evaluated 0.5 cutoff. In control B, studies with effective target in (0.25,
    0.75) carry 1.5-2.4x their pair share of the discordant (1-AUC) mass in all twelve
    labels: Synovitis 52.8% of positive-negative pairs but 83.0% of the error, with
    confident-only AUC 0.9638 against 0.8996 overall; Medial Meniscus 27.6% to 58.4%.
    A hard >= 0.5 pair rule cannot address that region safely, because it demands
    large separation between near-identical targets, and it also has no usable pair
    in 54.7% of Fracture and 33.9% of Synovitis microbatches. Reading the soft target
    as the Bernoulli probability that BCE already assumes gives a pair rule that is
    both fully covered and semantically correct. Measurements: scratch/loss-evidence-20260920.md
    sections 3, 4, 6.'
  mechanism: For every observed within-label pair (i, j) with i < j in the microbatch,
    set a = y_i(1-y_j), b = y_j(1-y_i), d = (s_i - s_j)/tau, and accumulate a*softplus(-d)
    + b*softplus(d). Divide each label's sum by its pair mass sum(a+b), average the
    twelve labels, and add lambda times that to the unchanged class-balanced soft
    BCE. One tau, one lambda, one rule for all labels. The weight a+b is exactly the
    probability that the pair straddles the positive/negative boundary under the Bernoulli
    reading of soft targets, and the implied target a/(a+b) is the probability that
    i is the positive member, so no target is binarized and no cell is dropped. The
    stationary point is s_i - s_j = logit(y_i) - logit(y_j), the same optimum as soft
    BCE, so the two components agree at the population optimum and differ only in
    how finite-sample gradient is split between level and ordering. A hard >= 0.5
    pair term instead drives |s_i - s_j| to infinity across the threshold, so mixing
    that with BCE trades one bias against another.
  precedents:
  - 'Burges et al., ICML 2005 (RankNet): pairwise cross-entropy against a target ordering
    probability P_ij, the exact form used here'
  - 'Gao and Zhou, IJCAI 2015 (arxiv.org/abs/1208.0645): AUC consistency of pairwise
    logistic loss; cited in docs/research/auc_loss_approaches.md#1-pairwise-logistic-ranking'
  - docs/research/per-label-losses.md#candidate-losses-and-extensions extension 4
    names probabilistic pair targets as an explicitly different objective, never run
    here
  - 'campaign idea shared-bce-ranking: contrasting arm whose recorded rule is binary
    membership at y >= 0.5'
  - outputs/autoresearch/losses/jobs/researcher-20260920T112958Z-9a7e4a21/scratch/loss-evidence-20260920.md
    sections 3, 4, 6 (with loss_evidence.py to reproduce)
  novelty: 'Not a pair-rule tuning choice inside shared-bce-ranking: it is a different
    objective with a different optimum, different coverage and different treatment
    of uncertainty, flagged as a separate objective in per-label-losses.md extension
    4 and never run locally. Distinct from focal (pointwise difficulty), tempering
    (weight magnitude) and schedules (timing). One shared formula and two shared scalars
    for all twelve labels; nothing is selected per label.'
  coverage: Every observed BCE cell keeps its term unchanged. Pairs use i < j, so
    self-pairs are excluded; a pair is skipped only when either target is unobserved,
    which never occurs on the fold-0 training table. Over 20,000 simulated microbatches
    of eight studies, effective pair mass is 8.3-14.0 per label per batch and never
    fell below 0.5 for any label, against 0.9-54.7% zero-pair batches under the hard
    rule. Fracture rises from 3.8 usable hard pairs to 8.5 effective pairs, Synovitis
    6.3 to 12.6. Log realized pair mass, zero-mass batch counts and both component
    values for every label as diagnostics only.
  exploitation: Gives ambiguous studies an ordering gradient proportional to the probability
    that they genuinely straddle the boundary, instead of the central logit that pointwise
    BCE prescribes for them, while leaving confident cells essentially as they are.
    Because the two components share a stationary point, lambda allocates effort between
    level and ordering rather than introducing a competing target.
  budget: 8x8x12 pair terms per optimizer step, elementwise on logits already materialized
    in float32 at lightning.py:305. No extra forward pass, no change to batch composition,
    data loading, optimizer or inference, no persistent state, no precomputation.
    Total added cost is well under a second against the 1797 s ceiling and control
    B's recorded 1562 s. Ten epochs and 4,380 steps unchanged.
  implementation: 'Create training/losses with a shared pair helper and call it from
    training_step next to the existing masked BCE. Use the a*softplus(-d) + b*softplus(d)
    form so no division by a per-pair weight is needed; guard only the label denominator
    (clamp to eps, count and log zero-mass labels, contribute zero). Compute d and
    both softplus terms in float32 under bf16-mixed. New settings tau and lambda under
    trainer.loss; leave trainer.class_balanced_bce untouched. At initialization s
    = 0 and d = 0, so both components equal log 2 and lambda is a literal component
    ratio at step 0; still record measured component scales on training-only reference
    batches before launch. Label reduction is already consistent: each label''s BCE
    cell-weight mass is exactly n_obs = 3503 and all twelve labels are fully observed,
    so the pooled-cell mean weights labels equally and the startup concern about a
    mismatch against a per-label-averaged pair term does not apply (evidence note
    section 1).'
  open_choices: 'One defensible (tau, lambda) pair, no sweep and nothing per label;
    tau = 1.0 keeps the logit scale and matches the Gao-Zhou consistency setting.
    One variant to settle before launch: keep the Bernoulli weight a+b but use the
    hard target 1{y_i >= 0.5}, which matches the evaluated binarization while retaining
    full coverage; the fully soft form is the default because it shares BCE''s optimum.
    Whether the denominator is the per-batch pair mass or a running training-only
    mean. Do not let inconclusive per-label deltas reopen per-label selection.'
  dependencies: []
  priority_rationale: 'Highest of the three new ideas: it attacks a weakness measured
    on the incumbent''s own predictions (ambiguous studies over-represented in discordant
    mass in 12/12 labels), it removes the zero-pair failure mode outright, it is independently
    interpretable against the incumbent, and it is near-free. Its main uncertainty
    is whether ordering pressure on ambiguous pairs is signal or label noise.'
  status: completed
  created_revision: 30
  ranking_rationale: 'Both new proposals are contract-compliant shared objectives
    (one formula, one tau/lambda or one fixed constant, all twelve labels, soft targets
    preserved, no per-label switch) and have no unresolved dependencies; both are
    admitted.


    shared-label-contrast-ranking is ranked above the two weighting-rule ideas because
    it is the only candidate aimed at a deficiency measured on the incumbent''s own
    predictions in a direction the objective never supervises: prediction off-diagonal
    correlation 0.384 vs 0.202 for soft targets, PC1 0.447 vs 0.278, with the training
    fold agreeing (0.180 / 0.261), so it is a model property (evidence sections 1-2,
    verified in the scratch note). Coverage is established rather than assumed: per-study
    Bernoulli straddle mass min 1.41 over 3,503 training studies, 528 pair terms per
    microbatch, so there is no zero-mass regime to design around (section 3). It opens
    a new comparison axis (labels within a study) distinct from every prior study-axis
    ranking idea, and it is cheap enough to fit the ~182 s of headroom the prior pair
    candidate left.


    shared-balanced-brier is ranked third: it replaces the pointwise function itself
    with a strongly proper member of the AUC-regret-bounded family, keeping mask,
    class weights, reduction and soft-target optimum at p=y, and its factor 2 is fixed
    by the initialization identity rather than tuned, so it starts gradient-identical
    to the control cell by cell (section 8). It is cheaper than the log-loss path.
    Its local evidence is weaker than the contrast proposal''s: the redistribution
    on the confidently-wrong tail is 23.7% -> 20.3% of gradient mass, a modest shift.


    shared-delayed-ranking and shared-ranking-memory-bank are retained as surplus
    rather than queued: the completed hybrid''s traces show the study-axis ranking
    term was active and a substantial share of the objective throughout, so scheduling
    or widening that same inert-free mechanism has low expected value, and the memory
    bank''s dependency is unresolved.


    shared-tempered-balance and shared-soft-mass-balance keep their relative order
    at the tail; section 6 (class-weighted per-label BCE spans only 0.414-0.522 on
    identical per-label weight mass) weakens, without eliminating, the motivation
    for reweighting-rule variants.'
  experiments:
  - shared-bernoulli-pair-ranking-20260920T121717Z-fd69b263
  decision: reject
- id: shared-ranking-memory-bank
  mechanism_id: shared-cross-batch-ranking-memory
  parent_idea_id: null
  title: Cross-batch detached score memory to widen the shared ranking pair pool
  opportunity: A microbatch of eight studies yields at most 28 pairs per label, and
    gradient accumulation is 1, so the pair pool cannot grow without changing batch
    composition, which the separate triplet-sampling campaign owns. Under the hard
    rule this leaves 54.7% of Fracture and 33.9% of Synovitis batches with no pair
    at all; even with full coverage, eight studies give a very local view of an ordering
    the metric evaluates over the whole fold. A training-only queue of recently computed,
    detached scores supplies per-label comparison partners at every step without touching
    sampling, batch composition or the number of forward passes. Fracture, the label
    with the worst hard-pair coverage, also has control B's most compressed validation
    logit spread (IQR 1.45 against 1.77-3.61 elsewhere), consistent with a weak ordering
    signal rather than saturation (evidence note sections 3, 5).
  mechanism: 'Maintain a FIFO queue of K training studies holding detached float32
    per-label logits, their soft targets, their observed masks and their insertion
    step. After each training step, enqueue the current eight studies and dequeue
    the oldest. The shared ranking term pairs current-batch anchors against queue
    entries, with gradient flowing only through the anchors, and retains within-batch
    pairs under the same rule, one shared temperature and one shared mixture coefficient
    for all labels. Queue entries are constants: no extra forward pass, no parameter
    update, no additional data pass, no external feature extraction. Because drift
    is largest early, the term uses within-batch pairs only until the queue is full,
    then enables bank pairs; entries older than a shared age cap are ignored. Validation
    never writes to or reads the queue, so no fold-0 validation label or score can
    enter the objective.'
  precedents:
  - 'Wang et al., CVPR 2020, XBM (arxiv.org/abs/1912.06798): queue of past embeddings
    with enqueue/dequeue, justified by a measured slow-drift property; reports large
    gains at negligible extra memory'
  - 'docs/research/auc_loss_approaches.md#5-roc-star: margin-based pairwise ranking
    using sampled predictions from the previous epoch as comparison examples'
  - 'autoresearch/campaigns/losses/prior-work.md: ''training-only memory pools'' named
    as a future direction when evidence justifies them'
  - 'docs/research/per-label-losses.md#ranking-needs-usable-study-pairs: gradient
    accumulation does not create cross-microbatch pairs; end-to-end ranking needs
    an explicit pair-coverage design'
  - outputs/autoresearch/losses/jobs/researcher-20260920T112958Z-9a7e4a21/scratch/loss-evidence-20260920.md
    sections 3, 5
  novelty: Changes the comparison pool and adds training-only state; it does not change
    the pair surrogate, the labels, the sampler or the batch. Distinct from shared-bce-ranking
    (within-batch pairs only), from shared-delayed-ranking (which changes when the
    same within-batch term applies) and from the sampling campaign (which changes
    which studies share a batch). ROC-star uses whole-previous-epoch predictions;
    this is a bounded, age-capped queue inside the sealed run.
  coverage: All observed BCE cells keep their terms. Bank pairs exclude any entry
    whose target is unobserved and, by construction, cannot pair a study with itself
    within a step. With K = 1024 the expected number of Fracture positives in the
    queue is about 75 and of Synovitis positives about 130, so every label has partners
    at every step after warm-up. Maximum entry age is K/8 steps (128 of 4,380 at K
    = 1024). Record queue occupancy, realized mean and maximum entry age, per-label
    bank pair counts and the batch-pair versus bank-pair contribution split.
  exploitation: Turns each step's eight anchors into comparisons against a wider,
    more representative slice of the training score distribution, which is what a
    fold-wide ranking metric rewards, and keeps rare-label positives continuously
