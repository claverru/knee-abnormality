- id: shared-boundary-proximity-weighting
  mechanism_id: shared-label-confidence-weighting
  parent_idea_id: null
  title: Reallocate gradient inside each class group toward near-boundary soft targets,
    keeping every group's weight mass bit-identical
  opportunity: 'Decomposing the incumbent''s fold-0 validation AUC by target confidence
    (strong = y<=0.2 or y>=0.8, weak = the 0.2-0.8 band) shows pairs with at least
    one weak member are 43.0% of scored pairs but carry 58.5% of the macro deficit:
    sub-AUC strong/strong 0.928 (57.1% of pairs), strong-pos/weak-neg 0.867 (31.0%),
    weak-pos/strong-neg 0.855 (8.7%), weak/weak 0.748 (3.3%). The band is 28.3% of
    observed cells yet receives only 21.5% of the incumbent''s weighted gradient mass
    at the selected checkpoint (11.9% at s=0), because the class weight is constant
    inside a group and BCE residuals are smallest where the target already sits near
    the model''s output. The shortfall is largest exactly where the band is biggest:
    Synovitis 55.3% of cells -> 36.9% of gradient, Baker''s 50.7% -> 27.6%, Fracture
    42.7% -> 26.5%. Gradient allocation is anti-correlated with where the metric is
    lost. (Computed from the control run''s oof_predictions.csv, fold-0 targets and
    fold_0/class_balance.json.)'
  mechanism: 'Keep soft targets, observed mask, class weights, y>=0.5 grouping and
    the pooled-cell mean exactly as they are, and multiply each observed cell by one
    shared confidence factor b_ic = (1 + k*(1 - |2*y_ic - 1|)) / Z[c, g(i,c)] with
    k = 1, where Z[c,g] is the mean of (1 + k*(1 - |2y-1|)) over that label''s training-fold
    cells in the same y>=0.5 group. Normalizing inside (label, group) keeps each group''s
    total weight mass bit-identical to the incumbent, so the measured class balance,
    each label''s objective scale and the reduction are unchanged; only the allocation
    inside a group moves. Targets are untouched, so the per-cell optimum stays at
    logit(y) and the objective remains the incumbent''s proper loss, re-weighted.
    k = 1 is pinned by a measurement rather than chosen: a boundary cell gets exactly
    twice the weight of an exact 0/1 cell in the same group, and on the incumbent''s
    own fitted predictions this lifts the 0.2-0.8 band''s gradient share from 21.5%
    to 27.6% against its 28.3% cell share, i.e. it aligns gradient mass with cell
    (and per-cell pair) share without overshooting; k = 2 overshoots to 31.9%. Z is
    24 constants derived once from training-fold targets, the same kind of object
    as the existing weight table.'
  precedents:
  - 'shared-balanced-focal (inconclusive, -0.00260): weights by *model* confidence,
    is adaptive and shrinks total gradient mass. This weight is a fixed function of
    the *label*, known before training and mass-preserving, so focal''s under-convergence
    reading does not transfer.'
  - 'shared-soft-mass-balance (reject, -0.00918) and shared-biproportional-weights
    (reject, -0.00441): both altered per-group weight *magnitudes* (Fracture positive
    weight 6.95 -> 2.71 and -> 4.73). The recorded attribution in both findings is
    broad damage from changed magnitudes; this proposal leaves every (label, group)
    mass identical by construction.'
  - In-flight shared-evidence-margin-bce and shared-target-logit-margin attack the
    same boundary weakness through the *target* (moving the per-cell optimum). This
    candidate leaves the optimum at logit(y) and changes only allocation, so the two
    channels are separable evidence on one hypothesis.
  - 'External hardness-weighting family: Lin et al. 2017 (focal), Fan et al. NeurIPS
    2017 (average top-k). Both emphasise hard examples by model state; label-confidence
    weighting is the static, leakage-free analogue available here because the metric''s
    label is a deterministic threshold of the same soft target.'
  - 'Evidence artifacts: /home/claudio/src/knee-abnormality/outputs/training/overnight-20260919T235434Z-8ol_1c30/runs/13-control-repeat/{oof_predictions.csv,fold_0/class_balance.json}.'
  novelty: First candidate whose per-cell weight depends on the soft target's distance
    from 0.5 rather than on its y>=0.5 group, and the first weighting change that
    preserves each (label, group) weight mass exactly. Every prior weighting experiment
    re-derived the group magnitudes; none reallocated inside a group.
  coverage: Per epoch and per label, log the band (0.2-0.8) cell share and its share
    of weighted gradient mass, plus weighted BCE per label so the unchanged group
    mass is observable. Record realized max/min cell weight (expected 6.95 -> 11.08
    and 0.539 -> 0.38) and assert each (label, group) weight sum equals the incumbent's
    to float tolerance. Report all twelve labels as diagnostics only.
  exploitation: A positive result confirms the boundary axis through a channel that
    preserves the optimum and calibration, and the successor is the combination with
    whichever in-flight target-margin variant is positive. If both in-flight margin
    runs return clearly negative, this becomes the decisive third channel test on
    that hypothesis rather than a fourth bet, and should be deprioritised if the orchestrator
    prefers to close the axis.
  budget: One extra elementwise multiply per step and 24 constants computed once during
    setup. The cheapest measured pointwise change (focal) cost +1.1% / ~17 s against
    the 1,797 s ceiling, so runtime is effectively free and the ~190-235 s of recorded
    headroom is untouched. No extra state, passes, or per-step reductions.
  implementation: 'In the class-balance setup path, extend the persisted statistics
    with the two normalizers Z[c,pos], Z[c,neg] computed from training-fold targets
    (new artifact version, targets list unchanged and still validated against the
    model''s targets). In the masked BCE, form b from the batch''s own targets and
    the persisted normalizers and multiply it into the existing class-weight tensor
    before the observed-cell mean; compute in float32 under autocast as the existing
    loss does. Everything else in lightning.py is untouched: data loading, model construction,
    optimizer/scheduler, forward prediction, validation, checkpoint selection and
    accounting. New config under trainer.loss (boundary weighting enable plus the
    shared k); trainer.class_balanced_bce stays true because the weight table is retained
    unchanged. Validation loss and saved predictions must keep the untouched targets
    and the untouched weights, so the factor is applied only in training_step.'
  open_choices: k = 1 (aligns band gradient share with cell share) versus k = 2 (overshoots
    to 31.9%); whether to build the factor from |2y-1| or from binary entropy H(y)/ln
    2, which has a very similar shape but is flatter near the extremes; whether to
    cap the resulting cell weight (max rises 6.95 -> 11.08); whether the normalizer
    should be per (label, group) as proposed or per label, which would shift pos/neg
    mass because the weak band is 26.2% negative versus 2.4% positive cells.
  dependencies: []
  priority_rationale: Strongest measured motivation in this refill (43.0% of pairs
