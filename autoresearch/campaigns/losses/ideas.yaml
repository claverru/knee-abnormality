- id: shared-group-variance-compression
  mechanism_id: shared-class-conditional-variance
  parent_idea_id: null
  title: Compress the metric-irrelevant within-group score spread with one shared
    class-conditional variance term
  opportunity: 'Inside each metric-defined group the incumbent turns label grade into
    score spread that macro AUC never rewards, and the resulting tails are what it
    does penalise. On control B, within-group corr(soft target, logit) is +0.17..+0.50
    for negatives and +0.20..+0.55 for positives; top-decile negatives carry higher
    grades than their group (Medial Meniscus 0.237 vs 0.120), because the v4 blend
    puts report-unaddressed metric-negatives at 0.25. Discordance is tail-concentrated:
    bottom-decile positives take 40-60% and top-decile negatives 37-57% of each label''s
    discordant pairs, union 0.78-0.996 against 0.19 at chance. Macro AUC implied by
    the class-conditional first two moments is 0.9058 against the realized 0.8966,
    so the deficit sits in non-Gaussian group tails. No weighting rule reaches this:
    the soft target, not the weight, fixes a cell''s equilibrium score. Evidence:
    jobs/researcher-20260920T141757Z-27ab0eb1/scratch/group-geometry-20260920.md,
    sections 1-3.'
  mechanism: 'Keep balanced soft BCE bit-identical and add one shared class-conditional
    variance term. Group each observed cell by the same y>=0.5 rule the class weights
    already use. Maintain detached EMA centroids mu[c,g] (24 scalars, momentum 0.9)
    of each label''s per-group mean logit, updated once per optimizer step from the
    microbatch''s observed cells in float32; a group absent from a step is not updated.
    Per label, term_c = sum_i w_ic (s_ic - mu[c,g(i,c)])^2 / sum_i w_ic over observed
    cells, with w the existing class weights, so the term cannot dilute class balancing
    (the inferred failure mode of shared-label-contrast-ranking). Divide term_c by
    max((mu[c,pos]-mu[c,neg])^2, 1.0), detached: that ratio is the inverse squared
    separation index, so the term is scale-free and cannot be satisfied by shrinking
    the logit scale, which would be AUC-neutral. Loss = balanced_bce + 0.15 * mean_c
    term_c. At control B''s geometry the per-label ratio is 0.39-0.84, so the component
    takes ~12-17% of the objective, deliberately below the 26-48% share at which both
    measured pair terms were neutral or harmful. The term adds no separation pressure;
    BCE keeps the class gap. Soft targets, masks, per-cell BCE and the pooled reduction
    are untouched.'
  precedents:
  - 'Ying, Wen & Lyu, Stochastic Online AUC Maximization, NeurIPS 2016: the square-loss
    AUC risk admits an exact saddle-point reformulation in class-conditional first
    and second moments, with the auxiliary variables equal to the class-conditional
    mean scores at the optimum. https://proceedings.neurips.cc/paper/2016/hash/c52f1bd66cc19d05628bd8bf27af3ad6-Abstract.html'
  - 'Yuan et al., Large-scale Robust Deep AUC Maximization (AUC-M), arXiv:2012.03173
    and docs/research/auc_loss_approaches.md section 4: within-class variance terms
    plus a margin. AUC-M needs PESG for its min-max; detaching the centroids removes
    the dual variable so the contract''s fixed optimizer is preserved.'
  - 'Campaign results: shared-bce-ranking (inconclusive, pairs covered ~10/12 labels),
    shared-bernoulli-pair-ranking (reject), shared-label-contrast-ranking (reject).
    All three enumerate sampled pairs; none tested a moment-form term.'
  - 'Campaign results shared-balanced-focal (inconclusive, negative point estimate)
    and shared-balanced-brier (inconclusive, negative point estimate): both reshaped
    each cell''s own curve, leaving group-relative geometry untested.'
  - docs/research/per-label-losses.md#ranking-needs-usable-study-pairs for the microbatch
    pair-coverage calculation this mechanism bypasses.
  - 'jobs/researcher-20260920T141757Z-27ab0eb1/scratch/group-geometry-20260920.md
    with geometry.py, tails.py, tail_composition.py, sizing.py: tail concentration,
    target/score coupling, d'' and moment-implied AUC, coverage arithmetic.'
  novelty: 'This is the class-conditional second-moment half of the exact moment reformulation
    of the square-loss AUC risk, not another sampled-pair surrogate: the campaign''s
    three measured ranking experiments all enumerate pairs and this enumerates none.
    It is also not pointwise reshaping; focal and Brier changed each cell''s own curve,
    while this compares a cell only with its group''s running centroid. Distinct from
    the three queued weighting ideas, which change weight magnitude or assignment
    and therefore cannot move within-group equilibria. No margin, no dual variable,
    no optimizer change, so it stays inside the contract that excludes PESG-style
    AUCM.'
  coverage: 'Every observed cell contributes at every step: a cell needs only its
    own group''s centroid, which the EMA supplies even when the microbatch holds no
    other member of that group. At batch 8, P(>=2 same-group positives) is 0.108 for
    Fracture and 0.276 for Synovitis, so a batch-only variance would starve exactly
    the rare labels; the EMA removes that. Masks are honored (fold 0 observes all
    cells), soft targets stay in the BCE term, self-comparison cannot arise. Log per-label
    term value, both centroids, the EMA gap, the realized component share, and the
    number of steps in which a group was absent.'
  exploitation: The gradient 2*w*(s-mu)/gap^2 grows linearly with the deviation, so
    pressure concentrates on the group outliers that carry ~87% of discordance and
    is near zero on the confident bulk. It reaches the rare labels' small, heavily
    weighted positive tails at every step rather than in the minority of steps that
    contain a usable pair.
  budget: '24 scalars plus elementwise operations on the 8x12 logit tensor per step:
    no pair loop, no extra forward pass, no data pass, no precomputation. Measured
    comparisons on this recipe: focal +17 s (+1.1%), the 12-label pair loops +52 s
    (+3.3%) and +62 s (+4.0%), leaving ~172-182 s under the 1,797 s ceiling; this
    mechanism should cost at or below the focal figure. Ten epochs, 4,380 steps, training
    cohort, triplet accounting and validation identity unchanged. EMA state is training-only
    and non-persistent, so checkpoint contents, checkpoint selection and inference
    stay identical.'
  implementation: 'Add the term under src/knee_abnormality/training/losses/ and call
    it from training_step (lightning.py:305-320) after the existing balanced BCE;
    keep the BCE formula bit-identical so train_balanced_bce stays comparable with
    control, and log components separately. Register the centroids as a non-persistent
    buffer on the LightningModule so state_dict, checkpoint selection and inference
    state are unchanged; initialize from the first step''s observed group means (or
    zeros with debiasing) and record which. Update after computing the loss from detached
    float32 logits, inside training_step only; validation and sanity-check passes
    must never write it. Compute in float32 under bf16-mixed, floor the denominator,
    and guard empty groups. New keys trainer.loss.{variance_weight, centroid_momentum,
    denominator_floor}; no per-label field and no coefficient vector. Leave data loading,
    model construction, optimizer/scheduler, forward prediction, validation, checkpoint
    selection and triplet accounting untouched. Review points: the group rule matches
    the class-weight rule, no gradient flows through the centroid, the EMA is training-only,
    and the component share is logged per epoch.'
  open_choices: 'Squared deviation (default, stronger on outliers) versus an absolute
    or standard-deviation form. EMA momentum 0.9 (~10-step window) and whether it
    resets at epoch boundaries (default no). Denominator: detached EMA gap squared
    with a floor at 1.0 (default) versus a constant, which would make the term scale-sensitive.
    Whether class weights multiply the term (default yes). lambda = 0.15 chosen from
    the measured 0.39-0.84 ratio; pick one value, do not sweep. Recorded risk: a uniform
    scale reduction is AUC-neutral, so only differential tail compression can help;
    the logged gap and d'' traces separate the two after the run.'
  dependencies: []
  priority_rationale: 'Recommend first. It targets the structure the artifacts actually
    show - tail-dominated discordance and grade-driven within-group spread - through
