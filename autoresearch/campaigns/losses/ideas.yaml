- id: shared-label-contrast-ranking
  mechanism_id: shared-within-study-label-contrast
  parent_idea_id: null
  title: Shared within-study cross-label contrast term beside balanced BCE
  opportunity: 'Control B''s predicted logits are twice as cross-label correlated
    as its labels: mean off-diagonal correlation 0.384 against 0.202 for soft targets
    (0.145 binarized), PC1 44.7% of prediction variance against 27.8% of target variance.
    The training fold''s targets agree with validation (0.180, 26.1%), so this is
    a model property, not a fold property. The excess concentrates on anatomically
    confusable pairs and appears as weak within-study contrasts. Contrast AUC (which
    of two labels is present, scored by s_c - s_c'') is 0.793 Lateral OA vs PF OA,
    0.802 Contusion vs Fracture, 0.840 Medial OA vs PF OA, 0.866 Medial OA vs Lateral
    OA, against a 0.937 mean over the 64 scoreable pairs; within-study profile Spearman
    is 0.424 mean and negative for 12.3% of studies. Across the twelve labels, Spearman(own
    AUC, mean contrast AUC) = 0.783: labels ranked worst across studies are separated
    worst from other labels inside a study. Nothing in the objective supervises that
    direction. Measurements: scratch/contrast-evidence-20260920.md sections 1-3.'
  mechanism: Keep the class-balanced soft BCE unchanged and add one shared term over
    label pairs inside each study. For study i and labels c < c' both observed, set
    a = y_ic(1-y_ic'), b = y_ic'(1-y_ic), d = (s_ic - s_ic')/tau, and accumulate a*softplus(-d)
    + b*softplus(d). Divide each study's sum by its pair mass sum(a+b), average over
    studies, and add lambda times that to BCE. One tau, one lambda, one rule for all
    66 pairs; no pair, label or family receives its own coefficient, and no target
    is binarized. The weight a+b is the probability that the pair straddles the positive/negative
    boundary under the Bernoulli reading the soft targets already carry in BCE, and
    the implied target a/(a+b) is the probability that c is the present label. The
    stationary point is s_ic - s_ic' = logit(y_ic) - logit(y_ic'), the same optimum
    as soft BCE, so the term does not compete with the pointwise objective; it reallocates
    finite-sample gradient into the contrast direction, which a study-level common
    factor cannot satisfy. Because the logistic term is near-flat on already-correct
    contrasts, gradient concentrates on the violated confusable pairs without any
    per-pair selection. Log per-pair realized mass, per-pair mean term value, the
    component share of the total loss, and the batch cross-label correlation as diagnostics
    only.
  precedents:
  - 'Kobayashi, CVPR 2023, Two-Way Multi-Label Loss: within-example positive/negative
    label discrimination plus the per-label direction; catalogued locally as docs/research/auc_loss_approaches.md#14-two-way-multi-label-loss
    and ranked out there on the opinion that ''macro AUC never scores'' cross-label
    ordering, with no local measurement'
  - 'Burges et al., ICML 2005 (RankNet): pairwise cross-entropy against an ordering
