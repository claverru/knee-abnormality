- id: shared-shift-projected-bce
  mechanism_id: shared-auc-invariant-gradient-projection
  parent_idea_id: null
  title: Project the AUC-irrelevant per-label level component out of the balanced
    BCE gradient
  opportunity: 'Adding a constant to every study''s logit for one label changes that
    label''s ROC-AUC by exactly zero, yet a measured 23.4% (at initialization) and
    16.7% (converged proxy) of the microbatch squared gradient norm of balanced BCE
    lies in exactly that direction, against a 12.5% random floor at batch eight. The
    excess tracks rarity, because a batch holding no positive produces same-signed
    residuals: Fracture 52.8% at init (53.4% of batches hold no Fracture positive),
    Synovitis 36.3%, MCL 30.1%, Lateral Meniscus 27.6%. The systematic part is tiny
    (per-label mean/rms of the weighted residual -0.147..+0.051 at init, -0.117..+0.018
    converged), because class balancing already zeroes the population level gradient;
    so this energy is eight-sample noise in a direction the metric cannot see. Measurements:
    scratch/gradient-geometry-20260920.md section 1.'
  mechanism: 'Keep the objective, mask, class weights, soft targets and pooled-cell
    reduction exactly as they are, and remove one component of the gradient they produce.
    Per microbatch and label, compute the weighted residual g_ic = w_ic(sigmoid(s_ic)
    - y_ic) over observed cells and its mean gbar_c, then optimize the objective whose
    gradient wrt s_ic is (g_ic - gbar_c)/N_obs. Implement it as balanced BCE minus
    the detached linear correction sum_c gbar_c * sum_i s_ic / N_obs, so the forward
    value stays near BCE while the backward gradient is exactly the projected one.
    One rule; no per-label parameter, temperature, mixture coefficient or pair pool.
    The projection is linear and the batch is exchangeable, so E[Pg] = P E[g]: the
    update remains an unbiased estimate of the ordering-relevant part of the population
    gradient and only the level is discarded. This is the study-axis analogue of the
    identity that an all-pairs squared-difference loss equals the batch-centered pointwise
    loss, applied to the existing residual instead of adding a second term. Batches
    whose residuals differ still supervise ordering, including all-negative batches
    whose soft targets differ; only a batch with identical residuals contributes nothing.'
  precedents:
  - 'Identity: for L = sum_{i<j}((s_i-s_j)-(t_i-t_j))^2, dL/ds_i = n(r_i - rbar) with
    r = s - t, so the translation-invariant pairwise objective is the batch-centered
    pointwise one. Named as an unrun alternative form on the label axis in shared-label-contrast-ranking''s
    open choices.'
  - 'Burges et al., ICML 2005 (RankNet): pairwise surrogates on score differences,
    the family whose additive study-axis members this campaign has already measured.'
  - 'Kotlowski, Dembczynski and Huellermeier, ICML 2011: AUC regret bounds for balanced
    univariate losses; the per-label level is a nuisance for bipartite ranking.'
  - 'Control-variate / baseline subtraction: removing a component of a stochastic
    gradient whose expectation is (near) zero reduces variance without introducing
    bias.'
  - 'campaign results shared-bce-ranking (inconclusive) and shared-bernoulli-pair-ranking
    (reject): additive study-axis pair terms at weight 1.0. Contrasting arms, not
    prerequisites.'
  - 'docs/research/auc_loss_approaches.md: lists pointwise and pairwise surrogates;
    no entry projects a component out of the existing pointwise gradient.'
  - outputs/autoresearch/losses/jobs/researcher-20260920T131338Z-3dc7e308/scratch/gradient-geometry-20260920.md
    sections 1 and 4 (shift.py, gradscale.py).
  novelty: 'Subtractive rather than additive. The campaign''s ranking and focusing
    candidates each added a term or reshaped the per-cell loss and each carried an
    unswept scale. This introduces no component, no coefficient and no temperature,
    so there is nothing to sweep, and it cannot suffer the measured failure modes
    of the pair candidates (a term competing at the optimum, ambiguous-pair mass,
    zero-pair batches). It is not the running label-axis contrast term: different
    axis, and a projection of the existing gradient rather than a second objective.'
  coverage: Every observed cell keeps its exact soft target, class weight, mask and
    place in the pooled mean; nothing is dropped, hardened or rescaled. Centering
    runs over each label's observed cells in the microbatch, so masked cells neither
    donate nor receive gbar_c; a label with one observed cell contributes exactly
    zero, which is correct because one cell carries no ordering information. Log per-label
    removed-energy share, per-label mean logit and logit IQR per epoch, and the underlying
    balanced BCE value so the training trace stays comparable with control B.
  exploitation: Removes 17-23% of the output-space gradient energy that provably cannot
    move the scored metric, and up to 53% of it for the rarest label, which is also
    the label with the worst pair coverage. What remains is the relative part of the
    pointwise residual, which is exactly what per-label AUC scores, so the same 4,380
    steps buy a less noisy estimate of the ordering-relevant gradient.
  budget: One extra masked mean per label per step (12 values from a 12x8 residual
    already materialized in float32) plus one linear correction term. No extra forward
    pass, no persistent state, no change to preprocessing, sampling, optimizer, schedule
    or inference. Cheaper than the focal candidate's +1.1% and far below the pair
    candidates' +3.3% and +4.0%; immaterial against the 1,797 s ceiling and control
    B's 1,562 s. Ten epochs and 4,380 optimizer steps unchanged.
  implementation: 'Add a helper under src/knee_abnormality/training/losses/ and call
    it from training_step in place of masked_binary_cross_entropy_with_logits, reusing
    the class weighting, mask and pooled mean unchanged. Compute sigmoid, residual,
    the per-label masked mean and the correction in float32 under bf16-mixed; detach
    gbar_c and verify numerically against an explicit projected-gradient reference
    on a training-only batch before launch. Keep trainer.class_balanced_bce and its
    statistics path untouched; objective selection under trainer.loss; the superseded
    call is replaced, not kept behind a flag. Leave data loading, model construction,
    optimizer/scheduler, forward prediction, validation, checkpoint selection and
    triplet accounting untouched. For review: the head bias gradient is exactly the
    batch residual sum, so it goes to ~0, and biases take no weight decay (the ndim<2
    group), leaving the per-label level unanchored. That is AUC-irrelevant and checkpoint
    selection is on macro AUC (selected_checkpoint.json), but record per-label mean
    logit per epoch to confirm no drift into sigmoid saturation.'
  open_choices: 'Whether to also project out the per-label scale direction (the centered-score
    vector), making the objective invariant to per-label affine maps rather than shifts
    alone; shift-only is the default because it needs no normalization and cannot
    collapse the spread. Whether the correction is the detached linear term (keeps
    the forward value near BCE) or a detached-coefficient surrogate; gradients are
    identical. Whether to retain a fraction of the shift component as a level anchor:
    default is full projection, which keeps the candidate hyperparameter-free; adopt
    an anchor only if the logged level drifts into saturation.'
  dependencies: []
  priority_rationale: 'First. It is the only proposal aimed at a component measured
