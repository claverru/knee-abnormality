- id: shared-subview-supervision
  mechanism_id: shared-subview-bagging-supervision
  parent_idea_id: null
  title: Supervise each half of a study's triplet evidence with the same shared objective,
    so the readout must be right from either half rather than merely agree with itself
  opportunity: 'Same measured headroom as the split-view consistency idea (5-7% of
    score variance is draw noise, +0.005 to +0.0075), attacked by a different lever.
    A second observation motivates the specific form: control B''s last two epochs
    buy no ranking (macro 0.8934, 0.8925, 0.89658, 0.8965) while train_loss_epoch
    keeps falling 0.4464 -> 0.4413, so late capacity goes into fitting targets from
    the full evidence rather than into anything the metric reads. Averaging the loss
    over sub-bags of the same encoded evidence is the standard remedy in the multi-sample
    dropout line and triples the number of supervised readouts per encoder pass at
    almost no cost, because the expensive stack before the split is not duplicated.'
  mechanism: 'Loss = bce(full) + alpha * 0.5 * (bce(half A) + bce(half B)), where
    every term is the identical masked class-balanced soft-target BCE with the identical
    weight table, the identical y>=0.5 grouping and the identical pooled-cell reduction;
    alpha is one shared scalar for all twelve labels, 0.25 to start. Halves are the
    same complementary split of a study''s valid acquisitions used by the consistency
    idea, pooled through the unchanged attention and head. No normaliser, no EMA state
    and no collapse mode: shrinking score variance raises every term rather than lowering
    one. A study with fewer than two valid acquisitions contributes only its full-pool
    term. The distinction from the consistency term is agreement without accuracy
    versus accuracy per view: that term is minimised by any function insensitive to
    which triplets are present, including a degenerate one, whereas this one requires
    each half to carry the label. Its mirror-image failure mode is that a focal finding
    visible in only a few triplets is unattainable from the half that lacks them,
    so the term pushes the model to answer from global appearance. Which of the two
    costs more is the thing worth measuring, and neither idea''s outcome settles it
    alone.'
  precedents:
  - 'Multi-sample dropout (Inoue, arXiv:1905.09788): average the loss over several
    samples of the post-dropout head with shared weights; reports both faster training
    and lower error, and states the cost argument relied on here.'
  - Sub-bagging and instance-dropout in multiple-instance learning; attention-based
    deep MIL (Ilse et al., ICML 2018) gives the pooled sub-bag readout used for each
    half.
  - 'R-Drop (Liang et al., NeurIPS 2021, arXiv:2106.14448): the consistency counterpart,
    included as the contrast rather than the template.'
  - 'Campaign, shared-draw-consistency-anchor (developing) and shared-draw-reliability-weighting
    (proposed): same target quantity through cross-epoch per-study state; this idea
    needs no memory and no lag.'
  - 'draw-noise-20260920.md sections 1 and 4: the headroom estimate with its caveats,
    and control B''s per-epoch macro AUC against the still-falling train loss.'
  - 'This job''s scratch note, section 6: pooling cost, RNG neutrality and the unchanged
    backbone backward.'
  novelty: Every campaign candidate so far has changed the formula applied to one
    logit vector per study. This changes what is supervised, three readouts of the
    same encoded evidence, while keeping one shared formula, one shared weight table
    and one shared coefficient across all twelve labels. It is not a consistency penalty,
    carries no adaptive state, and has no scale-shrinking solution.
  coverage: 'Log the full-pool balanced BCE, each half-view balanced BCE, their per-label
    gap, and the realised component share. Also log, per label, the fraction of metric-positive
    cells whose half-view probability falls below the full-pool probability by more
    than a fixed margin: that is a direct measurement of the hallucination pressure
    this term creates, which is the concern that would otherwise stay speculative.'
  exploitation: Paired with the consistency idea, the two separate whether draw robustness
    has to come with per-view accuracy. A win here with a neutral consistency result
    would say the gain is extra supervision rather than invariance, pointing at readout-level
    regularisation in general; the reverse would say the label simply is not recoverable
    from half the triplets, which also bounds how far any sub-view mechanism can go.
  budget: 'Two extra poolings and their backward, identical in cost to the consistency
    idea: under 1 GFLOP against roughly 300 GFLOP for the encoder pass over ~214 triplet
    images, so 1-2% of the measured 0.355 s/step, well inside the 235 s of ceiling
    headroom. One backward over the summed loss; backbone forward and backward unchanged.
    A single random half per step instead of both halves halves the added cost again.'
  implementation: 'Same encode/pool split and same view construction as shared-split-view-consistency:
    encoded = self.model.encode_batch(batch), logits = self.model.pool_encoded(encoded),
    views built by ANDing visual_valid with a per-acquisition keep mask that leaves
    each study at least one valid acquisition, split drawn from a dedicated generator
    so the augmentation stream is untouched. The loss helper reuses masked_binary_cross_entropy_with_logits
    unchanged for all three terms, so mask handling, soft targets, class weights and
    the pooled reduction are shared by construction. One new coefficient under trainer.loss.
    Validation forward, checkpoint selection, saved predictions, optimizer, scheduler
    and accounting unchanged. Technically independent of the consistency idea: neither
    needs the other''s state or result.'
  open_choices: Both halves or one random half per step. Alpha, and whether the two
    half terms should be averaged or summed. Split granularity, acquisition versus
    series. Whether to exclude studies whose halves are very unequal in acquisition
    count. Whether the half-view terms should use the class weights (yes by default,
    to keep one shared rule) and whether a short warmup before the term activates
    is warranted, given that early epochs have the largest full-pool error already.
  dependencies: []
  priority_rationale: 'Second: it forces per-view accuracy the labels may not support,
    whereas the consistency idea leaves the supervised objective untouched and measures
    the noise directly. It is simpler, has no collapse mode and no adaptive state,
    so it is the better fallback if the consistency term proves hard to tune. Both
    rest on the same second-pooling capability, so a scope ruling against it removes
    both; I flag that shared risk rather than hedging with a low-value ranking variant.'
