    supports since every label's weight mass stays n_obs. No exponent, no sweep, no
    per-label statistic beyond the single shared formula.
  dependencies: []
  priority_rationale: 'Third: the cheapest to implement and fully independent, but
    the aggregate imbalance it corrects is small, so its expected effect is the smallest
    of the three. It is worth a slot mainly because it makes the pointwise term consistent
