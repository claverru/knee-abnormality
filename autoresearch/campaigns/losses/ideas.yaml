- id: shared-evidence-margin-bce
  mechanism_id: shared-one-sided-target-margin
  parent_idea_id: null
  title: 'Treat each soft target as a one-sided margin: keep the full penalty toward
    the decision boundary, remove it on the metric-neutral side'
  opportunity: 'The v4 target table is quasi-discrete evidence states, not graded
    probabilities: 19.1% of all 52,884 cells are exactly 0.25 (report-silent for Steven,
    negative for lixin), 26.5% are 0.025, 12.3% are 0.015, and only 0.54% lie in (0.45,0.55).
    The incumbent instructs the model to hold the 0.25 cells 2.56 logits above the
    0.025 cells, and 0.75 cells 1.2 logits below 0.91 cells. Both instructions park
    the weakest-labelled cells inside the decision region, and the control''s fold-0
    predictions show the cost: 35.7% of validation negatives are 0.15<=y<0.5 and score
    higher than explicit negatives in all 12 labels (positives vs those negatives:
    macro 0.852; vs explicit negatives: 0.921); weak positives (0.5<=y<0.85, 11.4%
    of positives) reach macro 0.800 against 0.909 for strong positives. The pull is
    also cross-label: after conditioning on a study''s positive count, its unaddressed-cell
    count still predicts a higher mean score (partial r 0.30; per-label r 0.075-0.214
    on that label''s negatives), i.e. report terseness leaks into every label''s cross-study
    ranking.'
  mechanism: 'One shared rule, no new tunable. Per observed cell take t = logit(clamp(y,
    eps, 1-eps)) and evaluate the existing class-weighted soft BCE at a clamped score:
    s_eff = min(s, t) when y >= 0.5, max(s, t) when y < 0.5. Loss = mean over observed
    cells of w * BCE(s_eff, y), with w, the y>=0.5 grouping, the mask and the pooled-cell
    reduction bit-identical to the incumbent. The target y enters unchanged and nothing
    is binarized or dropped; the soft value now sets where the cell''s free region
    begins instead of where the score must sit. Gradient is exactly the incumbent''s
    (sigma(s)-y)*w whenever the cell is on the boundary side of its own target, and
    exactly zero once it has passed it: for y=0.25 at s=-3 the incumbent applies +0.203
    of up-pull, this applies 0. At s=0 every cell is on the active side, so the objective
    starts gradient-identical to the control and diverges only as cells are satisfied,
    the same clean-start property the Brier candidate used. Measured on the control''s
    fold-0 predictions (a lower bound; training-fold fit is tighter): 19.3% of negative
    cells and 11.2% of positive cells would be free, and 4.7% of total |gradient|
    energy is wrong-direction up-pull on group negatives, 98% of it from unaddressed-type
    cells. Unlike focal, no cell''s gradient is damped; only metric-neutral motion
    is released.'
  precedents:
  - 'Repository label audit: v4 = 0.5*Steven_v2 + 0.5*lixin73, 10,085 originally unaddressed
    cells become 0.25, and ''neither v4 == 0.5 nor distance from 0.5 recovers original
    report coverage'' - docs/public-labels/uncertainty-and-confidence-encoding.md'
  - Training-label masking (drop Steven v1 == 0.5 cells) rejected 2026-09-13, full-fold
    AUC -0.011455 - docs/modeling/supervision.md#training-label-masking. The cruder
    ways of handling these cells (weight 0, or the criticized 2|p-0.5| weight) discard
    the metric-relevant half of their signal; the one-sided form keeps it.
  - 'Campaign result shared-balanced-focal (inconclusive, -0.00260): damping every
    cell''s gradient at fixed LR plateaued from epoch 6. This proposal removes gradient
    only where it points away from the boundary and logs the realized free fraction
    per label so the same failure mode is measurable.'
  - 'Campaign result shared-balanced-brier (inconclusive, -0.00240): establishes the
    ''gradient-identical at s=0, differs only in shape'' review pattern reused here.'
  - Asymmetric loss (ASL, arxiv 2009.14119) shifts negatives by one global constant
    m and adds separate focal exponents; the repository survey records a measurement
    against that arm. Here the free boundary is the cell's own soft target, there
    is no focusing term and no shared probability shift.
  - Truncated/clipped robust losses with exact zero-gradient regions (GCE, arxiv 1805.07836)
    and Vapnik's eps-insensitive loss are the closest general forms; both use a fixed
    global threshold rather than a per-cell label-derived one.
  - 'Control artifacts used for every number above: outputs/training/overnight-20260919T235434Z-8ol_1c30/runs/13-control-repeat/fold_0
    (validation_predictions.csv, class_balance.json, logs/version_0/metrics.csv) joined
    to data/labels/public/stevenleehans/version-6/llm_labels_v4_blend.csv and data/folds/all_5fold_v3/studies.csv.'
  novelty: 'No campaign candidate has touched how the soft level is enforced; all
    six completed attempts changed weights, pointwise curvature, pair terms or gradient
    projection while leaving the per-cell level target intact. The free boundary is
    the cell''s own soft target rather than a global constant (ASL), a model-predicted
    threshold (SPLC) or a class anchor (the launched centroid-margin, which adds a
    hinge on top of an unchanged BCE pull). It is the contract-compatible part of
    binarization: the model may move a cell to the extreme of its own side, while
    the soft value still decides how far it must go before it is free and still sets
    the penalty on the other side.'
  coverage: Every observed cell of every label uses the identical rule; the only label-dependent
    quantity is the existing class weight. Per-label free fractions are diagnostics,
    never a selector. Microbatch composition, pair pools and batch statistics are
    irrelevant because the rule is per-cell, so the batch-size-8 estimator problem
    that sank shared-shift-projected-bce cannot arise here.
  exploitation: 'Targets the largest measured structure in the campaign: 36% of validation
    negatives and 11% of positives carry report-silent labels and account for the
    bulk of the ranking deficit (0.852 vs 0.921; 0.800 vs 0.909). It also removes
    the instruction that creates the measured report-terseness factor (partial r 0.30).
    Because free cells stop contributing, the remaining gradient concentrates on wrong-side
    cells, which is exactly the population that decides AUC.'
  budget: Elementwise ops on an [8,12] float32 tensor plus one clamp; no state, no
    extra pass, no pair enumeration. Expect well under +5 s against the reference
    1,562.3 s, i.e. far inside the 1,797 s ceiling (focal, the cheapest measured change,
    cost +17 s). Ten epochs, 4,380 steps, fold 0, fresh recorded seed, unchanged cohort
    hashes and triplet accounting. Note the forward value gains a per-cell floor w*H(y)
    (training-fold weighted mean 0.2611 nats), so log the floor-subtracted value as
    well to keep train-loss traces comparable with the control's 0.6438 -> 0.4413.
  implementation: 'Follow the shared-balanced-brier precedent exactly: add src/knee_abnormality/training/losses/evidence_margin.py
    exporting one function, re-export it from losses/__init__.py, and swap the single
    call in lightning.py training_step. No config key is required (the constant eps
    belongs in the module, as GRADIENT_MATCHING_FACTOR did); if the gate prefers one,
    put it under trainer.loss. Compute in float32 on the already-cast logits, build
    t once per batch, and select the side with torch.where on targets >= 0.5 plus
    torch.minimum/torch.maximum so the clamped branch carries no gradient. Leave validation_step,
    the evaluation helper, checkpoint selection and accounting untouched - the change
    must be confined to training_step, so val_soft_target_bce and val_macro_auc stay
    computed against the original targets. Log per epoch, per label: free fraction
    among positives and among negatives, the floor-subtracted objective, and the incumbent-equivalent
    balanced BCE value (computable in the same call at no cost) so the candidate and
    control curves remain comparable. Review points: mask handling unchanged, class
    weights still derived from the untouched targets, no change to the pooled-cell
    reduction, eps small enough that exact-0/1 cells (0.043% of cells) keep essentially
    full pressure.'
  open_choices: 'Symmetric (both groups) versus negatives-only: symmetric is proposed
    because the weak-positive deficit is measured too, but negatives-only is the conservative
    fallback. Whether to leak a small fraction of the two-sided pull (e.g. 0.05 *
    ordinary balanced BCE) as insurance against the masking-style loss of within-group
    gradation; I propose no leak, since a leak adds a tuned coefficient. Value of
    eps (1e-6 proposed). Whether to report the objective in clamped-BCE or KL-excess
    form (identical gradients).'
  dependencies: []
  priority_rationale: Rank first. It is the only proposal grounded in a measured,
    large and previously unexploited structure of the label table, it is parameter-free,
    effectively free against the ceiling, and it cannot fail through the batch-8 estimator
    or objective-share mechanisms that explain the campaign's five negative results.
    Its main risk - losing the within-group gradation whose wholesale removal (masking)
    cost 0.0115 - is bounded, because the gradation is retained on the active side.
  status: completed
  created_revision: 148
  ranking_rationale: 'Contract checks on the completed run pass, so the recorded numbers
    are interpretable: accounting complete (938460 triplets / 35030 visits, cohort
    hashes equal to the limits), validation selection hash identical in all ten epochs,
    fresh seed 788737321, 1594.5 s of measured setup+training+prediction against the
    1797 s ceiling, diff confined to lightning.py. The review-time worry about reduced-precision
    logsigmoid is resolved: logits are cast to float32 before the loss (lightning.py:309),
    and the hard-target limit of the per-term formula reduces exactly to the control''s
    weighted BCE, so the loss for y in {0,1} is unchanged.


    Queue change: shared-tempered-balance moves below shared-target-logit-margin.
    Its axis (magnitude of inverse-frequency weighting) has now been partially exercised
    in the shrink direction and coincided with a clear macro loss, so its expected
    value at the current exponent choice is lower than the untouched additive-margin
    axis. It stays queued rather than parked because the evidence is confounded (below)
    and the tempering exponent can also sharpen. If it runs, its implementation should
    keep the control''s thresholded per-cell weight assignment and vary only the shared
    exponent/normalization, so it does not repeat this run''s two-change confound.


    shared-delayed-ranking remains a surplus proposal. It was held pending shared-bce-ranking,
    which has now reported: the traces showed the ranking term active and well covered
    throughout (not early-noise dominated) yet macro-neutral, so scheduling its onset
    has no evidence base and I do not queue it. shared-ranking-memory-bank stays unadmitted
    on its unresolved dependency.'
