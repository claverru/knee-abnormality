    loss.meniscus_coupling_weight 0.1 penalized classifier-weight distance for one
    label pair and scored 0.890869 against 0.892360; cautionary precedent in parameter
    space and label-specific, unlike this output-space shared rule'
  - 'campaign idea shared-bernoulli-pair-ranking: identical pair surrogate on the
    study axis; informs interpretation, not a prerequisite'
  - outputs/autoresearch/losses/jobs/researcher-20260920T121718Z-2ea25138/scratch/contrast-evidence-20260920.md
    sections 1-4 (reproduce with structure.py, contrast.py, decouple.py)
  novelty: 'New comparison axis for this campaign and this repository: every prior
    ranking idea compares studies within a label; this compares labels within a study,
    so its pair pool, coverage and failure mode are different. Distinct from focal
    (pointwise curvature), tempering and soft-mass (weight rule), schedules (timing)
    and the memory bank (wider study pool). It is not the retired compartment architecture
    or the retired meniscus weight-coupling penalty: no parameter is tied, no classifier
    is shared, and the rule is identical for all 66 pairs.'
  coverage: All observed BCE cells keep their terms unchanged. Pairs use c < c', so
    self-pairs are excluded, and a pair is skipped only if either target is unobserved,
    which never occurs on the fold-0 table. Per-study Bernoulli pair mass over the
    3,503 training studies is mean 26.8, 1st percentile 3.20, minimum 1.41, so no
    study falls below mass 1 and there is no zero-mass case at microbatch eight; 528
    pair terms per step. Still clamp the denominator with eps, count zero-mass studies
    and let them contribute zero. Report every label's per-pair mass and mean term
    as diagnostics; no label selects its own objective.
  exploitation: 'Supervises exactly the direction the incumbent leaves loose: the
    within-study label profile, which a shared ''this knee looks abnormal'' factor
    cannot fit. If cross-label confusion limits per-label evidence, as the 0.783 rank
    association suggests, strengthening label-specific evidence should raise the scored
    per-label ranking, while BCE continues to supply the scored direction and all
    levels.'
  budget: One B x 12 x 12 outer difference per step on logits already materialized
    in float32, fully vectorized with no python label loop, about 10^4 elementwise
    operations. No extra forward pass, no persistent state, no change to batch composition,
    data loading, optimizer, schedule or inference. The earlier 12-label per-step
    ranking loop cost ~52 s of the 235 s ceiling headroom; a fused 12 x 12 form should
    cost less. Ten epochs and 4,380 steps unchanged.
  implementation: Add a shared pair helper under src/knee_abnormality/training/losses/
    and call it from training_step beside the existing masked BCE; keep trainer.class_balanced_bce
    untouched. Build the pair tensors with broadcasting over the label axis, compute
    d and both softplus branches in float32 under bf16-mixed, and use the a*softplus(-d)
    + b*softplus(d) form so no division by a per-pair weight is needed. New settings
    tau and lambda under trainer.loss. At initialization s = 0 gives d = 0 and a normalized
    term of log 2 = 0.6931 against the control's recorded BCE start 1.2057, so lambda
    = 1.0 makes the contrast about 36% of the objective at step 0, comparable to the
    45% the study-axis ranking run started at; tau = 1.0 keeps the logit scale. Record
    measured component scales on training-only reference batches before launch. Leave
    data loading, model construction, optimizer/scheduler, forward prediction, validation,
    checkpoint selection and triplet accounting untouched.
  open_choices: Per-study normalization then study average (default) against one pooled
    batch denominator. Whether to keep the pure Bernoulli straddle weight or the alternative
    translation-invariant form, penalizing (s_ic - s_ic' - logit y_ic + logit y_ic')^2,
    which supervises the profile shape directly but re-introduces level regression;
    the logistic form is the default because it shares BCE's optimum and bounds each
    pair's pressure. One defensible (tau, lambda) = (1.0, 1.0), no sweep, nothing
    per label or per pair. Mixed per-label deltas must not reopen per-label selection.
  dependencies: []
  priority_rationale: 'First: it is the only proposal here aimed at a weakness measured
