    section 2
  novelty: 'Distinct from shared-tempered-balance, which keeps the >= 0.5 group lookup
    and changes weight magnitude through an exponent and a normalization rule. Here
    the magnitude rule is unchanged (still 1/(2 * rate)) and the assignment rule changes
    from thresholded-cell to per-term soft mass. The two cannot be combined in one
    run and should not be read as variants of each other. It is also not pos_weight
    added to unweighted BCE, the form the survey ranked: both classes keep a weight
    and the reference statistic becomes the soft mass, not the thresholded rate.'
  coverage: All observed cells keep a strictly positive weight on both terms; nothing
    is dropped, hardened or masked, which matters given the rejected 2026-09-13 masking
    run. m_c uses training-fold observed cells only, after gold overrides and any
    training-study limit, exactly as the current count path does. Report per-label
    m_c, the thresholded rate for comparison, the resulting weights and the realized
    positive/negative term mass.
  exploitation: Removes a 6.75x weight discontinuity that currently falls on the cells
    the model orders worst, and reallocates gradient toward the positive mass carried
    by soft negatives (Fracture mean y 0.187 against a 0.073 thresholded rate; Synovitis
    0.341 against 0.126) without changing any target.
  budget: Elementwise on existing logits, plus one extra scalar per label computed
    once from frames already loaded in fixed_class_balance. No extra pass, no state,
    no preprocessing, sampling, optimizer or inference change. Cost is immaterial
    against the 1797 s ceiling; ten epochs and 4,380 steps unchanged.
  implementation: Extend fixed_class_balance to record the soft positive mass alongside
    the existing counts, bump the class_balance schema version, and keep the config/statistics
    agreement check at lightning.py:93 and the checkpoint hyper_parameters.class_balance
    path consistent. Replace the torch.where whole-cell weighting in masked_binary_cross_entropy_with_logits
    with the term-wise form built from logsigmoid(s) and logsigmoid(-s) in float32,
    preserving the pooled mean over observed cells and the missing-target mask. trainer.class_balanced_bce
    is the allowlisted key for this replacement; per the campaign's no-legacy rule
    the superseded thresholded-weight branch is removed rather than kept behind a
    flag.
  open_choices: Whether m_c is the plain observed mean soft target or clipped away
    from 0 and 1 for safety; both give the same weights to three decimals on this
