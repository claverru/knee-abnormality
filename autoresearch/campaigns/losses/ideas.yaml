- id: shared-soft-mass-balance
  mechanism_id: shared-soft-mass-class-balance
  parent_idea_id: null
  title: Threshold-free class balancing from training-fold soft positive mass
  opportunity: The incumbent picks a whole-cell weight by y >= 0.5, a step function
    of a target that is soft for 41.7% of training cells. For Synovitis, where 88%
    of cells lie in (0.05, 0.95), a cell at y = 0.45 receives weight 0.574 and one
    at y = 0.55 receives 3.875, a 6.75x jump across a cutoff the label source never
    intended as a decision boundary; 11.5% of that label's cells sit in (0.35, 0.65).
    The same discontinuity affects Medial Meniscus (14.0% of cells near the cutoff)
    and Contusion (9.7%). Aggregate imbalance under the current rule is modest, with
    positive/negative term-mass ratios of 0.89-1.46 and Synovitis worst at 1.46, so
    this targets the discontinuity and the arbitrary weight assigned to individual
    soft cells rather than a gross imbalance (evidence note section 2).
  mechanism: 'Weight each BCE term by its own class rather than weighting the whole
    cell by its thresholded group: loss = -[w_pos * y * logsigmoid(s) + w_neg * (1-y)
    * logsigmoid(-s)], with w_pos = 1/(2*m_c), w_neg = 1/(2*(1-m_c)) and m_c the mean
    soft target over the label''s observed training-fold cells. One formula, one statistic
    per label drawn from training data only, exactly as the incumbent already derives
    its weights from training-fold counts. The rule is continuous in y, equalizes
    each label''s positive and negative term mass by construction, keeps every observed
    cell and every soft value intact, and reduces to the current rule when targets
    are hard.'
  precedents:
  - 'docs/modeling/supervision.md#fixed-class-balanced-bce explicitly contrasts whole-cell
    weighting with term-wise weighting: ''This differs from pos_weight, which scales
    only the positive term inside BCE, including the positive component of soft negative
    targets such as 0.25'''
  - 'docs/research/auc_loss_approaches.md#9-positive-weighted-bce and #weighting-and-sampling-design-space
    (study-target cell weights row)'
  - 'docs/validation/results/2026-09-19-balanced-bce-result.md: the measured baseline
    this replaces'
