- id: shared-bounded-target-instruction
  mechanism_id: shared-target-logit-bound-schedule
  parent_idea_id: null
  title: Bound the metric-irrelevant within-group target spacing early and relax exactly
    to the incumbent objective before checkpoint selection
  opportunity: 'Inside a class group the soft targets demand a logit range the metric
    cannot use and the model never realizes: Fracture''s negative cells alone span
    logit(0.005) = -5.3 to logit(0.49) = -0.04, 64% of ACL cells sit in (0, 0.05),
    and 1.4% of all cells are exactly 0 or 1 (unbounded demand). The incumbent''s
    fitted per-label score SD is only 1.33-2.07 logits. At initialization the strong
    tail (y<=0.2 or y>=0.8) takes 88.1% of weighted gradient mass for 71.4% of cells,
    and the strong-positive tail alone takes 49.8% for 24.7% of cells. Ordering cells
    inside a group is exactly the instruction AUC ignores, and it is also what shared-group-variance-compression
    targets from the score side. No scheduled objective has been run in this campaign,
    so the interaction between objective shape and the sealed ten-epoch budget is
    entirely unmeasured.'
  mechanism: One shared monotone target map with one shared schedule. Per observed
    cell take t = logit(clamp(y, eps, 1-eps)) and y'(lambda) = sigmoid((1 - lambda)
    * t + lambda * clip(t, -L0, +L0)), with L0 = 2.0 and lambda falling linearly from
    1.0 at the first optimizer step to 0.0 at the end of epoch 6, so epochs 7-9 use
    y' = y returned exactly (not reconstructed through sigmoid), making the final
    objective bit-identical to the incumbent's, including the epoch from which the
    incumbent's checkpoint is selected (the 9th of ten). Class weights, the y>=0.5
    grouping, the mask and the pooled-cell reduction are unchanged; clipping is monotone
    and never crosses 0.5, so no cell changes group and the weight table stays valid
    throughout. At L0 = 2.0, 68.2% of cells are clipped and targets live in [0.119,
    0.881], compressing the far tail while preserving order weakly (ties at the bound).
    Direction is deliberately opposite to the two in-flight target-margin candidates,
    which expand spacing away from the boundary; this compresses spacing the metric
    cannot use, and unlike shared-group-variance-compression it adds no term, no state
    and no coefficient.
  precedents:
  - 'shared-group-variance-compression (queued, unrun) penalizes within-group score
    spread with an added class-conditional variance term. Same premise, different
    channel: this removes the instruction at its source instead of penalizing its
    consequence, so the two are correlated bets and should not both be run before
    the first reports.'
  - shared-evidence-margin-bce (launched) and shared-target-logit-margin (developing)
    move targets away from the boundary; this compresses the far tail. If either returns
    positive, this candidate's premise is directly weakened, which makes it a cheap
    decisive follow-up either way.
  - shared-delayed-ranking (proposed, unqueued) is the only other schedule in the
    registry and schedules a ranking hybrid, not a target map. No schedule has been
    measured in this campaign.
  - shared-centroid-margin (inconclusive, -0.00293) recorded that its auxiliary was
    early-heavy by construction (20.2% share at epoch 0 decaying to 3.0%) and its
    concern explicitly notes the run says little about late-applied objective changes;
    an annealed candidate that ends at the control objective is the complementary
    design.
  - 'External: Szegedy et al. 2016 label smoothing and Mueller et al. NeurIPS 2019
    on when smoothing helps or hurts representation geometry; Bengio et al. ICML 2009
    curriculum learning. Bounded targets are label smoothing applied in logit space
    with the soft ordering retained.'
  - 'Evidence artifacts: fold-0 training targets (band and tail cell shares) and the
    control''s oof_predictions.csv (fitted per-label score SD 1.33-2.07).'
  novelty: First scheduled objective in the campaign and the only candidate whose
    final-epoch objective is bit-identical to the incumbent's, so checkpoint selection
    and the last epochs optimize the control loss from a possibly different basin
    rather than a perturbed one.
  coverage: Log lambda, the realized clipped-cell fraction and the effective target
    bound per epoch; log per-label training BCE against the *unclipped* targets every
    epoch so the trajectory is directly comparable to the control's recorded curve;
    assert y' equals y exactly once lambda reaches 0 and that group membership never
    changes.
  exploitation: A positive result separates content from schedule only partially,
    so the immediate successor is the static-bound variant at the same L0 to attribute
    the gain. A negative result closes both the bounded-instruction channel and, together
    with shared-group-variance-compression, the within-group-spread premise.
  budget: One clamp, one interpolation and one sigmoid over the target tensor per
    step; no state, no extra passes, no added reductions. Runtime is effectively identical
    to the control, comparable with the focal candidate's +1.1%.
  implementation: Add the map to the losses package and call it in training_step only,
    deriving y' from batch targets before the existing masked class-weighted BCE;
    validation BCE, validation AUC, checkpoint selection and saved predictions must
    keep the untouched targets, which is the review point already recorded against
    shared-target-logit-margin. Read the schedule position from the trainer's current
    epoch and global step, never from validation state. Compute in float32 with the
    existing eps convention; return the original targets unchanged when lambda is
    0 so no reconstruction error is introduced. New keys under trainer.loss for the
    bound, the end epoch and the schedule shape; trainer.class_balanced_bce stays
    true.
  open_choices: L0 = 2.0 (68.2% of cells clipped) versus 2.5 (61.6%) or 1.5 (71.1%);
    end epoch 6 versus 5 or 7, trading early effect against the number of bit-identical
    final epochs; linear versus cosine lambda; whether to run the static-bound variant
    first for cleaner attribution, accepting that it duplicates the shared monotone
    target-map family already occupied by two in-flight runs.
  dependencies: []
  priority_rationale: 'Ranked third: the premise is real and the design is uniquely
    safe at the end of the run, but it is a correlated bet with the queued shared-group-variance-compression
    and it confounds content with schedule. Worth running only after at least one
    of the in-flight target-margin results and, ideally, the variance-compression
    result are known.'
