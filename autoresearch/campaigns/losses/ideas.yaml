- id: shared-balanced-brier
  mechanism_id: shared-strongly-proper-pointwise
  parent_idea_id: null
  title: Balanced squared-error (Brier) objective as a strongly proper AUC surrogate
  opportunity: 'The campaign''s pointwise axis has so far tested weighting rules and
    one improper focusing variant; the pointwise loss function itself has never been
    replaced by another member of the family that provably bounds bipartite-ranking
    regret. Log loss is the unbounded extreme of that family: its per-cell gradient
    does not decay when the model is confidently wrong, and the repository has documented
    confidently-wrong supervision (nineteen report-derived OA cells with explicit
    low-grade findings carrying confident positive training labels, docs/research/medial-lateral-transfer.md).
    On control B''s epoch-8 predictions the 5.99% of cells with |p - y| > 0.6 carry
    23.7% of the balanced BCE gradient mass against 20.3% under the scaled Brier form,
    and the median per-cell gradient falls from 0.1019 to 0.0542 while the two are
    identical cell by cell at initialization. So this is a measured, bounded change
    in how gradient is distributed across the probability range, not a rescaling.
    Unlike focal, the squared loss is strictly proper: its per-cell optimum stays
    at p = y, which is what the contract asks pointwise terms to preserve. Measurements:
    scratch/contrast-evidence-20260920.md section 8.'
  mechanism: 'Replace the masked class-balanced log loss with the masked class-balanced
    squared loss on probabilities: L = mean over observed cells of 2 * w_ic * (sigmoid(s_ic)
    - y_ic)^2, with w_ic the existing whole-cell class weight from the training-fold
    counts and the same missing-target mask and pooled-cell reduction. One formula
    and one fixed constant for all twelve labels; no label-specific parameter, no
    target change, no schedule. The factor 2 is fixed by an identity rather than tuned:
    d/ds [2w(sigmoid(s) - y)^2] = 2w(sigmoid - y)*2*sigmoid*(1 - sigmoid), which at
    the initialization point s = 0 equals w(0.5 - y), exactly the balanced BCE gradient
    for every cell. The two objectives therefore start gradient-identical and differ
    only in shape as training proceeds, which is the confound recorded against the
    focal candidate at its review. Squared loss is a strongly proper composite loss,
    so its regret bounds bipartite-ranking regret; the class-balanced form is the
    variant for which univariate AUC regret bounds are stated. Its Savage weight function
    is constant over thresholds where log loss uses 1/(c(1-c)), so saturated cells
    lose influence and mid-range cells gain it, with per-cell gradient bounded by
    w/2.'
  precedents:
  - 'Agarwal, JMLR 15 (2014), ''Surrogate Regret Bounds for Bipartite Ranking via
    Strongly Proper Losses'' (arxiv.org/abs/1207.0268): explicit ranking regret bounds
    for logistic, exponential, squared and squared-hinge losses as members of one
    family'
  - 'Kotlowski, Dembczynski and Huellermeier, ICML 2011, ''Bipartite Ranking through
    Minimization of Univariate Loss'' (icml.cc/2011/papers/567_icmlpaper.pdf): AUC
    regret bounds for balanced univariate losses, the theoretical warrant for the
    incumbent''s balancing and for this replacement'
  - 'Brier 1950; Reid and Williamson on composite binary losses: proper losses are
    characterized by a weight function over thresholds, constant for squared and 1/(c(1-c))
    for log loss'
  - 'docs/research/auc_loss_approaches.md: the local survey lists squared hinge only
    as a pairwise ranking option and never lists a pointwise proper-loss replacement,
    so this family is unclaimed by the general backlog'
  - 'docs/validation/results/2026-09-19-balanced-bce-result.md: the measured control
    this replaces'
  - 'campaign idea shared-balanced-focal: contrasting arm, improper and hard-cell-emphasizing,
    whose recorded review concern is exactly the fixed-LR gradient-scale confound
    this candidate removes by construction'
  - outputs/autoresearch/losses/jobs/researcher-20260920T121718Z-2ea25138/scratch/contrast-evidence-20260920.md
    section 8
  novelty: 'A different loss family, not a parameter of the incumbent: the pointwise
    function changes while the weighting rule, mask, reduction and soft targets stay
    identical. Distinct from focal, which multiplies log loss by a focusing factor,
    moves the per-cell optimum away from p = y and emphasizes the opposite end of
    the confidence range. Distinct from tempering and soft-mass, which change w and
    keep log loss. No local run has replaced the pointwise function itself, and the
    survey does not list this family.'
  coverage: Every observed cell keeps a strictly positive weight and its exact soft
    target; nothing is dropped, hardened or masked, and the optimum stays at sigmoid(s)
    = y for every cell including the 41.7% that are soft. The class weights, the y
    >= 0.5 group rule, the missing-target mask and the pooled mean over observed cells
    are byte-for-byte the incumbent's. Report per-label loss values, per-label AUC
    and the realized gradient norm as diagnostics; the train_loss trace is a squared
    quantity and is not comparable to the control's BCE trace, so only macro AUC and
    the paired bootstrap are comparable.
  exploitation: Redistributes gradient away from saturated cells, where log loss puts
    unbounded weight on supervision that the repository has documented to be sometimes
    confidently wrong, and toward the mid-range region where the discordant validation
    mass concentrates, while keeping soft-target semantics exactly. If the incumbent's
    residual error is partly the cost of chasing confident label noise, a bounded
    strongly proper member of the same AUC-bounded family should rank better at equal
    budget.
  budget: Elementwise on the logits already materialized in float32; strictly cheaper
    than the log-loss path (one sigmoid and one square, no logsigmoid branches). No
    extra pass, no state, no preprocessing, sampling, optimizer or inference change,
    no schedule. Cost is immaterial against the 1,797 s ceiling and control B's 1,562
    s. Ten epochs and 4,380 steps unchanged.
  implementation: Add the objective under src/knee_abnormality/training/losses/ and
    call it from training_step in place of masked_binary_cross_entropy_with_logits,
    preserving the observed-mask guard, the torch.where class weighting and the pooled
    mean. Compute sigmoid and the square in float32 under bf16-mixed; no clamping
    is needed because the loss is bounded. Keep trainer.class_balanced_bce and its
    statistics path untouched, since the weighting rule is unchanged, and put the
    objective selection under trainer.loss. Per the campaign's no-legacy rule the
    superseded pointwise branch is replaced, not kept behind a flag. Before launch,
    verify on training-only reference batches that per-cell gradients match the control
    at s = 0 and record the measured ratio at a mid-training reference point.
  open_choices: 'Whether to keep the analytic factor 2 (default, gradient-matched
    at initialization) or no factor at all; a factor is not a tuned scale and must
    not become a sweep. Whether to also record the exponential balanced loss as the
    alternative family member: it has the same univariate AUC bound but an unbounded
    gradient under noisy labels, so it is not the default. Whether validation logging
    keeps the soft-target BCE for comparability, which it should.'
  dependencies: []
  priority_rationale: 'Second: cheap, self-contained and theoretically warranted,
    and it removes by construction the gradient-scale confound recorded against the
