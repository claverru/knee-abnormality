- id: shared-target-logit-margin
  mechanism_id: shared-additive-target-margin
  parent_idea_id: null
  title: Shift every soft target one logit away from the decision boundary, preserving
    all spacing between targets
  opportunity: 'Same measured defect as the one-sided proposal, attacked from the
    opposite side: instead of releasing cells that have passed their target, pull
    every target further from the boundary. The evaluation ranks against 1[y >= 0.5],
    whose optimal ranker is P(y >= 0.5 | x), while soft BCE fits E[y | x]; the two
    differ exactly on the cells that are far from 0 and 1, which is where the control
    loses its AUC (unaddressed negatives 0.852 vs explicit 0.921; weak positives 0.800
    vs strong 0.909). The control is under-fit rather than over-fit - training weighted
    entropy floor 0.2611 against a final train loss of 0.4413, and validation still
    rising at epoch 8-9 - so adding pressure on the ambiguous cells is better matched
    to the budget than removing pressure. A shared additive shift in logit space is
    the one transform that moves targets away from the boundary without inflating
    the logit scale multiplicatively or changing any within-group spacing.'
  mechanism: 'One shared scalar, delta = 1.0 logit. Per observed cell: t = logit(clamp(y,
    eps, 1-eps)); t'' = t + delta if y >= 0.5 else t - delta; y'' = sigmoid(t'').
    The loss is the existing class-weighted soft BCE against y'', with weights, grouping,
    mask and reduction unchanged. Verified mappings: 0.25 -> 0.1092, 0.75 -> 0.8908,
    0.025 -> 0.00934, 0.91 -> 0.9649, 0.995 -> 0.9982, exact 0/1 stay at 0/1. Because
    the shift is additive and its direction follows the same y >= 0.5 grouping the
    class weights use, (i) the grouping is invariant, so the weight table is untouched,
    (ii) every within-group spacing is preserved exactly (0.25 vs 0.025 stays 2.565
    logits), so the metric-irrelevant within-group ordering instruction is not amplified,
    and (iii) the required logit scale grows by delta rather than by a factor, unlike
    multiplicative sharpening sigma(k*logit y), which would multiply both the spacing
    and the scale. delta = 0 is the incumbent and delta -> infinity approaches the
    thresholded label the evaluation uses, so one finite shared delta interpolates
    toward the metric''s own functional while every target stays soft, strictly monotone
    in y and order-preserving. For y = 0.25 the up-pull threshold moves from -1.10
    to -2.10 and the down-push at s = -1.0 rises from 0.019 to 0.160.'
  precedents:
  - Same label-structure and control-prediction evidence as shared-evidence-margin-bce
    (docs/public-labels/uncertainty-and-confidence-encoding.md; control fold_0 predictions
    joined to the v4 table).
  - Campaign contract requires preserving soft targets in pointwise terms; this keeps
    them soft, monotone and equally spaced within each group, but it is a target transform,
    so the orchestrator should rule on the tension before a run is prepared.
  - 'shared-soft-mass-balance (developing) addresses the same soft-versus-hard mass
    mismatch from the weighting side: pooled training soft mass 0.3397 against a thresholded
    positive rate 0.2724. The two mechanisms overlap in motivation and would interact
    if both were adopted; they should not be combined in one run.'
  - 'Multiplicative sharpening sigma(k * logit y) was worked out and set aside: no
    finite k matches pooled soft mass to the hard rate (the mean approaches it only
    asymptotically), it multiplies within-group spacing, and it demands a k-fold logit
    scale. The additive form dominates it on all three points.'
  - Hard-label training is excluded by the contract; this is the bounded interpolation
    toward it, with delta measured in logits rather than an opaque temperature.
  novelty: 'No campaign candidate has changed the pointwise target level, and the
    additive-in-logit form is distinct from label smoothing/sharpening (multiplicative),
    from ASL''s probability shift on negatives only, and from the one-sided proposal,
    which leaves targets untouched and changes the penalized domain instead. Permit
    versus pull: run separately, the two bracket the question of whether the soft
    levels themselves cost AUC, and each remains interpretable if the other fails.'
  coverage: Identical rule for all twelve labels and every observed cell; the only
    label-dependent quantity remains the existing class weight, and the grouping is
    provably invariant under the shift. No batch statistics, no pair pools, no state.
  exploitation: 'Uses the measured position of the ambiguous clusters (|logit| about
    1.1) relative to the boundary and the measured under-fit (entropy floor 0.2611
    vs train loss 0.4413): it lowers the floor to 0.345 nats for a 0.25 cell, converting
    irreducible objective value into reducible pressure exactly on the cells that
    decide the metric, without removing gradient anywhere.'
  budget: One clamp, one log, one add, one sigmoid on an [8,12] tensor, computable
    once per batch. Expect a few seconds at most against the 1,562.3 s reference and
    the 1,797 s ceiling. Fold 0, ten epochs, 4,380 steps, fresh recorded seed, unchanged
    cohorts and accounting.
  implementation: 'Same shape as the Brier and one-sided candidates: a module under
    training/losses/ holding TARGET_MARGIN_LOGITS = 1.0 and eps, one re-export, one
    call swap in training_step. Derive the shifted target from batch[''target''] inside
