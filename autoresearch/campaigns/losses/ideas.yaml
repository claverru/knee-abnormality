- id: shared-draw-consistency-anchor
  mechanism_id: shared-cross-epoch-draw-invariance
  parent_idea_id: null
  title: Penalise how much a study's score changes between its own triplet draws,
    using a per-study cross-epoch anchor
  opportunity: 'Two saved checkpoints were scored at validation multipliers x1..x4
    through the production path: control-check 0.88472/0.88846/0.88994/0.89010, sigma-fraction-0867
    0.88648/0.88849/0.89033/0.89027. A binormal fit of score = signal + draw-noise/m
    reproduces all eight cells to <=0.0003 and puts irreproducible draw noise at 4.7-6.7%
    of between-study score variance; full draw-invariance would be worth +0.0052 to
    +0.0075 macro AUC at the pinned multiplier 1 (scratch/draw-noise-20260920.md section
    1). Triplet selection is seeded by (study uid, training_seed, epoch) (dataset.py:195-196),
    so every epoch shows a different draw of the same study, yet the objective never
    asks for agreement between them. No campaign candidate has touched this axis;
    the only adjacent measurement, shared-target-logit-margin, shows that saturating
    the score scale (mean|logit| 0.551 -> 1.899) is AUC-neutral (+0.00005), so robustness
    has to be requested explicitly. Caveats: neither multiplier profile is the current
    class-balanced control, the m->inf row is an extrapolation, and a loss can only
    make the function less draw-sensitive, not average draws.'
  mechanism: 'Keep balanced soft BCE bit-identical and add one shared consistency
    term. Register two non-persistent buffers on KneeModule (precedent lightning.py:222-228):
    draw_anchor [training_studies, 12] float32 and draw_anchor_seen [training_studies]
    bool; map batch["study_uid"] to slots through a dict filled on first sight. In
    training_step, for observed cells of studies already seen, form the deviation
    d_ic = s_ic - anchor_ic - drift_c, where drift_c is a detached EMA over optimizer
    steps of the per-label mean (s - anchor). The drift term answers shared-shift-projected-bce''s
    recorded diagnosis directly: it is a running, low-variance estimate of the common
    level shift rather than a per-step microbatch mean, which that run measured as
    destructive at batch 8. Per label take the class-weighted mean of d^2 over active
    cells using the same weights and the same y>=0.5 grouping as the BCE, so the term
    cannot dilute class balancing, then divide by max(V_c, 0.25) where V_c is a detached
    EMA of the label''s between-study logit variance. That ratio is a noise-to-signal
    ratio, so a uniform shrink of the logit scale cannot satisfy the term. Loss =
    balanced_bce + 0.1 * mean over labels. After the loss, update anchors from detached
    float32 logits with momentum 0.5 (one sample per epoch, so ~2-epoch window); epoch
    0 only initialises and the term is inactive. Targets, masks, per-cell BCE and
    the pooled reduction are untouched.'
  precedents:
  - 'scratch/draw-noise-20260920.md (this job) sections 1-2: multiplier profiles,
    binormal noise fit, buffer feasibility'
  - 'docs/validation/results/2026-09-19-relative-sampler-width-result.md#count-multipliers:
    the recorded x1..x4 fold-0 table for both checkpoints'
  - 'shared-target-logit-margin finding: logit-scale change of ~1.35 in mean|logit|
    gave +0.00005, so saturation is not a route to draw-invariance'
  - 'shared-shift-projected-bce finding: per-step per-label mean subtraction removed
    15-68% of gradient energy at batch 8; the recorded successor condition is an accumulated
    or running level estimate, which the drift EMA supplies'
  - 'Laine & Aila, Temporal Ensembling for Semi-Supervised Learning, ICLR 2017 (openreview
    BJ6oOfqge): per-example EMA of predictions across epochs as a free second view,
    with the recorded limitation that each example updates only once per epoch'
  - 'Regularising for invariance to data augmentation improves supervised learning,
    arXiv:2203.03304: objectives that build invariance into the network generalise
    better than averaging predictions of non-invariant models; it uses multiple views
    per step, which this recipe cannot afford'
  - src/knee_abnormality/training/lightning.py:222-228 (non-persistent buffer precedent),
    :305-320 (training_step already receives study_uid and float32 logits); src/knee_abnormality/data/dataset.py:195-196
    (per-epoch draw seed)
  - 'jobs/researcher-20260920T141757Z-27ab0eb1/scratch/group-geometry-20260920.md
    sections 1, 4: tail-concentrated discordance and the batch-8 coverage argument
    for running statistics'
  novelty: 'First candidate to use the study identity across epochs; every prior mechanism
    reads only the current microbatch or a class-level running summary. Distinct from
    shared-group-variance-compression, which pulls a cell toward its class centroid
    and so also compresses genuine between-study signal: this anchor contains no between-study
    information at all, so the term penalises only irreproducibility. Distinct from
    shared-centroid-margin (class anchors, separation pressure) and from all pair
    terms (no pairs are formed). Distinct from shared-boundary-proximity-weighting,
    which reweights by a static target property rather than adding a term.'
  coverage: 'No pairs, so microbatch-8 pair sparsity is irrelevant: from epoch 1 every
    observed cell of every study contributes at every step, including Fracture, whose
    hard positive/negative pair coverage is only 45% of batches. Masks are honoured
    cell-by-cell (fold 0 observes all twelve, but the mask still gates the term),
    self-comparison cannot arise, and a study contributes only after its own first
    visit. Log per label: mean normalised deviation, the drift EMA, V_c, the realized
    component share of the objective, and the count of inactive cells per epoch.'
  exploitation: The gradient 2*w*d/V is linear in the deviation, so pressure lands
    on studies whose score swings between draws and is near zero on reproducible ones.
    If the current recipe carries the 5-7% noise fraction measured on the two older
    checkpoints, removing part of it acts directly on the quantity the pinned multiplier-1
    metric is most sensitive to, with no inference cost and no change to which images
    are drawn.
  budget: One gather, one scatter and elementwise arithmetic on an [8, 12] tensor
    per step, plus 168 KB of buffers (3,503 studies x 12 float32). Cheaper than the
    12-label pair loop that cost shared-bce-ranking ~52 s (+3.3%) and comparable to
    focal's ~17 s (+1.1%); expect ~1% over the 1,562.3 s reference against the 1,797
    s ceiling. No extra forward or backward pass, no extra data pass, no precomputation,
    no change to batch composition, epochs (10), steps (4,380), cohorts or validation
    selection. Buffers are non-persistent, so state_dict, checkpoint selection and
    inference state are unchanged, and validation never writes them.
  implementation: 'Add the term under src/knee_abnormality/training/losses/ and call
    it from training_step after the existing balanced BCE, keeping the BCE formula
    bit-identical so train_balanced_bce stays comparable with control and logging
    the two components separately. Compute in float32 under bf16-mixed; detach anchors,
    drift and V_c so no gradient flows through them. Update anchors, drift and V after
    the loss, inside training_step only, from detached logits. Allocate the buffers
    from the training_studies constructor argument; assign slots lazily from batch["study_uid"]
    and assert no slot overflow. New keys trainer.loss.{consistency_weight, anchor_momentum,
    variance_floor, drift_momentum}; no per-label field, no coefficient vector, trainer.class_balanced_bce
    stays true. Leave data loading, model construction, optimizer/scheduler, forward
    prediction, validation, checkpoint selection and triplet accounting untouched.
    Review points: the grouping rule matches the class-weight rule; buffers are non-persistent
    and training-only; the term is inactive in epoch 0 and for unseen studies; the
    denominator floor is applied before division; the drift EMA is a running statistic,
    not a per-step microbatch mean.'
  open_choices: 'Anchor momentum 0.5 (~2-epoch window) versus 0.0 (previous epoch
    only, no extra state) versus 0.9 (long window, more drift contamination). Normaliser:
    EMA between-study logit variance (default) versus the detached squared class gap
    used by shared-group-variance-compression. Drift centring on (default) versus
    off, which would leave the term measuring drift plus noise. lambda = 0.1 chosen
    to target roughly 5-15% component share from the campaign''s measured shares (45-48%
    neutral or harmful, 20%->3% negative); pin one value, do not sweep. Recorded risk:
    the deviation cannot separate draw noise from model drift, so a null could mean
    either that the term chased drift or that draw noise is smaller on this recipe
    than on the two older checkpoints.'
  dependencies: []
  priority_rationale: 'Highest of the two: the only unexploited axis in this campaign
    with a quantified headroom (+0.005 to +0.0075 at multiplier 1) rather than a hypothesis,
    it is nearly free, it reaches every cell of every label at every step, and its
    diagnostics measure the draw-noise fraction on the current recipe for the first
    time. Eleven candidates have now reshaped weights, targets, curvature or pairs
    and none cleared zero, so a mechanism on a genuinely different axis has the better
    prior.'
  status: completed
  created_revision: 217
