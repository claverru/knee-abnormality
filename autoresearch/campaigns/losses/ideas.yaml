- id: shared-draw-reliability-weighting
  mechanism_id: shared-inverse-draw-variance-weighting
  parent_idea_id: null
  title: Weight each cell by the inverse of its measured across-draw score variance
    instead of adding a consistency term
  opportunity: 'The same measurement motivates a second, non-overlapping treatment.
    If 4.7-6.7% of score variance is draw noise (scratch/draw-noise-20260920.md section
    1), that noise is in the inputs, not the labels: the study''s evidence changes
    with which triplets were drawn, so a fixed fraction of each cell''s gradient direction
    is drawn from a nuisance distribution, and the fraction is not uniform across
    studies. Studies whose score swings between draws are the ones whose supervision
    is least informative about the reproducible signal. Inverse-variance weighting
    is the standard response under heteroscedastic observation noise (Gauss-Markov),
    and unlike the four weighting rules already measured here it uses a statistic
    that has nothing to do with class frequency or label confidence. Both class-frequency
    reweightings tried (soft-mass, biproportional) and the two curvature changes (focal,
    Brier) failed; a weighting keyed to measured reproducibility has not been tried.'
  mechanism: 'Keep the loss shape, targets and class weights exactly as the incumbent
    and multiply each observed cell by one shared reliability factor. Maintain, in
    non-persistent buffers keyed by study slot, the cross-epoch anchor and a per-cell
    EMA of the drift-centred squared deviation v_ic (the same statistic shared-draw-consistency-anchor
    penalises, here only read). Factor f_ic = 1 / (1 + v_ic / r_c), with r_c a detached
    running mean of v over the training fold for label c, so f lies in (0, 1] and
    equals 0.5 when a cell is exactly average-noisy. Normalise f by a detached running
    mean of f within each (label, y>=0.5 group), mirroring the normaliser already
    reviewed for shared-boundary-proximity-weighting, so each group''s weight mass
    is preserved in the fold-level sense and class balancing is untouched. Loss =
    mean over observed cells of w * f * bce, with no added term and no pull toward
    the anchor: only the relative influence of cells changes, never a cell''s gradient
    direction or its equilibrium score. f = 1 until a cell has at least two visits,
    so the rule is inactive in epochs 0-1 and fully active from epoch 2.'
  precedents:
  - 'scratch/draw-noise-20260920.md (this job) section 1: the draw-noise fraction
    and its per-checkpoint fit'
  - 'Batch Inverse-Variance Weighting: Deep Heteroscedastic Regression, arXiv:2107.04497:
    inverse-variance weights from Gauss-Markov with batch normalisation of the weights
    to control the effective learning rate; that work weights by label-noise variance,
    this weights by input-draw variance'
  - 'shared-boundary-proximity-weighting (launched): the group-mean normaliser that
    preserves weight mass, and its recorded caveat that mass is preserved only in
    the fold-level, uniform-exposure sense'
  - 'shared-soft-mass-balance finding (-0.00918) and shared-biproportional-weights
    finding (-0.00441): both class-frequency reweightings; neither tests a reproducibility
    statistic'
  - 'shared-balanced-focal finding (-0.00260): up-weighting hard cells lost, which
    is the direction this rule reverses'
  - src/knee_abnormality/training/lightning.py:104-118 (weighted masked BCE), :222-228
    (non-persistent buffer precedent)
  novelty: 'A weighting keyed to a dynamic, training-only measurement of score reproducibility
    rather than to class counts (tempering, soft-mass, biproportional, prior offset)
    or to a static target property (boundary proximity). It is also mechanically distinct
    from shared-draw-consistency-anchor: that adds a term whose gradient pulls the
    score toward the anchor, while this adds no term and never changes a cell''s target
    or equilibrium, only how much the step listens to it. Reusing the same buffer
    is shared infrastructure, not a shared mechanism.'
  coverage: Every observed cell keeps its BCE term at every step; the factor only
    rescales it, and is exactly 1 before a cell's second visit, so nothing is dropped.
    Masks gate the factor and the loss identically. No pairs, so microbatch-8 pair
    sparsity does not apply. Log per label the realized mean and p10/p50/p90 of f
    within each group, the group normalisers, r_c, and the fraction of cells still
    at f = 1, so the strength of the reweighting is reconstructible rather than inferred.
  exploitation: Concentrates the fixed step budget on the cells whose evidence reproduces
    across draws, which is the part of the signal the deterministic multiplier-1 validation
    pass will actually see, and reduces the attenuation that input noise imposes on
    the fitted function. Because the factor is normalised within each class group,
    rare-positive emphasis is preserved exactly.
  budget: One extra EMA buffer of 168 KB and elementwise arithmetic on [8, 12]; no
    added loss term, no extra pass, no change to batch composition, epochs, steps,
    cohorts or validation selection. Expect well under 1% over the 1,562.3 s reference
    against the 1,797 s ceiling. Buffers are non-persistent, so checkpoints, checkpoint
    selection and inference state are unchanged.
  implementation: 'Add the factor under src/knee_abnormality/training/losses/ and
    apply it inside the existing masked weighted BCE in training_step; log an unweighted
    balanced BCE alongside it so the fit trajectory stays comparable with the control,
    since train_loss now measures a reweighted objective. Compute in float32 under
    bf16-mixed; f, r_c and the group normalisers are detached. Update the anchor and
    v after the loss, inside training_step only, from detached logits; validation
    and any sanity pass must never write them. New keys trainer.loss.{reliability_weighting,
    variance_momentum, drift_momentum}; no per-label field. Review points: the group
    rule matches the class-weight rule, no gradient flows through f, the factor is
    exactly 1 before the second visit, and the normaliser divides by a running mean
    rather than a per-step microbatch mean.'
  open_choices: 'Factor shape 1/(1 + v/r) (default, bounded in (0,1], halves at average
    noise) versus r/(r + v) scaled differently or a clipped inverse. Whether the normaliser
    is a running mean (default) or the current batch''s group mean. Whether v is drift-centred
    (default, otherwise early epochs measure drift). An alternative use of the same
    v that I am not proposing on this evidence: marginalising the BCE over the measured
    noise adds 0.5 * v * p(1-p), which pushes noisy cells toward saturation in whichever
    direction they already lean and so risks entrenching errors. Recorded risk: v
    is also elevated for genuinely ambiguous studies, so this rule partly down-weights
    hard cells, and shared-balanced-focal only establishes that the opposite direction
    lost.'
  dependencies: []
  priority_rationale: Second. Same measured opportunity, cheaper still, and it fails
    differently from the consistency term, but its statistic is confounded with genuine
    difficulty and its expected effect is indirect. It is executable standalone, yet
    shared-draw-consistency-anchor's logged per-label deviation and drift traces would
    settle, before this run, whether draw noise is material on the current recipe
    and how much of the deviation is model drift; running it first de-risks this one
    at no extra cost.
  status: proposed
  created_revision: 217
- id: shared-split-view-consistency
  mechanism_id: shared-within-step-subview-invariance
  parent_idea_id: null
  title: Penalise a study's split-half triplet disagreement inside the same step,
    using a second pooling of tokens the forward pass has already computed
  opportunity: 'Triplet-draw noise is the largest measured headroom in this campaign:
    the saved multiplier x1-x4 profiles imply 5-7% of each label''s score variance
    at the pinned multiplier 1 is irreproducible draw noise, worth about +0.005 to
    +0.0075 macro AUC, five to seven times the practical scale (draw-noise-20260920.md
    section 1). Both existing attacks estimate that noise from per-study cross-epoch
    state: shared-draw-consistency-anchor (developing) and shared-draw-reliability-weighting
    (proposed) both lag the model by roughly one epoch and conflate weight drift with
    draw noise, which that note names as the mechanism''s main risk. A lag-free estimate
    is available at no meaningful cost. KneeAbnormalityModel.forward is exactly pool_encoded(encode_batch(batch))
    and both halves are public, so the loss can pool a subset of the ~26.8 triplet
    images already encoded for a study without a second backbone pass (this job''s
    scratch note, section 6).'
  mechanism: Keep the primary class-balanced soft-target BCE bit-identical on the
    full pooling. Each step, split every study's valid acquisitions into two complementary
    halves, pool each half through the unchanged attention and head, and obtain s_A,
    s_B per study and label. Per label take the class-weighted mean over observed
    cells of (s_A - s_B)^2, using the existing weight table and the same y>=0.5 grouping,
    so the term cannot dilute class balancing (the inferred failure of shared-label-contrast-ranking).
    Divide by max(V_c, 0.25) where V_c is a detached EMA (momentum 0.9) of that label's
    between-study variance of the full-pool logits; the ratio is a noise-to-signal
    ratio, so a uniform logit shrink cannot satisfy the term, which matters because
    shared-target-logit-margin measured scale changes as AUC-neutral. Loss = balanced_bce
    + 0.1 * mean over labels. One formula, one coefficient, one grouping rule for
    all twelve labels. Studies with fewer than two valid acquisitions contribute nothing
    and are dropped from that label's average; a label with no active study contributes
    exactly zero. View logits and the term are computed in float32, as the existing
    pooling already forces.
  precedents:
  - 'R-Drop (Liang et al., NeurIPS 2021, arXiv:2106.14448): bidirectional KL between
    two dropout sub-models of the same input. Same consistency principle, but R-Drop
    pays two full forwards; here the perturbation is the sampler''s own unit and the
    encoder pass is shared.'
  - 'Multi-sample dropout (Inoue, arXiv:1905.09788): duplicates only the post-dropout
    head and makes exactly the cost argument used here, that the convolutional stack
    before the split is not duplicated.'
  - 'Pi-model and temporal ensembling (Laine & Aila, ICLR 2017): consistency under
    perturbation as a training-only regulariser.'
  - 'Attention-based deep MIL (Ilse, Tomczak & Welling, ICML 2018): pooling over an
    instance sub-bag is the same well-defined readout, which is what a half-view is
    here.'
  - 'Campaign, shared-draw-consistency-anchor (developing): same target quantity through
    cross-epoch per-study state. This is the lag-free alternative, not a re-run; neither
    result decides the other.'
  - 'Campaign, shared-group-variance-compression (queued): supplies the reviewed detached-normaliser
    and class-weight patterns reused verbatim here.'
  - 'draw-noise-20260920.md sections 1-2: the +0.005 to +0.0075 estimate, its caveats
    (neither fitted checkpoint is the current control; the m->infinity row is an extrapolation),
    and the ~1-epoch anchor lag.'
  - 'This job''s scratch note, section 6: cost arithmetic, RNG neutrality (model.dropout
    is 0.0), and the bit-identical primary forward.'
  novelty: No campaign candidate has read the model twice within a step; every training-only
    structure proposed so far is cross-epoch or cross-batch. The perturbation here
    is exactly what the measured noise is about, which triplets were drawn, rather
    than a proxy through elapsed weight updates, and the estimate is available at
    the same optimizer step as the gradient that consumes it.
  coverage: 'Log per label: mean |s_A - s_B|, the normaliser V_c, the realised component
    share of the objective, and the count of studies excluded for fewer than two valid
    acquisitions. The disagreement trace is a direct in-training measurement of the
    quantity the +0.005-0.0075 figure only extrapolates from saved validation multipliers,
    so the run yields new mechanism evidence even under a neutral macro result.'
  exploitation: If split-half disagreement falls substantially with no macro gain,
    the draw-noise headroom is not capturable by a training-time invariance constraint,
    which would retire the anchor and reliability-weighting lines together rather
    than one at a time. If disagreement barely moves, the coefficient or split granularity
    is implicated rather than the mechanism, and the logged normaliser says which.
  budget: 'Two extra poolings and their backward: LayerNorm plus Linear(256->128)
    and Linear(128->12) over ~10.5k spatial tokens, and a btn,nf->btf einsum with
    b=8, t=12, n=~10.5k, f=256. Under 1 GFLOP against roughly 300 GFLOP for the rexnet_200
    pass over ~214 triplet images. The backbone forward and backward are unchanged:
    extra views add gradient into the same features tensor and there is still one
    backward over the summed loss. Expect 1-2% on the measured 0.355 s/step (1,553.3
    s over 4,380 steps), inside the 235 s of ceiling headroom. Memory adds two attention
    maps of [8, 12, ~10.5k], about 4 MB each.'
  implementation: In training_step replace self(batch) with encoded = self.model.encode_batch(batch)
    and logits = self.model.pool_encoded(encoded); this is the same computation and
    RNG-neutral, because model.dropout is 0.0 (ATen dropout short-circuits at p=0)
    and _attention_pool draws nothing, so the primary path stays bit-identical. Build
    a view as dict(encoded) with visual_valid = encoded['visual_valid'] & keep[:,
    None], where keep is a per-acquisition bool over acquisitions that carry any valid
    token, grouped by encoded['study']; pool_encoded raises if a study has no valid
    token, so the keep mask must guarantee at least one per study per view. Draw the
    complementary split from a dedicated torch.Generator seeded from the run seed,
    so the model's augmentation stream is untouched. Put the split helper, the term
    and the EMA state under src/knee_abnormality/training/losses/, with non-persistent
    buffers (precedent lightning.py:224). New settings under trainer.loss. Data loading,
    model construction, optimizer and scheduler, validation forward, checkpoint selection,
    saved predictions and accounting are untouched.
  open_choices: 'Symmetric gradient through both halves or detach one. Coefficient
    0.1 and the variance floor 0.25. Split at acquisition level or at series level,
    the latter closer to the sampler''s budget allocation but coarser. Random complementary
    split or a deterministic rotating parity split needing no generator. Half-versus-half
    or full-versus-half. And the scope call the orchestrator owns: whether a second
    pooling of already-encoded tokens is allowed supporting loss computation, which
    is my reading since the encoder, attention module, classifiers and the primary
    forward are unchanged and no data pass or optimizer update is added, or a forward
    change outside the contract.'
  dependencies: []
  priority_rationale: The only queued or proposed mechanism aimed at the single largest
    measured headroom without a one-epoch lag, at 1-2% compute, and it keeps the supervised
    objective bit-identical so a macro move is attributable to the invariance term
    alone. Its principal risk is a scope ruling rather than feasibility or budget,
    and either outcome produces the campaign's first direct in-training measurement
    of draw sensitivity.
