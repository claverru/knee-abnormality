- id: shared-biproportional-weights
  mechanism_id: shared-biproportional-study-class-weighting
  parent_idea_id: null
  title: Balance class mass and study influence together with one biproportional weight
    fit
  opportunity: 'The incumbent balances each label''s positive and negative weight
    mass but leaves study influence uncontrolled, because the reduction is a pooled
    cell mean. On the fold-0 training table, per-study total weight mass has cv 0.295
    and max/min 3.72, rises monotonically with the number of positive labels (0 positives
    0.72x mean influence, 4 positives 1.04x, 8 positives 1.60x; correlation 0.788),
    and the top decile of studies carries 16.5% of all weight mass against 7.1% for
    the bottom decile. Abnormal studies therefore receive about 2.2x the gradient
    influence of normal ones purely as a side effect of class balancing. Control B
    already over-expresses a shared abnormality factor: its mean standardized logit
    alone scores 0.694-0.835 AUC per label, and PC1 holds 44.7% of prediction variance
    against 27.8% of target variance. Measurements: scratch/gradient-geometry-20260920.md
    section 2.'
  mechanism: 'Replace the 2x12 class-weight table with the biproportional fit of the
    same table: alternate (i) rescaling each training study''s weights so its observed
    cells sum to its observed cell count and (ii) rescaling each label''s positive
    and negative groups so their masses are equal, until both hold. On the fold-0
    table 200 sweeps converge exactly: per-study mass equal for all 3,503 studies
    and per-label positive/negative mass ratio 1.000 for all twelve labels, with cell
    weights 0.132-8.785 against the current 0.539-6.950 and correlation 0.898 with
    the current weights. At the fixed point the weights factor as w_ic = a_i * beta_{c,class(y_ic)}
    with a_i = n_obs(i) / sum_c beta_{c,class(y_ic)}, so training stores only the
    fitted 2x12 beta and recomputes the study factor from the batch''s own targets:
    no per-study table, no lookup, no state. One algorithm, zero tuned parameters,
    the same y >= 0.5 group rule and the same soft targets. Plain per-study normalization
    without the refit is a different and worse rule, rejected here: it drags per-label
    positive/negative ratios to 0.569-0.911 and per-label totals to 3,041-3,812 against
    a uniform 3,503.'
  precedents:
  - 'Deming and Stephan 1940 (iterative proportional fitting); Sinkhorn 1964: biproportional
    scaling of a matrix to prescribed row and column sums, which converges here to
    a study-factor times class-factor form.'
  - 'docs/modeling/supervision.md#fixed-class-balanced-bce: the whole-cell class weighting
    rule this generalizes.'
  - 'docs/validation/results/2026-09-19-balanced-bce-result.md: the measured gain
    of the current class balancing, whose defining property this fit preserves exactly.'
  - 'docs/research/auc_loss_approaches.md#weighting-and-sampling-design-space: enumerates
    class-axis weighting choices; study-axis influence under a pooled-cell reduction
    is absent from it.'
  - 'campaign ideas shared-tempered-balance and shared-soft-mass-balance: both act
    on the class axis (magnitude, assignment). This acts on the study axis and lets
    class magnitudes move only as far as the same balance constraint requires.'
  - 'researcher-20260920T121718Z-2ea25138/scratch/contrast-evidence-20260920.md section
    1: PC1 and common-factor excess on control B.'
  - outputs/autoresearch/losses/jobs/researcher-20260920T131338Z-3dc7e308/scratch/gradient-geometry-20260920.md
    section 2 (study_mass.py, sinkhorn.py).
  novelty: 'A second constraint on the same weighting rule rather than a different
    magnitude or a different assignment rule: the class-mass property that the measured
    baseline established is retained exactly (ratio 1.000 per label) while study influence
    is equalized in addition. Distinct from shared-tempered-balance (one exponent
    on the same per-label counts) and from shared-soft-mass-balance (threshold-free
    per-term assignment); either could later be composed with this fit, but neither
    is a variant of it. No per-label formula and nothing tuned.'
  coverage: Every observed cell keeps a strictly positive weight, its exact soft target
    and its mask. The study factor uses each study's observed cells only, so masked
    cells neither donate nor receive weight; on the fully observed fold-0 table the
    factor runs over all twelve. The fit uses training-fold labels only, exactly as
    the current counts do, and no validation or gold label enters it. Report the fitted
    beta table, the realized per-label positive/negative mass and per-study mass on
    the training fold, and per-label AUC as diagnostics.
  exploitation: Removes a 2.2x influence gradient between abnormal and normal studies
    that nobody chose and that pushes in the same direction as the model's already
    excessive shared abnormality factor, while keeping the one weighting property
    that was measured to help. Equal study influence is also the weighting under which
    each study's twelve cells compete on equal terms, which is what a per-label metric
    averaged over labels rewards.
  budget: One alternating fit over a 3,503x12 table at setup (200 sweeps, well under
    a second, on the frame fixed_class_balance already loads) plus one per-study row
    normalization per step on weights already materialized in float32. No extra pass,
    no persistent state, no change to preprocessing, sampling, optimizer, schedule
    or inference. Immaterial against the 1,797 s ceiling and control B's 1,562 s;
    ten epochs and 4,380 optimizer steps unchanged.
  implementation: Extend fixed_class_balance in lightning.py to run the alternating
    fit and emit the fitted 2x12 table as class_balance version 2, keeping count provenance,
    the config/statistics agreement check at lightning.py:93 and the checkpoint hyper_parameters.class_balance
    path consistent. In the objective helper, build cell weights with the existing
    torch.where group lookup against the fitted table, then divide each study's weights
    by their observed mean; keep the mask and the pooled mean over observed cells,
    in float32 under bf16-mixed. trainer.class_balanced_bce is the allowlisted key
    for the replacement, and the superseded table is replaced rather than kept behind
    a flag. Before launch, verify on the training fold that the shipped weights reproduce
    per-study equality and per-label ratio 1.000, and record the resulting weight
    range. Leave data loading, model construction, optimizer/scheduler, forward prediction,
    validation, checkpoint selection and triplet accounting untouched.
  open_choices: 'Whether the study factor normalizes to the study''s observed cell
    count (default; keeps the overall loss scale and train_loss comparability) or
    to a global constant. Whether the fit targets the exact fixed point or a partial
    move toward equal study mass; exact is the default because it is parameter-free.
    Whether class_balance retains the existing count fields for provenance alongside
    the fitted table, which it should. One question for the orchestrator: the contract
    permits a formula using each label''s training-fold class counts, and this fit
    uses the training-fold label table, though it still yields one shared 2x12 table
    and no per-label rule.'
  dependencies: []
  priority_rationale: 'Second. Parameter-free, near-free to run, and it corrects a
    measured 2.2x study-influence gradient that was never chosen while provably preserving
