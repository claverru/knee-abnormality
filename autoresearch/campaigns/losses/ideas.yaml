- id: shared-prior-offset-bce
  mechanism_id: shared-additive-prior-logit-offset
  parent_idea_id: null
  title: Handle class imbalance through an additive per-label prior offset in the
    link instead of a multiplicative weight table
  opportunity: 'Every imbalance candidate so far changed the magnitude of a multiplicative
    weight and lost (soft-mass -0.00918, biproportional -0.00441), so the multiplicative
    channel looks locally optimal and further magnitude edits have low value. The
    additive channel is untested here. Logit adjustment corrects imbalance by shifting
    the link by the class prior rather than scaling the loss, is Fisher-consistent
    for balanced error, and is the standard alternative to reweighting, whose effect
    is known to decay as training separates the data. A measured trace of the price
    the incumbent pays: on fold-0 validation the control over-predicts the mean probability
    of 11 of 12 labels (ACL 0.317 vs target mean 0.228, MCL 0.291 vs 0.172, Contusion
    0.354 vs 0.254; only Effusion under-predicts, 0.495 vs 0.573), so the weight table
    buys its balance with a systematic per-label level shift that AUC cannot use.'
  mechanism: 'Loss = mean over observed cells of BCE(s_ic + a_c, y_ic) with a_c =
    log(pi_c / (1 - pi_c)), pi_c the training-fold thresholded positive rate already
    stored in class_balance.json, and no multiplicative class weight (trainer.class_balanced_bce
    set false, replaced as the policy anticipates). Soft targets, observed mask, the
    y>=0.5 grouping used for diagnostics, and the pooled-cell reduction are unchanged;
    nothing is binarized or dropped. Because a_c is one constant per label, the population
    optimum moves from logit(y) to logit(y) - a_c, a strictly per-label monotone shift,
    so the optimum''s within-label ordering and therefore its AUC are exactly unchanged:
    the mechanism cannot damage the well-specified solution and can only change which
    cells dominate the finite-sample gradient. At s = 0 each label starts at its own
    prior instead of 0.5, so positives immediately carry residual about 1 - pi_c and
    negatives about pi_c, the same rebalancing the weight table performs, obtained
    through the link rather than a multiplier. Offsets are a_c from -2.557 (Fracture)
    to +0.395 (Effusion); they are applied only in the training objective, so validation
    logits, saved predictions and checkpoint selection keep the model''s own scores.'
  precedents:
  - 'Menon et al., ICLR 2021, logit adjustment for long-tail learning: additive prior
    offset in the loss is Fisher-consistent for balanced error and generally dominates
    loss reweighting on long-tailed benchmarks. tau = 1 is the prescribed, tuning-free
    setting.'
  - 'Byrd & Lipton, ICML 2019: importance weighting''s effect on the learned function
    diminishes during training on separable data; the incumbent''s grad_norm rising
    late (0.641 at epoch 4 -> 0.884 at epoch 8, recorded in the shared-balanced-brier
    finding) is consistent with a persistent tug-of-war that an additive reparameterization
    avoids.'
  - Lin et al. 2017 initialise the final bias to the prior log-odds for exactly this
    reason; here the head bias is measured tiny (max 0.103 in the shift-projected
    comparison), so the level is carried by learned weights rather than by a constant.
  - shared-soft-mass-balance (reject) and shared-biproportional-weights (reject) bound
    the multiplicative channel; their recorded attributions are about weight magnitude,
    not about the statistic itself, so neither rejection transfers to an additive
    offset.
  - shared-shift-projected-bce (inconclusive, -0.00406) removed the per-label level
    from the gradient with a batch-8 estimator that discarded 15-68% of gradient energy.
    Supplying the level analytically is the zero-variance version of that premise,
    though the per-label heads can in principle absorb the level themselves, which
    weakens the capacity argument.
  - 'Evidence artifacts: control fold_0/class_balance.json (rates 0.0719-0.5975) and
    oof_predictions.csv.'
  novelty: 'The only proposal that removes the multiplicative weight table rather
    than re-deriving it, and the first use of the additive channel in this campaign.
    It is not a target change: it is a per-label reparameterization of the link that
    is provably AUC-neutral at the optimum.'
  coverage: Per epoch and per label, log positive-group and negative-group gradient
    mass, mean training logit, and weighted-free BCE, so the known risk is directly
    observable. Verify that the offset is applied only in training_step and that validation
    BCE, validation AUC, checkpoint selection and saved predictions use unoffset logits.
  exploitation: If positive, the whole imbalance treatment moves to the additive channel
    and the natural successors are the offset statistic (thresholded rate vs soft
    mean) and a schedule on the offset. If negative, the campaign has bounded both
    channels for imbalance handling and weighting can be closed as an axis.
  budget: One broadcast add per step, zero extra state, zero extra passes. Runtime
    indistinguishable from the control; the ~190-235 s of recorded ceiling headroom
    is untouched.
  implementation: Persist a_c alongside the existing per-label statistics in the class-balance
    artifact (new version; targets list still validated against the model). In lightning.py
    add the per-label offset tensor to the float32 logits inside the training objective
    only, and pass no class-weight tensor. Set trainer.class_balanced_bce false with
    a new trainer.loss key recording the offset statistic, so the effective config
    distinguishes the run from an unweighted control. Numerically the offset is added
    before binary_cross_entropy_with_logits, so stability is unchanged. Data loading,
    model construction, optimizer/scheduler, forward prediction, validation, checkpoint
    selection and accounting stay untouched.
  open_choices: 'Main measured risk, to be recorded before launch: on fold-0 training
    targets the offset-only objective at s = 0 gives per-label positive/negative gradient-mass
    ratios 0.58 (Fracture) to 2.58 (Baker''s) against the control''s 0.86-1.78, and
    widens the across-label mean-|gradient| spread from 1.23x to 2.55x, i.e. it de-emphasises
    rare-label positives, the same direction as the rejected soft-mass candidate.
    Alternative statistic a_c = logit(mean soft target) reproduces the control''s
    realized per-label mean logit (corr 0.970, RMSE 0.232 logits, versus 0.739 for
    logit pi_c) and makes the signed gradient exactly zero at initialization, at pos/neg
    ratios 0.47-1.00. Retaining the class weights alongside the offset is measured
    to be worse (Fracture init pos/neg mass ratio 6.25) and is not recommended. tau
    stays fixed at 1; no sweep.'
  dependencies: []
  priority_rationale: Most novel channel left, zero cost, strong external precedent,
    and a theoretically clean AUC-neutrality at the optimum. Ranked second because
    the measured initialization diagnostics show it shifts positive/negative mass
    in the same direction as an already-rejected candidate, and because the per-label
    heads can absorb the level, which weakens its second motivation.
  status: completed
  created_revision: 185
  ranking_rationale: "Admit shared-draw-consistency-anchor and rank it second, behind\
