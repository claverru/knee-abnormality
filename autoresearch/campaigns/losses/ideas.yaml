- id: shared-centroid-margin
  mechanism_id: shared-class-centroid-margin
  parent_idea_id: null
  title: Replace sampled pairs with a shared margin against the opposite class centroid
    so every cell gets ranking pressure
  opportunity: 'The separation signal has only been tested through sampled pairs,
    and pair sampling is both sparse and noisy here. At batch 8 the probability that
    a label has any usable positive/negative pair is 0.450 for Fracture, 0.669 for
    Synovitis and 0.737 for MCL, and which partners a cell draws determines the gradient
    it gets; the measured hybrid covered only ~10 of 12 labels per step and was neutral.
    The moment reformulation of the square-loss AUC risk shows the separation signal
    does not need pair enumeration: it is a mean-gap term against class-conditional
    statistics. A margin against the opposite class''s running centroid gives every
    observed cell a ranking gradient at every step with far lower variance, and at
    margin 1.0 logits it is active on only ~13.5% of cells, which is where discordance
    lives (bottom-decile positives and top-decile negatives carry 78-99.6% of discordant
    pairs). Evidence: scratch/group-geometry-20260920.md sections 1 and 4.'
  mechanism: 'Keep balanced soft BCE bit-identical and add one shared centroid-margin
    term. Reuse detached EMA class centroids mu[c,pos], mu[c,neg] (24 scalars, momentum
    0.9) built from observed training cells only. For each observed cell, with the
    same y>=0.5 grouping the class weights use: positives pay max(0, m - (s - mu[c,neg]))^2
    and negatives pay max(0, m - (mu[c,pos] - s))^2, with m = 1.0 in logit units.
    Average per label over observed cells weighted by the existing class weights,
    then average labels, then multiply by lambda = 0.25, targeting roughly a 10% objective
    share; both measured pair runs sat at 26-48% share and were neutral or harmful,
    so a minority share is the defensible single choice. Gradient flows only through
    the cell''s own score: the centroids are detached, so the term cannot be minimized
    by moving the anchors. Soft targets stay untouched in the BCE term; the hard grouping
    is only the pair-eligibility analogue the contract already permits for ranking
    terms, and it does not rewrite labels.'
  precedents:
  - 'Ying, Wen & Lyu, NeurIPS 2016: the square-loss AUC risk equals class-conditional
    variances plus a mean-gap term, so the separation signal is available without
    pair enumeration. https://proceedings.neurips.cc/paper/2016/hash/c52f1bd66cc19d05628bd8bf27af3ad6-Abstract.html'
  - 'Kim et al., Proxy Anchor Loss for Deep Metric Learning, CVPR 2020: proxies let
    every example interact with a whole class rather than with sampled partners, which
    is the coverage and variance argument transferred here. https://arxiv.org/abs/2003.13911'
  - 'Yuan et al., AUC-M, arXiv:2012.03173: margin between class-conditional means;
    its min-max needs PESG, which detaching the anchors avoids.'
  - Campaign result shared-bce-ranking (inconclusive, +0.00073 [-0.00329, +0.00479],
    ~118 pairs/step, ~10/12 labels covered, +3.3% runtime) - the sampled-pair route
    at full weight.
  - 'Campaign results shared-bernoulli-pair-ranking and shared-label-contrast-ranking
    (both reject): soft-pair mass and an unweighted cross-label contrast; the latter''s
    harm was attributed to diluting class balancing, which this term avoids by carrying
    the class weights.'
  - docs/research/auc_loss_approaches.md sections 1-4 for the pairwise and AUCM families
    and their ranking in this project.
  - 'jobs/researcher-20260920T141757Z-27ab0eb1/scratch/group-geometry-20260920.md,
    sizing.py: active-band shares 8.1% / 13.5% / 30.3% at margins 0.5 / 1.0 / 2.0
    and the microbatch coverage arithmetic.'
  novelty: 'Proxy-based rather than pair-based: no pair enumeration, no O(pairs) loop,
    and no dependence on batch composition, so it is not a reweighting of the neutral
    hybrid. It is not shared-ranking-memory-bank either - no queue of individual stale
    scores, no pair formation, and no dependency on that undecided idea; the only
    state is two scalars per label. Unlike shared-label-contrast-ranking it compares
    within a label, not across labels, and it carries the class weights so it cannot
    offset class balancing. Unlike shared-group-variance-compression it pushes the
    gap rather than compressing spread; the two are the separate halves of the same
    moment form and must not be run together.'
  coverage: Every observed cell gets a term at every step, including labels with no
    positive in the microbatch, which is the coverage the pair experiments could not
    reach (Fracture 0.450 of steps, Synovitis 0.669). Masks are honored, soft targets
    remain in the BCE term, and self-comparison cannot arise because the anchor is
    a detached statistic. Log per-label active-band share, term value, centroids and
    gap, the realized component share, and steps where a group was absent from the
    EMA update.
  exploitation: The squared hinge is silent on confident, well-separated cells and
    grows quadratically for cells inside the band, i.e. the bottom-decile positives
    and top-decile negatives that carry 78-99.6% of discordant pairs. Compared with
    sampled pairs, each cell is measured against the whole opposite class, which removes
    partner-draw variance.
  budget: 'Two scalars per label plus elementwise operations on the 8x12 logit tensor:
    no pair loop, no extra pass, no precomputation. The measured pair loops cost +52
    s (+3.3%) and +62 s (+4.0%) of the 1,797 s ceiling; this avoids the loop, so expect
    an overhead near focal''s +17 s (+1.1%). Ten epochs, 4,380 steps, cohort, triplets
    and validation identity unchanged; state is training-only and non-persistent so
    checkpoints and inference are untouched.'
  implementation: 'Share the centroid helper under src/knee_abnormality/training/losses/
    with the variance idea, but run one mechanism per experiment. Call the term from
    training_step (lightning.py:305-320) beside the unchanged balanced BCE and log
    the components separately. Register the centroids as a non-persistent buffer,
    initialize from the first step''s observed group means, update after the loss
    from detached float32 logits in training_step only, and never from validation
    or sanity-check batches. Compute softplus-free squared hinges in float32 under
    bf16-mixed; define the term as zero for a label whose opposite-group centroid
    has not been initialized yet, and log how many steps that affects. New keys trainer.loss.{margin_weight,
    margin, centroid_momentum}; one scalar each, no per-label vector. Leave data loading,
    model construction, optimizer/scheduler, forward prediction, validation, checkpoint
    selection and triplet accounting untouched. Review points: no gradient through
    the anchors, class weights applied, hard grouping used only for term eligibility,
    realized active-band share logged per epoch.'
  open_choices: 'Squared hinge (default) versus a logistic form against the centroid.
    Margin m = 1.0 logits from the measured 13.5% active-band share; do not sweep.
    Whether the warm-up uses the first step''s group means (default) or a fixed number
    of BCE-only steps before the term activates. Whether the anchor is the EMA centroid
    (default) or the current batch''s group mean, which would reintroduce the coverage
    gap. Recorded risk: this is the closest non-pair analogue of an already-measured
    neutral direction, so a null result would mostly retire the separation axis rather
    than the implementation.'
  dependencies: []
  priority_rationale: Recommend second. It supplies the separation signal with full
    coverage and much lower variance than the measured pair terms, and it reuses the
    variance idea's centroid state, so implementation is cheap. It ranks below the
    variance term because its pressure direction is the one the campaign has already
    probed twice with neutral and negative outcomes, while within-group compression
    is untested.
  status: completed
  created_revision: 116
  ranking_rationale: 'Queue reordered on new evidence: shared-tempered-balance drops
    from second to last. Biproportional weighting''s realized effect on fold 0 was,
    in part, exactly a tempering of the control weights toward 1 (positive weight
    for the rarest label 6.95 -> 4.73; for the most prevalent 0.837 -> 0.926, class_balance.json),
    combined with study normalization, and it lost 0.0044 macro AUC with an interval
    strictly below zero. That is direct negative evidence for the compressing direction
    of shared-tempered-balance; only the sharpening direction remains untested, so
    it is now the weakest of the weighting ideas. shared-soft-mass-balance (threshold-free
    recount of positive mass, no deliberate emphasis compression) and shared-group-variance-compression
    (different mechanism family) move ahead of it. Reserved head unchanged.


    shared-delayed-ranking is admissible (no unresolved dependencies) but stays proposed
    rather than queued: the always-on hybrid''s logged traces already showed an actively
    trained ranking term holding ~26-45% of the objective with ~118 usable pairs/step
    and a neutral outcome, so re-timing the same term has lower expected value than
    the three untested weighting/variance mechanisms already queued. Retained for
    later, not rejected. shared-ranking-memory-bank remains blocked by its unresolved
    dependency on shared-bce-ranking (inconclusive).'
