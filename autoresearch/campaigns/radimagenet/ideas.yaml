  title: Train 14 epochs instead of 10 with the same warmup and cosine shape
  opportunity: ResNet-18 leads the control through epoch 5, then gains only +0.0039
    over epochs 5-9 against +0.0087, with training loss above the control's from epoch
    2 (prior-work.md). The cosine reaches its floor at epoch 9 while the curve still
    rises.
  mechanism: trainer.max_epochs 14; warmup and cosine scale with the run as today.
