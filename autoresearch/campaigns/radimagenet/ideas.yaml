    base run and the ReXNet control.
  budget: About 1,520 s, 140% of the RadImageNet base run.
  implementation: 'Configuration-only: the RadImageNet base (contract) plus this change.'
  open_choices: None.
  dependencies: []
  priority_rationale: Cheapest test of whether flattening is the schedule running
    out.
