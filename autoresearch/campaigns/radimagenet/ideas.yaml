- id: rn18-multiscale-tokens
  mechanism_id: token-readout
  parent_idea_id: null
  title: Add layer3 (stride-16) tokens next to layer4 tokens
  opportunity: ResNet-18's final 512-channel 7x7 map may limit what attention can
    pool; stride-16 tokens add detail at small cost.
  mechanism: Project layer3 features to the token width and pool them with the layer4
    tokens, with their own position embeddings.
