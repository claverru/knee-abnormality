- id: mixture-of-member-priors-for-knee-reference
  mechanism_id: knee-level-disease-term
  parent_idea_id: family-mean-prior-for-knee-reference
  title: "Preserve each family member\u2019s attention support in the knee-level reference"
  opportunity: "The family-mean-prior run missed adoption: macro \u0394 +0.000090,\
    \ 80% interval [\u22120.000379,+0.000571]. Its mechanism remained active through\
    \ epoch 9, excluding inactivity as the explanation. OA attention TV reached 0.0455,\
    \ but its scale-weighted common-logit change was only about 0.0010. Medial OA\
    \ \xD71 finished at 0.9137 versus the incumbent\u2019s 0.9160. Source inspection\
    \ establishes that averaging priors before softmax forms a normalized geometric\
    \ mean of member attention distributions; the meniscus pair\u2019s signed-medial\
    \ sinusoidal terms also cancel exactly. Hypothesis: this aggregation suppresses\
    \ distinct anatomical support that a whole-family reference should preserve."
  mechanism: "In modeling/model.py::_attention_pool, replace common reference pooling\
    \ with a mixture of independently normalized member attentions. For channel c\
    \ and every member t, compute a_t(n)=softmax_valid(score_c(n)+prior_t(n)), without\
    \ routing. Set a_c(n)=sum_t a_t(n)/K_c, where K_c is the family cardinality, then\
    \ e_c=sum_n a_c(n)*shared_evidence_c(n). Retain the existing learned knee_level_scale\
    \ and add the identical scale_c*e_c to every member\u2019s logit. Averaging normalized\
    \ distributions preserves separate support while remaining invariant to member\
    \ permutation. Reuse existing priors, valid membership, evidence and stochastic\
    \ draws; add no parameters, geometry or supervision. Log per-family attention\
    \ TV and actual scale-weighted logit changes against both score-only pooling and\
    \ the failed mean-prior construction, using detached counterfactuals. Evidence-backed:\
    \ the aggregation distinction and cancellation. Guess: preserving support improves\
    \ the common reference and macro discrimination."
