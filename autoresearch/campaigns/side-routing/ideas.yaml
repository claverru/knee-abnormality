- id: knee-level-term-with-front-and-up-routing
  mechanism_id: knee-level-disease-term
  parent_idea_id: null
  title: Add to every routed target the shared classifier's knee-level evidence, and
    route PF OA from the front-and-up region
  opportunity: 'Evidence-backed observation, mechanism a guess. Exclusive regions
    make a routed target better at telling its compartment from the others and worse
    at the plain AUC, because OA in one compartment predicts OA in another (166 of
    the 363 OA studies of the fold have more than one compartment) and an exclusive
    region cannot see the other compartments'' evidence. Three runs show it. Fourth
    run, front tokens counted for the OA sides as well as for PF OA (weights not summing
    to one): Medial OA +0.0030, Lateral OA +0.0022 against the old recipe, 0.953 public.
    Fifth run, sides on the back only: +0.0013 and +0.0003, 0.952 public. front-and-up-region-for-pf-oa
    (this campaign, 2026-10-06), PF OA on front-and-up and the sides on the rest:
    PF OA localisation +0.0153 against the incumbent (tolerance 0.0057), the largest
    localisation gain of the line, with PF OA +0.0013; but Medial OA -0.0009 and Lateral
    OA -0.0027, routed sum -0.0049, macro -0.0002, not adopted. Giving the sides the
    front-and-low region back did not help them, so what they lost after the fourth
    run is the PF region''s evidence, not their own front. The design should keep
    exclusive regions for localisation and return the knee-level evidence explicitly
    instead of through overlapping regions.'
  mechanism: 'Two parts. (A) Routing exactly as front-and-up-region-for-pf-oa, whose
    source is in outputs/autoresearch/side-routing/experiments/front-and-up-region-for-pf-oa-20261005T214523Z-ed5cce90/source:
    r_up = sigmoid(h / width_up) with a new learned width started as the others; PF
    OA r_front * r_up; Medial OA r_medial * (1 - r_front * r_up); Lateral OA (1 -
    r_medial) * (1 - r_front * r_up); meniscus targets unchanged; ROUTES ("medial",
    "lateral", "front_up", "medial_rest", "lateral_rest") with TARGET_ROUTES and PRIOR_VARIANTS
    following. (B) A knee-level term for the two shared channels. In KneeAbnormalityModel._attention_pool,
    for each shared channel c compute an unrouted attention over the study''s valid
    tokens, softmax(score_c + view bias) with the same scorer output and view label
    bias the routed targets use, with no routing term and no position prior, and pool
    the channel''s evidence with it: g_c = sum over tokens of that attention times
    evidence_c (the same evidence, from the shared classifiers'' position-free tokens).
    Every target k of channel c then has logit_k = its routed logit + scale_c * g_c,
    where scale is a new learned parameter with one scalar per shared channel (meniscus,
    oa), started at zero under torch.random.fork_rng. The scale is shared by the targets
    of a channel, so without routing and prior they still have equal logits and a
    side flip still swaps medial and lateral exactly. The seven own-channel targets
    are unchanged. Nothing else changes.'
  precedents:
  - 'docs/ongoing/side-routed-heads.md, Fourth run and Fifth run: Medial OA and Lateral
    OA with and without the front of their side; S113 0.953 and S114 0.952.'
