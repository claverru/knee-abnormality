  title: Restore content-dependent spatial selection through a detached own-channel
    attention prior
  opportunity: "Removing position from own content scoring reduced macro AUC by 0.000665,\
    \ with 80% interval [\u22120.001682,+0.000363]. MCL \xD71 was lower throughout\
    \ training and ended at 0.8989 versus the incumbent\u2019s 0.9084; Fracture finished\
    \ at 0.9206 versus 0.9227. Their \xD74 deltas were \u22120.011500 and \u22120.003993,\
    \ both newly below all siblings. The minimum attention TV across seven own channels\
    \ persisted at 0.1067\u21920.1187. Evidence-backed: the intervention removed nonlinear\
    \ content\u2013position conditioning and substantially changed attention. Hypothesis:\
    \ additive spatial priors alone cannot replace useful appearance-dependent spatial\
    \ selection. Training dynamics remain an alternative explanation."
  mechanism: "Keep position-free own content scoring, but add an explicit detached\
    \ bilinear positional prior uniformly to all seven own channels. Let z be existing\
    \ normalized position-free tokens, h=tanh(attention[0](z)) with the existing own\
    \ dropout draw, and phi(p) the existing 42-dimensional sinusoidal prior basis.\
    \ For each own channel t, add I_t(n)=stopgrad(h(n))^T B_t phi(stopgrad(p(n)))\
    \ to its attention score, alongside the current additive prior and view bias.\
    \ Initialize every 128\xD742 B_t at zero; set I_t=0 for invalid positional geometry.\
    \ The 37,632 coefficients learn from the unchanged disease loss, while this reader\
    \ sends no gradient to backbone, projection, content features or frame. Preserve\
    \ position-bearing classifier values exactly. Shared attention and evidence receive\
    \ no interaction. Log centered interaction RMS, attention TV and actual own-logit\
    \ changes against I=0 using identical evidence, dropout and membership. Guess:\
    \ explicit conditional spatial selection recovers the loss pattern without restoring\
    \ the implicit positional scorer."
