  title: Add to every routed target the shared classifier's knee-level evidence, on
    the incumbent's routing
  opportunity: 'Evidence-backed observation, mechanism a guess. Exclusive regions
    make a routed target better at telling its compartment from the others and worse
    at the plain AUC, because OA in one compartment predicts OA in another (166 of
    the 363 OA studies of the fold have more than one compartment) and an exclusive
    region cannot see the other compartments'' evidence. Three runs show it. Fourth
    run, front tokens counted for the OA sides as well as for PF OA (weights not summing
    to one): Medial OA +0.0030, Lateral OA +0.0022 against the old recipe, 0.953 public.
    Fifth run, sides on the back only: +0.0013 and +0.0003, 0.952 public. front-and-up-region-for-pf-oa
    (this campaign, 2026-10-06), PF OA on front-and-up and the sides on the rest:
    PF OA localisation +0.0153 against the incumbent (tolerance 0.0057), the largest
    localisation gain of the line, with PF OA +0.0013; but Medial OA -0.0009 and Lateral
    OA -0.0027, routed sum -0.0049, macro -0.0002, not adopted. Giving the sides the
    front-and-low region back did not help them, so what they lost after the fourth
    run is the PF region''s evidence, not their own front. The design should keep
    exclusive regions for localisation and return the knee-level evidence explicitly
    instead of through overlapping regions. knee-level-term-with-front-and-up-routing
    changes the PF OA region and adds the knee-level term in one design. This seed
    is the same term on the incumbent''s regions (PF OA in front, the OA sides behind),
    so the two runs together show what the term is worth with each region, and the
    campaign has a design ready that returns the other compartments'' evidence without
    moving any cut.'
  mechanism: 'Part (B) of knee-level-term-with-front-and-up-routing only, on the incumbent''s
    routing, which does not change. In KneeAbnormalityModel._attention_pool, for each
    shared channel c compute an unrouted attention over the study''s valid tokens,
    softmax(score_c + view bias) with the same scorer output and view label bias the
    routed targets use, with no routing term and no position prior, and pool the channel''s
    evidence with it: g_c = sum over tokens of that attention times evidence_c (the
    same evidence, from the shared classifiers'' position-free tokens). Every target
    k of channel c then has logit_k = its routed logit + scale_c * g_c, where scale
    is a new learned parameter with one scalar per shared channel (meniscus, oa),
