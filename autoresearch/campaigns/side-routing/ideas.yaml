- id: zero-sum-geometric-side-readout
  mechanism_id: side-reader-geometric-centering
  parent_idea_id: null
  title: "Center the side reader\u2019s signed geometric weights within each study"
  opportunity: "The incumbent\u2019s training side accuracy rises from 90.35% to 97.81%\
    \ over epochs 0\u20132. Final reported validation accuracy is high, but its accuracy\
    \ metric covers certain metadata cases. A new 256-study training-only census found\
    \ 135 studies outside that certainty category. The existing signed pool responds\
    \ to a spatially constant token score whenever its geometric weights are unbalanced:\
    \ the median absolute constant-score response coefficient was 0.13973, with p10\u2013\
    p90 0.12149\u20130.16048. This establishes sampling imbalance, not harmful learned\
    \ bias. Removing that nuisance response could improve the posterior used on unresolved\
    \ studies."
  mechanism: "For the existing eligible axial/coronal tokens, let V_i denote validity,\
    \ N=sum(V_i), t_i=tanh(displayed_x_i/w_side), and m=sum(V_i*t_i)/N. Retain the\
    \ nonlinear per-token reader s_i on detached normalized tokens, but replace its\
    \ side logit with L=sum(V_i*(t_i-m)*s_i)/N, using the existing empty-pool handling.\
    \ Relative to the uncentered pool, the correction is m times the mean token score.\
    \ Any spatially constant score now contributes exactly zero; balanced pools reproduce\
    \ the existing formula. Keep gradients through the learned width and centering\
    \ calculation, while token and header inputs remain detached. Remove the final\
    \ reader\u2019s scalar bias because centering makes it identically ineffective.\
    \ Evidence-backed: the nonzero geometric coefficient and exact cancellation property.\
    \ Hypothesis: suppressing common content responses improves side inference. No\
    \ hemisphere renormalization, additional scale, new network, frame-origin shift\
    \ or routing-cut change is introduced."
