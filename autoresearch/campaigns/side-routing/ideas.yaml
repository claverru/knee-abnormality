    64\u2192256 dimensions, but initialize W2 and b2 to zero. Detach anatomical coordinates\
    \ before both paths and return zero for invalid geometry. Shared tokens remain\
    \ position-free. Log the actual residual RMS, residual-to-fixed-code norm ratio\
