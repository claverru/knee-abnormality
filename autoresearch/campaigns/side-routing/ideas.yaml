- id: independent-pf-cut-normals
  mechanism_id: octant-routing
  parent_idea_id: separate-oa-frame-for-octant-routing
  title: Learn PF front and height cuts independently while retaining the common medial
    midline
  opportunity: "The separate-frame report preserves the PF localisation gain but exposes\
    \ a tradeoff: PF localisation delta +0.013651, Medial OA \u22120.003102 and Medial\
    \ Meniscus \u22120.001091. Its OA and meniscus turns finish at \u22126.1426\xB0\
    \ and +6.1642\xB0, while the OA height width barely changes, 5.0049 to 5.0960\
    \ mm. Source inspection shows that one rigid OA rotation moves its medial, front\
    \ and height cuts together. The linked study drawings show how rotating the front\
    \ cut also rotates the height boundary. The hypothesis is that rigid orthogonality\
    \ and separate medial-axis ownership constrain the useful PF region, rather than\
    \ a lack of mechanism activation."
  mechanism: "In modeling/model.py, retain the incumbent meniscus frame R and its\
    \ medial cut. For each existing left/right geometric hypothesis, use the header-aligned\
    \ anterior coordinate y and superior coordinate z about the fitted centre. Learn\
    \ two global angles a_f and a_u, each initialized at zero with the existing bounded-angle\
    \ parameterization. Define f = cos(a_f)y + sin(a_f)z and u = -sin(a_u)y + cos(a_u)z.\
    \ Set P = sigmoid(f/w_front) * sigmoid(u/w_up). With M from the retained medial\
    \ cut, routes are PF=P, Medial OA=M(1-P), Lateral OA=(1-M)(1-P), summing to one.\
    \ Marginalize complete conditional partitions over the existing side probability.\
    \ Evaluate OA priors using medial depth and these two cut distances; retain meniscus/own\
    \ positions in R. Replace the independent rigid OA frame with the two independent\
    \ PF normals. Measured evidence supports examining this coupling; improved anatomy\
    \ and AUC are hypotheses. No illustrated 25\xB0 or 45\xB0 angle is imposed."
