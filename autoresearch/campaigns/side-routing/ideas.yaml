- id: visible-token-footprint-routing
  mechanism_id: token-footprint-routing
  parent_idea_id: null
  title: "Average complete routing partitions over each token\u2019s measured visible\
    \ stride cell"
  opportunity: "The incumbent\u2019s Medial Meniscus \xD71 curve flattens at 0.9411\u2192\
    0.9407 over epochs 7\u20139 while training loss continues falling. The latest\
    \ frame retry leaves that target below all siblings and does not resolve localisation.\
    \ A training-only geometry census measured token pitches of about 12\u201317 mm\
    \ against learned routing widths of 4.72\u20135.55 mm. Four-point cell integration\
    \ changed median study-level mean route weights by 0.00563\u20130.00726 across\
    \ all five routed targets. This supports investigating spatial aliasing from assigning\
    \ an extended token entirely by its anchor; it does not establish an attention\
    \ or AUC improvement."
  mechanism: "Replace anchor-only shared routing with fixed four-point Gauss\u2013\
    Legendre integration over the token\u2019s stride cell. Derive offsets (\xB1stride_x/(2\u221A\
    3), \xB1stride_y/(2\u221A3)) from the verified feature mapping, transform each\
    \ point through the existing inverse augmentation/reflection and middle-slice\
    \ patient map, and use the fitted centre, measured study axis and incumbent family\
    \ frames. At each valid point evaluate the complete existing meniscus and OA routing\
    \ vectors, then average vectors over visible points. Average the full OA front/up/rest\
    \ products, rather than multiplying separately averaged cell gates. Convex averaging\
    \ preserves each family\u2019s tokenwise sum of one. Apply source-rectangle validity\
    \ to every point; normalize surviving points and use anchor routing when none\
    \ survive. Preserve neutral routing for invalid geometry. Evidence-backed: physical\
    \ pitch, routing changes and boundary masking in the census. Hypothesis: a stride\
    \ cell approximates spatial support better than one anchor. No learned footprint,\
    \ manual anatomical distance or new cut is added."
