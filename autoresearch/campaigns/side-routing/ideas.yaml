- id: calibrated-shared-report-outputs
  mechanism_id: report-attribute-routing
  parent_idea_id: spatial-priors-for-routed-report-heads
  title: Keep report evidence shared and learn separate question intercepts
  opportunity: 'The priors retry changed supervised attention throughout training,
    yet all twelve shared questions finished with higher training KL than the reference.
    A training-only census of the 3,533 non-fold-1 studies identifies a concrete mismatch:
    weighted medial/lateral meniscus ''tear'' frequencies are 0.2538/0.1085; cartilage
    ''no_damage'' frequencies are 0.5857 medial, 0.7088 lateral and 0.5108 PF. The
    current shared report classifier ties its option biases. Constant-only predictors
    lose 0.038469 nats for meniscus status and 0.031117 for tear location when their
    intercepts are tied. These measurements establish different answer distributions;
    they do not establish a lower bound on the feature-dependent head''s loss.'
  mechanism: 'In src/knee_abnormality/training/report_attributes.py, implement the
    five historical shared families with their routed, position-free token pools and
    zero-started spatial priors. Add a zero-initialized question-by-option parameter
    block U for each shared family. Use delta = U - mean_options(U) - mean_questions(U)
    + mean_all(U), and output z[q,o] = shared_classifier[F,o](pool[q]) + delta[q,o].
    The centering separates common family calibration from question differences. These
