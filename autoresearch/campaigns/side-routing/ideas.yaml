- id: side-hypothesis-attention-marginalization
  mechanism_id: side-hypothesis-attention-marginalization
  parent_idea_id: null
  title: Marginalize complete shared attention pools over the knee-side posterior
  opportunity: "The incumbent finishes \xD71 at 0.9162, and Medial Meniscus remains\
    \ below every sibling in the latest mixture report. Its source averages side-conditioned\
    \ geometry before attention normalization; the queued feature-expectation proposal\
    \ also averages before softmax. Neither operation equals an expectation of complete\
    \ conditional attention. The loader census has 2,335 of 4,407 studies without\
    \ certain metadata, including 170 without an assigned side. This establishes possible\
    \ coverage, not uncertain posteriors or a causal explanation for weak localisation.\
    \ Existing logs lack posterior-confidence distributions."
  mechanism: "For each study, construct complete left and right hypotheses for unresolved\
    \ acquisitions, holding every certain or bilateral acquisition override fixed\
    \ in both bags. Derive detached q from unresolved acquisitions\u2019 effective\
    \ left_probability values, which agree within a study; preserve those effective\
    \ values as authoritative. Under hypothesis h, evaluate the current family frame,\
    \ deterministic target prior P_t^h and complete complementary route r_t^h. Compute\
    \ A_t^h=softmax(s_family+P_t^h+g_t^h log(r_t^h)/T) over the same visually valid\
    \ study tokens, with the inherited one-token eligibility gate g evaluated within\
    \ each hypothesis. Use A_t=qA_t^L+(1\u2212q)A_t^R, then pool the unchanged position-free\
    \ shared evidence. Both branches are normalized, so their mixture is normalized.\
    \ Expose marginal routing as q r^L+(1\u2212q)r^R, preserving tokenwise family\
    \ partitions. Deterministic cases reproduce a single conditional path. Evidence-backed\
    \ change: move expectation outside nonlinear routing products and attention normalization.\
    \ Predictive benefit is a hypothesis."
