    \ frame for OA routes and OA/PF position priors. In that frame, derive m, f and\
    \ u with the existing side-probability mixing and sigmoid widths; assign OA weights\
    \ (f*u, m*(1-f*u), (1-m)*(1-f*u)). Meniscus weights remain (m_meniscus,1-m_meniscus).\
    \ Keep current medial/front/side widths and the previous zero-deviation up-width\
    \ parameterization. Log both frame trajectories and the actual assignment difference\
