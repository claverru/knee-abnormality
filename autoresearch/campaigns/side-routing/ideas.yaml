- id: front-and-up-region-for-pf-oa
  mechanism_id: octant-routing
  parent_idea_id: null
  title: Route PF OA from the front-and-up region and give Medial and Lateral OA the
    rest of their side, with a height cut held by the same competition
  opportunity: 'Evidence-backed for the geometry (drawings), a guess for the gain.
    In the fifth run the front cut passes through the fitted centre and only the learned
    rotation can tilt it. The nod ended at 5 degrees, so the cut stayed close to vertical,
    and Medial OA and Lateral OA, which gave up the whole front of their side, fell
    from +0.0030 and +0.0022 (fourth run, front tokens counted for their side) to
    +0.0013 and +0.0003, while PF OA stayed above all 12 sibling runs (+0.0071). The
    drawings of 2026-10-05 (outputs/analysis/octant-sketches-20261005, docs/ongoing/side-routed-heads.md,
    Octant sketches) show why a vertical cut costs them: the fitted centre sits at
    the notch, about 15 mm above the joint line, so the front-and-low region holds
    the front of the tibial plateau, its cartilage and the anterior meniscal horns,
    which belong to the tibiofemoral compartments, and the front-and-up region alone
    holds the kneecap and the trochlea. The position prior of the third run found
    the same split unaided: PF OA 45 mm in front and 21 mm up, the two OA sides 18
    mm behind and 16 mm down.'
  mechanism: 'A third cut, at the frame''s height coordinate, used for routing because
    PF OA and the two tibiofemoral OA targets compete across it. With (m, f, h) =
    frame(...) as today: r_medial = sigmoid(m / width_medial), r_front = sigmoid(f
    / width_front) and the new r_up = sigmoid(h / width_up), each computed as r_medial
    and r_front are today (for the left and the right hypothesis, mixed by left_probability).
    width_up is a new learned width with the same parametrisation and start as the
    others (5 mm, 1 to 40 mm). Routing weights: Medial Meniscus r_medial; Lateral
    Meniscus 1 - r_medial; PF OA r_front * r_up; Medial OA r_medial * (1 - r_front
    * r_up); Lateral OA (1 - r_medial) * (1 - r_front * r_up). The three OA weights
    sum to one at every token, as the two meniscus weights do. ROUTES becomes ("medial",
    "lateral", "front_up", "medial_rest", "lateral_rest") and TARGET_ROUTES, PRIOR_VARIANTS
    and the report-attribute routes that name "front", "medial_back" or "lateral_back"
    follow (front -> front_up, medial_back -> medial_rest, lateral_back -> lateral_rest).
    The frame, its learned rotation, the position prior, the token position code and
    the side head are unchanged; the origin stays the fitted centre with no offset.'
  precedents:
  - 'docs/ongoing/side-routed-heads.md, Fifth run: nod -5.1 degrees, Medial OA +0.0013
    and Lateral OA +0.0003 against +0.0030 and +0.0022 in the fourth run, PF OA +0.0071.'
  - 'docs/ongoing/side-routed-heads.md, Octant sketches and Third run: the centre
    about 15 mm above the joint line; prior peaks for PF OA and the OA sides.'
  novelty: First use of the height coordinate for routing; the fifth build routes
    on the midline and the front cut only.
  coverage: Every study with a fitted centre, training and inference. Tokens in front
    of and below the centre move from PF OA to Medial or Lateral OA; everything else
    keeps its target.
  exploitation: 'Read the run report against the incumbent: Medial OA and Lateral
    OA (expected back towards the fourth run''s level), PF OA (must not fall), their
    three localisation deltas, the logged routing_width_up_mm and the frame''s nod
    (frame_rotation_nod_deg). Shown wrong by: PF OA flagged on localisation, or Medial
    and Lateral OA not above the incumbent''s.'
  budget: Same cost as the incumbent.
  implementation: 'modeling/model.py: ROUTES, TARGET_ROUTES, PRIOR_VARIANTS, ROUTING_WIDTHS
    (add "up"; the side head''s width is read by name, not by position) and routing_weights
    as above; SPATIAL_TOKEN_IDENTITY compartment_routing in modeling/spatial_tokens.py.
    training/lightning.py logs every routing width and the mean routing weight per
    route already; keep both working for the new names. If the report-attribute heads
    are routed in the incumbent, rename their routes in training/report_attributes.py.
    No config field and no option. The guardrail check must pass; its partition test
    covers the new weights.'
  open_choices: None.
  dependencies: []
  priority_rationale: The one geometric loss the fifth run showed (the two tibiofemoral
    OA targets), with drawings and a learned prior pointing at the same region.
