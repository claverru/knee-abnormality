- id: learned-position-code-for-own-channels
  mechanism_id: own-channel-token-position
  parent_idea_id: null
  title: Give the own-channel classifiers' tokens a learned position code in the knee
    frame in place of the fixed sinusoid
  opportunity: 'Evidence-backed for Fracture, a guess for the others. The fifth run
    put a fixed sinusoid of the knee-frame position on the tokens the seven own-channel
    classifiers read, and their summed deficit against the old recipe shrank from
    -0.0143 to -0.0039. Three targets stay below the 12 same-fold sibling runs of
    the old recipe: Baker''s (below all 12, -0.0035), Fracture (below 11, +0.0000
    against a sibling mean of +0.0072) and ACL (below 11, -0.0041). Three of those
    sibling runs carried a learned code of a side-normalised 3D position on every
    token, the code this seed proposes, and scored on Fracture +0.0102 (computed-centre-3d-position),
    +0.0116 (position-3d-without-oa-detector) and +0.0105 (position-3d-beside-1d-2d),
    the three highest but one; the sibling without any token position scored +0.0002.
    So for Fracture a learned code is worth about 0.010 over none and the fixed sinusoid
    recovered none of it. On Baker''s the same three runs scored -0.0020, -0.0022
    and -0.0005 against -0.0028 without position.'
  mechanism: 'In KneeAbnormalityModel.position_code (modeling/model.py), replace the
    fixed 42-wavelength sinusoid by the learned code of those campaign runs: sin and
    cos of the three knee-frame coordinates at 7 wavelengths from 8 to 512 mm (the
    existing position_frequencies), flattened to 42 features, then Linear(42, 64),
    GELU, Linear(64, 256), with PyTorch''s default initialisation so the code works
    from the first step (the second run''s zero-started code stayed at a tenth of
    the token''s norm and was not used). The position stays detached and stays the
    frame''s (m, f, h). A token without a fitted centre takes one learned vector (a
    parameter of 256 zeros) instead of zero. The code is added, as today, only to
    the tokens of the own-channel classifiers and the unrouted report-attribute heads;
    the shared classifiers'' tokens stay position-free. code_frequencies and the padding
    go.'
  precedents:
  - 'outputs/autoresearch/fixes-and-removals/experiments: computed-centre-3d-position,
    position-3d-without-oa-detector, position-3d-beside-1d-2d and position-embeddings-off,
    per-target x4 deltas against slab-rule-and-positive-std-requeue.'
  - docs/ongoing/side-routed-heads.md, Second run (zero-started code unused), Fourth
    run and Fifth run (own-channel targets with and without the fixed sinusoid).
  novelty: The campaign's learned 3D code has not been run in the knee frame or restricted
    to the own-channel classifiers.
  coverage: Every token of a series with a fitted centre, for the seven own-channel
    targets and the unrouted report questions, training and inference.
  exploitation: 'Read the run report against the incumbent: Fracture, Baker''s and
    ACL first (the own-targets flag), then the other four own-channel targets, and
    the routed sum, which must not move (the shared classifiers do not read the code).
    Shown wrong by: Fracture not above the incumbent, or an own-channel target newly
    below every sibling.'
  budget: Same cost as the incumbent.
  implementation: 'modeling/model.py: the position module (created under torch.random.fork_rng),
    the learned no-centre vector, position_code; drop the code_frequencies buffer.
    modeling/spatial_tokens.py: the token entry of SPATIAL_TOKEN_IDENTITY. No config
    field and no option. The guardrail check must pass; its position-free test covers
    the shared tokens.'
  open_choices: None.
  dependencies: []
  priority_rationale: The largest remaining own-channel deficit, with three campaign
    runs showing what a learned code is worth on it.
