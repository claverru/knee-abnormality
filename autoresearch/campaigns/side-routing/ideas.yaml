  parent_idea_id: null
  title: Add zero-started cross-axis terms to anatomical attention priors
  opportunity: "The reference's training loss falls from 0.5660 at epoch 4 to 0.5366\
    \ at epoch 9 while some own-channel curves flatten or reverse: ACL 0.9243\u2192\
    0.9236 and Fracture 0.9246\u21920.9209. Baker's remains below all twelve sibling\
    \ runs in the latest routing report. Token-code replacements and the active residual\
    \ did not supply a macro improvement. Source inspection identifies a different\
    \ limitation: position_priors is linear on separately concatenated axis sinusoids,\
    \ so its positional score is additive across medial, front and up coordinates.\
    \ It cannot directly express cross-axis dependence such as an oblique band or\
    \ a position-dependent boundary. Whether that limitation explains the observed\
    \ weakness is a hypothesis."
  mechanism: 'In modeling/model.py:position_priors, retain the existing 14-dimensional
    sine/cosine feature vector phi_a for each of the three axes and all additive prior
    terms. Add zero-initialized bilinear terms for every unordered axis pair: interaction[t,p]
    = sum_{a<b} phi_a(p)^T W[t,a,b] phi_b(p). Use the same medial, reversed-medial
    and absolute-medial variants and existing shared prior-column mapping, preserving
    compartment symmetry. There are 588 pair features per prior column, or 5,880 added
    weights for the current ten columns. Contract pair blocks directly rather than
    retaining a large expanded token tensor. Mask invalid geometry to zero. Keep fixed
    own-channel token codes and position-free shared tokens unchanged. Also replace
    the inherited invalid OA fallback with 1/3 per route to satisfy the token partition
    principle. Evidence-backed change: remove the additive-only functional restriction.
    Hypothesis: joint-coordinate priors improve spatial attention without altering
    classifiers or cuts.'
