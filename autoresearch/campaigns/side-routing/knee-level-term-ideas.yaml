ideas:
- id: knee-level-term-with-front-and-up-routing
  mechanism_id: knee-level-disease-term
  parent_idea_id: null
  title: Add to every routed target the shared classifier's knee-level evidence, and route PF OA
    from the front-and-up region
  opportunity: >-
    Evidence-backed observation, mechanism a guess. Exclusive regions make a routed target
    better at telling its compartment from the others and worse at the plain AUC, because OA in
    one compartment predicts OA in another (166 of the 363 OA studies of the fold have more
    than one compartment) and an exclusive region cannot see the other compartments' evidence.
    Three runs show it. Fourth run, front tokens counted for the OA sides as well as for PF OA
    (weights not summing to one): Medial OA +0.0030, Lateral OA +0.0022 against the old recipe,
    0.953 public. Fifth run, sides on the back only: +0.0013 and +0.0003, 0.952 public.
    front-and-up-region-for-pf-oa (this campaign, 2026-10-06), PF OA on front-and-up and the
    sides on the rest: PF OA localisation +0.0153 against the incumbent (tolerance 0.0057), the
    largest localisation gain of the line, with PF OA +0.0013; but Medial OA -0.0009 and Lateral
    OA -0.0027, routed sum -0.0049, macro -0.0002, not adopted. Giving the sides the front-and-low
    region back did not help them, so what they lost after the fourth run is the PF region's
    evidence, not their own front. The design should keep exclusive regions for localisation
    and return the knee-level evidence explicitly instead of through overlapping regions.
  mechanism: >-
    Two parts. (A) Routing exactly as front-and-up-region-for-pf-oa, whose source is in
    outputs/autoresearch/side-routing/experiments/front-and-up-region-for-pf-oa-20261005T214523Z-ed5cce90/source:
    r_up = sigmoid(h / width_up) with a new learned width started as the others; PF OA
    r_front * r_up; Medial OA r_medial * (1 - r_front * r_up); Lateral OA (1 - r_medial) *
    (1 - r_front * r_up); meniscus targets unchanged; ROUTES ("medial", "lateral", "front_up",
    "medial_rest", "lateral_rest") with TARGET_ROUTES and PRIOR_VARIANTS following. (B) A
    knee-level term for the two shared channels. In KneeAbnormalityModel._attention_pool, for
    each shared channel c compute an unrouted attention over the study's valid tokens,
    softmax(score_c + view bias) with the same scorer output and view label bias the routed
    targets use, with no routing term and no position prior, and pool the channel's evidence
    with it: g_c = sum over tokens of that attention times evidence_c (the same evidence, from
    the shared classifiers' position-free tokens). Every target k of channel c then has
    logit_k = its routed logit + scale_c * g_c, where scale is a new learned parameter with one
    scalar per shared channel (meniscus, oa), started at zero under torch.random.fork_rng. The
    scale is shared by the targets of a channel, so without routing and prior they still have
    equal logits and a side flip still swaps medial and lateral exactly. The seven own-channel
    targets are unchanged. Nothing else changes.
  precedents:
  - 'docs/modeling/side-routed-heads.md, Fourth run and Fifth run: Medial OA and Lateral OA with and without the front of their side; S113 0.953 and S114 0.952.'
  - 'autoresearch/campaigns/side-routing/run-notes.md, front-and-up-region-for-pf-oa: per-target and localisation deltas of 2026-10-06.'
  novelty: First explicit knee-level term beside the routed evidence; earlier builds gave a target other compartments' evidence only through overlapping regions.
  coverage: >-
    Every study, training and inference, for the five routed targets. Studies with more than
    one affected compartment (46% of OA studies, 15% of meniscus studies) are where the
    knee-level term adds evidence a compartment's own region does not hold.
  exploitation: >-
    Read the run report against the incumbent: Medial OA and Lateral OA (expected at or above
    the incumbent's), PF OA and its localisation (expected to keep most of +0.0153), the routed
    sum against the lineage's best, and the two logged scales (knee_level_scale_meniscus,
    knee_level_scale_oa): a scale that stays at zero means the term is not used. Shown wrong by:
    the routed sum flagged, a localisation flag on PF OA, or the OA scale near zero with the
    sides still below the incumbent.
  budget: Same cost as the incumbent; one extra softmax and pooling per shared channel.
  implementation: >-
    modeling/model.py: part (A) as in the named experiment's source (ROUTES, TARGET_ROUTES,
    PRIOR_VARIANTS, ROUTING_WIDTHS with "up", routing_weights, the side head's width read by
    name); part (B) in _attention_pool with the new parameter knee_level_scale;
    SPATIAL_TOKEN_IDENTITY compartment_routing and aggregation in modeling/spatial_tokens.py.
    training/lightning.py: log each routing width, the mean routing weight per route and
    knee_level_scale_<channel> per epoch. The temperature needs no change: the unrouted
    attention uses the scorer and the view bias, which apply_attention_temperature already
    scales. No config field and no option. scripts.tools.check_side_routing runs on the CPU when
    no GPU is visible; all nine guardrails must pass and its JSON goes in the report.
  open_choices: None.
  dependencies: []
  priority_rationale: Keeper seed from the first run of the campaign, which showed the trade between localisation and plain AUC that three runs of the line had hinted at.
exhausted_directions: ''
