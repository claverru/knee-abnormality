- id: batch-norm-statistics-from-kaggle
  mechanism_id: normalisation-statistics
  parent_idea_id: null
  title: Keep the fastMRI batches out of the batch-norm running statistics
  opportunity: 'Half of the training batches now come from another scanner population
    (no T1-weighted series, fields of 140 to 150 mm, mostly 1.5 T in its second part),
    and they update the same running statistics the model uses at validation and prediction
    on Kaggle studies. The first run gained at x1 and lost at x4, where the statistics
    are applied to many more images per study. Guess, low: -0.0005 to +0.001 macro.
    Keeper''s proposal, not the user''s.'
  mechanism: 'Today every training batch updates the running mean and variance of
    the batch-norm layers that are in training mode. Change: on a fastMRI batch those
    layers still normalise with the batch''s own statistics, but their running statistics
    are not updated (momentum 0 for that forward pass). Kaggle batches are unchanged,
    so the statistics used at validation come from Kaggle studies alone, as in the
    plain recipe.'
  precedents: []
  novelty: First run separating the two populations' statistics.
  coverage: Every batch-norm layer that updates running statistics in the recipe.
  exploitation: 'Read the step from x1 to x4 against the incumbent''s, then the macro
    and the per-label table. Activation: the number of layers affected, in the report,
    and the mean absolute difference between the run''s and the reference''s running
    means at the end, logged once on validation. Shown wrong by: the macro below the
    incumbent at both multipliers.'
  budget: The reference's training time.
  implementation: 'Follow the environment paragraph of the developer instructions.
    File: training/lightning.py. In training_step, around the forward pass of an extra
    batch, set the momentum of the affected layers to 0 and restore it after; collect
    the layers once. If no batch-norm layer updates running statistics in this recipe,
    return blocked and say so. No option, no config field.'
