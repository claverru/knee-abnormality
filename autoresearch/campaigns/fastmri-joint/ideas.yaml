- id: label-rate-matching-by-sampling
  mechanism_id: pseudo-label-sampling
  parent_idea_id: null
  title: Draw the fastMRI studies so their label rates match the Kaggle fold's
  opportunity: 'fastMRI''s label mix differs from Kaggle''s: mean pseudo-labels of
    0.48 for PF OA and 0.41 for Effusion against 0.12 for MCL and 0.16 for ACL (prior-work.md,
    the pseudo-labels), and its studies are drawn uniformly. class-weights-over-both-datasets
    answers this through the weights; this answers it through which studies are seen,
    leaving the weights alone. Guess, low-medium: -0.001 to +0.001 macro. Keeper''s
    proposal.'
  mechanism: 'Today PairedBatches draws the fastMRI studies from a seeded permutation
    that cycles through all of them. Change: each study gets a sampling weight fitted
    once per fold by iterative proportional fitting, so that the weighted fraction
    of positives (pseudo-label >= 0.5) of each of the twelve labels equals the fraction
    among the fold''s Kaggle training cells (the positive fractions of class_balance.json).
    Each epoch draws its fastMRI studies without replacement with those weights, from
    the run''s seed and the epoch.'
  precedents:
