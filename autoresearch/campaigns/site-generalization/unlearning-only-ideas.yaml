ideas:
- id: site-unlearning-only
  mechanism_id: unlearning-instead-of-removal
  parent_idea_id: site-confusion-retarget
  title: 'Recipe B: site-cluster unlearning instead of the removal family (no L2-SP, no per-label ArcFace, no scanner-appearance augmentations)'
  opportunity: 'User question (2026-09-30): the recipe only contains removal and avoidance of scanner signal (scanner-appearance augmentations, L2-SP, per-label ArcFace); adversarial unlearning was only tested on top of that family, where the two clash, because appearance randomization already scrambles the signal the unlearning head must predict. Removing the old scanner-group confusion head was neutral at two seeds, which says only that unlearning adds nothing on top of removal. site-confusion-retarget (site-cluster unlearning) gave the strongest unlearning signal (+0.0016 held-out, seen -0.0017, one run, old seed, on top of the removal family). This run measures unlearning alone against the removal family alone.'
  mechanism: 'Starting from the incumbent: (1) remove L2-SP anchoring and restore the pre-L2-SP optimizer (weight decay 0.01 on backbone weight matrices); (2) remove the per-label ArcFace auxiliary; (3) turn off the scanner-appearance augmentations: data.gin_augmentation.probability 0, data.contrast_mixing_augmentation.probability 0 and model.feature_statistics_augmentation.probability 0; (4) turn on site-cluster unlearning exactly as in site-confusion-retarget: the detached confusion head predicts the 12 training-site clusters plus other (instead of the 8 scanner groups), and the backbone is trained with the existing bounded KL toward the training cluster frequencies, weight 0.1 (trainer.scanner_confusion_weight) with the existing ramp. Geometry (affine, reflection) and the generic intensity gamma, noise, smoothing and resolution augmentations stay as in the incumbent, as do all other settings.'
  precedents:
  - 'site-confusion-retarget, this campaign (site-cluster unlearning: held-out +0.001559 [80% -0.000068, +0.003209], seen -0.0017, on top of the removal family at the old seed).'
  - 'site-no-scanner-confusion and site-no-scanner-confusion-reseed, this campaign (removing scanner-group unlearning from the removal family is neutral at two seeds).'
  - 'Dinsdale et al. 2021, unlearning scanner information for MRI harmonisation.'
  - 'site-arcface-without-l2-sp and site-l2-sp-without-arcface, this campaign (the removal parts measured one at a time).'
  novelty: First run of unlearning without any removal or avoidance mechanism.
  coverage: All training studies.
  exploitation: 'Held-out-site AUC and seen-site guard against the incumbent, read as removal family versus unlearning family: a win means unlearning alone beats the removal recipe; a loss means it does not, without saying which removal part matters. Per epoch: the confusion head''s accuracy against the cluster majority rate and its KL loss, as logged by site-confusion-retarget.'
  budget: Cheaper than the incumbent (fewer augmentations and auxiliaries).
  implementation: 'Combine three existing, reviewed changes on the incumbent source and set three probabilities to 0 in configs/training.yaml. (a) L2-SP removal exactly as in outputs/autoresearch/site-generalization/experiments/site-arcface-without-l2-sp-20260930T092902Z-c98e22c3/changes.diff, including the restored weight-decay rule weight_decay = 0.0 if parameter.ndim < 2 else settings.weight_decay. (b) Per-label ArcFace removal: revert outputs/autoresearch/site-generalization/experiments/site-arcface-per-label-pooled-20260929T203545Z-12aa2855/changes.diff (the pre-ArcFace code is in outputs/autoresearch/site-generalization/experiments/site-l2-sp-anchor-20260929T182106Z-c1840b9a/source) and delete training/auxiliary/arcface.py. (c) Site-cluster targets for the confusion head as in outputs/autoresearch/site-generalization/experiments/site-confusion-retarget-20260929T195554Z-55f2c9e6/changes.diff (its site_generalization.confusion_target option set to site_cluster, targets and prior from the pinned training-site table), and set site_generalization.scanner_confusion true so the head is built and trained. That diff was written against an older parent, so apply its intent to the current files without changing anything else. Do not leave disabled branches for the removed L2-SP and ArcFace code.'
  open_choices: None; weight 0.1, the site-cluster targets and the three disabled augmentations are fixed before the run.
  dependencies: []
  priority_rationale: 'User decision 2026-09-30: fourth run of the final list, to test unlearning against removal without the two clashing.'
exhausted_directions: Label-blind erasure (subspace, LEACE) and DRO reweighting hurt; unlearning was only tested on top of the removal family.
