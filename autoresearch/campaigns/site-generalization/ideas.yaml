- id: site-acquisition-rician-noise
  mechanism_id: magnitude-noise-randomization
  parent_idea_id: null
  title: Replace additive Gaussian augmentation with acquisition-coherent magnitude-noise
    simulation
  opportunity: The current augmentation adds Gaussian noise and clips to [0,1], using
    one standard deviation per acquisition. It does not model the signal-dependent
    positive floor produced by magnitude formation. The incumbent still carries scanner
    information late in training, and fracture validation AUC falls from 0.9359 at
    epoch 4 to 0.9261 at epoch 9 while total loss improves. Reconstruction-noise sensitivity
    is a plausible site shortcut, but no noise-stratified performance or sensitivity
    measurement in the packet establishes it.
  mechanism: Replace the selected acquisitions' additive-noise operation with y=sqrt((x+n_real)^2+n_imag^2),
    using independent zero-mean Gaussian components and one sampled sigma shared across
    an acquisition's slices. Keep application probability 0.15; use sigma range [0.005,0.04]
    in the existing normalized intensity units to include stronger low-signal perturbations.
    Retain the augmentation's placement after intensity and GIN transforms, final
    clipping and original zero-background restoration. Noise realizations remain independent
    across pixels and slices; only acquisition noise level is shared. This is magnitude-inspired
    augmentation, not an estimate of native SNR or scanner field strength.
  precedents:
  - '[Gudbjartsson and Patz, The Rician distribution of noisy MRI data](https://pubmed.ncbi.nlm.nih.gov/8598820/?dopt=Abstract)
    establishes the magnitude-noise distribution and low-signal bias. It does not
    demonstrate classification gains for this dataset.'
  - modeling/augmentation.py currently uses sample_noise_parameters, sample_noise_values
    and ImageAugmentation._add_noise for acquisition-level sigma and clipped Gaussian
    addition.
  - The external sig-magnitude-power-debiasing attempt estimated and removed background
    power before normalization; its completed run had an invalid comparison and no
    paired AUC verdict. This proposal instead adds stochastic training-only noise
    after the fixed preprocessing.
  - The developing Fourier repair changes donor amplitude shape. Magnitude-noise simulation
    changes the stochastic signal/noise relationship without donor studies or spectral
    exchange.
  novelty: 'A distinct appearance mechanism requiring Python changes: nonlinear magnitude
    formation with two noise components. Its effect cannot be obtained by a Gaussian-noise
    strength setting alone.'
  coverage: Apply the same randomization independently of label and training site.
    Preserve sampling geometry, labels, preprocessing identity semantics and all evaluation
    transforms. The operation is absent at prediction. Retain the recipe's repeated-middle-channel
    behavior.
  exploitation: Log affected acquisitions, realized sigma, changed-pixel fraction,
    clipping fraction and mean absolute difference from clipped Gaussian addition
    using the same real noise draw. Positive magnitude-versus-Gaussian difference
    on surviving valid pixels establishes activation beyond the sigma change. Use
    the unchanged macro adoption rule and seen-site guard.
  budget: "Retain ten epochs, batch size eight, 26 triplets per study and supervisor\
    \ seed 1533697213. One additional random tensor and magnitude operation on selected\
    \ acquisitions require no additional model pass. Estimated training time is 950\u2013\
    1030 seconds, subject to measured budget compliance."
  implementation: Replace Gaussian generation/application in modeling/augmentation.py
    and remove the superseded RandomGaussianNoise path. Update data.noise_augmentation.std_range
    in configs/training.yaml and expose activity through training/lightning.py. Preserve
    background restoration, acquisition-level sampling and every unrelated augmentation
    and accepted objective. Apply the replacement to the incumbent assigned during
    development, retaining any newly accepted Fourier or pretrained-feature mechanism.
    If another accepted mechanism has already replaced noise semantics, report the
    overlap before implementing a stale replacement.
  open_choices: Quantile-normalized uint8 intensities are not physical magnitude measurements,
    and reconstructed multi-coil noise need not be Rician. The approximation may be
    too weak to matter or may obscure subtle findings. Existing zero-background restoration
    deliberately prevents a realistic air-noise floor. No native-noise estimation
    or label-specific policy is proposed.
  dependencies: []
  priority_rationale: 'Third: inexpensive and mechanistically distinct from the queued
    Fourier exchange. It has a primary-research basis but the weakest campaign-specific
    evidence, so prioritize the geometry retry and normalization candidate ahead of
    it.'
  source_change: true
  targeted_curve: "Incumbent epochs 4\u20139: fracture \xD71 AUC declines 0.9359\u2192\
    0.9261 while total loss decreases and macro AUC plateaus late. Seek less late\
    \ deterioration and better macro transfer through one label-independent noise\
    \ policy; noise sensitivity itself remains unmeasured."
