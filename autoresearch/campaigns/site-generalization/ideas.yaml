- id: site-frozen-backbone-batchnorm
  mechanism_id: pretrained-batchnorm-anchoring
  parent_idea_id: site-l2-sp-anchor
  title: 'Anchor the backbone''s BatchNorm too: keep its running statistics and affine
    parameters at the pretrained values throughout training'
  opportunity: "L2-SP is the one mechanism that reproduced (+0.0015 held-out; \u2212\
    0.0014 when removed; +0.002 on the public leaderboard). The audit showed it anchors\
    \ only the conv weights: the backbone BatchNorm statistics and affine parameters\
    \ drift freely, and the features the model computes with its own BatchNorm are\
    \ as far from the pretrained ones with L2-SP as without it (1 \u2212 cosine 0.46\
    \ at layer1 and 0.68 at layer2 in every run, 0.34 to 0.43 at layer1 from the BatchNorm\
    \ statistics alone). site-lp-ft, which froze BatchNorm for its first epoch, gave\
    \ +0.0016 held-out. Freezing BatchNorm extends the anchoring to the part L2-SP\
    \ leaves free."
  mechanism: Every BatchNorm module inside model.backbone stays in eval mode for the
    whole run (running statistics fixed at the RadImageNet values) and its weight
    and bias receive no updates. L2-SP on the conv weights, the heads, the augmentations
    and all other settings are unchanged.
  precedents:
