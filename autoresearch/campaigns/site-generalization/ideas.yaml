- id: site-dro-fresh-bounded-risk
  mechanism_id: robust-objective-over-sites
  parent_idea_id: site-group-dro
  title: Replace cumulative GroupDRO updates with fresh epoch risks and bounded population-corrected
    weights
  opportunity: "GroupDRO's nominal mass on en/minor rises to 0.5299 and hr/Siemens\
    \ to 0.2003 while \xD71 validation macro stalls near 0.9207. The implementation\
    \ repeatedly exponentiates cumulative historical losses, including groups absent\
    \ from the current batch, and then normalizes multipliers within each batch without\
    \ correcting group frequency. Those weights therefore do not implement the intended\
    \ mixture of group-average risks. This diagnosed estimator and update mismatch\
    \ warrants one structural retry despite the substantial rejection."
  mechanism: "Accumulate detached sums of the unchanged class-balanced disease cell\
    \ losses and observed-cell counts separately for each complete epoch. Epoch 0\
    \ uses the incumbent reduction. Thereafter derive group risks only from the preceding\
    \ epoch, discarding older statistics. Let p be each group's fixed share of observed\
    \ training cells. Once per epoch solve max_q sum(q_g R_g)\u22120.1 KL(q||p), subject\
    \ to sum(q)=1 and 0.5p_g\u2264q_g\u22642p_g. Apply detached cell multipliers q_g/p_g\
    \ during the next epoch, retaining the existing observed-cell denominator and\
    \ removing minibatch multiplier normalization. Reset epoch statistics after each\
    \ update."
  precedents:
  - site-group-dro source confirms cumulative loss estimates, repeated updates for
    absent groups and batch-normalized study multipliers.
  - '[Sagawa et al.](https://arxiv.org/abs/1911.08731) establish group-risk optimization
    and the importance of regularization for worst-group generalization. The fresh,
    bounded update here specifically addresses this campaign''s implementation and
    concentration pattern.'
  novelty: Changes risk estimation, update timescale and population correction rather
    than sweeping the old adversarial step size. Density-ratio bounds preserve substantial
    contribution from every training group.
  coverage: All observed disease cells and all pinned training-site clusters participate.
    Site identities affect training reduction only. Targets, class-balance weights,
    auxiliary objectives and study sampling remain fixed. Different report uncertainty
    and prevalence can still produce different group risks.
  exploitation: Log the actual change in disease loss caused by site multipliers,
    q/p ranges, effective group contributions, previous-epoch risks and group support.
    Activation begins in epoch 1. Risk concentration and per-site AUC are diagnostics;
    adoption still requires the unchanged held-out macro rule and seen-site guard.
  budget: "Keep ten epochs, batch size eight, accumulation one and seed 1533697213.\
    \ Requires small per-group buffers and one bounded scalar optimization per epoch,\
    \ with no additional model pass. Expected runtime stays close to the 951 s incumbent;\
    \ measured training must remain within 458\u20131,374 s."
  implementation: Add the replacement reducer under training/auxiliary and integrate
    it at the disease-loss reduction in training/lightning.py. Obtain training cell
    counts from existing targets and site mapping, without changing label construction.
    Remove the historical cumulative-log-weight and batch-renormalization algorithm
    wherever inherited. Retain L2-SP, active ArcFace and unrelated accepted behavior.
    Reconcile against a newly accepted incumbent rather than using the rejected GroupDRO
    source as the parent.
  open_choices: Fix temperature 0.1 and density-ratio bounds [0.5, 2] for this candidate.
    Use observed-cell shares consistently in both risks and population correction.
    Fresh risks lag one epoch and may still emphasize intrinsically difficult report
    groups; no label-specific corrections are proposed.
  dependencies: []
  priority_rationale: 'Fourth: the largest negative result lowers expected payoff,
    but the update mismatch is concrete and the retry is inexpensive. This earns one
