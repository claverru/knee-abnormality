- id: site-acquisition-mixture-contrast
  mechanism_id: acquisition-mixture-contrast-randomization
  parent_idea_id: null
  title: Replace GIN with acquisition-fitted mixture contrast augmentation
  opportunity: "The sites-out diagnostic measures approximately 0.01 macro AUC lost\
    \ through unseen-site exposure. In the current reseeded incumbent, epochs 7\u2013\
    9 \xD71 macro AUC rises only 0.9211\u21920.9219 while training loss falls 2.4639\u2192\
    2.4428. Fracture AUC falls from 0.9356 at epoch 2 to 0.9185 at epoch 9. These\
    \ observations motivate a label-independent appearance mechanism, but do not establish\
    \ contrast sensitivity as the cause. Existing GIN uses random convolutions rather\
    \ than adapting its intensity transformations to the recipient acquisition's distribution."
  mechanism: Replace GIN with a stochastic pointwise transformation fitted independently
    to each selected acquisition. Fit a three-component Gaussian mixture to a bounded
    sample of valid, nonzero center-channel pixels across its sampled slices. Initialize
    from histogram quantiles and perform eight fixed EM iterations with a variance
    floor. Sample independent component mean shifts in [-0.05,0.05] and standard-deviation
    multipliers in [0.9,1.1]. Form a 256-entry lookup from the original soft responsibilities
    and transformed within-component residuals; clamp it to [0,1] and project it to
    nondecreasing values. Blend with the original using a draw in [0,0.5], sharing
    the lookup across all channels and slices of that acquisition. Retain probability
    0.3. Preserve original zero-background restoration. Degenerate fits produce identity
    transformations and are counted. The method uses image statistics without assigning
    tissue labels.
  precedents:
  - '[Meyer et al., A Contrast Augmentation Approach to Improve Multi-Scanner Generalization
    in MRI](https://www.frontiersin.org/journals/neuroscience/articles/10.3389/fnins.2021.708196/full)
    uses image-fitted Gaussian mixtures to randomize component contrast without supplied
    tissue maps, reporting improved multi-scanner brain segmentation. This supports
    the mechanism hypothesis; it does not establish benefit for knee classification.'
  - 'Incumbent modeling/augmentation.py: sample_gin_parameters, apply_gin_filter and
    ImageAugmentation.forward implement acquisition-shared random convolutional GIN
    after intensity augmentation and before noise. Replace this stage while retaining
    its placement and application probability.'
  - 'run_curves.full_detail, site-incumbent-reseed-20260930T082402Z: late macro AUC
    plateaus despite falling loss, while fracture validation AUC deteriorates after
    epoch 2. These are targets for diagnosis, not evidence that mixture contrast augmentation
    will improve transfer.'
  - The external sig-slice-coherent-local-histograms attempt exceeded its projected
    training budget; its repair remains unresolved. That method changes deterministic
    local preprocessing. This proposal uses a bounded, global histogram fit solely
    during augmentation.
  - Closed Fourier and MixStyle families exchanged donor appearance. This proposal
    fits the recipient acquisition and uses no donor study, cross-site feature exchange
    or prediction-time normalization.
  novelty: The transformation independently varies acquisition-fitted intensity bands
    while preserving spatial coordinates and intensity ordering. It replaces random
    spatial convolutions rather than adding another donor-style exchange. Its conditional
    component transformations cannot be expressed through existing gamma, contrast
    or GIN strength settings.
  coverage: Apply one policy across every training label and site. Use only the currently
    sampled images and existing valid-region masks; preserve sampling geometry, preprocessing
    identity, labels and evaluation. Ordinary prediction receives no fitted transform,
    site identifier or conditioning signal.
  exploitation: Log mixture_contrast_pixel_change as the actual valid-pixel mean absolute
    change after lookup projection, blending and clipping; positive epoch-0 change
    establishes activation. Also log affected acquisitions, successful-fit coverage,
    component separation, lookup slope variation and clipping fraction. These distinguish
    useful contrast diversity from degenerate fits or an almost-global offset. Evaluate
    exclusively with the fixed macro adoption rule and seen-site guard.
  budget: "Keep ten epochs, batch size eight, 26 triplets per study and every study\
    \ seen per epoch. Use the supervisor-bound incumbent seed, currently 3843979352.\
    \ Fit from at most 4,096 pixels per selected acquisition using a compact histogram,\
    \ then apply a lookup in one image pass. No additional backbone pass or model\
    \ is required. The parent trained in 902.9 seconds; runtime remains unmeasured\
    \ and must satisfy the existing 457.8\u20131,373.5-second training range. Avoid\
    \ full-volume fitting and repeated pixelwise EM passes."
  implementation: Replace GIN sampling/application in modeling/augmentation.py and
    update its model constructor binding in modeling/model.py. Remove superseded GIN
    kernels, configuration fields, activity entries and logging; add numeric mixture-contrast
    settings under model.acquisition_mixture_contrast in config.py and configs/training.yaml,
    with epoch activity reporting in training/lightning.py. Retain intensity, noise,
    smoothing, resolution, contrast mixing, reflection and DSU behavior, plus the
    incumbent's disease and auxiliary objectives. Retain pooled ArcFace and L2-SP
    unless a newly accepted incumbent has removed them. Rebase this single augmentation
    replacement onto the incumbent assigned during development; preserve unrelated
    newly accepted improvements. If that incumbent already replaces GIN, report the
    overlap rather than reinstalling a stale path.
  open_choices: Three intensity components are a modeling approximation, not verified
    knee tissue classes. Fat suppression, pathology and sampled slice coverage can
    change the fitted distribution. Monotone projection or clipping may substantially
    attenuate sampled contrast changes, so activation diagnostics must describe the
    delivered transform. Histogram fitting may synchronize devices or introduce excessive
    overhead if implemented per image. No supplied contrast-stratified analysis demonstrates
    that this mechanism addresses the remaining site gap.
  dependencies: []
  priority_rationale: 'First and only new proposal: a source-level replacement with
    a primary MRI precedent and modest expected compute. It addresses a distinct recipient-image
    contrast mechanism while avoiding closed donor-exchange and normalization families.
    Campaign-specific evidence remains weak, so the fixed paired comparison must decide
    its value.'
  source_change: true
  targeted_curve: "site-incumbent-reseed-20260930T082402Z: target the epochs 7\u2013\
    9 macro plateau, 0.9211\u21920.9219 despite falling loss, and fracture deterioration\
    \ from epoch 2 to 9, 0.9356\u21920.9185. Seek better late macro transfer through\
    \ one label-independent augmentation while satisfying the seen-site guard."
  status: retired
