    \ fraction 0.486\u20130.495, pixel change 0.0261\u20130.0266, clipping 0.1172\u2013\
    0.1193 and delivered power error 0.0591\u20130.0606. These establish sustained\
    \ delivery distortion rather than nonactivation."
  - '[Fourier Domain Adaptation](https://arxiv.org/abs/2004.05498) motivates low-frequency
    amplitude exchange. The proposed bounded residual is a training-to-training adaptation,
