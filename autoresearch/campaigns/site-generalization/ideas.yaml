- id: site-arcface-balanced-site-states
  mechanism_id: cross-site-metric-learning
  parent_idea_id: site-arcface-per-label-pooled
  title: Balance training-site contributions within each ArcFace label state
  opportunity: 'The incumbent''s ArcFace loss falls from 0.8250 to 0.2795, but positive-state
    cosine dispersion across sites grows from 0.0160 to 0.0300. MCL dispersion reaches
    0.0705 while its validation AUC stalls late. Source inspection shows that sites
    affect diagnostics only: prototype learning remains dominated by the observed
    confidence mass of larger sites. Unequal contributions are a plausible explanation,
    although the logged dispersions lack support counts and do not establish causality.'
  mechanism: Replace the ArcFace reduction with training-cohort weights within each
    label and absent/present state. Let n_g be the sum of observed target confidence
    in site g for that state. Set a_g=1/(n_g+10), then normalize a so sum(n_g*a_g)=sum(n_g).
    Multiply existing confidence-weighted ArcFace cells by a_g, retaining the original
    observed-cell denominator. This approximately equalizes well-supported sites,
    shrinks sparse-site influence, and preserves each state's aggregate confidence
    mass. Keep margin 0.2, scale 16 and auxiliary weight 0.3. Disease targets, disease
    class weights and sampling remain unchanged.
  precedents:
  - 'site-arcface-per-label-pooled: the accepted mechanism attaches prototypes to
    the actual label-specific disease features; its source currently uses no site
    weighting.'
  - 'site-conditional-coral: distribution alignment with rolling covariance estimates
    was rejected. This proposal changes prototype contributions without estimating
    feature covariances or retaining stale embeddings.'
  - '[ArcFace](https://arxiv.org/abs/1801.07698) supplies the angular-margin construction;
    the site-conditional reduction is a campaign-specific extension.'
  novelty: Changes which sites shape each shared prototype while preserving the incumbent's
    representation, margin and state mass. It is neither a margin sweep nor a replacement
    disease objective.
  coverage: All twelve labels and both states use the same rule. Counts come exclusively
    from existing training targets and the checksum-verified training-site table.
    Empty cells contribute nothing. Log confidence mass and effective contribution
    by site/state; sparse positive groups remain a concern.
  exploitation: Log the absolute change between weighted and incumbent ArcFace loss
    on identical features, actual margin shifts, contribution shares and support-aware
    cosine dispersion. A positive loss-change scalar establishes that reweighting
    acted. Judge adoption exclusively by the fixed held-out macro rule and seen-site
    guard.
  budget: "Keep ten epochs, batch size eight, accumulation one and the incumbent seed\
    \ 1533697213. A small site\xD7label\xD7state table and elementwise weights require\
    \ no additional encoding. Expected training time is close to the incumbent's 951\
    \ s, comfortably within the planning range of 458\u20131,374 s; actual timing\
    \ remains authoritative."
  implementation: Replace the ArcFace reduction in training/auxiliary/arcface.py and
    pass training-only site indices from training/lightning.py. Compute fixed counts
    from existing training targets during setup and record their provenance. Retain
    label-specific pooling, L2-SP, current augmentations and unrelated incumbent losses.
    Remove the superseded unweighted reduction rather than adding a legacy mode. Rebase
