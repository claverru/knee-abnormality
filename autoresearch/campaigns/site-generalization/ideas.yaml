    (ArcFace removal and LP-FT).'
- id: site-pretrained-canonical-feature-anchor
  mechanism_id: pretrained-feature-protection
  parent_idea_id: site-pretrained-feature-direction-anchor
  title: Compare pretrained and student features under identical frozen BatchNorm
    statistics
  opportunity: "The rejected feature anchor's directional disagreement falls from\
    \ 0.6275 to 0.4794, yet its epochs 5\u20139 \xD71 macro remains below the incumbent.\
    \ Source inspection identifies a confound: the frozen teacher uses pretrained\
    \ BatchNorm statistics, while the attached student maps use training-batch statistics.\
    \ Thus the penalty can oppose normalization differences unrelated to parameter\
    \ drift. A comparison under shared normalization would isolate the intended constraint.\
    \ This explains a defect in the measurement, not the observed AUC loss conclusively."
  mechanism: 'Select one existing prepared triplet per study, as in the rejected attempt.
    Compute two auxiliary early-encoder passes through layer2: a frozen pretrained
    teacher and a differentiable functional evaluation using the student''s live convolution
    and affine parameters. Both passes use the same pinned pretrained BatchNorm running
    means, variances and epsilon, with no buffer updates. Compare channel-normalized
    feature directions over the existing valid-location mask, averaging within studies
    and then across studies. Retain weight 0.05 and the two-epoch ramp to isolate
    the construction change. Identical initial parameters should produce approximately
    zero disagreement algebraically; subsequent disagreement measures parameter-induced
    response changes under common normalization. Log the actual weighted canonical_feature_penalty
    each epoch, unweighted disagreement and valid-study/location counts. Activation
    requires a positive realized training penalty.'
  precedents:
