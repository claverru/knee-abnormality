- id: site-lp-ft
  mechanism_id: linear-probe-then-fine-tune
  parent_idea_id: site-l2-sp-anchor
  title: 'LP-FT: train only the non-backbone parts for the first epoch with the pretrained
    backbone frozen, then fine-tune everything'
  opportunity: 'The only mechanism that reproduced in this campaign keeps the backbone
    near its pretrained weights: site-l2-sp-anchor gained +0.0015 held-out at the
    old seed and removing it cost -0.0014 at the fresh seed, while feature-space anchors,
    erasure, DRO and style augmentations did not help unseen sites. Early fine-tuning
    through randomly initialized heads distorts pretrained features most (Kumar et
    al. 2022, Fine-Tuning can Distort Pretrained Features and Underperform Out-of-Distribution);
    a linear-probe phase first removes that early distortion and improves out-of-distribution
    accuracy, complementing L2-SP, which only penalizes the distance.'
  mechanism: '(1) Probe phase, epoch 0 only (site_generalization.probe_epochs = 1):
    the backbone (model.backbone, the RadImageNet ResNet-18) receives no updates;
    every other part trains as usual (projection, spatial tokens, attention pooling,
    disease head, OA detector, per-label ArcFace head and the other auxiliaries).
    Implement the freeze by setting every backbone parameter''s .grad to None before
    each optimizer step during the probe epochs (AdamW then skips them: no update,
    no weight decay, no optimizer state). Do NOT use requires_grad=False: the optimizer
    builder skips parameters that do not require gradients when it is built, which
    would exclude the backbone for the whole run. During the probe epochs put the
    backbone''s BatchNorm modules in eval mode after every train() call so their running
    statistics stay at the pretrained values; after the probe they follow the recipe''s
    normal mode (backbone_eval false). (2) Fine-tune phase, epochs 1 to 9: everything
    trains exactly as in the incumbent, with L2-SP anchoring to the pretrained weights
    unchanged (the backbone still equals them at the start of epoch 1). The backbone
    parameter groups get their own linear warmup over epoch 1, from warmup_start_ratio
    to the scheduled value, so the backbone does not start at the full post-warmup
    rate with fresh AdamW state; implement it with LambdaLR per-group lambdas (backbone
    groups: incumbent schedule multiplied by the warmup ramp during epoch 1 and by
    0 during the probe; other groups: the incumbent schedule unchanged). The total
    number of epochs (10), the other learning rates, weight decay, batch size and
    all other settings are unchanged.'
  precedents:
  - Kumar et al. 2022, Fine-Tuning can Distort Pretrained Features and Underperform
    Out-of-Distribution (ICLR), LP-FT.
  - site-l2-sp-anchor and its removal test site-arcface-without-l2-sp, this campaign
    (keeping the backbone near its pretrained weights helps unseen sites, reproduced
    at two seeds).
  - site-pretrained-feature-direction-anchor and site-pretrained-canonical-feature-anchor,
    this campaign (feature-space anchors hurt), which is why this idea acts on the
    optimization schedule, not on features.
  novelty: First change to how the backbone enters training; no previous idea delayed
    or ramped backbone updates.
  coverage: All training studies.
  exploitation: 'Held-out-site AUC and seen-site guard against the incumbent. Per
    epoch: backbone L2 distance from the pretrained weights (the existing L2-SP drift
    logging), which must be exactly 0 after epoch 0 and grow afterwards, and the backbone
    learning rate, which must be 0 in epoch 0 and ramp during epoch 1.'
  budget: About the incumbent's cost; the probe epoch still runs the backbone forward
    and backward.
  implementation: 'Option site_generalization.probe_epochs (StrictInt, default 0,
    set to 1 in configs/training.yaml; 0 must leave training exactly as the incumbent).
    All changes in src/knee_abnormality/config.py, src/knee_abnormality/training/lightning.py
    and configs/training.yaml: the grad-dropping hook (on_before_optimizer_step),
    the BatchNorm eval switch during probe epochs, and the per-group LambdaLR. Do
    not change the optimizer builder''s parameter selection, weight decay rules, L2-SP
    code or any other mechanism.'
  open_choices: None; one probe epoch and a one-epoch backbone warmup are fixed before
    the run.
  dependencies: []
  priority_rationale: 'Chosen by Claude and the user (2026-09-30) as one of the two
    final runs of the campaign: the best-supported new idea, extending the only mechanism
    that reproduced.'
  status: completed
  created_revision: 603
