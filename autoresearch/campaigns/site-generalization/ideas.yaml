- id: site-acquisition-half-channel-normalization
  mechanism_id: per-study-feature-normalization
  parent_idea_id: null
  title: Normalize half the early feature channels within each study acquisition
  opportunity: The incumbent's scanner-head accuracy rises from 0.1841 to 0.3194 while
    validation macro AUC largely flattens after epoch 5 despite continued loss reduction.
    Source inspection shows ordinary batch normalization in the ResNet stages and
    training-only DSU at stride eight. A possible remaining shortcut is dependence
    on acquisition-level feature moments and the training mixture's population statistics.
    No normalization-specific failure has been measured, so this is an independent
    hypothesis rather than a diagnosis of the scanner-erasure failures.
  mechanism: At the first normalization layer of each layer1 residual block, normalize
    the first half of channels using moments pooled over the valid sampled slices
    and spatial positions of that acquisition. Keep ordinary batch normalization on
    the remaining half. Preserve the pretrained affine parameters and their names
    for L2-SP anchoring. Use the same within-acquisition rule during training and
    prediction, without accumulating statistics across prediction studies. Keep other
    normalization layers unchanged and retain stride-eight DSU downstream. Half the
    channels preserve population-normalized intensity information while the other
    half provide features less dependent on acquisition appearance.
  precedents:
  - '[IBN-Net](https://arxiv.org/abs/1807.09441) combines instance and batch normalization
    to balance appearance invariance and content preservation. Pooling moments across
    an acquisition''s sampled slices is the proposed adaptation here.'
  - Current modeling/model.py routes images through ResNet batch normalization and
    applies DSU only during training. Its acquisition_index already identifies the
    slices belonging to each acquisition.
  - Closed cross-site MixStyle exchanged moments with other studies. This proposal
    uses only the current acquisition and changes deployed normalization, without
    donor selection or feature exchange.
  - The external RN18 ledger records rejected BN-adapted head starts and an invalid
    upper-stage batch-renormalization attempt. Neither establishes an outcome for
    this shallow within-acquisition construction.
  novelty: 'An untried normalization family: deterministic current-study statistics
    in a limited early-channel subset. It neither erases learned scanner directions
    nor reopens the closed donor-style mixing mechanism.'
  coverage: All studies, acquisition types and labels follow the same rule. Group
    slices by existing acquisition membership, keeping different acquisitions separate.
    Exclude padded slices and geometrically invalid pixels from moment estimation;
    protect zero variance with a numerical epsilon. No site, vendor, scanner or field-strength
    values enter prediction.
  exploitation: Log hybrid-normalization output change against the ordinary BN calculation
    on identical activations, affected acquisitions, valid moment support and channel
    variance. A positive epoch-0 output-change scalar establishes activation. Examine
    late macro curves and all held-out sites; only the campaign macro rule and seen-site
    guard decide adoption.
  budget: "Retain the ten-epoch schedule, current study sampling, batch size and supervisor\
    \ seed. Two shallow moment reductions add no backbone pass. Estimated training\
    \ time is 980\u20131100 seconds; masked reductions need implementation-level runtime\
    \ accounting within the existing 1373.5-second ceiling."
  implementation: Add the normalization helper under modeling/ and integrate acquisition
    grouping and geometric masks through modeling/model.py's ResNet traversal. Preserve
    pretrained affine values and parameter names before Lightning captures L2-SP anchors.
    Ensure the prediction path executes the same normalization even though DSU is
    disabled there. Add epoch diagnostics in training/lightning.py. Replace the specified
    channel normalization directly, retaining all other incumbent behavior. Rebase
    onto a newly accepted incumbent and retain unrelated winners, including any feature-direction
    anchor; document interactions rather than dropping objectives.
  open_choices: "Normalization can suppress real tissue-intensity evidence. Masking\
    \ and the restricted channel/stage scope limit, but do not eliminate, that risk.\
    \ The fixed \xD71 and \xD74 sampling counts produce different moment-estimation\
    \ precision. A newly accepted pretrained feature-direction anchor may oppose the\
    \ representation change."
  dependencies: []
  priority_rationale: 'Second: explores a permitted family absent from the campaign
