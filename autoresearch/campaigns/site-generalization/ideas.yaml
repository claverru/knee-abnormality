- id: site-acquisition-channel-selective-normalization
  mechanism_id: per-study-feature-normalization
  parent_idea_id: site-acquisition-half-channel-normalization
  title: Learn which early channels retain their statistics during acquisition normalization
  opportunity: "The normalization candidate's epochs 5\u20139 \xD71 macro AUC remained\
    \ around 0.921\u20130.922 while training loss and ArcFace loss closely tracked\
    \ the incumbent. Its seen-site deficit therefore cannot be explained solely by\
    \ different slice support at \xD74 prediction. Forced normalization may remove\
    \ useful tissue statistics alongside acquisition style. This is a hypothesis,\
    \ not an established cause. Learn channel-specific restoration using the unchanged\
    \ training objectives."
  mechanism: "At bn1 in each of the two layer1 blocks, retain the ordinary BN output\
    \ B and compute the rejected candidate's masked acquisition-normalized output\
    \ A for the same first 32 channels, sharing the pretrained affine parameters.\
    \ Output B + a_c(A\u2212B), with one learned coefficient per affected channel\
    \ and block; retain ordinary BN for the remaining channels. Initialize all 64\
    \ coefficients to 1, reproducing the parent's full normalization rather than starting\
    \ with a weaker setting. Bound coefficients to [0,1] in the forward computation\
    \ and project them after optimizer updates. Train these model-level vectors at\
    \ the existing head learning rate without weight decay or L2-SP. Coefficients\
    \ are global learned parameters, independent of site, label and prediction metadata.\
    \ This lets supervision restore useful statistics selectively."
  precedents:
  - 'site-acquisition-half-channel-normalization-20260930T003900Z-acb7e919: curves,
    comparison/comparison.json and saved held_out_site_predictions.csv motivate the
    retry; the family verdict below records its measured outcome.'
  - '[Batch-Instance Normalization](https://arxiv.org/abs/1805.07925) learns channel-wise
    control over retaining versus removing style information. This proposal adapts
    that principle to masked acquisition moments; the paper does not establish MRI
    transfer gains.'
  - '[IBN-Net](https://arxiv.org/abs/1807.09441) combines instance and batch normalization
    to balance appearance invariance and content preservation. The rejected candidate
    used a fixed channel partition; this follow-up learns restoration within that
    partition.'
  - 'Inspected modeling/acquisition_normalization.py and modeling/model.py in the
    rejected source: acquisition moments replace the first half of channels at both
    layer1 bn1 locations. The incumbent''s training/lightning.py excludes one-dimensional
    parameters from decay and L2-SP.'
  novelty: Replaces mandatory statistics removal with learned channel selection. Initialization
    matches the rejected transformation, so this is not a lower-strength rerun. The
    distinguishing activation diagnostic measures the actual output contribution of
    learned departures from that initialization.
  coverage: Apply the same architecture to every study and all labels. Acquisition
    membership groups slices only; no site, vendor, scanner or field-strength input
    is introduced. Retain the remaining BN channels, stride-eight DSU, disease targets
    and class weights, auxiliary terms, sampling geometry and evaluation multipliers.
    The mechanism does not require either accepted idea as a behavioral prerequisite.
  exploitation: "Log valid-pixel means of |a_c(A\u2212B)| and |(a_c\u22121)(A\u2212\
    B)| each epoch. The latter must become positive to demonstrate learned restoration\
    \ beyond the fixed parent. Also log coefficient mean, range, channel dispersion,\
    \ gradient norm and supported acquisition counts. Evaluate with the unchanged\
    \ macro adoption rule and seen-site guard; retain all five site and both vendor\
    \ diagnostics without creating label-specific objectives."
  budget: "Keep ten epochs, batch size eight, accumulation one, 26 triplets per study\
    \ and the supervisor's seed 1533697213. The rejected normalization took 969 seconds\
    \ versus the incumbent's 951 seconds. Sixty-four coefficients and an elementwise\
    \ blend add no backbone pass; estimated training is 970\u20131,050 seconds, not\
    \ a measurement. The fixed 457.84\u20131,373.51 second training range remains\
    \ binding."
  implementation: Add the gated normalization to the development incumbent through
    modeling/model.py and a modeling helper; add diagnostics and coefficient projection
    in training/lightning.py. Reuse the rejected candidate's moment calculation and
    layer1 locations, but do not introduce its fixed-half mode or private runtime
    flag. Use one serialized model setting in config.py and configs/training.yaml
    so training and prediction construct the same architecture. Keep coefficient vectors
    outside the backbone parameter namespace, persist them in checkpoints, and preserve
    pretrained BN state names. Retain accepted pooled ArcFace, L2-SP and unrelated
    incumbent improvements. If another incumbent is accepted during development, apply
    this change to that source and retain its unrelated behavior; reconcile any overlapping
    normalization replacement explicitly. Do not stack the rejected implementation
    as a second normalization stage.
  open_choices: Gates could remain at their initialization or restore almost all BN
    behavior; diagnostics must distinguish those outcomes from selective learning.
    Acquisition moments still depend on sampled slice coverage, and geometric masks
    do not exclude every padding-contaminated receptive field. Those inherited limitations
    remain unresolved. Preserve acquisition grouping across prediction chunks and
    account for its memory cost. No label-specific gates, extra loss, strength sweep
    or confirmation run is proposed.
  dependencies: []
  priority_rationale: 'First and only new proposal: it follows an open near-miss with
    a concrete structural change, modest cost and a direct activation signature. Evidence
    is uncertain, especially the seen-site loss, so it merits one diagnostic follow-up
