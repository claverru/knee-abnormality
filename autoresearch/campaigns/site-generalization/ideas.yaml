- id: site-arcface-prototypes
  mechanism_id: cross-site-metric-learning
  parent_idea_id: null
  title: Training-only angular-margin head with present and absent prototypes per
    label shared across all sites
  opportunity: Shared prototypes pull every positive of a label toward one direction
    whatever the scanner, and push negatives away by a fixed angle, compacting each
    label class across sites without erasing the scanner.
  mechanism: For each of the 12 labels, L2-normalize the pooled study feature and
    two learned prototypes (present, absent); logits s cos(theta), with an additive
    angular margin on the true prototype, s cos(theta + m), s 16, m 0.2. Cross-entropy
    on hard targets at 0.5, each study weighted by |2y - 1| of its soft target, weight
    0.1 beside the unchanged disease loss; dropped at inference.
  precedents:
  - Deng et al. 2019, ArcFace.
  novelty: No margin-based or prototype auxiliary has been tried on this project.
  coverage: All training studies and labels.
  exploitation: Held-out-site AUC, seen-site guard, the angle to the true prototype
    per site cluster and its spread across clusters per epoch.
  budget: Twelve small heads; negligible.
  implementation: An auxiliary head in training/auxiliary with site_generalization.arcface_weight,
    margin and scale options; log the per-cluster angle and its across-cluster spread.
  open_choices: Margin 0.1 or 0.3 after the first result.
  dependencies: []
  priority_rationale: The user's proposal; a class-conditional route to the same alignment
    as CORAL, by a different mechanism.
  status: completed
  created_revision: 0
  seeded: /home/claudio/src/knee-abnormality-sites-out/autoresearch/campaigns/site-generalization/seed-ideas.yaml
