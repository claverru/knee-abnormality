- id: site-fourier-feasible-residual-exchange
  mechanism_id: cross-site-appearance-randomization
  parent_idea_id: site-fourier-matched-shape-exchange
  title: Deliver matched Fourier exchange through a bounded, mean-preserving image
    residual
  opportunity: "Matched Fourier exchange activates throughout training, but delivery\
    \ breaks its spectral safeguards: clipping affects 11.7\u201311.9% of reconstructed\
    \ pixels, delivered mean error remains about 0.0038 and relative low-band power\
    \ error about 0.060. Source confirms reconstruction is clamped and then zero-background\
    \ pixels are restored. The clipping statistic includes background, so foreground\
    \ damage is not established. Nevertheless, the delivered mean error identifies\
    \ a concrete failure of the intended preservation property."
  mechanism: "Retain matched cross-site donor selection, probability 0.5, beta 0.01,\
    \ recipient phases and the DC/power-normalized spectral proposal z. For recipient\
    \ x in [0,1], form d=z\u2212x and w=4x(1\u2212x) on its existing nonzero support.\
    \ Set c=sum(w*d)/sum(w), then r=w*(d\u2212c). This gives a zero-sum residual that\
    \ vanishes at zero and saturated pixels. Choose one acquisition-wide alpha, at\
    \ most 1, from the tightest pixel bound ensuring 0\u2264x+alpha*r\u22641 across\
    \ its selected triplets, with a fixed numerical safety factor. Deliver x+alpha*r\
    \ directly, without clipping or subsequent background restoration; degenerate\
    \ residuals remain unchanged. Log actual delivered pixel change, alpha, nonzero\
    \ coverage, mean error, range violations, delivered low-band power error and residual\
    \ energy outside the proposed band. Use delivered pixel change, including skipped\
    \ triplets as zero, as the epoch activation scalar."
