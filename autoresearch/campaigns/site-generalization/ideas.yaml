- id: site-fourier-matched-shape-exchange
  mechanism_id: cross-site-appearance-randomization
  parent_idea_id: site-fourier-amplitude-swap
  title: Exchange matched Fourier amplitude shape while preserving recipient DC and
    low-band power
  opportunity: The rejected Fourier run showed a persistent pixel-change signature
    near 0.129 and worse seen-site ranking, especially MCL, despite some held-out
    gains. Its source samples cross-site donors without matching plane or contrast
    and replaces the DC component along with low frequencies before clipping. Thus
    acquisition content and brightness changes can accompany the intended site appearance
    exchange. This is a concrete construction problem to address, although its causal
    contribution to the result remains unmeasured.
  mechanism: 'Choose donors from a different training site but the same existing series
    type: plane, fluid sensitivity and fat suppression. Select donor studies uniformly
    before selecting an eligible acquisition. Keep the recipient phase and DC coefficient.
    Within the existing non-DC low-frequency mask, normalize the donor amplitude vector
    to the recipient''s low-band L2 power before replacement. Retain probability 0.5
    and beta 0.01. Skip recipients lacking a matched donor or usable non-DC donor
    power; never fall back to an unmatched donor.'
  precedents:
  - 'site-fourier-amplitude-swap source: unmatched acquisition donors, DC replacement,
    reconstruction clipping and recipient background restoration.'
  - site-cross-mixstyle also exchanged unmatched acquisition statistics and was rejected;
    this proposal concentrates the appearance retry on a single, explicitly controlled
    transform.
  - '[FDA](https://arxiv.org/abs/2004.05498) motivates low-frequency amplitude exchange.
    Matching acquisition type and preserving recipient DC/power are proposed safeguards,
    not findings established by that paper.'
  novelty: Changes donor eligibility and the transferred spectral quantity. It preserves
    brightness and total low-band power rather than merely reducing augmentation strength.
  coverage: Applies across all disease labels and all training sites with matched
    donors. Use only the pinned site table for site identity and existing series-type
    metadata for matching. Log availability by type and site; reduced matched coverage
