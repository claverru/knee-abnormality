- id: site-acquisition-image-dependent-restoration
  mechanism_id: per-study-feature-normalization
  parent_idea_id: site-acquisition-channel-selective-normalization
  title: Restore acquisition-normalization residuals through image-dependent channel
    gates
  opportunity: "The selective-normalization run's epochs 7\u20139 \xD71 macro AUC\
    \ stayed at 0.9223\u20130.9224 versus the incumbent's 0.9245, despite similar\
    \ final training loss. Its static normalization coefficients finished at means\
    \ 0.9578 and 0.9852: learned restoration changed activations by only about 0.0014\
    \ against a 0.0464 normalization effect. Static channel coefficients cannot distinguish\
    \ acquisitions where removed statistics contain useful disease evidence from acquisitions\
    \ where those statistics mainly encode appearance. That restriction is measured;\
    \ its contribution to the seen-site deficit remains a hypothesis."
  mechanism: "At the same first 32 channels of bn1 in both layer1 blocks, compute\
    \ ordinary BN output B and masked acquisition-normalized output N with the existing\
    \ pretrained affine parameters. Form residual R=B\u2212N. Pool each acquisition's\
    \ masked channel means and RMS values of R, producing 64 image-derived descriptors.\
    \ A separate 64\u219216\u219232 MLP per block produces sigmoid restitution gates\
    \ g; deliver N+gR, retaining ordinary BN on the other channels. Initialize final\
    \ weights to zero and biases to logit(0.05), so acquisition-dependent restoration\
    \ must be learned. Use the unchanged training objectives, without an additional\
    \ restitution loss. Log restoration magnitude, gate variation and saturation,\
    \ and restoration_conditioning_effect=mean(abs((g(descriptors)\u2212g(0))*R))\
    \ over supported pixels. Positivity after training starts demonstrates an actual\
    \ image-dependent contribution rather than movement of a constant coefficient."
  precedents:
  - site-acquisition-half-channel-normalization and its selective follow-up establish
    the normalization/restoration tradeoff. The latter's coefficient and restoration
    trajectories are recorded in [run curves](/home/claudio/src/knee-abnormality/outputs/autoresearch/site-generalization/jobs/researcher-20260930T081050Z-59e74e4c/curves.json).
  - The rejected selective implementation uses one static coefficient vector per block,
    shared across all acquisitions. Its [normalization implementation](/home/claudio/src/knee-abnormality/outputs/autoresearch/site-generalization/experiments/site-acquisition-channel-selective-normalization-20260930T070754Z-4f07a19f/source/src/knee_abnormality/modeling/acquisition_normalization.py)
    supplies the masked moments and residual decomposition to adapt.
  - '[Jin et al., Style Normalization and Restitution for Domain Generalization and
    Adaptation](https://arxiv.org/abs/2101.00588) motivates recovering discriminative
    information from normalization residuals. This proposal borrows that architectural
    principle, omits the paper''s additional causality objective, and makes no claim
    that its published gains transfer to this MRI task.'
  novelty: Replaces globally shared channel blending with a learned function of each
    acquisition's image features. This changes which residual information can be restored,
    rather than merely increasing normalization strength, gate learning rate or training
    duration. It introduces neither domain-specific parameters nor metadata conditioning.
  coverage: "Apply the same mechanism and unchanged objectives to all 12 labels and\
    \ every supported acquisition. Saved predictions confirm selective-normalization\
    \ site deltas bg +0.002021, de \u22120.000196, el +0.000335, fr \u22120.003210\
    \ and nl +0.003532. Held-out Philips and Siemens improved by +0.002021 and +0.000894,\
    \ while seen-site GE, Philips and Siemens declined. These exploratory differences\
    \ motivate preserving discriminative information broadly; they do not select labels\
    \ or vendors for optimization."
  exploitation: Use the remaining structural follow-up in the normalization family.
    Its primary improvement and persistent seen-site deficit justify testing whether
    acquisition-dependent restitution can improve the tradeoff. Evaluate once against
    the supervisor's current incumbent using the unchanged macro adoption rule and
    seen-site guard.
  budget: "Keep 10 epochs, batch size 8, accumulation 1, current input per study and\
    \ supervisor-assigned seed 1533697213. The predecessor trained in 1,000.6 seconds.\
    \ Two small MLPs and pooled residual statistics require no additional backbone\
    \ pass; approximately 1,000\u20131,100 seconds is a planning estimate, within\
    \ the fixed 457.8\u20131,373.5-second range. Preserve prediction chunking and\
    \ account for the predecessor's retained layer1 feature maps; realized runtime\
    \ and memory remain unmeasured."
  implementation: Add this normalization path to the current incumbent, adapting the
    historical acquisition-moment implementation and replacing its static coefficient
    vectors with image-dependent gates. Changes belong in modeling/acquisition_normalization.py,
    modeling/model.py, training/lightning.py, config.py and configs/training.yaml.
    Retain accepted pooled ArcFace and L2-SP, existing BN affine parameters, remaining
    BN channels, stride-eight DSU, all losses and weights, geometry, sampling and
    evaluation. Serialize one setting needed to reconstruct the new path; do not retain
    historical fixed-half or static-gate modes or their projection hook. Initialize
    new modules inside an isolated RNG context and include their parameters in the
    existing optimizer. Unsupported acquisitions retain ordinary BN. Prediction uses
    only image features and existing acquisition grouping, with no site table or scanner
    metadata. If a new incumbent is accepted during development, rebase onto it, retain
    unrelated improvements, and reconcile any overlapping normalization path rather
    than stacking competing implementations.
  open_choices: Use one fixed 16-unit bottleneck and 5% initial restitution, without
    a parameter sweep. The principal uncertainty is whether image-dependent gates
    recover disease information or restore acquisition shortcuts. Gate variation alone
    cannot resolve that question. Masked moments also retain the predecessor's receptive-field
    contamination and sampled-slice coverage limitations; inspect their diagnostics
    without changing the evaluator or adding acceptance conditions.
