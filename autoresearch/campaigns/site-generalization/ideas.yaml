    far below the 0.208 majority), the detached probe to 0.099 with loss 2.56 above
    the 1.90 prior entropy, training loss rose from 5.6 to 6.6 and seen-site validation
    AUC fell to 0.52. Reversed cross-entropy is unbounded: the backbone is rewarded
    for making the adversary ever more wrong. The earlier KL-to-prior confusion head
    was bounded (minimal when the features carry no scanner information) but inert
    at weight 0.1 (about 0.1% of the loss; head accuracy rose to 0.33). The unlearning
    question therefore still needs a bounded objective at a weight that acts.'
