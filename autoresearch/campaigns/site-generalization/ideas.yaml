  experiments:
  - site-scanner-subspace-projection-20260929T212713Z-3cb5e8f8
  decision: reject
- id: site-scanner-subspace-instead-of-arcface
  mechanism_id: scanner-subspace-erasure
  parent_idea_id: site-scanner-subspace-projection
  title: 'Substitution: the scanner-subspace projection replacing the per-label ArcFace
    head in the incumbent'
  opportunity: 'User request for a head-to-head: the incumbent carries the per-label
    ArcFace head (site-arcface-per-label-pooled, +0.0018 held-out). Both mechanisms
    aim at site-independent disease evidence, one by shaping each label''s pooled
    feature, the other by removing scanner-style directions before pooling. Measuring
    the projection without the ArcFace head shows whether it can replace it, or whether
    the two are complementary.'
  mechanism: 'Remove the per-label ArcFace auxiliary from the incumbent by setting
