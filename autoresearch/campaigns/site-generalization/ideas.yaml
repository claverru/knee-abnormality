  opportunity: 'User question (2026-09-30): the recipe only contains removal and avoidance
    of scanner signal (scanner-appearance augmentations, L2-SP, per-label ArcFace);
    adversarial unlearning was only tested on top of that family, where the two clash,
    because appearance randomization already scrambles the signal the unlearning head
    must predict. Removing the old scanner-group confusion head was neutral at two
    seeds, which says only that unlearning adds nothing on top of removal. site-confusion-retarget
    (site-cluster unlearning) gave the strongest unlearning signal (+0.0016 held-out,
    seen -0.0017, one run, old seed, on top of the removal family). This run measures
    unlearning alone against the removal family alone.'
  mechanism: 'Starting from the incumbent: (1) remove L2-SP anchoring and restore
    the pre-L2-SP optimizer (weight decay 0.01 on backbone weight matrices); (2) remove
    the per-label ArcFace auxiliary; (3) turn off the scanner-appearance augmentations:
    data.gin_augmentation.probability 0, data.contrast_mixing_augmentation.probability
    0 and model.feature_statistics_augmentation.probability 0; (4) turn on site-cluster
    unlearning exactly as in site-confusion-retarget: the detached confusion head
    predicts the 12 training-site clusters plus other (instead of the 8 scanner groups),
    and the backbone is trained with the existing bounded KL toward the training cluster
    frequencies, weight 0.1 (trainer.scanner_confusion_weight) with the existing ramp.
    Geometry (affine, reflection) and the generic intensity gamma, noise, smoothing
    and resolution augmentations stay as in the incumbent, as do all other settings.'
