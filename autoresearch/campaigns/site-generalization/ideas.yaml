- id: site-pretrained-feature-direction-anchor
  mechanism_id: pretrained-feature-protection
  parent_idea_id: site-l2-sp-anchor
  title: Complement L2-SP with a frozen pretrained feature-direction anchor before
    DSU
  opportunity: Against the anchor-only run, the incumbent ends with greater stage-1
    drift (0.0366 versus 0.0289), stage-2 drift (0.0851 versus 0.0799), and anchor
    penalty (0.0246 versus 0.0186), while validation macro flattens. Parameter proximity
    does not directly preserve feature outputs. A function-space constraint could
    protect transferable early features while permitting upper-stage adaptation. No
    stored feature comparison currently establishes the size or importance of this
    functional drift.
  mechanism: "Add a frozen RadImageNet teacher containing the stem through layer2.\
    \ For every training study, select one already-sampled triplet by choosing an\
    \ available acquisition uniformly and then a triplet uniformly. Feed the identical\
    \ prepared image to the teacher in eval/no-grad mode. Compare its stride-8 feature\
    \ map with the student's corresponding map immediately before DSU. Normalize feature\
    \ vectors across channels and penalize mean 1\u2212cosine over geometrically valid\
    \ locations, averaged equally over studies. Use weight 0.05, ramped over the first\
    \ two epochs. Keep the existing parameter anchor and allow all student stages\
    \ to train."
  precedents:
  - site-l2-sp-anchor established that pretrained-weight protection can transfer on
    this sites-out split.
  - External rn18-freeze-stem-layer1 and rn18-bn-adapted-head-start were rejected.
    They froze optimization or changed its schedule; this proposal keeps continuous
    adaptation and constrains feature direction.
  - '[DELTA](https://arxiv.org/abs/1901.09229) motivates regularizing pretrained feature
    outputs. This proposal uses a lightweight directional constraint without DELTA''s
    learned attention selection.'
  novelty: Adds an input-dependent functional constraint that matrix-weight distance
    cannot express. It preserves student plasticity and operates before the existing
    DSU transform, avoiding a direct penalty against DSU perturbations.
  coverage: Every training study contributes one existing view per visit, with acquisitions
