- id: site-dro-entropy-corrected-risk
  mechanism_id: robust-objective-over-sites
  parent_idea_id: site-dro-fresh-bounded-risk
  title: Score bounded site reweighting using BCE above each site's fixed soft-target
    entropy
  opportunity: 'New analysis identifies a measurable confound in the rejected bounded-DRO
    run. Its site risks include different, fixed soft-target entropy floors. English/minor
    has a weighted floor of 0.402779; English/Philips has 0.272285. At epoch 8, their
    raw risks were 0.512290 and 0.386234, but subtracting those floors reverses their
    ordering: 0.109511 versus 0.113950. Nevertheless, epoch 9 applied multipliers
    of 1.848556 and 0.524057. The hypothesis is that raw-risk weighting emphasizes
    differences in target uncertainty instead of reducible prediction error, weakening
    transfer across acquisition sites.'
  mechanism: 'For each training site g, precompute F_g = sum_observed[w(y) H(y)] /
    N_g, using the actual training targets, existing gold overrides, observed masks
    and unchanged class-balance weights. H(y) is binary entropy with zero at either
    endpoint. Accumulate complete-epoch raw weighted BCE risk R_g and score the next
    epoch with E_g = R_g - F_g. This equals mean weighted Bernoulli KL to the fixed
    targets, although it is not an estimate of attainable model risk. Retain uniform
    epoch 0, temperature 0.1, multipliers bounded to [0.5, 2], population normalization
    and previous-complete-epoch updates. Optimize the existing weighted BCE cells
    with the resulting detached site multiplier; subtraction affects risk scoring
    only. Log floors, raw and excess risks, ratios, site contribution mass, and entropy_dro_applied_loss_difference:
    the observed-cell mean absolute loss contribution difference between applied ratios
    and diagnostic raw-risk ratios computed from the same preceding epoch. Require
    positive activation at epoch 1; the raw-risk comparator is diagnostic only.'
  precedents:
  - 'site-dro-fresh-bounded-risk: complete-epoch risks and bounded population-corrected
    multipliers activated, but its existing numerical verdict remains reject. This
    proposal changes the risk being ranked while retaining those algorithmic repairs.'
  - 'New CPU analysis of all 2,683 training studies and 32,196 observed cells, with
    input hashes and exact formulas: [entropy-risk-analysis.json](/home/claudio/src/knee-abnormality/outputs/autoresearch/site-generalization/jobs/researcher-20260930T002046Z-a51cee6f/scratch/entropy-risk-analysis.json).
    Replaying epoch-8 risks with entropy subtraction changes English/minor''s epoch-9
    ratio from 1.848556 to 1.004946 and English/Philips from 0.524057 to 1.050554.
    These are counterfactual ratios, not trained-model results.'
  - The incumbent's training/lightning.py selects a fixed class weight by target >=
    0.5 and multiplies the entire soft-target BCE cell. Consequently, its matching
    entropy floor is w(y)H(y), rather than the entropy formula for positive-term-only
    weighting.
  - '[Yu et al., ICML 2024](https://proceedings.mlr.press/v235/yu24a.html) study minimax
    excess risk alongside group DRO. This supplies conceptual precedent for subtracting
    group baselines; the proposed analytic target-entropy baseline is different from
    their group-optimal risk baseline, and their guarantees are not claimed here.'
  novelty: The previous repair addressed cumulative updates, normalization and concentration.
    This repair removes a proven, parameter-independent offset from the site score.
    It neither changes target values nor adds label-specific objectives, confidence
    filtering or gold-specific weighting. The measured reversal of site-risk ordering
    distinguishes it from another multiplier-strength sweep.
  coverage: Apply the same calculation to every observed cell of every disease label
    and every cluster produced by the pinned training-site loader. Preserve all training
    studies and their existing sampling frequency. Site metadata is used only during
    training. Held-out sites, validation labels and vendor results must not determine
    floors, ratios or parameters.
  exploitation: Use the exact BCE decomposition to redirect the existing robust objective
    toward prediction discrepancy. On the recorded trajectory, entropy correction
    substantially changes site allocation without changing the temperature or bounds.
    The anticipated benefit is less emphasis on reporting-uncertainty differences
    and better unseen-site discrimination; neither that causal explanation nor a performance
    gain has been established.
  budget: "Keep 10 epochs, batch size 8, 3,360 optimizer steps and the existing inputs\
    \ per study. Floor computation processes only 32,196 target cells once; subsequent\
    \ changes require small site-level reductions and ratio calculations, with no\
    \ additional encoder pass. Expect cost near the measured 922.85 s bounded-DRO\
    \ run and 951.27 s incumbent, within 457.84\u20131,373.51 s; realized compliance\
    \ remains the supervisor's check. Train at the incumbent seed assigned by the\
    \ supervisor, currently 1533697213."
  implementation: Develop from the latest accepted incumbent. Add an auxiliary site-risk
    module under training/auxiliary and integrate initialization, loss multipliers
    and epoch diagnostics in training/lightning.py, with the candidate setting in
    config.py and configs/training.yaml. Reuse the rejected bounded run's complete-epoch
    accounting and ratio solver, replacing raw-risk scoring with entropy-corrected
    scoring. Do not retain a selectable raw-risk or cumulative-update mode; any raw-risk
    calculation serves diagnostics only. Compute floors from the already loaded training
    targets in float64, respecting endpoint entropy and observed masks, and preserve
    necessary buffers across checkpoints. Retain accepted pooled ArcFace, L2-SP, all
    unrelated newly accepted improvements, disease cell formulas, auxiliary losses,
    augmentation, sampling and inference. If another incumbent is accepted during
    development, rebase this scoring change onto it and recompute floors from its
    actual training loss weights. No labels.py or evaluation changes are required.
  open_choices: Implementation placement and buffer serialization remain engineering
    choices. Keep the predecessor's temperature, bounds and warm-up fixed to isolate
    the scoring change. Target entropy is an exact cellwise lower bound, not Bayes
    error; remaining excess risk still mixes prevalence, label weights, acquisition
    difficulty and model fit. Small proxy clusters remain noisy. These limitations
    prevent interpreting corrected ratios as proof of acquisition-specific robustness.
