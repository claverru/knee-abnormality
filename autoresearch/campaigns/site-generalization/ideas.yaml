- id: site-scanner-unlearning-grl
  mechanism_id: scanner-adversarial-unlearning
  parent_idea_id: site-no-scanner-confusion-reseed
  title: 'A real unlearning test: gradient-reversal scanner adversary strong enough
    to suppress scanner identity, on the L2-SP incumbent'
  opportunity: 'The mechanism audit found that no unlearning ever engaged in this
    campaign: the base scanner-confusion head reached 0.33 accuracy on 8 scanner groups
    against a 0.21 majority rate and kept rising after its ramp saturated, because
    its KL term was about 0.1% of the loss; the site-cluster retarget and site-unlearning-only
    behaved the same. Removal versus unlearning is therefore still open. This idea
    makes unlearning actually happen and checks that it did.'
  mechanism: 'On the incumbent (L2-SP alone, scanner confusion disabled): (1) an adversary
    head, a linear layer on the study mean of the pooling tokens (the same features
    the old confusion head read), predicts the 8 scanner groups of the existing confusion
    machinery; (2) its input passes through a gradient-reversal layer, so the adversary
    minimizes its cross-entropy while the backbone receives the negated gradient scaled
    by lambda, with the standard DANN schedule lambda = 2 / (1 + exp(-10 p)) - 1,
    p the training progress from 0 to 1, and adversary loss weight 1.0; (3) a separate
    probe head of the same shape reads the same features detached (no gradient to
    the backbone) and measures how much scanner identity remains. Everything else
    is unchanged.'
  precedents:
  - Ganin et al. 2016, Domain-Adversarial Training of Neural Networks (gradient reversal
    with the lambda schedule above).
  - Dinsdale et al. 2021, unlearning scanner information for MRI harmonisation.
  - 'Mechanism audit of this campaign (mechanism-audit.md): every earlier confusion
    head was inert.'
  novelty: First unlearning in this campaign whose adversarial term is large enough
    to act.
  coverage: All training studies.
  exploitation: 'Activation criterion, required before reading the AUC: the detached
    probe''s scanner-group accuracy in the last two epochs must fall to within 0.03
    of the 0.208 majority rate (the old confusion head reached 0.33), and the adversary
    loss must stay near the prior entropy (1.90 nats). Log per epoch: adversary accuracy
    and loss, probe accuracy and loss, lambda, and the reversed-gradient norm reaching
    the backbone relative to the disease-loss gradient norm. Then held-out-site AUC
    and the seen-site guard against the incumbent.'
  budget: Two linear heads; negligible.
  implementation: New module in training/auxiliary for the gradient-reversal adversary
    and the detached probe, wired in training/lightning.py, with options under site_generalization
    for the adversary weight (1.0) and the lambda schedule; reuse the existing scanner-group
    targets and table from training/auxiliary/scanner_confusion.py. Keep site_generalization.scanner_confusion
    false (the old KL head stays off). Change nothing else.
  open_choices: None; weight 1.0, the DANN schedule, the 8 scanner groups and the
    study-mean features are fixed before the run.
  dependencies: []
  priority_rationale: 'Forced by Claude on the user''s instruction (2026-09-30) after
    the mechanism audit and the public-leaderboard check: settles whether unlearning,
    once actually active, helps unseen sites.'
