    features, because BatchNorm is not anchored.'
  - 'site-lp-ft, this campaign (BatchNorm frozen for one epoch: held-out +0.0016).'
  - Common practice in detection and segmentation fine-tuning (frozen BatchNorm) when
    batches are small and the pretrained statistics are trusted.
