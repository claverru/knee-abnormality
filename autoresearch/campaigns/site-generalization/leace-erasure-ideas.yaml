ideas:
- id: site-scanner-leace-token-erasure
  mechanism_id: scanner-leace-erasure
  parent_idea_id: site-scanner-subspace-projection
  title: Erase scanner identity from every pooling token with a closed-form LEACE eraser computed from running token statistics, replacing the learned ArcFace subspace
  opportunity: 'site-scanner-subspace-projection erased the wrong directions. Its study-mean ArcFace identity head barely learned scanners (0.177 accuracy against 0.129 majority at epoch 6), so its 8-dimensional subspace landed on the dominant token directions: the erased component was 65% of the token norm, and the run was rejected (held-out -0.0005, 80% [-0.0016, +0.0007]; seen-site guard -0.0023), while a linear probe on the erased tokens still decoded scanner identity above majority (0.186, rising). The erasure idea itself is untested. LEACE (Belrose et al. 2023) gives the least-squares-optimal linear eraser in closed form: it removes exactly the directions along which the class-conditional means differ, measured in whitened space, so no linear classifier can decode identity from the erased tokens, and it touches nothing else. It needs no learned head and no margin.'
  mechanism: '(1) Statistics, every training step, no gradient, float32, from the normalized pooling tokens BEFORE erasure (the output of mil_norm), detached, over visually valid tokens of studies whose scanner identity is populated: each token is centered by the running mean of its series type (the token_type index already computed in encode_batch; expose it in the encoded dict), then running exponential moving averages (decay 0.995 per step, bias-corrected by the running weight) of the centered second moment S (256 x 256) and of each identity''s centered mean m_k with its token share p_k. Identities: scanner model x field strength with at least 30 studies in the run''s training folds, exactly as in site-scanner-subspace-projection (24 identities; other studies are excluded from the statistics but still erased). (2) Eraser, recomputed each step from the statistics: whitening W = (S + eps I)^(-1/2) by symmetric eigendecomposition, eps = 1e-4 times the largest eigenvalue; D = columns sqrt(p_k) (m_k - sum_j p_j m_j); U = orthonormal basis of the column space of W D (SVD, singular values above 1e-6 times the largest; rank at most 23); E = W^+ U U^T W (256 x 256, oblique). (3) Application: x'' = x - r (x - c_t) E^T, where x is the normalized token, c_t the running mean of its series type and r ramps linearly from 0 to 1 over epoch 0. Applied in _pooling_tokens right after mil_norm, so attention scores, pooled values, the OA detector and every auxiliary that reads half_knee_tokens, and the incumbent''s per-label ArcFace pooled feature, all see erased tokens. (4) Inference: E and the per-type means are persistent, non-trainable buffers inside KneeAbnormalityModel (E zero and the means zero when disabled), saved in the checkpoint and used by validation, held-out prediction and export, with no scanner input; they are written only in training_step. The disease loss and all incumbent options, including the per-label ArcFace head, L2-SP and scanner confusion, are unchanged.'
  precedents:
  - Belrose et al. 2023, LEACE (least-squares concept erasure; closed-form, provably removes linear decodability of the concept).
  - Ravfogel et al. 2020, INLP (iterative nullspace projection).
  - Dinsdale et al. 2021, unlearning scanner information for MRI harmonisation, which improves unseen scanners.
  - 'site-scanner-subspace-projection, this campaign (reject: held-out -0.0005, seen-site -0.0023; identity head near majority, 65% of token norm erased, probe on erased tokens above majority).'
  novelty: First closed-form erasure; the previous subspace came from a weak learned head and erased dominant, not scanner-specific, directions.
  coverage: All training tokens of the 93% of training studies on well-populated scanners; all tokens are erased.
  exploitation: 'Held-out-site AUC and seen-site guard against the incumbent. Per epoch, all computed in closed form under no_grad with no trainable parameters: eraser rank; mean fraction of the token norm removed (expected far below the previous 65%); the whitened between-identity scatter of the identity means, trace(W D D^T W), before erasure and recomputed from the same running statistics after applying the eraser (should fall to near zero); and the largest cosine between the erasers row space and the 12 disease-head rows (diagnostic only).'
  budget: One 256 x 256 eigendecomposition, one 256 x 24 SVD and a 256 x 256 matrix product per step; negligible against the backbone.
  implementation: 'Options under site_generalization: leace_decay (0.995; 0 disables, leaving E zero) and leace_minimum_studies (30). Remove the site-scanner-subspace-projection code and options (subspace_rank, subspace_margin, subspace_scale, subspace_minimum_studies, the ScannerIdentityHead and its buffer) if present in the parent, keeping its identity loader. Add no trainable parameters and no loss term: the eraser has no learned head or probe, so the optimizer, its parameter groups and gradient clipping are identical to the incumbent''s. The eraser buffers and their application in modeling/model.py (_pooling_tokens returns erased tokens; a separate accessor returns the unerased normalized tokens for the statistics); the running statistics, eraser computation and diagnostics in training/auxiliary; the Lightning module updates them under no_grad at the start of each training step and never at validation or prediction. Do not change the incumbent''s scanner confusion, per-label ArcFace or L2-SP code.'
  open_choices: None; decay 0.995, eps 1e-4, the 1e-6 rank cut, series-type centering and the 30-study minimum are fixed before the run.
  dependencies: []
  priority_rationale: 'Retake forced by Claude under the user''s delegation after the first subspace run: the erasure idea targets the campaign goal (remove every trace of site bias) and was not actually tested, because the learned subspace missed scanner identity. Built on top of the incumbent.'
exhausted_directions: Learned ArcFace scanner subspaces on study-mean tokens (site-scanner-subspace-projection) erase dominant token directions rather than scanner identity.
