- id: anchors-by-weight-scale
  mechanism_id: weight-anchor
  parent_idea_id: null
  title: 'Weight anchors matched to the weight scale: 0.001 early and 0.00001 late'
  opportunity: 'Evidence (prior-work.md, Why it underfits): the anchor penalises the
    squared absolute distance from the pretrained weights, so on weights 7 to 12.7
    times larger the same relative movement costs 48 to 161 times more than on the
    ResNet-50; the drift of the first and the last stage shrank from epoch 2 on (0.0088
    to 0.0057, 0.0053 to 0.0036) as the rate fell. Dividing by the squared RMS ratio
    gives about 2e-5 and 6e-6 for the last two stages and 0.001 to 0.005 for the stem
    and first stage. Guess: +0.002 to +0.006 macro, more beside a higher rate.'
  mechanism: optimizer.anchor_alpha_early 0.001 and optimizer.anchor_alpha_late 0.00001.
    The anchors stay on every weight they hold in the incumbent.
  precedents:
  - 'ConvNeXt-Tiny tuned recipe: late anchor 0.0001 (prior-work.md, Precedents).'
  novelty: First run of this backbone at an anchor strength set from its weight scale.
  coverage: Every study and every label; the largest gaps to the ResNet-50 are Lateral
    OA, Fracture, PF OA, ACL and Lateral Meniscus (prior-work.md).
  exploitation: 'Read x4 and x1 against the incumbent, the training loss per epoch
    against the reference''s (0.934 falling to 0.593), and the labels from largest
    gain to largest loss. Activation: the logged anchor penalty and the drift of every
    stage against the incumbent''s. Shown wrong by: drift unchanged, or both multipliers
    below the incumbent. The anchors exist for unseen sites: the device stays on at
    the strength it has on the ResNet-50 in relative terms.'
  budget: The reference's training time (2,594 s) within 1.05; no change to memory
    (12.7 GB peak).
  implementation: 'Follow the environment paragraph of the developer instructions.
    Configuration only: configs/training.yaml. Apply to the incumbent as assigned.'
  open_choices: None.
  dependencies: []
  priority_rationale: The second measured cause, independent of the rate; keeps the
    site-generalisation device instead of removing it.
