- id: final-batchnorm-equal-study-moments
  mechanism_id: final-normalization-training
  parent_idea_id: null
  title: Give each study equal weight in final BatchNorm training moments
  opportunity: 'Evidence: MambaVision adds a shared 640-channel final BatchNorm after
    its late LayerNorm stages; the ResNet recipe lacks this final norm. model.py constructs
    token_study before encoding ragged study/view images, but native BatchNorm pools
    images and spatial positions equally. Hypothesis: studies contributing more images
    disproportionately influence the final training normalization and running buffers.
    Linear''s tail still has mixed label trajectories while macro rises, and its validation
    center-displacement scalar fluctuates despite generally falling loss. A harmful
    study-weight imbalance has not been measured.'
  mechanism: "Change only the final BatchNorm's training moment estimator. For each\
    \ represented study, calculate channel mean and within-study variance across its\
    \ images and spatial positions. Average study means equally; calculate total variance\
    \ as the equal average of within-study variance plus squared study-mean displacement.\
    \ Normalize every image with those shared moments and retain the existing affine\
    \ parameters and epsilon. Update existing running buffers using the current momentum\
    \ and the corresponding weighted finite-sample variance correction. Weights are\
    \ determined by actual study counts, not a tuned coefficient. Validation and prediction\
    \ continue using native evaluation-mode BatchNorm. Guess: +0.0002\u20130.0010\
    \ macro through more balanced population estimates."
  precedents:
  - "Evidence: src/knee_abnormality/modeling/model.py:2047 constructs token_study;\
    \ :2093 invokes _encode_images; :1145\u20131161 places the existing final norm\
    \ after the fourth stage. No change to input selection is required."
  - 'Evidence: the [MambaVision authors'' source](https://raw.githubusercontent.com/NVlabs/MambaVision/main/mambavision/models/mamba_vision.py)
    constructs the final BatchNorm. The proposal retains that layer''s parameters
    and architecture.'
  - 'Evidence: [PyTorch BatchNorm documentation](https://docs.pytorch.org/docs/2.14/generated/torch.nn.BatchNorm2d.html)
    describes pooled training moments, running-buffer updates and evaluation behavior.
    Equal study weighting is the proposed extension, not a documented recommendation.'
  - 'Primary precedent: [Ioffe''s Batch Renormalization paper](https://arxiv.org/abs/1702.03275)
    identifies small or non-independent minibatches as a BatchNorm limitation. It
    motivates inspecting correlated study images; this proposal does not implement
    Batch Renormalization.'
  - Pending precedents final-batchnorm-fixed-for-two-epoch-tail and final-batchnorm-momentum-follows-decay
    remain supervisor-owned. They change mode or update timing; this proposal changes
    statistical weighting. Neither has a measured result.
  - '[Complete campaign curves and checkpoint observations](/home/claudio/src/knee-abnormality/outputs/autoresearch/mambavision-settings/jobs/researcher-20261014T055246Z-06fc5f25/scratch/campaign-curve-analysis.md).'
  novelty: No decided run balances final-normalization moments by study. Unlike the
