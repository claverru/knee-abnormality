- id: late-anchor-follows-learning-rate
  mechanism_id: weight-anchor
  parent_idea_id: anchors-by-weight-scale
  title: Reduce the late-stage anchor as the learning rate decays
  opportunity: "Evidence: weight-scale anchors improved \xD74 by 0.010086 and \xD7\
    1 by 0.009323. Their final loss excluding the logged anchor penalty fell from\
    \ 0.575493 to 0.548855, so the improvement is not explained solely by subtracting\
    \ a smaller penalty. In twelve-epochs, stage-4 drift nevertheless retreats from\
    \ 0.0382 at epochs 6\u20137 to 0.0369 at epoch 12 while the anchor penalty remains\
    \ near 0.0101. Higher-rate runs also show retreating stage-4 drift and Fracture\
    \ declines. Hypothesis: the constant late anchor increasingly opposes task adaptation\
    \ during the low-rate tail. Guess: +0.0005 to +0.002 macro AUC at both multipliers."
  mechanism: 'Change one anchor policy: multiply the incumbent late-anchor coefficient
    by the actual backbone learning-rate multiplier, including its existing minimum
    ratio. On the assigned recipe, late alpha therefore starts at 1e-5 and ends at
    1e-7; early alpha stays 0.001 throughout. Use the existing schedule''s multiplier
    rather than fitting a new decay or choosing an epoch from label results. Retain
    anchor parameter coverage and weight-decay exclusions even as the multiplier falls.
    This adds temporal relaxation to the successful anchor mechanism without increasing
    backbone rates.'
  precedents:
  - "Evidence: anchors-by-weight-scale and twelve-epochs in the supplied run_curves\
    \ and their original metrics.csv files. The former improved all twelve \xD74 labels;\
    \ the latter's stage-4 drift turns inward during its tail."
  - 'Evidence: the assigned configs/training.yaml supplies late alpha 1e-5 and minimum_lr_ratio
    0.01; these determine the endpoint 1e-7 without a strength sweep.'
  - 'Evidence: external fastmri-joint adopted fastmri-weight-follows-learning-rate.
    That is a different loss and training population; it motivates scheduling a competing
    training term, not an expected effect size.'
  novelty: The campaign has tested constant anchor strengths, not a late anchor whose
    effective strength follows the schedule. It retains the successful early anchor
    rather than repeating the previously removed no-anchor seed.
  coverage: Every training study and all twelve labels. Fracture and the retreating
    late-stage drift motivate the hypothesis; adoption remains exclusively the fixed
    macro rule.
  exploitation: "Log late_anchor_schedule_factor, effective_anchor_alpha_late, anchor_penalty,\
    \ backbone_drift_stage4 and backbone_lr. Actual coefficients consumed by the penalty\
    \ must establish the scheduled release; drift is diagnostic, not activation proof.\
    \ Inspect task-composite loss as total loss minus the logged penalty. Compare\
    \ both macro multipliers and report the existing \xD74 interval and ResNet blend."
  budget: "Guess: approximately 3,120\u20133,250 training seconds and 12.73 GB peak\
    \ allocation, versus the incumbent's measured 3,117.8 seconds and 12.73 GB. Scalar\
    \ coefficient multiplication should add negligible work. Retain twelve epochs,\
    \ batch 8 and the incumbent seed; the supervisor measures compliance with 1,945.5\u2013\
    3,372.2 seconds."
  implementation: Follow the environment paragraph of the developer instructions.
    In src/knee_abnormality/training/lightning.py, replace constant application of
    late alpha with base alpha times the actual schedule multiplier; retain constant
    early alpha, pretrained buffers, coverage and AdamW exclusions. Add the five named
    observational metrics, deriving effective alpha from the coefficient actually
    used. Retain accepted rates, horizon, augmentation and any newly accepted clipping
    change. Reconcile against a newly accepted incumbent before development; preserve
    unrelated improvements and use its current schedule multiplier without restoring
    historical settings.
  open_choices: No strength or boundary sweep. The transfer benefit of keeping a constant
    early anchor is a hypothesis; unseen-site robustness is unmeasured here. Scheduling
    must not silently reintroduce AdamW decay on anchored parameters.
  dependencies:
  - anchors-by-weight-scale
  priority_rationale: 'First: extends the largest measured gain and directly addresses
    a remaining drift pattern shared by several runs. Small implementation and runtime
    cost; uncertainty remains about whether inward drift is undesirable.'
  source_change: true
  targeted_curve: "twelve-epochs, epochs 7\u201312: stage-4 drift 0.0382\u21920.0369\
    \ and nearly constant anchor penalty despite falling rates. Hypothesis: reduce\
    \ this retreat and improve late \xD71 macro and selected \xD74 macro by roughly\
    \ 0.0005\u20130.002."
  status: completed
  created_revision: 186
  ranking_rationale: 'Admit four proposals; proposal_admission reports their dependencies
    satisfied. Rank scheduled late anchoring first because it extends the largest
    measured gain with negligible expected preparation and training cost. Linear decay
    follows: it extends an accepted schedule line, although that win is modest and
    its transfer evidence supports a value, not an expected gain. The initial feature-statistics
    bypass is a materially different retry of rejected full removal, preserving random
    consumption and later perturbation. Two-epoch warm-up ranks fourth: author-supported
    duration and inexpensive implementation, but indirect evidence and a plausible
    underfit cost. The family ledger, prior-work precedent table and targeted searches
    of docs/validation/results and docs/history revealed related runs, but no measured
    duplicate of these four MambaVision mechanisms. Historical two-epoch warm-ups
    on EfficientNet and other backbones do not duplicate the proposed hybrid-backbone
    adaptation. Leave final-batchnorm-fixed-for-two-epoch-tail proposed: no running-statistics
    mismatch is measured, and the two-epoch boundary borrows a schedule result without
    establishing a normalization weakness. Its expected yield is weaker than the four
    admitted ideas; filling all five queue positions is unnecessary.'
  experiments:
  - late-anchor-follows-learning-rate-20261014T032155Z-6715982e
  decision: provisional_accept
