- id: stage-rates-by-weight-scale
  mechanism_id: backbone-rate
  parent_idea_id: null
  title: 'Stage-wise backbone rates matched to the weight scale: 6e-4 on the last
    stage, 0.6 times less per stage'
  opportunity: 'Evidence (prior-work.md, Why it underfits): this backbone''s pretrained
    weights are 1.5 to 12.7 times larger than the ResNet-50''s stage by stage (weight
    RMS 0.092 against 0.0073 in the last stage), and Adam moves every weight by about
    the rate per step whatever its size. At 5e-5 the last stage moved 0.4% from ImageNet
    by the end of the reference against 10.6% for the ResNet-50''s. The rates that
    give each stage the ResNet-50''s relative step are 5e-5 times the RMS ratio: stem
    7e-5, stages 1.8e-4, 2.6e-4, 3.5e-4 and 6.3e-4. A top rate of 6e-4 with 0.6 per
    stage gives 7.8e-5, 1.3e-4, 2.2e-4, 3.6e-4 and 6e-4. Guess on size: +0.005 to
    +0.012 macro.'
  mechanism: 'A new optimizer.backbone_lr_stage_decay (0.6). The backbone''s parameter
    groups get backbone_lr times decay to the power of the number of stages above
    them: stages.3 and the final norm at backbone_lr, stages.2 at 0.6, stages.1 at
    0.36, stages.0 at 0.216, the stem at 0.1296. optimizer.backbone_lr is 6e-4. Warm-up
    and cosine schedule scale every group alike. Head rate unchanged.'
  precedents:
  - The uncommitted training/lightning.py and config.py of the worktree knee-abnormality-fastmri-pretraining
    carry backbone_lr_stage_decay for ConvNeXt (1e-4, 0.7); port the mechanism onto
    this code, do not copy the file.
  novelty: First run of this backbone at rates set from its weight scale.
  coverage: Every study and every label; the largest gaps to the ResNet-50 are Lateral
    OA, Fracture, PF OA, ACL and Lateral Meniscus (prior-work.md).
  exploitation: 'Read x4 and x1 against the incumbent, the training loss per epoch
    against the reference''s (0.934 falling to 0.593), and the labels from largest
    gain to largest loss. Activation: one logged learning rate per backbone stage
    in the ratio 0.1296 : 0.216 : 0.36 : 0.6 : 1 (five metrics), and the last stage''s
    drift at the last epoch above 0.03 (0.0036 in the reference). Shown wrong by:
    drift up and both multipliers below the incumbent, or a training loss that diverges
    in the warm-up.'
  budget: The reference's training time (2,594 s) within 1.05; no change to memory
    (12.7 GB peak).
  implementation: 'Follow the environment paragraph of the developer instructions.
    Files: src/knee_abnormality/config.py (the field, default 1.0), src/knee_abnormality/training/lightning.py
    (build_optimizer groups by stage through the backbone''s group_matcher, already
