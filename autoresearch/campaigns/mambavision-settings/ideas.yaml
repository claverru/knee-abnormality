  mechanism_id: weight-anchor
  parent_idea_id: late-anchor-follows-learning-rate
  title: The late anchor scaled by the backbone rate over its peak, on the linear-decay
    incumbent
  opportunity: 'Evidence (run-notes.md, runs 9 and 10): run 9 scaled the late anchor
    by the backbone rate over its peak on the twelve-epoch cosine incumbent and passed
    both multipliers (x4 +0.001447, 80% interval [+0.000462, +0.002492]; x1 +0.000054).
    The runtime adopted it; the keeper took it back out under a generalisation rule
    that the user has since scoped to RadImageNet-weight models only, so it does not
    apply here. Meanwhile run 10 (linear decay) was adopted on the cosine incumbent.
    The two changes were never combined. In run 5 the last stage''s drift retreated
    from 0.0382 to 0.0369 over the last five epochs while the anchor penalty stayed
    near 0.0101; under linear decay the rate stays higher for longer, so the scheduled
    anchor weakens later. Guess: +0.0005 to +0.0015 macro at x4, on Fracture and Lateral
    OA first (the two labels furthest from the ResNet-50 in run 10, -0.0139 and -0.0135).'
  mechanism: 'Run 9''s mechanism, ported onto the linear-decay incumbent: the late
