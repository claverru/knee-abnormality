- id: fractional-canvases-at-half-storage
  mechanism_id: continuous-preaugmentation-intensity-preservation
  parent_idea_id: null
  title: Preserve fractional canvas intensities with half storage and activation after
    gathering
  opportunity: 'Source measurement: device preparation rounds normalized values to
    uint8, then ViewWindows converts them back to float before its pose warp. The
    current macro curve flattens late despite falling loss. Hypothesis: early rounding
    removes weak acquired intensity differences. Historical continuous-normalization
    attempts were parked because their activation could pass before gathering even
    if consumed images were rounded; no valid AUC outcome was established.'
