- id: posed-bicubic-with-local-intensity-bounds
  mechanism_id: local-intensity-range
  parent_idea_id: null
  title: Limit posed bicubic interpolation to the local acquired intensity range
  opportunity: "Source evidence: the posed reader uses bicubic interpolation followed\
    \ by a global 0\u2013255 clamp. Bicubic interpolation can overshoot its contributing\
    \ values; global clipping still permits extrema outside a local tissue neighborhood.\
    \ The incumbent's late loss falls from 0.5145 to 0.5092 while \xD71 macro peaks\
    \ then declines. Hypothesis: interpolation-created bright or dark extrema distort\
    \ subtle acquired edges. Their frequency and predictive effect have not been measured."
  mechanism: "Keep the existing posed bicubic grid and kernel. For an output whose\
    \ complete 4\xD74 contributing stencil lies inside acquired support, bound its\
    \ interpolated value by that stencil's minimum and maximum, then retain the existing\
    \ global intensity clamp. Leave partially supported stencils under the existing\
    \ boundary behavior so this run isolates interior range preservation. The 4\xD7\
    4 neighborhood follows the bicubic kernel, not a validation-selected size. Compute\
    \ local bounds with bounded gathers rather than materializing a full sixteen-tap\
    \ image tensor."
  precedents:
  - '[Current posed warp](/home/claudio/src/knee-abnormality/outputs/autoresearch/rn50-input-sampling/experiments/thirty-five-distinct-slices-20261012T040950Z-efaa20b4/source/src/knee_abnormality/modeling/model.py:458)
    uses bicubic sampling and a global clamp.'
  - '[PyTorch grid_sample documentation](https://docs.pytorch.org/docs/2.14/generated/torch.nn.functional.grid_sample.html)
    explicitly describes bicubic overshoot. This supports the numerical opportunity,
    not a knee-AUC benefit.'
  - '[Fritsch and Carlson, 1980](https://doi.org/10.1137/0717021) establishes shape-preserving
    cubic interpolation as a numerical precedent. The proposed local range limiter
    is simpler and does not claim their monotonicity guarantees.'
  - Fractional canvases were retired for host-memory growth; boundary support normalization
    remains proposed. This mechanism retains uint8 host storage and acts on fully
    supported interior interpolation.
  novelty: Corrects local extrema introduced by the posed input interpolation. It
    changes neither sampling phase nor resolution, performs no sharpening or magnification,
    and differs from fractional storage and boundary-weight normalization.
  coverage: Fully supported posed interpolation stencils across all series types.
    It preserves the first look, acquired-support boundaries, crop geometry and subsequent
    augmentation probabilities. No labels receive special handling.
  exploitation: Log val_pose_local_range_violation_pixel_share, val_pose_local_range_correction_abs_change
    and val_pose_local_range_corrected_encoded_image_share. Count changes relative
    to the existing globally clipped output on valid interior pixels actually consumed
    by the backbone. Positive executed correction proves activation; an unused intermediate
    overshoot count cannot pass.
  budget: "Ten epochs at the current incumbent seed, nominally 42 training/168 \xD7\
    4 inputs. Planning estimates from the 2,989.8 s incumbent: 3,140\u20133,350 s\
    \ training and 18.6\u201319.0 GB GPU allocation. Retain uint8 loader buffers;\
    \ estimated \xD74 RAM headroom stays near the recorded 2.6 GB. Local gathers are\
    \ required input computation. Avoid a full sixteen-tap tensor, extra backbone\
    \ evaluation and training-step diagnostics. Runtime remains uncertain until the\
    \ scheduled run."
  implementation: Follow the environment paragraph of the developer instructions.
    Add local acquired-range limiting to the existing posed warp in modeling/model.py.
    Retain the bicubic output and global clamp, replacing global-only handling on
    fully supported stencils with the local bound. Reuse acquired rectangles and executed
    grid coordinates; preserve partially supported boundary handling. Add the three
    named validation metrics in training/lightning.py and update modeling/spatial_tokens.py
    input identity. Retain normalization, aligned mixing, distinct-slice allocation,
    pose, fields, backbone and readout. Add no strength or legacy selector. Preserve
    newly accepted placement or channel behavior and apply bounds separately to each
    consumed channel.
  open_choices: Local bounding may remove useful subpixel contrast as well as artificial
    extrema. It guarantees a range bound, not monotonicity or recovery of native signal.
    Activation prevalence is unknown. Use float32 bounds and output arithmetic and
    keep the existing loader storage; numerical tolerances must follow arithmetic
    precision rather than validation scores.
