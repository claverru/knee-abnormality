- id: posed-resampling-with-acquired-support
  mechanism_id: pose-support
  parent_idea_id: null
  title: Normalize posed interpolation by its acquired pixel support
  opportunity: "Source evidence: native resampling renormalizes available filter taps,\
    \ but the subsequent posed bicubic warp samples a zero-padded canvas. The incumbent\
    \ logs pose-limit fractions around 0.14\u20130.15 late in training; this is not\
    \ a measurement of missing interpolation support. Hypothesis: partial interpolation\
    \ footprints can alter valid boundary intensities, particularly in axial fields\
    \ whose posterior coverage is already limited."
  mechanism: Construct support from the existing acquired valid rectangles. Warp intensity
    and support with the same posed bicubic grid, and normalize the intensity sum
    by the retained support sum for geometrically covered output centres with partial
    kernel support. Keep uncovered pixels zero and retain the existing intensity clamp.
    This corrects how acquired pixels are resampled; it neither extrapolates anatomy
    nor changes fields, offsets, pose limits, augmentation probabilities or token/readout
    structure.
  precedents:
  - "Incumbent preprocessing/spatial.py:42\u201367 renormalizes available native interpolation\
    \ taps; model.py:445\u2013477 uses zero-padded posed bicubic sampling without\
    \ that normalization."
  - 'prior_work: more than 10 mm of posterior tissue was excluded in 42% of axial
    fluid series at 120 mm. This motivates examining support but does not establish
    the interpolation effect.'
  - The official [SimpleITK resampling documentation](https://simpleitk.readthedocs.io/en/master/fundamentalConcepts.html#resampling)
    describes physical grids and constant values outside source extent. Predictive
    benefit from support normalization is a hypothesis.
  novelty: "Addresses interpolation at acquired boundaries rather than changing crop\
