- id: posed-crops-projected-into-acquired-support
  mechanism_id: crop-support-projection
  parent_idea_id: null
  title: Project posed crop translations into each slice's acquired support
  opportunity: "Source evidence: frame_pose clamps translation to fixed shift limits,\
    \ while the later warp applies rotation and scale against acquired rectangles.\
    \ Those limits do not ensure that the rotated crop lies inside acquired support.\
    \ Measured incumbent diagnostics show late pose-limit fractions around 0.14\u2013\
    0.15 and axial-fluid view macro near 0.838; neither measures corner overflow.\
    \ Hypothesis: avoidable sampling outside acquired support removes useful tissue\
    \ and contributes to the late plateau."
  mechanism: After existing pose estimation and training jitter, transform the four
    output corners using the existing angle and scale. Derive per-axis translation
    intervals that keep their bounding box inside the middle slice's acquired rectangle,
    intersected with the current shift limits. Project the requested integer translation
    to the closest feasible integer translation. When complete containment is impossible,
    choose the bounded integer translation minimizing maximum corner overflow, with
    proximity to the requested pose breaking ties. Keep angle, scale, field and image
    size unchanged. This changes placement using each knee's acquired support; it
    introduces no measured constant offset or learned locator.
  precedents:
