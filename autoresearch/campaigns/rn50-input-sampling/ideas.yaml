    \ but store normalized and gathered canvases as float16 without integer rounding.\
    \ Both preparation paths must deliver fractional values to the actual reader input.\
    \ Float16\u2019s largest step below 256 is 0.125, versus the incumbent\u2019s\
    \ integer step of 1; this limits storage to twice uint8 rather than the historical\
    \ float32 proposal\u2019s fourfold storage. This is a resource-bounded retry with\
    \ corrected consumed-input activation."
