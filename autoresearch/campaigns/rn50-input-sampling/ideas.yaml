- id: centred-token-grid-by-last-stage-phase
  mechanism_id: token-grid
  parent_idea_id: null
  title: Centre the 7 by 7 token grid in the 224 px crop by shifting the last stage's
    sampling phase
  opportunity: 'The user''s seed (2026-10-11). At 224 px the tokens of the last stage
    are centred at pixels 0, 32, ..., 192: 15.5 px up and left of the crop centre
    where the knee is placed (5.8 mm on the 84 mm views, 6.5 on the 93 mm, 8.3 on
    the 120 mm), with a token on the left and top borders and none within 31 px of
    the right and bottom. Left and right knees are read differently (MCL puts 58 to
    61% of its coronal medial-edge attention for one image side and 21 to 22% for
    the other, 3,517 studies), and border tokens are valid 60% of the time in training
    and always at prediction. Centring the grid by a larger image was level on the
    ResNet-18 (257 px: -0.0004 and -0.0005 at x4 at 1.2 of the time). The same centring
    is available at 224 px with no extra compute: the third stage has 14 positions
    at 0, 16, ..., 208, and keeping the odd ones puts the tokens at 16, 48, ..., 208,
    with 16 and 15 px of margin. Never tried on either backbone. Guess, low-medium:
    +0 to +0.001 macro, MCL and the side-dependent labels first.'
  mechanism: 'In the first block of the backbone''s last stage (a bottleneck in resnet50.a1_in1k:
    3 by 3 convolution with stride 2 and padding 1; shortcut 1 by 1 convolution with
    stride 2) the stride-2 sampling starts at the second position instead of the first.
    The 3 by 3 convolution runs with padding 0 on its input padded by (0, 2) on the
    right and bottom, so output i covers inputs 2i to 2i+2 and is centred at 2i+1;
    the shortcut convolution reads its input from the second row and column on. Pretrained
    weights are loaded unchanged. The last-stage spatial mapping becomes origin 16
    px, stride 32 px, and every consumer of token positions (validity, patient positions,
    regions, the bone map on the tokens and its targets, the copy of maps between
    the 14 by 14 cells and the 7 by 7 tokens) follows that mapping: token k now sits
    over cells 2k+1 and 2k+2 minus half a cell, so the cell-to-token pooling of the
    maps and of the routing takes the 2 by 2 block of cells (2k, 2k+1) to (2k+1, 2k+2)
    centred on the token, edge blocks clipped. The third stage and its 14 by 14 cells
    are unchanged.'
  precedents:
  - 'docs/validation/results/2026-10-08-token-grid-alignment.md: the grid at 224 px
    and the 225 and 257 px runs.'
  - prior-work.md, The token grid at 224 px.
  novelty: First centred grid at 224 px; no change of image size or compute.
  coverage: Every image; all labels.
  exploitation: 'Read the macro, MCL and the eight larger labels against the incumbent
    at both multipliers. Log on validation only: the share of tokens that are valid
    in the first and in the last row and column (two metrics; equal after the change),
    and the mean distance in mm between the grid centre and the posed knee centre
    (one metric, near zero after the change). Shown wrong by: those diagnostics unchanged,
    or the macro below the incumbent at both multipliers.'
  budget: 'The reference''s training time: the same number of tokens and convolutions.'
  implementation: 'Follow the environment paragraph of the developer instructions.
    Files: modeling/model.py (the backbone wrapper and every use of the last-stage
    mapping), modeling/spatial_tokens.py (BACKBONE_MAPPINGS and the cell-to-token
    relations, identity strings), training/anatomy.py and training/lightning.py only
    where they assume origin 0. Do not edit the timm model class: wrap the first block
    of the last stage. No option. Report on synthetic inputs that an impulse at pixel
    (112, 112) peaks at the central token, that the output is 7 by 7, and that the
    centres are 16 + 32k. Apply to the incumbent as assigned.'
  open_choices: None.
  dependencies: []
  priority_rationale: The user's seed; fixes the offset and the uneven borders at
