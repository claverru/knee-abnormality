- id: contrast-mixing-with-acquisition-depth-support
  mechanism_id: contrast-mixing
  parent_idea_id: aligned-contrast-mixing
  title: Restrict aligned contrast mixing to overlapping acquired depth support
  opportunity: 'Measured: aligned mixing gained 0.000985 at x1 but lost 0.000301 at
    x4, despite persistent alignment activity near 0.024. Its supplied active status
    is retained. Source diagnosis: donor matching minimizes depth distance without
    limiting that distance; in-plane alignment projects away the remaining normal
    displacement. Hypothesis: sparse picks can therefore blend different anatomy,
    especially when acquired steps are much smaller than sampled gaps.'
  mechanism: "Derive each donor middle slice\u2019s depth cell from the midplanes\
    \ to its two decoded neighbours. During the existing alignment, compute where\
    \ target patient coordinates lie relative to that donor cell. Apply donor contribution\
    \ only where acquired depth support and existing in-plane support overlap; elsewhere\
    \ retain the target. Keep probability, direction and lambda draws unchanged. This\
    \ replaces unconditional projection of the nearest selected donor with a physical\
    \ support restriction, without inventing interpolated slices or adding a hand-set\
    \ distance threshold."
  precedents:
  - "aligned-contrast-mixing: \u0394x1 +0.000985, \u0394x4 \u22120.000301; central\
    \ 80% x4 interval [\u22120.001063, 0.000442]. Activation was observed and training\
    \ took 2660.5 s."
  - "Incumbent modeling/augmentation.py:235\u2013318: nearest-depth matching has no\
    \ overlap restriction, followed by patient-coordinate in-plane resampling."
  - "Incumbent dataset.py:551\u2013615 retains patient maps for all three decoded\
    \ records. Existing sampling support already uses neighbour midplanes."
  - "prior_work: acquired steps 3.3\u20134.0 mm versus approximately 18 mm between\
    \ training picks; ResNet-18 aligned and feathered variants did not establish a\
    \ transferable benefit."
  novelty: Fixes through-plane correspondence left unresolved by the accepted in-plane
    alignment. The restriction depends on actual acquisition geometry, rather than
    changing mixing probability or donor strength.
  coverage: All eligible same-plane contrast pairs. The original target survives wherever
    correspondence cannot be established; evaluation remains unmixed.
  exploitation: Reuse existing contrast_mixing_effective_probability, contrast_mixing_pixel_change
    and contrast_mixing_alignment_change. Add validation-only geometric summaries
    val_contrast_depth_nonoverlap_share and val_contrast_supported_pair_share from
