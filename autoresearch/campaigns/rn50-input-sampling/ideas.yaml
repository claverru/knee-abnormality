- id: aligned-contrast-mixing
  mechanism_id: contrast-mixing
  parent_idea_id: null
  title: Align the donor contrast to the target before contrast mixing blends them
  opportunity: 'The user''s seed (2026-10-11): a known bug whose fix never paid on
    the ResNet-18 and has never been tried on the ResNet-50. Contrast mixing (probability
    0.3) blends the two contrasts of a plane pixel for pixel although the two series
    lie on different grids. On the ResNet-18 the aligned donor scored -0.0008 at x4
    and the aligned and feathered blend -0.0011 (fixes-and-removals, F02, 2026-10-05);
    the mixing itself is worth keeping (off: -0.0025). The changes that reached the
    ResNet-50 are the ones that make the input more faithful or more informative (prior-work.md);
    a blend of two misregistered images is an unfaithful input the larger backbone
    may be able to exploit less or be hurt by more. Guess, low-medium: +0 to +0.001
    macro.'
  mechanism: 'In contrast mixing the donor image is resampled onto the target image''s
    grid in patient coordinates before the blend, as the reviewed candidate contrast-mixing-aligned-donor-requeue
    did: the donor slice nearest in position to the target slice is taken, mapped
    through the two series'' patient transforms onto the target''s pixel grid, and
    pixels the donor does not cover keep the target''s value. Probability, weight
    range and eligibility are unchanged. The 64 mm detail view stays outside contrast
    mixing as in the incumbent.'
  precedents:
  - 'fixes-and-removals, F02: outputs/autoresearch/fixes-and-removals/experiments/contrast-mixing-aligned-donor-requeue-20261005T130844Z-22da8214
    (source and changes.diff); the posed crops of 2026-10-07 changed the pair''s geometry
    since, so port the mechanism onto the current augmentation code, do not copy the
    file.'
  novelty: First run of the aligned donor on the ResNet-50 and on the posed-crop recipe.
  coverage: Every study with both contrasts of a plane; all labels.
  exploitation: 'Read the macro and the eight larger labels against the incumbent
    at both multipliers and on the x1 mean of epochs 6 to 10. Activation: the existing
    training metric of contrast-mixing activity stays as it is, plus one training-side
    scalar already computed by the mechanism, the mean absolute difference between
    the aligned and the unaligned donor on mixed images, logged through the epoch-metric
    path (one metric). Shown wrong by: the macro below the incumbent at both multipliers
    with the eight larger labels down as a group.'
  budget: 'Within 1.03 of the reference''s training time: one resampling of the donor
    on the GPU for 30% of the eligible images.'
  implementation: 'Follow the environment paragraph of the developer instructions.
    Files: modeling/augmentation.py, modeling/model.py where the mixing is called,
    modeling/spatial_tokens.py for the identity string. Keep the resampling on the
    GPU inside the existing augmentation pass, with no host synchronisation. No option:
    the unaligned blend is removed. Report on two studies that a donor aligned to
    itself reproduces the image and that the blend weight is unchanged. Apply to the
    incumbent as assigned.'
