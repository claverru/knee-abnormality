  opportunity: 'The user''s order (2026-10-11): both the third-stage cells and the
    fourth-stage tokens must be centred. Verified numerically on the backbone: at
    224 px the cells sit at 0 to 208 px (7.5 px off the crop centre) and the tokens
    at 0 to 192 (15.5 px off), and no shift of sampling phase centres both, because
    a token always sits on a cell. At 225 px the stock backbone gives 15 by 15 cells
    at 0, 16, ..., 224 and 8 by 8 tokens at 0, 32, ..., 224: both centred on pixel
    112, token k on cell 2k, at about 1.01 of the pixels (257 px does the same at
    1.32). A review of the 257 px candidate found the copies between the two grids
    half a cell (8 px, 2.3 to 4.3 mm) off and not mirror-symmetric, inherited from
    the 224 px recipe: tokens to cells by repetition (cell j takes token j//2) and
    cells to tokens by a 2 by 2 mean of cells 2k and 2k+1. Precedent: 225 px on the
    ResNet-18 lost 0.0024 for a cause not established, with those inherited copies.
    Guess, low-medium: +0 to +0.001 macro.'
