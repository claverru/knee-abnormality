    Gaussian strata and supplier rules, excluding the reserved groups. Endpoints come
    from acquired geometry, not validation labels or hand-set distances. Preserve
    maximum-cardinality selection, gap handling, decoding repair, availability redistribution
    and deterministic evaluation. Pools with fewer than two groups retain every available
