  opportunity: 'The user''s seed (2026-10-11): the second known bug whose fix did
    not pay on the ResNet-18, untried on the ResNet-50. A symmetric grid exists at
    image sizes of 32k + 1. On the ResNet-18 two 257 px runs with the pixel sizes
    kept matched the 224 px recipe (9 by 9 tokens -0.0004, inner 7 by 7 -0.0005 at
    x4; both 0.954 public against 0.954) at 1.2 of the training time; 225 px lost
    0.0024 for a reason not established. At 257 px with the pixel sizes kept each
    view also shows 15% more field per side, which is acquired anatomy the crops cut
    today (prior-work.md: crops hold 28 to 34% of the stored field in coronal and
    sagittal). Guess, low-medium: +0 to +0.0015 macro on the ResNet-50.'
  mechanism: 'data.image_size 257 with every view''s mm per pixel unchanged (each
    field_mm multiplied by 257/224, reference_field_mm likewise), 9 by 9 tokens of
    the last stage all counted and 17 by 17 cells of the third stage, as the run rn18-257-full-9x9-report-loss-off
    did. Canvas and margins follow the image size by the recipe''s own rule. Nothing
    else changes. The copies between the two grids are exact for token k on cell 2k,
    as the user ordered on 2026-10-11 after a review found the first candidate''s
    copies half a cell (8 px) off and not mirror-symmetric: tokens to cells by bilinear
    interpolation with aligned corners, cells to tokens by weights 1/4, 1/2, 1/4 per
    axis on cells 2k-1, 2k, 2k+1 renormalised at the borders (functions tokens_to_cells
    and cells_to_tokens of exact-grid-transfers-257.diff in the campaign directory,
