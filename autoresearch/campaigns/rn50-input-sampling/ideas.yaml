  mechanism_id: learning-rate-schedule
  parent_idea_id: null
  title: Restart the cosine learning-rate schedule twice within the ten epochs
  opportunity: 'The user''s order (2026-10-11): let the learning rate go up and down
    so the training can leave the optimum it settled in and find a better one. The
    recipe has one warm-up epoch from 0.1 of the peak and then a single cosine decay
    over epochs 2 to 10 down to 0.01 of the peak; the rate never rises again. Never
    tried in this project on either backbone. The validation macro at x1 of the reference
    and of the three runs since still rises through epoch 10 (0.9257, 0.9268, 0.9273
    for the reference''s last three epochs), so the single decay has not flattened;
    whether a restart helps is a guess, low-medium confidence, within +-0.001 macro.'
  mechanism: 'The schedule multiplier of training/lightning.py keeps the first epoch''s
    linear warm-up from optimizer.warmup_start_ratio to 1 and then runs three cosine
    cycles of three epochs each (epochs 2 to 4, 5 to 7, 8 to 10). Each cycle decays
    from its peak to optimizer.minimum_lr_ratio; the peaks are 1, 0.5 and 0.25 of
    the configured rates, so each restart is half the previous one and the last cycle
    ends the training at the same floor as today. The backbone and head rates, weight
    decay, the anchor (L2-SP) weights and the ten epochs are unchanged; the single
    cosine decay is removed. The two constants, cycle length 3 epochs and peak ratio
    0.5, are module constants beside the schedule: (10 - 1 warm-up) epochs divide
    into three equal cycles, and halving is the conventional decayed restart.'
