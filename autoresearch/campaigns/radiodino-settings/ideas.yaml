    1 projection to 384 channels. Add this residual before the existing position embedding.\
    \ The branch produces a 14\xD714 grid with stride 16 and center origin 7.5 pixels,\
    \ matching the original projection. Widths follow the small convolutional-stem\
    \ precedent; 4\xD74 kernels are a geometry-derived adaptation. Log residual/input\
    \ RMS and output-projection RMS, both initially zero."
