- id: feature-statistics-before-position-embedding
  mechanism_id: feature-statistics
  parent_idea_id: null
  title: Feature-statistics augmentation on the patch projection before the position
    embedding, not on the residual stream after block 3
  opportunity: 'Evidence (prior-work.md, The adapter): on the CNNs and MambaVision-T
    the augmentation mixes per-channel mean and spread of convolution features after
    BatchNorm, which carry image style. In RadioDINO it acts on the pre-norm residual
    stream after block 3, which also holds the learned absolute position embedding
    (RMS 0.14, the largest tensor in the model): every image carries the same position
    code, so rescaling a channel''s spread across tokens rescales the position code
    with it. The patch projection before the position embedding is the model''s only
    local, low-level layer, the ViT''s counterpart of the CNN stem''s style features.
    Evidence for keeping the augmentation: MambaVision settings, feature-statistics-augmentation-off,
    x4 -0.0011. Guess on size: +0.001 to +0.003 macro.'
  mechanism: The adapter's stride-8 point becomes the patch projection's output before
    the position embedding is added; the position embedding is added at the start
    of the blocks, and all twelve blocks run after the augmentation. The augmentation's
    settings are unchanged (probability 0.5).
  precedents:
  - 'MambaVision settings, feature-statistics-augmentation-off: x4 -0.0011, x1 -0.0013.'
  - 'MambaVision settings, feature-statistics-after-first-epoch: x4 -0.0003, x1 -0.0023.'
  novelty: First placement of the augmentation chosen for a model with a position
    code in its features.
  coverage: Every study and every label; style shift between sites is the target.
  exploitation: 'Read x4 and x1 against the incumbent and the labels from largest
    gain to largest loss. Activation: the logged mean absolute change of the augmented
    features is nonzero and differs from the incumbent''s, and a synthetic check shows
    the position embedding unchanged by the augmentation. Shown wrong by: both multipliers
    below the incumbent.'
  budget: The incumbent's training time within 1.02; no change to memory.
  implementation: 'File: src/knee_abnormality/modeling/staged_backbones.py. For the
    vision transformer only: the stem returns the patch projection, the position embedding
    is added at the start of the first block stage, and the stages are arranged so
    that to_stride_8 returns the projection and deep runs all twelve blocks, the middle
    read still after block 8 and the final read unchanged. Every parameter keeps its
    name prefix, rate group and anchor group: the position embedding stays in the
    early anchor. MambaVision-T unchanged. Verify on CPU that with the augmentation
    off the backbone''s outputs equal the incumbent''s exactly.'
  open_choices: None.
  dependencies: []
  priority_rationale: A concrete fault of the inherited placement on this architecture,
    cheap to fix.
  status: completed
