- id: spatial-prior-direct-zero-projection
  mechanism_id: adapter-spatial-prior
  parent_idea_id: convolutional-spatial-prior-frozen-branch
  title: Inject the frozen spatial prior through zero-initialized projections without
    multiplicative gates
  opportunity: "Measured: the completed frozen layer1 prior narrowly missed adoption:\
    \ \u0394\xD71 \u22120.000318, \u0394\xD74 \u22120.000144. All four gates moved,\
    \ but their small magnitudes do not establish useful residual energy. Source inspection\
    \ identifies a potentially restrictive parameterization: a random projection multiplied\
    \ by a zero-start gate, with the projection also anchored to its initialization.\
    \ Hypothesis: a directly trained zero projection can expose the same local information\
    \ more effectively within twelve epochs. The working expectation is a macro gain\
    \ around 0.0005 at both multipliers, with substantial uncertainty."
  mechanism: Reuse the budget-compliant frozen ResNet stem-through-layer1 feature
    extractor, its trainable downsampling convolution and LayerNorm, and its four
    injection positions. Replace each random Linear plus channelwise gamma with one
    bias-free Linear(384,384), initialized entirely to zero, and add its output directly
    to the token stream. This preserves the initial RadioDINO function while changing
    how the residual learns, rather than changing gate strength. Retain existing rates,
    warm-up and anchor rules. Log four injection-to-input RMS ratios and one aggregate
    projection-weight RMS; the ratios start at zero and directly measure the mechanism's
    realized contribution.
  precedents:
