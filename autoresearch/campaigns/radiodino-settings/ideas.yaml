- id: anchors-by-weight-scale
  mechanism_id: anchors
  parent_idea_id: null
  title: Both anchors twice as strong, 0.002 early and 0.00002 late, for weights 0.6
    to 0.8 times MambaVision-T's RMS
  opportunity: 'Evidence (prior-work.md, Weight scale; MambaVision settings, anchors-by-weight-scale,
    x4 +0.0101): the anchor penalises the squared absolute distance from the pretrained
    weights, so the cost of one relative movement scales with the weight RMS squared.
    MambaVision''s anchors (0.001, 0.00001) were cut tenfold and a hundredfold from
    the ResNet-50''s for weights 1.5 to 12.7 times larger. RadioDINO''s weights are
    0.82 (stem) and 0.59 to 0.75 (blocks) of MambaVision-T''s, so the same relative
    movement costs 0.35 to 0.67 as much under the inherited strengths. Twice the strengths
    restore MambaVision''s cost per relative movement. The pretraining argues the
    same way: RadImageNet features start in the target''s domain and the anchors are
    the site-generalisation device. Guess on size: +0.001 to +0.003 macro.'
  mechanism: optimizer.anchor_alpha_early 0.002, optimizer.anchor_alpha_late 0.00002.
    The late anchor keeps following the rate. Nothing else changes.
  precedents:
  - 'MambaVision settings, anchors-by-weight-scale: 0.001 and 0.00001 against 0.01
    and 0.0001, x4 +0.0101, the campaign''s largest gain.'
  - 'MambaVision settings, anchors-per-stage-by-weight-scale: rejected (x4 -0.0007,
    x1 +0.0022).'
  novelty: First anchor strength set for this model's weight scale.
  coverage: Every study and every label.
  exploitation: 'Read x4 and x1 against the incumbent, the training loss per epoch
    (expected slightly higher), the logged anchor penalty and drift per stage (expected:
    drift down by up to a factor of two), and the labels from largest gain to largest
    loss. Activation: the recorded effective config and an anchor penalty per epoch
    above the incumbent''s. Shown wrong by: both multipliers below the incumbent with
    the training loss up.'
  budget: The incumbent's training time within 1.02; no change to memory.
  implementation: 'Configuration only: configs/campaign.yaml.'
  open_choices: None.
  dependencies: []
  priority_rationale: The setting that moved MambaVision-T most, rescaled by the measured
