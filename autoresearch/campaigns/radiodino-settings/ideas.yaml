- id: top-down-backbone-warm-up
  mechanism_id: backbone-rate-schedule
  parent_idea_id: null
  title: 'Each backbone stage group warms up one epoch later than the group above
    it: seed 2''s slow lower blocks early, the incumbent''s rates after'
  opportunity: 'Evidence (seed 2): with the lower blocks slow, the lead over seed
    1 was largest early (+0.011 epoch 1) and narrowed after epoch 6, and the bone
    labels lost; seed 2 kept the lower blocks slow all twelve epochs. Evidence (Howard
    and Ruder 2018, ULMFiT): gradual unfreezing from the top, one layer group per
    epoch, beats fine-tuning all layers at once. A linear warm-up from 0.1 averages
    0.55 of peak and the linear decay 0.505, so a later peak keeps each group''s total
    rate within 3% of the incumbent''s (stem 6.29 against 6.11 epoch-equivalents):
    only the timing moves. Guess: the early lead comes from slow lower blocks, the
    bone loss from their low total. Guess on size: +0.001 to +0.002 macro.'
  mechanism: 'A new optimizer.backbone_warmup_epochs_per_stage (1). A backbone group
    at stage depth d (final norm 0, blocks 9 to 12 1, blocks 4 to 8 2, blocks 2 and
    3 3, block 1 4, stem 5) warms up from warmup_start_ratio over warmup_epochs +
    max(d - 1, 0) x this value epochs, then decays linearly to minimum_lr_ratio at
    the last step: norm and blocks 9 to 12 peak at epoch 1 as now, blocks 4 to 8 at
    2, blocks 2 and 3 at 3, block 1 at 4, stem at 5. Peak rates 2e-4 everywhere; heads
    unchanged. Each late-anchored weight follows its own group''s multiplier.'
  precedents:
