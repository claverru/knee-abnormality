- id: layer-rate-decay-from-radimagenet-profile
  mechanism_id: backbone-rate
  parent_idea_id: null
  title: 'Rates falling with depth, 4e-4 on the last block and 0.85 per block towards
    the patch stem: the RadImageNet ResNet-50''s relative-step profile on a model
    whose weights do not shrink with depth'
  opportunity: 'Evidence (prior-work.md, Weight scale): Adam moves each weight by
    about the rate per step, so the relative step is the rate over the weight RMS.
    The RadImageNet ResNet-50 at its one rate of 5e-5 has relative steps rising 8.5
    times from stem to last stage (8e-4 to 6.8e-3) because its weights shrink with
    depth (0.062 to 0.0073). MambaVision-T at 2e-4 is flat (2.2e-3 to 2.6e-3). RadioDINO''s
    weights are also flat over depth (0.049 to 0.063, stem 0.075), so one rate gives
    every block about the same relative step (2.7e-3 to 4.1e-3 at 2e-4): its first
    blocks move more than the ResNet-50''s first stages, its last blocks half as much
    as the ResNet-50''s last stage. Twelve equal blocks of global attention make a
    flat rate a choice, not a consequence of the architecture. Evidence: ViT fine-tuning
    recipes decay the rate per block (BEiT and MAE: 0.65 for ViT-B, 0.75 for ViT-L);
    their values serve masked-image pretraining, whose top blocks need more change.
    Guess on size: +0.002 to +0.006 macro.'
  mechanism: 'A new optimizer.backbone_lr_layer_decay (0.85). Each backbone parameter''s
    rate is backbone_lr times the decay to the power of the number of transformer
    blocks above it: block 12 and the final norm at backbone_lr, block 11 at 0.85,
    block 1 at 0.85^11, the patch stem and position embedding at 0.85^12. optimizer.backbone_lr
    4e-4. So the last block''s relative step is the ResNet-50 last stage''s (4e-4
    / 0.063 = 6.3e-3 against 6.8e-3), block 9 keeps the incumbent''s 2.5e-4 and the
    stem gets 5.7e-5, the ResNet-50 stem''s relative step (7.6e-4 against 8e-4). Warm-up
    and decay scale every group alike; head rate unchanged.'
  precedents:
  - 'MambaVision settings, stage-rates-by-weight-scale: 6e-4 on the last stage, 0.6
    per stage, rejected (x4 -0.0028). That model''s weights were 1.5 to 12.7 times
    the ResNet-50''s and it underfit; the decay there undid a flat weight-scale profile
    in the opposite direction from this one.'
  - 'MambaVision settings, backbone-rate-4e-4: level with 2e-4 (x4 +0.0004).'
  novelty: First rate profile over depth on a ViT here; the existing backbone_lr_stage_decay
    acts per stage group, four groups for twelve blocks.
  coverage: Every study and every label.
  exploitation: 'Read x4 and x1 against the incumbent, the training loss per epoch,
    the drift per stage against the incumbent''s (expected: last stage up, stem and
    first stage down), and the labels from largest gain to largest loss. Activation:
    the logged rate of the stem group and of the last stage at their configured ratio
    0.85^12 : 1 (0.142). Shown wrong by: both multipliers below the incumbent with
    the last stage''s drift up.'
  budget: The incumbent's training time within 1.02; no change to memory.
  implementation: 'Files: src/knee_abnormality/config.py (the field, default 1.0,
    gt 0, le 1), src/knee_abnormality/modeling/staged_backbones.py (each staged backbone
    reports a parameter''s block depth: the patch stem 0, block k of the transformer
    k, the final norm the deepest; the MambaVision path needs no depth because its
    decay stays 1.0), src/knee_abnormality/training/lightning.py (build_optimizer
    multiplies each backbone rate by decay to the power of the blocks above the parameter,
    on top of the existing stage decay), configs/campaign.yaml (backbone_lr 0.0004,
    backbone_lr_layer_decay 0.85). With 1.0 the optimizer must be identical to the
    incumbent''s. The anchors and their schedule are unchanged.'
  open_choices: None.
  dependencies: []
  priority_rationale: The largest difference in how the two models respond to one
    rate, set from the RadImageNet model whose recipe is the reference for this domain.
  status: completed
