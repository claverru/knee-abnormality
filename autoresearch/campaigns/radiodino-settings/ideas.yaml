- id: blockwise-top-down-warm-up
  mechanism_id: backbone-rate-schedule
  parent_idea_id: top-down-backbone-warm-up
  title: Distribute the successful top-down warm-up over physical transformer blocks
  opportunity: 'Measured: the incumbent protects the stem early, while its final blocks
    adapt immediately. Its stem drift rises through epoch 5 and then retreats; validation
    continues improving through epoch 11. RadioDINO has twelve equal transformer blocks,
    but the current timing assigns them to uneven groups of 1, 2, 5 and 4 blocks.
    Hypothesis: smoothing those timing boundaries can preserve early protection while
    improving intermediate-block adaptation. A working expectation is approximately
    +0.0005 macro AUC at both multipliers; this is a hypothesis, not an additional
    acceptance condition.'
  mechanism: "Replace coarse stage warm-up durations with a linear distribution over\
    \ physical depth. For depth d=0 at the patch stem and d=1\u202612 at transformer\
    \ blocks, use warm-up duration 1+4(12-d)/12 epochs. Thus the stem retains five\
    \ epochs, block 6 uses three, and block 12 retains one. Retain the incumbent peak\
    \ rates, warm-up start ratio, linear decay to the same final step, and each parameter's\
    \ own late-anchor rate multiplier. The endpoint durations come directly from the\
    \ adopted run; intermediate durations interpolate those endpoints without consulting\
    \ validation labels."
