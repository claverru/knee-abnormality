- id: backbone-held-for-the-head-epoch
  mechanism_id: backbone-rate-schedule
  parent_idea_id: null
  title: 'Backbone rate zero in the first epoch while the new heads fit, then its
    warm-up and linear decay: linear probing then fine-tuning'
  opportunity: 'Evidence (seed 1 metrics.csv): 38% of the final drift of blocks 4
    to 12 happens in epoch 1 (0.050 of 0.130 for blocks 4 to 8, 0.048 of 0.127 for
    blocks 9 to 12), while the heads are freshly initialised (train loss 0.724 against
    0.507 at the end). Evidence (Kumar et al., ICLR 2022, LP-FT): gradients through
    a random head distort pretrained features; fitting the head first and then fine-tuning
    everything keeps them and gains most out of distribution, the site-generalisation
    purpose here. RadImageNet DINO features start in the target domain, so they have
    more to lose than ImageNet features (guess). Guess on size: +0.001 to +0.003 macro.'
  mechanism: 'A new optimizer.backbone_frozen_epochs (1). Backbone groups get rate
    multiplier 0 for the first epoch, then the incumbent''s warm-up (one epoch from
    0.1) and linear decay to 0.01 at the last step; head groups keep the incumbent''s
    schedule. The late anchor follows the backbone ratio as now, so it is 0 in epoch
    1. Adam''s moments keep accumulating at rate 0, so the first backbone steps are
    not bias-correction inflated. Value: one epoch, the incumbent''s head warm-up
    length.'
  precedents:
  - 'MambaVision settings, two-warm-up-epochs (backbone and heads together): x4 -0.0004,
    x1 +0.0013.'
  - 'Kumar et al. 2022, LP-FT: linear probe then full fine-tuning.'
  novelty: First schedule here that separates the backbone's start from the heads'.
  coverage: Every study and every label.
  exploitation: 'Read x4 and x1, train_loss_epoch per epoch (expected higher in epochs
    1 and 2) and labels from largest gain to largest loss. Activation: backbone_drift_stage0
    to backbone_drift_stage4 and anchor_penalty exactly 0 at epoch 0 and positive
    from epoch 1; one new per-epoch metric backbone_lr_ratio (mean backbone multiplier)
    at 0 in epoch 0.'
  budget: The incumbent's 2,701 s within 1.02 (backward still runs through the backbone);
    memory unchanged.
  implementation: 'Files: src/knee_abnormality/config.py (backbone_frozen_epochs,
    StrictInt, ge 0, default 0), src/knee_abnormality/training/lightning.py (configure_optimizers
