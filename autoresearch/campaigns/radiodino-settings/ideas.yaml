- id: wavelet-packet-detail-stem-residual
  mechanism_id: adapter-frequency-locality
  parent_idea_id: null
  title: Feed a nonlinear summary of preserved local frequency bands into the pretrained
    patch tokens
  opportunity: 'Measured: adding linear overlap harmed ACL and PF-OA, while widening
    the final merge did not close the broad gap to M. Hypothesis: an explicit representation
    of local differences can preserve useful fine detail with fewer learned early
    filters than a convolutional cascade. This is an alternative stem mechanism with
    an unmeasured working expectation of about +0.0005 macro AUC at both multipliers.'
  mechanism: "Keep the original patch projection. Apply two levels of fixed orthonormal\
    \ 2\xD72 Haar decomposition to every band of the three-channel image, producing\
    \ 48 channels at 56\xD756. Apply a trainable bias-free 3\xD73 convolution 48\u2192\
    48 with padding 1, channel LayerNorm and GELU, then 4\xD74 stride-4 average pooling\
    \ and a zero-initialized bias-free 1\xD71 projection 48\u2192384. Add this branch\
    \ before the existing position embedding. The Haar filters use (1,1)/sqrt(2) and\
    \ (1,\u22121)/sqrt(2); two levels and 48 channels follow the fixed input geometry.\
    \ Only the Haar packing is lossless; the learned summary and pooling are compressive."
  precedents:
  - '[Wave-ViT](https://www.ecva.net/papers/eccv_2022/papers_ECCV/papers/136850324.pdf),
    section 3.2, gives the Haar filters and combines preserved subbands with local
    convolution. This proposal uses that representation principle in an input residual,
    without replacing attention.'
  - 'overlapping-patch-embedding: a larger linear raw-pixel projection activated but
    failed both multipliers.'
  - The current locality contract permits convolutional stems and side branches; the
    fixed base RadioDINO weights and all downstream structures remain retained.
  novelty: Uses explicit local frequency bands followed by nonlinear summarization.
    It differs from learning a raw-image convolutional hierarchy or selecting among
    four sub-patches.
  coverage: "Introduces fine-detail measurements before patch-token processing while\
    \ preserving the 14\xD714 token grid. The side branch's pooled centers align with\
    \ the original stem at origin 7.5 and stride 16."
  exploitation: Log residual/input RMS and the branch-output RMS difference when all
    bands except the three twice-low-pass bands are zeroed. This cheap branch-only
    diagnostic demonstrates use of detail bands without a second backbone evaluation
    or a new predictive objective.
  budget: "Twelve epochs, batch 8, 5304 steps, seed 1110484336. Approximately 39k\
    \ trainable parameters and 69M convolution MACs per image, plus fixed Haar operations.\
    \ Estimated training 2800\u20133050 s and peak allocation 12\u201312.5 GB. Neither\
    \ estimate is measured."
  implementation: Implement fixed Haar filters as buffers and the trainable residual
    in modeling/staged_backbones.py; add the position embedding once and preserve
    stem.proj. Make geometry_layers expose only the primary projection geometry for
