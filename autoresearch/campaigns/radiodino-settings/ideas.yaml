  coverage: Supplies local image features at all four existing stage entries. The
    RadioDINO weights, twelve blocks, token count, adapter reads and downstream maps
    retain their current roles.
  exploitation: Uses the closest completed locality result while addressing a specific
    activation ambiguity. Lateral OA and fracture gains motivate retaining the information
