- id: patchwise-content-resampling-residual
  mechanism_id: adapter-subpatch-resampling
  parent_idea_id: null
  title: Learn a content-dependent summary of four sub-patches beside each pretrained
    patch token
  opportunity: "Measured: learned final merging and linear input overlap both activated\
    \ without improving macro AUC. Neither explicitly selects informative content\
    \ inside an original 16\xD716 patch. Hypothesis: a local adaptive summary can\
    \ preserve small structures that uniform linear patchification represents poorly.\
    \ This targets the persistent fracture, PF-OA and lateral-meniscus gaps as diagnostic\
    \ weaknesses, while optimizing only macro AUC. A tentative expectation is approximately\
    \ +0.0005 macro AUC at both multipliers."
  mechanism: "Keep the pretrained stem. A parallel 8\xD78 stride-8 convolution maps\
    \ the same image to 96-channel features on a 28\xD728 grid, followed by GELU.\
    \ Within each non-overlapping 2\xD72 group, a shared bias-free linear scorer produces\
    \ four logits and a softmax-weighted feature summary. Project the summary through\
    \ a zero-initialized bias-free Linear(96,384), add it to the original 14\xD714\
    \ patch projection, then add the existing position embedding once. Initialize\
    \ the scorer to zero for uniform initial weights. The 8-pixel subdivision and\
    \ 96-channel width derive from halving the fixed patch width and quartering its\
    \ 384 channels."
  precedents:
  - '[TokenLearner](https://arxiv.org/abs/2106.11297) learns input-dependent visual
    tokens. This proposal borrows adaptive spatial summarization but confines it to
    four sub-patches per fixed output token.'
  - 'overlapping-patch-embedding: active extra neighborhood weights did not improve
    either multiplier. This proposal changes content selection and nonlinear representation,
    rather than enlarging another linear kernel.'
  - 'final-read-by-learned-two-by-two-merge: added final channels became active, but
    the source information had already passed through the original patchification.'
  novelty: Introduces content-dependent sub-patch pooling before the transformer.
    It differs from fixed overlap, a convolutional cascade and the running MLP locality
    mechanism.
  coverage: All original patch tokens receive one local residual. Only the side branch
    has 784 intermediate features; transformer sequence length remains 196, with existing
    read depths and downstream outputs.
  exploitation: Tests whether local content selection matters beyond additional linear
    capacity. Log residual/input RMS, deviation of pooling weights from 0.25, and
    pooling entropy. Nonuniform weights are needed to establish that adaptive resampling
    itself activated.
  budget: "Twelve epochs, batch 8, 5304 steps, seed 1110484336. Approximately 56k\
    \ added weights and 18M projection MACs per image, plus small scoring operations.\
    \ Estimated training 2800\u20133000 s and peak allocation about 12\u201312.5 GB.\
    \ Actual runtime remains unknown."
  implementation: Add the fixed side branch to modeling/staged_backbones.py; preserve
