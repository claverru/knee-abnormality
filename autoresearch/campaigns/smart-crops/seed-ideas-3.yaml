    120 mm. Coronal and sagittal T1/PD: 84 mm at 224 px (0.375 mm) at the rule position. Coronal
    and sagittal fluid-sensitive series: 93.33 mm at 224 px (5/12 mm) at the rule position. Rule
    position, fallback and clipping exactly as in fluid-detail-93-replacement: coronal centred on
    the fitted knee centre, sagittal 7 mm anterior of it, both 10 mm below the image centre;
    untrusted geometry is centred horizontally on the image centre; the window is shifted, never
    shrunk, to stay inside the image-centred 120 mm window and the stored image. The axial view
    is the same view kind as before with its own spacing: no new embedding, no new parameter. No
    jitter, no crop, no second view.
  precedents:
  - 'fluid-detail-93-replacement: 0.932880 at x4, 1,134 s; axial-wide tokens alone 0.838 at x1;
    Baker''s cyst -0.0062 against the incumbent (findings.md).'
  - 'rn18-field-120-control against the same recipe at 140 mm on every series: +0.0008, 80%
    [-0.0006, +0.0022]; synovitis -0.0044, Baker''s cyst -0.0030, medial meniscus -0.0018
    (prior-work.md, Precedent table).'
  - 'two-views-fluid-140 and contrast-split-112-140 read fluid series of all planes at 140 mm and
    tied 120 mm; neither kept finer coronal and sagittal views beside a 140 mm axial one
    (findings.md; prior-work.md, Precedent table).'
  novelty: First run with 140 mm on the axial series alone, beside finer coronal and sagittal
    views.
  coverage: Axial slices, 28.9% of the slices of a study; the other 71.1% are unchanged from
    fluid-detail-93-replacement.
  exploitation: >-
    Activation: view_extent_axial_mm equal to 140 and view_share_wide of at least 0.25 at epoch 0.
    Logs and reading as axial-130-detail-84-93, and against that run label by label: the two
    differ by the axial width alone.
  budget: As axial-130-detail-84-93, 26 inputs of 224 px and an estimated 1,100-1,200 s.
  implementation: >-
    As axial-130-detail-84-93 with the axial spacing at 0.625 mm; builds on its frozen source if
    it is not the incumbent, else on fluid-detail-93-replacement's. data.spacing_mm stays
    0.5357 mm, so slice selection, the 120 mm clipping window of the coronal and sagittal views
    and the frame of the token positions do not move.
  open_choices: None. The width is the user's, 2026-10-02; see axial-130-detail-84-93.
  dependencies: []
  priority_rationale: User seed, forced, 2026-10-02; runs after axial-130-detail-84-93.
