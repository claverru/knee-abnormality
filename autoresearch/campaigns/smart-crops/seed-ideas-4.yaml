ideas:
- id: coronal-fluid-93-sagittal-fluid-120
  mechanism_id: fluid-plane-split
  parent_idea_id: fluid-detail-93-replacement
  title: The incumbent with sagittal fluid back at the image-centred 120 mm view, coronal fluid
    kept at 93 mm
  opportunity: >-
    fluid-detail-93-replacement zoomed coronal and sagittal fluid together and gained 0.0010
    against t1pd-detail-84, with Baker's cyst -0.0062 and MCL -0.0015. No run has changed one of
    the six series types alone, so it is not known which fluid plane carried the gain and which
    the cost. Three earlier runs that touched sagittal fluid alone moved MCL -0.0027 to -0.0062
    and Baker's cyst -0.0054 to -0.0072. This run and sagittal-fluid-93-coronal-fluid-120
    complete a two-by-two with the incumbent and t1pd-detail-84.
  mechanism: >-
    Complete view policy for training, x1 validation and x4 prediction, one view per selected
    slice. Sagittal fluid-sensitive series: the wide view, 120 mm at 224 px (0.5357 mm),
    image-centred, with no detail embedding, exactly as in t1pd-detail-84. Coronal
    fluid-sensitive series: 93.33 mm at 224 px (5/12 mm) at the rule position, as in the
    incumbent. Coronal and sagittal T1/PD: 84 mm at 224 px (0.375 mm) at the rule position, as in
    the incumbent. Axial series: the incumbent's axial view at launch, unchanged (120 mm unless an
    axial seed was accepted). Rule position, fallback and clipping as in the incumbent. No
    jitter, no crop, no second view.
  precedents:
  - 'fluid-detail-93-replacement against t1pd-detail-84: +0.0010, 80% [-0.0000, +0.0020];
    synovitis +0.0054, lateral OA +0.0036, lateral meniscus +0.0030, PF OA +0.0029, Baker''s
    cyst -0.0062, MCL -0.0015 (findings.md).'
  - 'Per slice, coronal fluid is the most used type for the medial meniscus (1.69 of a uniform
    share) and the MCL (1.41); sagittal fluid for ACL (1.87), PF OA (1.53) and the lateral
    meniscus (1.42) (outputs/analysis/v/view-spacing-20261002/report.md).'
  - 'No run isolates one of the six series types (same report, What can be read off).'
  novelty: First run that zooms one fluid plane and not the other.
  coverage: Sagittal fluid slices, 18.5% of a study's slices, return to the wide view; the rest
    is the incumbent.
  exploitation: >-
    Activation: view_share_detail_fluid_sagittal equal to 0 and view_share_detail_fluid_coronal
    of at least 0.15 at epoch 0. Logs as the incumbent. Read against the incumbent,
    t1pd-detail-84 and sagittal-fluid-93-coronal-fluid-120, label by label: MCL, Baker's cyst and
    effusion for what the sagittal zoom cost, ACL, PF OA and the lateral meniscus for what it
    gave.
  budget: 26 inputs of 224 px, the reference's backbone pixels; the incumbent took 1,134 s.
    Estimate 1,100-1,200 s, inside 575-1,724 s.
  implementation: >-
    One new view policy value on the incumbent's code, no legacy branch: the detail predicate
    takes coronal fluid series and not sagittal fluid ones. Nothing else changes; data.spacing_mm
    stays 0.5357 mm. Preprocessing identity updated.
  open_choices: None. User seed, 2026-10-02, one of six combinations the user asked to queue
    after the spacing review; the contract's rules on measured spatial settings and on sweeps
    bind the researcher's proposals, not these.
  dependencies: []
  priority_rationale: User seed, forced, 2026-10-02.
- id: sagittal-fluid-93-coronal-fluid-120
