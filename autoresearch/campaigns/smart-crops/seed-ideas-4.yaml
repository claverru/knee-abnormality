- id: sagittal-fluid-93-centred
  mechanism_id: sagittal-fluid-placement
  parent_idea_id: fluid-detail-93-replacement
  title: The incumbent with the sagittal fluid window centred on the fitted knee centre, without
    the 7 mm anterior offset
  opportunity: >-
    The 7 mm anterior offset was derived on T1/PD series for the detail labels and reused on
    fluid. At 93 mm it leaves 40 mm behind the knee centre against 54 mm in front; the rule
    window cuts a median 35 mm of posterior tissue. In effusion- and Baker's-positive studies 37%
    of the sagittal fluid attention of those labels lies outside the 93 mm rule window, against
    12% outside 120 mm, and in one reviewed Baker's case most of the cyst lies outside it. The
    runs do not show that the Baker's cost comes from cut tissue (it fell about 0.006 in eleven
    runs that cut nothing), so this is a guess that costs nothing to test.
  mechanism: >-
    Complete view policy for training, x1 validation and x4 prediction, one view per selected
    slice. Sagittal fluid-sensitive series: 93.33 mm at 224 px (5/12 mm), centred horizontally on
    the fitted knee centre with no anterior offset, 10 mm below the image centre. Sagittal T1/PD:
    84 mm at 0.375 mm, 7 mm anterior of the fitted centre, 10 mm below the image centre, as in
    the incumbent. Coronal T1/PD at 84 mm and coronal fluid at 93.33 mm at the rule position, as
    in the incumbent. Axial series: the incumbent's axial view at launch, unchanged. Fallback and
    clipping as in the incumbent. No jitter, no crop, no second view.
  precedents:
  - 'Sagittal fluid at the 93.33 mm rule window: median cut 14 mm anterior and 35 mm posterior;
    attention inside the window in positive studies 63% for effusion and Baker''s cyst, 87% for
    ACL, 88% for PF OA (outputs/analysis/v/view-spacing-20261002/report.md).'
  - 'Reviewed case 93267826: most of a 4.5 cm Baker''s cyst lies outside the sagittal 93.33 mm
    window (docs/data-preparation/plane-fluid-spacing-review.md).'
  - 'Baker''s cyst fell 0.0010 to 0.0095 in eight crop runs that kept the 120 mm view
    (outputs/analysis/v/view-spacing-20261002/report.md).'
  novelty: First run with a placement offset that differs between the two contrasts.
  coverage: Sagittal fluid slices, 18.5% of a study's slices, move 7 mm posterior; the rest is
    the incumbent.
  exploitation: >-
    Activation: window_center_sagittal_fluid_x_mean_mm within 2 mm of zero while
    window_center_sagittal_t1pd_x_mean_mm stays below -6 mm, at epoch 0. Logs as the incumbent.
    Read against the incumbent: Baker's cyst and effusion for what the back of the knee gives,
    ACL and PF OA for what the front loses.
  budget: As the incumbent, an estimated 1,100-1,200 s.
  implementation: >-
    One new view policy value on the incumbent's code, no legacy branch: the anterior offset of
    detail_position becomes a per-contrast value, 7 mm for T1/PD and 0 for fluid. Nothing else
    changes. Preprocessing identity updated.
  open_choices: None. User seed, 2026-10-02; see coronal-fluid-93-sagittal-fluid-120.
  dependencies: []
  priority_rationale: User seed, forced, 2026-10-02.
- id: sagittal-fluid-100
  mechanism_id: sagittal-fluid-width
  parent_idea_id: fluid-detail-93-replacement
  title: The incumbent with sagittal fluid at 100 mm (0.4464 mm) in place of 93 mm
  opportunity: >-
    Sagittal fluid is the one coronal or sagittal type where the spacing review could not
    exclude a wider view. Resolution picks 5/12 mm (89% of series fully resolved, 73% at
    0.4464 mm); the periphery argues the other way (37% of the effusion and Baker's attention of
    this type in positive studies outside 93 mm, 30-31% outside 100 mm). The sagittal knee is the
    widest, 146 mm front to back.
  mechanism: >-
    Complete view policy for training, x1 validation and x4 prediction, one view per selected
    slice. Sagittal fluid-sensitive series: 100 mm at 224 px (0.4464 mm) at the rule position
    (7 mm anterior of the fitted knee centre, 10 mm below the image centre). Coronal fluid at
    93.33 mm, coronal and sagittal T1/PD at 84 mm, at the rule position, as in the incumbent.
    Axial series: the incumbent's axial view at launch, unchanged. Fallback and clipping as in
    the incumbent: the window is shifted, never shrunk, to stay inside the image-centred 120 mm
    window and the stored image, which leaves 10 mm of slack per side at this width. No jitter,
    no crop, no second view.
  precedents:
  - 'Sagittal fluid, finer acquired axis fully kept: 92% at 0.375 mm, 89% at 5/12 mm, 73% at
    0.4464 mm, 60% at 0.5 mm, 44% at 0.5357 mm (n=4,192;
    outputs/analysis/v/view-spacing-20261002/report.md).'
  - 'Sagittal fluid attention inside the rule window, positive studies: effusion 63% at 93 mm,
    69% at 100 mm, 80% at 112 mm; Baker''s cyst 63%, 70%, 81% (same report).'
  novelty: First 100 mm view, and first run that changes the sagittal fluid width alone.
  coverage: Sagittal fluid slices, 18.5% of a study's slices; the rest is the incumbent.
  exploitation: >-
    Activation: view_extent_sagittal_fluid_mm equal to 100 at epoch 0, and the share of sagittal
    fluid windows displaced by clipping logged. Logs as the incumbent. Read against the
    incumbent: effusion and Baker's cyst for the periphery, ACL, PF OA and the menisci for the
    resolution given up.
  budget: As the incumbent, an estimated 1,100-1,200 s.
  implementation: >-
    One new view policy value on the incumbent's code, no legacy branch: the detail spacing
    becomes a value per plane and contrast, 0.4464 mm for sagittal fluid and 5/12 mm for coronal
    fluid. Nothing else changes. Preprocessing identity updated.
  open_choices: None. User seed, 2026-10-02; see coronal-fluid-93-sagittal-fluid-120.
  dependencies: []
  priority_rationale: User seed, forced, 2026-10-02.
- id: t1pd-detail-93
  mechanism_id: t1pd-width
  parent_idea_id: fluid-detail-93-replacement
  title: The incumbent with coronal and sagittal T1/PD at 93 mm (5/12 mm) in place of 84 mm
  opportunity: >-
    84 mm on T1/PD was never compared with a plain 93 mm view. Resolution favours 84 mm (92% and
    90% of coronal and sagittal T1/PD series fully resolved at 0.375 mm, 76% and 73% at 5/12 mm),
    and two runs that gave width back per series tied it (-0.0002, -0.0005). The 84 mm window
    leaves under 40 mm above the joint line in 36% of sagittal T1/PD series and cuts more than
    20 mm of medial tissue in 58% of coronal ones, against 18% and 42% at 93 mm. One spacing for
    all four coronal and sagittal types would also be the simplest policy.
  mechanism: >-
    Complete view policy for training, x1 validation and x4 prediction, one view per selected
    slice. Coronal and sagittal T1/PD: 93.33 mm at 224 px (5/12 mm) at the rule position, in
    place of 84 mm. Coronal and sagittal fluid: 93.33 mm at the rule position, as in the
    incumbent. Axial series: the incumbent's axial view at launch, unchanged. Rule position,
    fallback and clipping as in the incumbent. No jitter, no crop, no second view.
  precedents:
  - 't1pd-detail-84 against the 120 mm control: +0.0013, 80% [+0.0001, +0.0025] (findings.md).'
  - 't1pd-detail-acquisition-matched and t1pd-detail-acquired-matrix, 84 to 120 mm per series:
    -0.0002 and -0.0005 against t1pd-detail-84 (findings.md).'
  - 'Coronal and sagittal T1/PD resolution and tissue cut at 84 and 93.33 mm
    (outputs/analysis/v/view-spacing-20261002/report.md).'
  novelty: First fixed T1/PD detail view at a width other than 84 mm.
  coverage: Coronal and sagittal T1/PD slices, 33.7% of a study's slices; the rest is the
    incumbent.
  exploitation: >-
    Activation: view_extent_coronal_t1pd_mm and view_extent_sagittal_t1pd_mm equal to 93.33 at
    epoch 0. Logs as the incumbent. Read against the incumbent: fracture, ACL and the medial
    meniscus are what 84 mm gained; lateral meniscus, lateral OA and PF OA are what it cost.
  budget: As the incumbent, an estimated 1,100-1,200 s.
  implementation: >-
    One new view policy value on the incumbent's code, no legacy branch: the T1/PD detail spacing
    becomes 5/12 mm. Nothing else changes. Preprocessing identity updated.
  open_choices: None. User seed, 2026-10-02; see coronal-fluid-93-sagittal-fluid-120.
  dependencies: []
  priority_rationale: User seed, forced, 2026-10-02; lowest prior of the five, so it runs last.
