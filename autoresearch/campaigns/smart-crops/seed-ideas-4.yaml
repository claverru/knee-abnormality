    of at least 0.15 at epoch 0. Logs as the incumbent. Read against the incumbent,
    t1pd-detail-84 and coronal-fluid-93-sagittal-fluid-120: the medial meniscus, MCL and medial
    OA for what the coronal zoom gave or cost.
  budget: As coronal-fluid-93-sagittal-fluid-120, an estimated 1,100-1,200 s.
  implementation: >-
    One new view policy value on the incumbent's code, no legacy branch: the detail predicate
    takes sagittal fluid series and not coronal fluid ones. Nothing else changes. Preprocessing
    identity updated.
  open_choices: None. User seed, 2026-10-02; see coronal-fluid-93-sagittal-fluid-120.
