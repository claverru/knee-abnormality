    kept at 93 mm
  opportunity: >-
    The other half of coronal-fluid-93-sagittal-fluid-120: with it, the incumbent and
    t1pd-detail-84 it gives each fluid plane's own contribution to the 0.0010 gain and to the
    Baker's cyst and MCL costs. The 93 mm coronal window cuts more than 20 mm of medial tissue in
    43% of coronal fluid series, and the MCL runs down that edge.
  mechanism: >-
    Complete view policy for training, x1 validation and x4 prediction, one view per selected
    slice. Coronal fluid-sensitive series: the wide view, 120 mm at 224 px (0.5357 mm),
    image-centred, with no detail embedding, exactly as in t1pd-detail-84. Sagittal
    fluid-sensitive series: 93.33 mm at 224 px (5/12 mm) at the rule position, as in the
    incumbent. Coronal and sagittal T1/PD: 84 mm at 224 px (0.375 mm) at the rule position, as in
    the incumbent. Axial series: the incumbent's axial view at launch, unchanged. Rule position,
    fallback and clipping as in the incumbent. No jitter, no crop, no second view.
  precedents:
  - 'fluid-detail-93-replacement against t1pd-detail-84: +0.0010; Baker''s cyst -0.0062, MCL
    -0.0015 (findings.md).'
  - 'Coronal fluid at 93.33 mm: more than 20 mm of medial tissue cut in 43% of series, median
    cut 18 mm; 91% of series fully resolved at 5/12 mm
    (outputs/analysis/v/view-spacing-20261002/report.md).'
  - 'sagittal-fluid-detail-rectangle, -correspondence-fusion and -content-residual added a
    sagittal fluid detail window beside the 120 mm view and tied t1pd-detail-84 (-0.0002,
    +0.0000, +0.0001); none replaced the view (findings.md).'
  novelty: First run that zooms sagittal fluid in place of its wide view and leaves coronal
    fluid wide.
  coverage: Coronal fluid slices, 18.9% of a study's slices, return to the wide view; the rest
    is the incumbent.
  exploitation: >-
