- id: crop-compartments
  mechanism_id: crop-model-placed
  parent_idea_id: null
  title: Two model-placed crops per coronal T1/PD slice, one for the medial labels
    and one for the lateral ones
  opportunity: 'Placement matters most for the menisci: at 60 mm a per-study position
    adds 0.19 of medial-meniscus and 0.11 of lateral-meniscus attention over one position
    for all studies, and their attention sits 20-28 mm either side of the fitted midline.
    One 60 mm window in a coronal slice cannot hold both compartments, so one crop
    serves one side or neither. The medial meniscus is also the label that fell with
    the 120 mm field.'
  mechanism: View policy as crop-attention, except that every coronal T1/PD slice
    has two crops. From epoch 3 the first is placed by the summed attention of medial
    meniscus and medial OA and the second by that of lateral meniscus and lateral
    OA, each as crop-attention places its window. In epochs 0 to 2 the two sit 22
    mm medial and 22 mm lateral of the fitted knee centre, 10 mm below the image centre,
    shifted to stay inside the wide view's window; a series without trusted geometry
    has one crop at the rule position. Sagittal T1/PD slices keep one crop, placed
    as crop-attention. Both crops of a slice enter the joint pool; the meniscus own-side
    mask already removes opposite-side tokens.
  precedents:
  - 'Attention probe: medial meniscus 0.56 at one 60 mm position against 0.75 per
    study and plane, lateral meniscus 0.49 against 0.60; attention-weighted medial
    position +22 to +28 mm for the medial meniscus and -19 to -25 mm for the lateral
    one (prior-work.md, Where the model looks).'
  - 'Tack 2021: a meniscus crop raised the medial anterior horn from 0.74 to 0.87
    at the same resolution, with different encoders (prior-work.md, Literature).'
  - September per-label crops tied their shared-crop twin (-0.0011 both); there the
    crops replaced the full slice.
  novelty: First placement per label group and first two crops on one slice.
  coverage: About 4 extra crops per study, on coronal T1/PD slices; the two meniscus
    labels and the medial and lateral OA labels are the targets.
  exploitation: The two window centres per epoch against the midline; attention_mass_view_<label>
    for the four compartment labels; their AUC against crop-attention and crop-rule.
  budget: 39 images per study against 26 (1.5x) at 1.25x the backbone pixels; expect
    about 1,440-1,720 s against the bound of 1,724 s. Block if the projected time
    passes it.
  implementation: 'Replaces the incumbent''s view policy; builds on crop-attention''s
    frozen source if it was rejected. A second crop entry per coronal detail slice
    in the model''s crop cutting and in the token bookkeeping; the two label groups
    as fixed lists. Activation signature: attention_mass_view_mean of at least 0.05
    at epoch 0.'
  open_choices: None. The 22 mm start offset is the measured attention position of
    the menisci.
  dependencies: []
  priority_rationale: Where the probe says placement has the most room; after the
    single model-placed crop it builds on.
