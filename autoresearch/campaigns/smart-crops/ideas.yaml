- id: crop-attention
  mechanism_id: crop-model-placed
  parent_idea_id: null
  title: The 60 mm crop placed by the model's own attention, after three epochs at
    the rule position
  opportunity: The 140 mm control's attention is sharp enough to place a window (within-slice
    entropy 0.67-0.86 against 0.97-0.99 for the September scout), and a per-study
    position moves 0.02-0.19 of the detail labels' attention at 60 mm. September's
    placement failed with a scout trained only by the final loss; here the locator
    is the main model, whose attention is trained by the labels through the joint
    pool.
  mechanism: 'View policy as crop-rule; only the crop position differs. Epochs 0 to
    2 use the rule position. From epoch 3 on, in training, validation and prediction,
    a first pass over the wide tokens gives each series its model position: for each
    of ACL, medial meniscus, lateral meniscus, medial OA, lateral OA and PF OA the
    attention scores of the series'' valid wide tokens are turned into a softmax over
    those tokens, the six maps are summed over labels and over the series'' slices,
    and the centre of the best 3x3 block of the 7x7 grid is the window centre, clipped
    so the crop stays inside the wide view''s window. The scores come from detached
    tokens and no gradient flows through the choice. The centre is mapped to prepared
    coordinates through the wide view''s inverse augmentation and the crop is cut
    from the 320 px canvas (the 120 mm window at 0.375 mm, middle slice only). Training
    adds the same jitter as crop-rule; evaluation takes the best block. A series without
    valid wide tokens takes the rule position.'
  precedents:
  - 'Attention probe of the 140 mm control: a 60 mm window per study and plane keeps
    0.59 of ACL, 0.75 of medial-meniscus and 0.60 of lateral-meniscus attention, against
    0.55, 0.56 and 0.49 at one position for all studies; one window per study and
    plane keeps within 0.02-0.07 of one per slice (prior-work.md, Where the model
    looks).'
  - 'AG-CNN (chest X-ray): sequential training with the global branch as locator 0.868
    AUC, joint training 0.849. AdaFocusV2: a stop-gradient from the placement into
    the global encoder was worth +3.9 mAP (prior-work.md, Literature).'
  - 'September: placement by a scout trained only by the final loss was worth about
    0.005 over fixed crops, and crop centres differed by at most 2 mm between positive
    and negative studies (docs/history/crop-selection-investigation.md).'
  novelty: First placement by the main model's own attention, first staged placement.
  coverage: The same slices and crops as crop-rule; only their position changes, by
    up to 30 mm.
  exploitation: The share of series at the model position per epoch; the window centre's
    mean and spread per plane, its distance from the rule position and, per label,
    the distance between positive and negative studies' centres; attention_mass_view_<label>;
    per-label AUC against crop-rule, with the two meniscus labels as the ones to watch.
  budget: As crop-rule, plus the 320 px canvas for about 9 slices per study in the
    loader and the batch.
  implementation: 'Replaces the incumbent''s view policy; builds on crop-rule''s frozen
    source if it was rejected. The loader ships the canvas instead of the cut crop;
    the model computes the wide tokens, takes the placement from detached attention
    scores, cuts and augments the crops and encodes them. The switch from rule to
    model position is by epoch, the same in the training and validation of an epoch.
    Activation signature: the share of series at the model position of at least 0.9
    at epoch 3.'
  open_choices: None. The six labels are the detail group; the three rule epochs follow
    the staged-training precedent.
  dependencies: []
  priority_rationale: The direct test of the campaign's question, after its control.
  status: completed
  created_revision: 0
