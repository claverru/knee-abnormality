- id: crop-own-loss
  mechanism_id: crop-own-loss
  parent_idea_id: null
  title: Rule-placed crop whose tokens are also pooled alone under their own loss
  opportunity: 'Five side paths have been sidelined by the main one in this project,
    and the two-stream run made it six. The literature''s ablated cure is a loss on
    the crop alone (GFNet +2.0, TNet +7.9, AdaFocusV2 +3.1 points). Local evidence
    is against it on one count and neutral on another: dense per-plane readouts with
    their own loss lost 0.0052, per-scale readouts with their own loss tied at +0.0006.'
  mechanism: View policy and placement as crop-rule. Beside the joint pool, the crop
    tokens of a study are pooled alone with the same attention scorer and readout
    rows, giving crop-only logits, which take the class-balanced soft BCE of the disease
    loss at weight 0.1 (trainer.crop_loss_weight), over studies that have crop tokens.
    Prediction uses the joint pool only.
  precedents:
  - 'Per-crop or per-branch losses: GFNet 75.93 against 73.94 without, TNet 73.12
    against 65.21, AdaFocusV2 +3.1 mAP (prior-work.md, Literature).'
  - 'dense-plane-readouts on ResNet-18: -0.0052; fusion-scaleheads on ReXNet-200:
    +0.0006 (prior-work.md, Precedent table).'
  - Existing auxiliary terms of the recipe run at 0.075 (half-knee) and 0.1 (report
    attributes).
  novelty: First loss on a second view of the same slices; the earlier per-view losses
    split the slices between views.
  coverage: Studies with a T1/PD coronal or sagittal series; all labels.
  exploitation: The crop-only loss and val_macro_auc_view_detail per epoch against
    crop-rule; attention_mass_view_<label>; per-label AUC against crop-rule, with
    the periphery group as the labels a crop-only loss could hurt.
  budget: As crop-rule; one more pooling per step.
  implementation: 'Replaces the incumbent''s view policy; builds on crop-rule''s frozen
    source if it was rejected. The crop-only pooling reuses the diagnostic that already
    pools one kind of token; the loss term and its weight in the Lightning module,
    logged per epoch. Activation signature: the crop-only loss term''s share of the
    total loss of at least 0.01 at epoch 0.'
  open_choices: None. The weight 0.1 is the scale of the recipe's existing auxiliary
    terms and is not swept.
  dependencies: []
  priority_rationale: Last because it tests whether the crop is used, which the earlier
    seeds' attention shares will already have shown.
  status: completed
