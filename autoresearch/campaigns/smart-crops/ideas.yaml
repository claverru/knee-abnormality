  mechanism: "Complete view policy for training, \xD71 validation and \xD74 prediction,\
    \ one view per selected slice:\n- Axial series: wide view, 120 mm at 224 px, image-centred.\n\
    - Coronal and sagittal T1/PD: the incumbent's uniform detail view, 84 mm at 0.375\
    \ mm, rule position (uniform tied or beat foveated there).\n- Coronal and sagittal\
    \ fluid: a foveated native view over the image-centred 120 mm window: a 192 px\
    \ core at 5/12 mm (80 mm) centred at the rule position (fitted centre, sagittal\
    \ 7 mm anterior, 10 mm below the image centre), and a 16 px band on each side\
    \ covering the rest of the window (mean 1.25 mm; vertically 30 mm above at 1.9\
    \ mm and 10 mm below at 0.6 mm), each resampled from native pixels with its own\
    \ filter.\n- Band bound, the named change besides the series: the core is shifted,\
    \ never shrunk, so that no band is narrower than 16 core pixels (6.67 mm), so\
    \ no band is sampled finer than the core.\n- Fallback per series: untrusted geometry\
    \ centres the core horizontally on the image; a series that cannot satisfy the\
    \ bound or lacks a native layout takes the wide view.\n- No jitter; deterministic.\n\
    \nBasis: the core spacing is the one that resolves nine in ten fluid series; 80\
