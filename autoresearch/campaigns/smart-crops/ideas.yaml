  - 'crop-own-loss: crop-only logits under the disease loss at weight 0.1; medial
    OA +0.0023, lateral OA +0.0034, macro -0.0003 (findings.md).'
  - 'Coronal attention per slice against uniform: medial OA 1.28 on coronal fluid
    and 1.06 on coronal T1/PD (outputs/analysis/v/view-spacing-20261002/report.md).'
  novelty: First crops on fluid slices, first side-specific routing of crop tokens
