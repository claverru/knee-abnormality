- id: t1pd-detail-84
  mechanism_id: detail-view
  parent_idea_id: null
  title: T1/PD coronal and sagittal series at 84 mm and 0.375 mm instead of 120 mm,
    no crop
  opportunity: 'The 120 mm input at 0.536 mm keeps the full acquired detail of 18-23%
    of T1/PD coronal and sagittal series; 0.375 mm keeps it in 90-92%. Narrowing from
    140 to 120 mm gained three times (+0.0011 to +0.0023), and the periphery labels
    put only 0.6-0.8 of a uniform share of attention on these series, so they are
    the ones that can give up more field. The evidence is mixed: the contrast split,
    which narrowed T1/PD series alone to 112 mm, tied 120 mm on every series, and
    the medial meniscus fell in every 120 mm run. Nothing has measured 0.375 mm, and
    a crop result cannot be read without knowing what resolution alone gives.'
  mechanism: 'View policy: every slice of a T1/PD coronal or sagittal series (fluid_sensitive
    0, fat_suppression 0) is read at the detail view, 84 mm at 224 px (0.375 mm),
    in training, validation and prediction; axial series and fluid-sensitive series
    keep the wide view (120 mm at 224 px). The window sits at the rule position of
    its series: coronal centred horizontally on the fitted knee centre, sagittal 7
    mm anterior of it, both 10 mm below the image centre; the image centre horizontally
    for a series without trusted geometry; shifted to stay inside the wide view''s
    window and the stored image. Tokens of the detail view take their 2D position
    in the wide view''s frame and add a zero-initialized view embedding. One shared
    backbone, the plane-contrast readouts and the joint pool, unchanged.'
  precedents:
  - 'Mixed-field (reference rn18-l2sp-no-confusion, 140 mm): 120 mm alone +0.0011
    and +0.0012, 0.947 public against 0.943; contrast-split-112-140 +0.0015 but -0.0003
    against 120 mm alone (80% [-0.0017, +0.0011]) and 0.945 public; the medial meniscus
    fell -0.002 to -0.007 in every 120 mm run (docs/validation/results/crops-and-views/2026-10-01-mixed-field-campaign.md).'
  - 'Acquired resolution: T1/PD coronal 92% and sagittal 90% fully resolved at 0.375
    mm, 18% and 23% at 0.536 mm (prior-work.md, Acquired resolution).'
  - 'Extent: the detail labels use 80-90 mm across a coronal slice and 60-70 mm across
    a sagittal one; one fixed 80 mm window keeps 0.65-0.74 of ACL and meniscus attention
    on the 140 mm control (prior-work.md, Where the model looks).'
  novelty: First run at 0.375 mm, first rule-placed window on the fitted knee centre,
    and the narrowest field tried.
  coverage: All studies with a T1/PD coronal or sagittal series, about 9 of 26 slices
    per study. Coronal is the tight case, where 84 mm leaves no margin around both
    compartments; the fluid series of the same plane keep 120 mm.
  exploitation: view_share_detail per plane; val_macro_auc_view_wide and val_macro_auc_view_detail
    per label; the window centre's mean and spread per plane; per-label AUC against
    the reference by the detail and periphery groups of prior-work.md, with the medial
    meniscus read on its own. It is the resolution yardstick for every crop seed.
  budget: 26 images per study as the reference; expected time as the reference (1,149
    s).
  implementation: 'Replaces the incumbent''s view policy. data.views in config.py
    with the incumbent''s single wide view as the default; the per-series spacing
    and window offset in data/dataset.py and data/preprocessing (the offset enters
    the resample plan and output_to_native, so patient maps and valid rectangles follow);
    the view index per series in the batch; the view embedding and wide-frame token
    positions in modeling/; view_share_* and the per-view diagnostics in the Lightning
    module. Slice selection keeps the 60 mm radius. Activation signature: view_share_detail
    of at least 0.25 at epoch 0.'
  open_choices: None. The spacing comes from the acquired resolution, the size is
    what 224 px gives at that spacing, and the position comes from the measured centres;
    none is swept.
  dependencies: []
  priority_rationale: First because it is free and is needed to read the crop seeds.
