    \ a series type supplies max_images \xD7 multiplier // 3 triplets, 5 at \xD71\
    \ and 20 at \xD74, so adjacent slices are both present at prediction."
  - '[Offset plumbing in the incumbent](/home/claudio/src/knee-abnormality/outputs/autoresearch/smart-crops/experiments/t1pd-detail-84-20261001T220724Z-00bb3343/source/src/knee_abnormality/data/preprocessing/spatial.py):
    resample_plan and _output_to_native already take integer output-pixel offsets
    per series; position_2d is a continuous function of wide-frame coordinates, so
    displaced windows need no new embedding.'
  - '[Shift variance of strided CNNs](https://arxiv.org/abs/1904.11486): downsampling
    makes features depend on the sampling phase; cited as motivation only, with no
    knee MRI result.'
  - '[mixed-field field-jitter and rn18-multiscale-tokens](/home/claudio/src/knee-abnormality-smart-crops/outputs/autoresearch/mixed-field/state.json):
    random field size in training and extra stride-16 tokens were both rejected; neither
    changed the lattice phase at a fixed field and token count.'
  novelty: Not crop placement, not random jitter (training and validation share one
    deterministic distribution), not test-time augmentation (each slice is read once
    in one forward pass), not the proposed dense final grid (no dilation, no extra
    compute) and not field jitter (field size is constant). No decided or queued idea
    changes the lattice phase across slices.
  coverage: "All 26 slices; about half at each phase. At \xD71 training a series has\
    \ about five slices, so adjacency is weak and the mechanism acts mostly as phase\
    \ diversity across steps; at \xD74 prediction adjacent slices alternate. Wide\
    \ series whose stored image cannot hold the displaced window take no displacement\
    \ on that axis; the share is logged."
  exploitation: "Activation: the smaller phase share at least 0.3 and mean absolute\
    \ displacement at least 2.5 mm at epoch 0. Log per epoch, training and validation:\
    \ view_share_wide / detail / crop, phase shares, displacement in mm per view,\
    \ fallback share, window centre mean and spread per plane (the mean should stay\
    \ at the incumbent's, the spread grow by 3\u20134.3 mm), rule distance and per-label\
    \ positive/negative centre distance, attention_mass_view_<label> and attention\
    \ by phase, the incumbent's wide-only and detail-only \xD71 AUCs, and \xD71 AUC\
    \ pooling only even-index and only odd-index slices. Read against the incumbent\
    \ and reference, on both menisci and ACL as the small-structure labels, and on\
    \ the gap between \xD71 and \xD74."
  budget: "26 inputs of 224 px, the reference's backbone pixels. Two resample plans\
    \ per series instead of one; raise the plan cache so it does not thrash. Estimate\
    \ 1,080\u20131,250 s from the incumbent's 1,077 s, inside 575\u20131,724 s. Ten\
    \ epochs, batch size 8, 26 slices and the supervisor's seed stay."
  implementation: "Replaces the incumbent's view policy with one new policy value;\
    \ the old value is removed. Changes: offsets become per slice instead of per series\
    \ through decode_series, decode_slice and the resample-plan key in data/preprocessing\
    \ (dicom.py, preparation.py, spatial.py); detail_position returns the series'\
    \ base offset and clipping bounds and the displacement is added per record; wide\
    \ views take offsets too (now fixed at zero) and get a real view_to_wide instead\
