- id: two-views-fluid-140
  mechanism_id: two-views-per-slice
  parent_idea_id: null
  title: Fluid-sensitive slices also read at 140 mm through a ResNet-10t that feeds
    the joint pool from the first step, with no gate
  opportunity: 'The 120 mm field gains on the detail labels and costs the periphery:
    against the same recipe at 140 mm the control loses on synovitis (-0.0044), Baker''s
    cyst (-0.0030) and the medial meniscus (-0.0018). Taking each label''s better
    field from the single-field runs would be worth about +0.002 over 140 mm, against
    +0.0011 for 120 mm alone. Two views of the same slice were tried once, in mixed-field''s
    two-stream-paired, but its second stream sat behind a gate initialized at zero
    and never trained (0.506 alone, joint equal to narrow-only at every epoch), so
    the idea is untested. The periphery labels look mostly at fluid-sensitive slices
    (1.0-1.4 of a uniform share of attention, against 0.6-0.8 on T1/PD), so those
    are the slices that get the second view.'
  mechanism: 'View policy: every selected slice is read at the wide view (120 mm at
    224 px, 0.536 mm) through the ResNet-18, unchanged. Every slice of a fluid-sensitive
    series (fluid_sensitive 1, fat_suppression 1), in all three planes, is also read
    at a context view, 140 mm at 224 px (0.625 mm), image-centred, through a second
    backbone: a Refined-RadImageNet ResNet-10t (resnet10t.c3_in1k), backbone learning
    rate 6e-5, L2-SP anchored like the first. The context stream has its own projection
    to 256 at the default initialization, not zero. Context tokens add a zero-initialized
    view embedding, take their 2D position in the wide view''s frame, are scored by
    the plane-contrast readout row of their series type and enter the joint pool directly
    at full weight from the first step: no gate, no scaled residual. The two views
    of a slice come from one file read and are augmented independently. No crop, no
    per-stream loss.'
  precedents:
  - 'two-stream-paired (mixed-field): every slice at 120 mm (ResNet-18) and 140 mm
    (ResNet-10t), pooled as narrow + tanh(gate) x (joint - narrow) with the gate at
    zero; the second stream never trained and the run was in effect 120 mm alone.
    51 inputs per study took 1,736 s (docs/validation/results/crops-and-views/2026-10-01-mixed-field-campaign.md).'
  - 'Two views per slice, backlog: both streams must feed the pool from the first
    step, and the activation check must compare the joint score with the narrow-only
    one (docs/backlog/untried-ideas.md).'
  - 'rn18-field-120-control against the same recipe at 140 mm: +0.0008 overall, synovitis
    -0.0044, Baker''s cyst -0.0030, medial meniscus -0.0018 (prior-work.md, Precedent
    table).'
  - One ResNet-18 per field lost 0.0017 to the shared-backbone mix; there each backbone
    saw half the slices, here the second one only adds a view (prior-work.md, Precedent
    table).
  novelty: First run in which a second view of the same slice trains from the first
    step.
  coverage: About 16.6 of a study's 26.8 slices get the context view (axial fluid
    6.5, coronal fluid 5.1, sagittal fluid 5.0). Targets synovitis, Baker's cyst,
    the medial meniscus, MCL and fracture; the detail labels should hold.
  exploitation: attention_mass_view_<label> on the context tokens; val_macro_auc_view_wide
    (the 120 mm tokens alone) and val_macro_auc_view_detail (the context tokens alone)
    per label and epoch, which must differ from the joint AUC; the mean absolute difference
    between the joint and the wide-only logits per epoch; per-label AUC against the
    reference, with synovitis, Baker's cyst and the medial meniscus as the labels
    to watch.
  budget: 43 inputs per study against 26.8. In two-stream-paired the second stream
    cost about 0.67 of the first, which puts this at about 1,630 s against the bound
    of 1,724 s. The same view on every slice would be about 1,830-1,920 s and does
    not fit.
  implementation: 'Replaces the incumbent''s view policy. The paired loader (one file
    read, two resample plans, per-view patient maps and valid rectangles), the second
    backbone with its optimizer group and L2-SP anchors, and the second fixed-chunk
    inference graph can be taken from two-stream-paired''s frozen source in outputs/autoresearch/mixed-field,
    with three changes: the gate and the residual pooling are removed, the context
    projection is not zero-initialized, and the second view is read on fluid-sensitive
    series only. Slice selection keeps the 60 mm radius and 26 slices per study. Activation
    signature: attention_mass_view_mean of at least 0.05 at epoch 0.'
  open_choices: None. The 140 mm field and the ResNet-10t are those of the earlier
    run; the fluid series are where the periphery labels look and what the time bound
    allows.
  dependencies: []
  priority_rationale: User seed, 2026-10-01; independent of the crop seeds, so it
    runs after them.
  status: completed
  created_revision: 1
