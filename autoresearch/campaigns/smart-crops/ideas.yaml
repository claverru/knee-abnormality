- id: half-stride-staggered-lattice
  mechanism_id: staggered-token-lattice
  parent_idea_id: null
  title: Shift each slice's window by half the backbone stride on alternate slices
    so adjacent slices sample complementary token lattices
  opportunity: "Every view becomes 7\xD77 tokens at a 32 px stride (17.1 mm cells\
    \ wide, 12 mm detail), and every slice of a series uses the same window, so the\
    \ lattice sits at one phase relative to the knee on all of them. Measured on the\
    \ 140 mm probe: the top 20 of 1,314 tokens per study carry 23\u201348% of a label's\
    \ attention (medial meniscus 0.48, ACL 0.34, PF OA 0.30) and a slice's top token\
    \ 11\u201314% of that slice's attention, so decisions rest on a handful of cells.\
    \ The two narrowings that were adopted each shrank the cell (20 \u2192 17 mm on\
    \ every series, 17 \u2192 12 mm on T1/PD) for about +0.001, while variants that\
    \ traded pixels for coverage tied (\u22120.0002, \u22120.0005, \u22120.0003).\
    \ Hypothesis, not measured: where cells fall on small structures is a lever of\
    \ its own, separate from pixel spacing. At \xD74 prediction a series type supplies\
    \ 20 slices 3\u20134.5 mm apart, near-duplicates of the anatomy read through an\
    \ identical lattice."
  mechanism: "Complete view policy for training, \xD71 validation and \xD74 prediction:\
    \ the incumbent's views (axial and fluid coronal/sagittal series at the 120 mm\
    \ wide view, image-centred; coronal and sagittal T1/PD at the 84 mm detail view\
    \ at the rule position), with one change on every selected slice: its window is\
    \ displaced by s \xD7 8 output pixels on both axes, s = +1 for odd and \u2212\
    1 for even native slice index within the series.\n- The two lattices therefore\
    \ differ by 16 px, half the 32 px stride, on both axes (a quincunx). In millimetres:\
    \ \xB14.29 mm on wide views, \xB13.0 mm on detail views; the mean position stays\
    \ the image centre or the rule position.\n- Basis: 8 px is a quarter of the backbone\
    \ stride; it is a structural constant, not a swept setting.\n- Deterministic:\
    \ the displacement is a fixed function of the slice; there is no random jitter\
    \ and training and validation see the same distribution.\n- Real pixels: each\
    \ slice is read once and resampled from native at its view's spacing.\n- Clipping\
    \ per series: detail windows shift, never shrink, inside the 120 mm window and\
    \ the stored image; a wide window that would leave the stored image on an axis\
    \ takes no displacement on that axis for the whole series.\n\nToken positions,\
    \ anatomical axes, half-knee and OA regions follow the actual window through view_to_wide\
    \ and the patient maps."
  precedents:
  - '[Attention probe tokens](/home/claudio/src/knee-abnormality/outputs/analysis/l/label-attention-20261001/x1/tokens.parquet),
    reaggregated on CPU for this refill over 912 studies: mean share of a study''s
