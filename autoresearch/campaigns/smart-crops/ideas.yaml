- id: sagittal-no-vertical-shift
  mechanism_id: sagittal-vertical-placement
  parent_idea_id: fluid-detail-93-replacement
  title: The incumbent with the sagittal windows centred vertically on the image,
    without the 10 mm downward shift
  opportunity: The rule puts every zoomed window 10 mm below the image centre, which
    centres it on the joint line (a median 11 to 12 mm below the image centre on sagittal
    series). On sagittal slices the kneecap and the fluid pouch above it lie above
    the joint line. The rule window leaves under 40 mm above the joint line in 36%
    of sagittal T1/PD series (84 mm) and 16% of sagittal fluid series (93 mm), and
    in reviewed cases it cuts the upper kneecap and the suprapatellar fluid. PF OA
    lost 0.0017 with the T1/PD zoom. This is a guess from measured margins; no run
    points at it.
  mechanism: Complete view policy for training, x1 validation and x4 prediction, one
    view per selected slice. Sagittal T1/PD (84 mm at 0.375 mm) and sagittal fluid
    (93.33 mm at 5/12 mm) windows are centred vertically on the image centre, with
    no downward shift; their horizontal rule is unchanged, 7 mm anterior of the fitted
    knee centre. Coronal windows keep the rule position, 10 mm below the image centre.
    Axial series keep the incumbent's axial view at launch. Fallback and clipping
    as in the incumbent. No jitter, no crop, no second view.
  precedents:
  - Sagittal margins at the rule window, T1/PD 84 mm a median 43 mm above and 41 mm
    below the joint line, under 40 mm above in 36% and under 30 mm below in 13%; fluid
    93.33 mm 48 mm above and 45 mm below, 16% and 7% (outputs/analysis/v/view-spacing-20261002/report.md).
  - Image review, the sagittal detail window excludes the superior patella and the
    suprapatellar fluid in some slices (docs/data-preparation/plane-fluid-spacing-review.md).
  novelty: First change of the vertical placement.
  coverage: Sagittal T1/PD and sagittal fluid slices, 37% of a study's slices, move
    10 mm up; the rest is the incumbent.
  exploitation: Activation, at epoch 0, the mean vertical window centre of both sagittal
    types within 1 mm of zero while the coronal ones stay within 1 mm of 10 mm. Logs
    as the incumbent. Read against the incumbent, PF OA and effusion for what the
    upper field gives, contusion, fracture and the menisci for what the lower 10 mm
    took.
  budget: 26 inputs of 224 px; the incumbent took 1,134 s. Estimate 1,100-1,200 s.
  implementation: One new view policy value on the incumbent's code, no legacy branch.
    The vertical offset of detail_position becomes a per-plane value, 10 mm for coronal
    and 0 for sagittal. Nothing else changes. Preprocessing identity updated.
  open_choices: None. Both sagittal contrasts change together. User seed, 2026-10-02.
  dependencies: []
  priority_rationale: User seed, forced, 2026-10-02; the least supported of the four,
    so it runs last.
