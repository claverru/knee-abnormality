- id: two-views-112-fluid-140
  mechanism_id: two-views-per-slice
  parent_idea_id: null
  title: As two-views-fluid-140 with the main view narrowed to 112 mm (0.5 mm) on
    every slice
  opportunity: 'If a second, wider view gives the periphery back, the main view no
    longer has to hold it and can be finer. 112 mm at 224 px is 0.5 mm, the most common
    acquired resolution: it keeps the full acquired detail of 35-37% of T1/PD and
    60% of fluid coronal and sagittal series, against 18-23% and 37-44% at 0.536 mm.
    A 112 mm view on every series has never been run: the contrast split gave it to
    T1/PD series only, with fluid at 140 mm, and tied 120 mm. Alone, 112 mm would
    cut the periphery further; in September the centred 112 mm crop cost Baker''s
    cyst 0.028 because the cyst lay outside 112 mm and inside 140 mm. Here the fluid
    slices keep a 140 mm view.'
  mechanism: 'View policy: every selected slice is read at a narrow view, 112 mm at
    224 px (0.5 mm), image-centred, through the ResNet-18, in place of the 120 mm
    wide view. Every slice of a fluid-sensitive series (fluid_sensitive 1, fat_suppression
    1), in all three planes, is also read at the context view, 140 mm at 224 px (0.625
    mm), image-centred, through the Refined-RadImageNet ResNet-10t, exactly as in
    two-views-fluid-140: backbone learning rate 6e-5, L2-SP anchored, its own projection
    at the default initialization, a zero-initialized view embedding, token positions
    in one shared frame, the plane-contrast readout row of the series type, and the
    joint pool directly at full weight from the first step, with no gate. Slice selection
    keeps the 60 mm radius. No crop, no per-stream loss.'
  precedents:
  - 'contrast-split-112-140 (mixed-field): T1/PD at 112 mm and fluid at 140 mm scored
    +0.0015 against the 140 mm reference and -0.0003 against 120 mm on every series;
    its 112 mm tokens alone scored 0.859 at x1 (prior-work.md, Precedent table).'
  - 'Acquired resolution at 0.5 mm: coronal T1/PD 35%, sagittal T1/PD 37%, fluid 60%
    fully resolved; at 0.536 mm 18%, 23% and 37-44% (prior-work.md, Acquired resolution).'
  - 'Centred 112 mm crop, September: Baker''s cyst -0.028, the cyst outside 112 mm
    and inside 140 mm in two of three reviewed studies (docs/research/geometry-and-views/input-resolution.md).'
  - The 120 mm field already cuts more than 10 mm of tissue on a coronal side in 30-31%
    of series and more than 20 mm of popliteal tissue in 34% of sagittal ones (prior-work.md,
    What the 120 mm field already cuts).
  novelty: First 112 mm view on every series, and first main view narrower than 120
    mm with a wider view beside it.
