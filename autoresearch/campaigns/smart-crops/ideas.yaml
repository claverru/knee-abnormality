- id: oa-compartment-readers
  mechanism_id: label-routed-crop
  parent_idea_id: oa-routed-compartment-crops
  title: Compartment crops on coronal T1/PD and fluid slices, each routed to the OA
    label of its own side and trained by its own loss
  opportunity: 'crop-compartments raised lateral OA by 0.0054 and left medial OA at
    -0.0007. Three readings of the campaign say why and what to change. First, medial
    OA rose only in runs that changed a fluid view (+0.0022 to +0.0036 in six runs,
    the incumbent among them) and never from T1/PD crops (-0.0011 to +0.0023 in six
    runs); coronal fluid is the coronal type medial OA uses most per slice (1.28 of
    a uniform share against 1.06 for coronal T1/PD), and the crops were cut from T1/PD
    only. Second, the crop tokens were weak readers of medial OA: alone they scored
    0.897 at x1 against 0.935 for the wide tokens, so adding them to the pool changed
    nothing. crop-own-loss, which trained the crop tokens under their own loss, is
    the only crop run in which both OA labels rose (medial +0.0023, lateral +0.0034).
    Third, each crop''s tokens entered every label''s pool, which cost Baker''s cyst
    and contusion; oa-routed-compartment-crops tests the routing alone.'
  mechanism: Complete view policy for training, x1 validation and x4 prediction. The
    incumbent's views are unchanged, one per selected slice. In addition every coronal
    slice, T1/PD and fluid-sensitive, has two crops, 60 mm at 160 px (0.375 mm, 5x5
    tokens), middle slice only, one centred 22 mm medial and one 22 mm lateral of
    the fitted knee centre, both 10 mm below the image centre, rule-placed in every
    epoch and at prediction. A series without trusted geometry has one crop centred
    horizontally on the image centre. Crops are shifted, never shrunk, to stay inside
    the image-centred 120 mm window and the stored image. Training jitter of the crop
    positions is the campaign's uniform draw of up to 12 mm per axis, per series and
    step; validation and prediction are deterministic. Routing, fixed. Medial crop
    tokens are allowed in the attention pool of Medial OA only, lateral crop tokens
    in that of Lateral OA only, and the single crop of an untrusted series in both;
    they are masked out of the pool of every other label. In the OA detector a crop
    token counts in the region of its own side and not in the anterior one. Crop tokens
    are excluded from the half-knee path and from the report-attribute heads. Own
    loss, fixed. Beside the joint pool, the medial crop tokens of a study are pooled
    alone into a Medial OA logit and the lateral ones into a Lateral OA logit, with
    the same attention scorer and readout rows, and these two logits take the class-balanced
    soft BCE of the disease loss at trainer.crop_loss_weight 0.1, over studies that
    have such tokens. Prediction uses the joint pool only. No sagittal crop.
  precedents:
  - 'Medial OA at x4 against rn18-field-120-control (0.9388): sagittal-fluid-detail-rectangle
