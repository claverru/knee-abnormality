- id: crop-rule
  mechanism_id: crop-rule-placed
  parent_idea_id: null
  title: Every slice at the wide view, T1/PD coronal and sagittal slices also at a
    rule-placed 60 mm crop at 0.375 mm
  opportunity: 'A detail view that replaces the wide one gives up more of the periphery,
    which 120 mm already cuts. A crop beside the wide view keeps it and adds the acquired
    detail where the detail labels look. In September 0.5 mm crops gained on ACL (+0.011)
    and lost on the labels whose regions the crops left out; here every slice keeps
    its wide view. This seed is also the control for learned placement: the later
    seeds differ from it only in where the window sits.'
  mechanism: 'View policy: every selected slice is read at the wide view (120 mm at
    224 px); every slice of a T1/PD coronal or sagittal series is also read at a crop,
    60 mm at 160 px (0.375 mm, 5x5 tokens), in training, validation and prediction.
    The crop sits at the rule position of its series (as t1pd-detail-84), with training
    jitter of up to 12 mm per axis, per series and step, and none in validation and
    prediction. The crop is the middle slice only, reuses the native rows read for
    the wide view and the wide view''s intensity bounds, and is augmented as its own
    acquisition, without contrast mixing. Crop tokens go through the shared backbone
    and projection, take their 2D position in the wide view''s frame, add a zero-initialized
    view embedding and enter the joint pool directly at full weight, with no gate.
    No crop loss.'
  precedents:
  - 'Per-label crops, 112 mm at 0.5 mm on 75% of slices replacing the full slice:
    -0.0011, ACL +0.0111, synovitis +0.0077, medial OA +0.0057, lateral meniscus -0.0102,
    fracture -0.0085 (docs/history/crop-selection-investigation.md).'
  - A 60 mm window at one position for all studies keeps 0.55 of ACL, 0.56 of medial-meniscus
    and 0.49 of lateral-meniscus attention on the 140 mm control (prior-work.md, Where
    the model looks).
  - Crop jitter was called crucial by the RSNA lumbar winners (docs/research/geometry-and-views/learned-crop-selection.md).
  - 'two-stream-paired: a second stream behind a zero-initialized gate never trained
    (0.506 alone); views sharing the backbone were both used, 0.859 and 0.916 alone
    for the contrast split (prior-work.md, Precedent table).'
  novelty: First crop beside an unchanged wide view, first 60 mm window and first
    second input shape on the current recipe.
  coverage: About 9 crops per study on top of 26 wide slices. A 60 mm window cannot
    hold both compartments of a coronal slice; at the knee centre it holds the notch
    and the inner halves.
  exploitation: view_share_crop; attention_mass_view_<label> against the crop tokens'
    share of tokens; val_macro_auc_view_wide and val_macro_auc_view_detail per label;
    the window centre's mean and spread per plane; per-label AUC against the incumbent,
    the reference and t1pd-detail-84.
  budget: 35 images per study against 26 (1.35x) at 1.18x the backbone pixels. Mixed-field
    time tracked backbone compute, so expect about 1,360-1,550 s; the bound is 1,724
    s.
  implementation: 'Replaces the incumbent''s view policy. The crop is a second input
    shape: its own image tensor and per-series metadata in the batch, its own resample
    plan with the window offset, the wide view''s bounds; encoding of the two shapes
    and concatenation of their tokens in modeling/, with the plane-contrast readout,
    half-knee and report-attribute paths taking tokens of both shapes (a crop token
    is scored by the readout row of its series type); a second fixed-chunk graph for
    160 px in inference/engine.py. If t1pd-detail-84 was accepted, its loader offset,
    view index and embedding are reused. Activation signature: attention_mass_view_mean
    of at least 0.05 at epoch 0.'
  open_choices: None. Size and spacing are fixed by the contract; the jitter is one
    crop token.
  dependencies: []
  priority_rationale: Second because every learned placement is measured against it
    and it carries the plumbing they share.
