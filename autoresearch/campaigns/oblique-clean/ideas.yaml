- id: acl-gated-oblique-tokens
  mechanism_id: oblique-tokens-gated-to-acl-attention
  parent_idea_id: null
  title: Let tokens from fluid-sensitive oblique groups enter the ACL attention only
  opportunity: 'The reference''s loss sits in the studies it changes: on the 103 fold-0
    split studies its macro AUC is 0.8566 against 0.8667 for k_05 (paired bootstrap
    +0.0103 [-0.0027, +0.0234]), with MCL -0.058 (11 positives) and lateral meniscus
    -0.028 (22), while the 802 unchanged studies score the same (0.9017 against 0.9018).
    The dedicated fluid obliques are ACL views (COR ACL T2W FS), and their extra tokens
    appear to dilute attention for other labels. On k_05 at x4, giving the oblique
    group its own budget but letting its tokens vote only for ACL improved the 102
    affected studies by +0.0020, against -0.0001 for the same budget without the gate.'
  mechanism: In _attention_pool, tokens of acquisitions in a fluid-sensitive oblique
    group (coronal fluid and axial fluid) are masked out of every label's softmax
    except ACL, as a fixed prior with no learned parameters. Standard series and non-split
    slots are unchanged, and split studies always keep their standard tokens, so no
    label loses all its tokens.
  precedents:
  - outputs/analysis/tilted-slot-policies-v2-k05-20260922/results.csv (additive_acl
    +0.0020 and intact_acl +0.0011 on the affected subset against additive -0.0001,
    k_05 at x4 tau 0.75)
  - outputs/analysis/acquisition-geometry-20260922/localize_campaign.py (split-study
    and unchanged-study macro AUC for the reference, k_05 and each candidate)
  - autoresearch/campaigns/oblique/prior-work.md#what-the-oblique-groups-are (descriptions
    of the fluid obliques)
  - outputs/autoresearch/oblique/experiments/oblique-group-embedding-20260922T115506Z-f5d616dd/changes.diff
    (flag plumbing to reuse)
  novelty: 'A fixed routing prior instead of a learned one: label-view-attention-bias
    must learn 108 values from about 12% of studies, while the gate encodes what the
    protocol was acquired for.'
  coverage: Sampling and counts identical to the reference; only attention masks change,
    in split studies with a fluid oblique group.
  exploitation: ACL keeps the dedicated view's evidence; MCL, the menisci and the
    other labels stop paying for the extra tokens.
  budget: A boolean per acquisition and one mask; no parameters, no extra compute.
  implementation: Adds behavior. Reuse the oblique flag plumbing of oblique-group-embedding
    (one PreparedSeries field set in dataset.py, carried through collate_studies)
    and mask scores in _attention_pool behind one setting under model.oblique naming
    the allowed labels. The embeddings, scorer, anatomical term and heads stay. Report
    split-study and unchanged-study macro and per-label AUC against both the reference
    and k_05.
  open_choices: Whether coronal T1/PD oblique groups are gated too (their studies
    are OA-rich, so the default leaves them ungated); a hard mask or a large fixed
    negative bias.
  dependencies: []
  priority_rationale: The only fix with a direct paired test on the affected studies,
    it targets the measured MCL and lateral meniscus loss, and it costs nothing.
  status: completed
  created_revision: 5
  ranking_rationale: "I admitted two of the three imported proposals. Both have no\
    \ dependencies, sit inside the contract's scope (zero-sum redistribution within\
    \ a slot, and which series an evaluation bag scores) and are new mechanisms.\n\
    \n- `oblique-training-only-views` goes second. It is the most direct test of the\
    \ localized loss: on the split studies at x1, `k_05` beat the oblique reference\
    \ by +0.0103, mostly MCL and lateral meniscus. On frozen `k_05`, standard-only\
    \ scoring of the split slots gained +0.0066 on the subset at x1 and +0.0011 to\
    \ +0.0026 at x4, while the full fold did not move. Training is identical to the\
    \ reference, so the run separates what the oblique views add to training from\
    \ what they cost when scored. It costs no extra compute. It stays behind the ACL\
    \ gate, which keeps the view where the evidence says it helps (+0.0020 on 102\
    \ affected studies on `k_05` at x4).\n- `coverage-matched-slot-split` goes fourth.\
    \ It is exact and zero-sum within each slot, and it tests the one budget direction\
    \ nobody has tried (more coverage for the full-knee standard series). But budget\
    \ changes alone have not moved fold 0 so far, so it ranks below the depth-frame\
    \ representation idea.\n- `oblique-group-embedding` drops to last, making five\
    \ in the queue. Alone it was rejected at x1, and combined with the view bias it\
    \ was rejected at x4 (\u22120.0006, with ACL \u22120.0086 and lateral meniscus\
    \ \u22120.0080). It stays in the queue as the only test of the identity mechanism\
    \ alone at x4 on the cleaned source.\n\n`oblique-standard-statistics-alignment`\
    \ stays proposed and is not queued. Its own priority rationale ties its value\
    \ to whether the embedding repairs the pairs between split and unchanged studies\
    \ at x4. At x4 the Coronal0 level shift nets out (\u22120.0001), and zero-initialized\
    \ gates in this repository have stayed near zero. Taking it would push the queue\
    \ past five. Reconsider it after the embedding result."
