- id: oblique-standard-statistics-alignment
  mechanism_id: per-study-oblique-feature-statistics-alignment-to-slot-standard-series
  parent_idea_id: null
  title: Align each oblique group's token feature statistics to the standard series
    in its slot, per study, behind a zero-initialized gate
  opportunity: "The scorer and heads that read oblique-group tokens were trained mostly\
    \ on standard series, and the oblique groups use different protocols from the\
    \ series they share a slot with:\n- On fold 0, all 47 Coronal0 oblique groups\
    \ are T2 TSE and sit in the T1/PD slot. 45 of them are Bondorf-type coronals (Siemens\
    \ t2_tse_bond*, Philips T2W_BONDORF). The Coronal1 groups are mostly fat-suppressed\
    \ ACL slabs.\n\nMeasured effects of the mismatch:\n- In the 47 Coronal0 split\
    \ studies, the reference sets OA and medial-meniscus logits 0.27 lower than k_05\
    \ at \xD74 \u03C40.75, and positives and negatives shift alike. The protocol,\
    \ not the pathology, moves the level (shift_by_kind.txt, kind_pairs_x4.txt).\n\
    - On frozen k_05 and k_075, reading a split slot from its oblique group alone\
    \ lost 0.0044\u20130.0103 subset AUC, mostly MCL and PF OA. This is confounded\
    \ by slab coverage.\n- At \xD71, the per-type constant embedding was the only\
    \ candidate that repaired split-vs-unchanged pairs: net +0.0005 of k_05's +0.0011\
    \ (x1_candidates.txt). A constant cannot follow the contrast differences between\
    \ the two groups in each study."
  mechanism: "For each study and each split slot (a slot with visually valid tokens\
    \ from both groups), take the per-channel mean and std of the projected 256-d\
    \ features over the visually valid tokens of each group: \u03BC_s, \u03C3_s for\
    \ the standard group and \u03BC_o, \u03C3_o for the oblique group, in fp32.\n\n\
    Each oblique-group token x becomes x + \u03B1_g \u2299 (\u03C3_s \u2299 (x \u2212\
    \ \u03BC_o)/(\u03C3_o + \u03B5) + \u03BC_s \u2212 x). Here \u03B1_g is a zero-initialized\
    \ per-channel gate for each splittable type. This is AdaIN with the same study's\
    \ standard series as the style reference.\n\nNeutrality and scope:\n- The positional,\
    \ plane and contrast codes are added afterwards as today, so only appearance statistics\
    \ change.\n- Standard tokens, non-split slots and non-split studies are untouched,\
    \ and \u03B1 = 0 reproduces the reference exactly.\n\nBoth groups image the same\
    \ knee in the same session and share its labels. The alignment can therefore remove\
    \ offsets caused by protocol and contrast (a T2 Bondorf series read in the T1/PD\
    \ slot, a fat-suppressed slab beside a standard coronal) without the label-shift\
    \ failure of population-level alignment. Variation between tokens within a group,\
    \ which carries the lesion signal, is kept up to a per-channel rescale."
  precedents:
  - 'Huang & Belongie 2017, AdaIN (arXiv:1703.06868): transfers per-instance channel
    mean and std from a reference. Here the reference is the study''s own standard
    series.'
  - 'Li et al. 2016, AdaBN (arXiv:1603.04779), and Chang et al. CVPR 2019, DSBN (arXiv:1906.03950):
    domain-specific normalization statistics for inputs from different domains that
    share one network.'
  - 'docs/research/medial-lateral-transfer.md footnote 16 (Zhao et al. ICML 2019):
    unconditional feature alignment fails under label shift. Per-study alignment is
    conditioned on the same knee and the same labels.'
  - "Retired \xD71 oblique-group-embedding-20260922T115506Z-f5d616dd, the closest\
    \ mechanism (a constant per-type shift before mil_norm): +0.0052 on split studies;\
    \ split-vs-unchanged pairs net +0.0005, of which Coronal0 contributed +0.0004\
    \ to the su term. View bias \xD71: +0.0004 net; residual readout: \u22120.0005\
    \ net (scratch/evidence/x1_candidates.txt)."
  - "outputs/analysis/tilted-slot-policies-check-20260922 and -v2check-20260922/results.csv:\
    \ the tilted-only slot pass on frozen k_05 and k_075 lost 0.0044\u20130.0103 subset\
    \ AUC (confounded by slab coverage, per the oblique-feature-adapter record)."
  - 'oblique-feature-adapter, declined by the user as part of the identity family:
    a learned low-rank branch. Also docs/backlog/small-changes.md#planecontrast-specific-feature-adapters
    (all studies, general backlog). This idea learns no feature branch.'
  - 'docs/validation/results/2026-09-16-label-private-crops-result.md: a zero-initialized
    FiLM stayed near zero (mean |scale| 0.02). The gate here may do the same.'
  - 'New evidence: outputs/autoresearch/oblique-x4/jobs/researcher-20260922T145144Z-bef067e9/scratch/evidence/{pair_decomposition,shift_by_kind,kind_pairs_x4,kind_net,x1_candidates,tau_pairs}.{py,txt};
    fold-0 series descriptions in researcher-20260922T142228Z-40754723/scratch/evidence/cor0_descriptions.txt.'
  novelty: 'No idea in the registry uses the study''s own standard series as a reference
    for the oblique group:

    - oblique-group-embedding adds one learned constant per type.

    - The declined adapter learns a branch that depends on the features.

    - oblique-standard-frame-depth corrects positional codes, not appearance.

    - The view bias, the ACL gate and mixture pooling change attention mass or pooling.


    Here the transform is computed in each study from the two groups'' token statistics,
    and only its strength per channel (768 gates) is learned. It is harmonization,
    not identity marking, so it can follow differences between protocols and scans
    that a per-type constant cannot.'
  coverage: "Only oblique-group tokens in split slots change: 103 fold-0 studies (47\
    \ Coronal0, 54 Coronal1, 2 axial fluid) and about 545 training studies. The other\
    \ 802 fold-0 studies and all standard tokens get the reference forward pass at\
    \ any fixed weights; they change only through shared training. Sampling, triplets,\
    \ visits, \xD71 validation selection and the input identity are unchanged, because\
    \ the oblique flag is attached after preparation. Series dropout removes both\
    \ groups of a (study, type) together, so a dropped slot never leaves one group\
    \ without its reference."
  exploitation: "Expected signature: in the Coronal0 split studies, OA and medial-meniscus\
    \ logits move back toward k_05's level relative to unchanged studies (0.27 lower\
    \ today at \xD74 \u03C40.75). Coronal1 contusion and ACL gains should hold.\n\n\
    Checks and reporting:\n- Within-model check: re-predict the trained candidate\
    \ with \u03B1 = 0. Only split-study predictions change, which separates the mechanism\
    \ from same-seed divergence.\n- Report the pair strata (ss, su, us, uu) with scratch/evidence/pair_decomposition.py\
    \ rather than within-split AUC alone. Within-split pairs are only 1\u20133% of\
    \ each label's pairs."
  budget: "No change to triplets, decoding or the backbone.\n- Added work: per batch,\
    \ scatter-add sums and sums of squares over at most a few thousand tokens \xD7\
    \ 256 channels, then one elementwise transform of oblique tokens. That is well\
    \ under 0.5% of the 1,653 s reference.\n- Parameters: 768 (3 \xD7 256). Memory\
    \ adds a few [groups, 256] buffers.\n- Accounting is identical to the reference\
    \ by construction, and \xD74 prediction uses the same deterministic path."
  implementation: 'Adds behavior and removes nothing.

    - preparation.py: add PreparedSeries.oblique: bool = False.

    - dataset.py: in _prepare_slot, after both groups are prepared, apply dataclasses.replace(oblique=True)
    to the oblique group''s values. Call order and budgets stay unchanged. collate_studies
    emits series_oblique. Reuse the flag plumbing of label-view-attention-bias-20260922T134812Z-7b4fa495/changes.diff.

    - model.py: move series_oblique to the device yourself, because engine.move_batch
    leaves unlisted keys on the CPU. Index it with keep_series, and map images to
    (study, type, oblique) through acquisition_index. After feature_geometry supplies
    visual_valid, compute the group statistics outside autocast and transform the
    oblique rows of features. Add a zero-initialized parameter of shape [type_count,
    256] and use only the splittable types.

    - Config: one setting, model.oblique.feature_alignment. Remove it if the idea
    is discarded; make it unconditional if adopted.

    - If the embedding or the embedding + view-bias combination becomes the incumbent,
    keep it and apply the alignment before the embedding is added. If depth-frame
    or the ACL gate is adopted, keep them; they act on other components.'
  open_choices: "- Moments: mean and std (recommended; contrast differences scale\
    \ channels) or mean only.\n- Statistics: detached (recommended; the oblique path\
    \ should not reshape standard features) or differentiable.\n- Gate: per channel\
    \ and per type (recommended), or one scalar per type. Stored in 2-D, it gets weight\
    \ decay toward the neutral value.\n- Reference tokens: all valid standard tokens\
    \ (recommended), or only those inside the oblique slab's patient-space footprint\
    \ (thin slabs cover about 45 mm).\n- Guard: \u03B5, plus a minimum count of valid\
    \ tokens per group."
  dependencies: []
  priority_rationale: "It is distinct and cheap, neutral at initialization, and it\
    \ acts on the protocol mismatch that the constant embedding partly repaired at\
    \ \xD71. Uncertainty is high:\n- At \xD74 the Coronal0 level shift cancels between\
    \ the su and us pair terms (net \u22120.0001), so any gain must come from reading\
    \ oblique content better, not from repairing the level.\n- Zero-initialized gates\
    \ stayed small in this repository before.\n\nRanking: after the running combination\
    \ and the ACL gate. If the combination shows the embedding repairing split-vs-unchanged\
    \ pairs at \xD74, run this as its per-study extension; if it shows nothing, rank\
    \ this lower."
  status: prepared
  created_revision: 7
  ranking_rationale: "This completion confirms the fixed reject for coverage-matched-slot-split\
    \ repair 1. Macro AUC fell by 0.00081, from 0.903705 to 0.902894. The adoption\
    \ 80% interval was [\u22120.00272, +0.00127], so the macro result misses both\
    \ the +0.001 minimum gain and the positive-lower-bound condition.\n\nThe reviewer's\
    \ first concern was that the candidate might realize a different triplet total\
    \ than the reference. That did not happen. Accounting matched the sealed counts\
    \ exactly: 960,190 training triplets, 35,020 visits, 24,770 validation triplets\
    \ per epoch, and the same training and validation cohort hashes. Runtime was 1,670.8\
    \ s against a 1,888 s ceiling.\n\nI admitted oblique-standard-statistics-alignment\
    \ and ranked it second, behind the reserved head. It has no dependencies and stays\
    \ in scope, since it changes how oblique-group tokens are represented. It begins\
    \ neutral because its gate starts at zero. It also targets a measured effect:\
    \ on the Coronal0 T2-Bondorf split studies, oblique-clean sets OA and medial-meniscus\
    \ logits 0.27 lower than k_05. A constant embedding cannot follow that shift from\
    \ study to study, and a per-study statistics alignment can. Nothing else in the\
    \ queue changed."
