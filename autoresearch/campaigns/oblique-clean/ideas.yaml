revision: 125
ideas:
- id: oblique-standard-frame-depth
  mechanism_id: oblique-token-depth-in-standard-series-frame
  parent_idea_id: null
  title: Give oblique-group tokens slice-depth codes in the frame of their slot's
    standard series
  opportunity: "The model relies on its 1D slice-depth code. Removing it cost \u2212\
    0.0007 to \u22120.0030 macro on three checkpoints, and two of the intervals exclude\
    \ 0. Removing the plane or contrast embedding cost about 0. Label evidence also\
    \ sits in 10-mm depth bins. The code is acquisition-relative: each slice's position\
    \ along the series' own normal, measured from that series' midpoint, with one\
    \ value shared by all spatial tokens of the slice. In split slots the oblique\
    \ group therefore uses a different frame. New census measurement over 558 training\
    \ split slots:\n- The oblique normal is a median 35\u201339\xB0 from the standard\
    \ normal.\n- The oblique origin sits a median 11 mm from the standard origin on\
    \ coronal slots, and more than 10 mm in 55\u201359% of coronal groups.\n- Within\
    \ one oblique slice, true depth changes by about \xB123 mm over \xB140 mm of in-plane\
    \ extent, yet every token gets the same code.\n\nAt \xD74 \u03C4 0.75, like-for-like,\
    \ net of drift in the unchanged studies, the reference loses the depth-localized\
    \ labels on the split studies: lateral meniscus \u22120.029 and MCL \u22120.020.\
    \ It gains ACL +0.007."
  mechanism: "Each oblique-group acquisition in a split slot carries an anchor from\
    \ its slot's standard series:\n- n_s, the standard series' unit normal (cross\
    \ product of its orientation vectors, the same convention as its physical positions);\n\
    - o_s, the standard series' origin, equal to physical_position \u2212 relative_position_mm\
    \ of any of its slices.\n\nIn encode_batch, each oblique token's patient coordinate\
    \ p comes from its middle-slice patient map and prepared_xy. The medial-axis term\
    \ already computes the x row of p this way. The token's 1D code becomes sinusoidal(n_s\xB7\
    p \u2212 o_s), per token, instead of one acquisition-relative value per slice.\n\
    \nApplied to the standard series itself, the formula reproduces today's code exactly,\
    \ which gives the developer an identity check. Standard tokens and every non-split\
    \ study keep the current code, so their forward pass is unchanged at any weights.\
    \ No parameters are added. Oblique tokens then say how deep they sit in the same\
    \ frame as the standard tokens beside them. Depth-specific scoring (MCL at \u2212\
    10..0 mm and the meniscal horns at +10..+20 mm in coronal fluid) no longer matches\
    \ oblique tokens to the wrong anatomy."
  precedents:
  - "outputs/analysis/encoding-usage-{graph-forced,token-graph,attention-prior}/results.json:\
    \ removing the 1D code cost \u22120.0030 [\u22120.0043, \u22120.0018], \u2212\
    0.0012 [\u22120.0022, \u22120.0001] and \u22120.0007 macro. Removing the 2D code\
    \ cost \u22120.0001 to \u22120.0007; removing plane or contrast cost about 0."
  - "docs/validation/results/2026-09-17-test-time-allocation.md#where-evidence-sits-along-the-slice-axis:\
    \ each label's strongest single-triplet separation falls in one 10-mm depth bin:\
    \ MCL and contusion in coronal fluid at \u221210..0 mm, the medial meniscus at\
    \ +10..+20 mm, ACL in sagittal fluid at \u221210..0 mm."
  - "Code: series.py:199-210 (relative_position_mm = physical \u2212 (min+max)/2);\
    \ dicom.py:67-86 (physical = IPP\xB7cross(IOP)); model.py:320-338 (per-token patient\
    \ maps for the medial axis; position_1d is one value per slice); preparation.py:220-228\
    \ (patient_maps rows give patient x, y, z of prepared pixels)."
  - "outputs/autoresearch/oblique-x4/jobs/researcher-20260922T142228Z-40754723/scratch/evidence/depth_frame.{py,txt},\
    \ a new census measurement over training split slots (26 axial fluid, 295 coronal\
    \ T1/PD, 237 coronal fluid):\n- No sign flips between the oblique and standard\
    \ normals; median angle 35\u201339\xB0.\n- Median offset of the oblique mid-slice\
    \ from the standard origin, along the standard normal: 11 mm on coronal slots\
    \ (over 10 mm in 55\u201359%), 5 mm on axial.\n- About \xB123\u201325 mm of depth\
    \ change across \xB140 mm in-plane."
  - "Same folder, split_x4.{py,txt}: k_05 intact vs the reference, both at \xD74 \u03C4\
    \ 0.75 (no \xD74 \u03C4 1 k_05 run exists).\n- Split studies: +0.0042 [\u2212\
    0.0059, +0.0143], against +0.0103 at \xD71.\n- Reference net of unchanged-study\
    \ drift: lateral meniscus \u22120.029, MCL \u22120.020, effusion \u22120.012,\
    \ ACL +0.007.\n- The lateral meniscus loss sits in the 54 coronal-fluid split\
    \ studies: 0.824 against 0.869, 13 positives."
  - "label-view-attention-bias-20260922T134812Z-7b4fa495, \xD74 reject: split studies\
    \ +0.0035, with MCL +0.038, lateral meniscus +0.029 and ACL \u22120.011. It is\
    \ a routing repair; this proposal tests a competing cause, oblique tokens' depth\
    \ codes being in the wrong frame, rather than dilution."
  - view-orientation-embedding (declined by the user; it adds a new orientation embedding
    to every acquisition) and the big-bets additive 3D patient-position embedding,
    which went unused at inference. Both add new codes; this one corrects the frame
    of a code the model already uses.
  - 'docs/research/position-encoding.md (multi-view geometry references such as PETR:
    express tokens from differently oriented views in one shared metric frame).'
  novelty: 'Nothing in the registry changes an existing positional code. The identity
    ideas (embedding, view bias and their combination) mark or reweight oblique tokens,
    and mixture pooling and the ACL gate change pooling. All of them leave each oblique
    token''s depth code in its own acquisition frame. This idea adds no embedding
    and no parameters, and touches only oblique-group tokens. It is a coordinate correction:
    the model is given consistent geometry instead of having to learn per-protocol
    offsets from about 12% of studies.'
  coverage: 'Sampling, triplets, visits, validation selection and the input identity
    are all unchanged: the anchor is attached after preparation, like the oblique
    flag. Only oblique-group tokens in split studies get new codes: 103 fold-0 studies
    and about 545 training studies. The other 802 fold-0 studies have the reference
    forward pass at any fixed weights and change only through shared training.'
  exploitation: "Expected signature on the split studies: lateral meniscus, MCL, medial\
    \ meniscus and contusion rise relative to the drift in the unchanged studies,\
    \ and ACL holds. There is a within-model check: re-predicting the trained candidate\
    \ with acquisition-relative oblique depths changes only split-study predictions.\
    \ This isolates how much the trained model reads the corrected codes, apart from\
    \ training divergence. Completions report split and unchanged deltas against the\
    \ reference, and against k_05 at \xD74 where available."
  budget: No change to triplets, decoding or the backbone. The added work is per-token
    dot products on patient coordinates that the medial-axis term already computes,
    plus one sinusoidal encoding for oblique images. That is well under 1% of the
    1,653 s reference, and memory adds one per-token encoding buffer for oblique images
    only. Accounting is identical to the reference by construction.
  implementation: "Adds behavior; removes nothing.\n- preparation.py: PreparedSeries\
    \ gets depth_anchor: tuple[float, float, float, float] | None = None.\n- dataset.py\
    \ _prepare_slot: after both groups are prepared, choose the first standard uid\
    \ in the standard group's source_ranking. Take its IndexedSeries from _slice_index\
    \ to get the normalized geometry.normal and origin = physical_position \u2212\
    \ relative_position_mm, then dataclasses.replace each oblique value with that\
    \ anchor. Call order and budgets stay unchanged.\n- collate_studies emits series_depth_anchor\
    \ [series, 4], NaN when absent.\n- model.py: move the anchor to the device, because\
    \ engine.move_batch leaves unlisted keys on the CPU. Index it with keep_series\
    \ and acquisition_index. Compute per-token depth and make position_1d per token\
    \ for anchored images, broadcasting the existing per-slice code elsewhere. Handle\
    \ reflection the way the medial-axis term does.\n- Config: one setting under model.oblique.\
    \ Remove it if the idea is discarded; make it unconditional if adopted.\n- If\
    \ another oblique idea becomes the incumbent, rebase, keep it and reuse its flag\
    \ plumbing; the two act on different components."
  open_choices: "- Anchor series when the standard group holds several: first in the\
    \ source ranking (recommended, fixed across epochs) or the main supplier in each\
    \ epoch.\n- Scope of the fix: 1D depth only (recommended; the model's reliance\
    \ on 2D is 3\u201310\xD7 smaller), or also re-project the 2D code onto the standard\
    \ series' in-plane axes.\n- Neutrality: a parameter-free replacement (recommended;\
    \ review precedent from mixture pooling), or a zero-initialized scalar blend between\
    \ the old and new codes if strict neutrality is required.\n- Axial-fluid oblique\
    \ groups (2 on fold 0): include them (recommended)."
  dependencies: []
  priority_rationale: "It rests on two measured facts: the model relies on the 1D\
    \ code, and the frame mismatch is large (median 11 mm offset, \xB123 mm within\
    \ a slice). It acts only on split-study tokens, costs nothing and opens a lever\
    \ no other idea tests. Uncertainty: that miscoded depth causes the lateral meniscus\
    \ and MCL loss is a hypothesis, and the model may already compensate from appearance.\
    \ The split-study gain may also be too small for the macro rule. Rank it after\
    \ the running mixture and the developing combination, and ahead of the plain embedding."
  status: completed
  created_revision: 5
  ranking_rationale: "I'm admitting `acl-gated-oblique-tokens-token-mask` and ranking\
    \ it second, directly behind the reserved head. It has no dependencies, so the\
    \ admission gate is satisfied.\n\nIt uses the same mechanism as `acl-gated-oblique-tokens`.\
    \ That idea's only attempt (8ff84619) crashed on the first batch because the gate\
    \ flag was never expanded from one value per acquisition to one per spatial token\
    \ (162 flags against 7,938 tokens = 162 \xD7 49). The run produced no evidence\
    \ either way, and the idea is no longer in the live queue. This proposal carries\
    \ the fix and adds two requirements: a no-NaN guard (gate a token only if the\
    \ study keeps at least one valid ungated token for that label) and a CPU shape\
    \ check through `encode_batch`, `pool_encoded` and the loss.\n\nThe idea stays\
    \ second because it is the only oblique idea with a prior pointing the same way.\
    \ Its gate adds no parameters or compute, and it leaves sampling and triplet counts\
    \ unchanged.\n\nThe prior's strength is overstated in the proposal, though. In\
    \ the analysis CSV, `additive_acl` on `k_05` at \xD74 \u03C4 0.75 changes whole-cohort\
    \ macro AUC by only -0.00002, with a 95% interval of [-0.0007, +0.0006]. The +0.0020\
    \ comes from the 102-study affected subset alone. On the full cohort, even a real\
    \ subset gain of that size would be diluted to roughly +0.0002, well short of\
    \ the +0.001 adoption bar. The idea can only be adopted if the gate works much\
    \ better with the gate present during training than the post-hoc policy replay\
    \ suggests. That is plausible, since attention can then re-learn, but it is unproven.\n\
    \n`oblique-standard-statistics-alignment` stays proposed, for the reason recorded\
    \ before."
  experiments:
