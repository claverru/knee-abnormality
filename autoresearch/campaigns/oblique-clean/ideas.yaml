- id: oblique-training-only-views
  mechanism_id: oblique-groups-in-training-only
  parent_idea_id: null
  title: Train with oblique groups but evaluate split slots on their standard series
    alone, at the same validation count
  opportunity: The reference's loss is on the evaluated studies it changes, and on
    k_05 dropping the tilted series at inference improved the affected subset (+0.0066
    at x1, +0.0011 to +0.0026 at x4) while the full fold barely moved. The oblique
    views may help most as extra training evidence, and least as extra tokens competing
    at evaluation.
  mechanism: Training keeps the reference's split slots. In validation and inference,
    a split slot gives its whole combined count, the standard budget plus the oblique
    budget, to its standard series, capped by that series' capacity, so validation
    x1 triplets per epoch equal the reference exactly and no oblique token is scored.
  precedents:
  - outputs/analysis/tilted-slot-policies-check-20260922/results.csv (standard-only
    subset +0.0066 at x1)
  - outputs/analysis/tilted-slot-policies-v2-k05-20260922/results.csv (standard-only
    subset +0.0011 at x4)
  - outputs/analysis/acquisition-geometry-20260922/oblique_reach.txt (standard series
    capacity of 28 windows in coronal fluid and 30 in coronal T1/PD)
  novelty: Uses the oblique views as training data only; no earlier run separated
    their training value from their evaluation value.
  coverage: Training coverage identical to the reference; at evaluation the standard
    series of a split slot gains the oblique group's share.
  exploitation: The model still learns from the dedicated views, and its scored bags
    match k_05's series mix with more standard coverage.
  budget: No extra triplets; validation count identical by construction at x1.
  implementation: 'Adds behavior in dataset.py: in evaluation mode (no training seed)
    a split slot routes its combined count to the standard group. Behind one setting
    under data.oblique. Record the changed deterministic validation selection identity.'
  open_choices: How to handle multipliers where the combined count exceeds the standard
    series' capacity at inference (cap and accept fewer triplets, or give the rest
    to the oblique group).
  dependencies: []
  priority_rationale: Tests the most direct reading of the localization, that oblique
    tokens cost the scored split studies, at no compute cost; lower than the gate,
    which keeps the ACL view.
