- id: acl-gated-oblique-tokens-token-mask
  mechanism_id: oblique-tokens-gated-to-acl-attention
  parent_idea_id: acl-gated-oblique-tokens
  title: Let tokens from fluid-sensitive oblique groups enter the ACL attention only,
    with the gate expanded to spatial tokens
  opportunity: 'The reference''s loss sits in the studies it changes: on the 103 fold-0
    split studies its macro AUC is 0.8566 against 0.8667 for k_05 (paired bootstrap
    +0.0103 [-0.0027, +0.0234]), with MCL -0.058 (11 positives) and lateral meniscus
    -0.028 (22), while the 802 unchanged studies score the same (0.9017 against 0.9018).
    The dedicated fluid obliques are ACL views (COR ACL T2W FS), and their extra tokens
    appear to dilute attention for other labels. On k_05 at x4, giving the oblique
    group its own budget but letting its tokens vote only for ACL improved the 102
    affected studies by +0.0020, against -0.0001 for the same budget without the gate.'
  mechanism: In _attention_pool, tokens of acquisitions in a fluid-sensitive oblique
    group (coronal fluid and axial fluid) are masked out of every label's softmax
    except ACL, as a fixed prior with no learned parameters. Standard series and non-split
    slots are unchanged, and split studies always keep their standard tokens, so no
    label loses all its tokens.
