- id: meniscus-folded-medial-position
  mechanism_id: auxiliary-meniscus-position-with-folded-medial-distance
  parent_idea_id: meniscus-position-free-auxiliary
  title: Give the shared meniscus detector distance from the midline while preserving
    its other positional cues
  opportunity: 'Removing every explicit auxiliary position cue did not improve meniscus
    AUC, while detector-ranked public pooling concentrated attention and lost meniscus
    discrimination. A narrower hypothesis remains: the shared auxiliary detector needs
    anatomical location, but its medial coordinate should describe distance into either
    half rather than acquisition position. This changes the detector''s coordinate
    convention without requiring the public medial and lateral classifiers to agree.'
  mechanism: For auxiliary tokens only, define r = abs(medial_axis), using the incumbent's
    fitted midline and transported patient-space token anchors. In sagittal acquisitions,
    replace the slab-relative 1D positional input with tokenwise r in millimetres,
    retaining the existing sinusoidal frequencies and 2D embedding. In coronal and
    axial acquisitions, replace the first input of the auxiliary 2D embedding with
    r/R, where R is the existing physical half-crop extent; retain its second coordinate
    and the existing through-plane encoding. Reuse the positional modules, plane/contrast
    embeddings, normalization and shared detector. Keep half-bag assignment signed,
    and retain the accepted aggregation, targets and auxiliary coefficient. Both menisci
    use the same transformation. Public position encodings and private classifiers
    retain their incumbent computation.
  precedents:
  - "[Position-free completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/jobs/orchestrator-20260924T025957Z-e646e95d/report.json):\
