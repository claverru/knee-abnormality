- id: meniscus-attention-coupled-mil
  mechanism_id: half-knee-auxiliary-supervision-through-public-meniscus-attention
  parent_idea_id: meniscus-half-knee-mil
  title: Train meniscus attention to select the evidence recognized by the half-knee
    detector
  opportunity: "The accepted run improved meniscus AUC by 0.003937, with exploratory\
    \ 95% interval [\u22120.000345,+0.008164], while cross-talk rose 0.5349\u2192\
    0.5532. Source inspection identifies a possible disconnect: the auxiliary detector\
    \ pools independently of the attention used for prediction. It can learn useful\
    \ instances without teaching the public readout to select them. This is a hypothesis,\
    \ not an established explanation of cross-talk."
  mechanism: "Replace uniform half-knee smooth-max aggregation with aggregation weighted\
    \ by the corresponding public meniscus attention scores. For eligible tokens H,\
    \ detector logits d and existing anatomically biased attention scores s, use z=logsumexp_H(s+d)\u2212\
    logsumexp_H(s), retaining temperature 1. Backpropagate through both s and d. Keep\
    \ the accepted anatomical partition, observed-target handling, class balance and\
    \ auxiliary coefficient 0.075. Both menisci follow the same equation. The auxiliary\
    \ still disappears at inference; public logits retain their existing computation."
  precedents:
  - '[Accepted completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/jobs/orchestrator-20260924T001118Z-171aaca2/report.json):
    meniscus, OA and other-eight AUC rose, but both cross-talk measures increased.
    The fitted midline, mask and auxiliary changed together.'
  - '[Current auxiliary](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/experiments/meniscus-half-knee-mil-20260923T231102Z-edeb9f68/source/src/knee_abnormality/training/lightning.py:133):
    detector logits receive count-normalized smooth-max pooling without public attention
    weights.'
  - "[Historical local-evidence completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/medial-lateral-transfer/jobs/orchestrator-20260921T164506Z-97ce059c/report.json):\
    \ adding stride-16 shared detector evidence directly to both families\u2019 public\
    \ logits lost 0.00220 macro on the older evaluation. Its inspected diff changes\
    \ inference and backbone feature extraction; this proposal does neither."
  - '[Ilse et al., 2018](https://proceedings.mlr.press/v80/ilse18a.html) supports
    learning instance aggregation from bag supervision. It does not establish this
    attention-coupled auxiliary or a knee-MRI benefit.'
  - '[General auxiliary backlog](/home/claudio/src/knee-abnormality/docs/backlog/big-bets.md#auxiliary-loss-campaign)
    owns generic per-view objectives. This is a refinement of the active geometry-specific
    auxiliary, independent of the developing OA channel and running meniscus classifier
    head.'
  novelty: Connects the accepted training-only detector to the attention actually
    used for meniscus prediction. It neither injects shared evidence into public logits
    nor ties the final classifiers. Uniform attention recovers the current auxiliary
    aggregation, making the changed learning pathway explicit.
  coverage: 'Affects the currently eligible meniscus half-bags, whose realized exposure
    must be logged. Expected signature: positive meniscus family delta with improved
    margins or lower cross-talk; approximately neutral OA and other-eight deltas.
    Shared attention layers and trunk gradients can move all twelve labels. Conditional
    normalization aligns selection inside each half but does not constrain total attention
    mass in the central band.'
  exploitation: Measure overlap between public attention and detector evidence, attention
    entropy within each half, and auxiliary gradients reaching attention parameters.
    Interpret these alongside all family deltas and assignment diagnostics. The rejected
    fallback run already shows that improved assignment alone need not improve macro
    AUC.
  budget: Reuses existing detector logits and attention scores, adding two small segmented
    reductions without another backbone pass or new parameters. Image selection, visits
    and triplet counts are unchanged. The incumbent used 1,653.21 seconds, leaving
    approximately 193 seconds under the sealed ceiling; actual overhead remains unmeasured.
  implementation: Replace the auxiliary aggregation in lightning.py and expose the
    existing meniscus scores from model.py during training without recomputing dropout
    or retaining a second full attention tensor. Retain fitted geometry, masks, detector,
    public heads and loss coefficient; remove the superseded uniform aggregation branch.
    After an incumbent change, preserve accepted OA/readout/geometry improvements
    and use its current meniscus attention. Preserve complementary auxiliary refinements
    if accepted. If the required half-knee method is superseded, return the proposal
