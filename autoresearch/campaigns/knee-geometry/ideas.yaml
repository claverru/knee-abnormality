- id: acquisition-local-anatomical-position
  mechanism_id: augmentation-transported-side-normalized-in-plane-position
  parent_idea_id: study-anchored-through-plane-position
  title: Transport the existing 2D position embedding into a side-normalized acquisition
    frame
  opportunity: The current 2D embedding uses fixed augmented-grid anchors, while anatomical
    masks use inverse-transformed anchors. Configured translations reach about 5.6
    mm per axis; these are possible displacements, not measured exposure. Separately,
    the rejected depth run had zero training activity. A new cache-only count found
    multiple frame-of-reference UIDs in all 4,230 historically accepted study fits,
    making its cross-series UID gate a plausible explanation. Acquisition-local coordinates
    avoid needing a shared inter-series origin.
  mechanism: "For each token, use the existing inverse augmentation/reflection map\
    \ to recover its prepared-image anchor. Map that anchor and the prepared crop\
    \ centre through the same middle-slice patient map; subtract to obtain within-acquisition\
    \ displacement d. Feed the existing 2D MLP the components (side_sign\xB7dX,dY)\
    \ for axial, (side_sign\xB7dX,dZ) for coronal and (dY,dZ) for sagittal, divided\
    \ by the existing physical half-crop extent. Use original-side metadata with the\
    \ inverse reflection map so the anatomical coordinates are transported consistently.\
    \ Retain the existing 1D depth encoding, plane and contrast embeddings. Require\
    \ complete visible geometry and known side; otherwise retain the control encoding\
    \ for the study."
  precedents:
  - '[Current feature geometry](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/experiments/meniscus-half-knee-mil-20260923T231102Z-edeb9f68/source/src/knee_abnormality/modeling/spatial_tokens.py:200):
    xy comes from fixed augmented-grid anchors; prepared coordinates separately use
    inverse_affine. The public 2D MLP receives xy.'
