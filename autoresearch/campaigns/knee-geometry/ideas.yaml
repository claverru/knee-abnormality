- id: meniscus-family-pooling-normalization
  mechanism_id: meniscus-private-normalization-for-public-and-locality-readouts
  parent_idea_id: meniscus-position-free-auxiliary
  title: Give the meniscus readouts and locality detector their own shared normalization
  opportunity: "The position-free auxiliary still updated normalization shared with\
    \ every public label. Source inspection confirms this coupling. The rejected shared-residual\
    \ head gained +0.003430 meniscus AUC but lost \u22120.002283 across the other\
    \ eight labels; both family intervals crossed zero. These results motivate separating\
    \ the meniscus readout's feature modulation, although they do not establish normalization\
    \ interference as the cause."
  mechanism: Retain the complete position-rich token sum and its per-token normalization
    statistics. Add one independent LayerNorm affine pair, shared by both menisci,
    initialized identically to the existing pair. Use these family-normalized tokens
    for meniscus attention, classifier values and the half-knee detector. OA and the
    other eight labels keep the existing affine parameters. Reuse the existing attention
    network and private classifier rows. Preserve ordinary gradients into the shared
    features; introduce no gradient masks, loss reweighting or backbone changes. Unknown-side
