- id: meniscus-detector-ranked-pooling
  mechanism_id: shared-detector-reranking-within-own-half-attention-mass
  parent_idea_id: meniscus-half-knee-mil
  title: Use the supervised tear detector to rerank public attention within each meniscus
    half
  opportunity: The accepted detector shapes training features but is discarded by
    the public readout. Meniscus AUC improved while cross-talk rose from 0.5349 to
    0.5532. The rejected shared-residual head subsequently improved meniscus AUC and
    margin but lost macro AUC through other labels. These exploratory diagnostics
    motivate using existing localized evidence while retaining private classifiers.
    They do not establish that the detector localizes tears accurately.
  mechanism: Let a_i be existing public meniscus attention and d_i the shared detector
    logit. Within that compartment's geometrically supervised core C, beyond the existing
    10 mm boundary, compute M = sum_C a_i and replace its weights by a'_i = M a_i
    sigmoid(d_i) / sum_C[a_i sigmoid(d_i)]. Leave attention outside C unchanged. Thus
    the shared band retains its original mass, while detector evidence reranks only
    the supervised own-half tokens. Keep private attention scores, classifier rows
    and biases. Retain half-knee supervision and allow gradients through the original
    attention, M and detector gate. Apply the identical rule to both menisci; OA remains
    whole-knee.
  precedents:
  - '[Accepted completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/jobs/orchestrator-20260924T001118Z-171aaca2/report.json):
    meniscus +0.003937, OA +0.002617 and other-eight +0.002972; all family 95% intervals
    crossed zero. The accepted package did not isolate the detector''s contribution.'
