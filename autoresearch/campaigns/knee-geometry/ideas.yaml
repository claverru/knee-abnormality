ideas:
- id: geometry-bundle
  mechanism_id: robust-centre-bilateral-split-fitted-midline
  parent_idea_id: null
  title: Give every study a centre, split bilateral studies into two knees, and draw
    the medial-lateral midline at the fitted centre's x
  opportunity: Three measured geometry errors decide which tokens count as medial
    or lateral. About 3% of studies (30 of 905 on fold 0) have a rejected centre,
    so their tokens get no anatomical bias. The midline is the median series x, which
    differs from the fitted centre's x by more than 5 mm in 12.5% of studies because
    sagittal slabs sit off-centre; the fit's x is the one measured against the notch
    (1.1 +/- 1.3 mm). Seven bilateral studies get one side for both knees. Each fix
    touches few studies and is likely below +0.001 alone, and every later mechanism
    of this campaign reads this geometry.
  mechanism: '(1) Robust centre: when estimate_reference rejects a study, refit dropping
    the worst series above 10 mm residual until none remain, then fall back to the
    sagittal fluid slab centre, then any sagittal series; token geometry_valid no
    longer requires physical sampling. (2) Bilateral rule: a study with at least two
    series at X > +40 mm and at least two at X < -40 mm is two knees; split its series
    by the sign of X, fit a centre per knee, take each knee''s side from the sign
    of X (+X is patient left in LPS), and give every token the centre and side of
    its own knee. A single series on the other side is a stray: it stays in sampling
    but its tokens get invalid geometry. (3) Midline: medial_mm uses the fitted centre''s
    x instead of the median series x. Unknown side still gives no bias.'
  precedents:
  - 'outputs/analysis/robust-center-rescore-20260923/robust_center.patch: robust refit
    and fallback, applies to d914079; inference gate +0.0001, bias alone +0.00009
    [80% +0.00003, +0.00015].'
  - 'outputs/analysis/midline-vs-centre-20260923/result.md: midline vs fitted x, median
    1.55 mm, p95 8.6 mm, 12.5% above 5 mm; worst cases are off-centre sagittal slabs.'
  - 'docs/research/series-filtering-signals.md#contralateral-knee: seven bilateral
    studies, X sign separates the knees.'
  novelty: The robust centre was measured only at inference, before the bias depended
    on it at training time; per-knee geometry for bilateral studies and the fitted-x
    midline are new.
  coverage: Rescued centres about 3%, bilateral about 0.16%, midline moved by more
    than 5 mm about 12.5% of studies; all labels through sampling, the compartment
    labels through the bias.
  exploitation: Every later geometry idea builds on it. If rejected, the per-stratum
    diagnostic decides which components are re-proposed as a smaller combination.
  budget: Header arithmetic at preparation; no measurable runtime change.
  implementation: Adds to geometry.py (robust refit, per-knee fit), laterality.py
    (bilateral split, per-knee side and centre), dataset.py (per-series or per-token
    centre and side in the batch, geometry_valid decoupled from physical sampling)
    and model.py (medial_mm from the fitted centre). Settings under data.study_geometry;
    move the patch's identity.py hunk into RELIABILITY. The completion must report
    per-stratum deltas for rescued-centre, bilateral and midline-moved (> 5 mm) studies
    against the rest. Aggregate triplet counts must equal the replay.
  open_choices: 10 mm residual limit and the fallback order come from the patch; the
    +/-40 mm bilateral threshold and two-series minimum from the contralateral audit.
    Fixed before launch.
  dependencies: []
  priority_rationale: Correctness of the geometry every other idea reads; must run
    first.
  status: completed
