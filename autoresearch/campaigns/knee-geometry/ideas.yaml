- id: meniscus-core-band-contrast-readout
  mechanism_id: private-meniscus-residual-from-core-versus-shared-band-features
  parent_idea_id: meniscus-detector-ranked-pooling
  title: Let each meniscus classifier distinguish own-core features from shared central-band
    context
  opportunity: The current classifier merges core and central-band features before
    applying one weight vector. Detector reranking changed only the distribution inside
    the core and preserved its total mass. New arithmetic on that rejected run's selected-epoch
    training logs gives mean core mass 0.817441 across 6,432 active label pools, leaving
    18.26% in the shared band. This establishes exposure in that run, not excessive
    band reliance or incumbent exposure.
  mechanism: "Reuse each meniscus label's existing attention a and token values u.\
    \ Partition permitted tokens into its own core, signed medial distance >10 mm,\
    \ and the remaining shared band. Compute weighted sums C=\u03A3core a\xB7u and\
    \ B=\u03A3band a\xB7u, with masses mC and mB. Add r_c\u1D40(mB\xB7C\u2212mC\xB7\
    B) to the unchanged public logit, using one zero-initialized residual vector per\
    \ meniscus and no residual bias. The contrast equals mC\xB7mB times the difference\
    \ of regional means and vanishes when either region is absent. This allows a feature\
    \ to have different implications in core tissue and central context while retaining\
    \ all original evidence. Both compartments use the same construction; attention,\
    \ auxiliary MIL and OA readouts retain their existing mechanisms."
  precedents:
  - "[Reranking completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/jobs/orchestrator-20260924T032909Z-0aefe93f/report.json):\
    \ meniscus \u22120.001032, OA \u22120.004006, other-eight \u22120.001398, with\
    \ all family 95% intervals crossing zero. Effective core tokens fell approximately\
    \ 67\u219228; core mass remained fixed."
  - "New read-only arithmetic from [selected-epoch metrics](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/experiments/meniscus-detector-ranked-pooling-20260924T023223Z-e85f0970/training/fold_0/logs/version_0/metrics.csv):\
    \ epoch 9 core-mass sum 5,257.7783203125 divided by 6,432 active label-pool exposures\
    \ gives 0.817441. These are training exposures, not unique studies or \xD74 validation\
    \ measurements."
  - '[Current pooling source](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/experiments/meniscus-half-knee-mil-20260923T231102Z-edeb9f68/source/src/knee_abnormality/modeling/model.py:276):
    attention-weighted values are merged before the private classifier, so core-versus-band
    provenance is unavailable to that classifier.'
  - "[Shared-residual-head completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/jobs/orchestrator-20260924T011827Z-85b10dae/report.json):\
    \ meniscus +0.003430 and OA +0.001970 accompanied other-eight \u22120.002283;\
    \ family intervals crossed zero. This proposal retains private base classifiers\
    \ and introduces regional information rather than classifier tying."
  - '[Spatial Pyramid Pooling](https://arxiv.org/abs/1406.4729) demonstrates regional
    pooling from existing feature maps without repeated convolution. It supports the
    computational construction, not these anatomical regions or a knee-AUC gain.'
  - '[Attention-pooling ownership](/home/claudio/src/knee-abnormality/docs/backlog/small-changes.md#attention-pooling):
    unlike its generic nonlinear head, this exposes a geometry-defined statistic lost
    during pooling. It also differs from the running OA within-acquisition variance
    readout.'
  novelty: Changes which regional information reaches the classifier, rather than
    sharpening attention or changing mask boundaries. No detector controls public
    routing, no family disease total is split, and no compartment classifiers are
    tied. The contrast is between own-core tissue and shared context, not between
    medial and lateral disease evidence.
  coverage: 'Directly affects the two meniscus logits on trusted studies containing
    both regions. Desired signature: improved meniscus discrimination with approximately
    neutral OA and other-eight family deltas. Shared training can still move every
    label. The historical 18.26% band mass motivates coverage, but actual incumbent
    contrast magnitudes and eligible-study fractions are unknown.'
  exploitation: Log regional masses, contrast norms, residual-vector norms and residual-logit
    magnitudes, separated by plane and geometry stratum. Distinguish unique affected
    studies from label-pool exposures. Examine family deltas, both compartment margins,
    cross-talk and learned strengths; a smaller band contribution is not itself success.
  budget: Adds 512 weights at width 256 and grouped reductions for two attention rows.
    Reuse the same attention realization, avoiding another dropout draw or scoring
    pass. No new image processing, triplets or backbone computation. The incumbent
    leaves approximately 193 seconds of runtime headroom; inference overhead remains
    unmeasured.
  implementation: 'Against revision 345, add the regional contrast inside model.py''s
    float32 pooling block and initialize residual tensors directly to zero. Retain
    fitted geometry, anatomical strengths, public mask, base private heads, shared
    detector and auxiliary loss; remove no accepted component. Apply control fallback
    with zero residual on untrusted studies, explicitly reporting any required correction
    to the parent''s partial-geometry behavior. Classification: small-changes.md.
    If fractional routing becomes incumbent, retain its weights and partition their
    mass into own-core versus remaining permitted context; report that changed support.
    Preserve accepted auxiliary and OA improvements. If a new readout already exposes
    these regions separately, reassess redundancy rather than stack duplicate capacity.'
  open_choices: Central-band features may be useful disease evidence, and the residual
    can overfit acquisition context. Token receptive fields cross regional boundaries.
    The mass product attenuates the residual when attention collapses into one region.
