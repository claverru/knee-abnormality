  exploitation: Uses the accepted detector's shared tear supervision while aligning
    corresponding distances on opposite sides. It preserves positional context that
    the rejected position-free arm removed and avoids promoting detector scores into
    public attention. This is a representation hypothesis, not evidence that the current
    detector uses a coordinate shortcut.
  budget: No additional backbone pass, sampled images or inference detector evaluation.
    Adds tokenwise sinusoidal construction for sagittal auxiliary inputs and a second
    evaluation of the existing small 2D MLP for axial/coronal auxiliary tokens; adds
    no learned parameters. Expected overhead is modest relative to the incumbent's
    1,653.21 seconds and 1,846-second ceiling, but runtime remains unmeasured.
  implementation: Replace auxiliary coordinate construction in model.py; expose the
    necessary scalar positions and 2D inputs through spatial_tokens.py without changing
