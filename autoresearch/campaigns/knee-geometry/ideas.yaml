- id: meniscus-plane-negative-mil
  mechanism_id: plane-stratified-negative-half-knee-supervision
  parent_idea_id: meniscus-half-knee-mil
  title: Require negative meniscus halves to suppress tear evidence in every represented
    plane
  opportunity: 'The current auxiliary pools all eligible half-knee tokens into one
    count-normalized smooth maximum. Consequently, each plane''s contribution depends
    on its token count: suspicious evidence from a sparsely represented plane can
    be diluted by another plane''s many low-scoring tokens. This is a source-derived
    possibility, not a measured failure. Persistent meniscus cross-talk motivates
    examining it while retaining the positive bag''s ability to find a tear in whichever
    view shows it.'
  mechanism: "Retain the current whole-half score z_h for positive supervision. Also\
    \ compute the same smooth-max score z_hp separately for each represented anatomical\
    \ plane in that half. For target y, replace auxiliary BCE by y\xB7softplus(-z_h)\
    \ + (1-y)\xB7mean_p softplus(z_hp), then apply the incumbent's existing class-balance\
    \ weight and auxiliary coefficient. Use identical rules for both menisci, omit\
    \ absent planes and retain observation masking. Positive halves need evidence\
    \ somewhere; negative halves receive supervision in every available plane. This\
    \ equals the original loss for a single represented plane or identical plane scores."
  precedents:
  - "[Current auxiliary implementation](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/experiments/meniscus-half-knee-mil-20260923T231102Z-edeb9f68/source/src/knee_abnormality/training/lightning.py:133):\
    \ grouping is study \xD7 half, with one token-count denominator. model.py already\
    \ exposes image_plane."
  - '[Accepted half-knee completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/jobs/orchestrator-20260924T001118Z-171aaca2/report.json):
    both menisci gained, but cross-talk increased. The detector, mask and fitted midline
    were bundled, leaving this aggregation hypothesis unresolved.'
  - "[Fallback completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/jobs/orchestrator-20260924T004902Z-a1d4681e/report.json):\
    \ improved assignment diagnostics accompanied macro \u22120.001765, OA \u2212\
    0.002437 and other-eight \u22120.002056. Localization diagnostics alone cannot\
    \ justify this refinement."
  - '[Ilse et al., 2018](https://proceedings.mlr.press/v80/ilse18a/ilse18a.pdf) states
    the standard MIL assumption that every instance in a negative bag is negative.
    Applying that assumption separately to anatomical views is the proposed extension,
    not a result established by the paper.'
  - '[General auxiliary backlog](/home/claudio/src/knee-abnormality/docs/backlog/big-bets.md#auxiliary-loss-campaign)
    owns generic per-view disease classifiers. This uses the existing meniscus detector
    and geometric half-bags, adds no per-view heads, and does not require every view
    of a positive study to reveal disease.'
  novelty: 'Changes only how negative half-knee evidence is supervised across planes.
    It is neither a per-view positive-label objective nor acquisition-count normalization
    of public attention. It also differs from attention coupling, position removal
    and support-aware membership: those change selection, representation or membership
    rather than the negative bag decomposition.'
  coverage: 'Acts on eligible meniscus half-bags with multiple represented planes
    and differing plane scores; exposure is unmeasured. Expected signature: improved
    meniscus discrimination against sibling-positive negatives, with stable or lower
    cross-talk. OA and other-eight paths remain unchanged, so their expected deltas
    are approximately neutral, subject to shared-trunk training effects.'
  exploitation: Log plane token fractions, plane-score disagreement, each plane's
    negative-loss contribution and the count of affected half-bags. Distinguish improved
    suppression from simply reducing detector scores everywhere by also tracking positive-half
    scores and meniscus AUC. Evaluate all family deltas together.
  budget: Adds at most three grouped reductions per half over existing detector logits
    and reuses image_plane. No new parameters, inference operation, images or backbone
    pass. Counts are unchanged. Expected training overhead is small; actual timing
    remains unmeasured.
  implementation: Against revision 167, replace the negative component of half_knee_mil_loss
    in lightning.py; retain positive aggregation, detector inputs, fixed membership
    band, public heads, class balance and coefficient. Remove the superseded aggregate-negative
    branch. Apply the required complete-study fallback consistently, acknowledging
    its known confound against this parent. Preserve newly accepted geometry, readout,
    position-free input and support-aware membership changes. If attention-coupled
    MIL becomes incumbent, compute each plane score using that accepted aggregator
    renormalized within the plane, while retaining its whole-half positive score.
    If the active half-knee prerequisite disappears, return for re-scoping.
  open_choices: Equal plane averaging changes gradient allocation and could amplify
    an uninformative plane. Tokens can contain sibling tissue through their receptive
    fields, so geometrically negative halves are imperfect instance-negative bags.
    Soft targets remain unchanged and enter the formula directly. Current plane imbalance
    and detector disagreement are missing measurements; no plane-specific coefficients
    or loss-weight sweep are proposed.
  dependencies:
  - meniscus-half-knee-mil
  priority_rationale: 'Revision 167 priority 3: distinct, inexpensive and training-only,
    with an explicit MIL rationale. Its central failure mode has not been measured,
    and stronger negative supervision may conflict with receptive-field mixing. It
    therefore ranks below the two readout/encoding proposals.'
  status: proposed
  created_revision: 183
- id: oa-own-side-plus-knee-channel-fallback-safe
  mechanism_id: oa-masked-own-side-pool-plus-shared-knee-level-channel
  parent_idea_id: oa-own-side-plus-knee-channel
  title: Read each OA compartment from a masked own-side pool plus a shared knee-level
    OA channel
  opportunity: 'OA needs whole-knee evidence: the side mask cost OA -0.0040, lateral
    OA -0.0093 on its sibling-positive group, and every run that forced OA apart lost.
    But the model over-couples the pair: OA logits correlate at 0.854 against 0.51-0.56
    for the labels. OA needs both the shared degeneration and a clean compartment
    channel.'
  mechanism: 'For Medial and Lateral OA: z_c = w_c . pool_own(c) + a_c * s_OA + b_c.
    pool_own(c) is the compartment''s attention pool masked to its own side (as in
    the meniscus mask). s_OA = w_k . pool_knee is one whole-knee attention pool with
    its own attention row, read by one shared classifier. a_c are two zero-initialized
    scalars, so training starts from the masked own-side readout and learns how much
    knee-level evidence to add. Fallback: for a study with unknown side or without
    valid geometry, both OA logits are exactly the incumbent''s (pool_own over all
    tokens and the knee-channel term multiplied by zero), so those studies follow
    the parent readout whatever a_c learns.'
  precedents:
  - 'side-mask: OA -0.0040 [95% -0.0087, +0.0002]; strata Medial OA -0.0038/+0.0003,
    Lateral OA -0.0034/-0.0093.'
  - 'shared-family-level-channel (medial-lateral-transfer, +0.0009 macro, OA +0.0001):
    a shared knee-level channel added to private pathways, the only non-negative sharing
    design.'
  novelty: 'The first attempt was blocked after its one repair: its knee channel stayed
    active on unknown-side studies, breaking the contract''s fallback. This version
    gates the channel off there; it never trained. Separates knee-level from compartment-level
    OA evidence explicitly; earlier OA designs either forced separation or shared
    everything.'
  coverage: The two OA labels.
  exploitation: Report the OA pair's prediction correlation against the reference's
    0.854; a drop with a gain confirms the decoupling reading.
  budget: One extra attention row and head; no measurable runtime change.
  implementation: 'Base: the incumbent meniscus-half-knee-mil-20260923T231102Z-edeb9f68
    (fitted midline, meniscus-only mask, half-knee loss); keep all of it. Gate the
    knee-channel term with the per-study valid-side flag so fallback studies reproduce
    the incumbent''s OA logits exactly. Adds the OA readout in model.py under model.compartment_evidence,
    reusing the side-mask code for pool_own. Builds on the geometry bundle when it
    is the incumbent, otherwise carries its surviving components; combines with the
    meniscus-only mask when that is the incumbent. Log a_c and the OA logit correlation
    per epoch.'
  open_choices: Zero-initialized scalars; the knee channel's attention row starts
    like the other rows. Fixed before launch.
  dependencies: []
  priority_rationale: The OA counterpart to the meniscus mask, designed around the
    measured OA behaviour.
  status: proposed
  created_revision: 203
- id: meniscus-axis-consensus-membership
  mechanism_id: meniscus-exclusion-and-auxiliary-membership-from-axis-agreement
  parent_idea_id: coronal-condylar-frame
  title: Use agreement between geometric axes to qualify meniscus exclusions and auxiliary
    membership
  opportunity: 'The rejected coronal frame changed 244,909 effective mask memberships
    but reduced meniscus, OA and other-eight AUC. The sagittal frame also failed adoption
    and bundled additional geometry changes. Neither establishes a superior anatomical
    axis. Their disagreement suggests a different use for the headers: identify tokens
    whose compartment assignment is uncertain, while retaining the accepted continuous
    anatomical bias.'
  mechanism: "For each trusted study, form a set containing the incumbent medial axis\
    \ and available valid sagittal-normal and coronal in-plane axes, oriented consistently\
    \ and projected into the transverse plane. Compute signed token positions around\
    \ the accepted fitted centre under each axis. Exclude a token from a public meniscus\
    \ pool only when every axis places it beyond that compartment\u2019s existing\
    \ contralateral 10 mm boundary. Admit an auxiliary token only when every axis\
    \ places it beyond the same own-side 10 mm boundary. Thus uncertain tokens remain\
    \ available to public prediction but receive no compartment-specific auxiliary\
    \ target. Keep the incumbent continuous bias, including OA\u2019s axis and strength,\
    \ unchanged. These are deterministic agreement rules, not calibrated confidence\
    \ intervals."
  precedents:
