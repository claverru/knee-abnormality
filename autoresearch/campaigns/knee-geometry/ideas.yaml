- id: meniscus-position-residualized-values
  mechanism_id: meniscus-values-with-position-only-contribution-subtracted
  parent_idea_id: meniscus-position-free-auxiliary
  title: Subtract position-only meniscus evidence while retaining position-conditioned
    image evidence
  opportunity: The incumbent sends identical position-rich tokens to attention, private
    classifiers and the auxiliary detector. Removing auxiliary position did not help
    meniscus discrimination, while folded coordinates produced an exploratory meniscus
    gain accompanied by other-eight losses. This suggests separating positional context
    from direct positional evidence instead of deleting coordinates. The hypothesis
    is that acquisition-relative coordinates can contribute to a meniscus logit even
    without corresponding visual evidence. Its importance has not been measured.
  mechanism: "Let f be projected visual features, a the plane-plus-contrast embedding,\
    \ p the existing 1D-plus-2D positional embedding, and N the incumbent LayerNorm.\
    \ Keep attention and the auxiliary detector on N(f+a+p). For eligible studies,\
    \ replace only public meniscus values with v=N(f+a+p)\u2212N(a+p)+N(a), using\
    \ the existing normalization parameters. Pool v with the existing masked attention\
    \ and retain separate meniscus classifiers and biases. Both compartments follow\
    \ the same equation. When f=0, v=N(a), independent of position; when p=0, v=N(f+a).\
    \ Position therefore still conditions visual evidence through normalization and\
    \ attention, while its standalone contribution to classified values is removed.\
    \ This is an algebraic construction, not a causal counterfactual or a guarantee\
    \ of anatomical invariance."
  precedents:
  - '[Incumbent source](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/experiments/meniscus-half-knee-mil-20260923T231102Z-edeb9f68/source/src/knee_abnormality/modeling/model.py:375):
    _pooling_tokens returns the same normalized feature-plus-embedding tensor as attention
    inputs and classified values.'
  - "[Position-free completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/jobs/orchestrator-20260924T025957Z-e646e95d/report.json):\
