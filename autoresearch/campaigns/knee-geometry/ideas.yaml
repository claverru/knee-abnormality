- id: curve-density-sampler
  mechanism_id: slice-density-proportional-to-measured-usefulness
  parent_idea_id: null
  title: Draw each plane's slices in proportion to its measured label-usefulness curve
    instead of a Gaussian
  opportunity: The measured usefulness by slice position has a sagittal middle dip
    (91% of peak) and humps at the compartments (+/-31.5 mm); coronal and axial peak
    at the centre but are lopsided. The Gaussian puts most sagittal slices on the
    notch. Sampling acts mostly during training, where it sets how much label-relevant
    signal each step sees.
  mechanism: For physical pools, replace the Gaussian target density along each plane's
    slice axis with a piecewise-linear interpolation of the plane's total utility
    from spatial-importance-20260918/axis_marginals.csv (sagittal l_mm, coronal p_mm,
    axial s_mm), the edge value held beyond the measured range. Sagittal is symmetrized,
    f(d) = (u(d) + u(-d)) / 2, because the map pools left and right knees. Pool depth
    is positive toward left, posterior and superior, matching the file. Local pools,
    triplet counts and validation determinism are unchanged.
  precedents:
  - 'outputs/analysis/two-peak-sagittal-gate-20260923/result.md: frozen k05-clean
    with the curve density, x4 -0.00057 [80% -0.00120, +0.00008], despite the train-inference
    sampler mismatch; narrow two-peak -0.00153 [-0.00246, -0.00064]; sampling_curve.py
    implements the density.'
  - 'docs/validation/results/2026-09-18-per-plane-sigma-cache.md: coronal narrower
    than 40 mm gains +0.00135 on frozen checkpoints.'
  novelty: Every sampler so far was a Gaussian around the centre; this shape comes
    from the measured map, with no width to tune.
  coverage: All labels, all three planes, every physical pool.
  exploitation: If it helps, the plane that moved most (from the offsets log) shows
    where density matters; combinations with the meniscus mask test whether off-midline
    sagittal slices feed it.
  budget: A lookup per candidate at selection; no measurable runtime change.
  implementation: Replaces target_depths' Gaussian in sampling.py when data.sampling_density
    selects the curve; the curve values live in the code and in SAMPLING_IDENTITY.
    Aggregate triplet counts must equal the replay (the gate verified identical counts).
    Log the realized mean absolute offset per plane.
  open_choices: Interpolation and edge handling fixed before launch; no exponent or
    smoothing.
