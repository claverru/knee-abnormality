- id: study-anchored-through-plane-position
  mechanism_id: side-normalized-study-centred-through-plane-position
  parent_idea_id: side-normalized-3d-position
  title: Anchor the existing 1D depth encoding to the fitted study centre while retaining
    the 2D embedding
  opportunity: Current source still centres each acquisition's 1D position on its
    own slab midpoint. An earlier cache survey reported acquisition-to-study origin
    offsets above 5 mm in 35.4% of series and a 15.77 mm p90 disagreement between
    suppliers within multi-source pools. Those historical measurements were not repeated
    here, but the responsible code remains present. Equivalent anatomical depths can
    therefore receive different embeddings depending on acquisition coverage. This
    offers a narrower intervention than replacing both positional embeddings, which
    risks repeating the other-eight losses seen in token-attention.
  mechanism: 'For trusted unilateral studies, compute the signed distance from the
    accepted fitted centre to each selected middle-slice plane: d = dot(n, IPP - centre),
    with the unit acquisition normal oriented toward its positive dominant patient
    axis. Multiply sagittal d by knee_side_sign so positive depth means medial; retain
    posterior-positive coronal and superior-positive axial depth. Feed these millimetres
    into the existing sinusoidal encoder with its existing frequencies. Retain the
    learned 2D raster-position embedding. Anatomically normalized depth remains invariant
    under a consistent left-right reflection. If side, centre or required visible-series
    geometry is unresolved, retain the incumbent''s complete 1D encoding path for
    that study.'
  precedents:
