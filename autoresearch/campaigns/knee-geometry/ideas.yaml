- id: within-acquisition-geometry-pooling
  mechanism_id: physical-depth-quadrature-preserving-acquisition-attention-mass
  parent_idea_id: geometry-bundle
  title: Weight compartment evidence by represented depth while preserving acquisition
    attention mass
  opportunity: "The bundle\u2019s corrected geometry did not improve compartment assignment:\
    \ meniscus cross-talk rose 0.535\u21920.575 and OA 0.575\u21920.630. A separate\
    \ suspected weakness is that attention counts sampled tokens rather than represented\
    \ anatomy, so densely sampled depths receive more terms. Earlier acquisition-count\
    \ normalization harmed menisci; any density correction should preserve the existing\
    \ acquisition preferences."
  mechanism: "Compute each selected middle slice\u2019s represented depth v from one-dimensional\
    \ Voronoi cells clipped to its acquisition\u2019s valid contiguous-run support;\
    \ divide tied-depth cells and never bridge acquisition gaps. For each compartment\
    \ attention row, let A_i be existing attention and M_j its total on acquisition\
    \ j. Replace within-acquisition weights by A'_i = M_j A_i v_i / sum_{k in j}(A_k\
    \ v_k). Thus every acquisition retains exactly its original attention mass, while\
    \ its internal distribution reflects physical coverage. Use the same equation\
    \ for both menisci and both OA compartments, with no new coefficients. Keep OA\
    \ whole-knee access and the other eight rows unchanged."
  precedents:
  - "[Original count-normalization comparison](/home/claudio/src/knee-abnormality/outputs/analysis/count-norm-vs-allocation/comparison.json):\
    \ macro \u22120.00346, meniscus \u22120.00914, OA \u22120.00200; older split and\
    \ different training seeds. That method changed relative acquisition mass, which\
    \ this proposal preserves exactly."
  - '[Original geometry-width comparison](/home/claudio/src/knee-abnormality/outputs/autoresearch/triplet-sampling/experiments/geometry-informed-plane-widths-20260919T174231Z-cb932a0e/comparison/comparison.json):
    inconclusive macro +0.000353, with opposing exploratory meniscus/OA bootstrap
    means. This proposal changes aggregation, not widths or selected slices.'
  - '[PointConv](https://arxiv.org/pdf/1811.07246) compensates nonuniform spatial
    sampling using density weights. It provides a mathematical analogy only; it does
    not establish a knee-MIL benefit or justify replacing this backbone.'
  - "[Existing source](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/baseline/source/src/knee_abnormality/modeling/model.py):\
    \ pooling currently softmaxes over study tokens. The campaign\u2019s curve-density-sampler\
    \ owns changing slice draws; this proposal leaves those draws intact."
  novelty: "Adds physical-depth weighting inside each acquisition while conserving\
    \ its learned attention contribution exactly. This differs from rejected acquisition\
    \ equalization, sampler-density changes and the queued OA shared channel. It addresses\
    \ the bundle\u2019s assignment weakness through aggregation rather than stronger\
    \ masks."
  coverage: 'Acts on the four compartment pools when a study has trusted geometry
    and unequal represented depths. Expected signature: improved meniscus localization
    and stable or improved OA AUC without removing cross-compartment OA evidence;
    other-eight approximately neutral. These are hypotheses: current weight dispersion
    and affected-token counts have not been measured.'
  exploitation: Report weight dispersion, effective token count and central-versus-peripheral
    attention redistribution alongside family deltas and cross-talk. Conserved acquisition
    mass makes a gain interpretable as better within-acquisition evidence allocation.
    Sparse peripheral slices could instead receive excessive influence.
  budget: CPU sorting of already-selected depths and small attention reductions; no
    extra decoding, backbone pass or selectable series. Preserve visits and triplets
    exactly. Overhead should fit comfortably within existing headroom, but end-to-end
    timing is unmeasured.
  implementation: Add depth measures after successful selection/retries in dataset.py
    and preparation.py, carry acquisition membership into model.py, and implement
    the conditional renormalization in float32. Preserve gradients through both original
    acquisition mass and corrected conditional attention. Carry the fitted-midline-only
    survivor directly when starting from revision 52; omit rejected centre recovery
    and bilateral splitting. Unknown side or unresolved required geometry uses the
    control path. Retain private heads, position embeddings and family strengths.
    After an incumbent change, retain accepted geometry, meniscus masks/MIL and OA
    channels; apply this correction only to compartment-specific public pools, leaving
    auxiliary losses and shared knee channels intact.
  open_choices: Physical coverage is not necessarily the appropriate measure for detecting
    focal lesions. Freeze cell endpoints from existing run support before scoring;
    single-depth acquisitions remain unchanged. Current exposure, numerical extremes
    and benefit are missing evidence, not reasons to tune clipping or density powers.
  dependencies: []
  priority_rationale: 'Priority 3: distinct, inexpensive readout mechanism with an
    exact safeguard against the closest rejected design. It has broader potential
    exposure but weaker direct evidence and more implementation complexity than the
    two geometry corrections.'
  status: blocked
  created_revision: 60
  ranking_rationale: 'All three new proposals pass proposal_admission with no dependencies.
    Fitted-midline-only ranks immediately after the reserved head: it isolates the
    bundle component with the strongest diagnostic stratum and has little expected
    cost. The queued OA readout remains ahead of the coronal estimator because the
    trained side-mask result directly measured OA harm. Coronal-condylar-frame has
    substantial measured prescription disagreement, but neither axis has verified
    anatomical accuracy and the sagittal-frame result is pending. Within-acquisition-geometry-pooling
    ranks fifth: it preserves acquisition attention mass, addressing a weakness of
    earlier count normalization, but its actual weight dispersion and token exposure
    are unmeasured.'
  blocked_reason: "Admit the revised meniscus-only mask. It carries the fitted-midline\
    \ component, has no unresolved dependency, and isolates the mask already bundled\
    \ into the prepared half-knee candidate if that candidate does not succeed. Rank\
    \ it after the reserved head because the earlier trained four-label mask showed\
    \ the strongest relevant family signal. Park depth pooling to keep the queue at\
    \ five: its actual weight dispersion and exposure remain unmeasured. Retain the\
    \ curve sampler as a proposal; its frozen-checkpoint gate leaned negative and\
    \ the source usefulness map partly reflects the existing sampler. Retain the 3D\
    \ encoding as a proposal because its unknown-side and invalid-geometry vectors\
    \ conflict with the campaign\u2019s required control-behaviour fallback. The shared-residual\
    \ head remains proposed pending masked-pool training evidence."
