- id: oa-own-half-feature-dispersion
  mechanism_id: oa-local-within-acquisition-second-moment-readout
  parent_idea_id: oa-own-half-readout-supervision
  title: Add own-half feature dispersion to OA prediction while preserving whole-knee
    evidence
  opportunity: Own-half OA supervision left OA nearly unchanged and reduced meniscus
    AUC; its improved OA cross-talk did not translate into discrimination. Requiring
    a local pool to predict OA independently may be too restrictive. A different opportunity
    is to retain whole-knee prediction while exposing local heterogeneity that a weighted
    mean discards. Whether this heterogeneity represents OA rather than normal tissue
    diversity is unmeasured.
  mechanism: "Keep each OA public logit unchanged as the base. For each acquisition\
    \ j and compartment c, restrict its existing attention weights to the own-side\
    \ core beyond the fixed 10 mm boundary. Let M_cj be their original whole-knee\
    \ attention mass and normalize within that core. Using per-token, non-affine LayerNorm\
    \ of projected image features before positional additions, compute the weighted\
    \ mean mu_cj and diagonal variance V_cj. Form v_c = sum_j M_cj V_cj and add w_c\xB7\
    log1p(v_c) to the existing OA logit. Initialize the two private variance-readout\
    \ vectors to zero, with no additional multiplicative gate or bias. The same operation\
    \ applies to both OA compartments and trains through ordinary main BCE. Single-token\
    \ groups contribute zero variance; invalid studies contribute no residual."
  precedents:
  - "[Own-half supervision completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/jobs/orchestrator-20260924T035848Z-e73b935b/report.json):\
    \ OA \u22120.000420, 95% [\u22120.004735,+0.003711]; meniscus \u22120.004553 [\u2212\
    0.009245,\u22120.000284]; other-eight +0.001179 with an interval crossing zero.\
    \ OA cross-talk improved despite its flat AUC. Meniscus fallback also changed,\
    \ preventing isolated attribution."
  - '[Accepted incumbent completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/jobs/orchestrator-20260924T001118Z-171aaca2/report.json):
    both OA AUCs improved while OA margin declined and cross-talk rose. These exploratory
    diagnostics motivate richer compartment evidence, not an additional adoption criterion.'
  - '[Historical shared-channel completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/medial-lateral-transfer/jobs/orchestrator-20260921T035352Z-7be929a0/report.json):
    the inconclusive shared channel remained nearly dormant. Here the zero-initialized
    decoder receives an immediate gradient from a directly computed statistic; there
    is no separate zero gate multiplying an untrained channel.'
  - '[Carmichael et al., MICCAI 2022](https://arxiv.org/abs/2206.08885) adds variance
    pooling to MIL to represent heterogeneity in histopathology. This supplies an
    architectural precedent; its cancer-survival results do not establish OA benefit.'
  - '[General pooling backlog](/home/claudio/src/knee-abnormality/docs/backlog/small-changes.md#attention-pooling)
    owns generic pooling capacity and acquisition-specific readouts. The registered
    OA own-side-plus-knee channel combines first-moment evidence; this proposal adds
    local second moments while retaining the existing whole-knee path.'
  novelty: Adds a statistic that cannot generally be recovered from the current pooled
    mean. Computing variance within acquisitions avoids treating between-contrast
    offsets as spatial heterogeneity; retaining original attention mass avoids acquisition
    equalization. It adds neither local OA supervision nor a shared knee-level classifier,
    and does not force the two compartments' evidence apart.
  coverage: 'Targets both OA compartments on trusted studies with own-core spatial
    support. Hypothesis: OA family AUC improves while retaining useful knee-level
    context; margins and cross-talk should reveal whether the added local signal helps
    assignment. Meniscus and other-eight paths retain their computation, with approximately
    neutral family deltas desired. Log usable acquisitions, core mass, variance magnitudes
    and residual-logit activity.'
  exploitation: Uses geometry to locate an additional OA statistic while allowing
    ordinary supervision to learn whether local variation supports or opposes disease.
    It preserves the whole-knee context implicated by the trained side-mask tradeoff.
    Appearance-only variance is additional evidence; it does not remove positional
    information from the established readout.
  budget: Adds 512 decoder weights at width 256, one non-affine feature normalization
    and grouped first/second-moment reductions for two labels. No pairwise token matrix,
    additional encoder pass or image-budget change. Grouped accumulation should remain
    inexpensive, but inference cost and temporary memory require measurement within
    the existing ceiling.
  implementation: Add acquisition identifiers to encoded output in model.py and compute
    moments in float32 using grouped reductions. Retain the active package's fitted
    midline, meniscus mask and MIL, anatomical strengths, OA whole-knee logits and
    all other readouts. Add the variance residual; do not resurrect the rejected OA
    auxiliary loss or blocked shared-channel implementation. Use complete-study geometry
    fallback, carrying and separately reporting the required correction if absent.
    Record activity in lightning.py and update the mechanism identity/configuration.
    Preserve newly accepted normalization, axis-membership and positional changes.
    If a new incumbent changes OA mean/context pooling, attach the local variance
    residual to that accepted readout after review; if it already models the same
    local second moments, retire this proposal as subsumed.
  open_choices: Normal tissue diversity, coverage and artifacts may dominate variance.
    Non-affine normalization discards feature magnitude, and sparse attention can
    make dispersion nearly zero. Within-acquisition grouping prevents contrast mixing
    but does not establish anatomical correspondence. The residual may remain unused
    despite its nonzero initial decoder gradient. No current feature artifact measures
    OA-specific local heterogeneity.
