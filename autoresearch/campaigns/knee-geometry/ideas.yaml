- id: meniscus-shared-residual-head
  mechanism_id: shared-plus-residual-meniscus-classifier-on-masked-pools
  parent_idea_id: null
  title: Read both masked meniscus pools with a shared classifier plus zero-initialized
    per-compartment residuals
  opportunity: Lateral tears are rarer (279 exclusive training studies against 1,150
    medial) but look like medial ones. Hard-tied meniscus classifiers lost before
    (-0.0071, -0.0075), but without a mask each pool mixed both sides, so a tied classifier
    could not tell them apart. With the meniscus mask the pools come from separate
    halves, where sharing makes sense.
  mechanism: For the two meniscus rows, w_med = w_shared + delta_med and w_lat = w_shared
    + delta_lat, with w_shared initialized to the mean of the two current rows, delta
    initialized to zero, no penalty and private biases. Both compartments train w_shared;
    delta keeps real anatomical differences (the lateral meniscus is shaped differently).
    Attention rows, masks and every other head stay private and unchanged.
  precedents:
  - 'anatomical-position-rich-shared-meniscus-readout (reject, -0.0071 meniscus) and
    appearance-value-tied-meniscus-classifier (-0.0075): hard ties without a mask.'
  - 'shared-family-level-channel (+0.0003 meniscus): the one non-negative sharing
    design kept private pathways.'
  novelty: Soft sharing by reparameterization on masked pools; the implemented side_mask_shared_head
    hard tie was never run and this replaces it.
  coverage: The two meniscus labels.
  exploitation: A gain with the half-knee loss would stack both as the meniscus incumbent.
  budget: No measurable runtime change.
  implementation: Reparameterizes the two meniscus head rows in model.py under model.compartment_evidence.
    Stacks on the meniscus-only side mask when it is the incumbent; otherwise carries
    it. Log the norms of w_shared and each delta per epoch.
  open_choices: Initialization at the mean of the two rows; no penalty. Fixed before
    launch.
  dependencies: []
  priority_rationale: Cheap test of whether sharing works once the pools are separated.
  status: completed
  created_revision: 7
  ranking_rationale: "The completed half-knee candidate meets the recorded rule: macro\
    \ AUC rose from 0.902760 to 0.905834 (+0.003074), with a central 80% paired lower\
    \ bound of +0.001517. It already includes the fitted midline, so the queued fitted-midline-only\
    \ run would repeat that change. The prepared mask stays at the reserved head;\
    \ the previous report was rejected for parking work in progress. Admit the shared-plus-residual\
    \ meniscus head: both meniscus labels gained, while cross-talk rose, making compartment\
    \ assignment a relevant next question. OA cross-talk also rose despite AUC gains,\
    \ supporting the OA readout\u2019s position ahead of the less certain coronal-axis\
    \ idea."
  experiments:
  - meniscus-shared-residual-head-20260924T002131Z-99e289c6
  - meniscus-shared-residual-head-20260924T002657Z-24ba1afc
