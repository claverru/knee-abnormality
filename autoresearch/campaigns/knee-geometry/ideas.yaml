- id: side-normalized-3d-position
  mechanism_id: absolute-side-normalized-3d-position-replacing-1d-2d
  parent_idea_id: null
  title: Replace the 1D and 2D position embeddings with one absolute, side-normalized
    3D patient-position encoding
  opportunity: 'Tokens carry slice position (1D) and in-image position (2D), neither
    of which says where the token is in the knee across series. User hypothesis: a
    good 3D encoding makes 1D and 2D redundant. The retired additive 3D embedding
    sat beside 1D and 2D and was not side-normalized, so the same offset meant medial
    in one knee and lateral in the other.'
  mechanism: 'For every token, q = (knee_side_sign * (p_x - c_x), p_y - c_y, p_z -
    c_z) in mm, with p the token''s patient position and c the study (or knee) centre;
    encode q with 3D sinusoidal features (fixed wavelengths spanning about 8 to 512
    mm) plus a small MLP, and add it to the token in place of position_1d and position_2d,
    which are removed. Reflection rule: mirroring flips both p_x - c_x and the effective
    side, so the side-normalized x is reflection-invariant and y, z are unchanged;
    reflection TTA must give identical q. Fallbacks: unknown side keeps y and z and
    replaces the x features with a learned unknown-side vector; invalid geometry (no
    trusted patient position) replaces the whole encoding with a learned unknown-position
    vector. The control''s 1D and 2D embeddings are removed by design, so no study
    falls back to them; the completion reports metrics for unknown-side and invalid-geometry
    studies separately.'
  precedents:
  - 'outputs/analysis/token-attention-vs-k05-clean: dropping 1D/2D with only relative,
    raw-LPS 3D RoPE gave -0.0015 (PF OA -0.0152, Fracture -0.0153; meniscus +0.0027,
    OA +0.0035), confounded with an added attention block.'
  - 'docs/inference/submissions/2026-09-15-champion-without-3d-at-inference.md: the
    additive, non-side-normalized 3D embedding was worth about 0.'
  novelty: Absolute and side-normalized, replacing rather than joining 1D and 2D;
    anterior structures such as the patellofemoral joint stay locatable, unlike the
    relative-only arm.
  coverage: All labels and all tokens.
  exploitation: 'If PF OA or Fracture still lose, the origin (12.8 mm superior-inferior
    error) is the next refinement: a learned soft-argmax or rule-based joint-line
    origin.'
  budget: One small MLP per token; no measurable runtime change.
  implementation: Replaces the 1D and 2D embeddings in model.py and spatial_tokens.py
    with the 3D encoding under model.position_encoding; reflection in augmentation.py
    and inference/reflection.py must keep q consistent. Origin is the robust centre;
    builds on the geometry bundle when it is the incumbent, otherwise carries its
    surviving components. Report PF OA, Fracture and MCL deltas explicitly.
  open_choices: Wavelength range and MLP width fixed before launch; the origin stays
    the robust centre (its scatter, A-P 4.7 mm and S-I 7.8 mm, is below the 20 mm
    token spacing).
  dependencies: []
  priority_rationale: Tests the user's hypothesis directly and builds on the geometry
    the bundle fixes.
