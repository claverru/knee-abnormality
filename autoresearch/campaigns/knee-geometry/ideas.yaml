- id: sagittal-normal-knee-frame
  mechanism_id: medial-axis-along-sagittal-slice-normal
  parent_idea_id: null
  title: Measure each token's medial position along the knee's sagittal slice normal
    instead of scanner X
  opportunity: 'Knees sit rotated in the scanner: the sagittal slice normal deviates
    from scanner X by a median 6.7 degrees (p90 16.2) across 4,410 studies. For a
    posterior horn 40 mm behind the centre that shifts X by more than 10 mm in 14%
    of studies, enough to push lateral posterior horn tokens across the side mask''s
    +/-10 mm band.'
  mechanism: medial_mm = knee_side_sign * dot(p - c, n_ml), where p is the token's
    patient position, c the study (or knee) centre, and n_ml the unit sagittal slice
    normal projected onto the axial plane and oriented toward patient left (+X). Take
    n_ml as the study's median sagittal normal; studies without a sagittal series
    keep scanner X. Everything else, including the bias and any mask, reads medial_mm
    unchanged.
  precedents:
  - 'outputs/analysis/knee-rotation-survey-20260923/result.md: median 6.7 deg, 30%
    above 10 deg; several sagittal series of one study agree (median spread 0 deg).'
  novelty: The medial axis has always been scanner X.
  coverage: Compartment labels through the bias and any mask; matters most in the
    ~30% of studies rotated above 10 degrees.
  exploitation: If it helps, the same frame side-normalizes the 3D position encoding.
    If it hurts, the normal follows the prescription (for example the ACL) rather
    than the knee.
  budget: A per-study normal at preparation; no measurable runtime change.
  implementation: Adds the normal to the per-study geometry (geometry.py or laterality.py,
    dataset.py) and uses it in model.py's medial_mm; reflection must mirror it consistently.
    Setting under data.study_geometry. Builds on the geometry bundle when it is the
    incumbent; otherwise carries its surviving components. Report per-stratum deltas
    for rotation above and below 10 degrees.
  open_choices: Median sagittal normal per study, axial-plane projection; fixed before
    launch.
  dependencies: []
  priority_rationale: Measured premise and a large touched share, but the axis itself
    is a hypothesis, so it runs alone after the bundle.
  status: completed
  created_revision: 5
  ranking_rationale: 'The one allowed repair produced no new candidate: the workspace
    still has only the four mask-related changes against historical-control, and no
    sealed source, diff, configuration, or integration declaration. The prior review
    required the mask to build on an adopted geometry bundle or carry its surviving
    components. That bundle is still running, so the required composition cannot be
    established. Block and park this idea after the unsuccessful repair; the remaining
    queue keeps its relative order.'
  experiments:
  - sagittal-normal-knee-frame-20260923T224825Z-cf59ae3d
  decision: reject
