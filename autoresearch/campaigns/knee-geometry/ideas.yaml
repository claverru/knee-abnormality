- id: meniscus-half-knee-mil
  mechanism_id: side-aware-half-knee-token-mil-for-menisci
  parent_idea_id: null
  title: Teach meniscus token features the medial-lateral split with a training-only
    half-knee MIL loss on a shared tear detector
  opportunity: 'The meniscus mask removes sibling tokens from the pooling but not
    sibling pixels from each token: a stride-32 token near the midline takes about
    30% of its input from the other half. Nothing tells the trunk that, in a study
    with one torn meniscus, the other half must look clean. Training fold 0 has 1,150
    exclusive medial and 279 exclusive lateral meniscus studies.'
  mechanism: Training only. One linear token detector d(t) = v . t + b over the normalized
    tokens, shared by both menisci. For every study with resolved side and valid geometry,
    split its tokens into medial and lateral halves by medial_mm, excluding the +/-10
    mm band (the mask's partition). Each half gets a smooth-max of d over its tokens;
    the medial score trains on the Medial Meniscus target and the lateral score on
    the Lateral Meniscus target with the targets' soft BCE and class-balance weights.
    Added to the main loss at weight 0.075. Forward and predictions are unchanged;
    unknown side or invalid geometry is skipped.
  precedents:
  - 'permutation-invariant-half-knee-mil (medial-lateral-transfer, invalid): same
    halves with a min over both assignments because side was unknown; crashed on step
    1 from a bf16 dtype bug in _segment_smooth_max (total allocated in bf16, exp()
    promoted to fp32). Diff in outputs/autoresearch/medial-lateral-transfer/experiments/permutation-invariant-half-knee-mil-20260921T035443Z-6d769087/changes.diff.'
  - 'side-mask: meniscus +0.0046 when judged blind, so the family benefits from own-side
    evidence.'
  - 'anatomical-attention-local-lesion-evidence-retry (-0.0058 meniscus) and the hard-tied
    meniscus head (-0.0071): shared detectors in the public path lost, so this detector
    stays training-only.'
  novelty: First trained run of half-knee supervision, now side-aware; the only mechanism
    here aimed at the receptive-field leak without half-image inputs.
  coverage: The two meniscus labels, all planes, every study with resolved side and
    valid geometry.
  exploitation: 'Pairs with the shared-plus-residual head: the loss shapes the tokens,
    the head reads them. If it helps, the same loss for OA is not implied: forcing
    OA apart lost three times.'
  budget: One linear map and a segment smooth-max per study; about 1% extra step time.
  implementation: Adds the auxiliary to training/lightning.py, reading tokens and
    medial_mm exposed by model.py in training only; settings under trainer.half_knee_loss.
    Compute the smooth-max in float32. Stacks on the meniscus-only side mask when
    it is the incumbent; otherwise carries it (and the geometry bundle's surviving
    components). Log the auxiliary loss and the share of studies used per epoch.
  open_choices: Weight 0.075 and band 10 mm from the original design; smooth-max temperature
    fixed before launch.
  dependencies: []
  priority_rationale: Addresses the one leak the mask cannot, at no inference cost,
    and revives a never-trained design.
