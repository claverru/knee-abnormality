  novelty: Changes public classified content without removing coordinates from attention
    or auxiliary supervision. Unlike historical appearance-only tying, it preserves
    private heads and nonlinear visual-position interactions. Unlike the developing
    core-band readout, it changes token values rather than exposing regional provenance.
    It introduces no learned gate, new parameters or additional loss.
  coverage: "The hypothesis predicts gains for both meniscus labels, with OA and other-eight\
    \ family deltas near zero. Retain sibling-clean as well as sibling-positive discrimination;\
    \ reduced cross-talk alone is insufficient. All six supplied recent runs lost\
    \ Baker\u2019s, Contusion and Fracture while gaining Effusion, mostly with intervals\
    \ crossing zero. That recurring tradeoff warrants inspecting the complete label\
    \ vector, not treating unchanged readout code as protection from shared-training\
    \ effects."
  exploitation: Uses the accepted meniscus mask to select anatomical support and preserves
    useful positional conditioning established as a plausible requirement by the negative
    position-removal precedent. The same existing private classifier now evaluates
    a visual increment over positional context. Main-loss gradients still reach visual
    features and contextual modules; the accepted locality objective remains available
    to teach lesion features.
  budget: No added trainable parameters, images or encoder passes. Additional work
    is normalization of a+p and a, subtraction, and pooling two value rows; N(a) can
    be computed per represented acquisition type. Complexity remains linear in tokens
    and feature width. This appears modest beside the 1,653-second incumbent, but
    total runtime and temporary tensor memory remain unmeasured against the 1,846-second
    ceiling.
