- id: meniscus-overlap-smoothed-mil
  mechanism_id: training-only-overlap-graph-smoothing-before-half-knee-pooling
  parent_idea_id: meniscus-detector-ranked-pooling
  title: Make the auxiliary meniscus detector consistent across spatially aligned
    inputs that share source slices
  opportunity: "Detector-ranked public pooling reduced effective core tokens from\
    \ about 67 to 28 and lost meniscus AUC. That suggests investigating detector coherence\
    \ before giving it public routing authority, without establishing that isolated\
    \ detector peaks caused the loss. Source inspection confirms that distinct selected\
    \ triplets can share input slices, while the auxiliary scores each triplet\u2019\
    s tokens independently."
  mechanism: "Within each acquisition and auxiliary half, connect corresponding spatial\
    \ anchors from selected triplets that share source slices. Use only visually valid,\
    \ geometrically eligible endpoints in the same contiguous acquisition run; never\
    \ connect different acquisitions or compartments. Set symmetric edge weight a_ij\
    \ to the number of shared slices divided by three. For detector logits d, weighted\
    \ graph Laplacian L and maximum weighted degree D, perform one fixed diffusion\
    \ step q = d \u2212 Ld/(1+D). Isolated nodes retain d. Feed q into the incumbent\u2019\
    s count-normalized log-sum-exp and unchanged auxiliary BCE. This symmetric averaging\
    \ preserves constant logits and redistributes gradients across overlapping observations.\
    \ Geometry and source identities determine every edge; detector predictions do\
    \ not determine correspondence. Public pooling remains unchanged on trusted studies."
  precedents:
  - "[Detector-ranked completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/jobs/orchestrator-20260924T032909Z-0aefe93f/report.json):\
    \ meniscus \u22120.001032, OA \u22120.004006, other-eight \u22120.001398, with\
    \ family 95% intervals crossing zero. Reduced cross-talk and concentrated attention\
    \ did not improve discrimination; reranking and fallback changed together."
  - '[Incumbent auxiliary](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/experiments/meniscus-half-knee-mil-20260923T231102Z-edeb9f68/source/src/knee_abnormality/training/lightning.py:133)
    pools independent detector logits. [Preparation](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/experiments/meniscus-half-knee-mil-20260923T231102Z-edeb9f68/source/src/knee_abnormality/data/preprocessing/preparation.py:278)
    requires distinct middle slices but permits shared source slices between triplets.'
  - '[Retired token-graph result](/home/claudio/src/knee-abnormality/docs/validation/results/2026-09-14-token-graph-result.md):
    learned feature message passing remained largely unused in two historical runs;
    removing it changed macro AUC by only +0.000007/+0.000039. The proposed fixed
    scalar operation has no learned residual gate and affects only locality supervision.'
  - "[Castro-Mac\xEDas et al., NeurIPS 2024](https://proceedings.neurips.cc/paper_files/paper/2024/file/8db9279f593652ee9bb2223b4a2c43fa-Paper-Conference.pdf)\
    \ studies graph smoothing for MIL localization on histopathology and hemorrhage\
    \ CT. It supports examining local dependencies, not this overlap graph, fixed\
    \ diffusion step or a meniscus benefit."
  - '[Earlier researcher report](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/jobs/researcher-20260924T005048Z-35cfe0c6/report.json)
    deferred repeated-witness MIL because overlapping inputs are not independent witnesses.
    This proposal explicitly treats overlap as dependence and makes no independent-confirmation
    claim.'
  novelty: Introduces a deterministic relationship between auxiliary observations
    instead of changing their positional representation, membership or public attention.
    Unlike the dormant historical graph, it has no learnable message network. Unlike
    repeated-witness MIL, it does not require two independent lesion observations.
    It can retain an accepted folded-position representation without depending on
    its currently undecided result.
  coverage: 'Only eligible meniscus auxiliary tokens with overlapping, aligned neighbors
    change directly. Coverage under realized sampling and series dropout is unmeasured;
    disconnected tokens remain unchanged. Expected signature: improved meniscus family
    AUC through more coherent local evidence, with approximately neutral OA and other-eight
    deltas. Repeated other-family regressions in recent runs make shared-trunk costs
    a material concern.'
  exploitation: Log nonisolated study/half/token exposure, edge counts, shared-slice
    fractions, raw-versus-smoothed logit changes and auxiliary gradient concentration.
    Examine meniscus margins and cross-talk together with all three family deltas
    and learned strengths. Reduced graph roughness is a mechanism check, not evidence
    of anatomical correctness or a numerical win.
  budget: Uses retained source identifiers and sparse scalar operations after the
