- id: meniscus-fractional-footprint-mask
  mechanism_id: public-meniscus-mask-from-integrated-token-cell-support
  parent_idea_id: meniscus-axis-consensus-membership
  title: "Weight meniscus attention by the fraction of each token\u2019s footprint\
    \ inside its permitted half"
  opportunity: "The public mask assigns an entire token using one anchor on the middle\
    \ input slice. The incumbent\u2019s 32-pixel stride and 0.625 mm spacing imply\
    \ nominal 20 mm interior cells before augmentation\u2014equal to the full shared\
    \ midline band. Boundary routing can therefore change abruptly despite modest\
    \ coordinate changes. Axis consensus reduced cross-talk but lost AUC; it does\
    \ not establish that broader binary membership improves localization."
  mechanism: "Replace the binary public meniscus mask with a geometric support fraction.\
    \ Define each anchor\u2019s cell by neighboring-anchor midpoints, bounded by the\
    \ image. Transport its corners through the existing inverse augmentation/reflection\
    \ map. For each input channel, clip the polygon to valid image support and calculate\
    \ the area fraction satisfying the existing own-side inequality, signed medial\
    \ position > \u221210 mm. Average the three channel fractions to obtain f. Add\
    \ log(f) to that meniscus attention score; f=0 excludes the token. Keep the anatomical\
    \ tanh bias and its learned strength. Both menisci use the same construction.\
    \ Retain the existing auxiliary core assignment and MIL objective, OA whole-knee\
    \ pooling, and other-eight readouts. The footprint controls routing; it is not\
    \ claimed to represent the backbone\u2019s receptive field."
  precedents:
  - '[Incumbent geometry and grid](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/experiments/meniscus-half-knee-mil-20260923T231102Z-edeb9f68/source/src/knee_abnormality/modeling/spatial_tokens.py):
    verified stride 32; feature_geometry transports anchors but does not integrate
    cells. The recorded training configuration supplies 0.625 mm spacing. The 20 mm
    cell extent is a source-derived calculation, not measured exposure.'
  - "[Axis-consensus completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/jobs/orchestrator-20260924T042755Z-929c3474/report.json):\
    \ meniscus \u22120.000923, OA \u22120.002495, other-eight \u22120.003688; family\
    \ 95% intervals crossed zero. Meniscus cross-talk fell to 0.5227 while 188,049\
    \ auxiliary token exposures were removed. This motivates retaining auxiliary membership\
