    \ meniscus +0.002658, OA +0.003562, other-eight \u22120.003769; all family 95%\
    \ intervals crossed zero. Attention and removal of both positional embeddings\
    \ changed together."
  - '[DICOM Image Plane Module](https://dicom.nema.org/medical/dicom/current/output/chtml/part03/sect_C.7.6.2.html)
