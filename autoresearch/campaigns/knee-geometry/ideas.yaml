  novelty: Replaces the rejected within-core heterogeneity hypothesis with a cross-region
    interaction. It preserves whole-knee evidence and allows context to alter the
    implication of own-core features without requiring equal OA predictions or separating
    their evidence. It differs from both additive shared channels and generic covariance
    expansion. The queued meniscus core-band readout is a linear regional contrast
    for another family, not this product.
  coverage: The hypothesis predicts improved discrimination for both OA labels, particularly
    avoiding the repeated medial-gain/lateral-loss pattern. Meniscus and other-eight
    family deltas should remain near zero; shared gradients can still move all labels.
    Examine OA discrimination within sibling-positive and sibling-clean strata alongside
    the full label vector. Better margins or reduced cross-talk without OA and macro
    gains would not support the mechanism.
  exploitation: Retains the existing global OA pathway while exposing whether own-core
    features co-occur with context in the same MRI acquisition. Keeping acquisition
    boundaries avoids products between unrelated contrast offsets. Existing attention
    mass determines contribution without acquisition equalization. The zero-initialized
    decoder receives an immediate gradient from computed features, avoiding a second
    zero gate.
  budget: "Adds 512 decoder parameters at the current 256-feature width. Two regional\
    \ grouped sums, one elementwise product and two readouts remain O(tokens \xD7\
    \ width), comparable to the completed dispersion reductions. No extra backbone\
    \ pass, quadratic token graph or sampling changes. The dispersion run took 1,677.22\
    \ seconds; that is a feasibility precedent, not a runtime measurement for this\
    \ proposal."
  implementation: 'Against supplied revision 377, add the interaction residual in
    model.py using acquisition identifiers and float32 grouped reductions. Retain
    fitted geometry, meniscus mask and half-knee MIL, anatomical strengths, OA base
    logits and the other-eight path. Do not restore the rejected variance branch or
    OA auxiliary loss. Use zero residual for untrusted studies and report any required
    whole-study fallback correction separately. Log acquisitions with both regions,
    regional attention masses, feature-product magnitude and residual activity. Classification:
    small-changes.md; canonical recording remains with the supervisor. Preserve newly
    accepted meniscus changes. If an OA readout is accepted during development, retain
    its distinct base/context evidence and review where this residual attaches; retire
    this proposal if equivalent regional interactions are already represented. Reassess
    dependencies if the active half-knee method is superseded.'
  open_choices: The product may amplify disease co-occurrence shortcuts and worsen
    lateral OA false positives. Regional feature means can cancel, and small context
    mass can make the residual weak. Shared receptive fields undermine strict tissue
    separation. Current dual-region acquisition coverage and feature-product distributions
    are unknown. Retain the existing boundary and fixed diagonal construction; do
    not select interaction ranks, spatial offsets or scales by score.
