  - "[Folded-position completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/knee-geometry/jobs/orchestrator-20260924T055630Z-313225a6/report.json):\
    \ meniscus +0.002336, OA +0.000064, other-eight \u22120.002196; all family intervals\
