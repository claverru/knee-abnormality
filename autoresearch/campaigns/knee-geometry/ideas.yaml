- id: oa-own-context-bilinear-readout
  mechanism_id: oa-within-acquisition-own-core-context-feature-products
  parent_idea_id: oa-own-half-feature-dispersion
  title: Interpret OA own-side appearance through context from the same acquisition
  opportunity: "The OA dispersion run lost \u22120.000994 family AUC despite improved\
    \ margin and cross-talk; medial OA gained while lateral OA fell. Its decoder learned\
    \ nonzero weights, so the result cannot simply be dismissed as an unused branch.\
    \ Within-core variance measures heterogeneity but cannot describe how local evidence\
    \ changes meaning with surrounding degeneration. A geometry-separated interaction\
    \ offers a different hypothesis consistent with retaining OA\u2019s whole-knee\
    \ evidence."
  mechanism: "Retain each OA whole-knee logit as the base. For each label c and acquisition\
    \ j, reuse its existing attention and partition visually valid tokens into own\
    \ core, signed distance >10 mm, and the remaining knee context. Using non-affine\
    \ LayerNorm of projected visual features before positional additions, compute\
    \ attention-weighted sums U_cj and V_cj in the two regions. Let M_cj be their\
    \ combined original attention mass. Form h_c=\u03A3_j(U_cj \u2299 V_cj)/M_cj,\
    \ with zero contribution when either region is absent. This equals an acquisition-mass-weighted\
    \ product of regional means, attenuated by their mass fractions. Add r_c\xB7h_c\
    \ to the base logit, with two private zero-initialized vectors and no extra bias\
    \ or gate. Both OA labels use the same operation and ordinary main BCE. Pair regions\
    \ only within an acquisition; neither registration nor learned landmarks are required."
