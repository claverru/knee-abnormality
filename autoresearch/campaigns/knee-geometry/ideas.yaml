  coverage: 'Applies to geometrically eligible meniscus half-bags across all three
    planes. Hypothesis: both menisci improve through better shared detector conditioning,
    with improved margin or cross-talk as supporting diagnostics. OA and other-eight
    should remain approximately neutral, although gradients through shared embeddings
    and features can affect them. Log changed auxiliary tokens by plane and retained
