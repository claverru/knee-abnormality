- id: mixed-field-140-160
  mechanism_id: mixed-field-shared-backbone
  parent_idea_id: null
  title: Alternate 140 mm and 160 mm slices by depth, with a field embedding on the
    tokens
  opportunity: Splitting the slice budget between the incumbent's field and the wide
    one gives the model the clipped periphery at no extra compute. It differs from
    the reference only by the wide slices, so it isolates what adding them is worth.
  mechanism: 'Field policy: within each series type of a study the selected slices
    are ordered by depth and alternate between the narrow field (140 mm) and the wide
    field (160 mm). In validation and prediction even depth ranks are narrow and odd
    ranks wide; in training the starting field is drawn per study, series type and
    epoch. Each token adds a learned 256-wide embedding of its slice''s field, initialized
    at zero. One shared backbone and the joint attention pool, unchanged.'
  precedents:
  - 'Tissue clipped at 140 mm: 34% of sagittal series, 2% at 160 mm (prior-work.md,
    Geometry).'
  - position_2d is built from normalized image coordinates, so tokens need to be told
    their field (prior-work.md, Code facts).
  novelty: No run has mixed fields in one study.
  coverage: All studies and labels; each field is sampled at half the depth density,
    so x1 checkpoint selection sees about two slices per field and series type.
  exploitation: field_share_140 and field_share_160; val_macro_auc_field_narrow and
    val_macro_auc_field_wide per label; the norm of the field embedding per epoch.
  budget: Same slices and epochs as the reference.
  implementation: Field policy in data.field (config.py), data/dataset.py and data/preprocessing;
    the field embedding and the per-field diagnostic pooling in modeling/. Slice selection
    keeps the 140 mm radius. Replaces the incumbent's field policy; if field-jitter
    was adopted, this policy supersedes it.
  open_choices: None; the two fields share the slices equally.
  dependencies: []
  priority_rationale: The user's base design and the smallest step from the reference
