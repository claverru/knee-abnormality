- id: mixed-field-readout-weights
  mechanism_id: mixed-field-shared-backbone
  parent_idea_id: null
  title: Mixed 120/160 mm with per-field readout weights inside the joint attention
    pool
  opportunity: 'One linear readout per label collapses evidence from two fields that
    serve different labels: the wide slices carry Baker''s cyst, MCL and fracture,
    the narrow ones the central joint. Per-type readout weights in the joint pool
    were accepted on ResNet-18 for plane and contrast, while dense readouts with their
    own loss lost 0.0052.'
  mechanism: The field policy and field embedding of mixed-field-120-160. For each
    label keep one partial vector per field, u_cf = sum over tokens of field f of
    alpha_ci * h_i, with the same global attention denominator, and compute z_c =
    sum_f w_cf . u_cf + b_c. Initialize every w_cf from the shared w_c, which reproduces
    the single readout at the start. No per-field loss.
  precedents:
  - 'revisits campaign, plane-contrast-readouts on ResNet-18: +0.0009, 80% [+0.0001,
    +0.0017], accepted; dense-plane-readouts: -0.0052 (prior-work.md, Precedent table).'
  - 'Multi-scale review: a secondary branch counts only with its own readout path
    (docs/research/multiscale-features-knee-mri.md).'
  novelty: Readout weights split by field of view, not by plane or contrast.
  coverage: All studies and labels.
  exploitation: The divergence of each w_cf from its initialization per epoch and
    per label; val_macro_auc_field_narrow and val_macro_auc_field_wide per label against
    mixed-field-120-160.
  budget: Twice the readout weights; negligible. Same slices and epochs as the reference.
  implementation: Field policy and embedding as mixed-field-120-160, taken from its
    frozen source if it was rejected. A new model option in config.py and modeling/model.py
    for the per-field readout weights; compute the per-field contributions without
    a large pooling tensor. Replaces the incumbent's field policy and adds to its
    readout.
  open_choices: None; initialization is fixed.
