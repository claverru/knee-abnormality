- id: field-backbones-routed
  mechanism_id: field-backbones
  parent_idea_id: null
  title: Mixed 120/160 mm with one ResNet-18 per field, each slice through its field's
    backbone
  opportunity: A shared backbone must serve two pixel sizes 33% apart. Unshared weights
    let each specialize, at the cost of each backbone training on half the slices;
    against mixed-field-120-160 this measures what unsharing buys.
  mechanism: The field policy and field embedding of mixed-field-120-160. Two ResNet-18
    backbones start from the same RadImageNet weights, each anchored to them by L2-SP;
    a slice goes through the backbone of its field and the feature maps return in
    the original order to the shared projection and the joint attention pool. No per-field
    readouts or losses.
  precedents:
  - One ResNet-18 per plane with the joint pool tied (+0.00005, revisits); with dense
    readouts it lost 0.0033 (prior-work.md, Precedent table).
  - 'Three ReXNet-200 plane backbones: +0.0020 local, tied publicly, +35% training
    time and twice the Kaggle time (docs/history/plane-backbones.md).'
  novelty: Backbones split by field of view of the same planes, not by plane.
  coverage: All studies and labels.
  exploitation: Per-backbone drift and gradient RMS per stage; val_macro_auc_field_narrow
    and val_macro_auc_field_wide per label against mixed-field-120-160.
  budget: Forward compute as the reference; expect up to about 35% more training time,
