- id: plane-weighted-fields
  mechanism_id: mixed-field-shared-backbone
  parent_idea_id: null
  title: Mostly 120 mm, with 160 mm on half of the axial and a quarter of the sagittal
    slices and none of the coronal ones
  opportunity: 'The two single-field runs say detail is worth more than width: 120
    mm beats 160 mm by 0.0046 (95% [+0.0016, +0.0076]) and leads on nine labels, clearly
    on the lateral meniscus, ACL, medial OA and effusion; 160 mm leads outside noise
    only on synovitis (+0.0097, [+0.0012, +0.0189]). An even split wastes half the
    slices on the weaker field: mixed-field-140-160 lost 0.0013 and its wide tokens
    alone scored below its narrow ones. So the wide field should get fewer slices,
    placed in the planes where it can help and costs least. Axial contributes almost
    nothing to the menisci and ACL and carries the fluid findings; synovitis is read
    equally from axial and sagittal, and sagittal is the plane the 140 mm window clips
    most (34% of series); coronal carries MCL, the medial meniscus and medial OA and
    is clipped least (9%).'
  mechanism: 'Field policy: within each series type of a study the selected slices
    are ordered by depth. Axial series: odd depth ranks are decoded at 160 mm, even
    ranks at 120 mm. Sagittal series: ranks with rank modulo 4 equal to 2 at 160 mm,
    the others at 120 mm. Coronal series: every slice at 120 mm. Validation and prediction
    use exactly these ranks; in training the rank offset is drawn per study, series
    type and epoch, keeping each plane''s share. Each token adds the zero-initialized
    learned embedding of its slice''s field. One shared backbone and the joint attention
    pool, unchanged. About a fifth of the slices end up at 160 mm.'
