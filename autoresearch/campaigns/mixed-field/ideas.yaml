- id: field-160-single
  mechanism_id: single-field
  parent_idea_id: null
  title: Single 160 mm field at 224 px (0.714 mm) for every slice
  opportunity: The 140 mm window clips more than 10 mm of tissue in 34% of sagittal,
    16% of axial and 9% of coronal series; at 160 mm that falls to 2%, 6% and 0% (prior-work.md,
    Geometry). Nothing has measured what the ring is worth on the current recipe,
    and a mixed result cannot be read without it.
  mechanism: data.spacing_mm 0.7142857142857143 (160/224) in training, validation
    and prediction; nothing else changes.
  precedents:
  - 150 to 140 mm at 224 px gained +0.003 local and +0.007 public on ReXNet-200, confounded
    with the sharper spacing (docs/research/input-resolution.md).
  - Learned zoom read every slice at 0.875 mm and lost 0.0228, almost all on detail
    labels; effusion gained 0.006 (docs/history/crop-selection-investigation.md).
  novelty: First field change on ResNet-18, rebuild_state_v2 and all_5fold_scanner_v2.
  coverage: All studies and labels; expected to help Baker's cyst, MCL and fracture
    and to cost ACL and the menisci.
  exploitation: Per-label AUC against the incumbent, read by the periphery and detail
    groups of prior-work.md; it is the width yardstick for every later seed.
  budget: Same as the reference (1,222 s).
  implementation: Configuration-only change to the incumbent recipe. The crop radius
    used for source ranking follows the field; that is accepted for the two single-field
    yardsticks only.
  open_choices: None.
