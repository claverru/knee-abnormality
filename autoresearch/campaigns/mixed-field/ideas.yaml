- id: extent-ruled-field
  mechanism_id: extent-ruled-field
  parent_idea_id: null
  title: 140 mm by default, 160 mm for a series whose tissue overhangs the 140 mm
    window
  opportunity: Widening every slice costs resolution in series that fit in 140 mm.
    A third of sagittal series do not fit; a rule on measured tissue extent widens
    only those and keeps the full depth density at one field per series.
  mechanism: 'Field policy: each series is decoded at 140 mm unless its tissue mask
    on the middle slice extends more than 10 mm past the image-centred 140 mm window
    on an in-plane side that is not along the leg (anterior or posterior in sagittal,
    left or right in coronal, any side in axial); then all its slices are decoded
    at 160 mm. The same rule runs in training, validation and prediction. The tissue
    mask is a threshold rule: smooth by 1.5 mm, take the background from the border
    strips, threshold at 8% of the way to the 99th percentile, keep the largest component
    and fill it; a mask covering more than 90% of the image is unusable and keeps
    140 mm. Tokens add the zero-initialized field embedding.'
  precedents:
  - 'Tissue more than 10 mm past 140 mm: 34% of sagittal, 16% of axial and 9% of coronal
    series (prior-work.md, Geometry); only a wider field removes it, since the tissue
    is already centred.'
  - 'The mask and its checks: outputs/analysis/i/input-resolution-research-20260915/images/common.py
    (tissue_mask) and scripts/adhoc/check_narrow_field_fit.py.'
  novelty: A field chosen per series from measured extent; no trained model in the
    loader.
  coverage: About a third of sagittal series and a tenth of the others change; the
    rest keep the reference input exactly.
  exploitation: field_share_160 per plane and epoch; per-label AUC split by studies
    with and without a widened series; val_macro_auc_field_narrow and val_macro_auc_field_wide
    where both occur.
  budget: One extra native decode of the middle slice per series; same slices and
    epochs as the reference.
  implementation: The rule in data/preprocessing, cached per series next to the slice
    index; field policy in data.field (config.py) and data/dataset.py; field embedding
    in modeling/. Slice selection keeps the 140 mm radius. Replaces the incumbent's
    field policy.
  open_choices: None; the 10 mm threshold is the one the clipping table uses.
  dependencies: []
  priority_rationale: The only design that keeps full depth density and follows the
    measured clipping directly.
  status: completed
