- id: field-jitter
  mechanism_id: field-jitter
  parent_idea_id: null
  title: Random field per training slice from 120, 140 and 160 mm with real pixels;
    validation at 140 mm
  opportunity: The affine augmentation rescales the already-cropped 140 mm image by
    0.95 to 1.05, so the model never sees tissue outside 140 mm nor detail finer than
    0.625 mm. Decoding training slices at other fields adds both as augmentation while
    inference stays exactly the incumbent's.
  mechanism: 'Field policy: in training each selected slice is decoded at 120, 140
    or 160 mm with equal probability, one draw per slice from the run seed, study,
    series type, operation and epoch; validation and prediction decode every slice
    at 140 mm. No field embedding and no other model change. The affine augmentation
    keeps its scale range.'
  precedents:
  - Scale augmentation by resampling is standard in multi-scale training of detectors;
    here the wider draws add real anatomy instead of padding.
  - 'docs/research/input-resolution.md: the stored field of view is 160 mm at the
    median, so the ring holds real pixels in about half the series.'
  novelty: No run has varied the decoded field during training.
  coverage: All studies and labels; inference inputs are unchanged.
  exploitation: field_share_120, field_share_140 and field_share_160 per epoch; training
    loss and x1 validation curves against the incumbent; per-label AUC.
  budget: Same slices and epochs as the reference; decoding at three spacings may
    slow the loader slightly.
  implementation: Add the field policy to a new data.field section of config.py with
    the single 140 mm field as the value that reproduces the incumbent. data/dataset.py
    decodes each selected slice at its drawn spacing with the patient maps and valid
    rectangles built for that spacing; slice selection keeps the 140 mm radius. Replaces
    the incumbent's field policy.
  open_choices: None.
  dependencies: []
  priority_rationale: Cheapest source change; leaves inference untouched and tells
    whether the model tolerates the three fields before any seed mixes them at inference.
  status: completed
