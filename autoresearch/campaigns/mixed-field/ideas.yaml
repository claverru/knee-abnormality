- id: two-stream-paired
  mechanism_id: paired-two-stream
  parent_idea_id: null
  title: Every slice at 140 mm through a ResNet-10t and at 120 mm through the ResNet-18,
    tokens of both in the joint pool
  opportunity: 'Eight results say the useful pair is a narrow view and the reference
    view, not 160 mm: 160 mm lost 0.0034 alone and added nothing in any shared-backbone
    design (even mixes with 140 and 120 mm, plane-weighted, extent-ruled -0.0017),
    while 120 mm alone gained 0.0011 and lost only on labels that prefer the reference
    field (synovitis, Baker''s cyst, medial meniscus). Splitting slices between two
    fields halves each field''s depth density; reading every slice at both 120 and
    140 mm removes that cost and lets each label use its better field on every slice.
    Taking each label''s better field from the single-field runs would be worth about
    0.002.'
  mechanism: 'Field policy: every selected slice is decoded twice, at 120 mm and at
    140 mm, in training, validation and prediction. The ResNet-18 reads the 120 mm
    view; a Refined-RadImageNet ResNet-10t (resnet10t.c3_in1k, backbone learning rate
    6e-5, L2-SP anchored) reads the 140 mm view. Each stream has its own projection
    to 256; the tokens of both enter the joint attention pool with the zero-initialized
    field embedding. The two views of a slice are augmented independently. No per-stream
    readouts or losses. No slice at 160 mm.'
  precedents:
  - 'This campaign: field-120-single +0.0011 (80% [-0.0004, +0.0026]); field-160-single-logged
    -0.0034; mixed-field-140-160 -0.0013; extent-ruled-field -0.0017; 120 against
    160 directly +0.0046 (95% [+0.0016, +0.0076]).'
  - ResNet-10t as the only backbone lost 0.0053 (revisits); here it reads the reference
    field as a second view beside the ResNet-18.
  - Halving slice coverage tracked score in the crop runs, which is the case against
    splitting slices between fields.
  novelty: Two fields of the same slice through backbones of unequal size; first paired
    design, and the first to pair 120 mm with the reference field.
  coverage: All studies and labels, every slice at both fields.
  exploitation: val_macro_auc_field_narrow (120 mm tokens) and val_macro_auc_field_wide
    (140 mm tokens) per label; the share of attention mass on 140 mm tokens per label
    and epoch; training seconds; per-label AUC against field-120-single, with synovitis,
    Baker's cyst and the medial meniscus as the labels the 140 mm stream should recover.
  budget: 'Ten epochs at 20 slices per study (user, 2026-10-01: fewer epochs is not
    acceptable). Measured: the first attempt took 223 s per epoch, the read-once repair
    two-stream-paired-20261001T164742Z-87f55a3b 194 s (projected 1,946 s against the
    1,833 s limit). A profile of that repair on the GPU (30 training steps, synchronous
    CUDA) shows the loader is not the bottleneck (0.02 s wait per batch); the step
    is: augmentation 26% of step time (bilateral smoothing alone 14%), backward 25%,
    the two backbones'' forward 13%, logging 5-9%. Augmentation runs once per view
    on all three slice channels although model.slice_channels repeated_middle uses
    only the middle one. Augmenting the middle channel alone should bring the epoch
    to about 165-170 s.'
  implementation: 'Second repair: keep the read-once loader, model, pooling gate and
    field policy of attempt two-stream-paired-20261001T164742Z-87f55a3b. In the paired
    encode path, when model.slice_channels is repeated_middle, select the middle slice
    channel of the images, their valid rectangles and source-channel indices BEFORE
    augmentation and reflection, run every augmentation on that single channel for
    each view, and expand to three channels only for the backbone, so no augmentation,
    mask or filter is computed for the two unused neighbour slices. Per-series augmentation
    statistics (for example the GIN energy rescale) are then taken over the middle
    slices, which is the only content the model sees; the random draws per series
    and per slice stay as they are. Also make the per-step logging this idea added
    (per-stream augmentation activity) accumulate on the device and log once per epoch
    instead of calling the logger for every stream on every step; keep the activation
    metric. Do not change epochs, slices, the loader, the non-paired path or any augmentation
    setting. Replaces the incumbent''s field policy.'
  open_choices: 'None: trainer.max_epochs stays 10 and data.study_triplet_total stays
    20; the time comes from not augmenting unused slice channels.'
  dependencies: []
  priority_rationale: 'User decision, 2026-10-01: the second stream moved from 160
    to 140 mm after eight results; the design with the highest ceiling at a cost the
    1.5x range can hold.'
