- id: rn10t-policy-weights
  mechanism_id: policy-gradient-weights
  parent_idea_id: null
  title: ResNet-10t started from the authors' mask-trained ("heated") checkpoint instead
    of their standard one (measurement against the ResNet-10t reference)
  opportunity: The authors report that classifiers pretrained under their policy-gradient
    mask transfer better (RadImageNet macro F1 0.484 against 0.452 for ResNet-10t;
    gains on MedMNIST and few-shot tasks). The heated checkpoint is their intended
    start for fine-tuning; our training plays that role. Whether it helps on our task
    is a guess. The mask-trained files exist only for ResNet-10t and ResNet-50, so
    this runs on the ResNet-10t against its own reference, rn10t-view-label-bias (x4
    0.927543, x1 0.921848, 1,141 s).
  mechanism: 'model.backbone resnet10t.c3_in1k, model.pretrained_weights radimagenet_policy,
    optimizer.backbone_lr 0.0002, optimizer.anchor_alpha_early 0.00088, optimizer.anchor_alpha_late
    0.000088, and data.mean [0.485, 0.456, 0.406] with data.std [0.229, 0.224, 0.225]
    (the reference''s values, whatever the incumbent holds). Every other setting exactly
    as the incumbent. The rate and the anchor strengths follow the checkpoint''s weight
    scale: its convolution RMS is 0.05305 against 0.01576 for the standard ResNet-10t,
    so the rate is 6e-5 x 3.37 and each anchor strength is the reference''s (0.01,
    0.001) divided by 3.37 squared, which keeps the same relative step and the same
    relative pull.'
  precedents:
  - 'outputs/training/20261004-094416-rn10t-view-label-bias: the reference, standard
    ResNet-10t weights at backbone LR 6e-5.'
  - 'prior-work.md, Checkpoints: file, hash and weight scale; The authors mask method.'
  - 'docs/modeling/backbone-swaps.md#checkpoint-weight-scale: the rate rule.'
  novelty: First use of a mask-trained RadImageNet checkpoint in this project.
  coverage: All studies and labels.
  exploitation: x4 and x1 against rn10t-view-label-bias (the comparison of interest)
    and against the incumbent; per-epoch x1 and training loss against the reference;
    per-stage drift.
  budget: About 1,141 s, as the ResNet-10t reference.
  implementation: 'The seven values above in configs/training.yaml, plus one small
    source change in modeling/model.py, which loads only the standard weights today:
    (a) the guard `model.pretrained_weights == "radimagenet" and model.backbone not
