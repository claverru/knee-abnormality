  opportunity: 'ACS convolutions are the standard way to run 2D-pretrained kernels
    in 3D and the baseline Cross-D-Conv is compared against in its own tables: each
    layer''s output channels are split in three groups whose 2D kernels are applied
    in the three orthogonal planes of the volume. It needs no new checkpoint, keeps
    the incumbent''s weights, and is the partner of crossd-3d-stem: adjacent slices
    through the incumbent''s own kernels. Gain is a guess.'
