- id: radimagenet-bounded-contrast-calibration
  mechanism_id: input-statistics
  parent_idea_id: radimagenet-input-statistics
  title: Calibrate acquisition contrast toward the pretrained standard deviation with
    bounded gains
  opportunity: Guess grounded in the accepted normalization result and label-free
    input measurements. Prepared slices have reported standard deviation 0.252, whereas
    the pretraining normalization uses 0.3213. Correct normalization helped, but residual
    acquisition contrast differences may still change how pretrained filters respond.
    The pretraining statistic is dataset-wide, so matching individual acquisitions
    is not known to be beneficial.
  mechanism: "After augmentation and before the existing normalization, compute each\
    \ acquisition's mean and standard deviation over its rendered nonzero middle-slice\
    \ pixels. Use g=clamp(0.3213/max(s,1e\u22126),1/1.25,1.25), then x'=clamp(mean+g(x\u2212\
    mean),0,1), preserving zero pixels and leaving constant acquisitions unchanged.\
    \ Share the gain across the acquisition's slices and channels. Apply the same\
    \ deterministic mapping at inference. Log affected acquisitions, gain distribution,\
    \ cap frequency, clipping fraction, pixel change and before/after dispersion.\
    \ On the first training batch of each epoch, measure paired original/mapped knee\
    \ mass with a frozen pretrained diagnostic network; this never controls the mapping."
  precedents:
  - '[Normalization comparison](/home/claudio/src/knee-abnormality/outputs/autoresearch/refined-radimagenet/experiments/radimagenet-input-statistics-20261004T103433Z-ff2f3786/comparison/comparison.json):
    accepted macro delta +0.000581, 80% interval [+0.000182, +0.001016].'
