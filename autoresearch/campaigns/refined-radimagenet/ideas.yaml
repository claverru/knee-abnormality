    as the incumbent (radimagenet). Input N x 3 x 3 x 224 x 224 as in crossd-3d-stem.
    In conv1 and the four 3 x 3 convolutions of layer1 (all 64 output channels), the
    2D weight w (64 x in x k x k) is used as three 3D kernels with depth stride 1:
    output channels 0-21 in the image plane, w[:22] as 1 x k x k with padding (0,
    p, p); channels 22-42 in the depth-width plane, w[22:43] as k x 1 x k with padding
    (p, 0, p); channels 43-63 in the depth-height plane, w[43:] as k x k x 1 with
    padding (p, p, 0); in-plane strides as the layer''s (conv1 (1, 2, 2)), outputs
    concatenated in channel order. BatchNorm, activation and the stem''s max pooling
    act per depth slice. After layer1 the middle depth slice (index 1) is taken, N
    x 64 x 56 x 56, and layer2 to layer4 run as the incumbent''s 2D layers. The parameters
    are the incumbent''s own 2D tensors under their own names, so the pretrained load,
    L2-SP anchors, rates and the checkpoint layout are unchanged.'
  precedents:
