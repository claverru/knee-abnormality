- id: random-smooth-mask
  mechanism_id: random-input-mask
  parent_idea_id: policy-mask-rn10t
  title: The same blurred multiplicative mask drawn at random, with no policy network
  opportunity: 'Evidence-backed as a question: the paper reports that the learned
    dataset-level Beta parameters converge to an almost uniform distribution, and
    the mask is 90% that dataset part. This run uses the same mask shape with uniform
    cells and no policy, at no extra training time. It tells whether the regularization
    comes from the mask itself or from the policy, and if it works it is the cheap
    version.'
  mechanism: 'trainer.input_mask.kind random (grid 64, kernel 13, sigma 6.0, epochs
    null) and model.input_mask_expectation true. Per training step and slice: m uniform
    in [0, 1] of shape N x 1 x 64 x 64 (Beta(1, 1)), resized to 224 by nearest neighbour,
