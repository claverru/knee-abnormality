    at the incumbent''s cost and keeps most of the pretrained function: on 96 held-out
    slices the frozen static network puts 0.85 of its probability on the 18 knee classes
    (0.95 for the authors'' dynamic network) and agrees with it on the top class for
    57% of slices. Taking the kernels without the shift destroys the function (knee
