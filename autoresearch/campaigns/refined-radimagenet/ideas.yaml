- id: crossd-3d-stem
  mechanism_id: crossd-conv
  parent_idea_id: crossd-resnet18-drop-in
  title: Cross-D kernels as true 3D convolutions over the three adjacent slices, the
    authors' 2D-to-3D conversion applied to our triplets
  opportunity: The point of Cross-D-Conv is that 2D-pretrained 3D kernels can be used
    as real 3D convolutions. Our loader already decodes three adjacent slices per
    input and the recipe throws two away (repeated middle slice). Feeding neighbours
    as input channels lost before (-0.0039 and -0.00005, prior-work.md); here they
    enter through pretrained depth kernels instead. Gain is a guess.
  mechanism: 'model.depth_stem crossd, model.slice_channels depth, model.pretrained_weights
    radimagenet_crossd, optimizer.backbone_lr 0.0002, anchor_alpha_early 0.000043,
    anchor_alpha_late 0.0000043 (as crossd-resnet18-drop-in). Input per token: the
    three adjacent slices as depth, each repeated over the three input channels: N
    x 3 (channels) x 3 (depth) x 224 x 224. The network is the authors'' 3D conversion
    (every convolution a plain Conv3d with weights_3d, the same stride on all three
    axes, 3D max pooling, no rotation networks) evaluated on a depth of 3: conv1 is
    a Conv3d(3, 64, 7, stride 2, padding 3) with the 64 x 3 x 7 x 7 x 7 kernel, giving
    depth 2; bn1 and the activation act per depth slice; 3D max pooling (kernel 3,
    stride 2, padding 1) gives depth 1; from there every 3 x 3 x 3 convolution with
    padding 1 on a depth of 1 equals the 2D convolution with the middle depth slice
    of its kernel, so layer1 to layer4 are ordinary 2D layers whose weights are weights_3d[:,
    :, 1] (weights_3d[:, :, 0] for the 1 x 1 x 1 downsample kernels). Output N x 512
    x 7 x 7 as now.'
  precedents:
