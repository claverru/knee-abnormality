    checkpoint layout.'
  - 'radimagenet-rn18 campaign: mean-initialized adjacent slices -0.0039, gated adjacent
    residuals -0.00005.'
  novelty: First use of adjacent slices through pretrained 3D kernels.
  coverage: All studies and labels; every token now sees its two neighbours.
  exploitation: Log per epoch depth_stem_side_energy, the share of the stem kernel's
    squared weight that lies outside its middle depth slice (it starts near 6/7),
