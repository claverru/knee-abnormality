    prepared mean/std 0.335/0.252; the checkpoint''s normalization yields knee-class
    mass 0.978.'
  - The external continuous-normalization work changes quantized storage and preserves
    the intensity mapping. This proposal retains storage and preparation, and adds
    a bounded model-side contrast mapping.
  novelty: Uses the checkpoint's published input statistic to define a deterministic
    acquisition-level mapping. It neither repeats a mean/std setting nor changes generic
    augmentation probability.
  coverage: Explores intensity mapping, a remaining input-statistics direction, uniformly
    across acquisitions and targets.
  exploitation: Retains the adopted normalization and uses one restrained contrast
    cap to investigate its remaining distribution mismatch.
  budget: "Keep ten epochs, batch size 8, 26 slices, 4370 steps and seed 1533697213.\
    \ Vectorized acquisition reductions add modest work. Diagnostic frozen-network\
    \ passes run only on the first batch of each epoch. Expected training near 1265\u2013\
