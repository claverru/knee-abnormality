- id: knee-logit-token-features
  mechanism_id: pretrained-knee-classifier
  parent_idea_id: null
  title: Feed each token's 18 pretrained knee-class logits to our head as an extra
    input
  opportunity: The pretrained 165-class head is discarded although 18 of its classes
    are knee MRI findings (ACL, MCL, meniscal, chondral, fluid, bone inflammation,
    fracture and others; 179,555 training images). Under the checkpoint's normalization
    its knee logits alone, averaged per study with no training, reach AUC 0.69 on
    average against our labels and 0.83-0.85 for contusion and fracture (prior-work.md).
    The idea keeps those directions in feature space available to our head instead
    of asking the random projection to rediscover them. Gain is a guess.
  mechanism: model.knee_logit_features true. The 18 knee rows of the pretrained classifier
    (weight 18 x 512, bias 18; rows at RADIMAGENET_KNEE_CLASSES indices, in index
    order) are stored in the model as persistent buffers and never trained. For every
    token, z = W_knee f + b_knee, with f the raw 512-channel backbone feature of that
    token (the live, fine-tuned backbone), giving N x 49 x 18. A new Linear(18, 256),
    weight and bias initialized to zero, maps z to the token width, and its output
    is added to features right after self.projection, before the position and type
    embeddings and mil_norm. At step 0 the model equals the incumbent; the new layer
    receives gradient immediately because z is not zero. Requires data.mean [0.3162,
    0.3162, 0.3162] and data.std [0.3213, 0.3213, 0.3213].
  precedents:
  - 'prior-work.md, Pretrained head on our slices: knee mass 0.978 and zero-shot AUCs
    under the checkpoint normalization.'
  - 'contract.md, Build facts: radimagenet_classifier and RADIMAGENET_KNEE_CLASSES
    are built.'
  novelty: The pretrained classifier has never been used here.
  coverage: All studies and labels; all 18 knee classes for every target.
  exploitation: Log per epoch knee_logit_projection_norm (Frobenius norm of the new
    layer's weight), knee_logit_mean and knee_logit_std (over tokens and classes),
    and knee_logit_top_class_share (share of tokens whose largest knee logit is each
    of the three most frequent classes). Per-label deltas, with contusion, fracture,
    ACL and the menisci expected to move most.
  budget: One 18 x 512 matrix product per token; same cost as the incumbent.
  implementation: 'Adds to the incumbent. (1) config.py: ModelConfig.knee_logit_features
    bool default false. (2) model.py __init__: when true, register_buffer knee_classifier_weight
    (18 x C) and knee_classifier_bias (18), persistent, filled with zeros, then, only
    when pretrained weights are being loaded (the same condition as the backbone''s
    radimagenet load), copy the rows of radimagenet_classifier(model.backbone, model.pretrained_weights)
    at the sorted RADIMAGENET_KNEE_CLASSES indices; create self.knee_logit_projection
    = nn.Linear(18, 256) under torch.random.fork_rng and zero its weight and bias.
    At prediction the buffers come from the checkpoint, so no pretrained file is read.
