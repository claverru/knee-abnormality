- id: crossd-gated-depth-stem
  mechanism_id: crossd-conv
  parent_idea_id: crossd-static-kernels
  title: Cross-D static kernels with the stem's two neighbouring depth slices applied
    to the adjacent slices through a gate that starts at zero (keeper seed replacing
    crossd-3d-stem)
  opportunity: 'Repair of a faulty seed. crossd-3d-stem took the checkpoint''s kernels
    without their shift, which scrambles them (frozen network: knee mass 0.000), and
    ran its 3D stem ungated; it scored x1 0.61, 0.71, 0.71 in its first epochs and
    is no evidence about the idea. The idea stands: the loader decodes three adjacent
    slices and the Cross-D stem kernel has trained depth slices on both sides of the
    one used in 2D. Applied ungated, the side slices break the pretrained function
    even with correct kernels (three identical slices: knee mass 0.016). So the side
    slices enter through a per-channel gate that starts at zero: at step 0 the network
    is exactly crossd-static-kernels, and it opens the gate only as far as the neighbours
    help. Gain is a guess.'
  mechanism: 'As crossd-static-kernels, plus model.slice_channels depth and model.depth_stem
    gated. The stem becomes: out = conv_mid(middle slice repeated on three channels)
    + gate[channel] * conv_side(previous slice x 3 channels, next slice x 3 channels),
    then bn1 and the rest unchanged. conv_mid is the static 7 x 7 stem kernel of crossd-static-kernels
    (64 x 3 x 7 x 7); conv_side is a Conv2d(6, 64, 7, stride 2, padding 3, no bias)
    holding the two depth slices next to the middle one of the same shifted 3D stem
    kernel; gate is 64 values initialized to zero. crossd_static_state_dict(model.backbone,
    depth_stem=True) returns conv1.weight as 64 x 9 x 7 x 7 with input channels ordered
    previous x 3, middle x 3, next x 3: channels 3:6 are conv_mid (identical to the
    depth_stem=False stem, checked) and channels 0:3 with 6:9 are conv_side. Rates
    and anchors as crossd-static-kernels; the gate trains at head_lr without weight
    decay and is not anchored.'
  precedents:
  - 'run-notes.md, runs 13 and 14: the per-slice layer over time, and crossd-3d-stem
    started from unshifted kernels.'
  - 'modeling/crossd.py: crossd_static_state_dict(depth_stem=True), checked on CPU:
    with the neighbours zeroed the 9-channel stem equals the 2D stem.'
  - 'radimagenet-rn18 campaign: gated adjacent residuals -0.00005 with untrained neighbour
    kernels; here the neighbour kernels are pretrained depth slices.'
