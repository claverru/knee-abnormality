- id: radimagenet-input-statistics
  mechanism_id: input-statistics
  parent_idea_id: null
  title: Normalize inputs with the checkpoint's own mean 0.3162 and std 0.3213 instead
    of the ImageNet values
  opportunity: Evidence-backed. The Refined-RadImageNet checkpoints were trained with
    mean 0.3162 and std 0.3213 on all three channels (the authors' presets.py); our
    recipe feeds them ImageNet mean and std. On 8,615 prepared validation slices the
    frozen pretrained ResNet-18 with its 165-class head puts 0.088 of its probability
    on the 18 knee classes under our normalization (top class US thyroid, 0.387) and
    0.978 under its own, with a knee class on top for 98.5% of the slices (prior-work.md,
    Pretrained head on our slices). Fine-tuning currently starts from features computed
    out of the checkpoint's input domain.
  mechanism: 'data.mean [0.3162, 0.3162, 0.3162] and data.std [0.3213, 0.3213, 0.3213]
    in configs/training.yaml. Nothing else changes: the model already normalizes with
    these two config values in encode_batch.'
  precedents:
  - 'prior-work.md, Pretrained head on our slices: knee-class mass 0.088 against 0.978,
    label-free.'
  - 'docs/research/radimagenet-weights.md: the earlier BatchNorm check matched no
    candidate mean and left normalization resting on the script default.'
  - 'docs/ongoing/radimagenet-backbone.md: the original RadImageNet ResNet-50 needed
    [-1, 1] inputs, found the same way.'
  novelty: First run of a Refined-RadImageNet backbone with the normalization it was
    trained with.
  coverage: All studies and labels.
  exploitation: Per-epoch x1 against the incumbent from epoch 0 (a start inside the
    pretraining domain should show in the first epochs), per-stage drift of the backbone
    (expected lower in the stem and layer1), anchor_penalty, per-label deltas.
  budget: Same cost as the incumbent, about 1,181 s.
  implementation: Configuration-only change to configs/training.yaml (data.mean, data.std).
    Replaces the ImageNet constants; no source change. Check with a static read that
    no other place hardcodes the ImageNet constants for the backbone input. If accepted,
    later seeds inherit it, except the two ResNet-10t seeds, which keep their reference's
    normalization.
  open_choices: None.
