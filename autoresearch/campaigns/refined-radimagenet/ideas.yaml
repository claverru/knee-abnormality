- id: policy-mask-rn10t
  mechanism_id: policy-gradient-mask
  parent_idea_id: null
  title: Train the ResNet-18 under a learned policy-gradient input mask, with a ResNet-10t
    policy network trained from scratch, mask on for all ten epochs
  opportunity: 'The authors'' method applied to our own fine-tuning (user idea, 2026-10-04):
    a small policy network learns per-slice multiplicative masks that regularize the
    classifier. Their policy network was never published, and it was rewarded on RadImageNet''s
    loss, so we train our own on our loss, as their code does from scratch. Gain on
    our task is a guess. Inference never runs the policy.'
  mechanism: 'New trainer.input_mask (kind policy, grid 64, kernel 13, sigma 6.0,
    epochs null, policy_backbone_lr 0.0006, policy_pretrained false) and model.input_mask_expectation
    true. Policy on the Lightning module: timm resnet10t (pretrained False, num_classes
    0, 512 pooled features) and two heads alpha and beta, each Linear(512,512), BatchNorm1d,
    ReLU, Linear(512,512), BatchNorm1d, ReLU, Linear(512,4096); buffers base_alpha
    and base_beta of shape 1 x 4096 started from torch.rand. Per training step, on
    the normalized slices x (N x 3 x 224 x 224, detached) that the backbone is about
    to see: f = policy(x); a = alpha(f), b = beta(f) in float32; new_alpha = 0.9 base_alpha
    + 0.1 a, new_beta likewise, both clamped to [-4, 4]; then base_alpha = 0.99 base_alpha
    + 0.01 mean_over_slices(a.detach()), base_beta likewise. dist = Beta(exp(new_alpha),
    exp(new_beta)); m = dist.sample() clamped to [1e-4, 1 - 1e-4] (no gradient through
    the sample); mask = gaussian_blur(interpolate(m.view(N, 1, 64, 64), size 224,
    nearest), kernel 13, sigma 6); the backbone encodes x * mask. Losses: the incumbent''s
    full loss computed from the masked input, unchanged and unscaled, plus policy_loss
    = mean over slices of logsumexp_cells(dist.log_prob(m)) times the detached disease
    loss of the slice''s study (class-balanced BCE averaged over that study''s observed
    targets). The policy loss moves only the policy; the model''s loss moves only
    the model. Validation and prediction: no policy, no sampling; the model multiplies
    its normalized input by the persistent buffer input_mask_expectation (1 x 1 x
    224 x 224), which the Lightning module sets at the end of every training epoch
    to the blurred, resized mean of the dataset mask, exp(base_alpha) / (exp(base_alpha)
    + exp(base_beta)).'
  precedents:
  - 'prior-work.md, The authors mask method: every constant above is theirs (grid
    64, kernel 13, sigma 6, momenta 0.9 and 0.99, base from torch.rand, policy ResNet-10t
    without pretrained weights, evaluation with the dataset-level mask).'
  - https://github.com/convergedmachine/Policy-Gradient-Driven-Noise-Mask/blob/main/_policy_gradient/train_one_epoch.py
  - 'Two deliberate differences from their code: their single product loss also rescales
    the classifier loss by the log-probability term, ours leaves the model loss unscaled;
    their evaluation samples a mask, ours uses its mean so prediction stays deterministic.'
  novelty: No learned input regularizer has been tried here; DSU and GIN are fixed-rule.
  coverage: All studies and labels; every slice is masked in training.
  exploitation: 'Log per epoch: input_mask_mean and input_mask_std (over pixels and
    slices), input_mask_alpha_mean and input_mask_beta_mean (exp of new_alpha and
    new_beta), input_mask_base_alpha_mean, input_mask_base_beta_mean, input_mask_policy_loss,
    input_mask_clamp_fraction, input_mask_expectation_mean, and the policy gradient
    norm before clipping. Compare per-epoch x1 and training loss with the incumbent.'
  budget: 'One extra ResNet-10t forward and backward per slice: estimated 1.5 to 1.6
    times the incumbent, about 1,800-1,900 s, unmeasured; the range allows 2,362 s.'
  implementation: 'Adds to the incumbent; nothing is removed. (1) config.py: InputMaskConfig
    under TrainerConfig (kind none, policy or random; grid; kernel; sigma; epochs
    int or null; policy_backbone_lr; policy_pretrained) with kind none as default,
    and ModelConfig.input_mask_expectation bool default false; a validator requires
    input_mask_expectation true exactly when kind is not none. (2) model.py: when
    the option is true, register_buffer("input_mask_expectation", ones(1, 1, image_size,
    image_size), persistent=True); encode_batch takes an optional input_mask callable;
    right after valid_images.sub(self.mean).div_(self.std) it multiplies by input_mask(valid_images)
    in training when a callable is given, and by the buffer when not training. (3)
    lightning.py: build the policy module under torch.random.fork_rng beside report_attribute_heads,
    outside self.model; pass it to build_optimizer through heads, with parameters
    under its feature extractor at policy_backbone_lr and its two heads at head_lr;
    training_step passes the mask callable to self.model.encode_batch and adds policy_loss;
    compute the Beta, log_prob and logsumexp in float32 with autocast disabled; override
    configure_gradient_clipping so the policy''s parameters are clipped separately
    at gradient_clip_val and the model with the existing heads together as now; on_train_epoch_end
    writes the expectation buffer. With epochs null the mask is on in every epoch.
    The half-knee and report-attribute terms use the same encoded batch and need no
    change. kind random and an integer epochs are used by later seeds: implement the
    fields, and raise for kind random until random-smooth-mask adds it. If accepted,
    later seeds train under the mask.'
  open_choices: None.
  dependencies: []
  priority_rationale: User seed; the parent of the three mask variants.
  status: completed
  created_revision: 0
  seeded: /home/claudio/src/knee-abnormality-refined-radimagenet/autoresearch/campaigns/refined-radimagenet/seed-ideas.yaml
  experiments:
  - policy-mask-rn10t-20261004T114633Z-b68939c7
  decision: reject
- id: policy-mask-two-stage
  mechanism_id: policy-gradient-mask
  parent_idea_id: policy-mask-rn10t
  title: Policy-gradient mask for the first six epochs, then four epochs without it,
    as the authors' heated then fine-tuned scheme
  opportunity: 'The authors'' final models are heated under the mask and then fine-tuned
    without it; their heated model does poorly on clean input until that second stage
    (prior-work.md). This is the version of the mask closest to their method, inside
    our ten epochs: the last four epochs see clean slices and prediction needs no
    mask at all.'
  mechanism: 'As policy-mask-rn10t with trainer.input_mask.epochs 6: epochs 0-5 train
    under the sampled mask exactly as in that seed; from the start of epoch 6 the
    policy is not run, no policy loss is added, the model sees unmasked normalized
    slices, and input_mask_expectation is set to ones, so validation of epochs 6-9
    and prediction use clean input. The learning-rate schedule is the incumbent''s
    single warmup and cosine over ten epochs, unchanged.'
  precedents:
  - 'prior-work.md, The authors mask method: heated model poor on unmasked input until
    fine-tuned.'
  - 'policy-mask-rn10t: the mechanism and its code.'
  novelty: The staged variant of the previous seed.
  coverage: All studies and labels.
  exploitation: The scalars of policy-mask-rn10t for epochs 0-5; x1 per epoch, with
    the step at epoch 6 when the mask goes off (validation moves from the expected
    mask to clean input); BatchNorm running statistics of bn1 before and after epoch
    6 (mean of running_mean and running_var), since the input scale changes there.
  budget: 'Six epochs with the policy and four without: estimated 1.3 to 1.4 times
    the incumbent, about 1,550-1,650 s, unmeasured.'
  implementation: Changes only trainer.input_mask.epochs from null to 6 on the mask
    code. If policy-mask-rn10t was accepted the code is in the incumbent; if not,
    port it from that run's frozen source (outputs/autoresearch/refined-radimagenet/experiments/policy-mask-rn10t-*/source/)
    with kind policy and apply this change. In on_train_epoch_start, when current_epoch
    equals epochs, fill input_mask_expectation with ones and stop passing the mask
    callable; do not write the expectation at the end of later epochs. The policy
    stays in the optimizer with no gradient, which AdamW skips. If policy-mask-rn10t
    was accepted, this seed is judged against it as the incumbent.
  open_choices: None.
  dependencies: []
  priority_rationale: User seed; the authors' own two-stage scheme.
  status: completed
