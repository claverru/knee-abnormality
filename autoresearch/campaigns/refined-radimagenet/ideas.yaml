- id: random-mask-moment-restoration
  mechanism_id: random-input-mask
  parent_idea_id: random-smooth-mask
  title: Restore acquisition input moments after applying the authors' random smooth
    mask
  opportunity: Diagnosis-backed retry; performance benefit is a guess. The random
    mask operated at mean 0.5 and spatial standard deviation 0.0789, altering the
    scale supplied to a standard pretrained backbone. Its deterministic inference
    input was also halved. Restore input moments while retaining spatial perturbations
    to separate mask regularization from this scale change.
  mechanism: "Keep uniform 64\xD764 cells, nearest-neighbour resizing and Gaussian\
    \ smoothing with kernel 13 and sigma 6. For normalized inputs z and masked inputs\
    \ y=z\xB7mask, compute shared acquisition moments across slices and pixels, then\
    \ use y'=mean(z)+(y\u2212mean(y))\xB7std(z)/max(std(y),1e\u22126). Constant acquisitions\
    \ remain unchanged. Use clean inputs at validation and inference: restoring moments\
    \ under the old constant expectation mask would likewise recover z. Log actual\
    \ changed slices, original/masked/restored moments, restoration errors, mask dispersion\
    \ and pixel changes. This affine restoration changes the operator, rather than\
    \ merely weakening the mask."
