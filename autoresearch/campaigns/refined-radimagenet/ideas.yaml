    side, gate) with forward(x9) = mid(x9[:, 3:6]) + gate[None, :, None, None] * side(torch.cat((x9[:,
    0:3], x9[:, 6:9]), 1)); after timm.create_model, set self.backbone.conv1 = GatedDepthStem(self.backbone.conv1,
    nn.Conv2d(6, 64, 7, stride=2, padding=3, bias=False), nn.Parameter(torch.zeros(64)))
