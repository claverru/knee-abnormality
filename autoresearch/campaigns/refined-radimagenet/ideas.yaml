    and the top class agrees on 0% of slices. It would train from a broken network,
    as crossd-3d-stem did. The idea stands: adjacent slices through the incumbent''s
    own kernels reoriented across depth. Here every depth-plane channel starts as
    its in-plane self and is blended toward its depth-plane version by a gate that
    starts at zero, so step 0 is the incumbent. Gain is a guess.'
  mechanism: 'model.slice_channels depth and model.depth_stem acs_gated, pretrained
    weights as the incumbent (radimagenet). Input: the three adjacent slices as depth,
    each repeated on three channels (N x 3 x 3 x 224 x 224). In three convolutions,
    backbone.conv1, layer1.0.conv1 and layer1.0.conv2 (64 output channels each, weight
    w of shape 64 x in x k x k, padding p, in-plane stride s), the output is inplane
    + gate[channel] * (acs - inplane), where inplane applies w to every depth slice
    separately (w.unsqueeze(2), kernel 1 x k x k, padding (0, p, p)), and acs is the
    ACS form: channels 0-21 as inplane, channels 22-42 with w[22:43] as k x 1 x k
    kernels (padding (p, 0, p)), channels 43-63 with w[43:] as k x k x 1 kernels (padding
    (p, p, 0)); all with stride (1, s, s). gate is one parameter of 64 values per
    convolution, initialized to zero and clamped to [0, 1] in the forward pass; the
