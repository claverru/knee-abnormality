- id: site-bias-product-of-experts
  mechanism_id: site-bias-logit-offset
  parent_idea_id: scanner-confusion-detached-head
  title: Absorb each scanner group's label-rate shift with a training-only per-site
    logit bias, dropped at validation and inference
  opportunity: 'Training labels are report-derived and carry site reporting conventions
    that the image-derived hidden-test labels do not: the four minor vendors are one
    English-reporting site whose labels run x1.1-x3.6 higher on ten of twelve targets
    (Synovitis x3.56) from reporting completeness, and every header site offset scored
    negative on the gold studies. The adopted scanner confusion head removes site
    information from the features; the label-rate shift itself is still fit by the
    image pathway through whatever site cues remain. User-ordered exception to the
    fixed disease loss (user decision 2026-09-26), because the disease targets and
    evaluation are unchanged and the term is dropped outside training.'
  mechanism: 'A learned table b of shape 8 x 12 (scanner group x disease label), zero-initialized,
    lives in the Lightning module under a forked RNG. During training only, the disease
    loss uses logits f(x) + b[group(study)], where group follows data/folds/all_5fold_scanner_v1/protocol.json
    from the header table the incumbent already loads. The class-balanced BCE, targets,
    gold overrides and half-knee loss are otherwise unchanged. Validation, checkpoint
    selection, saved predictions and export use f(x) alone. b trains at the head learning
    rate without weight decay. Setting trainer.metadata_heads.site_bias: true. Log
    per epoch the mean absolute bias per label and the largest per-group bias.'
  precedents:
  - 'Clark et al., Don''t take the easy way out: ensemble based methods for avoiding
    known dataset biases (arXiv:1909.03683): product of experts with a bias-only model
    during training, removed at test time.'
