- id: area-balanced-attribute-loss
  mechanism_id: attribute-loss-averaging
  parent_idea_id: null
  title: Average the attribute loss within each question group first, then equally
    across groups
  opportunity: 'The attribute loss is one reliability-weighted mean over 35 questions,
    so each group''s share follows its question count: Extra 9, Medial Meniscus 4,
    Lateral Meniscus 3, PF OA 3, the rest 1-2. Cartilage/OA and the menisci carry
    about 43% of the signal, and the questions that fit worst (cartilage depth, meniscus)
    are also the most numerous. The untested alternative noted in the heads design
    is to give every group the same weight.'
  mechanism: 'Read each question''s group from the question set the manifest records
    (configs/labels/jevk5-report-attributes-v3.json, `group` field; 15 groups in target
    set 3.1). For each group g compute the reliability-weighted mean cross-entropy
    over its questions and the batch''s studies with targets, sum(w * CE) / sum(w)
    within g; the attribute loss is the plain mean over the groups present in the
    batch, times the unchanged coefficient 0.1. Setting trainer.report_attribute_heads.loss_averaging:
    group (the incumbent behaviour is question). Log the per-group loss.'
  precedents:
  - Untested alternative, docs/modeling/report-attribute-heads.md#question-weighting.
  - 'Group counts: prior-work.md, v3 answers.'
  novelty: First change to how the attribute questions are weighted against each other.
  coverage: All studies with targets; shifts weight from Extra and the menisci toward
    single-question groups (Study, ACL, OA, Fracture, Effusion, Synovitis).
  exploitation: If it helps, a follow-up can combine it with the winning coefficient;
    if it hurts, the per-question mean stays.
  budget: Negligible.
  implementation: trainer.report_attribute_heads.loss_averaging in config.py; group
    ids loaded with the question set in data/report_attributes.py; averaging in training/report_attributes.py.
  open_choices: None; the groups are the question set's own, the same rule for every
    group.
  dependencies: []
  priority_rationale: A documented, label-agnostic alternative that changes where
    the backbone's attribute gradient goes without changing any target.
  status: completed
  created_revision: 0
  seeded: /home/claudio/src/knee-abnormality/autoresearch/campaigns/auxiliary-signals/seed-ideas.yaml
  experiments:
  - area-balanced-attribute-loss-20260926T115857Z-cb5169c3
  decision: reject
- id: reliability-filtered-attribute-questions
  mechanism_id: attribute-question-selection
  parent_idea_id: null
  title: Drop attribute questions whose mean order agreement is below 0.80, with their
    gated children
  opportunity: 'Per-cell reliability weights already down-weight answers that flip
    between option orders, but the audits showed that systematic errors survive both
    orders. The questions with the lowest mean agreement are those with known systematic
    faults: medial cartilage extent 0.735, Baker''s size 0.758 (invents cysts), lateral
    and PF cartilage extent 0.776, medial cartilage depth 0.787, PF surface 0.799.
    Baker''s lost in both head runs (-0.0027, -0.0064).'
  mechanism: 'At load time compute each question''s mean reliability weight over all
    studies in the 3.1 table and drop every question below 0.80, then drop every gated
    child whose parent was dropped. On target set 3.1 this removes medial_cartilage_extent,
    baker_size, lateral_cartilage_extent, pf_cartilage_extent, medial_cartilage_depth,
    pf_cartilage_surface and baker_ruptured (gated on baker_size), leaving 28 questions.
    The loss and coefficient are unchanged. Setting trainer.report_attribute_targets.min_question_reliability:
    0.8; log the kept question list.'
  precedents:
  - 'Reliability weights and gates: docs/modeling/report-attribute-heads.md#targets.'
  - 'Known weak targets and audits: docs/public-labels/jevk5-report-attribute-extraction.md.'
  - Dropping osteophytes and Hoffa for noise was part of the v3 -> v3.1 change (+0.0003
    vs v3, bundled).
  novelty: First question selection by a fixed reliability rule instead of by hand.
  coverage: Removes 7 of 35 heads, all cartilage extent/depth/surface or Baker's size
    questions.
  exploitation: If it helps, the rule becomes the target builder's default; if it
    hurts, the noisy cartilage questions still carry signal and the next step is re-weighting,
    not removal.
  budget: Fewer heads; negligible.
  implementation: trainer.report_attribute_targets.min_question_reliability in config.py;
    filtering and gate propagation in data/report_attributes.py before the heads are
    built.
  open_choices: None; the 0.80 cut is fixed, not tuned.
  dependencies: []
  priority_rationale: The clearest measured target weakness, addressed by a label-agnostic
    rule on data we already have.
  status: completed
  created_revision: 0
