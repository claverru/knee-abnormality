- id: acquisition-within-group-regression
  mechanism_id: acquisition-physics-supervision
  parent_idea_id: null
  title: Predict acquisition measurements centered within scanner groups using a training-only
    head
  opportunity: The verified header table contains positive TR and TE for 3,344 of
    3,535 training studies, and valid pixel spacing and slice thickness for all 3,535.
    After centering log measurements within the incumbent's eight canonical scanner
    groups, retained variance is 74.52%, 86.39%, 70.70% and 84.71%, respectively.
    Thus substantial numeric variation remains beyond group means. Whether learning
    that variation improves disease features is unknown.
  mechanism: "Use the existing representative-header table to construct four study\
    \ targets: log(TR), log(TE), log(geometric-mean PixelSpacing) and log(SliceThickness).\
    \ Subtract each field's mean within the eight canonical scanner groups, calculated\
    \ solely from training-fold studies, then divide by its pooled training residual\
    \ standard deviation. Pool existing visually valid coronal encoded.features before\
    \ positional additions into one study vector and apply a 256\u2192128\u21924 GELU\
    \ regression head. Add 0.1 times Huber loss with delta 1, averaged over available\
    \ fields per study and then eligible studies. Mask malformed or missing fields\
    \ and studies with no surviving coronal tokens. Scanner identity is used only\
    \ to construct targets; it is not a head input. Drop the head at inference."
  precedents:
  - '[Existing header table](/home/claudio/src/knee-abnormality/outputs/analysis/s/sharing-disagreement-20260914/study_headers.parquet),
    SHA-256 8714fa8b025afe0ff47d0811ca735f0ec75c84808b462486db19553d0c3058f4. Training-fold
    analysis used canonical eight-group mapping, not the table''s finer raw scanner_group
    strings.'
  - '[Scanner target loader](/home/claudio/src/knee-abnormality/outputs/autoresearch/auxiliary-signals/experiments/scanner-confusion-detached-head-20260926T165429Z-55c4db64/source/src/knee_abnormality/training/auxiliary/scanner_confusion.py)
    supplies the canonical grouping and verified training membership pattern.'
  - '[Prior work](/home/claudio/src/knee-abnormality/autoresearch/campaigns/auxiliary-signals/prior-work.md#site-priors)
    documents site-shortcut concerns. Removing group means addresses one identifiable
    component; it does not establish site invariance.'
  - The queued acquisition-physics-feature-modulation proposal supplies numeric headers
    as inference inputs. This proposal instead supervises an image-only training head
    and requires no inference-loader additions.
  novelty: Adds positive supervision for within-group numeric acquisition variation.
    It neither predicts scanner identity nor changes disease logits, and it does not
    depend on the queued acquisition-input result.
  coverage: 'Four fields from existing study headers only. All training representatives
    are coronal: 3,409 fluid-sensitive/fat-suppressed and 126 non-fluid-sensitive/non-fat-suppressed.
    These are representative-study measurements, not verified measurements for every
    sampled acquisition. Missing targets contribute no loss.'
  exploitation: Uses already available projected image features and the existing coronal-plane
    indicator. A small regression head could encourage sensitivity to contrast and
    resolution differences while the retained scanner-confusion component continues
    its existing objective.
  budget: One candidate at seed 2617320043 unless the supervisor's incumbent changes,
    with ten epochs and 4,420 steps. Header parsing and target statistics are CPU
    setup; the head has approximately 33,412 parameters and requires no extra image
    pass. Runtime is unmeasured and must fit 2,267 seconds. The coefficient is fixed
    for this proposal, with no sweep.
  implementation: Add the target loader and regression module under training/auxiliary,
    wired through training/lightning.py and one trainer.metadata_heads option. Verify
    header and split hashes; save group means, residual scales, masks and field definitions
    in checkpoint provenance. Read existing encoded tensors without editing modeling/model.py
    or preprocessing identity. Retain scanner confusion and all unrelated incumbent
    behavior. Log field availability, actually supervised studies, per-field Huber
    loss, MAE and prediction variance each epoch. Use forked initialization and exact
    disabled-path parity. If acquisition conditioning is accepted first, regression
    must read an already exposed pre-conditioning tensor so headers cannot directly
    reveal their own targets; otherwise report integration blocked under the fixed
    identity gate. Keep conditioning on the disease path.
  open_choices: The four fields, canonical grouping, normalization and loss are fixed.
    Representative headers imperfectly describe a study's entire coronal bag. Fixed
    contrast mixing, resolution augmentation and feature-statistics augmentation may
    obscure the requested measurements. Centering removes group means but leaves possible
    scanner information in higher moments.
  dependencies: []
  priority_rationale: 'Priority 3: adds a distinct source of auxiliary supervision
    with measured coverage and residual variation. Representative-series mismatch,
    augmentation conflict and possible interaction with future header conditioning
    make this the highest-uncertainty proposal.'
