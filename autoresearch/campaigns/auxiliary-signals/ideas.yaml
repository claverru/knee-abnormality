    (arXiv:1908.10763).
  - 'Vendor label associations and header stacker: prior-work.md, site priors.'
  - Scanner confusion S67 0.948 public against its paired control S68 0.947 (adoption
    record in this campaign).
  novelty: First mechanism aimed at site label priors rather than site features.
  coverage: All training studies; largest expected effect on Synovitis and OA, the
    most site-inflated labels.
  exploitation: Local labels contain the convention, so a local loss is expected;
    the user judges it with a public submission. If the learned biases are near zero,
    the incumbent's confusion head already covers it.
  budget: 96 parameters; negligible.
  implementation: Bias table and training-only logit offset in training/lightning.py
