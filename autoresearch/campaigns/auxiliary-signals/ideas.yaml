- id: scanner-group-adversarial-head
  mechanism_id: metadata-adversarial-head
  parent_idea_id: null
  title: Remove scanner-group information from the pooled features with a gradient-reversal
    head
  opportunity: 'Site priors help locally but not on gold: every header stacker variant
    scored negative on the 35 gold studies, the four minor vendors are one English-reporting
    site whose labels are elevated on ten of twelve targets, and the hidden-test labels
    come from images, not reports. Local folds reward site priors because the split
    is stratified, not grouped, by scanner. A model that cannot read the scanner from
    its features has to rank by image evidence.'
  mechanism: 'Target: the eight scanner groups of data/folds/all_5fold_scanner_v1/protocol.json,
    from outputs/analysis/s/sharing-disagreement-20260914/study_headers.parquet (check
    SHA-256 8714fa8b025afe0ff47d0811ca735f0ec75c84808b462486db19553d0c3058f4): Siemens,
    Philips and GE split by MagneticFieldStrength into 3T (>= 2), 1.5T (< 2) and unknown;
    every other vendor pooled as minor. Head: a gradient-reversal layer on the study
    tokens the disease head pools, then one attention query (256 -> 128 -> 1) and
    a linear 8-way classifier; cross-entropy against the one-hot group, mean over
    training studies, times trainer.metadata_heads.scanner_adversarial_weight 0.1.
    The reversal factor ramps with training progress p in [0, 1] as 2 / (1 + exp(-10
    p)) - 1 (Ganin and Lempitsky). The head''s own parameters descend normally; only
    the gradient into the tokens is reversed. Training only, dropped at inference,
    forked-RNG initialization. Log loss, accuracy and the reversal factor per epoch;
    accuracy should fall toward the majority-group rate (about 0.26).'
  precedents:
  - 'Header stacker: site +0.0005 local, gold -0.006; protocol +0.0009 local, gold
    -0.006 (prior-work.md, site priors).'
  - 'Ganin and Lempitsky, Unsupervised domain adaptation by backpropagation (arXiv:1409.7495):
    gradient reversal and the ramp schedule.'
  novelty: First attempt to remove site information instead of adding it.
  coverage: All training studies; all labels, most for Synovitis and OA, where site
    priors are largest.
  exploitation: The local rule is expected to understate it, because local labels
    reward site priors. Whatever the local verdict, the user decides with a public
    submission; if scanner accuracy never falls, the reversal is too weak and the
    run is blocked evidence.
  budget: One extra attention pool; negligible.
  implementation: trainer.metadata_heads.scanner_adversarial_weight in config.py;
    table loading and the reversal function in training/auxiliary/; head and loss
    in the Lightning module; table SHA-256 in the checkpoint hyperparameters.
  open_choices: None; weight 0.1 matches the attribute coefficient, the ramp is the
    paper's.
  dependencies: []
  priority_rationale: The only metadata mechanism aimed at the report-versus-image
    mismatch that the gold studies point to.
  status: completed
  created_revision: 1
  seeded: /home/claudio/src/knee-abnormality/autoresearch/campaigns/auxiliary-signals/seed-ideas-2.yaml
  experiments:
  - scanner-group-adversarial-head-20260926T141522Z-0818ece2
  decision: reject
- id: scanner-adversarial-decoupled-weight
  mechanism_id: metadata-adversarial-head
  parent_idea_id: scanner-group-adversarial-head
  title: Retry the scanner-group adversarial head with the head trained at full strength
    and 0.1 applied only to the reversed gradient
  opportunity: 'In scanner-group-adversarial-head the adversary never learned: after
    four epochs its accuracy was 0.18-0.21 and its loss 2.03-1.91, worse than predicting
    the training group frequencies (accuracy 0.263, loss 1.851), even in epoch 0 with
    the reversal factor at 0.24. The cause is in the code: the step returned 0.1 *
    cross-entropy, so the 0.1 weight scaled the head''s own gradient as well as the
    reversed one. A head that cannot recognise the scanner gives the backbone no direction,
    so no scanner information was removed and the run did not test the idea.'
  mechanism: 'Same targets, head, token source, gradient-reversal layer and ramp 2
    / (1 + exp(-10 p)) - 1 as the parent. One change: the head''s cross-entropy enters
    the loss unweighted, so the head''s parameters learn at full strength, and the
    reversal layer''s backward returns -(w * factor) * gradient with w = trainer.metadata_heads.scanner_adversarial_weight
    0.1, so the backbone receives the parent''s intended pressure. Log the head loss,
    accuracy, reversal factor and w * factor per epoch. Validity check: the head''s
    epoch-0 accuracy must exceed 0.263 and its loss fall below 1.851 (it learns at
    least the group frequencies while the reversal is weak); otherwise report the
    run as blocked evidence.'
  precedents:
  - 'Parent run scanner-group-adversarial-head: head below the frequency baseline
    for four epochs (this campaign).'
  - 'Ganin and Lempitsky, Unsupervised domain adaptation by backpropagation (arXiv:1409.7495):
    the domain classifier trains on its full loss; lambda scales only the reversed
    gradient.'
  novelty: Fixes the parent's coupling of head strength and reversal strength; no
    new mechanism.
  coverage: All training studies; all labels.
  exploitation: The local rule is expected to understate it, because local labels
    reward site priors. If the head learns and the reversal holds its accuracy near
    0.26 later in training, the user decides with a public submission paired with
    the fold-3 control.
  budget: Same as the parent; negligible.
  implementation: In training/auxiliary/scanner_adversarial.py the reversal backward
    multiplies by weight * factor; in training/lightning.py the step returns the unweighted
    cross-entropy. No config change beyond the parent's trainer.metadata_heads.scanner_adversarial_weight
    0.1.
  open_choices: None.
  dependencies: []
  priority_rationale: The parent was an implementation failure, not a negative result,
    and the fix is one line in each file.
  status: completed
  created_revision: 96
  seeded: /home/claudio/src/knee-abnormality/autoresearch/campaigns/auxiliary-signals/adversarial-retry-ideas.yaml
  experiments:
  - scanner-adversarial-decoupled-weight-20260926T152823Z-d509df07
  decision: reject
- id: attribute-cell-reliability-filter
  mechanism_id: attribute-question-selection
  parent_idea_id: reliability-filtered-attribute-questions
  title: Apply the existing reliability cutoff to individual study-question cells
  opportunity: Whole-question filtering discarded substantial reliable supervision.
    On the 3,535 training studies, 47.36% of medial cartilage extent cells, 52.98%
    of Baker's size cells and 74.79% of Baker's rupture cells have weight >= 0.80,
    although their questions were removed. Across all 35 questions, cell filtering
    would retain 76.11% of cells and 82.38% of original weight; every training study
    retains at least 11 questions. These are answer statistics, not accuracy measurements.
  mechanism: Keep every incumbent question and its soft target. Replace global mean-reliability
    selection and recursive child deletion with w_new(s,q) = w(s,q) when w(s,q) >=
    0.80, otherwise zero. Construct existing gates before applying this mask; a masked
    parent loss does not delete its child's target. Keep the incumbent weighted-mean
    loss and coefficient. The fixed cutoff operates independently on each study, without
    fitting a selection statistic across training and validation.
  precedents:
  - 'Parent: reliability-filtered-attribute-questions. Its numerical result and retry
    rationale are recorded in the family verdict below.'
  - Training-only coverage was calculated from the hash-verified [3.1 target table](/home/claudio/src/knee-abnormality/data/labels/prepared/jevk5-report-attributes-v3.1/targets.parquet),
    joined to [fold assignments](/home/claudio/src/knee-abnormality/data/folds/all_5fold_scanner_v1/studies.csv)
    with fold != 3.
  - '[Prior work](/home/claudio/src/knee-abnormality/autoresearch/campaigns/auxiliary-signals/prior-work.md#v3-answers-what-the-targets-can-and-cannot-carry)
    documents systematic extraction errors that order agreement cannot detect.'
  novelty: Moves the fixed 0.80 rule from entire questions to individual supervision
    cells. It restores reliable examples within weak questions and removes unreliable
    examples within otherwise retained questions.
  coverage: All 35 incumbent questions and all 3,535 training studies remain represented.
    Disease supervision, sampling and image coverage remain unchanged.
  exploitation: Uses the positive question-selection near-miss while addressing its
    coarse removal of useful examples. No selection depends on disease-label results.
  budget: One supervisor-scheduled run at the current incumbent seed, presently 2617320043.
    Preserve 10 epochs, 4,420 steps and all image workloads; maximum 2,267 seconds.
    The transform is a small CPU mask, with the baseline number of heads and no additional
    encoder passes. Runtime remains unmeasured.
  implementation: Add one option under trainer.report_attribute_targets. Implement
    masking in data/report_attributes.py and record the rule and transformed coverage
    in checkpoint provenance. Retain existing target probabilities, gates, heads,
    question averaging and coefficient. Log per-head targeted visits, retained weight,
    weight removed and divergence over actual training visits each epoch. Disabled
    behavior must reproduce the incumbent, with existing forked-RNG initialization.
    If another incumbent is accepted, retain unrelated improvements; explicitly replace
    any overlapping whole-question reliability filter rather than applying both selection
    rules.
  open_choices: The cutoff is fixed at 0.80. High agreement can still accompany hallucinated
    findings, and inherited gate reliability may overstate child reliability. Neither
    concern authorizes label-based exceptions.
  dependencies: []
  priority_rationale: 'First: required follow-up for the open selection family. It
    has a concrete coverage diagnosis, minimal implementation cost and no new extraction.'
  status: completed
  created_revision: 115
  ranking_rationale: "Admit all five: each has satisfied dependencies, fits the auxiliary-signals\
    \ scope, and differs materially from measured runs. Rank the cell-level filter\
    \ first as the diagnosed follow-up to whole-question filtering, then severity\
    \ merges and conditional children for their measured target properties. Joint\
    \ meniscus targets and shared pooling follow because their proposed benefits rely\
    \ more on untested modeling assumptions. The earlier filter\u2019s +0.001036 gain\
    \ failed adoption because its 80% lower bound was \u22120.000423; this priority\
    \ is for exploration, not an adoption claim."
  experiments:
  - attribute-cell-reliability-filter-20260926T161611Z-4a98f1cf
  decision: reject
- id: attribute-threshold-grade-merges
  mechanism_id: attribute-severity-coarsening
  parent_idea_id: null
  title: Merge size and cartilage-depth options across clinically meaningful severity
    bands
  opportunity: 'Existing extraction analysis identifies unstable fine grades and over-called
    low-severity findings. A label-free calculation over all 4,407 answers shows that
    the proposed merges raise mean order agreement: effusion 0.867 to 0.886, Baker''s
    size 0.758 to 0.849, and medial/lateral/PF cartilage depth approximately 0.787/0.803/0.818
    to 0.867/0.881/0.890. Improved agreement establishes cleaner targets, not a disease-AUC
    gain.'
  mechanism: Apply one mass-preserving merge family to five ordinal questions. For
    all three cartilage-depth questions, merge {no_damage, softening, partial_low}
    into below_high_grade and {partial_high, full_thickness} into high_grade; retain
    unspecified_loss. For effusion_size, merge {none, small} and {moderate, large},
    retaining not_mentioned and unspecified separately. For baker_size, merge {absent,
    other_cyst_only, small} and {moderate, large}, retaining unspecified. Apply these
    maps to both raw option orders after the existing 3.1 merges, average their distributions
    and recompute reliability as one minus TV. Preserve all existing child targets
    and gates constructed before coarsening.
  precedents:
  - '[The sealed manifest](/home/claudio/src/knee-abnormality/configs/labels/jevk5-report-attribute-targets-v3.1.json)
    supplies exact option keys, original merges and raw-answer hashes. Raw answers,
    question set and target table hashes were verified during this review.'
  - '[Cached host criteria](/home/claudio/src/knee-abnormality/docs/metadata/official-label-criteria.md#label-description-discussion-733343-pinned-overview)
    specify high-grade cartilage loss and moderate/large fluid collections. Cartilage
    extent remains a separate requirement.'
  - '[Extraction analysis](/home/claudio/src/knee-abnormality/docs/public-labels/jevk5-report-attribute-extraction.md#v3-full-run-analysis-2026-09-25)
    documents low-grade discrepancies and mixed small-sample gold results. These auxiliary
    merges do not repair disease labels.'
  novelty: Introduces severity coarsening while conserving every option's probability
    mass. Unknown grades remain explicit, and existing child supervision is preserved.
  coverage: All 35 questions remain. On the baseline schema, outputs fall from 181
    to 167. The same rule covers every cartilage compartment and both fluid-size questions,
    selected by measurement type.
  exploitation: Reduces fine distinctions that show order disagreement while retaining
    high-severity and unspecified supervision. Persistent difficulty fitting effusion
    and cartilage depth motivates simplifying their auxiliary tasks.
  budget: One run at the supervisor's current incumbent seed, with the fixed 10 epochs,
    4,420 steps and image workloads; maximum 2,267 seconds. Hash-check and transform
    existing answers once on CPU. Smaller classifiers and unchanged pooling require
    no extra image passes; runtime is unmeasured.
  implementation: Add one target-transform option under trainer.report_attribute_targets.
    Retain the manifest path and build transformed targets at load time from its recorded
    answers. Preserve other questions, coefficient and averaging. Compute child targets
    before coarsening parents so original gate events remain intact. Record exact
    maps, order agreement and hashes; log per-head loss/divergence and targeted visits
    each epoch. Keep disabled parity and forked head initialization. Rebase onto any
    new incumbent, retaining unrelated improvements and explicitly identifying overlapping
    target transformations that this map replaces.
  open_choices: Maps are fixed above. Coarsening may discard useful severity distinctions,
    and greater order agreement does not correct systematic extraction errors. Live
    Kaggle pages returned no readable body; threshold definitions rely on the linked
    repository copy of the host text.
  dependencies: []
  priority_rationale: 'Second: strong label-free evidence, broad anatomical coverage
    and low cost. The main uncertainty is whether simpler auxiliary grades improve
    representation learning.'
  status: completed
  created_revision: 115
  ranking_rationale: "Admit all five: each has satisfied dependencies, fits the auxiliary-signals\
