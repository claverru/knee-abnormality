- id: attribute-ordered-probability-heads
  mechanism_id: attribute-ordinal-readout
  parent_idea_id: null
  title: Parameterize grade and size probabilities with ordered cutpoints while retaining
    all answers
  opportunity: "Five existing questions contain ordered severity or size answers alongside\
    \ nominal answers. Label-free analysis of the 3,535 fold-3 training studies finds\
    \ 86.16%, 90.39% and 89.49% mean target mass on ordered cartilage-depth answers,\
    \ 77.17% for effusion size and 79.08% for Baker's size. Their incumbent final\
    \ KL values span 0.3657\u20130.6408. Sharing a severity axis could improve supervision\
    \ efficiency without discarding fine grades; that benefit is unmeasured."
  mechanism: Replace the output parameterization for medial_cartilage_depth, lateral_cartilage_depth
    and pf_cartilage_depth using order [no_damage, softening, partial_low, partial_high,
    full_thickness]; effusion_size uses [none, small, moderate, large]; baker_size
    uses [absent, small, moderate, large]. All remaining options stay nominal. From
    each question's existing pooled feature, predict severity s, ordered-mass gate
    a and nominal logits. Define increasing learned cutpoints t_j and cumulative probabilities
    C_j=sigmoid(t_j-s); adjacent differences give ordered category probabilities.
    Multiply these by sigmoid(a), and distribute the remaining mass through the nominal
    softmax. Return normalized log probabilities in the original option order to the
    unchanged soft categorical cross-entropy. Use positive cutpoint increments and
    logistic-quantile initialization. Change no targets, gates or reliability weights.
  precedents:
  - '[The sealed 3.1 manifest](/home/claudio/src/knee-abnormality/configs/labels/jevk5-report-attribute-targets-v3.1.json)
    defines the exact option keys. Training-fold mass calculations used its recorded
    targets and the fixed fold membership, without disease labels.'
  - '[Incumbent metrics](/home/claudio/src/knee-abnormality/outputs/autoresearch/auxiliary-signals/experiments/scanner-confusion-detached-head-20260926T165429Z-55c4db64/training/fold_3/logs/version_0/metrics.csv)
    establish the reported final divergences.'
  - '[Cao, Mirjalili and Raschka, 2020](https://arxiv.org/abs/1901.07884) motivates
    rank-consistent neural ordinal outputs. This proposal uses a cumulative-probability
    parameterization with the existing categorical likelihood; it does not import
    CORAL''s binary-task loss.'
  - The closed attribute-severity-coarsening family merged grades. This proposal retains
    all grades and their original soft probability mass.
  novelty: Introduces an ordered classifier structure rather than another target merge,
    hardening rule or question filter. Nominal answers retain a separate probability
    path, so unspecified findings are not assigned an invented grade.
  coverage: Exactly five questions, selected by the stated option taxonomy. All original
    options and all other question heads remain. The three cartilage compartments
    use the same architectural rule without sharing their learned severity parameters.
  exploitation: Reuses each question's current pooled feature. Adjacent grades share
    a learned severity axis, potentially reducing sample requirements for uncommon
    high grades. Existing categorical supervision still constrains the complete answer
    distribution.
  budget: One ten-epoch candidate at the current incumbent seed, currently 2617320043,
    with unchanged 4,420 steps and image workload. Five small output blocks replace
    existing classifier rows; no extra image pass is needed. Expected overhead is
    small but unmeasured; the 2,267-second limit and fixed macro adoption rule apply.
  implementation: Implement the selected output blocks in training/report_attributes.py
    behind one trainer.report_attribute_heads option, retaining all current pooling
    and unrelated classifier rows. Keep scanner confusion, the disease loss and the
    attribute coefficient. Use stable log-CDF differences and preserve the original
    normalized-probability interface. Record ordered keys, nominal keys and initialization
    in checkpoint provenance. Log loss, KL, targeted studies, effective weights, ordered-mass
    predictions and cutpoints per epoch. New initialization must use forked RNG; disabled
    behavior reproduces the incumbent. Retain newly accepted pooling or inference-readout
    improvements because they operate before or after this output parameterization.
    If a future target transform changes these option keys, report the integration
    conflict rather than silently changing the prescribed order.
  open_choices: Mappings and nominal handling are fixed. A single severity axis may
    underfit multimodal soft answers. Baker's size and cartilage targets contain documented
    systematic errors that this architecture cannot repair. Better ordinal fit is
    a hypothesis, not evidence that those answers are correct.
  dependencies: []
  priority_rationale: 'Priority 2: negligible image-compute cost and a distinct inductive
    bias supported by substantial ordered target mass. More restrictive modeling assumptions
    make it less certain than changing attention flexibility.'
