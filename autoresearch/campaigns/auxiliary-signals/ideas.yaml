- id: drop-report-completeness-options
  mechanism_id: attribute-option-removal
  parent_idea_id: null
  title: Remove the options that describe how complete the report was (not mentioned,
    not stated, unspecified) and renormalize
  opportunity: 'Many options encode report wording, not image content: whether the
    report mentioned the structure or specified a grade, location or type. They hold
    large mass in target set 3.1: study context not_stated 0.63, tear type not_stated
    0.10-0.13, cartilage extent not_stated 0.18-0.25, OA unspecified 0.21, effusion
    unspecified 0.14 and not_mentioned 0.09, Baker''s unspecified 0.18, cartilage
    depth unspecified_loss 0.10-0.14. They are site style: 255 of 260 Spanish ACL
    not-mentioned reports are short positive-only summaries that never name the cruciates,
    and the largest option-order flips were between not-mentioned and none. The host
    states that report silence is unobserved, not absent. Training the image to predict
    these options teaches reporting style.'
  mechanism: 'Completeness options are every option whose key is not_mentioned, not_stated,
    unspecified, tear_unspecified, partial_unspecified or unspecified_loss (on target
    set 3.1: 25 options over 21 questions; the gates'' fallback options are among
    them). For each question and study let s be their total mass; the target becomes
    the remaining options divided by (1 - s) and the reliability weight is multiplied
    by (1 - s); where 1 - s < 1e-6 the weight is zero. The removed options leave the
    heads. Applied after the 3.1 merges and gates, at load time. The loss, coefficient
    and averaging are unchanged. Setting trainer.report_attribute_targets.drop_completeness_options:
    true; log the removed options and the mean weight lost per question.'
  precedents:
  - 'v3 analysis: Spanish not-mentioned answers, order flips between same-meaning
    options (docs/public-labels/jevk5-report-attribute-extraction.md#v3-full-run-analysis-2026-09-25).'
  - 'Host: silence is an unobserved label (docs/metadata/official-label-criteria.md).'
  - Merging same-meaning options was part of the v3 -> v3.1 change (+0.0003 vs v3,
    bundled).
  novelty: First removal of report-style options; 3.1 only merged them into their
    neighbours.
  coverage: 21 of 35 questions; most mass lost in study context, cartilage extent
    and the gated tear questions.
  exploitation: If it helps, the same rule extends to hedged options (next seed) and
    to the study-context question as a whole; if it hurts, the completeness options
    carry disease evidence the image can see.
  budget: Fewer options; negligible.
  implementation: trainer.report_attribute_targets.drop_completeness_options in config.py;
    the transform in data/report_attributes.py before the heads are built.
  open_choices: None; the option keys are fixed above.
  dependencies: []
  priority_rationale: Measured evidence that these options track site and language,
    and a single label-agnostic rule removes them.
  status: completed
  created_revision: 0
  seeded: /home/claudio/src/knee-abnormality/autoresearch/campaigns/auxiliary-signals/seed-ideas.yaml
  experiments:
  - drop-report-completeness-options-20260926T130753Z-2bd433c0
  decision: reject
- id: drop-hedged-options
  mechanism_id: attribute-option-removal
  parent_idea_id: null
  title: Remove the hedged options (possible, possible tear) and renormalize
  opportunity: 'A hedged option means the report itself was uncertain; whether a radiologist
    hedges is a reporting habit, and the image model is asked to predict the hedge
    rather than the finding. Hedged mass in target set 3.1: medial meniscus possible_tear
    0.037, lateral 0.026, ACL 0.020, MCL 0.011, contusion 0.023, fracture 0.020, synovitis
    0.044, PCL 0.035, lateral ligaments 0.041, osteochondral 0.058. Synovitis possible
    is a dead option (9 top answers).'
  mechanism: 'Hedged options are every option whose key is possible or possible_tear
    (on target set 3.1: 10 options over 10 questions). The same rule as the completeness
    seed: per question and study, remove their mass s, divide the rest by (1 - s),
    multiply the reliability weight by (1 - s), zero weight where 1 - s < 1e-6, and
    drop the options from the heads. Completeness options stay. Setting trainer.report_attribute_targets.drop_hedged_options:
    true; log the removed options and the mean weight lost per question.'
  precedents:
  - 'Question-set design: hedging is an option (docs/public-labels/jevk5-report-attribute-extraction.md#question-set-design).'
  - 'Dead options in the v3 analysis: synovitis possible (9 answers).'
  novelty: First treatment of hedged answers as unobserved.
  coverage: 10 questions; small mass, concentrated in the ambiguous studies where
    the reliability weights are also lowest.
  exploitation: If it helps, combine with the completeness rule; if it hurts, hedges
    carry graded evidence and a half-positive mapping is the retry.
  budget: Negligible.
  implementation: trainer.report_attribute_targets.drop_hedged_options in config.py;
    the transform in data/report_attributes.py, sharing the completeness seed's code
    path if it exists.
  open_choices: None.
  dependencies: []
  priority_rationale: Same mechanism as the completeness seed on a disjoint option
