- id: attribute-loss-weight-0-2
  mechanism_id: attribute-loss-coefficient
  parent_idea_id: null
  title: Double the report-attribute loss coefficient from 0.1 to 0.2
  opportunity: The 0.1 coefficient was fixed before the first run from the loss scale,
    never measured. On target set 3.1 the term trained every epoch (1.006 -> 0.806,
    floor about 0.55) and gave +0.00105 macro, but its learnable part is only about
    a fifth of the disease loss at the start and shrinks as the heads fit, so the
    backbone may receive too little attribute pressure.
  mechanism: Set trainer.report_attribute_loss_weight to 0.2 in configs/training.yaml.
    Nothing else changes.
  precedents:
  - 'Target set 3.1 heads at 0.1: +0.00105 [95% -0.0012, +0.0035], public 0.940 vs
    0.938 (docs/validation/results/labels-and-losses/2026-09-25-report-attribute-heads.md).'
  - 'Coefficient reasoning and failure signs: docs/modeling/report-attribute-heads.md#coefficient.'
  novelty: First measurement of the attribute coefficient.
  coverage: All studies with attribute targets; all labels.
  exploitation: If it helps, later structural ideas inherit 0.2; if disease validation
    trails the control from the first epochs, the term is too strong and 0.1 stays.
  budget: None beyond the incumbent.
  implementation: Config only; trainer.report_attribute_loss_weight 0.2.
  open_choices: None.
  dependencies: []
  priority_rationale: The cheapest test of whether the adopted signal is under-used.
  status: completed
