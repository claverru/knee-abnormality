- id: acquisition-physics-feature-modulation
  mechanism_id: acquisition-physics-conditioning
  parent_idea_id: null
  title: Condition visual features on numeric acquisition headers with neutral missing
    values
  opportunity: Numeric acquisition settings may help the model interpret visual features
    across acquisitions. In the hash-verified representative-header table, field strength,
    TR and TE are finite and positive for 3,344 of 3,535 training studies; pixel spacing
    and slice thickness are valid for all 3,535. This establishes substantial study-level
    availability, not coverage across every used acquisition. Prior header-stack results
    make site shortcuts a material concern.
  mechanism: "Read MagneticFieldStrength, RepetitionTime, EchoTime, PixelSpacing and\
    \ SliceThickness from one canonical indexed DICOM per used series. Reduce PixelSpacing\
    \ to the geometric mean of its two components. Encode each valid field as log(value/reference),\
    \ using fixed references of 1.5 T, 2,000 ms, 30 ms, 0.5 mm and 3 mm. Missing,\
    \ malformed or nonpositive fields contribute zero. Apply features' = features\
    \ \xD7 [1 + tanh(W h)] after visual projection and before positional additions,\
    \ with a bias-free 5-to-256 W initialized to zero. All-missing headers therefore\
    \ produce identity modulation. Add no metadata-only disease-logit path or identity\
    \ fields."
  precedents:
  - '[Header artifact](/home/claudio/src/knee-abnormality/outputs/analysis/s/sharing-disagreement-20260914/study_headers.parquet),
    SHA-256 8714fa8b025afe0ff47d0811ca735f0ec75c84808b462486db19553d0c3058f4, supplied
    the measured training coverage. It contains one representative series per study.'
  - A read-only CPU check parsed the five fields from 32 existing representative DICOMs
