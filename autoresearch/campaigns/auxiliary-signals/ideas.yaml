  - '[Prior site analysis](/home/claudio/src/knee-abnormality/autoresearch/campaigns/auxiliary-signals/prior-work.md#site-priors)
    found limited incremental header-prior value and negative gold-study signs. Numeric
    fields can still encode site despite excluding vendor and model identity.'
  - '[Perez et al., FiLM](https://arxiv.org/abs/1709.07871) establishes feature-wise
    conditioning as an architectural mechanism. Its visual-reasoning results do not
    establish an MRI benefit.'
  novelty: Uses acquisition values to modulate image features within the model. It
    is distinct from post-hoc site offsets, scanner classification and scanner-information
    removal.
  coverage: Apply the same five-field rule to every used acquisition. A study with
    stripped fields still uses available spacing/thickness; each unavailable field
    has a neutral contribution. Log actual per-study and per-acquisition coverage
    rather than extrapolating from representative headers.
  exploitation: Allows acquisition-dependent interpretation of the existing image
    representation while preserving the backbone, image budget and auxiliary supervision.
