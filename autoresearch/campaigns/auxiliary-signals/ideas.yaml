- id: attribute-location-option-pooling
  mechanism_id: attribute-option-pooling
  parent_idea_id: null
  title: Give location and tear-morphology options separate attention pools
  opportunity: The current attribute head uses one pooled feature for every answer
    to a question. Different anatomical locations or tear morphologies may require
    evidence from different tokens. In the incumbent's completed logs, final KL for
    the six proposed questions ranges from 0.2412 to 0.5382. These residuals establish
    imperfect fitting, not a pooling diagnosis; improved spatial specialization is
    the hypothesis.
  mechanism: Apply one fixed pooling change to medial_meniscus_tear_location, lateral_meniscus_tear_location,
    medial_meniscus_tear_type, lateral_meniscus_tear_type, contusion_location and
    pf_cartilage_surface. Replace each question's single attention query with one
    query per existing option. Compute each option's logit using its own pooled feature
    and the existing option classifier row, then retain the question-level softmax.
    Initialize each replacement query by copying its former question query, so specialization
    develops during training. Keep the shared attention trunk, targets, gates, reliability
    weights, attribute coefficient and loss normalization. The six questions are selected
    by their location/morphology semantics, without disease-label results.
  precedents:
  - 'The incumbent implementation pools once per question and applies separate option
    classifier rows: [ReportAttributeHeads](/home/claudio/src/knee-abnormality/outputs/autoresearch/auxiliary-signals/experiments/scanner-confusion-detached-head-20260926T165429Z-55c4db64/source/src/knee_abnormality/training/report_attributes.py).'
  - 'Incumbent epoch logs show learning but remaining location/morphology divergence:
    [metrics](/home/claudio/src/knee-abnormality/outputs/autoresearch/auxiliary-signals/experiments/scanner-confusion-detached-head-20260926T165429Z-55c4db64/training/fold_3/logs/version_0/metrics.csv).'
  - '[Ilse, Tomczak and Welling, 2018](https://proceedings.mlr.press/v80/ilse18a.html)
    establishes learned attention aggregation for multiple-instance learning. Option-specific
    pooling here is a proposed extension, with no measured knee-task benefit.'
  - The running attribute-gate-family-shared-pooling experiment shares queries across
    related questions. Its outcome is unknown; this proposal independently separates
    queries within selected questions.
  novelty: Changes where each answer gathers visual evidence while preserving every
    target distribution. It introduces neither joint questions nor different gates.
    It is distinct from sharing a pool across parent and child questions.
  coverage: Six retained questions containing 44 options. With the supplied incumbent,
    total attention queries increase from 35 to 73. Every option, including absence
    and unspecified answers, remains supervised. All other questions retain their
    current pooling.
  exploitation: Reuses the existing normalized visual tokens and backbone pass. Option
    classifiers can specialize their attention through their different supervised
    gradients. No disease-label routing or additional image processing is introduced.
  budget: One candidate at the supervisor's incumbent seed, currently 2617320043;
    fold 3, ten epochs and 4,420 steps. Adds 38 attention-output rows, approximately
    4,902 parameters at hidden width 128. Auxiliary attention work increases, but
    there is no additional backbone pass. Runtime impact is unmeasured and must remain
    within 2,267 seconds.
  implementation: Replace selected pooling assignments in training/report_attributes.py
    under one trainer.report_attribute_heads option; use config.py, configs/training.yaml
    and training/lightning.py for wiring and provenance. Retain scanner confusion
    and all unrelated incumbent behavior. Preserve the existing output order and probability
    interface. Log per-question loss, targeted studies, effective weight, KL and divergence
    between option attention maps each epoch. Preserve incumbent initialization and
    fork RNG for added initialization; disabled behavior must reproduce the incumbent.
    If family-shared pooling is accepted first, separate only these six questions
    and retain sharing elsewhere. If predicted-attribute inference is accepted first,
    retain that readout and feed it the updated predictions. Neither undecided mechanism
    is required.
  open_choices: The question list and copied-query initialization are fixed. Absence
    options may attend to reporting-style correlates, and several location targets
    have known systematic errors. Attention specialization and improved target fit
    would remain diagnostics; only the unchanged macro adoption rule decides the candidate.
  dependencies: []
  priority_rationale: 'Priority 1: a small, explicit pooling intervention with unchanged
    targets, straightforward integration and modest parameter cost. Its benefit is
    uncertain, but it tests a capability absent from the current head.'
