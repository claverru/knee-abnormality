ideas:
- id: model-bias-product-of-experts
  mechanism_id: site-bias-logit-offset
  parent_idea_id: site-bias-product-of-experts
  title: Training-only logit bias per scanner model (31 x 12) instead of per scanner group, dropped at validation and inference
  opportunity: >-
    On the fold-3 site-signature scorecard (minor-site logit shift against label inflation,
    bias_free.md), the per-site bias removed the site prior without disease cost (signature rho
    -0.52, Synovitis -0.35, Effusion +0.24, major-vendor-only delta +0.0005, local +0.00040), while
    the scanner-model confusion target had the purest signature (rho -0.59) but cost disease signal
    (major-vendor-only -0.0013). A site is closer to a scanner model than to a vendor x field
    strength group, so a bias at model resolution should absorb finer site label priors with the
    mechanism that costs nothing at inference. User-ordered exception to the fixed disease loss
    (user decision 2026-09-26), the same exception approved for site-bias-product-of-experts:
    disease targets and evaluation are unchanged and the term is dropped outside training.
  mechanism: >-
    Exactly site-bias-product-of-experts (training-only offset added to the disease logits before
    the unchanged class-balanced BCE; zero-initialized table under a forked RNG; head learning rate,
    no weight decay; validation, selection, saved predictions and export use f(x) alone) on top of
    the incumbent, with one change: the table is 31 x 12 over scanner models instead of 8 x 12 over
    groups. Models follow scanner-model-confusion-target: (Manufacturer, ManufacturerModelName) from
    outputs/analysis/sharing-disagreement-20260914/study_headers.parquet (same SHA-256 check), the 30
    models with at least 30 studies in the whole table, the rest pooled into one other class. The
    incumbent's 8-group confusion head stays. Setting trainer.metadata_heads.site_bias with a
    model-resolution selector. Log per epoch the mean absolute bias per label and the largest
    per-model bias.
  precedents:
  - 'site-bias-product-of-experts: +0.00040 [80% -0.0011, +0.0019], approved with the same exception; source under outputs/autoresearch/auxiliary-signals/experiments/site-bias-product-of-experts-*/source (this campaign).'
  - 'scanner-model-confusion-target: 31-model mapping and head 0.172 vs 0.125; source under outputs/autoresearch/auxiliary-signals/experiments/scanner-model-confusion-target-*/source (this campaign).'
  - 'Clark et al. (arXiv:1909.03683): bias-only model during training, removed at test time.'
  novelty: First site bias at scanner-model resolution.
  coverage: All training studies; largest expected effect on Synovitis and OA.
  exploitation: Judged by the site-signature scorecard and a public submission paired with the incumbent; if its biases spread thinly over rare models with no gain, the group resolution stays.
  budget: 372 parameters; negligible.
  implementation: Model mapping from the scanner-model experiment into training/auxiliary/; the bias table and training-only offset from the site-bias experiment in training/lightning.py; config selector under trainer.metadata_heads.
  open_choices: None; the 30-study floor is fixed.
  dependencies: []
  priority_rationale: User-ordered; combines the purest site resolution with the only mechanism that removed the site prior at no disease cost.
- id: site-bias-with-model-confusion
  mechanism_id: site-bias-logit-offset
  parent_idea_id: site-bias-product-of-experts
  title: Combine the 8 x 12 training-only site bias with confusion over 31 scanner models
  opportunity: >-
    The two strongest signatures on the fold-3 scorecard came from different mechanisms: the per-site
    bias (label priors; rho -0.52, no disease cost) and the scanner-model confusion target (feature
    information; rho -0.59, disease cost -0.0013 on the major vendors). They act on different
    things, the bias on per-site label rates and the confusion on site information in the features,
    so together they may remove more of the site than either. User-ordered exception to the fixed
    disease loss (user decision 2026-09-26), the same exception approved for
    site-bias-product-of-experts.
  mechanism: >-
    On top of the incumbent: (1) the confusion head's target switches from the 8 scanner groups to
    the 31 scanner models exactly as in scanner-model-confusion-target (same detached head, bounded
    KL confusion, weight 0.1 and ramp; the prior is the training fold's model frequencies); and
    (2) the 8 x 12 training-only site bias exactly as in site-bias-product-of-experts, dropped at
    validation, selection, saved predictions and export. No other change. Log both mechanisms'
    diagnostics as in their source runs.
  precedents:
  - 'site-bias-product-of-experts and scanner-model-confusion-target results and sources (this campaign).'
  - 'Site-signature scorecard: bias_free.md.'
  novelty: First combination of a label-prior bias and feature confusion on the site.
  coverage: All training studies; all labels.
  exploitation: If its signature beats both parents without the confusion target's disease cost, it becomes the public candidate; if the disease cost returns, the bias alone stays preferred.
  budget: A 31-way detached head and a 96-parameter bias table; negligible.
  implementation: Port both changes from their experiment sources under outputs/autoresearch/auxiliary-signals/experiments/ into training/auxiliary/ and training/lightning.py; config under trainer.metadata_heads.
  open_choices: None.
  dependencies: []
  priority_rationale: User-ordered; tests whether the two best site mechanisms add.
exhausted_directions: >-
  None added.
