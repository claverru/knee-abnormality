    of a plane pixel for pixel. On 40 training batches the blended pixels are 0.2
    mm apart at the crop centre with posed crops and 3.1 mm (p90 5.5) once the training
    jitter is added, because the jitter is drawn per series (run notes, Contrast mixing
    under posed crops). The 6.6 mm at the corners comes from the 84 against 93.3 mm
    fields and is not touched here; the donor aligned over the whole crop lost twice
    (fixes-and-removals).
