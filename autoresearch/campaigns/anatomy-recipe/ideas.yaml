- id: kneecap-inside-the-fluid-sagittal-crop-per-knee-2
  mechanism_id: crop-target-position
  parent_idea_id: null
  title: Move the fluid sagittal crop forward only as far as each knee's kneecap needs
  opportunity: 'Measured premise, effect a guess. The kneecap''s front lies 55.9 mm
    in front of the plateau centre (sd 5.3) and the 93 mm fluid sagittal crop reaches
    51.6 mm with the incumbent''s joint target; a fixed move of 8.6 mm for every knee
    put 38% of the fluid sagittal series at the shift limit and scored x4 -0.0005
    (anatomy-masks run 7). Checked on the validation fold with the control''s weights
    (prior-work.md, Premise checks): the first look predicts kneecap tokens in every
    knee; the share-weighted mean front coordinate of the kneecap share tracks the
    mask''s kneecap front with correlation 0.67 on 150 knees (the largest front coordinate
    among kneecap tokens: 0.56) and lies 11.9 mm behind it on average, leaving a residual
    of 3.9 mm against 5.3 mm for a constant. The move a knee needs is 7.4 mm on average
    (p90 14.3) and positive for 93% of knees, on top of pose shifts with a spread
    of 4 mm, so inside today''s 12.75 mm limit it would be clipped as the fixed move
    was.'
  mechanism: In KneeAbnormalityModel.first_look_pose (modeling/model.py), after the
    frame is fitted, take per study the mean front coordinate, in the frame, of the
    first look's tokens weighted by their detached kneecap share (valid, routable
    tokens of every view), add 11.9 mm, and subtract the fluid sagittal crop's forward
    reach (half the field plus the sagittal target's forward offset). Where the result
    is positive, shift the fluid sagittal view's crop forward by it in the same call
    of frame_pose, before the clamp. Set data.view_shift_limit_mm to 22.5 and give
    the fluid sagittal view the limit 0.75 * margin (16.9 mm) while every other view
