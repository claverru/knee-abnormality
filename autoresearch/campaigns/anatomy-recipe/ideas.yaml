- id: joint-centre-offset-from-the-training-knees
  mechanism_id: joint-centre-offset
  parent_idea_id: null
  title: Remove the joint centre's measured offset and restore the crop targets measured
    with the true centre
  opportunity: 'Measured. The map''s joint centre sits in front of and to one side
    of the plateau centre by the same amount in every run: on the training knees with
    targets its signed error averages +1.23 mm across and +2.07 mm front to back over
    the control''s last three epochs (anatomy_centre_error_*_mm_mean in its metrics.csv;
    +0.94 and +1.74 mm on validation), with a spread of 2.4 and 1.9 mm. The incumbent
    absorbed it by re-measuring the crop targets on eight validation knees (sagittal
    4.89, 2.73 mm; coronal -2.08, 2.03 mm) instead of the targets measured with the
    true centre on the masks (sagittal 7.4, 2.3 mm; coronal -1.1, 1.3 mm), so the
    crops are framed as before but the sections and regions, which are centred on
    the same point, stay 1 to 2 mm off. Confirmed independently on 150 validation
    knees with targets, first look: +1.18 mm across and +2.13 mm front (frame comparison,
    anatomy-masks run notes). The two sets of targets differ by 2.5 mm forward in
    sagittal and 1.0 mm across in coronal, which is this offset to within half a millimetre.'
  mechanism: In KneeAbnormalityModel.anatomical_frames (modeling/model.py) subtract
    (1.23, 2.07) mm from the across and front coordinates of the bone-weighted centroid
    before it is projected onto the plane. Set CORONAL_JOINT_TARGET_MM back to (-1.1,
    1.3) and SAGITTAL_JOINT_TARGET_MM back to (7.4, 2.3). Two constants and one subtraction;
    nothing else changes.
  precedents:
  - 'joint-centre-from-the-map-instead-of-the-spots (the incumbent''s centre): x4
    level, 0.954 public.'
  - 'joint-centre-with-equal-view-exposure: moved the centre 0.06 mm and scored like
    a rerun.'
  novelty: First centre without its fixed bias, and crop targets from 550 knees instead
    of eight.
  coverage: 'Every knee: the regions and sections move by 1 to 2 mm, the crops by
    the difference between the two sets of targets and the offset, under 1 mm on average.'
  exploitation: 'Read both multipliers against the control with both menisci and the
