- id: femur-front-in-the-kneecap-routes
  mechanism_id: kneecap-route-sections
  parent_idea_id: null
  title: Read the femur's front, behind the kneecap, in full in the kneecap routes
  opportunity: 'Measured premise, effect a guess. With the kneecap route led by the
    kneecap, PF OA, Effusion and Synovitis still spend 44 to 46% of their attention
    on femur tokens and 9 to 21% on kneecap-joint tokens (anatomy-masks run notes,
    run 15, last epoch on validation). The trochlea, the cartilage PF OA is read from,
    and the pouch above it, where effusion and synovitis show, are femur and tissue
    in front of the femur at the kneecap''s height; the route weights them at a quarter
    (FRONT_FLOOR) unless they are kneecap tokens. On the masks the kneecap spans 21.3
    mm (sd 5.7) to 54.6 mm (sd 6.7) above the joint plane. Checked on the validation
    fold with the control''s weights: the front tokens in that height window number
    235 per study, 18% of a study''s tokens, and 57% of them are soft tissue; taking
    all of them in full would bring back the wide front block that lost PF OA before
    the kneecap led the route (prior-work.md). Restricted to femur tokens (share above
    half) they are 60 per study, 4.6% of the tokens, and the kneecap route reads them
    at a mean weight of 0.31.'
  mechanism: 'In KneeAbnormalityModel._regions (modeling/model.py) add one membership
    for the kneecap route and the front-core route: tokens in front_plane whose height
    above the joint plane lies between 21.3 - 5.7 and 54.6 + 6.7 mm, weighted by the
    detached femur share alone (not the free share). Where the routes now use behind_kneecap
    + (1 - behind_kneecap) * FRONT_FLOOR * front_plane * heights, take the larger
    of that floor term and this membership, so the femur''s front counts in full instead
    of at a quarter while the soft tissue of the front block stays at the floor. The
    height is the token''s existing height coordinate in the frame. Nothing else in
    the routes changes.'
  precedents:
  - 'patellar-routing-uses-unsaturated-shares (anatomy-masks run 15): x4 +0.0003,
    its own targets unmoved.'
  - 'rn18-anatomy-front-sample550: the kneecap route led by kneecap tokens recovered
    most of PF OA''s loss.'
  novelty: First section for the trochlea and the pouch.
  coverage: Every study; the tokens in front of the femur at kneecap height.
  exploitation: 'Read PF OA, Effusion and Synovitis at both multipliers against the
    control. On validation only, log the share of the three targets'' attention on
    this membership (three metrics). Shown wrong by: PF OA not above the control at
    either multiplier, or the macro below it at both.'
  budget: 'Same cost as the control: within 1.02 of its training time. One masked
    product on tensors that _regions already holds.'
  implementation: Follow the environment paragraph of the developer instructions.
    modeling/model.py only. Adds one membership inside the two existing unions and
    removes nothing; the quarter floor stays for front tokens outside the height window.
    Report on one batch the mean number of tokens per study in the membership and
    that routes other than kneecap and front-core are bit-identical. Update SPATIAL_TOKEN_IDENTITY
    where it describes the kneecap route.
