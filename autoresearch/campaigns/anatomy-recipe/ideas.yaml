- id: tokens-on-the-14-by-14-grid-2
  mechanism_id: token-grid
  parent_idea_id: null
  title: Tokens on the 14 by 14 grid, the stride-16 features summed with the stride-32
    features
  opportunity: 'Measured premise, effect a guess. A token of the 7 by 7 grid covers
    12.0 mm (84 mm crops), 13.3 mm (93 mm crops) and 17.1 mm (120 mm axial views)
    a side, while the map''s targets are sampled from masks at 1 mm. The classes thinner
    than a token are the ones the map learns worst: femur 0.905 and tibia 0.899 against
    joint 0.759, kneecap 0.735 and kneecap joint 0.675 (soft Dice per token, 150 validation
    knees, prior-work.md). The joint plane, the centre, the sections and every route
    are read from these shares, so a 6 to 8.6 mm token gives all of them a finer map.
    Before the masks, finer tokens had nothing to place them: on ReXNet-200 truncation
    at stride 16 lost 0.0042 and the sum of the two scales tied at +0.0011 with the
    menisci up (docs/history/stride16-feature-fusion.md); those runs had no anatomy
    map, no sections and no posed crops.'
  mechanism: 'In KneeAbnormalityModel (modeling/model.py) the backbone keeps all its
    stages and weights. The tokens are taken on the grid of layer3 (stride 16, 14
    by 14 at 224 px): token = P16(layer3 features) + P32(layer4 features) repeated
    to the 14 by 14 grid by nearest-neighbour upsampling (each stride-32 cell to its
    four stride-16 cells), where P32 is the existing shared projection to 256 and
    P16 is a new linear projection of layer3''s channels to 256 with the same initialisation.
    Everything after the projection (embeddings, LayerNorm, position, the map head,
    the plane fit, the sections, the routes, the pooling, the first look) runs unchanged
    on 196 tokens per image instead of 49. The token anchors and footprints come from
    layer3''s verified geometry: add the stride-16 mapping to BACKBONE_MAPPINGS in
    modeling/spatial_tokens.py and check it against the layers as the stride-32 one
    is. The feature statistics augmentation stays at stride 8. The map''s targets
    are looked up at the new anchors by the existing lookup; nothing in the prepared
    targets changes.'
  precedents:
  - 'fusion-sum (2026-09-22, ReXNet-200, no map): x4 +0.0011, menisci +0.0027, same
    training time and memory as its control.'
  - 'stride16 truncation (2026-09-22): x4 -0.0042, menisci +0.0063, the other eight
    labels -0.0073; the reason this seed keeps the stride-32 term.'
  novelty: First finer grid with a taught anatomy map, sections and posed crops reading
    it.
  coverage: Every study, every view, every token.
  exploitation: 'Read the macro at both multipliers against the control, then the
    menisci, the cartilage labels and PF OA. The per-epoch map overlap per class and
    the joint plane''s error are already logged: compare joint, kneecap and kneecap
    joint with the control''s 0.759, 0.735 and 0.675 and the plane error with 1.73
    mm. Shown wrong by: the thin classes'' overlap and the plane error not better
    than the control''s, or the macro below it at both multipliers.'
  budget: 'Runs whatever it costs, by the user''s decision of 2026-10-08: the campaign''s
    ceiling was raised to 2.5 times the control''s training time for this seed alone.
    The backbone is unchanged and the earlier sum on ReXNet-200 trained in its control''s
    time, so a step much slower than the control''s points to a defect in the candidate
    (a loop, a second evaluation, a synchronisation), not to the mechanism: report
    the candidate''s step time and peak memory against the control''s, and repair
    what is not the four-fold token count. Do not reduce slices, studies, batch or
    epochs.'
  implementation: 'Follow the environment paragraph of the developer instructions.
    modeling/model.py and modeling/spatial_tokens.py only. No option selects the 7
    by 7 grid. Write nothing that loops over tokens or images; the upsampling is one
    repeat_interleave or nearest interpolate on the projected stride-32 map. Report
    on one batch the token count per image (196), the anchors of the first two tokens
    in pixels against layer3''s geometry, and that the map''s target lookup returns
    the same class for a token as the mask at its anchor. Update SPATIAL_TOKEN_IDENTITY
    (projection and token) and the backbone mapping identity. The review asks every
    candidate for a logged proof that its change is active: add exactly one validation-only
    metric for it through _log_epoch_metric in training/lightning.py (the number of
    tokens per image); that file may be edited for this metric alone. Nothing is added
    to the training step.'
