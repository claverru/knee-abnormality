- id: sig-compact-fractional-intensities
  mechanism_id: continuous-preaugmentation-intensity-preservation
  parent_idea_id: sig-continuous-normalization
  title: Retain fractional intensities in float16 buffers and measure activation at
    model entry
  opportunity: Continuous normalization reached a reference-like learning trajectory
    but exhausted the runtime budget. Source inspection shows float32 normalized and
    gathered buffers on the CPU preparation path, increasing image storage and transfer
    volume fourfold versus uint8. Compact fractional storage addresses that identifiable
    cost without shortening training. The blocked repair also exposed an activation
    measurement that could miss rounding after gathering.
  mechanism: "Compute bounds and normalized 0\u2013255 values in float32, then store\
    \ normalized frames and gathered images in float16 on both CPU and device paths.\
    \ Do not round to integers. The existing model converts images to float32 before\
    \ division by 255, so augmentation still receives fractional values. Float16 has\
    \ a maximum rounding error of 0.0625 in this range, versus 0.5 for integer rounding;\
    \ it is a bounded approximation to the earlier float32 proposal. Immediately before\
    \ encode_batch in Lightning, measure fractional values from actual batch['images'],\
    \ using one representative gathered destination for each unique frame and its\
    \ original valid rectangle. Accumulate integer fractional-pixel and valid-pixel\
    \ counts across the epoch. Record storage error versus float32 normalization,\
    \ parent-mapping changed pixels, nonfinite counts, constant-series fallback and\
    \ image bytes. Zero padding and incumbent constant handling remain exact."
  precedents:
  - "run_curves: sig-continuous-normalization-20260929T073030Z-14590eaa supplies the\
    \ near-reference epochs 0\u20137 and stable fractional-pixel activity; its metrics.csv\
    \ reports batch-averaged rounding error around 0.2382 on the 0\u2013255 scale."
  - 'Original continuous source, preprocessing/device.py: both normalized and gathered
    image arrays are float32; CPU collation prepares images before transfer.'
  - 'Incumbent modeling/model.py, encode_batch: gathered images are converted to float32
    and divided by 255 before augmentation, allowing compact fractional storage without
    changing modeling source.'
  - 'jobs/orchestrator-20260929T091609Z-84a88aed/report.json: the later b41ad944 repair
    was parked because its pre-gather activation gate could pass even if model images
    were subsequently integer-rounded. That repair changed raw-buffer transport/device
    preparation; it did not implement float16 image storage.'
  novelty: Introduces compact fractional image storage while retaining float32 normalization
    arithmetic and the incumbent CPU preparation route. It halves image-buffer bytes
    relative to the failed float32 implementation and moves activation measurement
    to the consumed image tensor. It is not another epoch-count repair or a renamed
    rerun of the parked device-preparation implementation.
  coverage: Applies uniformly to every acquisition, with unchanged selected frames,
    bounds, clipping and augmentation. No learned or cross-acquisition statistics
    are introduced. Diagnostics count each selected frame once after gathering, preventing
    repeated channels from inflating activation. Constant-series support is reported
    separately from nonconstant valid pixels.
  exploitation: Run independently from the live incumbent at its recorded seed, currently
    1533697213. Require the unchanged valid macro gain and 80% interval rule. Fractional
    activation establishes implementation behavior, not benefit. Do not interpret
    small epoch-level or per-label differences as an adoption result.
  budget: "Retain ten epochs, 4,370 optimizer steps and 36 triplets. Respect training\
    \ bounds of 542.440\u20131,627.320 seconds and the 1,834-second run cap. Float16\
    \ buffers occupy half the float32 proposal's bytes but twice the incumbent uint8\
    \ bytes; conversion and diagnostic costs could offset savings. Retain CPU preparation\
    \ instead of importing the parked repair's broader transport changes. Record preparation/training/prediction\
    \ time and buffer memory. Runtime compliance remains unmeasured."
  implementation: Replace integer rounding and uint8 normalized/gathered allocations
    with float16 storage in intensity.py and device.py; retain float32 arithmetic
    and finite/constant safeguards. Use dataset.py to carry representative gather
    positions and original valid rectangles for diagnostics. In training/lightning.py,
    inspect actual images immediately before encode_batch and aggregate counts without
    per-batch host synchronization. Remove superseded pre-gather-only activation reporting
    and batch-averaged fraction aggregation. No modeling-source change is required.
    On a newly accepted incumbent, preserve its deterministic intensity mapping, upstream
    corrections and all unrelated behavior; replace only image storage precision.
    Do not inherit rejected transport branches or shorten the schedule.
  open_choices: Transport volume is a plausible runtime contributor, not a measured
    bottleneck. The observed discarded error is small relative to active intensity
    augmentation, so a >=0.001 gain is uncertain. Float16 adds its own quantization
    and needs logged error measurements. CPU/device agreement and the unresolved historical
    identity-comparison issue remain material limitations.
  dependencies: []
  priority_rationale: 'Second: a concrete storage change addresses runtime and a concrete
    logging change addresses the blocked activation gate. Implementation is bounded,
    but expected classification upside is less compelling because the available continuous-intensity
    macro curve nearly matches the reference.'
