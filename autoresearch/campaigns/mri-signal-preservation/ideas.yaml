- id: sig-magnitude-power-debiasing
  mechanism_id: magnitude-noise-power-debiasing
  parent_idea_id: null
  title: Correct supported magnitude-noise power bias before acquisition normalization
  opportunity: Synovitis AUC is 0.896563 and vendor slices remain heterogeneous despite
    active noise augmentation and smoothing. A magnitude noise floor can compress
    low-signal contrast before global normalization. Reconstruction details are unknown,
    so a universal Rician assumption would be unjustified.
  mechanism: "For nonnegative acquisitions with identifiable nonpadding background,\
    \ estimate the background second moment from low-variation air support. Apply\
    \ sqrt(max(x\xB2 - estimated_background_power, 0)) before the retained normalization\
    \ mapping. This is a power-bias correction, not an unbiased amplitude estimator.\
    \ Unsupported, signed, degenerate or insufficient-background acquisitions receive\
    \ identity correction. Estimate and apply one correction per acquisition using\
    \ unique selected frames."
  precedents:
  - '[Gudbjartsson and Patz](https://pmc.ncbi.nlm.nih.gov/articles/PMC2254141/) describe
    magnitude-noise bias and image-based estimation under explicit noise assumptions.'
  - noise-referenced-bilateral-smoothing gained 0.001813 but missed adoption with
    80% [-0.000342, +0.004002]; it adjusted a random smoothing kernel, not signal-power
    bias.
  novelty: Adds deterministic signal-power correction before scaling, with support
    diagnostics and explicit unsupported-acquisition handling.
  coverage: Shared image-only eligibility rules across types and vendors. No acquisition
    is removed because correction is unavailable.
  exploitation: Log estimated background power relative to tissue scale, supported
    acquisition fraction, corrected-pixel magnitude and clamped fraction. Check whether
    activity is concentrated in plausible low-signal regions, not just whether the
    loss decreases.
  budget: A background estimator and pointwise transform on existing pixels. No spatial
    denoising kernel, extra frames or model pass. Expected small overhead remains
    a hypothesis until measured.
  implementation: Add the estimator and transform to intensity.py/device.py, pass
    settings through dataset, and log aggregated activity in Lightning. Supply the
    required support estimator independently of the foreground-quantile seed. Apply
    before an accepted receive-field correction or final mapping; preserve any newly
    accepted continuous output and all unrelated incumbent changes.
  open_choices: Fix background support and validity criteria before launch. Multi-coil
    reconstruction and spatially varying noise may invalidate the approximation; report
    these limitations rather than interpreting every vendor gap as Rician bias.
  dependencies: []
  priority_rationale: 'Third priority: a distinct acquisition-physics mechanism with
    low runtime cost, tempered by unknown reconstruction assumptions.'
  status: completed
  created_revision: 4
