  - sig-foreground-quantile-bounds-20260929T075748Z-244325dd
  decision: invalid
- id: sig-continuous-normalization
  mechanism_id: continuous-preaugmentation-intensity-preservation
  parent_idea_id: null
  title: Preserve fractional normalized intensities instead of rounding them to uint8
  opportunity: Both preparation paths irreversibly round resampled intensities before
    the model converts them back to float. PF OA and synovitis remain weak, but the
    amount of useful information lost at this step is unknown. This seed directly
    isolates that information bottleneck.
  mechanism: "Keep the existing bounds, clipping and 0\u2013255 scaling, but return\
    \ float32 normalized pixels without round or uint8 conversion. Preserve fractional\
    \ interpolation and normalization values through collation and transfer. The model's\
    \ existing division by 255 then produces the same scale with greater precision."
  precedents:
  - 'src/knee_abnormality/data/preprocessing/intensity.py: normalize_pixels uses np.rint
    followed by uint8 conversion.'
  - 'src/knee_abnormality/data/preprocessing/device.py: device preparation uses torch.round
    and uint8 output.'
  - No direct quantization-ablation measurement appears in the packet.
  novelty: Changes representation precision before augmentation, not image count,
    resolution, gamma or augmentation strength.
  coverage: All valid pixels and acquisitions. Padding remains zero and invalid/constant
    acquisitions retain the incumbent handling.
  exploitation: Log mean absolute discarded-fraction error relative to the old rounding
    operation and the fraction of valid pixels with noninteger output. Target the
    same late PF OA/synovitis plateau without asserting quantization is its cause.
  budget: Normalized image storage grows from one to four bytes per pixel. Backbone
    compute is unchanged, but transfer and memory costs must be measured; use the
    sealed range rather than assuming negligible overhead.
  implementation: "Replace normalized buffers and gathered image tensors with float32\
    \ in both preparation paths. Remove rounding from the active route. Pass the new\
    \ setting through config and dataset only as required for candidate construction,\
    \ and log diagnostics through Lightning. Preserve any newly accepted mapping or\
    \ upstream correction; precision is an independent stage. No model or inference-engine\
    \ change is needed because the numeric scale stays 0\u2013255."
  open_choices: Use float32 initially for an unambiguous isolation of quantization.
    Do not bundle half precision, clipping changes or image-size changes.
  dependencies: []
  priority_rationale: 'Second priority: clean, cheap implementation with uncertain
    effect size; may clarify whether more elaborate normalization can preserve additional
    signal.'
  status: blocked
