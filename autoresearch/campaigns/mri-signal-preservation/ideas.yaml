- id: sig-foreground-quantile-bounds
  mechanism_id: foreground-supported-acquisition-quantiles
  parent_idea_id: null
  title: Estimate intensity bounds from tissue support rather than all valid-rectangle
    pixels
  opportunity: Vendor slices differ markedly, including Philips PF OA at 0.842669.
    Current quantiles exclude padding but include air within valid rectangles. Air
    fraction can change with field of view and acquisition, potentially changing tissue
    contrast independently of pathology; this has not yet been measured.
  mechanism: 'Build an acquisition-local foreground support estimate from the histogram
    of its selected unique valid pixels, using an Otsu split and simple spatial cleanup.
    Recompute the incumbent quantile probabilities on supported tissue, then apply
    the resulting affine mapping to every valid pixel. The mask selects statistics
    only: do not erase background pixels or alter geometry. Use the original all-valid
    bounds for acquisitions with inadequate or degenerate support.'
  precedents:
  - 'src/knee_abnormality/data/preprocessing/device.py: _region_values includes all
    pixels inside valid rectangles.'
  - 'src/knee_abnormality/data/preprocessing/intensity.py: quantile_bounds and normalize_pixels
    provide the current global mapping.'
  - The packet's intensity-normalization family contains a proposed learned calibration,
    not this deterministic support estimator.
  novelty: Changes which pixels define acquisition scale while retaining quantile
    probabilities, output geometry and the augmentation recipe.
  coverage: Every acquisition type and vendor; no label- or vendor-specific threshold.
    Fallback is per acquisition.
  exploitation: Target persistent vendor heterogeneity and the late macro plateau.
    Log foreground fraction, bound displacement, clipping fraction and fallback rate;
    inspect whether the operation preserves useful dynamic range.
  budget: Reuse existing acquisition histograms with low-resolution mask cleanup.
    No extra frames or model passes. Retain ten epochs initially and measure both
    CPU preparation and training time.
  implementation: Add data.signal_normalization.foreground_bounds, transport it through
    dataset/collation, and implement equivalent CPU/device processing. Replace the
    final global-bound estimator; retain active continuous storage or upstream corrections
    if a new incumbent adopts them. Remove any superseded bound-estimation branch.
    Keep labels, sampler, valid rectangles and constant-series behavior unchanged.
  open_choices: Fix minimum support and degeneracy rules before launch using image-only
    numerical considerations. Do not tune them against vendor or label AUC.
  dependencies: []
  priority_rationale: 'First priority: directly addresses a verified source behavior
    with modest cost and a readily measurable activation signature.'
  status: completed
  created_revision: 4
  ranking_rationale: All five imported seeds have no dependencies and address distinct,
    permitted mechanisms. Foreground-supported bounds rank first because they directly
    change a verified source behavior with modest expected cost. Continuous normalization
    follows as a precise isolation of rounding loss. Magnitude correction has plausible
    low-signal relevance but depends on unverified reconstruction assumptions. Local
    histograms and receive-field estimation have greater implementation cost and greater
    risk of changing useful contrast. The historical quantile-clipping runs changed
    probabilities, not foreground support; noise-referenced smoothing and synthetic
    bias fields also differ materially from the proposed deterministic corrections.
  experiments:
