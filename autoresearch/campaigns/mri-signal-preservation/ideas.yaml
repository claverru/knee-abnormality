  - sig-slice-coherent-local-histograms-20260929T100528Z-788aa1de
- id: sig-coarse-receive-field-correction
  mechanism_id: deterministic-receive-field-estimation
  parent_idea_id: null
  title: Estimate a coarse receive-field correction from each acquisition before normalization
  opportunity: The large Siemens slice has macro AUC 0.917681 versus GE's 0.958428,
    although case mix is a substantial confounder. Global quantiles cannot remove
    within-image gain variation. Residual shading has not been measured, making this
    a high-uncertainty investigation rather than a diagnosed repair.
  mechanism: On downsampled positive foreground pixels, alternate a small log-intensity
    mixture model with fitting a very low-frequency two-dimensional field shared across
    the acquisition's selected slices. Fit residuals relative to tissue-component
    means, constrain the field to zero mean, regularize curvature and bound correction
    gain. Divide by the estimated field before the retained final mapping. Degenerate
    fits receive identity correction per acquisition. This is a bounded mixture/field
    approximation inspired by bias-correction literature, not an implementation claim
    for N4.
  precedents:
  - '[Tustison et al.](https://iacl.ece.jhu.edu/proceedings/isbi2010/pdfs/0000708.pdf)
    motivate estimation of smooth intensity nonuniformity.'
  - smooth-bias-field-augmentation gained 0.000571, 80% [-0.001339, +0.002414], and
    its family is closed. It injected synthetic fields; no residual-field measurement
    established a correction effect.
  novelty: Estimates and removes an observed acquisition-local nuisance at both training
    and inference. It does not inject random fields, change augmentation amplitude
    or use vendor metadata.
  coverage: Same estimator for every supported acquisition. All studies remain in
    training and evaluation; failed estimates leave that acquisition's correction
    at identity.
  exploitation: Log field amplitude, gain clipping, fit residual, foreground support
    and identity-fallback rate. Broad pathology or anatomy can be mistaken for shading,
    so inspect preservation of local contrast and avoid interpreting fit reduction
    as clinical improvement.
  budget: Fit on a coarse grid with a small fixed number of alternating updates and
    NumPy/Torch linear algebra; install nothing. Bound memory and iteration count.
    A permitted epoch reduction may accommodate cost, but all work must remain within
    the supervisor's sealed range.
  implementation: Add the field estimator and correction before final normalization
    in intensity.py/device.py, transport settings via dataset, and log diagnostics
    in Lightning. Supply its own support estimation without depending on another seed.
    Retain an accepted continuous representation, final mapping and optional preceding
    noise-power correction. Preserve unrelated behavior from every new incumbent and
    remove superseded field-estimation code rather than accumulating variants.
  open_choices: "Start with three log-intensity components, a very coarse smooth basis\
    \ and gain bounded to 0.5\u20132.0. Fix support and convergence rules before launch.\
    \ The shared two-dimensional field is an approximation; through-plane coil variation\
    \ remains unmodeled."
  dependencies: []
  priority_rationale: 'Fifth priority: addresses a nuisance that global normalization
    cannot represent, with the greatest implementation cost and risk of removing genuine
    anatomical signal.'
  status: queued
  created_revision: 4
  ranking_rationale: "Both proposals have satisfied dependencies and materially change\
    \ their invalid predecessors. The foreground retry keeps the all-valid lower bound,\
    \ addressing the earlier two-sided mapping\u2019s excessive clipping, and moves\
    \ ahead of receive-field estimation. Compact float16 storage and measurement at\
    \ model entry address the continuous retry\u2019s cost and activation defects.\
    \ It ranks last because its earlier macro curve stayed close to control and its\
    \ budget feasibility is unmeasured. The developing local-histogram idea remains\
    \ the reserved head."
- id: sig-black-anchored-foreground-upper
  mechanism_id: foreground-supported-acquisition-quantiles
  parent_idea_id: sig-foreground-quantile-bounds
  title: Preserve the original black point and estimate only the upper bound from
    foreground support
  opportunity: The clipping diagnosis supports separating background exclusion from
    black-point selection. Bright-tissue support may help estimate the upper landmark
    while being unsuitable for the lower landmark. This candidate preserves low-intensity
    ordering and asks whether a foreground-supported upper bound improves acquisition
    normalization. Useful dark-tissue information being lost is a hypothesis; the
    recorded clipped pixels include air.
  mechanism: "Keep the incumbent all-valid lower quantile and constant-series decision.\
    \ Estimate only the upper quantile from acquisition-local bright support. Use\
    \ a deterministic stride-four lattice anchored at each valid rectangle's top-left,\
    \ traversing every selected unique frame once. Construct a 256-bin Otsu histogram\
    \ from sampled intensities, with float64 histogram arithmetic and the lowest threshold\
    \ on ties. Require at least 4,096 sampled valid pixels, finite samples, dynamic\
    \ range >1e-6, separability >=0.5, and above-threshold support containing at least\
    \ 1,024 samples and 5\u201398% of samples. Compute its upper quantile using the\
    \ incumbent probability and float32 rank interpolation. Invalid support or a nonfinite/nonordered\
    \ bound yields the incumbent mapping. Apply the resulting linear mapping to all\
    \ original valid pixels, preserving padding and output precision. Record sampled\
    \ support separately from full-resolution valid support, upper-landmark displacement,\
    \ lower/upper clipping separately, fallback reasons, and final changed-pixel counts\
    \ with unique-frame weighting."
  precedents:
  - "run_curves/full_detail: sig-foreground-quantile-bounds-20260929T065412Z-29198b44,\
    \ epochs 0\u20134, supplies the clipping and learning-curve diagnosis summarized\
    \ in the family verdict."
  - 'Original foreground source, src/knee_abnormality/data/preprocessing/intensity.py:
    foreground_support selects above-Otsu pixels with majority cleanup; supported_quantile_bounds
    uses that support for both endpoints.'
  - "Incumbent configs/training.yaml and preprocessing/intensity.py: retained quantile\
    \ probabilities are 0.005 and 0.995; normalization clips, scales to 0\u2013255\
    \ and rounds."
  - prior-work.md reserves learned intensity calibration and smoothing work for their
    existing owners. This proposal changes deterministic bound estimation only.
  novelty: 'Replaces symmetric foreground endpoint estimation with an asymmetric estimator:
    the black point remains supported by all valid pixels, while only the upper endpoint
    uses foreground support. Sparse estimation removes the full-resolution spatial
    cleanup and additional foreground sort. This is a structural response to clipping
    and runtime, not an Otsu-strength sweep.'
  coverage: All acquisitions and labels use the same rules, without vendor conditioning
    or label-specific objectives. Statistics use selected unique frames only; repeated
    triplet channels never increase their weight. Failed support retains the acquisition
    through the incumbent normalization. Diagnostics distinguish clipping of all valid
    pixels from any unproven loss of anatomical signal.
  exploitation: 'Use one candidate at the supervisor''s incumbent-matched seed, currently
    1533697213. Evaluate the fixed all-label macro rule: valid gain >=0.001 and central
    80% paired-bootstrap lower bound >0. Per-label recovery and clipping movement
    explain behavior but cannot authorize adoption.'
  budget: "Retain ten epochs, 4,370 optimizer steps and 36 triplets. Training must\
    \ remain within 542.440\u20131,627.320 seconds and the inherited 1,834-second\
    \ run cap. The original foreground attempt consumed 1,628.9 seconds by its fifth\
    \ recorded epoch; it was not a completed ten-epoch run with a marginal overrun.\
    \ Keep the incumbent bound computation, add only sampled histogram/support work,\
    \ and aggregate diagnostics without per-acquisition device synchronization. Record\
    \ preparation, training and prediction costs; feasibility is unmeasured."
  implementation: Implement within intensity.py, device.py, dataset.py, config.py,
    training/lightning.py and allowed configuration paths. Supply this proposal's
    own support helper. Replace the rejected two-sided foreground mapping and its
    settings; retain the all-valid estimator for the lower endpoint and fallback.
    Preserve geometry, selected-frame accounting, model, augmentation and constant-series
    handling. Measure final changed pixels from gathered images using one representative
    destination per unique frame, with int64 counts and epoch-wide denominators. Against
    a newly accepted incumbent, retain continuous storage and upstream noise/field
    corrections. If local-histogram mapping has won, explicitly replace that alternative
    mapping and remove its branches rather than stacking equalizations. Preserve truthful
    source identity.
  open_choices: The upper landmark may move too little to improve AUC, or may reflect
    bright pathology rather than nuisance. Sparse upper-tail estimates and CPU/device
    agreement remain unmeasured. Freeze and log the specified support rules before
    launch. The historical comparator rejected the permitted nested source-hash change;
    whether that infrastructure discrepancy is resolved is unknown.
  dependencies: []
  priority_rationale: 'First: the strongest actionable diagnosis is excessive clipping
    with persistently slower learning. The asymmetric estimator directly removes the
    suspected destructive operation while substantially simplifying support estimation.
    Benefit remains uncertain because the foreground upper endpoint itself has no
    valid classification evidence.'
