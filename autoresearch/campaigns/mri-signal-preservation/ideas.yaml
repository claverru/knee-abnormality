- id: sig-slice-coherent-local-histograms
  mechanism_id: slice-coherent-local-histogram-normalization
  parent_idea_id: null
  title: Use contrast-limited local histograms shared across an acquisition's selected
    slices
  opportunity: A single acquisition-wide affine map cannot compensate for spatially
    varying contrast. Philips PF OA is 0.842669, but the source and packet do not
    establish whether local contrast is responsible. Local histogram mapping offers
    a distinct representation change with measurable risks.
  mechanism: Build coarse in-plane tile histograms over valid foreground support,
    aggregating the same tile across all selected unique slices of an acquisition.
    Clip histogram counts, redistribute excess and bilinearly interpolate monotone
    tile mappings. Share the mapping across slices to avoid artificial slice-to-slice
    flicker. Empty tiles use the acquisition-global mapping; padding remains zero.
  precedents:
  - '[Pizer et al.](https://www.sciencedirect.com/science/article/pii/S0734189X8780186X)
    describe adaptive histogram methods and contrast limiting to reduce noise overenhancement.'
  - src/knee_abnormality/data/preprocessing/intensity.py currently applies one global
    affine mapping.
  - The closed sharpening family changes high-frequency image content; this seed uses
    monotone local intensity mappings without a sharpening filter.
  novelty: Introduces deterministic, slice-coherent spatial adaptation of intensity
    contrast rather than another global nonlinear augmentation or independent per-slice
    equalization.
  coverage: One shared tile/mapping procedure for all types and labels. No learned
    vendor templates or validation-cohort statistics.
  exploitation: Log mapping deviation from global normalization, tile support, histogram
    clipping and local noise amplification. Inspect PF OA and synovitis only as exploratory
    diagnostics alongside all-label macro.
  budget: Use a coarse tile grid and bounded histogram bins with NumPy/Torch implementations.
    Avoid per-pixel histogram construction. Measure preparation and prediction overhead
    as well as training time.
  implementation: Replace the final global mapping with the local histogram mapping
    in both preparation routes. Supply its own support estimator. If foreground-global
    normalization has been accepted, replace that final mapping and remove its obsolete
    controls; retain accepted continuous output and upstream noise/field corrections.
    Preserve geometry, sampled paths and all new-incumbent model improvements.
  open_choices: "Initially a 4\xD74 tile grid and 128 bins, with a fixed contrast\
    \ limit specified before launch. Noise amplification and loss of absolute tissue\
    \ contrast are material risks; do not rescue a rejection with a strength-only\
    \ sweep."
  dependencies: []
  priority_rationale: 'Fourth priority: potentially larger contrast change than global
    bounds, but with more risk of amplifying noise or erasing useful tissue relationships.'
  status: developing
  created_revision: 4
  ranking_rationale: "Both proposals have satisfied dependencies and materially change\
    \ their invalid predecessors. The foreground retry keeps the all-valid lower bound,\
    \ addressing the earlier two-sided mapping\u2019s excessive clipping, and moves\
    \ ahead of receive-field estimation. Compact float16 storage and measurement at\
    \ model entry address the continuous retry\u2019s cost and activation defects.\
    \ It ranks last because its earlier macro curve stayed close to control and its\
    \ budget feasibility is unmeasured. The developing local-histogram idea remains\
    \ the reserved head."
