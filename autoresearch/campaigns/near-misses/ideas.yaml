  - '[Side-Tuning, ECCV 2020](https://sidetuning.berkeley.edu/) provides an additive
    adaptation precedent with an unchanged base network. Here the base continues ordinary
    training, so its guarantees and measured benefits do not transfer.'
  - '[Historical transfer registry](/home/claudio/src/knee-abnormality/autoresearch/campaigns/medial-lateral-transfer/ideas.yaml):
    unbiased-credit-compartment-attention also changes backward credit, but substitutes
    an unbiased attention Jacobian for anatomical-score credit. It does not isolate
    an added geometry correction.'
  novelty: Combines the completed OA geometry mechanism with a different backward
    boundary. Unlike isolated union supervision, the public correction itself cannot
    directly update backbone, projection, normalization, base attention or classifier
    parameters. Unlike historical ownership routing, it does not attenuate the existing
    base path. The running acquisition-mass proposal constrains forward allocation
    instead.
  coverage: The same construction covers medial, lateral and PF OA. Retain per-token
    geometry handling and reflection consistency. Historical geometry activity reached
    3359 studies per epoch, but correction activity must be remeasured. Effusion,
    synovitis and all other labels retain their direct paths and remain part of the
    complete evaluation.
  exploitation: 'Log geometry coverage, bypassed tokens, attention changes, correction
    magnitudes and geometry-parameter update norms per epoch. Compare all hard/soft
    label deltas and the three-label OA mean. Non-OA stability would be suggestive
    only: corrected OA errors still change the gradient entering z0, and shared clipping
    and checkpoint selection can also affect other labels.'
  budget: Approximately the parent's 6300 interaction parameters, plus a base OA pooling
    used to form the correction. No extra encoder pass or per-task backward pass.
    The unrestricted parent used 1664.7 seconds; the additional pooling should plausibly
    fit within 1905 seconds, but runtime is unmeasured.
  implementation: 'Against revision 294, add the detached correction under model.position_encoding.
    Retain current positional values, dropout, public heads, anatomical attention
    and half-knee supervision. Reuse the completed geometry parent''s header metadata,
    fixed frequencies, reflection transport and MODEL_BATCH_KEYS entries. Replace
    its unrestricted gradient connections; do not add the rejected union detector
    or auxiliary. Classification: small-changes.md, with historical geometry/gradient-routing
    ownership in the stopped campaigns. Retain unrelated new incumbents. If acquisition-mass
    routing is accepted during development, preserve its forward mass constraint and
    isolate that correction instead, with an explicit integration review. If dropout
    or readouts change, rederive the matched base/corrected pooling difference rather
    than assuming the current linear formula still applies.'
  open_choices: 'This deliberately changes the gradient of the unrestricted forward
    model. Blocking adaptation through the correction may prevent learning useful
    geometry-sensitive features. It does not preserve the base training trajectory:
    BCE residuals still depend on corrected logits. There is no measured gradient-conflict
    evidence, and the observed OA-only contribution is below the adoption threshold.'
