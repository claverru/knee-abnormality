  decision: reject
- id: oa-acquisition-mass-conserving-routing
  mechanism_id: oa-geometry-routing-with-acquisition-mass-conservation
  parent_idea_id: oa-geometry-attention-residual
  title: Let geometry redistribute OA attention within acquisitions while preserving
    their existing attention mass
  opportunity: "The completed geometry residual gained +0.002094 averaged across the\
    \ three OA labels but lost \u22120.001120 across the other nine; macro fell \u2212\
    0.000317. PF OA improved while medial and lateral OA declined. New read-only analysis\
    \ of epoch-7 training logs gives mean attention total variation \u22480.233 per\
    \ eligible OA row, so the residual made substantial changes. The logs do not distinguish\
    \ redistribution within acquisitions from shifts between acquisitions. Constraining\
    \ the latter could preserve useful acquisition selection while allowing spatial\
    \ refinement; this remains a hypothesis."
  mechanism: "Reuse the parent's rank-16 appearance\u2013geometry interaction, fixed\
    \ geometry features and zero initialization. Compute base attention a after the\
    \ incumbent masks and random token dropout. For each OA row and acquisition j,\
    \ let G_j contain retained tokens with usable geometry and M_j=sum_{t in G_j}\
    \ a_t. Replace their weights by a'_t=M_j*softmax_{G_j}(base_score_t+geometry_residual_t).\
    \ Leave all other weights unchanged. Empty groups contribute nothing; singleton\
    \ groups remain unchanged. This preserves each acquisition's total mass and every\
    \ unusable token's weight within that forward, while learning where to attend\
    \ inside usable groups. Keep the original classified values and ordinary public\
    \ supervision."
