- id: side-normalized-3d-position
  mechanism_id: side-normalized-3d-token-position
  parent_idea_id: null
  title: Replace the 1D and 2D position embeddings with one side-normalized 3D patient-position
    encoding per token
  opportunity: Tokens carry slice position within their series (1D) and pixel position
    (2D); neither says where the token is in the knee consistently across series.
    The related token-attention run lost -0.0015 overall but raised menisci (+0.0027)
    and OA (+0.0035); its losses (PF OA and Fracture about -0.015, MCL -0.006) are
    the labels a re-seed also moves, and it changed an attention block at the same
    time. Never run; parked in knee-geometry because of the fallback contract.
  mechanism: For every token, q = (knee_side_sign * (p_x - c_x), p_y - c_y, p_z -
    c_z) in mm, with p the token's own patient position from the patient maps (per
    token, not per slice) and c the knee centre (per-knee for bilateral studies).
    Encode q with fixed 3D sine features (wavelengths about 8 to 512 mm) and a small
    MLP, and add it to the token in place of position_1d and position_2d, which are
    removed. Unknown side keeps y and z and uses a learned x vector; untrusted geometry
    uses a learned unknown-position vector. Under reflection q is unchanged (x and
    side both flip), and reflection TTA must give identical q.
  precedents:
  - 'side-normalized-3d-position (knee-geometry, never run): autoresearch/campaigns/knee-geometry/ideas.yaml'
  - 'token-attention run with 3D RoPE on raw coordinates: outputs/training/token-attention;
    docs/validation/results/2026-09-23-side-mask-and-token-attention.md'
  - study-anchored-through-plane-position logged zero active studies because it required
    one frame-of-reference UID across series; every accepted study fit has several.
    Do not use that gate.
  - claverru/RSNA-lumbar fed side-normalized world coordinates and slice normals as
    meta inputs.
  novelty: The replacement alone, without an attention change, on consistent per-knee
    coordinates.
  coverage: All labels, through every token's position.
  exploitation: '#13 adds slice orientation to it.'
  budget: A small MLP replaces two embeddings; negligible runtime.
  implementation: modeling/spatial_tokens.py and model.py under model.position_encoding;
    record the change in SPATIAL_TOKEN_IDENTITY. Log how many studies and tokens use
    each branch (full, unknown side, unknown position) per epoch.
  open_choices: Wavelength range fixed from knee extent before launch; no sweep.
  dependencies: []
  priority_rationale: A user hypothesis whose only test was confounded.
  status: completed
  created_revision: 1
  seeded: /home/claudio/src/knee-abnormality/autoresearch/campaigns/near-misses/seed-ideas-2.yaml
