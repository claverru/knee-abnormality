- id: early-learning-regularization-current
  mechanism_id: early-learning-regularization
  parent_idea_id: null
  title: Port early-learning regularization unchanged (lambda 0.075, momentum 0.7)
    to the current recipe
  opportunity: Against its same-seed control k05-clean it scored +0.0013 hard (80%
    [-0.0004, +0.0031]) and +0.0008 soft, and 0.943 public (S57) against 0.942 (S48).
    Against the mean of its three near-null sibling runs, ligaments gained +0.0045
    (soft 95% interval above zero) and menisci +0.0031; Baker's was the only term-specific
    loss (-0.0050). It sharpens predictions rather than re-ranking them.
  mechanism: Keep a per-study running average of the model's own predictions (momentum
    0.7) and add the penalty weight * log(1 - overlap(running_average, p)) to the
    loss, weight 0.075, exactly as in the noisy-labels run. Nothing else changes.
