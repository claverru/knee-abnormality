- id: plane-negative-half-knee-mil
  mechanism_id: plane-negative-half-knee-loss
  parent_idea_id: null
  title: In the half-knee loss, require a negative meniscus half to show no tear evidence
    in every plane it has
  opportunity: The half-knee loss was the only adoption of the last campaign. Its
    refinements so far changed which tokens it sees (and lost); none changed what
    it teaches.
  mechanism: Keep the whole-half score z_h for positive supervision. Also compute
    the same smooth-max score z_hp per represented anatomical plane in that half.
    Replace the auxiliary BCE by y * softplus(-z_h) + (1 - y) * mean_p softplus(z_hp),
    with the incumbent's class-balance weight and coefficient 0.075. Identical rules
