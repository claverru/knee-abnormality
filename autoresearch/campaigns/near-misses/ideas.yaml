- id: oa-geometry-detached-correction
  mechanism_id: oa-geometry-residual-with-detached-base-readout
  parent_idea_id: oa-geometry-attention-residual
  title: Train the OA geometry correction without sending its additional gradient
    paths into shared token features
  opportunity: "The geometry residual averaged +0.002094 across OA but \u22120.001120\
    \ across the other nine labels; macro fell 0.000317. PF OA improved while both\
    \ tibiofemoral OA labels declined. Shared-feature interference is a possible explanation,\
    \ not a measured cause. Keeping the observed OA gains while merely eliminating\
    \ other-label losses would contribute only +0.000523 macro, so this proposal also\
    \ needs broader OA improvement to clear adoption. Historical PF OA reseed movement\
    \ was larger than the apparent geometry gain."
  mechanism: "Let s be incumbent scores, h token values, a0 incumbent attention and\
    \ z0 incumbent logits, using one shared dropout mask. Restore the completed rank-16\
    \ geometry interaction r_theta(stopgrad(h),g), with its fixed features and zero\
    \ initialization. Compute ag=softmax(stopgrad(s)+r_theta) on the same retained\
    \ support. For each OA row add delta_c=sum_t(ag_ct\u2212stopgrad(a0_ct))*stopgrad(w_c\xB7\
    h_t), giving z_c=z0_c+delta_c. At fixed parameters this reproduces the unrestricted\
    \ parent's forward prediction, but only new geometry parameters receive gradients\
    \ through delta. The ordinary base path remains differentiable. Keep the existing\
    \ public BCE; add no auxiliary target or loss. Zero the score residual wherever\
    \ geometry is unusable."
  precedents:
  - "[Geometry completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/near-misses/jobs/orchestrator-20260925T054637Z-f5413a53/report.json):\
    \ macro \u22120.000317, 80% [\u22120.001895,+0.001305], soft macro +0.000446.\
