- id: attention-dropout-antithetic-loss
  mechanism_id: antithetic-fixed-count-dropout-loss-estimation
  parent_idea_id: attention-token-dropout-random
  title: Average losses from two complementary random dropout masks over the same
    encoded tokens
  opportunity: Random dropout improved macro AUC by 0.002477, whereas highest-attention
    and spatial-cluster replacements produced negative macro changes and different
    label tradeoffs. These results motivate preserving the accepted masking distribution
    while changing how its training objective is estimated. Two inexpensive pooling
    evaluations could reduce sensitivity to an unlucky omission, including for effusion
    and synovitis. Incumbent mask-induced gradient variance has not been measured.
  mechanism: "Encode images and score tokens once. Reuse the incumbent random-key\
    \ tensor: mask A removes the k lowest keys and mask B the k highest keys within\
    \ each allowed study-label pool, with the existing k=min(floor(0.05*n),4,n\u2212\
    1). Both masks individually have the incumbent uniform fixed-count distribution;\
    \ their dropped sets are disjoint whenever k>0 under this count rule. Apply the\
    \ existing survivor-renormalized pooling separately and replace the primary training\
    \ loss by 0.5*(BCE(z_A,y)+BCE(z_B,y)), preserving masks, class weights and reduction.\
    \ Compute half-knee supervision once. This has the same expected primary objective\
    \ as accepted dropout; it changes its stochastic estimator. Average losses, not\
    \ logits. Evaluation retains one ordinary pooling."
  precedents:
  - '[Random-dropout completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/near-misses/jobs/orchestrator-20260925T013304Z-e56c661f/report.json):
    macro +0.002477, 80% interval [+0.000476,+0.004378], soft macro +0.001866. Logged
    counts imply four omissions per affected study-label pair.'
  - "[Cluster completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/near-misses/jobs/orchestrator-20260925T064516Z-ebfd0a02/report.json):\
    \ macro \u22120.000172 and soft macro \u22120.000669; all label intervals crossed\
    \ zero. PF OA and effusion rose while lateral OA and synovitis fell."
  - "[Highest-attention completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/near-misses/jobs/orchestrator-20260925T023405Z-f49ba564/report.json):\
    \ macro \u22120.000709, with PF OA/synovitis gains and lateral-OA/effusion declines.\
    \ Removing the random draw also changed subsequent RNG consumption."
  - '[Losses registry](/home/claudio/src/knee-abnormality/autoresearch/campaigns/losses/ideas.yaml):
    queued split-view consistency and subview supervision change the objective using
    acquisition halves. The [cross-epoch anchor completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/losses/jobs/orchestrator-20260920T184207Z-3e033654/report.json)
    was inconclusive, mixed learning drift with draw variation, and added substantial
    logging overhead.'
  - '[Ren, Zhao and Ermon, ICML 2019](https://proceedings.mlr.press/v97/ren19b.html)
    establishes antithetic sampling as a variance-reduction approach while emphasizing
    that effective correlation is application-specific. It does not validate this
    fixed mask construction.'
  novelty: 'Changes estimation of the accepted objective without adding a consistency
    penalty, strengthening individual masks, or changing their marginal distribution.
    It differs from the developing unbiased-weights proposal, which changes normalization
    and therefore the objective. It also differs from acquisition-half supervision:
    each branch here is an ordinary incumbent dropout draw.'
  coverage: One rule covers all twelve labels and their existing eligible token pools.
    Effusion, synovitis and OA receive no special coefficients. Every token omitted
    by one branch remains available to the other. That coverage property does not
    guarantee preservation of diagnostic evidence or improved AUC.
  exploitation: Aggregate per-epoch counts for both masks, their overlap, affected
    studies, removed attention mass, branch logit differences and squared loss differences.
    Retain existing dropout activity logs. Assess the complete hard/soft label vector.
    Branch disagreement establishes that pairing changes the estimator; it does not
    by itself establish reduced gradient variance.
  budget: No new parameters or encoded images. Adds a second pooling/readout and BCE
    over shared tokens, followed by one combined backward pass through the encoder.
    The original dropout run used 1662.83 seconds against the 1905-second ceiling.
    Extra pooling memory and backward arithmetic remain unmeasured; buffer diagnostics
    and emit them once per epoch.
  implementation: 'Against revision 294, add paired estimation under model.token_dropout
    and replace the single masked primary BCE in lightning.py. Retain accepted uniform
    masking, its count rule and pre-softmax placement, anatomical eligibility, public
    heads and the single half-knee auxiliary. Reuse the same random draw at the same
    call position; do not invoke a second stochastic encoder or scorer. Classification:
    small-changes.md, under the existing attention-token-dropout ownership. Retain
    unrelated incumbent improvements. If unbiased-weights or another dropout replacement
    supersedes attention-token-dropout-random during development, re-scope and rebind
    the prerequisite before proceeding; do not restore the superseded operator or
    silently remove the dependency.'
  open_choices: Disjoint omissions need not produce negatively correlated gradients
    through nonlinear softmax/BCE. Mask noise may be negligible compared with image
    augmentation and sampling, or may contribute useful optimization noise. No cache
    measurement currently distinguishes these possibilities. The two-branch mean and
    existing mask count are fixed design choices, not a sweep.
  dependencies:
