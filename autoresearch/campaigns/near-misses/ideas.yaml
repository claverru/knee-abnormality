  novelty: First measurement of the shared-plus-residual head without the study-level
    fallback, on the re-seeded control.
  coverage: The two meniscus labels, every study.
  exploitation: If it helps,
  budget: One extra 2560-parameter vector; no runtime change.
  implementation: Adds the shared and residual vectors in modeling/model.py under
