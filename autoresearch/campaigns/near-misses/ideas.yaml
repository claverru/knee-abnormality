- id: plane-contrast-readouts
  mechanism_id: plane-contrast-specific-readouts
  parent_idea_id: null
  title: Give each plane/contrast type its own readout weights before summing, initialized
    from the shared readout
  opportunity: Current pooling collapses all acquisition types before one linear classifier
    per label. PF OA draws its evidence from axial fluid (29%) and sagittal (54%)
    and almost none from coronal; other labels have different profiles. An accepted,
    never-started small change.
  mechanism: Keep six partial vectors per label, u_cq = sum over tokens of type q
    of alpha_ci * h_i, and compute z_c = sum_q w_cq . u_cq + b_c with the same global
    attention denominator. Initialize every w_cq from the current w_c, reproducing
    the original predictions apart from summation order; missing types contribute
    zero. Image and token budgets unchanged.
  precedents:
  - 'Spec: docs/backlog/small-changes.md#planecontrast-specific-readouts'
  - 'Per-type contribution: docs/validation/results/2026-09-17-type-contribution.md'
  novelty: First per-type readout; count normalization, gated attention and residual
    readouts were different changes.
  coverage: All labels.
  exploitation: Check missing-type studies and vendor strata in the diagnostics.
  budget: Six times the readout weights; compute type contributions without a large
    pooling tensor.
  implementation: modeling/model.py under model.plane_readout; log the divergence
    of w_cq from w_c per epoch.
  open_choices: None; initialization is fixed.
  dependencies: []
  priority_rationale: Label-agnostic, suits PF OA's plane profile, and costs no images.
