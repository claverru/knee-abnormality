    \ sends gradients through both the appearance interaction and geometry-reweighted\
    \ values."
  - "[Isolated-union completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/near-misses/jobs/orchestrator-20260925T061620Z-3faf3ac9/report.json):\
    \ macro \u22120.002923, 80% [\u22120.004790,\u22120.001005]. It detached auxiliary\
    \ inputs only; public regional corrections still trained shared features. This\
    \ is counterevidence against assuming that partial isolation is sufficient."
  - '[Historical ownership-gradient completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/medial-lateral-transfer/jobs/orchestrator-20260921T064727Z-6a8fde9b/report.json):
    withholding much of the existing compartment trunk credit lost about 0.0039 macro.
