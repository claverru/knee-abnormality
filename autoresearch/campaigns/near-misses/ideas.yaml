- id: attention-dropout-unbiased-weights
  mechanism_id: fixed-count-expectation-preserving-attention-dropout
  parent_idea_id: attention-token-dropout-random
  title: Preserve the expected attention readout by applying fixed-count dropout after
    softmax
  opportunity: Accepted random masking combines token omission with renormalization
    over survivors. Its normalized ratio generally has a different expectation from
    evaluation attention. Highest-attention removal produced opposing PF OA/synovitis
    and lateral-OA/effusion movements, with negative macro change; its changed RNG
    consumption prevents clean attribution. A distinct refinement is to retain uniform
    random omissions while removing the normalization-induced mean shift. The size
    or harm of that shift in the incumbent has not been measured.
  mechanism: "For each study-label pool, compute ordinary attention a over all n allowed\
    \ tokens. Draw the same uniform subset of k=min(floor(0.05*n),4,n\u22121) tokens\
    \ using the incumbent random-key tensor. Set training weights to a'_t=a_t*I(t\
    \ retained)/(1\u2212k/n), without renormalizing their sum. Keep the classifier\
    \ bias unscaled. Conditional on the encoded bag, each token survives with probability\
    \ 1\u2212k/n, so E[a']=a and the current linear readout has exactly the evaluation\
    \ logit in expectation. Evaluation uses ordinary attention. This preserves random\
    \ omission while changing its stochastic aggregation operator."
  precedents:
  - '[Random-dropout completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/near-misses/jobs/orchestrator-20260925T013304Z-e56c661f/report.json):
    macro +0.002477, 80% [+0.000476,+0.004378], soft macro +0.001866. All study-label
    pairs were affected, but lateral meniscus, Baker''s and MCL declined.'
  - "[Highest-attention completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/near-misses/jobs/orchestrator-20260925T023405Z-f49ba564/report.json):\
    \ macro \u22120.000709, 80% [\u22120.002901,+0.001600], soft macro +0.000263.\
    \ PF OA and synovitis rose; lateral OA, effusion and both menisci fell. Removal\
    \ of the random draw changed subsequent RNG consumption."
  - '[Incumbent implementation](/home/claudio/src/knee-abnormality/outputs/autoresearch/near-misses/experiments/attention-token-dropout-random-20260925T003602Z-b69e50d5/source/src/knee_abnormality/modeling/model.py:237)
    masks scores before softmax and uses a linear classifier. These establish the
    proposed algebraic distinction, not a measured predictive benefit.'
  - '[Dropout, Srivastava et al., 2014](https://jmlr.org/papers/v15/srivastava14a.html)
    supplies the stochastic regularization precedent. The exact fixed-count expectation
    argument here follows from uniform inclusion probabilities.'
  - '[DropKey, CVPR 2023](https://arxiv.org/html/2208.02646v4) analyzes training/evaluation
    expectation mismatch, but its ViT experiments favor masking before softmax over
    conventional weight dropout. That is relevant counterevidence, not support for
    assuming this replacement will improve knee MIL.'
  novelty: Changes normalization rather than the masking rate, count, or spatial pattern.
    The expected linear readout is preserved exactly, while individual training weight
    sums may differ from one. The developing spatial-cluster idea instead changes
    mask correlation and retains survivor renormalization. This proposal is an alternative
    dropout mechanism, not an additional mask or consistency loss.
  coverage: "The identical operation applies to all twelve labels and their existing\
    \ allowed pools. Effusion and synovitis participate without special rules. Counts\
    \ with k=0 pass through unchanged; k\u2264n\u22121 retains at least one token.\
    \ Expected logits are preserved conditional on the bag, but sigmoid probabilities,\
    \ BCE and optimization trajectories are not expectation-equivalent."
  exploitation: Log omitted token counts, affected studies, removed original attention
    mass, realized weight sums, scaling factors and masked-versus-full logit differences
    each epoch. These diagnostics distinguish mass fluctuation from denominator-induced
    redistribution. Examine every label's hard and soft AUC; no label-specific coefficient
    is introduced.
  budget: Adds no parameters and replaces one masking/normalization placement with
    elementwise scaling. The same random draw and pooling dimensions can be retained.
    Full-logit diagnostics need only readout arithmetic over existing tokens. Expected
    cost is close to the 1662.83-second original random-dropout run, but must still
    be measured against 1905 seconds.
  implementation: Against revision 262, replace attention-token-dropout-random's pre-softmax
    omission with this post-softmax operator under model.token_dropout. Retain its
    uniform mask draw, count rule and activity logging; remove the superseded renormalized
    branch. Preserve unrelated heads, geometry and auxiliary components. Classify
    in small-changes.md under attention-token dropout. If spatial-cluster dropout
    becomes incumbent, this proposal deliberately replaces that overlapping dropout
    mechanism with uniform fixed-count weighting; do not stack masks or assume cluster
    inclusion probabilities are uniform. Retain other accepted improvements. If a
    new nonlinear pooled readout or mask-dependent mechanism invalidates the expectation
    claim or a retained prerequisite, return for redesign.
  open_choices: Survivor renormalization may be part of the accepted method's useful
    regularization. Post-softmax scaling introduces stochastic readout magnitude and
    can penalize useful concentrated evidence. The small four-token cap may make the
    mean mismatch negligible. No incumbent cache probe currently establishes its magnitude.
    Preserve RNG consumption so this comparison avoids the highest-attention run's
    known confound.
