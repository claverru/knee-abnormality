- id: spatial-cluster-token-dropout
  mechanism_id: spatially-correlated-attention-token-dropout
  parent_idea_id: attention-token-dropout-random
  title: Drop a small random spatial cluster using the accepted token-removal count
  opportunity: Random dropout was accepted, but highest-score removal exchanged PF
    OA and synovitis gains for substantial lateral-meniscus loss and a negative macro
    result. Independent random omissions may leave neighboring, correlated evidence
    almost intact. A spatial cluster tests that suspected redundancy without deliberately
    removing the strongest lesion evidence. Neighbor similarity and the effective
    strength of a four-token cluster have not been measured.
  mechanism: "Keep the accepted count k=min(floor(0.05*n),4,n\u22121) for each study-label\
    \ pool. Use the incumbent random-key tensor to choose a uniformly random allowed\
    \ anchor, then remove its nearest allowed feature-grid neighbors within that same\
    \ encoded image until k tokens are selected. Resolve equal distances using the\
    \ same random keys. If that image cannot supply k tokens, continue from the lowest-key\
    \ remaining anchor. Apply this single rule to every label after existing anatomical\
    \ restrictions, renormalize attention, and disable it at evaluation."
  precedents:
  - '[Random-dropout completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/near-misses/jobs/orchestrator-20260925T013304Z-e56c661f/report.json):
    macro +0.002477, 80% [+0.000476,+0.004378]; 168,096 masked selections per epoch.
    This is the accepted behavioral parent.'
  - "[Highest-score completion](/home/claudio/src/knee-abnormality/outputs/autoresearch/near-misses/jobs/orchestrator-20260925T023405Z-f49ba564/report.json):\
    \ macro \u22120.000709; PF OA +0.011320, synovitis +0.007665 and lateral meniscus\
    \ \u22120.012962. Removing its random draw also changed subsequent RNG consumption."
  - '[DropBlock](https://arxiv.org/abs/1810.12890) motivates correlated spatial masking
    because neighboring convolutional activations can preserve information after independent
    dropout. Its feature-map experiments do not establish a benefit from masking attention
    tokens.'
  - '[ACMIL](https://arxiv.org/abs/2311.07125) studies multiple attention branches
    and stochastic masking within highly attended instances. This proposal instead
    uses spatial adjacency and random anchors. The [general attention-dropout backlog](/home/claudio/src/knee-abnormality/docs/backlog/small-changes.md#attention-token-dropout)
    owns the broader direction.'
  novelty: Changes the correlation structure of exclusions while preserving their
    count, training boundary and random-key consumption. It is neither a rate/cap
    sweep nor a renamed highest-score mask. Unlike the historical overlapping-triplet
    smoothing proposal, it changes public attention support rather than auxiliary
    detector logits.
  coverage: The same rule covers all twelve labels, including effusion and synovitis.
    Meniscus exclusions remain inside its allowed pool. Masking uses feature-grid
    identity within an already encoded image, requiring neither patient landmarks
    nor new image sampling.
  exploitation: "Log total dropped tokens, multi-token same-image clusters, cluster\
    \ distances, affected study-label pairs and removed attention mass by epoch. Preserve\
    \ the incumbent random draw\u2019s shape and call position so this comparison\
    \ avoids the known RNG-consumption difference of the top-token arm. Assess the\
    \ complete label vector, especially whether diffuse-label gains again accompany\
    \ focal-label losses."
  budget: "No new learned parameters or encoder work. Distances are computed from\
    \ selected anchors to existing grid positions; no all-pairs token matrix is needed.\
    \ Extra mask-selection work should be small relative to the accepted run\u2019\
    s 1,662.8-second compute, but realized runtime remains unmeasured."
  implementation: 'Against revision 233, replace independent random selection in model.token_dropout
    with spatial clustering, retaining its count rule and logging. Expose encoded-image
    identity and grid positions internally in model.py; no new dataset batch field
    is expected. Keep anatomical eligibility, half-knee supervision and all inference
    behavior. Classification: small-changes.md. If accepted, this supersedes attention-token-dropout-random
    rather than stacking another mask. Retain unrelated incumbent improvements; if
    another dropout mechanism is accepted during development, reassess the replacement
    against that mechanism before proceeding.'
  open_choices: A cluster can erase an entire focal finding even when its anchor is
    random. Four tokens may also be too few to alter redundant evidence materially.
    Nearest valid anchors need not form a connected shape around invalid support,
    so log realized geometry rather than assuming every mask is contiguous.
  dependencies: []
  priority_rationale: 'Priority 4: the cheapest structural extension of the only accepted
    campaign mechanism, with a clear external rationale and improved RNG comparability.
    Its expected effect is least certain because spatial redundancy and cluster strength
    are unmeasured.'
  status: completed
  created_revision: 236
  ranking_rationale: 'Both proposals pass proposal_admission and describe distinct,
    bounded changes. Acquisition-mass routing moves ahead of the queued plane readout
    because the completed OA geometry run confirms substantial attention movement,
    although it does not identify harmful movement between acquisitions. Expectation-preserving
    dropout follows: its fixed-count construction addresses a real algebraic difference
    in the accepted readout, but the size and predictive cost of that difference are
    unmeasured. The reserved spatial-cluster head stays first. The plane proposal
    remains live; its suspected metadata contribution is also unmeasured.'
