- id: meniscus-shared-residual-head
  mechanism_id: shared-plus-residual-meniscus-classifier
  parent_idea_id: null
  title: Read both masked meniscus pools with one shared classifier plus zero-initialized
    per-side residuals, without the study-level fallback
  opportunity: In knee-geometry this head scored -0.0006 against the adopted run but
    +0.0025 against k05-clean (80% interval [+0.0008, +0.0041]); both menisci improved
    (+0.0028, +0.0041), OA +0.0020, and its x1 score was the campaign's best. Its
    loss was almost all Fracture (-0.0135), the label a re-seed of the same recipe
    moves by -0.0137. It also carried the study-level fallback, which alone scored
    -0.0018, so the head was never measured on its own.
  mechanism: For the two meniscus rows, w_med = w_shared + delta_med and w_lat = w_shared
    + delta_lat, with w_shared initialized to the mean of the two current rows, deltas
    at zero, no penalty and private biases. Attention rows, the own-side meniscus
    mask, the half-knee loss and every other head stay unchanged. Lateral tears (279
    exclusive training studies against 1,150 medial) learn from medial examples through
    the shared vector.
  precedents:
