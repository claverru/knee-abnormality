  title: Pull PF OA attention toward the front of the knee with the adopted anatomical
    bias mechanism on the front-back axis
  opportunity: PF OA is the weakest label (0.852 on the re-seeded control). In the
    spatial importance map it has the strongest front-back contrast of any label (+1.85
    anterior). The adopted medial-lateral anatomical bias (fixed 20 mm width, learned
    strength) gained +0.0023 when adopted. The retired attention prior learned position
    and width for every label from a nearly flat start and barely moved, a different
    design.
