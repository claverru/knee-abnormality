- id: hard-pair-final-phase
  mechanism_id: hard-pair-mining
  parent_idea_id: null
  title: In the last three epochs put the worst-ordered pairs in the same batch and
    add a pair term
  opportunity: 'One unverified external report: another participant''s best setup
    ends with three epochs of hard mining. The metric is a ranking and the loss is
    not; the in-batch ranking term tried earlier saw random pairs (about 118 per step)
    and was neutral (+0.0007). Mining decides which pairs share a batch. Guess, low:
    -0.001 to +0.001 macro.'
  mechanism: 'Epochs 1 to 7 are unchanged, except that every training step stores
    its detached logits in a buffer indexed by the study''s row in the training frame
    (no host synchronisation). Before each of epochs 8, 9 and 10 the training order
    is rebuilt from the previous epoch''s stored logits. Mining: per label, among
    training studies whose target is >= 0.75 (positives) or <= 0.25 (negatives), the
    200 positive-negative pairs with the largest negative-minus-positive logit. Order:
    the mined pairs of all labels are visited from most to least wrong; a pair whose
    two studies are both still unplaced is placed in the current batch, and a batch
    closes at four pairs; when no pair is left, the unplaced studies fill the remaining
    batches in the epoch''s shuffled order. Every study is still seen exactly once
    per epoch and the number of steps is unchanged; the batches are then drawn in
    shuffled order. Loss in those three epochs: the usual loss plus 0.1 times a pair
    term, the mean over labels with at least one pair of softplus(negative logit -
    positive logit) over all positive-negative pairs of that label inside the batch
    (same 0.75 and 0.25 rule). Validation and prediction are unchanged.'
