- id: soft-prevalence-class-weights
  mechanism_id: class-weights
  parent_idea_id: null
  title: Compute the class weights from the mean soft target of each label instead
    of its thresholded fraction
  opportunity: 'The class weights (exponent 0.5) are computed from the fraction of
    training cells at or above 0.5. The targets are soft, and on the labels with many
    uncertain cells the two prevalences differ most: Synovitis 0.124 thresholded against
    0.310 soft, Fracture 0.064 against 0.125, MCL 0.050 against 0.098, Effusion 0.272
    against 0.347 (prior-work.md, the training targets). Synovitis is the reference''s
    weakest label (0.8954) and its positive weight is 2.16 although a third of its
    cells are uncertain. Guess, low-medium: +0 to +0.001 macro, Synovitis, Fracture
    and Effusion first. Class weighting has disagreed with the public board before,
    so an adoption is provisional.'
  mechanism: 'Today fixed_class_balance (training/lightning.py) sets, per label, fraction
    = (observed training cells with target >= 0.5) / (observed training cells), then
    rho = ((1 - fraction) / fraction) ** exponent, negative_weight = 1 / (fraction
    * rho + 1 - fraction), positive_weight = rho * negative_weight. The change is
    one line: fraction = the mean of the label''s observed training targets (column
    target_<label>, gold studies included with their official values). Everything
    after it is unchanged, and so is the loss, which still gives a cell the positive
    weight when its target is >= 0.5 and the negative weight otherwise. The returned
    dictionary keeps its keys: positive and negative stay the thresholded counts,
    positive_fraction holds the soft mean. Expected positive weights, computed on
    the non-gold studies: about 1.29 for Synovitis (from 2.16), 2.19 for Fracture
    (from 3.15), 2.55 for MCL (from 3.66), 1.21 for Effusion (from 1.38).'
  precedents:
  - 'prior-work.md, precedents: exponent 0.5 lost on fold 0 and won publicly; a ramped
    exponent tied; soft-mass weighting and a prior offset lost 0.0092 and 0.0119 while
    changing other loss semantics.'
  - 'docs/backlog/small-changes.md, weighting strength: the entry this seed implements.'
  novelty: First isolated run of soft prevalence; first class-weight change on a RadImageNet
    backbone.
  coverage: Every training cell of every label; the weights change most on Synovitis,
    Fracture, MCL and Baker's.
  exploitation: 'Read Synovitis, Fracture, MCL, Baker''s and Effusion, then the macro,
    at both multipliers and on the x1 mean of epochs 6 to 10. Activation: the twelve
    positive_fraction and positive_weight values of the run''s fold_2/class_balance.json,
    listed in the report beside the reference''s. No new metric. Shown wrong by: the
    macro below the incumbent at both multipliers with Synovitis and Fracture down.'
  budget: The reference's training time; the weights are computed once per fold.
  implementation: 'Follow the environment paragraph of the developer instructions.
    File: training/lightning.py, function fixed_class_balance only. Replaces the thresholded
    fraction; no option, no config field. Keep the dictionary''s keys and its version
    1, because validated_class_balance_weights and the resume check in the protected
    training/checkpoints.py read them. Check without a GPU: call fixed_class_balance
    on the fold-2 training frame from load_fold_labels and print the twelve fractions
    and weights before and after. If hard-report-targets is in the incumbent the soft
    mean equals the thresholded fraction on non-gold cells: return blocked and say
    so.'
