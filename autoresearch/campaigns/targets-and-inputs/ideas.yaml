- id: stable-intensity-bounds
  mechanism_id: intensity-bounds
  parent_idea_id: null
  title: Take a series' clipping bounds from a fixed set of its slices instead of
    the slices drawn
  opportunity: 'The 0.005 and 0.995 quantiles that clip and scale a series are taken
    over the slices selected for the bag, so the same slice gets different pixel values
    when its companions change: between epochs, and between training (five or six
    triplets of a series) and x4 prediction (most of the series). Measured on 40 studies:
    the high bound moves 0.072 at the median and 0.245 at the 90th percentile between
    draws, more than the 0.2 range of the contrast augmentation in 14.2% of series,
    mostly series with few triplets (prior-work.md). The effect on AUC was never measured.
    Guess, low-medium: +0 to +0.001 macro, more at x4 than at x1.'
  mechanism: 'Today: prepare_series (data/preprocessing/preparation.py) decodes the
    unique slices of the selected triplets into PreparedSeries.frames and sets quantile_ranks
    from their pixel count; device.py (_prepare_on_cpu and prepare_images) then takes
    the two quantiles over the central image-size window (central_rectangle) of every
    frame of the series, and normalises the frames that carry an image. Change: the
    quantiles are taken over a reference set R of the series that does not depend
    on the selection. R is the slices at positions round(i * (n - 1) / (k - 1)), i
    = 0..k-1, k = min(n, 7), of the series'' n indexed slices in original_index order
    (all of them when n <= 7; the one slice when n = 1). Frames of R that no selected
    triplet uses are decoded with the same decoder and cache and appended to the series''
    frames as frames without an image; device.py already supports such frames (the
    slot < 0 branch of _prepare_on_cpu, which reads only their central window). Each
    frame carries a flag saying whether it is in R; the quantile population and the
    pixel count given to quantile_ranks are the central windows of the flagged frames
    only, so a selected slice outside R is normalised by the bounds and does not enter
    them. The quantile levels, the central window, the normalisation and every image
    pixel path are unchanged.'
  precedents:
  - 'docs/data-preparation/preprocessing-implementation-and-profile.md, clipping-bound
    stability across draws: the measurement.'
  - 'docs/backlog/big-bets.md, sampling-independent intensity bounds: the entry this
    seed implements.'
  - 'prior-work.md, precedents: other quantile levels lost 0.0003 and 0.0021; this
    changes the pixel population, not the levels.'
  novelty: First run with bounds independent of the drawn slices.
  coverage: Every series; series with few selected triplets most.
  exploitation: 'Read the macro at x4 and x1 and the step from x1 to x4 against the
    incumbent''s. Activation: in the report, for two studies, the low and high bound
    of every series at x1 and at x4 and in two epochs of the training selection, which
    must be identical four times, beside the bounds the old code gives for the same
    four selections. No new metric in training or validation. Shown wrong by: both
    multipliers below the incumbent.'
  budget: Up to seven extra slice decodes per series in the loader workers (a study
    has about six series; 4 to 5 of the 16 workers are busy today). Training time
    within 1.10 of the reference's. Report the loader seconds per study on two studies
    before and after; if the measured increase would push an epoch past 1.10, lower
    k to 5 and say so.
  implementation: 'Follow the environment paragraph of the developer instructions.
    Files: data/preprocessing/preparation.py (prepare_series takes the series'' reference
    records beside the selected ones, returns the extra frames, the per-frame flag
    and the pixel count of R), data/dataset.py (the caller passes the reference records
    of the indexed series; the collate carries the flag in the frame tuples), data/preprocessing/device.py
    (both _prepare_on_cpu and prepare_images restrict the quantile population to flagged
    frames; _region_values on the GPU path likewise), data/preprocessing/intensity.py
    only if a helper is needed. Replaces the old population; no option. R is chosen
    by slice order alone, with no randomness, and is the same for the 84 mm, 93 mm
    and 64 mm views of one series. A reference slice that fails to decode is dropped
    from R; if R is empty the series is handled as an undecodable series is today.
    The preprocessing identity changes, which the campaign permits.'
