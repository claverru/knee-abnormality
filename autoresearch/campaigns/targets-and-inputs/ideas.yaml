- id: average-pool-shortcuts-in-the-resnet
  mechanism_id: backbone-shortcut-downsampling
  parent_idea_id: null
  title: Downsample the three stride-two shortcuts of the ResNet-50 with an average
    pool before the 1 by 1 convolution (ResNet-D), on the same weights
  opportunity: 'Forced by the user on 2026-10-13 as an exception to the contract''s
    settled backbone: the same weights in the same places, with one fixed operation
    changed. In the ResNet-50 the shortcut of the first block of layer2, layer3 and
    layer4 is a 1 by 1 convolution with stride 2, which reads one pixel in four and
    discards the rest. ResNet-D (Bag of Tricks, arXiv 1812.01187) averages the 2 by
    2 neighbourhood first and applies the same convolution at stride 1; the weight
    tensor has the same shape. At 224 px a meniscus is a few pixels wide, so the discarded
    positions carry structure. The published gain is for networks trained from scratch;
    on pretrained weights the function changes slightly at the start (0.018 relative
    on random weights, measured by the modernisation review of 2026-10-13) and fine-tuning
    adapts: guess, low, -0.0005 to +0.0005 macro. Never run here; the token mapping
    already handles these shortcuts (docs/ongoing/radimagenet-backbone.md).'
  mechanism: In modeling/model.py the ResNet backbone is created with avg_down=True
    in addition to today's arguments. timm then builds each shortcut as (average pool,
    1 by 1 convolution at stride 1, batch norm), so the shortcut's tensors move from
    downsample.0 and downsample.1 to downsample.1 and downsample.2. Before the strict
    load, the RadImageNet state dict's keys are renamed accordingly for every block
    that has a shortcut (layerN.0.downsample.0.* to layerN.0.downsample.1.*, layerN.0.downsample.1.*
    to layerN.0.downsample.2.*); the load stays strict and every pretrained tensor
    is used. No parameter is added. The L2-SP anchors and the optimizer groups are
    built from the loaded parameters as today. Validation, prediction and Kaggle inference
    run the same backbone. No option and no config field.
