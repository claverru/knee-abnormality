- id: uncertain-report-targets-weigh-less
  mechanism_id: target-uncertainty-weights
  parent_idea_id: null
  title: Weigh each report-derived training cell by how far its target is from 0.5
  opportunity: 'A report-derived target near 0.5 means the sources disagree or the
    report hedges; the loss pulls the prediction of such a cell to the middle with
    full weight. The labels with most such cells include the two weakest: 33% of Synovitis
    cells, 34% of Effusion and 24% of PF OA lie between 0.25 and 0.75, against 3 to
    8% for the menisci, ACL and Fracture (prior-work.md). An all-or-nothing mask of
    low-evidence cells was rejected early; a graded weight was never run. Guess, low-medium:
    +0 to +0.001 macro, Synovitis, Effusion and PF OA first.'
  mechanism: 'Today masked_binary_cross_entropy_with_logits (training/lightning.py)
    computes the BCE of every cell against its soft target, multiplies it by the positive
    or negative class weight, and averages over the observed cells of the batch. Change:
    before the average, the loss of a cell of a non-gold study is also multiplied
    by u = abs(2 * t - 1) / m_label, t the cell''s target and m_label the mean of
    abs(2 * t - 1) over the observed non-gold training cells of that label in the
    fold (0.538 for Synovitis to 0.856 for MCL), so each label keeps its total loss
    mass. Cells of gold studies keep u = 1. The targets, the class weights and the
    average over observed cells are unchanged. A cell at exactly 0.5 contributes nothing.'
  precedents:
  - 'prior-work.md, precedents: the binary mask of low-evidence cells was rejected;
    shared balanced focal, which up-weights hard cells, lost 0.0026.'
  - 'docs/backlog/small-changes.md, report-label supervision, source-aware uncertainty
    weighting: the entry this seed implements with the target itself as the evidence.'
  novelty: First graded uncertainty weight; the direction opposite to focal weighting.
  coverage: Every non-gold cell; a third of Synovitis and Effusion cells lose most
    of their weight.
  exploitation: 'Read Synovitis, Effusion, PF OA and Medial OA, then the macro, at
    both multipliers. Activation: the twelve m_label values listed in the report,
    and one training-side epoch metric through _log_epoch_metric, the mean u of the
    batch''s observed cells (it must stay near 1). Shown wrong by: those four labels
    down as a group at both multipliers.'
  budget: The reference's training time; one multiplication per cell.
  implementation: 'Follow the environment paragraph of the developer instructions.
    File: training/lightning.py only. The batch already carries is_gold (one boolean
    per study), target and target_observed. Compute the twelve m_label once per fold
    from the training frame where the class balance is computed, keep them as a buffer,
    and pass them with batch["is_gold"] to the loss. Adds a cell weight; no option,
    no config field. Validation is not weighed. If hard-report-targets is in the incumbent
    every non-gold target is 0 or 1 and u is 1: return blocked and say so.'
  open_choices: None.
  dependencies: []
  priority_rationale: Aims at the weak labels through the property they share.
