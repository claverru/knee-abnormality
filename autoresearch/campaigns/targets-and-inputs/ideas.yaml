- id: global-context-in-the-resnet-blocks
  mechanism_id: backbone-global-context
  parent_idea_id: null
  title: Add an additive global-context block to the bottlenecks of stages two to
    four, started at zero, keeping the Refined-RadImageNet weights
  opportunity: 'Forced by the user on 2026-10-13 under the contract''s exception for
    modules inside the blocks that keep every pretrained weight and start as the identity.
    A global-context block pools the whole feature map with one learned attention
    map and adds a per-channel term to every position: each token of a slice then
    sees the rest of the slice inside the backbone, which the ResNet-50 otherwise
    gets only from its receptive field. It is the one block-level attention with direct
    evidence for insertion into an already trained network: GCNet (arXiv 1904.11492)
    inserts it into a trained ResNet-50 and fine-tunes, 76.88 to 77.70 top-1 with
    the baseline given the same extra epochs: evidence, medium, another task. Never
    run in this project (searched docs and campaigns on 2026-10-13). Guess, low: -0.0005
    to +0.001 macro.'
