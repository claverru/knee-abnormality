- id: coordinate-attention-late-stages-pulled-to-identity
  mechanism_id: backbone-coordinate-attention
  parent_idea_id: null
  title: Add coordinate attention to the bottlenecks of stages three and four, started
    as the identity and pulled toward it as L2-SP pulls the weights around it, keeping
    the Refined-RadImageNet weights
  opportunity: 'Forced by the user on 2026-10-13 under the contract''s exception for
    modules inside the blocks. Coordinate attention (arXiv 2103.02907) gates each
    channel by one profile along the height and one along the width of the feature
    map, so the gate knows where on the slice a structure is, which a squeeze-and-excitation
    gate does not. The knee''s labels are tied to positions on the slice (compartments,
    the joint line, the kneecap). Its published evidence is for networks trained from
    scratch; the gain when added to a trained network is a guess, low: -0.0005 to
    +0.001 macro. Never run inside the backbone here (the per-target Gaussian coordinate
    priors of the medial-lateral-transfer campaign acted on the pooling, not on the
    backbone). Changed by the user on 2026-10-13 before it ran: run 22 put a free
    squeeze-and-excitation gate at the head rate in the blocks and lost 0.0010 at
    x4, with a lower training loss (0.5672 against 0.5717), a validation loss no lower
    and a lower L2-SP penalty (0.0191 against 0.0210): evidence, medium, one run,
    that free gates take over adaptation from the anchored convolutions. This seed
    therefore pulls its gates toward the identity.'
  mechanism: 'In modeling/model.py, after the ResNet backbone is created and before
    the RadImageNet weights are loaded, each of the nine bottlenecks of layer3 and
    layer4 gets timm.layers.coord_attn.CoordAttn(channels of the block''s output)
    with timm''s defaults except the gate, in the block''s attention slot (block.se,
    applied after bn3 and before the residual sum). If an adopted incumbent already
    holds a module in that slot, the slot becomes nn.Sequential(existing module, coordinate
    attention). Layers 1 and 2 get none. The module must start as the identity: its
    gate is 2 * sigmoid(x) instead of sigmoid(x) (a small module passed as gate_layer),
    and the weights of its two output convolutions (the height one and the width one;
    their biases too if they have one) are zero, so both profiles are exactly 1 at
    the start. Every other new tensor keeps timm''s default initialisation, drawn
    under torch.random.fork_rng. The RadImageNet load accepts exactly the new tensors
    as missing: strict=False, and raise unless the unexpected keys are empty and every
    missing key contains ''.se.''. Optimizer, for the new tensors only: parameters
    whose name contains ''.se.'' train in the head group at head_lr with weight decay
    0 and are not anchored by L2-SP to their initial values; every other parameter
    keeps its group, rate, decay and anchor. A pull toward the identity replaces the
    decay: the training loss gains optimizer.anchor_alpha_late (0.001, the strength
    L2-SP applies to the pretrained weights of these stages) times the sum over the
    nine modules of the squared entries of the weights of the two output convolutions
    (the height one and the width one, and their biases if they have one), added where
    the L2-SP penalty is added and logged in a separate training-side epoch metric
    coordinate_identity_penalty through _log_epoch_metric. The module is the identity
    exactly when those two convolutions are zero, so this is L2-SP with the identity
    as the anchor; the module''s first convolution and its batch norm have no pull.
    The module''s own batch norm trains as the backbone''s batch norms do. Validation,
    prediction and Kaggle inference run the same backbone. No option and no config
    field.'
