- id: squeeze-excitation-in-the-resnet-blocks
  mechanism_id: backbone-channel-attention
  parent_idea_id: null
  title: Add a squeeze-and-excitation module to every bottleneck of the ResNet-50,
    started as the identity, keeping the Refined-RadImageNet weights
  opportunity: 'Forced by the user on 2026-10-13 as an exception to the contract''s
    settled backbone: the backbone stays resnet50.a1_in1k with the Refined-RadImageNet
    weights, and gains channel attention inside its blocks. timm builds it from the
    same model name: with block_args=dict(attn_layer=''se'') every one of the sixteen
    bottlenecks gets an SEModule after its third batch norm, and the pretrained state
    dict still fills every existing tensor (checked on timm 1.0.26: 64 new tensors,
    all under layerN.M.se, none unexpected, 2,530,992 new parameters). The backbone
    has never had channel attention in this project; the gain of adding it to an already
    pretrained network during fine-tuning is a guess, low: -0.0005 to +0.001 macro.'
  mechanism: 'In modeling/model.py, where the backbone is created (timm.create_model(model.backbone,
    ...)), a ResNet backbone is created with block_args=dict(attn_layer=''se'') in
    addition to today''s arguments. The RadImageNet weights are then loaded as today,
    except that the load accepts exactly the SE tensors as missing: load with strict=False
    and raise unless the unexpected keys are empty and every missing key contains
    ''.se.''. Each SE module must start as the identity so the network computes the
    pretrained function at step 0: its gate is 2 * sigmoid(x) instead of sigmoid(x)
    (a small module passed as the SE gate_layer through attn_layer, for example partial(SEModule,
    gate_layer=...), or the module''s gate replaced after creation), fc2''s weight
    and bias are zero, and fc1 keeps timm''s default initialisation, drawn under torch.random.fork_rng
    so no other initialisation moves. With that, the gate is exactly 1 for every channel
    at the start and its gradient is not saturated. The SE reduction stays timm''s
    default (one sixteenth). Optimizer and anchor, for the new tensors only: parameters
    whose name contains ''.se.'' are not anchored by L2-SP (they have no pretrained
    value; skip them in the loop that builds anchor_parameters and backbone_origin)
    and train in the head group (head_lr and the head''s weight decay rule) instead
    of backbone_lr. Every other parameter keeps its group, rate, decay and anchor.
    Validation, prediction and Kaggle inference run the same backbone: the SE modules
    are inside the stages, so use_fixed_backbone_chunks and the stage outputs the
    heads and the mask decoder read are untouched in shape. No option and no config
    field: the ResNet backbones of this recipe have SE from this run on.'
  precedents:
  - 'docs/ongoing/radimagenet-backbone.md: how the Refined-RadImageNet weights are
    loaded and what was tried on the backbone.'
  - 'run-notes.md, run 5 and its audit: the last gain came through stage four and
