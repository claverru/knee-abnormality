- id: balanced-target-columns
  mechanism_id: balanced-target-columns
  parent_idea_id: null
  title: Balance each label by which cells enter the loss, not by weighting them
  opportunity: 'The class weights balance the two groups of a label by scaling their
    loss, so a rare label''s positives count 2 to 3.7 times (prior-work.md). The alternative
    that was never run balances by selection: every positive cell and an equal expected
    number of negative cells enter the loss, all at weight one, and each step sees
    a different set of negatives. Guess, low: -0.001 to +0.001 macro, the rare labels
    (MCL, Fracture, Contusion, Lateral OA) first.'
  mechanism: 'Today the loss gives a cell the positive class weight when its target
    is >= 0.5 and the negative one otherwise, and averages over the observed cells
    of the batch. Change: per label, the group with fewer training cells (positives
    for all twelve labels; counted with target >= 0.5 over the fold''s observed training
    cells, as fixed_class_balance counts them) always stays in the loss; a cell of
    the other group stays with probability p_label = minority count / majority count
    (0.05 for MCL to 0.63 for Medial Meniscus), drawn independently at every training
    step. Kept cells keep their soft targets and all have weight one. The average
    is over the kept observed cells. Studies, images and the other labels of a dropped
    cell''s study are unchanged.'
  precedents:
  - 'docs/backlog/small-changes.md, report-label supervision, balance each target
    column through training masks: the entry this seed implements, with the mask drawn
    per step instead of per epoch.'
  - 'prior-work.md, precedents: class-balanced BCE about +0.008 over none; the binary
    evidence mask rejected.'
  novelty: First run that balances by selection instead of by weight.
  coverage: Per step MCL keeps about 10% of its cells, Fracture 13%, Medial Meniscus
    77%.
  exploitation: 'Read the four rare labels and the macro at both multipliers. Activation:
    the twelve p_label values listed in the report, and one training-side epoch metric
    through _log_epoch_metric, the share of observed cells kept per batch (expected
    about 0.35). Shown wrong by: the macro below the incumbent at both multipliers.'
  budget: The reference's training time; one random draw of batch-by-twelve values
    per step.
  implementation: 'Follow the environment paragraph of the developer instructions.
    File: training/lightning.py only. fixed_class_balance keeps its dictionary shape
    and version 1 (validated_class_balance_weights and the resume check in the protected
    training/checkpoints.py read it) and returns positive_weight and negative_weight
    1.0 for every label, with the counts as now; p_label is computed from those counts
    once and kept as a buffer. In training_step the keep mask is torch.rand of the
    target''s shape from a dedicated torch.Generator on the training device, seeded
    once from the run''s seed, so the incumbent''s other random streams are unchanged;
    the mask is combined with batch["target_observed"] before the average. Replaces
    the class weights; no option, no config field. Validation is unchanged. If hard-report-targets
    or uncertain-report-targets-weigh-less is in the incumbent, keep its targets or
    cell weights and apply the mask on top.'
