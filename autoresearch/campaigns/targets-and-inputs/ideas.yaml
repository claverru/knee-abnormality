- id: mask-decoder-beside-the-labels
  mechanism_id: mask-decoder
  parent_idea_id: null
  title: Teach the backbone the masks through a decoder at the second stage's resolution,
    in training only
  opportunity: 'The bone and soft-tissue maps are taught per fourth-stage token (7
    by 7) and per third-stage cell (14 by 14), 6 to 17 mm wide, from masks that exist
    at 1 mm. The per-token map was worth +0.002 public on this backbone (S126 against
    S119) with +0.0017 at x1. A decoder that predicts the masks on the second stage''s
    28 by 28 grid asks the earlier stages for the boundaries the labels depend on
    (cartilage, menisci, the joint line). Guess, low-medium: +0 to +0.001 macro, the
    meniscus and OA labels first.'
  mechanism: 'In training only, a decoder reads three feature maps of the main pass:
    the second-stage output (28 by 28, the tensor _backbone_to_stride_8 returns),
    the third-stage output (14 by 14) and the fourth-stage output (7 by 7). Each goes
    through a 1 by 1 convolution to 64 channels; the 7 by 7 map is upsampled by 2
    (bilinear) and added to the 14 by 14 one, a 3 by 3 convolution with batch norm
    and ReLU follows, the result is upsampled by 2 and added to the 28 by 28 one,
    and a second 3 by 3 convolution with batch norm and ReLU follows. Two 1 by 1 heads
    on that map predict the seven bone classes and the seven soft-tissue classes per
    cell. Targets: the class shares of each cell from the prepared volumes, obtained
    as the existing map targets are (AnatomyTargets.token_shares in training/anatomy.py,
    given each cell''s patient position and its two step vectors), for the 28 by 28
    cells of every image. Loss: the existing anatomy_loss with its coverage rule,
    once per head, each added to the training loss at weight 0.1. The existing per-token
    and per-cell map heads, their losses, the routing that reads them and everything
    in validation and prediction are unchanged.'
  precedents:
  - 'prior-work.md, precedents: the anatomy map and posed crops on the ResNet-50.'
  - 'docs/backlog/big-bets.md, anatomy masks, segmentation before the labels: the
    entry this seed implements as a side task.'
  novelty: First dense mask supervision finer than the third-stage grid.
  coverage: The studies with prepared volumes (about 400 knees for bone, 265 for soft
    tissue); the backbone's stages one to four.
  exploitation: 'Read the menisci, the three OA labels and ACL, then the macro, at
    both multipliers. Activation: two training-side epoch metrics through _log_epoch_metric,
    the decoder''s bone loss and its soft-tissue loss, which must fall over the epochs,
    and the number of supervised cells per epoch (one metric, reduce sum). Nothing
    is logged on validation: the decoder does not run there. Shown wrong by: the macro
    below the incumbent at both multipliers while both decoder losses fall.'
  budget: No extra backbone pass. The decoder adds two 3 by 3 convolutions at 64 channels
    on 14 by 14 and 28 by 28 maps for about 250 images per step. Training time within
    1.10 of the reference's and peak GPU memory within 18 GB (16.2 GB now); state
    both estimates and the parameter count in the report.
  implementation: 'Follow the environment paragraph of the developer instructions.
    Files: modeling/model.py, training/lightning.py, training/anatomy.py only if token_shares
    needs a small generalisation. Adds a training-only module; no option, no config
    field. In the training branch of the method that calls _backbone_to_stride_8 and
    _backbone_stage_outputs, keep the second-stage tensor and put the three maps in
    the encoded dictionary; do not change the signature or the return value of _backbone_features,
    which Kaggle inference replaces with fixed chunks (use_fixed_backbone_chunks in
    inference/engine.py). The 28 by 28 cells'' patient positions and steps are derived
    the way the 14 by 14 cells'' are (meniscus_patient_position, meniscus_token_steps)
    with half the step. Build the decoder under torch.random.fork_rng. Its parameters
    are part of the model, so strict loading holds; it is called only when self.training
    is true. The decoder takes the features after the feature-statistics augmentation,
    as the stages do.'
