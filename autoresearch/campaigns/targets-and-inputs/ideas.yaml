- id: soft-prevalence-class-weights-on-the-incumbent
  mechanism_id: class-weights
  parent_idea_id: soft-prevalence-class-weights
  title: Compute the class weights from the mean soft target of each label, on the
    current incumbent
  opportunity: 'The user''s decision of 2026-10-13: adopt the soft-prevalence class
    weights. Run 1 tested them on the reference (x4 0.937509 against 0.937000, x1
    0.929788 against 0.928460, soft AUC +0.000871) and passed the rule; the keeper
    took it out of the incumbent on 2026-10-12 because class weighting had disagreed
    with the public board before. The pair is now read publicly at the same settings
    (single model, x4, tau 0.9): S150 with the soft-prevalence weights 0.960, fifth
    in Kaggle''s score order, against its reference S151 0.959, thirteenth. Evidence,
    medium, one pair on fold 2: local and public agree in sign. The incumbent has
    since gained the mask decoder and the OA detector without these weights, so the
    change is applied to it in one run and that run becomes the incumbent by the user''s
    decision.'
  mechanism: 'Exactly the change of run 1, on the current incumbent''s source. In
    fixed_class_balance (training/lightning.py) the per-label fraction is the mean
    of the label''s observed training targets (column target_<label>, gold studies
    included with their official values) instead of (observed training cells with
    target >= 0.5) / (observed training cells). Everything after it is unchanged:
    rho = ((1 - fraction) / fraction) ** exponent, negative_weight = 1 / (fraction
    * rho + 1 - fraction), positive_weight = rho * negative_weight, and the loss still
    gives a cell the positive weight when its target is >= 0.5 and the negative weight
    otherwise. The returned dictionary keeps its keys: positive and negative stay
    the thresholded counts, positive_fraction holds the soft mean. Run 1''s diff is
    at outputs/autoresearch/targets-and-inputs/experiments/soft-prevalence-class-weights-20261012T164257Z-743f1d48/changes.diff:
    port it unchanged. Expected positive weights as in run 1: about 1.29 for Synovitis
    (from 2.16), 2.19 for Fracture (from 3.15), 2.55 for MCL (from 3.66), 1.21 for
    Effusion (from 1.38).'
