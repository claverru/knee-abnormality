    half the size of the block output it is added to (val_global_context_rms_ratio
    0.53 at epoch 1, 0.48 at epoch 8) while the L2-SP penalty read lower than the
    incumbent''s (0.0194 against 0.0221), stage four drifted less from the pretrained
    weights (0.0991 against 0.1090) and the training loss was lower (0.5752 against
    0.5780), with the x1 validation AUC level at that epoch. Evidence, medium, one
    run: the unanchored blocks move the backbone''s function further from the pretrained
    one than the anchor lets the weights move, the opposite of what L2-SP is in the
    recipe for (site generalisation), and a single fold cannot show the cost. Run
    22 showed the same pattern with squeeze-and-excitation gates. This seed keeps
    the block and pulls it toward doing nothing. Guess, low: -0.0005 to +0.0008 macro
    against the incumbent; the aim is the free run''s level with a much smaller added
    term.'
  mechanism: 'In modeling/model.py, after the ResNet backbone is created and before
    the RadImageNet weights are loaded, each of the thirteen bottlenecks of layer2,
