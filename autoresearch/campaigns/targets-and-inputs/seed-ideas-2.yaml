ideas:
- id: intensity-augmentation-off
  mechanism_id: intensity-augmentation
  parent_idea_id: null
  title: Train without the gamma and contrast augmentation
  opportunity: >-
    The intensity augmentation (probability 0.5, gamma 0.85 to 1.15, contrast 0.9 to 1.1) dates from
    the first recipes and was never removed alone on a RadImageNet backbone; the fixes-and-removals
    campaign queued the removal and never ran it. The recipe has since gained GIN, feature-statistics
    augmentation, smoothing, resolution and contrast mixing, which also vary intensity. Guess, low:
    -0.001 to +0.001 macro; a tie removes a mechanism.
  mechanism: >-
    In configs/training.yaml, data.intensity_augmentation.probability becomes 0 (it is 0.5). The
    gamma_range and contrast_range lines stay. Nothing else changes.
  precedents:
  - 'docs/validation/run-comparison-and-diagnostics.md#overnight-launcher, next queue: the entry this seed runs.'
  - 'prior-work.md, precedents: the augmentation campaign on ReXNet-200; contrast mixing off lost 0.0025 on the ResNet-18.'
  novelty: First removal of this family on a RadImageNet backbone.
  coverage: Half of the training images.
  exploitation: >-
    Read the macro at both multipliers and the x1 curve over the epochs against the incumbent's.
    Activation: the run's effective_config.json records the probability 0; this family logs no
    activity metric and none is added. Shown wrong by: the macro below the incumbent at both
    multipliers.
  budget: The reference's training time or slightly less.
  implementation: >-
    Follow the environment paragraph of the developer instructions. Configuration only: change that
    one value in configs/training.yaml; no source change. Check: the config loads through the config
    model.
  open_choices: None.
  dependencies: []
  priority_rationale: Free; never tested on this backbone.
