    \ window/slice diagnostics."
  budget: "Estimate 1,190\u20131,290 s versus 1,185 s for learned-centre-fit and 1,096\
    \ s for the reference. Soft weighting adds token reductions without extra images\
    \ or backbone passes. Keep ten epochs, batch eight and the existing slice total.\
    \ Cache shared geometry computations; block development if projected training\
    \ exceeds 1,369.496 s."
  implementation: 'Complete initial recipe: six 120 mm knee-anchored views, zero offsets,
