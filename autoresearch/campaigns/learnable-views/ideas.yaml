- id: learned-centre-fit
  mechanism_id: knee-centre
  parent_idea_id: knee-anchored-learned-offsets
  title: The knee centre fit with a learned weight per series type, used for window
    placement and slice selection
  opportunity: 'The user asked whether the model can learn the centre (2026-10-02).
    The centre differs per study, so it cannot be a parameter; what can be learned
    is the rule that computes it. Today''s rule trusts every plane equally. Where
    a study''s series disagree, a learned weight per series type lets the model decide
    whose stack centre marks the joint, from the same inputs the rule uses today.
    The design removes the two ways this could go wrong: the centre has no free offset,
    so it cannot take over a view''s preferred shift (that stays in the per-view offsets)
    and always stays inside what the study''s own series say; and slice selection,
    which also uses the centre, gives its own gradient, so it is not dragged without
    feedback.'
  mechanism: 'Views as in knee-anchored-learned-offsets: every view of the incumbent
    anchored on the knee centre on both axes, offsets learned from zero. The fit:
    today the centre is the weighted least-squares point closest to the centre lines
    of the study''s eligible series of the six series types (per knee in a bilateral
    study), each series weighted by one over the number of retained series of its
    plane (data/preprocessing/geometry.py: fit_center, estimate_reference). The loader
    keeps deciding, with those equal weights, whether the fit is accepted and which
    series are retained (the plain fit, or the robust refit that drops outliers);
    those decisions never depend on the learned weights. For a reference of method
    fit or robust, each retained series'' weight is multiplied by its type''s center_weight
    and the 3x3 system is solved again; a reference from the sagittal fallbacks, or
    none, is unchanged and gives no gradient. center_weight is a field of each series
    type, 1.0 in the recipe, and joins data.learn_views; the six weights are six times
    the softmax of six logits initialised at the log of the configured values, so
    the recipe''s values reproduce today''s centre exactly. Two computations of the
    same centre: the loader computes it in NumPy from the weights it receives through
    set_loader_state, and uses it wherever it uses the centre today (slice selection
    and the geometry it ships); the model computes it in torch from the retained series''
    lines, which the loader ships (centre point, unit normal, plane, series type),
    with gradient. Their values agree; only the model''s carries gradient. Window
    path: on a knee-anchored axis the model subtracts its own centre where the anatomical
    map now carries the loader''s, so the gradient of the image samples reaches the
    logits as it reaches the view values. Slice path: every selected slice carries
    its target depth from the loader''s centre along its plane''s patient axis and
    its pool''s support intervals from the same centre. The model takes delta, the
    component along that axis of its centre minus the loader''s (zero in value), shifts
    the depth and the intervals by minus delta, recomputes the reach and the standard
    deviation, and adds the log-density at the shifted values minus its detached value,
    zero in the forward pass. The density is the sampler''s own: target depths are
    drawn along the plane''s patient axis from a Gaussian centred on the knee centre,
    truncated to the pool''s support intervals, with standard deviation the width
    fraction times the pool''s reach, the reach being max(min(-lo, hi), 1 mm) over
    the support measured from the centre (data/preprocessing/sampling.py: target_depths,
    limiting_reach, interval_log_mass). The term is added to the slice''s existing
    pooling log-weight (slice_log_weight, the path the slice budget uses), for every
    selected slice of a physical pool; a local pool gets none. It is not a score-function
    estimator: the loss is never multiplied by the log-density. One centre: the medial
    and anterior positions of the meniscus mask, the OA detector regions and the half-knee
    loss are measured from the model''s centre too; their cut-offs stay hard, with
    the 10 mm band around the midline, so they follow the centre and give it no gradient.
    Validation and prediction use the checkpoint''s weights through loader_state.'
  precedents:
  - The knee centre of a study is the point closest to the centre lines of its series
    (each line runs through the middle of a stack along its normal), every plane weighted
    equally; over 4,230 accepted studies the lines disagree by 2.93 mm RMS at the
    median and 8.64 mm at the 95th percentile (docs/data-preparation/accurate-sampling-centers.md).
  - 'The slice budget is learned the same way: a per-slice log-weight that is zero
    in the forward pass, a shared array the loader reads each epoch, the checkpoint
    read at prediction (prior-work.md).'
  - 'smart-crops: five learned or attention placements per series ended within 0.0006
    of the rule. None started from the knee centre or was trained by the gradient
    through the resampling (smart-crops/view-effects-by-target.md).'
  - 'Reach: the weights can move the centre only within the disagreement of a study''s
    series, a few millimetres in most studies, so the expected effect is small; that
    it pays is a guess.'
  - 'Follow-up left to the researcher: soft cut-offs in the meniscus mask, the OA
    detector regions and the half-knee loss, so that the medial and lateral labels
    teach the left-right position of the centre; it changes three mechanisms of the
    recipe and is not part of this seed.'
  novelty: First learned centre rule; no earlier run changed how the knee centre is
    computed by gradient.
  coverage: 'Every study with an accepted fit (about 96%): the windows of every knee-anchored
    view and the slices selected in every series.'
  exploitation: 'Activation: at step 0 and in every validation, the largest distance
    between the model''s and the loader''s centre below 0.001 mm, and at step 0 the
    largest distance between the learned and today''s centre below 0.001 mm with the
    same slices selected as the incumbent; the six weights logged per epoch and at
    least one more than 0.05 from its start by epoch 3; non-zero gradient on the logits
    from the window path and from the slice path, logged separately at epoch 0. Log
    per epoch the mean and 95th percentile distance between the learned and today''s
    centre over the training studies, the mean shift of the selected slices along
    each plane''s axis, and the share of valid tokens whose side of the 10 mm midline
    band differs from today''s centre. Read against knee-anchored-learned-offsets
    (its control: the same views with today''s centre) and against the reference,
    on macro at x4 and x1.'
  budget: A 3x3 solve per study on top of the reference; estimate 1,050-1,200 s, inside
    822-1,370 s.
  implementation: 'config.py: center_weight in SeriesTypeConfig and in the literals
    of data.learn_views. data/dataset.py and data/preprocessing: the weighted fit
    in NumPy over the retained series, set_loader_state taking the weights, and the
    batch carrying per study (per knee) the retained lines and per slice the target
    depth and the pool''s intervals; the anatomical maps shipped so that the model
    can subtract its centre on a knee-anchored axis. modeling/views.py: the logits,
    as parameters of the view module so that they take optimizer.view_lr, no weight
    decay and stay outside gradient clipping like the other view values; modeling/model.py:
    the torch solve, the placement, the medial and anterior axes and the slice term
    from the model''s centre, and the weights returned by loader_state. training/lightning.py:
    the logging. Adds to the incumbent; with center_weight out of data.learn_views
    the logits take no gradient and the centre is today''s. If knee-anchored-learned-offsets
    was rejected, this idea carries its anchors as stated above.'
  open_choices: None on the mechanism (agreed with the user, 2026-10-02). The learning
    rate is optimizer.view_lr, as for the other view values.
