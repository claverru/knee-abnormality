  - 'hand-views-frozen-with-label-bias (this campaign): x4 0.933307, x1 0.9299; label-bias-off:
    -0.0017, 80% interval below zero.'
  novelty: First view selection driven by the label bias instead of the image-sample
    gradient, with the two slots of a type made complementary.
  coverage: Every coronal and sagittal series of every study.
  exploitation: 'Activation: uniform draw frequencies (each 0.15-0.25) in epochs 0
