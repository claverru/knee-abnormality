    epoch-to-epoch changes of the width beside its net change from start to end; the
    ratio is the wander. Read against the reference on that ratio first, then on macro
    at x4 and x1 and on where the views end.'
  budget: The reference's cost; estimate 1,050-1,150 s, inside 822-1,370 s.
  implementation: One option, optimizer.view_beta1 (0.9 in the incumbent's behaviour,
