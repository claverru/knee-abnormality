    mm (120 mm), 6 slices, both axes anchored on the image with offset 0, as in configs/hand-views.yaml.
    Coronal T1/PD, coronal fluid, sagittal T1/PD and sagittal fluid: two view slots
    each, slot 1 with 3 slices and slot 2 with 2 slices, both with the anchors and
    offsets of configs/hand-views.yaml for their type (coronal: horizontal anchor
