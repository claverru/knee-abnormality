- id: view-clipping-feasibility-gradient
  mechanism_id: view-feasibility-regularization
  parent_idea_id: null
  title: Teach view parameters when requested windows exceed available support
  opportunity: "Reference axial-fluid training clipping reaches 36.93% at epoch 9\
    \ while validation clipping is 2.39%; sagittal T1/PD training clipping reaches\
    \ 44.35% at epoch 2. Source clamps requested centres before sampling and detaches\
    \ the reported displacement. A clipped offset can therefore lose its image-path\
    \ derivative without receiving a signal about the infeasible request. This is\
    \ a source-based diagnosis; its contribution to the \xD71 gap is unmeasured."
  mechanism: "Add a differentiable feasibility penalty to learned window parameters\
    \ while preserving the executed sampling transform. In physical coordinates, let\
    \ c be the requested centre, h the window half-extent and [l,u] the available\
    \ support on each axis. Define v = relu(l+h\u2212c)+relu(c\u2212(u\u2212h)); this\
    \ also detects an oversized window centred inside the image. Add 0.01 times the\
    \ study/view-balanced mean of (v_horizontal\xB2+v_vertical\xB2)/64 to training.\
    \ Detach acquisition geometry, anchors and jitter so this term teaches only spacing\
    \ and offsets, including when the centre fit is learned. Preserve current clipping\
    \ and augmentation. Log violation, isolated parameter gradients and gradient delivery\
    \ on clipped axes. The hypothesis is that learning executable requests reduces\
    \ training/validation window mismatch without narrowing jitter globally."
  precedents:
  - "Reference per-epoch widths, clipping and \xD71 curves: /home/claudio/src/knee-abnormality/outputs/autoresearch/learnable-views/jobs/researcher-20261003T040709Z-f4894153/curves.json.\
    \ Late axial-fluid width is 135.450 mm; training clipping stays near 37\u2013\
    39% during epochs 7\u20139 while \xD71 plateaus near 0.9274."
  - Incumbent src/knee_abnormality/modeling/views.py clamps centres in window_transforms
    and detaches displacement for diagnostics. The proposed penalty uses the pre-clamp
    request and support margins.
  - view-optimizer-long-average retained final axial validation clipping of 0.9646/1.0.
    Constant narrower jitter failed adoption despite lower training loss. These precedents
    motivate changing the learning signal rather than another momentum or jitter-strength
    value.
  - "[Spatial Transformer Networks](https://arxiv.org/abs/1506.02025) establishes\
    \ differentiable spatial transformation. The feasibility penalty is a proposal\
    \ derived from this repository\u2019s clipping path, not a result claimed by that\
    \ paper."
  novelty: Adds support-aware supervision to window parameters where clipping can
    suppress image gradients. It retains full jitter on feasible windows and does
    not change anchors, support rectangles, clipping behavior or the admissible parameter
    range.
  coverage: Apply to every learned view with equal study/view weighting. All labels
    continue to share the fixed classification and auxiliary objectives. Frozen fields
    receive no update; allocation logits and centre-fit weights receive no penalty
    gradient.
  exploitation: Reuse geometry already computed for sampling. Start with the incumbent
    table and parameter values, preserving initial windows and slices. Existing clipping
    diagnostics provide a direct behavioral readout; isolated feasibility-gradient
    logs distinguish activation from a nonzero configured weight.
  budget: "Estimate 1,096\u20131,140 s at ten epochs. Adds small rectangle arithmetic\
    \ and diagnostic gradient probes, with no extra decoding, resampling or backbone\
    \ forward. Preserve the configured sum of 32 slices, each study\u2019s total,\
    \ batch size 8 and 224 px inputs. The measured supervisor budget check remains\
    \ decisive."
  implementation: Add the differentiable margin calculation in modeling/views.py and
    its training contribution and logs in training/lightning.py; declare optimizer.view_feasibility_weight=0.01
    through config.py and configs/training.yaml. Keep the current transform, parameter
    clamps, no-decay view group and clipping exclusion. Detach non-window owners from
    the penalty while retaining their ordinary classification gradients. Require a
    step-0 window/slice equivalence check, isolated feasibility gradients on clipped
    axes, and all existing movement, attention, token-only AUC, budget and clipping
    diagnostics. Rebase on any accepted incumbent and apply the same term to its learned
    windows, retaining unrelated improvements. Replace an overlapping feasibility
    penalty instead of stacking duplicate terms.
  open_choices: 'Use squared physical violations normalized by 8 mm and weight 0.01
    for this attempt. Geometry support is not anatomical relevance: the term could
    favor smaller windows or remove useful training variation. Lower clipping alone
