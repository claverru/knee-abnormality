    exact control, and against the reference, on macro at x4 and x1 and on PF OA,
    which rose in both earlier 3D runs; and on whether the centre weights move more
    than in learned-centre-fit.'
  budget: A small MLP in place of two embeddings; estimate 1,050-1,200 s, inside 822-1,370
