    quantities and label patterns. Centre fitting improved MCL by 0.0068 and lateral
    meniscus by 0.0058; spread learning improved PF OA by 0.0034 and Synovitis by
    0.0039 while sharply hurting MCL. Spread-only coronal sigma fractions contracted
    from 0.867 to 0.2406/0.3231. A fixed centre may let spread compensate for misplaced
    coverage; that explanation is unproven.
