  novelty: Adds an anatomical membership gradient to the fitted centre. Earlier centre
    runs learned through window samples, slice density and sometimes position encoding,
    while anatomical cut-offs remained hard.
  coverage: Applies to all trusted studies and the existing anatomical branches. Evaluation
    remains the fixed twelve-label macro objective; label movements motivate the mechanism
    without selecting labels for optimization.
  exploitation: "Preserves the strongest \xD71 near miss and tests whether direct\
    \ boundary derivatives reduce its medial-meniscus tradeoff. Log isolated boundary-to-centre\
