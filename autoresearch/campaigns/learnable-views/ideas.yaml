- id: knee-frame-3d-position-centre-long-average
  mechanism_id: knee-centre-optimizer
  parent_idea_id: knee-frame-3d-position
  title: The knee-frame-3d-position recipe with the centre weights stepped on a gradient
    averaged over about a hundred steps (beta1 0.99 for the centre logits alone)
  opportunity: 'Follow-up to the audit of knee-frame-3d-position (2026-10-02, requested
    by the user, who suspected the centre). Measured in that run and in learned-centre-fit:
    the six centre weights wander instead of converging. Their largest change per
    epoch follows the learning rate (0.155, 0.182, 0.074, 0.156, 0.092, 0.081, 0.073,
    0.049, 0.027, 0.006 over the ten epochs), a weight moves by up to 0.16 within
    one epoch and back in the next (sagittal T1/PD 1.085 to 0.930 during epoch 4),
    and the two runs agree on one weight only (axial fluid falls in both, to 0.81
    and to 0.50-0.60) and disagree in sign on the others. An epoch of 437 steps at
    the rate in force could move a logit by about 2.6 if its gradient were consistent;
    the weights move by about 0.15, so the steps are mostly noise. The centre itself
    stays within 0.3-0.5 mm of the computed one on average (p95 0.8-1.1 mm; up to
    0.75 and 1.9 mm in learned-centre-fit), so the audit found no sign that the centre
    moved too much or caused the loss of the epoch-3 lead, which runs without a learned
    centre show too. What it found is a learned quantity that does not settle: the
    window path gives about 98% of its gradient norm (0.016-0.026, against 0.0004-0.0006
    from the position path and 0.0003-0.0004 from the slice path), and that gradient
    changes sign from batch to batch. AdamW divides each step by the gradient''s own
    size, so a noisy gradient still moves a value by about 0.23 of the rate at beta1
    0.9. Averaging over about a hundred steps cuts the noise-driven step to about
    0.07 of the rate and leaves a consistent gradient, like the one on axial fluid,
    its full step.'
  mechanism: 'The complete recipe of knee-frame-3d-position (every view anchored on
    the knee centre on both axes with learned offsets; the centre fit with a learned
    weight per series type; one 3D position per token from the learned centre in place
    of position_1d and position_2d) with one change: the centre logits form their
    own optimizer group with beta1 0.99 in place of 0.9. Their rate (optimizer.view_lr),
    beta2, schedule, absence of weight decay and exclusion from gradient clipping
    are unchanged, and so is every other group, the view spacings and offsets included.
    Nothing else changes: the loader still receives the weights once per epoch.'
