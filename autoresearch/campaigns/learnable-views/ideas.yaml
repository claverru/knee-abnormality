- id: learned-axis-specific-window-spacing
  mechanism_id: anisotropic-view-geometry
  parent_idea_id: null
  title: Let each learned window change its horizontal and vertical extent independently
  opportunity: "The incumbent uses one spacing scalar for both axes. In the dense-allocation\
    \ run, axial-fluid width ended at 133.007 mm with a 10.423 mm vertical shift,\
    \ and validation clipping stayed at 1.0 during epochs 3\u20139. A square window\
    \ couples the extent needed on one axis to support saturation on the other. Hypothesis:\
    \ learning aspect ratio can retain useful context while reducing an unnecessary\
    \ extent. The queued feasibility penalty teaches existing square-window parameters;\
    \ this proposal adds a different geometric degree of freedom."
  mechanism: "Retain each incumbent view\u2019s learned mean log spacing m and add\
    \ a zero-initialized aspect coordinate a, with horizontal/vertical spacings exp(m+a)\
    \ and exp(m\u2212a). At a=0, windows and the original mean-spacing derivative\
    \ match the incumbent. Project the two effective spacings into the existing 0.3125\u2013\
    0.625 mm range, then reconstruct m and a; keep offsets and jitter unchanged. Compute\
    \ clipping and window origins per axis. Extend the matched low-pass to directional\
    \ footprints from the resampling transform, preserving its square-window limit.\
    \ Keep the existing geometric-mean scale embedding and detached token geometry.\
    \ Aspect receives gradient only through image samples. Log both physical extents,\
    \ aspect gradients, per-axis clipping and actual transform changes caused by aspect\
    \ updates, in addition to existing diagnostics."
  precedents:
  - 'Incumbent source: /home/claudio/src/knee-abnormality/outputs/autoresearch/learnable-views/baseline/source/src/knee_abnormality/modeling/views.py.
