- id: hand-views-bias-metric-and-width-learning
  mechanism_id: label-bias-rate
  parent_idea_id: hand-views-label-bias-faster-rate
  title: Couple width learning with attention-metric updates of label bias
  opportunity: "Tenfold bias learning produced only +0.000082 at \xD74, with 80% [\u2212\
    0.000417,+0.000557], despite maximum bias growing to 0.9104. Selected \xD71 improved\
    \ to 0.930115. Final mean view attention ranged from 0.0170 to 0.2730, so one\
    \ scalar rate acts on markedly different routing sensitivities. Test a curvature-aware\
    \ bias update while allowing widths to learn from the hand start, retaining fixed\
    \ placement and allocation."
  mechanism: "Complete recipe: retain the incumbent's six anchors, offsets, fixed\
    \ budgets, zero budget shift and narrow jitter; set data.learn_views to [spacing_mm],\
    \ starting at its exact widths. Widths use the existing 0.006 image-gradient optimizer\
    \ and bounds. Replace Adam updates of the static label-bias table with a damped\
    \ attention-metric step. For each label, collapse actual post-mask token attention\
    \ into bias-row masses p and average F=diag(p)\u2212pp\u1D40 across studies. Project\
    \ out the common-offset direction and solve the damped system for the ordinary\
    \ unchanged loss gradient. Use damping 0.001, base step coefficient 0.006 and\
    \ the existing warm-up/cosine factor; cap the predicted attention KL at 0.0001\
    \ per label. This is an attention-distribution metric, not the predictive Bernoulli\
    \ Fisher. Widths own geometry; the metric step owns static routing updates."
  precedents:
  - "hand-views-label-bias-faster-rate-20261003T181658Z-2a016806: \xD74 \u0394 +0.000082,\
    \ 80% [\u22120.000417,+0.000557]; selected/last \xD71 0.930115/0.930023; training\
    \ 1,006.4 s. Source: /home/claudio/src/knee-abnormality/outputs/autoresearch/learnable-views/experiments/hand-views-label-bias-faster-rate-20261003T181658Z-2a016806/source."
  - "start-from-hand-recipe-20261003T014857Z-c4c992ab activated width learning but\
    \ lost the hand recipe's \xD71 advantage. It also learned offsets and allocation\
    \ with wider jitter, so it is not a width-only control. Source: /home/claudio/src/knee-abnormality/outputs/autoresearch/learnable-views/experiments/start-from-hand-recipe-20261003T014857Z-c4c992ab/source."
  - '[Martens, New Insights and Perspectives on the Natural Gradient Method](https://www.jmlr.org/papers/v21/17-678.html)
    motivates curvature metrics, damping and trust regions. Applying an attention
    metric here is a hypothesis, not a reported result.'
  novelty: A structural retry of uniform bias acceleration, combined with genuine
    width learning. Coupled view sensitivities determine the update direction, rather
    than another scalar learning-rate choice. Frozen offsets and allocation limit
    competing motion.
  coverage: Use every label and every currently active bias row, with existing anatomical
