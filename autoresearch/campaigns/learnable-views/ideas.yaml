- id: view-size-menu-bias-guided
  mechanism_id: view-size-menu
  parent_idea_id: view-size-menu-uniform
  title: The view-size menu with each slot's draws following its label bias after
    a uniform start, the two slots of a type following the labels each already serves
  opportunity: 'User seed relayed from the view-building session, 2026-10-03, the
    user''s preferred form: a candidate in one run. As view-size-menu-uniform, but
    the draw probability of a size follows its label bias, so training concentrates
    on the sizes the labels use and the backbone specialises on them. Labels disagree
    on size (on the hand views fracture, synovitis, contusion and effusion were ahead;
    Baker''s cyst and PF OA behind), so a plain sum over labels would settle on a
    compromise; the two slots of a type should end up serving different labels. Guards
    against early lock-in and self-reinforcement are part of the idea: uniform draws
    first, a gradual hand-over, and a minimum probability for every size so that a
    dropped size can return.'
  mechanism: 'The complete recipe of view-size-menu-uniform (axial at 120 mm with
    one view; two slots of 3 and 2 slices on every coronal and sagittal type with
    the hand anchors and offsets; the menu 70, 84, 93.33, 105, 120 mm; a label-bias
    row per slot and size; no width, shift or slice count learned by gradient; jitter
    4 mm and 0.95-1.05) with one change: the draw probabilities. They are recomputed
    once at the start of every epoch and held for the epoch. For a slot k of a type,
    the weight of a label is the slot''s share of that type''s attention for the label
    over the previous epoch, share_k(label) / (share_1(label) + share_2(label)), from
    the attention mass already logged per view and label (0.5 for both slots while
    no epoch has run): each slot follows the labels it already serves, which are the
    ones the other slot serves least. The score of a size in slot k is the sum over
    labels of that weight times the bias of (slot k, size, label). The scores of the
    five sizes of a slot are standardised (mean 0, standard deviation 1 across the
    five; all zero when they are equal) and passed through a softmax; the bias-following
    distribution is 0.05 for every size plus 0.75 times that softmax, so no size ever
    falls below 0.05. The draw distribution is (1 - h) times uniform plus h times
    the bias-following distribution, with h = 0 in epochs 0 to 2, 1/3 in epoch 3,
    2/3 in epoch 4 and 1 from epoch 5 on. Draws stay independent per slot and step,
    from a forked generator. Validation and prediction are deterministic: each slot
    uses the size with the largest draw probability of that checkpoint, with the tie
    rule of view-size-menu-uniform; the probabilities and the chosen sizes are saved
    with the checkpoint. Nothing is added to the loss.'
  precedents:
  - view-size-menu-uniform (this campaign, forced just before this idea) is this recipe
    with uniform draws throughout; take its implementation from its frozen source
    under outputs/autoresearch/learnable-views/experiments once it has run, and add
