- id: views-learned-on-held-out-studies
  mechanism_id: view-objective
  parent_idea_id: null
  title: The view values learned on a tenth of the training studies that the weights
    never train on
  opportunity: 'The view values are trained on the training loss, together with the
    weights. That moves them towards what makes the training studies easier to fit,
    not towards what generalises, as with any setting of the input learned on the
    data it shapes. The frozen run agrees: the views the model learned are worth no
    more than the centre crop they started from. Updating the views only from studies
    the weights have not seen gives them the signal they lack: whether a view helps
    on new studies.'
  mechanism: 'The training studies of the fold are split once, by a hash of the study
    UID independent of the run seed: one tenth are view studies, the rest weight studies.
    The validation fold is untouched. The training loader, its batches and its epoch
    are the incumbent''s: every training study is visited once per epoch, so the harness''s
    cohort and visit accounting are unchanged. Inside each step the gradient is routed
    per study. The loss terms of the weight studies of the batch update the weights
    (backbone, heads, label bias, every parameter that is not a learned view field)
    and give nothing to the learned view fields: their windows and slice weights use
    the view values detached. The loss terms of the view studies of the batch update
    only the learned view fields of data.learn_views (spacing, offsets, slice budget),
    through a second backward pass that takes the gradient with respect to those fields
    alone, and give nothing to the weights. Each loss is averaged over its own studies.
    A batch without view studies gives the view fields no gradient at that step. First-order:
    no gradient through the weight update. Batch-norm statistics still see every study
    of the batch. Everything else as in the incumbent.'
  precedents:
  - 'frozen-learned-views-run4: the reference''s final views frozen from the start
    score 0.930609 at x4, -0.0019 against the reference and level with the plain 120
    mm centre crop (0.930666); the hand views frozen on the same build score 0.932627
