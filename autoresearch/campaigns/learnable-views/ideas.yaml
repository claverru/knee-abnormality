- id: hand-views-label-depth-bias
  mechanism_id: label-depth-bias
  parent_idea_id: hand-views-frozen-with-label-bias
  title: A label bias per view and slice depth beside the label bias per view
  opportunity: 'Campaign keeper''s seed, queued at the user''s request, 2026-10-03;
    a user exception to the frozen-view exclusion. The per-view label bias is the
    only learned quantity that paid in this campaign (label-bias-off -0.0017 with
    the 80% interval below zero in the learned recipe; +0.0004 to +0.0007 on the hand
    views), and it paid although the tokens already carry the view''s plane and contrast:
    a direct, zero-initialised prior on the attention was easier to learn than a content-based
    one. Labels also differ in which slices of a stack matter (the ACL on central
    sagittal slices, the menisci and the collateral ligaments towards the sides, Baker''s
    cyst on posterior coronal slices), and the same shortcut may help there. Against
    it: the 3D-position runs showed that giving the tokens more position information
    adds nothing. Guess, low to medium confidence.'
  mechanism: 'The incumbent with one addition: model.view_label_depth_bias, one learned
    attention offset per view, depth bin and label (6 views by 5 bins by 12 labels),
    zero-initialised, added to the attention score of every token of a slice beside
    the per-view label bias. A slice''s bin comes from its target depth from the knee
    centre along its stack axis, divided by the pool''s reach, with bin edges at the
    20th, 40th, 60th and 80th percentiles of the sampling law (the Gaussian of data.sampling_sigma_fraction
    truncated to the support), so that the five bins hold equal shares of slices.
    The depth is signed: superior positive on axial stacks, anterior positive on coronal
    stacks, medial positive on sagittal stacks using the study''s side; a sagittal
    slice of a study whose side is unknown takes the mean of the two mirrored bins.
    A slice from a pool without a physical depth takes no depth bias. It trains in
    the optimizer group of view_label_bias (head rate, no weight decay). At step 0
    the outputs equal the incumbent''s. Validation and prediction apply the same rule
    at x1 and x4.'
