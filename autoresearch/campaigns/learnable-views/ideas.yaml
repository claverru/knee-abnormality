- id: learned-centre-soft-boundaries
  mechanism_id: knee-centre
  parent_idea_id: learned-centre-fit
  title: Teach the learned centre through smooth anatomical boundaries
  opportunity: "Learned-centre-fit improved selected \xD71 AUC by 0.001387 and \xD7\
    4 by 0.000616, but its 80% interval crossed zero. The centre moved: final mean\
    \ displacement was 0.6953 mm, while only 0.55% of tokens changed hard midline-band\
    \ membership. Window gradients dominated slice gradients. Hard anatomical membership\
    \ supplies no boundary derivative, so the centre still lacks the user's proposed\
    \ direct anatomical teaching path."
  mechanism: Reuse the complete learned-centre recipe, retaining 1D/2D positions.
    Replace hard anatomical membership with normalized sigmoid weights using a fixed
    2 mm transition. Meniscus eligibility uses sigmoid((signed medial distance + 10)/2);
    medial/lateral OA regions use sigmoid((signed medial distance - 10)/2), and PF
    uses sigmoid(anterior distance/2). Use corresponding soft memberships in the existing
    half-knee aggregation without changing targets, loss definitions or weights. Differentiate
    these distances through the same fitted centre used by windows and slice selection.
    Retain trusted-geometry gating and existing fallbacks. No free centre offset,
    hard centre bound or new label objective.
  precedents:
  - "learned-centre-fit: \xD74 \u0394 +0.000616, 80% interval [-0.000466, 0.001745];\
