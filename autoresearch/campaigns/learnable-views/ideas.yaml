- id: knee-frame-3d-position
  mechanism_id: knee-frame-position
  parent_idea_id: learned-centre-fit
  title: One side-normalized 3D position per token, measured from the learned knee
    centre, in place of the 1D and 2D position embeddings
  opportunity: 'The user asked to retake the 3D position encoding now that the centre
    is learned (2026-10-02). Today a token carries its slice''s position along its
    own stack (1D) and its position in the canvas (2D): neither says where the token
    is in the knee, and neither is comparable between planes or between studies whose
    joint sits elsewhere in the image. Earlier 3D encodings measured from the computed
    centre were worth about zero. With learned-centre-fit the centre becomes a quantity
    the model can move, and a position measured from it gives the centre a gradient
    from every token of every label, a far denser signal than window placement; in
    return the centre makes the positions one frame shared by the three planes and
    by all studies.'
  mechanism: 'The complete recipe of learned-centre-fit (every view anchored on the
    knee centre on both axes with learned offsets; the centre fit with a learned weight
    per series type; one centre for window placement, slice selection and the medial,
    lateral and anterior axes), with one change: position_1d and position_2d are removed
    and every token takes one 3D position q in mm from the model''s centre: q_x is
    today''s medial_axis (side times the token''s patient x minus the centre''s),
    q_y today''s anterior_axis with its sign, and q_z the token''s patient z minus
    the centre''s, built from the third row of the same patient map; all three from
    the model''s centre with gradient, so the positions teach the centre weights.
    The encoder is the earlier run''s: sine and cosine of each coordinate at seven
    wavelengths from 8 to 512 mm (42 features), linear 42 to 64, GELU, linear 64 to
    256, added to the token (outputs/autoresearch/near-misses/experiments/side-normalized-3d-position-20260924T230919Z-02c6579a/source,
    modeling/spatial_tokens.py). Branches as there: a token whose geometry is trusted
    and whose side is known (today''s located tokens) takes the full encoding; with
    trusted geometry and unknown side, y and z are encoded and a learned vector replaces
    the x features; with untrusted geometry or a study without an accepted fit, a
    learned unknown-position vector. Under reflection q is unchanged, as medial_axis
    is today. The scale embedding of the view stays.'
  precedents:
  - 'near-misses #6, side-normalized 3D position in place of 1D and 2D, computed centre,
    ReXNet recipe: +0.0008 hard, -0.0006 soft, PF OA +0.0061; rejected (docs/validation/results/campaigns-and-queues/2026-09-25-near-misses-campaign.md;
    mechanism in autoresearch/campaigns/near-misses/seed-ideas-2.yaml, whose branches
    and fallbacks this seed keeps).'
  - 'near-misses #13, the same with each slice''s normal added: -0.0017 hard, +0.0011
    soft, PF OA +0.0156.'
  - The September champion's additive 3D embedding on raw centred coordinates was
    worth about zero and was removed (S21, same public score without it); a 3D rotary
    encoding inside a token-attention block lost -0.0015 with the attention change
    confounded.
  - All three used the computed centre as a fixed input. None let the position teach
    the centre.
  - In this build position_2d is measured in the canvas frame, so with knee-anchored
    views the same anatomical place has different codes in studies whose joint is
    off the image centre.
  novelty: First position encoding measured from a learned centre and giving it gradient.
  coverage: Every token of every study; the full branch for studies with an accepted
    fit and a known side.
  exploitation: 'Activation: the share of tokens on the full, unknown-side and unknown-position
    branches logged per epoch, with the full branch above 0.9; non-zero gradient on
    the centre weights from the position path, logged apart from the window and slice
