- id: slice-budget-all-token-density
  mechanism_id: slice-budget
  parent_idea_id: views-only-fixed-budget
  title: Teach slice allocation through every sampled slice
  opportunity: "The fixed-budget ablation was rejected at \xD74 \u0394 -0.000547 and\
    \ essentially tied selected \xD71. In the reference, axial T1/PD still receives\
    \ 5.7901 configured-budget units despite final token-only macro AUC 0.5541 and\
    \ mean validation attention 0.0177. Source inspection shows that only one marked\
    \ slice per view carries allocation gradient. Weak allocation movement is measured;\
    \ excessive estimator variance is a hypothesis."
  mechanism: Retain learned present-view softmax shares and the existing count exploration.
    Replace the single-marked-slice surrogate with log(p_view) minus its detached
    value on every sampled slice, where p is normalized over the study's present views.
    The forward pooling weights remain identical; all observed evidence supplies the
    allocation derivative. This is a pooling log-density derivative, never loss multiplied
    by log-density. Preserve exact totals with constrained rounding that redistributes
    any minimum-count deficit from donor views rather than adding slices after rounding.
