- id: hand-views-routed-shift-learning
  mechanism_id: hand-views-label-bias
  parent_idea_id: hand-views-frozen-with-label-bias
  title: Couple learned hand-view shifts with study-dependent label routing
  opportunity: "The live incumbent reaches \xD71 0.929876. Learned shifts activated\
    \ but finished at 0.928633, with exploratory gains for lateral meniscus and synovitis.\
    \ Earlier evidence-conditioned routing reached 0.930065, but required a paired\
    \ sagittal view. Combine placement learning with routing that can act across the\
    \ incumbent's single views. The hypothesis is that study-dependent routing can\
    \ accommodate changing windows better than a fixed population bias."
  mechanism: "Complete recipe: retain the incumbent's six hand widths, anchors, starting\
    \ offsets, fixed 6/6/5/5/5/5 budgets, zero budget shift and 4 mm/\xB15% jitter;\
    \ set data.learn_views to [offset_mm]. Retain static label bias. Add a zero-initialized\
    \ shared linear label map of view-token means minus the equal-view study mean.\
    \ Compute each label's summaries using its existing allowed-token mask and present\
    \ views; a single eligible view receives zero residual. Add the resulting study/view/label\
    \ residual before the existing attention softmax. Unlike the donor's within-type\
    \ centering, study centering activates with one view per type. Offsets receive\
    \ image-path gradients through the resulting routing; positions and validity remain\
    \ detached. Static bias owns population preferences, the residual owns study variation,\
    \ and offsets own placement."
