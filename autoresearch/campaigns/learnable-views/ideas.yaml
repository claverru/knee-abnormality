    93 mm; sagittal T1/PD 119, 134, 138, 132, 126, 122, 122, 121, 122, 122 mm; sagittal
    fluid 116, 108, 108, 104, 103, 103, 110, 112, 112, 112 mm. End widths differ by
    up to 38 mm on one view between the three learned runs of the build (prior-work.md).'
