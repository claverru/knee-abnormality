- id: learned-slice-spread
  mechanism_id: slice-spread
  parent_idea_id: null
  title: The spread of each view's slices along the stack learned per view from 0.867
  opportunity: 'Slices are drawn from a truncated Gaussian along the stack whose width
    is one global number, data.sampling_sigma_fraction 0.867 of the pool''s reach.
    Labels keep their evidence at different depths: Baker''s cyst has 80% of its coronal
    fluid evidence beyond 20 mm from the centre, the lateral meniscus 74% of its sagittal
    fluid evidence, and the sampler picks slices beyond 40 mm half as often as its
    supply. One global width cannot serve a type that needs the edges and one that
    needs the joint line. A width per view, learned, lets each view settle its own,
    and with two views on a type one can stay tight and the other spread. The run
    also tests the per-slice estimator that learned-centre-fit uses for the centre.'
  mechanism: 'Each view of the incumbent''s data.series_types has a sigma_fraction,
    0.867 in the recipe, in place of data.sampling_sigma_fraction, and sigma_fraction
    joins data.learn_views. The model holds one log-fraction per view, initialised
    at the log of the configured value. The fractions reach the loader through loader_state
    each epoch; a view''s target depths are drawn as today at its fraction. Every
    selected slice carries its target depth from the centre and its pool''s support
    intervals; the model computes the reach and the standard deviation at its view''s
    fraction and adds the log-density of the target depth minus its detached value,
    zero in the forward pass, so slices that help far from the centre widen the view''s
    spread and slices that help near it narrow it. The density is the sampler''s own:
    target depths are drawn along the plane''s patient axis from a Gaussian centred
