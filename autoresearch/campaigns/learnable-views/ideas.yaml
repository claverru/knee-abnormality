- id: two-views-sagittal-fluid
  mechanism_id: two-views-per-type
  parent_idea_id: null
  title: 'Two learned views on sagittal fluid: the 120 mm centre crop and a 93 mm
    one, sharing the type''s five slices'
  opportunity: 'The user asked for two views on one series type as a direction of
    this campaign (2026-10-02). Sagittal fluid is the type where one width cannot
    serve every label: zoomed to 93 mm it helps ACL, PF OA and the lateral meniscus
    and costs Baker''s cyst and MCL, and no single width was a compromise. With one
    view per type the gradient has to settle one width for all twelve labels; in the
    reference sagittal fluid ended at 112 mm. Two views let it keep a wide and a narrow
    one, the label bias send each label to the view it reads best, and the learned
    budget decide how many slices each view gets, at the reference''s cost.'
  mechanism: 'data.series_types, sagittal fluid: two views in place of one. First
    view: spacing 0.5357 mm (120 mm), 3 slices, both axes anchored on the image with
    offset 0, the incumbent''s start. Second view: spacing 0.4167 mm (93.33 mm), 2
    slices, both axes anchored on the image with offset 0. Each view selects its own
    slices of the series and has its own spacing, offsets, label-bias row, scale embedding
    and budget logit, all learned as in the incumbent (data.learn_views unchanged).
    The type keeps five slices at the start and the study keeps its total. The other
    five types are unchanged.'
