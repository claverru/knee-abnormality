- id: knee-anchored-learned-offsets
  mechanism_id: knee-centre
  parent_idea_id: null
  title: Every view anchored on the study's knee centre on both axes, with the offsets
    learned from zero
  opportunity: 'The recipe places every window on the image centre and learns one
    shift per view, the same for every study. The hand recipe gained from placing
    coronal and sagittal windows on each study''s fitted knee centre, which the learned
    runs from the centre crop cannot reach: a shared shift cannot follow a joint that
    sits elsewhere in each study. Anchoring on the knee centre gives the per-study
    part for free and leaves the learned offset to say where each view prefers to
    look relative to the joint. It is also the control for learned-centre-fit.'
  mechanism: 'Every view of the incumbent''s data.series_types takes horizontal {anchor:
    knee, offset_mm: 0.0} and vertical {anchor: knee, offset_mm: 0.0}; its spacing_mm
    and slices stay the incumbent''s. data.learn_views unchanged, so the spacing,
    both offsets from the knee centre and the slices are learned. A series without
    trusted geometry falls back to the image centre, per series, as the build does.
    One window position per series, taken at the series'' middle record, as the build
    does. Nothing else changes.'
  precedents:
