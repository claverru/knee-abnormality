    \ Source: /home/claudio/src/knee-abnormality/outputs/autoresearch/learnable-views/experiments/sagittal-fluid-evidence-conditioned-routing-20261003T042713Z-47715dc0/source.\
    \ modeling/model.py:409 centers within type and therefore produces zero residual\
    \ for single-view types."
