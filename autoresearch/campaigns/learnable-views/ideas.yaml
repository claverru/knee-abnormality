- id: view-optimizer-long-average
  mechanism_id: view-optimizer
  parent_idea_id: null
  title: The view values stepped on a gradient averaged over about a hundred steps
    (beta1 0.99 for their group)
  opportunity: 'The view values are stepped by AdamW with the same averaging as the
    weights, about ten steps. AdamW divides each step by the gradient''s own size,
    so a gradient that is mostly noise still moves a value by a sizeable step: with
    independent noise the expected step is about 0.23 of the learning rate at beta1
    0.9. The views behave that way: they wander by several millimetres from epoch
    to epoch until the schedule decays, and end elsewhere in each run. Averaging over
    about a hundred steps cuts the noise-driven step to about 0.07 of the rate and
    leaves a consistent gradient its full step.'
  mechanism: The optimizer group of the view parameters (the view module's spacing,
    shift and any other view value in that group) takes beta1 0.99 in place of 0.9;
    beta2, the rate, the schedule and the absence of weight decay are unchanged, and
    so is every other group. Nothing else changes.
  precedents:
