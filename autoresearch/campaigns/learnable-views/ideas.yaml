    (7 mm anterior on sagittal series), adopted at +0.0022 over the 120 mm centre
    crop, 0.950 public; sagittal windows centred instead of 7 mm forward: -0.0002,
    PF OA and lateral OA fall back (smart-crops/view-effects-by-target.md).'
