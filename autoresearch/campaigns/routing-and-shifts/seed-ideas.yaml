ideas:
- id: learned-shift-per-series-type
  mechanism_id: learned-crop-shift
  parent_idea_id: null
  title: Cut every view inside the model from a canvas with a margin and learn one shift per
    view of each series type, with the crop's size fixed
  opportunity: >-
    A guess, on a known mechanism. The views are placed by hand: coronal and sagittal crops of
    84 and 93.33 mm anchored on the fitted knee centre with offsets of 7 and 10 mm
    (configs/training.yaml, data.series_types). The learnable-views campaign learned such
    offsets on the old recipe; with the sizes pinned (hand-sizes-learned-shifts) the run
    scored -0.0004 against its reference, and over 24 runs the shifts ended within 2.5 mm of
    their start, 3 to 7 mm apart between runs (prior-work.md, Topic 2). That model read every
    token everywhere. This one reads each target from a region of a per-knee frame, so where a
    crop sits decides which tokens fall in which region. This seed is also the port every
    later shift seed builds on.
  mechanism: >-
    Today prepare_images (data/preprocessing/device.py) resamples each slice's view window to
    224 px, normalises each series between two quantiles of its windows' valid pixels, rounds
    to uint8, and the model applies the affine augmentation. Change, in this order. (1) Canvas:
    each view window is prepared with a margin of M pixels on every side at the view's own
    pixel spacing, M = round(data.view_shift_limit_mm / pixel spacing) with
    data.view_shift_limit_mm = 15.0 (40 px at 84 mm, 36 px at 93.33 mm); 120 mm views keep M =
    0 and a zero shift. The window's own position is computed exactly as today (view_position
    in data/preprocessing/spatial.py, with its clipping to the 120 mm window and the acquired
    image); the margin around it is not clipped, and canvas pixels outside the acquired image
    are zero and outside the valid rectangle. prepare_images returns the canvases as float,
    not normalised, with their valid rectangles. (2) Cut: in the model, before any augmentation, each image's 224 px
    crop is taken from its canvas with affine_grid and grid_sample (bilinear, align_corners
    False, zero padding) at the canvas centre plus that view's shift; the valid rectangle and
    the patient maps (batch patient_maps) are translated by the same shift. (3) Normalisation
    moves after the cut: the same quantile levels, over the valid pixels of the series' cut
    crops, bounds detached, then the same scaling with the rounding made straight-through (x +
    (round(x) - x).detach()). (4) The affine augmentation, the reflection and everything after
    run unchanged on the cut crop. (5) One parameter view_shift[type, view, 2], zero at the
    start, gives the shift in millimetres along the image's rows and columns as limit *
    tanh(view_shift / limit) with limit = M * pixel spacing; it is trained by the target loss
    through the sampling grid at the head learning rate. Nothing else changes.
  precedents:
  - 'Learnable-views run hand-sizes-learned-shifts (sizes pinned, shifts learned, old recipe, fold 0): 0.932905, -0.0004, 80% interval [-0.0014, +0.0005]; frozen source and changes.diff under outputs/autoresearch/learnable-views/experiments/hand-sizes-learned-shifts-20261003T183532Z-8d11d7a5/.'
  - 'autoresearch/campaigns/learnable-views/build-notes.md: shifts within 2.5 mm of the start and 3 to 7 mm apart between runs; the open question on the affine augmentation hiding the signal.'
  - 'docs/ongoing/side-routed-heads.md, run 24: regions are read in a frame centred per knee on the meniscus spots.'
  novelty: First learned view placement on the routed model.
  coverage: Every coronal and sagittal view of every study, in training and at inference; axial 120 mm views keep a zero shift.
  exploitation: >-
    Read both multipliers against the incumbent, PF OA, Synovitis and Effusion first (the
    front targets, whose tokens sit at the crops' edge), and the logged shifts per epoch.
    Shown wrong by: shifts that stay within 2 mm of zero, or that keep moving in the last
    three epochs without settling.
  budget: >-
    Same slices decoded. A canvas of 304 or 296 px in place of 224 px is resampled per image
    (1.75 to 1.84 times the pixels in prepare_images) and one grid_sample per image is added.
    Expected within 1.3 times the reference; the run reports its training and prediction time.
  implementation: >-
    Reuse, do not rewrite: the branch view-optimisation (commit b290da6) has the in-model
    cutter in src/knee_abnormality/modeling/views.py (sample_windows, normalise_windows,
    ViewWindows with a clamped two-axis shift per view) and the experiment above is that code
    with the sizes pinned; read them with `git show view-optimisation:PATH` and from the
    experiment's source directory. Take the grid construction, the shift parameter, the
    normalisation after the cut and the logging; do not take its single global canvas at its
    own spacing, its bicubic reads, its learned width, label bias or slice budget. Files:
    data/preprocessing (the view window, resample plan and valid rectangle with the margin;
    prepare_images returning float canvases), data/dataset.py, modeling (the cutter, called at
    the start of the model's image encoding), config.py and configs/training.yaml (the one key
    data.view_shift_limit_mm), inference/engine.py (same cut, no augmentation),
    training/lightning.py (log view_shift_<type>_<view>_<axis>_mm per epoch). view_shift is
    created under torch.random.fork_rng. Required check, reported with its number: with
    view_shift at zero and the model in training and in evaluation mode, the crops entering
    the augmentation equal the incumbent's prepared images on one batch, largest absolute
    difference at most 1 grey level of 255. Then the guardrail check.
  open_choices: None.
  dependencies: []
  priority_rationale: The per-series seed the user asked for, and the port the per-study seeds reuse.
- id: menisci-read-their-whole-side
  mechanism_id: region-table
  parent_idea_id: null
  title: Give each meniscus target its whole half of the knee, at every height and radius,
    as in the early builds
  opportunity: >-
    Evidence-backed. Medial Meniscus is one of three targets whose spread across the routed
    runs exceeds its noise (1.8 sibling SDs; prior-work.md, What separates the runs). It
    scored 0.9457 to 0.9466 in runs 1 to 5 and 22, where each meniscus read its whole side,
    and 0.9433 to 0.9443 in runs 24 to 29, where it reads three sectors of its side below the
    upper cut with half of the core (old recipe 0.9469; sibling SD 0.0007). The incumbent's
    region leaves out the anterior and posterior 45-degree sectors, where the horns reach the
    midline, and everything above the upper cut. Leaving evidence out has cost in every run
    that did it (18, 19, 30).
  mechanism: >-
    In KneeAbnormalityModel._regions (modeling/model.py) the stacked table's first two rows,
    the routes meniscus_medial and meniscus_lateral, become medial_side and lateral_side: the
    existing medial_side = inside(medial, half[..., 0]) and lateral_side = 1 - medial_side,
    with no sector, ring, core or height factor. Rows three and four (oa_medial, oa_lateral)
    keep today's medial_compartment and lateral_compartment, and every other row, the frame
    and its four sizes are unchanged. The routed meniscus report questions (QUESTION_ROUTES
    entries on meniscus_medial and meniscus_lateral) follow the wider region; the six
    tear-place targets keep their own routes.
  precedents:
  - 'docs/ongoing/side-routed-heads.md, The runs sorted: Medial Meniscus 0.9457 to 0.9466 in runs 1 to 5 and 22, 0.9443 in run 24.'
  - 'Runs 18, 19 and 30: tight region tables at -0.0019, -0.0016 and -0.0015.'
  novelty: The whole-side meniscus region has not been run on the spot frame with rings and sectors.
  coverage: The two meniscus targets and the routed meniscus report questions, every study.
  exploitation: >-
    Read Medial Meniscus and Lateral Meniscus against the incumbent with their sibling SDs
    (0.0007 and 0.0024), then both multipliers. Shown wrong by: Medial Meniscus not above
    0.9450.
  budget: Same cost as the incumbent.
  implementation: >-
    modeling/model.py, _regions: replace the first two entries of the returned stack; the
    variable medial_compartment stays for rows three and four. The frame's meniscus spots are
    read over the fitted halves in study_frames, not over the routes, so they do not depend on
    this change. Update SPATIAL_TOKEN_IDENTITY. Run the guardrail check: the meniscus pair must
    not overlap.
  open_choices: None.
  dependencies: []
  priority_rationale: The one routing change with a per-target record beyond noise in its favour.
- id: learned-shift-per-study-one-point
  mechanism_id: learned-crop-shift
  parent_idea_id: null
  title: Predict one point per study from a low-resolution look at its canvases and place
    every view's crop from it, trained by the target loss through the crop
  opportunity: >-
    A guess. Knees do not sit at the same place in their images: the joint line varies by
    about 5 mm between studies and the loader's fitted centre is a least-squares compromise
    across series (prior-work.md, Topic 2). A shift shared by all knees cannot follow that; a
    shift predicted per knee can, and one point in space for the whole study keeps the planes
    in agreement by construction. The routed model gives the shift a consequence: the regions
    are cut around a per-knee centre, so a crop centred on the knee puts the same anatomy in
    the same tokens.
  mechanism: >-
    Steps (1) to (4) of learned-shift-per-series-type, unchanged: the canvas with its margin,
    the cut in the model, the normalisation after the cut, the augmentation on the cut crop.
    In place of the per-type parameter of step (5), a locator runs on the canvases before the
    cut. Input: each series' canvases, scaled for the locator only between the same two
    quantile levels of the canvas's own valid pixels (detached), average-pooled to 64 px and
    averaged over the series' slices. Network: three 3x3 convolutions with stride 2 (16, 32, 64
    channels, ReLU), a global average, plus a learned embedding of the series type; the vectors
    of a study's present series are averaged and a linear layer with zero weight and bias gives
    delta in R^3 in millimetres, bounded as 15 * tanh(delta / 15). Axes of delta: the fitted
    frame's axes before the knee side is applied (patient left-right after the header
    rotation, anterior, superior), so the locator needs no knee side. Each image's two-axis
    shift is delta mapped to its row and column directions with the linear part of its patient
    map, then bounded to that view's margin; views with no margin are not shifted. The cut and
    the locator run before the reflection, on the canvases as loaded. The locator is trained
    by the target loss through the sampling grid at the head learning rate. The routing frame
    is unchanged: it still centres on the meniscus spots.
  precedents:
  - 'autoresearch/campaigns/learnable-views: nothing per study was tried; shifts per series type looked random.'
  - 'docs/ongoing/side-routed-heads.md: the frame per knee is read from the heads without any marking.'
  novelty: First per-study crop placement predicted by the model.
  coverage: Every study in training and at inference; the locator sees every series.
  exploitation: >-
    Read both multipliers, the per-target deltas, and the logged delta per axis: its mean and
    its standard deviation across validation knees per epoch. Shown wrong by: a spread across
    knees under 2 mm on every axis (the locator learned one constant, which the per-series
    seed covers), or a prediction time above 1.3 times the incumbent's.
  budget: >-
    The locator reads 64 px images: under 1% of the backbone's cost. The canvas cost is that
    of learned-shift-per-series-type.
  implementation: >-
    Start from the port of learned-shift-per-series-type: if an earlier candidate of this
    campaign built it, copy that code from its changes.diff under
    outputs/autoresearch/routing-and-shifts/experiments/, otherwise build it as that seed
    describes (same reuse sources). Add the locator module in modeling, created under
    torch.random.fork_rng, and pass a shift per image to the cutter; there is no view_shift
    parameter in this seed. inference/engine.py runs the locator. Log
    shift_delta_<axis>_mean_mm and shift_delta_<axis>_sd_mm for training and validation per
    epoch through _log_epoch_metric. Required checks, reported with their numbers: the
    zero-shift equality of the port (true at initialisation, since the last layer is zero);
    and on one batch with a random nonzero last layer, a mirrored pass and a plain pass give
    crops that are mirror images of each other. Then the guardrail check.
  open_choices: None.
  dependencies: []
  priority_rationale: The user's main line for topic 2.
- id: learned-shift-per-study-per-view
  mechanism_id: learned-crop-shift
  parent_idea_id: null
  title: Predict two free offsets for every view of every study, trained by the target loss
    through the crop
  opportunity: >-
    A guess, the counterpart of learned-shift-per-study-one-point. One point per study assumes
    the series of a study agree in space. 99% of same-plane series pairs move under 2.7 mm,
    but the views differ in what they should centre on: the sagittal views are already offset
    forward by hand and the coronal ones are not. Free offsets per view let each view find its
    own centre for each knee.
  mechanism: >-
    Everything of learned-shift-per-study-one-point up to the locator's per-series vectors.
    The output differs: for each series, its vector concatenated with the study's mean vector
    goes through one linear layer per series type, zero weight and bias at the start, that
    gives two offsets in millimetres along the image's rows and columns for each view of that
    series, bounded as limit * tanh(x / limit) with limit that view's margin in millimetres.
    There is no common point and no projection through the patient maps. Trained by the target
    loss through the sampling grid at the head learning rate.
  precedents:
  - 'docs/ongoing/side-routed-heads.md, inter-series motion: 99% of same-plane pairs move under 2.7 mm.'
  novelty: Per-study, per-view placement; the pair with the one-point seed says whether tying the planes together matters.
  coverage: Every coronal and sagittal view of every study.
  exploitation: >-
    Compare with learned-shift-per-study-one-point at both multipliers and by the spread of
    the offsets across knees per view. Shown wrong by: views of one study whose implied points
    in space disagree by more than the 2.7 mm the series move, which would mean the freedom is
    fitting noise.
  budget: As learned-shift-per-study-one-point.
  implementation: >-
    As learned-shift-per-study-one-point (reuse the earlier candidate's port and locator when
    one exists), with the output layers per series type. Log
    shift_<type>_<view>_<axis>_mean_mm and _sd_mm per epoch for training and validation, and
    shift_view_disagreement_mm: per study, map every view's offset to patient millimetres with
    its patient map and take the mean distance between the views' displacement vectors
    projected on the axes two views share; report its mean across validation knees. Same two
    required checks, then the guardrail check.
  open_choices: None.
  dependencies: []
  priority_rationale: The user asked for both parametrisations as seeds.
exhausted_directions: ''
