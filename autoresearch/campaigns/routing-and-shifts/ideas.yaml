    as for the other families. One change to the constructor is required: today every
    question named in REGIONS is removed from the option-level heads (the set `placed`).
    acl_status and extra_pcl are routed option-level questions (QUESTION_ROUTES) and
    mcl_status and extra_lateral_ligaments are ordinary ones; all four must keep their
    option-level heads, so only the four questions placed today (medial_meniscus_tear_location,
    lateral_meniscus_tear_location, marrow_edema_location and patellar_facet) stay
