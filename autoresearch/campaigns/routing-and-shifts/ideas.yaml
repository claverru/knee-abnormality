- id: shift-per-study-one-point-light-port
  mechanism_id: learned-crop-shift
  parent_idea_id: null
  title: Predict one point per study from a low-resolution look at its canvases and
    place every view's crop from it, trained by the target loss through the crop
  opportunity: 'A guess. Knees do not sit at the same place in their images: the joint
    line varies by about 5 mm between studies and the loader''s fitted centre is a
    least-squares compromise across series (prior-work.md, Topic 2). A shift shared
    by all knees cannot follow that; a shift predicted per knee can, and one point
    in space for the whole study keeps the planes in agreement by construction. The
