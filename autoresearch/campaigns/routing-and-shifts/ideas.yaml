    gradient, is the centre of the incumbent''s frame, and frames built on it gave
    the line its best run. That point is a per-study target nobody marked. A locator
    trained to predict it from the low-resolution canvases centres every knee''s crops
    on the same anatomy.'
  mechanism: 'Port: steps (1) to (4) of shift-per-series-type-light-port exactly (uint8
    canvases normalised in the loader with the incumbent''s quantile bounds, the cut
    in the model, no normalisation after the cut); never the first port''s float canvases.
    The locator''s input is the uint8 canvas divided by 255, with no further scaling.
    The canvas, cut and locator of shift-per-study-one-point-light-port, with two
    differences. First, the crop is cut at the locator''s delta detached, so the target
    loss does not train the locator. Second, the locator has its own loss. After the
    main pass, study_frames gives each knee''s two meniscus spots in the fitted frame
    (the entry study_landmarks of the encoded batch, millimetres, no gradient); take
    their midpoint m and undo the knee side on its medial component so it is in delta''s
    axes. Because the crop has already been moved by delta, the spots'' position in
    the fitted frame does not depend on the shift: m is a property of the knee. Keep
    a running mean of m over training knees whose two spots were found (a persistent
    buffer of three values, momentum 0.99, started at the first batch''s mean, updated
    only in training). The locator''s target is m minus that mean: the offset that
    would bring this knee''s menisci to where the average knee''s are. shift_locator_loss
    = smooth L1 (beta 1) between delta and the target, both divided by the study''s
    mean token pitch as study_frames computes it, averaged over the knees whose two
    spots were found; it is added to the training loss with weight 0.1, the weight
    of the side loss. It is the one loss term this seed adds, and the guardrail check
    allows that name.'
