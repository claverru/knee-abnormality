- id: learned-shift-per-study-per-view
  mechanism_id: learned-crop-shift
  parent_idea_id: null
  title: Predict two free offsets for every view of every study, trained by the target
    loss through the crop
  opportunity: 'A guess, the counterpart of learned-shift-per-study-one-point. One
    point per study assumes the series of a study agree in space. 99% of same-plane
    series pairs move under 2.7 mm, but the views differ in what they should centre
    on: the sagittal views are already offset forward by hand and the coronal ones
    are not. Free offsets per view let each view find its own centre for each knee.'
  mechanism: 'Everything of learned-shift-per-study-one-point up to the locator''s
    per-series vectors. The output differs: for each series, its vector concatenated
    with the study''s mean vector goes through one linear layer per series type, zero
    weight and bias at the start, that gives two offsets in millimetres along the
    image''s rows and columns for each view of that series, bounded as limit * tanh(x
    / limit) with limit that view''s margin in millimetres. There is no common point
    and no projection through the patient maps. Trained by the target loss through
    the sampling grid at the head learning rate.'
  precedents:
  - 'docs/ongoing/side-routed-heads.md, inter-series motion: 99% of same-plane pairs
    move under 2.7 mm.'
  novelty: Per-study, per-view placement; the pair with the one-point seed says whether
    tying the planes together matters.
  coverage: Every coronal and sagittal view of every study.
  exploitation: 'Compare with learned-shift-per-study-one-point at both multipliers
    and by the spread of the offsets across knees per view. Shown wrong by: views
    of one study whose implied points in space disagree by more than the 2.7 mm the
    series move, which would mean the freedom is fitting noise.'
  budget: As learned-shift-per-study-one-point.
  implementation: 'As learned-shift-per-study-one-point (reuse the earlier candidate''s
    port and locator when one exists), with the output layers per series type. Log
    shift_<type>_<view>_<axis>_mean_mm and _sd_mm per epoch for training and validation,
    and shift_view_disagreement_mm: per study, map every view''s offset to patient
    millimetres with its patient map and take the mean distance between the views''
    displacement vectors projected on the axes two views share; report its mean across
    validation knees. Same two required checks, then the guardrail check.'
