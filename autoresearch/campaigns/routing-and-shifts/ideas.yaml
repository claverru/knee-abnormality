    \ membership remains unchanged. The derivative vanishes outside |d|<e and matches\
    \ the incumbent's 1/(8e) derivative at d=0. Retain every distance equation and\
    \ extent calculation. Log actual supervised boundary-gradient participation, frame\
    \ gradient norms, and upstream-gradient-weighted incumbent derivative mass inside\
    \ and outside this support. Use hooks and scalar reductions without another backward\
    \ pass. Label: unlimited sigmoid support is source-backed; harmful distant influence\
