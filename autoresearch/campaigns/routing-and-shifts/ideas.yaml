- id: synovitis-shares-effusion-attention-requeue
  mechanism_id: shared-attention
  parent_idea_id: null
  title: Let Synovitis pool with Effusion's attention scores and keep its own readout
    and region
  opportunity: 'A guess. Synovitis and PF OA decide the order of the routed runs,
    and Synovitis is the unstable one: 0.878 to 0.893 across the line with 114 positives
    on the fold, 2.3 sibling SDs between the top and bottom runs. Effusion looks at
    the same place (both read the front of the knee above the joint; spots at 26 mm
    forward and 32 mm up against 13 and 19) with 244 positives and stays within 0.917
    to 0.922 in every run. Synovial thickening and joint fluid are read on the same
    tokens; what differs is what is read from them. Sharing where to look and keeping
    what to read gives Synovitis an attention learned from twice the cases.'
  mechanism: 'In KneeAbnormalityModel._attention_pool (modeling/model.py), scores
    holds one row of attention scores per channel. Immediately after scores is built
    from self.attention and before the view label bias is added, the Synovitis channel''s
    row is replaced by the Effusion channel''s row (scores = scores[attention_source],
    with attention_source the identity except Synovitis -> Effusion). Everything downstream
    uses the replaced row: the target attention and the knee-level attention. Synovitis
    keeps its own column of the view label bias, its own position prior, its own route
    (front_core) and its own readout; the Synovitis output of self.attention is no
    longer used. The Effusion row is not detached, so Synovitis''s loss also trains
    it.'
