- id: shift-per-series-type-light-port-b
  mechanism_id: learned-crop-shift
  parent_idea_id: null
  title: Cut every view inside the model from a canvas with a margin and learn one
    shift per view of each series type, with the crop's size fixed
  opportunity: 'A guess, on a known mechanism. The views are placed by hand: coronal
    and sagittal crops of 84 and 93.33 mm anchored on the fitted knee centre with
    offsets of 7 and 10 mm (configs/training.yaml, data.series_types). The learnable-views
    campaign learned such offsets on the old recipe; with the sizes pinned (hand-sizes-learned-shifts)
    the run scored -0.0004 against its reference, and over 24 runs the shifts ended
    within 2.5 mm of their start, 3 to 7 mm apart between runs (prior-work.md, Topic
    2). That model read every token everywhere. This one reads each target from a
    region of a per-knee frame, so where a crop sits decides which tokens fall in
    which region. This seed is also the port every later shift seed builds on. Keeper''s
    requeue of 2026-10-07 on a lighter port. The first port (experiments learned-shift-per-series-type-20261006T220210Z-47b5085a
    and -20261006T221425Z-19a2bc48) worked (view_shift_grad_norm 0.024, epoch 1 at
    0.8927 against 0.8921) and was invalid on cost: training projected at 2,021 s
    against the limit of 1,595 s, and the machine at 34 of 39 GB with swap full against
    17 GB for the incumbent''s pipeline (shared memory 20 GB against 4 GB, main process
    15.7 GB against 4.5 GB). Its loader workers prepared float32 canvases of 304 px
    per frame and the normalisation sorted pixels after the cut.'
  mechanism: 'The light port, five steps; it replaces the first port''s steps and
    nothing of that port''s float canvases or post-cut normalisation is kept. (1)
    Canvas: each view window is prepared with a margin of M pixels on every side at
    the view''s own pixel spacing, M = round(data.view_shift_limit_mm / pixel spacing)
    with data.view_shift_limit_mm = 15.0 (40 px at 84 mm, 36 px at 93.33 mm); 120
    mm views keep M = 0 and a zero shift. The window''s own position is computed exactly
    as today (view_position, with its clipping); the margin is not clipped, and canvas
    pixels outside the acquired image are zero and outside the valid rectangle. (2)
    Normalisation stays where the incumbent has it and uses the incumbent''s numbers:
    the two quantile bounds of each series are computed over the valid pixels of its
    unshifted 224 px windows, exactly the incumbent''s quantile_bounds call on the
    central region of the canvases, and the whole canvas is scaled with those bounds
    and rounded to uint8 as normalize_pixels does. The loader therefore still ships
    uint8 images, of 304 or 296 px in place of 224 px, and nothing float; the central
    224 px of every canvas equals the incumbent''s prepared image exactly. (3) Cut:
    in the model, before any augmentation, each image''s 224 px crop is taken from
    its uint8 canvas converted to float with affine_grid and grid_sample (bilinear,
    align_corners False, zero padding) at the canvas centre plus the shift; with a
    zero shift the sampling points are pixel centres and the crop is the central region
    unchanged. The valid rectangle and the patient maps are translated by the same
    shift. There is no normalisation and no sorting after the cut. (4) The affine
    augmentation, the reflection and everything after run unchanged on the cut crop.
    (5) One parameter view_shift[type, view, 2], zero at the start, gives the shift
    in millimetres along the image''s rows and columns as limit * tanh(view_shift
    / limit) with limit = M * pixel spacing; it is trained by the target loss through
    the sampling grid at the head learning rate. Nothing else changes.'
