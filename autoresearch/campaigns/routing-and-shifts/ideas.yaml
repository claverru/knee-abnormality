- id: shared-ligament-reader
  mechanism_id: report-region-targets
  parent_idea_id: null
  title: One shared head for four ligament report answers, read in the core for ACL
    and PCL and at the rim for MCL and the lateral ligaments
  opportunity: 'Evidence-backed counts, a guess for the effect. ACL sits at 0.9406
    over the routed runs with a spread equal to its noise, against 0.9458 for the
    old recipe, and nothing varied so far touches it. The ring radius has ACL alone
    on one side and the core radius has no report target on either. The v4 answers
    already hold what a both-sided reader needs: ACL tears 716 and PCL findings 259
    in the core, MCL injuries 874 and lateral-ligament findings 321 at the rim (prior-work.md,
    Measured). One head reading the core for two of them and the rim for the other
    two is the meniscus head''s arrangement turned from medial-lateral to inside-outside:
    it gives ACL''s region more supervision and gives the two radii an opposing reader.'
  mechanism: 'A new located family "ligament_injury" in REGIONS (training/report_attributes.py),
    four Region entries read by one shared head exactly as the existing located families
    are (one attention column and one classifier row for the family, pooled over each
    entry''s route, one yes/no target per entry): question acl_status on the route
    core; extra_pcl on core; mcl_status on collateral_medial; extra_lateral_ligaments
    on a new route collateral_lateral, the mirror of collateral_medial: ringed * (sector["anterolateral"]
    + sector["lateral"]), all heights, added to ROUTES and to _regions. For each entry,
    located = the question''s options that state an injury or abnormality and unplaced
    = its not-stated or not-mentioned options, read from configs/labels/jevk5-report-attribute-targets-v4.0.json;
