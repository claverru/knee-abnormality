  source_change: true
  targeted_curve: "Incumbent epochs 6\u20139: PF OA remains 0.8851\u20130.8859 despite\
    \ falling training loss; Synovitis finishes below its epoch-4 peak. Target more\
    \ useful height support and continued macro improvement without removing incumbent\
