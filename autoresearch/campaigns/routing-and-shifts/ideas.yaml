ideas:
- id: learned-shift-per-series-type
  mechanism_id: learned-crop-shift
  parent_idea_id: null
  title: Cut every view inside the model from a canvas with a margin and learn one
    shift per view of each series type, with the crop's size fixed
  opportunity: 'A guess, on a known mechanism. The views are placed by hand: coronal
    and sagittal crops of 84 and 93.33 mm anchored on the fitted knee centre with
    offsets of 7 and 10 mm (configs/training.yaml, data.series_types). The learnable-views
    campaign learned such offsets on the old recipe; with the sizes pinned (hand-sizes-learned-shifts)
    the run scored -0.0004 against its reference, and over 24 runs the shifts ended
    within 2.5 mm of their start, 3 to 7 mm apart between runs (prior-work.md, Topic
    2). That model read every token everywhere. This one reads each target from a
    region of a per-knee frame, so where a crop sits decides which tokens fall in
    which region. This seed is also the port every later shift seed builds on.'
  mechanism: 'Today prepare_images (data/preprocessing/device.py) resamples each slice''s
    view window to 224 px, normalises each series between two quantiles of its windows''
    valid pixels, rounds to uint8, and the model applies the affine augmentation.
    Change, in this order. (1) Canvas: each view window is prepared with a margin
    of M pixels on every side at the view''s own pixel spacing, M = round(data.view_shift_limit_mm
    / pixel spacing) with data.view_shift_limit_mm = 15.0 (40 px at 84 mm, 36 px at
    93.33 mm); 120 mm views keep M = 0 and a zero shift. The window''s own position
    is computed exactly as today (view_position in data/preprocessing/spatial.py,
    with its clipping to the 120 mm window and the acquired image); the margin around
    it is not clipped, and canvas pixels outside the acquired image are zero and outside
    the valid rectangle. prepare_images returns the canvases as float, not normalised,
    with their valid rectangles. (2) Cut: in the model, before any augmentation, each
    image''s 224 px crop is taken from its canvas with affine_grid and grid_sample
    (bilinear, align_corners False, zero padding) at the canvas centre plus that view''s
    shift; the valid rectangle and the patient maps (batch patient_maps) are translated
    by the same shift. (3) Normalisation moves after the cut: the same quantile levels,
    over the valid pixels of the series'' cut crops, bounds detached, then the same
    scaling with the rounding made straight-through (x + (round(x) - x).detach()).
    (4) The affine augmentation, the reflection and everything after run unchanged
    on the cut crop. (5) One parameter view_shift[type, view, 2], zero at the start,
    gives the shift in millimetres along the image''s rows and columns as limit *
    tanh(view_shift / limit) with limit = M * pixel spacing; it is trained by the
    target loss through the sampling grid at the head learning rate. Nothing else
    changes.'
  precedents:
  - 'Learnable-views run hand-sizes-learned-shifts (sizes pinned, shifts learned,
    old recipe, fold 0): 0.932905, -0.0004, 80% interval [-0.0014, +0.0005]; frozen
    source and changes.diff under outputs/autoresearch/learnable-views/experiments/hand-sizes-learned-shifts-20261003T183532Z-8d11d7a5/.'
  - 'autoresearch/campaigns/learnable-views/build-notes.md: shifts within 2.5 mm of
    the start and 3 to 7 mm apart between runs; the open question on the affine augmentation
    hiding the signal.'
  - 'docs/ongoing/side-routed-heads.md, run 24: regions are read in a frame centred
    per knee on the meniscus spots.'
  novelty: First learned view placement on the routed model.
  coverage: Every coronal and sagittal view of every study, in training and at inference;
    axial 120 mm views keep a zero shift.
  exploitation: 'Read both multipliers against the incumbent, PF OA, Synovitis and
    Effusion first (the front targets, whose tokens sit at the crops'' edge), and
    the logged shifts per epoch. Shown wrong by: shifts that stay within 2 mm of zero,
    or that keep moving in the last three epochs without settling.'
  budget: Same slices decoded. A canvas of 304 or 296 px in place of 224 px is resampled
    per image (1.75 to 1.84 times the pixels in prepare_images) and one grid_sample
    per image is added. Expected within 1.3 times the reference; the run reports its
    training and prediction time.
  implementation: 'Reuse, do not rewrite: the branch view-optimisation (commit b290da6)
    has the in-model cutter in src/knee_abnormality/modeling/views.py (sample_windows,
    normalise_windows, ViewWindows with a clamped two-axis shift per view) and the
    experiment above is that code with the sizes pinned; read them with `git show
    view-optimisation:PATH` and from the experiment''s source directory. Take the
    grid construction, the shift parameter, the normalisation after the cut and the
    logging; do not take its single global canvas at its own spacing, its bicubic
    reads, its learned width, label bias or slice budget. Files: data/preprocessing
    (the view window, resample plan and valid rectangle with the margin; prepare_images
    returning float canvases), data/dataset.py, modeling (the cutter, called at the
    start of the model''s image encoding), config.py and configs/training.yaml (the
    one key data.view_shift_limit_mm), inference/engine.py (same cut, no augmentation),
    training/lightning.py (log view_shift_<type>_<view>_<axis>_mm per epoch). view_shift
    is created under torch.random.fork_rng. Required check, reported with its number:
    with view_shift at zero and the model in training and in evaluation mode, the
    crops entering the augmentation equal the incumbent''s prepared images on one
    batch, largest absolute difference at most 1 grey level of 255. Then the guardrail
    check.'
