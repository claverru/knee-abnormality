- id: learned-shift-per-study-one-point
  mechanism_id: learned-crop-shift
  parent_idea_id: null
  title: Predict one point per study from a low-resolution look at its canvases and
    place every view's crop from it, trained by the target loss through the crop
  opportunity: 'A guess. Knees do not sit at the same place in their images: the joint
    line varies by about 5 mm between studies and the loader''s fitted centre is a
    least-squares compromise across series (prior-work.md, Topic 2). A shift shared
    by all knees cannot follow that; a shift predicted per knee can, and one point
    in space for the whole study keeps the planes in agreement by construction. The
    routed model gives the shift a consequence: the regions are cut around a per-knee
    centre, so a crop centred on the knee puts the same anatomy in the same tokens.'
  mechanism: 'Steps (1) to (4) of learned-shift-per-series-type, unchanged: the canvas
    with its margin, the cut in the model, the normalisation after the cut, the augmentation
    on the cut crop. In place of the per-type parameter of step (5), a locator runs
    on the canvases before the cut. Input: each series'' canvases, scaled for the
    locator only between the same two quantile levels of the canvas''s own valid pixels
    (detached), average-pooled to 64 px and averaged over the series'' slices. Network:
    three 3x3 convolutions with stride 2 (16, 32, 64 channels, ReLU), a global average,
    plus a learned embedding of the series type; the vectors of a study''s present
    series are averaged and a linear layer with zero weight and bias gives delta in
    R^3 in millimetres, bounded as 15 * tanh(delta / 15). Axes of delta: the fitted
    frame''s axes before the knee side is applied (patient left-right after the header
    rotation, anterior, superior), so the locator needs no knee side. Each image''s
    two-axis shift is delta mapped to its row and column directions with the linear
    part of its patient map, then bounded to that view''s margin; views with no margin
    are not shifted. The cut and the locator run before the reflection, on the canvases
    as loaded. The locator is trained by the target loss through the sampling grid
    at the head learning rate. The routing frame is unchanged: it still centres on
    the meniscus spots.'
  precedents:
  - 'autoresearch/campaigns/learnable-views: nothing per study was tried; shifts per
    series type looked random.'
  - 'docs/ongoing/side-routed-heads.md: the frame per knee is read from the heads
    without any marking.'
  novelty: First per-study crop placement predicted by the model.
  coverage: Every study in training and at inference; the locator sees every series.
  exploitation: 'Read both multipliers, the per-target deltas, and the logged delta
    per axis: its mean and its standard deviation across validation knees per epoch.
    Shown wrong by: a spread across knees under 2 mm on every axis (the locator learned
    one constant, which the per-series seed covers), or a prediction time above 1.3
    times the incumbent''s.'
  budget: 'The locator reads 64 px images: under 1% of the backbone''s cost. The canvas
    cost is that of learned-shift-per-series-type.'
  implementation: 'Start from the port of learned-shift-per-series-type: if an earlier
    candidate of this campaign built it, copy that code from its changes.diff under
    outputs/autoresearch/routing-and-shifts/experiments/, otherwise build it as that
    seed describes (same reuse sources). Add the locator module in modeling, created
    under torch.random.fork_rng, and pass a shift per image to the cutter; there is
    no view_shift parameter in this seed. inference/engine.py runs the locator. Log
    shift_delta_<axis>_mean_mm and shift_delta_<axis>_sd_mm for training and validation
    per epoch through _log_epoch_metric. Required checks, reported with their numbers:
    the zero-shift equality of the port (true at initialisation, since the last layer
    is zero); and on one batch with a random nonzero last layer, a mirrored pass and
    a plain pass give crops that are mirror images of each other. Then the guardrail
    check.'
  open_choices: None.
