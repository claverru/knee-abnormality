- id: spot-shift-locator-keeps-spatial-maps-k
  mechanism_id: learned-crop-shift
  parent_idea_id: shift-per-study-from-the-spots-unit-output
  title: Predict the spot-supervised crop point from spatial heatmaps instead of globally
    averaged features
  opportunity: "The spot-supervised locator achieved \xD71 0.915219 and \xD74 0.924941,\
    \ both below the incumbent. Its validation locator loss declined from 0.0668 to\
    \ 0.0567, but final left\u2013right shift SD was only 0.1947 mm against residual\
    \ SD 2.1199 mm. Source inspection shows that the CNN globally averages its spatial\
    \ map before coordinate regression. This removes explicit positional information\
    \ and could explain weak knee-specific localization. Larger free outputs instead\
    \ produced nearly common shifts or margin saturation; another output-strength\
    \ change is unsupported."
  mechanism: "Replace StudyShiftLocator's spatial averaging and Linear(64,3) with\
    \ a zero-initialized 1\xD71 heatmap scorer on the existing low-resolution convolutional\
    \ maps. For acquisition a, form masked spatial probabilities alpha_a=softmax(score_a)\
    \ and identical-mask uniform probabilities alpha_0. Compute two physical offsets\
    \ b_a=sum((alpha_a-alpha_0)*q_a), where q_a contains row/column coordinates in\
    \ millimetres. Zero scorer weights give exactly zero offsets. Using trusted patient-map\
    \ row/column unit vectors, stack the equations A*d=b across acquisitions and obtain\
    \ the minimum-norm study point d=(A^T A)^+ A^T b; map it to the existing anatomical\
    \ axes and bound it with 15*tanh(d/15). Unobserved directions remain zero. Retain\
    \ the parent's detached cutter and its single shift_locator_loss: pitch-normalized\
    \ smooth-L1 against detached meniscus-midpoint residuals centred by the training-only\
    \ EMA, with the same coefficient. Log heatmap entropy, geometric disagreement,\
    \ locator gradients/loss, residual spreads, and every applied view shift's validation\
    \ mean and SD in mm. Label: positional information loss is source-backed; the\
    \ causal diagnosis and heatmap benefit are hypotheses."
  precedents:
  - "shift-per-study-from-the-spots-unit-output: training 1,441.4 s; \xD74 delta -0.000448,\
    \ central 80% interval [-0.002036,+0.001021]. Final validation shift SDs anterior/left\u2013\
    right/superior: 1.7346/0.1947/3.7982 mm; residual SDs: 4.6054/2.1199/6.3682 mm."
  - The parent's StudyShiftLocator applies convolutions(...).mean((-1,-2)), then averages
    acquisition vectors before coordinate regression. Its shift_locator_loss already
    supplies detached coordinate supervision without changing backbone gradients.
  - "Per-view unit-output run: sagittal-fluid column shift reaches 14.4305\xB10.0726\
    \ mm; view disagreement reaches 11.6031 mm. Its \xD74 macro delta is -0.002052,\
    \ so increased movement alone did not help."
  - "Learnable-views build-notes, campaign review: historical type shifts stayed within\
    \ \xB12.5 mm on average and varied by 3\u20137 mm between runs. They do not establish\
    \ a consistent population offset."
  - '[Nibali et al., Numerical Coordinate Regression with Convolutional Neural Networks](https://arxiv.org/abs/1801.07372):
    differentiable spatial expectations retain coordinate information and work with
    low-resolution heatmaps. Transfer to knee crop placement remains unmeasured.'
  novelty: Changes the localization representation and its geometric combination,
    rather than reseeding, increasing displacement strength or retrying the same global
    regression. Acquisition heatmaps yield one geometrically consistent study point,
    without a second full-resolution backbone pass or identity lookup.
  coverage: Uses the existing slices and canvases across present acquisitions. Trusted
    geometry supplies projection equations; invalid acquisitions do not invent a physical
    direction. The zero-start crop, fixed view widths/pixels, reflection and random
    affine placement must remain equivalent to the incumbent.
  exploitation: 'Retries the diagnosed locator bottleneck while retaining its existing
    supervision. Shown wrong by: heatmaps activate but residual variation remains
    unexplained, predictions again collapse to common offsets or saturate, or the
    valid macro interval fails adoption. Coordinate fit and label gains cannot override
    the macro verdict.'
  budget: "One ten-epoch run at seed 1110484336. Reuse the light uint8 canvas transport\
    \ and existing 64\xD764 locator input; no full-resolution second pass. The parent's\
    \ 1,441.4 s training leaves about 154 s below the upper bound; a heatmap output\
    \ and 3\xD73 solve should be modest additions, but runtime is unmeasured. Prediction\
    \ overhead is material: the parent took about 46.1 s versus roughly 31.8 s for\
    \ the incumbent. This proposal does not establish that cutter overhead is resolved."
  implementation: 'Environment, read this first. (1) You have no GPU and must not
    use one. Run `rtk proxy uv run --locked python -m scripts.tools.check_side_routing
    --config configs/training.yaml` from your candidate workspace as it is: the script
    selects the CPU by itself when no GPU is visible, takes a few minutes there, and
    that CPU run is the required check. Never return blocked for lack of a GPU. (2)
    Make every change inside the candidate workspace you were assigned and nowhere
    else. Do not stage the candidate under /tmp, and do not write source/ or changes.diff
    in the experiment directory: it is read-only to you by design, and the supervisor
    freezes the source and the diff from your workspace after you return. (3) When
    the change is complete and the check passes, return status prepared with the integration
    and activation declarations and the guardrail JSON in the report. An unwritable
    experiment directory is never a reason to return blocked. Adds movable-crop infrastructure
    to the current incumbent, borrowing the reviewed light cutter as a historical
    implementation. Change modeling/model.py, training/lightning.py, required data/preprocessing
    and dataset transport, config.py, inference/engine.py and reflection.py; set only
    data.view_shift_limit_mm=15. Replace the borrowed global-average locator with
    the heatmap locator and remove its unused regression path. Retain accepted height
    cuts and all unrelated incumbent behavior. If the running shared crop/frame-centre
    idea becomes incumbent, preserve that sharing and supply the new predicted point
    to both consumers; do not depend on its undecided result. Developer reports unchanged
    guardrails and exact zero-shift crop difference.'
  open_choices: Keep the parent's loss, EMA update and bounding scale fixed. Use acquisition-level
    equations with equal acquisition weighting and a minimum-norm solve, without a
    learned confidence gate. Teacher drift and low-resolution visibility remain uncertainties
    to log, not reasons to add another loss or confirmation run.
  dependencies: []
  priority_rationale: 'Keeper''s copy with the developer-environment paragraph. Priority
    2: a concrete source-level retry for weak spatial localization, alternating back
