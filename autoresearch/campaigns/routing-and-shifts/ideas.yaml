    two height cuts are the two cuts with targets on one side only.'
  mechanism: 'In study_frames (modeling/model.py), run 28''s placement for the upper
    and lower cut only. Spots, all squared-attention centroids without gradient with
    their spread (the weighted standard deviation of the spot''s tokens, summed over
    the three axes): the two meniscus spots as today, and a kneecap spot from the
    shared OA channel over the tokens with fitted front > 0 and fitted height > 0.
    Express the spots in the knee''s frame (subtract the frame''s shift, apply its
    rotation). With h_m and s_m the mean height and mean spread of the two meniscus
    spots and h_k, s_k the kneecap spot''s: band_top = max(h_m + (h_k - h_m) * s_m
    / (s_m + s_k), h_m) and band_bottom = 2 * h_m - band_top, computed under torch.no_grad.
