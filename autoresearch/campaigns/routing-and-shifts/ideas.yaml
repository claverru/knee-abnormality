- id: learned-shift-per-study-from-the-spots
  mechanism_id: learned-crop-shift
  parent_idea_id: null
  title: Train the per-study point to predict where the heads' meniscus spots are,
    and place the crops from it
  opportunity: 'A guess with a strong signal. The target loss reaches a shift only
    through the sampling grid, and the augmentation teaches the model to ignore shifts
    of the size being learned (prior-work.md, Topic 2). The routed heads already say
    where the knee is: the midpoint of the two meniscus attention spots, read without
    gradient, is the centre of the incumbent''s frame, and frames built on it gave
    the line its best run. That point is a per-study target nobody marked. A locator
    trained to predict it from the low-resolution canvases centres every knee''s crops
