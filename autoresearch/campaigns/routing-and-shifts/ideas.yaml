- id: shift-per-study-from-the-spots-light-port-b
  mechanism_id: learned-crop-shift
  parent_idea_id: null
  title: Train the per-study point to predict where the heads' meniscus spots are,
    and place the crops from it
  opportunity: 'A guess with a strong signal. The target loss reaches a shift only
    through the sampling grid, and the augmentation teaches the model to ignore shifts
    of the size being learned (prior-work.md, Topic 2). The routed heads already say
    where the knee is: the midpoint of the two meniscus attention spots, read without
    gradient, is the centre of the incumbent''s frame, and frames built on it gave
    the line its best run. That point is a per-study target nobody marked. A locator
    trained to predict it from the low-resolution canvases centres every knee''s crops
    on the same anatomy.'
  mechanism: 'Port: steps (1) to (4) of shift-per-series-type-light-port-b exactly
    (uint8 canvases normalised in the loader with the incumbent''s quantile bounds,
    the cut in the model, no normalisation after the cut); never the first port''s
    float canvases. The locator''s input is the uint8 canvas divided by 255, with
    no further scaling. The canvas, cut and locator of shift-per-study-one-point-light-port-b,
    with two differences. First, the crop is cut at the locator''s delta detached,
    so the target loss does not train the locator. Second, the locator has its own
    loss. After the main pass, study_frames gives each knee''s two meniscus spots
    in the fitted frame (the entry study_landmarks of the encoded batch, millimetres,
    no gradient); take their midpoint m and undo the knee side on its medial component
    so it is in delta''s axes. Because the crop has already been moved by delta, the
    spots'' position in the fitted frame does not depend on the shift: m is a property
    of the knee. Keep a running mean of m over training knees whose two spots were
    found (a persistent buffer of three values, momentum 0.99, started at the first
    batch''s mean, updated only in training). The locator''s target is m minus that
    mean: the offset that would bring this knee''s menisci to where the average knee''s
    are. shift_locator_loss = smooth L1 (beta 1) between delta and the target, both
    divided by the study''s mean token pitch as study_frames computes it, averaged
    over the knees whose two spots were found; it is added to the training loss with
    weight 0.1, the weight of the side loss. It is the one loss term this seed adds,
    and the guardrail check allows that name.'
  precedents:
  - 'Runs 23 and 24: the frame centred on the meniscus spots; run 24 is the incumbent.'
  - 'autoresearch/campaigns/learnable-views/build-notes.md: the open question on the
    augmentation hiding the signal.'
  novelty: First shift trained on a target the model produces itself.
  coverage: Every study with both meniscus spots found, in training; every study at
    inference.
  exploitation: 'Read shift_locator_loss on training and validation, the spread of
    delta across validation knees per axis, the spread across validation knees of
    m minus delta per axis (it should shrink over the epochs), both multipliers, and
