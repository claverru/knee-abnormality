    by all knees cannot follow that; a shift predicted per knee can, and one point
    in space for the whole study keeps the planes in agreement by construction. The
    routed model gives the shift a consequence: the regions are cut around a per-knee
    centre, so a crop centred on the knee puts the same anatomy in the same tokens.'
  mechanism: 'Port: steps (1) to (4) of shift-per-series-type-light-port-b exactly
    (uint8 canvases normalised in the loader with the incumbent''s quantile bounds,
    the cut in the model, no normalisation after the cut); never the first port''s
    float canvases. The locator''s input is the uint8 canvas divided by 255, with
    no further scaling. Steps (1) to (4) of shift-per-series-type-light-port-b, unchanged:
    the canvas with its margin, the cut in the model, the augmentation on the cut
    crop. In place of the per-type parameter of step (5), a locator runs on the canvases
    before the cut. Input: each series'' canvases, average-pooled to 64 px and averaged
    over the series'' slices. Network: three 3x3 convolutions with stride 2 (16, 32,
    64 channels, ReLU), a global average, plus a learned embedding of the series type;
    the vectors of a study''s present series are averaged and a linear layer with
    zero weight and bias gives delta in R^3 in millimetres, bounded as 15 * tanh(delta
    / 15). Axes of delta: the fitted frame''s axes before the knee side is applied
    (patient left-right after the header rotation, anterior, superior), so the locator
    needs no knee side. Each image''s two-axis shift is delta mapped to its row and
    column directions with the linear part of its patient map, then bounded to that
    view''s margin; views with no margin are not shifted. The cut and the locator
    run before the reflection, on the canvases as loaded. The locator is trained by
    the target loss through the sampling grid at the head learning rate. The routing
    frame is unchanged: it still centres on the meniscus spots.'
