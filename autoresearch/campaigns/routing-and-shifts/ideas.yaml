- id: held-cuts-with-wider-regions
  mechanism_id: held-division
  parent_idea_id: null
  title: The mirrored division whose every cut has targets on both sides, at the 15%
    reading threshold - two heights, a 24 mm core and four sectors, with wider regions
    than run 30
  opportunity: 'Evidence-backed in its two halves, a guess that they add up. Run 30
    built the finest mirrored division in which targets hold every cut from both sides
    and its cuts stayed where they started with no balancing (27.0, 12.9 and 20.2
    mm from starts of 27, 9 and 21), where the incumbent''s lower cut wanders from
    -9 to +1 mm and slid 10 mm in run 26. It lost 0.0015 because its regions were
    cut at 20% of each target''s free attention: MCL -0.0078, Synovitis -0.0050, Effusion
    -0.0031, PF OA -0.0022, the four tightest. The same search at 15% gives a division
    that is still held on every cut and reads more: no target loses more than 14%
    of its attention, against 20% (outputs/analysis/s/side-routing-cut-forces-20261006/symmetric-division-0.15.json).'
  mechanism: 'All in modeling/model.py. FRAME_SIZES = ("cut_height", "core_radius"),
    regressed per knee as today, with FRAME_SIZE_START_PITCHES = (0.95, 1.9), about
    12 and 24 mm; the lower cut and the ring radius are removed. SECTORS = (front_medial,
    front_lateral, back_lateral, back_medial), starting at 30, 90, 150 and 270 degrees
    from the medial axis through the front: beyond[k] = inside(front * cos(a_k) -
    medial * sin(a_k), across) and sector k = beyond[k] * (1 - beyond[k + 1]) cyclically,
    as today with these four angles. upper = inside(height - cut_height, half[...,
    2]) and lower = 1 - upper; core, ringed and medial_side as today; medial_core
    = core * medial_side, lateral_core = core * lateral_side. Route table, in the
    order of ROUTES: meniscus_medial (medial_core + ringed * back_medial) * lower;
    meniscus_lateral (lateral_core + ringed * back_lateral) * lower; oa_medial medial_core
    + ringed * (front_medial + back_medial); oa_lateral lateral_core + ringed * (front_lateral
    + back_lateral); kneecap (PF OA) ringed * (front_medial + front_lateral); core
    (ACL) core; collateral_medial (MCL) and baker medial_core + ringed * back_medial;
    front_core (Synovitis) core + ringed * (front_medial + front_lateral); a new route
    pouch (Effusion; add it to ROUTES and point OWN_ROUTES["Effusion"] at it) ringed
    * (front_medial + front_lateral) * upper. Report routes: tear_medial_anterior
    ringed * front_medial * lower, tear_medial_body ringed * (front_medial + back_medial)
    * lower, tear_medial_posterior ringed * back_medial * lower, the three lateral
    ones mirrored; facet_medial ringed * front_medial * upper, facet_lateral ringed
    * front_lateral * upper. Cuts stay hard with the soft gradient.'
  precedents:
  - 'Run 30 (outputs/training/20261006-200553-side-routed-mirrored-held-division):
    cuts held, 0.923564 and 0.914537, losses on the tightest targets.'
  - 'Run 26: the lower cut, with targets on one side only, slid from -2 to +10 mm.'
  novelty: The held division has only been run with its tightest regions.
  coverage: All ten routed targets and the located report targets.
  exploitation: 'Read both multipliers, then MCL, Synovitis, Effusion and PF OA against
    run 30 and against the incumbent, and the two sizes per epoch (study_frame_cut_height_mm,
    study_frame_core_radius_mm). Shown wrong by: a size that moves more than 4 mm
    after epoch 3, or the four targets not recovering over run 30.'
  budget: Same cost as the incumbent.
  implementation: 'Run 30''s code is the closest starting point and may be reused:
    unzip outputs/training/20261006-200553-side-routed-mirrored-held-division/source_snapshot.zip
    and read its modeling/model.py (same four sectors, the pouch route, three sizes);
    this seed drops its lower cut and widens its table as written above. The size
    regression (frame_output) and frame_size have two outputs; training/lightning.py
    logs the sizes by name from FRAME_SIZES, so no logging change is needed. Update
    SPATIAL_TOKEN_IDENTITY and run the guardrail check.'
