ideas:
- id: contusion-reads-the-edema-head
  mechanism_id: report-region-targets
  parent_idea_id: null
  title: Add to Contusion's logit what the shared marrow-edema head sees in the three
    compartments
  opportunity: >-
    A guess. Contusion is the one target that goes down when the others go up: -0.0020
    between the top six and the bottom six runs, and its spread across the routed runs is 1.4
    sibling SDs (0.9453 to 0.9531). It is not routed, because a contusion can be anywhere. The
    training already holds a head that says where marrow edema is: the located family
    marrow_edema_place, one shared head read over the medial, lateral and kneecap regions,
    whose targets explain 25% on unseen knees. A contusion is marrow edema with a traumatic
    cause, so that head's evidence is Contusion's evidence with a place attached.
  mechanism: >-
    Today the family marrow_edema_place lives in ReportAttributeHeads
    (training/report_attributes.py), owned by the training module, and is absent at inference:
    one attention column and one classifier row shared by its three Region entries (routes
    oa_medial, oa_lateral, kneecap), pooled over each route on the shared tokens. Move that
    family's reader into KneeAbnormalityModel as a module edema_place with the same shape (an
    attention network of Linear(PROJECTION_WIDTH, MIL_ATTENTION_WIDTH), Tanh, Linear(...,
    1) and a classifier Linear(PROJECTION_WIDTH, 1)) and a method that returns the three
    region logits of a batch, pooled exactly as ReportAttributeHeads._pool pools a located
    family. ReportAttributeHeads takes those three logits from the model for this family and
    no longer holds a column and row for it; the report loss on the three edema targets is
    otherwise unchanged. In the model's pooling, the Contusion target's logit gains
    contusion_edema_scale * logsumexp of the three edema logits, with contusion_edema_scale a
    learned scalar starting at zero. Contusion keeps its own unrouted channel. The edema reader
    is trained by the report loss as today and by Contusion's target loss through the new
    term; it reads the shared tokens without detaching, as the report heads do.
  precedents:
  - 'docs/ongoing/side-routed-heads.md: edema by compartment 25% explained on validation knees.'
  - 'docs/ongoing/side-routed-heads.md, The runs sorted: Contusion -0.0020 top six against bottom six.'
  novelty: First use of a located report head at inference.
  coverage: Contusion on every study; the edema reader on every study at inference.
  exploitation: >-
    Read Contusion against the incumbent (sibling SD 0.0013), both multipliers, the learned
    scale, and val_report_attribute_bce of the three edema targets against the incumbent's.
    Shown wrong by: a scale that stays within 0.02 of zero, or the edema targets fitting worse
    than in the incumbent.
  budget: Same cost; three pooled logits more at inference.
  implementation: >-
    modeling/model.py: the module edema_place and contusion_edema_scale, both created under
    torch.random.fork_rng; the three logits computed where the routing weights are available
    (pool_encoded or _attention_pool) and added to the Contusion column only.
    training/report_attributes.py: REGION_FAMILIES keeps marrow_edema_place for the targets
    and the loss, but its logits come from the model. Since the weights are under the model's
    state dict, inference/checkpoint.py loads them with no change; confirm that a saved
    checkpoint reloads strictly. Log contusion_edema_scale per epoch. Update
    SPATIAL_TOKEN_IDENTITY and run the guardrail check: with the scale at zero the logits
    equal the incumbent's, so every guardrail must pass unchanged.
  open_choices: None.
  dependencies: []
  priority_rationale: The one target moving against the rest, with a located head already trained for its finding.
- id: synovitis-shares-effusion-attention
  mechanism_id: shared-attention
  parent_idea_id: null
  title: Let Synovitis pool with Effusion's attention scores and keep its own readout and
    region
  opportunity: >-
    A guess. Synovitis and PF OA decide the order of the routed runs, and Synovitis is the
    unstable one: 0.878 to 0.893 across the line with 114 positives on the fold, 2.3 sibling
    SDs between the top and bottom runs. Effusion looks at the same place (both read the front
    of the knee above the joint; spots at 26 mm forward and 32 mm up against 13 and 19) with
    244 positives and stays within 0.917 to 0.922 in every run. Synovial thickening and joint
    fluid are read on the same tokens; what differs is what is read from them. Sharing where
    to look and keeping what to read gives Synovitis an attention learned from twice the
    cases.
  mechanism: >-
    In KneeAbnormalityModel._attention_pool (modeling/model.py), scores holds one row of
    attention scores per channel. Immediately after scores is built from self.attention and
    before the view label bias is added, the Synovitis channel's row is replaced by the
    Effusion channel's row (scores = scores[attention_source], with attention_source the
    identity except Synovitis -> Effusion). Everything downstream uses the replaced row: the target
    attention and the knee-level attention. Synovitis keeps its own column of the view label
    bias, its own position prior, its own route (front_core) and its own readout; the
    Synovitis output of self.attention is no longer used. The Effusion row is not detached,
    so Synovitis's loss also trains it.
  precedents:
  - 'docs/ongoing/side-routed-heads.md, The runs sorted: Synovitis and PF OA carry about half of the macro variance between runs.'
  - 'Sharing a classifier across the meniscus pair and the OA triple gave the routed targets +0.0090 to +0.0131 summed against separate classifiers (runs 4 and 5).'
  novelty: First sharing of an attention column between two targets that keep separate readouts.
  coverage: Synovitis on every study.
  exploitation: >-
    Read Synovitis and Effusion against the incumbent (sibling SDs 0.0022 and 0.0015) and both
    multipliers. Shown wrong by: Effusion more than one SD below the incumbent, which would
    mean Synovitis's loss pulled the shared attention away from the fluid.
  budget: Same cost as the incumbent.
  implementation: >-
    modeling/model.py: a non-persistent buffer attention_source built in __init__ from
    self.channels (the name channel_source is already used there for something else), and the one indexing line in _attention_pool. study_frames calls
    self.attention on its own for the spots and is not touched. Update SPATIAL_TOKEN_IDENTITY
    and run the guardrail check.
  open_choices: None.
  dependencies: []
  priority_rationale: Aimed at one of the two targets that decide the ranking.
exhausted_directions: ''
