  developer_instructions: >-
    Implement a mechanism for exploiting disease patterns shared between medial
    and lateral compartments, or an assigned attribution control. Both meniscus
    and medial/lateral OA are in scope; do not impose identical classifiers or
    restrict the campaign to meniscus. The adopted reference is learned anatomical
    family strength with fixed 20 mm width and independent heads. Preserve it when
    stacking; explicitly justify replacement when substituting. The misnamed
    compartment-control run is rejected shared-adapter evidence. Do not restore its adapter modes
    or queue the retired independent arm. Configuration-only candidates require
    a concrete mechanism or ablation, not a generic sweep. New settings belong under the compartment_transfer
    subtrees. Keep the backbone, sampling, image budget, main balanced BCE,
    optimizer, schedule, labels, prediction interface, and evaluation fixed.
    Model and spatial-token edits may implement disease features, attention,
    routing, shared/private components, or auxiliary feature access. Dataset,
    preparation, and augmentation edits are limited to supporting anatomical
    metadata and consistent coordinate/orientation plumbing for the assigned
    mechanism; preserve decoding, filtering, selected slices, valid-region
    accounting, augmentation distributions, and study exposure. Lightning edits
    may connect training-only transfer objectives and diagnostics; preserve main
    BCE, validation, optimizer/scheduler, checkpoint selection, and accounting.
    All preparation and auxiliary computation must run inside measured training
    on training data only. Record source/configuration, changed identity members,
    mechanism diagnostics, and parameter/compute costs. Return prepared or blocked.
    Use the existing environment for static checks. No tests or GPU work by agents.
  researcher_instructions: >-
    The user's scope is: some diseases appear lateral and medial so they should
    share some patterns that the model should be able to exploit. Explore distinct
    mechanisms across feature learning, anatomical assignment, attention, flexible
    sharing, and training supervision, within the fixed recipe. Read prior-work.md
    and the latest compartment-control and related adapter artifacts before
    ranking or proposing work; never duplicate an externally completed or active
    adapter arm. Distinguish shared morphology from co-occurrence, added capacity,
    and additional task weight. Historical failures concern specific mechanisms,
    not the whole hypothesis. Both disease families remain in scope. Do not pad
    the queue with coefficient sweeps or rename rejected implementations.
