  developer_instructions: Improve meniscus and medial/lateral OA compartment predictions through disease-pattern
    sharing, anatomical assignment, knee-side/position encoding, or an assigned attribution control. Both
    meniscus and medial/lateral OA are in scope. Classifier tying is allowed for an assigned proposal,
    but is not required across the campaign; meniscus-only experiments do not restrict the broader scope.
    The adopted reference is learned anatomical family strength with fixed 20 mm width and independent
    heads. Preserve it when stacking; explicitly justify replacement when substituting. The misnamed compartment-control
    run is rejected shared-adapter evidence. Do not restore its adapter modes or queue the retired independent
    arm. Configuration-only candidates require a concrete mechanism or ablation, not a generic sweep.
    New settings belong under the compartment_transfer subtrees. Keep the backbone, sampling, image budget,
    main balanced BCE, optimizer, schedule, labels, prediction interface, and evaluation fixed. Model
    and spatial-token edits may implement disease features, attention, routing, shared/private components,
    or auxiliary feature access. Dataset, preparation, and augmentation edits are limited to supporting
    anatomical metadata and consistent coordinate/orientation plumbing for the assigned mechanism; preserve
    decoding, filtering, selected slices, valid-region accounting, augmentation distributions, and study
    exposure. Lightning edits may connect training-only transfer objectives and diagnostics; preserve
    main BCE, validation, optimizer/scheduler, checkpoint selection, and accounting. All preparation and
    auxiliary computation must run inside measured training on training data only. Record source/configuration,
    changed identity members, mechanism diagnostics, and parameter/compute costs. Return prepared or blocked.
    Use the existing environment for static checks. No tests or GPU work by agents. User scope amendment
    2026-09-21 explicitly includes side encoding and anatomy-supervised compartment assignment; earlier
    deferrals of image-based side inference do not block these scoped proposals. Reuse the adopted trusted
    knee_side_sign, knee_center_x_mm, patient_maps and geometry validity. Unknown side must remain explicit;
    do not guess from disease labels, report text, study identifiers or validation outcomes. Preserve
    the audited resolver and existing decoding/filtering. Follow prior-work.md#revisit-queue-on-learned-strength
    for the user-selected revisits. Retain learned anatomical strengths, fixed 20 mm width and position-rich
    pooling unless a reviewed proposal explicitly replaces named behavior. Do not restore appearance-only
    pooling or the rejected pooled adapter. Historical source is evidence to adapt, never the new implementation
    parent.
  researcher_instructions: The current user objective is to improve compartment-specific meniscus and
    medial/lateral OA predictions. Disease-pattern sharing, knee-side and anatomical-position encoding,
    and anatomy-supervised assignment are all in scope. Side encoding does not have to introduce additional
    disease sharing. Read prior-work.md#revisit-queue-on-learned-strength and the latest manual anatomical-attention
    results before proposing or reranking. Prioritize the user-selected historical adaptations and side-encoding
    proposal; reconsider them only on concrete new evidence and preserve provenance. Historical failures
    are implementation-specific, not bans on a whole direction. The adopted learned-strength run is the
    comparison incumbent, with its recorded seed. Distinguish shared morphology, spatial assignment, co-occurrence,
    added capacity and additional supervision. Do not repeat the dormant zero-gated family channel, removed
    appearance-only pooling, or rejected adapter unchanged. No coefficient sweeps or renamed failed implementations.
    Respect the fixed recipe, budget and adoption rule.
