ideas:
- id: active-gradient-attribution-exclusivity
  mechanism_id: linear-zero-margin-attribution-exclusivity
  parent_idea_id: anatomical-attention-attribution-exclusivity
  title: Correct inactive attribution exclusivity with an active linear zero-margin penalty
  opportunity: The anatomical-attention exclusivity run repeated every label AUC and BCE exactly for its
    first three epochs because its added loss was zero. Its later epoch-mean weighted penalty was at most
    about 1.35e-6 against BCE about 0.47. A margin of 1.0 suppressed virtually all positive logit drops.
    This is an inactive-mechanism result, not evidence that effective exclusivity cannot help. The user
    explicitly requested a corrected future attempt.
  mechanism: 'Retain the post-anatomical-attention sibling erasure, but replace the dormant squared hinge
    y * relu(z_own - z_erased - 1)^2 with the linear zero-margin penalty y * relu(z_own - z_erased).
    The zero deadband makes every harmful positive-logit drop eligible, and the linear form avoids another
    vanishing gradient when those drops are small. Keep detached sibling masks, observed-cell reduction,
    both families and unchanged main BCE. Use the archived coefficient 0.05 as one fixed attempt, not a
    validation-tuned sweep. Log positive-drop activation, raw and weighted penalty for interpretation only;
    run through the ordinary full-budget path with no monitor or special early stop. A zero remaining
    attention mass must be handled explicitly and excluded from spurious activation. No extra data passes
    or optimizer updates.'
  precedents:
  - autoresearch/campaigns/medial-lateral-transfer/prior-work.md#revisit-queue-on-learned-strength
  - autoresearch/anatomical-attention.md
  - autoresearch/checkpoint-closure.md
