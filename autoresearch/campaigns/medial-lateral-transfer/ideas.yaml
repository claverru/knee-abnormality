- id: compartment-pair-channel-rotation
  mechanism_id: fixed-pair-channel-rotation-level-lateralization
  parent_idea_id: null
  title: Rotate each compartment pair's two output channels by 45 degrees so one channel
    carries family level and the other carries lateralization, adding no parameters
    and no compute
  opportunity: 'New cheap diagnostic on the pinned reference predictions (sha d8de136...,
    fold 0, 904 studies, recomputed from the frozen fold tables): the Medial/Lateral
    OA scores are nearly redundant (Spearman 0.881; lateral score ranks medial labels
    at 0.850 and medial score ranks lateral labels at 0.832, against own 0.908/0.869;
    lateral OA AUC falls to 0.760 inside medial-positive studies). Meniscus is the
    opposite regime (Spearman 0.483; cross AUC 0.711 and 0.597). Derived channels
    are already meaningful: the pair mean ranks any-compartment disease at 0.911 (meniscus)
    / 0.902 (OA), and the pair difference ranks side on exclusive studies at 0.968
    / 0.862. Private per-target capacity is tiny -- one 128-d attention row plus one
    256-d head row -- yet the OA pair spends both rows on duplicated detection and
    the meniscus pair shares nothing. Every campaign arm so far added a module on
    top of two independent channels; the two measured ones were near no-ops with small
    negative shifts.'
  mechanism: 'Keep the twelve attention scorers, pooled vectors, head, biases and
    main BCE exactly as they are. For each evaluator pair, reinterpret the pair''s
    two existing output channels as a level channel z_a and a lateralization channel
    z_b, and emit the two public logits as a fixed 45-degree rotation: z_medial =
    (z_a + z_b)/sqrt(2), z_lateral = (z_a - z_b)/sqrt(2). Nothing else changes: each
    channel still has its own attention row, its own pooled vector, its own head row
    and bias, and the rotation is applied after the base logits (and the optional
    residual readout) are formed, inside the existing float32 block. The map is a
    bijection of R^2, so no prediction pattern is excluded and neither compartment
    is forced toward the other. What changes is the training signal: both compartments''
    labels now train z_a with the same sign, so every family positive from either
    side trains one shared detector, while studies whose two labels differ are the
    only ones that drive z_b. Detection stops being learned twice from half the positives,
    and the pair''s limited private capacity is re-allocated to the side decision
    the diagnostics show is weakest for OA. The orthonormal 1/sqrt(2) factor preserves
    the initial logit variance, so the reference''s initialization and loss scale
    for those targets are unchanged at step 0 and no module bootstraps from zero:
    training and inference share exactly the same math.'
