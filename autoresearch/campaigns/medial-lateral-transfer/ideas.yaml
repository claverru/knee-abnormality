- id: bilateral-order-statistic-evidence
  mechanism_id: side-invariant-half-knee-order-statistic-shared-evidence
  parent_idea_id: null
  title: 'Add side-invariant bilateral evidence to each compartment logit: pool one
    family-shared detector over the two unlabeled image halves and read its max and
    min, so disease in both halves is visible without deciding which half is medial'
  opportunity: 'The weakest measured discrimination separates both-positive studies
    from exclusive negatives in the same family (scratch/coupling.py):

    - lateral OA within medial-positive studies: AUC 0.760 (186 both-positive vs 143
    medial-only);

    - lateral meniscus: 0.879 (75 vs 281);

    - medial OA within lateral-positive studies: 0.826;

    - medial meniscus: 0.908.


    Most lateral positives are both-positive (OA 186/241, meniscus 75/138). Softmax
    pooling within a row behaves like a max and cannot express how much evidence the
    less-diseased region holds unless the row first infers side and localizes the
    compartment. The minimum over the two halves of the knee is a side-invariant statistic
    that is high exactly when both compartments are diseased.'
  mechanism: "Each family f gets one shared attention row u_f and value row v_f over\
    \ the existing mil_norm tokens and shared attention hidden layer. For every study\
    \ and series, split the tokens into unlabeled halves A and B, excluding a \xB1\
    \u03B4 midline band:\n- coronal/axial: by the prepared anchor x;\n- sagittal:\
    \ by the sign of the slice offset.\n\nWithin each half, softmax attention pools\
    \ the evidence e_H = \u03A3 a_n v_f\xB7t_n. Per series, hi = max(e_A, e_B) and\
    \ lo = min(e_A, e_B), averaged over series that cover both halves. Then z_c =\
    \ z_c^private + \u03B1_c\xB7hi_f + \u03B2_c\xB7lo_f, with 8 zero-initialized free\
    \ scalars, so training starts exactly at control B.\n\nThe order statistics are\
    \ symmetric in the halves, which makes the channel invariant to reflection, knee\
    \ side and half labelling. It never assigns evidence to a side. hi carries the\
    \ shared family level; lo carries bilateral disease; the private rows remain the\
    \ only side-specific evidence. All four joint-label groups stay representable,\
    \ and the public output is still 12 logits."
