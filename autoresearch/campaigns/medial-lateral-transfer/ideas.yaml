- id: conserved-evidence-compartment-assignment
  mechanism_id: token-evidence-conservation-compartment-split
  parent_idea_id: null
  title: Detect family disease once per token with a shared detector, then split each
    token's evidence between the two compartments with a conserved, competing assignment
    gate
  opportunity: 'A new CPU probe of the reference''s saved fold-0 predictions (904
    studies) shows the pair predictions are far more collinear than the labels they
    predict. OA: predicted-logit Spearman 0.881 against soft-label Spearman 0.674;
    the Medial OA score alone ranks the Lateral OA label at AUC 0.832 against the
    lateral head''s own 0.869, and lateral AUC falls to 0.760 inside the 329 medial-positive
    studies versus 0.840 in the 575 medial-negative ones (both/medial-only/lateral-only/neither
    = 186/143/55/520). Meniscus is milder but the same sign: 0.483 vs 0.331, cross-AUC
    0.711, margin AUC 0.971 vs OA 0.866. So the model already transfers a study-level
    family factor and is weakest exactly where the user''s hypothesis matters: deciding
    whether the other compartment is also involved. No mechanism in the registry makes
    evidence a conserved quantity that the two compartments must compete for, which
    is the direct expression of ''same pattern, different place''. Caveat: label noise
    deflates label correlation and shared nuisance inflates prediction correlation,
    so this motivates rather than proves.'
  mechanism: 'Retain the twelve independent attention scorers, pooled vectors, heads
    and the main BCE. Per evaluator family f, add three small token-level modules
    over the existing mil_norm tokens: a saliency scorer s_f, a disease evidence head
    e_f (Linear 256->32, GELU, Linear 32->1, output zero-initialised) and an assignment
    gate a_f (Linear 256->32, GELU, Linear 32->1, sigmoid). Inside a study, pi = softmax(s_f)
    over that study''s visually valid tokens. Then dz_medial = sum_n pi_n * a_n *
    e_n and dz_lateral = sum_n pi_n * (1 - a_n) * e_n, added to the two existing logits.
    Because a_n + (1 - a_n) = 1, the family total dz_medial + dz_lateral = sum_n pi_n
    e_n is compartment-agnostic: detection is shared and computed once, and the only
    compartment-specific degree of freedom in the new path is where the evidence is
    placed. Both compartments'' positives therefore train one detector, while a per-token
    competition, not a second detector, produces the difference. Zero-initialised
    evidence output makes the model reproduce the reference exactly at initialisation;
    the twelve public logits, their order and the inference entrypoints are unchanged.
    The gate must infer side from appearance and position, which the model already
    does well (meniscus margin AUC 0.971).'
  precedents:
  - 'New probe (this report): reference `outputs/training/overnight-20260919T235434Z-8ol_1c30/runs/13-control-repeat/fold_0/validation_predictions.csv`
    against `data/folds/all_5fold_v3/{targets,studies}.csv`; script and output at
