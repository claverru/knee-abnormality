- id: appearance-value-tied-meniscus-classifier
  mechanism_id: geometry-free-pooled-value-with-tied-family-classifier
  parent_idea_id: null
  title: Pool geometry-free appearance for the meniscus pair and read both compartments
    with one shared classifier, leaving anatomical assignment entirely to attention
  opportunity: 'Tied classifiers with independent attention (1A/1B) are the only historical
    arm that improved both meniscus targets (+0.002737 medial, +0.003406 lateral)
    and the within-study meniscus margin (0.980173 vs 0.972321); the losses there
    were on unrelated targets and public score, not on the intended family. The new
    reference diagnostic shows the current model transfers almost nothing between
    meniscus compartments (medial score ranks lateral labels at 0.597, Spearman 0.483),
    so there is headroom if shared morphology exists. But under this architecture
    a weight tie is not a morphology tie: the pooled value is a weighted mean of mil_norm(features
    + position_1d + position_2d + plane + contrast), so the position embeddings ride
    into the pooled vector and a single shared weight vector can still separate the
    compartments by where the attention mass sat. A tie alone therefore repeats 1B
    without testing shared appearance. Separating selection information from classified
    content is the untested piece.'
  mechanism: 'For the meniscus pair only: keep the attention scores exactly as they
    are, computed from the unchanged full token (features plus all four embeddings),
    so location, slice position, plane and contrast still decide where each compartment
    looks. Change what those attention weights pool for the two meniscus channels:
    pool a geometry-free value token, mil_norm(features + plane + contrast), which
    drops position_1d and position_2d from the classified content while retaining
    acquisition context needed to interpret intensity. Then read both compartments
    with one shared 256-d weight vector and free per-compartment biases: z_medial
    = w_meniscus . pooled_appearance_medial + b_medial, z_lateral = w_meniscus . pooled_appearance_lateral
    + b_lateral. The ten other targets keep the current path unchanged. The two compartments
    can now differ only through which appearance they select and a constant offset,
    so the shared classifier is forced to be a morphology detector and the compartment
    decision is carried by attention, which is what anatomy determines. Head parameters
    decrease by 256, so any gain cannot be added capacity; it also makes the compartment
    distinction structurally dependent on attention quality, which is the mechanism''s
    main risk.'
