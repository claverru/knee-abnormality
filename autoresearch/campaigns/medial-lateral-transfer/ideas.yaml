- id: anatomical-medial-axis-mirror-attention
  mechanism_id: side-signed-medial-axis-mirror-tied-attention
  parent_idea_id: null
  title: Give every token a side-signed medial axis and tie the two compartments'
    attention to one shared scorer read with mirrored geometry
  opportunity: 'Medial versus lateral is a geometric distinction, but the model holds
    no variable that says which direction is medial. Patient +X points to the patient''s
    left, so the medial direction depends on knee side; reflection augmentation mirrors
    half of the eligible studies while preserving target identity; and the patient-space
    token points were retired with the attention prior. Each of the twelve attention
    scorers must therefore rediscover laterality from appearance alone, and all compartment
    sharing so far has been attempted in free parameter space with no anatomical anchor.
    The missing variable is cheap: `PreparedSeries.patient_maps` is already computed
    in preparation and dropped at collate, and the audited coordinate rule assigns
    knee side for 96.14% of studies (fold 0: 862 of 904 assigned, 42 unknown), agreeing
    with 2,052 of 2,067 explicit tag references on qualified studies.'
  mechanism: 'Plumb the existing per-slice patient maps into the batch and give every
    token a scalar signed medial offset m = s * (X_patient(token) - X_center(study)).
    X_patient comes from mapping the token''s prepared anchor, already computed in
    `feature_geometry`, through that slice''s patient map, so reflection and affine
    augmentation are handled by the existing inverse-affine and channel-reversal path
    and mirrored studies receive anatomically correct offsets. s = +1 for a right
    knee, -1 for a left knee from the audited coordinate rule (at least two series,
    |median centre X| > 40 mm, sign consensus), computed once per study from the loader''s
    full index so it is deterministic and independent of epoch sampling; s = 0 abstains
    and the new term vanishes. Per family, add one shared attention term evaluated
    with mirrored geometry: score_medial += a(token, +m) and score_lateral += a(token,
    -m), output zero-initialised. One scorer serves both compartments and the two
    attention maps are mirror images of each other, so every study trains the shared
    selection rule in both roles.'
  precedents:
  - 'docs/metadata/knee-side-policy-audit.md: 96.14% assignment, fold-0 counts, coordinate
    rule and abstentions.'
  - 'docs/metadata/knee-side-coordinate-investigation.md: positive median physical
    centre X means left knee; agreement by threshold and vendor.'
  - 'docs/modeling/retired-side-and-compartment-variants.md#knee-side-embedding: study-constant
    side vector tied the champion and its checkpoint ignored side; archived sources
    available.'
  - 'docs/validation/results/2026-09-15-attention-prior-result.md: per-target Gaussian
    coordinate priors regressed 0.002177 and were retired with the model''s patient
    points; the priors barely moved from initialisation.'
  - 'docs/research/knee-side-and-location.md#3-use-coordinates-with-a-common-anatomical-orientation:
    side-signed patient X as an unimplemented approach, owned by docs/backlog/big-bets.md#position-and-knee-side.'
  - 'docs/history/sharing/2026-09-13-compartment-attention-diagnosis.md and docs/research/medial-lateral-transfer.md#1c-imposed-a-real-attention-constraint:
    1C''s learned compartment vector is explicitly not a fixed patient-coordinate
    sign or an image-half mask.'
  - 'src/knee_abnormality/data/preprocessing/preparation.py: `patient_maps` already
    computed per triplet channel; `modeling/spatial_tokens.py:feature_geometry` already
    returns prepared anchors.'
  - 'Equivariance literature, e.g. group-equivariant and reflection-equivariant designs
    (https://arxiv.org/pdf/2203.16787): mirrored parameter sharing as a design principle,
    not knee-specific evidence.'
  novelty: Supplies the missing anatomical variable and uses it to tie the pair, instead
    of adding a study-constant side vector (retired, ignored by its checkpoint) or
    a per-target Gaussian coordinate prior (regressed). Unlike 1C, the compartment
    contrast is a known patient-coordinate sign rather than a free vector shared across
    diseases, and it is per family. Unlike the rejected adapter, sharing is at the
    selection stage with the compartments distinguished by geometry rather than by
    separate parameters. Plain side-signed coordinates alone remain the position/knee-side
    backlog's idea; the campaign contribution is the mirror-tied shared scorer.
  coverage: 'Unknown-side studies abstain and lose the term entirely, so no wrong
    geometry is imposed there. The two added terms are additive per-target scores,
    not a partition, so neither, medial-only, lateral-only and both-positive remain
    representable and both compartments may be positive. Cohort, study visits, triplet
    counts, sampling, decoded pixels, labels and masks are unchanged; only preprocessing_identity
    may differ. Residual risk: the coordinate rule is an acquisition convention, so
    a wrong sign flips the anatomical axis for that study; realized side coverage
    per split must be recorded as a run artifact.'
  exploitation: 'Both compartments'' positives train one selection rule, ''disease
    evidence on this side of the joint'', so the rare compartment inherits localization
    learned largely from the common one while each main head keeps its own appearance
    weights. This is the assignment half of the user''s hypothesis: shared pattern
    recognition, correct per-compartment prediction.'
  budget: 'One extra attention branch over roughly 10.2k tokens per step (8 studies
    x 26 triplets x 49 tokens at 224 px, stride 32): about 3.4e8 MACs against roughly
    1.5e11 backbone MACs, an estimated 0.2% of step time, with about 5 MB of extra
    activations against the recorded 21.4 GB peak. Collate adds a small per-series
    geometry tensor and a CPU median; the side rule is a deterministic geometric computation
    over metadata the loader already indexes, with no fitted teacher, no extra decoding,
    no extra images and no extra encoder pass. Token-level work is the main budget
    risk in this proposal and must be timed against the 1,797 s ceiling before acceptance.'
  implementation: 'Adds to existing behaviour; removes nothing and keeps every current
    embedding, head and loss. Touches `data/preprocessing/preparation.py` (expose
    the patient-X row), `data/dataset.py` (collate the geometry and resolve the per-study
    side once at index time), `modeling/spatial_tokens.py` and `modeling/model.py`
    (token offsets and the mirrored scorer), with the new code under `src/knee_abnormality/modeling/compartment_transfer/`
    and configuration under `model.compartment_transfer` and `data.compartment_transfer`.
    Pair identity and rule thresholds live in config as target indices and constants
    because the model constructor receives only `target_count` and `inference/checkpoint.py`
    is not editable. Decoded pixels, cohort membership and realized triplet counts
    must be byte-identical in the baseline replay; only `preprocessing_identity` may
    move. Zero-initialised output keeps initialisation at the reference; validation
    stays deterministic at multiplier 1. If an incumbent is accepted during development,
    rebase onto its source and re-review: this stacks with a pooled-level or training-only
    mechanism, so measure A+B against the accepted A and declare nothing removed.'
  open_choices: Which triplet channel defines the token offset (middle anchor versus
    mean of three). Whether m enters as a raw normalised scalar, a sinusoidal encoding,
    or a learned scale on a shared direction. Whether the shared term modifies attention
    only, or also gates the pooled readout. Family scope (both pairs versus meniscus
    only). Keep the audited 40 mm qualification threshold rather than tuning it. Whether
    explicit laterality tags are worth the extra loader plumbing over the coordinate-only
    rule; the default is coordinates only.
  dependencies: []
  priority_rationale: The only proposal that adds information rather than parameter
    structure, and the campaign's clearest instance of anatomical assignment with
    genuine parameter sharing. Its upside is the largest of the three, but it carries
    the real implementation cost, a side-rule error risk, token-level budget exposure
    and two adverse precedents (ignored side embedding, regressed attention prior),
    so it should follow a cheap pooled-level probe.
  status: completed
  created_revision: 22
  ranking_rationale: 'Both proposals are admitted: dependencies are empty, each states
    an explicit in-scope transfer mechanism, and both are weight-space designs that
    remove degrees of freedom rather than adding capacity, so a gain cannot be read
    as added capacity or added task weight. Neither restores the rejected pooled adapter
    (that acted on pooled features feeding independent heads; these act before/inside
    attention and delete the independent lateral pathways).


    Queue change: the two proposals enter above both previously queued ideas. Reason
    is the new checkpoint-derived structure (attention, not head, carries side organisation;
    within-family compartment cosines 0.054/0.243 against a 0.138 off-diagonal mean),
