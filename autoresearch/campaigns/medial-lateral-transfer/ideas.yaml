- id: sibling-conditional-attention-adversary
  mechanism_id: equalized-odds-sibling-label-adversary-on-compartment-attention
  parent_idea_id: null
  title: 'Make each compartment''s pooled evidence uninformative about its sibling''s
    label beyond its own label: a label-conditioned adversary with gradient reversal
    confined to that compartment''s attention row'
  opportunity: "Pair logits are over-coupled relative to the labels: 0.854 against\
    \ ~0.51 for OA, and 0.389 against 0.13\u20130.22 for meniscus. Lateral readouts\
    \ rank sibling-diseased negatives worst (0.722 OA, 0.852 meniscus). Leakage can\
    \ be spatial, which the hemifield gate addresses, or statistical: the 256-d pooled\
    \ vector carries the sibling's disease through receptive-field overlap (0.30 opposite-half\
    \ sensitivity) and knee-level degeneration. BCE rewards that leakage whenever\
    \ co-occurrence is predictive, and nothing penalises it. This route needs no orientation,\
    \ so it avoids the side-inference question."
  mechanism: "There are four directions c\u2192s (two families \xD7 two directions).\
    \ For each, a linear adversary A_c reads [p\u0303_c, y_c] and predicts the sibling\
    \ label y_s with BCE on soft targets.\n\np\u0303_c is the compartment's pooled\
    \ vector recomputed with stop-gradient tokens and a stop-gradient shared attention\
    \ hidden layer. It is numerically identical to the main pooled vector, but its\
    \ graph reaches only that compartment's attention row u_c and bias. A gradient-reversal\
    \ layer sends \u2212\u03BB\u2202L_adv to u_c, while the adversary itself minimises\
    \ L_adv.\n\nConditioning on y_c (equality of odds) removes only information about\
    \ the sibling beyond what the compartment's own label implies. Genuine own-compartment\
    \ disease stays usable; medial disease seen through the lateral attention does\
    \ not. Shared morphology stays in the shared token space and the heads, and the\
    \ adversary pushes each compartment's evidence selection toward its own compartment.\
    \ It is training-only: the inference path and the twelve public logits are unchanged."
  precedents:
  - 'Zhang, Lemoine & Mitchell 2018 (AIES), adversarial debiasing: an adversary that
    also receives the true label enforces equality of odds.'
  - 'Ganin & Lempitsky 2015: the gradient-reversal layer.'
  - 'Singh et al. CVPR 2020, ''Don''t Judge an Object by Its Context'': contextual
    bias from co-occurring categories in multi-label classification.'
  - "cross-compartment-attribution-exclusivity (\u22120.0007): its spatial erasure\
    \ penalty cut cross-talk (0.636\u21920.543) but margins did not improve. This\
