- id: anatomy-supervised-compartment-evidence-split
  mechanism_id: geometry-supervised-detached-assignment-gate-for-shared-family-evidence
  parent_idea_id: conserved-evidence-compartment-assignment
  title: Split a family-shared token disease detector between compartments with one
    anatomical gate trained only on geometry-derived medial/lateral token labels and
    detached from the disease loss
  opportunity: "The conserved split is the one tested design whose shared part is\
    \ prevalence-symmetric by construction. Its per-pair gate, however, learned assignment\
    \ only from study labels, and the compartment margins degraded (meniscus \u2212\
    0.0145 [\u22120.0283, \u22120.0034]; OA \u22120.0272, wide interval). The most\
    \ plausible cause is weak, co-occurrence-exposed assignment, which is also the\
    \ reference's measured OA deficit. Geometry can provide dense assignment labels\
    \ for free: patient maps, reflection-corrected prepared anchors and a coordinate\
    \ side rule already exist in the anatomical-medial-axis arm. New estimate: re-applying\
    \ that rule (\u22652 series agreeing in sign, 40 mm qualification) to the 128-study\
    \ header sample resolves 124/128 (96.9%; 62 left, 62 right). That is approximate;\
    \ it uses header image centres, not the arm's selected records. The axis arm fed\
    \ geometry into inference and failed on the prediction path. Here geometry is\
    \ only a training target."
  mechanism: "One per-token gate g(t)=\u03C3(MLP(token)), shared by both families,\
    \ is trained with a small auxiliary token BCE to predict 'medial of the knee midline'.\
    \ The label is sign(side\xB7(patient_x \u2212 knee_centre_x)). Side-unknown studies,\
    \ invalid-pose triplets and a \xB1\u03B4 mm midline band are masked out. Labels\
    \ follow the tissue under reflection and affine augmentation. For each family\
    \ f, a shared evidence head e_f (zero-initialised output) and a saliency \u03C0\
    _f (softmax over study tokens) give \u0394z_medial = \u03A3\u03C0_f\xB7sg(g)\xB7\
    e_f and \u0394z_lateral = \u03A3\u03C0_f\xB7(1\u2212sg(g))\xB7e_f. The stop-gradient\
    \ means disease labels cannot pull assignment toward a co-occurrence shortcut.\
    \ e_f is trained by both compartments' positives (shared morphology), with attribution\
    \ fixed by anatomy. At inference the gate is predicted from image content, so\
    \ no metadata is needed. The four private pathways stay unchanged, and neither,\
    \ medial-only, lateral-only and both remain representable."
  precedents:
  - "conserved-evidence-compartment-assignment (inconclusive: macro \u22120.00332,\
    \ margins degraded, below the reference at every epoch). Identical split structure;\
    \ its gate was per pair, learned from disease labels, and not detached."
  - 'anatomical-medial-axis-mirror-attention (invalid): its geometry plumbing and
    invalid-pose repair are reusable. It failed because model forward read keys absent
    from engine MODEL_BATCH_KEYS. This design reads them only in training_step.'
  - 'Tack et al. 2021, Front. Bioeng. Biotechnol. 10.3389/fbioe.2021.747217 (cited
    in docs/research/medial-lateral-transfer.md): an auxiliary localization objective
    improved meniscus classification on OAI without inference-time localization.'
  - "Knee-side embedding (retired; the checkpoint ignored side given as an input)\
    \ and per-target Gaussian coordinate attention priors (\u22120.002177, retired).\
    \ This design supervises anatomy instead of injecting it, and imposes no fixed\
    \ prior on target attention."
  novelty: 'This is the first campaign arm whose compartment assignment is supervised
    by anatomy rather than inferred from disease labels. It differs from the conserved
    split only in the gate: shared across families, supervised by geometry, and detached
    from disease gradients. That gives a sharp test of whether assignment was that
    design''s failure. Because the supervision is disease-free, it does not reinforce
    the already over-coupled cross-family lateralization (0.787 versus 0.305 for the
    labels).'
  coverage: All four compartment targets in both families, and all three planes; sagittal
    tokens get their label from the slice's patient X. Estimated gate supervision
    is about 97% of studies. Fold-0 side coverage, and the fractions of midline-band
    and invalid-pose tokens, must be recorded as run artifacts. If abstention is large,
    the gate is weakly trained.
  exploitation: Log gate accuracy and supervised-token coverage every epoch; an unlearned
    gate makes a null result uninterpretable. Read compartment margins, lateral-OA
    AUC within medial-positive studies, and family means alongside the macro verdict.
    If the arm wins, the matched control keeps the same module and weight but supervises
    the gate on an anterior/posterior (patient-Y) sign. That separates mediolateral
    grounding from generic geometric regularisation. The conserved arm is a different-seed
    comparison, not a matched one.
  budget: "Gate 256\u219232\u21921, plus per family a 256\u21921 saliency and a 256\u2192\
    32\u21921 evidence head, over about 10.2k tokens; one token BCE; about 25k parameters.\
    \ Collation adds per-triplet 3\xD73 middle patient maps and two study scalars.\
    \ Side resolution is deterministic, RNG-free per-study work and cannot alter sampling\
    \ or the sealed triplets. The conserved split measured 1,596.6 s with three comparable\
    \ heads; one extra small MLP and a BCE should stay well under 1,797 s. Timing\
    \ still needs measurement."
  implementation: "Pure addition to historical-control; removes nothing. dataset.py:\
    \ reuse the axis arm's _resolve_knee_side and its collation of patient_maps, knee_side_sign\
    \ and knee_center_x_mm. model.py: compute prepared anchors in a separate helper\
    \ and return them in the encoded dict; do not change feature_geometry's return\
    \ arity, because out-of-tree callers break. Put the split module in the float32\
    \ block. forward must never read the new batch keys. lightning.py training_step:\
    \ build the token labels from the Lightning-transferred batch and the anchors,\
    \ add weight \xD7 masked BCE, and log gate accuracy and coverage. Config goes\
    \ under model.compartment_transfer and trainer.compartment_transfer; parameters\
    \ live under model.* and are rebuilt from config. If shared-family-level-channel\
    \ is accepted, re-express this as its replacement, since both add family-shared\
    \ evidence and stacking confounds attribution, then re-review. If contralateral-mirror-token-comparison\
    \ is accepted, stack."
  open_choices: "Gate weight, fixed before launch and well below BCE (e.g. 0.05).\
    \ Midline band \u03B4 (e.g. 10 mm). Gate input (normalised tokens by default)\
    \ and linear versus 32-wide MLP. Conserved split (default) versus zero-initialised\
    \ per-compartment scales. Whether to keep the 40 mm side qualification. Scope\
    \ flag for the orchestrator: knee-side-and-location.md records image-based side\
    \ inference as deferred by the user. The gate learns image-based medial anatomy;\
    \ the campaign authorises anatomical assignment and metadata plumbing, but the\
    \ orchestrator should confirm this fits."
  dependencies: []
  priority_rationale: Rank second. It directly tests the most plausible cause of the
    only prevalence-symmetric sharing arm's failure, and targets the measured OA assignment
    deficit with dense, disease-free supervision. It sits below the mirror comparison
    because of its heavier plumbing (dataset, anchors, training-step loss), the axis
    arm's prediction-path failure history, the scope flag, and an unmeasured risk
    that the auxiliary reshapes the shared backbone.
  status: queued
  created_revision: 209
  ranking_rationale: "Completion of attention-owned-compartment-gradient-routing:\
    \ the fixed rule gives reject. Macro \u0394 is \u22120.00392, 95% CI [\u22120.00769,\
    \ \u22120.00027]. The gates the developer flagged as pending are now measured\
    \ and pass. Compute was 1,617 s against a 1,797 s ceiling. Triplets, visits and\
    \ cohort hashes match exactly, and validation selection is identical in every\
    \ epoch.\n\nThe escalation concern was the confound with gradient mass, and the\
    \ logged kept share resolves it against the mechanism:\n- Kept share starts at\
    \ about 0.51 in both families. Meniscus rises to 0.80 by epoch 9, but OA reaches\
    \ only 0.60.\n- So for most of training the four compartment labels sent roughly\
    \ half of their trunk gradient. In the early epochs the intervention was close\
    \ to a uniform 0.5 scale on compartment trunk credit.\n- Medial and lateral kept\
    \ shares are identical by construction, since \u03A3a_m\xB2/(a_m+a_l) \u2212 \u03A3\
    a_l\xB2/(a_m+a_l) = \u03A3a_m \u2212 \u03A3a_l = 0. This is not a logging bug.\n\
    \nRouting did not buy specificity:\n- Meniscus compartment margin AUC fell from\
    \ 0.9712 to 0.9615, and OA's was flat (0.8661 to 0.8650).\n- Lateral cross-talk\
    \ did not improve (meniscus 0.636 to 0.638, OA 0.622 to 0.638).\n- Both family\
    \ means fell (meniscus \u22120.0069, OA \u22120.0036), and so did the other eight\
    \ (\u22120.0033).\n\nQueue change: I admitted the anatomy-supervised split. Its\
    \ dependencies are satisfied. It adds a shared evidence path with disease-free,\
    \ geometry-supervised assignment, so it targets the measured assignment weakness\
    \ without removing any compartment credit. I ranked it right after the reserved\
    \ head.\n\nWithin-knee ranking is additive supervision, so it moves above the\
    \ two subtractive trunk or attention-gradient interventions. Those two (the sibling\
    \ adversary and the discordant projection) share the direction this run weakened,\
    \ withholding or reversing compartment gradient on the shared trunk. They stay\
    \ queued, because each acts more narrowly than uniform-scale routing: the adversary\
    \ is confined to attention rows, and the projection to discordant studies and\
    \ conflicting components."
- id: permutation-invariant-half-knee-mil
  mechanism_id: side-agnostic-image-half-bag-mil-with-permutation-invariant-compartment-labels
  parent_idea_id: null
  title: Train one family-shared token lesion detector on unlabeled image halves with
    a permutation-invariant loss, so exclusive studies teach compartment-local evidence
    without knowing which half is medial
  opportunity: 'New CPU decomposition of the reference predictions (scratch/crosstalk.py).
    Lateral OA scores AUC 0.909 against medial-negative negatives but only 0.722 against
    medial-only negatives (n=143). Lateral meniscus: 0.924 vs 0.852 (n=281). Medial
    OA: 0.921 vs 0.778 against lateral-only negatives (n=55). Pair logit correlation
    is 0.854 for OA against label correlation 0.51-0.56, and 0.389 for meniscus against
    0.13-0.22. Arms that raised it lost (scratch/coupling.py; mirror-exchange 0.87/0.98).
    This suggests trunk tokens carry knee-level family burden. Main BCE supervises
    only pooled vectors: nothing tells the tokens that one half of the knee is clean
    in an exclusive study. Training fold 0 has 1,429 exclusive meniscus and 769 exclusive
    OA studies. Header audit: coronal/axial columns run along patient X, and FOV centres
    sit about 2 mm from the sagittal midpoint. Image halves therefore approximate
    the compartments, but which half is medial needs knee side. Side metadata is still
    under investigation, and image-based side inference is deferred.'
  mechanism: "Training-only. Each family f gets one shared linear token detector d_f(t)\
    \ = v_f\xB7t + c_f over the mil_norm tokens. For every study and series, split\
    \ the valid tokens into two unlabeled halves A and B, excluding a \xB1\u03B4 midline\
    \ band:\n- coronal/axial: by the tissue-following prepared-image anchor x, through\
    \ the same inverse affine and reflection used for validity;\n- sagittal: by the\
    \ sign of the reflection-adjusted, series-centred slice position.\n\nEach half\
    \ gets a smooth-max score s_A, s_B of d_f. The loss per (study, series, family)\
    \ is min over \u03C0 of \u2113(s_\u03C0(A), y_med) + \u2113(s_\u03C0(B), y_lat).\
    \ \u2113 is the soft-target BCE with the targets' existing class-balance weights.\n\
    - Neither and both-positive studies make the two assignments equal, so they give\
    \ ordinary shared MIL on both halves.\n- Exclusive studies must put the disease\
    \ in one half and keep the other half clean. That is locality.\n\nOne detector\
    \ learns lesions from both compartments (shared morphology). It is side-agnostic,\
    \ and the min never resolves the side, so the method needs no side inference and\
    \ no metadata. The term is added to the unchanged BCE with one fixed small weight;\
    \ forward and predict are unchanged."
  precedents:
  - 'shared-disease-auxiliary (inconclusive): a shared detector read each compartment''s
    learned-attention pool, so it carried no locality signal and gave diffuse trunk
    loss at weight 0.3. This proposal pools by compartment-agnostic geometry instead.'
  - 'cross-compartment-attribution-exclusivity (inconclusive): an erasure penalty
    on logits over attention-defined tokens; cross-talk fell but margin did not improve.
    Here the locality supervision acts on tokens and uses geometry, not attention.'
  - 'compartment-invariant-disease-embedding (rejected): pooled contrastive loss at
    0.3 damaged the other eight labels. The auxiliary weight must stay far below BCE;
    there are no pair attractions here.'
  - 'anatomy-supervised-compartment-evidence-split (proposed, pending user confirmation):
    it needs side labels from metadata and learns side from image content. This proposal
    is side-invariant by construction.'
  - 'contralateral-mirror-token-comparison (developing): same column geometry but
    an inference-path comparison; orthogonal and stackable.'
  - 'Yu et al., Permutation Invariant Training for speaker-independent separation,
    ICASSP 2017 (arXiv:1607.00325): min-over-assignments loss when output identity
    is unobservable.'
  - 'Ilse et al., Attention-based Deep MIL, ICML 2018; Andrews et al., MI-SVM, NeurIPS
    2002: bag-level supervision of instance detectors.'
  - 'Header geometry evidence: jobs/researcher-20260921T025959Z-9d82f946/report.json'
  novelty: 'This is the first arm to supervise compartment evidence on compartment-agnostic
    image-half bags, and the first to use a loss that is invariant to label permutation.
    It turns the missing knee side from a blocker into a latent assignment. Unlike
    every earlier auxiliary, it adds a constraint the main BCE lacks: evidence for
    an exclusive disease must be locatable in one half of the knee. The detector is
    shared, so medial examples, which are 2.5 times more common for meniscus, teach
    lateral morphology without tying any private pathway.'
  coverage: "Covers both families, all three planes, and all four joint-label groups\
    \ (neither and both train shared MIL; exclusive studies train locality). The public\
    \ logits and all private attention and head rows are untouched. Weak points:\n\
