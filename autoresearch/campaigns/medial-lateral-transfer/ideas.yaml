- id: contralateral-mirror-token-comparison
  mechanism_id: intra-knee-mediolateral-mirror-token-comparison
  parent_idea_id: null
  title: Let the four compartment readouts compare each coronal/axial token with its
    mediolateral mirror token in the same image, so each compartment is read against
    the other compartment's tissue as its normal reference
  opportunity: "Measured weakness: compartment assignment, especially for OA. OA margin\
    \ AUC is 0.866 versus 0.971 for meniscus. Lateral OA AUC is 0.763 inside medial-positive\
    \ studies versus 0.840 in medial-negative ones, and the pair logits are over-coupled\
    \ (Spearman 0.881 against 0.674 for the labels). Every tested arm shares or ties\
    \ single-token evidence, pooled vectors or output channels. None compares a token\
    \ with its counterpart in the opposite compartment. Both compartments share a\
    \ normal template (condyle, plateau, meniscus), and disease in one compartment\
    \ breaks within-knee symmetry. New geometry evidence from the 128-study header\
    \ sample supports an image mirror. Columns run along patient X (|x|>0.9) in 259/259\
    \ coronal and 172/173 axial series. Coronal/axial FOV centres match the sagittal\
    \ stack's mediolateral midpoint within a median of 2.1/2.4 mm (p90 6.0/7.3 mm),\
    \ versus a 20 mm token pitch. Hypothesis, unmeasured: stride-32 effective receptive\
    \ fields do not already make this 3\u20136-column comparison explicit."
  mechanism: "In encode_batch, each coronal/axial image's 7\xD77 projected feature\
    \ tokens get their column-mirrored partner (column j \u2194 6\u2212j, a fixed\
    \ permutation) from the same image. The partner is masked when not visually valid,\
    \ and sagittal tokens get no partner. One module, shared by the four compartment\
    \ targets, computes \u0394(x) = U\xB7GELU(V_s f(x) + V_m f(x\u0304)) with hidden\
    \ width 64 and U zero-initialised. The Medial/Lateral Meniscus and Medial/Lateral\
    \ OA rows score and pool a second token stream, mil_norm(tokens)+\u0394, through\
    \ the existing attention layers and their own score and head rows. The other eight\
    \ targets keep the unchanged tokens. Transfer comes from one comparison function\
    \ trained by all four compartments' labels, with the opposite compartment as the\
    \ in-study reference. Assignment stays free through the private rows. Raw evidence\
    \ is kept, so symmetric (both-positive) disease stays representable. The operation\
    \ commutes with whole-knee reflection, needs no side metadata or new batch keys,\
    \ and never exchanges labels."
  precedents:
  - 'Chen et al., Anatomy-Aware Siamese Network, ECCV 2020 (arXiv 2007.01464): a Siamese
    network over the image and its flipped copy, with alignment and asymmetry-contrastive
    features, detected pelvic fractures at AUC 0.977 on 2,359 radiographs. This is
    bilateral anatomy, not within-joint compartments.'
  - 'Barman et al., DeepSymNet, ISBI 2019 (IEEE 8759475): explicit hemispheric asymmetry
    features for stroke on CTA. Evidence about the mechanism only.'
  - 'docs/research/knee-side-and-location.md approach 8 (relational module across
    regions): the unimplemented conceptual ancestor. This proposal is the cheapest
    concrete relational form.'
  - 'mediolateral-mirror-exchange-consistency (running): it mirrors positional anchors
    for detached-feature counterfactual pooling, as a training-only penalty. This
    proposal mirrors the tissue features themselves as an inference-path input, with
    no penalty.'
  - 'conserved-evidence-compartment-assignment (inconclusive, margins degraded) and
    disease-evidence-compartment-routing (parked): both score each token alone, with
    no cross-token comparison.'
  - 'compartment-invariant-disease-embedding (rejected): it aligned the compartments.
    This proposal instead preserves and exposes the information that distinguishes
    them.'
  novelty: This is the first campaign mechanism in which one compartment's tokens
    are evaluated against the homologous tokens of the other compartment in the same
    image. It adds an explicit within-knee comparison, not a tie or penalty. It uses
    no side metadata, adds nothing to the dataloader and leaves the eight other targets'
    forward function unchanged. It is not a renamed tied, contrast, exclusivity or
    axis arm.
  coverage: All four compartment targets in both families. All 4,407 studies in train_series_image_counts.parquet
    have coronal and axial series. Sagittal tokens, the main meniscus-tear plane,
    get no comparison by default. The meniscus effect therefore depends on how much
    compartment attention falls on coronal/axial tokens, which is unmeasured. OA assessment
    is mostly coronal, so OA is the family most exposed.
  exploitation: 'Expected signatures are a higher OA margin AUC and higher lateral-OA
    AUC within medial-positive studies, with no drop in both-positive cases; read
    these together with family means and the other eight targets. The fixed macro
    rule decides. If the arm wins, the matched attribution control is the identical
    module with a vertically mirrored partner (row flip): same capacity and operation,
    but a non-homologous partner. A study-mean partner is the alternative control.
    Neither control is prequeued.'
  budget: "About 10.2k tokens per step (8 studies \xD7 26 triplets \xD7 49). Added\
    \ work: a permutation gather, a 512\u219264\u2192256 MLP (about 0.5 GFLOP forward),\
    \ one extra 256\u2192128\u219212 attention pass and a four-target pooling einsum.\
    \ That is well under 1% of ReXNet-200 over 208 images. Comparable second-pass\
    \ arms measured 1,590 s (exchange operator) and 1,596.6 s (conserved split) against\
    \ the 1,797 s ceiling. About 49k parameters (\u22480.3%). No preparation, dataset\
    \ or sampling change, so cohort and triplet seals are unaffected. Timing still\
    \ needs measurement."
  implementation: "Pure addition to historical-control, since active_incumbent_ideas\
    \ is empty. Removes nothing. Changes: config.py adds model.compartment_transfer\
    \ (compartment target indices [[2,3],[4,5]], hidden width); a new module under\
    \ modeling/compartment_transfer; model.py builds the partner index buffer from\
    \ the feature-grid shape, uses the existing per-image plane, and builds the second\
    \ stream only for the configured targets, merging logits by index inside the float32\
    \ block. Keep the 12-logit forward and entrypoints. Add no batch keys, so inference/engine.py\
    \ MODEL_BATCH_KEYS is unaffected. Parameters live under model.* and are rebuilt\
    \ from config; attention temperature scales the attention[-1] layer both streams\
    \ use. Verify exact init parity (torch.equal on logits with U=0) and bit-identical\
    \ non-pair logits. If shared-family-level-channel or mirror-exchange-consistency\
    \ is accepted during development, rebase and stack (A+new versus new), then re-review.\
    \ With mirror-exchange, state explicitly whether its mirrored pooling reads the\
    \ \u0394 stream."
  open_choices: "Partner source: projected features before positions (default) or\
    \ normalised tokens. Where \u0394 enters: both attention and pooled value (default)\
    \ or value only. One shared module (default) or one per family. Sagittal pairing\
    \ (nearest same-series triplet at the negated slice position, within a tolerance):\
    \ enable only after its coverage under 26 triplets per study is measured. Invalid-partner\
    \ masking (default mask). Hidden width is fixed at 64 before launch; it is not\
    \ a sweep."
  dependencies: []
  priority_rationale: 'Rank first. It is the only untested mechanism class left with
    a clear anatomical rationale. It starts exactly at control B, costs little, needs
    no metadata or batch keys (avoiding the axis arm''s failure), protects the eight
    unrelated targets structurally, and has a ready attribution control. Uncertainties:
    sagittal exclusion, coarse 20 mm tokens, and whether the backbone already encodes
    the comparison.'
  status: completed
  created_revision: 209
  ranking_rationale: 'Admitted both proposals. Neither has dependencies, and both
    are in scope. Each uses one family-shared detector across the two compartments,
    which is shared morphology, and each keeps all four joint-label groups representable
    through the untouched private pathways.


    permutation-invariant-half-knee-mil goes second, right after the reserved head.
    It is the first arm to add a constraint that main BCE lacks: in an exclusive study,
    evidence must sit in one geometric half of the knee. It needs no side inference
    and changes nothing at inference time, so there is no capacity confound in the
    public path. It attacks the largest cross-talk deficit in the reference predictions:
    lateral OA scores 0.722 against medial-only negatives versus 0.909 against sibling-negative
    negatives. Earlier shared auxiliaries mostly failed because they pooled with learned
    attention (no locality) or used large weights, and this design avoids both. Remaining
    risks are trunk degradation from any auxiliary loss and misalignment between image
    halves and compartments.


    bilateral-order-statistic-evidence goes last. It adds inference-path capacity.
    Its `hi` statistic largely duplicates the running shared-family-level-channel,
    and its `lo` statistic partly overlaps contralateral comparison. So it is best
    built after both of those results exist, which lets the integration plan decide
    between stacking and replacing hi (declaring the removed idea). Its unique contribution,
    the `lo` statistic for bilateral disease, is plausible: a softmax pool behaves
    like a max and cannot express the minimum over two halves.


    The existing queued ideas keep their relative order. anatomy-supervised-compartment-evidence-split
    stays proposed while side metadata remains unresolved.'
