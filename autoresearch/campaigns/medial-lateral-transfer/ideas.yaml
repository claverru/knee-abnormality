- id: mediolateral-mirror-exchange-consistency
  mechanism_id: counterfactual-geometry-mirror-exchange-consistency
  parent_idea_id: null
  title: 'Train the compartment readouts with a counterfactual mediolateral mirror:
    a study''s lateral logit must match the medial logit of the same detached features
    placed on the other side, with no labels, no tying and no backbone gradient'
  opportunity: 'The lateral labels are the weakest of the four: Lateral OA 0.8686
    and Lateral Meniscus 0.8978, against 0.9078 and 0.9266 for the medial labels.
    They also have the fewest positives: 15.8% of training studies for lateral meniscus
    versus 40.7% for medial. Radiology reports lower MRI sensitivity for the lateral
    meniscus (68-86% versus 86-96% medial), so the lateral compartment is the natural
    beneficiary of transfer. In the reference, the OA compartment-margin AUC is only
    0.866 on 198 exclusive studies. Every tying or supervised-auxiliary arm lost 0.0026-0.0050
    macro, largely on labels it never supervised (ACL, MCL, Fracture), which points
    to backbone interference. The opening is a constraint that acts only on the assignment
    pathway, uses no label information and sends no gradient into the backbone.'
  mechanism: 'Training-only. After the ordinary forward pass, rebuild tokens from
    the same `features` with only the side geometry mirrored. Axial and coronal images
    negate anchor x before `position_2d`. Sagittal images negate the series-centred
    slice position before `position_1d`. This is the same exchange convention as the
    existing reflection identity (`negate_sagittal_preserve_axial_coronal`; `relative_position_mm`
    is centred on the series extent). Features, plane, contrast, membership and validity
    stay unchanged. The result is a counterfactual ''same tissue, other side'' probe,
    not a reflected study: no real knee''s labels are exchanged. The mirrored branch
    uses detached features, and the original logits are stop-gradient targets. For
    each family f, the penalty is smoothL1(z_med_mirror - sg(z_lat)) + smoothL1(z_lat_mirror
    - sg(z_med)), averaged over studies and both families. It is added to the unchanged
    main BCE with a small weight. Its gradient reaches only the four compartment attention
    and head rows, the position embeddings and `mil_norm`. Both families are constrained.
    Free biases, rows and the soft weight keep the real medial/lateral morphological
    asymmetry learnable.'
  precedents:
  - 'compartment-invariant-disease-embedding (reject, macro -0.00500): an auxiliary
    term at lambda 0.3 damaged other-eight labels through the backbone. This proposal
    detaches features and uses a low weight.'
  - 'anatomical-medial-axis-mirror-attention (invalid, no evidence): a hard-tied scorer
    with patient-map and knee-side plumbing crashed on inference MODEL_BATCH_KEYS.
    This proposal adds no batch keys, needs no knee side and ties no weights.'
  - 'cross-compartment-attribution-exclusivity (inconclusive): moved cross-talk but
    not margin AUC; a different, attention-erasure route to assignment.'
  - src/knee_abnormality/modeling/augmentation.py REFLECTION_IDENTITY and reflection_positions;
    src/knee_abnormality/data/preprocessing/series.py:196 (series-centred relative_position_mm);
    spatial_tokens.py feature_geometry and SpatialTokens (position_2d is one [tokens,256]
    grid shared across images).
  - 'AJR 2013, ''How I Diagnose Meniscal Tears on Knee MRI'' (https://www.ajronline.org/doi/full/10.2214/AJR.12.8663):
    the menisci differ in shape and in diagnostic sensitivity, so a soft penalty is
    used instead of hard equivariance.'
  - 'Consistency under transformations for medical segmentation (Bortsova et al.,
    MICCAI 2019, https://link.springer.com/chapter/10.1007/978-3-030-32226-7_90):
    a Siamese transform-consistency auxiliary loss.'
  novelty: 'This is the campaign''s first counterfactual intervention on geometry
    alone. It uses no labels, so a gain cannot come from co-occurrence or added task
    weight. It ties no parameters and adds none by default, so capacity does not change.
    It does not need knee-side metadata: mirroring about the centre exchanges medial
    and lateral for either knee. It differs from the tied mirror-attention arm (architecture
    plus plumbing) and from the exchange-operator arm (a learned token map that replaces
    lateral pathways).'
  coverage: The penalty constrains a relation between the two compartment logits,
    not their values. Neither, medial-only, lateral-only and both-positive cases remain
    representable. All four attention rows, head rows and biases stay free. The penalty
    applies to both the meniscus and OA pairs and to every study. Inference, the twelve
    public logits, main BCE targets and weights, sampling and augmentation are untouched.
  exploitation: The lateral readout is pushed to agree with what the better-trained
    medial detector would say about the same evidence placed on the lateral side,
    and vice versa. Detector quality transfers across compartments through geometry,
    not through shared weights. The model's compartment decision is encouraged to
    depend on anatomical position rather than on a nuisance global factor.
  budget: No extra encoder pass. The cost is one extra `mil_norm`, one attention MLP
    over about 10k tokens (8 studies x 26 triplets x 49 anchors) for four rows, and
    one pooling einsum. That is about 0.5 GFLOP per step against roughly 300 GFLOP
    of ReXNet-200 backbone work, well under 1%. The reference uses dropout 0.0, so
    the second attention pass is deterministic and draws no extra RNG. Nothing runs
    at validation or prediction. The running exchange-operator arm's timing.json will
    give an empirical bound for a second attention pass.
  implementation: 'Adds to existing behaviour; removes nothing. model.py: `encode_batch`
    also returns mirrored `position_1d` (sinusoid of `where(sagittal, -positions,
    positions)`) and the x-negated anchor grid. Add a training-only `pool_encoded_mirrored`
    that rebuilds tokens from detached features and returns only the four compartment
    logits; `forward` stays byte-identical. spatial_tokens.py: expose `position_2d`
    for mirrored xy. training/compartment_transfer: the penalty and name-based pair
    resolution. lightning.py: add `weight * penalty` and log it. config.py and configs/training.yaml:
    `trainer.compartment_transfer` keys. Keep any optional parameters off `model.`.
    Matched diagnostic control: the same second pass with an anterior-posterior mirror
    and an invariance penalty. If a new incumbent is accepted during development,
    compose on its four public logits and re-pin the comparison. If the exchange-operator
    arm wins, declare the overlap and reassess.'
  open_choices: Weight (0.05 proposed, asserted rather than measured; not to be swept)
    and smooth-L1 versus squared loss. Whether to add two free per-family offsets,
    hosted on the LightningModule, to absorb the medial/lateral prevalence asymmetry.
    Whether to keep the one-sided stop-gradient (default) or make the penalty symmetric.
    The in-plane mirror is about the centre of the augmented frame, so up to 10 degrees
    of affine rotation makes it approximate; this is the same assumption the reflection
    augmentation already makes.
  dependencies: []
  priority_rationale: Highest priority. It is the only proposal that uses no labels,
    adds no capacity and is structurally protected from the backbone interference
    behind every loss so far. It runs on both families, needs no new batch keys, avoiding
    the invalid arm's failure mode, and is cheap. The main risk is that the soft exchange
    suppresses real morphological asymmetry. A small weight and free rows bound that
    risk, and the anterior-posterior control can attribute any gain.
  status: completed
  created_revision: 177
  ranking_rationale: "The fixed rule gives reject. The macro delta is \u22120.00402,\
    \ with a 95% interval of [\u22120.00807, \u22120.00004] over 2,000 valid draws.\
    \ The contract checks pass: the accounting matches the sealed 938,460/35,030 training\
    \ and 24,188 validation triplets, the only config differences are model.compartment_transfer.*,\
    \ and the only input-identity difference is preprocessing_identity. Measured compute\
    \ was 1,590 s, under the 1,797 s ceiling. The review concerns the completion reporter\
    \ escalated are about attribution, dropout-decoupled training-time tying, a guard\
    \ that only runs in the training-module constructor, and diagnostic logging. None\
    \ of them invalidates the run, and the measured timing resolves the runtime concern.\n\
    \nChanging the ranking: I moved shared-family-level-channel ahead of appearance-value-tied-meniscus-classifier.\
    \ This run's only diagnostic signal on the targeted families points to tying-induced\
    \ cross-talk (see finding). The additive family channel keeps all four private\
    \ pathways and starts at zero, so it can recover control B. The hard-tied shared\
    \ meniscus classifier carries the same cross-talk risk that this tied pathway\
    \ may have shown. The reserved head and all other positions are unchanged."
