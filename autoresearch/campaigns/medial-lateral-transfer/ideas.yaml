- id: pair-oriented-hemifield-attention
  mechanism_id: self-oriented-pair-hemifield-attention-gating
  parent_idea_id: null
  title: 'Let each compartment pair orient itself: take the pair''s own medial-minus-lateral
    attention displacement in each series and softly confine each compartment''s attention
    to its hemifield, so shared side-agnostic lesion evidence is read by the correct
    compartment'
  opportunity: "The largest compartment deficit is cross-talk. Lateral OA ranks medial-OA-positive\
    \ negatives at 0.722, against 0.909 for sibling-healthy negatives; lateral meniscus\
    \ scores 0.852 against 0.924. Oracle ceilings are +0.040 and +0.027 label AUC.\
    \ Across 27 recipe-family runs, the reference is typical on these OA strata, so\
    \ the weakness is structural rather than reference luck.\n\nNew probe (48 validation\
    \ studies, patient-X from DICOM maps; knee side used only for scoring):\n- Each\
    \ pair's displacement sign is correct in 96\u201398% of studies in coronal and\
    \ sagittal (83\u2013100% by group).\n- Each OA row alone puts only 0.53\u2013\
    0.66 of its mass on the correct half; lateral OA gets 0.54\u20130.60.\n- Median\
    \ OA separation is 4/17/9 mm (axial/coronal/sagittal), against 11/43/26 mm for\
    \ meniscus.\n\nThe pair jointly knows the orientation, but neither readout uses\
    \ it. The OA token detectors are already side-agnostic, so assignment is the limit,\
    \ not sharing."
  mechanism: "For each family f and each series g, take the token coordinate x(t)\
    \ along the image's mediolateral axis:\n- coronal/axial: the anchor column in\
    \ the augmented frame, in mm, centred on the image;\n- sagittal: the reflection-adjusted,\
    \ series-centred slice position in mm.\n\nFrom the existing study softmax a_med\
    \ and a_lat, compute per-series centroids \u03BC_c,g and the orientation o_f,g\
    \ = tanh((\u03BC_med,g \u2212 \u03BC_lat,g)/\u03C4). Add log \u03C3(\xB1\u03BA\
    _c\xB7o_f,g\xB7x(t)/\u03C1) to the four compartment attention scores (+ for medial,\
    \ \u2212 for lateral), then re-softmax and pool with the unchanged head rows.\n\
    \nThe \u03BA_c are four scalars initialized at zero. log \u03C3(0) is a constant,\
    \ so the model starts exactly at control B, but \u03BA gets gradient \u221D o\xB7\
    x immediately, so this is not a dormant bilinear start. Gradient flows through\
    \ o, so the main BCE itself rewards pair separation.\n\nBoth compartments share\
    \ one orientation, which transfers localization between medial and lateral. The\
    \ side-agnostic lesion evidence is then routed by hemifield. When |displacement|\
