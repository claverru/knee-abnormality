- id: reciprocal-compartment-readout-transfer
  mechanism_id: cross-compartment-readout-reuse-auxiliary
  parent_idea_id: null
  title: Train each compartment head to read the other compartment's pooled features,
    without tying any weights
  opportunity: 'The measured coupling penalty moved w_medial and w_lateral 20.5% closer
    in weight space and still lost the family (macro -0.0015, meniscus -0.0041). Parameter
    distance is not the property that matters: an isotropic penalty constrains directions
    the pooled features never occupy, while hard tying (1A/1B) assumes interchangeability
    outright. The untested question is the data-weighted one, whether each existing
    classifier direction is usable on the other compartment''s pooled features. Making
    that true is a direct statement of the user''s hypothesis, shared patterns should
    be readable by one detector in either compartment, while each compartment keeps
    its own final decision and no parameter is shared at inference.'
  mechanism: 'Training-only auxiliary with essentially no new parameters. For each
    family pair, evaluate the existing head of compartment c on the pooled features
    of compartment c'' and supervise with c''''s own observed soft label: aux_logit
    = w_c . pooled_c'' + b''_c'', adding only the small auxiliary biases. The objective
    is the main class-balanced BCE plus lambda times the mean of the masked cross-applied
    terms, reusing the corresponding main targets'' class-balance weights so the main
    loss, its targets and its weights are untouched. Both directions are applied,
    medial head on lateral features and lateral head on medial features. Nothing is
    tied, no third detector is created, no logit changes at inference, and the auxiliary
    biases are irrelevant at export. This is the training-only counterpart of exchange
    symmetry: it asks the pair to be mutually decodable rather than identical.'
  precedents:
  - 'docs/validation/results/2026-09-14-meniscus-soft-coupling-result.md: the isotropic
    weight-distance version, measured and retired; do not restart its coefficient
    sweep.'
  - 'docs/research/medial-lateral-transfer.md#candidate-3-training-only-shared-disease-supervision:
    the shared new auxiliary detector and its required independent-auxiliary control.'
  - 'autoresearch/campaigns/medial-lateral-transfer/ideas.yaml: `shared-disease-auxiliary`,
    currently developing, is the adjacent arm this proposal must be distinguished
    from.'
  - 'docs/research/medial-lateral-transfer.md#historical-implementation-and-reproduction:
    1A/1B tied one 256-dimensional vector per family with independent biases; archived-recipe
    evidence only.'
  - 'Evgeniou and Pontil, Regularized Multi-Task Learning, KDD 2004: shared component
    plus regularized task deviations; the functional analogue replaces the isotropic
    norm with a data-weighted constraint.'
  - 'Du et al., Adapting Auxiliary Losses Using Gradient Similarity, 2018 (https://arxiv.org/abs/1812.02224):
    auxiliary objectives can help or hurt depending on stage and weight.'
  - 'docs/validation/results/2026-09-20-compartment-adapter-result.md: empirical per-label
    null ranges and the 0.0034 control-to-control macro spread, which bound what any
    single run can resolve.'
  novelty: Constrains the two existing classifiers through their functional interchangeability
    on real pooled features rather than through parameter distance (measured, retired)
    or through a new shared third detector (the developing arm). It adds no detector
    and essentially no parameters, so a gain cannot be attributed to capacity, and
    the cross-applied losses are themselves a recorded diagnostic of cross-compartment
    decodability during training, which is informative even if the run is inconclusive.
  coverage: Each auxiliary term uses that compartment's own observed label and mask;
    no prediction is forced to match another and no probabilistic-OR family label
    is constructed. The main twelve logits, target order, main BCE targets and weights,
    cohort, sampling and decoded pixels are unchanged; the mechanism is absent at
    inference. All four joint configurations remain representable.
  exploitation: Gradients push the medial detector to work on lateral evidence and
    the reverse, so the shared backbone and attention are steered toward features
    that carry the disease in either compartment, while each main head keeps whatever
    compartment-specific combination it needs.
  budget: Two extra dot products per family per study per step on vectors already
    computed, plus a masked BCE; no extra images, encoder passes, optimizer steps,
    teachers or caches, and nothing at inference. Estimated well under 0.01% of step
    time against the 1,562.3 s reference and 1,797 s ceiling.
  implementation: 'Adds to existing behaviour; removes nothing from the reference.
    The model must expose a training-only auxiliary output without changing `forward`''s
    return type, since inference builds the model through the non-editable `inference/checkpoint.py`;
    use a separate method or a training-only attribute consumed by `training_step`,
    with the objective in `src/knee_abnormality/training/compartment_transfer/` and
    configuration under `trainer.compartment_transfer`. lambda is fixed and recorded
    before launch, and component scales are logged. Relationship to a newly accepted
    incumbent: if `shared-disease-auxiliary` is accepted first, this is an alternative
    in the same class, so declare it either a replacement (B against A, removing the
    shared auxiliary head and its config) or, with explicit rationale, a stack; never
    run both auxiliaries on one family without stating which is under test. If an
    unrelated mechanism is accepted, rebase and stack as A+B against A. Attribution:
    a matched self-application control (w_c on pooled_c at the same lambda) separates
    transfer from additional family task weight; do not prequeue it.'
  open_choices: lambda and whether it is constant or ramped within the fixed schedule
    (choose one, no sweep). Whether the borrowed weight vector is stop-gradient, which
    turns the mechanism into a directional donor-to-recipient transfer protecting
    the data-rich compartment, or trainable in both directions. Family scope. Whether
    the auxiliary bias is per compartment or shared. Whether to include rarely unobserved
    cells.
  dependencies: []
  priority_rationale: Cheap, training-only, zero inference change and the cleanest
    capacity story of the three, and it answers a question the retired weight-space
    penalty could not. It ranks last because it sits in the same mechanism class as
    the developing `shared-disease-auxiliary`, whose pending result should inform
