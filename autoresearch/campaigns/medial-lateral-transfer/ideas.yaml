- id: compartment-invariant-disease-embedding
  mechanism_id: cross-compartment-supervised-contrastive-alignment
  parent_idea_id: null
  title: Align the two compartments' pooled disease evidence with a supervised contrastive
    objective built on within-study exclusive pairs and a detached cross-study feature
    queue
  opportunity: 'Measured on the pinned reference''s saved fold-0 predictions: the
    Medial Meniscus score ranks Lateral Meniscus labels at AUC 0.597 and the lateral
    score ranks medial labels at 0.711, so the two compartments'' evidence is nearly
    unrelated; meanwhile Lateral Meniscus has 138 positives against Medial''s 356
    and scores 0.8978 against 0.9266. Co-occurrence is modest there (75 both-positive,
    281 medial-only, 63 lateral-only, 485 neither), so the meniscus pair is where
    shared morphology is cleanly testable. A logistic refit of each compartment on
    BOTH of the reference''s pair logits, fit and scored in-sample on the same validation
    studies (an optimistic ceiling, not a proposal), gains only +0.0010 lateral and
    +0.0012 medial meniscus, +0.0007 and +0.0001 OA, with a negative cross-coefficient
    for lateral meniscus. Transfer expressed as a recombination of the pair''s two
    scores is therefore capped near zero, and any real gain must be built into the
    representation before the readout. No campaign arm has constrained the geometry
    of the pooled compartment representations themselves.'
  mechanism: 'Training-only auxiliary, no inference change. In the training step,
    take the pooled vectors already computed for the four compartment targets (exposed
    through a return_pooled path, as earlier arms did). Each study contributes two
    instances per family: (pooled_medial, its own observed medial label) and (pooled_lateral,
    its own observed lateral label). L2-normalize; no projector in the default form.
    Apply a supervised contrastive loss with a fixed temperature in which an anchor''s
    positives are instances sharing its disease status irrespective of compartment,
    so a medial-positive anchor is pulled toward lateral-positive instances and pushed
    from lateral-negative ones. Two comparison sources: (i) in-batch instances, which
    contain the within-study exclusive pair - in a medial-only study the positive
    and negative compartment share patient, scanner, acquisition, augmentation and
    reflection, so that pair isolates disease from every nuisance factor and is the
    densest available evidence that the two compartments share a pattern; (ii) a detached
    FIFO queue of the most recent K embeddings with their labels, supplying the negatives
    that batch size 8 cannot. Queue entries are stored detached and never backpropagated;
    no extra encoder pass, no precomputation, training data only. Add lambda times
    this loss to the unchanged class-balanced BCE; main targets, weights, masks and
    reduction untouched. The exported checkpoint is structurally identical to the
    reference.'
  precedents:
  - Khosla et al., Supervised Contrastive Learning, NeurIPS 2020 - label-defined positives;
    the basis for treating medial and lateral instances as views of one disease concept.
  - He et al., Momentum Contrast (MoCo), CVPR 2020 - detached FIFO queue of past embeddings
    to supply negatives under small batches; here without a momentum encoder, so staleness
    is bounded by a short queue.
  - 'Campaign arm shared-disease-auxiliary (inconclusive, experiment ...20260920T221219Z-2457a3ee):
    one shared linear direction classifying both pooled meniscus features at weight
    0.3. Closest precedent and materially weaker - a single hyperplane can separate
    both compartments while their representations stay near-orthogonal, which the
    reference cross-AUC of 0.597 shows is the actual state.'
  - 'Campaign arms compartment-pair-contrast-readout and reciprocal-compartment-readout-transfer
    (both inconclusive): pooled/logit-level recombination, bounded by the in-sample
    refit ceiling reported in exhausted_directions.'
  - 'Historical 1A/1B tied meniscus and OA classifiers (docs/modeling/retired-side-and-compartment-variants.md):
    tied parameters, never constrained representation geometry; archived recipe, not
    a control.'
  - 'Rejected pooled meniscus adapter, outputs/training/compartment-control (docs/validation/results/2026-09-20-compartment-adapter-result.md):
    a shared nonlinear transform of pooled features at inference. Not restored here
    - this proposal adds no inference-time path and no shared transform.'
  - 'Probe: this report''s cross-AUC, co-occurrence and in-sample two-logit refit
    numbers, computed with knee_abnormality.evaluation.metrics against outputs/training/overnight-20260919T235434Z-8ol_1c30/runs/13-control-repeat/fold_0/validation_predictions.csv.'
  novelty: First campaign mechanism that constrains the geometry of the compartment
    representations rather than adding a shared parameter, a shared logit path or
    a shared classifier. A metric objective with negatives is not satisfiable by near-orthogonal
    representations, which a shared linear head is. Within-study exclusive compartment
    pairs as hard positive/negative pairs - identical patient, scanner, acquisition
    and augmentation, differing only in disease - have never been used in this repository,
    and neither has a feature queue. The default form adds zero parameters and no
    inference-time computation, so a macro gain cannot be explained by capacity or
    by an altered prediction path; it also never compares the two predictions, so
    it cannot manufacture a co-occurrence or common-mode effect.
  coverage: 'Applies to both families through their own observed masks. Independent
    attention rows and head rows are retained, so neither, medial-only, lateral-only
    and both-positive stay fully representable and the objective never pulls the two
    logits together. Gradients reach the projection, token path and backbone through
    the pooled vectors, so a benefit is not confined to the four compartment channels
    - which matters, since four-label gains are divided by twelve in the macro rule.
    Reflection is untouched: mirrored studies keep their target identities and simply
    contribute mirrored instances of the same concept.'
  exploitation: 'Directly instruments the measured deficit. If shared morphology exists
    and is learnable, the medial-score-ranks-lateral-label AUC should rise from 0.597
    and Lateral Meniscus AUC from 0.8978, with meniscus margin AUC (0.9712) not falling
    - alignment must not cost lateralization, and a rise in margin plus a rise in
    cross-AUC together would be the signature. OA is expected to move less, since
    its 186 both-positive studies already couple the pair. A matched control to name
    but not prequeue: the same loss with positives restricted to the anchor''s own
    compartment at the same lambda, which separates cross-compartment alignment from
    generic metric-learning regularization.'
  budget: 'Compute is a few matrix products on (batch x 4 x 256) vectors plus a K
    x 256 queue per step; negligible against 235 s of headroom under the 1,797 s ceiling
    (reference 1,562.28 s). The honest risk is the bar, not the cost: the seed-replicate
    floor measured in exhausted_directions is about 0.0034 macro, and a gain confined
    to the four compartment labels needs roughly +0.04 summed across them to clear
    it. This mechanism is worth a full-budget run precisely because its gradient shapes
    the shared trunk, so it has a route to a broad gain, unlike readout-level arms
    whose ceiling is now measured at about +0.001. One seed, one fold; inconclusive
    remains the most likely outcome and would not refute the hypothesis.'
  implementation: 'Adds to existing behaviour; removes nothing and replaces no accepted
    idea (active_incumbent_ideas is empty). Retain: all twelve attention rows, mil_norm,
    spatial tokens, head, main class-balanced BCE with its targets, weights and masks,
    optimizer, schedule, sampling, augmentation, cohort and checkpoint selection.
    Add: a return_pooled path on _attention_pool/pool_encoded in modeling/model.py
    exposing per-target pooled features to a training-only consumer without changing
    forward''s return type or the inference path (inference/checkpoint.py stays byte-identical);
    the objective and the queue buffer under src/knee_abnormality/training/compartment_transfer/;
    configuration under trainer.compartment_transfer with pair identity given as target
    indices validated against the frozen twelve-target order. Keep the queue as a
    registered non-persistent buffer or plain tensor owned by the module that is actually
    optimized - do not attach trained parameters to KneeModule, which on_load_checkpoint''s
    model./averaged. filter drops on resume (recorded defect from the shared-disease-auxiliary
    arm). If the default parameter-free form is replaced by a projector, it must live
    inside KneeAbnormalityModel so it is exported and strict-loaded normally. Requires
    a lambda = 0 identity check against the parent, since no RNG consumption may change.
    If compartment-pair-channel-rotation or cross-compartment-attribution-exclusivity
    is accepted while this is in development, rebase onto that source and measure
    A+B against the accepted A, declaring nothing removed.'
  open_choices: lambda and temperature, both to be fixed and recorded before launch
    and not swept afterwards. Queue length K (favor short, e.g. 256-1024, to bound
    staleness without a momentum encoder) versus in-batch-only, which is simpler but
    gives only 16 instances per family per step. Whether to include both families
    or the meniscus pair alone, where the diagnostic headroom is cleanest and co-occurrence
    is weakest. Whether both-positive studies contribute two positive anchors or are
    excluded so the hard-pair term uses exclusive studies only. Whether to L2-normalize
    the raw pooled vector or add a small training-only projector, which trades zero-capacity
    attribution for a better-conditioned metric space.
  dependencies: []
  priority_rationale: Rank first. It attacks the one measured, unexploited gap - cross-compartment
    transfer of 0.597 in a family with only modest co-occurrence - at the representation
    level, which is the only level the in-sample refit ceiling leaves open. It is
    the proposal most likely to move the shared trunk and therefore the only realistic
