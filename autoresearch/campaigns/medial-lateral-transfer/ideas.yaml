- id: shared-lateralization-direction-attention
  mechanism_id: cross-family-shared-attention-lateralization-direction
  parent_idea_id: null
  title: Force the meniscus and OA pairs to shift attention from medial to lateral
    along one shared direction, with a free per-disease magnitude and free classifiers
  opportunity: 'New measurement on the reference checkpoint: the model''s attention
    space is organised by anatomical side, not by disease, yet the two families barely
    share that organisation. Cross-family same-side attention cosines are the largest
    structured values in the whole 12x12 matrix (Medial Meniscus/Medial OA 0.363,
    Lateral Meniscus/Lateral OA 0.314, against a 0.138 off-diagonal mean), while within-family
    compartment cosines are 0.054 and 0.243 and opposite-side cross-family cosines
    are 0.082 and 0.203. The second principal direction of the four compartment attention
    rows has the same sign for both medial rows (+0.340, +0.049) and the opposite
    sign for both lateral rows (-0.367, -0.234): a side axis exists and both families
    use it. But the two families'' actual medial-minus-lateral difference vectors
    align at only cosine 0.234. The head shows no comparable side organisation (within-family
    0.222/0.315 versus cross-family same-side 0.217/0.290). So the well-lateralised
    meniscus pair (margin AUC 0.9712) and the poorly lateralised OA pair (0.8661)
    are each discovering their own partial copy of the same anatomical axis.'
  mechanism: 'A structural constraint on where the four compartment targets look,
    with zero auxiliary loss and no inference-time cost. Replace the four independent
    attention rows by a_med_f = u_f and a_lat_f = u_f + gamma_f * delta, where u_meniscus
    and u_oa are free 128-dimensional disease rows, delta is a single shared lateralisation
    direction and gamma_f is one free scalar per family. All four attention biases
    stay free, and the four head rows stay completely free, because the measurement
    places the side structure in attention and not in the classifier. The constraint
    is exactly the hypothesis that moving from the medial to the lateral compartment
    is the same change of anatomical attention for a meniscal tear as for compartmental
    osteoarthritis, while allowing each disease its own sensitivity to that change
    through gamma_f. It is not vacuous: it forces the two families'' difference vectors
    to be collinear, and they are currently at cosine 0.234. Degrees of freedom fall
    from 4x128 to 3x128 plus two scalars. Nothing is added to the logits, so neither,
    medial-only, lateral-only and both-positive stay exactly as representable as they
    are today, and the pair''s total evidence is untouched.'
  precedents:
  - 'Historical 1C, disease plus signed compartment attention (docs/modeling/retired-side-and-compartment-variants.md):
    two disease vectors plus one signed compartment vector shared across the four
    paired targets, combined with 1B''s tied classifiers. Local 0.892538 versus 0.892360,
    public 0.931 versus 0.936. Closest precedent. Two material differences justified
    by new measurement: 1C forced antisymmetry with a single shared magnitude, and
    it simultaneously tied the classifiers, which the head measurement above does
    not support - so its mixed outcome confounds a supported attention change with
    an unsupported head change, on the archived recipe and x2 validation.'
  - 'Retired attention priors and token graph (prior-work.md): coordinate priors on
    where each target should attend, regressed and retired. This constrains the relation
    between two targets'' attention rows and asserts no absolute location, so it needs
    neither knee side nor a mediolateral coordinate.'
  - 'Misra et al., Cross-Stitch Networks (CVPR 2016) and the previously recorded closure
    of per-channel shared/private gating: with a free private vector, soft sharing
    is an exact reparameterisation. This design avoids that trap by removing a degree
    of freedom rather than adding a gate.'
  - 'Kumar and Daume III, Learning Task Grouping and Overlap in Multi-Task Learning
    (ICML 2012); Long et al., Multilinear Relationship Networks (NeurIPS 2017): task
    parameters constrained to a shared low-dimensional structure. Here the shared
    structure is one direction with a per-task scale, chosen because the measurement
    identifies exactly one side axis.'
  - 'Campaign arm compartment-pair-channel-rotation (inconclusive): a fixed sum/difference
    basis on the two output channels. That arm is a pure function of the pair''s two
    logits and therefore inside the measured +0.001 recombination ceiling; this one
    changes which tokens are pooled.'
  - 'Probe, this report: cosine matrix, per-family difference-vector alignment and
    SVD of the four compartment attention and head rows from the reference checkpoint
    state_dict, with random-quadruple and other-label-quadruple baselines for the
    rank structure.'
  novelty: The first mechanism to share an anatomical relation between the two disease
    families at the level where the checkpoint says that relation already lives, and
    to leave the classifiers alone on the same evidence. Previous cross-family work
    either shared a signed vector and the classifiers together (1C) or proposed a
    training-only agreement penalty on attention displacement in image coordinates
    (queued cross-family-mediolateral-axis-agreement). This is structural rather than
    penalised, uses no coordinates, no plane grouping, no sign anchor and no margin,
    adds no parameters and no compute, and removes a degree of freedom so a gain cannot
    be attributed to capacity or to added task weight.
  coverage: 'All four compartment targets in both families; the other eight targets,
    the head, the loss, sampling and augmentation are untouched. Because the constraint
    removes a direction of freedom from the attention rows rather than adding a term,
    it cannot be satisfied trivially, and the gradient it redirects passes through
    the shared 256->128 attention layer, projection and backbone, so its effect is
    not confined to the four channels. Reflection is irrelevant to correctness: delta
    lives in feature space, not image space, so a mirrored study needs no sign handling
    and target identities are untouched.'
  exploitation: 'The predicted signature is specific: OA margin AUC should rise from
    0.8661 and OA lateral cross-talk fall from 0.622, with meniscus margin AUC holding
    near 0.9712, since the meniscus pair supplies most of the evidence that defines
    delta. A meniscus regression paired with an OA gain would mean the shared direction
    is a compromise rather than a transfer, and should be read as a negative for the
    mechanism even if macro moves up. gamma_meniscus and gamma_oa should be logged;
    similar magnitudes support one shared axis, while one collapsing toward zero means
    that family opted out. Matched control to name, not prequeue: the same collinearity
    constraint imposed between two unpaired targets at the same parameter count, separating
    anatomical side sharing from generic rank reduction of the attention rows.'
  budget: 'No added parameters, no added compute, no auxiliary term - the run costs
    what the reference costs, well inside the 1,797 s ceiling. Two honest risks. First,
    the bar: the mechanism touches four of twelve labels, so it needs roughly +0.04
    summed across them to clear the measured 0.0034 seed floor, and its route to a
    broader effect is only the redirected trunk gradient. Second, over-constraint:
    forcing collinearity where the measured alignment is 0.234 could cost the meniscus
    pair more than it buys the OA pair; the free gamma_f is the release valve, and
    1C''s local tie rather than collapse is weak evidence that a constraint of this
    kind is survivable. It earns its slot because it is the cheapest arm available,
    its verdict is unambiguous in either direction, and it is directly derived from
    measured structure rather than asserted.'
  implementation: 'Replaces existing behaviour for the four compartment attention
    rows; adds nothing else and removes no accepted idea (active_incumbent_ideas is
    empty). Retain: the eight non-compartment attention rows, all twelve head rows
    and biases, all four compartment attention biases, mil_norm, spatial tokens, the
    shared 256->128 attention layer, main class-balanced BCE with unchanged targets,
    weights and masks, optimizer, schedule, sampling, augmentation, cohort, checkpoint
    selection, and inference/checkpoint.py byte-identical. Remove: the free parameterisation
    of the Lateral Meniscus and Lateral OA attention rows, which become u_f + gamma_f
    * delta. Add: a small module under src/knee_abnormality/modeling/compartment_transfer
    owning u_f, delta and gamma_f and assembling the twelve-row score weight inside
    KneeAbnormalityModel, so the parameters are exported and strict-loaded with no
    checkpoint shim; configuration under model.compartment_transfer naming the two
    pairs by target index against the frozen order. The assembled rows must be built
    once per forward, not per token, and consumed by the existing _attention_scores
    path so the float32 autocast-disabled pooling block is unchanged. Initialise u_f
    and delta from the existing attention output-layer initialiser with gamma_f =
    1, so the starting scale matches the reference. No RNG consumption may change
    beyond initialisation, which must be recorded. If any campaign idea is accepted
    during development, rebase onto that source and measure A+B against the accepted
    A; this is incompatible with compartment-exchange-operator-tied-pathway, which
    removes the same rows, so only one of the two can be stacked and the other would
    have to be re-expressed.'
  open_choices: Whether to extend the same shared-direction constraint to the head
    rows, where the two families' difference vectors also align at cosine 0.234 but
    the side organisation is absent - stronger sharing, and closer to 1C, so the default
    here is attention only. Whether gamma_f is free or fixed to 1, which would make
    the constraint strict equality as in 1C. Whether delta is one direction or a shared
    two-dimensional subspace, noting that the four rows' top-two singular energy is
    0.691 against a 0.659 median for arbitrary label quadruples, so a hard rank-2
    constraint on all four rows is not supported by the measurement. All of these
    must be fixed and recorded before launch; a sweep over them is a parameter search,
    not a new mechanism.
  dependencies: []
  priority_rationale: Rank second. It is the cheapest arm in the queue, it is the
    only proposal derived directly from measured structure in the trained reference
    rather than from predictions alone, and its attribution is unambiguous because
    it adds nothing. It ranks below the exchange operator because it shares one direction
    rather than a detector, so it does nothing about the positive-count imbalance
    that makes the lateral labels weak, and a four-label effect is the hardest to
    push through the twelve-label macro rule.
  status: completed
  created_revision: 138
  ranking_rationale: "The fixed rule gives reject. The macro delta is \u22120.00402,\
    \ with a 95% interval of [\u22120.00807, \u22120.00004] over 2,000 valid draws.\
    \ The contract checks pass: the accounting matches the sealed 938,460/35,030 training\
    \ and 24,188 validation triplets, the only config differences are model.compartment_transfer.*,\
    \ and the only input-identity difference is preprocessing_identity. Measured compute\
