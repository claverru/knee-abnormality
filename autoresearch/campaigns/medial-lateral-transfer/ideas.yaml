ideas:
- id: shared-disease-auxiliary
  mechanism_id: training-only-compartment-transfer
  parent_idea_id: null
  title: Encourage transferable disease features with a shared auxiliary detector
  opportunity: Hard and softly coupled final classifiers did not establish reliable
    transfer. A shared training signal can encourage compatible disease features while
    retaining independent final compartment decisions.
  mechanism: Attach a disease-family auxiliary decoder to the separately pooled medial
    and lateral features. Train it against each compartment's own observed soft target
    while retaining the twelve-output main balanced BCE. Final predictions use the
    independent main heads. Start with a justified family, not a sweep.
  precedents:
  - docs/research/medial-lateral-transfer.md#candidate-3-training-only-shared-disease-supervision
  - docs/validation/results/2026-09-14-meniscus-soft-coupling-result.md
  - docs/validation/results/2026-09-20-compartment-adapter-result.md
  - autoresearch/campaigns/medial-lateral-transfer/prior-work.md
  novelty: Changes training supervision rather than tying final classifier weights
    or adding only a pooled inference adapter. Start from the current incumbent, without
    restoring the rejected pooled adapter; retain unrelated accepted changes and explicitly
    declare any method this candidate replaces.
  coverage: Retain all main targets and masks. The shared decoder receives each location's
    own label; never force paired predictions to match or infer a probabilistic disease-OR
    target from soft marginals without justified joint information.
  exploitation: Let examples from either compartment train a common disease recognizer
    while allowing each main classifier to use additional compartment-specific evidence.
  budget: Reuse features from the ordinary forward pass. Auxiliary computation and
    diagnostics stay inside the fixed training schedule; no teacher fitting, external
    feature cache, additional encoder pass, or inference ensemble.
  implementation: Add an optional training-only feature/auxiliary path in the model
    and its objective in Lightning or transfer helpers. Use compartment_transfer config
    subtrees, stable float32 masked loss, and recorded component scales. Keep the
    ordinary inference interface and main BCE unchanged.
  open_choices: Choose family, auxiliary scale and any within-run schedule from a
    stated rationale. A gain needs an equivalent independent-auxiliary control before
    claiming transfer rather than increased disease-task weight. Do not prequeue such
    a dependent follow-up or launch a coefficient sweep.
  dependencies: []
  priority_rationale: A concrete untrained proposal that tests a different route to
    transfer and keeps independent final decisions; informed by, but not dependent
    on, an accepted pooled-adapter result.
  status: completed
  created_revision: 10
  ranking_rationale: 'Admitted two of three proposals; the queue membership change
    requires a full ranking.


    compartment-pair-contrast-readout enters second. I verified it is implementable
    as described against the reference source: `_attention_pool` already materialises
    per-target `pooled` of shape [b, t, f] and forms logits from it (model.py:204-239),
    and the evaluator''s pair identity is frozen in metrics.py:6-9. It is the first
    mechanism in which one compartment''s prediction reads the other''s evidence;
    the odd, zero-sum increment is structurally unable to produce a common-mode/co-occurrence
    boost, which is the failure mode recorded for the pooled adapter and the weight-coupling
    penalty, and exchange equivariance makes the shared parameters prevalence-symmetric.
    Zero-initialised output means initialisation reproduces the reference exactly.
    Cheapest new mechanism class available.


    disease-evidence-compartment-routing stays ahead of the new attention proposal:
    it is already queued, token-level but without the side-rule dependency.


    anatomical-medial-axis-mirror-attention enters last of the queued set. It is the
    only proposal adding information rather than parameter structure, and `patient_maps`
    genuinely exist in preparation (preparation.py:31,228), so the plumbing claim
    is sound. It ranks behind the pooled probe because of its real implementation
    surface (preparation, dataset, spatial_tokens, model), token-level budget exposure
    against the 1,797 s ceiling, an unverified interaction between reflection augmentation
    and patient-space X, and two adverse precedents it must not become a rerun of.


    reciprocal-compartment-readout-transfer is not admitted and remains proposed.
    It sits in the same mechanism class as the reserved, developing `shared-disease-auxiliary`;
    its own priority rationale concedes the pending result should decide whether it
    is still distinct. Admitting it now risks two auxiliaries on the same family with
    no attribution story. Revisit once that result is interpreted; if it is later
    admitted after an acceptance in that class, it must declare replacement or stack
    explicitly.'
  experiments:
