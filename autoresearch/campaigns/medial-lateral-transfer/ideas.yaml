- id: compartment-exchange-operator-tied-pathway
  mechanism_id: shared-linear-compartment-exchange-operator-with-tied-pathway
  parent_idea_id: null
  title: 'Give each family one detector and apply it twice: unchanged tokens for the
    medial compartment, tokens mapped by a single learned exchange operator shared
    by both families for the lateral compartment'
  opportunity: 'Lateral Meniscus has 138 positives against Medial''s 356 and scores
    0.8978 against 0.9266; Lateral OA has 241 against 329 and scores 0.8686 against
    0.9078. The weaker compartment of each family is the one with less training signal,
    and today nothing lets it reuse the stronger compartment''s detector: measured
    on the reference checkpoint (fold_0/best-epoch=08-val_macro_auc=0.89658.ckpt),
    the two meniscus attention rows have cosine 0.054 and the two OA rows 0.243, against
    a 0.138 mean over all off-diagonal target pairs - the pair''s two scorers are
    no more related than two unrelated labels. Head rows are only slightly better
    (0.222 meniscus, 0.315 OA). Historical 1A tied the meniscus classifiers and both
    meniscus AUCs rose about 0.003 locally, so tying the readout helps its own labels
    but is macro-insufficient on its own (about +0.0005 of twelve-label macro). What
    was never tried is tying the whole pathway - the attention detector too - through
    a learned transformation rather than by identity.'
  mechanism: 'Replace the four compartment pathways. Learn one linear operator R on
    the 256-dimensional normalized token space, R = I + U V^T with low rank r and
    V initialised to zero, shared by the meniscus and OA families. Each family keeps
    exactly one attention row u_f and one head row w_f. The medial logit is computed
    as today from the raw tokens. The lateral logit is the same detector applied to
    transformed tokens: score_lat(n) = u_f . tanh(W1 (R t_n)), pooled_lat = sum_n
    softmax(score_lat)_n (R t_n), logit_lat = w_f . pooled_lat + b_lat, with b_med
    and b_lat free so prevalence differences are absorbed. W1 is the existing shared
    256->128 attention layer, reused, not duplicated. The claim being tested is exactly
    the user''s hypothesis made precise: the disease looks the same in both compartments,
    and what changes between compartments is one fixed change of anatomical context,
    the same change for meniscus and OA. Because R is shared across families, the
    OA pair cannot buy itself a private escape hatch; because R is learned from features,
    no knee side, patient map or mediolateral axis is needed. Both-positive, neither
    and either-only remain representable: the two logits come from different attention
    distributions over different feature fields.'
  precedents:
  - 'Historical 1A/1B tied meniscus and OA classifiers (docs/modeling/retired-side-and-compartment-variants.md;
    prior-work.md table): identity tying of the head only, attention untied. Closest
    precedent. 1A improved both meniscus AUCs by about 0.003 with macro gain 0.000217;
    1B''s local gain came mostly from unrelated labels. Archived recipe, x2 validation,
    not a control.'
  - 'Historical 1C, disease plus signed compartment attention: additive shared signed
    vector inside the attention score plus 1B tying. Additive and antisymmetric; this
    proposal is multiplicative and acts on the token field, so the lateral detector
    is the medial detector, not the medial detector plus a bias direction.'
  - 'Campaign arm compartment-pair-contrast-readout (inconclusive) and reciprocal-compartment-readout-transfer
    (inconclusive): both operate on already-pooled vectors or logits, which the previous
    report''s in-sample two-logit refit bounds near +0.001 macro-equivalent. This
    arm changes what is pooled and where attention looks, so that bound does not apply.'
  - 'Rejected pooled meniscus adapter, outputs/training/compartment-control (docs/validation/results/2026-09-20-compartment-adapter-result.md):
    a shared nonlinear transform of pooled features feeding unchanged independent
    heads. Materially different and not restored - here the transform acts on tokens
    before attention, removes rather than adds independent compartment pathways, and
    is shared across both families.'
  - 'Gens and Domingos, Deep Symmetry Networks (NeurIPS 2014); Cohen and Welling,
    Group Equivariant CNNs (ICML 2016): one filter applied to transformed copies of
    the feature field so related views share parameters. Here the transformation is
    learned rather than given by a known group.'
  - 'Rebuffi, Bilen, Vedaldi, Learning multiple visual domains with residual adapters
    (NeurIPS 2017): low-rank residual reparameterisation I + UV^T as the minimal task-to-task
    transform; used here as the exchange operator''s form and zero initialisation.'
  - 'Probe, this report: attention-row and head-row cosines and singular structure
    of the four compartment rows, computed from the reference checkpoint state_dict;
    per-label positives from outputs/training/overnight-20260919T235434Z-8ol_1c30/runs/13-control-repeat/fold_0/validation_predictions.csv
    joined to data/folds/all_5fold_v3/targets.csv.'
  novelty: First campaign mechanism in which a compartment's pathway is literally
    the other compartment's pathway evaluated on transformed features, and the first
    to make one operator carry the medial-to-lateral change for both diseases at once.
    Every previous sharing attempt either tied weights by identity (1A/1B), added
    a signed bias to the score (1C), or recombined already-formed pooled vectors and
    logits (three campaign arms, now bounded near +0.001 macro by the in-sample refit
    ceiling). Sharing the detector rather than a direction is what converts the medial
    compartment's larger positive count into training signal for the lateral one,
    and the shared R is what makes the mechanism a cross-family claim rather than
    two independent reparameterisations.
  coverage: Both families, and both compartments within each. Removes two attention
    rows and two head rows and adds one low-rank operator, so the parameter change
    is small and the four compartment channels stay as four independent logits in
    the same order; the other eight targets and the public twelve-logit interface
    are untouched. Gradients from all four compartment labels now flow through one
    detector per family and one shared operator into the shared attention layer, projection
    and backbone, so a benefit is not confined to the four labels. No geometry, knee
    side, patient map or reflection assumption enters, so the recorded reflection
    semantics are irrelevant to correctness here.
  exploitation: 'Directly instruments the measured deficit. The prediction is that
    the weaker compartment of each family gains most - Lateral Meniscus from 0.8978
    and Lateral OA from 0.8686 - with margin AUC (meniscus 0.9712, OA 0.8661) not
    falling; a rise in the weaker label bought by a margin collapse would mean the
    operator has degenerated toward the identity and the two compartments have merged.
    Learned ||UV^T|| relative to ||I|| should be logged: an operator that stays near
    zero means the run measured pure pathway tying (1A''s regime), not the exchange
    hypothesis. Matched controls to name, not prequeue: untying R across the two families
    (isolates the cross-family claim) and keeping the four independent pathways while
    still applying R to the lateral token field (isolates the operator from the tying).'
  budget: Per step the extra work is one low-rank transform and one extra pass of
    the existing 256->128 attention layer over roughly 10k tokens, about 0.5 GFLOP
    against roughly 860 GFLOP of backbone work for about 215 images per step - under
    0.1 percent, far inside the 235 s of headroom below the 1,797 s ceiling. The honest
    risk is the bar, not the cost. The measured seed floor is about 0.0034 macro and
    1A's own history says compartment-label gains of about 0.003 each are worth only
    about +0.0005 macro, so this arm can only clear the floor if tying and the shared
    operator change what the trunk learns. It is worth the budget because it is the
    only queued design that removes capacity while increasing sharing, so a gain cannot
    be read as added capacity, and because a clear negative would finally settle whether
    detector-level sharing is viable on the current recipe rather than the archived
    one.
  implementation: 'Replaces existing behaviour for the four compartment targets; adds
    nothing elsewhere and removes no accepted idea (active_incumbent_ideas is empty).
    Retain: eight non-compartment attention and head rows, mil_norm, spatial tokens,
    the shared attention 256->128 layer, main class-balanced BCE with unchanged targets,
    weights and masks, optimizer, schedule, sampling, augmentation, cohort, checkpoint
    selection, and the twelve-logit output order. Remove: the independent attention
    rows and head rows for Lateral Meniscus and Lateral OA, keeping their biases free.
    Add: an ExchangeOperator module under src/knee_abnormality/modeling/compartment_transfer
    holding U and V, and the two-pass assembly of the twelve score rows inside _attention_pool''s
