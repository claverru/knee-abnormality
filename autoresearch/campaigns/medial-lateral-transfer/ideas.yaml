    \ shares are identical by construction, since \u03A3a_m\xB2/(a_m+a_l) \u2212 \u03A3\
    a_l\xB2/(a_m+a_l) = \u03A3a_m \u2212 \u03A3a_l = 0. This is not a logging bug.\n\
    \nRouting did not buy specificity:\n- Meniscus compartment margin AUC fell from\
    \ 0.9712 to 0.9615, and OA's was flat (0.8661 to 0.8650).\n- Lateral cross-talk\
    \ did not improve (meniscus 0.636 to 0.638, OA 0.622 to 0.638).\n- Both family\
