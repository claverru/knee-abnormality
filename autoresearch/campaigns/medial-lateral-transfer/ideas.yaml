  - 'docs/validation/results/2026-09-14-meniscus-soft-coupling-result.md: isotropic
    classifier coupling, macro -0.0015, meniscus -0.0041.'
  - 'autoresearch/campaigns/medial-lateral-transfer/ideas.yaml: `disease-evidence-compartment-routing`
    (queued) shares token features and gives each compartment its own free attention
    route; this proposal instead shares the detector and constrains assignment. Same
    class, different constraint; they are alternatives, not a stack.'
  - 'prior-work.md 1C: shared attention hidden features with a single +/- compartment
    vector, forced across both diseases; here nothing is antisymmetric by construction
    and nothing is shared across families.'
  - 'src/knee_abnormality/modeling/model.py:204-240: `_attention_pool` already materialises
    per-study token membership, float32 outside autocast, and per-target pooled/logits,
    so the new terms attach with no change to the forward signature.'
  - 'Sabour, Frosst, Hinton, Dynamic Routing Between Capsules, NeurIPS 2017 (https://arxiv.org/abs/1710.09829):
    routing coefficients normalised across output units so lower-level evidence is
    assigned rather than duplicated; design principle only, no medical evidence.'
  - 'Ilse, Tomczak, Welling, Attention-based Deep MIL, ICML 2018 (https://arxiv.org/abs/1802.04712):
    the softmax-average pooling this model uses; it averages over tokens per target
    and cannot express exclusive assignment of one token''s evidence between two targets.'
  novelty: First mechanism in the campaign whose compartment-specific parameterisation
    is a normalisation across compartments per token, rather than a normalisation
    across tokens per compartment. Detection is fully shared (one detector per family,
    trained by both compartments' positives), so prevalence cannot split the detector;
    what the rare compartment must learn is only where evidence belongs. Unlike the
    rejected pooled adapter it acts before compression; unlike 1C it imposes no antisymmetric
    score contrast and no cross-family tie; unlike the queued routing idea the two
    compartments cannot both claim the same token's evidence.
  coverage: 'Neither, medial-only, lateral-only and both-positive remain representable:
    the independent base heads are untouched and the added terms are unconstrained
    in sign and magnitude, so both compartments can rise together when evidence exists
    in both places. Pairs come from the evaluator''s frozen COMPARTMENT_PAIRS, not
    a post-hoc choice. Cohort, visits, triplets, sampling, decoded pixels, labels
    and masks unchanged; only `preprocessing_identity` may differ. Limitation to record:
    stride-32 tokens have broad receptive fields, so a single token overlapping both
    compartments must be split; the independent heads absorb that.'
  exploitation: Every positive study of either compartment trains the same detector,
    so Lateral Meniscus (15.8% positive in training) inherits detection learned largely
    from Medial Meniscus (40.7%) while paying only for assignment. The conserved sum
    is the shared pattern, the split is the correct per-compartment prediction, which
    is the user's scope stated as one equation.
  budget: 'Token-level: about 10.5k tokens per step (8 studies x ~26.8 triplets x
    49 tokens at 224 px, stride 32). Three 256->32->1 modules per family, two families:
    roughly 5e8 MACs against roughly 1.5e11 backbone MACs per step, an estimated ~0.3%
    of step time; a few MB of extra activations against the recorded 21.4 GB peak.
    No extra images, encoder passes, optimizer steps, teachers or caches; prediction
    adds the same negligible work. Against the 1,562.283 s reference and the 1,797
    s ceiling this leaves ample headroom, but token-level work is the real budget
    risk in this proposal and must be measured, not asserted.'
  implementation: Adds to existing behaviour; removes nothing. Retains the twelve
    attention scorers, pooled vectors, heads, class-balanced BCE, sampling and schedule.
    New modules in `src/knee_abnormality/modeling/compartment_transfer/`, constructed
    by `KneeAbnormalityModel` from `ModelConfig.compartment_transfer` and evaluated
    inside `_attention_pool`'s existing autocast-disabled float32 block after `pooled`/`logits`
    are formed. The constructor signature must stay `(model, data, target_count, load_pretrained)`
    because `inference/checkpoint.py` is not editable and rebuilds the model from
    the saved config; the pair identity therefore enters as configured target indices
    validated against the frozen twelve-target order. These parameters are genuine
    inference parameters and belong under `model.`, so the checkpoint reproduces the
    recorded configuration with no shim. Zero-initialised evidence output keeps initialisation
    at the reference and must be verified by an identity check before launch. Validation
    stays deterministic, unaugmented, multiplier 1. If an unrelated idea (for example
    the pending `shared-disease-auxiliary`) is accepted during development, rebase
    onto the new incumbent source, re-run integration review and measure A+B against
    accepted A, declaring nothing removed. If `disease-evidence-compartment-routing`
    is implemented and accepted first, this is a replacement in that class (B against
    A) and must declare its removal, not a stack.
  open_choices: 'Aggregation: attention-weighted split (default) versus a count-like
    form such as log(1 + sum_n a_n softplus(e_n)) that can express evidence in two
    places more sharply; choose one before launch. Whether pi_f is a new shared scorer
    (default) or the mean of the pair''s two existing attention rows. Gate input:
    full token (default) versus position/plane embeddings only. Whether the gate path
    is detached from the evidence path. Hidden width (32, matching READOUT_WIDTH).
    Family scope: both pairs (default, since OA is the weaker family) versus meniscus
    only. No coefficient sweep.'
  dependencies: []
  priority_rationale: Directly targets the measured weakness (OA pair predictions
    0.881 rank-correlated against 0.674 in the labels; lateral AUC 0.760 inside medial-positive
    studies), is the only registry mechanism that shares detection completely while
    constraining assignment, is prevalence-symmetric in the shared part by construction,
    and reproduces the reference exactly at initialisation. It is architectural and
    token-level, so it costs more implementation and budget than the pooled probes
    and must be timed.
  status: completed
  created_revision: 44
  ranking_rationale: "Both proposals have satisfied dependencies and are admitted;\
    \ the queue is reranked because the probe evidence I re-derived changes what the\
    \ strongest untried mechanism is.\n\nconserved-evidence-compartment-assignment\
    \ enters at rank 2 (behind the reserved prepared head). It is the only registry\
    \ mechanism whose compartment-specific parameterisation is a normalisation across\
    \ compartments per token: one detector per family trained by both compartments'\
    \ positives, with only placement compartment-specific. That is prevalence-symmetric\
    \ in the shared part by construction, which is exactly the failure mode of the\
    \ rejected pooled adapter (prevalence domination of shared pooled parameters),\
    \ and it acts before compression rather than after. It reproduces the parent at\
    \ initialisation, so an identity check is available.\n\ndisease-evidence-compartment-routing\
    \ is parked. It is the same class as the admitted proposal but gives each compartment\
    \ a free, unconstrained token route, which does not constrain the measured problem:\
    \ the paired heads already behave like one study-level factor plus an offset,\
    \ and a free per-compartment route is also the reading that additional capacity\
    \ alone would produce. Running both would be two near-duplicates competing for\
    \ full-budget slots; the constrained form dominates on rationale. Parked, not\
    \ rejected \u2014 a routing arm remains revisitable if conserved assignment shows\
    \ the shared-detector half is the useful part.\n\ncross-compartment-attribution-exclusivity\
    \ is admitted but ranked last. Its appeal is real (zero added parameters, nothing\
