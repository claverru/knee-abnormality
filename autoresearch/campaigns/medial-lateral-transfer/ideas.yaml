  coverage: 'The rotation is an orthogonal bijection of the two logits, so neither,
    medial-only, lateral-only and both-positive remain exactly representable and no
    equality between compartments is imposed. Public output stays twelve logits in
    the frozen target order, with unchanged targets, masks, class-balanced BCE weights,
    sampling, augmentation, checkpoint selection and prediction entrypoints. Reflection
    semantics are untouched: labels are never exchanged. The other eight targets are
    bit-for-bit unaffected.'
  exploitation: Every family positive, from either compartment, trains the single
    level channel, roughly doubling the effective positives behind family detection
    (meniscus 419 family-positive studies against 356/138 per compartment; OA 384
    against 329/241). Exclusive-positive studies, which are the only ones carrying
    side information, concentrate on the lateralization channel instead of being split
    across two detectors that must each rediscover the disease. This is the shared-pattern
    exploitation the user's scope asks for, expressed in the coordinates the reference's
    own predictions already show to be informative.
  budget: Two fused multiply-adds per study per family on the final logits; no new
