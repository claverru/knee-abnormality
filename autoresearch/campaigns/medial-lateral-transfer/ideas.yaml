    \ request a renewed integration review.\n- PIT MIL: stack.\n- bilateral-order-statistic-evidence:\
    \ stack and declare the overlapping family-shared evidence."
  open_choices: '- Width: 64 or 128.

    - Child pooling: tent (linear) or smooth-max.

    - Projection: one P shared by both families, or one per family.

    - Source block: verify the exact stride-16 block index.

