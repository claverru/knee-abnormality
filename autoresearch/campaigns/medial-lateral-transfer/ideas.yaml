- id: attention-owned-compartment-gradient-routing
  mechanism_id: pair-attention-ownership-gradient-routing-of-compartment-value-credit
  parent_idea_id: null
  title: Send each compartment label's training signal into the shared trunk only
    through tokens its own attention owns relative to its sibling. Control B's forward
    pass, parameters and predictions stay unchanged.
  opportunity: "All forward-path and auxiliary arms landed inside the seed spread.\
    \ The Lateral OA vs medial-positive-negative stratum is 0.678\u20130.735 across\
    \ 29 runs, and 0.718 even with exact metadata side geometry. Confidently negative\
    \ sibling-positive studies (soft < 0.2) still score 0.768, against 0.909 for clean\
    \ negatives, so a knee-level co-occurrence factor dominates. A probe on 48 training\
    \ studies with the control-B checkpoint shows where that factor can be learned.\
    \ The OA rows put 41% (medial) and 27% (lateral) of their attention mass on tokens\
    \ the sibling attends more strongly; meniscus rows put 19% and 12%. The value\
    \ gradient to a token is a_c(t)\xB7dL/dz_c\xB7w_c, so that share of each label's\
    \ trunk credit lands on sibling tissue. Both-positive knees teach medial tissue\
    \ to look like lateral OA, and exclusive knees push shared tokens in opposed,\
    \ partly aligned directions (head-row cosines 0.32 OA, 0.22 meniscus). No arm\
    \ has changed credit assignment."
  mechanism: "For each pair (c, s), soft ownership is m_c(t) = \xE2_c(t)/(\xE2_c(t)+\xE2\
    _s(t)), computed from the same forward's detached attention. In training, each\
    \ compartment's pooled vector becomes \u03A3 a_c\xB7m_c\xB7tok + \u03A3 a_c\xB7\
    (1\u2212m_c)\xB7stopgrad(tok). The value is unchanged, so logits, BCE and gradients\
    \ to attention rows, head rows and biases are identical to control B. Only the\
    \ gradient that label c sends into tokens is scaled by m_c. That covers everything\
    \ upstream: mil_norm, embeddings, projection and backbone. The attention-score\
    \ path is not routed. Features stay fully shared: both labels train the same backbone,\
    \ each through its own tissue. Morphology learned on one side is therefore available\
    \ to the other, but neither label teaches the trunk that its sibling's tissue\
    \ predicts it. Early in training, unseparated rows give m \u2248 0.5, so routing\
    \ can only withhold credit, never inject a wrong-signed signal (unlike the rejected\
    \ axis hinge). Evaluation and inference are byte-identical to control B."
  precedents:
  - 'Cloud et al. 2024, Gradient Routing (arXiv:2410.04332): user-supplied, data-dependent
    gradient masks localize what each datum trains while the forward pass stays shared.'
  - 'Chen et al., NeurIPS 2020, GradDrop (arXiv:2010.06808): masks conflicting task
    gradients at the activation where tasks join. This proposal masks by anatomical
    ownership instead of sign consistency.'
  - 'PCGrad (Yu et al. 2020; docs/research/medial-lateral-transfer.md#optimization-interference):
    per-task backward passes are unaffordable here, and the note asks for measured
    conflict first. This refill measured the value-path leak and the head cosines
    (scratch/credit_assignment.py, .json).'
  - "cross-compartment-attribution-exclusivity (inconclusive, \u22120.0007): a forward\
    \ erasure penalty on the readout. Cross-talk fell but margins fell too. Different\
    \ lever: it constrained what the readout may use, not what each label trains."
  - "pair-oriented-hemifield-attention (developing): a forward gate whose \u03BA is\
    \ learned by the same BCE, which currently favours diffuse pooling under co-occurrence."
  - "anatomical-medial-axis-mirror-attention (invalid run with complete training epochs):\
    \ exact side geometry in attention raised epoch-1 Lateral Meniscus AUC to 0.835\
    \ (overnight range 0.744\u20130.771), yet the epoch-9 OA stratum was 0.718. Information\
    \ alone did not move the plateau (scratch/evidence-summary.md)."
  novelty: 'This is the campaign''s first backward-only arm: no parameters, no loss
    term, no change to inference or checkpoint structure. Unlike the ties, gates,
    exclusivity penalty and mirror consistency, it never restricts what a readout
    may use. It restricts only which tissue each compartment label may reshape in
    the shared trunk. It is not PCGrad (no extra backward pass; the mask comes from
    anatomical ownership, not sign) and not the queued adversary (no trained adversary;
    attention rows are unaffected).'
  coverage: 'Covers the value-path trunk credit of all four compartment labels. OA
    is most affected: about 57% of credit is kept, and the removed part is mostly
    diffuse tails and sibling tissue. Meniscus keeps about 78%. The other eight labels
    are affected only through shared trunk updates. Pre-registered readouts: OA pair
    logit correlation (0.87, against label correlation 0.55) should fall; lateral
    sibling-positive strata should rise; clean-negative strata should not get worse;
    family means and margins are read separately per family.'
  exploitation: "Uses the pair's own learned separation. In the reference, the top-20\
    \ attended tokens are self-owned in 96\u2013100% of cases, so peaks keep full\
    \ credit and only overlapping tails and sibling tissue are down-weighted. It needs\
    \ no geometry, midline, side metadata, new batch keys or supervision beyond the\
    \ existing BCE."
  budget: "Training only: one extra fp32 einsum over (B, 4, N, 256) on tokens that\
    \ are already computed. That is the same order as earlier extra-pooling arms,\
    \ which measured 1,582\u20131,597 s against the 1,797 s ceiling. No preparation,\
    \ no parameters, no additional encoder pass, and prediction cost is unchanged."
  implementation: "Mode add on historical-control; nothing is removed.\n- model.py:\
    \ inside _attention_pool's autocast-disabled fp32 block, when self.training and\
    \ routing is configured, recompute the four compartment columns of pooled as the\
    \ two-term split. Ownership comes from the detached attention of the pair. The\
    \ eval path stays byte-identical.\n- config.py: add model.compartment_transfer.gradient_routing.pairs\
    \ as target names, resolved and validated against the frozen target order at KneeModule\
    \ init. Do not use a count-only guard.\n- configs/training.yaml: enable both pairs.\n\
    - Logging: per epoch, the kept credit share \u03A3 a_c\xB7m_c per compartment.\n\
    - No new batch keys; engine and checkpoint code untouched. Review must check dtypes\
    \ under bf16 autocast.\n- If an incumbent is accepted meanwhile: routing is orthogonal\
    \ to forward changes, so compute ownership from the accepted forward's compartment\
    \ attention (for example, the gated attention if the hemifield gate wins) and\
    \ renew the integration review.\n- Attribution control, only after a gain: the\
    \ same routing with a per-study random permutation of ownership that preserves\
    \ the kept-share distribution. This separates anatomical routing from the reduction\
    \ in credit."
  open_choices: "- Ownership: soft (default) or hard 1[a_c \u2265 a_s].\n- Also route\
    \ the attention-score path into tokens: default no, because rows must still learn\
    \ to avoid sibling tissue.\n- Family scope: both families (default); the meniscus\
    \ effect is expected to be small.\n- Withheld credit is not renormalized (default);\
    \ renormalizing would change task weight."
  dependencies: []
  priority_rationale: "Rank first. It has the cleanest attribution of any proposal\
    \ (zero parameters, zero added loss, identical inference), it opens a new mechanism\
    \ class, and it targets a measured leak: 27\u201341% of OA credit lands on sibling\
