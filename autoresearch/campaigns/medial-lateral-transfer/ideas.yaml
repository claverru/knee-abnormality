  novelty: "This is the first campaign arm to read anything finer than the stride-32\
    \ tokens, and the first shared detector whose evidence is spatially finer than\
    \ the attention grid. It differs from:\n- the appearance-value tie: a shared classifier\
    \ on stride-32 pooled vectors, in replace mode;\n- conserved evidence: a stride-32\
    \ detector with a zero-initialised learned gate;\n- the family-level channel:\
    \ zero-gated, and it stayed dormant;\n- PIT MIL: training-only, stride-32, geometric\
    \ halves.\n\nThe stride-16 big bet changes the whole token grid for all labels.\
    \ This is a compartment-only scalar evidence path that keeps the 7\xD77 grid and\
    \ attention. It neither runs nor pre-empts that bet, but a gain here would inform\
    \ it."
  coverage: "Covers both families, all four compartment labels and all planes. Coronal\
    \ and axial images carry about 60% of compartment attention for both families.\
    \ Sagittal slices are compartment-pure, so there locality mostly sharpens in-slice\
    \ evidence.\n\nThe effect should be larger for meniscus, whose attention is already\
    \ separated (medial/lateral overlap 0.27\u20130.30), than for OA (0.64\u20130.70),\
    \ where attention overlap caps the gain. Interpret with the family means, both\
    \ margins and cross-talk. Also rerun scratch/token_scores.py on the candidate\
    \ to measure the lower-half detector shift."
  exploitation: "The additive, ungated form is active from step 0, so it cannot stay\
    \ dormant the way the family channel did. It also tests the locality premise directly.\n\
    \nTwo controls are pre-registered, to run only if there is a gain:\n1. Private\
    \ per-compartment detectors at the same width, to isolate sharing.\n2. The same\
    \ path on the final stride-32 map, to isolate locality.\n\nA null result bounds\
    \ stride-16 locality, given that the measured drop in opposite-half sensitivity\
    \ is only 0.31\u21920.23. It would not refute sharing."
  budget: "Everything runs inside the ordinary forward pass. The stride-16 activation\
    \ is already computed and kept for backward.\n\nPer image, the added work is 196\xD7\
    257\xD764 multiply-adds (about 6.4 MFLOP, roughly 0.4% of the ReXNet-200 forward),\
    \ a LayerNorm, one fixed 3\xD73 stride-2 convolution, and one einsum over four\
    \ attention rows in the float32 block. That is about 16.6k parameters and a small\
    \ activation (~40k cells \xD7 64 per batch).\n\nThere are no new batch keys, no\
    \ preparation change, no second pass and no extra updates. Recent valid arms ran\
    \ 1,585\u20131,595 s against the 1,797 s ceiling. Expected overhead is under 1%\
    \ but unmeasured; the runtime check decides."
  implementation: "Mode: add. Nothing is removed and removed_idea_ids is empty.\n\n\
