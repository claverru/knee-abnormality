  - shared-disease-auxiliary-20260920T221219Z-2457a3ee
  decision: inconclusive
- id: disease-evidence-compartment-routing
  mechanism_id: token-disease-evidence-with-compartment-routing
  parent_idea_id: null
  title: Learn shared local disease evidence with separate compartment routing
  opportunity: The rejected pooled adapter acted only after separate attention compressed
    the study. Transferable disease evidence may need to be learned and assigned to
    anatomy before that compression, while localization remains compartment-specific.
  mechanism: Learn a small nonlinear disease-family feature transform on existing
    tokens and let distinct medial/lateral attention routes select from those shared
    features. Retain independent output heads and access to the existing token representation.
    Explicitly distinguish appearance used for classification from location/context
    used for assignment when the design calls for it.
  precedents:
  - docs/research/medial-lateral-transfer.md#candidate-2-shared-disease-features-independent-decisions
  - docs/research/knee-side-and-location.md#5-separate-attention-inputs-from-pooled-appearance
  - docs/history/sharing/2026-09-13-compartment-attention-diagnosis.md
  novelty: Shares disease features before pooling rather than only adapting pooled
    vectors. Unlike 1C, it need not force meniscus and OA to share the same medial/lateral
    attention-score contrast. Exact design remains subject to review.
  coverage: Retain the existing visually valid token set, sampled images and independent
    binary targets. Separate routes must allow either or both compartments to contain
    disease; broad receptive fields are not isolated anatomical patches.
  exploitation: Learn reusable visual patterns from both compartments while letting
    anatomy and surrounding context determine which prediction receives the evidence.
  budget: Use a small transform over existing backbone tokens, with no second encoder,
    external localizer, extra images or training steps. Per-token work can be materially
    larger than pooled adapters; block if it cannot fit the sealed wall-clock and
    device-memory budget.
  implementation: Modify model/spatial-token paths or transfer helpers, keeping scoring
    outputs, data selection and accounting unchanged. Record exactly what is shared,
    what is compartment-specific, and whether coordinates enter attention, pooled
    features or both. Include deterministic inference and identity evidence.
  open_choices: Choose one family scope, transform, and routing design with a budget
    argument. Anatomical metadata may support routing within policy but is not a prerequisite
    for every design. A gain still needs capacity and localization interpretation;
    attention maps alone cannot prove correct disease attribution.
  dependencies: []
  priority_rationale: A distinct earlier-stage sharing mechanism with broader scope
    and higher implementation cost. Rank against the completed adapter evidence and
    new research rather than treating architectural complexity as expected gain.
  status: blocked
  created_revision: 10
  ranking_rationale: "Approving the candidate: the diff implements the assigned exchange-symmetric\
    \ pair-contrast readout, preserves the contract (no recipe, loss, sampling, cohort\
    \ or interface change; only preprocessing_identity-participating file touched\
    \ is model.py, which the policy allows), and records its source and configuration.\n\
    \nQueue change: admitting reciprocal-compartment-readout-transfer (proposal_admission\
    \ reports no unresolved dependencies). It is ranked second because it is the cheapest\
    \ clean test of the campaign hypothesis \u2014 it reuses each existing head on\
    \ the other compartment's pooled features with essentially no new parameters and\
    \ no inference-time change, so a positive result is much less confounded by capacity\
    \ than either the contrast readout or the running shared-disease-auxiliary arm,\
    \ and a null result constrains the hypothesis rather than the implementation.\
    \ It is mechanistically distinct from both active arms: no tying, no new detector,\
    \ training-only. It supersedes nothing; the retired isotropic weight-distance\
    \ coupling penalty is prior evidence and its coefficient sweep is not restarted.\
    \ Remaining queue order is unchanged below it."
  blocked_reason: "Both proposals have satisfied dependencies and are admitted; the\
    \ queue is reranked because the probe evidence I re-derived changes what the strongest\
    \ untried mechanism is.\n\nconserved-evidence-compartment-assignment enters at\
    \ rank 2 (behind the reserved prepared head). It is the only registry mechanism\
    \ whose compartment-specific parameterisation is a normalisation across compartments\
    \ per token: one detector per family trained by both compartments' positives,\
    \ with only placement compartment-specific. That is prevalence-symmetric in the\
    \ shared part by construction, which is exactly the failure mode of the rejected\
    \ pooled adapter (prevalence domination of shared pooled parameters), and it acts\
    \ before compression rather than after. It reproduces the parent at initialisation,\
    \ so an identity check is available.\n\ndisease-evidence-compartment-routing is\
    \ parked. It is the same class as the admitted proposal but gives each compartment\
    \ a free, unconstrained token route, which does not constrain the measured problem:\
    \ the paired heads already behave like one study-level factor plus an offset,\
    \ and a free per-compartment route is also the reading that additional capacity\
    \ alone would produce. Running both would be two near-duplicates competing for\
    \ full-budget slots; the constrained form dominates on rationale. Parked, not\
    \ rejected \u2014 a routing arm remains revisitable if conserved assignment shows\
    \ the shared-detector half is the useful part.\n\ncross-compartment-attribution-exclusivity\
    \ is admitted but ranked last. Its appeal is real (zero added parameters, nothing\
    \ at inference, so a macro gain cannot be capacity), but by its author's own statement\
    \ it supplies no transfer route; it only removes a penalty for sharing. Its value\
    \ therefore depends on whether the pending sharing arms actually lose within-study\
    \ discrimination, which the reserved head and the running auxiliary will show.\
    \ Two further reasons to hold it: it turns the compartment-margin diagnostics\
    \ into partial training targets, so they stop being independent confirmation of\
    \ transfer, and the exclusivity premise is questionable at stride-32 tokens whose\
    \ receptive fields span both compartments. Its named random-mask attribution control\
    \ is correctly not prequeued.\n\nRelative order of reciprocal-compartment-readout-transfer\
    \ and anatomical-medial-axis-mirror-attention is unchanged."
- id: compartment-pair-contrast-readout
  mechanism_id: exchange-equivariant-pair-contrast-readout
  parent_idea_id: null
  title: Predict each compartment pair jointly with one shared, exchange-symmetric
    contrast readout over the two pooled vectors
  opportunity: 'Every measured sharing mechanism made the two compartments more alike
    and lost the meniscus family: hard tying (1A/1B), isotropic classifier coupling
    (macro -0.0015, meniscus -0.0041) and the pooled adapter (meniscus -0.0114 [-0.0200,-0.0030]).
    The adapter''s sharpest loss was within-study compartment discrimination, margin
    -0.0191 [-0.0392,-0.0034], and the recorded explanation is prevalence-dominated
    shared parameters (Medial Meniscus 40.7% vs Lateral 15.8%; Medial OA 37.3% vs
    Lateral OA 27.4%, fold-0 class_balance.json). No mechanism has yet let one compartment''s
    prediction use the other compartment''s evidence, although compartments are read
    comparatively in practice and the shared morphology is exactly what makes a comparison
    meaningful. A shared comparison function transfers the common morphology while
    its output is a contrast rather than a common-mode boost, which is the one direction
    the measured failures leave open.'
  mechanism: 'Retain the existing independent per-target attention, pooled vectors,
    linear heads and main loss. For each evaluator pair (medial c, lateral c''), take
    the pooled vectors already computed in `_attention_pool`, form D = pooled_c -
    pooled_c'', and add a zero-sum increment: z_c += rho(D), z_c'' -= rho(D). rho
    is one small shared module per family, made odd by construction, rho(D) = f(D)
    - f(-D), with f a LayerNorm -> Linear(256,32) -> GELU -> Linear(32,1) whose output
    layer is zero-initialised. Oddness makes the pair map exchange-equivariant: swapping
    the two pooled vectors swaps the two logits exactly, so every study trains rho
    in both the medial and the lateral role and no compartment''s prevalence can dominate
    the shared parameters. The increment is zero-sum, so the mechanism can only separate
    the pair, never add a shared co-occurrence boost. At initialisation the model
    reproduces the reference exactly; the twelve public logits, their order and the
    inference entrypoints are unchanged.'
  precedents:
  - 'docs/validation/results/2026-09-20-compartment-adapter-result.md: rejected pooled
    shared adapter; meniscus family and margin both negative against control B; prevalence-domination
    explanation.'
  - 'docs/validation/results/2026-09-14-meniscus-soft-coupling-result.md: isotropic
    weight coupling reduced classifier distance 20.5% and lost macro 0.0015 and meniscus
    0.0041.'
  - 'docs/research/medial-lateral-transfer.md#why-biological-similarity-does-not-require-identical-classifiers:
    shared features do not imply one optimal shared classifier.'
  - 'autoresearch/campaigns/medial-lateral-transfer/prior-work.md: 1A/1B/1C archived-recipe
    evidence and the retirement of the adapter''s independent arm.'
  - 'src/knee_abnormality/evaluation/metrics.py: COMPARTMENT_PAIRS already fixes the
    two pairs used by the evaluator.'
  - 'Liu et al., C2-Net, Medical Image Analysis 2021 (https://www.sciencedirect.com/science/article/abs/pii/S1361841521000451):
    contralateral contrast between paired anatomy with a shared encoder.'
  - 'Donnelly et al., AsymMirai-style bilateral latent-difference models (https://arxiv.org/pdf/2304.00257):
    paired-region difference features in the latent space; mammography, not knee MRI.'
  - 'Zaheer et al., Deep Sets, NeurIPS 2017 (https://arxiv.org/abs/1703.06114): equivariant
    functions over a set of two elements; design principle only.'
  novelty: First proposal in which a compartment's prediction reads the other compartment's
    evidence. Sharing happens through a comparison function rather than a common transform
    of each compartment separately (rejected adapter), tied weights (1A/1B) or a weight-space
    penalty (retired coupling). Exchange equivariance makes the shared parameters
    prevalence-symmetric by construction, which addresses the recorded cause of the
    adapter's failure, and the zero-sum form makes the increment structurally incapable
    of manufacturing a co-occurrence boost.
  coverage: 'Neither, medial-only, lateral-only and both-positive all remain representable:
    the independent base heads are untouched and the increment is an additive shift
    that the heads can rescale. No prediction is forced to equal another. Observed
    masks, target order, twelve outputs, cohort, sampling and decoded pixels are unchanged;
    only `model.py` and the new transfer module change, so only preprocessing_identity
    may differ. Pairs come from the evaluator''s frozen COMPARTMENT_PAIRS, not from
    a post-hoc label choice.'
  exploitation: Within a family, the positives of both compartments train the same
    comparison parameters, so the rare compartment (Lateral Meniscus 15.8%) inherits
    morphology learned mostly from the common one while keeping its own attention
    and its own classifier. The shared pattern is used where it is genuinely shared,
    in judging how the two compartments differ, instead of being forced into a single
    decision rule.
  budget: 'Pooled-level work: 8 studies x 2 families x 2 evaluations of a 256->32->1
    module per step, order 1e5 MACs against roughly 1.5e11 backbone MACs per step
    (208 triplets at 224 px), an estimated well under 0.01% of step time; activation
    memory is negligible against the recorded 21.4 GB peak. No extra images, encoder
    passes, optimizer steps, teachers or caches. Prediction adds the same negligible
    work, so the 1,562.3 s reference and the 1,797 s ceiling leave ample headroom.
    Runtime remains an estimate until the candidate''s own timing is recorded.'
  implementation: 'Adds to existing behaviour; removes nothing. Retains independent
    attention, pooled features, the twelve heads and the class-balanced BCE unchanged.
    New module under `src/knee_abnormality/modeling/compartment_transfer/`, called
    inside `_attention_pool` after `pooled` and `logits` are formed, in float32 outside
    autocast, with the output layer zero-initialised so initialisation matches the
    reference. `KneeAbnormalityModel.__init__` receives only `target_count` and `src/knee_abnormality/inference/checkpoint.py`
    is not editable, so the pair identity must be configured as target indices under
    `model.compartment_transfer` and validated against the frozen twelve-target order;
    the constructor signature and `forward` return type stay unchanged. Validation
    stays deterministic and unaugmented; the checkpoint reproduces the recorded configuration
    with no compatibility shim. If another idea is accepted while this is in development,
    rebase onto the new incumbent source and re-run integration review: this mechanism
    is orthogonal to a training-only auxiliary and to token-level routing, so it should
    then be measured as A+B against the accepted A, declaring nothing removed.'
  open_choices: 'Odd zero-sum rho (default) versus an exchange-equivariant form that
    also carries a common-mode branch: pick one before launch with a stated rationale,
    never sweep both. Whether D is LayerNormed or scaled; hidden width (32 by default,
    matching the existing readout width); whether both families or meniscus only receive
    a rho; per-family rho (default) versus one rho shared by meniscus and OA, which
    would re-impose the 1C style cross-family constraint. Whether the pooled inputs
    to rho are detached from attention (default: not detached).'
  dependencies: []
  priority_rationale: Cheapest genuinely new mechanism class in the campaign, aimed
    precisely at the one diagnostic every previous sharing attempt degraded, symmetric
    by construction against the documented prevalence cause, covering both families,
    with negligible budget and device-memory risk and an exact-identity initialisation.
  status: completed
  created_revision: 22
  ranking_rationale: "Both proposals have satisfied dependencies and are admitted;\
    \ the queue is reranked because the probe evidence I re-derived changes what the\
    \ strongest untried mechanism is.\n\nconserved-evidence-compartment-assignment\
    \ enters at rank 2 (behind the reserved prepared head). It is the only registry\
    \ mechanism whose compartment-specific parameterisation is a normalisation across\
    \ compartments per token: one detector per family trained by both compartments'\
    \ positives, with only placement compartment-specific. That is prevalence-symmetric\
    \ in the shared part by construction, which is exactly the failure mode of the\
    \ rejected pooled adapter (prevalence domination of shared pooled parameters),\
    \ and it acts before compression rather than after. It reproduces the parent at\
    \ initialisation, so an identity check is available.\n\ndisease-evidence-compartment-routing\
    \ is parked. It is the same class as the admitted proposal but gives each compartment\
    \ a free, unconstrained token route, which does not constrain the measured problem:\
    \ the paired heads already behave like one study-level factor plus an offset,\
    \ and a free per-compartment route is also the reading that additional capacity\
    \ alone would produce. Running both would be two near-duplicates competing for\
    \ full-budget slots; the constrained form dominates on rationale. Parked, not\
    \ rejected \u2014 a routing arm remains revisitable if conserved assignment shows\
    \ the shared-detector half is the useful part.\n\ncross-compartment-attribution-exclusivity\
    \ is admitted but ranked last. Its appeal is real (zero added parameters, nothing\
    \ at inference, so a macro gain cannot be capacity), but by its author's own statement\
    \ it supplies no transfer route; it only removes a penalty for sharing. Its value\
    \ therefore depends on whether the pending sharing arms actually lose within-study\
    \ discrimination, which the reserved head and the running auxiliary will show.\
    \ Two further reasons to hold it: it turns the compartment-margin diagnostics\
    \ into partial training targets, so they stop being independent confirmation of\
    \ transfer, and the exclusivity premise is questionable at stride-32 tokens whose\
    \ receptive fields span both compartments. Its named random-mask attribution control\
    \ is correctly not prequeued.\n\nRelative order of reciprocal-compartment-readout-transfer\
    \ and anatomical-medial-axis-mirror-attention is unchanged."
