- id: shared-family-level-channel
  mechanism_id: additive-shared-family-level-channel-with-free-compartment-scale
  parent_idea_id: null
  title: Add one internal attention-pooled channel per family, shared by both compartments
    and added to each compartment logit with its own zero-initialised signed scale,
    keeping all four private pathways intact
  opportunity: 'In the reference predictions, the pair logits are far more coupled
    than the labels: OA r=0.854 versus a label r=0.511; meniscus r=0.389 versus 0.130.
    The OA lateral-on-medial slope is 0.70, and the standard deviation of the OA difference
    is only 1.03 against about 1.8 for each logit. Most of each compartment score
    is therefore a common family component, which two private pathways currently estimate
    separately. The lateral compartments have the fewest positives and the weakest
    AUCs. Estimating the common component once, from both compartments'' gradients,
    gives the lateral side a level trained on roughly the union of positives. The
    private pathways are then left to carry the compartment-specific residual. No
    arm has yet shared readout parameters while keeping both private pathways unconstrained.'
  mechanism: 'Extend the attention output layer and the head by one internal channel
    per family, two in total. Each channel is an ordinary target channel: its own
    attention row over the unchanged tokens, its own softmax pool per study, and its
    own head row and bias. Together they give a family score s_f per study. Public
    logits become z_med = z_med_own + a_med * s_f and z_lat = z_lat_own + a_lat *
    s_f, with four free scalars initialised to zero. The model therefore starts exactly
    at control B, and a receives gradient immediately because s_f is non-zero at initialisation.
    s_f is never exported, and there is no auxiliary loss or new target. It is trained
    only through the unchanged class-balanced BCE on the four compartment labels,
    so its gradient is the sum of both compartments'' gradients; that is the sharing.
    Signed free scales let the data decide whether the shared channel acts as a common
    level, a lateralization contrast or neither.'
  precedents:
  - 'compartment-pair-channel-rotation (inconclusive; all four targeted labels fell):
    a fixed level/lateralization basis over two independent channels that shared no
    parameter.'
  - 'conserved-evidence-compartment-assignment (inconclusive, disfavoured): a token-level
    shared detector with a conserved, competing split degraded lateralization. This
    proposal has no conservation and no competition.'
  - 'compartment-exchange-operator-tied-pathway (running): replaces the lateral pathways
    with the medial detector applied to transformed tokens. This proposal retains
    every pathway.'
  - 'shared-disease-auxiliary (inconclusive): training-only shared supervision on
    pooled features, with no shared inference pathway.'
  - 'prior-work.md: historical 1A/1B hard classifier sharing (mixed) and meniscus
    soft coupling at 0.1 (macro -0.0015). Those tied or pulled the existing heads
    together; this proposal adds a separate shared pathway and constrains nothing.'
  - Multi-task shared-plus-task-specific decomposition, e.g. cross-stitch networks
    (Misra et al., CVPR 2016), which share parameters additively while keeping private
    branches.
  novelty: It adds genuinely shared parameters at the readout without removing, tying
    or penalising any existing pathway. The shared channel has its own attention,
    so it can pool over the whole family region instead of reusing either compartment's
    weights. Zero-initialised signed scales give an exact control-B start and data-decided
    sharing. It uses no auxiliary loss, labels or target changes. It is distinct from
    rotation (no sharing), the conserved split (competition), the tied pathways (removal)
    and the queued cross-family attention ties.
  coverage: 'Both private pathways and free biases remain, so all four label patterns
    stay representable. Sharing is additive, with a per-compartment magnitude and
    sign, and is never a tie. Both families are included. Caveat: s_f learns whatever
    the two compartments have in common, co-occurrence included. The matched private-channel
    control separates capacity, but not co-occurrence from morphology. The pair and
    co-occurrence diagnostics must be read with that in mind.'
  exploitation: 'The family component is learned once from both compartments'' supervision,
    which roughly doubles the effective positives behind the lateral compartment''s
    level. The private channels are freed to specialise on side-specific evidence,
    which is the measured weakness: the OA margin AUC is 0.866.'
  budget: Two extra attention and head rows (14 instead of 12) make the attention
    MLP output and pooling einsum about 17% larger. That stage is small next to the
    backbone, so the addition is a small fraction of step time. About 780 parameters
    are added. There is no extra forward pass, and inference keeps the same shape.
