  exploitation: One appearance detector is trained by every meniscus positive from
    either compartment (419 family-positive studies instead of 356 and 138 separately),
    which is the direct expression of the user's hypothesis that the same disease
    looks similar in both compartments. The compartment decision rests on selection,
    where the reference already performs well for meniscus (margin AUC 0.971 on 344
    exclusive studies), so the mechanism leans on the model's stronger channel for
    assignment and its weaker channel for sharing.
  budget: Net -256 parameters. Extra work is one LayerNorm pass over the batch's tokens
