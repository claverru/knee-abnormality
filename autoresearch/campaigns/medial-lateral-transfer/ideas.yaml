- id: within-knee-exclusive-differential-ranking
  mechanism_id: balanced-within-study-exclusive-pair-ranking-on-family-shared-detector-over-detached-pair-differential
  parent_idea_id: null
  title: Train one family-shared lesion direction to rank a knee's diseased compartment
    above its healthy sibling in exclusive studies, reading the pair's detached attention
    differential over backbone features so the knee-level factor cancels by construction.
  opportunity: "The cross-talk strata are driven by a knee-level factor. In training,\
    \ 750 of 961 Lateral OA positives are also Medial OA positive, and even confidently\
    \ negative sibling-positive studies score 0.768 against 0.909 for clean negatives.\
    \ The main BCE and every cross-study auxiliary tried can reward that factor; the\
    \ shared auxiliary raised meniscus cross-talk from 0.636 to 0.711. Only exclusive\
    \ studies separate compartment evidence from knee evidence: 769 in OA and 1,429\
    \ in meniscus. Within one knee the factor is common to both compartments, so a\
    \ within-knee contrast is the one supervision where it cancels. The pair's joint\
    \ displacement is correctly oriented in 96\u201398% of studies, while single OA\
    \ rows put only 0.53\u20130.66 of their mass on the correct half. The differential\
    \ a_m \u2212 a_l uses exactly that joint signal."
  mechanism: "For family f and a study with exclusive labels, compute \u0394_f = \u03A3\
    _t (\xE2_m(t) \u2212 \xE2_l(t))\xB7feat(t). Here \xE2 are the detached compartment\
    \ attention distributions from the same forward pass, and feat are the projected\
    \ backbone features: appearance only, before position/plane/contrast embeddings\
    \ and mil_norm. The shared evidence is e_f = v_f\xB7\u0394_f, with one 256-d v_f\
    \ per family. The loss is |y_m\u2212y_l|\xB7softplus(\u2212s\xB7e_f), with s =\
    \ +1 when medial is the diseased compartment. It is averaged separately over medial-diseased\
    \ and lateral-diseased pairs, and the two averages are weighted equally, so a\
    \ pure medial-versus-lateral anatomy direction earns nothing. Total loss = BCE\
    \ + 0.05\xB7aux. Overlapping attention tails cancel in \u0394, and gradient reaches\
    \ only the projection and backbone. Both exclusive types train the same v_f, so\
    \ the scarcer lateral-diseased contrasts borrow a side-agnostic lesion direction\
    \ from the medial ones (OA 558 vs 211, meniscus 1,150 vs 279). This is the transfer.\
    \ It is training-only; heads, attention and the twelve outputs are untouched."
