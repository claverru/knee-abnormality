- id: cross-family-mediolateral-axis-agreement
  mechanism_id: cross-family-attention-displacement-agreement
  parent_idea_id: null
  title: Make the meniscus and OA pairs agree on which side of the knee is medial
    by constraining their attention's mediolateral displacement, with zero parameters
    and no inference change
  opportunity: Lateral OA is the second-weakest label in the reference (0.8686) and
    its failure is lateralization, not detection. Within the 329 medial-OA-positive
    studies its AUC collapses to 0.7599 against 0.8398 in the 575 medial-negative
    studies; cross-AUC is 0.832 medial-score-to-lateral-label and 0.850 the other
    way; OA margin AUC on exclusive studies is 0.8661 against the meniscus pair's
    0.9712. With 186 of 241 lateral-OA positives co-occurring with medial OA, the
    pair can score well by reporting that the knee has OA while leaving the compartment
    decision largely unmade. Two facts make an intervention cheap. Nothing in the
    model currently requires a compartment target to attend to its own side of the
    knee. And every campaign arm so far couples the two compartments within one family;
    the two families are never coupled, even though they see the same anatomy, so
    the well-lateralized meniscus pair's implicit mediolateral axis is unavailable
    to the poorly lateralized OA pair.
  mechanism: 'Training-only penalty, zero parameters, no inference change. Every token
    already carries a usable mediolateral coordinate: the in-plane anchor x computed
    in feature_geometry for axial and coronal tokens, and the slice position already
    computed for position_1d for sagittal tokens. For each study, each plane present
    and each family f, compute the attention-weighted mean coordinate under the family''s
    medial target minus that under its lateral target, delta(f, plane), using the
    attention weights already formed in _attention_pool over that study''s valid tokens.
    The absolute medial direction is unknown - it depends on knee side, and reflection
    mirrors axial/coronal images while negating sagittal positions - but reflection
    is drawn once per study and is shared by both families, so the sign of delta is
    unknown yet common to the two families within a study and within a plane. The
    penalty exploits exactly that: anchor the sign on the better-lateralized family,
    s = sign(delta(meniscus, plane)) detached, and penalise relu(margin - s * delta(oa,
    plane)), averaged over planes present and over studies, added to the unchanged
    BCE with one fixed coefficient. The hinge does two things at once: it forces each
    pair to actually separate along the mediolateral axis by at least margin, and
    it forces the two diseases to separate in the same direction. Agreement is required
    per plane, so no assumption about cross-plane sign conventions is needed. Logits
    are never touched, so both-positive and neither studies stay fully representable.'
  precedents:
  - Guo, Zheng, Fan, Yu, Wang, Visual Attention Consistency Under Image Transforms
    for Multi-Label Image Classification, CVPR 2019 - attention-map consistency as
    an auxiliary loss. That work uses a two-branch network over a transformed copy;
    this uses a single forward and constrains consistency across targets rather than
    across transforms, so it adds no encoder pass.
  - 'Historical 1C, disease plus signed compartment attention (docs/modeling/retired-side-and-compartment-variants.md:86-96):
    two 128-d disease vectors plus one signed compartment vector shared across the
    four paired targets, with 1B''s tied classifiers. Local 0.892538 vs 0.892360,
    public 0.931 vs 0.936. Closest precedent and structurally different - it hard-tied
    parameters inside the score function; this ties nothing, leaves all twelve scorers
    free and adds no parameters.'
  - 'Retired attention priors and token graph (autoresearch/campaigns/medial-lateral-transfer/prior-work.md):
    per-target coordinate priors regressed. Those require knowing where medial is
    in absolute coordinates; this needs only cross-family agreement on an unknown
    but shared sign.'
  - 'Queued idea anatomical-medial-axis-mirror-attention: supplies the absolute axis
    from patient maps plus a knee-side rule and mirror-ties one scorer within a family.
    Complementary, not overlapping - this proposal needs neither patient coordinates
    nor knee side, adds no scorer, and couples across families. The two could later
    stack.'
  - 'Campaign arm conserved-evidence-compartment-assignment (inconclusive, ...20260920T225138Z-f55d4ff3):
    a competing token-level assignment gate degraded meniscus margin AUC by 0.0145.
    Evidence that forcing assignment through a parameterised gate on the evidence
    path is harmful; this constrains only where attention sits and adds no gate.'
  - 'Probe: within-stratum lateral AUC (0.7599 vs 0.8398), cross-AUC and co-occurrence
    counts from this report, computed against runs/13-control-repeat/fold_0/validation_predictions.csv.'
  - 'Reflection semantics verified in modeling/augmentation.py: apply_reflection flips
    non-sagittal images on the width axis and sagittal images on the slice axis, reflection_positions
    negates sagittal positions, and the reflection draw is per study - the basis for
    the shared-sign argument.'
  novelty: The first mechanism in this campaign that transfers between the two disease
    families rather than between the two compartments of one family, and the first
    to use the study-level reflection and knee-side sign ambiguity as a resource instead
    of an obstacle - agreement is well posed precisely because the unknown sign is
    shared. It adds zero parameters and no inference-time computation, so capacity,
    added task weight and altered prediction paths are excluded as explanations of
    a gain by construction. Unlike 1C it imposes no shared vector and no tied classifier;
    unlike the retired attention priors it never asserts an absolute medial direction;
    unlike the conserved-split arm it constrains attention placement rather than routing
    evidence.
  coverage: Constrains all four compartment targets and, unlike every label-conditioned
    auxiliary tried so far, applies to every training study rather than only positives
    - the anatomical relation holds whether or not disease is present, so it supplies
    signal on every triplet. The other eight targets are untouched. Because only attention
    placement is constrained and no logit is modified, neither, medial-only, lateral-only
    and both-positive remain representable and the pair's total evidence is unchanged.
    Gradients reach the attention trunk, projection and backbone.
  exploitation: 'Predicts a specific, checkable pattern: OA margin AUC (0.8661) and
    lateral-OA-within-medial-positive AUC (0.7599) should rise, OA lateral cross-talk
    (0.622) should fall, while the meniscus pair, which supplies the anchor sign,
    should be roughly unchanged - a meniscus regression would mean the anchor is being
    distorted rather than used. Because the campaign evaluator already reports margin
    AUC on exclusive studies, training against a related quantity makes that diagnostic
    non-independent for this arm; it must be read as a manipulation check, with the
    macro rule alone governing adoption. A matched control to name but not prequeue:
    the same hinge applied between two unpaired targets at the same coefficient, separating
    anatomical agreement from generic attention sharpening.'
  budget: 'A handful of weighted reductions over the attention tensor already materialised
    in _attention_pool, restricted to four target rows; negligible against 235 s of
    headroom. Two real risks. First, inertness: if the two families'' displacements
    already agree and exceed the margin, the penalty is near zero at initialisation
    and the arm measures nothing - the hinge margin is what prevents this, and the
    trained-parameter checks used on earlier arms do not apply here since there are
    no parameters, so the run must log the penalty''s value and share of the objective
    from step 0. Second, the macro bar: gains confined to the OA pair are divided
    by twelve, so even a large OA improvement may land inside the 0.0034 seed floor;
    the run is still worth its budget because the mechanism is zero-cost, zero-parameter
    and yields an unambiguous attribution either way.'
  implementation: 'Adds to existing behaviour; removes nothing and replaces no accepted
    idea. Retain: all twelve attention rows and head rows, mil_norm, spatial tokens,
    residual-readout option, main class-balanced BCE, optimizer, schedule, sampling,
    augmentation, cohort and checkpoint selection, and inference/checkpoint.py byte-identical.
    Add: return the per-token in-plane anchor x and slice position from encode_batch''s
    dict in modeling/model.py (both are already computed there, for position_2d and
    position_1d respectively), expose the per-study attention weights to a training-only
    consumer without changing forward''s return type or the inference path, and place
    the penalty under src/knee_abnormality/training/compartment_transfer/ with configuration
    under trainer.compartment_transfer holding the two pairs as target indices validated
    against the frozen twelve-target order. image_plane is already returned and gives
    the per-plane grouping. Coordinates must be taken inside the existing float32,
    autocast-disabled block, consistent with how geometry is handled today. Requires
    a coefficient-zero identity check against the parent, since no RNG consumption
    may change. If compartment-pair-channel-rotation or cross-compartment-attribution-exclusivity
    is accepted during development, rebase onto that source and measure A+B against
    the accepted A; this is orthogonal to both, since neither constrains where attention
    sits.'
  open_choices: The hinge margin and the coordinate scaling, which must be fixed and
    recorded before launch and not swept afterwards. Anchoring on the meniscus pair,
    which the reference data favours, versus a symmetric detached sign consensus that
    does not privilege a family. Hinge form versus a bounded product of tanh terms
    that penalises only sign disagreement - the product form cannot force separation
    and risks inertness, the hinge risks pushing attention to the extreme tokens.
    Whether to include sagittal tokens, whose mediolateral coordinate is the slice
    position and whose sign convention relative to in-plane x is unverified; per-plane
    agreement sidesteps the question, and sagittal could be dropped if the plane-wise
    term proves unstable. Whether to weight studies by attention concentration so
    diffuse maps contribute less.
  dependencies: []
  priority_rationale: Rank second. It targets the largest measured compartment deficit,
    costs nothing in parameters or compute, and gives the cleanest attribution of
    any proposal in the queue. It ranks below the contrastive arm because its premise
    - that the two families currently disagree on the mediolateral axis - cannot be
    checked without a GPU forward, so inertness is a live risk, and because an OA-only
    gain is the hardest to push through the twelve-label macro rule.
  status: completed
  created_revision: 108
  ranking_rationale: "Admitted family-shared-local-lesion-evidence. It has no dependencies\
    \ (proposal_admission satisfied) and is in scope: one detector per family is shared\
    \ by both compartments, and each compartment reads it through its own existing\
    \ attention. It covers both the meniscus and OA pairs. All four joint outcomes\
    \ stay representable because the private stride-32 path is unchanged, and the\
    \ output stays at 12 logits.\n\nIt is materially distinct from earlier arms because\
    \ it is the first shared evidence taken from a map finer than the attention grid.\
    \ Earlier sharing arms were gated or dormant (family channel), competing-gated\
    \ (conserved evidence), stride-32 pooled (value tie) or training-only (PIT MIL).\
    \ The ungated additive form answers the recorded failure mode of the family channel,\
    \ where the gate stayed dormant. The extra cost is about 0.4% of forward FLOPs\
    \ from an activation that is already computed. There is no new preparation and\
    \ no second pass.\n\nI ranked it after the reserved head and the already-queued\
    \ bilateral arm, for two reasons:\n- **Small locality gain.** In the researcher's\
    \ own receptive-field data, the stride-16 cells cut the opposite-half input share\
    \ only from about 0.31 to 0.23.\n- **Attention is still stride-32.** The shared\
    \ evidence is tent-pooled back onto stride-32 anchors and weighted by the existing\
    \ stride-32 attention. The OA medial/lateral attention overlap of 0.64\u20130.70\
    \ still limits OA separation.\n\nOwnership: `docs/backlog/big-bets.md#intermediate-stride-16-feature-fusion`\
    \ is a generic backlog plan that changes the token grid for all labels, not a\
    \ campaign. This arm is a compartment-only scalar evidence path confined to the\
    \ campaign's editable directories, so it does not take over or pre-empt that bet.\
    \ Any result informs the bet but does not stand in for it.\n\nanatomy-supervised-compartment-evidence-split\
    \ stays proposed. This event gives no new basis to queue it."
