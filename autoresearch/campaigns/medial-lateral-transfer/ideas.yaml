- id: family-shared-local-lesion-evidence
  mechanism_id: family-shared-stride16-local-evidence-read-through-compartment-attention
  parent_idea_id: null
  title: Read one family-shared lesion detector on the backbone's stride-16 map through
    each compartment's existing attention, so medial and lateral share local morphology
    evidence that carries less whole-knee context
  opportunity: "Control B reads compartment evidence with private linear rows on stride-32\
    \ tokens. New CPU diagnostics on its checkpoint (scratch/evidence-summary.md):\n\
    - A stride-32 token 64 px from the midline puts 30\u201332% of its input sensitivity\
    \ in the opposite image half; a stride-16 cell puts 23%.\n- In 32 validation studies,\
    \ the medial and lateral OA detectors correlate about 0.75 within a study, and\
    \ both peak on the same image half in every label group, including lateral-only\
    \ knees. OA detection is therefore already effectively shared.\n- The evidence\
    \ is knee-level, though. In medial-only knees, the lateral-OA detector on the\
    \ lower coronal half sits 0.97 logits above its value in neither-knees.\n\nThis\
    \ fits the recorded cross-talk: lateral OA AUC is 0.722 against medial-only negatives\
    \ versus 0.909 against sibling-negative negatives. Every stride-32 sharing arm\
    \ landed at seed-noise level, and none changed where the evidence comes from."
  mechanism: "For each family f (meniscus, OA), one detector is shared by both compartments:\
    \ e_f(u) = v_f \xB7 LN(P h16(u)). Here h16 is ReXNet features.10 (257 channels,\
    \ 14\xD714 at 224 px), taken from the same forward pass. P is a 257\u219264 projection\
    \ and v_f is one 64-d vector per family.\n\nThe 14\xD714 evidence map is pooled\
    \ onto the existing stride-32 anchors with a fixed, anchor-aligned tent kernel.\
    \ ReXNet's origin is 0, so stride-16 cell 2k is the centre of stride-32 token\
    \ k. This gives \u0113_f(T) per existing token.\n\nEach compartment reads the\
    \ shared map through its own existing attention: z_c = z_c(control B) + \u03A3\
    _T a_c(T) \u0113_f(T). There is no gate or scale, so both compartments use the\
    \ identical local detector. All compartment specificity stays in the private attention\
    \ rows, head rows and biases.\n\nBoth compartments' labels train v_f and P. That\
    \ is shared morphology, and the lateral side gets the medial side's positives.\
    \ Gradient reaches the stage \u226410 features through a short path localised\
    \ by compartment attention. All four joint outcomes (neither, medial-only, lateral-only,\
    \ both) stay representable because the private path is unchanged. The other eight\
    \ targets keep their forward path, and the output stays 12 logits."
  precedents:
  - "docs/backlog/big-bets.md#intermediate-stride-16-feature-fusion: an unstarted,\
