  ranking_rationale: "Completion of attention-owned-compartment-gradient-routing:\
    \ the fixed rule gives reject. Macro \u0394 is \u22120.00392, 95% CI [\u22120.00769,\
    \ \u22120.00027]. The gates the developer flagged as pending are now measured\
    \ and pass. Compute was 1,617 s against a 1,797 s ceiling. Triplets, visits and\
    \ cohort hashes match exactly, and validation selection is identical in every\
    \ epoch.\n\nThe escalation concern was the confound with gradient mass, and the\
    \ logged kept share resolves it against the mechanism:\n- Kept share starts at\
    \ about 0.51 in both families. Meniscus rises to 0.80 by epoch 9, but OA reaches\
    \ only 0.60.\n- So for most of training the four compartment labels sent roughly\
    \ half of their trunk gradient. In the early epochs the intervention was close\
    \ to a uniform 0.5 scale on compartment trunk credit.\n- Medial and lateral kept\
    \ shares are identical by construction, since \u03A3a_m\xB2/(a_m+a_l) \u2212 \u03A3\
    a_l\xB2/(a_m+a_l) = \u03A3a_m \u2212 \u03A3a_l = 0. This is not a logging bug.\n\
    \nRouting did not buy specificity:\n- Meniscus compartment margin AUC fell from\
    \ 0.9712 to 0.9615, and OA's was flat (0.8661 to 0.8650).\n- Lateral cross-talk\
    \ did not improve (meniscus 0.636 to 0.638, OA 0.622 to 0.638).\n- Both family\
    \ means fell (meniscus \u22120.0069, OA \u22120.0036), and so did the other eight\
    \ (\u22120.0033).\n\nQueue change: I admitted the anatomy-supervised split. Its\
    \ dependencies are satisfied. It adds a shared evidence path with disease-free,\
    \ geometry-supervised assignment, so it targets the measured assignment weakness\
    \ without removing any compartment credit. I ranked it right after the reserved\
    \ head.\n\nWithin-knee ranking is additive supervision, so it moves above the\
    \ two subtractive trunk or attention-gradient interventions. Those two (the sibling\
    \ adversary and the discordant projection) share the direction this run weakened,\
    \ withholding or reversing compartment gradient on the shared trunk. They stay\
    \ queued, because each acts more narrowly than uniform-scale routing: the adversary\
    \ is confined to attention rows, and the projection to discordant studies and\
    \ conflicting components."
- id: discordant-sibling-gradient-projection
  mechanism_id: residual-sign-prioritized-asymmetric-sibling-token-gradient-projection
  parent_idea_id: null
  title: 'Stop a compartment''s push-down gradient from erasing the lesion features
    its sibling is being pushed up on: in sibling-discordant studies, project the
    conflicting component out of that label''s trunk-token gradient. Training-only
    and parameter-free; the forward pass matches control B.'
  opportunity: "New evidence is in scratch/evidence-summary.md of this job.\n(1) Lateral\
    \ detection without sibling disease is weak in every run. Against clean negatives,\
    \ isolated Lateral OA positives score 0.813\xB10.010 across 29 runs (control B\
    \ 0.840, +2.7 sd), against 0.934 when medial OA is also positive. Lateral Meniscus\
    \ scores 0.887 against 0.947. Lateral-local evidence governs about 40% of Lateral\
    \ OA ranking pairs.\n(2) Probe on 48 training studies with the control-B checkpoint,\
    \ using trunk-token Jacobians. In residual-discordant studies, 97% (OA) and 80%\
    \ (meniscus) of tokens receive opposing sibling gradients. About 12% (OA) and\
    \ 5% (meniscus) of the push-down sibling's gradient energy lies along the push-up\
    \ sibling's gradient. Concordant studies have 1\u20134% conflicting tokens.\n\
    Sibling negatives thus actively erase shared lesion features in the trunk. This\
    \ is negative transfer, and it falls on the scarce isolated positives."
  mechanism: "Fork the pre-mil_norm trunk token tensor into per-target views: the\
    \ eight other targets, MM, LM, MO and LO. Each view runs through the unchanged\
    \ mil_norm, attention and head rows for its targets, so forward values are identical.\n\
    \nA logit tap records s_c = sign(\u2202L/\u2202z_c) per study. Unobserved labels\
    \ give 0 and are skipped.\n\nIn backward, for each family, study and token: if\
    \ s_m \u2260 s_l and \u27E8g_down(t), g_up(t)\u27E9 < 0, then g_down \u2190 g_down\
    \ \u2212 (\u27E8g_down, g_up\u27E9 / \u2016g_up\u2016\xB2)\xB7g_up. g_up is untouched,\
    \ and the views are summed.\n\nThe asymmetry is deliberate. The push-up label\
    \ is evidence that lesion morphology exists in the knee. The push-down label only\
    \ says 'not in my compartment', which is an assignment statement. It keeps its\
    \ orthogonal trunk component and its full head, attention-row and shared-attention\
    \ gradients. So shared lesion features persist in the trunk, and compartment specificity\
    \ has to come from private rows. All four joint states stay representable.\n\n\
    Added transfer beyond the shared backbone: medial-only knees (558 OA, 1,150 meniscus)\
    \ stop degrading features that the scarce lateral-only positives (211, 279) rely\
    \ on, and the reverse also holds."
  precedents:
  - 'attention-owned-compartment-gradient-routing (running) scales both siblings''
    token credit by attention ownership in every study. That cuts about 43% (OA) and
    22% (meniscus) of compartment trunk credit, and review called it anti-sharing.
    This proposal is the pro-sharing, direction-aware counterpart: only the push-down
    sibling, only conflicting directions, only discordant studies.'
  - sibling-conditional-attention-adversary (queued) uses gradient reversal on the
    attention rows to remove sibling information. This proposal leaves the attention
    rows and heads untouched.
  - 'shared-disease-auxiliary and compartment-invariant-disease-embedding: auxiliary
    losses raised cross-talk or damaged the other eight labels. This proposal adds
    no loss term.'
  - 'cross-compartment-attribution-exclusivity (inconclusive): its penalty lowered
    cross-talk without any margin gain.'
  - 'Yu et al. 2020, PCGrad (NeurIPS): symmetric projection of conflicting task gradients
    on shared parameters.'
  - 'Sener & Koltun 2018, MGDA-UB (NeurIPS): gradients with respect to the shared
    representation serve as a cheap stand-in for parameter gradients.'
  - 'Lopez-Paz & Ranzato 2017 (GEM) and Du et al. 2018 (gradient-similarity weighting
    of auxiliary losses): asymmetric, priority-based projection.'
  novelty: This is the campaign's first direction-aware backward operator and its
    first mechanism grounded in a measured trunk-level gradient conflict, which earlier
    reports listed as missing evidence. Routing acts on ownership magnitude in all
    studies. Here the residual sign selects which sibling is projected, and only the
    component shared with the sibling is removed. There are no parameters, no loss
    and no gate that could stay dormant, and inference is bit-identical to control
    B.
  coverage: 'Both families (MM/LM and MO/LO) and all four joint states. It acts only
    in residual-discordant studies: OA exclusives are about 22% of training studies
    and meniscus exclusives about 41%, plus both-positive and neither studies the
    model misfits. The eight other targets keep their unmodified gradients.'
  exploitation: "Log per family and epoch, accumulated on device: the discordant-study\
    \ share, the conflicting-token share and the removed push-down energy share. A\
    \ share below 2% throughout means the run tested an inert operator.\n\nPre-registered\
    \ reads alongside macro AUC:\n- Isolated-positive strata: Lateral OA 0.840 (others\
    \ 0.813\xB10.010), Lateral Meniscus 0.896 (0.887\xB10.008). The reference is lucky\
    \ on these.\n- Both-positive against medial-positive negatives.\n- Cross-talk,\
    \ compartment margins, OA pair logit correlation (0.873).\n\nAttribution controls,\
    \ run only after a gain:\n- Symmetric projection, which tests the priority rule.\n\
    - Norm-matched removal along the push-up direction of another study, which tests\
    \ the shared direction against a reduction in negative gradient mass."
  budget: "The forward pass and inference are unchanged, with no batch keys and no\
    \ parameters. Training adds per-view mil_norm plus the attention hidden layer\
    \ over about 10.5k tokens per step (roughly 214 images \xD7 49): about 10 GFLOP,\
    \ against roughly 1 TFLOP for the backbone's forward and backward. The projection\
    \ is per-token dot products in fp32, and the extra memory is about 5 \xD7 10 MB.\
    \ Comparable arms measured 1,582\u20131,598 s against the 1,797 s ceiling. Diagnostics\
    \ avoid per-step host syncs."
  implementation: "Mode add on historical-control. Nothing is removed and removed_idea_ids\
    \ is empty.\n- modeling/compartment_transfer/sibling_projection.py:\n  - ResidualTap:\
    \ identity on the 12 logits. Its backward stores sign(\u2202L/\u2202z) for rows\
    \ 2\u20135 in a shared holder.\n  - SiblingFork: forward returns views of the\
    \ token tensor. Its backward runs after the tap, projects in fp32 and returns\
    \ the sum in the input dtype.\n- model.py pool_encoded: in training only, fork\
    \ before mil_norm and compute each view's rows with the existing modules, then\
    \ reassemble the 12 logits. The eval and predict path is unchanged.\n- config.py:\
    \ model.compartment_transfer.sibling_projection.pairs, given by target name and\
    \ validated against the frozen order. No numeric knobs.\n- lightning.py: diagnostics\
    \ only.\n- Review must check bf16 autocast dtypes (the PIT lesson) and that gradient\
    \ clipping is unchanged.\n\nIf an idea is accepted during development:\n- Routing:\
    \ stack by projecting the routed gradients, then renew review.\n- family-shared-local-lesion-evidence:\
    \ stack, and declare whether its stride-16 gradient path is forked too.\n- Adversary:\
    \ stack; its reversal reaches only the attention rows."
  open_choices: '- Fork site: pre-mil_norm (default, matches the probe) or post-norm.

    - Granularity: per token (default) or per study, flattened.

    - Discordance criterion: residual sign (default) or labels thresholded at 0.5.

    - Symmetric projection and head-row or shared-attention-layer sites are not options:
    they are reserved as controls. Symmetric projection would strip the positive sibling''s
    lesion push, and a head site would block the head''s own cross-talk learning.'
  dependencies: []
  priority_rationale: "Recommend this ahead of the queued adversary and ranking. It\
    \ rests on a directly measured conflict and targets the weakest, most stable stratum\
    \ (isolated lateral positives). It is forward-identical and free of dormancy risk,\
    \ and it adds no loss, which has been the failure pattern of aux arms. Uncertainty:\
    \ 5\u201312% removed energy at convergence may be too small, although early training\
    \ is probably larger and is unmeasured, and Adam normalisation may damp the effect.\
    \ Implementation cost is small: two autograd Functions."
