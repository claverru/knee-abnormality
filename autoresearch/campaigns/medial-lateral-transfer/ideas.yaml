- id: cross-compartment-attribution-exclusivity
  mechanism_id: attention-masked-attribution-exclusivity
  parent_idea_id: null
  title: Require each compartment's logit to survive erasure of the other compartment's
    most attended tokens, with no new parameters and no inference change
  opportunity: 'The same probe shows the pair heads behave like one detector plus
    a small offset, most severely for OA: the Medial OA score reaches AUC 0.832 on
    the Lateral OA label where the lateral head''s own score reaches 0.869, and within
    the 329 medial-positive studies lateral AUC drops to 0.760 (vs 0.840 in the 575
    medial-negative). Meniscus: cross-AUC 0.711 medial-from-lateral, margin AUC 0.971
    vs OA 0.866. A natural explanation, currently a hypothesis because attention maps
    need a GPU forward to inspect, is that the paired scorers attend to largely the
    same tokens, so both logits ride the same study-level evidence. Every sharing
    mechanism tried so far added a route for shared evidence and lost within-study
    discrimination. The untried complement is a guardrail with zero added capacity
    that makes the already-shared representation safe to share: each compartment must
    be supported by evidence the other compartment is not using.'
  mechanism: 'Training-only, no parameters. In the training step, reuse the attention
    weights and pooled vectors already computed for the batch. For each family pair
    (m, l) and study, form a detached mask from the other compartment''s in-study
    attention, mhat_l = pi_l / max_n pi_l, build w_m proportional to pi_m * (1 - mhat_l)
    renormalised over that study''s valid tokens, re-pool pooled_m'' = sum_n w_m tokens_n
    and evaluate the same head: z_m'' = head_m . pooled_m'' + b_m. Penalise only a
    drop: y_m * relu(z_m - z_m'' - margin)^2, and symmetrically for the lateral compartment
    with pi_m as the mask source. Average over observed cells and add lambda times
    that term to the unchanged class-balanced BCE; main targets, weights, mask and
    reduction are untouched. Weighting uses the compartment''s own soft marginal only,
    so no joint or independence assumption is introduced, unlike a probabilistic-OR
    family label. The penalty is one-sided and has a margin, so genuinely co-located
    evidence in both-positive studies is not forced apart; it only forbids a compartment
    from depending on the other''s peak evidence. Nothing changes at inference and
    the exported checkpoint is structurally identical to the reference.'
  precedents:
  - 'New probe (this report): `/tmp/medial-lateral-probe/pair-structure.txt` and `collinearity.txt`,
    derived from the reference''s `fold_0/validation_predictions.csv` and `data/folds/all_5fold_v3/`;
    conditional AUCs, cross-AUCs, joint-group counts and margin AUCs quoted above.'
  - 'docs/validation/results/2026-09-20-compartment-adapter-result.md: the diagnostic
    that failed was within-study compartment discrimination (margin -0.0191 [-0.0392,-0.0034]);
    this candidate acts on that mechanism directly instead of adding another shared
    route.'
  - 'autoresearch/campaigns/losses/ideas.yaml `shared-label-contrast-ranking` (rejected):
    a within-study ranking over all 66 label pairs on the main logits. This proposal
    does not supervise logit differences or label order at all; it constrains which
    tokens support a logit, so it is not that rule restricted to two pairs.'
  - 'autoresearch/campaigns/medial-lateral-transfer/ideas.yaml `shared-disease-auxiliary`
    (launched): adds a shared presence detector and extra presence task weight on
    the pair. This candidate adds no detector and no presence task; the two are complementary
    and their confounds are different.'
  - 'Li et al., Tell Me Where to Look: Guided Attention Inference Network, CVPR 2018
    (https://arxiv.org/abs/1802.10171): erases the network''s own attended region
    and requires the class score to fall. The constraint here is the opposite sign
    and cross-target: erase the other target''s attended region and require this target''s
    score to survive.'
  - 'Ross, Hughes, Doshi-Velez, Right for the Right Reasons, IJCAI 2017 (https://arxiv.org/abs/1703.03717):
    penalising where a model''s evidence comes from, rather than what it predicts;
    input-gradient based, no medical or paired-compartment evidence.'
  - 'Wei et al., Object Region Mining with Adversarial Erasing, CVPR 2017 (https://arxiv.org/abs/1703.08448):
    erasure of attended evidence to force discovery of additional supporting regions.'
  - 'src/knee_abnormality/modeling/model.py:211-240: the per-study softmax attention
    matrix and the head application are already materialised, so the masked re-pool
    is one extra einsum on tensors that exist.'
  novelty: 'The first campaign mechanism that constrains the source of a compartment''s
    evidence rather than adding a shared parameter, shared feature or shared target.
    It has exactly zero added parameters, so a macro gain cannot be explained by capacity,
    and it never asks the two predictions to be closer or further apart, so it cannot
    manufacture a common-mode or co-occurrence boost. Cross-target attention erasure
    is also new here: previous attention work in this repository added priors or a
    shared contrast vector, never a mutual-attribution constraint.'
  coverage: 'All four joint configurations remain representable; the penalty is one-sided
    with a margin and uses each compartment''s own observed soft marginal, so both-positive
    studies with genuinely overlapping evidence pay nothing beyond the margin and
    no independence assumption enters. Main twelve logits, target order, BCE targets
    and weights, cohort, sampling, augmentation and decoded pixels unchanged; absent
    at inference. Real risk to record: stride-32 tokens are broad receptive fields,
    not isolated compartments, so an exclusivity constraint can be anatomically wrong
    for small joints; lambda and the margin bound how hard it pushes.'
  exploitation: It does not add transfer; it removes the penalty for transfer. If
    each compartment must stand on its own evidence, the shared backbone and any shared
    detector can encode one morphology usable in both places without the two predictions
    collapsing into one study-level factor, which is the failure mode every previous
    sharing mechanism produced. That makes it a natural stacking partner for a shared-detector
    or shared-routing winner as well as a standalone candidate.
  budget: Four extra weighted pools per step (two families x two compartments), about
    8e7 MACs against roughly 1.5e11 backbone MACs, plus one extra head application
    on vectors that already exist; no new parameters, no extra images, no extra encoder
    pass, no extra optimizer steps, nothing at inference. Extra activations are on
    the order of a few hundred KB against the recorded 21.4 GB peak. Estimated well
    under 0.1% of step time against the 1,562.283 s reference and the 1,797 s ceiling;
    still to be measured, not asserted.
  implementation: 'Adds to existing behaviour; removes nothing. `_attention_pool`
    must expose the per-study attention weights and pooled vectors to a training-only
