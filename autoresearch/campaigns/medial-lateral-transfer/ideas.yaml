  - "compartment-invariant-disease-embedding (rejected): a backbone-wide auxiliary\
    \ at 0.3 damaged the other eight labels. Here the reversal is confined to 4\xD7\
    128 row parameters."
  - 'Dropped earlier: a CORAL / compartment-identity adversary (it removes distinguishability,
    the opposite goal) and a batch decorrelation penalty (batch size 8); a parametric
    adversary avoids per-batch statistics.'
  - Pair-logit in-sample refit ceiling of about +0.001 (researcher-20260921T001439Z-c9854a91).
    This mechanism acts on pooled representations instead.
  novelty: This is the first information-level constraint on compartment evidence,
    as opposed to spatial, output-level or tying constraints. It is label-conditioned,
    so the compartment's own co-disease is not suppressed, and its gradient is confined
    to private attention rows, limiting trunk side effects. It needs no orientation,
    metadata or new batch keys.
  coverage: "Both families in both directions. Only attention rows 2\u20135 and their\
    \ biases receive reversed gradient; the other eight targets change only through\
    \ shared training. The expected targets are the sibling-diseased-negative strata;\
    \ it also acts on meniscus, where attention already localises (0.71\u20130.84\
    \ correct-half) but hard negatives still sit at 0.852."
  exploitation: "It reuses the pooled vectors and attention hidden layer from the\
    \ existing fp32 block; the adversaries total 4\xD7258 training-only parameters.\
    \ Log the adversary loss against the label-only entropy: if it sits at that floor,\
    \ the constraint is not binding."
  budget: "One extra 4-row score and pooling pass over detached inputs, plus four\
    \ linear adversaries per step. That is negligible next to the backbone, with no\
    \ preparation or data change. Expected within the 1,580\u20131,597 s range measured\
    \ for earlier auxiliary arms, against the 1,797 s ceiling."
  implementation: "This adds to control B and removes nothing.\n- model.py: a training-only\
    \ return of the four rows' pooled inputs.\n- Host the adversaries under model.compartment_transfer:\
    \ they are exported and reconstructable, and this avoids KneeModule's resume key\
    \ drop and the build_optimizer signature break seen earlier.\n- training/compartment_transfer:\
    \ the GRL autograd function and the adversary loss.\n- lightning.training_step:\
    \ add \u03BB\xB7L_adv and log the adversary loss.\n- Validation and predict paths\
    \ stay untouched.\n- Check dtypes under bf16 autocast (lesson from the PIT crash).\n\
    - If the hemifield gate is accepted first, stack with review: the adversary targets\
    \ the residual leakage the gate cannot remove.\n- Attribution control, only after\
    \ a gain: the same GRL against a within-batch permuted sibling label."
  open_choices: "- \u03BB: fix it well below the main term, around 0.05\u20130.1;\
    \ no sweep.\n- Adversary form: linear (default, because the head is linear, so\
    \ linear leakage is what reaches the logit) or a small MLP.\n- Directions: include\
    \ medial\u2190lateral too (default yes, symmetric) or lateral only.\n- \u03BB\
    \ warm-up: default none.\n- Reversal reach: u_c only (default), or also the shared\
    \ attention hidden layer."
