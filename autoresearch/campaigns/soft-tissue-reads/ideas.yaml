- id: soft-tissue-map-on-the-28-by-28-grid
  mechanism_id: map-grid
  parent_idea_id: null
  title: Predict and teach the soft-tissue map on the second-stage grid and average
    it down to the cells
  opportunity: 'Evidence for the map, guess for the labels. The routing is only as
    good as the map. Its overlap rose from 0.45 on the 7 by 7 tokens to 0.55 on the
    14 by 14 cells, and on the tokens it was flat from epoch 5 with training equal
    to validation: the grid is the ceiling. In the reference it is 0.54 and 0.55 for
    the menisci and 0.48 to 0.58 for the cartilages, layers 2 to 4 mm thick on cells
    of 6 to 8.6 mm. Where the map is good the cell reader beats the fourth-stage read:
    on the mask scanner''s 52 validation studies run 1 is +0.021 on three labels (98%
    of resamples), and behind on the other 822. Known limit: the 1 mm masks were judged
    safe down to 4 mm cells; the 28 by 28 cells are 3.0 to 4.3 mm. Guess: +0.0005
    to +0.001 macro through sharper routing.'
  mechanism: 'The seven-class head predicts on the second-stage grid (28 by 28): its
    input is a new linear projection of the second-stage features to the token width,
    plus the third-stage projection and the fourth-stage tokens, each repeated to
    28 by 28 as the fourth-stage tokens are repeated to 14 by 14 today. The map loss
    is taken on the 28 by 28 grid, with targets sampled at that grid''s cell positions
    (feature_geometry with the second stage''s mapping, the same quadrature per cell).
    The shares used by the routing, the frame''s meniscus spots and the 7 by 7 meniscus
    shares are the detached 28 by 28 probabilities averaged down. The cell read stays
    on the 14 by 14 third-stage features; the routing rules are unchanged.'
  precedents:
  - 'meniscus-head-on-the-14-by-14-grid (view poses run 1): moving the head from 7
    by 7 to 14 by 14 raised overlap by 0.11 and 0.13 at 0.988 of the training time.'
  - 'rn18-soft-tissue-cells (run 1): the mask-scanner result and the map''s centres
    within 2.3 to 3.6 mm of the masks.'
  novelty: First map finer than the cells it routes.
  coverage: Every study for the routing; the 211 training mask knees for the map loss.
  exploitation: 'Read against the incumbent at both multipliers. Log on validation
    only the overlap per class of the map averaged down to 14 by 14, under the existing
    val_meniscus_overlap_* names so it compares with the incumbent, and the overlap
    of the two menisci on the 28 by 28 grid (two new metrics). Shown wrong by: no
    class overlapping better at 14 by 14 than the incumbent''s map.'
  budget: 'Up to 1.15 of the incumbent''s training time, and inside the campaign''s
    1.25 ceiling against the reference: the head runs on four times the positions;
    the backbone is unchanged. State the measured step time of one batch against the
    incumbent in the report.'
  implementation: 'Follow the environment paragraph of the developer instructions.
    Files: modeling/model.py, modeling/spatial_tokens.py (the second stage''s mapping
    and the identity texts), training/anatomy.py and training/lightning.py for the
    targets and the loss on the finer grid. Replaces the 14 by 14 map head; no option.
    Keep the head zero-initialised and new parameters under torch.random.fork_rng.
    The target lookup for 28 by 28 runs once per batch; do not keep the 14 by 14 lookup
    beside it. Report on one batch the number of supervised positions (four times
    the incumbent''s) and that averaging the targets down reproduces the incumbent''s
    14 by 14 targets. If the training time cannot stay within the budget, return blocked
    with the measured time instead of cutting anything.'
  open_choices: None.
  dependencies: []
  priority_rationale: Highest ceiling, since it sharpens the routing of all five labels;
