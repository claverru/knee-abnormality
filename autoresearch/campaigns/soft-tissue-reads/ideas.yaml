    16 gains Fracture +0.0064, ACL +0.0025, Contusion +0.0010 and loses Lateral Meniscus
    -0.0031, Lateral OA -0.0029, Medial OA -0.0026, with the largest cell-read logit
    of the campaign (0.109 to 0.220 against 0.073 to 0.155). Run 12 gains MCL +0.0031
    (the label that falls by 0.003 or more in six of sixteen runs), ACL +0.0014, Medial
    OA +0.0005 and is level on Lateral OA (-0.0003, where the sixteen runs average
    -0.0019), with the cell read unable to move the projection the map uses. Guess,
    medium: together above the incumbent at both multipliers.'
  mechanism: 'Two mechanisms of this campaign in one model, both exactly as their
    runs built them. (1) From run 16: the cell read''s softmax weighs each cell by
    its routing measure divided by the detached total routed measure of its view,
    q_i proportional to exp(s_i) * u_i / R_v, with the inherited floor, temperature,
    own-compartment support, unrouted fallback and readout. (2) From run 12: the cell
    read''s features are f_B = linear(h3, W_map.detach(), b_map.detach()) + R(d3),
    where d3 is h3 minus its valid-cell mean within each aligned 2 by 2 third-stage
    block and R is a zero-initialised bias-free linear projection; the map keeps training
    W_map. Nothing else changes.'
