- id: bundle-chosen-per-label-from-the-epoch-curves
  mechanism_id: bundle
  parent_idea_id: cell-attention-normalized-by-routed-area-per-view
  title: Combine the parts each label supports at both multipliers - area-normalised
    attention, transition map loss, the cell read's own projection, and the unpadded
    rim
  opportunity: 'Evidence per label from two readings of every run: the x1 validation
    AUC of each label averaged over epochs 6 to 10 against the incumbent at the same
    epochs (five epochs, steadier than one endpoint), and the x4 result. Across the
    nineteen runs the x1 reading has a common level per label (Lateral Meniscus -0.0028,
    Baker''s -0.0015, PF OA -0.0010, Effusion +0.0012, MCL +0.0011) and a spread between
    runs of 0.0006 to 0.0029, so a part is kept for a label only when it stands out
    from that level at x1 and agrees at x4. (1) Run 16, area-normalised attention:
    the only run above the incumbent on PF OA at x1 (+0.0009; level -0.0010, spread
    0.0008), above on ten of twelve labels at x1 (macro +0.0008, the best), level
    at x4. (2) Run 18, transition map loss: the menisci at x1 +0.0008 and -0.0003
    (levels -0.0003 and -0.0028) and at x4 +0.0001 and +0.0024, with the map overlap
    up 0.06 to 0.10 on every class. (3) Run 9, own projection for the cell read: Lateral
    OA +0.0016 at x1 and +0.0014 at x4, the only part that agrees on that label (run
    8 has +0.0026 at x1 and -0.0043 at x4; run 1 +0.0016 and -0.0016). Parts dropped
    because the two readings disagree or the x1 reading is below the level: PF OA''s
    own reader (PF OA -0.0008 at x1), the bone zone on the cells (PF OA -0.0025 at
    x1), the cell position (Lateral Meniscus -0.0029 at x1, +0.0015 at x4), the block-detail
    adapter (nothing above the level at x1). Medial OA moves with no part (spread
    0.0006). (4) New, from the audit of the reference: the 3 by 3 means of the routing
    count the zero padding, and 32% of patellar cartilage volume lies in the outer
    6 mm of the sagittal crop. Guess, medium: above the incumbent at both multipliers.'
  mechanism: 'Four changes in one model. (1) Run 16 as built: the cell read''s softmax
    weighs each cell by its routing measure divided by the detached total routed measure
    of its view. (2) Run 18 as built: the map''s regional Dice term is replaced by
    the normalised adjacent-share transition error on right and down neighbouring
    pairs with valid targets. (3) Run 9 as built: the cell read has its own projection
    of the third stage, initialised as a copy of the map''s; nothing detached. (4)
    New: every 3 by 3 mean in _soft_tissue_routing_weights (the cartilage rim and
    the meniscus spread) uses count_include_pad=False.'
