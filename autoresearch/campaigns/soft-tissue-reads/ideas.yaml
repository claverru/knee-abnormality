- id: residual-cell-read-on-a-detached-fourth-stage
  mechanism_id: read-training
  parent_idea_id: null
  title: Train the fourth-stage read alone and the cell read as a correction on it,
    with the wide regions
  opportunity: 'The user''s design (2026-10-10). Evidence. The five soft-tissue labels
    get one logit, the fourth-stage read (A) plus the third-stage cell read (B), and
    one loss on the sum, so whatever B learns A stops learning. Run 4 (wide regions):
    B added +0.0016 mean AUC over the five labels, more than the reference''s +0.0012,
    but A alone ended 0.0018 lower, so the sum was level with the recipe. Run 3 (a
    loss on B''s own logit): B took over (0.89 to 0.946 alone) and A collapsed (0.73
    to 0.83), so B must be trained as a correction on A, not on its own logit. Guess,
    medium confidence: A stays at its level and B adds about +0.0016 on five labels,
    +0.0007 macro; B''s gain was measured with A co-adapted and may be smaller against
    a full-strength A.'
  mechanism: 'Training only. (1) A takes the label loss alone on its own logit, for
    all twelve labels, exactly the loss call the training step makes today but on
    the logits of KneeAbnormalityModel._pool_tokens; A no longer sees B. (2) B takes
    the same loss on A.detach() + B, restricted to the five labels (the columns of
    soft_target), each label term weighing exactly as in the main loss: the function
    applied to those five columns times 5/12. B''s gradient cannot reach A''s head
    or the fourth stage; it still reaches backbone stages 1 to 3 through the cell
    features, which is intended and must not be detached. (3) The wide regions of
    run 4 come back: the OA rim is the larger of one and two 3 by 3 mean passes, and
    a meniscus label also opens the cartilage rim of its own compartment (the larger
    of the meniscus rule and that rim). (4) The bone routing of Contusion and Fracture
    stays. Prediction and validation are unchanged: logit = A + B.'
  precedents:
  - 'rn18-soft-tissue-added-read-bone-routes (the reference): one loss on A + B; B
    adds +0.0012 on the five labels, x4 0.928909.'
  - 'rn18-soft-tissue-wide-regions (run 4): the wide regions with one loss on the
    sum; B +0.0016, A -0.0018, x4 0.928123.'
  - 'rn18-soft-tissue-read-loss-wide-regions (run 3): a loss on B''s own logit; the
    reads swapped, x4 0.927004.'
  novelty: First run where B is trained as a residual of a detached A. Runs 2 and
    4 shared one loss; run 3 gave B a loss of its own.
  coverage: Every study; the five soft-tissue labels in B, all twelve in A.
  exploitation: 'Read against the incumbent at both multipliers and per label. Log
    on validation only, through _log_epoch_metric, the macro AUC of the five labels
    from A alone and from A + B (two metrics, computed from the same forward pass
    at epoch end), and keep the existing soft_tissue_* metrics. Shown wrong by: A
    alone below the reference''s A (0.9454, 0.9104, 0.9275, 0.9104, 0.9027 at x4)
    with B''s gain not above run 4''s.'
  budget: 'Same cost as the incumbent: within 1.03 of its training time. One extra
    loss term on logits already computed; no extra pooling pass.'
  implementation: 'Follow the environment paragraph of the developer instructions.
    Files: training/lightning.py (training_step) and modeling/model.py; spatial_tokens.py
    for the identity text. Replaces the summed loss; adds no option and no config
    field. In the training step get A and B from one encode and one pooling of each
    (expose the two logits of pool_encoded without pooling twice). Take the wide regions
    from autoresearch/campaigns/soft-tissue-reads/wide-regions.diff, the routing hunks
    only: do not add soft_bias, soft_tissue_logits or any loss on B''s own logit.
    Report on one batch that A''s loss has no gradient on soft_attention and soft_head,
    that B''s loss has none on the fourth-stage heads and on layer4, and that it has
    one on layer3. Update SPATIAL_TOKEN_IDENTITY["soft_tissue_routing"].'
  open_choices: None.
  dependencies: []
  priority_rationale: First because it removes the measured trade between the two
    reads; every later seed makes B able to do more, which only pays once A is protected.
  status: completed
