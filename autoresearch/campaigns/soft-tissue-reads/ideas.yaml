    \ bias-free family-shared readout of diagonal within-image feature variance. Use\
    \ the incumbent's final B attention q_i and existing normalized third-stage tokens\
    \ x_i. For each encoded image grid g and label, compute M_g=sum q_i, mu_g=sum(q_i*x_i)/M_g,\
    \ and V_g=max(sum(q_i*x_i^2)/M_g-mu_g^2,0). Empty grids contribute zero. Let D=sum_g\
    \ M_g*V_g and add w_family\xB7D to B. Keep the original mean evidence intact.\
    \ Group by encoded image grid, rather than mixing different images into one variance\
