- id: structure-tokens-in-the-fourth-stage-bag
  mechanism_id: structure-tokens
  parent_idea_id: null
  title: Replace the cell read by structure tokens in the fourth-stage read's bag
  opportunity: 'Evidence, guess for the gain. The cell read B adds nothing measurable
    on its five labels: their mean at x4 is 0.91946 over 18 runs with B and 0.92039
    for the incumbent, against 0.91907 and 0.92003 for the two recipe trainings without
    B, at 7% more training time. Across the runs the five-label change and the seven-label
    change correlate -0.46: B and the other labels trade through the backbone. Run
    8 showed what B reads is mostly the average open cell (0.25 to 0.61 of logit against
    0.04 to 0.07 from its attention), and run 3 of the line showed two readers under
    one loss swap roles. One reader and one loss can hold the same evidence. Guess,
    low-medium: level to +0.0005 macro, with the trade removed.'
  mechanism: 'Each encoded image adds five tokens to the fourth-stage read''s bag,
    one per soft-tissue label: S[n,k] = sum_c w[k,n,c] * f[n,c] / sum_c w[k,n,c],
    where f are the projected third-stage cell features of image n and w the detached
    routing weights of label k from _soft_tissue_routing_weights, plus the plane and
    contrast embeddings and a learned structure embedding per label. A structure token
    is open only to its own label''s attention, with a learned attention bias starting
    at -4, and takes no position prior; an image whose label is unrouted adds no token
    for it. Replaces _soft_tissue_pool, soft_attention, soft_head and soft_norm: the
    prediction is the fourth-stage read alone.'
  precedents:
  - run-notes.md, run 8 and the section "Cross-run analysis by a subagent".
  - 'rn18-soft-tissue-read-loss-wide-regions (run 3 of the line): the two readers
    swapped.'
  novelty: First design with one reader over both scales; allowed by the Wider scope
    section of the contract.
  coverage: Every routed study; the five soft-tissue labels.
  exploitation: 'Read the five soft-tissue labels and the other seven against the
    incumbent at both multipliers. Log on validation only: the share of each label''s
    attention on its structure tokens (five metrics). Shown wrong by: structure tokens
    taking almost no attention at the selected epoch, or the five-label mean below
    the trainings without B (0.9191 to 0.9200).'
  budget: 'At most 1.0 of the incumbent''s training time: the cell softmax and readout
