  title: Add a small label loss on the read of each plane alone, at weight 0.05
  opportunity: 'The user''s seed of 2026-10-11: the incumbent with a tiny loss per
    plane read at weight 0.05. Evidence for the direction, guess for the gain. The
    model is trained only on the read of the whole bag, so a plane that the others
    cover is never asked to stand alone: single-view reads of the incumbent range
    widely (Medial OA 0.882 on coronal fluid against 0.837 on coronal T1/PD; PF OA
