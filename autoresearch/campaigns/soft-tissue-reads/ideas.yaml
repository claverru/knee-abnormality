- id: cell-position-inside-the-structure
  mechanism_id: cell-position
  parent_idea_id: null
  title: Tell each cell of the cell read where it lies relative to its own structure's
    centre
  opportunity: 'Evidence for the pattern, guess for the fix. The cell read''s tokens
    are the third-stage features plus the plane and contrast embeddings: they carry
    no position, while the fourth-stage read has a position prior. The cell reader
    trained alone (run 1) gains or loses by where the tear is: lateral anterior horn
    +0.052 (10 positives; run 3 +0.055), medial body +0.010 (16), medial posterior
    horn and body -0.009 (107), lateral posterior -0.028 (21). A reader shared by
    both sides that cannot tell a horn from the body treats all of a meniscus alike.
    Guess, medium-low: +0.001 to +0.002 on the meniscus labels.'
  mechanism: 'For the cell read only. Each cell gets a three-value position: its patient
    offset (soft_tissue_offset) minus the centre of its own structure, expressed on
    the knee frame''s axes (across, front, up) and divided by the knee''s size from
    the study frame. Own structure: for the meniscus reader, the nearer of the two
    share-weighted meniscus centres; for the OA reader, the nearest of the three compartment
    centres, both already computed in _soft_tissue_routing_weights. The across value
    is multiplied by the sign of the own centre''s across coordinate, so outward is
    positive on both sides and the shared reader stays blind to the side. A zero-initialised
    linear layer per reader maps the three values to the token width and is added
    to that reader''s tokens before the layer norm. Cells of a study without the centre
    get zero. All inputs detached.'
  precedents:
  - 'rn18-soft-tissue-cells (run 1) and rn18-soft-tissue-read-loss-wide-regions (run
    3): the same sign of the location effect in both (lateral anterior horn +0.052
    and +0.055).'
  - The fourth-stage read has carried a position prior in the knee frame since the
    side-routed line.
  novelty: First position input of the cell read; relative to the structure, not to
    the knee.
  coverage: Every study with a found centre; the five soft-tissue labels.
  exploitation: 'Read the two meniscus labels against the incumbent at both multipliers.
    Log on validation only the norm of each reader''s position weights (two metrics)
    and the share of cells with a position (one metric). Shown wrong by: weights staying
    at zero, or neither meniscus label above the incumbent at either multiplier.'
  budget: 'Within 1.03 of the incumbent''s training time: one small linear layer on
    values the routing already computes.'
  implementation: 'Follow the environment paragraph of the developer instructions.
    Files: modeling/model.py, training/lightning.py for the three metrics, spatial_tokens.py.
    Adds to the cell read''s tokens and removes nothing; no option. The tokens become
    one set per reader: memoise each through _memo. Reuse the centres from the memoised
    routing weights instead of computing them again. New parameters under torch.random.fork_rng,
    zero-initialised, so the model starts as the incumbent. Report on one batch that
    mirroring a study leaves the positions unchanged and that the logits equal the
    incumbent''s at initialisation. Apply to the incumbent as assigned.'
  open_choices: None.
  dependencies: []
  priority_rationale: The cell read's clearest wins over the fourth-stage read are
    local and depend on location.
  status: completed
  created_revision: 0
  seeded: /home/claudio/src/knee-abnormality-soft-tissue-masks/autoresearch/campaigns/soft-tissue-reads/seed-ideas.yaml
  experiments:
  - cell-position-inside-the-structure-20261010T224740Z-30588502
  decision: reject
- id: pf-oa-own-cell-reader
  mechanism_id: pf-reader
  parent_idea_id: null
  title: Give PF OA its own attention and readout in the cell read
  opportunity: 'Evidence for the deficit, guess for the fix. In the cell read one
    attention channel and one readout channel are shared by Medial OA, Lateral OA
    and PF OA. PF OA is where that reader is weakest: 0.719 alone in the reference
    against 0.807 and 0.808 for the other two, the smallest gain from B (+0.0005;
    +0.0003 in run 4), and -0.010 when read from the cells alone (run 1). Its structure
    differs from the other two: patellar cartilage and the trochlea, read mostly in
    the axial and sagittal views, against tibial plateaus. PF OA is the second-weakest
    label (0.903) with 290 positives. Guess: PF OA up to the lateral labels'' gain
    from B, +0.002.'
  mechanism: 'In the cell read only, PF OA gets its own channel: soft_attention and
    soft_head output one more channel and soft_target_channel sends PF OA to it. The
    new readout channel starts at zero and the new attention channel under torch.random.fork_rng.
    Medial OA and Lateral OA keep sharing theirs. The fourth-stage read and its shared
    classifiers are unchanged.'
  precedents:
