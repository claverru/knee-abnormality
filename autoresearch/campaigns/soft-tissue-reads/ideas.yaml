- id: bundle-area-normalised-attention-with-the-detail-adapter
  mechanism_id: bundle
  parent_idea_id: cell-attention-normalized-by-routed-area-per-view
  title: Combine the per-view area normalisation of the cell read's attention with
    the block-detail adapter
  opportunity: 'Evidence for the parts, guess for the sum. The two runs level with
    the incumbent at x4 are run 16 (cell-attention-normalized-by-routed-area-per-view:
    x4 -0.00002, x1 +0.0007, ahead at all ten epochs) and run 12 (cell-projection-with-a-coarse-block-detail-adapter:
