- id: oa-cartilage-read-from-second-stage-cells
  mechanism_id: fine-cartilage-read
  parent_idea_id: null
  title: Add a read of the cartilage layer on the second-stage cells for the three
    OA labels
  opportunity: 'Evidence, new (88 of the 263 mask knees, cells cut along the volume
    axes, 2026-10-11). On the third-stage grid cartilage is almost never most of a
    cell. Share of a structure lying in cells it fills at least half: patellar cartilage
    in axial 9 mm cells 4%; medial tibial cartilage 4 to 11% coronal and 7 to 16%
    sagittal (6 to 7 mm cells). On half-size cells, the second stage: 63%, 56% and
    59%. Typical share of a cartilage cell: 0.27 against 0.54 (patellar, axial), 0.26
    to 0.33 against 0.54 to 0.57 (medial tibial). Evidence, prior work: the cell reader
    is level on full-thickness damage and behind on partial damage (PF OA partial
    low -0.031, 42 positives; partial high -0.028, 33; focal -0.062, 15; Lateral OA
    partial high -0.093, 8). Evidence, new: those are the recipe''s weak subgroups,
    mean of the two references at x4: PF OA partial low 0.802 (42) and focal 0.754
    (15) against full thickness 0.953 (109); Lateral OA partial high 0.797 (8) against
    0.933 (35). Guess, medium: +0.001 to +0.003 on each OA label, from the partial
    grades.'
  mechanism: 'A third read C for Medial OA, Lateral OA and PF OA, added where B is
    added: logit = A + B + C. Features: the stride-8 tensor that enters backbone.layer3
    (after the feature-statistics augmentation in training), returned by _backbone_stage_outputs
    beside the other two, 28 by 28, not detached. Tokens: a new linear projection
    to the token width plus the plane, contrast and detail-view embeddings, then a
    LayerNorm of their own. Weight per label: the cartilage rim of _soft_tissue_routing_weights
    alone (rim times own compartment, zero where the compartment is not found), without
    the bone zone, each third-stage cell''s weight repeated to its four second-stage
    cells; validity is soft_tissue_valid repeated the same way. Pool as _soft_tissue_pool:
    a new attention (256, 128, tanh, dropout, 1; one channel for the three labels)
    plus the view label bias plus log(weight.clamp_min(ROUTING_MINIMUM_WEIGHT)) /
    routing_temperature, one softmax per label over the study''s valid second-stage
    cells, and a zero-started readout without bias (PlaneContrastReadout when plane_readout).
    A label whose rim weight sums below one third-stage cell in the study gets C =
    0. The view argument restricts the cells as in B. A and B are unchanged.'
  precedents:
  - 'rn18-soft-tissue-cells (run 1): cells-only reader level on full-thickness damage,
    behind on partial and focal damage; the bone zone holds 60 to 67% of an OA label''s
    weight.'
  - 'rn18-soft-tissue-added-read-bone-routes (the reference): B adds +0.0007, +0.0022
    and +0.0005 on Medial, Lateral and PF OA; PF OA partial low +0.0021 and focal
    +0.0018 against the references.'
  - 'SOFT_TISSUE_MASK_IDEAS.md, idea 1 variant: the 1 mm masks were judged safe down
    to 4 mm cells; here the masks only route, repeated from the third-stage map.'
  novelty: First label read below the third stage. The forced 28 by 28 seed refines
    the map and leaves the read on 14 by 14; this one refines the read and leaves
    the map.
  coverage: Every study with a found compartment; Medial OA, Lateral OA and PF OA.
  exploitation: 'Read the three OA labels against the incumbent at both multipliers,
    and the partial and focal grades from the saved predictions. Log on validation
    only, per OA label, the mean absolute C logit (val_soft_tissue_fine_logit_abs_*)
    and the share of studies where C is routed (val_soft_tissue_fine_routed_*): six
    metrics. Shown wrong by: C''s logit staying near zero, or no OA label above the
    incumbent at either multiplier.'
  budget: 'Up to 1.06 of the incumbent''s training time, inside the 1.25 ceiling against
    the reference: a projection, an attention and a softmax over four times B''s cells
    for three labels, on features the backbone already computes; no geometry, target
    or backbone cost. State the measured step time of one batch in the report.'
  implementation: 'Follow the environment paragraph of the developer instructions.
    Files: modeling/model.py, training/lightning.py for the six metrics, spatial_tokens.py
    for the identity text. Adds a read and removes nothing; no option. New parameters
    under torch.random.fork_rng, readout at zero, so the logits start as the incumbent''s.
    Memoise the second-stage tokens through _memo and take the rim from the memoised
    routing weights (return it beside the combined weights; do not compute it twice).
    No boolean indexing: weights and validity are repeated with repeat_interleave.
    Incumbent as assigned: C joins B wherever B enters a loss (with a residual B,
    C is in the sum trained on A.detach()); if PF OA has its own channel in B give
    it one in C; if the map is already on the 28 by 28 grid use its rim there without
    repeating. Report on one batch that C is zero at initialisation, that its weight''s
    support is the rim''s repeated, and with small synthetic inputs that C''s gradient
    reaches the second-stage features. If the time cannot stay within 1.06 return
    blocked with the measured time instead of cutting anything.'
  open_choices: None.
  dependencies: []
  priority_rationale: The largest measured deficit of the cell read is partial-thickness
    cartilage damage, and the masks show the third-stage cells cannot hold a cartilage
    layer.
  status: completed
  created_revision: 20
  seeded: /home/claudio/src/knee-abnormality-soft-tissue-masks/autoresearch/campaigns/soft-tissue-reads/seed-ideas-2.yaml
