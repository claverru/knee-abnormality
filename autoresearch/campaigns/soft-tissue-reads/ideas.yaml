- id: cell-view-normalization-with-a-map-derived-presence-unit
  mechanism_id: cell-view-area-normalization
  parent_idea_id: cell-attention-normalized-by-routed-area-per-view
  title: "Preserve structural presence while normalizing B\u2019s views"
  opportunity: "Evidence: view normalization gained +0.000704 at selected-epoch \xD7\
    1 but lost \u22120.000019 at \xD74. Selected view-mass TV was 0.121\u20130.242\
    \ across the five labels, and B magnitudes increased despite similar raw support.\
    \ Source evidence: dividing by each view\u2019s complete floored structural mass\
    \ gives even a view containing only routing-floor measure unit structural mass.\
    \ Guess: this amplifies weakly localized views and dilutes useful meniscus or\
    \ cartilage detail. The affected frequency and mass were not logged."
  mechanism: "Design: replace unrestricted area normalization with a continuous structural-presence\
    \ normalizer. For each routed study-label, let m_i=r_i^(1/T), using detached raw\
    \ routing r, visual validity and the incumbent temperature T. Define the map-derived\
    \ typical-cell measure u=\u03A3m_i\xB2/\u03A3m_i over valid cells. Let F_v be\
    \ the structural attention measure summed within view v, including the live incumbent\u2019\
    s support and positive-weight floor behavior. Subtract log(F_v+u) from its cell\
    \ scores, replacing the precursor\u2019s log(F_v). Its structural view mass becomes\
    \ F_v/(F_v+u): substantial views approach equal-area competition while floor-only\
    \ views retain small mass. Within-view ratios, content scores and view biases\
    \ remain unchanged. Retain the existing study-label routing gate and compartment\
    \ fallback; introduce no per-view threshold or fallback. Guess: B keeps fine local\
    \ evidence from views that actually contain its own structure."
  precedents:
  - "cell-attention-normalized-by-routed-area-per-view-20261011T045006Z-adb2fc02:\
    \ selected \xD71 0.919384272; \xD74 0.928890535; 80% \xD74 interval [\u22120.000911,+0.000881].\
