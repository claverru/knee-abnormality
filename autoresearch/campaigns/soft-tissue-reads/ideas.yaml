  opportunity: 'Evidence for the gap, guess for the gain. The map is taught on masks
    of one protocol that almost never includes sagittal fluid or coronal T1/PD (20
    of 265 mask knees have each), so those views'' maps are never corrected. Cells
    of different planes fall in the same place of the knee: where they do, the planes
    that were taught can teach the ones that were not, on every study and online,
    without a prepared target. Guess, low-medium: the five labels gain +0.001 to +0.003
    on the 822 studies off the mask scanner.'
  mechanism: 'New term in the map step for studies without masks. Voxel of a cell:
    floor(patient position / 6 mm) per study. S_p[v] is the mean detached map share
    of plane p''s cells in voxel v. The target of a cell of plane p is the mean of
    S_q[v] over the other planes q that have cells in v; cells whose voxel holds no
    other plane are left out. Loss: 0.05 * KL(target || softmax(scores)) averaged
    over those cells, zero through epoch 2 and ramped linearly to full at epoch 4.
    The mask loss is unchanged. Replaces nothing.'
