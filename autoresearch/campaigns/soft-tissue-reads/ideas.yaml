- id: soft-tissue-map-matches-fractional-share-overlap
  mechanism_id: map-fractional-overlap
  parent_idea_id: null
  title: "Make the map\u2019s overlap objective consistent with fractional cell targets"
  opportunity: "Evidence: training/anatomy.py constructs targets from a 4\xD74 quadrature,\
    \ so cells can contain fractional class shares. Its regional loss uses D=2\u03A3\
    pt/(\u03A3p+\u03A3t). At a matching fractional prediction p=t, D=\u03A3t\xB2/\u03A3\
    t<1; matching the supplied shares therefore does not minimize this term. This\
    \ is an algebraic mismatch, not a measured explanation of AUC losses. Prior work\
    \ measures only 23\u201331% meniscus in open cells. The incumbent\u2019s late\
    \ validation overlaps remain approximately 0.48\u20130.58. Guess: pressure toward\
    \ sharper class occupancy can distort the mixed-cell shares that route B."
