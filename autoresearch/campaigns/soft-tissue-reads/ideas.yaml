- id: map-taught-on-every-study-from-the-reference-pseudo-volumes
  mechanism_id: pseudo-map
  parent_idea_id: null
  title: Teach the soft-tissue map on every training study, from volumes the reference's
    own map predicted
  opportunity: 'The user''s idea. Evidence for the gap, guess for the gain. The map
    is taught on 211 training knees of one scanner whose protocol differs from the
    rest: 20 of the 265 mask knees have a sagittal fluid series and 20 a coronal T1/PD
    series, against 4,130 of the other 4,142 studies with sagittal fluid. So the map
    is almost never taught on the best single view of six labels, and every map overlap
    of this campaign was measured on the 52 in-protocol validation studies. The cell
    read trained alone is +0.024 on those 52 studies and -0.009 on the other 822 (three
    labels with at least 12 positives). The keeper built a prepared set (2026-10-11,
    scripts/tools/prepare_soft_tissue_pseudo_targets.py): the reference''s selected
    checkpoint predicted the seven-class map on every view of each fold-1 training
    study at four times the slices, and the cell predictions of all views were averaged
    into one 2 mm volume per study in patient coordinates, so a view is taught what
    the other views of the same knee saw. Its classes.json holds the agreement of
    each view with the other views and with the real masks. Guess, medium-low: the
    map transfers to the routine protocol and the five soft-tissue labels gain on
    the 822 studies.'
  mechanism: 'The map loss covers every training study. The prepared mask set (paths.meniscus_targets,
    unchanged) now holds a folder pseudo_volumes beside volumes: one npz for each
    fold-1 training study without a real mask (none for validation studies), with
    labels (uint8, one class drawn per voxel from the predicted shares, 255 where
    no cell covered the voxel), shares (uint8, the predicted share of each of the
    seven classes times 255), origin and spacing (2 mm). AnatomyTargets also loads
    pseudo_volumes when the folder exists. For a study with a pseudo-volume a cell''s
    target share is the mean of the stored shares at its sample points, and its coverage
    is the fraction of points on covered voxels; the real mask volumes are read as
    today and always win over a pseudo-volume of the same study. The loss formula
    and trainer.meniscus_loss_weight are unchanged. Validation is unchanged: the logged
    map overlap still comes from the 52 validation mask knees.'
  precedents:
  - 'The pseudo-volumes and their agreement figures: pseudo_volumes/ and pseudo.json
    inside the prepared mask set (data/labels/prepared/soft-tissue-nnunet-knee-dess265).'
  - 'run-notes.md, section "Cross-run analysis by a subagent": the protocol finding.'
  novelty: First run in which the map is supervised outside the mask scanner.
  coverage: Every training study; the map, and through it the cell read's routing
    on all scanners.
  exploitation: 'Read the five soft-tissue labels and the macro against the incumbent
    at both multipliers and on the epoch 6 to 10 mean at x1, and the mask scanner''s
    52 validation studies apart from the other 822. Log on validation only the existing
    map overlap per class; log in training the number of map-supervised tokens (already
    logged as meniscus_tokens). Shown wrong by: the five labels on the 822 studies
    not above the incumbent while the map overlap on the 52 falls.'
  budget: 'Within 1.05 of the incumbent''s training time: the map loss runs on about
    sixteen times the tokens, all on the GPU; the stored labels of about 3,300 volumes
    add under 1 GB of GPU memory.'
  implementation: 'Follow the environment paragraph of the developer instructions.
    Files: training/anatomy.py (load pseudo_volumes, read shares), training/lightning.py
    only if the token count needs it. The config path does not change. Keep the gather
    on the GPU and one lookup per token as today. No option: a pseudo-volume is read
    soft, a real mask volume as labels. Report on one batch that a mask knee''s targets
    are unchanged and that a pseudo study yields covered cells with fractional shares.
    Apply to the incumbent as assigned.'
  open_choices: None.
  dependencies: []
  priority_rationale: The measured gap between the mask protocol and the other 94%
    of studies, addressed with targets that already exist.
