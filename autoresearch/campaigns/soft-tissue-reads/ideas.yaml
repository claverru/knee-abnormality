- id: oa-cartilage-and-bone-zone-pooled-apart
  mechanism_id: oa-cell-pools
  parent_idea_id: null
  title: Read the cartilage cells and the bone-zone cells of an OA label in two pools
  opportunity: 'Evidence for the deficit, guess for the cause. An OA label''s cell
    read weights each cell by the larger of its cartilage rim and the bone map''s
    joint zone, in one softmax. The bone zone holds 60 to 67% of that weight and receives
    35 to 57% of the attention (run 1 diagnosis). The cell reader trained alone (run
    1) is level with the references on full-thickness damage (PF OA -0.0015, 109 positives;
    Lateral OA -0.002, 35) and behind on partial damage: PF OA partial low grade -0.031
    (42), partial high grade -0.028 (33), focal -0.062 (15); Lateral OA partial high
    grade -0.093 (8). Partial-thickness damage lives in the cartilage layer alone,
    the fine local detail B should add to A. Guess: +0.001 to +0.002 on each OA label.'
  mechanism: 'In KneeAbnormalityModel._soft_tissue_routing_weights return two weights
    per OA label instead of their maximum: the cartilage weight (the incumbent''s
    rim, in the label''s own compartment) and the bone-zone weight (the bone map''s
    joint or kneecap-joint share, in the own compartment; the whole zone when the
    study has no anchors, as today). In _soft_tissue_pool each OA label gets two attention
    pools over the same cell tokens, one routed by each weight, each with its own
    softmax, its own attention channel and its own zero-started readout channel; B
    for the label is the sum of the two pooled logits. A pool whose total weight in
    the study is below one cell contributes zero. The meniscus labels are unchanged.'
  precedents:
  - 'rn18-soft-tissue-cells (run 1): cells-only reader; partial damage behind, full
    thickness level; bone zone 60 to 67% of the weight.'
  - 'rn18-soft-tissue-wide-regions (run 4): a wider cartilage rim raised B''s gain
    on Lateral OA (+0.0033 against +0.0022) but not on Medial OA or PF OA.'
  novelty: First read where the cartilage layer has an attention pool of its own.
  coverage: Every study; Medial OA, Lateral OA and PF OA.
  exploitation: 'Read the three OA labels against the incumbent at both multipliers.
    Log on validation only the mean absolute logit of each pool per OA label (six
    metrics). Shown wrong by: the cartilage pool''s logit staying near zero while
    the bone pool carries B, or no OA label above the incumbent at either multiplier.'
  budget: 'Within 1.03 of the incumbent''s training time: one more softmax over the
    cells for three labels, no new tokens.'
  implementation: 'Follow the environment paragraph of the developer instructions.
    Files: modeling/model.py, training/lightning.py for the six metrics, spatial_tokens.py
    for the identity text. Replaces the single OA pool; no option. New parameters
    initialise under torch.random.fork_rng with zero readouts, so the model starts
    as the incumbent with B''s bone pool equal to nothing learned. Keep the routing
    statistics (open cells, weight, routed) per pool only in the report, on one batch.
    Report on one batch that the sum of the two weights'' supports equals the incumbent''s
    support and that the meniscus labels'' logits are bit-identical to the incumbent''s.
    Apply to the incumbent as assigned, whichever way the earlier seeds went.'
  open_choices: None.
  dependencies: []
  priority_rationale: Three labels, and the deficit it aims at is the largest one
    measured for the cell read.
  status: completed
