- id: bone-zone-taught-on-the-cell-grid
  mechanism_id: zone-grid
  parent_idea_id: null
  title: Teach the joint zones on the 14 by 14 cells and route the OA cell read by
    that zone
  opportunity: 'Evidence, prior work: the bone zone holds 60 to 67% of an OA label''s
    routing weight in B and receives 35 to 57% of its attention. It is the 7 by 7
    bone map''s joint or kneecap-joint share copied from the parent token to its four
    cells. Evidence, new (69 of the 550 bone knees, target masks, cells of 5 to 10
    mm, 2026-10-11): a zone copied from the parent token overlaps the zone on the
    cell grid 0.61 to 0.69 (joint) and 0.58 to 0.76 (kneecap joint), and 19 to 31%
    of the copied weight falls on cells that contain no zone. That is with perfect
    targets; the predicted 7 by 7 zones reach 0.760 and 0.676 (the reference, validation,
    epoch 8). So most of the weight of B''s OA read is placed with a 12 to 17 mm mask
    on 6 to 8.6 mm cells. Guess, medium-low: +0.001 on the OA labels.'
  mechanism: 'A new zero-initialised linear head on the third-stage cells, 256 to
    the seven bone classes, on the same input as the seven-class soft-tissue head
    (the third-stage projection plus the repeated fourth-stage tokens). Loss: anatomy_loss
    of its scores against self.anatomy_targets.token_shares(batch[''study_uid''],
    encoded[''study''], encoded[''meniscus_patient_position''], encoded[''meniscus_token_steps'']),
    on the cells that are covered, visually valid and routable, times trainer.anatomy_loss_weight
    (0.1, the bone map''s own weight). _encode_crops returns its scores and their
    detached softmax as zone_shares. In _soft_tissue_routing_weights the zone becomes
    zone_shares[..., [JOINT_CLASS, JOINT_CLASS, KNEECAP_JOINT_CLASS]] in place of
    anatomy_shares repeated to the cells. The 7 by 7 bone map, the frame and the bone
    routing of Contusion and Fracture are untouched.'
  precedents:
  - 'meniscus-head-on-the-14-by-14-grid (view poses run 1): the same move for the
