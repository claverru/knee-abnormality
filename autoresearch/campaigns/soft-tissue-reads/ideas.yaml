    coronal views), and the model gains +0.010 macro from x1 to x4 through coverage.
    Isolated positives are the misses (Effusion 0.759 with 12 positives, Lateral Meniscus
    0.802 with 23). Guess, low-medium: asking each plane to carry the label a little
    makes every plane''s features more complete and the full read steadier.'
  mechanism: The incumbent unchanged, plus one loss term. For each of the three planes
    (sagittal, coronal, axial) present in a study, the existing read is evaluated
    on the tokens and cells of that plane's images only (both contrasts together),
    through the same heads, regions, routing, priors and knee-level term as the full
    read, giving twelve logits per plane. The term is the existing class-balanced
    label loss of those logits against the study's targets, averaged over the planes
    present and over the studies, times 0.05, added to the training loss. A plane
    without a valid image in the study is left out. The full-bag loss, the prediction
