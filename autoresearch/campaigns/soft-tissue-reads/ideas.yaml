- id: soft-tissue-map-factors-foreground-from-structure
  mechanism_id: map-foreground-factorization
  parent_idea_id: null
  title: Separate soft-tissue presence from conditional structure identity in the
    map head
  opportunity: '[Evidence-backed] Reference map agreement is 0.9742 at selected epoch
    8, while six structure overlaps range from 0.4834 to 0.5826. The head currently
    produces one seven-way softmax, coupling neither-versus-tissue discrimination
    to the six tissue logits. Better overlap in several rejected map/projection runs
    did not consistently improve macro AUC. [Guess] Separating tissue presence from
    tissue identity may change optimization in a useful way without altering the grid,
    targets or routing.'
  mechanism: "[Proposed mechanism; benefit is a guess] Replace the seven-way categorical\
    \ parameterization with one foreground logit a and six conditional structure logits\
    \ z, using the same seven affine outputs and existing features. Let f=sigmoid(a),\
    \ q_neither=1\u2212f and q_k=f\xB7softmax(z)_k. Return stable seven-channel log\
    \ probabilities so the existing loss and routing consume the same class distribution\
    \ interface. Initialize affine weights to zero, conditional biases to zero and\
    \ a's bias to log(6), reproducing the incumbent's uniform initial seven-class\
    \ probabilities. Six is the existing class count, not a tuned constant. Retain\
    \ the current CE-plus-overlap objective and coefficient. Algebraically, its CE\
    \ becomes foreground Bernoulli CE plus target-foreground-share-weighted conditional\
    \ CE; pure-background CE no longer directly updates conditional logits. Overlap\
    \ gradients still couple the branches."
  precedents:
  - 'run_curves.reference, epoch 8: val_meniscus_agreement=0.9742; medial tibial/patellar
