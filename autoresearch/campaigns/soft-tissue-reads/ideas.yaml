  opportunity: "[Evidence-backed, code] The current B read is an attention-weighted\
    \ average of linear cell evidence. It does not explicitly retain channelwise dispersion\
    \ within a routed image. [Evidence-backed] Prior work reports PF OA partial-low,\
    \ partial-high and focal deficits of approximately \u22120.031, \u22120.028 and\
    \ \u22120.062, versus \u22120.0015 for full-thickness damage. [Guess] A mixture\
