- id: rn18-bias-free-half-knee-00375
  mechanism_id: anatomical-bias-removal
  parent_idea_id: no-anatomical-bias
  title: Halve half-knee supervision weight to 0.0375 with anatomical bias absent
  opportunity: "Removing the attention bias helped while retaining geometric masking\
    \ and half-knee supervision. In the incumbent, half_knee_loss falls from 0.4659\
    \ to 0.4479 over epochs 6\u20139, but Lateral Meniscus stays near 0.9155 and Medial\
    \ Meniscus near 0.9478. Continued proxy-loss improvement without corresponding\
    \ disease-ranking improvement suggests testing reduced pressure from this remaining\
    \ anatomical objective. Gradient competition is a hypothesis, not a measured diagnosis."
