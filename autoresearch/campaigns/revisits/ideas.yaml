- id: dense-plane-readouts
  mechanism_id: dense-plane-readouts
  parent_idea_id: null
  title: Dense per-plane readouts on the shared backbone, with a learned per-label
    plane fusion
  opportunity: 'Each label leans on one plane (single-plane inference: ACL sagittal,
    MCL coronal, Effusion and Baker''s axial), yet one joint attention pool mixes
    all planes before the classifier. In the plane-specialization campaign, making
    every plane predict every label from its own tokens was the one change that helped
    (+0.0047, +0.0032 re-scored on rebuild_state_v2), but only with one backbone per
    plane. It was never tried on the shared backbone.'
  mechanism: For every label c and present plane p (axial, coronal, sagittal), pool
    plane p's tokens with the label's existing attention (scorer, anatomical bias,
    meniscus mask and OA detector unchanged, softmax restricted to that plane's tokens)
    and read z_cp with the shared classifier. Each z_cp takes the class-balanced BCE,
    averaged over the planes present in the study, as the disease loss. A learned
    per-label fusion, a softmax over present planes of zero-initialized weights a_cp
    applied to detached z_cp and trained with class-balanced BCE at weight 1, gives
    the validation and inference output. A study missing a plane fuses over the planes
    it has.
  precedents:
  - 'plane-specialization campaign: dense-plane-readouts +0.0047 (re-scored +0.0032,
    80% [+0.0010, +0.0053]) and dense-readouts-learned-fusion +0.0009 on top, on three
    EfficientNet-B0s (docs/validation/results/campaigns-and-queues/2026-09-28-plane-specialization-campaign.md).'
  - 'Code: frozen sources of outputs/autoresearch/plane-specialization/experiments/dense-readouts-learned-fusion-20260927T231847Z-33417f97/source/
    (modeling/planes/, trainer.plane_pooling, model.plane_pooling).'
  - 'Single-plane inference: docs/validation/results/pooling-and-attention/2026-09-27-single-plane-inference.md.'
  novelty: First dense per-plane readout on the shared backbone; the plane-backbone
    runs changed the backbone at the same time.
  coverage: All studies and labels.
  exploitation: Log each plane's own validation macro AUC, the fusion weights per
    label and plane, and per-epoch training loss per plane.
  budget: Three masked attention pools per label on the existing tokens; negligible
    against the 1,222 s reference.
  implementation: Port the pooling and fusion from the plane-specialization source
    under a new model.plane_readouts option in config.py and modeling/, with the per-plane
    loss in the Lightning module. One shared backbone, no per-plane backbones.
  open_choices: None; fusion and loss weighting are fixed as above.
  dependencies: []
  priority_rationale: Strongest measured effect on the list, with a mechanism that
    does not depend on separate backbones.
  status: completed
  created_revision: 0
  seeded: /home/claudio/src/knee-abnormality-revisits/autoresearch/campaigns/revisits/seed-ideas.yaml
  experiments:
  - dense-plane-readouts-20260930T201517Z-2053a753
  decision: reject
- id: plane-contrast-readouts
  mechanism_id: plane-contrast-specific-readouts
  parent_idea_id: null
  title: Give each plane/contrast type its own readout weights before summing, initialized
    from the shared readout
  opportunity: 'The only clean flip of the campaign re-scoring: -0.0006 on its recorded
    labels, +0.0018 (80% [+0.0001, +0.0035]) on rebuild_state_v2, +0.0010 net of the
    near-misses reference shift. Labels draw on different acquisition types (PF OA:
    axial fluid 29%, sagittal 54%), and one linear classifier per label collapses
    them.'
  mechanism: Keep six partial vectors per label, u_cq = sum over tokens of type q
    of alpha_ci * h_i, with the same global attention denominator, and compute z_c
    = sum_q w_cq . u_cq + b_c. Initialize every w_cq from the shared w_c, which reproduces
    the original predictions apart from summation order; missing types contribute
    zero. If the incumbent carries dense per-plane readouts, this candidate removes
    them and restores the joint pool, so it tests the alternative, not a stack.
  precedents:
  - near-misses run plane-contrast-readouts-20260925T020628Z-2efb517d (frozen source
    under outputs/autoresearch/near-misses/experiments/).
  - 'Re-scoring: docs/validation/results/validation-and-ensembles/2026-09-28-campaign-rescoring.md.'
  novelty: First run on ResNet-18 and the current labels.
  coverage: All labels.
  exploitation: Log the divergence of each w_cq from its initialization per epoch;
    per-label AUC against the incumbent.
  budget: Six times the readout weights; negligible.
  implementation: A new model.plane_readout option in config.py and modeling/model.py;
    compute the per-type contributions without a large pooling tensor.
  open_choices: None; initialization is fixed.
  dependencies: []
  priority_rationale: Passes on the labels that track the public board best; cheap.
  status: completed
  created_revision: 0
  seeded: /home/claudio/src/knee-abnormality-revisits/autoresearch/campaigns/revisits/seed-ideas.yaml
  experiments:
  - plane-contrast-readouts-20260930T202714Z-01be9ca5
  decision: provisional_accept
