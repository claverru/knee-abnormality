  decision: reject
- id: plane-conditioned-batchnorm
  mechanism_id: plane-conditioned-normalization
  parent_idea_id: null
  title: Separate layer3/layer4 BatchNorm statistics by plane while sharing convolutions
    and affine parameters
  opportunity: Every upper-stage BatchNorm mixes axial, coronal and sagittal images
    in one set of batch and running statistics, although the planes differ in appearance.
    Queued in the radimagenet-rn18 backlog as rn18-plane-conditioned-upper-statistics
    and never run.
  mechanism: Partition the batch and the running mean/variance by plane in every layer3
    and layer4 BatchNorm, including downsample branches. Keep one shared affine weight
    and bias and one shared convolutional backbone. Initialize all three running-statistic
    copies from the pretrained state. Training updates each present plane's statistics;
    evaluation uses that plane's stored statistics. Empty planes receive no update.
    Lower stages, DSU and L2-SP stay as in the incumbent.
  precedents:
  - autoresearch/campaigns/radimagenet-rn18/ideas.yaml, rn18-plane-conditioned-upper-statistics.
  - Chang et al., Domain-Specific Batch Normalization, arXiv 1906.03950.
  novelty: Plane specialization inside the shared backbone without extra convolutions
    or heads.
  coverage: All studies and planes.
  exploitation: Log per-plane image counts, the separation of the per-plane running
    means, and the output RMS difference from pooled statistics on sampled batches.
  budget: No extra convolution; indexed normalization only.
  implementation: A new model.plane_batchnorm option in config.py; the normalizer
    in modeling/, swapped in after pretrained loading; pass the existing plane vector
    to the backbone call.
  open_choices: None; layer3/layer4 scope and three plane groups are fixed.
  dependencies: []
  priority_rationale: Guess, low to moderate confidence; the one plane-specialization
    point inside the backbone.
  status: completed
  created_revision: 1
  seeded: /home/claudio/src/knee-abnormality-revisits/autoresearch/campaigns/revisits/seed-ideas-2.yaml
  experiments:
