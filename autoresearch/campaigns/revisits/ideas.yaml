- id: plane-contrast-feature-adapters
  mechanism_id: plane-contrast-feature-adapters
  parent_idea_id: null
  title: Zero-initialized residual bottleneck adapter per plane/contrast type on the
    projected tokens
  opportunity: Readouts after pooling cannot change which evidence attention selects.
    An adapter per acquisition type before attention can, while the backbone stays
    shared (AnyMC3D's view-specific adapters, adapted here). Accepted for the backlog
    on 2026-09-21, never implemented.
  mechanism: After the shared 256-wide token projection and before the embeddings
    and attention, add h + U_q(GELU(D_q h)) where q is the token's plane/contrast
    type (six types), D_q 256 to 32, U_q 32 to 256 and zero-initialized so the candidate
    starts as the incumbent. The adapted tokens feed scoring, pooling and every head.
  precedents:
  - docs/backlog/untried-ideas.md#pooling-and-the-attention-head.
  - docs/research/backbones-and-pretraining/pretraining-and-external-data.md#adapting-2d-foundation-models-to-volumes.
  novelty: Untested; the pre-pooling sibling of plane-contrast readouts.
  coverage: All studies and labels; types missing from a study add nothing.
  exploitation: Log each type's adapter output RMS relative to h per epoch; per-label
    AUC and missing-type strata against the incumbent.
  budget: 6 x 2 x 256 x 32 parameters and one small matmul per token; negligible.
  implementation: A new model.type_adapters option in config.py and modeling/model.py;
    head learning rate for the adapter parameters.
  open_choices: None; bottleneck 32 and the six types are fixed.
  dependencies: []
  priority_rationale: Specializes where attention chooses evidence, which the readout
    ideas cannot.
  status: completed
  created_revision: 1
  seeded: /home/claudio/src/knee-abnormality-revisits/autoresearch/campaigns/revisits/seed-ideas-2.yaml
  experiments:
