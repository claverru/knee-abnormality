- id: rn18-plane-head-lr-3e-4
  mechanism_id: plane-contrast-specific-readouts
  parent_idea_id: plane-contrast-readouts
  title: Lower the head learning rate from 0.0006 to 0.0003
  opportunity: The specialized readout helped modestly, but retained substantial early
    fluctuations. In the assigned incumbent, Fracture falls from 0.9452 to 0.9338
    and Lateral Meniscus from 0.9055 to 0.8940 at epoch 3. MCL subsequently falls
    from 0.9248 at epoch 6 to 0.9232 at epoch 9 while total loss continues decreasing.
    These measurements motivate testing smaller head updates; they do not establish
    that the head rate caused the fluctuations.
  mechanism: Set only optimizer.head_lr=0.0003. This halves the scheduled rates for
    the specialized disease readout, attention/projection parameters and auxiliary
    heads while preserving the backbone rate and schedule shape. The hypothesis is
    that gentler adaptation will retain specialization with less transient disruption
    and late fitting.
  precedents:
  - "run_curves.full_detail, plane-contrast-readouts: \xD71 macro ends at 0.9254;\
    \ readout gradient norm remains 0.1635 at epoch 9 despite flattening initialization\
    \ drift."
  - "run_curves.full_detail, no-anatomical-bias: \xD71 macro 0.9255\u21920.9260 over\
    \ epochs 7\u20139; loss 0.5822\u21920.5733; exploratory MCL and Fracture regress\
    \ late."
  - prior_work.md#measured-on-resnet-18 lists backbone-rate and schedule experiments,
    but no head-rate comparison.
  novelty: First supplied ResNet-18 head-rate comparison. It tunes the active readout
    rather than introducing another specialization architecture.
  coverage: All training studies and heads; evaluation remains the unchanged macro
    AUC across all 12 labels.
  exploitation: Use existing plane_readout_grad_norm, plane_readout_drift, head_grad_rms
    and per-stage diagnostics. Inspect early validation fluctuations and late macro/loss
    divergence. Initialization drift is absolute RMS movement, not a direct measure
    of separation between types; effective configuration establishes the applied rate.
  budget: "No extra operations, inputs or passes. At the assigned 10 epochs and 4,370\
    \ steps, expect approximately the incumbent's 1,197 s, within 611\u20131,833 s.\
    \ Actual duration remains supervisor-measured."
  implementation: 'Configuration-only: change optimizer.head_lr in configs/training.yaml.
    Retain the six readout matrices, global attention denominator, bias-free pooling,
    all losses, augmentations and diagnostics. On a newly accepted incumbent, apply
    this fixed rate while retaining unrelated improvements; the specialized readout
    remains a prerequisite. Do not repeat the value if already measured.'
  open_choices: 'None: one value, 0.0003, with no opposite-direction sweep. Slower
    auxiliary learning is a material uncertainty because this rate affects every non-backbone
    parameter.'
  dependencies:
  - plane-contrast-readouts
  priority_rationale: 'First: fulfills the open readout follow-up with a cheap, unmeasured
    knob and an observable instability target. Expected benefit remains uncertain.'
  source_change: false
  targeted_curve: "Assigned incumbent, epochs 2\u20134: reduce the Fracture and Lateral\
