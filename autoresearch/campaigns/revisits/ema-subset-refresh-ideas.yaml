  opportunity: 'As ema-0999-subset-refresh: user seed ema-09995 was stopped twice on the training-time
    projection (1,896 and 1,874 s) by the same full-training-set refresh.'
  mechanism: 'optimizer.weight_averaging {method: ema, decay: 0.9995} with the 25% refresh subset of
    ema-0999-subset-refresh. Runs against the incumbent at its turn, independent of the 0.999
    verdict; if ema-0999-subset-refresh was accepted, this candidate replaces its decay rather than
    stacking a second average.'
  precedents:
  - 'Runtime-invalid runs ema-09995-20260930T234509Z-49eff0c7 and ema-09995-20260930T235826Z-d8f8d20c.'
  novelty: Longer EMA window than any earlier run, inside the budget.
  coverage: As ema-0999-subset-refresh.
  exploitation: As ema-0999-subset-refresh.
  budget: As ema-0999-subset-refresh.
  implementation: As ema-0999-subset-refresh, decay 0.9995.
  open_choices: None.
  dependencies: []
  priority_rationale: User seed retake.
