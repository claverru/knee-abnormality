  opportunity: 'User decision, 2026-10-01: seed A on ResNet-10t. A single ResNet-10t lost 0.0046-0.0053
    on this recipe, tracking its weaker checkpoint; three per-plane ResNet-10ts give each plane its
    own capacity at a cost close to one ResNet-18.'
  mechanism: 'Exactly rn18-plane-backbones-joint with three resnet10t.c3_in1k backbones loaded from the
    Refined-RadImageNet ResNet-10t checkpoint and optimizer.backbone_lr 6e-5, the weight-RMS-scaled
    rate (the better of the two single ResNet-10t runs). DSU at the end of layer2; L2-SP early anchor
    on conv1/bn1/layer1 of each backbone.'
  precedents:
  - 'revisits: rn10t-scaled-backbone-lr (x4 0.925267) and rn10t-incumbent-recipe (0.924526).'
