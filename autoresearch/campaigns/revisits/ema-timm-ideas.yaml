  mechanism: 'optimizer.weight_averaging {method: ema, decay: 0.9995}, configuration only, through the
    existing EMA path; no BatchNorm refresh and no other extra pass over training data.'
  precedents:
  - 'See ema-0999-buffer-average.'
  novelty: Longer EMA window than any earlier run, without the refresh pass.
  coverage: All studies and labels.
  exploitation: As ema-0999-buffer-average.
  budget: As ema-0999-buffer-average.
  implementation: Configuration-only change to configs/training.yaml; no source change.
  open_choices: None.
  dependencies: []
  priority_rationale: User seed.
exhausted_directions: 'EMA with a per-epoch BatchNorm refresh over the training data: four runs
  invalid on runtime and the subset-refresh 0.9995 retake withdrawn by the user on 2026-10-01.'
