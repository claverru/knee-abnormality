  novelty: Longer EMA window than any earlier run.
  coverage: All studies and labels.
  exploitation: As ema-0999.
  budget: As ema-0999.
  implementation: Configuration-only change to configs/training.yaml. If ema-0999 was accepted, this
    candidate replaces its decay rather than stacking a second average.
  open_choices: None.
  dependencies: []
  priority_rationale: User seed.
