ideas:
- id: loader-upper-quantile-099
  mechanism_id: bright-end-clipping
  parent_idea_id: null
  title: Loader bright-end quantile 0.99 instead of 0.995
  opportunity: >-
    Evidence-backed. The loader scales each series to [0, 1] between its 0.005 and 0.995
    quantiles. In the fluid-sensitive series a few very bright pixels set the top, so the rest
    of the image keeps about two thirds of the other series' contrast and under half the
    pretraining variance at the backbone's stem (stem variance 0.43, stem gap 0.162). At 0.99
    the fluid series' stem gap falls to 0.085 and their contrast rises from 0.203 to 0.229,
    while the non-fluid series stay where they are (prior-work.md, Intensity mapping). A batch
    mixes all six series types under shared BatchNorm statistics, so this difference between
    types is not absorbed by normalization.
  mechanism: >-
    data.upper_quantile 0.99 in configs/training.yaml. The loader already uses this value for
    every series in training and prediction. Nothing else changes.
  precedents:
  - 'prior-work.md, Intensity mapping: upper quantile 0.999 / 0.995 / 0.99 / 0.98 gives fluid stem gap 0.334 / 0.162 / 0.085 / 0.031.'
  - 'refined-radimagenet campaign: the checkpoint normalization, the only adoption there, was also an input-statistics fix (+0.0006 on the ResNet-18).'
  novelty: The intensity quantiles have never been varied on these backbones.
  coverage: All studies and labels; the effect is concentrated in the three fluid-sensitive series types.
  exploitation: >-
    Read input_fluid_std and input_other_std first: expect about 0.23 and 0.29.
    The reference run predates these scalars; on the unchanged recipe they are about 0.20
    (fluid) and 0.28 (other), and every run of this campaign logs them. Then x4, x1 per epoch and the
    per-label deltas, with effusion, synovitis, Baker's, contusion and the menisci (read on
    fluid series) the labels to watch.
  budget: Same cost as the incumbent.
  implementation: >-
    Configuration only: set data.upper_quantile to 0.99 in configs/training.yaml. Do not edit
    any Python file and do not add logging: input_fluid_mean, input_fluid_std, input_other_mean
    and input_other_std are already logged every epoch. If accepted, later seeds inherit it.
  open_choices: None.
  dependencies: []
  priority_rationale: Free, measured, and the mildest step of the contrast fix.
- id: loader-upper-quantile-098
  mechanism_id: bright-end-clipping
  parent_idea_id: loader-upper-quantile-099
  title: Loader bright-end quantile 0.98
  opportunity: >-
    Evidence-backed. The gap keeps closing with harder clipping: at 0.98 the fluid series' stem
    gap is 0.031 (0.162 at the incumbent's 0.995, 0.085 at 0.99), their stem variance 0.69 and
    their contrast 0.257. The non-fluid series move slightly away (stem gap 0.052 against
    0.044, variance 0.92), so this run also tells whether one value can serve both groups or
    the setting must be per series type.
  mechanism: >-
    data.upper_quantile 0.98 in configs/training.yaml, whatever value the incumbent holds (0.995
    or 0.99). Nothing else changes.
  precedents:
  - 'prior-work.md, Intensity mapping.'
  - 'loader-upper-quantile-099: the milder step.'
  novelty: The second point of the dose response.
  coverage: All studies and labels.
  exploitation: >-
    input_fluid_std about 0.26 and input_other_std about 0.30.
    The reference run predates these scalars; on the unchanged recipe they are about 0.20
    (fluid) and 0.28 (other), and every run of this campaign logs them. Then x4 against the incumbent and against loader-upper-quantile-099; per-label deltas split by the labels read on fluid
    series and on non-fluid series.
  budget: Same cost as the incumbent.
  implementation: >-
    Configuration only: set data.upper_quantile to 0.98 in configs/training.yaml. Runs whatever
    the verdict of loader-upper-quantile-099. No Python change.
  open_choices: None.
  dependencies: []
  priority_rationale: Free and measured; the value with the smallest overall stem gap (0.020).
- id: heated-weights
  mechanism_id: mask-trained-weights
  parent_idea_id: null
  title: Start from the authors' mask-trained (heated) ResNet-10t checkpoint
  opportunity: >-
    In the previous campaign the heated and the fine-tuned mask-trained checkpoints scored
    +0.0012 and +0.0011 over the standard weights on this backbone, the largest effects of that
    campaign, with ligaments and menisci up and the OA labels down. Those runs used the ImageNet
    normalization, under which these checkpoints start far outside their input range, and their
    reference was mismatched too. This is the clean redo on the corrected input. The two
    checkpoints trained identically there, so one run is enough. Whether the gain holds is a
    guess.
  mechanism: >-
    model.pretrained_weights radimagenet_policy, optimizer.backbone_lr 0.0002,
    optimizer.anchor_alpha_early 0.00088, optimizer.anchor_alpha_late 0.000088. Everything else
    as the incumbent. The rate and the anchor strengths follow the checkpoint's weight scale
    (convolution RMS 0.0531 against 0.0158 for the standard weights, a factor 3.37): the rate
    is 6e-5 times that factor and each anchor strength is the incumbent's divided by the factor
    squared, which keeps the same relative step and the same relative pull.
  precedents:
  - 'refined-radimagenet run notes, runs 2 and 3: x4 0.928777 and 0.928671 against 0.927543, same settings, ImageNet normalization.'
  - 'prior-work.md, Mask-trained weights: equal linear-probe quality at the start, 88% of final features zero against 48%, a first-epoch dip of 0.006 followed by a lead from epoch 5.'
  novelty: First run of the mask-trained weights under the checkpoint normalization.
  coverage: All studies and labels.
  exploitation: >-
    x4 and x1 per epoch against the incumbent (expect behind in epoch 1 and level or ahead from
    epoch 5), per-stage drift, anchor_penalty, per-label deltas against the earlier pattern
    (MCL, ACL, lateral meniscus, contusion up; OA labels down).
  budget: Same cost as the incumbent.
  implementation: >-
    Configuration only: the four values above in configs/training.yaml. The model already loads
    this weights option for resnet10t.c3_in1k (hash-checked, strict). No Python change. If
    accepted, later seeds run on these weights and keep these four values.
  open_choices: None.
  dependencies: []
  priority_rationale: The cleanest open lead of the previous campaign, and the reference for the mask-release seed.
- id: slice-upper-quantile-098
  mechanism_id: bright-end-clipping
  parent_idea_id: null
  title: Rescale every slice by its own 0.98 quantile
  opportunity: >-
    Evidence-backed. RadImageNet images were each exported with their own window, while our
    loader uses one scale per series, so slices far from the brightest ones stay dim. Rescaling
    each prepared slice by its own 0.98 quantile gives the smallest stem gap of any deterministic
    mapping measured (0.015 against 0.044; fluid series 0.026, non-fluid variance 1.05) and
    needs no loader change.
  mechanism: >-
    model.slice_upper_quantile 0.98. In the model, right after the slices are scaled to [0, 1]
    and before any augmentation, each slice is divided by the value at its own 0.98 quantile and
    clamped to 1, in training and in prediction. The loader's quantiles stay as the incumbent
    has them.
  precedents:
  - 'prior-work.md, Intensity mapping: per-slice quantile 0.99 / 0.98 / 0.95 gives stem gap 0.018 / 0.015 / 0.037.'
  novelty: Per-slice intensity scaling has not been tried.
  coverage: All studies and labels, every slice.
  exploitation: >-
    input_fluid_std and input_other_std both between about 0.26 and 0.31, close to each other.
    The reference run predates these scalars; on the unchanged recipe they are about 0.20
    (fluid) and 0.28 (other), and every run of this campaign logs them. Then x4 against the incumbent and against the
    loader-quantile seeds; per-label deltas.
  budget: One sort per slice on the GPU; same cost as the incumbent within a few percent.
  implementation: >-
    Configuration only: set model.slice_upper_quantile to 0.98 in configs/training.yaml. The
    option is built (KneeAbnormalityModel.encode_batch) and applies in training and prediction.
    No Python change. It is applied on top of whatever loader quantile the incumbent holds.
  open_choices: None.
  dependencies: []
  priority_rationale: The best measured deterministic mapping; no loader change.
- id: autoaugment-intensity
  mechanism_id: pretraining-augmentation
  parent_idea_id: null
  title: Use the pretraining's AutoAugment intensity operations in place of our gamma and
    contrast augmentation
  opportunity: >-
    Evidence-backed. The backbone was trained with torchvision's AutoAugment ImageNet policy on
    every image, and its stored BatchNorm statistics were collected on those images. Passing our
    slices through that policy brings them to the stored statistics (stem gap 0.044 to
    0.015-0.017, fluid series 0.180 to 0.017-0.019), while our own gamma and contrast
    augmentation leaves the gap where it is. So the backbone already knows these appearance
    changes: they regularize without asking it to learn a new invariance.
  mechanism: >-
    data.autoaugment_intensity.probability 1.0 and data.intensity_augmentation.probability 0.0.
    In training only, each slice gets one randomly chosen sub-policy of the ImageNet policy
    with its own operation probabilities and magnitudes (posterize, solarize, autocontrast,
    equalize, contrast, brightness, sharpness, invert); the policy's rotate, shear and colour
    steps are skipped, because our affine augmentation handles geometry together with the token
    positions and the images are grey. It runs after our affine, noise, smoothing, resolution
    and GIN steps and before normalization. Validation and prediction are unchanged.
  precedents:
  - 'prior-work.md, The pretraining augmentation on our slices, and the single-operation readings.'
  - 'prior-work.md, The pretraining recipe: AutoAugment ImageNet on, MixUp off.'
  novelty: AutoAugment has never been run in our fine-tuning.
  coverage: All training slices; about three quarters receive at least one operation.
  exploitation: >-
    autoaugment_intensity_slices per epoch (the slices that received at least one operation:
    expect about three quarters of the roughly 90,000 training slices of an epoch, zero means
    it did not run); training loss and x1 per epoch against the incumbent; per-label deltas;
    training seconds.
  budget: >-
    The operations run slice by slice on the GPU: estimated 1.3 to 1.6 times the incumbent,
    unmeasured; inside the range.
  implementation: >-
    Configuration only: set data.autoaugment_intensity.probability to 1.0 and
    data.intensity_augmentation.probability to 0.0 in configs/training.yaml, keeping the other
    fields of intensity_augmentation as they are. The option is built
    (modeling/pretraining_augmentation.py, called in encode_batch). No Python change.
  open_choices: None.
  dependencies: []
  priority_rationale: The largest measured closing of the gap on the augmentation side.
exhausted_directions: None.
