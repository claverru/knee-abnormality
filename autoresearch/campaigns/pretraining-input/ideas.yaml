- id: union-bag-loss
  mechanism_id: union-bag
  parent_idea_id: null
  title: Extra loss on bags that join two studies, labelled with the OR of their labels
  opportunity: 'A guess. Mixing two studies with labels in proportion to their share
    is wrong for our labels: a tear visible on three slices does not become half a
    tear. The correct label of the slices of two knees pooled together is the OR.
    Training the attention pooling on such bags asks it to find a finding among twice
    as many slices, half of them from a knee without it, which is what larger inference
    bags and big studies demand.'
  mechanism: trainer.union_bag_loss_weight 0.5. In training, the studies of each batch
    are paired at random (four pairs at batch 8); the already-encoded tokens of each
