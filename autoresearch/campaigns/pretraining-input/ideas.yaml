    - k) / (1 - k)). Values up to k are unchanged, so the stretch of the darker tissue
    is exactly the incumbent's; the quantile itself (v = 1) lands at 0.95 for k =
    0.8 and brighter pixels approach 1 without reaching it, so fluid keeps its gradation.
