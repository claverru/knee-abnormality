- id: autoaugment-intensity
  mechanism_id: pretraining-augmentation
  parent_idea_id: null
  title: Use the pretraining's AutoAugment intensity operations in place of our gamma
    and contrast augmentation
  opportunity: 'Evidence-backed. The backbone was trained with torchvision''s AutoAugment
    ImageNet policy on every image, and its stored BatchNorm statistics were collected
    on those images. Passing our slices through that policy brings them to the stored
    statistics (stem gap 0.044 to 0.015-0.017, fluid series 0.180 to 0.017-0.019),
    while our own gamma and contrast augmentation leaves the gap where it is. So the
    backbone already knows these appearance changes: they regularize without asking
    it to learn a new invariance.'
  mechanism: data.autoaugment_intensity.probability 1.0 and data.intensity_augmentation.probability
    0.0. In training only, each slice gets one randomly chosen sub-policy of the ImageNet
    policy with its own operation probabilities and magnitudes (posterize, solarize,
    autocontrast, equalize, contrast, brightness, sharpness, invert); the policy's
    rotate, shear and colour steps are skipped, because our affine augmentation handles
    geometry together with the token positions and the images are grey. It runs after
    our affine, noise, smoothing, resolution and GIN steps and before normalization.
    Validation and prediction are unchanged.
  precedents:
  - prior-work.md, The pretraining augmentation on our slices, and the single-operation
    readings.
  - 'prior-work.md, The pretraining recipe: AutoAugment ImageNet on, MixUp off.'
  novelty: AutoAugment has never been run in our fine-tuning.
  coverage: All training slices; about three quarters receive at least one operation.
  exploitation: 'autoaugment_intensity_slices per epoch (the slices that received
    at least one operation: expect about three quarters of the roughly 90,000 training
    slices of an epoch, zero means it did not run); training loss and x1 per epoch
    against the incumbent; per-label deltas; training seconds.'
  budget: 'The operations run slice by slice on the GPU: estimated 1.3 to 1.6 times
    the incumbent, unmeasured; inside the range.'
  implementation: 'Configuration only: set data.autoaugment_intensity.probability
    to 1.0 and data.intensity_augmentation.probability to 0.0 in configs/training.yaml,
    keeping the other fields of intensity_augmentation as they are. The option is
    built (modeling/pretraining_augmentation.py, called in encode_batch). No Python
    change.'
  open_choices: None.
  dependencies: []
  priority_rationale: The largest measured closing of the gap on the augmentation
    side.
  status: completed
  created_revision: 0
  seeded: /home/claudio/src/knee-abnormality-refined-radimagenet/autoresearch/campaigns/pretraining-input/seed-ideas.yaml
