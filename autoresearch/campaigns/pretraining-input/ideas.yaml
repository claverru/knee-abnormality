- id: slice-upper-quantile-098
  mechanism_id: bright-end-clipping
  parent_idea_id: null
  title: Rescale every slice by its own 0.98 quantile
  opportunity: Evidence-backed. RadImageNet images were each exported with their own
    window, while our loader uses one scale per series, so slices far from the brightest
    ones stay dim. Rescaling each prepared slice by its own 0.98 quantile gives the
    smallest stem gap of any deterministic mapping measured (0.015 against 0.044;
    fluid series 0.026, non-fluid variance 1.05) and needs no loader change.
  mechanism: model.slice_upper_quantile 0.98. In the model, right after the slices
    are scaled to [0, 1] and before any augmentation, each slice is divided by the
    value at its own 0.98 quantile and clamped to 1, in training and in prediction.
    The loader's quantiles stay as the incumbent has them.
  precedents:
  - 'prior-work.md, Intensity mapping: per-slice quantile 0.99 / 0.98 / 0.95 gives
    stem gap 0.018 / 0.015 / 0.037.'
  novelty: Per-slice intensity scaling has not been tried.
  coverage: All studies and labels, every slice.
  exploitation: input_fluid_std and input_other_std both between about 0.26 and 0.31,
    close to each other. The reference run predates these scalars; on the unchanged
    recipe they are about 0.20 (fluid) and 0.28 (other), and every run of this campaign
    logs them. Then x4 against the incumbent and against the loader-quantile seeds;
    per-label deltas.
  budget: One sort per slice on the GPU; same cost as the incumbent within a few percent.
  implementation: 'Configuration only: set model.slice_upper_quantile to 0.98 in configs/training.yaml.
    The option is built (KneeAbnormalityModel.encode_batch) and applies in training
    and prediction. No Python change. It is applied on top of whatever loader quantile
    the incumbent holds.'
  open_choices: None.
  dependencies: []
  priority_rationale: The best measured deterministic mapping; no loader change.
  status: completed
