    the fluid series'' stem gap is 0.031 (0.162 at the incumbent''s 0.995, 0.085 at
    0.99), their stem variance 0.69 and their contrast 0.257. The non-fluid series
    move slightly away (stem gap 0.052 against 0.044, variance 0.92), so this run
    also tells whether one value can serve both groups or the setting must be per
    series type.'
  mechanism: data.upper_quantile 0.98 in configs/training.yaml, whatever value the
    incumbent holds (0.995 or 0.99). Nothing else changes.
  precedents:
  - prior-work.md, Intensity mapping.
  - 'loader-upper-quantile-099: the milder step.'
