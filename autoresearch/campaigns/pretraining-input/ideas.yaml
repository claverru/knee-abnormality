- id: learned-mask-policy
  mechanism_id: input-mask
  parent_idea_id: input-mask-centred-one
  title: Mask policy with a learning signal that can move it
  opportunity: 'A guess with a diagnosed cause. In the previous campaign the policy
    never learned: its Beta parameters stayed at 1.000 and its gradient norm at 0.0001,
    so both policy runs were the random mask. Three things starved it: the loss weighted
    the reward by a logsumexp over 4,096 cells, which is dominated by one cell; the
    reward had no baseline, so every mask in a batch was pushed the same way; and
    one reward per study was spread over 4,096 cells per slice. This seed fixes those
    three and nothing else, so the authors'' procedure gets a run in which the mask
    actually depends on the image.'
  mechanism: 'A small policy network (ResNet-10t from the standard Refined-RadImageNet
    weights, then two heads) reads each normalized slice and outputs the Beta parameters
    of an 8 x 8 grid of cells. A mask is sampled, shifted to the range [0.5, 1.5]
    (mean near 1 at the start), resized to 224 and blurred, and multiplies the normalized
    input in training. The policy is trained by REINFORCE on the study''s class-balanced
    BCE: its loss is the mean over slices of the per-slice mean log-density of the
    sampled cells times the study''s advantage, where the advantage is the detached
    study loss minus the batch mean, divided by the batch standard deviation. Prediction
    multiplies the input by the constant 1.0.'
  precedents:
  - 'prior-work.md, The mask procedure in our training: policy uniform, gradient norm
    0.0001.'
  - 'Frozen source of the earlier implementation: outputs/autoresearch/refined-radimagenet/experiments/policy-mask-rn10t-20261004T114633Z-b68939c7/source/src/knee_abnormality
    (modeling/input_mask.py and the input_mask parts of training/lightning.py and
    config.py).'
  novelty: First policy run with a baseline, a per-cell mean and a coarse grid.
  coverage: Every training slice, all epochs.
  exploitation: 'First whether the policy moved: input_mask_alpha_mean and input_mask_beta_mean
    away from 1.0, input_mask_alpha_slice_std above 0.01 (the mask depends on the
    image) and input_mask_policy_grad_norm well above the earlier 0.0001. Then input_mask_mean
    and input_mask_std, and x4, x1 per epoch and per-label deltas against the incumbent
    and against input-mask-centred-one, which is the same mask without a policy.'
  budget: 'One extra ResNet-10t pass with gradient per step: estimated 1.5 to 1.8
    times the incumbent (the earlier policy run on a ResNet-18 took 1.5 times); inside
    the range.'
  implementation: 'Source change in three files; do not touch modeling/model.py or
    the loader. (1) config.py, InputMaskConfig: extend kind to Literal["none", "random",
    "policy"] and add policy_backbone_lr: PositiveFiniteFloat = 0.0006. (2) modeling/pretraining_augmentation.py:
    add class PolicyInputMask(nn.Module), whose forward keeps gradients (unlike RandomInputMask.forward,
    which is under no_grad), by porting PolicyInputMask from the frozen source named
    in the precedents (constructor arguments settings, image_size, seed; feature_extractor
    timm resnet10t.c3_in1k with num_classes 0 loaded strictly from radimagenet_state_dict("resnet10t.c3_in1k");
    alpha and beta heads Linear 512-512, BatchNorm1d, ReLU, Linear 512-512, BatchNorm1d,
    ReLU, Linear 512-cells; seeded sampling under torch.random.fork_rng with the generator
    state kept on the module; the separable Gaussian smoothing), with exactly these
    differences: cells = settings.grid squared with grid 8; no base_alpha or base_beta
