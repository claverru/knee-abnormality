- id: study-cutmix
  mechanism_id: study-cutmix
  parent_idea_id: null
  title: CutMix between slices of the same study and series type
  opportunity: A guess, with a neutral gap measurement. The pretraining configuration
    sets CutMix (alpha 1.0). Pasting a box from another slice of the same study and
    series type keeps the study's labels exactly right, because both slices belong
    to the same knee, and CutMix moves the input no further from the pretraining statistics
    (stem gap 0.035 against 0.044). It forces the pooling to use evidence from partial
    slices.
  mechanism: data.study_cutmix_augmentation.probability 0.5. In training only, each
    slice with that probability has a random box (side fraction sqrt(1 - u), u uniform,
    random centre) replaced by the same box of another slice of the same study and
    series type; slices with no partner are left alone. Labels and token positions
    are unchanged. It runs after our other augmentations and before normalization.
