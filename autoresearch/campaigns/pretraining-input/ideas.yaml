- id: heated-weights
  mechanism_id: mask-trained-weights
  parent_idea_id: null
  title: Start from the authors' mask-trained (heated) ResNet-10t checkpoint
  opportunity: In the previous campaign the heated and the fine-tuned mask-trained
    checkpoints scored +0.0012 and +0.0011 over the standard weights on this backbone,
    the largest effects of that campaign, with ligaments and menisci up and the OA
    labels down. Those runs used the ImageNet normalization, under which these checkpoints
    start far outside their input range, and their reference was mismatched too. This
    is the clean redo on the corrected input. The two checkpoints trained identically
    there, so one run is enough. Whether the gain holds is a guess.
  mechanism: 'model.pretrained_weights radimagenet_policy, optimizer.backbone_lr 0.0002,
    optimizer.anchor_alpha_early 0.00088, optimizer.anchor_alpha_late 0.000088. Everything
    else as the incumbent. The rate and the anchor strengths follow the checkpoint''s
    weight scale (convolution RMS 0.0531 against 0.0158 for the standard weights,
    a factor 3.37): the rate is 6e-5 times that factor and each anchor strength is
    the incumbent''s divided by the factor squared, which keeps the same relative
    step and the same relative pull.'
  precedents:
  - 'refined-radimagenet run notes, runs 2 and 3: x4 0.928777 and 0.928671 against
    0.927543, same settings, ImageNet normalization.'
  - 'prior-work.md, Mask-trained weights: equal linear-probe quality at the start,
    88% of final features zero against 48%, a first-epoch dip of 0.006 followed by
    a lead from epoch 5.'
  novelty: First run of the mask-trained weights under the checkpoint normalization.
  coverage: All studies and labels.
  exploitation: x4 and x1 per epoch against the incumbent (expect behind in epoch
    1 and level or ahead from epoch 5), per-stage drift, anchor_penalty, per-label
    deltas against the earlier pattern (MCL, ACL, lateral meniscus, contusion up;
    OA labels down).
  budget: Same cost as the incumbent.
  implementation: 'Configuration only: the four values above in configs/training.yaml.
    The model already loads this weights option for resnet10t.c3_in1k (hash-checked,
    strict). No Python change. If accepted, later seeds run on these weights and keep
    these four values.'
  open_choices: None.
  dependencies: []
  priority_rationale: The cleanest open lead of the previous campaign, and the reference
    for the mask-release seed.
  status: completed
  created_revision: 0
