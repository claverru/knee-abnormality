- id: loader-upper-quantile-099
  mechanism_id: bright-end-clipping
  parent_idea_id: null
  title: Loader bright-end quantile 0.99 instead of 0.995
  opportunity: Evidence-backed. The loader scales each series to [0, 1] between its
    0.005 and 0.995 quantiles. In the fluid-sensitive series a few very bright pixels
    set the top, so the rest of the image keeps about two thirds of the other series'
    contrast and under half the pretraining variance at the backbone's stem (stem
    variance 0.43, stem gap 0.162). At 0.99 the fluid series' stem gap falls to 0.085
    and their contrast rises from 0.203 to 0.229, while the non-fluid series stay
    where they are (prior-work.md, Intensity mapping). A batch mixes all six series
    types under shared BatchNorm statistics, so this difference between types is not
    absorbed by normalization.
  mechanism: data.upper_quantile 0.99 in configs/training.yaml. The loader already
    uses this value for every series in training and prediction. Nothing else changes.
  precedents:
  - 'prior-work.md, Intensity mapping: upper quantile 0.999 / 0.995 / 0.99 / 0.98
    gives fluid stem gap 0.334 / 0.162 / 0.085 / 0.031.'
  - 'refined-radimagenet campaign: the checkpoint normalization, the only adoption
    there, was also an input-statistics fix (+0.0006 on the ResNet-18).'
  novelty: The intensity quantiles have never been varied on these backbones.
  coverage: All studies and labels; the effect is concentrated in the three fluid-sensitive
    series types.
  exploitation: 'Read input_fluid_std and input_other_std first: expect about 0.23
    and 0.29. The reference run predates these scalars; on the unchanged recipe they
    are about 0.20 (fluid) and 0.28 (other), and every run of this campaign logs them.
    Then x4, x1 per epoch and the per-label deltas, with effusion, synovitis, Baker''s,
    contusion and the menisci (read on fluid series) the labels to watch.'
  budget: Same cost as the incumbent.
  implementation: 'Configuration only: set data.upper_quantile to 0.99 in configs/training.yaml.
    Do not edit any Python file and do not add logging: input_fluid_mean, input_fluid_std,
    input_other_mean and input_other_std are already logged every epoch. If accepted,
    later seeds inherit it.'
  open_choices: None.
  dependencies: []
  priority_rationale: Free, measured, and the mildest step of the contrast fix.
  status: completed
  created_revision: 0
