    run predates these scalars; on the unchanged recipe they are about 0.20 (fluid)
    and 0.28 (other), and every run of this campaign logs them. Then x4 against the
    incumbent and against loader-upper-quantile-099; per-label deltas split by the
    labels read on fluid series and on non-fluid series.
  budget: Same cost as the incumbent.
  implementation: 'Configuration only: set data.upper_quantile to 0.98 in configs/training.yaml.
    Runs whatever the verdict of loader-upper-quantile-099. No Python change.'
  open_choices: None.
  dependencies: []
