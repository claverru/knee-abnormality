ideas:
- id: split-knee-bag-loss
  mechanism_id: union-bag
  parent_idea_id: union-bag-loss
  title: Extra loss on chimera knees, the medial half of one study joined to the lateral half of another
  opportunity: >-
    A guess, on a mechanism the model already has. Medial and lateral findings co-occur in the
    same knee (OA above all), so the model can score a side from the other side's evidence. A
    bag made of the medial half of study A and the lateral half of study B has exactly known
    side labels, medial from A and lateral from B, and breaks that co-occurrence: half of the
    pairs carry a finding on one side only, which real knees rarely give. Every token already
    has its medial-lateral coordinate (the half-knee loss uses it), so the halves are cut in
    the knee's own frame in every plane.
  mechanism: >-
    trainer.split_knee_bag_loss_weight 0.5. In training, the studies of each batch are paired at
    random (four pairs at batch 8). In each pair, one study keeps only its tokens more than 10
    mm medial of the midline and the other only its tokens more than 10 mm lateral (the
    existing COMPARTMENT_MIDLINE_BAND_MM); the kept, already-encoded tokens are pooled as one
    bag by the model's own pooling. Only the five side labels count: Medial Meniscus,
    Medial OA and MCL (a medial structure) take the medial donor's label, Lateral Meniscus and
    Lateral OA the lateral donor's, each when observed in its donor; the other seven labels are
    left out of this loss (trainer.split_knee_other_labels none, the default). Its
    class-balanced BCE, times the weight, is added to the loss. A pair in which a donor has no token on its
    side (a study of unknown knee side) is left whole and not counted. No extra backbone pass;
    validation and prediction unchanged.
  precedents:
  - 'The half-knee loss of the recipe: per-half meniscus scores from the same medial-lateral coordinate.'
  - 'union-bag-loss: the same pairing with whole studies and OR labels.'
  novelty: Recombining halves of different knees has not been tried.
  coverage: Every training study, as one half of one of four bags per batch; five labels.
  exploitation: >-
    split_knee_bag_loss, split_knee_bags (expect about 1,600 per epoch: about 1,750 pairs less
    those with a study of unknown knee side) and split_knee_kept_token_share (about 0.4); the per-label deltas of the five side labels and
    the medial-lateral crossed-error counts of the validation metrics against the incumbent;
    x4 and x1.
  budget: One extra pooling pass per step; same cost as the incumbent within a few percent.
  implementation: >-
    Configuration only: set trainer.split_knee_bag_loss_weight to 0.5 in configs/training.yaml
    and leave trainer.split_knee_other_labels absent (default none).
    The option is built (KneeModule._chimera_bag_loss in training/lightning.py). Keep every
    other bag-loss key as the incumbent has it. No Python change.
  open_choices: None.
  dependencies: []
  priority_rationale: A label-exact mix of two studies aimed at the side labels.
- id: split-knee-bag-average
  mechanism_id: union-bag
  parent_idea_id: split-knee-bag-loss
  title: Chimera knees with the non-side labels averaged over the two donors
  opportunity: >-
    A guess, on a mechanism the model already has. Medial and lateral findings co-occur in the
    same knee (OA above all), so the model can score a side from the other side's evidence. A
    bag made of the medial half of study A and the lateral half of study B has exactly known
    side labels, medial from A and lateral from B, and breaks that co-occurrence: half of the
    pairs carry a finding on one side only, which real knees rarely give. Every token already
