    are T2 without fat suppression, 129 T1-FS series with non-FS flags and 130 flat
    near-PD GE zero-TE sagittals: the contrast varies inside a slot far beyond what
    global gamma/contrast jitter models. Broader gamma/contrast lost (contrast 0.8-1.2
    -0.0033 and -0.0067), so the lever is a different shape of variation, not more
    of the same.'
  mechanism: 'For each augmented acquisition sample one network g: 4 conv layers,
    2 hidden channels, one input and one output channel, kernel size 1 or 3 drawn
    per network, weights N(0, 1), LeakyReLU between layers. Apply g with shared weights
    to each of the three slice channels separately (in_channels = 1), blend x'' =
    a*g(x) + (1 - a)*x with a ~ U(0, 0.5), rescale x'' so its Frobenius norm over
    the acquisition''s valid pixels equals the input''s, clamp to [0, 1] and restore
    padding. Probability 0.3 per acquisition. Runs after gamma/contrast and before
    noise.'
