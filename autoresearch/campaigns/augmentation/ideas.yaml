  decision: reject
- id: unsharp-sharpening-augmentation
  mechanism_id: unsharp-mask-sharpening
  parent_idea_id: null
  title: Mild unsharp-mask sharpening per acquisition to imitate vendor sharpening
    filters
  opportunity: 'Vendor post-processing varies: GE deep-learning reconstructions and
    Philips reformats appear as duplicate pairs in the training set, and stored images
    are interpolated about 2x with vendor-specific filters. Nothing in the pipeline
    varies edge sharpness upward.'
  mechanism: x' = x + s*(x - G_sigma(x)) per slice channel, sigma ~ U(0.5, 1.0) px,
    s ~ U(0.2, 1.0), one draw per acquisition, clamp to [0, 1], restore padding. Probability
    0.25. Runs after affine and before gamma/contrast, inside the geometric valid
    region.
  precedents:
  - 'BigAug (Zhang et al., arXiv:1906.03347): best single MRI transform; unseen-site
    prostate Dice 60.4 -> 65.5, 58.0 -> 82.8, 76.8 -> 84.0 against a crop-only baseline.'
  - 'RSNA 2024 lumbar 9th place: sharpen or motion blur, p 0.5, as a recipe component.'
  novelty: First sharpness augmentation here; the opposite direction to seed 2 and
    run separately from it.
  coverage: Every acquisition; all labels.
  exploitation: If both seeds 2 and 3 help, a combined sharpness family is a follow-up.
  budget: One separable Gaussian blur per augmented slice channel.
  implementation: Adds data.sharpen_augmentation (probability 0.25, sigma_range [0.5,
    1.0], amount_range [0.2, 1.0]) in config.py and modeling/augmentation.py.
  open_choices: None.
  dependencies: []
  priority_rationale: Isolated evidence, though against a weak baseline; cheap and
    physically motivated.
  status: completed
