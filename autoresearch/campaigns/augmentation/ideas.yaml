- id: smooth-bias-field-augmentation
  mechanism_id: multiplicative-bias-field
  parent_idea_id: null
  title: Multiply each acquisition by a smooth low-order polynomial field within plus
    or minus 20%
  opportunity: Knee surface coils produce spatial intensity shading; global gamma
    and contrast cannot reproduce it. Residual shading in these images was never measured,
    and bias-field augmentation was not selected in the 2026-09-21 backlog review
    for unrecorded reasons; this seed runs without that measurement.
  mechanism: For each augmented acquisition draw a cubic polynomial P(x, y) over normalized
    image coordinates with coefficients N(0, 1), scale it so max |P| over the valid
    region is 1, and multiply by B = 1 + a*P with a ~ U(0, 0.2); one field shared
    by the three slice channels and all triplets. Clamp to [0, 1], restore padding.
    Probability 0.25. Runs after affine and before gamma/contrast.
  precedents:
  - 'TorchIO RandomBiasField and MONAI bias-field transforms: MRI inhomogeneity model,
    availability only.'
  - AdvBias (adversarial bias field) gained in the GIN and SLAug comparisons; a different,
    adversarial method.
  novelty: First spatially varying intensity augmentation here.
  coverage: Every acquisition; all labels.
  exploitation: If it helps, measure residual shading by vendor and coil to set a
    data-derived amplitude.
  budget: One polynomial evaluation per augmented acquisition.
  implementation: Adds data.bias_field_augmentation (probability 0.25, amplitude 0.2,
    degree 3) in config.py and modeling/augmentation.py.
  open_choices: None.
  dependencies: []
  priority_rationale: Mechanism-only evidence and an unmeasured premise; runs after
    the better-supported seeds.
  status: completed
  created_revision: 1
