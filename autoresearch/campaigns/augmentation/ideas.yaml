- id: noise-referenced-bilateral-smoothing
  mechanism_id: edge-preserving-smoothing
  parent_idea_id: bilateral-smoothing-augmentation
  title: 'Noise-referenced bilateral smoothing: scale each acquisition''s drawn range
    sigma by its measured noise relative to the training median'
  opportunity: "Smoothing was adopted at +0.0020 (80% [+0.0002, +0.0039]), but narrowly:\
    \ the same source retrained at seed 1704794368 scored 0.8958, 0.0049 below the\
    \ adopted run.\n\nIts premise is imitating denoising (deep-learning) reconstructions,\
    \ which remove noise in proportion to the input noise. The adopted filter instead\
    \ draws range \u03C3 ~ U(0.05, 0.1) regardless of the acquisition:\n- on already\
    \ clean acquisitions, it can flatten low-contrast texture that is signal, such\
    \ as meniscal intrasubstance signal or faint edema;\n- on noisy acquisitions,\
    \ it denoises only partly.\n\nTying the range to each acquisition's measured noise\
    \ brings the transform closer to what a reconstruction does, without changing\
    \ its median strength."
  mechanism: "Keep the adopted smoothing: probability 0.2 per acquisition, its range\
    \ draw r ~ U(0.05, 0.1), spatial \u03C3 1 px, the 5\xD75 kernel, the geometric\
    \ valid mask, and its placement after affine and before intensity.\n\nFor each\
    \ selected acquisition, estimate \u03C3\u0302 with Immerk\xE6r's operator: the\
    \ 3\xD73 kernel [1,\u22122,1; \u22122,4,\u22122; 1,\u22122,1], with \u03C3\u0302\
    \ = \u221A(\u03C0/2)\xB7mean|I\u2217N|/6. Compute it on the prepared, pre-affine\
    \ image, over valid-rectangle pixels eroded by one pixel, and average it over\
    \ the acquisition's triplets and slice channels.\n\nUse range \u03C3 = r \xB7\
    \ clamp(\u03C3\u0302/\u03C3\u0302_ref, q05, q95). Here \u03C3\u0302_ref is the\
    \ median of the same estimator over at least 2,000 training acquisitions, and\
    \ q05 and q95 are its 5th and 95th percentile ratios; both are measured label-free\
    \ before launch.\n\nThe median range stays 0.075. Noisy acquisitions get stronger\
    \ denoising and clean ones weaker, and no new random numbers are drawn. \u03C3\
    \u0302 measures the high-frequency residual on the 0.625 mm grid, which is what\
    \ the 5\xD75 filter acts on, not the physical coil noise."
  precedents:
  - "bilateral-smoothing-augmentation-20260926T021107Z-ea5abbac: +0.0020, 80% [+0.00018,\
    \ +0.0039], soft AUC +0.0006. It is active in the DSU incumbent, with effective\
    \ probability 0.19\u20130.21 and mean |\u0394pixel| 0.0074. Its fresh-seed retrain\
    \ (control-20260926T031233Z-662c7c0c-1) scored 0.8958 vs 0.9007. The user restored\
    \ the adoption on 2026-09-26."
  - "Immerk\xE6r, Fast noise variance estimation, CVIU 64(2):300\u2013302, 1996: the\
    \ 3\xD73 Laplacian-difference noise estimator."
  - "Zhang & Gunturk, Multiresolution bilateral filtering for image denoising, IEEE\
    \ TIP 17(12), 2008: the best bilateral range parameter grows roughly linearly\
    \ with the noise \u03C3, at about 2\u03C3_n."
  - 'augmentation-campaign.md candidate 7 and its data facts: GE deep-learning reconstructions
    and vendor denoising and sharpening filters vary across the training data.'
  - 'In this campaign, the other reconstruction-appearance families did not clear
    the rule: sharpening +0.0004 and one-axis k-space degradation +0.0012.'
  novelty: This is the first augmentation here whose strength follows a label-free
    property of the acquisition itself.
  coverage: 20% of acquisitions, in all planes and contrasts, affecting all labels.
  exploitation: If it helps, the same noise reference would let a later one-of reconstruction-appearance
    composition choose smoothing for noisy acquisitions. That composition waits for
    a second adopted image family.
  budget: "One 3\xD73 convolution and a masked mean per selected acquisition: milliseconds\
    \ per step, with no new random draws and no extra forward pass. The label-free\
    \ reference measurement runs once before launch, off the training path."
  implementation: "Modifies the adopted smoothing in modeling/augmentation.py and\
    \ config.py.\n\n**Retains:**\n- the smoothing's probability, range draw, spatial\
    \ \u03C3, kernel, geometric mask, activity logging, and the noise/intensity order;\n\
    - DSU and every other family, unchanged.\n\n**Changes,** in ImageAugmentation.forward\
    \ before the affine warp:\n1. For the acquisitions the smoothing draw selects,\
    \ compute \u03C3\u0302: the Immerk\xE6r 3\xD73 convolution per slice channel on\
    \ the prepared image, its absolute value, and the mean over pixels whose 3\xD7\
    3 neighbourhood lies inside the reflection-adjusted valid rectangle.\n2. index_add\
    \ those means over the acquisition's triplets and channels.\n3. Multiply those\
    \ acquisitions' drawn range_sigma by clamp(\u03C3\u0302/noise_reference, *noise_ratio_range)\
    \ before apply_bilateral_smoothing.\n\n**Config:** add data.smoothing_augmentation.noise_reference\
    \ and noise_ratio_range to config.py and configs/training.yaml. Set them from\
    \ a label-free measurement of the same estimator over at least 2,000 training\
    \ acquisitions (the median, and the 5th/95th percentile ratios), and record the\
    \ measurement with the prepare report. The fixed-range behavior is replaced, not\
    \ kept as an option.\n\n**Logging:** each epoch, log the mean, p10 and p90 of\
    \ the ratio and of the applied range \u03C3 next to the existing smoothing activity.\n\
    \nKeep any newly adopted incumbent (GIN, aligned MixUp) unchanged."
  open_choices: "None, once the label-free measurement fixes \u03C3\u0302_ref and\
    \ the clamp bounds."
  dependencies:
  - bilateral-smoothing-augmentation
  priority_rationale: Third. It is the adopted family's one required follow-up; it
