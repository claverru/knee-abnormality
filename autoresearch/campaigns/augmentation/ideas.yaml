- id: triplet-channel-reversal
  mechanism_id: slice-channel-order-reversal
  parent_idea_id: null
  title: Reverse the three slice channels of axial and coronal acquisitions
  opportunity: Slice order within a triplet carries through-plane direction; sagittal
    reflection already reverses it, axial and coronal never do. Lumbar solutions report
    channel shuffle and sequence flips helping, without numbers.
  mechanism: With probability 0.5 per axial or coronal acquisition, reverse the order
    of its three slice channels in every triplet, and update the per-channel source
    mapping passed to feature_geometry so token geometry stays consistent (compose
    with reflection_channels). The middle slice and its position are unchanged. Sagittal
    acquisitions are untouched.
  precedents:
  - 'RSNA 2024 lumbar 9th place: channel shuffle p 0.5 on axial "significantly improved",
    no numbers; 2nd place flipped the sequence order.'
  novelty: First through-plane order augmentation for axial and coronal here.
  coverage: Axial and coronal acquisitions; all labels.
  exploitation: If it helps, nothing obvious follows; if it hurts, close the family.
  budget: None.
  implementation: Adds data.channel_reversal_augmentation (probability 0.5) in config.py,
    the reversal in modeling/augmentation.py and the channel-mapping composition in
    modeling/model.py.
  open_choices: None.
  dependencies: []
  priority_rationale: Author claims only; low confidence.
  status: completed
