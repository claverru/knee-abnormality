- id: pooled-output-mixup
  mechanism_id: pooled-output-mixup
  parent_idea_id: null
  title: 'MixUp variant A: mix pooled study outputs, equivalent to mixing the final
    logits'
  opportunity: 'The cheapest MixUp: no image or token change. It isolates the effect
    of two-target supervision on interpolated outputs from input or feature mixing.'
  mechanism: Same pairing, lambda and main loss as variant C (aligned-image-mixup),
    without slot matching. The readout after pooling is linear in the pooled features
    and the OA detector correction is linear in the pooled evidence, so mixing both
    with the same lambda equals z_mix = l*z_a + (1 - l)*z_b. The half-knee and report-attribute
    losses stay unchanged because tokens are not mixed.
  precedents:
  - Variants C and B of this campaign; RSNA 2024 lumbar MixUp precedents.
  novelty: Logit interpolation with two-target supervision; the weakest of the three
    by construction.
  coverage: 30% of training studies per batch; all labels.
  exploitation: If A matches B or C, the benefit comes from the targets, not from
    mixed features.
  budget: A permutation and a second BCE on mixed rows.
  implementation: Adds trainer.pooled_mixup (fraction 0.3, beta_alpha 1.0) in config.py
    and the mixing and loss in training/lightning.py; logs as C.
  open_choices: None.
  dependencies: []
  priority_rationale: Third variant; the control for where mixing matters.
  status: completed
  created_revision: 1
