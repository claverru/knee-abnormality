- id: gin-reference-faithful-networks
  mechanism_id: global-intensity-nonlinear-augmentation
  parent_idea_id: gin-intensity-augmentation-v3
  title: 'GIN as in the reference code: per-layer random shifts and kernel sizes applied
    to each acquisition''s standardized intensities, de-standardized before clamping'
  opportunity: "GIN v3 scored +0.0013 (80% [\u22120.0012, +0.0038]), but a label-free\
    \ audit shows it did not run GIN. Audit: scratch/gin/README.md in this job. The\
    \ cause: v3 dropped the reference code's random shifts and fed nonnegative [0,\
    \ 1] inputs to the network, which makes it positively homogeneous.\n\nOn 1,424\
    \ draws over real fold-2 acquisitions, using v3's own code:\n- 49\u201351% of\
    \ selected acquisitions were unchanged; every 1\xD71 draw is g(x) = k\xB7x, which\
    \ the norm rescale undoes.\n- 3.3\u20135.2% were fully blacked out, from \u2212\
    x clamped to 0.\n- The 3\xD73 draws clipped 22\u201324% of pixels at 0 and acted\
    \ as edge filters, not intensity remaps.\n\nThe logged effective p of 0.30 therefore\
    \ overstated activity: only about 0.15 of acquisitions changed. The seed's mechanism\
    \ is untested."
  mechanism: "Each acquisition is selected with p 0.3, drawn per acquisition after\
    \ the existing families' draws, as in v3.\n\nFor a selected acquisition:\n1. Compute\
    \ \u03BC and s over its geometric valid region, pooled across all its triplets\
    \ and slice channels. Set z = (x \u2212 \u03BC)/s inside the region and 0 outside.\n\
    2. Sample a 4-layer network (1\u21922\u21922\u21922\u21921 channels). Draw each\
    \ layer's kernel size independently from {1, 3}. Use N(0, 1) weights plus an N(0,\
    \ 1) shift per output channel, with LeakyReLU after layers 1\u20133.\n3. Share\
    \ the network across the acquisition's triplets. Filter each slice channel separately\
    \ (in_channels = 1).\n4. Blend m = \u03B1\xB7g(z) + (1 \u2212 \u03B1)\xB7z, with\
    \ \u03B1 ~ U(0, 0.5).\n5. Rescale m so its Frobenius norm over the region equals\
    \ that of z.\n6. Map back with x' = m\xB7s + \u03BC, clamp to [0, 1], zero outside\
    \ the region, and fold that region into the background mask.\n\nPlacement is unchanged:\
    \ after intensity, before noise.\n\nMeasured with these settings on CPU:\n- 0%\
    \ blackouts and \u22640.7% unchanged.\n- 8.7% of pixels clipped.\n- 10% of acquisitions\
    \ inverted (Spearman < 0).\n- Median Spearman 0.97.\n- Mean |\u0394| 0.114."
  precedents:
  - "Ouyang et al., arXiv:2111.12525. The code (models/imagefilter.py) adds shift\
    \ = randn(out_channel) after every conv, draws the kernel size per block from\
    \ [1, 3], uses \u03B1 ~ U(0, 1) and a Frobenius rescale. Its MR inputs are z-scored\
    \ per image ((x \u2212 mean)/std, dataloaders/abd_dataset_utils.py). GIN alone:\
    \ prostate 56.6 \u2192 65.1, cardiac 76.0 \u2192 83.8; depth 4 was best."
  - "GIN v3 (gin-intensity-augmentation-v3-20260926T074639Z-0d98d2fa): +0.0013, 80%\
    \ [\u22120.0012, +0.0038], soft \u22120.0016. ACL \u22120.010, Medial OA +0.010,\
    \ Baker's +0.010, fluid labels flat or slightly negative. Logged effective p 0.30\
    \ and |\u0394| 0.060\u20130.066."
  - "Audit (jobs/researcher-20260926T085330Z-107f085f/scratch/gin/README.md). v3:\
    \ 49\u201351% of acquisitions unchanged, 3.3\u20135.2% blacked out, 22\u201324%\
    \ of pixels clipped on 3\xD73 draws, median Spearman 0.83. The reference: no blackouts,\
    \ 8.5\u20138.7% clipped, 10% inverted. v3's CPU |\u0394| of 0.065\u20130.068 matches\
    \ its logs."
  - "Precedent table: contrast 0.8\u20131.2 lost \u22120.0033/\u22120.0067 and gamma\
    \ 0.7\u20131.3 lost \u22120.0007. A wider global monotone rescale is not the lever;\
    \ a local non-linear remap is the untested shape."
  - 'Adopted DSU (+0.0022) and closed intra-study contrast mixing (+0.0015): style
    and contrast variation has been mildly positive in this campaign.'
  novelty: 'The first faithful GIN in the project. v3 tested a different operator:
    half no-op, and half clipped random edge filtering with occasional whole-acquisition
    blackouts. The random shifts on zero-mean input produce the non-monotone, spatially
    local intensity curves the seed described. Gamma and contrast jitter and the adopted
    smoothing cannot produce these.'
  coverage: "Every plane and contrast, about 30% of acquisitions per epoch, and all\
    \ labels. The audit's inversion rate is 11% for non-fat-suppressed and 9\u2013\
    10% for fat-suppressed types, so fluid-sensitive series are not singled out."
  exploitation: If adopted, GIN becomes the second adopted image family, which enables
    the campaign's one-of composition with bilateral smoothing. IPA, a spatially varying
    blend of two GIN draws under a low-frequency random map, then becomes the family's
    next step. If rejected, this is the family's second rejected follow-up and the
    family closes.
  budget: "The grouped convolutions are the same as in v3, plus per-acquisition index_add\
    \ sums for \u03BC, s and the norms. v3 ran 1,826 s of training plus 49 s of prediction\
    \ (the incumbent: 1,799 + 49) against the 2,027 s limit. Expect about 1,830 s.\
    \ No extra forward pass and no trained parameters."
  implementation: "Builds on the incumbent (DSU source). It reuses v3's plumbing:\
    \ GinAugmentationConfig, the model.py enablement gate and filter_rects, the placement\
    \ after intensity, the lightning.py logging and the valid-mask handling. It replaces\
    \ v3's sample_gin_parameters and apply_gin_filter:\n- Add per-layer N(0, 1) shift\
    \ tensors of shape (series, out_channels).\n- Draw the kernel size per layer,\
    \ not per network (keep the ring-masked 3\xD73 implementation).\n- Standardize\
    \ and de-standardize per acquisition over the geometric valid region, and do the\
    \ Frobenius rescale on the standardized values.\n\nConfig: data.gin_augmentation.probability\
    \ 0.3 and blend_max 0.5, unchanged, with no new fields. When p = 0, draw nothing.\n\
    \nAdd three logs:\n- gin_unchanged_share: selected acquisitions with max |\u0394\
    | < 1e-3.\n- gin_clipped_fraction.\n- gin_inverted_share: negative input/output\
    \ Pearson correlation over the region.\n\nA run with gin_unchanged_share > 0.05\
    \ or any blackout is invalid.\n\nRetain smoothing, DSU and all existing families\
    \ unchanged. If noise-referenced smoothing is adopted first, implement on that\
    \ incumbent; the two are independent."
  open_choices: None. Depth, width, p and blend_max keep the seed's values. Shifts
    and per-layer kernel draws follow the reference code. The statistics region is
    the geometric valid region, the campaign's filtering rule and the analogue of
    the reference's whole-image z-score. The ~8.7% of pixels clamped at 0 after de-standardization
    is logged, not tuned.
  dependencies:
  - bilateral-smoothing-augmentation
  - dsu-feature-statistics
  priority_rationale: "This is the only open line. The defect is diagnosed and measured,\
    \ and the fix is a correctness change, not a strength change. v3 came out positive\
    \ (+0.0013) while about half idle. The seed's isolated evidence is the strongest\
    \ of any MRI augmentation found. It is cheap and the family's last attempt.\n\n\
    The risk is real: the fix doubles the changed-acquisition rate and raises |\u0394\
    | to 0.114, and wider intensity jitter has lost before."
  status: blocked
  created_revision: 372
  ranking_rationale: "I admitted gin-reference-faithful-networks. proposal_admission\
    \ reports both of its dependencies satisfied: bilateral-smoothing-augmentation\
    \ and dsu-feature-statistics are provisional_accept and active.\n\nIt is the family's\
    \ recorded retry. The family_ledger verdict is retry, and its next_step names\
    \ this idea. It is not a repeat of a measured run. v3 (gin-intensity-augmentation-v3-20260926T074639Z-0d98d2fa)\
    \ ran a different operator. It had no bias terms and ran on nonnegative inputs,\
    \ so every 1\xD71 draw was either a no-op or a blackout. The researcher's audit\
    \ reproduces this with v3's own functions on real fold-2 acquisitions: 49\u2013\
    51% of selected acquisitions were unchanged and 3.3\u20135.2% were blacked out.\
    \ The audit's CPU mean |\u0394| of 0.065\u20130.068 matches v3's logged 0.060\u2013\
    0.066, which validates it.\n\nThe fix adds per-layer shifts, per-layer kernel-size\
    \ draws and per-acquisition standardization. These follow the reference code and\
    \ are corrections to the seed's mechanism, not a new strength. p (0.3) and blend_max\
    \ (0.5) keep the seed's values.\n\nA grep of docs/validation/results and docs/history\
    \ for GIN found only incidental word matches, so there is no earlier project run\
    \ of a faithful GIN.\n\nThe queue was empty, so this idea is now its only entry.\
    \ The one other active line, noise-referenced-bilateral-smoothing, is already\
    \ running."
  experiments:
  - gin-reference-faithful-networks-20260926T090646Z-aca7e8e1
