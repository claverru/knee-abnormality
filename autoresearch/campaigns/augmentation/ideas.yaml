- id: gin-intensity-augmentation
  mechanism_id: global-intensity-nonlinear-augmentation
  parent_idea_id: null
  title: Remap each acquisition's intensities through a freshly sampled random shallow
    conv net (GIN), blended with the original
  opportunity: 'Seven vendors and 46 machine models, 19% of T1/PD-slot series that
    are T2 without fat suppression, 129 T1-FS series with non-FS flags and 130 flat
    near-PD GE zero-TE sagittals: the contrast varies inside a slot far beyond what
    global gamma/contrast jitter models. Broader gamma/contrast lost (contrast 0.8-1.2
    -0.0033 and -0.0067), so the lever is a different shape of variation, not more
    of the same.'
  mechanism: 'For each augmented acquisition sample one network g: 4 conv layers,
    2 hidden channels, one input and one output channel, kernel size 1 or 3 drawn
    per network, weights N(0, 1), LeakyReLU between layers. Apply g with shared weights
    to each of the three slice channels separately (in_channels = 1), blend x'' =
    a*g(x) + (1 - a)*x with a ~ U(0, 0.5), rescale x'' so its Frobenius norm over
    the acquisition''s valid pixels equals the input''s, clamp to [0, 1] and restore
    padding. Probability 0.3 per acquisition. Runs after gamma/contrast and before
    noise.'
  precedents:
  - 'Ouyang et al., Causality-inspired single-source domain generalization (arXiv:2111.12525):
    GIN alone, on top of affine, elastic, brightness, contrast, gamma and noise, raised
    cross-centre prostate MRI Dice 56.6 -> 65.1 and cardiac bSSFP -> LGE 76.0 -> 83.8;
    2/4/8/16 layers gave 84.3/86.0/85.7/79.2. Segmentation, not classification.'
  - Broader contrast 0.80-1.20 lost -0.0033/-0.0067 and gamma 0.70-1.30 -0.0007 (docs/validation/results/2026-09-20-overnight-hyperparameter-results.md).
  novelty: First non-monotonic, spatially local intensity remapping in this project;
    existing intensity augmentation is a global gamma and a global contrast.
  coverage: Every plane and contrast; all labels.
  exploitation: If it helps, a monotone Bezier variant tests whether contrast inversion
    matters; if it hurts fluid-sensitive labels, that variant is the retry.
  budget: Grouped 1x1/3x3 convolutions on augmented acquisitions; negligible GPU time,
    no parameters trained.
  implementation: Adds a family under data.gin_augmentation (probability 0.3, blend_max
    0.5, layers 4, hidden_channels 2) in config.py and modeling/augmentation.py; retains
    every existing family and draw.
  open_choices: None; depth, width, blend range and probability are fixed from the
    paper's best depth and a mild blend.
  dependencies: []
  priority_rationale: The best isolated evidence found for any new MRI augmentation,
    and it targets the contrast heterogeneity measured in this data.
  status: blocked
  created_revision: 0
  seeded: /home/claudio/src/knee-abnormality/autoresearch/campaigns/augmentation/seed-ideas.yaml
  experiments:
  - gin-intensity-augmentation-20260925T214925Z-2f257b0e
  - gin-intensity-augmentation-20260925T215651Z-742fdbb7
  blocked_reason: 'The launch gate failed before training. The generated experiment
    config has a top-level `overrides: {}` field that the schema rejects; the candidate''s
    source config has no such field. This does not demonstrate a GIN defect, but a
    failed gate cannot be approved. The idea has used its one bounded repair, so park
    it. The ranking lists every remaining user-ordered seed once, in its fixed order,
    to address the previous ranking rejection.'
- id: phase-axis-resolution-degradation
  mechanism_id: k-space-resolution-degradation
  parent_idea_id: null
  title: Low-pass one in-plane axis by k-space truncation to the measured range of
    coarser acquisitions
  opportunity: 'Acquired resolution against the 0.625 mm grid: finer axis p5/p50/p95
    0.33/0.49/0.70 mm, phase axis 0.45/0.625/0.885 mm (p75 0.70), GE the coarsest.
    About a quarter of series are effectively coarser than the grid along one axis
    and the rest sharper, so the model sees a sharpness mix it is never trained to
    be invariant to.'
  mechanism: 'For each augmented acquisition pick one in-plane axis (rows or columns,
    equal odds) and a keep fraction f ~ U(0.70, 1.0). FFT each slice channel, zero
    the frequencies beyond f times Nyquist along that axis only, inverse FFT, take
    the real part, clamp to [0, 1] and restore padding. This reproduces a coarser
    phase-encoding matrix, including its Gibbs ringing: f = 0.70 is an effective 0.89
    mm, the measured p95. Probability 0.25; never both axes. Runs after affine and
    before gamma/contrast, inside the geometric valid region.'
  precedents:
  - 'nnU-Net trainer: simulated low resolution is a standard recipe component, not
    isolated (github.com/MIC-DKFZ/nnUNet, nnUNetTrainer.py).'
  - 'Acquired-resolution distributions: outputs/analysis/input-resolution-research-20260915/acquisition/distributions_train.csv;
    docs/research/input-resolution.md.'
  - 'Training and evaluating at 0.875 mm cost -0.0228, lateral meniscus -0.106 (docs/validation/results/2026-09-16-learned-zoom-result.md):
    the range stays inside the measured one.'
  novelty: First resolution augmentation here, one axis at a time, bounded by the
    measured acquisition distribution.
  coverage: Every acquisition; resolution-sensitive labels (menisci, ligaments) are
    the ones to watch.
  exploitation: If it helps, an acquisition-aware variant could degrade only along
    the stored phase direction; if detail labels drop, a narrower range is not a retry
    (no sweeps), a different degradation model is.
  budget: Two 224x224 FFTs per augmented slice channel; negligible.
  implementation: Adds data.resolution_augmentation (probability 0.25, keep_fraction_range
    [0.70, 1.0]) in config.py and modeling/augmentation.py; retains every existing
    family.
  open_choices: None.
  dependencies: []
  priority_rationale: The data mismatch is measured and the transform is physically
    faithful and cheap.
  status: completed
  created_revision: 0
  seeded: /home/claudio/src/knee-abnormality/autoresearch/campaigns/augmentation/seed-ideas.yaml
  ranking_rationale: Admit the user-requested GIN rerun behind every remaining ordered
