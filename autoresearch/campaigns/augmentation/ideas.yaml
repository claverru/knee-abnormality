- id: correlated-style-uncertainty
  mechanism_id: feature-statistics-uncertainty
  parent_idea_id: dsu-feature-statistics
  title: 'Correlated DSU: draw each acquisition''s stride-8 feature-statistic perturbation
    from a running per-type channel covariance (CSU) instead of independent channels'
  opportunity: "DSU is the only mechanism in this campaign that gained at two seeds:\
    \ +0.0022 on top of smoothing (seed 1704794368, soft AUC +0.0043) and +0.0012\
    \ without smoothing (seed 2464012069). Its sampler perturbs each of the 122 stride-8\
    \ channels independently. The spread comes from about six same-type acquisitions\
    \ per batch (34.5 acquisitions per step across six types).\n\nThis has two weaknesses:\n\
    - Real scanner and protocol shifts move many channels together, so independent\
    \ draws create combinations of statistics that no acquisition has.\n- A spread\
    \ estimated from six samples makes the per-step strength itself noisy.\n\nThe\
    \ per-label and vendor patterns of the two DSU runs disagree (PF OA +0.022 vs\
    \ \u22120.003; GE \u22120.009 vs +0.002), so the gain looks like diffuse regularization.\
    \ Making the perturbation realistic at unchanged strength is the lever left that\
    \ is not a sweep."
  mechanism: "Everything except the sampler stays as in the incumbent:\n- the site\
    \ (after rexnet_200 features[:5]: 122 channels at 28\xD728);\n- each acquisition's\
    \ channel mean \u03BC and std \u03C3 over its triplets and positions;\n- the plane/contrast\
    \ grouping;\n- probability 0.5;\n- the eligibility rule (the type has at least\
    \ two acquisitions in the batch).\n\nFor each type, keep running covariances \u03A3\
    _\u03BC and \u03A3_\u03C3 (122\xD7122) of the acquisition statistics around the\
    \ type mean. Each step, compute the batch's divide-by-n covariance S from detached\
    \ statistics; its diagonal is what DSU uses. Update \u03A3 \u2190 0.99\xB7\u03A3\
    \ + 0.01\xB7S; the first batch initializes \u03A3.\n\nPerturb with CSU's symmetric\
    \ square root. Take the eigendecomposition of the running \u03A3, clamp eigenvalues\
    \ at 0 and form P = Q\u039B^\xBDQ\u1D40. Then \u03B4_\u03BC = \u03B5_\u03BC\xB7\
    P_\u03BC, \u03B4_\u03C3 = \u03B5_\u03C3\xB7P_\u03C3, \u03BC' = \u03BC + \u03B4\
    _\u03BC and \u03C3' = \u03C3 + \u03B4_\u03C3, and the acquisition's features are\
    \ re-normalized to (\u03BC', \u03C3') as now.\n\nThe \u03B5 values are the incumbent's\
    \ own draws, with the same shapes and order. So the random stream, the selected\
    \ acquisitions and the expected per-channel variance all match DSU; only the cross-channel\
    \ correlation and the stability of the estimate change.\n\nMomentum 0.99 averages\
    \ about 100 steps, roughly 580 acquisitions per type. It is the smallest round\
    \ value whose effective sample exceeds the 122 channels, so \u03A3 is full rank\
    \ after warm-up."
