  title: 'Stack the three strongest near-miss augmentations on the incumbent: intra-study
    contrast mixing, GIN v3 and one-axis resolution degradation'
  opportunity: 13 of 15 campaign results were positive (mean +0.0009) against three
    different controls, but each single mechanism sat near the +0.001 threshold and
    inside seed noise. The user ordered two stacking runs to test whether the small
    gains add. This is the half dose; the full stack follows.
  mechanism: 'On the current incumbent (bilateral smoothing + DSU, both kept), enable
    three mechanisms together at exactly their measured settings: intra-study contrast
    mixing (probability 0.3 per plane with both contrasts, target weight U(0.5, 1.0)),
    GIN v3 (probability 0.3, blend up to 0.5, 4 layers, 2 hidden channels, kernel
    1 or 3, one network per acquisition, mask built per slice as geometric_valid_mask
    does), and one-axis k-space resolution degradation (probability 0.25, keep 70-100%
    of frequencies along one random in-plane axis). No strength changes.'
  precedents:
