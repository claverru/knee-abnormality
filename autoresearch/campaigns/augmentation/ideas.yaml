- id: token-feature-mixup
  mechanism_id: token-feature-mixup
  parent_idea_id: null
  title: 'MixUp variant B: mix projected token features of matched triplets before
    position embeddings, mil_norm and attention'
  opportunity: Manifold MixUp on sequence embeddings was part of the RSNA 2024 lumbar
    2nd-place solution. Here the nonlinear steps come before pooling (mil_norm, attention
    softmax, OA detector log-sum-exp), so mixing tokens is the manifold version that
    still passes through them.
  mechanism: Same pairing, slot matching, lambda, main loss and mixed auxiliary losses
    as variant C (aligned-image-mixup). Instead of images, mix the projection output
    of each matched triplet, token by token, before the position, plane and contrast
    embeddings are added; mix only tokens visually valid in both triplets and keep
    a's features elsewhere. Study a's positions, geometry, embeddings and masks are
    then added as usual.
  precedents:
  - 'RSNA 2024 lumbar 2nd place: manifold MixUp on sequence embeddings (github.com/brendanartley/RSNA-2024-Competition);
    not isolated.'
  - 'Verma et al., Manifold Mixup (arXiv:1806.05236): mixing hidden states regularizes
    beyond input MixUp on natural images.'
  novelty: Token-level MixUp through the anatomical attention; the backbone sees clean
    images.
  coverage: 30% of training studies per batch; all labels.
  exploitation: Compared with C and A, it locates where mixing helps.
  budget: No extra forward pass.
  implementation: Adds trainer.token_mixup (fraction 0.3, beta_alpha 1.0) in config.py,
    mixing in modeling/model.py after the projection, and the shared loss in training/lightning.py;
    logs as C.
  open_choices: None.
  dependencies: []
  priority_rationale: Second variant; keeps the backbone input clean while mixing
