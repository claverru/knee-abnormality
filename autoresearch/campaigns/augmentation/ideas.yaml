- id: dsu-feature-statistics
  mechanism_id: feature-statistics-uncertainty
  parent_idea_id: null
  title: Resample per-acquisition feature-channel means and standard deviations at
    one ReXNet stage (DSU)
  opportunity: 'Channel statistics of CNN features mostly encode style (scanner, contrast,
    texture). The feature-level counterpart of seed 1: perturbing them may reduce
    reliance on acquisition style.'
  mechanism: At the output of the last ReXNet block at stride 8, compute each acquisition's
    per-channel mean and standard deviation over its triplets and spatial positions.
    Estimate the spread of those statistics across the batch's acquisitions of the
    same plane/contrast type (skip types with fewer than two acquisitions), draw new
    statistics mu' = mu + e1*spread_mu and sigma' = sigma + e2*spread_sigma with e
    ~ N(0, 1) per acquisition and channel, and re-normalize that acquisition's features
    to them. Probability 0.5 per acquisition, training only.
