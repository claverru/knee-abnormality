- id: study-coherent-feature-statistics
  mechanism_id: feature-statistics-uncertainty
  parent_idea_id: dsu-feature-statistics
  title: 'Study-coherent DSU: all perturbed acquisitions of a study share one standard-normal
    direction, scaled by each type''s own spread'
  opportunity: 'In this data, style is set per study: one scanner, coil and reconstruction
    chain acquires every series of an exam, across 7 vendors and 46 machine models
    in training.


    DSU draws an independent direction per acquisition, so a study''s perturbed acquisitions
    disagree in style. Attention pooling over the study''s ~4.3 acquisitions and 26
    triplets can then down-weight or average out the odd acquisition. It never has
    to become invariant to a study-wide style change, which is what a new scanner
    produces at test time.


    DSU''s gain is replicated but diffuse. The vendor strata of its two runs disagree,
    so study-level style invariance has not been shown yet.'
  mechanism: "Keep the incumbent DSU exactly as it is:\n- the site after features[:5];\n\
    - per-acquisition statistics;\n- per-type batch-diagonal spreads;\n- per-acquisition\
    \ selection at 0.5;\n- the two-per-type eligibility rule.\n\nDraw the selection\
    \ and \u03B5_\u03BC, \u03B5_\u03C3 with the incumbent's shapes and order. Then\
    \ give every acquisition the \u03B5 of its study's first acquisition in batch\
    \ order: \u03BC'_a = \u03BC_a + \u03B5_\u03BC,s \u2299 spread_\u03BC(type_a) and\
    \ \u03C3'_a = \u03C3_a + \u03B5_\u03C3,s \u2299 spread_\u03C3(type_a).\n\nThe\
    \ per-acquisition marginal, the selected set and the random stream are unchanged.\
    \ Only the correlation of directions between a study's perturbed acquisitions\
    \ changes, from 0 to 1. At 4.3 acquisitions per study and p 0.5, about 70% of\
    \ studies have two or more perturbed acquisitions, so the change reaches most\
    \ studies."
  precedents:
  - "dsu-feature-statistics runs (details under correlated-style-uncertainty): the\
    \ macro gain replicated, but the vendor strata disagree between runs. GE \u2212\
    0.0087 vs +0.0018, Siemens +0.0069 vs +0.0010, Toshiba (33 studies) \u22120.0106\
    \ vs +0.0039 (comparison.json strata)."
  - 'Data facts in augmentation-campaign.md: 4,407 training studies from 7 vendors
    and 46 machine models. A study is one exam on one scanner, so real style shifts
    are study-wide.'
  - 'Every existing family draws per acquisition independently: sample_augmentation_parameters,
    sample_smoothing_parameters and apply_feature_statistics_augmentation in modeling/augmentation.py.'
  - Incumbent logs show about 15,200 acquisitions for 3,520 studies per epoch after
    series dropout 0.2, i.e. about 4.3 acquisitions per study.
  novelty: This is the first study-coherent draw of any augmentation here. Every existing
    family (affine, intensity, noise, smoothing, DSU) samples each acquisition independently.
  coverage: About 50% of acquisitions per step, in all planes and contrasts, affecting
    all labels. The coherence acts in about 70% of studies.
  exploitation: "If it helps, compose it with correlated-style-uncertainty by sharing\
    \ the standard-normal \u03B5 per study and mapping it through each type's covariance\
    \ root. A vendor-stratum comparison of the result then tests the scanner-invariance\
    \ premise."
  budget: One index_select per step. No extra draws, forward passes or parameters,
    so runtime matches the incumbent's 1,848 s.
  implementation: "Changes only how the noise is shared inside the incumbent's apply_feature_statistics_augmentation.\n\
    \n**Retains:**\n- the site, probability, selection, eligibility, per-type batch-diagonal\
    \ spreads, re-normalization and activity logging;\n- bilateral smoothing and every\
    \ image family.\n\n**Changes:**\n1. Pass the study index of each triplet (token_study,\
    \ already computed in encode_batch) into the function, alongside acquisition_index\
    \ and token_type.\n2. Draw rand(group_count) and the two randn(group_count, 122)\
    \ exactly as now.\n3. Build a per-acquisition map to the first acquisition of\
    \ the same study in batch order, and index both \u03B5 tensors through it before\
    \ scaling by the spreads.\n\n**Config:** no change. The existing model.feature_statistics_augmentation.probability\
    \ of 0.5 applies. The independent-direction behavior is replaced, not kept as\
    \ an option.\n\n**Logging:** each epoch, add the number of studies with two or\
    \ more perturbed acquisitions and their share of the perturbed acquisitions.\n\
    \nIf correlated-style-uncertainty is adopted first, share its standard-normal\
    \ \u03B5 per study the same way and map it through each type's covariance root.\
    \ Keep any newly adopted incumbent unchanged."
  open_choices: "None. The study's first acquisition supplies the representative \u03B5\
    \ only so that the random stream stays identical."
  dependencies:
  - dsu-feature-statistics
  priority_rationale: Second. It costs nothing and makes one clean change to the replicated
    mechanism. However, the premise is a hypothesis without published precedent. Coherent
    directions also add up in the pooled study features, so a perturbed study shifts
    more as a whole, which could cost detail labels.
