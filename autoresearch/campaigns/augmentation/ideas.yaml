  - 'gin-intensity-augmentation-v3: +0.0013 vs smoothing + DSU; code in outputs/autoresearch/augmentation/experiments/gin-intensity-augmentation-v3-20260926T074639Z-0d98d2fa/changes.diff'
  - 'phase-axis-resolution-degradation: +0.0012 vs the original control; code in outputs/autoresearch/augmentation/experiments/phase-axis-resolution-degradation-20260925T221420Z-c259dc97/changes.diff'
  novelty: First combination of augmentation families in this campaign; tests whether
    near-threshold gains stack.
  coverage: Every study; all labels.
  exploitation: The full stack adds channel reversal and stochastic depth; the pair
    reads as a dose response.
  budget: About +65 s of training over the incumbent (measured overheads 25, 27 and
    13 s), about 1,930 s total against the 2,027 s ceiling.
  implementation: Port each mechanism from its changes.diff onto the incumbent source,
